slug: wgronalds
title: WgRonalds
tagline: Survive a fast-food job application full of ever-stranger HR rules.
description: >-
  WgRonalds is a puzzle game set inside a fast-food job application. You apply
  for a crew position, and the process hands you a series of forms and
  requirements to satisfy. Each round adds to the pile of policies, so a run
  comes down to following the growing list correctly without slipping up.


  The humor comes from the rules themselves: familiar HR and workplace policies
  exaggerated well past reason, yet phrased in calm, courteous corporate
  language. The escalating rule structure drives the challenge, since every new
  condition has to be kept in mind alongside the old ones. Whether you get hired
  is left uncertain.


  It was a Vibe Jam 2026 entry, and the creator lists Claude Code among the
  tools used. The game is playable on mobile as well as desktop and is
  single-player.
