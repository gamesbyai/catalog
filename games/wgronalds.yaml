slug: wgronalds
title: WgRonalds
tagline: Survive a fast-food job application full of ever-stranger HR rules.
description: >-
  WgRonalds turns a fast-food job application into a single-player puzzle game.
  You apply for a crew position, and the process hands you form after form and
  requirement after requirement, with every round adding to the pile of
  ever-stranger policies you have to follow.


  The rules are the joke: familiar HR and workplace policies exaggerated well
  past reason, yet phrased in calm, courteous corporate language. Claude Code is
  what the creator used, the game works on a phone, and its Vibe Jam 2026 finish
  was 423rd of 945.


  The escalating rules drive the difficulty, since every new condition has to be
  kept in mind alongside the old ones, so a run comes down to following the
  growing list without slipping up. Whether you get hired at the end is left
  uncertain.
