slug: wgronalds
title: WgRonalds
tagline: Survive a fast-food job application full of ever-stranger HR rules.
description: >-
  WgRonalds turns a fast-food crew job application into a puzzle, and you fill
  it out step by step. The form won't let you continue until every requirement
  is checked.


  Escalating rules across twelve application steps. Politely worded red HR
  notices for whatever the form still needs. Your full name as the opening step.


  acetaminofenol explains the idea this way. "Every absurd HR policy you've ever
  seen, but turned up to 11 and wrapped in polite corporate language," the
  creator writes.
