slug: wgronalds
title: WgRonalds
tagline: Survive a fast-food job application full of ever-stranger HR rules.
description: >-
  WgRonalds turns a fast-food crew application into a puzzle. The first step
  asks for your full name. The form won't let you continue until every
  requirement is checked.


  The application runs twelve steps. A red HR notice tells you in polite wording
  what the form still needs, such as entering your name.


  The creator built it to take escalating-rules chaos and apply it to a
  fast-food job application, with absurd HR policies written in courteous
  corporate language.
