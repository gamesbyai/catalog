slug: pyramid-wars
title: Pyramid Wars
tagline: Click to command pixel-art armies and collect booster packs across ten
  battlefields.
description: >-
  Pyramid Wars is a pixel-art clicker strategy game played across ten
  battlefields. Each battle has you clicking to build up your forces and pushing
  against the enemy, while deciding which units and abilities to bring into the
  fight. Progress moves you from one battlefield to the next.


  Its card system sets it apart from a plain clicker. Booster packs hold unit
  cards and ability cards, so your army changes as you open new packs and choose
  what to field. That gives the clicking a layer of collecting and planning, and
  each of the ten battlefields becomes a chance to try a different mix.


  The game won AI Browser Game Jam 3. According to the listing, it was built
  with Claude Opus, and the project sits in a collection of CC0 games.
