slug: leviathan
title: Leviathan
tagline: Play a vengeful whale smashing whaling ships and snapping harpoon lines.
description: >-
  Leviathan puts you in the body of the whale in a reverse Moby-Dick hunt. You
  rise from the dark water to smash whaling ships, snap harpoon lines, and free
  other whales before the hunters close in. The tagline reads, "Take your
  revenge on the whalers."


  The screen shows a whale health bar and an air bar at the top right. A score,
  a timer, and a ships-sunk count sit at the bottom left. Along the bottom are
  key prompts for WASD, Shift, Space, and F, each paired with an icon of a
  diving, rising, or splashing whale.


  The game opens from the other side. You row a small lantern-lit boat past a
  large wooden ship while a line of text warns that something is moving in the
  deeps and tells you to row for open water. The fog and dark sea set the mood
  for the hunt. The creator cites the imagery of Moby-Dick as the inspiration.
