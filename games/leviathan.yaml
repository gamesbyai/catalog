slug: leviathan
title: Leviathan
tagline: Play a vengeful whale smashing whaling ships and snapping harpoon lines.
description: >-
  Leviathan turns Moby-Dick around: you play the whale. You rise from the black
  deep to attack the whaling fleets, ramming their ships, snapping harpoon lines
  and freeing the whales that have been caught. It is a single-player action
  game built in Three.js.


  The creator says the imagery of Moby-Dick inspired the whole concept, and the
  setting leans on it: a vast, unknowable creature, a doomed hunt and fragile
  ships pushing into fog. Codex was used to build it, and it placed 33rd of 945
  at Vibe Jam 2026.


  Playing the hunted animal instead of the hunter gives the game a revenge-story
  tone. It is a race against the hunters, who close in on you as you work your
  way through the fleet, ship by ship.
