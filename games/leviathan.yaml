slug: leviathan
title: Leviathan
tagline: Play a vengeful whale smashing whaling ships and snapping harpoon lines.
description: >-
  You play the whale in Leviathan, rising out of the dark water to smash whaling
  ships and snap the harpoon lines that hold your own kind. It flips Moby-Dick
  around, so the hunters are the ones pushing nervously through fog.


  Your goal is to wreck the fleet and free the captured whales before the
  hunters close in. A panel tracks your score, the time and how many ships
  you've sunk, so you can see the wreckage add up.


  Two bars sit in the corner, one for your whale's health and one for your air,
  which matters because you're a mammal in a sea full of people who want you
  dead.


  The game opens on a small rowboat beside a ship's hull, with a line telling
  the crew that something is moving in the deeps.


  The creator took the look from Moby-Dick's imagery: a vast whale nobody can
  fully know, a hunt that's doomed, and fragile ships crossing gray water.
