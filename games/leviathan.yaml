slug: leviathan
title: Leviathan
tagline: Play a vengeful whale smashing whaling ships and snapping harpoon lines.
description: >-
  Leviathan turns the Moby-Dick hunt around and has you play the whale, rising
  from the deep. The opening has you rowing a small boat past a large wooden
  ship. Your jobs must finish before the hunters move in on you.


  Whaling fleets to smash and harpoon lines to snap. Other whales to free.
  Health and air for the whale.


  Dive, rise and splash using WASD, Shift, Space and F. Surface to breathe
  between attacks. Row for open water when something stirs in the deeps.


  According to baumant, the imagery of Moby-Dick is the inspiration.
