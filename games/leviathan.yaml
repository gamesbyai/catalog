slug: leviathan
title: Leviathan
tagline: Play a vengeful whale smashing whaling ships and snapping harpoon lines.
description: >-
  Leviathan turns the Moby-Dick hunt around and puts you in the whale's body.
  You come up out of the deep to wreck whaling ships.


  Your jobs are to smash the fleets, snap their harpoon lines and free the other
  whales, all before the hunters close in on you. Your whale has health and air.
  Your whale has to come up to breathe between attacks.


  The controls are WASD, Shift, Space and F. The keys cover diving, rising and
  splashing.


  The game doesn't start you as the whale at all; you're rowing a little boat
  past a big wooden ship.


  Something is moving in the deeps, and you'd better row for open water. baumant
  points to the imagery of Moby-Dick as the inspiration.
