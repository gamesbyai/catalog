slug: wenware
title: WenWare
tagline: Guess the place and year of a 360-degree historical scene.
description: >-
  Each round drops you into a 360-degree scene from history, and you have to
  guess where and when you are.


  Architecture, technology, and everyday details as clues to era and region.
  Detective-style puzzles in every scene. Multiplayer mode.


  Look around at the buildings, clothing, and surroundings. Then place a pin on
  the map and commit to a year.


  underpaid_mom describes the appeal as using AI to explore moments in history.
