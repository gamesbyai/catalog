slug: wenware
title: WenWare
tagline: Guess the place and year of a 360-degree historical scene.
description: >-
  WenWare is a geography guessing game with a time machine attached. Each round
  drops you into a 360-degree scene from history. You look around at the
  buildings, clothing, and surroundings, then commit to two answers: where you
  are standing and what year it is.


  It placed third of 945 in Vibe Jam 2026 and won the Most Played award from
  Bolt. It supports multiplayer, and the creator describes the appeal as using
  AI to explore moments in history.


  The date is what makes it different. A pin on the map is only half the job, so
  architecture, technology, and everyday details become clues about the era as
  well as the region, and each scene turns into a small detective puzzle.
