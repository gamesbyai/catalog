slug: the-far-colony
title: The Far Colony
tagline: Grow an alien organism across the Moon while human machines try to burn it out.
description: >-
  Control an alien organism that grows from a damaged seed across the lunar dust
  while human machines try to burn it out.


  Organs grown as you expand. Colonization of the Moon told from the alien side.
  Growth against defense in every run. Humans as the threat.


  The creator wanted to try making a strategy game, and to see colonization
  through alien eyes.
