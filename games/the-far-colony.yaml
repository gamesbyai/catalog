slug: the-far-colony
title: The Far Colony
tagline: Grow an alien organism across the Moon while human machines try to burn it out.
description: >-
  The Far Colony is a strategy simulation played from the alien side of a lunar
  settlement. You control an organism that starts from a damaged seed and
  spreads across the dust, growing organs as it expands. Human machines are
  working to burn it out, so each run is a contest between growth and defense.


  The premise flips the usual moon colonization story. Instead of managing human
  outposts, you tend something invasive and living, and the humans become the
  threat. The creator had wanted to try making a strategy game, and a separate
  jam with an alien theme prompted the idea of seeing colonization through alien
  eyes.


  It was made for Vibe Jam 2026, where it ranked 49th among 945 entries. It runs
  in 3D with Three.js, and the creator built it with Codex.
