slug: the-far-colony
title: The Far Colony
tagline: Grow an alien organism across the Moon while human machines try to burn it out.
description: >-
  The Far Colony is a strategy simulation that tells the moon colonization story
  from the other side. You control an alien organism that starts from a damaged
  seed and spreads across the lunar dust, growing organs as it expands, while
  human machines work to burn it out.


  The creator had wanted to try making a strategy game, and a separate jam with
  an alien theme prompted the idea of seeing colonization through alien eyes. It
  was coded with Codex and rendered in 3D with Three.js, and it ranked 49th of
  945 in Vibe Jam 2026.


  Instead of managing human outposts, you tend something invasive and living,
  and the humans become the threat. A run is a contest between growth and
  defense: keep growing, and keep the machines from burning you out.
