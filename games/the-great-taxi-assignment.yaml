slug: the-great-taxi-assignment
title: The Great Taxi Assignment
tagline: Drive a taxi through a 3D city, delivering passengers before the clock
  runs out.
description: >-
  When it loads, you're looking at a dim, sunset-colored street lined with
  pixel-art palm trees, with a speedometer in the corner and a little round map
  on the right. A welcome card sits over all of it, and you press Start playing
  to get going.


  Music and sound effects each have a checkbox on that card, so you can switch
  either off before you begin.


  You drive a taxi around Vibe City looking for passengers. Once someone's in
  the car, you take them to the destination marked on your map.


  There's a timer running the whole time, so the job is getting each fare there
  before it hits zero. That's what ends a run, and it's why the map matters as
  much as the wheel.


  Up in the top corner there are buttons for info, a radio, music and sound,
  which is a nice touch for a taxi.


  Tomáš Bencko made it in 60 hours, and 99 percent of the code was written by
  AI. The 2D art came from GPT-4o, the music from Suno, and the sound effects
  from ElevenLabs.
