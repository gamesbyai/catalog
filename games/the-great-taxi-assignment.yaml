slug: the-great-taxi-assignment
title: The Great Taxi Assignment
tagline: Drive a taxi through a 3D city, delivering passengers before the clock
  runs out.
description: >-
  The game opens on a welcome panel over a dusky street lined with palm trees. A
  speedometer sits in the bottom left, a circular map in the bottom right, and
  info, radio, music and sound buttons run along the top left. Checkboxes on the
  panel turn music and sound effects off before you press Start playing.


  You drive a taxi around Vibe City, a 3D city, looking for passengers to pick
  up. Each fare has a destination marked on your map, and you take them there
  before the timer runs out.


  Steering is on the keyboard, with the space bar as a brake. Tomáš Bencko built
  it in 60 hours. About 99 percent of the code was AI generated, the 2D art came
  from GPT-4o, the music from Suno and the sound effects from ElevenLabs.
