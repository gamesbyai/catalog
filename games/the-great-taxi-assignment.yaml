slug: the-great-taxi-assignment
title: The Great Taxi Assignment
tagline: Drive a taxi through a 3D city, delivering passengers before the clock
  runs out.
description: >-
  The Great Taxi Assignment is a driving game in the spirit of Grand Theft Auto,
  set in a three-dimensional city. You take the wheel of a taxi and ferry
  passengers from place to place, racing a countdown timer that limits how long
  a run can last.


  It keeps the open city driving of its inspiration but narrows the goal to a
  simple job: pick up fares and get them where they need to go, quickly, before
  the clock runs out. Three.js renders the whole city as a 3D scene in the
  browser.


  This one is single-player, and the creator says it was built with Cursor and
  Claude 3.7 Sonnet. It took part in Vibe Jam 2025 and is described as a winner
  of that event.
