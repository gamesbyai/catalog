slug: the-great-taxi-assignment
title: The Great Taxi Assignment
tagline: Drive a taxi through a 3D city, delivering passengers before the clock
  runs out.
description: >-
  In this GTA-style taxi game, you drive around a 3D city called Vibe City. Your
  job is to take each fare where they're going.


  Destinations marked on your map for each fare. A timer running on every trip.
  Passengers to pick up around the city.


  Drive with WASD or the arrow keys. Space is your brake, and the only other key
  to remember.


  Tomáš Bencko built it in 60 hours. According to the creator, about 99 percent
  of the code was AI generated. GPT-4o drew the 2D art, Suno made the music and
  ElevenLabs produced the sound effects.
