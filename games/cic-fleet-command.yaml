slug: cic-fleet-command
title: "CIC: Fleet Command"
tagline: Command a fleet in tactical space battles from a control room view
description: >-
  CIC: Fleet Command is a tactical space command simulator. The player takes the
  role of a fleet commander, directing ships in real-time-strategy style
  engagements set in space. It is a browser game with multiplayer support, so
  commanders can share the battlefield rather than play only against the
  computer.


  The creator names Mech Commander and early StarCraft custom maps as its
  inspirations, which points to a focus on squad-level tactics and
  scenario-based missions over large-scale base building. The combat information
  center theme frames the player as an officer issuing orders instead of
  piloting a single craft.


  The game was entered in Vibe Jam 2026, where it placed 233rd out of 945
  entries. It is rendered with Three.js, and the creator built it with Codex.
