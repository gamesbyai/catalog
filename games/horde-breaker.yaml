slug: horde-breaker
title: Horde Breaker
tagline: Steer a blue squad through gates and gunfire toward a boss on a desert road.
description: >-
  A blue +10 gate and a red -6 gate already sit across the road. You steer the
  blue squad down the road, keeping an eye on how many soldiers you've got.


  Blue gates like the +10 bring soldiers in while red ones like the -6 send them
  out, which is why your lane choice matters, since every soldier counts once
  you're up against the horde.


  The squad keeps firing as it goes, sending bright rounds toward the red horde
  farther along. The boss waits at the far end of the road. More gates are lined
  up along the road. You also grab coins along the way.


  You're really testing how far your squad can push through the levels. The game
  also has upgrades and progression.
