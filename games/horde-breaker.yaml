slug: horde-breaker
title: Horde Breaker
tagline: Steer a blue squad through gates and gunfire toward a boss on a desert road.
description: >-
  You lead a blue squad down a road and test how far it can push through the
  levels. Lane choice matters, since every soldier counts once you're up against
  the horde.


  Blue gates that bring soldiers in. Red gates that send soldiers out. Bright
  rounds the squad keeps firing at the red horde ahead. A boss waiting at the
  far end. More gates lined up along the road. Coins to grab along the way.
  Upgrades and progression.


  Steer through the gates. The blue +10 and red -6 gates sit across the road at
  the start. Watch how many soldiers you have.
