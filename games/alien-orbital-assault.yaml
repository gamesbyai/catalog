slug: alien-orbital-assault
title: Alien Orbital Assault
tagline: Shoot down drone escorts, crack open a boss, and spend the salvage to
  stay alive.
description: >-
  You pilot a Gaia-attuned ship in a vertical shoot-'em-up built around one long
  boss fight. The boss sits behind a ring of orbiting drones.


  Substrate, reclaimed Earth matter used as ammunition and fuel. Vulcan Cannon,
  a fast straight-firing gun you start with. Shotgun Blaster, an unlockable wide
  spread for close range. Latch Beam Projector, an unlockable lock-on weapon
  that burns. Three upgrade tiers per weapon, with an unlock order that changes
  from run to run. Harder cycles, with more and tougher drones after each missed
  window. Five lives and no continues.


  Work through the interactive tutorial. Configure the controls to suit you.
  Destroy every drone in the ring to open a brief vulnerability window, and the
  boss can't be hurt before that. Hit it hard before the window closes. Shoot
  wrecks to collect Substrate, which refills what you spend. Hunt down the
  orbiter that always carries a weapon drop. Choose between grabbing the upgrade
  first or rushing the window with a thinner supply.


  Fifth Layer Studio describes a run as one sitting, and the page lists about
  half an hour per session.
