slug: alien-orbital-assault
title: Alien Orbital Assault
tagline: Shoot down drone escorts, crack open a boss, and spend the salvage to
  stay alive.
description: >-
  You pilot a Gaia-attuned ship in a vertical shoot-'em-up that is one long boss
  fight. The boss sits behind a ring of orbiting drones and cannot be hurt until
  you destroy every one of them. That opens a short vulnerability window, so you
  hit it hard before the window closes.


  Wrecks leave Substrate, reclaimed Earth matter that works as your ammunition
  and fuel, so shooting also refills what you spend. One orbiter always carries
  a weapon drop. You choose between grabbing the upgrade first or rushing the
  window with a thinner supply.


  You start with the Vulcan Cannon, a fast, straight-firing gun. Unlockable
  weapons are the Shotgun Blaster, a wide close-range spread, and the Latch Beam
  Projector, which locks on and burns. Each weapon has three upgrade tiers, and
  the unlock order changes from run to run.


  If you miss the window, the drones return in greater numbers and tougher, so
  each failed cycle gets harder. You have five lives and no continues. The
  creator describes a run as one sitting, and the page lists about half an hour
  per session. An interactive tutorial and configurable controls are included.
