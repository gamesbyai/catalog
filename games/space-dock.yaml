slug: space-dock
title: Space Dock
tagline: Stack and balance pieces to build a structure that reaches space.
description: >-
  Your aim is to stack modules into a tower by dropping each one onto the
  structure below. Click, tap, or press Space to launch the first one. After
  that, press Space to drop each module as it hangs in place.


  Each run is a tower of 15 modules. The score goes up with each module you
  place.


  Wind pushes on the module, and a gauge shows which way it's blowing and how
  strongly.
