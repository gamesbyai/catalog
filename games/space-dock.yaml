slug: space-dock
title: Space Dock
tagline: Stack and balance pieces to build a structure that reaches space.
description: >-
  Space Dock is a stacking puzzle with one destination: space. You place pieces
  one on top of another, keep the growing structure balanced so it does not
  topple, and try to connect the build to space at the top.


  Three ideas run through this casual game at once: stacking, balance, and
  connection. Each placement carries a bit of risk, because a shaky base makes
  the later pieces harder to set down, so planning ahead matters as much as
  steady timing.


  According to the creator, it was built with Claude Code, Anthropic's coding
  assistant, on Three.js, and phones can run it too. Its Vibe Jam 2026 result
  was 507th of 945. As the tower gets taller, every run turns into a matter of
  careful placement.
