slug: space-dock
title: Space Dock
tagline: Stack and balance pieces to build a structure that reaches space.
description: >-
  Space Dock lets you build a tower of modules, setting each one on the
  structure below it.


  Runs of 15 modules each. Score that rises with each module you place. Wind
  pushing on the module. A gauge for the wind's direction and strength.


  Launch the first module by clicking, tapping, or pressing Space. Then press
  Space to drop each module from where it hangs.
