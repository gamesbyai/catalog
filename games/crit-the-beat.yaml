slug: crit-the-beat
title: Crit The Beat
tagline: Hit notes in time with the music while fighting with RPG-style combat.
description: >-
  You strike monsters by pressing S, D, K and L in sync with the music. It's
  Guitar Hero crossed with an RPG, which is the twist the creator was after
  because they've always loved Guitar Hero. The four keys are shown right on the
  title screen, so you know your inputs before you start.


  Press any of the four letters there to rebind it, which is a considerate thing
  to offer up front.


  The menu has Arcade and Settings, and it sits over a moonlit graveyard full of
  ghosts and a skeleton. A cat in a yellow jacket stands in the corner holding a
  huge weapon. It keeps muttering sarcastic remarks about how every second you
  spend on the menu is wasted, which is a funny touch.


  You can sign in with Discord or Google so your progress is tracked and your
  scores get submitted. If you'd rather skip that, you can play as a visitor,
  and all the content is open to you either way.


  It's an alpha build, so mxvdl warns that it can be buggy and that players can
  cheat. Progress might get reset at some point.
