slug: crit-the-beat
title: Crit The Beat
tagline: Hit notes in time with the music while fighting with RPG-style combat.
description: >-
  In Crit The Beat you follow the music and hit notes in time with it, while the
  fight plays out as RPG-style combat. It's a rhythm game in the Guitar Hero
  mold that pairs the timing test of a rhythm track with the progression and
  combat of an RPG. The name is a pun on critical hits, and it points right at
  that combat side.


  You play on four keys, S, D, K and L, and swapping any of them is painless,
  since you just press a new letter on the title screen. Arcade mode is the
  way in, with settings, a music toggle and a feedback button close by.


  It's set in a purple graveyard full of ghosts, where a grumpy cat in a green
  jacket grips a glowing weapon and nags you for lingering on the menu.


  Signing in with Discord or Google tracks your progress and lets you submit
  scores. You don't need an account, though, since visitors get every bit of
  content. The title screen is also refreshingly honest that this is an alpha
  build that may have bugs, that players can cheat, and that progress might get
  reset at some point.


  mxvdl says they've always loved Guitar Hero and wanted to add an RPG twist to
  it.
