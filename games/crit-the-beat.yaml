slug: crit-the-beat
title: Crit The Beat
tagline: Hit notes in time with the music while fighting with RPG-style combat.
description: >-
  Hit notes in time during fights. A Guitar Hero-style rhythm game with RPG
  progression and combat. The title puns on critical hits.


  Play on four keys, S, D, K and L, and press a new letter to swap any of them.
  Start with Arcade mode, where you can play all the content without an account.


  Discord or Google sign-in tracks progress and lets you submit scores. This
  alpha build may have bugs, players can cheat, and progress might be reset at
  some point. mxvdl says they love Guitar Hero and wanted to add RPG elements.
