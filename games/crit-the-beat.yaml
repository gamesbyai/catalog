slug: crit-the-beat
title: Crit The Beat
tagline: Hit notes in time with the music while fighting with RPG-style combat.
description: >-
  Crit The Beat is a browser rhythm game that blends note-hitting with
  role-playing ideas. Players follow the music and hit notes in time, in the
  style of Guitar Hero, while the action carries an RPG flavor suggested by the
  title's play on critical hits.


  The premise pairs two genres that rarely share a screen: the timing challenge
  of a rhythm track and the sense of progression and combat from an RPG. It is
  built with Three.js in 3D and is playable on mobile devices as well as
  desktop. It is a single-player experience.


  The creator says they always loved Guitar Hero and wanted to add an RPG twist
  to it. The project was entered in Vibe Jam 2026, and the creator used Cursor
  while making it.
