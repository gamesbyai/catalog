slug: theme-park-spooky-vibe
title: Theme Park Spooky Vibe
tagline: Build and run a spooky theme park while keeping visitors entertained.
description: >-
  Theme Park Spooky Vibe is a theme park builder with a haunted, eerie look. The
  player designs the park, places attractions, and manages the grounds so
  visitors stay entertained. It runs as a management simulation, where building
  choices shape how the park operates over time.


  The game is inspired by the 90s PC title Theme Park World, which its creator
  played as a child and considers nearly impossible to play today. The spooky
  atmosphere gives the classic park-building idea a Halloween-style twist, with
  rides and attractions that fit a ghostly setting.


  The creator built it with Claude Code as an entry in Vibe Jam 2026, using
  Three.js for the 3D graphics. It is playable on mobile as well as desktop, and
  the stated aim is to draw attention back to the park-building genre.
