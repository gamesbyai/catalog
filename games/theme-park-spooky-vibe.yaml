slug: theme-park-spooky-vibe
title: Theme Park Spooky Vibe
tagline: Build and run a spooky theme park while keeping visitors entertained.
description: >-
  In this park-building simulation, you run a spooky theme park.


  Attractions to design and build. Park grounds to manage. Visitors to keep
  entertained. Building choices that shape how the park runs over time.


  Inspired by Theme Park World, the 1990s PC game the creator played as a child.
  According to the creator, the original is now nearly impossible to play, and
  this game aims to draw attention back to the park-building genre.
