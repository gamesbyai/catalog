slug: void-surge
title: Void Surge
tagline: Steer a ship while its weapons fire on their own, then extract before
  four bosses arrive.
description: >-
  You're the only survivor on the extract pad at Station Helix-9, holding out
  until the shuttle leaves. Every weapon you carry aims and fires by itself. The
  Light Saber is always your core weapon, with room for three arms and three
  mods, and every piece ranks up to Mk 5.


  Intensity 1 to 10, one step each minute. Final-minute spawn rate, doubling
  every ten seconds. Ten arm weapons, including plasma shotgun, laser beam, fire
  trail, energy orbs, combat drone, sentry turret, Tesla coil, radiation cloud,
  orbital strike and cryo grenade. Four bosses at 2:00, 4:00, 6:00 and 8:00.
  Gold pickup from each dead boss, pulling every gem on the map. Score from
  kills alone, 8 points at intensity 1 and 140 at intensity 10.


  Steer with WASD or arrow keys, or drag anywhere on a phone or tablet. Kills
  drop XP gems. Level-ups stop the clock while you pick from three cards. Walk
  over medkits to patch your hull. Bosses stay when the next arrives, so falling
  behind means fighting several at once. Survive to 10:00 to mark the run
  extracted on a browser-saved scoreboard.
