slug: void-surge
title: Void Surge
tagline: Steer a ship while its weapons fire on their own, then extract before
  four bosses arrive.
description: >-
  You're the lone survivor holding the extract pad on Station Helix-9, and all
  you ever do is steer, because every weapon you carry aims and fires by itself.


  A run lasts ten minutes, with intensity climbing one step each minute from 1
  up to 10. In the final 60 seconds, enemies start showing up twice as fast with
  each ten-second stretch, so the swarm gets a lot thicker right before the
  shuttle leaves.


  Every kill drops an XP gem, and each new level stops the timer while you pick
  one of three cards. The Light Saber is always your core weapon, with room for
  three arms and three mods, and every piece ranks up to Mk 5. The arms run
  wide, covering a plasma shotgun, laser beam, fire trail, orbiting orbs, drone,
  sentry turret, Tesla coil, radiation cloud, orbital strike and cryo grenade.


  A boss shows up at the 2:00, 4:00, 6:00 and 8:00 marks, and since none of them
  leaves when the next one arrives, falling behind on a kill means fighting
  several of them together.


  Each dead boss drops a gold pickup that drags all the gems across the map
  straight to you. Medkits patch your hull back up by 28, and it starts at 100.
  Score comes from kills alone, with each one worth 8 points at intensity 1 but
  140 by intensity 10.


  Survive to 10:00 and the run is marked as extracted on a scoreboard saved in
  your browser, under a callsign of up to 14 characters that you type.
