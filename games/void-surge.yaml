slug: void-surge
title: Void Surge
tagline: Steer a ship while its weapons fire on their own, then extract before
  four bosses arrive.
description: >-
  You only steer. The weapons fire on their own, so your whole job is to keep
  moving through a swarm on Station Helix-9 while you wait for the last shuttle
  to warm up.


  You need to last ten minutes. Intensity climbs every minute, and in the final
  minute the spawn rate doubles every ten seconds, which is a rude way to say
  goodbye.


  Kills drop XP gems, and every level-up freezes the clock and hands you three
  cards to choose from. You can carry one core, three weapons and three passive
  mods, each ranked up to Mk 5, so upgrading something you already own usually
  beats grabbing a fourth weapon you've got no slot for.


  You always begin with a Light Saber that swings itself at anything in reach.


  The weapon pool is bigger than you'd guess: a plasma shotgun, a laser that
  pierces the swarm, a Tesla coil whose lightning hops between clustered
  enemies, orbiting energy spheres and cryo grenades that slow whatever they
  hit. One mod, Bait Signal, deliberately spawns more enemies, which makes sense
  because more targets means more XP.


  A titan lands at 2:00, 4:00, 6:00 and 8:00, and none of them leave when the
  next one arrives. Fall behind and you're fighting two, three, then four at
  once. Killing one drops a gold pickup that pulls every gem on the map toward
  you.


  Score counts kills only, and a kill is worth 8 at the start but 140 by the top
  intensity. So surviving longer pays better than farming early, which fits a
  game about getting out.


  Scores stay in your browser, and a run that reaches 10:00 is marked as an
  extraction. On the title screen you can type a callsign and open a field
  manual that lists the gear and bosses.
