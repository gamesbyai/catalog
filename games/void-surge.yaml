slug: void-surge
title: Void Surge
tagline: Steer a ship while its weapons fire on their own, then extract before
  four bosses arrive.
description: >-
  You move a lone survivor around Station Helix-9 and never aim or fire, because
  every weapon triggers by itself. A run lasts ten minutes. Intensity steps up
  once a minute, from 1 to 10, and spawning speeds up sharply during the last 60
  seconds.


  Kills leave XP gems behind. Each level-up halts the timer and shows three
  cards. Your loadout holds one core weapon (a Light Saber), three arms and
  three mods, and each piece can reach Mk 5. Arms include a plasma shotgun,
  laser beam, fire trail, orbiting orbs, drone, sentry turret, Tesla coil,
  radiation cloud, orbital strike and cryo grenade.


  Bosses appear at 2:00, 4:00, 6:00 and 8:00. An earlier boss stays alive when
  the next arrives, so falling behind means fighting several together. A dead
  boss drops a gold pickup that draws in all the gems on the map. Medkits
  restore hull, which begins at 100.


  Only kills count toward score, and each is worth more at higher intensity,
  from 8 points at level 1 up to 140 at level 10. Surviving to 10:00 marks the
  run as extracted on a scoreboard kept in your browser. The title screen
  accepts a callsign of up to 14 characters.
