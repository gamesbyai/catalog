slug: gravity-golf
title: Gravity Golf
tagline: Guide a golf ball through solar systems using orbital pull
description: >-
  Gravity Golf has you drag back and let go to send a white ball out across a
  dark field of stars, and then watch everything nearby tug at it.


  A grid covers the whole board, and it sags around every body sitting on it.
  Because of that pull, the ball's path bends as it slips past each one. It's a
  neat way of drawing gravity right onto the playfield, where you can see the
  dips before you shoot.


  Open Lane, the first level, already puts a yellow sun in the middle of things,
  wrapped in a thin orbit ring. There's also a teal planet with a small moon
  tucked against it, plus a dark purple ring off on the right, while a gold ring
  waits down in the lower left corner.


  The header counts Level 1 of 160, a surprising amount of space to cover, with
  a map icon sitting right beside it.


  There's a considerate safety net for bad shots. Retry and Undo buttons sit in
  the top right corner, and they're tied to the R and Z keys. A small how-to
  card also walks you through the drag-and-release launch.


  RichardGerum says the idea came from playing Outer Wilds and wanting to
  explore orbital mechanics further. The levels carry the ball through different
  solar systems, with gravity itself as the puzzle.
