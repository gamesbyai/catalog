slug: gravity-golf
title: Gravity Golf
tagline: Guide a golf ball through solar systems using orbital pull
description: >-
  Gravity Golf starts with a drag and release to launch a white ball across a
  dark board of stars. A grid bends around each body on the field, so the ball's
  path curves as it passes. The first level, Open Lane, has a yellow sun with a
  thin orbit ring, a teal planet with a small moon, and a dark purple ring on
  the right.


  A gold ring sits in the lower left corner of that first level. The header
  reads Level 1 / 160, with a map icon beside it, so the game holds 160 levels.
  Retry and Undo buttons at the top right are tied to the R and Z keys, and a
  small how-to card explains the launch.


  The creator says the idea came from playing Outer Wilds and wanting to explore
  orbital mechanics further. The levels move the ball through different solar
  systems, with gravity as the puzzle.
