slug: gravity-golf
title: Gravity Golf
tagline: Guide a golf ball through solar systems using orbital pull
description: >-
  Gravity Golf has you drag back and let go to send the ball out, then watch
  everything nearby tug at it.


  Because of that pull, the ball's path bends as it slips past each one. The
  pull shows up right on the playfield, so you can see it before you shoot.


  Open Lane, the first level, starts you off with a sun in the middle of the
  field. There's also a planet with a small moon tucked against it. The game has
  160 levels in total.


  Retry and Undo, on the R and Z keys, take back a bad shot.


  RichardGerum says the idea came from playing Outer Wilds and wanting to
  explore orbital mechanics further. Levels take the ball through different
  solar systems, and gravity itself is the puzzle.
