slug: gravity-golf
title: Gravity Golf
tagline: Guide a golf ball through solar systems using orbital pull
description: >-
  Gravity Golf has you shoot a golf ball through solar systems, where gravity is
  the puzzle.


  160 levels in total. Open Lane, the first level, with a sun and a planet with
  a small moon. Nearby objects whose pull bends the ball's path. Gravity's pull
  shown on the playfield before each shot.


  Drag back, then let go to shoot the ball. Press R to retry and Z to undo a bad
  shot.


  According to RichardGerum, the idea came from playing Outer Wilds and wanting
  to explore orbital mechanics further.
