slug: gravity-golf
title: Gravity Golf
tagline: Guide a golf ball through solar systems using orbital pull
description: >-
  In Gravity Golf you drag and release to launch a golf ball through a solar
  system, where the pull of the bodies out there bends its path.


  The first level, Open Lane, puts a glowing sun in the middle with a thin orbit
  ring around it. A teal planet with a small moon sits off to the right, and
  farther out there's a dark hole with a purple rim. The background grid bends
  around the sun, which is a neat way to show where the gravity is.


  There are 160 levels in all, so the map button beside the level name is handy
  for looking over the whole set. If a shot goes wrong, you can retry the level
  or undo your last move.


  Retry and undo sit in the top corner with their keys printed right on the
  buttons.


  The creator had just played Outer Wilds and got fascinated by orbital
  mechanics, so they built a puzzle around that theme. Golf gives it one simple
  verb, which leaves the interesting part to reading how the planets will bend
  your ball.


  A small how-to card on the first level shows the drag-and-release launch.
