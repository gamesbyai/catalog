slug: framefrenzy
title: FrameFrenzy
tagline: Rebuild a scrambled sliding puzzle made from a YouTube video that keeps
  playing.
description: >-
  You win by putting a scrambled picture back together before the YouTube clip
  it came from finishes playing.


  Each tile shows its own slice of the video as it plays, so nothing holds still
  for you to memorize. You're matching motion as much as shape, which is an odd
  twist on a sliding puzzle.


  Paste a public YouTube link, choose a 3×3 or 4×4 grid, and press Drop In.
  After a short countdown you tap once and the round begins. Music videos,
  trailers, memes and lectures all work, since any public link turns into a
  puzzle.


  Whatever you're playing on, the tiles move with a mouse, a touchscreen or the
  arrow keys.


  When you finish, you get a result to share with your time, your move count and
  a small grid of green squares. The video is baked into the link, so a friend
  lands on the very same puzzle. That makes it an easy dare to send.


  The code is open source on GitHub if you want to see how it's put together.
