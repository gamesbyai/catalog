slug: framefrenzy
title: FrameFrenzy
tagline: Rebuild a scrambled sliding puzzle made from a YouTube video that keeps
  playing.
description: >-
  The timer in this sliding puzzle is the video itself, since you have to
  rebuild the scrambled picture before the YouTube clip you picked finishes
  playing.


  You paste in a YouTube address, choose a 3×3 or 4×4 grid and start the round,
  then tap once when the countdown ends.


  Each tile shows a live crop of the same clip as it keeps playing, so the
  picture you're matching keeps moving. There's no freeze frame to study, which
  means you're matching motion as much as shapes. You slide pieces into the
  empty gap until the whole frame lines up again.


  Music clips, trailers, memes and lectures can all serve as the source of your
  puzzle.


  Finishing shows your time and move count. The video and grid size are packed
  into the link, so a friend who opens it gets the identical puzzle and can try
  to beat your time. It works with a keyboard, a mouse or a touchscreen.
