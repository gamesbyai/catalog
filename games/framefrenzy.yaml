slug: framefrenzy
title: FrameFrenzy
tagline: Rebuild a scrambled sliding puzzle made from a YouTube video that keeps
  playing.
description: >-
  The round is a race against the clip's own running time: rebuild the scrambled
  picture before the video finishes. You enter a YouTube address, choose a 3×3
  or 4×4 grid, press Drop In, and tap once when the countdown ends.


  Every tile shows a live crop of the same playing footage, so the target image
  keeps moving as you work. You slide pieces into the empty space until the
  frame lines up. Music clips, trailers, memes and lectures can all serve as the
  source.


  A finished puzzle produces a result card with your time and move count, shown
  beside a grid of colored squares. The video and grid size are encoded in the
  link, so a friend can open the identical puzzle and try to beat your time.
  Input can come from a keyboard, mouse or touchscreen.
