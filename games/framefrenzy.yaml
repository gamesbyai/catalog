slug: framefrenzy
title: FrameFrenzy
tagline: Rebuild a scrambled sliding puzzle made from a YouTube video that keeps
  playing.
description: >-
  FrameFrenzy turns any public YouTube link into a sliding tile puzzle. Choose a
  3×3 or 4×4 grid, press Drop In, and slide tiles until the picture is back in
  order. The round ends when the video does, so the footage itself is the clock.


  Every tile is a live crop of the same moving clip, so there is no still image
  to study. The picture you are chasing keeps changing, which makes the puzzle
  about motion as much as shape. Finishing a round produces a shareable result
  with time, move count, and a grid of green squares, plus a link a friend can
  use to try the same video.


  The creator says it was built with Claude Opus 4.6 and GitHub Copilot using
  GPT-5.4. The code is open source on GitHub and the game is hosted on
  Cloudflare Pages.
