slug: framefrenzy
title: FrameFrenzy
tagline: Rebuild a scrambled sliding puzzle made from a YouTube video that keeps
  playing.
description: >-
  Rebuild a scrambled sliding puzzle made from a YouTube video that keeps
  playing. You have until the clip ends.


  3×3 or 4×4 grids. Tiles that keep playing their part of the clip, so the
  picture never holds still. Music clips, trailers, memes or lectures as the
  source. Your time and move count at the end. A link that packs in the video
  and grid size, so a friend gets the identical puzzle.


  Paste in a YouTube link and tap once when the countdown ends. Slide pieces
  into the empty gap until the frame lines up. Play with a keyboard, a mouse or
  a touchscreen.
