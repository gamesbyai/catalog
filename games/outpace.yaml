slug: outpace
title: Outpace
tagline: Type words to run, press space to jump, and stay ahead of an adaptive wave.
description: >-
  Outpace is a typing runner with a Claude theme. Your character runs forward as
  you type, and the space bar makes it jump. Behind you, a wave closes in, and
  the goal is to keep typing accurately enough to stay ahead of it for as long
  as you can.


  The wave adapts as you play, so the pressure follows your typing instead of
  staying fixed. The game uses a pixel-art look and includes a leaderboard for
  comparing runs. It combines the pacing of an endless runner with the skill
  practice of a typing test.


  According to the repository, Claude Opus 5.5 built the whole project from
  start to finish as a test of its abilities. The tags list Claude and Claude
  Code as the tools involved.
