slug: metrocalypse
title: Metrocalypse
tagline: Shoot zombies and run across rooftops in a shared, persistent city.
description: >-
  You gun down zombies and race from building to building across a packed city's
  rooftops. The whole place is one map, 952 meters across, generated from a
  fixed seed.


  Steer with the mouse and WASD. Space jumps the gaps and holding shift sprints,
  which fits a game Tim_Damasc pitches as zombie shooting with parkour.


  Left click fires your gun, V pulls out a knife and E throws a grenade, while
  the mouse wheel flips between them for a full kit to carry across rooftops.


  You can also throw a plain stone with F or right click, alongside the
  grenades. Ctrl crouches. P switches to a tactical map view of the city.


  The city sticks around between visits and it's multiplayer, so you're sharing
  those rooftops with other players.


  Tim_Damasc had been hoping to build a multiplayer game on SpacetimeDB for some
  time, and they point to Dying Light as the inspiration.
