slug: metrocalypse
title: Metrocalypse
tagline: Shoot zombies and run across rooftops in a shared, persistent city.
description: >-
  Metrocalypse puts you on the rooftops of a packed city, where you gun down
  zombies and race from building to building. The whole city is one map, 952
  meters across, generated from a fixed seed.


  Gaps to jump across between rooftops. A gun, a knife, grenades and a plain
  stone to throw. Other players sharing the same rooftops. Persistent city, kept
  between visits.


  Steer with the mouse and WASD. Press Space to jump the gaps, and hold Shift to
  sprint. Press left click to fire your gun. Press E to throw a grenade, and V
  to pull out your knife. Use the mouse wheel to flip between them. Press F or
  right click to throw a plain stone. Use Ctrl to crouch, and press P to open
  the tactical map of the city.


  Tim_Damasc pitches it as zombie shooting with parkour, and had been hoping to
  build a multiplayer game on SpacetimeDB for some time. They point to Dying
  Light as the inspiration.
