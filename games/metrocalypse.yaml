slug: metrocalypse
title: Metrocalypse
tagline: Shoot zombies and run across rooftops in a shared, persistent city.
description: >-
  Metrocalypse puts you in a first-person view over a dense city of brick
  rooftops, where you shoot zombies and run across the buildings. Click the
  start panel to enter, then move with the mouse and WASD, jump gaps with space,
  and hold shift to sprint.


  You have a gun on left click, a knife on V, grenades on E, and a mouse wheel
  to switch weapons. F or right click throws a stone. Ctrl crouches, and P
  switches to a tactical view of the map.


  The world is persistent and multiplayer, so other players share the city with
  you. The screen shows a health bar, a level counter that starts at 0, and an
  experience bar. A status line at the bottom reads quiet before any fighting
  starts. The city is a single 952 meter map with a fixed seed, and the creator
  cites Dying Light as inspiration.
