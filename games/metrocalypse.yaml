slug: metrocalypse
title: Metrocalypse
tagline: Shoot zombies and run across rooftops in a shared, persistent city.
description: >-
  Metrocalypse is a multiplayer zombie shooter built around parkour movement.
  Players enter a city overrun by the undead, fight the horde with firearms, and
  move across the environment by running and jumping. The world is persistent,
  so it continues to exist and be shared with other players.


  The design draws on the creator's fondness for Dying Light, mixing fast
  traversal with combat against zombies. It runs in the browser on 3D graphics
  and supports both multiplayer and mobile play. The shared server state relies
  on SpacetimeDB, which the creator had wanted to try for multiplayer for some
  time.


  The creator built it with Cursor as an entry in Vibe Jam 2026, where it placed
  132nd out of 945 entries. That jam context frames it as a compact project
  rather than a large commercial release.
