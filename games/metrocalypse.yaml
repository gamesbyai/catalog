slug: metrocalypse
title: Metrocalypse
tagline: Shoot zombies and run across rooftops in a shared, persistent city.
description: >-
  The undead have overrun the city in Metrocalypse, and you fight them with
  firearms while getting around by running and jumping across the rooftops. It
  is an online multiplayer zombie shooter built around parkour. It is action,
  shooter and platformer at once, all in 3D.


  The creator's fondness for Dying Light shaped the mix of fast traversal and
  zombie combat. The shared server state runs on SpacetimeDB, which the creator
  had wanted to try for multiplayer for some time, and Cursor was the coding
  tool during Vibe Jam 2026.


  The world is persistent, so the city keeps existing when you log off and is
  shared with everyone else who plays, on desktop or on a phone. When you come
  back, you come back to the same overrun streets.
