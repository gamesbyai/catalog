slug: metrocalypse
title: Metrocalypse
tagline: Shoot zombies and run across rooftops in a shared, persistent city.
description: >-
  Metrocalypse drops you into a first-person view high over a packed city of
  brick rooftops, where you gun down zombies and race from building to building.
  Down in the streets, a surprisingly big crowd of small figures fills the gaps
  between the blocks. The whole place is one map, 952 meters across, generated
  from a fixed seed.


  Click the start panel to get in, then steer with the mouse and WASD. Space
  jumps the gaps and holding shift sprints, which fits a game Tim_Damasc pitches
  as zombie shooting with parkour.


  Left click fires your gun, V pulls out a knife and E throws a grenade, while
  the mouse wheel flips between them for a pretty full kit to carry across
  rooftops.


  There's also a plain stone you can throw with F or right click, a nicely
  low-tech option sitting next to the grenades. Ctrl crouches. P flips you over
  to a tactical map view, a sensible extra for a city nearly a kilometer across.


  The city sticks around between visits and it's multiplayer, so you're sharing
  those rooftops with other players.


  Along the bottom of your screen sit a health bar, an experience bar and a
  level number that begins at 0. A small status word down there reads "quiet"
  until the fighting kicks off, an oddly calm label for a zombie apocalypse.


  Tim_Damasc had been hoping to build a multiplayer game on SpacetimeDB for some
  time, and they point to Dying Light as the inspiration.
