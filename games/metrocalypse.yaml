slug: metrocalypse
title: Metrocalypse
tagline: Shoot zombies and run across rooftops in a shared, persistent city.
description: >-
  Metrocalypse has you shooting zombies and running across the rooftops of a
  brick-built city, and the creator says they love Dying Light. You've got a gun
  on left click, a knife on V and a grenade on E. The mouse wheel swaps weapons,
  and F or right click throws a stone.


  The whole city is one map about 952 meters across, so there's a lot of rooftop
  to cover. Shift sprints, space jumps and ctrl crouches, while P switches you
  to a tactical view.


  It's a multiplayer game, and the world is persistent, so the city keeps going
  between visits.


  The creator had wanted to build something multiplayer on SpacetimeDB for a
  while, and this is the game that came out of it. Along the bottom of the
  screen you get a green health bar, a level counter that starts at 0 and an
  experience bar.


  Before you play, the game loads a 16 MB pre-baked navigation file.


  Once that's done you click the screen to step in, and little figures are
  already scattered through the streets below the rooftops.
