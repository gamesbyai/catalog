slug: cyberdeck-survival
title: Cyberdeck Survival
tagline: Play cards, parry attacks, and outlast enemy waves in a cyberpunk arena.
description: >-
  Cyberdeck Survivor drops you into a cyberpunk arena where waves of enemies
  close in, and you survive by moving, using a Basic Attack, and playing battle
  chips from your deck. Move with WASD or the arrow keys. Chips trigger on Q, E,
  R and F.


  Incoming hits can be parried with Space. Over a run you survive waves, choose
  rewards, and work toward a boss fight. Defeating the boss opens a portal to
  the next game.


  The main menu offers Start Run, a Battle Chips screen, Settings and Credits.
  This is version 0.0.1, an early alpha. The creator lists demo polish, clearer
  combat tells, balance, deeper run progression, arenas, cyberware, events and a
  branching map as next updates.
