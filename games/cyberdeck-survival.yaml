slug: cyberdeck-survival
title: Cyberdeck Survival
tagline: Play cards, parry attacks, and outlast enemy waves in a cyberpunk arena.
description: >-
  Cyberdeck Survivor puts you in a walled neon arena where armored cyberpunk
  enemies close in on you in waves. You fight back with a basic attack and
  battle chips, and the chips are the deck-building part, so the ones you've
  equipped decide what you can throw at them.


  You can parry, too. Timing it against incoming hits matters as much as the
  chips do, because the game is built around every card play and every parry
  counting.


  Along the top you'll see the current wave, a countdown timer, and your level
  with an XP bar. Down in the corner, a health bar sits above an energy bar that
  reads 4 out of 4.


  You choose rewards as you go, and the goal is to survive the waves, reach the
  boss and defeat it. Beating the boss opens a portal to the next game, which
  makes sense for something made for a jam.


  If you go down, a Runner down screen shows your final score and a button to
  restart the run. The menu labels this version an early alpha.
