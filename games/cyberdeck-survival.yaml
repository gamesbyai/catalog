slug: cyberdeck-survival
title: Cyberdeck Survival
tagline: Play cards, parry attacks, and outlast enemy waves in a cyberpunk arena.
description: >-
  Cyberdeck Survival is a cyberpunk arena survivor that blends deck-building
  with action. The player fights off enemies in a closed arena, playing cards
  and parrying incoming attacks to stay alive. A run ends when the boss goes
  down and a portal opens to the next game.


  The game pairs the horde-survival loop familiar from Vampire Survivors-style
  games with card play, so each card use and each parry carries weight. Timing
  defensive moves matters as much as choosing what to play, which keeps the
  action from being simple auto-fire.


  The game was entered in Vibe Jam 2026, where it placed 353rd out of 945
  entries. The creator built it with Codex, using Phaser, and it is set up to
  run on mobile devices as well. The portal at the end connects it to other jam
  games.
