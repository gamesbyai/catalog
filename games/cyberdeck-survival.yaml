slug: cyberdeck-survival
title: Cyberdeck Survival
tagline: Play cards, parry attacks, and outlast enemy waves in a cyberpunk arena.
description: >-
  Cyberdeck Survival mixes deck-building into a cyberpunk arena survivor. You
  fight off waves of enemies in a closed arena by playing cards and parrying
  incoming attacks, and a run ends when the boss goes down and a portal opens to
  the next game.


  That portal connects it to other Vibe Jam 2026 games, so finishing a run sends
  you on to the next one. The creator used Codex and the Phaser engine, set it
  up to run on phones as well, and it placed 353rd of 945 in that jam.


  The horde-survival loop is familiar from Vampire Survivors-style games, but
  here each card and each parry carries weight. Timing your defense matters as
  much as choosing what to play, which keeps the action from turning into simple
  auto-fire.
