slug: cyberdeck-survival
title: Cyberdeck Survival
tagline: Play cards, parry attacks, and outlast enemy waves in a cyberpunk arena.
description: >-
  Cyberdeck Survivor drops you into an arena where enemies keep closing in, one
  wave after another. You stay alive by moving and fighting back. It's an arena
  survivor in the Vampire Survivors mold, where your card deck handles much of
  the combat.


  A Basic Attack swing. Battle chips from your deck. Rewards picked up along the
  way. Waves to survive, then a boss to work toward. Portal to the next game,
  opened by beating the boss. A "Runner down" message after a fall, with your
  final score and a fresh run.


  Move with WASD or the arrow keys. Press Q, E, R or F to fire your battle
  chips. Press Space to parry incoming hits.


  Elvlin89 calls this version 0.0.1, an early alpha. The next items on their
  list are a more polished demo, clearer combat tells, balance tuning and deeper
  run progression. Arenas, cyberware, events and a branching map also appear on
  that list.
