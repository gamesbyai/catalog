slug: zero-charge
title: Zero Charge
tagline: Ride a dead city on one battery, lighting windows as you pass.
description: >-
  You ride an endless dead city on a single battery that serves as fuel, life
  and the only light. Steer left and right, jump obstacles, and keep moving.
  Windows ignite as you pass, and when charge runs low you are riding blind.


  Everything costs charge, and reaching zero ends the run. Holding Overcharge
  burns battery to smash straight through whatever is in your path, so each use
  trades power for passage. The goal is a high score, in a score-attack format.


  The city is built from low-poly primitives in a neon cyberpunk look and
  generated procedurally as you ride. The creator says the code was written with
  Claude Opus 5, the key art made with Gemini, and the soundtrack with Suno. The
  build is marked as a work in progress.
