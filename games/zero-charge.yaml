slug: zero-charge
title: Zero Charge
tagline: Ride a dead city on one battery, lighting windows as you pass.
description: >-
  Ride an endless dead city on one battery that's both your fuel and your life.


  Everything costs charge, and zero ends the run. Overcharge, burning battery to
  smash through whatever's in your path. Riding blind when the charge runs low.
  A procedurally generated city. Score attack.


  Steer left and right and jump the obstacles.


  The creator says Claude Opus 5 wrote the code, Gemini made the key art and
  Suno the soundtrack. The build is a work in progress.
