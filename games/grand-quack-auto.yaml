slug: grand-quack-auto
title: Grand Quack Auto
tagline: Honk your way through a city as a rubber duck and escalate the chaos.
description: >-
  Your main weapon is a quack, aimed at passing pedestrians to scare them. You
  play a rubber duck loose in a city.


  An opening goal of frightening three pedestrians. Duck forms, from Lil'
  Quacker up to gun-wielding Duck Norris. Level-ups fed by the chaos your honks
  build. Cars to climb into, as an alternative to walking. Ragdolling the duck.
  Photos to take around town. Pedestrians with names like Sir Honks-a-Ton and El
  Pato Magnifico.


  UdayMydam pitches it as a mix of GTA and Untitled Goose Game. According to the
  creator, AI wrote 100% of the code.
