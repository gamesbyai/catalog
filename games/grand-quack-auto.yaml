slug: grand-quack-auto
title: Grand Quack Auto
tagline: Honk your way through a city as a rubber duck and escalate the chaos.
description: >-
  You play a rubber duck loose in a 3D city, and the main tool is the quack.
  Walk the streets, honk at pedestrians to scare them, and build up chaos. The
  first on-screen objective is to scare 3 pedestrians, and a brood counter at
  the top tracks ducklings, starting at 0 of 6.


  The duck levels up as the chaos grows. It starts as Lil' Quacker and
  eventually becomes the gun-wielding Duck Norris. A panel in the corner shows
  your current rank, chaos, combo and brood. A red news ticker along the bottom
  reports on the mayhem, and a timer runs in the top corner.


  Beyond walking, you can get into cars, ragdoll the duck, and take photos.
  Pedestrians wander the streets with name labels such as Sir Honks-a-Ton and El
  Pato Magnifico. The camera follows the duck from behind, between blocky
  buildings in flat, low-poly color.
