slug: grand-quack-auto
title: Grand Quack Auto
tagline: Honk your way through a city as a rubber duck and escalate the chaos.
description: >-
  The hero here is a rubber duck loose in a city, and its main weapon is a quack
  you aim at passing pedestrians to scare them.


  Out on the streets, all that honking builds up chaos. The opening objective is
  to frighten 3 pedestrians.


  As the chaos grows, the duck levels up. It starts out as Lil' Quacker and
  eventually becomes the gun-wielding Duck Norris.


  Walking isn't your only option, since you can climb into cars, ragdoll the
  duck or take photos. The people you're terrorizing go by names like Sir
  Honks-a-Ton and El Pato Magnifico.


  UdayMydam pitches it as GTA meets Untitled Goose Game, and according to them,
  AI wrote 100% of the code.
