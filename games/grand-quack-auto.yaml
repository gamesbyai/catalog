slug: grand-quack-auto
title: Grand Quack Auto
tagline: Honk your way through a city as a rubber duck and escalate the chaos.
description: >-
  You scare pedestrians as a rubber duck, and your main tool is a honk. Your
  duck starts out as a "Lil' Quacker" and works its way up to a gun-wielding
  "Duck Norris" as the chaos adds up.


  The first objective is simple. You waddle around the blocky city streets, and
  the opening goal is to frighten three pedestrians, who wander around with
  silly names floating over their heads, like Sir Honks-a-Ton and El Pato
  Magnifico.


  A panel in the corner tracks your level, your chaos, your combo and a brood
  counter that goes up to six. There's also a running timer up top.


  Cars are part of it too, because you can climb into one and drive instead of
  waddling.


  Along the bottom runs a red news ticker from the Quack News Network, which is
  a nice touch for a game about a duck committing crimes. The title screen even
  jokes that no ducks were harmed, though the pedestrians might be another
  story.


  The creator pitches it as GTA meets Untitled Goose Game, and says the whole
  thing was coded by AI.
