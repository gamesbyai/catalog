slug: grand-quack-auto
title: Grand Quack Auto
tagline: Honk your way through a city as a rubber duck and escalate the chaos.
description: >-
  You are a rubber duck loose in a city, and your main tool is a honk button. In
  Grand Quack Auto, the more havoc you cause, the further the duck climbs from
  its humble start as Lil' Quacker, and each stage of the climb raises the
  stakes.


  It borrows the antics of open-city crime games and the mischievous animal
  energy of a goose prank sim. At the top of the climb waits a gun-wielding
  persona called Duck Norris, so a tiny noisemaker ends up a full-blown menace.
  The joke keeps escalating, and the tone stays silly throughout.


  According to the creator, the code for this Vibe Jam 2026 entry was written
  entirely by AI with Claude Code, and the city is built in Three.js. It also
  runs on phones.
