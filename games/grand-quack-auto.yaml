slug: grand-quack-auto
title: Grand Quack Auto
tagline: Honk your way through a city as a rubber duck and escalate the chaos.
description: >-
  Grand Quack Auto puts you in the webbed feet of a rubber duck loose in a city.
  Your main tool is a honk button, and the more havoc you cause, the further the
  duck climbs from its humble start as Lil' Quacker. Each stage of the climb
  raises the stakes of the mayhem.


  The premise mixes open-city crime-game antics with the mischievous animal
  energy of a goose prank sim. The duck's rise ends with a gun-wielding persona
  called Duck Norris, so a tiny noisemaker gradually turns into a full-blown
  menace. The tone stays silly throughout, built around a joke that keeps
  escalating.


  It was built in Three.js for Vibe Jam 2026, and the creator states the code
  was written entirely by AI. The creator used Claude Code for the work. The
  game also runs on mobile devices.
