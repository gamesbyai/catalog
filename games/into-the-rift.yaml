slug: into-the-rift
title: Into The Rift
tagline: Draft a team of riftlings and auto-battle through the rift to defeat
  the elite boss.
description: >-
  You begin in a dark pixel-art forest clearing and walk your character up to
  one of three creatures to pick your starter riftling. A timer in the top left
  corner starts at 0:00, and a volume slider sits in the top right next to the
  control hints.


  From there you draft a team of riftlings and send them through the rift in
  auto battles, where the creatures fight on their own rather than taking direct
  commands. Your job is to build a team strong enough to reach the elite boss at
  the end and defeat it.


  Movement uses WASD, Tab opens your bag, and Q and E rotate. The creator names
  Pokémon and roguelites as the inspiration, and the result is a strategy
  roguelite built around choosing which creatures to bring along.
