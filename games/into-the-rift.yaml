slug: into-the-rift
title: Into The Rift
tagline: Draft a team of riftlings and auto-battle through the rift to defeat
  the elite boss.
description: >-
  Your riftlings fight on their own in auto battles, with no direct commands
  from you. You draft a team and send it through the rift.


  Three starter riftlings to choose from. Strategy roguelite runs built around
  which riftlings you bring along. A team strong enough to reach the elite boss
  at the end of the rift and defeat it.


  Walk up to the riftling you want as your starter. Move with WASD, open your
  bag with Tab, and rotate with Q and E.


  The creator names Pokémon and roguelites as the inspiration for the game.
