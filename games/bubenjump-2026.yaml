slug: bubenjump-2026
title: Bubenjump 2026
tagline: Ski jump down the in-run and fly for distance.
description: "Control a ski jumper from the top of the in-run through the flight. Each jump is measured in meters.


  Headwind and tailwind on the slope. A choice of starting gates. Points for each jump. Hill records to chase.


  Press Space to start. Press Up or Space to take off. Press Right to lean forward and Left to straighten up. Land with Down for a telemark or Space for a parallel landing.


  Krischan drew inspiration from SJ3. Every graphic, the jumpers included, is painted by code onto a canvas. The music is by ssilk, and the only other outside assets are a few sounds. Krischan described each feature, and an AI coding assistant built it on its own git branch. They tested each build in a local preview and gave feedback until it felt right. Friends have played it since day one, and most of the to-do list came from them."
