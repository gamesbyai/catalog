slug: bubenjump-2026
title: Bubenjump 2026
tagline: Ski jump down the in-run and fly for distance.
description: "You take a ski jumper from the top of the in-run all the way
  through the flight, and every jump's measured in meters.


  Headwind and tailwind on the slope, and a choice of starting gates. Points for
  each jump, plus hill records to chase. Online leagues where every player picks
  a different jumper.


  Press Space to start, then Up or Space to take off. Lean forward with Right
  and straighten up with Left. Land with Down for a telemark, or Space for a
  parallel landing.


  It's inspired by SJ3, and every graphic is drawn in code on a canvas, down to
  the jumpers' faces. The music is by ssilk. Krischan described each feature,
  the AI built it on its own git branch, and Krischan \"complained until it felt
  right\". Most of the backlog came from friends who've played it since the
  beginning."
