    How I worked: I’d describe a feature, Claude Code built it in its own git
    branch, and I played it in a local preview and complained until it felt
    right. A lot of the feedback was screenshots with comments like “this layout
    is cluttered” or “why is he raising his arms in the portrait”. My friends
    have played it since the beginning, and most of the backlog came from them.
