slug: duality
title: Duality
tagline: Guide two linked entities across parallel dimensions to their portals,
  dodging Void Agents
description: >-
  You steer two glowing orbs at once, a cyan one that is you and a magenta one
  that is your Echo. The arena is split down the middle, with one side per orb.
  Each side has its own escape portal at the far end, and the goal is to get
  both orbs into their portals.


  The Echo copies your moves, but not directly. The HUD labels the current rule,
  such as Mirror X on the first dimension, and later levels twist the mirroring
  further. Red Void Agents patrol both sides, so each move has to be safe in two
  places at once.


  Small crosshair-marked pickups sit around the field, some white and some
  yellow. A streak multiplier starts at x1, a score and best score sit in the
  corner, and you have three hearts. A run begins when you first move. Sound can
  be toggled on screen.


  The creator designed each level as a small physics puzzle disguised as a
  survival game, drawing on an interest in quantum physics and parallel
  dimensions.
