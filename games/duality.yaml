slug: duality
title: Duality
tagline: Guide two linked entities across parallel dimensions to their portals,
  dodging Void Agents
description: >-
  You're steering two things at once. One is yours, on the cyan half of the
  screen, and the other is your Echo on the magenta half, which copies your
  moves in a parallel dimension.


  The goal is to get both of them into their escape portals, and each side has
  its own glowing ring waiting. Red Void Agents are in the way on both halves,
  so you're watching two spaces while you move, which is a clever way to make
  one set of inputs do double duty.


  Level one is called Dim 1 and it's tagged Mirror X right in the header.


  The Echo doesn't stay a plain mirror, because its copying gets twisted in new
  ways as you go. White and yellow diamond markers are scattered across both
  halves, and the top of the screen tracks a streak multiplier and three hearts.


  The creator wanted a game that makes you think in two places at once, so each
  level works like a little physics puzzle dressed up as a survival game.


  Nothing starts until you make your first move. Your score and a best score sit
  in the top left corner, and there's a sound toggle in the bottom corner if
  you'd rather play quietly.
