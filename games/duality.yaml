slug: duality
title: Duality
tagline: Guide two linked entities across parallel dimensions to their portals,
  dodging Void Agents
description: >-
  You control two orbs at the same time. One orb is yours, and the other is your
  Echo, which copies every move you make in its own bent way.


  Those copies aren't direct. The first dimension uses the Mirror X rule. Later
  levels twist the mirroring further.


  The arena is split down the middle, with one side for each orb, and each side
  has its own escape portal at the far end where its orb needs to reach.


  Void Agents patrol both halves of the field. A move that's safe for you also
  has to be safe for your Echo at the same moment.


  Small pickups are scattered around both sides, in two types.


  The game has a streak multiplier. You have three hearts. Nothing starts until
  you first move.


  alessio_cagnin_ built it around a fascination with quantum physics and
  parallel dimensions, and the idea of an echo with its own rules came up while
  brainstorming with AI. They shaped each level as a small physics puzzle
  dressed up as a survival game.
