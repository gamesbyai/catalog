slug: duality
title: Duality
tagline: Guide two linked entities across parallel dimensions to their portals,
  dodging Void Agents
description: >-
  Duality gives you two characters to move with one set of inputs. You control
  two quantum entities at once, each in its own parallel dimension, and every
  level asks you to bring both to their escape portals while Void Agents hunt
  them.


  The creator says the idea came from brainstorming with AI, mixing a love of
  games that split your attention with an interest in quantum physics and
  parallel dimensions. It came together in Claude Code and Three.js and placed
  119th of 945 at Vibe Jam 2026.


  The hook is the Echo, a mirror of your character that follows your inputs
  under its own rules, and those rules get more twisted as the levels go on.
  Each stage plays like a small physics puzzle dressed as survival, where one
  move changes things in both dimensions.
