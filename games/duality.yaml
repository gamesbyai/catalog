slug: duality
title: Duality
tagline: Guide two linked entities across parallel dimensions to their portals,
  dodging Void Agents
description: >-
  An Echo copies every move you make in its own bent way. Control both orbs
  together.


  Mirror X in the first dimension, twisted further in later levels. Arena
  halves, one per orb, each with a far-end escape portal that orb must reach.
  Void Agents patrolling both halves. Moves safe for both orbs at once. Small
  pickups in two types on both sides. Streak multiplier.


  Nothing starts until your first move. You have three hearts.


  alessio_cagnin_, fascinated by quantum physics and parallel dimensions, made
  each level a small physics puzzle framed as survival. The Echo's own rules
  surfaced during AI brainstorming.
