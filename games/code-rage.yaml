slug: code-rage
title: Code Rage
tagline: Fight off enemy waves inside a buggy codebase that keeps corrupting itself.
description: >-
  Code Rage puts you in the shoes of a vibe coder trapped inside their own
  broken game. Each run is a series of waves in which you shoot down enemies
  while the surrounding code steadily corrupts itself, so the arena keeps
  getting less stable the longer you survive.


  The premise comes from a familiar frustration: AI-coded projects that ship
  with odd glitches, where it is hard to tell a bug from an intended feature.
  The game turns that confusion into its core loop, asking you to decide which
  corruption is worth fixing and which you can live with while the fight
  continues.


  The creator built it with Claude Code and made it for Vibe Jam 2026. It runs
  on Three.js and is played as a single-player shooter.
