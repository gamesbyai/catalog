slug: code-rage
title: Code Rage
tagline: Fight off enemy waves inside a buggy codebase that keeps corrupting itself.
description: >-
  Fight off enemy waves inside a buggy codebase that keeps corrupting itself.
  You play a vibe coder stuck in your own broken game.


  An arena that gets less stable the longer you survive. Corruptions to fix or
  ignore mid-fight. Bugs that look like features, and features that look like
  bugs.


  RohanSudo built it with Claude Code, after one too many AI-coded projects
  shipped with odd glitches.
