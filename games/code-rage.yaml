slug: code-rage
title: Code Rage
tagline: Fight off enemy waves inside a buggy codebase that keeps corrupting itself.
description: >-
  Code Rage traps you, a vibe coder, inside your own broken game. Enemies come
  in waves, and while you shoot them down the code around you keeps corrupting
  itself, so the arena gets less stable the longer you survive.


  The premise comes from a familiar frustration: AI-coded projects that ship
  with odd glitches, where it is hard to tell a bug from an intended feature.
  The creator built this shooter with Claude Code on Three.js.


  That confusion is the core loop. Mid-fight, you choose which corruptions to
  fix and which to leave alone while the waves keep coming. Staying alive longer
  leaves the arena more corrupted.
