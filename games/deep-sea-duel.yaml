slug: deep-sea-duel
title: Deep Sea Duel
tagline: Pilot a shrimp or axolotl in real-time underwater duels against another player.
description: >-
  Each rider starts with 100 HP, and the last one still swimming wins. You pilot
  a shrimp or an axolotl, each carrying a diver, and shoot your opponent
  underwater in a real-time online match with quickmatch. Two players can also
  share one keyboard in the 2 Player mode.


  Catching sea creatures grants power-ups. The menu lists six: +25 HP, poison,
  +1 stream, invisibility for 10 seconds, a 3 second spin, and a spread shot.


  The solo mode replaces the opponent with trash. You survive 3 waves of
  floating garbage, then face the Trash Titan. Green radioactive trash is marked
  as something to avoid.


  The art is pixel style, with a coral and sand seabed. The creator wanted a
  two-player game to play against friends and siblings, after years of searching
  for one with a sister.
