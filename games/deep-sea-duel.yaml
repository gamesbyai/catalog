slug: deep-sea-duel
title: Deep Sea Duel
tagline: Pilot a shrimp or axolotl in real-time underwater duels against another player.
description: >-
  Each rider starts with 100 HP, and the last one still swimming wins. You pilot
  a shrimp or an axolotl, each carrying a diver, and shoot your opponent
  underwater. Quickmatch starts a real-time online match against another player.


  Shared-keyboard play for two people in the 2 Player mode. Power-ups from
  catching sea creatures, including +25 HP, poison, +1 stream, invisibility for
  10 seconds, a 3 second spin, and a spread shot. Solo mode, with trash in place
  of the opponent. 3 waves of floating garbage to survive, then the Trash Titan.
  Green radioactive trash to avoid.


  camryn_alvares wanted a two-player game to play against friends and siblings,
  after years of searching for one with a sister. "I hope this game can reach
  other kids and their siblings/friends," camryn_alvares writes.
