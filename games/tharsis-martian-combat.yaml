slug: tharsis-martian-combat
title: "Tharsis: Martian Combat"
tagline: Build a base on Mars, harvest crystals, and destroy the enemy base in
  real time.
description: >-
  Build a base on Mars, send harvesters after crystals, and spend them on an
  army that wipes out the enemy base.


  More than 12 unit types, from riflemen and snipers to the Behemoth super-tank
  and the Manticore gunship. Fog of war until your units scout the map. Support
  powers mid-fight. Skirmish against an AI from Easy to Brutal. An AI vs AI mode
  to watch.


  Select with a left click or a drag box, then right-click to move or attack.
  Press A to attack-move and WASD to scroll.


  The design draws on classic Command & Conquer. The creator wrote it all in
  vanilla JavaScript, with its own soundtrack and sound effects.
