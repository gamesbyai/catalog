slug: tharsis-martian-combat
title: "Tharsis: Martian Combat"
tagline: Build a base on Mars, harvest crystals, and destroy the enemy base in
  real time.
description: >-
  The setting is Mars, and the goal is to wipe out the enemy base. You start by
  building a base and sending harvesters after crystals, then spend those
  resources on an army. Fog of war hides the map until your units scout it.


  The roster has more than 12 unit types: riflemen, snipers, tanks, APCs, rocket
  artillery, the Behemoth super-tank and the Manticore gunship, along with VTOL
  gunships. Support powers add extra options during a fight.


  Skirmish mode pits you 1v1 against an AI set to Easy, Normal, Hard or Brutal.
  Matches can be customized by starting resources, map seed and starter units.
  An AI vs AI spectator mode lets you watch instead of play. Online 1v1 through
  Wavedash lobbies is still in progress.


  Select units with the left mouse button or drag a box, then right-click to
  move or attack. The design draws on classic Command & Conquer. It is written
  in vanilla JavaScript on an HTML5 canvas, with a sci-fi soundtrack and sound
  effects.
