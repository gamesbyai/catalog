slug: tharsis-martian-combat
title: "Tharsis: Martian Combat"
tagline: Build a base on Mars, harvest crystals, and destroy the enemy base in
  real time.
description: >-
  Tharsis: Martian Combat has you drag a box around your troops and right-click
  to send them across the Martian surface. You harvest green crystals to pay for
  your base and your army, in the spirit of the classic Command & Conquer games.


  You win by destroying the enemy base, so everything you build is there to get
  your army to that point.


  In a skirmish you face one AI opponent on Easy, Normal, Hard or Brutal, so you
  pick how tough a fight you want. You can also change the starting resources,
  the map seed and the starter units before the match begins.


  There are more than twelve unit types, including riflemen, snipers, tanks,
  APCs and rocket artillery. The Behemoth super-tank and the Manticore gunship
  are in the roster too, and VTOL gunships mean some of the fighting happens in
  the air. Fog of war hides the map until your units scout it, and you can call
  on support powers as well.


  If you'd rather just watch, there's an AI vs AI spectator mode that lets the
  computer play both sides.


  A sidebar on the right shows your money and supply count, a minimap, sell and
  repair buttons, and tabs for building, units and support. Online 1v1 through
  Wavedash lobbies is still a work in progress, so skirmish is the mode that's
  ready. Pressing A sends a group attack-moving, which is handy when you don't
  want to micromanage every shot.
