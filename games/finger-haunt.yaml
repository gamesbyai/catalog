slug: finger-haunt
title: Finger Haunt
tagline: Fight off ghosts and rude guests with finger guns across 20 waves.
description: >-
  Aim and fire finger guns at ghosts and stubborn guests in a hotel, and you
  have to survive them.


  Twenty waves, each fuller than the last. Slimes that break into several
  smaller, faster pieces. Four keepsakes chosen out of nine, with upgrades for
  your favorites. Boss powers, one for each of the toughest holdouts you
  dismiss. Four different boss fights building toward the Shrine Eye, which the
  guests save for last. An optional Endless mode, open once the campaign is
  cleared. Practice to warm up in, and Relaxed, Standard or Nightmare
  difficulty.


  Dodge their ranged attacks, and use the dash to get clear of trouble. Time
  your jump to escape ground attacks, since it runs on a cooldown. Play with a
  mouse and keyboard.
