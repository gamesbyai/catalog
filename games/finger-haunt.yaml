slug: finger-haunt
title: Finger Haunt
tagline: Fight off ghosts and rude guests with finger guns across 20 waves.
description: >-
  Finger Haunt has you aiming and firing finger guns at ghosts and guests who
  won't budge, in an illustrated 3D lobby. You have to survive twenty waves in
  there, each one fuller than the last, which is a lot of guests for one room.


  Even the slime in the opening notice has booked another week, which tells you
  early that the guests aren't checking out.


  The enemies are expressive, which suits a crowd that won't take no for an
  answer. You also have to dodge their ranged attacks. Slimes break into
  smaller, faster pieces, which means one slime can turn into several.


  A dash gets you clear of trouble, while the jump runs on a cooldown, which is
  why you have to time it to escape ground attacks.


  You'll pick four keepsakes out of nine, then improve the upgrades you like
  best. Each of the toughest holdouts you dismiss earns you a boss power of its
  own.


  Four different boss fights build toward the Shrine Eye, which the guests have
  been saving for last.


  Once the campaign is cleared, there's an optional Endless mode for when you'd
  like the hotel to keep up the fight. Practice is there to warm up in, while
  the difficulty runs Relaxed, Standard or Nightmare. You play with a mouse and
  keyboard.
