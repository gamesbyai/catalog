slug: bramblewick-farm
title: Bramblewick Farm
tagline: Name your farmer, start a farm in a pixel-art village, and craft new items.
description: >-
  You play a farmer in a village, then set up a new farm at its edge.


  Your farmer's name, plus a shirt and hair color to pick. Bag on I, for keeping
  track of whatever you carry. Crafting on C, for making new items. Journal on
  J, checked as you go.


  Move with WASD or the arrow keys. Press Space or click to use tools and talk.
  Switch tools with the number keys, 1 through =, or the mouse wheel.
