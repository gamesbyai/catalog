slug: tdshooter
title: TDShooter
tagline: Shoot enemies from above, finish quests, and open up new zones.
description: >-
  You control a small character on a dark green grid. Walk with W, A, S, D, aim
  with the mouse and click to shoot. A prompt on screen says so at the start,
  and a counter at the top reads Enemies killed: 0/40.


  A line under the counter reads Next: Zone 2, up, and yellow arrows on the
  floor point that way. The creator describes the game as shooting enemies,
  doing quests and unlocking new zones.


  The top left shows HP at 100 out of 100, a level readout with perk points, and
  an XP bar that starts at 0 of 100. A slide ability is labeled Space at the
  bottom center. A column of emote buttons on the right edge offers a heart,
  thumbs up, arrows, a question mark, an exclamation mark, a skull, a gravestone
  and a coffin. Two icons in the top right switch between mouse and touch input.
