slug: tdshooter
title: TDShooter
tagline: Shoot enemies from above, finish quests, and open up new zones.
description: >-
  You're a small character standing on a dark green grid, and a prompt on screen
  spells out the basics right away. You walk with W, A, S, D, aim with the mouse
  and click to shoot. Up top, a counter reads Enemies killed: 0/40.


  Just below it, a line points you toward Zone 2, which is up, and yellow arrows
  on the floor helpfully lead the same way.


  According to ok_kutas, the game is about shooting enemies, doing quests and
  unlocking new zones. Your stats sit in the top left, where HP shows 100 out of
  100, a level readout lists your perk points and an XP bar starts at 0 of 100.


  A slide ability sits on Space, labeled at the bottom center of the screen.
  On the right edge there's a column of emote buttons with a grim back half.
  Next to a heart, a thumbs up, arrows, a question mark and an exclamation
  mark, you'll find a skull, a gravestone and a coffin.


  Two icons in the top right switch between mouse and touch input.
