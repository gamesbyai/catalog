slug: tdshooter
title: TDShooter
tagline: Shoot enemies from above, finish quests, and open up new zones.
description: >-
  You play as a single character. You walk with W, A, S, D, aim with the mouse
  and click to shoot. Zone 2 is up.


  According to ok_kutas, the game is about shooting enemies, doing quests and
  unlocking new zones. Your character has HP, XP and perk points.


  Your character can slide with Space. The game also has a set of emotes you can
  use. The emotes include a heart, a thumbs up, arrows, a question mark, an
  exclamation mark, a skull, a gravestone and a coffin. You can switch between
  mouse and touch input.
