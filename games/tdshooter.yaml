slug: tdshooter
title: TDShooter
tagline: Shoot enemies from above, finish quests, and open up new zones.
description: >-
  TDShooter is a top-down shooter where the player fights off enemies while
  moving around the map. Along the way there are quests to complete, and
  finishing them opens up new zones to explore. A session is a loop of shooting,
  completing objectives, and pushing into fresh areas.


  The game is marked as multiplayer and also works on mobile, so it can be
  played with other people and on a phone or tablet as well as on a desktop
  browser. Zone unlocking gives the shooting a sense of progression beyond
  simply surviving waves.


  It was entered in Vibe Jam 2026, where it placed 279th out of 945 entries, and
  it is built on PixiJS. The creator says they used Cursor while making it.
