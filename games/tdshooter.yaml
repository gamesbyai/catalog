slug: tdshooter
title: TDShooter
tagline: Shoot enemies from above, finish quests, and open up new zones.
description: >-
  You play as a single character. According to ok_kutas, the game is about
  shooting enemies, doing quests and unlocking new zones.


  Zone 2, open to play. HP, XP and perk points for your character. Emotes,
  including a heart, a thumbs up, arrows, a question mark, an exclamation mark,
  a skull, a gravestone and a coffin.


  Walk with W, A, S and D. Aim with the mouse and click to shoot. Press Space to
  slide. Switch between mouse and touch input.
