slug: cannon-rush
title: Cannon Rush
tagline: Sail the seas and sink enemy ships with broadside cannon fire.
description: >-
  Steer a wooden galleon across open water with the arrow keys and fire the
  cannons with F or G. The goal is to sink the other sailing ships. A kills
  table tracks each player's sinkings. Your ship starts with 100 health.


  The creator is a fan of Uncharted Waters and Port Royale and built this
  sailboat game as a tribute, wanting to blast sailing ships with cannons.
