slug: cannon-rush
title: Cannon Rush
tagline: Sail the seas and sink enemy ships with broadside cannon fire.
description: >-
  Sink other sailing ships with cannons from the deck of a wooden galleon. Your
  ship starts with 100 health. The kills table counts how many ships each player
  has sunk.


  You sail with the arrow keys and fire the cannons with F or G.


  Kadovat is a fan of Uncharted Waters and Port Royale, and made this sailboat
  game as a tribute where you blast sailing ships with cannons.
