slug: cannon-rush
title: Cannon Rush
tagline: Sail the seas and sink enemy ships with broadside cannon fire.
description: >-
  Cannon Rush puts you in command of a sailboat with cannons on board. You sail
  the seas, line up broadside shots on enemy sailing ships and sink them,
  keeping the fight going against the vessels around you.


  It is a tribute to Uncharted Waters and Port Royale, the sailing and trading
  classics, with their seafaring setting boiled down to a naval shooter built on
  Three.js. It ranked 214th of the 945 entries at Vibe Jam 2026.


  The creator made it out of affection for those older ship games and says the
  whole idea was to enjoy blasting sailing ships with cannons. Multiplayer means
  other players can share the water with you online, and the goal stays that
  simple: line up the shot, blast the ship.
