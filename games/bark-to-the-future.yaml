slug: bark-to-the-future
title: Bark to the Future
tagline: Flap with one button and bounce off walls to fill the screen with bullets.
description: >-
  Bark to the Future mixes one-button flapping with side-scrolling shoot-'em-up
  action. You keep your character airborne with taps, dodge incoming threats,
  and fire back while moving through a crowded screen. The goal is to survive
  and score by making the most of every shot you can land.


  The hook is the environment itself. Walls act as part of your arsenal, and
  chaining bounces off them builds toward full bullet-hell chaos. The creator
  cites Gradius, Flappy Bird, and pinball as influences, and the game plays as a
  blend of all three: flap-style control, shmup pacing, and ricochet timing.


  It was entered in Vibe Jam 2026, where it placed 477th out of 945 entries. The
  creator built it with Codex, using the Phaser engine, and it is set up to work
  on mobile as well.
