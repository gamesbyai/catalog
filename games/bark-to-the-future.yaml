slug: bark-to-the-future
title: Bark to the Future
tagline: Flap with one button and bounce off walls to fill the screen with bullets.
description: >-
  Bark to the Future is a single-player, side-scrolling shoot-'em-up played with
  one-button flapping. Taps keep your character airborne while you dodge
  incoming threats and fire back across a crowded screen, trying to survive and
  score.


  The creator cites Gradius, Flappy Bird and pinball as influences, and each one
  maps to a piece of the game: flap-style control, shmup pacing and ricochet
  timing. Codex and the Phaser engine were the tools, it is set up for phones as
  well, and it came 477th of 945 at Vibe Jam 2026.


  The hook is the environment: the walls are part of your arsenal. Chaining
  bounces off them fills the screen with bullets and builds toward full
  bullet-hell chaos, and the score climbs by making the most of every shot you
  can land.
