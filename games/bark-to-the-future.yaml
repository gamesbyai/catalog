slug: bark-to-the-future
title: Bark to the Future
tagline: Flap with one button and bounce off walls to fill the screen with bullets.
description: >-
  Flap with one button through a side-scrolling shoot-'em-up, dodging threats
  and firing back.


  Walls that count as part of your arsenal. Bounces that chain into bullet-hell
  chaos. A score that climbs with every shot you land.


  The creator cites Gradius, Flappy Bird and pinball, for flap-style control,
  shmup pacing and ricochet timing.
