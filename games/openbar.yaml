slug: openbar
title: OpenBar
tagline: Chat, flirt and play games with AI patrons in a 3D dive bar.
description: >-
  OpenBar is a 3D dive bar full of AI-driven patrons, and you walk in to mingle.
  They gossip among themselves, flirt and may challenge you to games, and every
  conversation is open-ended, so a visit plays out as a series of encounters
  with whoever is at the bar.


  To the creator, worlds like this feel appealing, and a dive bar seemed the
  right setting. Codex was the build tool for Vibe Jam 2026, where it finished
  269th of 945. It is single-player and runs on Three.js on desktop and on
  phones.


  The patrons remember how you treat them, so earlier behavior shapes how later
  conversations go. The characters respond on their own terms rather than
  following a fixed script, which is the whole idea behind this 3D simulation.
