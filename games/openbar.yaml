slug: openbar
title: OpenBar
tagline: Chat, flirt and play games with AI patrons in a 3D dive bar.
description: >-
  Move with WASD through a 3D dive bar and press E to talk to the patrons. Press
  F to sit and Enter to focus the chat box. Hold the left mouse button to orbit
  the camera or the right button to steer. Esc leaves the conversation.


  The patrons are AI-driven. They gossip, flirt and challenge you to games, and
  they remember how you treat them. The start screen calls it a persistent
  social sim: one street, one bar, and a cast where gossip sticks and grudges
  simmer.


  Before you enter, you can make your own character with a customize option, or
  keep the default look. An AI settings panel lets you set a provider, endpoint
  and model. A side panel lists the night's threads, such as a chill between two
  regulars, plus a feed of recent beats. The top panel tracks night number,
  phase and room mood.


  The creator wanted a space where AI characters can interact in a 3D world, and
  chose a dive bar as the setting for it.
