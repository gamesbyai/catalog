slug: openbar
title: OpenBar
tagline: Chat, flirt and play games with AI patrons in a 3D dive bar.
description: >-
  OpenBar is a 3D dive bar simulation where you walk in and mingle with a room
  of AI-driven patrons. They gossip among themselves, flirt, and may challenge
  you to games. Each conversation is open-ended, so a visit plays out as a
  series of encounters with whoever is at the bar.


  The patrons remember how you treat them, so earlier behavior shapes how later
  conversations go. The idea is a shared 3D space where characters respond on
  their own terms rather than following a fixed script. The creator says worlds
  like this feel appealing, and a dive bar seemed the right setting.


  It runs in the browser on Three.js and supports mobile devices. The creator
  built it with Codex and submitted it to Vibe Jam 2026. It is a single-player
  experience.
