slug: openbar
title: OpenBar
tagline: Chat, flirt and play games with AI patrons in a 3D dive bar.
description: >-
  Walk around a 3D dive bar with WASD, then press E to talk to whoever's nearby.
  The patrons are AI-driven, so they gossip, flirt and challenge you to games,
  and they remember how you treated them.


  You start by making your own character, or you can keep the default look.
  There's also an AI settings panel where you pick the provider, endpoint and
  model that answer back, which is handy because the bar's conversations run on
  it.


  When you want to stay put for a while, press F to sit down at the bar.


  A panel on the right lists tonight's threads, like a chill between two
  regulars or someone who keeps finding excuses to cross the room. They work as
  hints about who to get closer to, and a feed of recent beats keeps track of
  what's been going on.


  Up top you can see the night number, the phase of the evening, the mood of the
  room and a read on how the place sees you.


  The idea is a cast that holds onto things, so gossip sticks and grudges
  simmer. The bartender, Rosa, keeps score, which is a pretty fitting job for
  the person behind the bar. The creator wanted a place where AI characters
  share a 3D space with you, and a dive bar seemed like the right fit.
