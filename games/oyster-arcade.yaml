slug: oyster-arcade
title: Oyster Arcade
tagline: Play four arcade games in a CRT cabinet and chase shared high scores
description: >-
  Oyster Arcade is a cabinet with four games inside, styled after an old CRT
  screen. You pick one from the menu, among them Invaders and Carrier Defense,
  and each session is a short score chase: play until the run ends and see how
  your result compares.


  The creator states it was built with Claude Code, and that all of the graphics
  are drawn on an HTML5 Canvas rather than with a separate game engine. The
  retro monitor look runs across every game and ties the collection together.


  Leaderboards are shared, so scores from every game land in a common place. A
  classic shooter-style title next to a defense-themed one gives the cabinet
  some variety from game to game. It is a single-player collection, played in
  the browser.
