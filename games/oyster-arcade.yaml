slug: oyster-arcade
title: Oyster Arcade
tagline: Play four arcade games in a CRT cabinet and chase shared high scores
description: >-
  Oyster Arcade lets you pick any of its arcade games and chase a score. Each
  run is short: you play until it ends and see how your result compares.


  Invaders, a classic shooter-style game. Carrier Defense, a defense-themed
  game. Four arcade games in one collection. Shared leaderboards for scores from
  every game.


  According to Oyster, the game was built without a separate game engine.
