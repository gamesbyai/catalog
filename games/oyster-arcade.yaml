slug: oyster-arcade
title: Oyster Arcade
tagline: Play four arcade games in a CRT cabinet and chase shared high scores
description: >-
  Oyster Arcade is a browser-based arcade cabinet styled after an old CRT
  screen. It bundles four separate games under one menu, including Invaders and
  Carrier Defense. Each session is a short score chase: pick a game from the
  cabinet, play until the run ends, and see how the result compares.


  The cabinet presentation ties the collection together, with a retro monitor
  look across the games. Leaderboards are shared, so scores from every game land
  in a common place rather than staying local to one run. The mix of a classic
  shooter-style title and a defense-themed one gives the collection some
  variety.


  The creator states that it was built with Claude Code, and that all of the
  graphics are drawn on an HTML5 Canvas rather than with a separate game engine.
