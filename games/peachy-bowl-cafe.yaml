slug: peachy-bowl-cafe
title: Peachy Bowl Café
tagline: Peel, slice and fill fruit bowls for customers at a pastel counter
description: >-
  Behind a tiny fruit counter, you're the one peeling, slicing and dicing soft
  fruit into bowls for customers with orders.


  The loop is three moves, starting with a tap on a fruit in its tray. A swipe
  across the board slices that fruit, and only then do you fill the bowl. You've
  got a big bowl and a small serving dish to fill.


  Orders come from customers, like Kai. The order card lists the prep for each
  fruit, and the orange takes more prep than the strawberry, which only gets
  sliced. You make each bowl at whatever pace you like.


  Lv 2 through Lv 6 hint that there's more to unlock as your level climbs.
