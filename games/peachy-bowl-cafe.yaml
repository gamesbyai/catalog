slug: peachy-bowl-cafe
title: Peachy Bowl Café
tagline: Peel, slice and fill fruit bowls for customers at a pastel counter
description: >-
  Run a tiny fruit counter where you peel, slice and dice soft fruit into bowls.


  Customers with orders, such as Kai. Order cards that list the prep each fruit
  needs. Oranges, needing more prep than strawberries. Strawberries, needing
  only a slice. A big bowl and a small serving dish to fill. Bowls made at
  whatever pace you like. Further unlocks as your level climbs, hinted at for
  levels 2 through 6.


  Tap a fruit in its tray. Swipe across the board to slice it. Fill the bowl
  only after that.
