slug: peachy-bowl-cafe
title: Peachy Bowl Café
tagline: Peel, slice and fill fruit bowls for customers at a pastel counter
description: >-
  Behind a tiny fruit counter, you're the one peeling, slicing and dicing soft
  fruit into bowls for customers with orders.


  The loop is three moves, starting with a tap on a fruit resting in its tray. A
  swipe across the wooden board slices that fruit, and only then do you fill the
  bowl. You've got a big pink bowl and a small serving dish to fill.


  The order card in the top left belongs to Kai, who even gets a little portrait
  beside the name. The card lists the prep for each fruit, and the orange ends
  up with more fuss than the strawberry, which only gets sliced.


  You make each bowl at whatever pace you like, which makes sense for a game
  built around prep work.


  A coin count and a level bar keep tabs on your progress, which is more
  bookkeeping than a fruit counter really calls for. A row of slots labeled Lv 2
  through Lv 6 hints that there's more to unlock as your level climbs.


  There's a shop button up top, next to the music, sound and camera buttons.


  The look is soft 3D pastels throughout, which suits all that fruit. There's a
  peach-striped wall, a sunny window framed by curtains and rounded wooden
  props.
