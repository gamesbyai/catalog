slug: clanka-io
title: Clanka.io
tagline: Hunt rival assassins on a crowded ship without shooting any passengers.
description: >-
  Clanker assassins, called clankas, hunt each other across a crowded passenger
  ship. You play one of them in this multiplayer first-person shooter.


  Wandering passengers to blend in with. The run-ending penalty for shooting a
  passenger. Stealth built around watching the crowd and picking the right
  moment.


  Find another assassin in the crowd. Take them out before they catch you.
