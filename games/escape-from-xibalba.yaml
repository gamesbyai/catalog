slug: escape-from-xibalba
title: Escape From Xibalba
tagline: Crawl through a procedural dark maze, light torches, steal relics and
  survive bosses.
description: >-
  You crawl through a dark, procedurally generated maze beneath Xibalba,
  lighting torches, stealing relics and surviving bosses as you go. Every one of
  those gets you a step closer to a way out, which may not exist at all. That's
  a bleak promise to start with.


  You walk with the arrow keys and swing with Z or X. Hold the attack button
  instead of tapping it and you get a strong attack.


  Signs can be read with E, and that same key is what opens the chests you find.


  The camera isn't fixed, so you can turn it with R and zoom in or out with plus
  and minus, which makes sense in a maze where you'll want to see what's around
  you. Escape pauses whenever you need a break.


  The creator had always wanted to make a game and used the jam as the excuse to
  finally do it.


  The title screen sets the mood with brick walls, carved faces and a line
  saying the Lords of Death are waiting.
