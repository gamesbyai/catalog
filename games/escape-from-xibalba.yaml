slug: escape-from-xibalba
title: Escape From Xibalba
tagline: Crawl through a procedural dark maze, light torches, steal relics and
  survive bosses.
description: >-
  You crawl through a dark maze in Xibalba. The game warns that the exit may not
  exist and that the lords of death are waiting.


  A procedurally generated maze. Torches you light, relics you take and boss
  fights you survive. Each one meant to bring you one step closer to a way out.


  Click once to get in. Move with the arrow keys. Press Z or X to attack. Tap
  for a quick hit, or hold it down for a strong attack instead. Press E to read
  a sign or open a chest. Press R to rotate the camera, and use plus and minus
  to zoom in and out.


  fmatzdorf made the game after always wanting to make one. According to them,
  this was the push they needed to finally go for it. The source code is linked
  on GitHub.
