slug: escape-from-xibalba
title: Escape From Xibalba
tagline: Crawl through a procedural dark maze, light torches, steal relics and
  survive bosses.
description: >-
  You crawl through a procedurally generated dark maze in Xibalba, lighting
  torches, taking relics and surviving boss fights. The game's blurb frames each
  of these as one step toward a way out that may not exist.


  Move with the arrow keys. Z or X attacks, and holding the button down gives a
  strong attack instead of a quick one. Press E to read a sign or open a chest,
  and ESC to pause. R rotates the camera, and plus and minus zoom in and out.


  The title screen lists these keys over dark brick walls and rows of carved
  face glyphs, with the line "The lords of death are waiting." A click starts
  the game. The creator says they had always wanted to make a game and treated
  the jam as the excuse to finally do it. The source code is linked on GitHub.
