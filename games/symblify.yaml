slug: symblify
title: Symblify
tagline: Decode a daily phrase by working out what each symbol instructs you to do.
description: >-
  Symblify hides a phrase behind a small invented language of symbols, and a new
  puzzle arrives every day. Each symbol is an instruction that always means the
  same thing, so you work out what each one does and then apply them to crack
  the day's hidden phrase.


  The creator says the mechanics came first and the rest of the game was built
  around them, with Claude as the tool. It borrows from three puzzle styles at
  once: word puzzles, cryptic crosswords, and mathematical notation.


  Solving is a matter of learning the rules of the language as you go. Once a
  symbol's meaning is clear, it holds for the rest of the puzzle, and that is
  what gets you to the answer.
