slug: symblify
title: Symblify
tagline: Decode a daily phrase by working out what each symbol instructs you to do.
description: >-
  Each puzzle gives you a short line of words joined by symbols, and every
  symbol is an instruction. You work out what the line says, type the phrase
  into the answer box and press Enter. A one-line clue sits under the line. You
  have four guesses, and four empty rows below the box hold your attempts.


  The practice puzzle, numbered 0, is rated medium and carries two tags,
  Homophone and Combine. Its line reads ~BRAKE + FAST, and the clue is "The
  first meal of the day". A new puzzle arrives daily.


  A symbol keeps the same meaning from one puzzle to the next, so the game is
  about learning a small language over time and applying it to later lines. An
  FAQ button sits in the top corner of the page.


  The screen is styled as neon lettering on a purple brick wall. The creator
  describes the idea as a cross between word puzzles, cryptic crosswords and
  maths notation, with the mechanics designed first and the game built around
  them.
