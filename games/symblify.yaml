slug: symblify
title: Symblify
tagline: Decode a daily phrase by working out what each symbol instructs you to do.
description: >-
  Each puzzle is a line of words and symbols that spells out a phrase. Work it
  out in four guesses.


  Symbols that mean the same thing every day. A one-line clue per puzzle. A
  practice puzzle to start with. Daily puzzles.


  Type your guess and press Enter.


  A cross between word puzzles, cryptic crosswords and maths notation, according
  to its maker.
