slug: symblify
title: Symblify
tagline: Decode a daily phrase by working out what each symbol instructs you to do.
description: >-
  You're cracking a hidden phrase from a line of symbols and words plus a short
  clue. Every symbol is an instruction that means the same thing each time it
  shows up, so you pick up a small language as you go. The puzzle on screen at
  the start was a practice one, rated medium.


  It showed a tilde in front of BRAKE, a plus sign, and then FAST. Two tags
  above the line name what those symbols do, with the tilde meaning homophone
  and the plus meaning combine. The clue read as a description of the first meal
  of the day.


  So you swap BRAKE for a word that sounds like it, then attach FAST.


  You type your answer into a box and press Enter, and you get four guesses.
  Each guess lands in a row underneath, so you can see what you've already
  tried. A few small counters sit in the corner, and there's an FAQ button if
  the symbols leave you stuck.


  It's a daily puzzle, so the phrase changes from one day to the next.


  The creator wanted something original, a cross between word puzzles, cryptic
  crosswords and maths notation. The mechanics came first, and the game grew
  around them afterward.
