slug: typefall
title: Typefall
tagline: Build your own words or race to match the target before the letters pile up.
description: >-
  Letters drop into columns like falling blocks, and you steer each tile left or
  right before it lands. The bottom row is where the words get built, so every
  tile you place is a choice about what that row will spell.


  If tiles pile up to the top of the screen, the game is over.


  Freestyle mode lets you build any valid dictionary word on the bottom row,
  four to six letters long, and that moves you up a level. Nothing is hidden
  there, so you decide your own target as the letters arrive.


  Wordmatch turns the same setup into a guessing game. There's a hidden target
  word, and your bottom row acts as your current guess, with Wordle-style
  feedback on every letter in it. Getting the word right advances you to the
  next level.


  Geoquest keeps that guessing but asks for the name of a place.


  The category changes from run to run, and it can be countries, world cities or
  US states. A language picker sits on the main menu, which makes sense given
  the tiles scattered around it show letters from several alphabets.


  There's also a high scores screen and an instructions page, both reachable
  from the menu.
