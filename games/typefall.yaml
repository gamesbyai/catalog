slug: typefall
title: Typefall
tagline: Build your own words or race to match the target before the letters pile up.
description: >-
  Letters drop into columns one tile at a time, and whatever lands on the bottom
  row is the word you're working on.


  Freestyle mode, with a level-up for any real 4 to 6 letter dictionary word on
  the bottom row. Wordmatch mode, with the bottom row as your guess at a hidden
  word. Wordle-style feedback on each letter of your guess. Geoquest mode,
  Wordmatch with a place name as the hidden answer. Run-to-run Geoquest
  categories of countries, world cities, US states and US state subdivisions. A
  high scores list. Your choice of game language.


  Nudge each falling tile left or right before it settles. Each tile's position
  matters as well as its letter. The run ends if the stack reaches the top.


  According to skyhighgames042, the idea had been with them for a long time, and
  AI is what made it feasible to build.
