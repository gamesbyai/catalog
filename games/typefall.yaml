slug: typefall
title: Typefall
tagline: Build your own words or race to match the target before the letters pile up.
description: >-
  Typefall is a fast word game that mixes action with puzzle play. Letters come
  down the screen, and you either form words of your own or race to match a
  target word before the board collapses. Each run is a contest between your
  vocabulary and the clock.


  The game combines free-form word building with a goal-driven mode, so you can
  choose between making up your own words and chasing a specific target. That
  pairing adds a strategic layer: you weigh speed against the value of a longer
  word. It was a entry in Vibe Jam 2026 and runs on mobile as well.


  The creator built it with Cursor and says the idea had been around for a
  while, with AI making it feasible to finish. The game is rendered with PixiJS.
