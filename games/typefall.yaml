slug: typefall
title: Typefall
tagline: Build your own words or race to match the target before the letters pile up.
description: >-
  Letters fall into columns one tile at a time, and you steer each dropping tile
  left or right before it lands. The bottom row of the stack is your working
  word. If tiles pile up to the top of the screen, the run ends.


  Three modes change what that bottom row has to do. In Freestyle, you build any
  valid dictionary word of 4 to 6 letters on the bottom row to advance a level.
  Wordmatch turns the row into a guess at a hidden target word, with
  Wordle-style feedback on every letter.


  Geoquest works the same way but the answer is the name of a place. The
  category changes by run and includes countries, world cities, US states and US
  state subdivisions. The menu also has a high scores list, an instructions
  panel, a language selector and sound toggles.


  On the making of it, the creator says they had the idea for a long time and
  that AI made it feasible to build.
