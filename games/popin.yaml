slug: popin
title: POPIN
tagline: Survive escalating waves with auto-aimed shots and pick upgrades
  between levels.
description: >-
  Survive escalating waves in a roguelite where your shots aim themselves, so
  the job is where you stand.


  Auto-targeted shots. Waves that grow tougher and more crowded. A choice of
  upgrades at every level-up, shaping the build for the later waves. Punchy hit
  effects on every shot and kill.


  The creator loves modern roguelites and wanted this one approachable for
  everyone, including players new to the genre.
