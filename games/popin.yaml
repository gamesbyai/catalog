slug: popin
title: POPIN
tagline: Survive escalating waves with auto-aimed shots and pick upgrades
  between levels.
description: >-
  POPIN is a survivor-style roguelite where your shots aim themselves. With
  combat on auto-targeting, you concentrate on positioning while enemies arrive
  in waves that grow tougher and more crowded as the run goes on. It is a
  single-player shooter with roguelite runs.


  The creator loves modern roguelites and wanted this one to be approachable for
  everyone, including players who have never tried the genre. Cursor and Phaser
  were the tools behind this Vibe Jam 2026 entry, which finished 518th of 945.


  Each level-up offers a choice of upgrades, and those picks shape the build
  that has to hold up against the later waves. The emphasis is on feedback:
  simple visuals are paired with punchy hit effects, so every shot and every
  kill gets a clear response.
