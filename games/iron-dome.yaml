slug: iron-dome
title: Iron Dome
tagline: Shoot down incoming rockets and bosses to keep your glowing city standing.
description: >-
  Rockets come in waves, and your job in Iron Dome is to shoot them down before
  they reach a glowing city. It is a single-player arcade missile-defense
  shooter, and a run is a fight to keep the skyline standing as the attacks keep
  coming.


  The premise draws on two sources: the classic Missile Command and the
  real-world Iron Dome system that gives the game its name. In the creator's
  account, it was built mostly with Claude, through Claude Code, and it also
  plays on phones.


  That makes it a defensive game at heart, where the job is to intercept threats
  before they reach the city rather than to chase enemies down. Boss encounters
  break up the regular waves and raise the pressure on the city below.
