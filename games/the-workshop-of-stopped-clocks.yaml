slug: the-workshop-of-stopped-clocks
title: The Workshop of Stopped Clocks
tagline: Search your late grandfather's workshop of stopped clocks before it's cleared.
description: >-
  Your grandfather left you a letter and a key, and his workshop is about to be
  cleared out. It's a first-person 3D room full of stopped clocks, and somewhere
  in it is whatever he meant to leave you.


  A sixty-minute escape room. Every answer hidden somewhere in the room as a
  clue. Drawers to open, notes to read and codes to dial into locks. A drama
  and mystery theme, rated three stars for difficulty and none for fear. Early
  release, currently free, with your progress and records kept on your account
  across devices.


  Sign in with your Google account and open the theme in a browser with WebGL2.
  Search with keyboard and mouse on a PC, or with touch controls if you're on a
  phone.


  The game is one theme on roomescape.dev, which the creator set up to play
  like a real escape room cafe. According to the creator, AI helped write most of the code
  and made the artwork, and they review and rework each version themselves.
