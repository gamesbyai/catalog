slug: skyrescue
title: SkyRescue
tagline: Pilot a rescue helicopter to pull trapped survivors out of disasters
  before time runs out
description: >-
  You fly a rescue helicopter out to a disaster and pick up the people stranded
  there before the countdown hits zero. The settings run from a blazing tower to
  a mountain cliff face, a flooded suburb, a wrecked highway and an arctic
  blizzard. So you're not circling the same city block every time.


  Up top you've got a counter for survivors saved out of five and a timer
  ticking down. A bar in the corner tracks how much damage the helicopter can
  still take.


  There are only three seats onboard, which is a pretty tight number.


  Because of that limit and the timer, you have to decide how many people to
  carry on each trip. A small radar map sits in the corner and shows what's
  nearby, so you can pick where to head next.


  You begin on a helipad marked with a glowing yellow H, with a green beam
  shooting up from it. Around you is a night city with lit windows in the towers
  and a red glow on the burning ones, which makes the beam easy to spot.
