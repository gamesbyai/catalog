slug: skyrescue
title: SkyRescue
tagline: Pilot a rescue helicopter to pull trapped survivors out of disasters
  before time runs out
description: >-
  Fly a rescue helicopter into a disaster zone and pull trapped people out
  before the clock runs down. Each mission weighs how carefully you fly against
  the time you have left.


  Levels from burning towers to an arctic blizzard. Mountain cliffs, flooded
  suburbs and a highway full of crashed cars. Five survivors to rescue in the
  night city, with a little over two minutes. A different way to reach the
  survivors in each place, with no single flying routine.


  marscole76 made it out of a plain liking for helicopter rescue games.
