slug: skyrescue
title: SkyRescue
tagline: Pilot a rescue helicopter to pull trapped survivors out of disasters
  before time runs out
description: >-
  SkyRescue is a helicopter flight game built around emergency extractions. You
  take the controls of a rescue chopper and fly into a series of disaster
  scenes, reaching trapped survivors and bringing them out before the clock
  expires. Each mission is a race between careful flying and the time limit.


  The scenarios change the setting from level to level: burning buildings,
  mountain cliffs, flooded suburbs, highway pileups, and arctic blizzards. Each
  location asks for a different approach to getting close to the people who need
  help, which keeps the flying from settling into one routine.


  The game was made for Vibe Jam 2026 and runs in 3D in the browser with
  Three.js. The creator says it was built with Cursor and Claude, and it is
  playable on mobile as well as desktop.
