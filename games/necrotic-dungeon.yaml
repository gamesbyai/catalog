slug: necrotic-dungeon
title: Necrotic Dungeon
tagline: Explore a dark fantasy dungeon in an old-school crawler with puzzles
  and RPG battles.
description: >-
  Necrotic Dungeon is a dark fantasy dungeon crawler that takes its cues from
  1980s role-playing games and tabletop Dungeons and Dragons. The player
  descends into a haunted dungeon, working through its halls, solving puzzles
  that block the way, and facing the threats that lurk inside.


  The game is framed as a love letter to old-school crawlers, blending
  adventure, puzzle solving, and RPG elements in a gloomy setting. It was
  entered in Vibe Jam 2026, where it placed 57th out of 945 entries, and it is
  playable on mobile devices as well as desktop.


  The creator says the game was built with Lovable, the AI app builder, as part
  of the jam submission. No other tools or models are named for the project.
