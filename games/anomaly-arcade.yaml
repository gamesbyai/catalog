slug: anomaly-arcade
title: ANOMALY ARCADE
tagline: Shoot every asteroid as your run keeps shifting between classic arcade genres.
description: >-
  Within one run, the game keeps mutating and moves between classic arcade
  genres. Throughout, your one objective stays the same: destroy every last
  asteroid.


  Asteroids-style play. Racers, maze chases and shooters. New rules to adapt to
  with each shift.


  clarke_pete1971 says the game grew out of a fondness for uncluttered arcade
  games and a wish to give them a contemporary spin.
