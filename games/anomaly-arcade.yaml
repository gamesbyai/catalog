slug: anomaly-arcade
title: ANOMALY ARCADE
tagline: Shoot every asteroid as your run keeps shifting between classic arcade genres.
description: >-
  Anomaly Arcade is a single-run arcade shooter built around one goal: destroy
  every last asteroid. The catch is that the game will not stay in one form. As
  the run continues, the rules change and the action moves through different
  classic arcade styles, including racers, maze chases, and shooters.


  The appeal is the constant mutation. Instead of picking one retro genre and
  polishing it, the game treats the whole arcade tradition as a collapsing
  universe, where each shift keeps the player adapting while the asteroid
  objective stays fixed. The result is a fast, no-frills experience with a
  modern twist on old ideas.


  The creator says it grew out of a love for straightforward arcade games and a
  wish to update them. According to the creator, it was built with Lovable, and
  it was entered in Vibe Jam 2026.
