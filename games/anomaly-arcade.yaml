slug: anomaly-arcade
title: ANOMALY ARCADE
tagline: Shoot every asteroid as your run keeps shifting between classic arcade genres.
description: >-
  ANOMALY ARCADE gives you one job for the whole run: destroy every last
  asteroid. The game around that job refuses to stay in one form, and as the run
  goes on the rules change and the action moves through classic arcade styles
  such as racers, maze chases and shooters.


  The creator says it grew out of a love for straightforward arcade games and a
  wish to update them with a modern twist. It was put together in Lovable, is
  played solo, and finished 152nd of 945 at Vibe Jam 2026.


  The asteroid objective is the fixed point. Everything else keeps mutating, so
  each shift makes you adapt to new rules while chasing the same goal, in a game
  that treats the arcade tradition as a collapsing universe.
