slug: new-arrivals
title: New Arrivals
tagline: Sort VHS tapes into categories on the shelves of a retro rental store.
description: >-
  New Arrivals is a sorting puzzle set inside a retro video rental store. Tapes
  are waiting to be put away, and the player places each VHS on the shelf that
  matches its category until the store is tidy. It plays in a browser in 3D and
  is set up to work on mobile devices too.


  The premise comes from real hobby experience: the creator runs and visits
  local VHS swaps and enjoys arranging tapes into quirky collections. That
  affection for the format shapes the store setting, where the goal is a
  well-organized shelf rather than speed or combat.


  It was a Vibe Jam 2026 entry and placed 251st out of 945. The creator built it
  with Claude Code, and the 3D scene runs on Three.js.
