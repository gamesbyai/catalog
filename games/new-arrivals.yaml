slug: new-arrivals
title: New Arrivals
tagline: Sort VHS tapes into categories on the shelves of a retro rental store.
description: >-
  Tapes are waiting to be put away in New Arrivals, a sorting puzzle set in a
  retro video rental store. You place each VHS on the shelf that matches its
  category, and the job is done when the whole store is tidy.


  The premise comes from real hobby experience: the creator runs and visits
  local VHS swaps and enjoys arranging tapes into quirky collections. Claude
  Code went into the build, the 3D store runs on Three.js in a desktop browser
  or on a phone, and the game finished 251st of 945 at Vibe Jam 2026.


  That affection for the format shapes the store setting, down to the VHS on
  every shelf. It is a casual puzzle, and the reward for getting every category
  right is a well-organized shelf.
