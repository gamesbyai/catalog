slug: return-to-castle-hu-nam
title: Return To Castle Hu-Nam
tagline: Beam office workers off Earth while shooting bureaucrats in a
  first-person retro shooter.
description: >-
  Walk through office floors in a first-person view and shoot the bureaucrats in
  your way, then get close to the office workers so they beam up to your
  cruiser. It's modeled on the very first Wolfenstein, and you're the aliens,
  sent to free humans from Red Tape.


  Rescuing has a catch. If a worker's manager is standing too close, the beam
  won't work and the manager keeps shouting "Not so fast!" until everyone has
  moved away. But you earn a danger bonus when managers are just outside that
  range as the worker beams out, and it stacks with more of them.


  Each rescued worker thanks you in a primitive little voice, which is a funny
  nod to old Choplifter.


  Buildings are split into floors, with corporate and government bureaucrats,
  mid-bosses and bosses inside. Between buildings you cross an outdoor
  battlefield, where the exit door opens once every enemy soldier on the map is
  down. Bigger things fight in the background, but you only need to reach that
  door.


  The screen keeps a lot in view: a minimap, a counter of civilians liberated
  out of the level's total, vitality, plasma ammo, score and floor number. A
  synergy meter sits in the middle, and you can call an ally. Wall notes poke
  fun at office life, like a boiler room where they send people who ask
  questions.


  The creator says the goal is to liberate all of Earth, though that ending is
  less developed than the rest. The game was built through many rounds with
  Claude, after starting in a game-focused AI tool.
