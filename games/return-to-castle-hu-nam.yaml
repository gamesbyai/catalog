slug: return-to-castle-hu-nam
title: Return To Castle Hu-Nam
tagline: Beam office workers off Earth while shooting bureaucrats in a
  first-person retro shooter.
description: >-
  Walk close to an office worker and beam them up to your space cruiser. You're
  the alien invader, rescuing Earth's red-tape-choked Hu-Nams in a first-person
  shooter that moves like the earliest Wolfenstein games.


  Office managers who block rescues while they stand too close. A danger bonus
  for rescues with managers lurking just out of range. Multi-floor office
  buildings full of corporate and government bureaucrats, with mid-bosses and
  bosses. Outdoor battles between buildings. Freeing all of Earth as the end
  goal.


  exedexes1 started it in a game-focused AI tool and carried it on in Claude
  once it was mostly stable.
