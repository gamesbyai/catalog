slug: return-to-castle-hu-nam
title: Return To Castle Hu-Nam
tagline: Beam office workers off Earth while shooting bureaucrats in a
  first-person retro shooter.
description: >-
  You play the alien invader, and the goal is to rescue office workers by
  walking close to them. Get within range and a worker is beamed up to your
  cruiser, with a short "Thank you!" sound. The view and movement follow the
  earliest Wolfenstein-style first-person shooters.


  A worker cannot beam out while their office manager stands too near, and the
  manager shouts "Not so fast!" until all managers are out of range. Rescuing a
  worker while managers wait just outside that range earns a danger bonus, and
  several managers just beyond it stack the bonus higher.


  Each office building runs through multiple floors filled with corporate and
  government bureaucrat enemies, with mid-bosses and bosses along the way.
  Between buildings is an outdoor military battle. There you reach the far end,
  and the door opens once every enemy soldier on the map is defeated. Larger
  fighters clash in the background and can be ignored.


  The stated end goal is to liberate all of Earth, though that ending is less
  developed than the rest. The creator made it with Claude after starting in a
  game-focused AI tool, and describes it as the project that got the most
  effort.
