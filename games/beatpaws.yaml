slug: beatpaws
title: BeatPaws
tagline: Guide bouncing cats through neon lanes, hitting notes and dodging
  hazards to the beat.
description: >-
  BeatPaws is part rhythm game, part arcade dodger, and it starts the moment the
  page opens. Cats bounce along neon beat lanes in 3D, and your job is to guide
  them. You hit the musical notes as they arrive and steer clear of the hazards
  on the track, all in time with the beat.


  Its design was shaped by the idea of connected games that players can jump
  between instantly. Built with Codex, it came 468th of 945 at Vibe Jam 2026.
  Three.js renders the 3D stage, and the cats themselves are AI-generated.


  The look draws on arcade rhythm games and retro neon worlds, and the cats, the
  music and the motion all aim for an upbeat feel from the first second of a
  run.
