slug: beatpaws
title: BeatPaws
tagline: Guide bouncing cats through neon lanes, hitting notes and dodging
  hazards to the beat.
description: >-
  Pick a song, a difficulty and a cat, then tap Play. You can preview the beat
  first, so you know what the track sounds like before you commit to it.


  Once you're in, your cat bounces down neon lanes on a 3D stage, hits the
  musical notes as they reach it, and dodges the hazards sitting in the way.


  The setup screen has more choices than you'd expect for a game that wants you
  playing right away. There's a nickname already filled in, a song list that
  includes Neon Alley Sprint, a difficulty setting that starts on Easy, and a
  country picker.


  The map is its own pick too. SF Bay Stage shows a dusk skyline over the water,
  with a keytar cat on one side and a guitar cat on the other, which is a pretty
  good reason to browse before you play.


  Solo play is set up for the A, S, D and F keys. A trophy button sits in the
  top corner of the screen.


  The cats are AI-generated, and you choose between several of them, like the
  Mint DJ. The creator wanted it to feel joyful as soon as it opens, drawing on
  arcade rhythm games, retro neon worlds and the idea of connected games you can
  jump between.
