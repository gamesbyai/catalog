slug: beatpaws
title: BeatPaws
tagline: Guide bouncing cats through neon lanes, hitting notes and dodging
  hazards to the beat.
description: >-
  Choose a song, a difficulty, a map and a cat, then press Play to jump straight
  into a round. No login is needed.


  Once a round starts, cats bounce along beat lanes. You hit the musical notes
  as they reach you, while also dodging the hazards that sit between them.


  The 1P Solo mode uses the ASDF keys. Players can set a nickname, and the field
  starts out filled with a name like Turbo Pouncer 17 or Midnight Nap 43.
  There's also a country selector.


  The included track is Neon Alley Sprint, set to Easy by default.


  The SF Bay Stage is one of the playable maps. Players choose their cat from a
  set of characters, starting with Mint DJ.


  The cats are AI-generated. swhan0329 took cues from arcade rhythm games and
  the idea of linking games so players can hop between them.
