slug: beatpaws
title: BeatPaws
tagline: Guide bouncing cats through neon lanes, hitting notes and dodging
  hazards to the beat.
description: >-
  Pick a song, difficulty, map and cat on the start screen, then press Play. The
  Players menu is set to 1P Solo on the ASDF keys, and a nickname field and a
  country selector sit alongside the track choices.


  On the 3D stage, cats bounce along neon beat lanes. You hit musical notes as
  they arrive and dodge hazards between them. A round starts as soon as you tap
  Play, with no login in the way.


  The start screen defaults to the track Neon Alley Sprint on Easy. The SF Bay
  Stage map shows a night waterfront with a cat on a keytar at the left and a
  cat on a guitar at the right. A row of character portraits lets you choose
  your cat, starting with Mint DJ. A trophy button sits in the top corner.


  The cats are AI-generated. The creator took cues from arcade rhythm games and
  retro neon scenery, and from the idea of linking games so players can hop
  between them.
