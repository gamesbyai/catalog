slug: tower-tumble
title: Tower Tumble
tagline: Bounce off walls and backflip your way up an endless pixelated tower.
description: >-
  Tap left or right to jump, and keep climbing. You're a little pixelated guy
  scrambling up a tower of green platforms, and the floor counter in the corner
  goes up as you get higher.


  The trick is momentum. The faster you run, the bigger your jumps get, and if
  you hold the jump button you charge up for an even higher leap.


  Walls aren't a boundary here, they're a tool, because bouncing off them gives
  you extra speed. You can also skip past platforms to build combo points, which
  is a nice reason to go for the risky jump instead of the safe one.


  The creator also mentions backflips for style points, so it's worth showing
  off a little on the way up.


  It's a 3D take on Icy Tower, a childhood favorite of the creator Andreas
  Kruszakin-Lidoska that doesn't exist anymore. The look is chunky pixel art,
  with brown walls on both sides and a warm, grainy, old-screen glow over
  everything, which suits the nostalgia pretty well.


  There's a leaderboard too, so you're climbing against other players and not
  just your own best floor.
