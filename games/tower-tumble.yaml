slug: tower-tumble
title: Tower Tumble
tagline: Bounce off walls and backflip your way up an endless pixelated tower.
description: >-
  Climb an endless tower by jumping from one green platform to the next,
  starting from the ground floor. A counter in the corner shows your current
  floor and your points. Build speed by running, and a faster run gives a bigger
  jump.


  Hold the jump button to charge a higher leap. Bounce off the tower walls to
  gain momentum, and skip platforms to earn combo points. Backflips in the air
  add style points. Some platforms are red, set apart from the green ones.


  The tower is drawn in chunky pixel art with a 3D look and a grainy, retro
  screen filter. A small orange character climbs between two brown walls. Scores
  go to an online leaderboard, so you can compare climbs with other players. The
  creator based it on Icy Tower, a childhood favorite.
