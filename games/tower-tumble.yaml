slug: tower-tumble
title: Tower Tumble
tagline: Bounce off walls and backflip your way up an endless pixelated tower.
description: >-
  Run along the ground floor, jump for the first platform and keep climbing an
  endless tower.


  Bigger jumps the faster you're running. A charged leap when you hold the jump
  button. Walls that build momentum when you bounce off them. Combo points for
  skipping platforms. Style points for midair backflips. Red platforms among the
  steps. An online leaderboard.


  andreaskruszaki based it on Icy Tower, a childhood favorite that no longer
  exists.
