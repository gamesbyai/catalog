slug: werewolf-game
title: werewolf game
tagline: Play a round of the social deduction game Werewolf and hunt for hidden wolves
description: >-
  This is a digital take on Werewolf, the social deduction party game in which
  players are secretly assigned roles and a hidden group of wolves tries to
  eliminate the village. Rounds move between night and day phases, with
  suspicion, accusations, and voting deciding who survives to the next turn.


  The project began as part of a research effort, which gives it a slightly
  different focus from a typical hobby build. The repository is small and
  presents itself simply, so the appeal lies in the classic bluffing and
  deduction loop rather than in elaborate presentation or extra features.


  According to the repository description, the developer is building it for a
  research project and uses Claude Code, and the repository is tagged as
  vibe-coded. Development appears to be ongoing, so the details of the rules and
  interface may change as the work continues.
