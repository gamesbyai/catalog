slug: lilypad-logic
title: Lilypad Logic
tagline: Guide a frog across a sinking pond, eating every fly before reaching home.
description: >-
  Lilypad Logic is a grid-based puzzle game in which you steer a frog across a
  pond that is slowly sinking. Each level asks you to eat every fly on the
  board, then reach the home tile. You plan your hops carefully, since the
  surface under you does not stay put.


  The puzzle mechanics build on each other. Logs carry the frog along, and
  crumbling lily pads give way after use, so the order of your moves matters as
  much as the route. Music and visual effects accompany the hopping, and the
  game is playable on mobile devices.


  The creator built it with Cursor for Vibe Jam 2026. The stated aim was to see
  how quickly AI-assisted coding could turn a simple frog-on-a-grid prototype
  into a complete puzzle game with several mechanics, music, and visual effects.
