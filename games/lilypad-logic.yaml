slug: lilypad-logic
title: Lilypad Logic
tagline: Guide a frog across a sinking pond, eating every fly before reaching home.
description: >-
  Hop a frog across a pond where each tile type behaves differently. Eat every
  fly, then land on the gold home tile. The gold home tile counts only after
  every fly is eaten.


  Ten stages with names and short hints, such as Double Back on stage 2. Plain
  lilypads that sink when you leave them, and lotus pads that hold for two
  landings before they sink. Crumbling pads that turn into rock walls after you
  step on them. Logs that carry the frog along their arrows, and rock blocks
  that stop movement. Field guide to every tile type.


  According to the creator, it started as a frog on a grid and grew into a
  puzzle game with several mechanics, plus music and visual effects.
