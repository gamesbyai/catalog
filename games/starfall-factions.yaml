slug: starfall-factions
title: Starfall Factions
tagline: Mine pastel planets, take risky contracts, and upgrade your ship as a
  broke rookie pirate.
description: >-
  You start Starfall Factions as a broke rookie pirate, and the money has to
  come from somewhere. It is a cozy open-world space adventure in which you fly
  between pastel planets, mine resources, and take on risky contracts to earn
  it.


  The earnings go into ship upgrades, and the upgrades let you handle bigger
  jobs, so the loop runs from exploring to gathering to spending and back out
  again. Factions, salvage, and trouble in this strange, living star system
  shape what you find along the way.


  The creator, working with Claude Code, aimed for a smaller, more focused take
  on the feeling of getting lost in a beautiful sci-fi world. That is why the
  look is soft and pastel rather than gritty.
