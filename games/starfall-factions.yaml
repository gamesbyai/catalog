slug: starfall-factions
title: Starfall Factions
tagline: Mine pastel planets, take risky contracts, and upgrade your ship as a
  broke rookie pirate.
description: >-
  When the game loads, you get a menu with two cards: a Singleplayer one with a
  Begin button, and a Cooperative one that's dimmed behind a coming soon lock.


  Starting solo, you choose a faction and paint your ship, which sets you up as
  a rookie pirate with nothing in your pockets. Then you head out into a pastel
  star system that's open for you to roam.


  You land on planets and mine them for resources, and those resources go into
  upgrading your ship. Contracts are another way to make money, though they're
  risky. Salvage gives a pirate on a budget one more thing to chase.


  The system around you is described as alive, which is a funny thing to read
  about a place crowded with rival factions and trouble.


  The creator was inspired by the feeling of losing yourself in a gorgeous
  science fiction setting. They wanted to shrink that idea into something cozier
  and tighter, so the draw is slowly figuring out what the system is hiding
  rather than crossing a giant map.


  The menu tags the build you start with as version 0.5.0, called Pirate Cut.
