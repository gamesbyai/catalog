slug: starfall-factions
title: Starfall Factions
tagline: Mine pastel planets, take risky contracts, and upgrade your ship as a
  broke rookie pirate.
description: >-
  The game opens on a Select Your Journey screen, and the solo card there
  promises you'll choose a faction, give your ship a paint job and settle the
  fate of whatever systems you come across.


  Next to it, a co-op card sits locked behind a coming-soon tag, so for now
  you're flying alone. The build on that screen is version 0.5.0, cheekily
  nicknamed the Pirate Cut, which suits a game where you play a broke rookie
  pirate.


  You really do start with nothing, and that money has to come from somewhere.
  You earn it by flying between pastel planets, mining resources and taking on
  risky contracts. Whatever you make goes into ship upgrades, and a better ship
  lets you handle bigger jobs.


  The adventure runs on a tidy loop where you explore, gather and spend, then
  head back out again.


  The star system you're working in is strange and alive. It's full of factions,
  salvage and trouble, and they shape what you run into along the way. It's an
  open world, and a cozy one.


  BrunoOBunito wanted to capture what it's like to lose yourself in a gorgeous
  sci-fi setting, only scaled down into something cozier and tighter, which is
  why it looks soft and pastel instead of gritty.
