slug: starfall-factions
title: Starfall Factions
tagline: Mine pastel planets, take risky contracts, and upgrade your ship as a
  broke rookie pirate.
description: >-
  Starfall Factions is a cozy open-world space adventure. You play a broke
  rookie pirate flying between pastel planets, mining resources, and taking on
  risky contracts to earn money. Each run is a loop of exploring, gathering, and
  spending your earnings on ship upgrades so you can handle bigger jobs.


  The setting is a strange living star system, where factions, salvage, and
  trouble shape what you find as you explore. The creator aimed for a smaller,
  more focused take on the feeling of getting lost in a beautiful sci-fi world,
  favoring a soft pastel look over gritty space combat.


  It was entered in Vibe Jam 2026 and runs on Three.js. The creator's submission
  names Claude Code as the tool used to build it.
