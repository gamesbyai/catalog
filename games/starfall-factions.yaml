slug: starfall-factions
title: Starfall Factions
tagline: Mine pastel planets, take risky contracts, and upgrade your ship as a
  broke rookie pirate.
description: >-
  Solo play is available for now, with co-op still coming. You start as a broke
  rookie pirate with nothing, in an open-world star system you can roam around.


  Mining resources on the planets you fly between. Risky contracts as another
  way to earn. Ship upgrades, funded by whatever you make, and bigger jobs a
  better ship can take. Factions, salvage and trouble shaping what you run into
  along the way. You explore, gather, spend what you earn, and then head back
  out.


  BrunoOBunito wanted a smaller, cozier and more focused take on the feeling of
  getting lost in a sci-fi setting.
