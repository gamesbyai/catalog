slug: technical-debt
title: TECHNICAL DEBT
tagline: Juggle groceries, debt, and clutter for a family chasing a vacation,
  then restart.
description: >-
  The aim is to collect 100,000 PALM Points before the family's debt catches up.
  You play a parent laid off after an employer automated the job. Putting
  household needs on credit earns points toward a vacation package, and hitting
  the total shows who actually goes on the trip.


  Each purchase is a choice between costly goods that show up reliably and cheap
  ones that might be late or barely count as goods. Orders accumulate as boxes,
  so you resell what you don't need on Baylist before storage runs out. Cash,
  credit, storage, and your standing with Deborah and DJ all need watching.


  Bankruptcy is built into the loop. You declare it, carry over permanent
  lessons, and restart knowing more about how the system works. According to the
  creator, the first bankruptcy is intended and shows how progression works.


  The screen imitates an old family computer with a CRT filter and 1-bit art,
  with dark comedy throughout. Tabs cover MailBox, BUYMORE, Haulu, Baylist,
  Vantage One, and Lessons. Red blinking badges flag unread mail and actions
  waiting on you. A movable jukebox plays music, and the menu bar adjusts sound,
  CRT strength, and reduced motion, and offers a full reset.
