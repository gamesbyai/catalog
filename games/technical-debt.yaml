slug: technical-debt
title: TECHNICAL DEBT
tagline: Juggle groceries, debt, and clutter for a family chasing a vacation,
  then restart.
description: >-
  You're trying to reach 100,000 PALM Points, and once you do, you find out who
  actually makes the trip to the beach and whether anyone comes back.


  You earn those points by charging what the household needs, groceries
  included, while you keep your promises to Deborah and DJ. Your old employer
  automated your job with work you helped train it to do, so the family leans on
  credit.


  Shopping is a choice between paying more for reliable goods and grabbing
  discount ones that might arrive late, or might only technically be goods,
  which is a grim joke about cheap delivery. Whatever you buy piles up at home.
  So you sell the extras through Baylist before the boxes fill every room.


  Cash, credit, storage, family relationships and a vacation obsession that gets
  more persuasive all need balancing at once.


  When the debt closes in, you declare bankruptcy, keep some permanent lessons,
  and start over knowing the system better. The first bankruptcy is designed to
  happen, because it reveals how progression works instead of punishing you.
  That's a kind choice for a game about money trouble.


  It's a dark comedy dressed as a cheerful old family computer, with tabs for
  MailBox, BUYMORE, Haulu, Baylist, Vantage One and Lessons, and blinking red
  badges when something needs you.
