title: Vending Machine Tycoon
tagline: Place vending machines around town, avoid getting caught, and build up
  passive income.
description: >-
  Place each vending machine around town and collect the money it earns. Where
  you put the next machine shapes how quickly your money grows. Expanding and
  staying out of trouble pull in different directions.


  Passive income from every vending machine you add. The risk of getting caught
  as the operation expands. Adventure and strategy elements in one 3D game.
