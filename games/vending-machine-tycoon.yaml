slug: vending-machine-tycoon
title: Vending Machine Tycoon
tagline: Place vending machines around town, avoid getting caught, and build up
  passive income.
description: >-
  Vending Machine Tycoon is a 3D strategy game about passive income with a
  catch. You choose where to place each vending machine around town, then
  collect the profits while trying not to get caught, and the income keeps
  coming as the operation expands.


  Every machine you add feeds your earnings, so the choice of where to put the
  next one shapes how quickly your money grows. It runs on Three.js and was made
  with Claude Code. Out of 945 Vibe Jam 2026 entries, it came 498th.


  The risk of getting caught adds tension to what would otherwise be a simple
  money-building loop. Expanding and staying out of trouble pull in different
  directions, so a run is a balance between the two.
