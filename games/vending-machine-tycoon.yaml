slug: vending-machine-tycoon
title: Vending Machine Tycoon
tagline: Place vending machines around town, avoid getting caught, and build up
  passive income.
description: >-
  Vending Machine Tycoon is a 3D strategy game about setting up vending machines
  and earning money from them. You choose where to place each machine, then
  collect the profits while trying not to get caught. Each run is a balance
  between expanding your operation and staying out of trouble.


  The game centers on chasing passive income. Every machine you add feeds your
  earnings, so the choice of where to put the next one shapes how quickly your
  money grows. The risk of getting caught adds tension to what would otherwise
  be a simple money-building loop. It runs in the browser and is playable on
  mobile.


  It was entered in Vibe Jam 2026 and placed 498th out of 945 entries. The
  creator built it with Claude Code, and the game runs on Three.js.
