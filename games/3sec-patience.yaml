slug: 3sec-patience
title: 3Sec Patience
tagline: Hold a button for exactly three seconds using only your sense of time.
description: >-
  3Sec Patience is a minimalist timing challenge. The player presses and holds a
  single button, then releases when they believe exactly three seconds have
  passed. There is no visible timer and no hints, so each attempt depends
  entirely on the player's internal sense of time.


  The appeal is in its simplicity. With no clock to watch and nothing to
  distract, every try comes down to feel, which makes it easy to pick up and
  hard to stop repeating. It suits short sessions on a phone and can be passed
  around for friends or family to compare attempts.


  The creator says the idea came from wanting a simple game without ads that
  could keep their kids busy for at least ten minutes. It was entered in Vibe
  Jam 2026, and the creator built it with Claude Code.
