slug: valthera
title: Valthera
tagline: Explore a fantasy world, fight bosses, gather resources and craft gear
  with other players.
description: >-
  Valthera is a free 2D multiplayer RPG set in a fantasy world. Players explore
  the map, fight bosses, gather resources, and craft items, building up their
  characters over time while sharing the world with other adventurers online.


  The game combines familiar MMO loops in a 2D format: gathering feeds crafting,
  crafting supports stronger equipment, and bosses give a reason to use it.
  Playing alongside other people is part of the design rather than an extra. It
  also supports mobile devices, so it can be played away from a desktop.


  It was entered in Vibe Jam 2026, where it placed 231st out of 945 entries. The
  creator says it comes from a long-held passion for AI and a dream of making a
  game, and that they built it with Codex.
