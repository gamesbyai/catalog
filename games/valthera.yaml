slug: valthera
title: Valthera
tagline: Explore a fantasy world, fight bosses, gather resources and craft gear
  with other players.
description: >-
  Explore a fantasy world, fight bosses, and build up your character over time
  in this free role-playing game.


  MMO-style loops, pressed into 2D. Resource gathering as input for crafting.
  Stronger equipment from crafted items. Bosses as a reason to use your
  equipment. Other adventurers sharing the world online, part of the design.


  MunliteARG says the game comes from a long-held passion for AI and a dream of
  making a game.
