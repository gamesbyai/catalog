slug: valthera
title: Valthera
tagline: Explore a fantasy world, fight bosses, gather resources and craft gear
  with other players.
description: >-
  Valthera is a free 2D multiplayer RPG set in a fantasy world. You explore the
  map, fight bosses, gather resources, and craft items, building up your
  character over time while sharing the world with other adventurers online.


  It comes, the creator says, from a long-held passion for AI and a dream of
  making a game, and they built it with Codex. It placed 231st of 945 in Vibe
  Jam 2026, and it also runs on phones, so the world is there away from a
  desktop too.


  The loops are familiar from MMOs, pressed into 2D: gathering feeds crafting,
  crafting leads to stronger equipment, and bosses give you a reason to use it.
  Other players are part of the design, not an extra.
