slug: a-low-poly-dungeon-game
title: A Low Poly Dungeon Game
tagline: Fight skeletons and find three keys in a seeded first-person dungeon to
  claim the crown.
description: >-
  A Low Poly Dungeon Game is a first-person dungeon crawler with
  PlayStation-style visuals. Each run starts from a seed, which you can type in
  or randomize, and that seed builds a labyrinth of rooms, locked gates, and
  skeletons. Three zones are sealed in order by Bronze, Silver, and Gold gates,
  and each key is in a chest in the zone before it.


  Combat rewards timing. A tap is a quick slash, holding the button charges a
  heavy chop, and a guard only parries if raised at the right moment. Stamina
  limits every action. Armored skeletons hit harder, and some throw a slow crush
  that breaks through a guard. Health potions and fireball scrolls help. The
  Gold key opens the Grand Hall, where the boss cannot be outrun, and the crown
  in the vault ends the run.


  It was made in Godot 4.6 with art from several itch.io asset packs. The
  creator discloses AI assistance for code and sounds, with generated audio
  mixed with CC0 packs. Difficulty can be changed mid-run, and mobile controls
  are included.
