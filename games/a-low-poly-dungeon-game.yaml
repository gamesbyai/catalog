slug: a-low-poly-dungeon-game
title: A Low Poly Dungeon Game
tagline: Fight skeletons and find three keys in a seeded first-person dungeon to
  claim the crown.
description: >-
  Every dungeon is built from a seed, and the same seed always produces the same
  layout, boss included. Type one on the title screen or hit Randomize, then
  enter a first-person labyrinth of rooms, locked gates, and skeletons, drawn in
  a PSX style with low-poly models and posterized light.


  The dungeon has three zones, each sealed by a gate. Bronze, Silver, and Gold
  keys sit in chests in the zone before each gate. The Gold key opens the Grand
  Hall, where the gate shuts behind you. Defeat the boss, take the key to the
  treasure vault, and pick up the crown to end the run.


  Combat uses stamina. A tap is a quick slash, holding the attack button charges
  a heavy chop, and a guard raised at the right moment parries. Armored
  skeletons hit harder, and some throw a slow crush that breaks through a guard,
  so you step out of the way. Health potions restore health, and scrolls fuel a
  fireball in your left hand.


  Difficulty can be changed mid-run, and all keys can be remapped in settings.
  Touch controls add a virtual stick, drag-to-look, and on-screen attack and
  guard buttons. The creator lists the average session as a few minutes.
