slug: link-state
title: Link State
tagline: Guide a data packet up through hardware zones, pinging and phasing past
  firewalls.
description: >-
  Link State is a short 2D platformer in which you play a lone data packet
  climbing through a decaying computer. Across five zones, from the Legacy
  Partition and Cooling Towers to the GPU Glitch-scape and the Wireless Antenna,
  you move upward to deliver a final message to the User. A full run takes about
  five minutes.


  Two abilities shape the climb. System Ping sends out a sonar pulse that
  reveals invisible platforms and hidden data paths, while Phase Dash lets you
  ghost through firewalls, security gates, and enemies. Both draw on the same
  stamina pool as boosting, though boosting is free inside updrafts, so you keep
  weighing where to spend signal strength. Neon visuals, CRT scanlines, and a
  dark synth mood set the tone.


  The creator built it for an AI game jam, where it placed third of 29 entries.
  They used Google Gemini for prototyping, code, and Sonic Pi sound effect
  scripts, worked in JetBrains Rider with Gemini, and made the music with ACE
  Step 1.5.
