slug: wagon-bones
title: Wagon Bones
tagline: Roll d12 dice, build scoring hands, and travel the Oregon Trail one leg
  at a time.
description: >-
  Wagon Bones swaps the playing cards of Balatro for d12 dice. Each travel day,
  the pouch deals 8 dice and you roll them. You then lock in one to five as your
  hand. Their pips count as miles, and multipliers scale that total.


  The route starts in Independence, Missouri and runs 8 legs to Oregon City.
  Each leg has two trail rounds and a boss round. A round gives you 4 days and 4
  rerolls by default, and the run ends if the days run out before you reach the
  mile target. Hands are built from pairs, straights, and n-of-a-kind. You can't
  discard.


  A run opens with a choice of profession, which changes things like rerolls,
  money, and slots, and a difficulty, which can add cursed equipment or remove
  rerolls. Each cleared round brings a trail event with choices. After that you
  visit a shop for equipment, consumables, permits, and booster packs. Equipment
  effects apply left to right, so order matters.


  Each boss adds a rule for one fight. The Inspector shrinks your hand size, The
  Marathon quadruples the target, and The River counts only straights and high
  values. You can see the boss ahead of time and skip a round for a tag reward.
  After Oregon City, endless mode continues up to leg 39. The creator made it
  with heavy AI help, including the dice sprites and card art.
