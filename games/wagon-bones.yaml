slug: wagon-bones
title: Wagon Bones
tagline: Roll d12 dice, build scoring hands, and travel the Oregon Trail one leg
  at a time.
description: >-
  Wagon Bones swaps Balatro's playing cards for d12 dice and sends them down the
  Oregon Trail, one leg at a time.


  Each travel day, the pouch deals you eight dice, and once you've rolled them
  you lock in one to five as your hand. The pips on those dice count as miles,
  which ties the scoring to the trip pretty nicely, and multipliers scale the
  total from there.


  Hands come from pairs, straights and n-of-a-kind, and there's no discarding at
  all.


  You get four days and four rerolls a round by default, and if the days run out
  before you've covered the mile target, the run's over. The trail itself goes
  from Independence, Missouri to Oregon City in eight legs, each with two trail
  rounds and a boss round. Oregon City isn't even the end, because an endless
  mode keeps going all the way to leg 39.


  Before you set off, you pick a profession and a difficulty. The profession
  changes things like your rerolls, money and slots, while the difficulty can
  saddle you with cursed equipment or take rerolls away.


  Every round you clear brings a trail event with choices to make, and after
  that a shop with equipment, consumables, permits and booster packs. Equipment
  effects kick in from left to right, so the order you drag your pieces into
  actually matters.


  Each boss bends the rules for a single fight. The Inspector shrinks your hand
  size and The Marathon quadruples the target, while The River is pickier and
  only counts straights and high values. At least you can see each boss coming,
  and you can skip a round for a tag reward.


  So between the profession, the trail events, the shop and the bosses, there's
  a lot more to a run than what you roll.


  The creator, voltron2112, leaned heavily on AI to make it, and that includes
  the dice sprites and the card art.
