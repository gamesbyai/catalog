slug: the-house
title: The House
tagline: Explore an unsettling house and solve its puzzles as the place seems to
  watch you.
description: >-
  The House is a browser-based horror adventure with puzzle elements. The player
  explores a strange house that the game hints is aware of whoever walks through
  it, working through its rooms and solving what they present. The tone leans
  toward quiet dread rather than action.


  The game is based on the novel House of Leaves, and the creator says it grew
  out of a longtime admiration for that book. That source shapes its unsettling
  premise, in which the house itself feels like the main presence. It also
  placed 512th out of 945 entries in Vibe Jam 2026, and it is built for mobile
  play as well as desktop.


  The creator built it with Codex, and the game runs on the PixiJS rendering
  library for its visuals, which keeps the whole experience playable directly in
  a web browser.
