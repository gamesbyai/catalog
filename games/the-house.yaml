slug: the-house
title: The House
tagline: Explore an unsettling house and solve its puzzles as the place seems to
  watch you.
description: >-
  The House is a browser-based horror adventure with puzzle elements, set in a
  strange house that seems to know you are there. You explore it room by room
  and solve what each room presents, while the game keeps hinting that the house
  is aware of whoever walks through it.


  It is based on the novel House of Leaves, and the creator says it grew out of
  a longtime admiration for that book. They made it with Codex and the PixiJS
  rendering library, it plays on a phone or a computer, and it placed 512th of
  945 in Vibe Jam 2026.


  That source shapes the unsettling premise. The house itself feels like the
  main presence, and the tone leans toward quiet dread.
