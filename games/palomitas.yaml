slug: palomitas
title: Palomitas
tagline: Play a pigeon who swipes food to stay alive.
description: >-
  In Palomitas you play a pigeon, and the only way to get food is to steal it.
  It is a single-player 3D adventure where survival depends on eating, so a run
  is a hungry scavenging loop: look for something edible, grab it and try to
  keep yourself fed.


  The creator says they wanted to try a completely vibe-coded project instead of
  doing everything by hand, as they usually do. Cursor handled the building, it
  runs on Three.js in the browser, and it ranked 368th of 945 entries at Vibe
  Jam 2026.


  The premise is small and funny, casting a city bird as a scrappy thief. The
  title is Spanish for popcorn, which fits a pigeon that spends the whole game
  hunting for food scraps to survive.
