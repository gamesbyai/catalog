slug: palomitas
title: Palomitas
tagline: Play a pigeon who swipes food to stay alive.
description: >-
  Palomitas is a 3D adventure in which you control a pigeon. Survival depends on
  food, and the only way to get it is to steal it. A run is a hungry scavenging
  loop: you look for something edible, grab it, and try to keep yourself fed.


  The premise is small and funny, casting a city bird as a scrappy thief. The
  title is Spanish for popcorn, which fits a pigeon hunting for scraps. It was
  entered in Vibe Jam 2026, where it ranked 368th out of 945 entries.


  The creator says they wanted to try a completely vibe-coded project instead of
  doing everything by hand as they usually do. They built it with Cursor, and it
  runs in the browser on Three.js.
