slug: palomitas
title: Palomitas
tagline: Play a pigeon who swipes food to stay alive.
description: >-
  In Palomitas, you play a pigeon, and the only way to get food is to steal it.
  Palomitas is the Spanish word for popcorn.


  A city pigeon as the lead character. Survival tied to eating. Adventure in 3D.


  Look for something edible, then grab it. Try to keep yourself fed.


  lexandermorgan made it with an AI coding tool handling the building. "I wanted
  to try a completely vibe-coded project rather than doing everything manually
  like I usually do," the creator writes.
