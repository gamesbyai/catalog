slug: ironclash
title: ironclash
tagline: Fight multiplayer battles from tanks, helicopters, and FPV drones.
description: >-
  The round comes down to sectors. One side leads an armored push with a tank
  and infantry, capturing sectors to reach a point target before the timer runs
  out. The other side flies FPV drones out of cover to break that advance and
  hold out until time expires.


  You don't choose which job you get, because your team and role are assigned
  when you join.


  All you need to get in is a callsign of up to 16 characters. Helicopters are
  part of the vehicle mix too, alongside the tanks and drones.


  The round goal on the title screen is to capture or neutralize a sector, which
  tells you the fight is about holding ground and not just racking up kills.
  There's also a repeatable training option you can run before you join a match,
  which is a kind thing to offer in a game with this many vehicle types.


  The creator grew up playing Black Ops and built this to recreate that kind of
  combat.
