slug: ironclash
title: ironclash
tagline: Fight multiplayer battles from tanks, helicopters, and FPV drones.
description: >-
  In ironclash you fight a multiplayer first-person battle on foot or from the
  controls of a tank, a helicopter or an FPV drone. The project grew from the
  creator's fond memories of playing Black Ops when young and a wish to recreate
  that.


  Built in Godot with Claude Code, it ranked 280th of 945 at Vibe Jam 2026 and
  runs in desktop and phone browsers alike. Matches are online against other
  players.


  The vehicle variety is the main draw. Each machine changes how you approach a
  fight: a tank brings armored weight, a helicopter brings air support, and a
  drone is quick to handle but fragile. A match can swing between ground combat,
  air cover and fast, explosive drone strikes, and you can always fight on foot
  instead.
