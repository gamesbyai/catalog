slug: ironclash
title: ironclash
tagline: Fight multiplayer battles from tanks, helicopters, and FPV drones.
description: >-
  Every round comes down to a sector, which one side has to capture or
  neutralize. The armor team pushes forward with a tank and infantry, taking
  sectors to hit a point target before time runs out. The drone team only has to
  hold out until the timer expires, so the clock works for one side and against
  the other.


  It's a first-person shooter built on combined arms, where armor breaks through
  the line while drones hit it from above.


  You don't get to pick a side, because the game hands out your team and role
  when you join a match. All it asks first is a callsign of 1 to 16 characters,
  and it'll take letters, numbers, spaces, dashes and the _ character.


  Each role plays very differently. You might end up driving a tank, flying a
  helicopter or steering an FPV drone from cover. The smallest machine is the
  one meant to stall the advance and look for openings in the enemy line. If you
  want to warm up first, there's a training option.


  xaitoshi_ made the game because they loved playing Black Ops when they were
  young and wanted to recreate it themselves.
