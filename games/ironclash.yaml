slug: ironclash
title: ironclash
tagline: Fight multiplayer battles from tanks, helicopters, and FPV drones.
description: >-
  Each round turns on a sector that one side has to capture or neutralize. It's
  a first-person shooter built on combined arms, where armor breaks through the
  line while drones hit it from above.


  Armor team of a tank and infantry, taking sectors to hit a point target before
  time runs out. Drones that only hold out until the timer expires, with the
  clock working for one side and against the other. Tank, helicopter and FPV
  drone roles, each playing very differently. FPV drones, steered from cover to
  stall advances and find openings in the enemy line. Team and role assigned on
  joining, with no side to pick.


  Use the training option first if you want to warm up.


  xaitoshi_ made the game because they loved playing Black Ops when they were
  young and wanted to recreate it themselves.
