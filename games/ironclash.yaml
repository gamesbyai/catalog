slug: ironclash
title: ironclash
tagline: Fight multiplayer battles from tanks, helicopters, and FPV drones.
description: >-
  The round goal is to capture or neutralize a sector. Two sides fight over the
  objectives: the armor side advances with a tank and infantry, capturing
  sectors to reach a point target before time runs out. The drone side holds out
  until the timer expires.


  You enter a callsign of 1 to 16 characters, then join an online match where
  your team and role are assigned for you. Roles include driving a tank, flying
  a helicopter, or piloting an FPV drone from cover to stop the advance and find
  openings in the enemy line.


  It is a multiplayer first-person shooter built around combined arms, with
  armor breaking the line while drones strike from above. The creator took
  inspiration from playing Black Ops when young. The title screen also offers a
  training option and a share link.
