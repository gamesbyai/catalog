slug: ironclash
title: ironclash
tagline: Fight multiplayer battles from tanks, helicopters, and FPV drones.
description: >-
  Ironclash is a multiplayer first-person shooter set on a battlefield where
  players fight on foot or take control of vehicles. Tanks, helicopters, and FPV
  drones are all available, so each match can shift between ground combat, air
  support, and fast explosive drone strikes.


  The vehicle variety is the main draw. Each machine changes how you approach a
  fight, from the armored weight of a tank to the quick, fragile handling of a
  drone. The game also runs on mobile devices as well as desktop browsers.


  The creator says the project grew from fond memories of playing Black Ops when
  young and a wish to recreate that experience. It was entered in Vibe Jam 2026,
  built in Godot with Claude Code.
