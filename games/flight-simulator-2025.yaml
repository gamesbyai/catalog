slug: flight-simulator-2025
title: Flight Simulator 2025
tagline: Take off, fly over a shared world and dogfight other pilots online.
description: >-
  Type a name and join, and you'll start on an airport runway with the throttle
  sitting at 0%. Push it up with W and ease it back with S, then roll and pitch
  with the arrow keys while A and D work the rudder.


  Once you're off the ground you're sharing the sky with other players, and you
  can take them on in a dogfight, firing missiles with Space.


  A mission list on screen gives you three goals, which are to shoot down all
  the balloons, shoot down other planes and fly to space. The plane-hunting one
  even ends with a cheeky ":D" in the HUD.


  Your health, score, altitude, speed, throttle and vertical speed all stay on
  screen. There's a radar in the lower right and a small inset view of what's
  ahead of you. Shift switches on something called SuperTURBO XXL, a name nobody
  could accuse of modesty.


  Across the top scrolls a detailed weather report styled like a real airport
  broadcast for Pieter International Airport, right down to Runway 42 being in
  use.


  The world is built from chunky low-poly shapes, with a control tower, houses,
  pine trees, a snowy mountain and, for some reason, a castle on the ground.
  Blimps, a flying saucer and birds share the air with you. You can toggle the
  landing gear, engine, sound and camera view, and chat and a leaderboard are
  there too.
