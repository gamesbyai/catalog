slug: flight-simulator-2025
title: Flight Simulator 2025
tagline: Take off, fly over a shared world and dogfight other pilots online.
description: >-
  Type a name and join, and you'll start on an airport runway. Push it up with W
  and ease it back with S, then roll and pitch with the arrow keys while A and D
  work the rudder.


  Once you're off the ground you're sharing the sky with other players, and you
  can take them on in a dogfight, firing missiles with Space.


  Your three missions are to shoot down all the balloons, shoot down other
  planes and fly to space. Shift switches on something called SuperTURBO XXL.


  You can toggle the landing gear, engine and camera view, and the game also has
  a chat and a leaderboard.
