slug: flight-simulator-2025
title: Flight Simulator 2025
tagline: Take off, fly over a shared world and dogfight other pilots online.
description: >-
  Each session of Flight Simulator 2025 begins with a takeoff into one shared 3D
  world. From there it is an online flight game: you fly over the landscape
  alongside other players. Every other aircraft you see is flown by a real
  person, not by the computer.


  Meet another pilot in the air and you can turn the flight into a dogfight.
  That puts the game between simulation and action, with open flying and
  player-versus-player combat in the same sky, and each encounter depends on who
  happens to be up there with you.


  According to its README, the creator used Cursor and Grok 3 for both the code
  and the 3D scene. Three.js renders the landscape and the aircraft in the
  browser, and the whole thing is online multiplayer from the first takeoff.
