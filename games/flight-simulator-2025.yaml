slug: flight-simulator-2025
title: Flight Simulator 2025
tagline: Take off, fly over a shared world and dogfight other pilots online.
description: >-
  Type a name to join and start on an airport runway. Once you're off the
  ground, you fly over a shared world alongside other players.


  Three missions of shooting down all the balloons, shooting down other planes
  and flying to space. Dogfights in the air. Toggles for landing gear, engine
  and camera view. In-game chat and a leaderboard.


  Push W to throttle up and S to ease back. Use the arrow keys to roll and
  pitch. Use A and D for the rudder. In a dogfight, press Space to fire
  missiles. Press Shift to switch on something called SuperTURBO XXL.
