slug: flight-simulator-2025
title: Flight Simulator 2025
tagline: Take off, fly over a shared world and dogfight other pilots online.
description: >-
  Type a name, hit the join button, and you start on a striped runway in a white
  biplane with the throttle at zero. Other pilots share the same world, and you
  can shoot at them.


  A list of missions sits on screen: shoot down all the balloons, shoot down
  other planes, and fly up into space.


  The airfield is blocky and low-poly, with a control tower, pine trees, a snowy
  mountain, a castle far off and a blimp floating overhead. It's a pretty odd
  mix of scenery for a flight sim, and there's even a flying saucer hanging
  around near the runway.


  Your readout tracks altitude, speed, throttle and vertical speed, plus health
  and score. A small camera view sits in one corner and a round radar in
  another.


  The ticker across the top reads like a real airport weather report, with wind,
  visibility, temperature and which runway is in use, which is a funny thing to
  read right before you go hunting balloons with missiles.


  Besides firing missiles, you can raise and lower the landing gear, switch the
  engine off and on, flip the camera view, mute the sound, chat with other
  pilots and pull up a leaderboard. Holding the turbo key gets you a boost
  called SuperTURBO XXL, a name that suits a speed button.


  The creator, levelsio, made it with AI and built it so you can open it and fly
  without loading screens or big updates, which is a considerate thing for a
  game you might only want for a few minutes.
