slug: flight-simulator-2025
title: Flight Simulator 2025
tagline: Take off, fly over a shared world and dogfight other pilots online.
description: >-
  Flight Simulator 2025 is a multiplayer flight game set in a shared 3D world.
  Each session begins with a takeoff, after which you fly over the landscape
  alongside other players. When you meet another pilot in the air, you can turn
  the flight into a dogfight.


  The mix of open flying and player-versus-player combat is the main draw.
  Because the world is shared, the other aircraft you see are real players
  rather than scripted targets, so every encounter depends on who happens to be
  in the sky with you.


  The creator says it was built with Cursor and Grok 3, and it renders in the
  browser with Three.js. Those are the tools the creator credits for the code
  and the 3D scene.
