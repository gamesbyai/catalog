slug: flight-simulator-2025
title: Flight Simulator 2025
tagline: Take off, fly over a shared world and dogfight other pilots online.
description: >-
  Type a name and join to spawn on an airport runway with the throttle at 0%.
  Raise it with W, roll and pitch with the arrow keys, and use A and D for the
  rudder. Take off into a world shared with other players, who can be dogfighted
  in the air. Space shoots missiles.


  An on-screen mission list gives three goals: shoot down all the balloons,
  shoot down other planes, and fly to space. The HUD tracks health, score,
  altitude, speed, throttle and vertical speed. A radar sits in the lower right,
  and a small inset view shows the scene ahead.


  The world is low-poly. It has an airport with a control tower, houses, pine
  trees, a snowy mountain, a castle, blimps, a flying saucer and birds. A
  scrolling airport weather report runs along the top of the screen. Landing
  gear, engine, sound and camera view can be toggled, and chat and a leaderboard
  are available.
