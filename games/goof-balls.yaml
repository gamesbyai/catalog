slug: goof-balls
title: Goof Balls
tagline: Switch elements and outlast rival balls in a shrinking ring
description: >-
  Three elements decide every collision: fire burns grass, grass soaks up water,
  and water puts out fire. Each ball in the ring carries one of them, and you
  can change yours with a key press. After a change your element stays fixed for
  a moment, so a late swap is a bet you can't undo.


  The round starts in a ring that gets smaller as it goes, with you and a crowd
  of cartoon balls with smiley faces. The aim is to be the final ball left.
  Charge at opponents your element beats, swap to counter anyone coming for you,
  and raise a shield when you are in trouble.


  You can play alone against bots or set up a private room for friends, with a
  chat to talk to them. The creator took the idea from a manga scene of two
  masters playing rock-paper-scissors at absurd speed, and mixed it with the
  type triangle from early Pokémon games.


  The mouse or WASD moves your ball. Keys 1, 2 and 3 choose the element, and
  both rush and shield can be triggered with either a mouse button or a keyboard
  key.
