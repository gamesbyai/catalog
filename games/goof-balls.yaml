slug: goof-balls
title: Goof Balls
tagline: Switch elements and outlast rival balls in a shrinking ring
description: >-
  Goof Balls is a last-ball-standing brawler built on a Fire, Grass and Water
  triangle. You start in a shrinking ring with a crowd of round opponents.
  Switch to the element that counters the nearest rival, rush into targets you
  beat, and raise a shield when a fight turns against you. The final ball left
  wins.


  Switching elements is instant but locks for a short time afterward, so each
  change commits you to a read on your opponents. The design grows out of the
  idea of two masters trading rock-paper-scissors at absurd speed. Rounds are
  quick, and the cute look contrasts with the mind games underneath.


  You can play solo against bots or set up a private room with friends and trade
  taunts through chat. It runs in the browser with no download. The author's jam
  submission discloses AI assistance for code, graphics and text, and says the
  game is still being tuned and improved.
