slug: goof-balls
title: Goof Balls
tagline: Switch elements and outlast rival balls in a shrinking ring
description: >-
  You can flip your ball between fire, grass and water whenever you want, and
  that flip is what the whole game turns on. It happens instantly, but it locks
  for a moment afterward, so a change made at the last second is one you're
  stuck with.


  Each element beats one of the others in a loop. Fire burns grass, grass soaks
  up water, and water puts out fire.


  You start in a ring packed with cheerful little balls, and the ring shrinks as
  you go. Change to whatever counters the ball near you, rush at the ones your
  element beats, and put up a shield when something's closing in.


  Your goal is to be the last ball left in the ring. Because the rules are so
  small, the game comes down to guessing what the other balls will pick and
  committing before they do.


  You can play alone against bots, or open a private room for friends. There's a
  chat in there too, so you can trash talk a little.


  The creator got the idea from a martial-arts manga they read in high school,
  where two masters battled at rock-paper-scissors so quickly that each one
  altered the hand shape right at the final instant. Years later they paired
  that with the fire, grass and water triangle from the original Pokémon games,
  which is a funny path to a ball brawl.


  It's still being tuned and improved, and the creator is asking players for
  feedback.
