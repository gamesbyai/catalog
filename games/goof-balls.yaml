slug: goof-balls
title: Goof Balls
tagline: Switch elements and outlast rival balls in a shrinking ring
description: >-
  Be the last ball left in a shrinking ring. Every ball is fire, grass or water,
  and you can switch yours with one key press.


  Three matchups, with fire burning grass, grass soaking up water and water
  putting out fire. A brief lock after every swap, so a last-second switch is a
  bet. Rushes at the opponents your element beats. A shield for when things go
  badly. Bots, private rooms for friends and a built-in chat.


  Steer with the mouse or WASD and pick an element with 1, 2 or 3. Rush with
  left click or Space, and shield with right click or Shift.


  tappInc got the idea from a martial-arts manga scene where two masters threw
  rock-paper-scissors at ridiculous speed, then mixed it with the type triangle
  from early Pokémon games.
