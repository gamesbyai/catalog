slug: jump-ninja
title: Jump Ninja
tagline: Charge your jump and hop upward as a ninja in a simple platformer.
description: >-
  Jump Ninja is a platformer built around a single idea: charge up your jump,
  then let go to leap. The controls are kept deliberately small, so a run comes
  down to judging how much power a given gap or ledge needs and timing each hop.


  The design aims at people who want something to pick up quickly without a long
  story or layered mechanics. It is set up to run on phones and other devices as
  well as desktop, so a short session can happen anywhere.


  The creator, a parent who found complex games had become a chore, says the
  goal was a game anyone can play at any time on any device. The creator built
  it with Lovable, and it renders in Three.js. It was entered in Vibe Jam 2026.
