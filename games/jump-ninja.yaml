slug: jump-ninja
title: Jump Ninja
tagline: Charge your jump and hop upward as a ninja in a simple platformer.
description: >-
  Jump Ninja has one move: charge a jump, then let go to leap upward as a ninja.
  You climb by judging how much power each leap needs.


  Gaps and ledges as the obstacles. Timing for every hop on the way up. Simple
  controls, meant to be picked up quickly for short sessions wherever you are.


  playpareho is a parent for whom complex games had become a chore, and they say
  the goal was a game anyone can play at any time, on any device.
