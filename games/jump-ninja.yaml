slug: jump-ninja
title: Jump Ninja
tagline: Charge your jump and hop upward as a ninja in a simple platformer.
description: >-
  Jump Ninja has one move: charge up a jump, then let go to leap. You play a
  ninja hopping upward, and the controls are kept deliberately small. A run
  comes down to judging how much power each gap or ledge needs and timing every
  hop on the way up.


  The creator is a parent who found that complex games had become a chore, and
  says the goal was a game anyone can play at any time, on any device. It was
  assembled in Lovable, and Three.js does the rendering.


  That is why it runs on phones and other devices as well as desktop: it is
  meant to be picked up quickly for a short session, wherever you are. A single
  charged jump is all there is to learn, and the rest is judgment.
