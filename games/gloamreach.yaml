slug: gloamreach
title: Gloamreach
tagline: Carry a lantern's last ember down through a dark kingdom under the ground.
description: >-
  You play the Wick, a wanderer in a dark-fantasy side-scrolling
  action-adventure. The descent takes you under the ground, into a
  long-forgotten kingdom.


  A lantern on the Wick's back, holding the last living ember. The Great
  Lantern, no longer lit. Puzzle solving mixed into the action.


  Move with the arrow keys. Press Space when it's time to choose.
