slug: gloamreach
title: Gloamreach
tagline: Carry a lantern's last ember down through a dark kingdom under the ground.
description: >-
  Move with the arrow keys. Space is the one you press when it's time to choose.


  It's a side-scrolling dark-fantasy action-adventure with puzzle solving mixed
  in.


  You play as the Wick, a wanderer who carries the last living ember in a
  lantern on its back. The descent takes you into a long-forgotten kingdom under
  the ground, where the Great Lantern no longer burns.
