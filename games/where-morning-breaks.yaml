slug: where-morning-breaks
title: Where Morning Breaks
tagline: Guide a young witch and her familiar to a tower and decide who pays for
  the ritual
description: >-
  You follow Lyra, a young witch crossing a land the Dusk is eating away, one
  village and forest at a time. Her familiar, Moth, travels with her toward an
  old tower that is supposed to hold the way to stop the spread.


  Along the route you meet people who need help and pick up pieces of forgotten
  history. Your choices change how close Lyra and Moth become, and that
  closeness matters at the top of the tower, where a ritual demands a sacrifice.
  Which of them pays depends on the bond you built.


  It is a short visual novel with several endings, and one playthrough runs
  about 5 to 10 minutes. According to the creator, ChatGPT wrote the code and
  story, Suno made the music, and FreeGen produced the visuals.
