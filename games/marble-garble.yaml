slug: marble-garble
title: MARBLE GARBLE
tagline: Roll a marble across hazardous terrain and collect all the money in each level.
description: >-
  A red marble sits on a dark, walled grid scattered with gold coins, black
  blocks and open pits ringed in orange. You roll it with the keyboard, building
  momentum to collect every coin on the board. Collecting them all advances you
  to the next level.


  The game has 50 procedurally generated levels across five worlds. Surfaces
  change how the marble moves: ice is slippery, while desert sand adds heavy
  friction. Bottomless pits, lava and cacti end a run on contact, and enemies
  such as hovering UFOs and forest snakes patrol the levels.


  The title menu offers a New Game button, a High Score list, and two
  checkboxes: one turns enemies on or off, the other adds a total game timer for
  speedrunning. A progress bar at the top tracks how close you are to unlocking
  the next world, and the HUD shows your level and coin count. Press R to
  restart a level after a fall or when you get stuck, and Esc to pause. Sessions
  run a few minutes.
