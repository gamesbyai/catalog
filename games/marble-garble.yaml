slug: marble-garble
title: MARBLE GARBLE
tagline: Roll a marble across hazardous terrain and collect all the money in each level.
description: >-
  You guide a marble around walled grids that hold coins, blocks and open pits,
  rolling it with the keyboard and building momentum to collect every coin on
  the board.


  The game has 50 procedurally generated levels across five worlds. Surfaces
  change how the marble moves: ice is slippery, while desert sand adds heavy
  friction. Bottomless pits, lava and cacti end a run on contact, and enemies
  such as hovering UFOs and forest snakes patrol the levels.


  You can switch enemies on or off, add a total game timer for speedrunning, and
  check a high score list. Press R to restart a level after a fall or when you
  get stuck. Sessions run a few minutes.
