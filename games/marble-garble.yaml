slug: marble-garble
title: MARBLE GARBLE
tagline: Roll a marble across hazardous terrain and collect all the money in each level.
description: >-
  Guide a marble through walled grids holding coins, blocks and open pits. Build
  momentum to gather every coin on the board. Sessions run a few minutes.


  50 procedurally generated levels of increasing difficulty across five worlds.
  Arctic ice with little grip, and desert sand with heavy friction. Run-ending
  contact with bottomless pits, lava and cacti. Patrolling enemies such as
  hovering UFOs and forest snakes. On-off switch for enemies. A total game timer
  for speedrunning, and a high score list.


  Roll the marble with the arrow keys or WASD. Press R to start the level over
  after a fall or when you get stuck.


  Daniel__BK designed and directed it, working with AI assistants on the code.
  Music and sound effects are royalty free or Creative Commons.
