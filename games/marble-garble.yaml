slug: marble-garble
title: MARBLE GARBLE
tagline: Roll a marble across hazardous terrain and collect all the money in each level.
description: >-
  MARBLE Garble is a 3D marble platformer in which you roll and steer a ball
  through a series of levels. Each level asks you to collect all the money to
  advance. Bottomless pits, lava, and cacti are waiting for any wrong move, and
  a quick restart puts you back at the start.


  The game has 50 procedurally generated levels spread across five themed
  worlds, and the surfaces change how the marble behaves. Ice is slippery, while
  desert sand adds heavy friction, so momentum needs constant attention. Enemies
  such as hovering UFOs and forest snakes add moving threats. Music comes from
  Creative Commons and royalty-free sources.


  Designer Daniel Borge Kristensen credits Gemini and Claude as technical
  collaborators, and the game is built with Three.js. The AI disclosure
  describes it as AI assisted, with help on the code. It placed fourth among 29
  entries in the AI Browser Game Jam 1.
