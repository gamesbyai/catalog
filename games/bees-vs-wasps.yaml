slug: bees-vs-wasps
title: Bees vs Wasps
tagline: Gather flowers as a bee and get back to the hive before angry wasps catch you.
description: >-
  Bees vs Wasps is a 3D action game that sends you out as a bee to collect
  pollen from flowers, then back to the hive before the angry wasps catch you.
  Getting stung costs you, so every trip is a trade between greed for one more
  flower and the distance home.


  The idea began with the Fibonacci sequence, which led the creator to
  sunflowers and then to bees. Wasp spawns first followed the same sequence,
  until the count became overwhelming and was capped.


  Climbing the levels brings new pieces: honeycomb, extra lives and tougher
  enemies. The Tarantula Hawk arrives at level 12 and the Executioner at level
  15, both drawn from real stinging insects, and the design aims for something
  you can start right away and keep playing.
