slug: bees-vs-wasps
title: Bees vs Wasps
tagline: Gather flowers as a bee and get back to the hive before angry wasps catch you.
description: >-
  You start on a blocky pixel-art forest floor, with sunflowers and pink
  blossoms scattered between the trees and a bee hovering behind the title.
  There's a box for your name before you head in.


  The job is to collect flowers and then get yourself back to the hive.


  Angry wasps are out there hunting you, so you can't just drift from bloom to
  bloom. Getting home in one piece is the other half of the job.


  As you climb through levels, the game starts adding things, like honeycomb and
  extra lives, while more lethal wasps show up too. The Tarantula Hawk arrives
  at level 12 and the Executioner at level 15, and the creator took both from
  watching Brave Wilderness get stung by them on YouTube. That's a funny place
  to find your bosses.


  Extra lives arriving alongside nastier wasps seems like a fair trade.


  The whole idea began with the creator's interest in the Fibonacci sequence,
  which led to sunflowers and then to bees. The wasps first spawned in Fibonacci
  numbers, but that turned into too many, so the count is capped now. The aim
  was something you can jump into right away.
