slug: bees-vs-wasps
title: Bees vs Wasps
tagline: Gather flowers as a bee and get back to the hive before angry wasps catch you.
description: >-
  You're a bee. Gather flowers and carry them back to the hive before the angry
  wasps get you.


  Honeycomb and extra lives as you climb levels. Deadlier wasps too, with the
  Tarantula Hawk at level 12 and the Executioner at level 15. Wasp spawns built
  on the Fibonacci sequence, capped when the numbers grew too fast.


  alexismediaco wanted something you could jump into right away. The deadliest
  wasps were inspired by Brave Wilderness videos of getting stung.
