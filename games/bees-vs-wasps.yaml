slug: bees-vs-wasps
title: Bees vs Wasps
tagline: Gather flowers as a bee and get back to the hive before angry wasps catch you.
description: >-
  A blocky pixel-art forest meadow fills the start screen, with flowers, trees
  and a tall sunflower, and a bee hovering behind the title. You type a name
  before starting. A sound toggle sits in the top corner.


  You play a bee. The goal is to gather flowers and carry them back to the hive
  without dying to the angry wasps. The creator wanted something you can jump
  into right away.


  Levels add new elements as you climb. Honeycomb and extra lives appear, and
  deadlier wasps arrive: the Tarantula Hawk at level 12 and the Executioner at
  level 15. Both were inspired by Brave Wilderness videos of getting stung.


  Wasp spawns first followed the Fibonacci sequence, the idea the game grew
  from, but that produced too many wasps, so the creator capped the numbers.
