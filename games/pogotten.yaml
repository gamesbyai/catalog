slug: pogotten
title: Pogotten
tagline: Hop up a miles-high radio tower as a pogo-stick robot to say goodbye to
  your family
description: >-
  Pogotten is a 3D adventure platformer about Pogo, a character who believes he
  is broken and was left behind by his family. His goal is to scale a miles-high
  radio tower so he can say goodbye. A run is a long vertical climb, where each
  jump has to carry him higher.


  The story gives the climb an emotional reason, which sets it apart from a
  plain obstacle course. The creator names Jump King and Wall-E as inspirations,
  and the tone mixes the punishing ascent of the first with the lonely, gentle
  mood of the second. The tower setting keeps the goal clear at every moment:
  reach the top.


  It was entered in Vibe Jam 2026 and built with Three.js. The creator states
  that Antigravity was used in the making of the game, and the project places in
  the middle of a field of 945 jam entries.
