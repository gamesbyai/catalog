slug: port-royal-1691
title: Port Royal 1691
tagline: Wreck Port Royal as a pirate with ten weapons, smashing buildings and
  fighting NPCs.
description: >-
  Port Royal 1691 puts you in the boots of a pirate loose in the richest city in
  the Caribbean, carrying ten brutal weapons. You tear through the streets,
  smash buildings and fight the NPCs who get in your way, and the town slides
  steadily into chaos. It is an action-adventure game, played alone.


  The title pins the setting to a real city and year, which gives the
  destruction a clear historical identity. It is a single-player game built with
  Codex on Three.js, and it placed 76th of 945 entries at Vibe Jam 2026.


  The game treats the city as something to break apart, and the range of weapons
  gives you different ways to go about it, from up-close brawling to bigger acts
  of demolition across the town.
