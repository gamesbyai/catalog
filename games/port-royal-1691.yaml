slug: port-royal-1691
title: Port Royal 1691
tagline: Wreck Port Royal as a pirate with ten weapons, smashing buildings and
  fighting NPCs.
description: >-
  Port Royal 1691 puts you in the boots of a pirate loose in the richest city in
  the Caribbean. Armed with ten brutal weapons, you tear through the streets,
  smash buildings, and fight the NPCs who get in your way, steadily turning the
  town into chaos.


  The appeal is destruction on a setting with a clear historical identity. The
  game treats the city as something to break apart, and the range of weapons
  gives you different ways to go about it, from up-close brawling to bigger acts
  of demolition.


  It was an entry in Vibe Jam 2026, where it placed 76th among 945 entries. It
  runs in the browser on Three.js, and the creator built it with Codex. It is a
  single-player game.
