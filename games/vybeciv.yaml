slug: vybeciv
title: VybeCiv
tagline: Grow a tribe into an empire across Earth, the Solar System and the Galaxy.
description: "You start as the ruler of one tribe on a hex map of Earth, moving
  settlers, workers, explorers and soldiers a few tiles per turn. Unexplored
  tiles stay hidden until a unit gets close, and speedy explorers are there for
  that. The world you leave behind shrinks to a single tile on the next map,
  keeps sending you output, and rivals try to grab it.


  Growth waiting on full food stores. Happiness cost per new city and citizen,
  with slower growth and output below zero. Automatic new ages, with fresh units
  and buildings, after enough research. Three maps, Earth, Solar System and
  Galaxy, each with its own cities, units and rivals. Two wins, Intergalactic
  Gate built first after reaching Galaxy, or every rival city wiped out on any
  map, with rivals chasing both. Turn 300 limit, where top score wins if nobody
  else has.


  Move up with a Space Expedition from a spaceport, then an Interstellar Ark
  from a jump-gate city. Pay gold to finish a slow build instantly. Add
  granaries, markets and walls to ease unhappiness. Earlier-map cities run
  themselves, turning half their output into gold or science, then research once
  coffers fill. Set an empty-queue city on your current map to do the same.
  Losing every city isn't quite the end, and you get ten turns to found one
  before civilization ends.


  Albert Simon says they handled design, balance and polish personally and made
  the music with Suno. They call this a first public build where the late-game
  AI and tutorial side are still a bit rough."
