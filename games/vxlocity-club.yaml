slug: vxlocity-club
title: Vxlocity.club
tagline: Weave through highway traffic at high speed and race for leaderboard
  spots or wagers.
description: >-
  VXLocity is a browser racing game about speed on a busy highway. You steer
  through traffic, trying to hold a fast line without clipping other cars, and
  your results go up against a leaderboard. The game also offers real-time
  player-versus-player races and ghost-bounty challenges where money is put on
  the outcome.


  The stakes are the hook. Wagering is built into the competitive modes, so a
  race can carry real financial risk as well as pride. The creator drew on
  Assetto Corsa and the Shutoko Revival Project mod, and on personal experience
  of highway runs offline and on NoHesi servers, which shapes the
  traffic-weaving focus. It supports multiplayer and runs on mobile.


  The game was built with Three.js, and the creator used Cursor while making it.
  It was entered in Vibe Jam 2026, where it placed 151st out of 945 entries.
