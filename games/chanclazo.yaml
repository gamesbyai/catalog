slug: chanclazo
title: Chanclazo
tagline: Dodge incoming attacks and survive as long as you can in a comic 3D arena.
description: >-
  Dodge the chancla, the flip-flop a scolding relative throws when words run
  out, and last as long as you can in a comic 3D arena.


  Arcade survival built on a piece of family humor. A household threat as the
  main hazard. Runs that last exactly until the chancla lands.


  Keep moving and stay out of the way of whatever comes at you.


  The creator had the idea for a couple of years before AI made it possible to
  build.
