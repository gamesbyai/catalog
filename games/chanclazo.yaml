slug: chanclazo
title: Chanclazo
tagline: Dodge incoming attacks and survive as long as you can in a comic 3D arena.
description: >-
  Chanclazo is a dodge-and-survive game built around the chancla, the flip-flop
  that a scolding relative throws when words run out. A run is about staying
  alive: you move around, avoid what comes at you, and try to last as long as
  possible before getting hit.


  The premise leans on a familiar piece of family humor, turning a household
  threat into the core hazard. The tagline says the chanclazo speaks when words
  fail, and that tone carries through the concept. It runs in the browser in 3D
  and is set up to work on mobile as well as desktop.


  The creator says the idea had been on their mind for a couple of years before
  AI made it possible to build. The listing names Bolt as the tool used, and the
  game was submitted to Vibe Jam 2026.
