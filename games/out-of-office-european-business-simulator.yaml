slug: out-of-office-european-business-simulator
title: "OUT OF OFFICE: European Business Simulator"
tagline: Run a European business while doing as little actual work as possible.
description: >-
  OUT OF OFFICE: European Business Simulator is a satirical management sim about
  running a company in Europe during the summer. The player takes the role of a
  business owner whose main trait is laziness, and the joke is built around
  getting by with as little effort as possible.


  The tone is tongue-in-cheek, presenting itself as a completely realistic
  portrait of European business life. The premise leans on the gap between the
  serious title and the owner's lack of interest in working, which gives the
  simulation genre a comic twist.


  The game was entered in Vibe Jam 2026, where it placed 401 out of 945 entries.
  The creator built it with Claude Code. It is marked as playable on mobile and
  is a single-player experience.
