slug: out-of-office-european-business-simulator
title: "OUT OF OFFICE: European Business Simulator"
tagline: Run a European business while doing as little actual work as possible.
description: >-
  Own a European company in the summer and keep it technically alive while doing
  as close to nothing as you can.


  Out of office replies to farm, then spend on ways of sending even more. Time
  off in steps, from a cheeky fortnight to a long weekend extension and a proper
  month off. Locked upgrades to open. News headlines, like one about something
  closed in the 9th arrondissement.


  Press the green button to keep the company alive.


  It bills itself, tongue in cheek, as a completely realistic picture of
  European business in the summer months.
