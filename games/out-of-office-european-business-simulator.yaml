slug: out-of-office-european-business-simulator
title: "OUT OF OFFICE: European Business Simulator"
tagline: Run a European business while doing as little actual work as possible.
description: >-
  OUT OF OFFICE: European Business Simulator is a satirical, casual management
  sim about running a company in Europe during the summer. You play the owner,
  whose main trait is laziness, and the aim is to get by with as little actual
  work as possible.


  It presents itself, tongue in cheek, as a completely realistic portrait of
  European business life in summer. It is a single-player game, made with Claude
  Code, that ranked 401st of 945 at Vibe Jam 2026 and works on phones as well as
  desktop.


  The joke lives in the gap between the serious title and an owner with no
  interest in working. That gap is what turns the management sim into a comedy,
  since doing less is the whole plan for your company.
