slug: out-of-office-european-business-simulator
title: "OUT OF OFFICE: European Business Simulator"
tagline: Run a European business while doing as little actual work as possible.
description: >-
  You run a business somewhere in Europe, and it's summer, so the whole job is
  sending out-of-office replies. You farm those replies to find more efficient
  ways of sending even more of them.


  The goal is to keep the company technically alive while you do nothing, which
  is a funny ambition for a boss. Upgrades sit on the right, and each one has a
  buy button, a price in replies, and a bonus in replies per second. Spend what
  you've collected and the automatic income grows.


  One upgrade is still hidden behind a row of question marks, so there's
  something left to work toward.


  On the left there's a vacation ladder, which is where your time off gets
  longer. It starts at a cheeky fortnight, moves up to a long weekend extension,
  and ends at a proper month off.


  Each rung has its own passive multiplier, so a longer break means a bigger
  number.


  A news strip runs across the top with local headlines, including one about the
  9th arrondissement being closed. It's all chunky blue pixel art, and a cream
  notice greets you first to explain the premise, which you dismiss with a green
  button telling you to keep the company alive.
