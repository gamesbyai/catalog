slug: petrova-defense
title: Petrova Defense
tagline: Mine asteroids for ice and build defenses to protect your Sun from invaders.
description: >-
  Petrova Defense is an action tower defense game set in space. You fly through
  an asteroid field, breaking rocks apart to harvest ice. That ice powers the
  planetary defenses you rely on to hold off the invaders that are hungry for
  your Sun.


  The game blends two familiar ideas: the shoot-the-rocks flying of classic
  Asteroids and the build-and-protect loop of tower defense. Gathering resources
  and guarding your star happen at the same time, so each run asks you to
  balance mining against keeping the defenses fed. The creator cites Project
  Hail Mary as another inspiration.


  Petrova Defense was entered in Vibe Jam 2026 and works on mobile devices as
  well. The creator's tooling for the project was Codex, OpenAI's coding
  assistant, according to the jam listing information.
