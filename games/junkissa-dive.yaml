slug: junkissa-dive
title: 純喫茶ダイヴ - JUNKISSA DIVE
tagline: Launch cherries and sugar cubes onto dishes to finish orders at a
  late-night café.
description: >-
  JUNKISSA DIVE is a short action game set in a late-night retro Japanese café,
  called a junkissa. Instead of diving yourself, you launch toppings such as
  cherries and sugar cubes so they land on the food and complete each order. A
  shift lasts five orders.


  After the fifth order, the dishes from your shift are turned into a poster,
  and a short message arrives from your childhood friend, who owns the café. The
  game is not built around high scores. It aims to make each day's result worth
  enjoying, whether the toppings landed neatly or the dish came out strange.


  The controls are kept simple so the game can be understood by playing it.
  Effort went into the feel of the launches, the sounds, the camera movement,
  the receipts, and the posters. The creator says ChatGPT worked as a
  development buddy on the code, screen design, and rules. It was made for AI
  Browser Game Jam 4.
