slug: junkissa-dive
title: 純喫茶ダイヴ - JUNKISSA DIVE
tagline: Launch cherries and sugar cubes onto dishes to finish orders at a
  late-night café.
description: >-
  Launch cherries, sugar cubes, and other toppings onto the food to finish each
  order at a late-night junkissa, a retro Japanese-style café. The toppings do
  the diving here, not the player. The creator kept the controls simple and
  spent time on how the launches feel.


  A shift is five orders long. After the fifth, the results of your shift become
  a poster, and the café owner, your childhood friend, sends a short message.
  The childhood-friend setting comes from the jam's hidden theme, buddy.


  The creator wanted each run to be about seeing how the day turned out, whether
  everything landed perfectly or something odd got made, instead of mastering
  the game or chasing a high score. Time went into the sounds, camera movement,
  receipts, and posters.


  The title screen shows a lit signboard on a dark night street, a JP/EN
  language toggle in the corner, and a red button at the bottom to open the
  shop.
