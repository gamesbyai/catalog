slug: junkissa-dive
title: 純喫茶ダイヴ - JUNKISSA DIVE
tagline: Launch cherries and sugar cubes onto dishes to finish orders at a
  late-night café.
description: >-
  Fling cherries, sugar cubes and other toppings onto the dish to finish each
  order at a junkissa, a Japanese-style café.


  Five orders per shift. Your whole shift turned into a poster at the end. A
  short message from the café's owner, your childhood friend. Simple controls,
  with the effort spent on how each launch feels. Japanese and English.


  SukimaStock worked with ChatGPT on the code, the screen design and the game
  rules, and spent extra time on the sounds, receipts and posters.
