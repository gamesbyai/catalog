slug: junkissa-dive
title: 純喫茶ダイヴ - JUNKISSA DIVE
tagline: Launch cherries and sugar cubes onto dishes to finish orders at a
  late-night café.
description: >-
  Fling cherries, sugar cubes and other toppings onto the dish to finish each
  order at a junkissa, a Japanese-style café. The toppings do the diving here
  instead of you. SukimaStock kept the controls simple and spent the extra
  effort on how each launch feels.


  A shift lasts five orders. When the fifth one's done, your whole shift gets
  turned into a poster, and then the café's owner, your childhood friend, sends
  you a short message.


  That childhood-friend setup comes from a hidden theme, the word buddy, and
  SukimaStock turned it into a café your old friend opened.


  SukimaStock didn't build this around mastering it or chasing a high score.
  They wanted each run to be about seeing how your day turned out, whether every
  topping landed perfectly or something strange ended up on the plate. Getting
  your shift back as a poster suits that idea, since even a weird dessert still
  gets its moment. The game is available in Japanese and English.


  SukimaStock also put plenty of time into the sounds, the receipts and the
  posters. SukimaStock worked with ChatGPT on the code, the screen design and
  the game rules.
