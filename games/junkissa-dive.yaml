slug: junkissa-dive
title: 純喫茶ダイヴ - JUNKISSA DIVE
tagline: Launch cherries and sugar cubes onto dishes to finish orders at a
  late-night café.
description: >-
  You launch toppings like cherries and sugar cubes onto the food to finish each
  order, all inside a late-night retro Japanese café called a junkissa. The idea
  came from the jam's "dive" theme, so the toppings do the diving instead of
  you.


  The setting comes from a second, hidden theme, buddy. You're working in a café
  opened by your childhood friend, which is a cozy excuse for flinging garnish
  at dinner plates.


  A shift is five orders long, and that's the whole night's work.


  When the fifth one is done, what you made that day gets turned into a poster.
  Then your friend, the café owner, sends a short message, so the night ends
  with a little note from them.


  The creator says it isn't about mastering the game or chasing a high score.
  They wanted each playthrough to be about how that day turned out, whether
  everything landed perfectly or something strange ended up on the plate.


  The controls are kept simple so you can get it just by playing. Most of the
  polish went into how the launches feel, the sounds, the camera movement, the
  receipts and the posters, which is a sensible place to put the effort in a
  game this short.


  The title screen has a JP and EN switch, so you can read it in Japanese or
  English.
