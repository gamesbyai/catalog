slug: kottbullar-metal
title: KÖTTBULLAR METAL
tagline: Survive a 15-minute mosh pit fueled by death metal versions of IKEA
  product names.
description: >-
  KÖTTBULLAR METAL gives you 15 minutes in a mosh pit and one job: still be
  standing when the clock runs out. It is survival action with a clock, and
  failure has a specific outcome: you become a Köttbullar, the meatball of the
  title.


  The joke sits at the center: odd Swedish-style furniture names from a
  home-goods catalog, treated as brutal death metal lyrics. Made with Claude
  Code, it came 22nd of 945 entries at Vibe Jam 2026 and took home the jam's
  Funniest Game award.


  The mix is loud and absurd, flat-pack humor over heavy music, with action,
  RPG, simulation and musical elements all thrown into the pit. It is
  multiplayer online, and friends can join the pit from a phone or a desktop
  browser.
