slug: kottbullar-metal
title: KÖTTBULLAR METAL
tagline: Survive a 15-minute mosh pit fueled by death metal versions of IKEA
  product names.
description: >-
  Köttbullar Metal puts you in the middle of a death-metal show, where you
  control the singer and the goal is to last 15 minutes in the mosh pit. If you
  don't, you become Köttbullar, which is a funny fate to threaten someone with.


  The whole joke is the lyrics, and the game commits to it completely.


  They're built from odd IKEA-style product names, because those names sound
  brutal enough for death metal. The title screen even bills it as NOTIKEA
  presenting.


  Besides surviving, you can dance with the moshers, who fill the screen as a
  pixel-art crowd packed below a stage with a band and colored lights. There's
  also a mastery journal on the title screen that tracks 33 secrets, all of them
  still locked when you start.


  Those secrets are about the band, so the journal gives you something to chase
  besides the clock.


  The game asks for a quick sound check before you start, and it suggests
  headphones. That makes sense for something where the music is the point.
