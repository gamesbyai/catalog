slug: kottbullar-metal
title: KÖTTBULLAR METAL
tagline: Survive a 15-minute mosh pit fueled by death metal versions of IKEA
  product names.
description: >-
  KÖTTBULLAR METAL drops you into a death metal mosh pit for 15 minutes, and all
  it asks is that you're still on your feet when time's up. If you don't make
  it, you become a Köttbullar, the meatball the game is named after. It's a
  weirdly specific way to lose.


  The humor comes from odd Swedish-style furniture names out of a home-goods
  catalog, read out as brutal death metal lyrics, and the show is billed as
  presented by "NOTIKEA" for good measure.


  There's more than one way into the show. You can take control of the singer,
  dance with the moshers, or go hunting for the band's secrets.


  Those secrets have their own Mastery Journal, which tracks how many of the 33
  you've found. It's labeled as action, RPG, simulation and musical all at once.
  For a game about surviving a crowd, that's a lot of genres crammed into one
  pit.


  The game suggests playing with headphones, and there's a sound check button at
  the top of the title screen before you hit start.


  A button on the title screen copies a link to the game. Friends can join the
  pit from a phone or a desktop browser.
