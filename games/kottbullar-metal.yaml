slug: kottbullar-metal
title: KÖTTBULLAR METAL
tagline: Survive a 15-minute mosh pit fueled by death metal versions of IKEA
  product names.
description: >-
  KÖTTBULLAR METAL drops you into a death metal mosh pit for 15 minutes, and all
  it asks is that you're still on your feet when time's up. If you don't make
  it, you become a Köttbullar, the meatball the game is named after.


  The lyrics are odd Swedish-style furniture names from a home-goods catalog,
  read out as brutal death metal, and the show is billed as presented by
  "NOTIKEA".


  There's more than one way into the show. You can take control of the singer,
  dance with the moshers, or go hunting for the band's secrets.


  The band's secrets have their own Mastery Journal, which tracks how many of
  the 33 you've found. It's labeled as action, RPG, simulation and musical all
  at once. The game suggests playing with headphones. Friends can join the pit
  from a phone or a desktop browser.
