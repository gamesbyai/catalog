slug: kottbullar-metal
title: KÖTTBULLAR METAL
tagline: Survive a 15-minute mosh pit fueled by death metal versions of IKEA
  product names.
description: >-
  KÖTTBULLAR METAL is a survival action game set in a mosh pit. A run lasts 15
  minutes, and the goal is to stay alive until the clock runs out. Fail, and you
  become a Köttbullar, the meatball of the title. The game mixes action, RPG,
  simulation, and musical elements.


  The joke is at the center: odd Swedish-style furniture names from a home-goods
  catalog are treated as brutal death metal lyrics. The result is a loud, absurd
  mix of flat-pack humor and heavy music. It placed 22nd out of 945 entries at
  Vibe Jam 2026 and took the Funniest Game award.


  The creator built it with Claude Code. The game supports multiplayer, and it
  is also playable on mobile devices, so friends can join the pit from a phone.
