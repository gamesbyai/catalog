slug: kottbullar-metal
title: KÖTTBULLAR METAL
tagline: Survive a 15-minute mosh pit fueled by death metal versions of IKEA
  product names.
description: >-
  KÖTTBULLAR METAL asks you to stay on your feet until the 15 minutes run out in
  a death metal mosh pit. If you don't make it, you become a Köttbullar, the
  meatball the game is named after.


  Odd Swedish-style furniture names from a home-goods catalog, read out as death
  metal lyrics. The show, billed as presented by NOTIKEA. Control of the singer
  and dancing with the moshers. Hunting for the band's secrets. A Mastery
  Journal tracking your finds among 33 secrets.


  Play with headphones, as the game suggests. Friends can join the pit online.
