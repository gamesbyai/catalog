slug: fever-trip
title: Fever Trip
tagline: Fight aliens and your own inner demons in a story-driven first-person shooter.
description: >-
  Fever Trip is a first-person shooter with a single-player campaign. You play
  an agent sent to look into a strange occurrence, only to learn that he is
  caught in the middle of a war with aliens. Progress comes from gunfights as
  the story unfolds around you.


  The game pairs its alien conflict with a psychological thread: the agent also
  has to fight his own inner demons, quite literally, before he loses his
  sanity. The creator says the focus was on storytelling and on making the
  shooting mechanics feel faithful and precise.


  It was made for Vibe Jam 2026 and runs in the browser on Three.js. The creator
  says they had always wanted to make video games and used Cursor to build this
  one.
