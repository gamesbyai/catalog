slug: fever-trip
title: Fever Trip
tagline: Fight aliens and your own inner demons in a story-driven first-person shooter.
description: >-
  An agent sent to look into a strange occurrence finds himself caught in the
  middle of a war with aliens, and in Fever Trip you play him. It is a
  story-driven first-person shooter with a single-player campaign, and the story
  moves forward through gunfights. It plays in the browser, rendered with
  Three.js.


  The aliens are only one front in this shooter-adventure. The agent also has to
  fight his own inner demons, quite literally, before he loses his sanity.
  According to the creator, the focus was on two things: storytelling, and
  shooting mechanics that feel faithful and precise.


  Making video games is something the creator says they had always wanted to do.
  This one came together in Cursor, and it finished 69th of the 945 entries at
  Vibe Jam 2026.
