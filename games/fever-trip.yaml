slug: fever-trip
title: Fever Trip
tagline: Fight aliens and your own inner demons in a story-driven first-person shooter.
description: >-
  Investigating a strange occurrence, an agent ends up in the middle of a war
  with aliens. You play the agent through a first-person campaign.


  Aiming down sights, reloading, sprinting, crouching and leaning around cover.
  Up to three weapons, switched with the number keys. Grenades and melee
  attacks. A second fight against the agent's inner demons, shown literally, to
  keep his sanity from breaking. Free Play mode as another option.


  Choose Story Mode, press New Game to begin, and start shooting.


  cr42yd09 focused on the gunplay. "Always wanted to make video games, and I
  like storytelling," the creator writes.
