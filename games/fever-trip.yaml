slug: fever-trip
title: Fever Trip
tagline: Fight aliens and your own inner demons in a story-driven first-person shooter.
description: >-
  You play an agent sent to look into a strange occurrence who ends up in the
  middle of a war with aliens. The campaign is first-person: choose Story Mode,
  press New Game, and start shooting. Free Play sits right below it in the menu.


  Gunplay is where the creator focused. You aim down sights, reload, sprint,
  crouch, and lean around cover. Up to three weapons are switched with the
  number keys, and you can throw grenades or hit enemies in melee.


  The story adds a second fight against the agent's inner demons, shown quite
  literally, as he tries to keep his sanity from breaking. The menu also holds
  an achievements list, a settings screen, and credits. The title screen is dark
  and red-lit.
