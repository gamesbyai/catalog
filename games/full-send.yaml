slug: full-send
title: FULL SEND
tagline: Race against other players in a fast 2D top-down style circuit racer.
description: >-
  FULL SEND is a 2D racing game inspired by Formula 1 and old-school arcade
  racers. Each run puts you on the track to push for position and a clean lap,
  with quick restarts so another attempt is never far away. It loads in about
  two seconds, so a session starts almost immediately.


  The game supports multiplayer and runs on mobile as well as desktop. It placed
  19th of 945 entries in Vibe Jam 2026. It also won the Most Portal Transfers
  award, a nod to how many players moved into it through the jam's portal links.


  The creator built it with Cursor. The short load time and the
  pick-up-and-retry loop give it the feel of a classic arcade racer, aimed at
  players who want one more lap.
