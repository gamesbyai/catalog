slug: primal-strain
title: Primal Strain
tagline: Draw a creature and spread its brood until no rival species is left.
description: "Draw your own creature, then lead its brood against rival species until none of them is left.


  Abilities you pick for your creature. Seed pods to gather as food. Eggs that grow your brood. Rival nests to break before they hatch new young. Four difficulty levels, from Easy all the way to Impossible.


  Press Enter to begin and choose a difficulty. Move with WASD, open the guide with Tab, and pause with Esc.


  Portal Rabbit says generative AI was used to some degree in the code, art, audio and text, though it doesn't name the tools or say how much was done by hand.


  It's a free demo that's still in development, with no account or download, and your progress saves in the browser. Portal Rabbit recommends playing on desktop."
