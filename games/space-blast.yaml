slug: space-blast
title: Space Blast
tagline: Dodge and shoot through asteroid fields, alone or with a friend on the
  same screen.
description: >-
  Space Blast is a 3D survival shooter set in outer space, played solo or as a
  couch co-op pair sharing one screen. You pilot a ship through dense fields of
  asteroids, shooting what you can and steering around the rest to stay alive
  while the pressure builds.


  Between the shooting and the dodging, you upgrade your loadout on the fly, so
  the ship you are flying keeps changing as a run goes on. Its creator credits
  the Cursor editor, with Three.js as the engine, and it also runs on phones.


  A run ends when the asteroids close in. Your score then goes to a leaderboard,
  which gives the next attempt a target to beat, whether you flew alone or with
  a friend on the couch.
