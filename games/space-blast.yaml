slug: space-blast
title: Space Blast
tagline: Dodge and shoot through asteroid fields, alone or with a friend on the
  same screen.
description: >-
  Space Blast puts a pilot in a 3D asteroid field with one job: survive as long
  as possible while shooting rocks apart. Before launching, you enter a required
  pilot call sign, which is used for the leaderboard, and pick a ship color from
  a dropdown.


  Three control schemes are offered on the start screen: touch, mouse, and
  keyboard. A daily run checkbox makes every player face the same asteroid
  sequence that day. Two pilots can share one screen by pressing 2 at the start.


  During a run you pick up shields, rapid fire, and drones to change your
  loadout as the rocks close in. Ship color palettes can be unlocked. Scores are
  kept locally, and a top 10 list of world runs is shown on a separate scores
  page. The menu also has features, briefing, and settings pages.
