slug: space-blast
title: Space Blast
tagline: Dodge and shoot through asteroid fields, alone or with a friend on the
  same screen.
description: >-
  Space Blast drops you into a 3D asteroid field where the only goal is to stay
  alive as long as you can while shooting the rocks apart. Your ship thrusts and
  aims in full 3D while the field closes in around you.


  Shields, rapid fire and drones turn up as pickups during a run, and grabbing
  them changes your loadout on the fly. Ship color palettes unlock too. It's a
  small cosmetic reward for anyone who cares how they look while dodging
  boulders.


  Before launching you have to enter a pilot call sign, a bit of paperwork that
  becomes your name on the leaderboard.


  The start screen lets you choose touch, mouse or keyboard controls, plus a
  dropdown for your ship's color that starts on a Classic scheme. Two pilots can
  also share one screen if you press 2 at the start.


  Tick the daily run box and every player gets the same asteroid sequence that
  day, a neat way to line your run up against everyone else's.


  Your own scores are kept locally. A separate scores page lists the top 10
  world runs. The menu also has pages for features, a briefing and settings.
