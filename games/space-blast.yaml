slug: space-blast
title: Space Blast
tagline: Dodge and shoot through asteroid fields, alone or with a friend on the
  same screen.
description: >-
  You pilot a ship through a field of asteroids in 3D, thrusting around and
  aiming at the rocks while they close in on you. Your goal is to survive and
  get a score onto the leaderboard.


  Before you launch, you type in a call sign, which the game requires. Then you
  pick how you'll steer: touch, mouse or keyboard. That's a handy spread if
  you're not sure what device you'll be on.


  There's also a ship color menu, plus unlockable palettes for your ship.


  Two people can share one screen, because pressing 2 at the start brings in a
  second pilot. So a friend on the couch can fly next to you instead of waiting
  for a turn.


  Along the way you upgrade your loadout with shields, rapid fire and drones,
  which means you can change how your ship fights in the middle of a run.


  You can tick a daily run option, and it gives everyone the same asteroid
  layout that day. That makes it a fair way to compare scores, since nobody gets
  luckier rocks than you.


  Scores are kept locally, and the game also lists the top 10 world runs.
