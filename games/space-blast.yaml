slug: space-blast
title: Space Blast
tagline: Dodge and shoot through asteroid fields, alone or with a friend on the
  same screen.
description: >-
  Space Blast puts you in a 3D asteroid field, and your goal is to stay alive as
  long as you can while shooting the rocks apart. Your ship thrusts and aims in
  full 3D while the field closes in around you.


  Shields, rapid fire and drones turn up as pickups during a run, and grabbing
  them changes your loadout on the fly. You can also unlock ship color palettes.
  The palettes are cosmetic and only change how your ship looks.


  You enter a pilot call sign before launching, and it becomes your name on the
  leaderboard.


  You can play with touch, mouse or keyboard controls, and pick your ship's
  color from a list that starts on the Classic scheme. Two pilots can also share
  one screen if you press 2 at the start.


  A daily run mode gives every player the same asteroid sequence that day, so
  your run can be lined up against everyone else's.


  Your own scores are kept locally. The top 10 world runs make up the world
  leaderboard.
