slug: space-blast
title: Space Blast
tagline: Dodge and shoot through asteroid fields, alone or with a friend on the
  same screen.
description: >-
  Survive as long as you can in a 3D asteroid field, blasting rocks apart. Your
  ship thrusts and aims in full 3D while the field closes in.


  Shields, rapid fire and drone pickups changing your loadout on the fly. A
  daily run with one asteroid sequence for every player, so runs can be compared
  with everyone else's. Top 10 world runs on the world leaderboard, with
  personal scores kept locally.


  Play with touch, mouse or keyboard. Press 2 at the start to share one screen
  with a second pilot.
