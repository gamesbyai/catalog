slug: rescue-from-the-shadows
title: RESCUE FROM THE SHADOWS
tagline: Explore a dark world and learn digital security and Web3 along the way.
description: >-
  Someone needs bringing back out of the darkness, and in Rescue From the
  Shadows that is your job. As a narrative puzzle game, it has you explore a
  dark world step by step and move the story forward by working through the
  situations it puts in front of you.


  ChatGPT is the tool the creator lists for making it, and the game is set up
  for multiplayer. In Vibe Jam 2026 it ranked 529th of the 945 entries.


  The puzzles double as lessons. Ideas from digital security and Web3 are woven
  into the exploration and the puzzles, so understanding them is part of how you
  progress. The creator's aim was a game that adds real value instead of being
  pure entertainment.
