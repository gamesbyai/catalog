slug: rescue-from-the-shadows
title: RESCUE FROM THE SHADOWS
tagline: Explore a dark world and learn digital security and Web3 along the way.
description: >-
  Explore a hidden house swallowed by a living darkness and free the guardians
  of knowledge sealed inside.


  Suiken, a cheerful monkey hero. Puzzles that double as lessons in digital
  security and Web3, like a terminal asking what a seed phrase is. Narration in
  every scene. The Shadow, which feeds on failure, fear and forgetting. English
  and Portuguese text.


  xsuikem wanted a game that teaches while you play, not pure entertainment.
