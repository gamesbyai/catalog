slug: rescue-from-the-shadows
title: RESCUE FROM THE SHADOWS
tagline: Explore a dark world and learn digital security and Web3 along the way.
description: >-
  Rescue From the Shadows is a narrative puzzle game set in a dark world that
  the player explores step by step. Progress comes from working through the
  situations the story presents, with the goal of bringing someone back out of
  the darkness.


  The game is built around a teaching idea: the creator wanted something
  immersive that also adds real value instead of being pure entertainment.
  Lessons about digital security and Web3 are woven into the exploration and
  puzzles, so understanding those topics is part of moving forward.


  It was entered in Vibe Jam 2026, where it placed 529 of 945 entries. The
  creator lists ChatGPT as the tool used to make it, and the game is set up for
  both mobile play and multiplayer.
