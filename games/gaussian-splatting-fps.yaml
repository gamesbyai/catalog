slug: gaussian-splatting-fps
title: Gaussian Splatting FPS
tagline: Shoot your way through a first-person level built from a real-world 3D scan.
description: >-
  The level here is a real place, captured as a Gaussian Splat scan, and you're
  walking through it with a carbine in your hands. WASD moves you, C drops you
  into a crouch, and the mouse button fires.


  All that softness hides a big headache, because splat scans are static and
  there's no geometry in them at all. The game has to bring its own collision,
  moving objects, navigation and rendering fixes, since the scan doesn't come
  with any of it.


  yak32 got the idea while scrolling through SuperSplat and spotting spaces that
  already looked like FPS or horror levels. They tackled those problems with an
  AI code editor and say they've cracked most of them. Making games has been
  their favorite hobby for years, though they'd rarely finished one, and they
  credit AI with finally changing that.


  The carbine model comes from DJMaesen on Sketchfab, and Christoph Schindelar
  made the splat environment.


  yak32 also wrote up the whole process for the PlayCanvas blog. It's a
  walkthrough of how the scan was turned into a level you can actually play.
