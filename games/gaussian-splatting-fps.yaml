slug: gaussian-splatting-fps
title: Gaussian Splatting FPS
tagline: Shoot your way through a first-person level built from a real-world 3D scan.
description: >-
  You move through a first-person view of a real place captured as a Gaussian
  Splat scan. Move with WASD, crouch with C, and fire a carbine with the mouse
  button. A crosshair sits at screen center, and a red health bar and a 30 / 30
  ammo counter show in the corners.


  Splat scans are static and carry no geometry, so the game has to supply
  collision, dynamic objects, navigation and rendering compatibility itself. The
  creator worked through these with an AI code editor and says most of them were
  solved. The scan renders as soft, blurred surfaces with smeared detail up
  close, and the screen edges have a curved, vignetted look.


  The carbine model is by DJMaesen on Sketchfab, and the splat environment is by
  Christoph Schindelar. The creator also published a writeup on the PlayCanvas
  blog covering how the scan was turned into a playable level.
