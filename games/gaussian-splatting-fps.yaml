slug: gaussian-splatting-fps
title: Gaussian Splatting FPS
tagline: Shoot your way through a first-person level built from a real-world 3D scan.
description: >-
  Carbine in hand, you walk through a real place captured as a Gaussian Splat.
  Splat scans are static and have no geometry at all. The scan has no game
  systems, so the game makes its own.


  Collision for the scan. Moving objects in the level. Navigation and rendering
  fixes.


  Move with WASD, crouch with C, and fire with the mouse button.


  yak32 got the idea while browsing SuperSplat and seeing spaces that already
  looked like FPS or horror levels. They've made games as a hobby for years, but
  they hardly ever finished one, and they say AI finally changed that. They say
  they've solved most problems with an AI code editor.


  The carbine model comes from DJMaesen on Sketchfab, and Christoph Schindelar
  made the splat environment. yak32 also wrote a walkthrough for the PlayCanvas
  blog on how the scan became a playable level.
