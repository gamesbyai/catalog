slug: gaussian-splatting-fps
title: Gaussian Splatting FPS
tagline: Shoot your way through a first-person level built from a real-world 3D scan.
description: >-
  Gaussian Splatting FPS is a browser first-person shooter set inside a Gaussian
  Splat scan of a real place. The player moves through the scanned environment
  from a first-person view and fights within its walls, corridors and open
  areas, playing directly in the browser.


  The main draw is the setting. Gaussian Splats are static, so the project had
  to work out collision, dynamic objects, navigation and rendering compatibility
  on its own. The result puts a shooter inside a photographic space instead of a
  hand-modeled level. It was entered in Vibe Jam 2026 and also supports mobile.


  The creator built it with Cursor and says most of the technical obstacles were
  solved that way. They describe making games as a longtime hobby and credit AI
  with helping them finally finish a project. A full writeup is available on the
  PlayCanvas blog.
