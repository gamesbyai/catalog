slug: gaussian-splatting-fps
title: Gaussian Splatting FPS
tagline: Shoot your way through a first-person level built from a real-world 3D scan.
description: >-
  Gaussian Splatting FPS sets a single-player first-person shooter inside a
  Gaussian Splat scan of a real place. Instead of a hand-modeled level, you move
  through a photographic space and fight among its walls, corridors and open
  areas, on a computer or a phone.


  Getting there took work. Gaussian Splats are static, so the project had to
  solve collision, dynamic objects, navigation and rendering compatibility on
  its own, and the creator says Cursor got them past most of those technical
  obstacles. It finished 103rd of 945 at Vibe Jam 2026.


  Making games has long been a hobby for the creator, and they credit AI with
  helping them finally finish a project. It is built on PlayCanvas, and a full
  writeup of the project is on the PlayCanvas blog.
