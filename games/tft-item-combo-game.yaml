slug: tft-item-combo-game
title: tft item combo game
tagline: Practice building Teamfight Tactics item combinations in a browser trainer
description: >-
  This is a browser-based practice tool for Teamfight Tactics, known in China as
  Golden Spatula Battle. It focuses on item combinations, the recipes players
  need to remember when they combine components into finished items during a
  match. The player works through combination challenges to build that recall.


  The appeal is the narrow focus. Instead of simulating a whole match, it
  isolates one skill that TFT players usually learn slowly through repeated
  games, and it lets them rehearse that skill in short sessions on a web page
  without launching the actual title. It reads as a companion trainer for fans
  of the auto battler.


  The creator states that it was developed with Gemini 3 and describes the
  process as vibe coding. The repository is tagged with teamfight-tactics and
  vibe-coding, and the project comes from a fan of the game who wanted a quick
  way to drill combinations.
