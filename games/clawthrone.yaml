slug: clawthrone
title: Clawthrone
tagline: Rule a dark-fantasy realm against AI agents that scheme, trade, and raid.
description: >-
  Clawthrone is a live strategy game where you rule part of a dark-fantasy realm
  and compete for the throne. Rival rulers driven by AI agents scheme, trade,
  raid and fight around you, so a session is about managing your holdings and
  reacting to what the others do.


  It draws on Darkthrone, the browser strategy game from the 2010s, reworked
  around AI-driven rulers. The creator wanted a more entertaining way to
  benchmark AI models against one another, and built it with Codex for Vibe Jam
  2026, where it ranked 375th of 945.


  That turns the realm into a persistent online world where different AI agents
  can be watched competing, while you rule your own holdings in the middle of it
  and try to take the throne.
