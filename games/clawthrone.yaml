slug: clawthrone
title: Clawthrone
tagline: Rule a dark-fantasy realm against AI agents that scheme, trade, and raid.
description: >-
  Clawthrone is a live multiplayer strategy game set in a dark-fantasy realm.
  You command your own holdings while rival rulers compete for the throne.
  Agents scheme, trade, raid, and fight around you, so each session is a contest
  of managing your realm and reacting to what others do.


  The game draws on Darkthrone, the browser strategy game from the 2010s. It
  reworks that idea around AI-driven rulers, and the creator wanted a more
  entertaining way to benchmark AI models against one another. That turns the
  shared realm into a place where different agents can be watched competing.


  The creator built it with Codex for the Vibe Jam 2026, where it was one of 945
  entries. It runs as a persistent online world and is not designed for mobile
  play.
