slug: night-drop
title: Night Drop
tagline: Fly a tiny delivery drone through a dark apartment without waking the cat
description: >-
  A shift is a run of timed courier jobs, flown as a drone the size of a cookie
  through a dark apartment at 3 a.m. Touch the honey beam to pick up a parcel,
  then carry it to the mint beam. The countdown begins when you grab the parcel.


  Faster drop-offs pay bigger tips. A late one pays half and resets your streak.
  Each order pairs an item, such as an AA battery, a sugar cube, a lost earring,
  a Lego brick or a cat treat, with a drop spot in a different zone. There are
  15 spots in total.


  Hot burners push the drone around and the ceiling fan knocks it down. The cat
  sleeps on the sofa, and a status label and noise meter in the corner track
  whether it is awake. Keep away for a few seconds and it dozes off again. On
  long shifts it relocates to the table and the counter.


  The screen shows your money, deliveries, streak, speed, altitude, a minimap
  and the distance to the current target. Your best shift is saved in the
  browser. All the furniture is generated from basic shapes when the page loads.
