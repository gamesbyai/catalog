slug: night-drop
title: Night Drop
tagline: Fly a tiny delivery drone through a dark apartment without waking the cat
description: >-
  A shift is a run of timed courier jobs in a giant apartment at 3 a.m. You fly
  a cookie-sized drone and deliver tiny parcels. Don't wake the cat.


  Random orders pairing an AA battery, a sugar cube, a lost earring, a Lego
  brick or a cat treat with one of fifteen spots in another zone. Bigger tips
  for faster drops, and half pay with a reset streak when late. Hot burners that
  push the drone around. The ceiling fan that knocks the drone down. Cat
  sleeping on the sofa, moving to the table and counter on long shifts. Your
  best shift, saved in the browser.


  Touch the pickup beam to grab a parcel. The countdown starts when you grab the
  parcel. Carry the parcel to the drop-off beam. Keep track of whether the cat
  wakes up. Stay away from the cat for a few seconds, and it dozes off again.


  According to Gipppp121, ideas and prompts came from one AI model, and the code
  was built with another. All the furniture is generated from basic shapes when
  the page loads.
