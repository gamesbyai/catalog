slug: night-drop
title: Night Drop
tagline: Fly a tiny delivery drone through a dark apartment without waking the cat
description: >-
  A shift is a run of timed courier jobs, where you fly a drone through an
  apartment. Touch the pickup beam to grab a parcel, then carry it to the
  drop-off beam. The countdown begins when you grab the parcel.


  Faster drop-offs pay bigger tips. A late one pays half and resets your streak.
  Each order pairs an item, such as an AA battery, a sugar cube, a lost earring,
  a Lego brick or a cat treat, with a drop spot in a different zone. There are
  15 spots in total.


  Hot burners push the drone around and the ceiling fan knocks it down. The cat
  sleeps on the sofa, and you need to keep track of whether it wakes up. Keep
  away for a few seconds and it dozes off again. On long shifts it relocates to
  the table and the counter.


  Your best shift is saved in the browser. All the furniture is generated from
  basic shapes when the page loads.
