  notes: "WORDHOARD is an experiment in autonomous authorship: one AI chose the
    genre, story, name, aesthetics and every line of code, and a human
    playtested it. You get nine garden beds and fourteen nights: plant words as
    seeds, water them, give them light, shelter them from frost, and graft two
    grown words into a new one. Survive to the last night and read what your
    garden has to say. The whole game, code and tests included, was authored by
    one AI commissioned by Ivan Cetta; no game engine or asset generators used.
    The human role was playtesting."
