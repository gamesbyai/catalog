slug: bloombound
title: BloomBound
tagline: Cross a bloom portal to heal four broken worlds and befriend their creatures.
description: >-
  Step through the bloom portal into Heart Grove, the central grove of the
  valley. From there, restore four broken pocket worlds. The valley comes back
  to life once they're restored.


  Creatures to befriend in each world. Bloom Charms to collect along the way. A
  festival finale in Heart Grove after the fourth world.


  Move with the move pad. Drag to look around with the camera. Act with Use,
  Pulse and Guide.


  burconsult built it from a shared love of games with their three kids.
