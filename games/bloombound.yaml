slug: bloombound
title: BloomBound
tagline: Cross a bloom portal to heal four broken worlds and befriend their creatures.
description: >-
  BloomBound is a 3D adventure in which the player steps through a bloom portal
  into four broken worlds. Each world needs to be restored, and the creatures
  living there can be befriended along the way. The goal is to bring the
  withered valley back to life.


  The game is framed as a gentle, family-friendly quest built around restoration
  and friendship rather than combat. Moving between separate worlds gives the
  adventure a hub-and-portal structure, with the valley acting as the thing you
  are slowly repairing as you progress.


  It was entered in Vibe Jam 2026 and runs in the browser on Three.js. The
  creator says it grew out of a shared love of games with their three kids, and
  built it with Codex.
