slug: bloombound
title: BloomBound
tagline: Cross a bloom portal to heal four broken worlds and befriend their creatures.
description: >-
  Stepping through the bloom portal starts at a Bloom Passport screen. Type a
  gardener name, pick one of six glow colors, then press Enter Portal for a new
  run or Use Saved to load a stored profile. An opening voice note can be played
  or skipped.


  You arrive in Heart Grove, the central grove, and from there restore four
  broken pocket worlds. Each world has creatures to befriend, and Bloom Charms
  are collected along the way. The valley comes back to life once the worlds are
  restored.


  After the fourth world you return to Heart Grove for a festival finale.
  On-screen buttons cover movement with a move pad, a drag-to-look camera, and
  Use, Pulse and Guide actions. The creator built it from a shared love of games
  with their three kids.
