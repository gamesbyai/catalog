slug: camelock-dungeon-time
title: "Camelock : Dungeon Time"
tagline: Shoot your way through a dungeon where time moves only when you do.
description: >-
  Camelock : Dungeon Time is a dungeon shooter in the spirit of SUPERHOT. Time
  is tied to the player: every step, shot, and dodge advances the world, so
  standing still keeps enemies and bullets frozen. Each run is a matter of
  deciding when to act and when to hold back.


  The core idea is that movement is the clock. Because the action only advances
  when you commit to something, fights become small puzzles about positioning,
  timing, and picking the next shot carefully. It runs in the browser on a
  Three.js foundation and is marked as playable on mobile.


  It was entered in Vibe Jam 2026. The creator built it with Codex and said they
  wanted to see how far resourcefulness and effort could go, partly to impress
  their 9-year-old son.
