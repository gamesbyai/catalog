slug: starfall-survivor
title: Starfall-Survivor
tagline: Fight waves of enemies in a 3D arena and pick upgrades for your star blades.
description: >-
  The first thing you see is a small card over a blurred, beige arena with the
  title and a big green Enter the Arena button. It lists three controls, so you
  know how to move before you start, and it tells you your attacks and skills
  fire on their own.


  You steer a void hunter around a 3D arena while your star blades do the
  hitting.


  Since the attacking is automatic, your job is movement. You're positioning
  yourself while waves of enemies close in, and you're not aiming or pressing a
  fire button.


  Every time you level up, you get to choose an upgrade. That's how a build
  takes shape, because the upgrades you pick decide how your blades tear through
  the next wave, which is the satisfaction the creator says they were chasing.


  The goal is to be the one hunter left standing in the arena.


  On a keyboard you move with WASD or the arrow keys, and on a phone there's a
  touch joystick. It's a nice touch that the start card spells out both before
  you press anything.
