slug: starfall-survivor
title: Starfall-Survivor
tagline: Fight waves of enemies in a 3D arena and pick upgrades for your star blades.
description: >-
  Play a void hunter in a 3D survival arena, holding off waves of enemies.


  Automatic star blade attacks and skills. One upgrade from a set of strong
  options at each level-up. A build made from the upgrades you take.


  Move with WASD or the arrow keys, or use the touch joystick on a phone.
  Movement and upgrade picks are mostly the only decisions you make.


  David282213 calls it a fast-paced survival brawler, inspired by the
  satisfaction of watching a build tear through waves.
