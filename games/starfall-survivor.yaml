slug: starfall-survivor
title: Starfall-Survivor
tagline: Fight waves of enemies in a 3D arena and pick upgrades for your star blades.
description: >-
  A cream-colored card sits over a blurred arena when the game loads, with the
  line "Void hunters enter. One survives." under the title. It lists three
  hints, WASD or the arrow keys to move, a touch joystick for phones, and an
  Auto tag saying your attacks and skills fire on their own. Press the big
  green Enter the Arena button and the run begins.


  Inside, you're a void hunter in a 3D survival arena, holding off waves of
  enemies with star blades.


  Steering is your whole job here, since the attacks go off without you. All
  you're doing is moving around the arena as the enemies arrive.


  Leveling up is where the real choices happen. Each time you level, you get to
  take one upgrade from a set of strong options, and those picks add up to the
  build you're running with. With the fighting automated, those upgrades are
  pretty much the only thing you decide besides where you go.


  David282213 calls it a fast-paced survival brawler, inspired by the
  satisfaction of watching a build tear through waves.
