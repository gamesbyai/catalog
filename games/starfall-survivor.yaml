slug: starfall-survivor
title: Starfall-Survivor
tagline: Fight waves of enemies in a 3D arena and pick upgrades for your star blades.
description: >-
  The start screen is a cream card over a blurred arena, listing three hints:
  WASD or arrow keys to move, a touch joystick on mobile, and an Auto note
  saying attacks and skills fire themselves. A green Enter the Arena button
  starts the run.


  Inside is a 3D survival arena where you play a void hunter fighting waves of
  enemies with star blades. You only steer your character. Attacks fire
  automatically, so your input is movement through the arena as enemies arrive.


  Each level-up lets you choose one upgrade from a set of powerful options, so
  the picks you make shape the build. The creator describes it as a fast-paced
  survival brawler, inspired by the satisfaction of watching a build tear
  through waves.
