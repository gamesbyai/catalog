slug: rally-positano
title: Rally Positano
tagline: Drive a rally car along the scenic coastal roads around Positano.
description: >-
  Rally Positano is a browser racing game set in the scenic region of Positano.
  The player takes the wheel of a rally car and races along the coastal setting,
  aiming to get through the course in a relaxed but competitive drive.


  The game leans on atmosphere as much as speed. Its creator describes it as a
  nice, scenic drive, so the setting is the main attraction, and the racing is
  meant to be enjoyable rather than punishing. Multiplayer is supported, which
  lets players share the road with others.


  It was built with Three.js for the 3D rendering. The creator used Codex to
  make it, and it was entered in Vibe Jam 2026, where it placed 42nd out of 945
  entries.
