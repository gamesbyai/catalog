slug: slime-escape
title: Slime Escape
tagline: Survive ten waves of mutant slimes, beat the boss, and flee through a
  suspicious portal.
description: >-
  The game opens on grid-paper ground. A hand-drawn character in a blue striped
  shirt and purple pants stands in the middle, with green one-eyed slimes close
  by. A black portal with a colored rim sits at the right edge. A counter at top
  right reads Wave 1/10, with ten dots leading to a checkered flag.


  You move with WASD and shoot with the left mouse button. Five weapon slots run
  along the bottom of the screen, numbered 1 to 5. The icons show a pointed
  yellow shot, a pink blob, a green dart, a thin pink and green needle, and a
  green grenade.


  The goal is to survive ten waves of mutant slimes, beat the boss, and escape
  through the portal. The portal's rim changes color from one moment to the
  next. A small purple spiky creature lies on the field with sleeping z marks
  beside it. The scribbled look comes from the creator's son's hand-drawn worlds
  of strange creatures and machines.
