slug: slime-escape
title: Slime Escape
tagline: Survive ten waves of mutant slimes, beat the boss, and flee through a
  suspicious portal.
description: >-
  Slime Escape is a 3D action shooter built around ten waves of mutant slimes.
  You fend them off wave after wave until a boss appears, and beating the boss
  opens a portal out of the arena.


  The premise comes from a child's hand-drawn fantasy worlds, full of odd
  creatures, strange machines, and tiny stories. That origin sets the tone: the
  slimes and machinery read like sketchbook inventions grown into a playable
  arena. The build uses Three.js and was made with Cursor, and the game came
  83rd of 945 entries in Vibe Jam 2026.


  The portal is the last joke. Stepping through it is the way out, even though
  the game itself warns that the portal is not to be trusted.
