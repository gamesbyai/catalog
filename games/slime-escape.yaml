slug: slime-escape
title: Slime Escape
tagline: Survive ten waves of mutant slimes, beat the boss, and flee through a
  suspicious portal.
description: >-
  Alone, you fight through ten waves of mutant slimes, beat the boss and leave
  through a portal. By the game's own admission, that exit definitely shouldn't
  be trusted.


  Five numbered weapon slots, a grenade among them.


  Move with WASD and shoot with the left mouse button to take on the slimes.


  alxdos_ took the scribbled look from their son's hand-drawn fantastic worlds,
  full of strange creatures and weird machines. According to alxdos_, the
  drawings held "tiny stories that looked like they wanted to become a game."
