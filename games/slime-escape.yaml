slug: slime-escape
title: Slime Escape
tagline: Survive ten waves of mutant slimes, beat the boss, and flee through a
  suspicious portal.
description: >-
  Grid paper covers the screen when the game loads, a bit like a page torn from
  a math notebook. A hand-drawn guy in a blue striped shirt and purple pants
  stands in the middle, and there are green one-eyed slimes close by.


  Up in the top right corner, a counter reads Wave 1/10, with ten dots running
  out to a checkered flag.


  You move with WASD and shoot with the left mouse button. Five weapon slots
  numbered 1 to 5 line the bottom of the screen. Their doodled icons make for
  a mixed arsenal, from a pointed yellow shot and a pink blob to a green dart,
  a thin pink-and-green needle and a green grenade.


  Your goal is to get through ten waves of mutant slimes, take down the boss and
  then leave through the portal. It's the black oval at the right edge, and its
  rim keeps switching colors from one moment to the next. By the game's own
  admission, it's an exit that definitely shouldn't be trusted.


  For some reason there's also a small purple spiky creature lying on the field
  with little z marks drifting beside it, apparently sleeping through the whole
  slime situation.


  alxdos_ took the scribbled look from their son's hand-drawn fantastic worlds.
  Those drawings were full of strange creatures and weird machines. According to
  alxdos_, the tiny stories in them looked like they wanted to become a game.
