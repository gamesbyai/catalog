slug: slime-escape
title: Slime Escape
tagline: Survive ten waves of mutant slimes, beat the boss, and flee through a
  suspicious portal.
description: >-
  You move with WASD and shoot with the left mouse button. You have five weapon
  slots, numbered 1 to 5. Those weapons run from a pointed yellow shot and a
  pink blob to a green dart, a thin pink-and-green needle and a green grenade.


  Your goal is to get through ten waves of mutant slimes, take down the boss and
  then leave through the portal. By the game's own admission, it's an exit that
  definitely shouldn't be trusted.


  alxdos_ took the scribbled look from their son's hand-drawn fantastic worlds.
  Those drawings were full of strange creatures and weird machines. According to
  alxdos_, the tiny stories in them looked like they wanted to become a game.
