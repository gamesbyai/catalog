slug: slime-escape
title: Slime Escape
tagline: Survive ten waves of mutant slimes, beat the boss, and flee through a
  suspicious portal.
description: >-
  You start on grid paper, playing a scribbled guy in a blue shirt and purple
  pants. Green one-eyed slimes are already crowding around you, and a black
  portal sits off to the right.


  A small purple creature is asleep nearby with zzz's floating over it, which is
  a pretty calm sight with all those slimes about.


  You move with WASD and shoot with a left click. Five numbered weapon slots run
  along the bottom of the screen, each with its own drawn icon, from a pointed
  shard to a pink blob to a green grenade.


  Your job is to survive ten waves of mutant slime. A row of ten dots in the top
  corner shows which wave you're on, and a checkered flag sits after the last
  dot, so you can see the finish line from the very start. A boss waits after
  the final wave, and you have to beat it before you can leave.


  That portal's ring keeps changing color, pink one moment and blue or pale
  purple the next, which is an odd habit for an exit.


  The portal is your way out, though the creator warns it shouldn't be trusted.
  The game grew out of the creator's son's drawings of strange creatures, weird
  machines and tiny stories, so the scribbled look is where it all started.
