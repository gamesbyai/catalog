slug: slime-escape
title: Slime Escape
tagline: Survive ten waves of mutant slimes, beat the boss, and flee through a
  suspicious portal.
description: >-
  Slime Escape is a 3D action game built around ten waves of mutant slimes. Each
  run has you fending off the oncoming creatures wave after wave until a boss
  appears. Defeating it opens a portal, and stepping through is the way out,
  though the game warns that the portal is not to be trusted.


  The premise comes from a child's hand-drawn fantasy worlds, full of odd
  creatures, strange machines, and tiny stories. That origin shapes the tone:
  the slimes and the machinery feel like sketchbook inventions that grew into a
  playable arena, and the portal gag adds some mischief to the finale.


  The creator built it with Cursor, and it runs in the browser on Three.js. It
  was entered in Vibe Jam 2026, where it placed 83rd among 945 entries.
