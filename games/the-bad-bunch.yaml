slug: the-bad-bunch
title: The Bad Bunch
tagline: Place monkey defenders to stop waves of bad bananas in a jungle last stand.
description: >-
  You lead a troop of jungle monkeys and place them along a path to stop waves
  of furious bananas before they reach your city. Your city starts at 100
  health, and your wallet starts at $200, enough for four of the cheapest
  monkeys.


  Basic, Ice, Flame and Lightning monkeys. A mission in each level, the first
  one holding out until Wave 20 for 3 gems and access to Level 2. Gems from any
  beaten level, spent on monkey upgrades. Each beaten level opening the next
  one. Additional levels 3 to 8, added later.


  Buy one of the four monkeys in the shop and place it on the path. Lightning is
  unavailable at the start. Pick a monkey already on the path, then sell it or
  deselect it. Switch between 1x and 2x speed during a run.


  A father and his 10-year-old son made it together, and Bloons inspired it.
