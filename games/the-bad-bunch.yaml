slug: the-bad-bunch
title: The Bad Bunch
tagline: Place monkey defenders to stop waves of bad bananas in a jungle last stand.
description: >-
  In The Bad Bunch the bananas have turned hostile, and a troop of jungle
  monkeys is making its last stand. It is a tower-defense game in 3D, playable
  on phones as well as desktop: you position monkey defenders to hold back each
  wave of bad bananas, and the rounds move quickly.


  It began as a father-and-son project, made together after the creator's
  10-year-old son asked to create a game of his own. Bloons, one of the son's
  favorites, was the inspiration, and the creator made it with Codex on
  Three.js. Out of 945 Vibe Jam 2026 entries, it came 172nd.


  That influence shows in the playful premise: monkeys on defense, bananas on
  the attack. The tone stays humorous throughout, and the short, comic showdowns
  keep sessions light.
