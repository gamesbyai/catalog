slug: the-bad-bunch
title: The Bad Bunch
tagline: Place monkey defenders to stop waves of bad bananas in a jungle last stand.
description: >-
  You're in charge of a troop of jungle monkeys, and your job is to line them up
  along a winding dirt path so the waves of oddly furious bananas never make it
  to your city. The city starts on 100 health and your wallet starts at $200,
  which covers four of the cheapest monkeys and not much else.


  The shop down the right side holds four monkeys. Basic costs $50, Ice is $75,
  Flame is $150 and Lightning is a pretty steep $225, though Lightning shows up
  greyed out at the start. If you pick a monkey that's already on the path, you
  can sell it or just deselect it.


  Every level opens on a mission card, and the first one wants you to hold out
  until Wave 20 in exchange for 3 gems and access to Level 2.


  At least you can see trouble coming, since a countdown up top shows when the
  next wave arrives and how many bananas are in it. During a run you can pause
  or flip between 1x and 2x speed. There are also buttons to mute the sound or
  go fullscreen.


  Beating any level pays out gems and opens up the next one in line.


  Those gems go toward monkey upgrades on the main menu, so every cleared
  mission feeds back into a stronger troop. Levels 3 to 8 have been added since.


  A father and his 10-year-old son made it together, and it takes its
  inspiration from Bloons.
