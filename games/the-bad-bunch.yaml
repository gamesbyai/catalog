slug: the-bad-bunch
title: The Bad Bunch
tagline: Place monkey defenders to stop waves of bad bananas in a jungle last stand.
description: >-
  You're in charge of a troop of jungle monkeys, and your job is to line them up
  along the path so the waves of furious bananas never make it to your city. The
  city starts on 100 health and your wallet starts at $200, enough for four of
  the cheapest monkeys.


  The shop holds four monkeys. Basic costs $50, Ice is $75, Flame is $150 and
  Lightning costs $225, and it is unavailable at the start. If you pick a monkey
  that's already on the path, you can sell it or just deselect it.


  Each level has a mission, and the first one asks you to hold out until Wave 20
  for 3 gems and access to Level 2. During a run you can flip between 1x and 2x
  speed.


  Beating any level pays out gems and opens up the next one in line.


  Those gems go toward monkey upgrades. Levels 3 to 8 have been added since.


  A father and his 10-year-old son made it together, and it takes its
  inspiration from Bloons.
