slug: the-bad-bunch
title: The Bad Bunch
tagline: Place monkey defenders to stop waves of bad bananas in a jungle last stand.
description: >-
  The Bad Bunch is a tower-defense game in which a troop of jungle monkeys makes
  a last stand against waves of hostile bananas. Players position monkey
  defenders to hold back each wave, and the rounds move quickly with a humorous
  tone throughout.


  The game was inspired by Bloons, a favorite of the creator's 10-year-old son,
  and that influence shows in its playful monkeys-versus-invaders premise. It is
  built in 3D with Three.js and runs in the browser, with support for mobile
  play. The short, comic showdown format keeps sessions light.


  It began as a father-and-son project, made together after the son asked to
  create a game. The creator built it with Codex, and it was entered in Vibe Jam
  2026, where it placed 172nd out of 945 entries.
