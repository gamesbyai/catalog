slug: the-bad-bunch
title: The Bad Bunch
tagline: Place monkey defenders to stop waves of bad bananas in a jungle last stand.
description: >-
  You place monkey towers along a winding dirt path to stop waves of angry
  bananas before they reach your city, which starts with 100 health and $200.
  Each level opens with a mission card. Level 1 asks you to survive to Wave 20
  for 3 gems.


  The shop on the right lists four monkeys: Basic for $50, Ice for $75, Flame
  for $150 and Lightning for $225. Lightning appears greyed out at the start. A
  countdown shows when the next wave arrives and how many bananas are in it. A
  selected tower can be sold or deselected.


  Clearing a level pays out gems and unlocks the next one. Gems go toward monkey
  upgrades, which you reach from the main menu, and levels 3 to 8 have been
  added. During a run you can pause, switch between 1x and 2x speed, mute the
  sound or go fullscreen. A father and his 10-year-old son made it together,
  inspired by Bloons.
