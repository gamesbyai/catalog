slug: undersphere
title: Undersphere
tagline: Run and shoot opponents on the inside surface of a hollow sphere.
description: >-
  Every match is a first-person deathmatch about racking up kills.


  The action happens on the inside of a hollow sphere. Gravity pulls you toward
  the curved ground under your feet.


  You've got three slots to switch between, holding an assault rifle with a
  30-round magazine, a second long gun and a grenade. The grenade is where the
  setting really shows off, because it stays under the sphere's pull and flies
  with proper proportions, so a long throw can come down on the opposite side of
  the world.


  When a lobby's still short of people, it waits for one more player. Bots play
  in matches as well. Whenever someone new pulls ahead, the game calls out the
  new kill leader.


  _NoahWhiteson came up with the movement mechanics and built them to feel fair
  and conventional, even with the gravity shifting around you.
