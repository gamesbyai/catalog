slug: undersphere
title: Undersphere
tagline: Run and shoot opponents on the inside surface of a hollow sphere.
description: >-
  In each multiplayer first-person deathmatch, you run, fight and outmaneuver
  other players to rack up kills. The action takes place on the inside of a
  hollow sphere, where gravity pulls you toward the curved ground under your
  feet.


  Assault rifle with a 30-round magazine, one of three slots you switch between.
  Second long gun, carried alongside the rifle and the grenade. Grenades that
  stay under the sphere's pull and fly with proper proportions, including long
  throws to the far side. Bots that play in matches as well. Kill-leader
  call-outs whenever someone new pulls ahead. Lobbies that wait for one more
  player when they're short of people.


  The movement mechanics are _NoahWhiteson's own design, built to feel fair and
  conventional even as gravity shifts around you.
