slug: undersphere
title: Undersphere
tagline: Run and shoot opponents on the inside surface of a hollow sphere.
description: >-
  Every match is a first-person deathmatch about racking up kills, with a
  scoreboard in the corner ranking the top three players beside your own place
  and kill tally.


  All of it happens on the inside of a hollow sphere. Gravity pulls you down
  onto the curved ground under your feet, while the horizon climbs upward until
  the rest of the map hangs in the sky above you, which is an odd thing to see
  over your gun sights. Everything's drawn in black-and-white cartoon outlines,
  with tall grass, pine trees and dark crates scattered over terrain that curls
  up and away from you.


  You've got three slots to switch between: an assault rifle with a 30-round
  magazine, a second long gun and a grenade. The grenade is where the setting
  really shows off, because it stays under the sphere's pull and flies with
  proper proportions, so a long throw can come down on the opposite side of the
  world.


  Your health sits in the bottom corner of the screen, and a coin counter tucks
  in just under the scoreboard.


  When a lobby's still short of people, a banner across the top tells you it's
  waiting for one more player. Bots show up on the scoreboard as well. Whenever
  someone new pulls ahead, a big yellow banner gives the new kill leader their
  moment.


  _NoahWhiteson came up with the movement mechanics and built them to feel fair
  and conventional, even with the gravity shifting around you.
