slug: undersphere
title: Undersphere
tagline: Run and shoot opponents on the inside surface of a hollow sphere.
description: >-
  You run and shoot on the inside surface of a hollow sphere, where gravity
  pulls you toward the curved ground and the horizon rises into the sky above
  you. Matches are multiplayer first-person deathmatch. A scoreboard in the
  corner ranks the top three players and shows your own rank and kill count.


  You carry three slots: an assault rifle with a 30-round magazine, a second
  long gun, and a grenade. A grenade thrown across the map stays under the
  sphere's gravity and travels with proper proportions, so it can land on the
  far side of the world. A health counter and a coin counter sit in the HUD.


  A banner at the top of the screen shows when a lobby is waiting for another
  player. Bots appear on the scoreboard, and a banner announces each new kill
  leader. The world is drawn in black-and-white cartoon outlines, with tall
  grass, pine trees and dark crates scattered across the curved terrain. The
  creator built the movement mechanics to feel fair and conventional despite the
  shifting gravity.
