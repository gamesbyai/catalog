slug: raveswords
title: Raveswords
tagline: Duel other players online in medieval sword combat set to dance music
description: >-
  Swing your sword with the left mouse button. You control a fighter in third
  person, blade in hand, in a multiplayer sword fighting game that the creator
  describes as Chivalry in the browser.


  A tutorial of nine steps teaches the basics first, and you can skip it with
  Tab if you'd rather jump in.


  The music is the odd part. A Room DJ panel lets you paste a YouTube link, then
  queue it, play it right now, skip ahead or stop it, and the video shows up on
  a screen mounted on the wall. That suits the dance music the creator paired
  with medieval combat.


  Press T whenever you want to chat with the other players in the room, which is
  handy because the fights are all multiplayer.


  The arena is a pink room with walls covered in dense, scrolling blocks of
  text, and a health bar sits in the bottom left corner.
