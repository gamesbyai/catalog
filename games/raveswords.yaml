slug: raveswords
title: Raveswords
tagline: Duel other players online in medieval sword combat set to dance music
description: >-
  Click the left mouse button to swing your sword. A nine-step tutorial runs
  when the game opens, with prompts such as "Swing your sword" and a step that
  asks you to press Space. A Tab button in the corner skips the tutorial.


  You control a sword-carrying fighter seen from behind, with a crosshair at
  screen center and a health bar in the bottom left. A counter at the top left
  shows how many players are in the room, and other fighters share the space. T
  opens chat.


  The arena is a pink, dithered room with walls covered in dense blocks of text.
  A video screen hangs on one wall. A DJ panel on the left lets you paste a
  YouTube link, then queue it, play it now, skip, or stop. Audio needs a click
  to enable. A dropdown sets what the wall screen shows.


  The creator describes it as a multiplayer sword fighting game in the style of
  Chivalry: Medieval Warfare, set to dance music.
