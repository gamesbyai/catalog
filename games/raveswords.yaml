slug: raveswords
title: Raveswords
tagline: Duel other players online in medieval sword combat set to dance music
description: >-
  Click the left mouse button to swing your sword. As soon as the game loads, a
  nine-step tutorial starts with prompts like "Swing your sword," and one of its
  steps has you press Space.


  If you'd rather get straight to the fighting, Tab skips the tutorial.


  Other fighters share the space with you, and pressing T opens chat when you
  want to talk to them.


  You can paste in a YouTube link to queue it, play it right away, skip it or
  stop it, which puts you in charge of the dance music.


  neetsdotfun describes it as a multiplayer sword fighting game in the style of
  Chivalry: Medieval Warfare, set to dance music. You have to click once before
  the DJ audio plays. You can choose what the video screen on the wall shows.
