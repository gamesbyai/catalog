slug: raveswords
title: Raveswords
tagline: Duel other players online in medieval sword combat set to dance music
description: >-
  Click the left mouse button to swing your sword. As soon as the game loads, a
  nine-step tutorial starts with prompts like "Swing your sword," and one of its
  steps has you press Space.


  If you'd rather get straight to the fighting, there's a Tab button up in the
  corner that skips the whole tutorial.


  Your fighter is shown from behind, sword in hand, with a crosshair in the
  middle of the screen and a health bar in the bottom left. A counter in the top
  left tells you how many players are in the room. Other fighters share the
  space with you, and pressing T opens chat when you want to talk to them.


  The arena is a pink, dithered room with walls covered in dense blocks of text,
  a pretty long way from any medieval castle.


  Oddly enough, there's also a video screen hanging on one wall. A DJ panel on
  the left lets you paste in a YouTube link, then queue it, play it right away,
  skip it or stop it, a clever way to hand the dance music side of the game to
  you.


  neetsdotfun describes it as a multiplayer sword fighting game in the style of
  Chivalry: Medieval Warfare, set to dance music. You have to click once before
  the DJ audio plays. A dropdown picks what the wall screen shows.
