slug: raveswords
title: Raveswords
tagline: Duel other players online in medieval sword combat set to dance music
description: >-
  Click the left mouse button to swing your sword at other players in a
  dance-music fight.


  Other fighters sharing the space with you. Dance music from pasted YouTube
  links, with instant play, queueing, skip and stop. A wall video screen with a
  choice of what it shows.


  Press T to open chat. Press Tab to skip the tutorial.


  neetsdotfun describes it as a multiplayer sword fighting game in the style of
  Chivalry: Medieval Warfare.
