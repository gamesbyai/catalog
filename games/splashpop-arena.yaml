slug: splashpop-arena
title: SplashPop Arena
tagline: Shoot paint at bots or up to 8 friends and score points before time runs out.
description: >-
  In SplashPop Arena you shoot paint at opponents, and every paint hit adds to
  your score while a match clock counts down. You can play against bots or with
  up to 8 friends in the same match.


  The menu comes first. You enter a nickname and pick a match time of 1, 5, or
  10 minutes, with 5 selected by default. Solo starts a run against the bot.
  Room opens a live room with a code to share, and the match kicks off once your
  group has joined.


  A find-players button and a leaderboard sit on the same menu. A privacy note
  asks you to use a nickname rather than your real name, since the name and
  match stats can appear on the public leaderboard.


  The menu art is candy-colored: dripping neon lettering over a soft cartoon
  landscape with a smiling character covered in pastel icing. The creator took
  inspiration from the tense duels, aim-focused gunplay, and round-based
  competition of CS:GO.
