slug: splashpop-arena
title: SplashPop Arena
tagline: Shoot paint at bots or up to 8 friends and score points before time runs out.
description: >-
  SplashPop Arena is a fast-paced arena shooter that swaps bullets for paint.
  Every paint hit you land earns points, and each match is a race against the
  clock. You can take on computer-controlled bots, or bring in up to 8 friends
  for a multiplayer round.


  According to the creator, the design draws on CS:GO: tense tactical duels,
  aim-focused gunplay, and a round-based competitive rhythm. It shows in the
  weight on accurate shooting and in matches that stay short and contained.
  Cursor and Three.js were the creator's tools, the arena is rendered in 3D, and
  it landed 306th of 945 in Vibe Jam 2026.


  The paint keeps the tone lighter than a typical military shooter, but every
  point still comes down to landing the hit before the clock runs out.
