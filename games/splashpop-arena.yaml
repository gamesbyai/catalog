slug: splashpop-arena
title: SplashPop Arena
tagline: Shoot paint at bots or up to 8 friends and score points before time runs out.
description: >-
  In SplashPop Arena you shoot paint at your opponents, and every hit that lands
  scores you points. You're racing the clock the whole time, so the match is a
  points race rather than a last-one-standing fight.


  Before a match you pick how long it runs: one, five or ten minutes.


  You can jump into a solo run against a bot, which is handy if nobody's around.
  Or you can open a room, which gives you a code to share, and start once your
  crew shows up.


  Rooms hold up to 8 friends. There's also a find-players button if you'd rather
  get matched than hand out codes, and a leaderboard for the results.


  The creator took inspiration from CS:GO, specifically its tense duels,
  aim-focused gunplay and round-based competitive energy. It's a funny contrast
  with the look, since the menu is all dripping candy-colored lettering and a
  cartoon scoop of ice cream peeking over the panel.


  You enter a nickname before playing, and the game asks you not to use your
  real name because your chosen name and match stats can show up on the public
  leaderboard.
