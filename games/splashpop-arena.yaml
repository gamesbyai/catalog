slug: splashpop-arena
title: SplashPop Arena
tagline: Shoot paint at bots or up to 8 friends and score points before time runs out.
description: >-
  In SplashPop Arena you shoot paint at your opponents, and every hit earns you
  points while the match clock runs down. You can take on bots, or bring up to 8
  friends into the same match. It's paint instead of bullets.


  You type a nickname and pick a match length of 1, 5 or 10 minutes.


  Solo drops you into a run against the bot. Room opens a live room with a code
  you can share, and the match starts once your group has joined.


  You can also search for players to play with, and there's a leaderboard. Go by
  a nickname rather than your real name, since your name and match stats can
  show up on the public leaderboard.


  heyitsshantanu drew on CS:GO's tense duels, aim-focused gunplay and
  round-based competition.
