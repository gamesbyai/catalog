slug: splashpop-arena
title: SplashPop Arena
tagline: Shoot paint at bots or up to 8 friends and score points before time runs out.
description: >-
  SplashPop Arena has you shooting paint at opponents, and every hit earns
  points as the match clock runs down. Face bots, or bring up to 8 friends into
  the same match.


  Matches of 1, 5 or 10 minutes. Player search for a group. A leaderboard.


  Type a nickname, not your real name. Your name and match stats can show up on
  the public leaderboard. Pick Solo to face the bot, or Room to open a live room
  with a share code. The match starts once your group joins.


  heyitsshantanu named CS:GO as the inspiration for tense duels, aim-focused
  gunplay and round-based competition.
