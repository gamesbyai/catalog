slug: formula-minus-one
title: Formula Minus One
tagline: Race a hovering craft around futuristic tracks at high speed.
description: >-
  Formula Minus One is a futuristic racer in the vein of F-Zero and Wipeout. The
  player pilots a fast anti-gravity style craft around a track, aiming for clean
  lines and quick laps against the clock and any rivals on the course.


  The look and feel draw on classic high-speed racers of the 1990s, with a sense
  of velocity and a sci-fi setting at the center. It renders in the browser
  using WebGPU, so it needs a browser that supports that graphics API to run
  properly.


  According to the creator, it was built with Codex and Claude, and it runs on
  Three.js. The project is shared as part of a collection of openly licensed
  games, which makes it easy to explore and learn from.
