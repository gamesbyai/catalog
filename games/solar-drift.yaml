slug: solar-drift
title: Solar Drift
tagline: Fly a spacecraft between planets and slingshot around a true-scale
  solar system.
description: >-
  Solar Drift puts you at the controls of a small spacecraft in a true-scale
  solar system, with worlds from the Sun down to tiny Pluto. A destinations
  panel lists each body with its distance from the Sun and its light-travel
  time. You can jump to a body, engage light-speed travel toward it, or enter a
  size comparison view.


  The Earth entry opens Expedition 1, Earth Survey. You fly to a beacon near
  Earth's observation shell and complete 3 scans. The route is marked 1 of 5 and
  runs Earth, Moon, Mars, Jupiter, Saturn, with a points total shown beside the
  task.


  Manual flight is active near Earth, and pressing Space boosts the ship to
  light speed. A side panel describes the selected body, while readouts track
  the nearest body, distance, ETA at light speed and ship speed. The theme is an
  Artemis II mission, and a Vibe Portal marker with its distance appears in the
  scene. The opening view shows a textured Earth with cloud cover, with the ship
  sitting below it.
