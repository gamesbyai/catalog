slug: solar-drift
title: Solar Drift
tagline: Fly a spacecraft between planets and slingshot around a true-scale
  solar system.
description: >-
  Solar Drift is a space exploration game in which you pilot a sleek spacecraft
  through a living solar system. You travel from world to world, using planetary
  slingshots to build speed and cross the huge gaps between them at light speed,
  with no fixed course to follow.


  The main draw is scale. Every body is shown in true-scale perspective, from
  tiny Pluto to the blazing Sun, so the distances and size differences between
  worlds are easy to see as you fly. The game is themed around the Artemis II
  mission and supports multiplayer. It also runs on mobile devices.


  Solar Drift was entered in Vibe Jam 2026 and is built with Three.js for 3D
  rendering in the browser. According to the creator, it was made with Codex,
  OpenAI's coding tool, as the main development aid.
