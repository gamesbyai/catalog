slug: solar-drift
title: Solar Drift
tagline: Fly a spacecraft between planets and slingshot around a true-scale
  solar system.
description: >-
  Solar Drift puts you at the controls of a small spacecraft inside a true-scale
  solar system, with worlds ranging from the Sun down to tiny Pluto. Near Earth
  you're flying it by hand, but pressing Space boosts the ship all the way to
  light speed.


  A destinations panel lists each body with its distance from the Sun and how
  long light takes to get there, and each entry gets a pretty vivid one-line
  sketch, like Mercury being scorched and full of craters.


  From that panel you can jump straight to a body or engage light-speed travel
  toward it. There's also a size comparison view, which fits a game this focused
  on real scale. When you pick a world, a side panel fills in with a description
  of it.


  Choosing Earth starts Expedition 1, the Earth Survey, where you fly out to a
  beacon near the planet's observation shell and finish 3 scans.


  It's only stop 1 of 5 on a whole route that runs Earth, Moon, Mars, Jupiter
  and Saturn. A points total sits right beside the task, while a bonus timer
  ticks down next to your scan count.


  Readouts keep track of the nearest body, how far away it is, your ETA at light
  speed and the ship's speed. The trip is themed around the Artemis II mission,
  and oddly enough a Vibe Portal marker hangs in the scene with its own distance
  attached. The opening shot shows a textured Earth wrapped in clouds, with your
  ship sitting just below it.
