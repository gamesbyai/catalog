slug: solar-drift
title: Solar Drift
tagline: Fly a spacecraft between planets and slingshot around a true-scale
  solar system.
description: >-
  Solar Drift lets you pilot a small spacecraft through a true-scale solar
  system, from the Sun down to tiny Pluto.


  Distance from the Sun and light travel time for every body. One-line sketches
  of each world, such as Mercury, scorched and full of craters. Direct jumps to
  any body, or light-speed travel toward it. A size comparison view. Expedition
  1, the Earth Survey. First of five stops on a route through Earth, Moon, Mars,
  Jupiter and Saturn. The Artemis II mission as the theme for the trip.


  Fly by hand near Earth. Press Space to boost the ship all the way to light
  speed. Choose Earth to start Expedition 1. Fly to the beacon near the planet's
  observation shell and finish 3 scans. Select a world to read its description.
