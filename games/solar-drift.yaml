slug: solar-drift
title: Solar Drift
tagline: Fly a spacecraft between planets and slingshot around a true-scale
  solar system.
description: >-
  Solar Drift is space exploration at true scale. You pilot a sleek spacecraft
  through a living solar system, traveling from world to world. Planetary
  slingshots build your speed, and you cross the huge gaps between worlds at
  light speed, on a course of your own choosing.


  According to the creator, Codex, OpenAI's coding tool, was the main
  development aid, with Three.js handling the 3D rendering in the browser. The
  trip is themed around the Artemis II mission, and the game supports online
  multiplayer in mobile and desktop browsers. It came 511th of 945 in Vibe Jam
  2026.


  Every body is shown in true-scale perspective, from tiny Pluto to the blazing
  Sun, so the distances and size differences between worlds are easy to see as
  you fly.
