slug: solar-drift
title: Solar Drift
tagline: Fly a spacecraft between planets and slingshot around a true-scale
  solar system.
description: >-
  Solar Drift has you flying a small spacecraft around a solar system, and you
  can pick any body from a destinations list and jump straight to it. Each entry
  shows its distance and how long light would take to cross it, so you can see
  how far apart the worlds are.


  When you want to cover real ground, you press Space and the ship boosts to
  light speed, which is the quick way across all that empty space.


  There's also an expedition to work through, which starts with an Earth survey.
  You fly to a beacon near Earth's observation shell and finish three scans
  before a bonus timer runs out, earning points as you go. The route has five
  stops: Earth, the Moon, Mars, Jupiter and Saturn.


  A size comparison mode lines everything up at true scale, from tiny Pluto to
  the blazing Sun, which is a neat way to see how the planets stack against each
  other.


  A readout panel shows your nearest body, your distance from it, your ETA at
  light speed, your ship speed and your flight mode. That's handy when you're
  crossing this much space.


  Selecting a body also brings up a short description, like Earth's weather,
  cloud cover and blue limb glow. A Show Controls button lists the keys, and the
  creator built the whole thing around the Artemis II mission.
