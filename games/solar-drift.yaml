slug: solar-drift
title: Solar Drift
tagline: Fly a spacecraft between planets and slingshot around a true-scale
  solar system.
description: >-
  Solar Drift puts you at the controls of a small spacecraft inside a true-scale
  solar system, with worlds ranging from the Sun down to tiny Pluto. Near Earth
  you're flying it by hand, but pressing Space boosts the ship all the way to
  light speed.


  Each body comes with its distance from the Sun, how long its light takes to
  get there, and a vivid one-line sketch, like Mercury being scorched and full
  of craters.


  You can jump straight to a body or engage light-speed travel toward it.
  There's also a size comparison view. Selecting a world brings up a description
  of it.


  Choosing Earth starts Expedition 1, the Earth Survey, where you fly out to a
  beacon near the planet's observation shell and finish 3 scans.


  It's the first of five stops on a route that runs through Earth, Moon, Mars,
  Jupiter and Saturn. The trip is themed around the Artemis II mission.
