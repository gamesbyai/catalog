slug: idleworlds
title: IdleWorlds
tagline: Train a character in a text-based online RPG that keeps progressing
  while you're away.
description: >-
  The game opens on a green text-and-button dashboard. A guest character starts
  at Combat level 1 in Zone 1, Greenwake Den, with 120 coins and stats of ATK 4,
  DEF 2 and HP 41. Under Skill Actions, each skill has its own button and level
  bar. Fight Rats gives 4 XP and Mine Copper gives 8 XP.


  Fight Rats lists a recommended ATK 7 and DEF 3 and suggests crafting a sword
  first. The zone panel states the target for the next zone: ATK 14 and DEF 8,
  or level 5 in any skill. Zones and Next Zone buttons sit beside it.


  Gear, materials, consumables and drops go into an inventory with category tabs
  and a search option. Market, Leaderboards and Village tabs sit beside the main
  Game tab. The header tracks XP, attack and defense potions, and a daily boost
  adds 20% XP to Alchemy, Jewelcrafting and Mining.


  The character keeps progressing while you are offline, so play is built around
  short check-ins. Loot can be rare, and the economy runs on players trading
  with each other. A guest account can be converted in Settings to unlock mail,
  the forum and permanent sign-in.
