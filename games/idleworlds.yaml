slug: idleworlds
title: IdleWorlds
tagline: Train a character in a text-based online RPG that keeps progressing
  while you're away.
description: >-
  A green dashboard of text and buttons greets you, with a guest character
  already standing in Greenwake Den, Zone 1, at Combat level 1. You start with
  120 coins and a modest ATK 4, DEF 2 and HP 41. Each skill gets its own row
  with a button and a level bar, where Fight Rats is worth 4 XP while Mine
  Copper is worth 8.


  Even the rats come with a warning, since the game recommends ATK 7 and DEF 3
  for them and nudges you to craft a sword first.


  Moving on to the next zone takes either ATK 14 and DEF 8 or level 5 in any
  single skill, which leaves a route open for anyone who'd rather mine than
  fight. The Zones and Next Zone buttons sit right beside that target.


  Everything you collect lands in an inventory you can search, split into tabs
  for gear, materials, consumables and drops. Next to the main Game tab you'll
  find a Market, Leaderboards and a Village, while the header keeps track of
  your XP, attack and defense potions. There's also a daily boost that adds 20%
  XP to Alchemy, Jewelcrafting and Mining.


  Further down, the dashboard turns out to hold a lot more than it first lets
  on. Quests ask for things like a hefty 100 Rat Tails from Greenwake Den, and
  smithing work orders want crafted gear such as Copper Boots. There's a whole
  ladder of shared world bosses, from a solo Ancient Treant to a raid-sized
  Abyssal Behemoth and a mythic World Eater, and the bigger the boss, the
  bigger and longer the XP buff it leaves behind.


  Your character keeps progressing while you're offline, so the game is built
  around short check-ins.


  Loot can be rare, and the economy runs on players trading with each other. If
  you convert your guest account in Settings, you get mail, the forum and
  permanent sign-in.


  matduke built it out of frustration with idle and MMO games that got
  paywalled, bloated or simply died, aiming for a simple long-term game that
  respects your time.
