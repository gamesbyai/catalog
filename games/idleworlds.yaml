slug: idleworlds
title: IdleWorlds
tagline: Train a character in a text-based online RPG that keeps progressing
  while you're away.
description: >-
  Your character in IdleWorlds keeps making progress while you are offline. It
  is a text-based online RPG: you create a character, set it to work, and come
  back for short visits to collect the results and choose what comes next.


  The creator built it out of frustration with idle and MMO games that turn
  paywalled, bloated or shut down. The goal was a simple long-term check-in game
  that respects your time, and it is free to play in the browser, whether on a
  desktop or a phone. Codex was used to build it, according to the creator.


  It aims for an old-school MMORPG feel, with rare loot to chase and an economy
  driven entirely by the players who share the world, all of it in plain text.
