slug: idleworlds
title: IdleWorlds
tagline: Train a character in a text-based online RPG that keeps progressing
  while you're away.
description: >-
  Play this old-school, text-based MMORPG for free in your browser, alongside
  other players in one shared world. Your character keeps progressing while
  you're offline, and the game is built around short check-ins. Loot can be
  rare, and the economy runs on players trading with each other.


  Rat fights (4 XP) and copper mining (8 XP). Quests for 100 Rat Tails from
  Greenwake Den, and smithing orders for Copper Boots. Searchable inventory for
  gear, materials, consumables and drops. A Market, Leaderboards and a Village.
  Shared world bosses, from solo Ancient Treant to raid-sized Abyssal Behemoth
  and mythic World Eater, with bigger, longer XP buffs left behind. Daily 20% XP
  boost to Alchemy, Jewelcrafting and Mining.


  Begin as a guest character in Greenwake Den, Zone 1, at Combat level 1, with
  120 coins, ATK 4, DEF 2 and HP 41. Move on to the next zone with ATK 14 and
  DEF 8, or level 5 in any one skill if you'd rather mine than fight. Craft a
  sword first, as the game suggests, since it recommends ATK 7 and DEF 3 for
  rats. Convert your guest account for mail, the forum and permanent sign-in.


  matduke made it out of frustration with idle and MMO games that became
  paywalled, bloated or simply died. It aims to be a simple, long-term game that
  respects your time.
