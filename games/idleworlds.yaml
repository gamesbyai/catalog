slug: idleworlds
title: IdleWorlds
tagline: Train a character in a text-based online RPG that keeps progressing
  while you're away.
description: >-
  You start on a dark green dashboard as a guest character in Zone 1, Greenwake
  Den, with skill rows stacked down the left: Combat, Mining, Alchemy and more.
  Each row has a big button, like Fight or Mine, and an inventory with filter
  tabs sits on the right.


  It's a text-based MMORPG meant for checking in now and then.


  Your character keeps progressing even when you're offline, which is the whole
  point. Each skill has its own level and XP bar, so you pick what to train and
  come back later.


  The rows tell you what you're missing. Fighting rats lists a recommended
  attack and defense and nudges you to craft a sword, while the potion row says
  which materials you still lack. Potion slots for XP, attack and defense sit at
  the top, and a daily XP boost covers a few skills.


  There's a Next Zone button too, with a target shown right beside it.


  The target is a set of attack and defense numbers, or level 5 in any skill, so
  one well-trained skill gets you there.


  Other players are a big part of it. Market and Leaderboards tabs sit beside
  the main screen, the economy is player-driven, and there's rare loot. World
  chat scrolls by, and shared world bosses, some solo and some raids, give a
  timed XP buff when they're beaten.


  Work orders ask you to turn in things like rat tails or copper boots for gold
  and XP. The creator built it out of frustration with idle games that got
  paywalled, bloated or abandoned, and it's free in the browser. A guest account
  can be converted in Settings to unlock mail, a forum and permanent sign-in.
