slug: next-token-please
title: Next Token Please
tagline: Pick the next word one token at a time and play the part of a language model.
description: >-
  In Next Token Please, you're the one being prompted. Pick tokens one by one
  until a sentence forms.


  The chatbot's job, from the inside. A single token per pick. Puzzle,
  simulation and a short lesson about prediction.


  Pick, then pick again.


  Most people have only ever done the prompting. Here the roles swap.
