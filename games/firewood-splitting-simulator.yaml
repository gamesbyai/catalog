slug: firewood-splitting-simulator
title: Firewood Splitting Simulator
tagline: Swing an axe at logs on a stump and split firewood.
description: >-
  Firewood Splitting Simulator is a small, tactile toy about chopping wood. You
  stand before a stump, set a log on top, and swing an axe to split it. There is
  no scoring or fail state described, so a session is simply a matter of
  splitting log after log for as long as it stays satisfying.


  The focus is on physical feel. The stump, the axe, and the logs are 3D-scanned
  objects rather than hand-modeled stand-ins, and the impacts are paired with
  recorded sounds instead of synthesized effects. That combination gives the
  chopping a grounded, realistic character that suits a short, relaxing session.


  The creator says it was built with Claude and Three.js, which means the whole
  thing runs as a real-time 3D scene in the browser rather than as a downloaded
  program.
