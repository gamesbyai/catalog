tagline: Dig deeper, fight enemies, and return to the surface to upgrade.
description: >-
  A miner works a vertical 2D mine, with a shop on the surface.


  Health and fuel to manage. A backpack with 10 slots. Enemies to fight on the
  way down. Resources to collect. Leaderboards.


  Start at the surface with a pickaxe and a grapple tool, then dig down. Haul
  everything back up, then upgrade and push deeper than last time.


  danbuildsstuff names Miner Dig Deep and Minecraft as the games Vibe-Miner is
  closest to.
