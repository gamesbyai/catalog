slug: vibe-miner
title: Vibe-Miner
tagline: Dig deeper, fight enemies, and return to the surface to upgrade.
description: >-
  You play as a miner who starts at the surface. There's a shop on the surface.
  You have health and fuel to manage, and a backpack with 10 slots.


  You dig down through the map, fighting the enemies you run into and grabbing
  resources along the way. Then you haul it all back up to the surface, upgrade
  and push deeper than last time.


  You start with a pickaxe and a grapple tool.


  danbuildsstuff points to Miner Dig Deep and Minecraft as the games it's
  closest to. The game has leaderboards.
