slug: vibe-miner
title: Vibe-Miner
tagline: Dig deeper, fight enemies, and return to the surface to upgrade.
description: >-
  The run starts on the surface at 0 m depth. A pixel-art miner stands on a
  strip of dirt next to a gap, and a shop building sits at the left edge. The
  HUD shows a health bar at 100, a fuel bar at 30, a points counter, a money
  total and a backpack with 0 of 10 slots used.


  The goal is to dig down through a side-view 2D map, fight the enemies you meet
  and collect resources. Then you return to the surface to upgrade and head
  deeper. A depth meter tracks how far down you have gone.


  A six-slot hotbar runs along the bottom of the screen. It holds a pickaxe in
  slot 1 and a grapple tool in slot 2, and the other four slots start empty. The
  main menu also has a leaderboards button.
