slug: vibefall
title: Vibefall
tagline: Run walls, fight gunfights, and battle giant mechs in a fast
  multiplayer shooter.
description: >-
  Vibefall is a fast-paced movement shooter that mixes parkour traversal with
  firefights and large-scale mech combat. Players move quickly through the
  environment, chaining parkour moves between gunfights, and fight alongside or
  against other players in a multiplayer setting. It runs in the browser and
  also supports mobile.


  The game draws on Titanfall for its inspiration, and that shows in its focus
  on momentum and titan-scale battles. Combining on-foot movement, gunplay, and
  giant machines in one browser project is an ambitious scope, and the game
  keeps all three at the center of its design.


  It was entered in Vibe Jam 2026, where it placed 52nd out of 945 entries. The
  creator says they picked the Titanfall-inspired idea because nothing else they
  brainstormed felt as exciting, and they were unsure at the start what AI could
  manage. The creator built it with Codex on Three.js.
