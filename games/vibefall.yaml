description: >-
  Run walls, chain parkour between gunfights and take on giant mechs in a fast
  multiplayer movement shooter.


  Wall-running and parkour. Firefights at speed. Titan-scale mech battles. Other
  players fighting with you or against you.


  Titanfall is the inspiration. The creator says nothing else they brainstormed
  felt as exciting, even though they weren't sure at first what AI could manage.
