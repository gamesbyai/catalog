slug: roomba-wars
title: Roomba Wars
tagline: Play a roomba that cleans up dirt and fights off enemies in a top-down arena.
description: >-
  In Roomba Wars you are the robot vacuum, and the room is full of dirt and
  hostile enemies. Played top-down in an arena, it is an action shooter with a
  simple brief: clean up the mess, and shoot whatever gets in your way while you
  do it.


  It supports online multiplayer and is meant to be quick to pick up in a
  browser. Per the creator, it was built with Cursor, an AI coding tool, on
  Three.js, and it ranked 39th of 945 in Vibe Jam 2026.


  The mess is the objective and the enemies are the obstacle, so a run splits
  your attention between collecting dirt and fighting off threats. The premise
  is a joke about household robots gone rogue, and the game plays it for humor.
