slug: starpit-io
title: Starpit.io
tagline: Grow from a brown dwarf into a black hole by devouring rival bodies online.
description: >-
  Starpit.io starts you as a brown dwarf in a real-time multiplayer space arena
  shared with other players' stars. You grow by absorbing rivals. Movement and
  combat follow physics, not scripted rules.


  Stellar stages, such as red dwarf, to climb through. Collapsing into a
  primordial black hole as the final goal. Inverse-square gravity and
  slingshots. Tidal stripping, Hawking radiation and spaghettification.


  rscassiel wanted to combine a love of .io games with astrophysics.
