slug: starpit-io
title: Starpit.io
tagline: Grow from a brown dwarf into a black hole by devouring rival bodies online.
description: >-
  Starpit.io starts you as a brown dwarf and asks you to eat your way up to a
  primordial black hole. It is a real-time multiplayer .io game in space: you
  consume rivals to gain mass and climb through larger stellar stages, where
  bigger opponents are threats and smaller ones are food.


  The creator loves .io games and astrophysics and made this game with Claude
  Code on Three.js to combine the two, and it finished 326th of 945 in Vibe Jam
  2026. Movement and combat run on astrophysics: gravity follows an
  inverse-square law, and you can slingshot around heavier bodies to gain speed.


  Tidal stripping, spaghettification, Hawking radiation, and black-hole collapse
  all shape how fights play out, so the physics drives the action instead of
  scripted events.
