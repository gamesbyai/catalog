slug: starpit-io
title: Starpit.io
tagline: Grow from a brown dwarf into a black hole by devouring rival bodies online.
description: >-
  Starpit.io starts you as a brown dwarf in a real-time multiplayer space arena
  shared with other players' stars. You grow by absorbing rivals and climb
  through stellar stages, such as red dwarf, with the final goal of collapsing
  into a primordial black hole.


  Movement and combat follow physics instead of scripted rules. The simulation
  includes inverse-square gravity, slingshots, tidal stripping, Hawking
  radiation and spaghettification. The creator wanted to combine a love of .io
  games with astrophysics.


  A panel at bottom left shows your level, kills, mass and current stellar
  stage. The top right lists the ten heaviest players by mass, plus your own
  rank out of the players present. A feed at top left reports who absorbed,
  crushed, overwhelmed or annihilated whom.


  A circular minimap at bottom right marks where the other stars are. Stars
  carry name labels, and a button on the right edge opens a webring portal.
