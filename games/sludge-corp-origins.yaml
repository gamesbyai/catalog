slug: sludge-corp-origins
title: "Sludge Corp: Origins"
tagline: Grow an alien biomass from a petri dish into a company that buys the
  solar system.
description: >-
  You play an alien blob called Subject Alpha, escaping a classified underground
  facility by feeding on everything around you. It starts as a clicker where you
  spend Biomass on wriggly hairs and acidic maws, which then bring in Biomass on
  their own.


  The jokes are pure office-speak, so eating the world gets described as
  aggressively synergizing.


  Spend DNA to mutate your body for good, which is how you get closer to apex
  predator. You can also breed expendable Siege Spores and send them at the
  facility's blast doors while you look after the core.


  Then there's the Digester, which works like a gambling machine. You shove
  millions of spare Biomass into the core and hope it gives back a permanent
  artifact, and the game says those artifacts can break it wide open.


  Once you reach the surface, the Market lets you sell off your own flesh for
  USD. That money goes toward buying the planet.


  The creator describes the whole thing as escalating from a petri dish to a
  hostile takeover of the solar system, and it's played in the browser.
