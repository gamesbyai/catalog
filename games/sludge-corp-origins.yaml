slug: sludge-corp-origins
title: "Sludge Corp: Origins"
tagline: Grow an alien biomass from a petri dish into a company that buys the
  solar system.
description: >-
  An alien blob called Subject Alpha is sealed in an underground lab, and
  getting through the blast doors between you and the surface is how you get
  out. You click to gather Biomass, then spend it on biological assets. Dark
  corporate humor runs through it, with a monster eating everything while the
  game talks in office jargon about growing its market share.


  Splicer assets, starting with wriggly hairs and acidic maws. Passive income
  running without clicks. Lasting body reshaping from extracted DNA. Breeding
  expendable Siege Spores in the Breach to attack those doors while you manage
  the core. A Digester gamble, feeding the core piles of Biomass in the millions
  for a chance at permanent artifacts the creator calls game-breaking. The
  Market, once on the surface, for turning your flesh into USD toward buying the
  planet and finally the whole solar system.


  According to VibeAxis Games, the code, procedural audio and design logic were
  built in collaboration with AI.
