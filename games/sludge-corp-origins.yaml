slug: sludge-corp-origins
title: "Sludge Corp: Origins"
tagline: Grow an alien biomass from a petri dish into a company that buys the
  solar system.
description: >-
  Sludge Corp: Origins is a corporate-horror incremental game. You play Subject
  Alpha, an alien biomass growing inside a classified underground facility. You
  spend Biomass on biological assets that produce more Biomass on their own,
  then push outward through the facility until you reach the surface and the
  wider world.


  The game changes shape as it goes. Extracted DNA permanently mutates your
  body, and you breed expendable Siege Spores to break down blast doors. A
  Digester lets you feed huge amounts of Biomass into the core for a chance at
  permanent artifacts. On the surface, a Market lets you sell your own flesh for
  USD and buy up the planet. The tone is dark office-speak humor.


  The creator states that the code, the procedural audio engine, and the design
  logic were all built in collaboration with AI for a game jam. It runs in the
  browser and placed 15th of 42 entries in AI Browser Game Jam 2.
