slug: sludge-corp-origins
title: "Sludge Corp: Origins"
tagline: Grow an alien biomass from a petri dish into a company that buys the
  solar system.
description: >-
  An orange blob sits in a sealed underground lab, and you play it. As Subject
  Alpha, you click to gather Biomass, then spend it in the Splicer on biological
  assets, starting with wriggly hairs and acidic maws, that keep producing
  income without clicks.


  Extracted DNA permanently changes your body. In the Breach, you breed Siege
  Spores, which are expendable units that attack the facility's blast doors
  while you look after the core. Getting through those doors takes you to the
  surface.


  The Digester works as a gamble: you feed large piles of spare Biomass into the
  core and may get permanent artifacts back. On the surface, the Market lets you
  sell your own flesh for USD and spend it on buying the planet, with the solar
  system as the final target.


  The tone is dark corporate humor, with office jargon applied to a monster
  eating everything. The code, procedural audio and design logic were built in
  collaboration with AI.
