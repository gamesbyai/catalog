slug: swarmfall
title: Swarmfall
tagline: Steer through a glowing alien landscape while your weapons shoot swarms
  on their own.
description: "Survive one alien day. Bugs and winged creatures keep coming at
  you.


  Automatic weapon fire. Starting weapon picked before a run, Pollen Halo among
  the choices. Upgrades shop, paid for with Shards. Autopilot toggle that steers
  and picks upgrades. Daily World beside regular runs, tied to the current date.


  You only steer: move, jump and dodge. Shrines appear too; grab the one
  offering a chest and some stars before the countdown ends. Check the codex for
  discoveries. Type your own seed, or roll a random one with the dice button.


  It began as buak's test project for a Gaussian splat engine."
