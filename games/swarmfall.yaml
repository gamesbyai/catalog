slug: swarmfall
title: Swarmfall
tagline: Steer through a glowing alien landscape while your weapons shoot swarms
  on their own.
description: "The big Play button starts a run. The goal is to survive one alien
  day.


  Once a run starts, you only steer. Your weapons fire by themselves, so you
  move through the landscape, jump and dodge, and let them do the killing. Bugs
  and winged creatures keep coming at you.


  Shrines turn up in the world too. One of them offers a gift of a chest and
  some stars, and you have to grab it before the countdown runs out.


  You pick a starting weapon before you go in, and Pollen Halo is one of the
  choices. Shards are what you spend in the Upgrades shop, and a codex tracks
  what you've discovered. There's also an autopilot toggle that steers and picks
  upgrades for you.


  Besides the regular Play button, there's a Daily World tied to the current
  date, and the seed box lets you type in your own seed or roll a random one
  with the dice button. It began as buak's test game for a Gaussian splat
  engine."
