slug: dragonwake
title: Dragonwake
tagline: Explore dungeons in a text-character roguelike built for long replay value.
description: >-
  Bandages stop bleeding and bind fresh wounds. You start by picking a race and
  pairing it with a class.


  Races include Human, Dwarf, Elf, Half-Elf, Halfling, Gnome and Half-Orc, and
  classes include Fighter. Every action is a turn: you move one step, attack,
  rest or interact, and then nearby enemies act. Movement is 8-way on the
  numpad, and Enter interacts or confirms.


  The campaign is played on an open-world map where you travel between towns,
  ruins, towers, dungeons and blackglass sites. This browser version is a demo,
  and a Steam page links to the native release.


  The creator set out to get long, complex replayability from AI-assisted
  coding, as a fan of ASCII roguelikes.
