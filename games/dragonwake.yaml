slug: dragonwake
title: Dragonwake
tagline: Explore dungeons in a text-character roguelike built for long replay value.
description: >-
  Dragonwake is a roguelike drawn entirely in ASCII characters. You guide a hero
  through a fantasy setting, fighting monsters, gathering gear and making risky
  choices where one mistake can end the run.


  It is also an experiment in whether AI-assisted coding, in this case Codex,
  can produce a deep, replayable roguelike, and it placed 106th of 945 at Vibe
  Jam 2026. It is single-player, and the text-based look follows classic dungeon
  crawlers, a style the creator loves.


  It leans toward the hardcore end of the tradition, with an adventure and RPG
  focus. Each attempt starts fresh, so progress depends on how well you build
  and play the character, and the creator is aiming for long, complex
  replayability with a large amount of content to work through.
