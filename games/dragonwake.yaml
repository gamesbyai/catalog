slug: dragonwake
title: Dragonwake
tagline: Explore dungeons in a text-character roguelike built for long replay value.
description: >-
  Dragonwake is a roguelike drawn entirely in ASCII characters. The player
  guides a hero through a fantasy setting, fighting monsters, gathering gear,
  and making risky choices where a mistake can end the run. Each attempt starts
  fresh, so progress depends on how well the character is built and played.


  The creator aims for long, complex replayability and wants a large amount of
  content for players to work through. It leans toward the hardcore end of the
  roguelike tradition, with an adventure and RPG focus. The text-only
  presentation follows the style of classic dungeon crawlers, and the design
  comes from the creator's love of that style.


  The creator built it with Codex as an experiment in whether AI-assisted coding
  can produce a deep, replayable roguelike. It was submitted to Vibe Jam 2026,
  where it placed 106th among 945 entries.
