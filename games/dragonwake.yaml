slug: dragonwake
title: Dragonwake
tagline: Explore dungeons in a text-character roguelike built for long replay value.
description: >-
  This ASCII roguelike has a campaign on an open-world map, where you travel
  between towns, ruins, towers, dungeons and blackglass sites.


  Races including Human, Dwarf, Elf, Half-Elf, Halfling, Gnome and Half-Orc.
  Classes, with Fighter among them. Bandages that stop bleeding and bind fresh
  wounds.


  Pick a race, then pair it with a class. On each turn, move one step, attack,
  rest or interact. Nearby enemies act after you. Use the numpad to move in
  eight directions, and press Enter to interact or confirm.


  kalin_t set out to get long, complex replayability from AI-assisted coding, as
  a fan of ASCII roguelikes. The browser version is a demo, and a Steam page
  links to the native release.
