slug: color-arena
title: Color Arena
tagline: Build, expand, and outmaneuver rival players to cover the map in your color.
description: >-
  Build up your faction and expand across a shared map in your color.
  Outmaneuver rivals in this real-time multiplayer strategy game until one color
  dominates. An AI bot steps in when no opponent is free, so there is always
  someone to play against.


  Action and shooter elements mixed in with the strategy. One battlefield for
  every device, phones and desktops alike. Matchmaking with random players.
  Real-prize tournaments planned, according to the creator.


  The creator sketched this idea long ago. Similar games were made later, but
  they were not the version the creator had imagined.
