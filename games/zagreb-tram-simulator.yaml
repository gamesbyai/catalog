slug: zagreb-tram-simulator
title: Zagreb Tram Simulator
tagline: Drive a tram through Zagreb, pick up passengers, and shoot enemies.
description: >-
  Zagreb Tram Simulator puts you at the controls of a tram running through the
  streets of Zagreb. The job is to carry passengers along the route while
  dealing with enemies that appear along the way, so driving and shooting are
  combined in the same run.


  The setting is a fun twist on a transit simulation: a city tram, usually a
  calm ride, becomes a vehicle for action and light adventure. It runs in the
  browser on a 3D scene and is marked as playable on mobile, with no
  multiplayer.


  It was entered in Vibe Jam 2026, where it placed 236th out of 945 entries. The
  creator's submission lists Claude Code as the tool used to build it, and it is
  rendered with Three.js.
