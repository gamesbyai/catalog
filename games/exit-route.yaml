slug: exit-route
title: EXIT ROUTE
tagline: Manage energy, money, and paperwork week by week to build a new life abroad.
description: >-
  EXIT ROUTE is a strategy simulation about relocating to another country. The
  player moves through the process week by week, balancing burnout, paperwork,
  rising costs, and the pressure of a shrinking timeline. The goal is to secure
  a future abroad before everything falls apart.


  Instead of monsters or fantasy quests, the obstacles come from everyday life:
  unreliable recruiters, bureaucracy, exhaustion, and bad luck. Each week is
  built as a tradeoff, so pushing hard in one area tends to cost something in
  another, and the tension comes from holding yourself together long enough to
  make it.


  The creator says the game was made to capture the stress of starting over
  somewhere new. It was built with Lovable, according to the creator, and was
  entered in Vibe Jam 2026. It is playable on mobile.
