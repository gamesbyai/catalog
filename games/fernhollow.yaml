slug: fernhollow
title: Fernhollow
tagline: Chop trees, smith at the anvil and level up in a low-poly village.
description: >-
  Gathering and crafting drive this game, set in a village by the sea.


  Smithing at the village anvil and furnace. A blacksmith and an elder in the
  village. Storage in a chest, plus market stalls and barrels to use.


  You start by clicking a tree to chop it down. You earn XP for everything you
  do, even for a single log. A golden arrow then marks where to go next.


  Fernwisegames made this skilling RPG. RuneScape inspired it. You play by
  pointing and clicking, and you go at your own pace.
