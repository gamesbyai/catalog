slug: fernhollow
title: Fernhollow
tagline: Chop trees, smith at the anvil and level up in a low-poly village.
description: >-
  Click a tree to start chopping, which is your first task. Everything you do
  earns XP, so even a single log pushes your total up, which seems like a smart
  way to start small. After that, there's a golden arrow pointing you to your
  next stop.


  The village square is stocked with things you can use, like a smithing anvil
  and furnace, a chest for storage, market stalls and barrels. There's a
  blacksmith hammering beside a glowing forge while the elder waits near the old
  well, which seems like a sweet deal.


  Health and your other stats sit in orbs tucked into the corner of the screen.


  Your inventory lives in a tabbed panel on the side. Combat, skills, quests,
  gear and settings each get a tab. For a game that starts you off chopping one
  tree, that's a lot of tabs.


  Put the chopping, smithing and XP together and you've got a game about
  gathering and crafting.


  Fernwisegames built it as a RuneScape-inspired skilling RPG you point, click
  and grind through at your own pace. It's drawn in a low-poly, isometric style,
  with the village set by the sea.
