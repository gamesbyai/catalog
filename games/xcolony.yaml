slug: xcolony
title: xColony
tagline: Mine the Moon, research tech, launch cargo to orbit, and prestige to
  new worlds.
description: >-
  xColony is a 3D idle colony sim that runs in the browser. You start by mining
  the Moon, gathering resources that feed your growing settlement. Over time you
  spend them on upgrades and research, then send cargo up to orbit. When
  progress slows, you prestige and begin again on a new world.


  Two separate tech trees give the colony more than one direction to grow, so
  choices about what to research shape how quickly each cycle moves. The
  prestige loop carries the colony from the Moon to other worlds, and the space
  theme ties mining, launches, and expansion together in a 3D view.


  The game was entered in Vibe Jam 2026 and is built on Three.js. The catalog
  records Claude Code as the tool behind it, though the exact details of how it
  was used are not spelled out.
