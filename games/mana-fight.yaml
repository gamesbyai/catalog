slug: mana-fight
title: MANA FIGHT
tagline: Pick a spellcasting class and fight through fast third-person arena battles.
description: >-
  MANA FIGHT is a fantasy third-person shooter set in an arena. You choose a
  class, learn its spells, and fight opponents in quick, action-heavy rounds.
  Magic takes the place of the usual guns and grenades, while the core loop of
  aiming, moving, and out-fighting rivals stays familiar.


  The creator is a fan of first-person and third-person shooters and wanted to
  keep their core principles while replacing the weapons with a fantasy setting.
  That idea shapes the game: class choice and spell mastery are the main ways to
  gain an edge in the arena.


  It runs on Three.js and was entered in Vibe Jam 2026. The creator states that
  Cursor was used to build it, though the extent of AI involvement is not
  described.
