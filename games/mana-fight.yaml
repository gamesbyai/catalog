slug: mana-fight
title: MANA FIGHT
tagline: Pick a spellcasting class and fight through fast third-person arena battles.
description: >-
  Pick one of four classes on the start screen, then fight in a third-person
  arena with spells and melee weapons. Each class card shows attack, defense and
  speed bars, plus two attacks bound to the 1 and 2 keys and a passive trait.


  Tank is the frontline class. Fireball deals 28 area damage, Sword deals 35 in
  melee, and Heavy Plate cuts damage taken by 20%. Ranger fires a magic green
  arrow for 40 damage or stabs with a 20-damage dagger, and Hawk's Eye adds 25%
  range.


  Esq is the area-damage class. Shadow Bolt is homing dark magic worth 30
  damage, Staff Whack is a 15-damage melee hit, and Arcane Focus raises mana
  regeneration by 50%. Phantom is the assassin: Spirit Daggers throw twin blue
  daggers for 15 each, Twin Daggers hit for 25 in melee, and Backstab adds 50%
  damage from behind.


  The menu bar also links to Map 1, Movement, Model Lab, Aim and Game Logs. The
  creator wanted the familiar core of shooters, usually built on guns and
  grenades, in a fantasy setting.
