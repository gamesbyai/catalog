slug: mana-fight
title: MANA FIGHT
tagline: Pick a spellcasting class and fight through fast third-person arena battles.
description: >-
  Pick one of four classes, then fight in an arena with spells and melee
  weapons. Each class has two attacks, one on the 1 key and one on the 2 key,
  plus a passive trait.


  Tank, the frontline class with 28-damage area Fireball, 35-damage up-close
  Sword and Heavy Plate passive, 20% less damage taken. Ranger, with 40-damage
  magic arrow, 20-damage dagger and Hawk's Eye passive, 25% more range. Esq, the
  area-damage class with homing dark-magic Shadow Bolt for 30, 15-damage melee
  Staff Whack and Arcane Focus passive, 50% more mana regeneration. Phantom, the
  assassin with twin thrown Spirit Daggers for 15 each, 25-damage melee Twin
  Daggers and Backstab passive, 50% more damage from behind.


  NinoGreeno wanted to take the familiar core of shooters, usually built around
  guns and grenades, and carry it into a fantasy setting.
