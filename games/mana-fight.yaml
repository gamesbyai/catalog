slug: mana-fight
title: MANA FIGHT
tagline: Pick a spellcasting class and fight through fast third-person arena battles.
description: >-
  You start by picking one of four classes, and each one comes with its own pair
  of attacks and a passive perk. It's a third-person shooter, but the guns are
  swapped for spells, bows and blades.


  The Tank is the frontline pick, with a Fireball that does area damage and a
  melee Sword, plus Heavy Plate, which cuts the damage you take by a fifth. The
  Ranger kites from a distance with a magic green arrow and a Dagger, and Hawk's
  Eye adds range.


  The Esq class is the area damage caster. It throws a homing Shadow Bolt,
  swings a Staff Whack up close, and regains mana faster thanks to Arcane Focus.


  Then there's the Phantom, an assassin who throws blue Spirit Daggers and
  slashes with Twin Daggers. Backstab gives it extra damage when you hit from
  behind, which is a nice reason to go around your target.


  Each class card shows attack, defense and speed bars, so you can compare them
  before you commit. The Tank maxes out defense, while the Phantom leans on
  speed.


  The menu also has tabs for Map 1, Movement, Model Lab, Aim and Game Logs. The
  creator wanted the usual gun-and-grenade shooter formula but in a fantasy
  world with a fresher spirit, and the goal is to dominate the arena.
