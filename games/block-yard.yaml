slug: block-yard
title: Block Yard
tagline: Place factories on a grid to build shapes, then design levels to stump friends.
description: >-
  Block Yard is a grid puzzle about factories. You place them on the board so
  they manufacture a target shape, and each level is a question of where every
  piece should go.


  It was built mobile first, so the interface is made for touch, but the puzzles
  are meant to have real difficulty. The creator started it for the gamedev.js
  jam after seeing the YouTube Playables sponsor, later entered it in Vibe Jam
  2026, and says it was built with Claude Code in Phaser.


  Once you understand how the factories work, a level design mode lets you build
  your own puzzles and share them, so friends have to solve what you made. That
  shifts the game from solving to setting traps, and it gives the puzzles a
  social side.
