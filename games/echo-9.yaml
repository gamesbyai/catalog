slug: echo-9
title: Echo-9
tagline: Deliver packages on foot through post-apocalyptic Hanoi using a desktop
  and a phone.
description: >-
  Deliver bowls of phở on foot through Hanoi in 2055, after the grid has gone
  dark. Thousands of scooters fill the streets, and you steer your courier with
  WASD on the desktop while dodging them on the way to each drop-off.


  The game is built for two screens. The title screen shows a QR code and a
  session link to open on your phone. The phone acts as your map and flashlight,
  and as a balance sensor in your pocket that you keep steady. It also has
  buttons and a briefing, and it reads the accelerometer. A link on the title
  screen lets you play without a phone.


  The creator wanted the mood of Another World (1991) in 3D, and added the phone
  as a second device for novelty. The title screen also offers Settings and
  Highscores.
