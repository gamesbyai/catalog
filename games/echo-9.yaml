slug: echo-9
title: Echo-9
tagline: Deliver packages on foot through post-apocalyptic Hanoi using a desktop
  and a phone.
description: >-
  You're a delivery courier on foot in Hanoi in 2055, carrying bowls of phở
  across a city where the grid is out. Thousands of scooters share the streets
  with you, so every delivery means staying out of their way.


  You walk your courier with WASD on the desktop, and the phone handles the rest
  of the job.


  That's the odd part, because the phone isn't just a second screen. You scan a
  QR code or paste a link into your phone to pair it, and then it becomes your
  map and your flashlight, which is a sensible kit for a blacked-out city.


  It's also a balance sensor in your pocket, so you're asked to keep it steady,
  and it carries buttons and a mission briefing too.


  The creator grew up loving Another World from 1991 and wanted that same mood
  in 3D. Using the phone alongside the desktop was the twist added on top.


  If you don't have a phone handy, the title screen has a play-without-a-phone
  link. The menu also offers settings and a highscores page.
