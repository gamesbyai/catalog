slug: echo-9
title: Echo-9
tagline: Deliver packages on foot through post-apocalyptic Hanoi using a desktop
  and a phone.
description: >-
  In 2055, Hanoi's grid has gone dark, and you're a courier carrying bowls of
  phở across the city on foot.


  Thousands of scooters to dodge. Your phone as a balance sensor, read by its
  accelerometer. Two screens, the phone doing a large share of the work. A
  mission briefing and buttons on the phone.


  Steer around the scooters with WASD on your computer while you head for each
  drop-off. Scan the QR code or copy the session link to your phone. Pocket the
  phone and keep it steady. A small link also lets you play without a phone at
  all.


  tonnoz loved Another World (1991) as a kid and set out to recreate its mood in
  3D. They added the phone as a second device, for novelty.
