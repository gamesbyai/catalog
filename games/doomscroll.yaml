slug: doomscroll
title: DOOMscroll
tagline: Shoot your way through a Doom-style level using nothing but the scroll input.
description: >-
  Scrolling is the only input in this Doom-style first-person shooter, the same
  habit people use on endless feeds.


  A level to shoot your way through. Real news headlines on the in-game plaques,
  a running commentary drawn from current events while you scroll and shoot.
  Working out how far and how fast to scroll to get through the level.


  According to the creator, the game was built with an AI model.
