slug: doomscroll
title: DOOMscroll
tagline: Shoot your way through a Doom-style level using nothing but the scroll input.
description: >-
  DOOMscroll is a first-person shooter in the style of classic Doom, with one
  twist: the player controls everything by scrolling. Movement and action are
  tied to the scroll input instead of the usual keyboard and mouse setup, so
  each run becomes an exercise in working out how far and how fast to scroll.


  The in-game plaques display real news headlines, which gives the corridors a
  running commentary drawn from current events. The pairing of a retro shooter
  with the habit of endlessly scrolling through feeds is the joke at the center
  of the design.


  The creator states that it was built with GPT-5 and rendered with HTML5
  Canvas, so it runs directly in a web browser. It is built for solo play.
