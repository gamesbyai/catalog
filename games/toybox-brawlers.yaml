slug: toybox-brawlers
title: ToyBox Brawlers
tagline: Fight one-on-one as a plush toy in a chaotic arena until one is left.
description: >-
  Brawling and platforming mix in fast one-on-one fights between plush toys. Two
  soft toys go into a toy box, and only one makes it out. The toys are cute, but
  the fights are savage.


  Online multiplayer for head-to-head fights. Positioning in the arena, weighted
  as much as landing hits.


  lewisEllio63836 started the project after a friend decided to enter a game
  competition. The creator names Street Fighter and Toy Story as inspirations.
