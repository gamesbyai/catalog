slug: jellingstone
title: Jellingstone
tagline: Guide Harold Bluetooth to build defenses and hold a Viking coast
  against raiders.
description: >-
  Jellingstone is a voxel Viking village defense game with a toy-like look. You
  guide Harold Bluetooth around the map, gathering supplies, awakening runes,
  and building fortifications. Raiders threaten the coast, so each stretch of
  play balances growing the settlement against holding it.


  The tone is cozy but dangerous, mixing click-to-move action RPG movement with
  village building. A peaceful coastal settlement can grow into a defended
  kingdom, and the world beyond the shore is endless and full of things to find.
  It runs on mobile as well as desktop.


  It began as a father-and-son project, inspired by the real Jelling Stone and
  the family's ties to Jelling, Denmark. The creator says they built it with GPT
  5.5 over a single weekend, as a way for the son to learn programming, and then
  entered it in Vibe Jam 2026.
