slug: sumoball-io
title: SumoBall.io
tagline: Bump rival sumo balls off the arena to be the last one standing.
description: >-
  SumoBall.io is a shoving match between balls, played online. You control a
  sumo ball in a multiplayer arena and try to knock every other player off the
  platform, and the last ball still on it wins.


  The creator took the idea from the sumo minigame in Fusion Frenzy and the
  bumper balls in Mario Party, then built the rest by feel. They made it with
  Codex, with Three.js rendering the 3D arena, and it ended up 371st of 945 in
  Vibe Jam 2026.


  Everything is set up for quick multiplayer rounds, which is where the project
  started. Rounds are fast, matches end quickly, and players can drop in or out,
  on a phone as well as in a desktop browser, so little stands between you and
  the next bump.
