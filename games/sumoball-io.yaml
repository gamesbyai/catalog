slug: sumoball-io
title: SumoBall.io
tagline: Bump rival sumo balls off the arena to be the last one standing.
description: >-
  You control a sumo ball in an online arena and try to knock every other player
  off the platform.


  Fast multiplayer rounds. Easy drop-in and drop-out play. A win for the last
  ball left on the platform.


  netpro2k took the idea from the sumo minigame in Fusion Frenzy and the bumper
  balls in Mario Party. The project started with quick multiplayer rounds, and
  they built the rest by feel.
