slug: mrr-battle
title: MRR Battle
tagline: Play cards as an indie hacker, fending off DDoS attacks and Hacker News roasts.
description: >-
  Press Quick Play to start a card battle themed on running an indie software
  business. Each card shows a cost in R, a small lightning number, and a type
  label such as Growth or Defense. You play cards to build revenue and fend off
  attacks.


  Card text spells out the effects. Enterprise Deal adds 300 MRR immediately.
  Multi-Cloud Setup stops DDoS and outage cards for 3 turns. Legal Team reflects
  the next attack back at the opponent. AI Hype Cycle gives all players +2
  hustle for the turn.


  Threats in the deck include Paid Ads, DDoS attacks and Hacker News roasts, all
  drawn from indie hacker life. Matches are played online against other people.
  The menu also offers a Training Center, a leaderboard, and a sign-in. The
  creator, an indie hacker for about ten years, made it so friends and family
  could get that experience without the money.
