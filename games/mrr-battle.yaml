slug: mrr-battle
title: MRR Battle
tagline: Play cards as an indie hacker, fending off DDoS attacks and Hacker News roasts.
description: >-
  Play cards to build revenue and fend off attacks in a battle about running an
  indie software business. Cards cost R and carry a type, such as Growth or
  Defense.


  Enterprise Deal, an immediate 300 MRR. Multi-Cloud Setup, a 3-turn block on
  DDoS and outage cards. Legal Team, a card that reflects the next attack back
  at the opponent. AI Hype Cycle, +2 hustle for all players that turn. Threats
  like Paid Ads, DDoS attacks and Hacker News roasts, all from indie hacker
  life.


  Press Quick Play to start an online card battle against other players. Read
  the card text to see what each card does.


  MRRBattle, an indie hacker for about ten years, made it so friends and family
  could get that experience without the money.
