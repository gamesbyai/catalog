slug: mrr-battle
title: MRR Battle
tagline: Play cards as an indie hacker, fending off DDoS attacks and Hacker News roasts.
description: >-
  Paid Ads grow your revenue, and DDoS Attacks and Hacker News Roasts threaten
  it, in MRR Battle, a strategy card battler about running an indie software
  business. You build a hand of cards and play it turn by turn.


  It is a lighthearted take on the startup grind, drawn from the creator's
  nearly ten years as an indie hacker. The idea is to let friends and family
  feel what that is like without the thousands of hours and the money it usually
  costs.


  Multiplayer and a mobile-friendly layout make it easy to share with them, and
  it placed 101st of 945 at Vibe Jam 2026. In play, each turn is a choice
  between growth and defense: chase revenue, or protect what you have from the
  next attack or roast.
