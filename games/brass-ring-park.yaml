slug: brass-ring-park
title: Brass Ring Park
tagline: Lay out a theme park on bare grass, then open the gates to guests.
description: >-
  Build a park from a small plot, with a road up to the gate and a few path
  tiles.


  Gentle and thrill rides, plus coasters. Paths, food and shops, and facilities,
  scenery and staff. Land tools and bulldozing. Sandbox mode for trying out
  layouts, with money no object.


  The park starts closed. Open it when you're ready to let guests in. Pause to
  plan, or pick one of several speeds to skip ahead through the day.
