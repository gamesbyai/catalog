slug: brass-ring-park
title: Brass Ring Park
tagline: Lay out a theme park on bare grass, then open the gates to guests.
description: >-
  You build a park that starts as a small plot, with a road up to the gate and a
  few path tiles. The build list covers paths, gentle and thrill rides,
  coasters, food and shops, facilities, scenery, staff, land tools and
  bulldozing.


  The park starts out closed, and you open it when you're ready to let guests
  in.


  Pause and several speed settings let you plan, or skip ahead through the day.


  Sandbox mode is for trying out layouts, since money's no object in it.
