slug: kurve-royale
title: Kurve Royale
tagline: Fly a trail-leaving craft and outlast rival pilots inside a shrinking dome.
description: >-
  Kurve Royale is a 3D survival game in which pilots drop into a dome that keeps
  shrinking. Each pilot flies a craft that leaves a trail behind it, and the aim
  is to stay airborne longer than everyone else as the safe space closes in.


  The game blends the trail-avoidance idea of classic curve games with battle
  royale pacing, moved into three dimensions. Rivals share the arena in
  multiplayer, so the trails and the shrinking boundary create constant
  pressure. It is built for browsers and is set up to work on mobile devices as
  well.


  It was submitted to Vibe Jam 2026, where it placed 174th out of 945 entries.
  The creator built it with Codex, with Three.js handling the 3D rendering.
