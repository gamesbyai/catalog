slug: kurve-royale
title: Kurve Royale
tagline: Fly a trail-leaving craft and outlast rival pilots inside a shrinking dome.
description: >-
  You fly a small glowing orb that paints a thick colored trail behind it, and
  you steer it in three dimensions. A and D turn you left and right, while W and
  S climb and dive.


  Everyone plays inside a dome that shrinks as the match goes on, so the space
  you have to fly in keeps getting tighter. The lobby has room for 64 pilots,
  and the corner of the screen shows how many are in, how many are still alive,
  and how wide the dome is.


  You type a nickname, press Drop In, and the drop starts right away with no
  menu in between. Once you land, an in-game countdown finishes and then your
  movement starts.


  The camera sits behind your orb and follows the trail as it curves away across
  the dark, starry dome.


  Getting eliminated doesn't kick you out of the session. You can stay and
  spectate the pilots still flying, or jump into a fresh lobby and drop again.
