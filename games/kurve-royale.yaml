slug: kurve-royale
title: Kurve Royale
tagline: Fly a trail-leaving craft and outlast rival pilots inside a shrinking dome.
description: >-
  You fly a pilot that leaves a solid colored trail behind it, inside a dome
  that shrinks over time. Type a nickname, press Drop In, and the drop starts
  immediately. Once you land, a countdown finishes and movement begins.


  Steering is on the keyboard: A and D turn, W and S climb and dive. The camera
  sits behind your pilot, so the trail stretches back into the dome as you fly.
  The top of the screen shows how many players are in the lobby out of 64, how
  many are still alive, and the current dome size in units.


  The match is a survival round. Eliminated pilots can spectate the rest of the
  round or jump into a fresh lobby. Flight is fully three-dimensional, so you
  control height as well as heading.
