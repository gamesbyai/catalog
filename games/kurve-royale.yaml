slug: kurve-royale
title: Kurve Royale
tagline: Fly a trail-leaving craft and outlast rival pilots inside a shrinking dome.
description: >-
  Pilots leave a trail behind them as they fly. The dome they fly in shrinks
  over time. You can fly in full 3D, so you have to watch your height as well as
  your direction.


  Survival rounds for each match. Lobbies of up to 64 players. Spectating the
  rest of the round for knocked-out players. A fresh lobby to jump straight
  into.


  Type a nickname and drop in. You start the drop right away. After you land,
  wait for the countdown to finish before you move. Turn with A and D, and use W
  to climb and S to dive.
