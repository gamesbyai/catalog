slug: kurve-royale
title: Kurve Royale
tagline: Fly a trail-leaving craft and outlast rival pilots inside a shrinking dome.
description: >-
  Kurve Royale is a battle royale for pilots, played online. Everyone drops into
  a dome that keeps shrinking, flying a craft that leaves a trail behind it, and
  the aim is to stay airborne longer than everyone else as the safe space closes
  in.


  It takes the trail-avoidance idea of classic curve games, adds battle royale
  pacing, and moves the whole thing into three dimensions, io-game style. It is
  a Codex project built on Three.js, and it plays in desktop and phone browsers
  alike.


  Rivals share the arena, so the danger comes from two directions at once: their
  trails and the shrinking boundary. The room to fly gets smaller the longer a
  match lasts, and the pressure never lets up until one pilot is left.
