slug: kurve-royale
title: Kurve Royale
tagline: Fly a trail-leaving craft and outlast rival pilots inside a shrinking dome.
description: >-
  Your pilot leaves a trail behind it, and you're flying inside a dome that
  shrinks over time.


  Getting into a round is about as quick as it gets. You type a nickname and hit
  Drop In, the drop starts right away, and once you've landed a countdown runs
  out before you're allowed to move.


  The flight is fully three-dimensional, so height matters as much as heading. A
  and D turn you, while W and S climb and dive. Each lobby holds up to 64
  players.


  Each match is a survival round. Getting knocked out doesn't strand you,
  either. You can stick around and spectate the rest of the round or jump
  straight into a fresh lobby.
