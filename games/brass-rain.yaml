slug: brass-rain
title: Brass Rain
tagline: Run and shoot across a sun-baked desert, with a friend able to drop in.
description: >-
  Standard ammo is unlimited in this run-and-gun, where you control a soldier
  pushing through a desert. You start with 10 bombs.


  A string of missions, the first set in the desert. Boss fights mixed in among
  the missions. Separate point totals for each player. One shared HI score for
  both players. Controller support.


  Play alone, or press Enter at any moment to let a friend join.
