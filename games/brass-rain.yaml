slug: brass-rain
title: Brass Rain
tagline: Run and shoot across a sun-baked desert, with a friend able to drop in.
description: >-
  You play a soldier pushing through a desert. Your standard ammo is unlimited,
  and you start with 10 bombs.


  A friend can join at any moment by pressing Enter. Each of you racks up your
  own points, but you share one HI score. This is a run-and-gun you can play
  solo or with a friend.


  You move through a string of missions that starts in this desert, with boss
  fights in the mix. You can also play with a controller.
