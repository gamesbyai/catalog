slug: snakelite
title: Snakelite
tagline: Steer a growing snake through roguelite runs and pick up upgrades along the way
description: >-
  Snakelite is a roguelite take on the classic snake game. You guide a snake
  around the board, eating to grow while avoiding walls and your own tail. Each
  run is a fresh attempt, so the goal is to last as long as you can and get
  further than the previous try.


  The appeal comes from mixing two familiar formats: the simple grid movement of
  snake and the run-based structure of roguelites. Players who enjoy either one
  get a quick, replayable loop where every attempt starts over and rewards
  careful steering and good decisions.


  It was entered in Vibe Jam 2026, where it placed 615th among 945 entries. The
  creator built it with GitHub Copilot and draws it on an HTML canvas, which
  keeps the game light enough to play directly in a browser.
