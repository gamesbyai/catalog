slug: hinom-tower
title: Hinom Tower
tagline: Team up to survive arena waves, stack upgrades, and mow down hordes.
description: >-
  Hinom Tower is a cooperative arena roguelike shooter. Players fight through
  successive waves of enemies inside a closed arena, picking up upgrades along
  the way. Each run builds on the last choice, so the character grows steadily
  stronger as the waves get bigger.


  The focus is on snowballing power. Upgrades stack on top of one another, and
  the screen fills with enemies that a well-built character can clear in bulk.
  Playing with others in co-op adds a shared sense of chaos, since several
  players can combine their builds against the same crowd.


  It was an entry in Vibe Jam 2026, where it ranked 165 out of 945 entries. The
  creator built it with Cursor and lists Unity as the engine.
