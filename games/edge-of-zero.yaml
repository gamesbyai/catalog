slug: edge-of-zero
title: EDGE OF ZERO
tagline: Stop a counter as close to zero as you can without going past it.
description: >-
  EDGE OF ZERO is a one-button timing game set in a 3D scene in the browser. The
  goal is to stop as close to zero as possible. Cross zero and the run ends, so
  every press is a judgment about when to stop and how much risk to take.


  The tension comes from the single-input design: one button, one decision, and
  an immediate result. The creator describes it as combining the quick
  one-more-try pressure of Flappy Bird with the viral weekly flying-game trend
  from fly.pieter.com, with the idea of never passing zero standing in as a
  metaphor for decisiveness.


  It was entered in Vibe Jam 2026, where it placed 599th of 945 entries. The
  creator states that it was built with Claude Code and runs on Three.js. It
  works on mobile as well as desktop.
