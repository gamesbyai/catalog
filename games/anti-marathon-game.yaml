slug: anti-marathon-game
title: Anti Marathon Game
tagline: Play a Madrid pigeon dodging runners, energy gels, and selfie-stick
  influencers.
description: >-
  Push the on-screen joystick to steer a pigeon down a Madrid street that's been
  closed off for a marathon. There's also a Jump button.


  Your goal is to survive the race while runners, splattered energy gels and
  influencers waving selfie sticks take over what used to be your quiet patch of
  road. Your distance in km ticks up as you move.


  soyAlvaroMarin wanted to flip the usual view of an urban marathon, with its
  runners in expensive GPS watches and its runfluencers, and put you in the
  feathers of an ordinary pigeon on Calle Alcalá. According to the creator, it's
  satire written with real affection for running culture.
