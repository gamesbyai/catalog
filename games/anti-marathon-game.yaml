slug: anti-marathon-game
title: Anti Marathon Game
tagline: Play a Madrid pigeon dodging runners, energy gels, and selfie-stick
  influencers.
description: >-
  Drag the on-screen stick to steer, and tap the red Jump button to hop. You're
  a street pigeon in Madrid, and a marathon has just taken over your road.


  Runners, energy gels and influencers waving selfie sticks are all in your way,
  so the whole job is staying alive while they pour down the street. It flips
  the usual race, because you're the one in the way of everybody who's running.


  The camera looks down from above at an angle, so you can see the wide road
  ahead of you. A yellow dashed line runs down the middle, red barriers sit
  along both edges, and spectators crowd the grass beyond them.


  Trees, parked cars and flat-colored rooftops fill the sides, which gives the
  street a toy-town look.


  A counter in the top left shows the kilometers you've covered, starting from
  zero at the start line. That's a fitting score for a marathon. A red number in
  the top right climbs as you go, and a pause button sits under it.


  The creators set it on Calle Alcalá and call it a satirical love letter to
  running culture. They poke fun at the €800 GPS watches, the runfluencers
  filming themselves and the gels splattered across the pavement.
