slug: anti-marathon-game
title: Anti Marathon Game
tagline: Play a Madrid pigeon dodging runners, energy gels, and selfie-stick
  influencers.
description: >-
  Push the on-screen joystick to steer a pigeon down a closed-off Madrid street.
  A red Jump button sits at the bottom right. The aim is to survive the marathon
  while runners, splattered energy gels and influencers with selfie sticks fill
  the street.


  The view is tilted top-down over a low-poly avenue with a yellow center line
  and red barriers along both edges. Spectators stand on the grass verges, and
  parked cars sit beside the buildings. A distance counter in the top left
  starts at 0.0 KM and rises as you move, with a segmented bar beneath it. A red
  number in the top right also climbs. Pause and M buttons sit at the right
  edge.


  The creator says the idea was to flip the viewpoint of an urban marathon, with
  its runners wearing expensive GPS watches and its runfluencers, and to play as
  an ordinary pigeon on Calle Alcalá. The creator calls it satire aimed
  affectionately at running culture.
