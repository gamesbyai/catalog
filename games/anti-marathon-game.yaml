slug: anti-marathon-game
title: Anti Marathon Game
tagline: Play a Madrid pigeon dodging runners, energy gels, and selfie-stick
  influencers.
description: >-
  A Madrid street is closed for a marathon, and you're the pigeon who lives
  there. Survive the race.


  Runners, splattered energy gels and influencers with selfie sticks. Distance
  in km ticking up as you go. A Jump button. Calle Alcalá as your patch of road.


  Push the on-screen joystick to steer.


  Satire of urban marathon culture, made by soyAlvaroMarin with real affection
  for running.
