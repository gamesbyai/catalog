slug: rubble-kings
title: Rubble Kings
tagline: Stack physics blocks into a tall kingdom and knock down your rivals' towers.
description: >-
  You build your kingdom out of physics-based blocks, and the taller you stack
  them, the more land you control. That's a neat trade, because height is also
  what makes you easy to hurt. One good hit from an enemy can bring the whole
  thing down.


  So every tower is both your claim on the map and your biggest risk.


  It's billed as a real-time strategy game built from blocks, and the creator
  says it came from a half-remembered game they saw more than twenty years ago.
  They couldn't find it again, so they made something similar.


  You can play with other people online. The host opens a waiting room with a
  room code and a share link, so friends can join by code or by link instead of
  having to be matched up.


  Before the match starts, you pick your name, a color, and a heraldry emblem
  from a grid of about thirty crests, which is a lot of ways to fly a flag over
  a pile of rubble.


  The host sets how many human players there are and how many AI opponents fill
  the rest, and each AI slot can be left random or set by hand. There's also a
  control style setting, which defaults to an easy snapping mode.


  The menu has a How to Play screen and an Options screen if you want to look
  things over first.
