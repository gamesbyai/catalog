slug: rubble-kings
title: Rubble Kings
tagline: Stack physics blocks into a tall kingdom and knock down your rivals' towers.
description: >-
  Land comes from height in this one. You stack physics-driven blocks into a
  kingdom, and the taller your structure stands, the more territory you control.
  Building upward is how you expand.


  The height that wins you land also makes the tower easier to topple, and one
  well-placed hit from a rival can bring the whole thing down in a heap of
  rubble.


  Your rivals are trying to knock your tower over while you go after theirs, so
  stability matters as much as size. It's a neat tug-of-war to get out of one
  rule about how tall you build.


  Before a match you land in a waiting room with a four-letter room code and a
  share link for friends. You pick a name, a color and a crest from a grid of
  thirty heraldic emblems, anything from a stag to a thistle to a harp. For a
  game about piling up blocks, it's a surprisingly generous coat-of-arms
  cabinet.


  The host sets how many human players and AI opponents take part, and there's a
  control style option with an easy mode labeled snap.


  eric_j_sexton made it after remembering a game a little like this from more
  than twenty years ago. They could never recall its name or track it down, so
  they built something similar themselves.
