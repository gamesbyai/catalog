slug: rubble-kings
title: Rubble Kings
tagline: Stack physics blocks into a tall kingdom and knock down your rivals' towers.
description: >-
  Build a kingdom from physics-based blocks, where the taller your structure
  stands, the more land you control. The height that wins you land also makes
  the tower easier to topple. One well-placed hit from a rival can bring the
  whole thing down in a heap of rubble.


  Rival towers as both targets and threats. Equal weight on stability and size.
  Host-set counts of human players and AI opponents. An easy control style
  called snap.


  Before a match, you land in a waiting room. Send friends the four-letter room
  code or the share link. Pick a name, a color and a crest from a grid of thirty
  heraldic emblems, anything from a stag to a thistle to a harp.


  eric_j_sexton made it after remembering a game a little like this from more
  than twenty years ago. They could never recall its name or track it down, so
  they built something similar themselves.
