slug: save-the-city
title: save the city
tagline: Play a tourist turned hero fighting rogue AI and giant robots across
  Seoul and Waikiki.
description: >-
  An eight-panel comic opens the game. A tourist in Seoul sees the city's AI and
  its five color-coded E.R.A. heroes taken over by a hacker. A soldier asks him
  to help.


  You type a username, choose a language, and pick the Seoul or Wai-kiki stage.
  You can put your own face on the character with a camera or an uploaded photo.
  You can dress your character in one of four outfits (Bao Soldier, Bao Fighter,
  Bao Spy or Bao Superhuman), and there's a hair toggle too.


  Each stage is set in a city and runs on a 300-second countdown, and your goal
  is to save it. Your opponents are a rogue AI, E.R.A. heroes that have been
  corrupted, and giant robots. The creator drew on a game from their childhood.
