slug: save-the-city
title: save the city
tagline: Play a tourist turned hero fighting rogue AI and giant robots across
  Seoul and Waikiki.
description: >-
  A tourist on vacation turns out to be the only person who can defend two
  cities. Save the City is a 3D action game that sends that unlikely hero
  through Seoul and Waikiki to stop rogue AI forces, corrupted E.R.A. heroes,
  and giant robots.


  The creator describes it as a childhood game, so it reads as a personal
  project. It was made with Codex and Three.js as a single-player browser game,
  and it went into Vibe Jam 2026, where it came 378th of 945.


  The setting is the draw: both battlegrounds are real-world locations, and the
  hero starts as an ordinary vacationer rather than a trained fighter. The enemy
  list pairs former heroes who have gone bad with oversized machines, which
  gives the story a comic-book feel.
