slug: save-the-city
title: save the city
tagline: Play a tourist turned hero fighting rogue AI and giant robots across
  Seoul and Waikiki.
description: >-
  A hacker has taken over Seoul's AI and its five color-coded E.R.A. heroes, and
  a tourist gets pulled in to save the city.


  An eight-panel comic opening. Seoul and Waikiki stages, each on a 300-second
  countdown. A rogue AI, corrupted heroes and giant robots to fight. Your own
  face on the character, from a camera or a photo. Four outfits, from Bao
  Soldier to Bao Superhuman.


  The creator drew on a game from their childhood.
