slug: save-the-city
title: save the city
tagline: Play a tourist turned hero fighting rogue AI and giant robots across
  Seoul and Waikiki.
description: >-
  An eight-panel comic opens the game. A tourist in Seoul sees the city's AI and
  its five color-coded E.R.A. heroes taken over by a hacker. A soldier asks him
  to help, and the last panel shows a huge robot above the skyline. A Game Start
  button then opens the setup screen.


  On the setup screen you type a username, choose a language, and pick the Seoul
  or Wai-kiki stage. You can use a camera or upload a photo to put your own face
  on the character. Four outfits are available, Bao Soldier, Bao Fighter, Bao
  Spy and Bao Superhuman, along with a hair toggle.


  Each stage runs on a 300-second countdown in a blocky 3D city, with the goal
  shown as saving the city. A P1 panel shows five hearts and two bars. Your
  opponents are a rogue AI, E.R.A. heroes that have been corrupted, and giant
  robots. The creator drew on a game from their childhood.
