slug: save-the-city
title: save the city
tagline: Play a tourist turned hero fighting rogue AI and giant robots across
  Seoul and Waikiki.
description: >-
  Save the City is a 3D action game in which an ordinary tourist ends up as the
  only person able to defend two cities. The player fights rogue AI forces,
  corrupted E.R.A. heroes, and giant robots, moving through Seoul and Waikiki to
  stop the threat.


  The setting stands out: two real-world locations serve as battlegrounds, and
  the hero starts as a vacationer instead of a trained fighter. The enemy roster
  mixes former heroes who have gone bad with oversized machines, which gives the
  story a comic-book feel. The creator describes it as a childhood game, so it
  reads as a personal project.


  The creator built it with Codex and Three.js for the Vibe Jam 2026 event,
  where it placed 378th out of 945 entries. It runs in the browser.
