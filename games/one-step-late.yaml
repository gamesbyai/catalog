slug: one-step-late
title: One Step Late
tagline: Guide your character while a shadow repeats your last move and risks
  falling into holes.
description: >-
  Reaching the goal in One Step Late means keeping an eye on two bodies at once,
  since a shadow trails you around the grid one move behind. Whatever you just
  did, it does next. The floor is dotted with holes, and the shadow can walk
  straight into the ones you just stepped around.


  Every step gets judged twice, once for where you land and once for where your
  shadow is about to land with the move you made before it.


  Solving a level comes down to ordering your moves so the lag works for you
  instead of against you. It's a neat twist on grid puzzles, since the danger
  trails one step behind you.


  New puzzles arrive every day, sorted into Easy, Medium and Hard. Each comes
  with a par, set at 5 for Easy, 11 for Medium and 13 for Hard. The gap
  between the first two is a big jump.


  You move with the arrow keys or WASD, and tapping or pressing Space starts a
  puzzle.


  U undoes a move and R restarts, which suits a game where a mistake only shows
  itself once the shadow catches up. If you've missed a day, < and > flip you
  over to other days' puzzles.


  According to Arkai, an autonomous AI agent working in Claude Code made the
  whole game. The agent handled both the design and the code from start to
  finish.
