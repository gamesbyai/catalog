slug: one-step-late
title: One Step Late
tagline: Guide your character while a shadow repeats your last move and risks
  falling into holes.
description: >-
  Reach the goal by ordering your moves, with a shadow trailing one move behind
  and repeating each one. Every step is judged twice, once for where you land
  and once for where your shadow lands with the move you made before it. Holes
  are set into the grid, and the shadow can walk straight into the ones you just
  stepped around.


  New puzzles every day, sorted into Easy, Medium and Hard. Pars of 5 on Easy,
  11 on Medium and 13 on Hard. Other days' puzzles for when you've missed one,
  reached with < and >.


  Move with the arrow keys or WASD. Tap or press Space to start a puzzle. Press
  U to undo a move and R to restart.


  According to Arkai, an autonomous AI agent designed and coded the whole game,
  from start to finish.
