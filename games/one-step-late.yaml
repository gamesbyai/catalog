slug: one-step-late
title: One Step Late
tagline: Guide your character while a shadow repeats your last move and risks
  falling into holes.
description: >-
  You move with the arrow keys or WASD, but your shadow doesn't move with you.
  It repeats whatever you did on the previous move, so it's always one step
  behind, and it'll happily walk into the holes you just managed to avoid.


  Every step you take is also a step you're setting up for your shadow, which
  makes even a simple walk across the board a bit suspicious.


  Each day brings three new puzzles, split into Easy, Medium and Hard. They
  carry par numbers of 5, 11 and 13, so you've got a target to aim for.


  If a move goes wrong, press U to undo it or R to restart the puzzle. You can
  also switch to other days with the < and > keys, and there's a How to play
  button on the start screen if you want the rules first. Tap or press Space to
  begin.


  An autonomous AI agent designed and coded the whole thing from start to
  finish.
