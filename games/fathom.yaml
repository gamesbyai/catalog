slug: fathom
title: Fathom
tagline: Dive underwater in first person and salvage what the deep has to offer.
description: >-
  You head out, look for things worth recovering, and bring them back. Fathom is
  a first-person underwater simulation. You dive in yourself instead of steering
  a boat from above.


  Turning and looking around. You can move in all three directions under the
  surface. Choice of how deep to descend before the trip back.


  wolfertstetter worked with an AI as co-developer, partly to see how much of a
  real game could be built that way. The game uses the salvage loop from Dredge
  and adds the sense of wonder you get from first-person underwater games like
  Subnautica.
