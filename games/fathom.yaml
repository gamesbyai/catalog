slug: fathom
title: Fathom
tagline: Dive underwater in first person and salvage what the deep has to offer.
description: >-
  You are the diver in Fathom, a first-person underwater simulation. It follows
  the salvage loop of Dredge: head out, search the water for things worth
  recovering, and bring them back. Instead of steering a boat from above, you
  are down in the water yourself.


  Movement works in three dimensions beneath the surface, so a trip means
  turning to look around and choosing how deep to descend before you head back
  with what you found. It pairs that collect-and-return structure with the sense
  of wonder of first-person underwater exploration games like Subnautica.


  Claude Code served as a co-developer on this Vibe Jam 2026 entry, partly so
  the creator could see how much of a real game could be built that way. It is a
  single-player game, and Three.js renders the water around you.
