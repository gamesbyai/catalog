slug: san-francisco-the-game
title: San Francisco -- The Game
tagline: Roam a rebuilt San Francisco, climb buildings, drive cars and play with others.
description: >-
  This is an open-ended 3D sandbox set in San Francisco, with the city recreated
  from Apple Maps data. Players move through the streets on foot, scale
  buildings, and take over cars to get around. Other people can join the same
  city, so a session mixes solo exploring with shared play.


  The main draw is the setting: a real city laid out from map data rather than
  an invented one. Climbing to rooftops and driving between neighborhoods gives
  the player plenty of ways to move through the space, and multiplayer adds
  company to the wandering.


  The creator states that it was built with Codex, and it uses Three.js for the
  3D rendering, so the whole city is drawn and played in a web browser.
