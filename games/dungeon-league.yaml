slug: dungeon-league
title: Dungeon League
tagline: Run a dungeon for sixty seconds and keep adventurers alive but nearly dead
description: >-
  You're the dungeon, and the twist is that wiping out the adventurers is the
  wrong move. You only earn from a party that's still alive, still fighting and
  badly hurt when the sixty-second timer ends, so you're aiming to leave them
  hanging on by a sliver.


  You've got three actions: open a door, spawn a monster, or set off a trap.
  Once a monster is out, you can't recall it, which is why the slime pit on
  screen warns that holding a party in place works until you add too many and
  they die.


  A door is the only way you get to ease off, and it's a handy one.


  Open one behind a party that's losing and they'll retreat, heal and come back
  for another go, which is an odd way to protect your income. A party that
  simply walks out early pays nothing either, so you're stalling them without
  finishing them.


  Between raids you spend your earnings on new halls, a slime pit, or a chest
  that makes the adventurers greedy.


  After that the standings update and the two bottom dungeons get destroyed. You
  begin in a league of twenty dungeons and have ten rounds to be the one still
  standing.


  On screen you've got a torch-lit pixel-art stone hall, a clock, an energy rate
  readout and a short standings list showing where your dungeon sits. The
  creator says AI wrote the code and architecture while they handled the design
  and balancing, and they kept a dated log explaining each design call.
