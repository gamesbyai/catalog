slug: doodle-battle
title: Doodle Battle
tagline: Sketch a picture, let AI name it, then watch it fight your opponent's drawing.
description: >-
  Three big glossy buttons in yellow, pink and teal greet you on the start
  screen. Quick Play throws you into a game automatically, while Create Room
  sets one up that you can invite friends into. Join Room takes a room code, or
  if you'd rather, you can browse the open rooms instead.


  There's a Tutorial button and a profile icon up in the top corner. The whole
  thing's got a pretty candy-bright look, with chunky bubble lettering and
  rounded panels everywhere.


  Every match starts with a sketch, and oddly enough it's an AI that has to work
  out what your scribble's meant to be before it goes up against the drawing
  your opponent made.


  Matches play out over several rounds, and a room can hold several players at
  once. Whoever creates a room picks the maximum number of players and a round
  limit, and they'll also choose how long everyone gets to draw and whether the
  room's private or public. Unless they change anything, the setup screen starts
  at 4 players, 5 rounds and a 60-second drawing timer.


  Drawing time's set on a slider, which gives the room creator a bit more
  freedom to nudge it up or down.
