slug: doodle-battle
title: Doodle Battle
tagline: Sketch a picture, let AI name it, then watch it fight your opponent's drawing.
description: >-
  When the game loads you get three big glossy buttons under the chunky Doodle
  Battle logo. Quick Play puts you into a game automatically, Create Room sets
  one up so you can invite friends, and Join Room lets you enter a code or
  browse rooms. A Tutorial button sits in the top corner next to a small profile
  icon.


  You draw something, and then that drawing has to go fight for you.


  A match starts with you sketching something. Then an AI guesses what your
  drawing is, and that drawing battles the one your opponent made. It's a funny
  chain, because your scribble has to be recognized by an AI before it gets to
  fight.


  If you make a room, you choose the maximum number of players and the round
  limit from two dropdowns, which start at 4 players and 5 rounds.


  Drawing time is a slider that starts at 60 seconds, so you can give everyone
  more or less time to sketch. Right below it, a visibility switch lets you pick
  Private or Public, and Public is already selected when you open the screen.
