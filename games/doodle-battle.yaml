slug: doodle-battle
title: Doodle Battle
tagline: Sketch a picture, let AI name it, then watch it fight your opponent's drawing.
description: >-
  Doodle Battle is a multiplayer drawing game that turns your sketch into a
  fighter. Each player draws something on a canvas, an AI looks at the drawing
  and guesses what it is, and then the drawing steps into the ring against the
  opponent's creation.


  It pairs a drawing prompt game with a head-to-head fight between players
  online, so the drawing you face comes from another person. It was built by
  axxelwp with Claude Code on PixiJS for the browser and placed 272nd of the 945
  entries at Vibe Jam 2026.


  What you draw matters, and so does how well the AI reads it, since the AI's
  guess is what names your fighter. The game mixes action, strategy and
  simulation elements with the creativity of a sketchpad.
