slug: doodle-battle
title: Doodle Battle
tagline: Sketch a picture, let AI name it, then watch it fight your opponent's drawing.
description: >-
  Every match starts with a sketch. An AI guesses your scribble first, then your
  opponent's drawing.


  Several rounds in every match. Rooms for several players, private or public. A
  room creator who sets the player cap, the round limit and the drawing time.


  Pick Quick Play for an automatic match, or Create Room to set up one to invite
  friends. Enter a room code or browse open rooms. Unless the room creator
  changes anything, setup starts at 4 players, 5 rounds and a 60-second drawing
  timer.
