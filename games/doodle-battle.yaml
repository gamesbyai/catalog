slug: doodle-battle
title: Doodle Battle
tagline: Sketch a picture, let AI name it, then watch it fight your opponent's drawing.
description: >-
  The start screen offers three big buttons. Quick Play joins a game
  automatically, Create Room sets up a room for inviting friends, and Join Room
  takes a room code or lets you browse open rooms. A Tutorial button and a
  profile icon sit in the top corner.


  Each match is built around drawing. You sketch something, an AI guesses what
  the drawing is, and then your doodle battles the one your opponent drew.
  Matches run over several rounds, and a room can hold several players at once
  online.


  The room creator picks the maximum number of players, a round limit, the
  drawing time and whether the room is private or public. The setup screen shows
  4 players, 5 rounds and a 60 second drawing timer as its starting values.
