slug: step-lightly
title: Step Lightly
tagline: Sneak through a dark ranch house where every footstep lights your way
  and alerts a monster
description: >-
  Each step you take lights up a little of the dark ranch house and makes a
  noise the monster can follow.


  Stealth horror in first person. Seeing and being heard, tied to the same
  footsteps. Quiet darkness when you stop. A monster hunting nearby the whole
  time.


  Walk, listen, and choose your moment.
