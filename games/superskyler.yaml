slug: superskyler
title: superskyler
tagline: Play party mini-games with friends, using your phone as the controller.
description: >-
  superskyler is a multiplayer party game made of short mini-games, played with
  the phones everyone already carries. Players join a shared session, use their
  own phones as controllers, play a quick round together, and move from one
  mini-game to the next.


  Because everyone in the room already has the device they need, the barrier to
  entry stays low. The creator made it for a school coding contest with Cursor
  and Claude Code, using Three.js for the graphics, and also entered it in Vibe
  Jam 2026.


  It is built around the feel of family game nights, and the creator says
  playing family games was the inspiration. That is the whole setup: a group in
  one room, each with a phone in hand.
