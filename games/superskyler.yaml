slug: superskyler
title: superskyler
tagline: Play party mini-games with friends, using your phone as the controller.
description: >-
  superskyler is a multiplayer party game made up of short mini-games. Players
  join a shared session and use their own phones as controllers, so a group can
  play together. Each round is a quick challenge, and the group moves from one
  mini-game to the next.


  The phone-as-controller setup keeps the barrier to entry low, since everyone
  in the room already has the device they need. It is built around the feel of
  family game nights, and the creator describes it as inspired by playing family
  games. It was made for a school coding contest and entered in Vibe Jam 2026.


  The creator built it with Cursor and Claude Code, using Three.js for the
  graphics. It placed 286th out of 945 entries in the jam.
