slug: superskyler
title: superskyler
tagline: Play party mini-games with friends, using your phone as the controller.
description: >-
  Gather a group in one room for superskyler, a multiplayer party game played
  with phones. Since everyone in the room already owns a phone, the barrier to
  entry stays low.


  Short mini-games for a group of players. Quick rounds, played together by the
  whole room. Transitions from one mini-game to the next.


  Join the shared session on your own phone. Use that phone as your controller.


  jpmarindiaz made it for a school coding contest. According to the creator,
  playing family games was the inspiration, and the game is built around the
  feel of a family game night.
