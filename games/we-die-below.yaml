slug: we-die-below
title: We Die Below
tagline: Fight through dungeon hordes solo or with up to three friends, then
  extract alive.
description: >-
  We Die Below is a dungeon extraction battler that can be played solo or in a
  co-op group of up to four players. Each run sends you into a dungeon to fight
  waves of enemies in horde-style combat, with the goal of getting out alive
  rather than simply surviving the longest.


  The design mixes two influences: the top-down, cooperative arcade feel of
  Gauntlet and the extraction pressure of Helldivers. The visual style carries
  subtle nods to analogue art, a medium the developers care about. It runs in
  the browser and has support for mobile play.


  The creator built it with Claude Code on Three.js and submitted it to Vibe Jam
  2026. The starting idea was a simple modernized take on Gauntlet, and other
  favorite games were folded in as development went on.
