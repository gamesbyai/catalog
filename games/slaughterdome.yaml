slug: slaughterdome
title: SlaughterDome
tagline: Survive enemy waves in a shrinking dome, building walls and capturing flags.
description: >-
  You're trapped inside an arena dome, fighting off waves of enemies while the
  dome pulls in tighter after every wave. Trees stop both your movement and
  bullets, so they work as cover. Even the scenery pulls its weight here.


  Starting at wave 5, toxic water pools cut off escape routes, leaving you less
  room to back away as the dome closes.


  You get to place walls yourself, and their job is to herd enemies into narrow
  paths. Chain together combos and you'll unlock rare upgrades.


  Staying alive isn't the whole job, though. Quake-style flag capture objectives
  run right alongside the survival waves, giving you something to chase besides
  the next wave.


  Up to three fighters can team up in co-op and take on the dome together.


  The title screen sets it all in 2089 and puts an armored, red-eyed warrior in
  front of a crowd of small, colorful monsters that look far cuddlier than the
  name SlaughterDome suggests.


  3xhuman built it by mixing three ideas from other games. The shrinking circle
  comes from battle royale games, the wall building from Fortnite, Roblox and
  Minecraft, and capture-the-flag from Quake.
