slug: slaughterdome
title: SlaughterDome
tagline: Survive enemy waves in a shrinking dome, building walls and capturing flags.
description: >-
  You're trapped inside an arena dome, fighting off waves of enemies. The dome
  tightens after every wave. From wave 5, toxic water cuts off escape routes,
  leaving less room to back away as the dome closes.


  Trees that block movement and bullets, acting as cover. Walls you place
  yourself, for herding enemies into narrow paths. Combos that unlock rare
  upgrades. Flag capture objectives alongside the survival waves. Co-op for up
  to three fighters.


  3xhuman built it by combining three ideas from other games: the shrinking
  circle of battle royale, wall building from Fortnite, Roblox and Minecraft,
  and capture-the-flag from Quake.
