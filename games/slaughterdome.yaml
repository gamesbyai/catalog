slug: slaughterdome
title: SlaughterDome
tagline: Survive enemy waves in a shrinking dome, building walls and capturing flags.
description: >-
  You fight waves of enemies inside an arena dome that shrinks with every wave.
  Trees block both movement and bullets, so they work as cover. From wave 5,
  toxic water pools appear and cut off escape routes, which leaves less room to
  retreat as the dome closes in.


  You place walls to funnel enemies into narrow paths. Building combos unlocks
  rare upgrades. Quake-style flag capture objectives sit alongside the survival
  waves, so you have a goal to chase beyond staying alive.


  Up to three fighters can team up in co-op. The title screen sets the game in
  2089 and shows an armored, red-eyed warrior standing before a crowd of small,
  colorful monsters. The creator combined the shrinking circle of battle royale
  games, wall building from Fortnite, Roblox and Minecraft, and capture-the-flag
  from Quake.
