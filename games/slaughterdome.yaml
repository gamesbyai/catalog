slug: slaughterdome
title: SlaughterDome
tagline: Survive enemy waves in a shrinking dome, building walls and capturing flags.
description: >-
  SlaughterDome is an arena survival game set inside a dome that keeps closing
  in. Players fight waves of enemies while the safe area contracts, pushing
  everyone toward the center. Co-op play is possible, so a run can be solo or
  shared with others.


  The game mixes three ideas: a battle royale style shrinking circle, quick wall
  building for cover and defense, and flag capture objectives in the spirit of
  classic arena shooters. Walls can be placed on the fly to block enemies, while
  flags give the fighting a goal beyond staying alive. It runs in the browser
  and supports mobile play.


  It was built for Vibe Jam 2026, where it placed 183rd out of 945 entries. The
  creator states it was made with Claude Code and rendered with Three.js.
