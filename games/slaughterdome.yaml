slug: slaughterdome
title: SlaughterDome
tagline: Survive enemy waves in a shrinking dome, building walls and capturing flags.
description: >-
  You're a fighter inside an arena dome, holding out against waves of enemies
  while the dome closes in a little more with every wave. Trees block both your
  movement and bullets, so they work as cover. The room you have to fight in
  keeps getting smaller.


  You aren't stuck with the arena as it comes, though, because you can build
  walls wherever you like.


  The idea is to funnel enemies down the paths you want, much like building in
  Fortnite or Minecraft. Chain together combos and you unlock rare upgrades.


  From wave 5, pools of toxic water show up and cut off routes you might have
  been counting on to escape. There are Quake-style capture-the-flag objectives
  as well, so you're not only waiting out the shrinking circle. That's a lot of
  borrowed ideas in one arena.


  The title art sets a grim armored warrior against a crowd of cartoon monsters,
  including bees, bats and a rabbit, which is a funny mix for a game set in
  2089.


  Up to three fighters can team up, so you can play co-op or go in alone.
