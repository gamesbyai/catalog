slug: slaughterdome
title: SlaughterDome
tagline: Survive enemy waves in a shrinking dome, building walls and capturing flags.
description: >-
  SlaughterDome is arena survival inside a dome that keeps closing in. You fight
  waves of enemies while the safe area contracts, pushing everyone toward the
  center, and a run can be played solo or shared with others in co-op.


  Three ideas share the arena. The shrinking circle comes from battle royales.
  Walls go up on the fly for cover and to block enemies, and flag captures in
  the spirit of classic arena shooters give the fighting a goal beyond staying
  alive. The creator states it was made with Claude Code on Three.js, and it
  came 183rd of 945 in Vibe Jam 2026.


  So each wave asks two things at once: where to put up walls, and when to push
  for a flag while the dome keeps shrinking around you.
