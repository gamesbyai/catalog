slug: beat-world-2-0
title: Beat World 2.0
tagline: Make beats in pixel-art cities, win critic reviews, and collect each
  city's soundsystem.
description: >-
  Beat World 2.0 has you produce beats in cities around the world. Each city has
  hometown critics who review what you make, and earning their approval wins you
  that city's iconic soundsystem rig.


  The rigs come from local music cultures: the boombox of the Bronx, the picó of
  Puerto Rico and the sonidero of Mexico City. The goal is to collect rigs city
  by city. The beats are real ones, made with an arcade-style approach rather
  than a full production program.


  You pick a producer style with the arrow buttons, starting with Boombap,
  choose M or F, type a producer name, and can optionally enter a home city. The
  creator, an architect-turned-DJ from Bogotá, aimed it at beginners and kids,
  drawing on DOS games like Commander Keen.
