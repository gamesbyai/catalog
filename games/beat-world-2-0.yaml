slug: beat-world-2-0
title: Beat World 2.0
tagline: Make beats in pixel-art cities, win critic reviews, and collect each
  city's soundsystem.
description: >-
  In Beat World 2.0 you travel from city to city making beats and trying to win
  over the critics. Each city has its own hometown critics who review what you
  make, and a good review earns that city's iconic soundsystem rig, which joins
  your growing collection.


  It is a pixel-art beatmaking RPG, and the stops are cultural ones: the boombox
  in the Bronx, the picó in Puerto Rico, the sonidero in Mexico City. The
  creator, an architect-turned-DJ from Bogotá, built it with Claude Code for
  phones and desktops alike, and the art nods to classic PC DOS games like
  Commander Keen.


  The beatmaking leans toward arcade play, so beginners and kids can make real
  beats easily while they learn where each of those sounds comes from.
