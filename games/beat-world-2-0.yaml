slug: beat-world-2-0
title: Beat World 2.0
tagline: Make beats in pixel-art cities, win critic reviews, and collect each
  city's soundsystem.
description: >-
  Beat World 2.0 is a pixel-art beatmaking RPG in which the player travels
  between cities and produces beats. Each city has hometown critics who review
  the result, and a good review earns the local iconic soundsystem rig, which
  the player adds to a growing collection.


  The game is built around cultural stops such as the boombox in the Bronx, the
  picó in Puerto Rico and the sonidero in Mexico City. Its design leans toward
  arcade play rather than a full production suite, so beginners and kids can
  make real beats without much friction while learning where these sounds come
  from. The visual style nods to classic PC DOS games like Commander Keen.


  The creator is an architect-turned-DJ from Bogotá and built the game with
  Claude Code. It was submitted to Vibe Jam 2026 and runs in the browser on
  Three.js, with mobile support.
