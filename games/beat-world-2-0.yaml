slug: beat-world-2-0
title: Beat World 2.0
tagline: Make beats in pixel-art cities, win critic reviews, and collect each
  city's soundsystem.
description: >-
  Produce beats in cities around the world and win over each city's hometown
  critics.


  Real beats, made the arcade way rather than with a full production program.
  Iconic soundsystem rigs to collect, like the Bronx boombox, the picó of Puerto
  Rico and the sonidero of Mexico City. Producer styles, starting with Boombap.


  Pick a style, type a producer name and, if you like, a home city.


  The creator, an architect-turned-DJ from Bogotá, aimed it at beginners and
  kids, drawing on DOS games like Commander Keen.
