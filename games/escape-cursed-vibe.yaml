slug: escape-cursed-vibe
title: Escape cursed vibe
tagline: Race friends through five deadly themed stages and dodge hazards to
  escape first
description: >-
  Escape Cursed Vibe is a 3D dodge map for up to four players. Cursed friends
  run through five deadly stages, each with its own theme, and try to get out
  alive. Each round is a race: dodge what the stage throws at you, keep moving,
  and reach the exit before the others.


  The format is inspired by Warcraft 3 custom maps, the community-made dodge and
  survival courses that groups of friends play together. Here that idea runs in
  the browser as a short, competitive multiplayer session, with action and
  platforming mixed together. Every stage changes the look and the dangers, so
  the course stays varied from start to finish.


  The game was a Vibe Jam 2026 entry, placing 612th out of 945 submissions. The
  creator built it in Three.js and used Claude Code for the development work.
