slug: escape-cursed-vibe
title: Escape cursed vibe
tagline: Race friends through five deadly themed stages and dodge hazards to
  escape first
description: >-
  You race along a cursed 3D path with up to three other players in the same
  lobby. Traps kill you, and stepping off an edge drops you into the void.


  Five deadly themed stages named Star Gauntlet, Playtime Is Over, The Chaos
  Divide, Polar Escape and Infernal Arena. A goal of clearing every stage and
  being the one who escapes. Starting stage picked by the host, not always the
  first stage. Late joins right up until the run begins.


  Move with WASD or the arrow keys. Press Space to jump. Move the mouse to look
  around.


  Speazed calls it a dodge map with cursed friends racing, where only a swift
  escape matters. They say it's based on a Warcraft 3 custom map.
