slug: escape-cursed-vibe
title: Escape cursed vibe
tagline: Race friends through five deadly themed stages and dodge hazards to
  escape first
description: >-
  You run a cursed path in 3D alongside up to three other players in one lobby.
  Traps kill you, and the edges of the path drop you into the void. The goal is
  to complete all five stages and be the one who escapes.


  In the lobby you type a name of up to 16 characters, which other players can
  see. The host picks the starting stage, and more players can still drop in
  before the run starts. The stages are Star Gauntlet, Playtime Is Over, The
  Chaos Divide, Polar Escape and Infernal Arena.


  You move and jump with the keyboard and look around with the mouse. The
  creator describes it as a dodge map where cursed friends race and only the
  swift escape, and says it is based on a Warcraft 3 custom map.
