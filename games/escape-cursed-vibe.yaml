slug: escape-cursed-vibe
title: Escape cursed vibe
tagline: Race friends through five deadly themed stages and dodge hazards to
  escape first
description: >-
  You're one of up to four cursed friends running a 3D course where traps kill
  you and the edges drop you into the void. Everyone races through the same
  stages, and only the swift make it out.


  There are five themed stages: Star Gauntlet, Playtime Is Over, The Chaos
  Divide, Polar Escape and Infernal Arena. Clear all five and you're the one who
  escapes.


  A lobby comes first, with four player slots and you in the first one as host.
  You type a name of up to 16 characters, which other players can see, and since
  more people can still drop in, you can also just start without waiting for
  them.


  As host, you also pick which of the five stages the run begins on.


  The idea comes from a Warcraft 3 custom map, and this version rebuilds it as a
  3D browser game.


  You move, jump and look around with the keyboard and the mouse.
