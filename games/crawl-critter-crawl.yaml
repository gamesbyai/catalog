slug: crawl-critter-crawl
title: Crawl, Critter, Crawl!
tagline: Steer a tentacled critter through a micro cosmos, grabbing matter to
  stay alive.
description: >-
  Crawl, Critter, Crawl! is a short survival game set in a microscopic alien
  cosmos. You control a critter with four springy tentacles and move it around
  to collect vital matter that keeps its lifespan ticking. A run is brief and
  fast, and it ends when the critter's time runs out.


  Not everything floating around helps you. Some matter adds five or ten seconds
  to your lifespan, some paralyzes the critter for three seconds, and some
  subtracts ten seconds or ends the run instantly, so each grab is a risk. A
  two-critter mode turns the game into player-versus-player, played on a
  controller, a keyboard, or a mix of both. The retro look and tentacle theme
  fit the jam's Alien prompt.


  The creator, addSoul, handled the concept, design, and visuals, with the
  artwork made in Adobe Illustrator. Programming was done in collaboration with
  Google Gemini Pro, which also produced the music, and the sound effects came
  from Adobe Firefly. It was made for AI Browser Game Jam #2.
