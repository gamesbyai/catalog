slug: heroes-of-combat-and-magic
title: Heroes of Combat and Magic
tagline: Command factions in turn-based isometric battles against other players online.
description: >-
  The game opens on a battle setup screen over a painted wheat-field backdrop. A
  faction carousel across the top starts on Knights, shown as an armored
  crossbow-wielding hero. A second carousel on the right picks the battleground,
  set to a map called City IV.


  A toggle switches between VS AI and PvP. The settings panel offers Easy,
  Medium and Hard difficulty and an army points budget, set to 1,000 points. It
  also shows your faction and the opposing AI faction, which starts on Random.
  Start Battle begins the fight, and an Advanced Settings button opens more
  options.


  Battles are turn-based and isometric, with several factions to choose from.
  PvP matches run in real time against other players online. The creator, a solo
  developer, modeled it on Heroes of Might and Magic 3 and built it to run
  entirely in the browser.
