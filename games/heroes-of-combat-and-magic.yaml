slug: heroes-of-combat-and-magic
title: Heroes of Combat and Magic
tagline: Command factions in turn-based isometric battles against other players online.
description: >-
  Heroes of Combat and Magic is a turn-based strategy game played on an
  isometric battlefield. Players pick from multiple factions and take turns
  moving and commanding their units against an opponent, with real-time
  multiplayer so matches can be played against other people in the browser.


  The game is a tribute to Heroes of Might and Magic 3, and it borrows that
  series' style of tactical, unit-based combat and faction variety. It was made
  by a single developer and runs entirely in the browser, so there is nothing to
  install before starting a match.


  The creator built it with Claude Code. It was submitted to Vibe Jam 2026,
  where it placed 405th out of 945 entries, and it stands as a solo project from
  start to finish.
