title: Heroes of Combat and Magic
tagline: Command factions in turn-based isometric battles against other players online.
description: >-
  Lead the faction you pick in turn-based battles against the AI or in real-time
  matches against other players.


  Several factions to choose from. An AI-controlled opposing faction. Easy,
  Medium and Hard AI difficulty levels. Armies built from a points budget, set
  to 1,000 points.


  Choose VS AI or PvP, then press Start Battle to begin the fight.


  kingofheroesCM, a solo developer, modeled it on Heroes of Might and Magic 3.
