slug: heroes-of-combat-and-magic
title: Heroes of Combat and Magic
tagline: Command factions in turn-based isometric battles against other players online.
description: >-
  Heroes of Combat and Magic is a turn-based strategy game made as a tribute to
  Heroes of Might and Magic 3. You pick one of several factions and take turns
  moving and commanding your units across an isometric battlefield, against
  another player online.


  The tribute shows in the tactical, unit-based combat and the variety of
  factions, both borrowed from the older series, and in the turn-based rhythm of
  every battle. Matches are live against other people in real time, and because
  the game runs entirely in the browser, you can start one right from the page.


  It is a solo project: one developer made it from start to finish, using Claude
  Code according to the creator. The Vibe Jam 2026 ranking put it at 405th of
  945 entries.
