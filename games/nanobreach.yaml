slug: nanobreach
title: NanoBreach
tagline: Plan and execute tactical hacks in a 3D roguelike where action unfolds
  as you move.
description: >-
  NanoBreach is a 3D action-strategy roguelike that blends the hacking theme of
  an older roguelike with tactical, squad-style planning. The creator describes
  it as a mix of Superhot, Commandos, and a hack-style roguelike, so each run
  asks the player to think through positioning and timing before committing to
  moves.


  The game is presented as a next-generation take on a classic roguelike the
  creator admires. It is not a straight 3D port; the creator says many things
  were changed, and the original serves as inspiration rather than a blueprint.
  That mix of stealth-tactics influence and roguelike structure gives it a
  distinct flavor among jam entries.


  It was built for Vibe Jam 2026 with Three.js, and the creator built it with
  Claude Code. It placed 570th out of 945 entries in the jam.
