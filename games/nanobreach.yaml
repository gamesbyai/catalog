slug: nanobreach
title: NanoBreach
tagline: Plan and execute tactical hacks in a 3D roguelike where action unfolds
  as you move.
description: >-
  In NanoBreach, a 3D roguelike that blends action and strategy, you plan out
  tactical hacks while the action unfolds as you move.


  Josepho calls it a mix of Superhot, Commandos and a hack-style roguelike, and
  you can spot each piece. The hacking theme comes from that older roguelike,
  while the careful, squad-style planning comes from Commandos, so positioning
  and timing get thought through before you commit to a move.


  It opens with a tutorial where you follow a mentor around a plain gray floor
  as a little green capsule. The mentor's first line admits you've got a
  reputation and aren't a rookie, then makes you practice anyway.


  Your starting kit is slim, with two hit points, room for five hacks and a
  mode that begins on stealth.


  You move with WASD and fire with J. R is your hack key. Space moves the
  mentor's dialogue along, and a counter at the top keeps track of where you are
  in the tutorial's steps.


  Josepho is a fan of an old roguelike and set out to build a next-gen version
  of it. They say it isn't a 3D port and that a lot was changed, with the
  original working as inspiration rather than a blueprint.
