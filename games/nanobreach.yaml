slug: nanobreach
title: NanoBreach
tagline: Plan and execute tactical hacks in a 3D roguelike where action unfolds
  as you move.
description: >-
  You plan tactical hacks in NanoBreach, a 3D roguelike where the action unfolds
  as you move. The creator describes it as a mix of Superhot, Commandos and a
  hack-style roguelike, so a run asks you to think through positioning and
  timing before you commit to a move.


  It is presented as a next-generation take on a classic roguelike the creator
  admires. They say many things were changed, and the original serves as
  inspiration rather than a blueprint. Claude Code and Three.js are behind it,
  and it ranked 570th of 945 at Vibe Jam 2026.


  The hacking theme comes from that older roguelike, and the tactical,
  squad-style planning comes from the Commandos side, so moves are planned first
  and executed second. It is a single-player game that mixes action, strategy
  and roguelike runs.
