slug: nanobreach
title: NanoBreach
tagline: Plan and execute tactical hacks in a 3D roguelike where action unfolds
  as you move.
description: >-
  You start in stealth mode, with a tutorial where a mentor talks you through
  the basics.


  The mentor's first line tells you you've got a reputation and you're no
  rookie, but a little practice never hurts. You press Space to move through the
  dialogue, and the tutorial runs 25 steps, so it's a proper walkthrough instead
  of a single tooltip.


  Your hacker is a green capsule on a plain gray floor. The corner panel tracks
  your health, which starts at 2, and a hack counter that goes up to 5.


  There's also a shot indicator that shows when you're ready to fire.


  Moving, shooting and hacking each get their own key, so you can use all three
  without a menu. A debug view is on Tab too, which is a handy thing to leave in
  a jam build.


  The creator describes it as a mix of Superhot, Commandos and a hacking
  roguelike. It's inspired by an old roguelike they're a fan of, but it isn't a
  3D port, and plenty of things were changed.
