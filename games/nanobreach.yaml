slug: nanobreach
title: NanoBreach
tagline: Plan and execute tactical hacks in a 3D roguelike where action unfolds
  as you move.
description: >-
  Plan tactical hacks while the action unfolds as you move in NanoBreach, a 3D
  roguelike blending action and strategy.


  A mentor who walks you through the basics. Positioning and timing, weighed
  before you commit to a move. Hacking from an older roguelike, with careful
  squad-style planning from Commandos.


  Move with WASD and fire with J. Press R to hack and Space to advance the
  mentor's dialogue.


  Josepho calls it a mix of Superhot, Commandos and a hack-style roguelike. A
  fan of an old roguelike, they set out to build a next-gen version. They say it
  isn't a 3D port, that a lot has changed, and that the original works as
  inspiration rather than a blueprint.
