slug: vesper-the-last-light
title: "Vesper: The Last Light"
tagline: Carry a drowned world's last light through a flooded voxel gate.
description: >-
  Vesper: The Last Light is a single-player exploration game set in a drowned
  voxel world. Its first chapter, The Flooded Gate, opens on rain-slick stone
  walkways lit by lanterns and terraced islands with pink blossom trees. A
  towering gate marked with three glowing symbols stands under a ringed planet
  and a pale moon, and the title card sets the task: carry the world's last
  light beyond it.


  It is an adventure with puzzles and a casual pace. The creator set out to
  build a place you can explore, make sense of and finish, rather than a view
  that only looks good.


  According to the creator, AI wrote all of the code. The game was built with
  GPT-6 Astra in Codex over rounds of building, playtesting and fixing, and it
  mixes procedural assets with licensed resources. It runs in the browser.
