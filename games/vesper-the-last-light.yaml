slug: vesper-the-last-light
title: "Vesper: The Last Light"
tagline: Carry a drowned world's last light through a flooded voxel gate.
description: "Carry a lantern through a drowned voxel world. Its light is your
  health, your ammunition and your money, so every beam you fire spends what
  keeps you alive.


  The Flooded Gate in the Nacre Expanse as the first expedition. Three seals to
  restore before a glowing portal opens. A route past a grove, a lighthouse and
  a temple. Jumps across gaps, a light beam and a melee strike.


  Play with mouse and keyboard.


  Its maker shaped it through playtesting and iteration, with GPT-6 Astra in
  Codex, aiming for a world you can explore, understand and finish."
