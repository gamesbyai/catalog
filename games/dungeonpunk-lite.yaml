slug: dungeonpunk-lite
title: Dungeonpunk LITE
tagline: Grind levels in a multiplayer online dungeon world with no level cap.
description: >-
  Take on an RPG adventure and fight to gain levels, with no ceiling on how far
  your character can climb. Only your character's own death ends the climb. It
  runs in 3D in the browser, on both desktop and mobile.


  Other players sharing one online world. A choice of how much risk to accept.
  Pushing deeper into the world, alongside the leveling.


  Directly inspired by Dungeonpunk Online. It is a lightweight take on the
  classic online RPGs the creator grew up with.
