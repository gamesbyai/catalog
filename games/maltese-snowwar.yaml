slug: maltese-snowwar
title: maltese snowwar
tagline: Fight snowball battles in a Maltese-themed remake of a classic Flash game
description: >-
  Three Maltese take on a team of golden retrievers in a snowball fight. You
  steer one Maltese at a time, and you can switch the dogs to an alternate Chibi
  Pups cast. The game is offered in five languages.


  Retrievers, stunned by one hit and buried by a second. Snow forts that catch
  balls, and snow piles where a dog can't be hit. Mid-match big snowballs that
  give your team three big throws within ten seconds. Slower big balls that
  shrink when a small ball hits them and shatter against each other. Solo
  matches against Easy or Hard AI. Two-device matches with a friend. Teammates
  you don't steer, set to Manual, Defend or Attack.


  Press and drag a Maltese to move it. Release to throw at the nearest opponent.
  Tap for a short toss. Hold longer for a long throw. If nobody's in a clear
  shot, releasing throws nothing. After each shot, let your dog pack snow before
  throwing again. Step out to a pile's rim before throwing. Walk onto or tap the
  big snowball to grab it. The round ends once you've cleared every retriever.
  Share the six-letter or QR code.


  This is an unofficial fan tribute to SnowCraft, the 1998 Flash game. It is not
  affiliated with the original authors.
