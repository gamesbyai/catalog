slug: maltese-snowwar
title: maltese snowwar
tagline: Fight snowball battles in a Maltese-themed remake of a classic Flash game
description: >-
  You press on one of your three Maltese and drag to move it, then let go to
  throw a snowball at the golden retrievers across the field. A quick tap gives
  you a short toss, while holding longer charges a long throw.


  Once a dog throws, it has to pack more snow before it can throw again, so
  you're always weighing when to shoot and when to sidestep. While you hold, a
  dashed line points at the nearest opponent you can actually hit.


  One snowball stuns a dog and a second one buries it. Snow piles work as forts,
  and a ball passing through one gets eaten. You can hide inside a pile and
  nobody can hit you, but you can't throw from in there either, so you step out
  to the rim to fire.


  Bury or clear all the retrievers and you win, then you can fight again or go
  back to the title.


  Every so often a gold-rimmed big snowball shows up. Walk onto it or tap it and
  your team gets three powered throws within ten seconds, with a bar and dots
  showing the time and shots left. Big balls fly slower, a small ball shrinks a
  big one, and two big ones shatter each other.


  Playing against the computer, you can set the retrievers to Easy or Hard, and
  you can give the two dogs you aren't dragging orders to defend or attack. Hard
  retrievers dodge farther and can cross midfield.


  You can also play a friend by opening the same address on two devices and
  sharing a six-letter code or QR. The host plays the Maltese and the guest
  plays the retrievers, which is a neat setup because there's no game server
  involved, just the two browsers talking directly.


  Tapping the two round dog heads on the title card swaps the Maltese for a
  Chibi Pups cast. The menu comes in English, Traditional and Simplified
  Chinese, Japanese and Korean.


  Gary.TC made it as an unofficial fan tribute to the 1998 Flash game SnowCraft.
