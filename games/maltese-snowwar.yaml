slug: maltese-snowwar
title: maltese snowwar
tagline: Fight snowball battles in a Maltese-themed remake of a classic Flash game
description: >-
  Press and drag one of your three Maltese to move it, then release to throw a
  snowball at the nearest opponent a dashed line points to. A quick tap gives a
  short toss, and holding longer charges a long throw. After each shot the dog
  has to pack snow before throwing again.


  The opponents are golden retrievers. One hit stuns a dog and a second hit
  buries it, so the round ends when you have cleared every retriever. Snow forts
  block balls that pass through them. A dog can hide inside a pile and can't be
  hit there, but it can't throw until it steps out to the rim. If no opponent is
  in a clear shot, there is no aim line and releasing throws nothing.


  A gold-rimmed big snowball appears during a match. Walk onto it or tap it and
  your team gets three big throws within ten seconds. Big balls fly slower,
  shrink when a small ball hits them, and shatter against another big one.


  You can play against AI on Easy or Hard, or against a friend on a second
  device using a six-letter code or QR. Unselected teammates can be set to
  Manual, Defend or Attack. The interface supports five languages, and M mutes
  sound. The game is a fan tribute to the 1998 Flash game SnowCraft, with an
  optional alternate Chibi Pups cast you can switch to from the title screen.
