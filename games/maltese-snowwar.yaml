slug: maltese-snowwar
title: maltese snowwar
tagline: Fight snowball battles in a Maltese-themed remake of a classic Flash game
description: >-
  Every snowball here starts with letting go, because you press and drag one of
  your three Maltese to move it, then release to fling a snowball at the nearest
  opponent a dashed line points to.


  A quick tap gives you a short toss, while holding longer charges up a long
  throw. If nobody's in a clear shot, though, the line won't appear and letting
  go throws nothing at all.


  Your opponents are a team of golden retrievers. One hit stuns a dog and a
  second one buries it, so the round ends once you've cleared every retriever.
  After each shot your dog also has to stop and pack more snow before it can
  throw again.


  Snow forts block the balls that pass through them. A dog can even hide inside
  a pile where it can't be hit, though it has to step out to the rim before it
  can throw.


  A gold-rimmed big snowball turns up during a match, and you grab it by walking
  onto it or tapping it. That gives your team three big throws within ten
  seconds. Big balls fly slower, shrink when a small ball hits them and shatter
  against another big one, a neat bit of snowball physics for such a short-lived
  pickup.


  You can fight the AI on Easy or Hard, or play a friend on a second device by
  sharing a six-letter code or a QR code.


  Teammates you aren't steering can be set to Manual, Defend or Attack. The game
  speaks five languages, and pressing M mutes the sound.


  The game is a fan tribute to the 1998 Flash game SnowCraft. There's also an
  alternate Chibi Pups cast you can switch to from the title screen.
