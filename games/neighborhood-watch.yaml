slug: neighborhood-watch
title: Neighborhood Watch
tagline: Fly a rebel drone, blow up surveillance towers, and free the compound
  before time is up.
description: >-
  Neighborhood Watch puts you at the controls of a rebel drone flying over a
  neighborhood under heavy surveillance. Your job is to destroy the surveillance
  towers scattered around the compound while fighting off enemy drones. Each run
  is a race against a countdown, and you win by liberating the area before it
  expires.


  The game mixes shooting with light strategy and simulation elements, so you
  have to decide which threats to handle first while keeping your drone alive.
  The setting is a dystopian take on a surveillance state, which the creator
  built to reflect where they feel the current state of the world is heading. It
  is built in 3D and runs on mobile devices as well.


  The creator says they enjoy vibe coding with Claude Code and made this game
  with it. It was entered in Vibe Jam 2026, where it placed 492nd out of 945
  entries.
