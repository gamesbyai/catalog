slug: kanso
title: Kanso
tagline: Grow and tend digital bonsai trees in calm, pretty scenes.
description: >-
  Kanso is a cozy bonsai-growing game about finding calm. The player cultivates
  living digital bonsai trees inside softly lit scenes, shaping them at an
  unhurried pace. Take your time; a session is about tending a tree and settling
  into the quiet mood of the space.


  The game places its emphasis on atmosphere and relaxation over challenge,
  mixing light puzzle and simulation elements with a casual approach. It placed
  ninth out of 945 entries in Vibe Jam 2026 and received the Most Zen award. It
  also runs on mobile devices as well as desktop browsers.


  The creator built it in about a week during the jam's time crunch, using
  Codex, with the aim of making something that brings people joy. It is rendered
  in Three.js.
