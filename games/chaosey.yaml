slug: chaosey
title: Chaosey
tagline: Team up with friends in chaotic co-op, each player using their own key
description: >-
  In Chaosey, each player gets one key, and nobody controls the whole team. It
  is an online co-op adventure for two to four players, on phones or desktops,
  and the group only moves forward when everyone presses their key, so a single
  missed press holds everyone up.


  The creator says the idea came from wanting something to play together when
  hanging out with friends, and it is built for exactly that kind of session. It
  was made with Codex in the Phaser engine, and its Vibe Jam 2026 placing was
  462nd of the 945 entries.


  The one-key setup makes the game about communication and timing more than
  individual skill. Progress depends on the players coordinating as a team, and
  the chaos comes from the moments they don't.
