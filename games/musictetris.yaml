slug: musictetris
title: MusicTetris
tagline: Stack falling blocks while the scenery and music shift over time.
description: >-
  The music and background change as the game goes on and as time passes. In
  this Tetris-style puzzle, you fill complete rows with falling pieces.


  A tall well as the playing area. Ghost preview of where the piece will land.


  Press left and right arrows to slide the piece. Press up to rotate it. Press
  down to move it lower faster. Press space to slam it straight to the bottom.


  anshuldhawan001 built it to play with Tone.js audio and 3D graphics, layered
  over a simple core mechanic.
