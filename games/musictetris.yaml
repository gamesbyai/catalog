slug: musictetris
title: MusicTetris
tagline: Stack falling blocks while the scenery and music shift over time.
description: >-
  Falling blocks drop into a tall, cyan-framed well, and you slide, rotate and
  drop them to complete rows. The first piece is a straight bar of four cyan
  blocks, and a faint outline at the bottom of the well marks where it will
  land.


  A panel in the corner tracks score, high score, cleared lines and BPM, which
  starts at 100. The background scene and the music change as the game goes on
  and as time passes. Faceted purple crystals sit on either side of the well,
  surrounded by drifting particles.


  Left and right arrows move the piece, up rotates it, down soft drops it, and
  space hard drops it. P pauses and M mutes, and an on-screen button switches
  the music on or off. The creator wanted a playground for Tone.js audio and 3D
  graphics on top of a simple mechanic.
