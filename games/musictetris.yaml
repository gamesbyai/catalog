slug: musictetris
title: MusicTetris
tagline: Stack falling blocks while the scenery and music shift over time.
description: >-
  It's classic falling-block Tetris in a tall, teal-framed well, but the scene
  and the music are meant to shift as the game goes on and time passes. A BPM
  counter sits in the corner beside your score, and it starts at 100.


  You stack the pieces as they fall and clear lines, same as ever, so there's
  nothing new to learn.


  Left and right arrows slide a piece, up rotates it, and down drops it slowly.
  Space slams it straight to the bottom, and a faint outline along the floor of
  the well shows where it's headed.


  Two purple crystal shapes hover on either side of the well, shimmering with
  glowing particles, and the dark backdrop behind them looks different from one
  moment to the next. The panel up top keeps your score, your high score and
  your lines cleared, which is handy. There's also a music button, plus P to
  pause and M to mute.


  The creator wanted a playground for Tone JS and 3D graphics, so they kept the
  puzzle itself simple and familiar.
