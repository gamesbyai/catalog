slug: shell-breaker
title: Shell breaker
tagline: Bounce a ball off a paddle to smash data nodes across eight cyberpunk levels
description: >-
  Bounce the ghost off your paddle, called the deck, and break every data node
  on the board. It's an arcade brick-breaker in the style of Breakout and
  Arkanoid.


  8 levels, each harder than the last. Reinforced nodes that take two hits.
  Explosive nodes that set off chain reactions through their neighbors.
  Power-ups for multiball, a wider paddle and a slower ball. Combos built from
  hits landed in a row, plus a score kept next to a high score. Impact
  particles, screen shake and trails behind the ball. Sound effects synthesized
  inside the game.


  Move the deck with the arrow keys, A and D, or the mouse. Press Space or click
  to launch the ghost, and to start or restart a game. Press P to pause and M to
  switch the sound on or off.


  gunz101 points to the 1995 Ghost in the Shell film as the inspiration for the
  look. gunz101 made the game, and according to the creator, AI gave some help
  on the code.
