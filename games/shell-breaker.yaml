slug: shell-breaker
title: Shell breaker
tagline: Bounce a ball off a paddle to smash data nodes across eight cyberpunk levels
description: >-
  Slide your paddle left and right with the arrow keys, A and D, or the mouse,
  then press Space or click to launch the ball. It's a brick breaker in the
  Breakout and Arkanoid mold, and the paddle is called a deck while the ball is
  called a ghost.


  Your job is to wipe out every data node across eight stages. The rows of
  blocks in the first stage are teal, green and amber, and they sit over falling
  green code and a rainy neon skyline.


  The look comes from the 1995 Ghost in the Shell film, so you get a
  phosphor-green and amber palette with CRT scanlines on top. Particles, screen
  shake and ball trails sit on top of that, and the sound effects are
  synthesized.


  Not every node goes down in one hit. Reinforced ones need two hits, and
  explosive ones set off a chain reaction, which makes them handy for clearing a
  clump in one go.


  Power-ups come in three kinds: multi-ball, a bigger paddle and a slower ball.


  A combo system feeds the score, and the game keeps a high score for you to
  chase. The eight stages get harder as you go.


  Press P to pause and M to turn the sound on or off. From the menu, H opens the
  how-to-play screen, and Space or a click restarts after a run ends.
