slug: shell-breaker
title: Shell breaker
tagline: Bounce a ball off a paddle to smash data nodes across eight cyberpunk levels
description: >-
  The screen shows a neon, rain-soaked city under green digital rain, with CRT
  scanlines and a green-and-amber palette. You slide a paddle, called the deck,
  along the bottom and launch a ball, called the ghost, into a field of data
  nodes.


  The goal is to destroy every node across 8 levels, each harder than the last.
  Some nodes are reinforced and take two hits. Others are explosive and set off
  chain reactions in the nodes around them.


  Power-ups add extra balls, widen the paddle or slow the ball. Chaining hits
  builds a combo, and the game tracks your score and a high score. Impacts bring
  particles, screen shake and ball trails, with sound effects synthesized in the
  game.


  The creator describes the look as inspired by the 1995 Ghost in the Shell
  film, and lists the AI disclosure as AI assisted, covering code.
