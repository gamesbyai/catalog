slug: protect-the-sheep
title: Protect the Sheep
tagline: Build towers to hold off thirty-five waves of enemies and keep one sheep alive.
description: >-
  Spend your gold on towers and stop the monsters before they reach the sheep
  sitting in its little fenced pen.


  You've got 100 gold to start with, and the first tower in the bar along the
  bottom is the Archer at 25. Six tower archetypes are in the game, plenty of
  options for guarding a single sheep. Each wave starts when a countdown runs
  out, but you can press Start wave if you'd rather call it in early.


  The sheep has 100 HP, tracked in the top left corner, and your job is to keep
  it alive through a whole thirty-five waves. The cheerful tutorial greets you
  with the news that the monsters want mutton, which is a grim thing to hear
  while you're saying hi to your sheep.


  That short tutorial covers the sheep and the basics the first time the game
  loads.


  An Upgrades menu sits right next to your gold counter. Plus and minus buttons
  let you speed the game up or slow it back down. Music and sound effects even
  get their own separate volume sliders, more audio control than you'd expect
  for a game about one sheep.


  Play Solo is only one of the options on the main menu, because there's also
  Play vs AI, Host Game and Join Game. Those last two let you take on another
  player online.


  henrikvberglund based it on the old Warcraft III tower defense maps they loved
  as a kid.
