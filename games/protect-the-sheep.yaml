slug: protect-the-sheep
title: Protect the Sheep
tagline: Build towers to hold off thirty-five waves of enemies and keep one sheep alive.
description: >-
  Spend gold on towers to stop monsters before they reach your sheep. You start
  with 100 gold, and the sheep has 100 HP. Your job is to keep it alive through
  thirty-five waves, each one starting when its countdown runs out.


  Six kinds of tower to build, including the 25-gold Archer. Solo play and a
  versus AI mode. Hosting or joining an online game against another player. A
  cheerful opening tutorial on the sheep, the basics and mutton-hungry monsters,
  shown the first time the game loads.


  Press Start wave to call the next wave early. Use the plus and minus buttons
  to speed the game up or slow it back down.


  henrikvberglund drew on the old Warcraft III tower defense maps they loved as
  a kid.
