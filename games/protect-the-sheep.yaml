slug: protect-the-sheep
title: Protect the Sheep
tagline: Build towers to hold off thirty-five waves of enemies and keep one sheep alive.
description: >-
  Build towers with gold to stop monsters before they reach the sheep in its
  fenced pen. You start with 100 gold, and the first tower in the bottom bar is
  the Archer at 25 gold. A countdown launches each wave, or you can press Start
  wave to call it early.


  The sheep has 100 HP, shown at the top left, and the goal is to keep it alive
  through all thirty-five waves. There are six tower archetypes. An Upgrades
  menu sits beside the gold counter, and plus and minus buttons change the game
  speed. Music and sound effects each have a volume slider.


  The main menu offers Play Solo, Play vs AI, Host Game and Join Game, so you
  can also play against another player online. A short tutorial introduces the
  sheep and the basics on first load. The creator based it on old Warcraft III
  tower defense maps loved in childhood.
