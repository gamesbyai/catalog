slug: protect-the-sheep
title: Protect the Sheep
tagline: Build towers to hold off thirty-five waves of enemies and keep one sheep alive.
description: >-
  You spend gold on towers to hold off monsters that are heading for one sheep
  in a fenced pen. The sheep has a health bar that starts at 100, and the goal
  is to keep it alive through every wave.


  There are six kinds of towers and thirty-five waves, which is a decent amount
  of ground for a game about a single sheep. You start with 100 gold, and the
  archer, the tower shown first in the build bar, costs 25.


  A countdown ticks toward the next wave, but you can hit Start wave if you'd
  rather not wait. There's also an Upgrades button, and a speed control with
  plus and minus buttons that starts at 1x.


  The creator grew up loving the old Warcraft 3 tower defense maps, and that's
  where the idea came from.


  From the main menu you can play solo or play against an AI. You can also host
  a game or join one, so the sheep doesn't have to be a one-person job.


  A short tutorial introduces the sheep first, and you can skip it. Music and
  sound effects have their own volume sliders in the corner.
