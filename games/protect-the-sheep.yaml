slug: protect-the-sheep
title: Protect the Sheep
tagline: Build towers to hold off thirty-five waves of enemies and keep one sheep alive.
description: >-
  Spend your gold on towers and stop the monsters before they reach the sheep.


  You've got 100 gold to start with, and the Archer tower costs 25. Six tower
  archetypes are in the game, plenty of options for guarding a single sheep.
  Each wave starts when a countdown runs out, but you can press Start wave if
  you'd rather call it in early.


  The sheep has 100 HP, and your job is to keep it alive through thirty-five
  waves. The cheerful tutorial greets you with the news that the monsters want
  mutton.


  That short tutorial covers the sheep and the basics the first time the game
  loads.


  Plus and minus buttons let you speed the game up or slow it back down.


  Play Solo is one of several modes, alongside Play vs AI, Host Game and Join
  Game. Those last two let you take on another player online.


  henrikvberglund based it on the old Warcraft III tower defense maps they loved
  as a kid.
