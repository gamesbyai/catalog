slug: hegemon-s-reach
title: Hegemon's Reach
tagline: Build a colony with production chains, then raise an army to crush a rival.
description: >-
  The aim is an optimized colony and, once your war machine is ready, a win over
  a rival colony that is doing the same. You start at a headquarters on a
  low-poly island with 40 planks, 24 stone, and stocks of hammers, shovels,
  axes, pickaxes and saws, with small figures moving around it.


  Buildings come from a side panel with four tabs: Industry, Food, Civil and
  Military. Industry lists the woodcutter's hut, sawmill, forester's hut,
  stonecutter's hut, coal mine and iron mine, each with a plank and stone cost.
  Woodcutters and stonecutters work inside an area you can retarget with a Move
  Area button. Foresters replant saplings on empty grass.


  Control is indirect. You place buildings and steer their work areas, and the
  colony does the rest. Mines must sit next to a surveyed deposit and mine
  faster when fed bread, meat or fish, with more variety speeding them up
  further.


  Clicking the headquarters opens a storage panel that lists held goods. A
  minimap sits in the top left, and the clock runs at 1x, 2x or 4x. A population
  screen and a debug view each have a button along the bottom. The creator
  describes it as modeled on classic settlers games.
