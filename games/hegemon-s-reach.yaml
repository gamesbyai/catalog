slug: hegemon-s-reach
title: Hegemon's Reach
tagline: Build a colony with production chains, then raise an army to crush a rival.
description: >-
  Defeat a rival colony once your war machine is ready. You build a colony over
  a long game, starting from a headquarters stocked with planks, stone and
  tools. The rival has been working toward the same goal.


  Four building categories, covering industry, food, civil and military.
  Woodcutter's huts, sawmills, forester's huts and stonecutter's huts. Coal and
  iron mines next to surveyed deposits. Sapling replanting by foresters on empty
  grass. A warning when a stonecutter's outcrops run out. Faster mining on
  bread, meat or fish, and faster again with a more varied diet. Industry
  buildings, each priced in planks and stone.


  Place buildings and steer where they work, and the colony takes it from there.
  You don't order individual workers around. Use Move Area to retarget a
  woodcutter's or stonecutter's area. A stonecutter that runs out of outcrops
  sits idle until you move it. Click the headquarters to see everything it
  stores, and set the clock to 1x, 2x or 4x.


  maxgeithe describes it as patterned after the classic Settlers games. They say
  games like this were a childhood love and their way into tech. They also put
  part of it down to peer pressure from fellow developers in their X bubble.
