slug: hegemon-s-reach
title: Hegemon's Reach
tagline: Build a colony with production chains, then raise an army to crush a rival.
description: >-
  Grow a colony, then take it to war: Hegemon's Reach, a single-player strategy
  game, follows the pattern of classic settlers titles. The colony runs on
  production chains in which one workplace supplies the next, and you guide the
  settlement indirectly rather than ordering each worker around.


  Optimizing is the point. Deep chains of goods reward careful planning, and the
  payoff is watching a well-tuned colony hum along. Meanwhile a rival is
  building up the same way, so the late game turns into a race to have the
  stronger army ready first.


  It comes from the creator's childhood affection for the games that first drew
  them to technology. It runs on Three.js in the browser, with Claude Code as
  the creator's AI tool, and it was a Vibe Jam 2026 entry.
