slug: hegemon-s-reach
title: Hegemon's Reach
tagline: Build a colony with production chains, then raise an army to crush a rival.
description: >-
  The long game here is a colony that runs like clockwork, and then, once your
  war machine is ready, a win over a rival colony that's been building toward
  the same thing. You start at a headquarters on a low-poly island with 40
  planks and 24 stone, plus a well-stocked tool shed of 8 hammers, 8 shovels,
  6 pickaxes, 4 axes and 2 saws. Little figures are already wandering around
  it before you've placed a thing.


  Control is indirect, so you don't order individual workers around. You place
  buildings and steer where they work, and the colony takes it from there.


  Everything you can build lives in a side panel split into four tabs for
  industry, food, civil and military.


  The industry tab alone covers the woodcutter's hut, sawmill, forester's hut,
  stonecutter's hut, coal mine and iron mine, each priced in planks and stone.
  Woodcutters and stonecutters work inside an area you can retarget with a Move
  Area button, and it earns its place because a stonecutter that runs out of
  outcrops warns you and sits idle until you move it. Foresters, meanwhile,
  replant saplings on empty grass.


  Mines are a bit pickier than the huts, needing a spot next to a surveyed
  deposit and digging faster on bread, meat or fish, with a more varied diet
  speeding them up even more.


  Clicking the headquarters opens a storage panel listing everything it holds. A
  minimap sits in the top left, and the clock runs at 1x, 2x or 4x. Buttons
  along the bottom open a population screen and, for some reason, a debug view.


  maxgeithe describes it as modeled on classic settlers games. They say games
  like this were a childhood love and their entry into tech. They also put part
  of it down to peer pressure from other developers in their X bubble.
