slug: forge-fate
title: Forge&Fate
tagline: Fight through isometric dungeons, collect loot, and forge gear to chase
  a top score.
description: >-
  The aim is to post the best score on the leaderboard by fighting through an
  isometric dungeon with a character built from loot and forged gear. Combat is
  tactical, enemies scale as you progress, and loot drops along the way.


  The game opens on a character screen for Shadowcaller, who starts with 100
  health and 5 each in strength, agility and dexterity. Drag items from the
  inventory onto the weapon, helmet, armor, shield and boots slots to equip
  them. Armor and damage start at 0.


  A side menu leads to Gathering, Forge, Materials and Leaderboard screens, plus
  a red Enter Dungeon button and a sound toggle. The forging system lets you
  make your own items. Inventory is split across eight bags. The first holds a
  sword, a helmet, chest armor, boots and a purple crystal.


  The creator drew on classic role-playing games, especially the sense of
  exploring and growing a little at a time as you collect items and make your
  own.
