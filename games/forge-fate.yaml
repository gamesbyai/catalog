slug: forge-fate
title: Forge&Fate
tagline: Fight through isometric dungeons, collect loot, and forge gear to chase
  a top score.
description: >-
  You fight through enemy-filled dungeons with tactical combat in Forge&Fate, an
  isometric dungeon crawler. Defeated foes drop loot, and the aim is to survive
  longer than last time and post a higher score on the leaderboard. It is a
  single-player action RPG, played in the browser.


  Enemies scale as you progress, so the dungeon keeps pace with you and your
  gear. The forging system sits at the center of the design: rather than only
  equipping what drops, you can forge your own items, which gives the
  progression a steady sense of growth.


  The creator named a love of role-playing games, exploration and the feeling of
  getting stronger bit by bit as the inspiration, and built it in Phaser with
  Claude Code during Vibe Jam 2026.
