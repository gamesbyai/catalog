slug: forge-fate
title: Forge&Fate
tagline: Fight through isometric dungeons, collect loot, and forge gear to chase
  a top score.
description: >-
  You're playing for the best score on the leaderboard, and you get there by
  fighting through an isometric dungeon, picking up loot, and building a
  stronger hero between trips. The combat is tactical, and the enemies scale up,
  so what you wear and carry matters. A red Enter Dungeon button on the side
  menu sends you in.


  Everything else happens in a menu hub with tabs for Character, Gathering,
  Forge, Materials and Leaderboard. There's also a sound toggle at the bottom,
  which is handy to have right there.


  The forge is there so you can make your own gear instead of only finding it.


  On the Character tab you see your hooded pixel-art hero with stats for health,
  strength, agility, dexterity, armor and damage. Around the portrait are slots
  for helmet, weapon, armor, shield and boots, and you drag items from your
  inventory onto them. A Change Name button lets you rename the hero, and names
  like Shadowcaller and Venomhand show up, which are pretty good ones.


  The inventory is spread over eight bags, which is a lot of room for a
  character who starts with five items.


  Those starting items in the first bag are a sword, a helmet, a chest piece,
  boots and a purple crystal. The creator was inspired by that RPG feeling of
  exploring and growing little by little as you collect items and make your own.
