slug: forge-fate
title: Forge&Fate
tagline: Fight through isometric dungeons, collect loot, and forge gear to chase
  a top score.
description: >-
  The goal is the best score on the leaderboard, and you go after it by fighting
  through an isometric dungeon with a character built from loot and gear you
  forge yourself. Enemies scale up as you progress, while loot keeps dropping
  along the way. The fights are tactical, too.


  Oddly, the welcome line flips the title around to Fate & Forge before it shows
  you a hooded hero called Shadowcaller, who starts with 100 health and 5 points
  each in strength, agility and dexterity. Armor and damage both read 0 at the
  start, with every equipment slot still empty.


  The name isn't set in stone, because there's a Change Name button and the same
  hero can also turn up as Venomhand.


  Gearing up means dragging items from your inventory onto the weapon, helmet,
  armor, shield and boots slots. Eight bags of inventory space is a lot of room
  for someone who starts out carrying five things. The first bag already holds a
  sword, a helmet, chest armor, boots and a purple crystal.


  A side menu leads to Gathering, Materials and a Forge where you make your own
  items, plus the Leaderboard, a red Enter Dungeon button and a sound toggle.


  TheGrampas drew on classic role-playing games for this one. What they were
  after is the feeling of exploring and growing a little at a time as you
  collect items and make your own.
