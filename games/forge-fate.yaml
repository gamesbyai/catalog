slug: forge-fate
title: Forge&Fate
tagline: Fight through isometric dungeons, collect loot, and forge gear to chase
  a top score.
description: >-
  Go after the best score on the leaderboard by fighting through a dungeon as
  Shadowcaller. You build the character from loot and gear you forge yourself.


  Tactical combat. Enemies that scale up as you progress. Loot that keeps
  dropping as you go. Eight bags of inventory space, starting from five carried
  items. Gathering, Materials and a Forge for making your own items.


  Your first bag already holds a sword, a helmet, chest armor, boots and a
  purple crystal. Drag items from your inventory onto the weapon, helmet, armor,
  shield and boots slots.


  TheGrampas drew on classic role-playing games for this one. They were after
  the feeling of exploring and growing bit by bit as you collect items and make
  your own.
