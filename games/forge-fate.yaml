slug: forge-fate
title: Forge&Fate
tagline: Fight through isometric dungeons, collect loot, and forge gear to chase
  a top score.
description: >-
  The goal is the best score on the leaderboard, and you go after it by fighting
  through a dungeon with a character built from loot and gear you forge
  yourself. Enemies scale up as you progress, while loot keeps dropping along
  the way. The fights are tactical, too.


  The hero is called Shadowcaller, and starts with 100 health and 5 points each
  in strength, agility and dexterity.


  You can change the hero's name, and the same hero can also turn up as
  Venomhand.


  You gear up by dragging items from your inventory onto the weapon, helmet,
  armor, shield and boots slots. Eight bags of inventory space is a lot of room
  for someone who starts out carrying five things. The first bag already holds a
  sword, a helmet, chest armor, boots and a purple crystal.


  The game includes Gathering, Materials and a Forge where you make your own
  items.


  TheGrampas drew on classic role-playing games for this one. What they were
  after is the feeling of exploring and growing a little at a time as you
  collect items and make your own.
