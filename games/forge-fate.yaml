slug: forge-fate
title: Forge&Fate
tagline: Fight through isometric dungeons, collect loot, and forge gear to chase
  a top score.
description: >-
  Forge&Fate is an isometric dungeon crawler where you battle through
  enemy-filled dungeons using tactical combat. Defeated foes drop loot, and the
  enemies scale as you progress. Each run is a push to survive longer and earn a
  higher score on the leaderboard.


  A forging system sits at the center of the design. Instead of only equipping
  what drops, you can craft your own items, which gives progression a steady
  sense of growth. The creator cited a love of role-playing games, exploration,
  and the feeling of getting stronger bit by bit as the inspiration.


  The creator built it with Claude Code as an entry in Vibe Jam 2026, and it
  runs on the Phaser engine. It placed 510th out of 945 entries in the jam.
