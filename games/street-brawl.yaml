slug: street-brawl
title: Street Brawl
tagline: Fight through a back alley with friends in a side-scrolling brawler.
description: >-
  Street Brawl is a side-scrolling beat 'em up set in a back alley. Players push
  forward through the street and fight their way past opponents, and friends can
  join in thanks to the multiplayer support. The tone is rough and brutal, in
  the spirit of classic arcade fighters.


  The game draws on the arcade titles its creator played when they were younger,
  and that influence shapes its straightforward, fight-first design. It runs in
  the browser on a 3D engine and was entered in Vibe Jam 2026, where it placed
  626th out of 945 entries.


  The creator built it with Cursor, and the rendering is handled with Three.js,
  which is what lets the brawler run directly in a web page.
