slug: emergency-run
title: Emergency Run
tagline: Escape a series of crisis rooms by spotting the real fix before time runs out.
description: >-
  Each crisis room is a 360-degree space with a problem and a timer. Look
  around, work out what is really wrong and fix it before time runs out.


  Clues anywhere in the full circle around you. Distractions next to the real
  fix. Exploration and puzzle logic in every room. A new problem in the next
  room.


  Observe first, then pick your fix.
