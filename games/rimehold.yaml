slug: rimehold
title: Rimehold
tagline: Maze your towers to hold a frozen mountain pass, Warcraft 3 tower
  defense style.
description: "Rimehold, Siege of the Frozen Pass, is a 3D mazing tower defense
  game where corrupted creatures from two northern rifts push toward the Gate of
  a snowbound pass. You hold the pass by placing towers that form a maze for
  creeps to walk through. The game describes itself as original, with no
  external assets, and it's for anyone who misses the tower defense maps of the
  Warcraft 3 era.


  Forty waves, with four boss fights spaced ten waves apart. Cheap walls, plus
  nine tower lines four tiers deep, most splitting into two branches at the top
  tier. Five kinds of damage against six kinds of armor. Seven wave types,
  including Flying and Swarm, each wanting a different answer. Interest on
  banked gold, plus bonuses for early wave calls. Beaconlight towers, boosting
  every tower around them.


  Pick a tower, then left-click clear snow to place it. Creeps always route
  around towers, and placements that fully block the path are rejected. Build
  Rime Walls (10 gold) to lengthen routes. Later, select a wall and make it a
  tower on that spot. Select a tower, then upgrade, retarget or sell it. Press N
  to call the next wave early, or let the countdown run. Each creep reaching the
  Gate takes a life, and a boss takes many.


  Difficulty climbs in four steps called watches, and you pick one before each
  run. The game presents Recruit as a gentle entry into mazing, with 60 lives,
  360 gold to start, creeps at half strength and bigger bounties. Warden, the
  intended challenge, has 300 gold and 40 lives. Warlord gives 25 lives and
  Rimebound 15, and both start with less gold and pay smaller bounties.
  Rimebound's card says a maze must be flawless to survive.


  According to malny, Warcraft 3 custom maps were the reference for mazing, and
  every design decision was left to the AI."
