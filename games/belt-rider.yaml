slug: belt-rider
title: Belt Rider
tagline: Steer a ship through an asteroid belt and outlast your friends without
  crashing.
description: >-
  Belt Rider is a casual arcade game set in an asteroid belt. You pilot a ship
  through drifting rocks, and every collision hurts. A run lasts as long as you
  can keep avoiding them, so the goal is simply to survive longer than the other
  players you're up against.


  The design draws on SF Cave, the classic PC game the creator loved as a kid,
  and it pairs that simple survive-as-long-as-you-can loop with a space setting.
  It is meant to be easy to pick up yet hard to master. Multiplayer support lets
  friends compare how long each of them lasts, and it also runs on mobile.


  Belt Rider was an entry in Vibe Jam 2026, where it placed 238th out of 945
  entries. The creator says they built it with Cursor.
