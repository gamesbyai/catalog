slug: shatter-drift
title: SHATTER DRIFT
tagline: Hold to shatter through obstacles, release to recombine and collect energy.
description: >-
  You guide a crystal drifting through endless procedural space in this abstract
  arcade runner. Each run moves back and forth between two states: shattered,
  where you are safe, and whole, where you collect.


  Five biomes. Boss waves. Power-ups. A global leaderboard for scores.
  Procedural audio with a convolution reverb. More than 22 game systems. Under a
  megabyte to load.


  One input runs the whole game. Hold to shatter your crystal and pass through
  obstacles. Let go to recombine the pieces and collect energy.


  tommyatoai says they built it entirely with one AI tool, to show that such a
  tool could make a polished arcade game start to finish. Its biome skyboxes
  were AI-generated. Ikaruga and Super Hexagon inspired the risk-and-reward
  design, per the creator.
