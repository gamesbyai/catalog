slug: shatter-drift
title: SHATTER DRIFT
tagline: Hold to shatter through obstacles, release to recombine and collect energy.
description: >-
  SHATTER DRIFT runs on one input. Hold it and your crystal breaks apart to pass
  through obstacles; let go and the pieces recombine and collect energy. It is
  an abstract arcade runner through endless procedural space, and a run swings
  between those two states: shattered and safe, or whole and collecting.


  Five biomes, boss waves, and power-ups add variety, and a global leaderboard
  tracks scores. The game loads at under a megabyte, and custom post-processing
  shaders and procedural audio with convolution reverb shape the look and sound.


  The creator says they built it entirely with Claude Code, to show that one AI
  tool could produce a polished arcade game from scratch. It has more than 22
  game systems, the skyboxes for its five biomes were AI-generated, and Ikaruga
  and Super Hexagon are the cited inspirations for its risk-and-reward design.
