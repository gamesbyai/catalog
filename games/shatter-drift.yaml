slug: shatter-drift
title: SHATTER DRIFT
tagline: Hold to shatter through obstacles, release to recombine and collect energy.
description: >-
  SHATTER DRIFT is an abstract arcade runner in which a crystal drifts through
  endless procedural space. The game uses a single input. Holding it breaks the
  crystal apart so it can pass through obstacles, and releasing it lets the
  pieces recombine and gather energy along the way.


  The push and pull between those two states drives each run, with safety on one
  side and collection on the other. Five biomes, boss waves, and power-ups add
  variety, and a global leaderboard tracks scores. The whole game loads
  instantly at under a megabyte, and it also runs on mobile. Custom
  post-processing shaders and procedural audio with convolution reverb shape the
  look and sound.


  The creator says they built it entirely with Claude Code to show one AI tool
  could produce a polished arcade game from scratch. It contains more than 22
  game systems, and the skyboxes for the five biomes were AI-generated. The
  creator cites Ikaruga and Super Hexagon as inspirations for its
  risk-and-reward design. It placed 472nd of 945 entries in Vibe Jam 2026.
