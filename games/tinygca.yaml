slug: tinygca
title: TinyGCA
tagline: Guide a plane to the runway by sending heading commands from a radar scope.
description: "Drag the compass dial to pick a heading, then hit Send Heading and the aircraft turns to match. You're a ground-controlled approach controller watching a radar scope, guiding a plane toward the runway.


  The scope shows the plane's callsign, a set of dashed lines marking the final approach course, and the runway sitting near the center of the rings. If the plane drifts off the line, a radio message tells you it's slightly left of course and correcting.


  Voice is switched on by default, so the ATC-style calls are spoken as well as written.


  Beside the radar there's a panel with the callsign, aircraft type, range in nautical miles, landings and score. A best score is kept too. The wind reading and a gate percentage sit along the bottom of the scope.


  You can nudge the heading five degrees at a time with the minus and plus buttons, or reset it. If an approach goes wrong, there's a Go Around button. There's also a button to swap the control panel to the other side of the screen, and a help button.


  Each session opens on a briefing screen, where you press Start Control to take over the approach.


  The creator, tatesuke, got the idea from videos of real GCA approaches and wanted to capture a little of that atmosphere. They shaped the concept through repeated testing, tuning aircraft behavior, radar look, controls and the radio voice, while AI tools wrote all of the code."
