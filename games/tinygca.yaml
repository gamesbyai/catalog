slug: tinygca
title: TinyGCA
tagline: Guide a plane to the runway by sending heading commands from a radar scope.
description: "Drag the compass dial to pick a heading, then hit Send Heading and
  the aircraft turns to match. You're a ground-controlled approach controller
  guiding a plane toward the runway.


  Keep the plane on the line that leads to the runway. If the plane drifts off
  the line, a radio message tells you it's slightly left of course and
  correcting.


  Voice is on by default, and the ATC-style calls are spoken aloud as well as
  written. A best score is kept too.


  You can nudge the heading five degrees at a time with the minus and plus
  buttons, or reset it. If an approach goes wrong, you can use the Go Around
  button.


  Each session begins with a briefing, and you press Start Control to take over
  the approach.


  The creator, tatesuke, got the idea from videos of real GCA approaches and
  wanted to capture a little of that atmosphere. They shaped the concept through
  repeated testing, tuning aircraft behavior, radar look, controls and the radio
  voice, while AI tools wrote all of the code."
