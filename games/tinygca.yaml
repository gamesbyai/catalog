slug: tinygca
title: TinyGCA
tagline: Guide a plane to the runway by sending heading commands from a radar scope.
description: "Read the briefing that opens each session, then press Start
  Control to take charge of the approach. You play a ground-controlled approach
  controller, bringing a plane in to the runway over the radio.


  Spoken ATC-style radio calls, also written out, like slightly left of course,
  correcting. A best score to beat.


  Pick a heading by dragging the compass dial. Press Send Heading and the plane
  turns to match. Keep the plane on the path to the runway. Adjust the heading
  in five-degree steps with minus and plus buttons, or hit Reset. Press the Go
  Around button if the approach goes wrong.


  tatesuke got the idea from footage of real GCA approaches and wanted to bring
  a little of that mood into a game. Through repeated testing, tatesuke shaped
  the concept and tuned how the aircraft behaves, the radar look, the controls,
  and the radio voice. AI tools wrote all of the code."
