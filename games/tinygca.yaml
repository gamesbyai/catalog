    was cool. Ever since, I wanted to experience a little of that atmosphere
    myself. I thought voice communication would be especially important for
    making it feel right.


    I designed the concept and gameplay through repeated testing and feedback,
    while AI coding tools wrote all of the code, including the UI text. I kept
    iterating on details such as aircraft behavior, radar presentation,
    controls, and ATC-style voice communications until it felt like the simple
    GCA experience I had imagined.
