slug: keepraid
title: KeepRaid
tagline: Build a fortress, defend your flag, and break into the enemy keep to
  capture theirs.
description: >-
  Teams face off in KeepRaid, a multiplayer take on capture the flag, where each
  side has its own keep. Players shape the map, so keeps can look different.


  Walls and layout you build as your defense. Defenses held against intruders.
  The other team's structures as obstacles to break.


  Build your keep first. Break through the enemy's walls. Take their flag and
  carry it home.


  corysimmons123 says the game was inspired by King Arthur's Gold, a game they
  "loved and miss."
