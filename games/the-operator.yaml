slug: the-operator
title: The Operator
tagline: Survive a night in a forest tower by working a broken emergency phone.
description: >-
  The Operator is a psychological horror puzzle game set in an abandoned forest
  tower at night. The player is stranded with a malfunctioning emergency phone
  system, and the only way out is to work through it while something waits
  outside. Each attempt to get help means dealing with a line that keeps putting
  you on hold.


  The horror comes from helplessness rather than combat. Siren Head lurks beyond
  the walls, and the tension builds as you wait, retry, and figure out the phone
  system while the threat closes in. The creator cites Coldline as an
  inspiration and wanted the scariest element to be powerlessness instead of the
  monster itself.


  It was built with Three.js, and the creator lists Antigravity as the tool
  used. It placed 464th out of 945 entries in Vibe Jam 2026 and is marked as
  playable on mobile.
