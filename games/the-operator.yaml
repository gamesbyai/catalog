slug: the-operator
title: The Operator
tagline: Survive a night in a forest tower by working a broken emergency phone.
description: >-
  Your only way out of an abandoned forest tower at night is a broken emergency
  phone. The Operator is a psychological horror puzzle game in which every call
  for help runs into a line that keeps putting you on hold.


  The horror comes from helplessness. The creator cites Coldline as an
  inspiration and wanted the scariest element to be powerlessness instead of the
  monster itself. It was put together in Antigravity on Three.js.


  Siren Head lurks beyond the walls, and the tension builds as you wait, retry,
  and figure out the phone system while the threat closes in.
