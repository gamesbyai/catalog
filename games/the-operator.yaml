slug: the-operator
title: The Operator
tagline: Survive a night in a forest tower by working a broken emergency phone.
description: >-
  Stranded at night, your only way out is a broken emergency phone. The Operator
  is a psychological horror puzzle game.


  The abandoned forest tower you need to get out of. Hold lines on every call
  for help. Siren Head outside the tower walls.


  Wait, retry, and work out the phone system while the threat closes in.


  itscoleblake cites Coldline as an inspiration and wanted powerlessness, not
  the monster itself, to be the scariest element.
