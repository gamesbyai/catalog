slug: earth-command
title: Earth Command
tagline: Defend Earth from incoming missiles and asteroids in a full 360-degree
  arcade shooter.
description: >-
  Earth Command takes the classic Missile Command setup and opens it up to a
  full 360 degrees. Threats close in on the planet from every direction, and the
  player shoots them down before they land. Asteroids are part of the mix, so
  the sky stays crowded and demands constant attention.


  The main hook is the combination of two arcade ideas. The fixed-city defense
  of Missile Command meets the free-floating hazards associated with Asteroids,
  which turns a flat, one-sided defense into something you have to watch all the
  way around the planet. It runs in the browser in a 3D scene and has mobile
  support.


  The creator says Missile Command was a childhood favorite and that they had
  long wanted to make an updated version. They built it with Claude Code, and it
  was submitted to Vibe Jam 2026.
