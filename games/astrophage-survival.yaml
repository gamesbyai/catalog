slug: astrophage-survival
title: "ASTROPHAGE : SURVIVAL"
tagline: Outrun an alien threat and breed a predatory microbe to stop a swarm
  eating the Sun.
description: >-
  ASTROPHAGE : SURVIVAL is a sci-fi survival game set around a star under attack
  from a devouring swarm. The player races to escape an alien threat while
  working on a way to stop the swarm, which means bio-engineering a predatory
  microbe that can be turned against it.


  The game draws on Andy Weir's Project Hail Mary and its film adaptation, and
  it mixes the pressure of a chase with slower, methodical problem-solving. Its
  tags span action, adventure, puzzle, shooter, RPG, strategy and simulation,
  and the goal is to combine tense survival with the lab-style puzzle of
  engineering a cure. An interstellar friendship is part of the emotional tone
  the creator aimed for.


  It was entered in Vibe Jam 2026 and runs in the browser on Three.js, with
  multiplayer support. The creator says they used Cursor to build it.
