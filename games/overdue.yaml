slug: overdue
title: overdue
tagline: Tap three lanes in time with falling notes and hold the long ones
  through a short song.
description: >-
  overdue is a portrait-format rhythm game built around a single song. Notes
  fall down three lanes toward a hit line, and you tap the matching lane as each
  one lands. Long notes must be held until the tail reaches the line. A run
  lasts ninety seconds, and the goal is to keep your combo going.


  Grading depends on timing. Hits fall into GREAT, GOOD, OK, or MISS windows,
  and a miss resets the combo multiplier, which climbs to x4. Holds are judged
  on the release, by how much of the note you held. Taps with no note in range
  cost nothing. Ranks run from D to S, with FULL COMBO and PERFECT badges above
  them.


  The chart was authored by hand note by note, so patterns follow the track. It
  is meant for phones, where the screen splits into thirds for your thumbs, and
  it also runs in a desktop browser with keyboard keys. The page warns about
  flashing lights. The game was made with Godot and exports to HTML5.
