slug: needle-run
title: NEEDLE RUN
tagline: Fly through gates, avoid pursuers, and chase score multipliers for a
  leaderboard spot.
description: >-
  NEEDLE RUN is an arcade action game in which the player steers a craft through
  a series of gates while staying out of the reach of whatever is hunting it.
  Each run is a scoring attempt: pass through gates, avoid getting caught, and
  pick up multipliers to push the total higher.


  The game is framed as a take on the Pacifism mode from the Geometry Wars
  series, so the emphasis falls on evasion and routing. Score multipliers reward
  taking risks, and a leaderboard gives each run something to be measured
  against.


  NEEDLE RUN was entered in Vibe Jam 2026, where it placed 98th out of 945
  entries. It is rendered in 3D with Three.js, and it is played in the browser.
