slug: needle-run
title: NEEDLE RUN
tagline: Fly through gates, avoid pursuers, and chase score multipliers for a
  leaderboard spot.
description: >-
  You fly a small glowing arrow through gates and try not to get caught, picking
  up score multipliers along the way to climb the leaderboard.


  It's modeled on the Pacifism mode from the Geometry Wars series. The title
  screen shows a cluster of red diamonds trailing the arrow across a neon grid.


  A small x count at the top center shows your current multiplier, and the label
  under it tells you when the bomb is ready. Your own best score sits in the top
  left, while the top right shows the score to beat, so there's always a number
  to chase.


  When that label says the bomb is ready, press B or Shift to set it off.


  On a computer you can aim and move with the mouse, or steer with WASD if you'd
  rather use the keyboard. A gamepad's left stick works too, and on a phone you
  get a virtual stick, which is a thoughtful extra for a game about steering.


  A press of Space, a click or a tap on the title screen is what starts a run.
