slug: needle-run
title: NEEDLE RUN
tagline: Fly through gates, avoid pursuers, and chase score multipliers for a
  leaderboard spot.
description: >-
  Your aim is to slip through gates without getting caught and drive your score
  as high as it can go. Enemies chase your ship. You have no weapon.


  Multipliers to grab. Scores that go up to an online leaderboard. The
  top-ranked score as the goal. Profile edits that change how your leaderboard
  entry looks.


  You move with WASD, the left stick on a gamepad, or a virtual stick on a
  touchscreen. Use the mouse to move and aim the ship. Start a run with Space, a
  click, or a tap. Press B or Shift to set off your reserve bomb once it's
  ready.


  AfterimageDev took the idea from Pacifism, a mode in Geometry Wars. The
  missing gun is the premise, not an oversight.
