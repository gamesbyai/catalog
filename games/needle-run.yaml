slug: needle-run
title: NEEDLE RUN
tagline: Fly through gates, avoid pursuers, and chase score multipliers for a
  leaderboard spot.
description: >-
  Steer a small arrow ship across a neon grid, flying through gates while red
  diamond enemies close in on you. You have no weapon to shoot with. The goal is
  to stay uncaught, pass through gates, and build a score as high as you can.


  Collecting multipliers raises the number shown at the top of the screen, which
  starts at x1. A bomb is held in reserve and the HUD shows when one is ready.
  Your best score sits in the top left corner, and the top-ranked score to beat
  sits in the top right.


  Scores go to an online leaderboard, and the title screen has a profile editor
  for your entry. Move with the mouse, WASD, a gamepad stick, or a touch virtual
  stick. The creator took the idea from the Pacifism mode in the Geometry Wars
  series.
