slug: needle-run
title: NEEDLE RUN
tagline: Fly through gates, avoid pursuers, and chase score multipliers for a
  leaderboard spot.
description: >-
  Red diamond enemies keep closing in on your little arrow ship as it zips
  across a neon grid, and you don't have a single weapon to fight them off
  with.


  Instead, your job is to fly through gates without getting caught while you
  push your score as high as it'll go. AfterimageDev took the idea from the
  Pacifism mode in the Geometry Wars series, so the missing gun is the premise
  rather than an oversight.


  Grabbing multipliers bumps up the number at the top of the screen, which
  starts at a humble x1. You've also got a bomb held back in reserve. A small
  note in the HUD tells you when it's ready, and B or Shift sets it off.


  Your own best score sits in the top left corner, while the top-ranked score
  you're chasing stares back at you from the top right.


  Scores go up to an online leaderboard, and it's right there on the title
  screen beside a big glowing orange logo. There's even a profile editor on that
  screen for tidying up how your entry looks. Space, a click or a tap starts the
  run.


  You can move with the mouse, WASD, a gamepad's left stick or a virtual stick
  on a touchscreen, and the mouse pulls double duty by aiming the ship as well.
