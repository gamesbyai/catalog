slug: paperwork-in-purgatory
title: Paperwork in Purgatory
tagline: Check each dead soul's claims against the database and accept or reject them.
description: >-
  Paperwork in Purgatory puts you behind the intake desk of the afterlife. Each
  dead soul slides over a list of claimed sins, virtues, last rites and excuses.
  You cross-reference those claims against the database, then accept or reject
  the soul.


  A run lasts seven days at the window. Mistakes are tracked: three errors cost
  one life, and you have three lives. Losing all of them means you get processed
  instead of fired. Surviving the full week earns you parole and a place in the
  line you were working.


  The database is the source of truth, and the souls' claims can't be trusted. A
  saint with a hidden murder should be denied, while a thief who fed the poor
  may pass. The game is built around reading documents and applying the rules,
  with a creepy, office-bureaucracy tone.


  It was made for mobile screens. The creator suggests playing the browser
  version at about 50% screen size. The creator notes that AI assisted with the
  graphics.
