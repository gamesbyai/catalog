slug: paperwork-in-purgatory
title: Paperwork in Purgatory
tagline: Check each dead soul's claims against the database and accept or reject them.
description: >-
  You're a damned soul who just got promoted to the intake window of the
  afterlife. Each dead person slides over the sins, virtues, last rites and
  excuses they say apply to them, and you compare all of it against the
  database.


  Then you accept or reject. Someone who looks like a saint but has a murder on
  file gets turned away, while a thief who really did feed the poor can pass, so
  the records outrank whatever a soul tells you. The dead fib constantly, and
  the database is the more honest of the two.


  Mistakes pile up, and every one of them gets counted against you.


  Every three errors cost you one life, and you have three lives total. Lose
  them all and you won't be fired, you'll be processed, which is a grim kind of
  severance.


  Get through seven days at the window and you're paroled, which means you take
  a spot in the very line you've been running.


  The booth is a cramped metal cabin with a green monitor on top that has tabs
  for sins, projects and the database, plus a pause option. Under it sit a lever
  and three colored buttons. A chalkboard beside the window tracks the day, your
  quota and your errors, and a coffee maker on the counter fits the whole
  bureaucracy joke.


  Levi Rose built it with mobile in mind, so on a desktop the page recommends
  shrinking your browser window to about half size.
