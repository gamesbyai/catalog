slug: paperwork-in-purgatory
title: Paperwork in Purgatory
tagline: Check each dead soul's claims against the database and accept or reject them.
description: >-
  You're a damned soul, offered a promotion to the intake window rather than
  salvation. Each soul slides you a list of claimed sins, virtues, last rites
  and excuses, and you check every claim against the database, then accept or
  reject the soul. The game is about reading paperwork and enforcing rules,
  where the database is the only thing you can rely on and the souls' claims
  can't be.


  A seven-day run at the window. Daily quotas, beginning with ten souls on day
  one. Parole after a full week, and a place in the very queue you've been
  staffing. Tracked mistakes, with three errors costing one of three lives.
  Processing, not firing, once all three lives are lost. Creepy
  office-bureaucracy Purgatory, with an overcrowded Hell and Heaven's HR
  department that won't leave you alone.


  Process a soul or check the database. The instruction manual is there to read.
  Turn away a saint hiding a murder. A thief who fed the poor may get through.


  Morpheus Code made it for mobile screens. According to the creator, AI
  assisted with the graphics.
