slug: clusterfall
title: Clusterfall
tagline: Find the hidden Hallucinator while stabilizing a cascading prompt graph
  with others.
description: >-
  One player in every match is secretly the Hallucinator, an LLM agent quietly
  poisoning a prompt graph that cascades. Everyone else races to stabilize the
  cluster before it falls apart.


  A clean Prompt Node at the start. A root agent who validates the Prompt Node
  to cleanse corruption and keep context alive.


  Move through the arena with WASD. Press E at a task station to start a task,
  sabotage one or run an audit. Hold E down on hold tasks. On the other tasks,
  enter the sequence with WASD. If you are the Hallucinator, press R for a
  temperature spike.


  litchshade writes, "I took the Among Us loop and reskinned it with
  LLM-specific tasks and themes." The traitor role was replaced with the
  Hallucinator.
