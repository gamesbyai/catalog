slug: clusterfall
title: Clusterfall
tagline: Find the hidden Hallucinator while stabilizing a cascading prompt graph
  with others.
description: >-
  Clusterfall is a hidden-role multiplayer game in which players act as LLM
  agents working to stabilize a cascading prompt graph before the cluster
  collapses. Most players try to keep the system running, while one secretly
  plays the Hallucinator and works to corrupt it. Each round mixes task
  completion with discussion and suspicion.


  The game borrows the social deduction loop popularized by Among Us and
  rethinks it around AI development. Instead of a generic traitor, the saboteur
  is a Hallucinator, and the tasks and sabotage are themed around LLM logic such
  as prompts and clusters. That changes what suspicious behavior looks like when
  everyone is supposedly an agent.


  The creator submitted it to Vibe Jam 2026 and says they built it with
  opencode. They describe the codebase as new and the logic as nearly complete,
  with the game still waiting for its first real players.
