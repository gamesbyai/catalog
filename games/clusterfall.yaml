slug: clusterfall
title: Clusterfall
tagline: Find the hidden Hallucinator while stabilizing a cascading prompt graph
  with others.
description: >-
  One player in every match is secretly the Hallucinator, an LLM agent quietly
  poisoning a graph of prompts that cascades, while everyone else races to
  steady it before the whole cluster falls apart.


  The loop comes straight from Among Us, with the traitor swapped out for this
  role. You walk a dark 3D arena with WASD, past glowing green rings and
  floating crystal shapes.


  Above the arena hangs a panel with the current user prompt, which opens on a
  request to design a sustainable Mars colony. The answer types itself out
  underneath, and it's hard not to grin when it starts listing algae bioreactors
  and democratic civic protocols.


  The HUD on the left is busy, showing your role, your agent state, a round
  clock and the match state, which starts at round 1 of 3. The Prompt Node
  reads CLEAN when things begin. Under that sit three meters for context
  window, corruption and final output, plus a readout of how far you are from
  the prompt.


  A root agent stays close to the Prompt Node, pressing E there to validate it,
  cleanse corruption and keep the context alive.


  Task stations are where E really earns its keep, because pressing it there
  starts a task, sabotages one or runs an audit. Hold tasks want E held down.
  Other tasks ask you to punch in a sequence on WASD instead.


  The Hallucinator also gets an extra move for an AI saboteur, a temperature
  spike triggered with R.
