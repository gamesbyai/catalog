slug: clusterfall
title: Clusterfall
tagline: Find the hidden Hallucinator while stabilizing a cascading prompt graph
  with others.
description: >-
  You're an agent in a cluster of LLM agents, and one of you is secretly a
  Hallucinator who's trying to corrupt the prompt everyone else is trying to
  stabilize. It's the Among Us loop, reskinned with AI themes, so the traitor
  and the sabotage both come from the world of language models.


  Each round starts from a user prompt, like a request to design a sustainable
  Mars colony, and a output slowly materializes on screen as the group works.


  If you're honest, you walk to task stations and use them. Some tasks are a
  quick press, some need you to hold the key, and some ask you to enter a
  sequence of directions. The Root agent has its own job, which is to stay near
  the Prompt Node, validate it, and clear corruption so the context stays alive.


  The Hallucinator does the opposite, poisoning the prompt and sabotaging
  stations, and can trigger a temperature spike.


  Your side panel keeps the round in view. You'll see your role, the round
  clock, whether the prompt node is clean, and three meters for context window,
  corruption and final output. That's a handy way to tell whether the cluster is
  holding together.


  A match runs across several rounds, and a round is a race between the output
  finishing and the cluster collapsing. It's a social deduction game, so it
  needs other people in the room with you online.


  The creator describes the code as freshly written and is still waiting on its
  first real players.
