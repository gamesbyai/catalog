slug: ai2u-guns-girlfriends
title: AI2U - Guns & Girlfriends
tagline: Build a base, launch nukes and outfight three rival factions in a
  real-time strategy game.
description: >-
  AI2U - Guns & Girlfriends is a single-player real-time strategy game in the
  style of Red Alert. You build up a base, gather your forces and fight all
  three rival factions at the same time, with nukes on hand as a late-game
  weapon.


  The game was runner-up at AI Browser Game Jam 4. According to the creator, it
  was built with two AI tools, Claude Code and Gemini, and Three.js handles the
  3D graphics, which keeps the whole project playable in a single browser tab.


  The loop is the classic one of base-building and army management, fitted into
  one page and rendered in 3D for one player. What changes is the opposition:
  three rival factions compete at once, rather than one enemy waiting to be
  beaten.
