slug: ai2u-guns-girlfriends
title: AI2U - Guns & Girlfriends
tagline: Build a base, launch nukes and outfight three rival factions in a
  real-time strategy game.
description: >-
  The start screen shows a nuclear blast over a battlefield of tanks and bases,
  with a pink-haired catgirl in the corner and a Run game button. In play, you
  build a base, harvest ore, train tank columns and watch for nuclear
  superweapon countdowns, in the manner of a '90s Red Alert skirmish.


  You pick one of three factions. Catgirls field conscript soldiers, tanks,
  rocket launchers and a commando who plants C4 on buildings. Witches have fast
  units, healing cauldrons, suicide potion runners and a Grand Cannon with the
  longest range. Sirens use bubble-shielded guards, chain-lightning platforms
  and a siege crab.


  There are 5 maps (islands, deserts, glaciers and a volcano crater) and 3
  difficulties, with AI opponents that rush, build turrets or wait for an
  opening. Units counter each other through abilities such as healing auras and
  hero infiltration. Watch your power supply, and when a nuclear launch warning
  appears in the top-left corner, expect the strike. An in-game wiki lists live
  stats for every unit, and victories are saved as local records.


  The creator built the 3D units almost entirely from procedural geometry, which
  keeps the download near 10 MB.
