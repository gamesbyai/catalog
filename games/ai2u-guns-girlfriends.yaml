slug: ai2u-guns-girlfriends
title: AI2U - Guns & Girlfriends
tagline: Build a base, launch nukes and outfight three rival factions in a
  real-time strategy game.
description: >-
  A nuclear mushroom cloud fills the start screen above a battlefield of tanks
  and bases, while a pink-haired catgirl clutches her head in the corner next to
  the Run game button.


  Once it loads, you're in a '90s Red Alert style skirmish where you build a
  base, harvest ore, roll out tank columns and watch the countdowns on nuclear
  superweapons. You pick one of three factions, and oddly enough all three of
  them are in love with you, which the game treats as the real problem.


  Catgirls send out conscript soldiers, tanks and rocket launchers, backed by a
  commando hero who blows up buildings with C4. Witches move fast and bring
  healing cauldrons, a bit of chaos in the form of potions that run at the enemy
  and explode, and a Grand Cannon with the longest range of anything. Sirens
  hide their guards behind bubble shields and also field chain-lightning
  platforms plus a siege crab.


  You get 5 maps of islands, deserts, glaciers and a volcano crater, plus 3
  difficulties where AI opponents rush you, build turrets or wait for an
  opening, and the menu labels Hard simply "They never stop."


  Units counter each other through abilities like healing auras and hero
  infiltration, and there's a full in-game wiki showing live stats for every
  unit. There's a power supply to manage as well. When NUCLEAR LAUNCH DETECTED
  appears in the top-left corner, the game's own advice is to believe it,
  because the strike is coming.


  Your wins get saved as local victory records, split by difficulty for each
  faction.


  DGSpitzer built the 3D units almost entirely from procedural geometry, which
  keeps the whole thing at a surprisingly small download near 10 MB, while Suno
  AI made the soundtrack and Nano Banana drew the character art.
