slug: ai2u-guns-girlfriends
title: AI2U - Guns & Girlfriends
tagline: Build a base, launch nukes and outfight three rival factions in a
  real-time strategy game.
description: >-
  Pick one of three factions and take on AI opponents across five maps of
  islands, deserts, glaciers and a volcano crater. Build a base, harvest ore,
  roll out tank columns and deal with nuclear superweapons in a '90s Red
  Alert-style skirmish. All three factions are in love with you.


  Catgirls with conscript soldiers, tanks, rocket launchers and a commando hero
  who blows up buildings with C4. Witches with fast movement, healing cauldrons
  and potions that run at enemies and explode, plus a Grand Cannon with the
  longest range of anything. Sirens with guards behind bubble shields,
  chain-lightning platforms and a siege crab. Three difficulties with AI that
  rushes, builds turrets or waits for an opening. Unit counters built on
  abilities like healing auras and hero infiltration.


  Left click and drag to select units. Right click to move, attack, harvest or
  set a rally point. Select the commando and right click a structure to plant
  C4. Manage your power supply, and check the in-game wiki for stats on every
  unit. Win a round and it's saved as a local victory record, split by
  difficulty for each faction.


  DGSpitzer built the 3D units almost entirely from procedural geometry, which
  keeps the download small, near 10 MB. Suno AI made the soundtrack, and Nano
  Banana drew the character art.
