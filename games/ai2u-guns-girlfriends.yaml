slug: ai2u-guns-girlfriends
title: AI2U - Guns & Girlfriends
tagline: Build a base, launch nukes and outfight three rival factions in a
  real-time strategy game.
description: >-
  The first screen asks you to choose a commander: a pink-haired catgirl, a
  witch, or a siren. Below them you pick one of five battlefields and one of
  three difficulties, then hit start. It's a real-time strategy game in the old
  Red Alert mold, with base building, harvesting, tank columns and nuclear
  silos.


  Each commander leads a different army. The catgirls field soldiers, tanks and
  rocket launchers, plus a commando who plants C4 on buildings. The witches have
  fast movers, healing cauldrons, running potions that blow up, and a Grand
  Cannon with the longest range. The sirens bring bubble-shielded guards,
  chain-lightning platforms and a siege crab.


  The maps are an island, a set of sand-bridged straits, a volcano crater, a
  desert and a glacier shelf. On the island, three armies share the land and
  nobody can escape.


  You pick Easy, Normal or Hard, and the computer opponents behave differently
  from each other: some rush you, some pile up turrets, and some wait for an
  opening.


  Every unit has a counter, so healers and hero infiltrators matter as much as
  raw tank numbers. Defensive buildings help a lot, though specialized
  counter-units can crack them, and you have to keep an eye on your power
  supply. The ore behind your base is safe, but the ore in the middle is where
  the fighting happens.


  When the top-left corner announces a nuclear launch, it means it. Your results
  are saved locally in a victory record for each commander and difficulty, and
  there's an in-game wiki with live stats for every unit.


  The creator built the 3D units almost entirely from procedural geometry, which
  keeps the whole thing around 10 MB. The music and character art were made with
  AI tools too.
