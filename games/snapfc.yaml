slug: snapfc
title: SnapFC
tagline: Drag, aim, and snap your players to score in quick physics soccer matches.
description: >-
  Drag one of your players, aim, and snap it toward the ball. Momentum and
  collisions do the rest.


  Physics soccer inspired by tabletop games. Angle and power as every turn's
  decision. Shots that attack and leave you exposed at once. Solo play, opponent
  matchmaking and an online lobby. A leaderboard.


  Stay available for an online opponent while you keep playing solo.


  ivancorreces wanted a tiny soccer game you could start instantly, easy to
  learn but competitive enough to replay.
