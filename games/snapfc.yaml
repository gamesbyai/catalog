slug: snapfc
title: SnapFC
tagline: Drag, aim, and snap your players to score in quick physics soccer matches.
description: >-
  The title screen gives you four big buttons: Solo Play, Find an Opponent,
  Online Lobby and Leaderboard. You don't have to sign up to start, so you can
  go straight into a match.


  It's soccer run on physics, and you move your players by dragging, aiming and
  snapping them at the ball. The creator took inspiration from tabletop games,
  and wanted something that's easy to learn but competitive, where every move is
  a deliberate choice.


  Matches are quick, but they get more strategic than they first look.


  Find an Opponent comes with a considerate touch, because it lets you stay
  available for a match while you practice in solo play. So you're not sitting
  around in a queue waiting.


  The Online Lobby is there for playing against other people, and the
  Leaderboard sits right beside it.
