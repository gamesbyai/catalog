slug: robot-royale
title: Robot Royale
tagline: Fight through a ruined cyber-city arena, upgrading from bare fists to RPGs.
description: >-
  You start with bare fists in a decaying cyber-city arena and fight toward
  heavier weapons, with explosive RPGs at the top of the progression. Move with
  WASD and attack with the mouse. The camera looks down at an angle on a small
  blocky robot with a cyan eye.


  A panel in the corner tracks the current phase, elapsed time, scrap collected,
  your level, and the level at which the next boss appears, which reads Nv.5 at
  the start. It also names your equipped weapon. A red health bar runs along the
  bottom of the screen.


  Shift dashes, and the panel shows when the dash is ready again. Red medical
  pickups lie scattered across the floor between tall, angular towers, and a
  green ring labeled as a portal sits near the arena edge. Esc pauses the game.


  The creator built it around the idea of robots growing more powerful once
  combined with AI. The whole game is a single Three.js file.
