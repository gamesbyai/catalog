slug: robot-royale
title: Robot Royale
tagline: Fight through a ruined cyber-city arena, upgrading from bare fists to RPGs.
description: >-
  You begin with nothing but basic punches and fight your way up to explosive
  RPGs, crossing a dying cyber-city as a small black robot.


  A panel in the top corner tracks your phase, a running timer, your scrap and
  your level. It also names the weapon you're holding and says a boss is coming
  at level 5, so you know what you're building toward.


  Dash gets its own line there, which tells you when it's ready again. There's
  also a button to switch the audio on or off, and another to pause.


  Red pickups with a white cross are lying around on the ground.


  Tall blocky buildings wall in the arena, and red lines mark the edges of the
  map. Light cuts across the floor in long, hard shadows, so the whole place
  looks dark and ruined.


  Small dark robots are scattered over the ground, and a green portal labeled as
  a jam portal glows near the far side of the map.


  The creator was thinking about how powerful robots might get once they're
  combined with AI, which suits a game where you're a robot in a city full of
  them.
