slug: robot-royale
title: Robot Royale
tagline: Fight through a ruined cyber-city arena, upgrading from bare fists to RPGs.
description: >-
  Your robot starts out with nothing but its fists, and from there you fight
  your way up through heavier weapons, with explosive RPGs at the very top,
  across a crumbling cyber-city arena.


  The camera hangs at an angle above a small, blocky robot with a single cyan
  eye. You steer it with WASD and attack with the mouse. Shift sends you into a
  dash, and Esc pauses.


  A panel in the corner keeps track of the phase, the clock, the scrap you've
  collected and your level, plus the level where the next boss turns up, which
  starts at Nv.5. It also names your current weapon, humbly listed as Basic
  Punches at first, and shows when your dash is ready again.


  Below all that, a long red bar stretches across the bottom of the screen.


  Red medical pickups are scattered across the floor between tall, angular
  towers. Near the edge of the arena there's a glowing green ring with a portal
  label on it. Long slanting light cuts across the ground and throws pretty
  dramatic shadows off those towers.


  According to marssaum, the idea behind it is robots growing more powerful once
  they're combined with AI, and a robot punching its way up to rocket launchers
  fits that nicely. Surprisingly, the whole game lives in a single file.
