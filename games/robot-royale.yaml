slug: robot-royale
title: Robot Royale
tagline: Fight through a ruined cyber-city arena, upgrading from bare fists to RPGs.
description: >-
  Your robot starts out with nothing but its fists in a crumbling cyber-city
  arena. From there, you fight your way up through heavier weapons.


  Explosive RPGs at the top of the weapon ladder. Scrap to collect. Medical
  pickups on the arena floor. Bosses, the first at level 5, with the next one's
  level shown. A portal in the arena.


  Steer with WASD. Attack with the mouse. Press Shift to dash. Press Esc to
  pause.


  According to marssaum, the idea behind the game is robots growing more
  powerful when combined with AI. The whole game sits in one file.
