slug: emoji-survivors
title: Emoji Survivors
tagline: Fight endless waves of emoji monsters as a mage and stack chaotic upgrades.
description: >-
  Emoji Survivors starts on a mage select screen. You pick a caster from a row
  of emoji-faced portraits, and the panel above shows that mage's three skills.
  The Wind Mage comes first, with Gale Ring, a point-blank knockback burst,
  Crosswind Strip, a moving wind lane that shreds packs, and Tempest Mode, a
  storm core that chains displacement.


  In a run you survive endless waves of emoji monsters and take chaotic upgrades
  that evolve your mage's build. The goal is to wipe out the horde with
  spellcraft before it wipes you out.


  An archive panel on the menu tracks progress across 22 trials and 6
  achievements, all starting at zero. Two of the trials are surviving 5 minutes
  in a single run and reaching level 10 in a single run. A sound button sits in
  the top corner.
