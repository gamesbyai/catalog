slug: emoji-survivors
title: Emoji Survivors
tagline: Fight endless waves of emoji monsters as a mage and stack chaotic upgrades.
description: >-
  Emoji Survivors puts a mage against endless waves of emoji monsters. Chaotic
  upgrades grow your caster's build mid-run. Clear the horde with your spells
  before it clears you.


  The Wind Mage, a caster whose skills push monsters around. Gale Ring, a
  knockback burst around you. Crosswind Strip, a moving wind lane for shredding
  packs. Tempest Mode, a storm core for chaining displacement. 22 trials,
  including one to last 5 minutes within a run and one to hit level 10 within a
  run. 6 achievements.


  Pick a caster before you start. Each caster has three skills.


  swisnotjan had long wanted to try game development and finish a whole project
  from nothing. According to swisnotjan, game development is the most exciting
  kind of art, and AI is what finally made it possible for swisnotjan to pull it
  off.
