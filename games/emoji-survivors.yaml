slug: emoji-survivors
title: Emoji Survivors
tagline: Fight endless waves of emoji monsters as a mage and stack chaotic upgrades.
description: >-
  Emoji Survivors is a survival shooter in which you play a mage facing endless
  waves of emoji monsters. Each run is a fight to stay alive as the horde grows,
  while you collect upgrades that reshape your build and clear the screen before
  the crowd overwhelms you.


  The upgrade system is the focus. Choices push the mage build in chaotic
  directions, so each run can end up with a different set of powers. The emoji
  enemies give the swarm a playful look that contrasts with the escalating
  pressure of the waves.


  It was an entry in Vibe Jam 2026, where it placed 196th out of 945 entries.
  The creator says they had long wanted to build a complete game from scratch
  and that AI made it possible. The known tooling is Codex.
