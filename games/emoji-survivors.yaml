slug: emoji-survivors
title: Emoji Survivors
tagline: Fight endless waves of emoji monsters as a mage and stack chaotic upgrades.
description: >-
  Emoji Survivors sends wave after wave of emoji monsters at you, with no end in
  sight, and hands you a mage to fight them off. As the run goes on, you grab
  chaotic upgrades that grow your caster's build into something new. The goal,
  put pretty bluntly, is to clear out the horde with your spells before the
  horde clears you out.


  It all starts on a mage select screen, where a row of emoji-faced portraits
  lets you choose your caster while the panel up top lists the three skills each
  one brings.


  The Wind Mage comes first, and the whole kit seems built around shoving
  monsters where they don't want to go. Gale Ring is a knockback burst right
  around you, Crosswind Strip sends a moving lane of wind through packs to shred
  them, and Tempest Mode drops a storm core that keeps chaining displacement.


  Next to the mage picker there's an archive panel that tracks 22 trials and 6
  achievements, all sitting at zero when you begin. Two of the trials ask you to
  last 5 minutes within one run and to hit level 10 within one run. For a game
  about outlasting a swarm, it's a surprisingly long checklist.


  There's a sound toggle up in the top corner, above chunky pixel lettering and
  a dark forest backdrop.


  swisnotjan made it after long wanting to try making games and finish a whole
  project from nothing. According to swisnotjan, game development is the most
  exciting kind of art, and AI is what finally made it possible for swisnotjan
  to pull it off.
