slug: spell-cascade
title: Spell Cascade
tagline: Move a tower, aim spells, and survive 10 minutes of waves to earn a build name.
description: >-
  Every run ends with a title for your build, such as Phantom Executioner, Chain
  Annihilator or Perfect Cascade. You steer a tower with WASD, aim attacks with
  the mouse, and hold out against waves of enemies for 10 minutes. The game has
  15 build names in total.


  Builds come from stacking parts when upgrades are offered, which you pick by
  clicking. There are 10 skills, including Fireball, Meteor and Void Bolt, plus
  8 supports like Chain, Fork and Pierce. 40 attribute mods, split into 20
  prefixes and 20 suffixes, change how a build behaves. Ten synergies trigger
  when the right pieces combine.


  Enemies come in seven types: Swarmer, Shooter, Tank, Splitter, Healer, Boss
  and Phantom. Survive long enough and a three-phase boss appears. Clear Wave 20
  to unlock Endless Mode and keep playing for a higher score.


  Nine automation chips are kept in a Chip Vault and carry over between runs.
  The game is marked as early development. The creator is a non-engineer who
  worked with Claude Code over 235 commits.
