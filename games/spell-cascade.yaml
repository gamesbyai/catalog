slug: spell-cascade
title: Spell Cascade
tagline: Move a tower, aim spells, and survive 10 minutes of waves to earn a build name.
description: >-
  Move your tower with WASD, aim with the mouse, and click to choose upgrades
  whenever the game puts them in front of you. You're holding off waves of
  enemies from above, and the goal is to survive 10 minutes.


  The build is where it gets interesting. You choose from ten skills like
  Fireball, Meteor and Poison Nova, then attach supports such as Chain, Fork,
  Pierce or Orbit, and forty prefix and suffix mods twist the result even
  further.


  Ten named synergies reward certain combinations, so you can go hunting for
  them.


  Every run ends with a title for your build, and there are fifteen of them,
  including Phantom Executioner, Chain Annihilator and Perfect Cascade. So even
  a loss tells you something about how you played. Seven enemy types come at
  you: swarmers, shooters, tanks, splitters, healers, phantoms and a boss.


  That boss fights in three phases, so it isn't one fight start to finish.


  Clear wave 20 and you move into Endless Mode, where you keep going for a
  higher score. Nine behavior chips sit in a vault and carry over between runs,
  which means something sticks around after you die, and you press R to start
  over.
