slug: spell-cascade
title: Spell Cascade
tagline: Move a tower, aim spells, and survive 10 minutes of waves to earn a build name.
description: >-
  Move your tower with WASD, aim with the mouse and last 10 minutes against
  closing waves, building a spell build piece by piece.


  10 skills such as Fireball, Meteor and Void Bolt. 8 supports such as Chain,
  Fork and Pierce. 40 attribute mods and ten bonus combinations. Seven enemy
  types and a three-phase boss. Endless Mode after Wave 20.


  Click the upgrade you want whenever upgrades come up. Every run ends with a
  title for your build, like Phantom Executioner or Perfect Cascade.


  yurukusa made it as a non-engineer working with Claude Code, over 235 commits.
