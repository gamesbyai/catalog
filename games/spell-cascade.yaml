slug: spell-cascade
title: Spell Cascade
tagline: Move a tower, aim spells, and survive 10 minutes of waves to earn a build name.
description: >-
  Move your tower around with WASD and aim your attacks with the mouse while
  waves of enemies close in. You're trying to last 10 minutes. Whenever upgrades
  come up, you click the one you want, and that's how your build takes shape
  piece by piece.


  There's a surprisingly big pile of parts to stack for a run that only lasts 10
  minutes.


  You get 10 skills, Fireball, Meteor and Void Bolt among them, plus 8 supports
  such as Chain, Fork and Pierce to combine with them. On top of that, 40
  attribute mods (20 prefixes and 20 suffixes) change how a build behaves. Ten
  bonus combinations kick in when the right pieces happen to land in the same
  build.


  Seven kinds of enemy come after you: Swarmers, Shooters, Tanks, Splitters,
  Healers, Bosses and Phantoms. Hang on long enough and a boss with three phases
  shows up. If you clear Wave 20, Endless Mode opens up so you can keep going
  for a higher score.


  Every run ends by giving your build a title, like Phantom Executioner, Chain
  Annihilator or Perfect Cascade, out of 15 in all, and it's a pretty cute way
  of telling you what you ended up making.


  Nine automation chips are kept in a Chip Vault, and they come with you from
  one run to the next, so not everything starts over each time. It's still
  marked as early development, too.


  yurukusa made it as a non-engineer working with Claude Code, over the course
  of 235 commits.
