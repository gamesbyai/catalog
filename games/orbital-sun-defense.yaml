slug: orbital-sun-defense
title: Orbital Sun Defense
tagline: Defend the Sun from waves of cosmic enemies using planets and upgrades.
description: >-
  Orbital Sun Defense is a 3D tower defense set around the Sun. Waves of cosmic
  enemies close in on the star, and the player holds them off by placing planets
  as strategic elements and choosing upgrades between and during waves.
  Difficulty climbs as the waves grow.


  The design aims for clarity and pressure. It removes friction so a session
  starts immediately, and the rules can be understood within seconds. Placement
  matters, since the orbital layout replaces the fixed lanes of classic tower
  defense and gives the genre a more dynamic feel.


  The creator entered it in Vibe Jam 2026 and describes it as vibe coded. AI was
  used to iterate quickly on gameplay, visuals, and systems, which left more
  time for design decisions and player experience. The game is built with
  Three.js.
