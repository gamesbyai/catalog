slug: match-10
title: Match 10
tagline: Clear a number grid by matching equal pairs or pairs that add up to 10
description: >-
  Match 10 has you clear a grid of numbers by picking pairs. Two numbers can be
  removed if they are identical or if they sum to 10. The goal is to empty the
  board before it overflows.


  Pairs can connect diagonally, and the link works even across empty spaces.
  That widens the moves open to you compared with number-matching games that
  only allow straight lines.


  When the board runs low on moves, a Replicate button copies the remaining
  active numbers down the grid to extend the run. Replicate locks at 160 rows
  and unlocks again once you clear the board below 80 rows. A manual Shuffle
  button becomes available once the board reaches 45 rows, which resets your
  options.


  The menu offers difficulty options, dark mode, and three font sizes: small,
  medium, and large. The creator states the game has no ads, and that AI
  assisted with code, graphics, and text.
