slug: doombreaker-carnage
title: "DOOMBREAKER: Carnage"
tagline: Run through ten zones of demons with four guns, then beat each zone's boss.
description: >-
  Move with WASD, aim with the mouse, and click to fire. Each zone asks you to
  kill every enemy on the level, then fight that zone's boss. Clear all ten
  zones to finish the run.


  You carry four weapons, switched with the number keys 1 to 4: pistol, shotgun,
  chaingun and rocket launcher. Health, armor and ammo pickups are scattered
  through the levels, and enemies get tougher as you go deeper. Space jumps,
  Shift sprints, and the game supports strafe-jumping.


  Levels are generated procedurally, so layouts change between runs. Each zone
  has its own visual theme. The look is chunky pixel art with scanlines and CRT
  effects, backed by chiptune-style audio. Pressing R restarts the run at any
  point.


  The mouse is recommended, and the game uses pointer lock. The page marks it as
  version 1.0 and still under development. The creator credits AI assistance for
  the code, graphics, sounds and text.
