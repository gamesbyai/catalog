slug: doombreaker-carnage
title: "DOOMBREAKER: Carnage"
tagline: Run through ten zones of demons with four guns, then beat each zone's boss.
description: >-
  In this retro first-person shooter, each zone makes you hunt down every last
  enemy before you can fight its boss. A run covers ten zones, and clearing all
  of them finishes it.


  Four guns, including a pistol, a shotgun, a chaingun and a rocket launcher.
  Health, armor and ammo pickups scattered through the levels. Procedurally
  generated levels that change layout between runs. Tougher enemies the deeper
  you go. Strafe-jumping as part of the movement. Chiptune-style audio.


  Move with WASD and aim with the mouse. Left-click to fire. Press 1 to 4 to
  switch weapons. Press Space to jump and Shift to sprint. Press R to restart
  the run at any point. The mouse is recommended, and the game uses pointer
  lock.


  According to webXOS, AI assisted with the code, graphics, sounds and text. The
  game is labeled version 1.0 and still under development.
