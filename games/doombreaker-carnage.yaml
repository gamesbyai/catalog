slug: doombreaker-carnage
title: "DOOMBREAKER: Carnage"
tagline: Run through ten zones of demons with four guns, then beat each zone's boss.
description: >-
  Every zone makes you hunt down every last enemy on the level before you get to
  fight that zone's boss.


  A run is ten zones long, and clearing all of them finishes it. The enemies get
  tougher the deeper you go.


  You've got four guns on the number keys 1 to 4, a pistol, a shotgun, a
  chaingun and a rocket launcher. For everything else, health, armor and ammo
  pickups are scattered around the levels.


  Levels are generated procedurally, so the layout changes between runs.


  The audio is chiptune-style. Pressing R restarts the run at any point.


  You move with WASD, aim with the mouse and left-click to fire, while Space
  jumps and Shift sprints. Strafe-jumping is in there too. The mouse is
  recommended, and the game uses pointer lock.


  webXOS credits AI with assisting on the code, graphics, sounds and text. The
  game is labeled version 1.0 and still under development.
