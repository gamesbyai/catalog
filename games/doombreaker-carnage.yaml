slug: doombreaker-carnage
title: "DOOMBREAKER: Carnage"
tagline: Run through ten zones of demons with four guns, then beat each zone's boss.
description: >-
  You run through ten zones of demon-filled corridors with a timer ticking at
  the top of the screen, so every room is a race as much as a firefight. Each
  zone has a kill count to hit, and once you've cleared everything you face that
  zone's boss.


  The levels are generated procedurally, so the layout changes from run to run.
  A small map sits in the lower left corner, which comes in handy because the
  screen around you is mostly shadow.


  You start with a pistol that has infinite ammo, so you're never stuck
  empty-handed. Three more guns wait behind it: a shotgun, a chaingun and a
  rocket launcher, and the number keys swap between them.


  Health, armor and ammo pickups are scattered around, so grab them as you go to
  stay alive.


  Each zone has its own look and gets harder than the last, and the bosses are
  giant demonic monstrosities. The first zone is Hell's Antechamber, a dark, red
  place where the demons stare at you with glowing red eyes.


  Everything is drawn in chunky pixels with scanlines and CRT effects, and the
  audio is chiptune-style. Movement is the classic kind, with strafing, jumping
  and sprinting, so you can circle around enemies while you fire.


  A mouse is recommended, and the game supports pointer lock so the cursor stays
  put while you aim. If a run goes badly, one key restarts it.
