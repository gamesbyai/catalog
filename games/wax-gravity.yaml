slug: wax-gravity
title: Wax & Gravity
tagline: Land skateboard tricks and string them into combos before the clock runs out.
description: >-
  Each session starts with a minute and a half on the clock, and it ends when
  that runs out. In this 3D skateboarding game, you keep the session going by
  landing tricks, linking them into combos and clearing goals.


  Physics with urethane grip, air drag and rolling resistance. Gravity at 9.81
  meters per second squared. A goal of grinding along a rail or ledge for a full
  second.


  Every control is on the keyboard. Use W to push along and pump on ramps. Use S
  to brake. Use A and D to carve on the ground, spin midair and balance on
  rails. Hold Space to crouch, then let go to ollie. Use J for a kickflip, K for
  a heelflip and L for a shove-it. Land with the board beneath you and aimed
  where you're headed. Touch down sideways or mid-flip and you slam.
