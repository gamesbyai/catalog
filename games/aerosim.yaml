slug: aerosim
title: AeroSim
tagline: Pilot a rocket from one interstellar location to another.
description: >-
  AeroSim is a flight simulator for a rocket, set among interstellar locations.
  You pilot the rocket from one of them to the next, and the game treats each
  trip as a journey between places in space rather than a single short hop.


  The creator made it for Vibe Jam 2026 as a first attempt at building a flight
  simulator of this kind, using Cursor as the AI tool and Three.js for the 3D
  scene. The single-player jam build finished 207th of the 945 entries.


  The idea grew out of the creator's long-standing interest in flight
  simulators, applied here to spaceflight. Flying is the point: the focus stays
  on the act of piloting the rocket, with reaching the next destination as the
  goal of each trip.
