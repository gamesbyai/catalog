slug: aerosim
title: AeroSim
tagline: Pilot a rocket from one interstellar location to another.
description: >-
  AeroSim is a rocket flight simulator set among interstellar locations. The
  player pilots a rocket and flies from one destination to the next, treating
  the trip as a journey between places in space rather than a single short hop.


  The game grows out of the creator's long-standing interest in flight
  simulators, and it applies that interest to spaceflight. Its focus is on the
  act of flying itself, with travel between locations as the goal. It was
  entered in Vibe Jam 2026 as a single-player browser project.


  Cursor was part of the development process, and the 3D scene is rendered with
  Three.js. The project was made for the jam as a first attempt at building a
  flight simulator of this kind.
