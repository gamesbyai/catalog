slug: aerosim
title: AeroSim
tagline: Pilot a rocket from one interstellar location to another.
description: >-
  Pilot a rocket from one interstellar location to the next. AeroSim is a flight
  simulator for that rocket.


  Journeys between places in space, not a single short hop. Reaching the next
  destination as the goal of each trip.


  The idea grew out of RishavSharma12's long-standing interest in flight
  simulators, applied here to spaceflight. They made it as a first attempt at
  building a flight simulator of this kind.
