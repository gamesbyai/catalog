slug: all-in-texas-hold-em
title: All In Texas Hold'em
tagline: Play free, uninterrupted Texas Hold'em poker in your browser or on mobile.
description: >-
  You're the Guest at a green felt poker table, sharing it with six other
  seats that each show a name and a chip count. Everyone else sits down with
  500 chips while you get a modest 100, which leaves you as the smallest stack
  before a single card is dealt.


  Hit Play Now and the deal begins, with your two hole cards landing face up at
  the bottom of the table.


  A panel on the left keeps track of the hand by naming the current stage, such
  as pre-flop, and showing the total pot. When it's your turn you can fold,
  call, raise or push everything in with All In. The Call button helpfully
  spells out the exact amount you'd have to match, and small minus and plus
  buttons beside Raise let you nudge your bet up or down.


  Five empty slots sit in the middle of the felt, waiting for the community
  cards.


  Your opponents keep their cards face down, but they don't leave you completely
  in the dark. A little tag under each seat, like Call or Fold, shows what that
  player just did, and a seat that folds fades out.


  sebastianhox made it because they wanted to play Texas Hold'em online without
  ads getting in the way.
