slug: all-in-texas-hold-em
title: All In Texas Hold'em
tagline: Play free, uninterrupted Texas Hold'em poker in your browser or on mobile.
description: >-
  You sit as Guest at a green felt table with six other seats, each showing a
  name and a chip count. You start with 100 chips and the other seats start at
  500. Press Play Now to deal, and your two hole cards appear face up at the
  bottom of the table.


  A panel on the left names the current stage, such as pre-flop, and shows the
  total pot. On your turn you choose Fold, Call (the button shows the amount to
  match), Raise, or All In. Minus and plus buttons beside Raise change the raise
  amount.


  Five empty slots in the middle of the table are for the community cards.
  Opponents' cards stay face down, and small labels under their seats, such as
  Call and Fold, show what each seat did. The creator made it to play Texas
  Hold'em online without ads.
