slug: all-in-texas-hold-em
title: All In Texas Hold'em
tagline: Play free, uninterrupted Texas Hold'em poker in your browser or on mobile.
description: >-
  You play Texas Hold'em as Guest at a green felt table, looking at your two
  face-up cards while six named opponents keep theirs face down. Five empty
  slots sit in the middle, waiting for the community cards.


  Everything you do happens in one panel on the left, so the table itself stays
  clear.


  It names the stage of the hand, like pre-flop, and shows the total pot, with
  four buttons under that: fold, call, raise and All In. The call button has its
  price printed right on it, so you know what staying in costs before you
  commit.


  Raise comes with minus and plus buttons, so you can set the amount first.


  Each opponent has a chip count beside their name, and a small tag pops up over
  them when they call or fold. A folded player's seat fades out, which makes it
  easy to see who's still in the hand.


  You start with 100 chips while everyone else starts with 500, so you're the
  short stack from the first deal.


  The creator built it because they wanted to play poker online without ads.
