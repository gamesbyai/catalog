slug: vibe-oke
title: Vibe-oke
tagline: Play along with a song one lyric word at a time, in sync with the vocals.
description: >-
  Every lyric word is a playable note. You play along with the singer word by
  word, not just chasing a beat.


  Mr. Brightside by The Killers, loaded from the start. Score and accuracy
  tracked during play. A combo multiplier starting at x1. Global and song
  leaderboard rankings.


  Press Play to start what's loaded. If The Killers aren't your thing, search
  for and pick another track. Hit words as they reach the lane with five keys:
  A, S, D, J and K. Lyric timing may not match perfectly.


  roieambulo loves karaoke, which is where the playable lyrics idea came from.
play:
  url: https://vibe-oke.com
  embeddable: true
  platforms:
