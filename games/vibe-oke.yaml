slug: vibe-oke
title: Vibe-oke
tagline: Play along with a song one lyric word at a time, in sync with the vocals.
description: >-
  The game starts with Mr. Brightside by The Killers already loaded.


  Play with five keys, A, S, D, J and K, and strike each word as it reaches the
  lane. Every word in the lyrics becomes a note, so you're playing along with
  the singer one word at a time instead of just chasing a beat. roieambulo loves
  karaoke, and that's where the idea of playable lyrics came from.


  The song runs 3:43 long. Your score and accuracy are tracked as you play.


  A combo feeds a multiplier that starts at x1, and your health starts at 100%.


  Press Play to start whatever's loaded. If The Killers aren't your thing, you
  can search for and pick another track. Lyric timing may not match perfectly.
  There's also a leaderboard with Global and Song rankings.
