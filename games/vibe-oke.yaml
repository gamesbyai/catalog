slug: vibe-oke
title: Vibe-oke
tagline: Play along with a song one lyric word at a time, in sync with the vocals.
description: >-
  The game opens on a Track Ready card with Mr. Brightside by The Killers
  loaded. The card tells you to hit words as they reach the lane and shows five
  colored keys: A, S, D, J and K. Press Play to start the song.


  Every word in the lyrics becomes a note, so you play along with the vocals one
  word at a time instead of following only a beat. The left panel shows elapsed
  time out of 3:43, a progress bar, previous and next buttons, sync status,
  level, words per minute and a word count.


  The right side tracks your run. A feedback panel sits above a combo counter
  that feeds a multiplier starting at x1, and a health bar starts at 100%. Score
  and accuracy sit on the left.


  The Search Song button lets you pick another track, and a note on the card
  warns that lyric timing may not match perfectly. A leaderboard has Global and
  Song tabs.
