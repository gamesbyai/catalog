slug: little-flock
title: little flock
tagline: Tend a shared flock of sheep on a cozy farm with other players.
description: >-
  The start screen shows a painted valley with a stone cottage, a footbridge
  over a stream, a produce cart and a flock of pastel sheep, with a button to
  begin farm life. A 16-step tutorial walks you through putting up a shelter,
  adopting a first sheep, daily care and planting a garden.


  Day to day, you pet, feed and shear sheep and welcome newborn lambs. Seven
  crops can be planted, watered and harvested, and you can fill neighbor orders
  and upgrade the farm. To graze, whistle the flock together, walk to the meadow
  while they eat and drink, then lead them back home.


  The flock covers 12 breeds, five rarity tiers and six personalities. Paths
  connect the home farm to a flower meadow, a mushroom woodland and a stargazing
  highland. Your shepherd's skin, hair, clothes and hat can be changed with a
  live 3D preview.


  Farms are shared. Start one or join through an invitation code, and everyone
  on it uses the same coins, inventory, buildings and sheep, with chat and live
  presence. Day and night, rain and seasonal colors change the scenery, and
  sheep never die. The interface is in Simplified Chinese.
