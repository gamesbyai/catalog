slug: little-flock
title: little flock
tagline: Tend a shared flock of sheep on a cozy farm with other players.
description: >-
  Start your own farm or join a friend's with an invitation code. There you tend
  sheep that never die, and ripe crops that don't rot. The interface is in
  Simplified Chinese.


  Opening 16-step tutorial covering a shelter, a first sheep and a garden. Sheep
  you name, in 12 breeds, six personalities, five rarity tiers. Seven crops to
  plant, water and harvest, neighbor orders and farm upgrades. Paths from the
  home farm to a meadow, wood and stargazing highland. Restyling for your
  shepherd's skin, hair, outfit and hat. Shared farms with one pool of coins,
  items, buildings and sheep, plus live presence and chat. A gentle soundtrack.


  Pet, feed and shear your sheep each day, and welcome newborn lambs. Whistle to
  gather the flock, walk out to the meadow while they eat and drink, then bring
  them home again.


  Everything in the game, from the 3D world and game systems to the multiplayer
  server, art, audio and deployment, came out of one single run of an AI coding
  agent.
