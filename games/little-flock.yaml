slug: little-flock
title: little flock
tagline: Tend a shared flock of sheep on a cozy farm with other players.
description: >-
  You start on a painted title screen of a sunny valley: a cottage, a windmill,
  a stream with a wooden bridge, a fruit cart, and a flock of pastel sheep in
  pink, mint and lavender. A big button starts your farm life, and the interface
  is in Simplified Chinese.


  Once you're in, a 16-step introduction walks you through building a shelter,
  adopting your first sheep, learning the daily care, and planting a garden.
  After that you pet, feed and shear the sheep, and you can name them and
  welcome newborn lambs.


  There are 12 breeds, five rarity tiers and six personalities to collect.


  Grazing is a little routine of its own. You whistle the flock together, walk
  them to the meadow, let them eat and drink, then lead them home. Back at the
  farm you grow seven crops, water and harvest them, fill neighbor orders, and
  upgrade the place.


  The valley is connected by paths that run from the home farm to a flower
  meadow, a mushroom woodland and a stargazing highland.


  You can also dress your shepherd, with a live 3D preview for skin, hair,
  clothes and hat. Day and night, rain, seasonal colors, firefly glow and warm
  window lights change the scenery, which is a lot of atmosphere for a farm this
  size.


  It's multiplayer, so you create a farm or join one with an invitation code.
  Friends share the same coins, inventory, buildings and sheep, and you can see
  each other and chat live. Sheep don't die and ripe crops don't rot, which
  makes it a forgiving place to leave things.


  Codex wrote the whole thing from a single goal run: the 3D world, the server,
  the art, the audio and the deployment.
