slug: tankz-arena
title: "Tankz: Arena"
tagline: Drive a tank through waves of enemies, pick upgrades, and fight bosses
  until you die.
description: >-
  You start in a dark arena as a glowing white tank, with pink enemy tanks
  already closing in and thin blue walls scattered across the floor.


  Moving and aiming are separate, so you can slide one way while the barrel
  points another. Left-click shoots, right-click sends out a rocket, and Shift
  boosts you away when things get crowded. The panel in the top left keeps track
  of health, boost, level, score, rocket count and your gun stats.


  Enemies arrive in waves, and a countdown at the top tells you how many seconds
  are left before the next one. After every fifth wave a boss turns up.


  A purple Multi-Burst pickup is sitting near the bottom edge, and E sets it
  off.


  When you level up, the game deals out three random upgrades and you take one
  of them, so the tank you end up with depends on the draw. The stat readout
  lists damage, fire rate, speed, bullet speed and shots, which makes it easy to
  check what a pick actually changed.


  Now and then a chain lightning pickup shows up, and the creator calls its
  thirty-second effect a highlight, which is a big promise for one power-up. The
  same description admits you'll die eventually, and hopes it isn't in the first
  wave.
