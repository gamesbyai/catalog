slug: tankz-arena
title: "Tankz: Arena"
tagline: Drive a tank through waves of enemies, pick upgrades, and fight bosses
  until you die.
description: >-
  You drive a tank in a 2D top-down arena and fight wave after wave until your
  tank is destroyed. Aim with the mouse, fire the main gun with left-click,
  launch rockets with right-click, press Shift to boost, and press E to trigger
  Multi-Burst.


  A boss arrives every five waves. Each level-up offers three random upgrades,
  and you choose one of them. Chain lightning bolts also drop as pickups, and
  the creator says each one powers up the next thirty seconds of play.


  The game is a fast-paced arcade roguelite tagged Action and Survival. Runs are
  built around the loop of surviving waves, collecting upgrades, and facing the
  next boss. The creator's AI disclosure covers code, graphics, sounds and text,
  with AI used as an assistant.
