slug: claude-ai-mini-snake-game
title: claude ai mini snake game
tagline: Steer a growing snake around the board, eating food without hitting yourself.
description: >-
  A small browser take on the classic Snake. You guide a snake around a canvas
  board, collecting food to grow longer while avoiding collisions. Each run
  continues until the snake runs into an obstacle, and the goal is to survive
  and stretch out as far as possible.


  The game is built in plain JavaScript with no frameworks, drawing to an HTML5
  canvas. It is designed to be responsive, so the layout adapts to different
  screen sizes, and it includes touch controls for phones and tablets alongside
  standard desktop play.


  The repository describes the project as built entirely with Claude AI, and the
  creator's tags mark it as AI-generated. It is a compact example of a familiar
  arcade format that runs directly in the browser.
