slug: splitscreen
title: Splitscreen
tagline: Play local multiplayer rounds on a shared screen, using phones as controllers.
description: >-
  Splitscreen is a local multiplayer game meant for a shared screen. One display
  shows the action while each player uses a phone as a remote controller, so no
  extra gamepads are needed. Players gather around the screen and take part in
  the game's rounds together, each steering from their own device.


  The setup runs through AirConsole, which turns everyday phones into
  controllers. That keeps the barrier to joining low: a screen, a few phones,
  and people in the same room are what it takes to start playing. The game
  blends action, puzzle, and strategy elements, so rounds can call for quick
  reactions as well as some planning ahead. It was entered in Vibe Jam 2026 and
  renders its scenes with Three.js.
