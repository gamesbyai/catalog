slug: hero-nearby
title: Hero Nearby
tagline: Run through a neighborhood as a developer and fix people's tech problems.
description: >-
  In this 2D endless runner, you play a developer who helps neighbors with their
  tech trouble. Press Play to send the developer off at a run.


  Being expected to fix everything, printers included. Cable management, the
  inevitable enemy of every developer. Programmer stereotypes, played for
  laughs. Points that climb as you run, with distance counted alongside.


  __rockbiter got the idea from Informatici di Quartiere, an Italian non-profit
  that helps local people with everyday tech problems. The group runs tech
  workshops and has also made educational video games. The game retells that
  work in a light, funny way.
