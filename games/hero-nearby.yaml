slug: hero-nearby
title: Hero Nearby
tagline: Run through a neighborhood as a developer and fix people's tech problems.
description: >-
  The player runs a developer along a pixel-art Italian street, helping
  neighbors with their tech problems in a 2D endless runner. The run is scored
  in points, labeled pti, with a distance counter in meters beneath it. Both
  start at zero and climb as the character runs.


  A row of counters across the top tracks seven kinds of things, each starting
  at x0. The icons include a printer, a person, two camper vans, a tangle of
  cables, a purple bug and a figure lying down. The jokes aim at programmer
  stereotypes: being asked to fix everything, printers included, and the cable
  management every developer has to face.


  The street scrolls past pastel houses with orange roofs, a bell tower, olive
  trees and a signpost reading Help This Way. The game opens on a Play button,
  and the developer carries a laptop. The creator took the idea from Informatici
  di Quartiere, an Italian non-profit that helps local communities with everyday
  digital problems.
