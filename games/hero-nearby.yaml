slug: hero-nearby
title: Hero Nearby
tagline: Run through a neighborhood as a developer and fix people's tech problems.
description: >-
  Hero Nearby is a 2D endless runner in which the player takes the role of a
  developer moving through a neighborhood. Along the way, residents need help
  with everyday tech problems, and the runner steps in to fix their bugs while
  avoiding obstacles that stand in the way.


  The game is inspired by Informatici di Quartiere, an Italian non-profit
  association that helps local communities with digital challenges through
  education, workshops, and educational video games. The story follows that
  mission with a playful tone.


  Humor runs through the setting, poking fun at programmer stereotypes.
  Developers get asked to fix everything, printers included, and they face the
  eternal enemy of cable management. It was built for Vibe Jam 2026 and runs in
  the browser on 3D web tech, with mobile support.
