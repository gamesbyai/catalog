slug: lunar-lander
title: Lunar Lander
tagline: Steer a lunar module with thrust and tilt to land softly on rough terrain.
description: >-
  Lunar Lander is a retro-style landing game with one task: get the module down
  in one piece. You pilot it over a jagged moonscape, using thrusters and tilt
  to control the descent, and every attempt ends at the surface, either with a
  gentle touchdown or with a crash.


  It follows the old Lunar Lander arcade cabinets and keeps the format tight,
  focused on that single task. The creator reached for Cursor during Vibe Jam
  2026, wanting a compact version that was easy to tweak and share with friends.


  The uneven terrain makes the landing spot matter as much as your speed. Every
  approach is a careful judgment of angle and thrust, and coming in too hard
  ends the attempt. It is a single-player game in the browser.
