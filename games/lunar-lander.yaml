slug: lunar-lander
title: Lunar Lander
tagline: Steer a lunar module with thrust and tilt to land softly on rough terrain.
description: >-
  Rotate the lander and fire the main thruster to set it down on a jagged lunar
  landscape. A soft touchdown counts as a landing, and a crash ends the attempt.
  The look is retro arcade, modeled on the old Lunar Lander cabinets the creator
  liked.


  A destination screen opens the game with five worlds to deploy to: Moon, Mars,
  Europa, Venus and Kepler-452b. The Moon is the low-gravity world for learning
  the basics. Mars has heavier pull and rough terrain, and Europa has ultra-low
  gravity over fractured ice.


  Venus brings dense clouds and crushing gravity, and its card says it unlocks
  after you complete the mission on Europa. Kepler-452b is an Earth-like world
  with a forgiving descent.


  A small panel on the destination screen lists the controls and names three
  landing pad types: Easy, Hard and Extreme. A sound toggle sits in the top
  corner, and P pauses the descent.
