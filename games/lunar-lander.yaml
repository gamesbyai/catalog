slug: lunar-lander
title: Lunar Lander
tagline: Steer a lunar module with thrust and tilt to land softly on rough terrain.
description: >-
  The same little lander gets sent to five different worlds, and most of them
  pull on it in their own way. On each one you tilt the craft and burn the main
  thruster to ease it onto a jagged stretch of ground. Come down soft and it
  counts as a landing, but crash and that attempt's over.


  The Moon is the low-gravity starter world, meant for learning the basics.
  Oddly enough, the Earth-like Kepler-452b gets a forgiving descent of its own,
  so the Moon isn't the only gentle stop on the list.


  Mars pulls harder and has rough terrain, while Europa barely has any gravity
  at all over a surface of fractured ice.


  Venus is the heavy one, with dense clouds and crushing gravity. Its card says
  it opens up only after you complete the mission on Europa. It's a neat bit of
  ordering, with that crushing gravity waiting behind Europa's ultra-low pull.


  A tidy little panel on the destination screen that opens the game lays out the
  keys and names three landing pad types, called Easy, Hard and Extreme.


  The left and right arrows rotate the lander, while up or Space fires the
  thruster. P pauses the descent, and there's a sound toggle tucked in the top
  corner.


  The retro arcade look is modeled on the old Lunar Lander cabinets bobmute2
  liked. They wanted a tight version of their own to tweak and share with
  friends.
