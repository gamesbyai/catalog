slug: lunar-lander
title: Lunar Lander
tagline: Steer a lunar module with thrust and tilt to land softly on rough terrain.
description: >-
  Tilt the lander and burn its thruster to ease it onto jagged ground on five
  different worlds. Most of the worlds pull on the lander in their own way. A
  soft touchdown counts as a landing, and a crash ends that attempt.


  The Moon, a low-gravity starter world meant for learning the basics.
  Kepler-452b, an Earth-like world with a forgiving descent of its own. Mars,
  with stronger gravity and rough terrain. Europa, with almost no gravity over
  fractured ice. Venus, the crushing-gravity one, unlocked after the Europa
  mission. Three landing pad types, Easy, Hard and Extreme.


  Use the left and right arrows to rotate. Press Up or Space to fire the
  thruster. Press P to pause the descent.


  bobmute2 liked the old Lunar Lander cabinets. They wanted a browser version
  they could tweak and share with friends.
