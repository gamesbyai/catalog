slug: signal-lost
title: Signal Lost
tagline: Watch autonomous AI vessels explore ruins and nudge them with limited commands
description: >-
  Signal Lost has you watching a row of autonomous vessels pick their way
  through the ruins of a ruined Earth, and you barely steer them at all. Each
  vessel writes its own mission log as it goes, so the screen fills with columns
  of scrolling text, one per machine.


  You're the operator, which here means an observer with a few small nudges.


  Each vessel belongs to one of five AI cultures: Determinists, Stochasts,
  Swarm, Recursive and Archivists. The log text is reworded to suit the culture,
  so a Determinist checkpoint and a Stochast whisper-trace don't read alike.
  Missions run through seven phases, from idle and signal to breach, fault, core
  and reboot.


  Weather and other global events hit every vessel at once, and they can damage
  your connection.


  That connection is a satellite network that wears down over time, and if it
  gets too low you lose control. It's a neat way to keep your influence limited,
  since the thing you rely on is slowly failing.


  You get three commands. Boost improves a vessel's next tick, Ping forces a
  scan that might turn up loot, and Inject sends a message into the world that
  shows up as a sign, graffiti or a broadcast the vessel runs into. Boost and
  Ping each have a cooldown, so you can't spam them.


  The story behind it is that humanity left after a war with the Architects. The
  logs are built from generation tables, and the setting is adapted from Eclipse
  Phase.
