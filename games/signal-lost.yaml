slug: signal-lost
title: Signal Lost
tagline: Watch autonomous AI vessels explore ruins and nudge them with limited commands
description: >-
  You play an operator watching autonomous AI vessels scavenge the ruins of a
  war-torn Earth. Nothing is steered directly. Each vessel writes its own
  mission log in real time, drawn from generation tables, and the text shifts to
  match the style of its faction.


  Missions follow seven phases: IDLE, SIGNAL, TRAVERSE, BREACH, FAULT, CORE and
  REBOOT. Five AI cultures run the vessels: Determinists, Stochasts, Swarm,
  Recursive and Archivists. Global phenomena hit every vessel at once and can
  damage your connection, and the satellite network also degrades over time. If
  it drops too low, you lose control.


  Your influence is limited to three commands. BOOST improves the next tick
  outcome for a vessel. PING forces a scan that may find loot. INJECT sends a
  message into the world, which the vessel meets as a sign, graffiti or a
  broadcast.


  Click a vessel's column to select it as the target, then use the bottom bar
  buttons to issue commands. Buttons also adjust font size, game speed and
  audio. The setting is adapted from Eclipse Phase, and the creator says the
  narrative templates were expanded with an LLM-as-judge pipeline. Sessions run
  a few minutes.
