slug: signal-lost
title: Signal Lost
tagline: Watch autonomous AI vessels explore ruins and nudge them with limited commands
description: >-
  Signal Lost has you watch autonomous AI vessels comb through the ruins of a
  war-torn Earth, and you steer none of them. Each vessel writes its own mission
  log live from generation tables, and the wording changes to fit its faction. A
  session runs a few minutes.


  Five AI cultures (Determinists, Stochasts, Swarm, Recursive, Archivists). Log
  glitches, like an Archivist convinced it's 2043. Seven phases for every
  mission, from IDLE through SIGNAL, TRAVERSE, BREACH, FAULT and CORE to REBOOT.
  Global phenomena that hit all vessels at once and can damage your connection.
  Satellite connection starting at 5 out of 5 that wears down, with control lost
  when it sinks too low. Just three operator commands.


  Click a vessel's column to make it your command target, then use the buttons
  to issue a command. BOOST improves the outcome of a vessel's next tick. PING
  forces a scan that may turn up loot. INJECT sends a message into the world
  that a vessel meets as a sign, graffiti or broadcast. BOOST and PING go on
  cooldown after each use.


  vuvko adapted the setting from Eclipse Phase. According to the creator, the
  narrative templates were expanded over several rounds with an LLM-as-judge
  pipeline.
