slug: strait-of-warmuz
title: Strait Of Warmuz
tagline: Build up and battle five rivals in a last-player-standing war.
description: >-
  Strait Of Warmuz is a multiplayer strategy war game for six players. Each
  participant builds up and fights using an inventory of resources, and the
  match continues until only one player remains. The goal is simple: outlast
  everyone else and be the last man standing.


  The game mixes action with strategy, so decisions about what to build and when
  to fight matter as much as reacting during a clash. Six-person matches keep
  the pressure on, since every rival is also a target and a threat. It runs in
  the browser and was rendered with Three.js.


  The creator entered it in Vibe Jam 2026 and says they have been making web
  games for a long time. According to the creator, AI tools made the process
  much easier, and Cursor is the tool named for its development.
