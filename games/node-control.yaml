slug: node-control
title: Node Control
tagline: Fight rivals for control of nodes inside a neural network in a
  multiplayer .io arena.
description: >-
  The first screen is a dark, glowing title card with a box for your name and
  six skins to pick from: Volt, Blade, Crown, Dart, Trident and Phantom. There's
  a server picker set to Auto with its ping beside it, and a Connect button that
  drops you in with other players.


  Once you're in, you steer by pointing your cursor where you want to go.


  The main move is drawing a loop that comes back to your own territory, which
  claims everything inside it. Your trail is the risk, because the card warns
  you not to cross your own line.


  It's a competitive multiplayer .io game set inside a neural network, so you're
  fighting other players for influence there. The creator points to a few skills
  that keep opening up: timing your boost, deciding how long a trail to risk,
  fighting over contested infections, and knowing when to extend versus close a
  loop.


  That's a lot of depth for rules that fit on three short lines.


  The creator built it to back up a claim, answering Pieter's premise by saying
  AI is already close enough to ship a commercially viable game. That explains
  the multi-region servers, mobile support, telemetry and the music player
  tucked in the corner, which is a studio-sized pile of extras.
