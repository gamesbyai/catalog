slug: node-control
title: Node Control
tagline: Fight rivals for control of nodes inside a neural network in a
  multiplayer .io arena.
description: >-
  Node Control is a competitive multiplayer .io game set inside a neural
  network. Players fight for influence over the network by extending trails,
  infecting nodes, and contesting territory with other players in real time. It
  runs in the browser on desktop and mobile.


  The design aims to be easy to pick up while leaving room to improve. Boost
  timing, trail length, contested infections, and the choice between extending a
  trail or closing it all shape how a round goes. The creator also put work into
  the surrounding stack, including netcode, multi-region deployment, telemetry,
  and an ad-friendly structure.


  The creator built it with Claude Code as an entry in Vibe Jam 2026, aiming to
  show that AI can already help ship a commercially viable game. The rendering
  uses Three.js.
