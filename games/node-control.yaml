slug: node-control
title: Node Control
tagline: Fight rivals for control of nodes inside a neural network in a
  multiplayer .io arena.
description: >-
  A glowing cyan panel greets you with a name field, six skins (Volt, Blade,
  Crown, Dart, Trident and Phantom) and a server picker that starts on Auto. Hit
  Connect and you're dropped straight into a live match with other people.
  There's even a track called Neural Ambient already playing in the corner, a
  fitting name for a game set inside a neural network.


  Steering couldn't ask much less of you, because you just point your cursor
  where you want to go.


  Your job is to grab territory. You head out of your own area and draw a loop
  back into it, and everything inside that loop becomes yours.


  Just don't cross your own trail, as the on-screen tips warn in bright orange.
  Everyone else in the match is after the same ground, all of them fighting for
  influence inside a neural network. It's a shared, competitive space rather
  than a solo board.


  According to tiepb, what separates players is boost timing, how long you let
  your trail get, contested infections, and knowing when to keep extending a
  trail versus closing it — a lot packed behind three lines of instructions.


  A small music player sits in the top-left corner and lets you skip tracks. A
  help button and the settings are right next to it.


  Node Control was built by tiepb as a demonstration of a commercially shaped
  .io game, with servers in multiple regions, mobile support and telemetry.
