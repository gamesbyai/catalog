slug: node-control
title: Node Control
tagline: Fight rivals for control of nodes inside a neural network in a
  multiplayer .io arena.
description: >-
  You share a live match with other players, and all of you are going after the
  same ground inside a neural network. Press Connect and you join that match
  right away. Your goal is to grab territory.


  Six skins called Volt, Blade, Crown, Dart, Trident and Phantom. Servers in
  several regions, starting on Auto. The Neural Ambient track, already playing
  when you join.


  Point your cursor where you want to go. Leave your own area, then draw a loop
  back into it. The ground inside becomes yours. Don't cross your own trail.


  tiepb built Node Control as a demonstration of a commercially shaped.io game,
  with mobile support and telemetry. According to tiepb, what separates players
  is boost timing, trail length, contested infections, and choosing between
  extending a trail and closing it.
