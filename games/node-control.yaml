slug: node-control
title: Node Control
tagline: Fight rivals for control of nodes inside a neural network in a
  multiplayer .io arena.
description: >-
  The start screen asks for a name, offers six skins (Volt, Blade, Crown, Dart,
  Trident, Phantom) and a server picker set to Auto, then a Connect button drops
  you into a live online match. You steer by pointing your cursor where you want
  to go.


  The goal is to claim territory. Leave your own area, then draw a loop back to
  it, and everything inside the loop becomes yours. The on-screen tips also say
  not to cross your own trail.


  Matches are competitive and shared with other players, who fight for influence
  inside a neural network. The creator lists boost timing, trail length,
  contested infections, and the choice between extending a trail and closing it
  as the skills that separate players. A music player in the corner lets you
  skip tracks, and a help button and settings sit beside it.


  The creator built it as a demonstration of a commercially shaped .io game,
  with multi-region servers, mobile support, and telemetry.
