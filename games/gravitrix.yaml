slug: gravitrix
title: Gravitrix
tagline: Stack wobbly physics blocks against other players in a chaotic
  multiplayer match.
description: >-
  Gravitrix is a stacking game where the blocks refuse to sit still. You build
  structures from Tetris-style pieces, but the handling is awkward and
  physics-driven in the manner of QWOP, so every block you place can wobble,
  slide or topple while the simulation pushes back.


  It sets two familiar ideas against each other: the tidy planning of a stacking
  puzzle and the unpredictable behavior of physical objects. You stack against
  other players online, and having them in the match adds to the chaos. It is a
  casual puzzle game that runs on Three.js in desktop and phone browsers.


  The creator describes recently starting to make the games they had long wanted
  to make. This one, put together with Claude Code, came 216th of the 945 Vibe
  Jam 2026 entries.
