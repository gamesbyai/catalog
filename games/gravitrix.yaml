slug: gravitrix
title: Gravitrix
tagline: Stack wobbly physics blocks against other players in a chaotic
  multiplayer match.
description: >-
  Stack Tetris-style pieces into structures in Gravitrix, a casual puzzle game.
  Every block you place can wobble, slide or topple while the simulation pushes
  back.


  Online matches against other players. Extra chaos from players sharing the
  match. Awkward, physics-driven handling in the manner of QWOP.


  According to the creator, they recently started making the games they had long
  wanted to make. Gravitrix is one of those games.
