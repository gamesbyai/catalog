slug: gravitrix
title: Gravitrix
tagline: Stack wobbly physics blocks against other players in a chaotic
  multiplayer match.
description: >-
  Gravitrix is a multiplayer stacking game that mixes Tetris-style piece
  building with the awkward, physics-driven handling associated with QWOP.
  Players work to place blocks into stable structures while the physics
  simulation pushes back, so every placement can wobble, slide, or topple.


  The appeal is the clash between two familiar ideas: the tidy planning of a
  stacking puzzle and the unpredictable behavior of physical objects. Playing
  alongside others adds to the chaos. It runs in the browser, is built on
  Three.js, and supports mobile play.


  It was entered in Vibe Jam 2026, where it placed 216th among 945 entries. The
  creator says they built it with Claude Code, and describes recently starting
  to make games they had long wanted to make but lacked time for.
