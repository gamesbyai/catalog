slug: zombow
title: Zombow
tagline: Shoot arrows at an endless zombie horde and keep moving to survive.
description: >-
  Zombow is a browser-based 3D archery survival game. Zombies spawn without end,
  and the only weapon is a bow. A run comes down to staying alive: you move
  around the arena, line up shots, and thin out the horde before it closes in.


  The game leans on atmosphere. Thick fog limits how far you can see, and
  spatial audio helps place threats around you, so the tension comes as much
  from what you can't see as from the zombies on screen. The pacing takes cues
  from classic arcade survival shooters, with quick, high-pressure rounds.


  The creator built it with Cursor and Three.js, describing the process as vibe
  coding. The audio is described as AI-generated, and the stated goal was a
  frightening horde experience that runs entirely in the browser.
