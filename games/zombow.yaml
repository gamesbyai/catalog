slug: zombow
title: Zombow
tagline: Shoot arrows at an endless zombie horde and keep moving to survive.
description: >-
  A hooded archer against a zombie horde that never stops spawning. The bow is
  your only weapon.


  Thick fog that cuts how far you can see. Spatial audio for telling where
  threats come from. Pacing borrowed from classic arcade survival shooters.


  Keep moving, line up shots and thin the horde before it closes in. Jump to get
  clear, and scroll to zoom in and out.


  sandman_sh calls the way it was built vibe coding, and the audio is
  AI-generated. They were after a frightening horde.
