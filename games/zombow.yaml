slug: zombow
title: Zombow
tagline: Shoot arrows at an endless zombie horde and keep moving to survive.
description: >-
  You're an archer seen from behind, standing in a low-poly grassland dotted
  with trees, bushes, rocks and a banana palm. The bow is all you've got, and
  zombies keep heading your way, so you shoot while you keep moving.


  The mouse aims and the left button looses the arrow, so every shot is
  something you line up yourself.


  WASD walks you around and Space jumps. The scroll wheel zooms the camera,
  which is a sensible thing to have when you'd rather pull back and see what's
  coming, or move in tight to line up one shot.


  The zombies don't stop spawning, so there's never a moment where the field is
  truly clear.


  Your health bar sits in the top left and starts at 100. The current wave
  number is at the top center, while your kill count sits in the top right.


  The creator took inspiration from old-school arcade shooters about surviving a
  crowd, and wanted to see that rush work in a browser. Most of the effort went
  into fog and sound made with AI, so threats are meant to be placed around you
  in space. They vibe coded the whole thing from scratch.
