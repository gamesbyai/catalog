slug: zombow
title: Zombow
tagline: Shoot arrows at an endless zombie horde and keep moving to survive.
description: >-
  You play a hooded archer, and the zombies just keep spawning. The bow is your
  only weapon, and a run comes down to staying alive while you move around the
  arena, line up shots and thin out the horde before it closes in. You can jump,
  too.


  Thick fog cuts down how far you can see, and spatial audio tells you where
  threats are coming from.


  The pacing borrows from classic arcade survival shooters. Scrolling zooms in
  and out.


  It was built through what sandman_sh calls vibe coding, and the audio is
  described as AI-generated. The stated goal was a frightening horde experience
  that runs entirely in the browser.
