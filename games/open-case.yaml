slug: open-case
title: open case
tagline: Read evidence, spot contradictions, and answer six questions to close a
  homicide case.
description: >-
  You play a investigator handed a reopened homicide file. Cole Vance, a
  winemaker's brother, washed up on the Sonoma Coast in dive gear, and the
  sheriff ruled it an accidental free-diving drowning. Your task is to confirm
  or overturn that ruling.


  The evidence is split into 18 files in a side dock: a case briefing, persons
  of interest, coast photos, cellar logs, sale and alibi documents, and witness
  messages. Each source tells part of the story, so you cross-check the timeline
  and look for contradictions. The briefing points you to the coast first.


  A Casebook sits beside the files with six dropdown answers, grouped under
  physical and proof. Questions cover what Cole Vance died from, where he really
  died, what the beach scene was, the fatal tell, and who lied for Marcus Vance,
  the half-brother and prime suspect. Once the answers are filled in, you send
  your final report.
