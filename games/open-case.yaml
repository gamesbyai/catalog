slug: open-case
title: open case
tagline: Read evidence, spot contradictions, and answer six questions to close a
  homicide case.
description: >-
  You play an investigator who's been handed a reopened homicide file. Cole
  Vance washed up on the Sonoma Coast in dive gear, the sheriff called it an
  accident, and you're there to confirm that ruling or overturn it.


  The evidence sits in a dock on the left, split into persons of interest, the
  coast, the cellar, sale and alibi papers, and witness statements. That's 18
  files, and the briefing warns that every source tells part of the truth but
  none tells all of it, so you can't just trust one.


  Marcus Vance, Cole's half-brother and the estate operator, is named as the
  prime suspect.


  A timeline strip runs along the bottom, from Cole arriving at the estate on
  April 14 to the body turning up on April 19, with a signing date on April 22
  after that. It's handy because you can hold each statement up against actual
  dates.


  There's even a sticky note on the desk that says to ask Tom, which is a funny
  little nudge.


  On the right is the Casebook, a paper notepad with six dropdown answers. You
  choose the cause of death, the real death location, what the beach scene was,
  the fatal tell, who lied for Marcus, and Marcus's motive. Then you press Send
  Report, which forces you to commit to one theory instead of just piling up
  clues.


  The whole thing looks like a case file left on a dark wooden desk, with amber
  type and a paper notepad, and there's a difficulty setting in the dock too.
