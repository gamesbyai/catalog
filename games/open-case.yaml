slug: open-case
title: open case
tagline: Read evidence, spot contradictions, and answer six questions to close a
  homicide case.
description: >-
  You're an investigator handed a homicide file that was reopened six months
  after the sheriff closed it. Cole Vance, a winemaker's brother, washed up on
  the Sonoma Coast in dive gear, and the sheriff ruled his death an accidental
  free-diving drowning. Your job is to confirm or overturn that ruling.


  Marcus Vance, Cole's half-brother who runs the estate, named as prime suspect
  from the start. The key stretch, from Cole's April 14 arrival at the Vance
  estate to his body turning up on April 19. A signing date on April 22. Sticky
  note with an HVAC anomaly, a service gate and a note to ask Tom. Casebook of
  six questions, split between physical evidence and proof. Coast-first lead in
  the briefing, against an official story blaming the water.


  Read all eighteen files: the briefing, the persons-of-interest list, coast
  photos, cellar logs, sale and alibi documents, and witness messages. Each
  source holds only part of the story, so cross-check the timeline and look for
  places where they contradict each other. Answer the Casebook's questions on
  what Cole died from, where he really died, what the beach scene was, the fatal
  tell, who lied for Marcus and Marcus's motive. Once every answer is filled in,
  send your final report.
