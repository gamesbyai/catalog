slug: typeit-hero
title: TypeIt Hero
tagline: Practice touch typing by playing, so kids learn to type without looking down.
description: >-
  TypeIt Hero has you type each letter at the moment it crosses a line.


  Hero Mode, the game's name for this typing play. More keys unlocked level by
  level, built to teach the keyboard bit by bit. Five misses in a row to restart
  the run.


  Enter your name before you press Play to start a run. Press Stop to end a run.
  Change the difficulty from the dropdown; it starts on 3 (Casual) when the game
  loads. Use the second dropdown to switch the keyboard layout away from QWERTY
  (English).


  _AnnaCates is a parent of four. They wanted their oldest child, who is 9, to
  learn to type without looking at the keyboard. According to _AnnaCates,
  watching her type is painful. They built the game to make that practice more
  fun.
