slug: typeit-hero
title: TypeIt Hero
tagline: Practice touch typing by playing, so kids learn to type without looking down.
description: >-
  TypeIt Hero has letters drifting across the screen, and you press the matching
  key right when each one crosses the line. You start with a small set of keys,
  and each new level unlocks more of them.


  So you're learning the whole keyboard a few letters at a time, instead of all
  at once.


  A row of counters up top tracks your score, level, combo, and misses, plus
  your best score. The misses counter reads out of five, because five misses in
  a row sends you back to the start.


  Before you begin, you can type in a name, pick a difficulty from the dropdown
  (it's set to Casual at first), and choose a keyboard layout. QWERTY in English
  is the default, which is a considerate option for anyone who types on
  something else.


  The creator has four kids, and watching the oldest, who's nine, hunt for keys
  was painful. So the aim is to get her typing without looking down at the
  keyboard, and to make that practice fun enough that she'll want to do it.
