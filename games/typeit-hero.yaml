slug: typeit-hero
title: TypeIt Hero
tagline: Practice touch typing by playing, so kids learn to type without looking down.
description: >-
  TypeIt Hero asks you to type each letter as it crosses the line. You enter a
  name on the start card, press Play, and hit the matching key for every letter.
  Levels unlock more keys as you go, so the set of letters you need grows over
  time.


  A bar along the top shows score, level, combo, misses out of five, and your
  best score. Miss five in a row and the run restarts. A dropdown sets the
  difficulty, which reads 3 — Casual on load. Another switches the keyboard
  layout from QWERTY (English). Play and Stop buttons start and end a run, and a
  fullscreen button sits in the corner of the playfield.


  The creator is a parent of four who wanted their oldest child, age 9, to learn
  to type without looking at the keyboard, and built the game to make that
  practice more fun. A link in the top left leads to more typing games.
