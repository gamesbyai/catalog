slug: sky-walker
title: SKY WALKER
tagline: Keep your balance on a tightrope above a neon city while storms and
  wind push you off.
description: >-
  SKY WALKER puts you on a tightrope strung high above a neon-lit cyberpunk
  city. You play a wire walker working your way forward while keeping the
  balance pole centered. Each step is a small fight against the pull of gravity,
  and one bad lean can end the run.


  The creator drew on the tension of real high-wire walkers and aimed for
  something demanding and frustrating on purpose. They state that it was made
  with the Gemini app, and it runs on Three.js. It ranked 126th of 945 in Vibe
  Jam 2026.


  The core mechanic is deliberately simple, so the pressure comes from around
  you. Storms grow more violent the farther you get, and unpredictable gusts
  shove you off center. Below, a procedurally generated cityscape glows to sell
  the vertigo.
