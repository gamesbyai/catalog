slug: sky-walker
title: SKY WALKER
tagline: Keep your balance on a tightrope above a neon city while storms and
  wind push you off.
description: >-
  A walker crosses a tightrope above a city. Once started, the walker keeps
  moving on its own, and you hold the pole centered so it stays upright.


  Unpredictable storms and winds pushing against the walker. Escalating weather
  tied to distance covered. Procedurally generated city. A leaderboard.


  Press W or Up once to start. Use A and D, or left and right arrows, to correct
  the balance.


  iboualissouf took inspiration from the tension of real high-wire walkers and
  built the game around that job. They say they love extremely challenging and
  frustrating games, and this one leans toward frustrating difficulty on
  purpose.
