slug: sky-walker
title: SKY WALKER
tagline: Keep your balance on a tightrope above a neon city while storms and
  wind push you off.
description: >-
  SKY WALKER is a high-altitude balancing game. You play a wire walker crossing
  a tightrope strung above a neon-lit cyberpunk city, keeping your balance pole
  centered while working your way forward. Each step is a small fight against
  the pull of gravity, and one bad lean can end the run.


  The core mechanic is deliberately simple, but the surroundings keep raising
  the pressure. Storms grow more violent as you go, and unpredictable gusts
  shove you off center. The procedurally generated cityscape glows below to sell
  the vertigo. The creator drew on the tension of real high-wire walkers and
  aimed for a demanding, frustrating challenge.


  The game runs in the browser on Three.js and supports mobile play. It was a
  Vibe Jam 2026 entry, and the creator states that it was made with the Gemini
  app.
