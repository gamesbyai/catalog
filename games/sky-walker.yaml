slug: sky-walker
title: SKY WALKER
tagline: Keep your balance on a tightrope above a neon city while storms and
  wind push you off.
description: >-
  You control a walker out on a tightrope with a balancing pole. You press W or
  Up just once to get him going, and from then on he keeps walking forward by
  himself. All that's left for you is holding that pole centered so he stays
  upright, and it's hard to imagine a job more stripped-down than that.


  A and D or the left and right arrows correct the balance, while storms and
  winds you can't predict keep pushing against you. The weather gets more
  violent the farther you advance.


  The city is generated procedurally. The game also has a leaderboard.


  iboualissouf took inspiration from the tension of real high-wire walkers and
  built the whole game around that single job of keeping the pole centered.


  iboualissouf also says they love games that are extremely challenging and
  frustrating. This one leans toward frustrating difficulty on purpose.
