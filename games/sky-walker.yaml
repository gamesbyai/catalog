slug: sky-walker
title: SKY WALKER
tagline: Keep your balance on a tightrope above a neon city while storms and
  wind push you off.
description: >-
  You're a high-wire walker out over a neon cyberpunk city, and the only thing
  you do is keep the balancing pole centered while storms and gusts shove you
  sideways. Tap W or Up once to set off, because after that he keeps walking on
  his own. That leaves your hands free for steering the balance with A and D or
  the left and right arrows.


  The walking itself isn't your job, which is a neat trick, since all your
  attention goes to the one thing that matters.


  Up top you'll see the stage name, and it starts at Level 1: Calm. The storms
  get more violent as you go, so that name reads like a polite warning that the
  wind won't stay friendly.


  A wind speed readout sits in the corner so you can see what the weather is
  doing. Next to it, the distance counter keeps your current run and your best
  so far, and there's a heart beside it.


  The city behind the wire is generated procedurally, a dark skyline lit in red
  and teal.


  The creator was chasing the nerve-racking feel of real high-wire walkers and
  says they like extremely challenging, frustrating games, which makes the whole
  setup make sense. There's a leaderboard too, so you can compare your distance
  with other players.
