slug: sky-walker
title: SKY WALKER
tagline: Keep your balance on a tightrope above a neon city while storms and
  wind push you off.
description: >-
  A tightrope stretches over a neon-lit cyberpunk city, and a walker crosses it
  while you keep a balancing pole centered. Press W or Up once to start. After
  that the walker moves forward on his own, so the only job left is staying
  upright.


  Use A and D or the left and right arrows to correct your balance. Storms and
  unpredictable winds push against you, and the weather turns more violent as
  you advance. The first stage is labeled Level 1: Calm.


  The screen tracks distance walked in meters along with your best distance, a
  heart icon, the current stage, and a live wind speed reading. A leaderboard
  button sits beside the start button. The city behind the rope is generated
  procedurally, with dark towers and red and cyan lighting.


  The creator drew on the tension of real high-wire walkers and built the game
  around one simple mechanic, keeping the pole centered, with a deliberate lean
  toward frustrating difficulty.
