slug: sketching-fish
title: Sketching Fish
tagline: Tap to the beat of each fish and fill a crayon sketchbook with 75 catches.
description: >-
  A crayon pond fills a spiral sketchbook page when the game opens, with a
  little angler sitting on the bank under a scribbled sun, a couple of clouds
  and green hills. You press Start, then cast your line with a single input.


  Each catch runs about 10 seconds while a ring shrinks on screen, and you click
  or press Space in time with that particular fish's beat.


  There are 11 beat patterns, and each fish follows exactly one. Each one fights
  in its own way, too, and there's a whole lineup of troublemakers that dash,
  act picky or show ghostly rings.


  Slippery fish slow down the shrinking ring, and while they do, the drawn line
  shivers. A streamer once took that slowdown for lag, since a deliberate
  slowdown and a dropped frame look identical on screen. The shivering line was
  HF Doodle Studio's answer, and it's a smart one, because lag freezes the
  picture while a shiver doesn't.


  For some reason all 75 species are stationery puns, so you end up reeling in a
  Pencil Eel, an Eraser Shark or a Clip Anchovy.


  You flip the sketchbook's pages to travel from the lake to the sea and then on
  to a foggy swamp. The lake alone holds a whole 30 species. The sea opens once
  you've caught 15 lake species, while the swamp opens after 18 sea species.


  Three legendary fish are in there too, and a pity system makes sure they'll
  eventually show up. Coins pay for rods and baits, and you can earn a golden
  crown on top of 36 achievements, 3 collections and your personal records. Once
  all 75 slots in the book are filled, the game rewards you with an ending.


  Every crooked crayon stroke gets generated by code during play instead of
  coming from an image file, which is a surprising amount of work for something
  that looks like a kid's doodle. Each of the three regions gets its own music.
  You can switch the interface between Korean, English, Japanese and Chinese,
  and landscape is recommended on a phone.


  HF Doodle Studio made all the design calls and steered the project, writing
  the code with Claude and composing the three tracks with Google Gemini. When a
  player complained that nothing felt like progress, they built a skill tree and
  then cut it. Instead they locked what was already there behind those species
  counts.
