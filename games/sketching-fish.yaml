slug: sketching-fish
title: Sketching Fish
tagline: Tap to the beat of each fish and fill a crayon sketchbook with 75 catches.
description: >-
  The start screen shows a crayon-drawn pond on a spiral sketchbook page, with a
  small angler on the bank, a sun, clouds and green hills. Press Start, then
  cast with one input. Each catch takes about 10 seconds: a ring shrinks, and
  you click or press Space in time with the fish's beat.


  Every fish is set to one of 11 beat patterns, and each fights in its own way.
  Slippery ones slow the shrinking ring while the drawn line shivers. Others
  dash, are picky, or show ghostly rings. The 75 species are stationery puns,
  such as the Pencil Eel, Eraser Shark and Clip Anchovy.


  Flipping the sketchbook page leads from the lake to the sea and then a foggy
  swamp. The lake holds 30 species, the sea opens after 15 lake species, and the
  swamp opens after 18 sea species. Three legendary fish come with a pity
  system, so they will turn up. Coins go toward rods and baits, and a golden
  crown can be earned. There are 36 achievements, 3 collections and personal
  records. Filling all 75 slots triggers an ending.


  All the art is drawn by code during play rather than loaded from image files,
  and each of the three regions has its own music. The interface can be switched
  between Korean, English, Japanese and Chinese. Landscape orientation is
  recommended on phones.
