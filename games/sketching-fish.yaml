slug: sketching-fish
title: Sketching Fish
tagline: Tap to the beat of each fish and fill a crayon sketchbook with 75 catches.
description: >-
  Cast your line into a lake and reel in fish, with each catch running about 10
  seconds.


  Eleven beat patterns, one per fish. Fights ranging from dashing and picky to
  slippery and ghostly. 75 stationery-pun species, plus an ending for filling
  every slot. Three legendary fish, with a pity system ensuring they eventually
  show up. Lake of 30 species, then sea and swamp, reached by flipping pages.
  Sea unlocking after 15 lake species, swamp after 18 sea species. Coins for
  rods and baits, a golden crown, 36 achievements, 3 collections, personal
  records.


  Press Start, then cast with a single input, either click or Space. Then click
  or press Space in time with the fish's beat while the ring shrinks.


  Slippery fish slow the shrinking ring, and the drawn line shivers while they
  do. A streamer once took that slowdown for lag, since a deliberate slowdown
  and a dropped frame look identical on screen. The shivering line was their
  answer, since lag freezes the picture while a shiver doesn't.


  HF Doodle Studio made all the design calls and steered the project, coding
  with an AI model. Each region's track was composed with Google Gemini. Code
  draws every stroke during play, with no image files. You can switch the
  interface between Korean, English, Japanese and Chinese. After a player
  complained that nothing felt like progress, they built a skill tree, then cut
  it. Instead, they locked what was already there behind those species counts.
