slug: sketching-fish
title: Sketching Fish
tagline: Tap to the beat of each fish and fill a crayon sketchbook with 75 catches.
description: >-
  You start on a crayon drawing of a lake in a spiral-bound sketchbook, with a
  little angler on the bank and a big yellow Start button over the water. Below
  it you'll find menus for your collection, a shop, achievements and personal
  records.


  There's only one button, and every fish bites to its own rhythm.


  You cast, then tap along with the beat so you can hit the shrinking ring at
  the right moment. Eleven beat patterns exist, and each fish is tied to one of
  them, so you learn the tap-tap, tap-ta-dap feel of a fish before you land it.


  The fish aren't all the same kind of fight, either. Some are slippery, some
  dash, some are picky, and a few show up as ghostly rings. Slippery ones
  deliberately slow the ring down, which is why the crayon line shivers while it
  crawls, so you can tell it from lag.


  All 75 fish are made from stationery, like the Pencil Eel, the Eraser Shark
  and the Clip Anchovy, and each comes with its own joke.


  The book fills up page by page. You start on the lake with 30 fish, then flip
  to the sea once you've logged 15 lake species, and the foggy swamp opens after
  18 sea species. Three legendary fish are in there too, and a pity system makes
  sure you'll meet them.


  Along the way you earn coins for rods and baits, plus a golden crown, 36
  achievements and three collections. Fill every slot and there's an ending
  waiting on the last page.


  There are no image files at all, because the wobbly crayon lines are drawn by
  code as you play. The creator designed it and wrote the code with Claude,
  while Google Gemini composed the three region themes.
