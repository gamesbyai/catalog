slug: game-20-0
title: 20-0
tagline: Draft an NFL roster from random franchise eras and try for a perfect season.
description: >-
  In 20-0 you draft an NFL roster and try to take it through a season without a
  loss. Every pick draws from a random franchise era somewhere in NFL history,
  so your lineup ends up mixing players from different teams and decades. Once
  it is full, you find out whether the finished team can win every game.


  The strategy lives in the roster-building decisions. Because the eras come up
  at random, you weigh star names against positional needs and adapt as the pool
  changes from one pick to the next, which makes it as much strategy as sports.


  A perfect season is the target, which gives every draft a clear measure of
  success. The creator names Claude and Kimi as the AI behind it, and you play
  it solo.
