slug: survive-coders
title: Survive Coders
tagline: Cross San Francisco on foot, shooting bugs and shouting voice commands
  at a boss.
description: >-
  Start in Daly City, where a robotaxi drops you off with one request from
  #demo-day to make one small change before the demo. Survive Coders is the
  platformer run that follows, across San Francisco toward Anthropic HQ. You
  play a vibe coder fighting with a floating laptop, and your voice is the
  weapon.


  Voice powers such as ship it, rollback, and refactor. Bad Prompt Blobs,
  Keyboard Goblins, and overheating GPUs as enemies. Salesforce Park, with
  pitch-throwing founders and a demo-day amphitheater. Three Salesforce Tower
  floors, where contracts lock your weapon. A typed parachute fall and a Waymo
  ride. The Context Rot Hydra, a three-headed boss at the end. New threats added
  one at a time, level by level.


  Hold M, speak the command, and let go to fire. Skip the voice and press the
  power's keyboard key, or tap it on a phone. Ordinary talk fires nothing.
  During the fall, type build me a parachute, then no, a real one, then ship it.
  Case and small typos don't matter, and Tab fills in the line. On a phone, tap
  each letter, or hold talk and say the line. Steer the canopy through three
  arcs of stars.


  According to travisstephenfraser, it was built as a hackathon demo with an AI
  model as pair programmer, and its commits carry co-author trailers.
