slug: survive-coders
title: Survive Coders
tagline: Cross San Francisco on foot, shooting bugs and shouting voice commands
  at a boss.
description: >-
  A robotaxi drops a vibe coder in Daly City with one request: make one small
  change before the demo. Survive Coders is the platformer run that follows,
  across San Francisco toward Anthropic HQ. The creator says it was built as a
  hackathon demo with Claude Code, with Claude Opus 5.5 as a pair programmer,
  and its commits carry co-author trailers.


  Your voice is the weapon. Hold a key, say a command such as ship it, rollback,
  or refactor, and the power fires on release. Speech is optional, since every
  power also has a keyboard key and a touch target on phones.


  The enemies come from vibe-coding pain: Bad Prompt Blobs, Keyboard Goblins,
  and overheating GPUs. Each level adds threats one at a time, from
  pitch-throwing founders in Salesforce Park to Salesforce Tower floors where
  contracts lock your weapon, then a typed parachute fall and a Waymo ride. The
  Context Rot Hydra, a three-headed boss, waits at the end.
