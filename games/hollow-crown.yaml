slug: hollow-crown
title: Hollow Crown
tagline: Pick a class and fight through a pixel RPG toward a three-stage boss
description: >-
  You pick one of five classes to play as, Hero, Arch Mage, Bishop, Bowmaster or
  Night Lord, and then start out in Crownhollow, a town on a lake under purple
  evening skies. Each class gets four skills and its own mid-air move, which can
  be anything from the Hero's leap to a teleport the Arch Mage aims with the
  arrow keys.


  Elder Rowan waits by the campfire, and his four-part quest chain leads you
  through the woods toward a boss with the oddly charming name of King Shroom.


  There are four maps in all, with the town followed by Mushroom Grove for
  levels 1 to 5, Hollow Deep for levels 5 to 9 and the Royal Glade, a whole
  arena set aside just for the boss. Shellbacks, Caplings, Stumpies and Wisps
  patrol the forest and come after you once they notice you, then drop mesos and
  items when they go down.


  Kills earn EXP, and a golden pillar of light marks each level-up while new
  skills that cost MP open up as you climb. Red and blue potions refill your HP
  and MP, and a merchant sells upgrades for your throwing stars. Dying leaves a
  tombstone where you fell and takes a bite out of your EXP, but at least the
  game autosaves.


  Getting around works by pretty familiar platformer rules. You jump up through
  platforms, drop down through them and climb ropes and ladders, and you're free
  to walk and jump mid-cast because skills don't root you in place.


  King Shroom fights in three stages, and there's a considerate touch in how
  blinking markers on the ground warn of every stomp and spore before it lands.


  At 66% health he calls up a Spore Storm of double stomps, raining spores and
  extra caplings. At 33% he turns red and speeds up, adding triple stomps and a
  Quake Slam that spreads out in three rings.


  Every sprite, effect and song is generated by code. It all goes back to a
  single prompt, a request to animate a pixel-art wizard casting a spell, and
  Claude Code built the game out from there in conversation, with parallel
  agents handling the art and the soundtrack.
