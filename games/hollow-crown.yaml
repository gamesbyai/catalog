slug: hollow-crown
title: Hollow Crown
tagline: Pick a class and fight through a pixel RPG toward a three-stage boss
description: >-
  You pick one of five classes in Hollow Crown and fight your way toward a boss
  battle that unfolds across three stages. It is a single-player action RPG in
  pixel art, inspired by MapleStory and played entirely in the browser.


  None of it is loaded from image or audio files. Every sprite, effect and sound
  is produced by code, with the pixel art drawn procedurally and the audio built
  on the Web Audio API, all rendered to an HTML canvas in the browser.


  Procedural generation is the main technique behind both the look and the
  sound. Five classes leave room to replay with a different style, and the
  repository, which marks the project as made with Claude Code, holds the code
  that draws every sprite.
