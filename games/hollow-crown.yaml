slug: hollow-crown
title: Hollow Crown
tagline: Pick a class and fight through a pixel RPG toward a three-stage boss
description: >-
  You pick one of five classes, Hero, Arch Mage, Bishop, Bowmaster or Night
  Lord, and then step out into the lakeside town of Crownhollow. Casting doesn't
  stop you, so you can walk and jump around while a skill goes off.


  Every class has its own basic attack and three skills, which unlock as you
  level and cost MP.


  Pressing jump a second time in the air gives you a class-specific mobility
  move. The two casters teleport, and you aim that with the arrow keys, which is
  a handy way to pick your landing spot.


  Movement is borrowed from MapleStory, so you hop up through platforms, drop
  back down through them, climb ropes and ladders, and press Up at portals to
  change maps. Elder Rowan waits by the campfire and hands you a four-part quest
  chain that leads through Mushroom Grove and Hollow Deep. The monsters patrol,
  notice you, and show a health bar once you've hit them.


  They drop mesos and items, and a merchant sells red and blue potions and
  throwing-star upgrades.


  At the end of the chain is King Shroom, a boss with three stages in the Royal
  Glade. He warns you before every stomp and spore with blinking markers on the
  floor, which is fair of him.


  At 66% health he calls a spore storm with double stomps, falling spores and
  extra caplings. At 33% he turns red and speeds up, adding triple stomps and a
  quake slam that sends out three rings.


  If you die, you leave a tombstone behind and lose some EXP, and the game saves
  on its own. A minimap, a quest tracker and a bottom status bar keep your place
  on screen.


  Every sprite, effect, song and sound was generated as code. It began as one
  prompt asking for an animated pixel wizard casting a spell, and grew into
  this.
