slug: hollow-crown
title: Hollow Crown
tagline: Pick a class and fight through a pixel RPG toward a three-stage boss
description: >-
  Hollow Crown is a browser-based pixel RPG inspired by MapleStory. You choose
  one of five classes, fight your way through the game's challenges, and work
  toward a boss battle that unfolds across three stages.


  The visual and audio side is the notable part. Every sprite, effect, and sound
  is produced by code rather than loaded from image or audio files, with the
  pixel art drawn procedurally and the audio built on the Web Audio API. Five
  classes also leave room for replaying with a different style.


  The repository marks the project as made with Claude Code. It draws to an HTML
  canvas in the browser, and procedural generation is the main technique behind
  its look and sound. It is a single-player game.
