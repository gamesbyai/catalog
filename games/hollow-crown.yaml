slug: hollow-crown
title: Hollow Crown
tagline: Pick a class and fight through a pixel RPG toward a three-stage boss
description: >-
  You pick one of five classes, Hero, Arch Mage, Bishop, Bowmaster or Night
  Lord, and start in Crownhollow, a town on a lake. Each class has four skills,
  and new ones that cost MP open as you level up. Elder Rowan waits by the
  campfire with a four-part quest chain that leads through the woods toward a
  boss.


  Four maps, starting in town, Mushroom Grove for levels 1 to 5, Hollow Deep for
  levels 5 to 9 and the Royal Glade boss arena. Shellbacks, Caplings, Stumpies
  and Wisps, patrolling monsters that come after you once they notice you. King
  Shroom, a three-stage boss with blinking markers before each stomp and spore.
  A Spore Storm at 66% health, double stomps, spore rain and extra caplings. At
  33%, a faster stage with triple stomps and a three-ring Quake Slam.


  Walk and jump mid-cast, because skills don't root you in place. Jump up
  through platforms and drop through them with Down and Space. Climb ropes and
  ladders with Up. Press Space again in the air for your class's mid-air move,
  like the Hero's leap. Aim the Arch Mage's teleport with the arrow keys.


  Defeat monsters for EXP, mesos and the items they drop. Drink red and blue
  potions to refill HP and MP. Visit the merchant for throwing-star upgrades.
  Dying leaves a tombstone where you fell and takes a bite out of your EXP. The
  game autosaves.


  Every sprite, effect and song is generated by code. It started from a single
  prompt, a request to animate a pixel-art wizard casting a spell. From there,
  the AI built the game out in conversation, with parallel agents handling the
  art and the soundtrack.
