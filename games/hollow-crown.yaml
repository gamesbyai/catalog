slug: hollow-crown
title: Hollow Crown
tagline: Pick a class and fight through a pixel RPG toward a three-stage boss
description: >-
  Hollow Crown is a pixel-art action RPG inspired by MapleStory. You pick one of
  five classes, from Hero to Night Lord, and follow a quest chain out of a
  lakeside town. It ends at King Shroom, a three-stage boss that speeds up and
  adds attacks as its health drops.


  It plays like the games it borrows from: jump up through platforms, climb
  ropes, flash-jump in mid-air, earn levels, spend MP on skills and buy upgrades
  from a merchant across four maps.


  The art has an unusual origin. According to the creator's README, every
  sprite, effect, song and sound started as code: skill animations drawn pixel
  by pixel on an HTML canvas with Web Audio sound, then baked into sprite sheets
  and rebuilt as a game in Unity 6. The README credits Claude Code for the
  build, and the game is free to play in the browser.
