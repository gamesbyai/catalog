slug: hollow-crown
title: Hollow Crown
tagline: Pick a class and fight through a pixel RPG toward a three-stage boss
description: >-
  You pick one of five classes (Hero, Arch Mage, Bishop, Bowmaster or Night
  Lord) and start in Crownhollow, a lakeside town. Talk to Elder Rowan by the
  campfire, then follow his four-part quest chain through the woods toward the
  King Shroom boss.


  The world has four maps: the town, Mushroom Grove (levels 1 to 5), Hollow Deep
  (levels 5 to 9) and the Royal Glade boss arena. Shellbacks, Caplings, Stumpies
  and Wisps patrol and aggro, then drop mesos and items. You earn EXP and
  levels, which unlock skills that cost MP. Red and blue potions restore HP and
  MP, and a merchant sells throwing-star upgrades. Dying leaves a tombstone and
  costs EXP. The game autosaves.


  Movement follows platformer rules: jump up through platforms, drop down
  through them, climb ropes and ladders, and use a mid-air mobility move that
  depends on class. Skills do not root you, so you can keep moving while
  casting.


  The King Shroom fight has three stages. Blinking ground markers warn of each
  stomp and spore. At 66% health he starts a Spore Storm with double stomps,
  spore rain and capling adds. At 33% he turns red and faster, with triple
  stomps and a three-ring Quake Slam. Every sprite, effect and song is generated
  by code.
