slug: ad-bird-tising-exe
title: AD_BIRD_TISING.EXE
tagline: Flap through obstacles in a Flappy Bird-style run with an ad-agency twist.
description: >-
  AD_BIRD_TISING.EXE is Flappy Bird dressed up as marketing satire. You tap to
  flap, keep a bird airborne along a side-scrolling course and steer clear of
  obstacles, and the first collision ends the run.


  The joke lives in the packaging. The title is styled like an old executable
  file, the theme is a send-up of marketing, and the slogan promises
  high-performance marketing delivered one flap at a time. Google's Antigravity
  was the AI tool, and it came 431st of 945 at Vibe Jam 2026.


  Under the theme sits the familiar one-button loop: tap, dodge and see how far
  you get. A single tap is the whole control scheme, on a phone or at a desk, in
  a single-player run that lasts as long as you keep clear of the obstacles.
