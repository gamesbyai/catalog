slug: 3d-tetris
title: 3D Tetris
tagline: Stack falling 3D blocks on floating platforms and fill whole layers to
  clear them.
description: >-
  Tetrominoes fall onto a platform floating in open space, and in 3D Tetris your
  job is to fill an entire layer with them. A full layer clears away, which
  makes room for more pieces and keeps the stack from growing out of control.


  The board stays clean and minimal: the platform, the pieces and the empty
  space around them. According to the creator, it was built with Lovable, with
  Three.js rendering the 3D scene.


  The extra dimension changes the job. Instead of clearing single rows on a flat
  grid, you fill width and depth at the same time, and a gap hidden behind other
  blocks can stop a layer from completing. Every piece has to be judged from
  several angles before you place it on the stack.
