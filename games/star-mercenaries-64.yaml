slug: star-mercenaries-64
title: Star Mercenaries 64
tagline: Fly a rail shooter route as space-faring animal mercenaries and blast
  enemy markets.
description: >-
  Star Mercenaries 64 is an arcade rail shooter in the style of Star Fox 64. The
  player pilots a ship along a fixed path through space, shooting down enemies
  and hazards as the route unfolds. It runs in the browser and is playable on
  mobile devices as well as desktop.


  The setting is a satire of the AI industry. The pilots are animal mercenaries
  who weaponize capitalism, and they bicker like tech billionaires while blowing
  up markets. The tone draws on the creator's fascination with AI lore and its
  founding figures, and it is the main thing that sets this shooter apart from
  its inspiration.


  The creator built it with Codex, and it is rendered with Three.js. It was
  submitted to Vibe Jam 2026, where it placed 482 out of 945 entries.
