slug: hired-swords
title: Hired Swords
tagline: Draft a team of fighters and battle other players' ghost teams in auto-battles.
description: >-
  Hired Swords is a roguelite autobattler in which you assemble a team of
  fighters and send them into automatic battles. Each round you shape your
  lineup, then watch it face a ghost, a saved team built by another human
  player. Win enough fights and you climb toward the top.


  The focus is on synergies. Choosing which units to hold and how they combine
  with one another matters more than reflexes, which gives the game a
  puzzle-like feel alongside its strategy. Because opponents are recorded teams
  from real players, every run meets a different set of rivals.


  The game was made for Vibe Jam 2026, where it placed 68th among 945 entries,
  and it takes inspiration from Super Auto Pets. The creator built it with
  Claude Code on the Phaser engine, and it is playable on mobile as well as
  desktop.
