slug: hired-swords
title: Hired Swords
tagline: Draft a team of fighters and battle other players' ghost teams in auto-battles.
description: >-
  You draft a team of fighters in Hired Swords and send it into automatic
  battles against other players' saved teams. It is a roguelite autobattler that
  takes its cue from Super Auto Pets: each round you shape your lineup, then
  watch it face a ghost built by another human player.


  The game is about synergies. Which units you hold and how they combine with
  each other matter more than reflexes, which gives the drafting a puzzle-like
  feel. Because the opponents are recorded teams, each climb meets a different
  set of rivals without anyone needing to be online at the same time.


  Win enough fights and you climb toward the top. It came 68th of 945 at Vibe
  Jam 2026, built with Claude Code on the Phaser engine.
