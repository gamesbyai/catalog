slug: aero-frog-skybound
title: Aero Frog Skybound
tagline: Leap between floating islands as a frog and rescue stolen tadpoles from aliens.
description: >-
  Jump to islands above and across the gaps as a frog whose tadpoles were taken
  by a UFO. The game starts on a sky level.


  Vertical levels where each jump reaches higher than the last. Four hidden
  tadpoles to collect in every level. Two levels, followed by a boss fight.
  Destroying everything in your path, a push toward becoming something closer to
  a machine. Your ending, decided through play by how you act across the levels.


  Use the keyboard to steer the frog and the mouse to turn your view. Hold the
  jump key to make a leap taller.


  The design draws on Jumping Flash 2, a PS1 game from 1996. According to the
  creator, AI tools were used for the code, the art, the music and the sound
  effects.
