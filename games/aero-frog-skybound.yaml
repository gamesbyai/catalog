slug: aero-frog-skybound
title: Aero Frog Skybound
tagline: Leap between floating islands as a frog and rescue stolen tadpoles from aliens.
description: >-
  The game starts on a sky level. You play a frog whose tadpoles were taken by a
  UFO. Move with the keyboard, look with the mouse, and jump to reach islands
  above and across the gaps.


  Each jump goes higher than the last, so levels use vertical space. Holding the
  jump key gives a taller leap. Every level hides 4 tadpoles to collect, and the
  game has 2 levels followed by a boss fight.


  How you act through the levels decides your ending. Destroying everything in
  your path pushes the frog toward becoming something closer to a machine. The
  choice is made through play.


  The design draws on Jumping Flash! 2 from the PS1. The creator lists Claude
  (Sonnet 4.6) for code, and AI tools for art, music and sound effects.
