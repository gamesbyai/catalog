slug: emojibeats
title: EmojiBeats
tagline: Guess pop song titles from emoji clues in a pixel-art arcade music quiz.
description: >-
  EmojiBeats spells out pop song titles in emoji and asks you to name the song.
  It is an 8-bit arcade music quiz: each puzzle shows a string of emojis, you
  work out which song it stands for and enter the answer, and a correct guess
  moves you on.


  The look borrows from old game cartridges, with pixel art meant to bring back
  some nostalgia, and the songs are the pop hits the creator grew up with.
  Cursor was the AI tool, and the game was made for Vibe Jam 2026.


  The game is built to be forgiving, with the goal of something people anywhere
  could enjoy. Small spelling mistakes still count, which helps players who are
  not native English speakers, and a voice mode lets you say the answer out loud
  instead of typing it.
