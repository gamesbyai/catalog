slug: emojibeats
title: EmojiBeats
tagline: Guess pop song titles from emoji clues in a pixel-art arcade music quiz.
description: >-
  Each puzzle shows emojis standing in for a pop song title, and you guess the
  song. The game forgives small spelling mistakes, so an answer doesn't have to
  be typed perfectly. The song list draws on pop music the creator grew up with.


  Players who would rather talk than type can switch on voice mode and solve any
  puzzle by saying the answer out loud.


  The mode select screen lists Free Practice, labeled casual with no pressure.
  The leaderboard at the top of the start screen has separate Speed Run and
  Combo Run tabs. Each ranks players by points and finishing time, and a link
  opens the full list.


  The look is 8-bit arcade: a pixel font, a neon grid backdrop, a row of retro
  game icons, and an insert-coin prompt above the start button.
