slug: emojibeats
title: EmojiBeats
tagline: Guess pop song titles from emoji clues in a pixel-art arcade music quiz.
description: >-
  A string of emojis stands in for a pop song title, and your job is to work out
  which song it is. The songs come from the pop music Lab_YmK grew up with.


  Typos won't sink you either, because the game forgives small spelling mistakes
  and your answer doesn't have to be typed perfectly.


  You can type your guess, but players who'd rather talk than type can switch on
  voice mode and solve any puzzle by saying the answer out loud.


  There's also a Free Practice mode for playing puzzles casually, with no
  pressure. Competitive players can compare scores on leaderboards for Speed Run
  and Combo Run. Both boards rank players by points and by finishing time.
