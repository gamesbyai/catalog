slug: emojibeats
title: EmojiBeats
tagline: Guess pop song titles from emoji clues in a pixel-art arcade music quiz.
description: >-
  You get a string of emojis and have to work out which pop song title they
  stand for. The songs are the pop the creator grew up with, so the game leans
  on nostalgia. It's dressed like an old arcade cabinet, with chunky pixel
  lettering and a neon grid behind the menu.


  Typos won't sink you, which is a kind touch in a quiz about song titles.


  The creator isn't a native English speaker, so small spelling slips get
  forgiven instead of marked wrong. And if you'd rather sing than type, a voice
  mode lets you solve any puzzle by saying the answer out loud.


  The menu starts with Free Practice, labeled casual and no pressure. Above the
  mode picker sits a leaderboard panel with Speed Run and Combo Run tabs, and
  the rows show rank, name, points and finishing time. A button under the rows
  opens the full leaderboard.


  The title screen even says insert coin and press start, which is a funny bit
  of cabinet theater for a browser game.


  Since answers are normally typed, saying them aloud opens the game to people
  who'd rather skip the keyboard. Paired with the forgiving spelling, it keeps
  the puzzle about knowing the song.
