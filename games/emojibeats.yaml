slug: emojibeats
title: EmojiBeats
tagline: Guess pop song titles from emoji clues in a pixel-art arcade music quiz.
description: >-
  A string of emojis stands in for a pop song title, and your job is to work out
  which song it is. The songs come from the pop music Lab_YmK grew up with.


  Typos won't sink you either, because the game forgives small spelling mistakes
  and your answer doesn't have to be typed perfectly.


  You can type your guess, but players who'd rather talk than type can switch on
  voice mode and solve any puzzle by saying the answer out loud. Speaking a song
  title fits a music quiz pretty naturally.


  If you just want to poke at puzzles, the mode select screen offers Free
  Practice, tagged as casual with no pressure. Competitive players get a
  leaderboard at the very top of the start screen, split into Speed Run and
  Combo Run tabs. Both rank people by points and by finishing time, while a link
  underneath opens the full list.


  Tracking the clock next to the score makes a lot of sense on a board where one
  tab is called Speed Run.


  The screen goes all in on 8-bit arcade, with a pixel font over a neon grid
  backdrop, a row of retro game icons and an insert-coin prompt sitting above
  the start button.
