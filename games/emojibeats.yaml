slug: emojibeats
title: EmojiBeats
tagline: Guess pop song titles from emoji clues in a pixel-art arcade music quiz.
description: >-
  Each puzzle is a string of emojis that stands in for a pop song title. Work
  out which song it is.


  Pop songs from the music Lab_YmK grew up with. Forgiveness for small spelling
  mistakes. Free Practice mode, for playing puzzles casually with no pressure.
  Speed Run and Combo Run leaderboards for competitive players, ranked by points
  and by finishing time.


  Type your guess. If you'd rather talk than type, switch on voice mode and say
  the answer out loud on any puzzle.
