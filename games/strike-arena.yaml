slug: strike-arena
title: Strike Arena
tagline: Pick a captain and play rule-free four-a-side football, with black
  holes and meteors
description: >-
  You play four-a-side football without any rules, which the title's tagline
  calls all chaos.


  You pick one of eight captains, and each one brings a signature skill plus a
  Hyper Strike that shakes the screen. You'll also find that some of those Hyper
  Strikes are wild, like summoning a black hole or rolling over defenders as a
  boulder.


  Another Hyper Strike calls a meteor down for a goal worth double points.


  There's a Titan Mode where you flatten rivals. You can also grab power-ups
  during a match. Timing the perfect shot is part of it too. Frostine is billed
  as the Queen of the Glacier.


  You can play a match against the computer or a multiplayer game against
  friends online. You can pick High, Medium or Low for graphics. There are
  controls and audio options, plus a how-to-play page.
