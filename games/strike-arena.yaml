slug: strike-arena
title: Strike Arena
tagline: Pick a captain and play rule-free four-a-side football, with black
  holes and meteors
description: >-
  You play four-a-side football without any rules, which the title's tagline
  calls all chaos.


  You pick one of eight captains, and each one brings a signature skill plus a
  Hyper Strike that shakes the screen. You'll also find that some of those Hyper
  Strikes are surprisingly wild, like summoning a black hole or rolling over
  defenders as a boulder.


  For some reason, another Hyper Strike calls a meteor down for a goal worth
  double points.


  There's a Titan Mode where you flatten rivals. You can also grab power-ups
  during a match. Timing the perfect shot is part of it too.


  The title screen shows Frostine, billed as the Queen of the Glacier, standing
  on a round platform in front of a stadium where there's a bunch of fans waving
  flags. Frostine's icy hair and pale blue skin sit oddly with the red kit.


  The menu is pretty straightforward, offering a match against the computer or a
  multiplayer game against friends online. It's a fair call to put the graphics
  setting on the first screen, with High, Medium and Low to pick from. Settings
  has the controls, the audio and a how-to-play page.
