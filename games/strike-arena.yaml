slug: strike-arena
title: Strike Arena
tagline: Pick a captain and play rule-free four-a-side football, with black
  holes and meteors
description: >-
  Pick one of eight captains and play four-a-side football with no rules. You
  can face the computer or friends online. The tagline calls it all chaos.


  Eight captains, each with a signature skill and a Hyper Strike that shakes the
  screen. Some wild Hyper Strikes, such as a summoned black hole and a boulder
  that rolls over defenders. A meteor Hyper Strike that brings a goal worth
  double points. Titan Mode for flattening rivals and grabbable power-ups during
  a match. Perfect-shot timing. Frostine, billed as the Queen of the Glacier.
