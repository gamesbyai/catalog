slug: lingogoat
title: LingoGoat
tagline: Feed a hungry goat by speaking words in a new language.
description: >-
  LingoGoat is a casual language-learning game built around a goat that needs
  feeding. You speak words aloud in the language you are practicing, and correct
  speech is how the goat gets its meal, so learning happens through your voice.


  The simple premise is the appeal: a hungry goat replaces the flashcards and
  quizzes of a typical study app, and your voice replaces the keyboard. It is a
  solo game made with Claude Code, ranked 202nd of 945 at Vibe Jam 2026, and
  since it runs on phones too, practice can happen anywhere you have a
  microphone.


  Speaking is the main input, which keeps the focus on pronunciation and recall.
  A session is a series of spoken attempts, with the hungry goat waiting on each
  one.
