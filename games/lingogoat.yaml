slug: lingogoat
title: LingoGoat
tagline: Feed a hungry goat by speaking words in a new language.
description: >-
  LingoGoat is a language-learning game built around a goat that needs feeding.
  The player speaks aloud to practice a new language, and correct speech is how
  the animal gets its meal. Learning happens through voice, so a session is a
  series of spoken attempts rather than typed answers.


  The appeal is the simple premise: a hungry goat replaces the flashcards and
  quizzes of a typical study app. Speaking is the main input, which keeps the
  focus on pronunciation and recall. It also runs on mobile, so practice can
  happen wherever the player has a microphone.


  The game was entered in Vibe Jam 2026, where it placed 202nd among 945
  entries. The creator states that it was built with Claude Code.
