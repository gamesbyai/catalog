slug: fish-mode
title: FISH MODE
tagline: Swim down a river as a fish, grabbing bobbers and dodging hooks for a
  high score.
description: >-
  Push your score as high as possible in a single run of this arcade game. Swim
  a fish downstream through a river. Your aim is to chain clean lines through
  the obstacles and keep a steady rhythm.


  Bobbers to collect for points. Hooks to steer clear of. Flipping and swerving
  through the current, the two core actions.
