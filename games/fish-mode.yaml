slug: fish-mode
title: FISH MODE
tagline: Swim down a river as a fish, grabbing bobbers and dodging hooks for a
  high score.
description: >-
  FISH MODE is a river-running arcade game where you play a fish swimming
  downstream. Along the way you collect bobbers for points and steer clear of
  hooks. Flipping and swerving through the current is how you push your score as
  high as possible in a single run.


  The game leans on its movement. Swerving and flipping are the core actions, so
  the aim is to chain clean lines through the obstacles and keep a steady
  rhythm. It was entered in Vibe Jam 2026 in a category for games with unusual
  control schemes that bring on a flow state.


  The game is built in Three.js, and the creator's statement credits
  Antigravity, Google's AI coding tool, as the tool used to make it. It is a
  single-player game.
