slug: meridian-wake
title: Meridian Wake
tagline: Fly a brick-built spaceship, trade, mine, fight, and follow stories
  across star systems.
description: >-
  Meridian Wake reimagines Endless Sky as a three-dimensional, brick-styled
  space game in the browser. You start with a Sparrow, a Shuttle or a Star
  Barge, accept a first transmission at New Boston, jump to Arcturus and land on
  New Greenland. After that you take contracts, haul cargo and passengers, mine
  and upgrade your ship.


  Ports have markets, shipyards, outfitters, fleet services and banking, and the
  Concourse adds civilian conversations, a field guide and four branching
  stories alongside the Free Worlds storyline. The creator states it was
  generated with GPT-6 Astra. It renders with Three.js on WebGPU with a WebGL2
  fallback, uses Rapier for physics, and plays with keyboard, touch or gamepad.


  Missions are specific: contracts name exact planets, surveys need fresh scans,
  and excursions require every stop plus a return home. A journal tracks what is
  unfinished, progress autosaves in the browser with import and export, and
  exploration continues after the ending.
