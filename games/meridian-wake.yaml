slug: meridian-wake
title: Meridian Wake
tagline: Fly a brick-built spaceship, trade, mine, fight, and follow stories
  across star systems.
description: >-
  Pick a Sparrow, Shuttle or Star Barge, then take the first transmission at New
  Boston. Launch, open the map, set a course for Arcturus, jump, and land on New
  Greenland to finish that opening job. Ships, planets and stations are modeled
  in blocky bricks in 3D.


  Each port has a contract board, markets, a shipyard, an outfitter, fleet
  services and a bank. You can haul cargo, ferry passengers, mine, refit ships
  and give orders to escorts. Contracts name specific planets. Survey jobs call
  for new scans, assay jobs consume Metal you actually carry, and excursions
  want every stop visited and then a trip back home.


  The main storyline follows the Free Worlds, with extra civilian and alien
  storylines beside it. The Concourse screen adds conversations, a field guide
  and four branching stories. You can keep flying once the ending is reached. A
  journal tracks unfinished objectives and routes.


  The bank screen lists daily payments, crew wages, your credit rating and loan
  offers tied to income. The outfitter can hold purchased upgrades at a planet
  for installing later, including on a different ship. Progress autosaves in the
  browser. Options cover key remapping, audio, graphics, fullscreen and save
  export and import.
