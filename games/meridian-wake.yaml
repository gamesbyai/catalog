slug: meridian-wake
title: Meridian Wake
tagline: Fly a brick-built spaceship, trade, mine, fight, and follow stories
  across star systems.
description: >-
  Fly your ship across star systems, trading, mining, fighting and following
  stories in an old-school space trader.


  A contract board, markets, a shipyard, an outfitter, fleet services and a bank
  at every port. Cargo, passengers, mining and escorts to command. Survey, assay
  and excursion contracts, each naming an exact planet. The Free Worlds
  storyline, with civilian and alien stories beside it. Loans, wages and a
  credit rating at the bank.


  Pick a Sparrow, a Shuttle or a Star Barge, accept the first transmission at
  New Boston, and plot a course for Arcturus.


  A reimagining of Endless Sky with its own geometry and interface, using
  universe data, story inspiration and audio from the Endless Sky contributors.
