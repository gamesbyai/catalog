slug: meridian-wake
title: Meridian Wake
tagline: Fly a brick-built spaceship, trade, mine, fight, and follow stories
  across star systems.
description: >-
  Pick a Sparrow, a Shuttle or a Star Barge, then accept the first transmission
  waiting at New Boston. From there you launch, pull up the map, plot a course
  for Arcturus and jump, and landing on New Greenland wraps up that opening job.


  Ships, planets and stations are modeled in blocky 3D bricks, an unusual look
  for an old-school space trader.


  Every port you land at has a contract board, markets, a shipyard, an
  outfitter, fleet services and a bank. Between them you can haul cargo, ferry
  passengers, mine, refit your ship and give orders to your escorts.


  The contracts get pleasantly specific, since each one names an exact planet.
  Survey jobs want brand-new scans. Assay jobs use up Metal you're actually
  carrying, while excursions want every stop visited before you head back home.


  The main storyline follows the Free Worlds, with civilian and alien storylines
  running beside it.


  On the Concourse screen you'll find conversations, a field guide and four
  branching stories. A journal keeps track of the objectives you haven't
  finished and the routes they need. Once you reach the ending, you're free to
  keep flying.


  The bank screen has more bookkeeping than you'd expect from a space game,
  listing daily payments, crew wages, your credit rating and loan offers tied to
  your income. At the outfitter, you can buy upgrades and leave them stored on a
  planet to install later, even on a different ship.


  Your progress autosaves in the browser. The options let you remap keys, adjust
  audio and graphics, switch to fullscreen, and export or import your save.


  This is a reimagining of Endless Sky with its own geometry and interface,
  while its universe data, story inspiration and audio come from the Endless Sky
  contributors.
