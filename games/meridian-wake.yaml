slug: meridian-wake
title: Meridian Wake
tagline: Fly a brick-built spaceship, trade, mine, fight, and follow stories
  across star systems.
description: >-
  Choose a Sparrow, a Shuttle or a Star Barge, then take the first call at New
  Boston and fly out. Open the map, pick Arcturus, jump, and set down on New
  Greenland to finish that first job.


  Everything is built from bricks, so the planets and ships look like chunky toy
  models.


  After that you decide how to earn a living. You can haul cargo, ferry
  passengers, mine, refit your ship and give orders to escorts, or follow the
  Free Worlds storyline or the civilian and alien ones.


  Ports are the hub, with contracts, markets, shipyards, outfitters, fleet
  services and a bank. The Concourse there adds chats with civilians, a field
  guide and four branching stories, and new contracts name exact planets, so you
  aren't guessing where to go.


  Assays actually consume your Metal, which is a nicely literal rule.


  The bank screen lays out what you owe each day, what your crew costs and your
  credit rating, plus loan offers sized to your income. The outfitter holds
  upgrades on a planet until you're ready to install them, even on a different
  ship, which makes swapping hulls less painful. Once the story ends you can
  keep exploring.


  Your journal tracks unfinished objectives and routes. Saves live in your
  browser, so export a backup before you start a new captain or clear browser
  data, and note that keyboard, touch and gamepad all work.
