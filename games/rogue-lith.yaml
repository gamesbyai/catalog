slug: rogue-lith
title: Rogue Lith
tagline: Sneak downward through hostile levels, stealing and shooting your way deeper.
description: >-
  Your first objective is to go down through the base and find the entrance to
  the lower base. Rogue Lith mixes descent with stealth and rogue-like
  mechanics.


  A briefing before the level starts. A flashlight. Your ship's lit state as
  part of stealth.


  Use the left mouse button to fire the laser. Press the right mouse button to
  launch a flare. Press Tab to open the wireframe sector map. Press Space to
  open the objectives for a closer look.
