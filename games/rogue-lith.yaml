slug: rogue-lith
title: Rogue Lith
tagline: Sneak downward through hostile levels, stealing and shooting your way deeper.
description: >-
  Rogue Lith is a browser game that mixes action, shooting, and stealth in a
  roguelike descent. You play a thief heading deeper level by level, choosing
  between slipping past threats unseen and fighting your way through when a plan
  falls apart.


  The pairing of stealth with roguelike structure is the hook: each descent asks
  whether to stay quiet or open fire, and every choice carries into the next
  level down. It runs in 3D, supports multiplayer, and works on mobile as well
  as desktop. It placed 34th out of 945 entries in Vibe Jam 2026.


  The creator built it with Cursor, using Three.js for the 3D rendering, which
  lets the whole game run directly in a web browser without any installation.
