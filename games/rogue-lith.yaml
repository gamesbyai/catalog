slug: rogue-lith
title: Rogue Lith
tagline: Sneak downward through hostile levels, stealing and shooting your way deeper.
description: >-
  The first objective sends you down through the base to find the entrance to
  the lower base. A briefing comes before the level starts.


  Left mouse fires a laser and right mouse launches a flare. Whether your ship
  is lit ties into the stealth side of the game. You also have a flashlight.


  Tab opens a wireframe sector map. Space opens objectives for a closer look.
