slug: rogue-lith
title: Rogue Lith
tagline: Sneak downward through hostile levels, stealing and shooting your way deeper.
description: >-
  The first objective sends you down through a dark, riveted-metal base to find
  the entrance to the lower base. You see it from a first-person cockpit view,
  and a briefing screen with text over an asteroid-like rock comes before the
  level starts.


  Left mouse fires a laser and right mouse launches a flare. Both sit in
  numbered slots on the dashboard. Hull, shield and energy bars track your
  condition, and a light gauge in the center reads LIT or not, which ties into
  the stealth side of the game. A flashlight is also on the panel.


  Tab opens a wireframe sector map in the corner of the screen. A level and XP
  counter at the top starts at level 1 with 0 of 40 XP. Objectives appear as
  prompts, and Space opens them for a closer look.
