slug: rogue-lith
title: Rogue Lith
tagline: Sneak downward through hostile levels, stealing and shooting your way deeper.
description: >-
  You play a thief sneaking down through hostile levels in Rogue Lith, stealing
  and shooting your way deeper one level at a time. The descent is a 3D
  roguelike that mixes action and shooting with stealth.


  According to the creator, it was built with Cursor, using Three.js for the 3D
  rendering so the whole game runs directly in a web browser. It supports online
  multiplayer, and it came 34th of 945 in Vibe Jam 2026.


  Stealth inside a roguelike structure is the hook. Every descent asks whether
  to stay quiet or open fire: you can slip past threats unseen, or fight your
  way through when a plan falls apart. Each choice carries into the next level
  down, so how you handle one floor shapes the one below it.
