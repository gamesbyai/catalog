slug: ship-snatch
title: Ship Snatch
tagline: Build a hex archipelago and defend your Captain's Keep from enemy ships
  and sea monsters.
description: >-
  Pirate ships and tentacled sea creatures come at your castle in waves, and
  your job is to keep the Captain's Keep standing through all of them.
  Everything plays out in real time on a top-down map made of hexagonal tiles. A
  three-line motto on the title screen tells you to build your island, defend
  the Keep and hold back the waves.


  Your island grows one hex at a time, so you're slowly stretching it out into a
  little chain of islands. You place defenses and upgrade them, but only on
  ground you've already claimed, which means your coastline decides where your
  cannons can stand.


  Those cannons sit on the tiles around the central keep and fire at ships
  sailing in across the water, while purple tentacles rise out of the sea close
  by.


  It's all modeled to look like clay, from the sand and grass tiles to the small
  ponds tucked into the land. Palm trees, piles of gold coins and wooden barrels
  are dotted around the island. Even the pirate flags on the ships and the
  castle tower get the same soft, handmade treatment.


  Before anything starts, the game asks you for a captain name and then lets you
  pick Start Solo or Start Multiplayer.


  Multiplayer is co-op, and there's a list of open rooms you can join if someone
  has already set sail. It comes with a global leaderboard as well.


  radomir_3 aimed for a look a nine-year-old would enjoy that adults could still
  find worth playing.
