slug: ship-snatch
title: Ship Snatch
tagline: Build a hex archipelago and defend your Captain's Keep from enemy ships
  and sea monsters.
description: >-
  In Ship Snatch you grow an archipelago one hex at a time and hold your
  Captain's Keep against waves of enemy ships and sea monsters. The game is a
  top-down tower defense and base builder at sea: expand the map, place
  defenses, and upgrade them as the waves come.


  You can defend alone or in co-op with up to 32 players. The AI tools were
  Cursor and the Gemini app, with Three.js handling the rendering.


  Growing the map and choosing where to fortify are part of the strategy, rather
  than just placing towers along a fixed path. The pirate theme comes in a
  claymation look, meant to be cute enough for kids while still giving adults
  something to think about.
