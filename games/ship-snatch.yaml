slug: ship-snatch
title: Ship Snatch
tagline: Build a hex archipelago and defend your Captain's Keep from enemy ships
  and sea monsters.
description: >-
  Keep the Captain's Keep standing through waves of pirate ships and tentacled
  sea creatures. You build your island and defend the Keep on a map of hexagonal
  tiles. Everything happens in real time.


  Cannons on the tiles around the central keep, firing at ships sailing across
  the water. Sea tentacles that rise out of the sea close to the cannons. Solo
  play, or co-op for up to 32 players. Open rooms that other players have
  already started. A global leaderboard.


  Enter a captain name before you start. Grow your island one hex at a time, so
  you slowly stretch it into a little chain of islands. Place and upgrade
  defenses only on ground you have already claimed. Your coastline decides where
  cannons can stand.


  radomir_3 aimed for a look a nine-year-old would enjoy, with the game still
  worth playing for adults.
