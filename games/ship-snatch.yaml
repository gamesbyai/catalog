slug: ship-snatch
title: Ship Snatch
tagline: Build a hex archipelago and defend your Captain's Keep from enemy ships
  and sea monsters.
description: >-
  You're trying to keep the Captain's Keep standing while waves of enemy ships
  and sea monsters close in on it. You grow your archipelago one hex at a time,
  and you place defenses on it and upgrade them as you go. Cannons are what
  you'll see lined up around the castle.


  It's a top-down tower defense with a base builder folded in, so the island
  you're defending is something you keep adding to.


  Everything looks sculpted from modeling clay, from the boats to the palm
  trees.


  Before you start, you type in a captain name and pick Start Solo or Start
  Multiplayer. Co-op lets several captains defend together, and the menu lists
  any open rooms you can join. A global leaderboard sits on the same screen.


  Kraken tentacles curl up out of the water around the island, which is a cute
  way to threaten a pirate fort.


  The creator made it with a 9-year-old nephew in mind, but wanted adults to
  find it interesting too. It runs in real time in the browser, so there's
  nothing to install.
