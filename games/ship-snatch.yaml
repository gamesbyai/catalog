slug: ship-snatch
title: Ship Snatch
tagline: Build a hex archipelago and defend your Captain's Keep from enemy ships
  and sea monsters.
description: >-
  The aim is to keep your castle standing as pirate ships and tentacled sea
  creatures come at it in waves. You start on a top-down map of hexagonal tiles,
  add land one hex at a time to grow an island chain, and place and upgrade
  defenses on the ground you have claimed.


  Cannons sit on tiles around the central keep and fire at ships approaching
  across the water, while tentacles rise from the sea nearby. Everything is
  modeled in clay, with sand, grass and pond tiles, palm trees, coin piles and
  barrels.


  The title screen asks for a captain name, then offers Start Solo or Start
  Multiplayer. Multiplayer is co-op, with a list of open rooms to join and a
  global leaderboard. Play is real-time. The creator aimed for a look a
  nine-year-old would enjoy that adults could still find worth playing.
