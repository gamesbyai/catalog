slug: ship-snatch
title: Ship Snatch
tagline: Build a hex archipelago and defend your Captain's Keep from enemy ships
  and sea monsters.
description: >-
  Ship Snatch is a top-down hex tower defense and base builder set on the sea.
  You expand an archipelago one hex at a time, place defenses, and upgrade them
  to hold your Captain's Keep against waves of enemy ships and sea monsters.


  The look is claymation with a pirate theme, aimed at being cute enough for
  kids while still giving adults something to think about. Growing the map and
  choosing where to fortify are part of the challenge, not just placing towers
  on a fixed path.


  It runs in the browser and supports solo play or co-op with up to 32 players,
  and it works on mobile. The creator built it with Cursor and the Gemini app,
  using Three.js for rendering, and made it for the Vibe Jam 2026.
