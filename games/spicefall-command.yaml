slug: spicefall-command
title: Spicefall Command
tagline: Harvest spice, capture condensers, and defend your Command Spire in
  desert RTS fights.
description: >-
  Hostile commanders are trying to tear down your desert base in this real-time
  strategy skirmish. You harvest spice, keep the power grid stable, raise your
  water capacity and guard your Command Spire from destruction.


  Atmospheric condensers, worth capturing for a strategic edge over the other
  houses. Two sci-fi houses, one of them the Sunforge Compact. Randomized desert
  maps for each match. Small skirmishes up to large AI battles. A separate house
  and team setting for each AI opponent. Matches of a few minutes each.


  Pick your house, map size, AI count and team before shooting begins. Same team
  number means allies; every other command center is hostile. An AI can be a
  partner as easily as an enemy. Drag to select units. Right-click to move,
  attack, harvest or set a rally point. Press 1–7 to train units, Q, W, E, R, Y
  or T to build structures. Use A for attack-move and Shift to queue orders.


  Bitten Heart Studio looked to classic desert strategy games for inspiration.
