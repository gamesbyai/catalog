slug: spicefall-command
title: Spicefall Command
tagline: Harvest spice, capture condensers, and defend your Command Spire in
  desert RTS fights.
description: >-
  You command a base on a desert planet, harvesting spice and keeping your power
  grid steady while hostile commanders try to wreck your Command Spire. It's a
  real-time strategy skirmish built around the economy.


  The map is randomized every match, so you never fight over the same ground
  twice.


  Before you deploy, you pick your house, the map size, how many AI players you
  face and which team you're on. Players who share a team number are allies and
  every other command center is hostile, so you can set up lopsided fights if
  you want. Each AI opponent gets its own house and team setting too.


  Spice, power and water are the three things you juggle, and the pressure comes
  from keeping all of them healthy at once. Atmospheric condensers sit out on
  the map and you can capture them for an edge, which is a good reason to push
  out instead of sitting at home.


  Two sci-fi houses compete, and matches range from small skirmishes to large AI
  battles.


  You drag to select units, then right-click to move, attack, harvest or set a
  rally point. A gives an attack move and Shift lets you line up a queue of
  orders. Number keys train units and letter keys place structures, so building
  doesn't send you hunting through menus. Escape or Space pauses, which is handy
  when a fight gets messy.
