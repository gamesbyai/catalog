slug: spicefall-command
title: Spicefall Command
tagline: Harvest spice, capture condensers, and defend your Command Spire in
  desert RTS fights.
description: >-
  You command a desert base in a real-time strategy skirmish against hostile
  commanders. Harvest spice, keep your power grid stable, and expand water
  capacity while defending your Command Spire from destruction. Capturing
  atmospheric condensers gives you a strategic advantage over the opposing
  houses.


  A setup screen comes first. You pick your house, the map size, the number of
  AI players, and your team, and each AI opponent gets its own house and team
  setting. Players who share a team number are allied, and every other command
  center is hostile. Every match uses a randomized map, from small skirmishes to
  large AI battles.


  Drag to select units, right click to give orders, and use number and letter
  hotkeys to train units and place structures. Shift queues orders, and a
  command console interface handles the rest. Two sci-fi houses compete, and a
  match runs a few minutes. Fullscreen at 1280x720 or higher is recommended.
