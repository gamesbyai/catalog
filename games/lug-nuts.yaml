slug: lug-nuts
title: Lug Nuts
tagline: Fix cars in first person to hit daily quotas, or the landlord takes your shop.
description: >-
  Fix cars on the shop floor of a small-town garage you run. Customers want
  their cars fixed before their temper gives out.


  A daily quota, three days running, as the goal. The landlord taking the garage
  as the downside. Coveralls with your name and a chosen color, set before
  clocking in. Six hats, including a traffic cone and a top hat. Parts you can
  pick up and hold.


  Hold the left mouse button to use your tool, and press 1 to 4 to switch slots.
  Right-click to grab a part, and right-click again to throw it. Press Q to drop
  what you're holding, a separate key from the throw. Press E to interact or hop
  into a car to drive. Press F to honk or turn on the flashlight. Hold Shift to
  sprint, and press Space to jump.
