slug: lug-nuts
title: Lug Nuts
tagline: Fix cars in first person to hit daily quotas, or the landlord takes your shop.
description: >-
  A small-town garage is yours to run, and the customers want their cars fixed
  before they blow their top. You work the shop floor.


  Your goal's to hit the daily quota three days in a row, or the landlord ends
  up with the garage.


  Before you clock in, you put your name on the coveralls and pick a color for
  them. Then you pick a hat from six options, with a traffic cone on the same
  list as a top hat.


  Holding down the left mouse button uses whatever tool's in your hand, and the
  number keys 1 through 4 flip between your four tool slots. The right mouse
  button grabs a part, and pressing it again throws it, which keeps the number
  of buttons down. Q drops whatever you're holding, and it's a separate key from
  the throw.


  E handles interacting with things and hopping into a car to drive.


  F honks or flips on the flashlight. Shift lets you sprint, and Space gets you
  off the ground.
