slug: diggy-dash
title: Diggy Dash
tagline: Tap popping Diglett in 3D holes before the timer runs out.
description: >-
  Diggy Dash is a 3D take on whack-a-mole, built around Diglett, the Pokémon
  that pops out of holes in the ground. Each round runs against a clock. Diglett
  pop up from the holes, and you tap them as fast as you can to rack up points
  before time expires.


  The pairing is the hook: a burrowing Pokémon that appears from holes suits the
  whack-a-mole format, so the premise reads at a glance. The creator,
  IlaneLopez, built it with Cursor on Three.js, and at Vibe Jam 2026 it placed
  432 of 945.


  Scores feed into a leaderboard, so each round becomes an attempt to beat the
  totals other players have posted. The tapping works on a phone as well as with
  a mouse on a desktop.
