slug: diggy-dash
title: Diggy Dash
tagline: Tap popping Diglett in 3D holes before the timer runs out.
description: >-
  Playing alone, you tap Pokémon Diglett heads to score as they rise out of a
  3x3 grid of holes.


  A clock that starts at 45 seconds. Tapping as many Digletts as you can before
  the clock reaches zero. Climbing a leaderboard of your scores.


  IlaneLopez picked Diglett because popping out of holes suits a whack-a-mole
  format.
