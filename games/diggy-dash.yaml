slug: diggy-dash
title: Diggy Dash
tagline: Tap popping Diglett in 3D holes before the timer runs out.
description: >-
  The field is a 3x3 grid of holes. Diglett heads rise out of the holes, and you
  tap them to score.


  The clock starts at 45 seconds, and the goal is to tap as many Digletts as you
  can before it reaches zero.


  Scores go onto a leaderboard that you try to climb. The creator chose Diglett
  because a creature popping out of holes suits the whack-a-mole format.
