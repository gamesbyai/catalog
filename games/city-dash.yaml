slug: city-dash
title: City Dash
tagline: Race through city streets delivering packages to earn more money.
description: >-
  City Dash is a racing game built around courier work. The player drives
  through an urban setting, picking up deliveries and getting them to their
  destinations. The tagline promises that more deliveries mean more earnings, so
  each run is a loop of driving, dropping off, and collecting pay.


  The game combines racing with delivery gameplay, so speed matters alongside
  the route you choose through the streets. It supports multiplayer and is
  playable on mobile devices as well as in a browser. It was entered in Vibe Jam
  2026, where it placed 316th out of 945 entries.


  The creator built it with Claude Code, and it renders its 3D city using
  Three.js, so it runs directly in the browser without extra installs.
