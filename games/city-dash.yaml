slug: city-dash
title: City Dash
tagline: Race through city streets delivering packages to earn more money.
description: >-
  City Dash is a racing game about courier work. You race through city streets
  picking up packages and getting them to their destinations, and every delivery
  adds to your earnings. A run is a loop of driving, dropping off and collecting
  pay, then heading out for the next one.


  It is an arcade racer with online multiplayer support that also runs on
  phones, built by goranmitev with Claude Code, and the 3D city it takes place
  in is rendered with Three.js. At Vibe Jam 2026 it ranked 316th of the 945
  entries.


  Speed is only part of it. The route you choose through the streets matters
  too, because more deliveries mean more money, and a better route gets you to
  the next drop-off sooner and keeps the pay coming.
