slug: city-dash
title: City Dash
tagline: Race through city streets delivering packages to earn more money.
description: >-
  You race through city streets as a courier in this arcade racer. You pick up
  packages and drive them to where they need to go, and each delivery adds to
  your earnings. Each run is a loop of driving, dropping off, collecting pay,
  and heading out again.


  Route choice through the streets, with more deliveries meaning more money.
  Better routes that reach the next drop-off sooner and keep the pay coming.


  goranmitev built City Dash.
