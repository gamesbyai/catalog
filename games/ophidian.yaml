slug: ophidian
title: Ophidian
tagline: Guide a growing snake around the board, eating food and avoiding your own tail.
description: >-
  Ophidian is a minimalist take on the classic Snake formula. You steer a snake
  around the playfield, collecting food to grow longer, and try to avoid running
  into obstacles or your own body. Each run lasts until you make a mistake, so
  the challenge builds as the snake gets longer.


  The main touch is the set of on-screen arrow keys built for mobile play.
  Phones and tablets get a direct way to steer, while the stripped-down
  presentation keeps attention on the movement and timing that make the genre
  work.


  The game is rendered with PixiJS. According to the listing, it was built with
  Claude, which fits its small scope: one familiar mechanic, kept simple and
  easy to pick up in a short session on any device with a browser.
