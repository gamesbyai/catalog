slug: ophidian
title: Ophidian
tagline: Guide a growing snake around the board, eating food and avoiding your own tail.
description: >-
  Ophidian takes Snake down to the basics and keeps the familiar mechanic. You
  steer a snake around the playfield, and the run ends when you make a mistake.


  Growth from each piece of food eaten. Obstacles and your own tail as the
  hazards. On-screen arrow keys on mobile. Steering that gets harder as the
  snake grows longer.
