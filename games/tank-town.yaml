slug: tank-town
title: Tank Town
tagline: Defend your base and blast enemy tanks in a cartoon take on Battle City.
description: >-
  Tank Town puts you in the driver's seat of a tank in a shooter inspired by the
  NES classic Battle City.


  Enemy tanks to fire at. A single base to defend, which has to survive each
  round. Multiplayer built in.


  KBezbailis wanted to play that game with friends, but the emulator version
  they tried only allowed solo play.
