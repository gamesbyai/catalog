slug: tank-town
title: Tank Town
tagline: Defend your base and blast enemy tanks in a cartoon take on Battle City.
description: >-
  Tank Town is a top-down tank shooter inspired by the NES classic Battle City.
  You drive a small cartoon tank through a field of chunky bricks and fire at
  enemy tanks, all while protecting a single base that has to survive each
  round. Lose the base and the round is lost.


  The creator wanted to play Battle City with friends, but the emulator version
  they tried only allowed solo play. So multiplayer is built in, and it runs in
  mobile browsers too, which makes a match easy to share. The game came together
  in Claude Code on Three.js, and its Vibe Jam 2026 result was 565th of 945.


  The look is a 1930s Sunday-morning cartoon: tiny tanks and blocky brick walls,
  rendered in 3D.
