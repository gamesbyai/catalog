slug: metal-assault
title: Metal Assault
tagline: Run, jump, and shoot through side-scrolling levels in a Metal
  Slug-style action game.
description: >-
  Mission 1 opens at sunset on a dusty street, where your red-bandana soldier
  has an endless pistol, ten grenades, two rifle soldiers walking toward you and
  a bound prisoner yelling for help down the road.


  It's a run-and-gun in the Metal Slug mold, so you shoot your way across the
  level. Up aims, down crouches, and when an enemy gets close the game switches
  you to a knife on its own.


  Rifle soldiers, grenadiers, melee attackers, bazooka troops, sandbag turrets,
  helicopters and tanks all stand between you and the end. Wooden crates drop
  weapons, grenades or points, while the red barrels blow up in chains that hurt
  everyone nearby, which makes them handy bait. Freeing prisoners pays out
  points and weapon crates.


  The weapon pickups are a heavy machine gun, spread shot, rockets and flame
  shot.


  You can also climb into the SLUG, a tank you board just by touching it. It has
  three armor points, crushes infantry and blocks light bullets, and the turret
  fires with your shoot key while the cannon uses the grenade key. When the
  armor runs out it explodes and throws you clear, which is a fair way to lose a
  tank.


  Close-range kills build a score multiplier up to x3, but one hit breaks the
  chain. You get three lives, you're briefly invincible after a respawn, and any
  lives left at the end of the mission turn into bonus score.


  Arcade Mission finishes with a gunship mini-boss, then General Morden's
  armored fortress, which has an arc cannon, a machine gun and infantry
  reinforcements. Once it drops below 60% health it loses its armor plating and
  starts mortar rains, so you watch the blinking ground markers to see where
  shells will land. Below 35% it enrages.


  Survival is the other mode, with endless waves in an arena and a high score of
  its own.


  A settings menu lets you rebind every action to two keys and set the volumes.
  The sprites, level, sound effects and music are all generated in code, so
  there are no outside files.
