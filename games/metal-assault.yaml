slug: metal-assault
title: Metal Assault
tagline: Run, jump, and shoot through side-scrolling levels in a Metal
  Slug-style action game.
description: >-
  A red-bandana soldier starts out on a desert street at sunset with a pistol
  that never runs dry, ten grenades and three lives, while rifle soldiers march
  in from the right.


  Wooden crates sit along the ground, a tied-up prisoner off to the side shouts
  for help, and Mission 1 flashes across the screen before the first shot. It's
  a Metal Slug-style run and gun, and the title screen even spells out the
  controls in Italian.


  You get two modes on the main menu. Arcade Mission is one long stage that ends
  at General Morden's armored fortress, and that fight has some real thought
  behind it. Below 60% health the fortress sheds its armor and calls down mortar
  rain, but blinking spots on the ground warn you where the shells will land,
  and under 35% it enrages.


  Survival is the other choice, an endless string of waves in an arena that
  keeps its own high score.


  You can shoot, jump, crouch and aim straight up, and when an enemy gets close
  your soldier pulls a knife automatically. Smashing crates turns up weapons,
  grenades or points, with a heavy machine gun, spread shot, rockets and a flame
  shot among the pickups. Red barrels blow up in chains and hurt everyone
  nearby, so you can lure enemies over to them.


  Freeing prisoners pays out points and weapon crates, while close-range kills
  push a score multiplier up to x3 until taking a hit breaks the chain.


  There's also a parked SLUG tank you board just by touching it. It carries 3
  armor points, a turret gun and a cannon, and it flattens infantry under its
  treads. There are plenty of targets for it, with grenadiers, bazooka troops,
  turrets, helicopters, tanks and a gunship mini-boss in the mix.


  Each action gets two rebindable slots in the settings, and high scores stay
  saved in your browser.


  Andrea Vitolo had Claude build the whole game in plain JavaScript, and
  surprisingly nothing is loaded from files, since the pixel-art sprites, the
  level, the sound effects and the music are all generated in code.
