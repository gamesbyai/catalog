slug: metal-assault
title: Metal Assault
tagline: Run, jump, and shoot through side-scrolling levels in a Metal
  Slug-style action game.
description: >-
  Your soldier starts with a pistol that never runs dry, ten grenades and three
  lives, while rifle soldiers march in.


  A tied-up prisoner shouts for help, and you can smash the crates for pickups.
  It's a Metal Slug-style run and gun.


  The game has two modes. Arcade Mission is one long stage that ends at General
  Morden's armored fortress. Below 60% health the fortress sheds its armor and
  calls down mortar rain, with marked spots that warn you where the shells will
  land, and under 35% it enrages.


  Survival is the other choice, an endless string of waves in an arena that
  keeps its own high score.


  You can shoot, jump, crouch and aim straight up, and when an enemy gets close
  your soldier pulls a knife automatically. Smashing crates turns up weapons,
  grenades or points, with a heavy machine gun, spread shot, rockets and a flame
  shot among the pickups. Red barrels blow up in chains and hurt everyone
  nearby, so you can lure enemies over to them.


  Freeing prisoners pays out points and weapon crates, while close-range kills
  push a score multiplier up to x3 until taking a hit breaks the chain.


  There's also a parked SLUG tank you board just by touching it. It carries 3
  armor points, a turret gun and a cannon, and it flattens infantry under its
  treads. There are plenty of targets for it, with grenadiers, bazooka troops,
  turrets, helicopters, tanks and a gunship mini-boss in the mix.


  Each action gets two rebindable slots, and high scores stay saved in your
  browser.


  Andrea Vitolo had Claude build the whole game in plain JavaScript, and nothing
  is loaded from files, since the sprites, the level, the sound effects and the
  music are all generated in code.
