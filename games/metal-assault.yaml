slug: metal-assault
title: Metal Assault
tagline: Run, jump, and shoot through side-scrolling levels in a Metal
  Slug-style action game.
description: >-
  The run starts on a desert street at sunset with a red-bandana soldier, a
  pistol with infinite ammo, ten grenades and three lives. Rifle soldiers walk
  in from the right, wooden crates sit along the ground, and a bound prisoner
  calls for help. The screen reads Mission 1 before the shooting begins.


  Two modes sit on the main menu. Arcade Mission is a single long mission that
  ends with General Morden's armored fortress, which enrages below 35% health
  and, under 60%, loses its armor and fires mortar rains marked by blinking
  ground spots. Survival is an endless run of arena waves with its own high
  score.


  Shoot, jump, crouch and aim upward, and a knife strikes automatically at close
  range. Crates drop weapons, grenades or points. Pickups include a heavy
  machine gun, spread, rocket and flame shot. Red barrels explode in chains and
  hurt everyone nearby, so you can lure enemies next to them.


  Rescuing prisoners earns points and weapon crates. Close-range kills build a
  score multiplier up to x3, and getting hit breaks the chain. A parked SLUG
  tank can be boarded by touching it, with 3 armor points, a turret gun and a
  cannon, and it crushes infantry. Enemies include grenadiers, bazooka troops,
  turrets, helicopters, tanks and a gunship mini-boss. Controls can be rebound
  in settings, and high scores are saved in the browser.
