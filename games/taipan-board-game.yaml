slug: taipan-board-game
title: Taipan Board Game
tagline: Build a pirate domain through trade or raids and race rival captains to
  the finish.
description: >-
  You can steal a rival's ship, raid their islands, or skip the violence and
  trade with friendlier captains. Piracy and trading are both real routes to
  winning, so you pick a style and build your domain around it.


  A turn runs through four steps: roll the dice, move, build, then end your
  turn. The dice give you two numbers at once, one for how far your ships can
  move and one for production, which is why the roll matters before you do
  anything else.


  You can also undo a move, which is handy on a board this busy.


  The map is a sea of blue hexes with islands scattered across it, each one
  tagged with a letter and a number. Ports and buildings show up on the islands
  as small anchor and warehouse icons, and a rival's territory gets outlined in
  red so you can tell whose it is.


  Above the board there are decks for Fortune, Peril and Tempest cards, plus a
  Cargo deck and an Islands deck. You also collect delivery tokens and piracy
  tokens, and a bar at the top tracks your money, your moves and any fate card
  effects.


  Ship upgrades and attributes change how each captain plays, so no two games go
  the same way. Delivering cargo through enemy waters can pay big, though it's a
  risk.


  The creator spent two years prototyping this as a physical board game and
  built the browser version to get more people playtesting it. There's a
  tutorial for learning the rules, and the creator says a game takes about half
  an hour.
