slug: taipan-board-game
title: Taipan Board Game
tagline: Build a pirate domain through trade or raids and race rival captains to
  the finish.
description: >-
  Build your domain by trading or by piracy in Taipan, a strategy board game
  where either route can win. You can play against other people or on your own.


  Friendlier captains to trade with. Big-money deliveries through enemy waters.
  Rival ships to steal and islands to raid. Ship upgrades and attributes for
  shaping a different captain from one game to the next. Numbered islands, with
  cargo and island cards. Fortune, Peril and Tempest decks. A session of about
  half an hour.


  Roll two red dice and a white one. They set your movement and production.
  Move, build, then end your turn. Undo a move if it isn't what you meant. Your
  choices carry into the next turn and can speed up or slow how fast your domain
  grows. A tutorial covers the rules first, and they're short once you know
  them.


  bragoatski spent two years testing Taipan as a tabletop prototype before
  making this digital version. Building it showed balance problems in the
  original, and those problems led to changes in the mechanics. According to the
  creator, AI helped with the code.
