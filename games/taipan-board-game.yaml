slug: taipan-board-game
title: Taipan Board Game
tagline: Build a pirate domain through trade or raids and race rival captains to
  the finish.
description: >-
  In Taipan it's up to you whether you build your domain by trading or by
  piracy, and both routes can win you the game. You can trade with captains who
  are friendlier to you, or sail through enemy waters to land a delivery that
  pays a lot.


  If that sounds too polite, you can steal a rival's ship or raid their islands
  instead.


  On your turn you roll the dice, move, build and then end your turn. Two red
  dice and a white one set your movement and your production, and you can undo a
  move if it doesn't go the way you meant.


  Whatever you pick on one turn carries into the next, so it speeds up or holds
  back how fast your domain grows. Ship upgrades and attributes let you shape a
  different captain from one game to the next. Islands are numbered, and the
  game uses Fortune, Peril and Tempest decks along with cargo and island cards.


  The rules stay short once they click, and a tutorial walks you through them
  first.


  You can play against other people or on your own, and a session runs about
  half an hour. bragoatski spent two years testing Taipan as a tabletop
  prototype before making this digital version, and building it turned up
  balance problems in the original that led to changes in the mechanics.
  According to the creator, AI helped with the code.
