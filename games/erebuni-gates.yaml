description: >-
  Hold the walls of the ancient Armenian fortress of Erebuni as its last
  defender, wave after wave, for as long as you can.


  A siege of shadow and stone that never ends. Powerful trials to choose between
  waves, each shaping the next stretch. Wave-based action shooting on the
  ramparts.


  Armenian history is the creator's reason for making it.
