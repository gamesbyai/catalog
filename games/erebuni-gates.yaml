slug: erebuni-gates
title: Erebuni Gates
tagline: Defend the walls of ancient Erebuni through endless waves, picking
  trials between fights.
description: >-
  Erebuni Gates is a wave-based action shooter that puts you on the walls of the
  ancient Armenian fortress of Erebuni as its last defender. The siege of shadow
  and stone does not end, so each run is a string of waves, and the goal is to
  hold the ramparts for as long as you can.


  The setting draws on Armenian history, which the creator gives as the reason
  for making it. Made in Cursor on Three.js, it ranked 185th of the 945 entries
  at Vibe Jam 2026.


  Between waves, you choose from a set of powerful trials, and each choice
  shapes how the next stretch of the siege plays out. It is a single-player
  game, played wave by wave against a siege that never lets up.
