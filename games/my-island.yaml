slug: my-island
title: My-Island
tagline: Build a cozy tropical island city from a single Town Hall and collect coins.
description: >-
  The decor you place on this tropical island raises Happiness, and Happiness
  multiplies every coin your buildings bring in. You start with a single Town
  Hall and a pile of coins, then build the island up. Nothing on the island runs
  on a timer, and there's no way to fail at all.


  14 buildings across homes, businesses and decor, including beach huts, coconut
  stands, tiki bars and a lighthouse. Island land, stretched from 9x9 out to
  15x15 through Town Hall upgrades. Pip, a blue parrot and your island's
  familiar, wandering the beaches and cheering you on. Automatic saving of your
  progress in the browser. Driftwood, shells and wild coconuts washing up over
  time, cleared for bonus coins and rare Shells.


  Pick a home, business or decor piece to place. Tap a building to collect coins
  it earns over time. Open its menu to check info, upgrade, move or sell it.
  Spend coins on new buildings and upgrades for each one you own. Once
  population is high enough, upgrade the Town Hall to raise the island level and
  unlock new buildings.


  Both the art and the music are generated in code. According to MaoKoroku,
  development was heavily AI-assisted.
