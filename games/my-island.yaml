slug: my-island
title: My-Island
tagline: Build a cozy tropical island city from a single Town Hall and collect coins.
description: >-
  You begin with one Town Hall on a small isometric patch of sand and grass, and
  a pile of coins to spend. Open the shop from the Build button, place homes,
  businesses and decor, then tap each building to collect the coins it earns
  over time. There are no timers and no fail states.


  Coins go back into new buildings and per-building upgrades. Decor raises
  Happiness, which multiplies all income. The top bar tracks coins, rare Shells,
  island level, population, joy, income per minute and the current boost. A goal
  line under it names the next target, such as a population and coin cost for
  growing the island.


  Raising population lets you upgrade the Town Hall, which lifts the island
  level, unlocks new buildings and expands the land from 9x9 to 15x15.
  Driftwood, shells and wild coconuts wash up on the shoreline over time.
  Clearing them pays bonus coins and rare Shells.


  The game has 14 buildings across homes, businesses and decor, including beach
  huts, coconut stands, tiki bars and a lighthouse. A parrot named Pip wanders
  the beaches. The scene has a golden hour day cycle, drifting clouds and
  sailboats. Progress auto-saves in the browser. The art and music are generated
  in code, and development was heavily AI-assisted.
