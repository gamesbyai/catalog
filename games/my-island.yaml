slug: my-island
title: My-Island
tagline: Build a cozy tropical island city from a single Town Hall and collect coins.
description: >-
  Every building on your island earns coins as time passes, and you tap one to
  collect what it's made.


  You start with a lone Town Hall on a small patch of sand and grass, then spend
  coins from the shop on more. There are 14 buildings split into homes,
  businesses and decor, with beach huts, coconut stands, tiki bars and a
  lighthouse among them. Each one has its own upgrade levels, so you can also
  put money back into what you already own.


  Decor raises Happiness, and Happiness multiplies all of your income. That
  gives a pretty good reason to buy decorations instead of only shops.


  The main goal sits at the top of the screen as a target for growing the
  island.


  Once your population and coin count reach it, you upgrade the Town Hall to
  raise your island level. That unlocks new buildings and physically expands the
  land, from 9x9 tiles up to 15x15.


  The shoreline adds a side job, because driftwood, shells and wild coconuts
  wash up over time. Clearing them pays bonus coins and rare Shells, which are
  the second currency.


  Pip the parrot wanders the beaches and cheers you on, and he's your familiar
  for the jam's theme. Nothing nags you with timers, there's no way to fail, and
  the game saves on its own in your browser. The art is drawn in code and the
  soundtrack is synthesized there too, with heavy AI help on the development.
