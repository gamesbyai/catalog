slug: my-island
title: My-Island
tagline: Build a cozy tropical island city from a single Town Hall and collect coins.
description: >-
  The decor you put on this tropical island pulls a lot more weight than it
  looks, because it raises Happiness, and Happiness multiplies every coin your
  buildings bring in.


  You start with a single Town Hall and a pile of coins to spend. You can pick
  out homes, businesses and decor to place. Each building earns coins over time,
  and you tap it when you want to collect them.


  Those coins go back into new buildings and into upgrades for each one you've
  already got. Tapping a building also lets you check its info, upgrade it, move
  it or sell it.


  Nothing on this island runs on a timer, and there's no way to fail at all.


  Your next target is something like a population number and a coin cost for
  growing the island. Once your population is high enough, you can upgrade the
  Town Hall, which lifts the island level, unlocks new buildings and stretches
  the land from 9x9 out to 15x15.


  Driftwood, shells and wild coconuts wash up along the shoreline over time.
  Clearing them away pays out bonus coins and rare Shells.


  There are 14 buildings across homes, businesses and decor, including beach
  huts, coconut stands, tiki bars and a lighthouse, and a blue parrot named Pip,
  cast as your island's familiar, wanders the beaches cheering you on. Your
  progress saves automatically in the browser.


  Both the art and the music are generated in code. According to the creator,
  development was heavily AI-assisted.
