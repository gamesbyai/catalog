slug: build-destroy-fortress-duel
title: Build & Destroy - Fortress Duel
tagline: Build a fragile fortress, then smash it apart in a physics sandbox.
description: >-
  The game has two halves: you build a fortress, then you knock one down. In
  Builder Mode you stack stone, wood, and glass around a flag, working within a
  budget of 30 points. The goal is a structure that can protect that flag.


  In Destroyer Mode you attack fortresses with a siege launcher. You choose your
  ammo, aim the launcher, and fire to capture the flag. The ammo available
  depends on the choices made in the fortress you are attacking.


  A leaderboard tab ranks the best defenses and the cleanest captures. The menu
  shows a fantasy castle backdrop, with separate buttons for building,
  attacking, and checking ranks.


  The creator wanted to let players make their own levels in a physics sandbox
  after years of playing Angry Birds-style games.
