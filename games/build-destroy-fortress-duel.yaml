slug: build-destroy-fortress-duel
title: Build & Destroy - Fortress Duel
tagline: Build a fragile fortress, then smash it apart in a physics sandbox.
description: >-
  Ammo against a rival fortress is unlocked by its builder's choices. In this
  physics sandbox, you stack stone, wood and glass around a flag, then attack
  rivals.


  Builder Mode. A 30-point budget for the whole structure. Keeping the flag safe
  as the goal. Destroyer Mode, with a siege launcher. Leaderboard rankings of
  the best defenses and cleanest captures.


  Switch sides, pick your ammo, aim and fire to capture the flag.


  domenicodd wanted players to make their own levels, an idea from years of
  playing Angry Birds-style games that they carried for a decade before it
  became this game.
