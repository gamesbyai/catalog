slug: build-destroy-fortress-duel
title: Build & Destroy - Fortress Duel
tagline: Build a fragile fortress, then smash it apart in a physics sandbox.
description: >-
  Build & Destroy - Fortress Duel is a physics game that splits every session in
  two. First you construct a fortress meant to be tricky to topple, then you aim
  at it and watch the pieces collapse under the impact.


  The creator says the concept came from years of playing Angry Birds and
  wondering why games like it rarely let players design the levels. Here you
  make your own challenge instead of only solving premade ones. The creator used
  Codex and Three.js, and the game came 256th of 945 at Vibe Jam 2026.


  Planning is where the puzzle and strategy come in. Working out how a structure
  will hold, and where it will fall, makes building the puzzle as much of the
  game as breaking it.
