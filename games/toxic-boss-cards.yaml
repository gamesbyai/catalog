slug: toxic-boss-cards
title: Toxic Boss Cards
tagline: Beat 50 terrible bosses in card battles, alone or with a friend.
description: >-
  Play solo or with a friend against nightmare bosses, one card duel at a time.
  Your opponent is a nightmare manager. Try to wear each boss down before it
  does the same to you.


  A campaign of 50 of the worst bosses imaginable. Cards played from your hand.
  Workplace frustration as the theme of the bosses.


  VIII drew the premise from a background as a developer who went back to a
  corporate job. According to the creator, the build keeps it light enough to
  open and start playing quickly.
