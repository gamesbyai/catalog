slug: bitwars
title: bitwars
tagline: Shoot other players in a multiplayer first-person sandbox arena.
description: >-
  Bitwars is a multiplayer first-person shooter set in a sandbox space. Players
  join a shared session, move around in first person, and fight other players in
  real time. It is an action-focused game built around shooting and moving in a
  shared 3D environment.


  The project began as a personal experiment. The creator wanted to try Three.js
  for rendering and SpacetimeDB for the multiplayer side, and the game shows
  that pairing put to work in a live shooter. It was entered in Vibe Jam 2026.


  According to the creator's submission, the game was built with Codex, OpenAI's
  coding tool, and rendered with Three.js. The sandbox label suggests an open,
  loosely structured take on the genre rather than a fixed campaign.
