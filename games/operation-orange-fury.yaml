slug: operation-orange-fury
title: "Operation: Orange Fury"
tagline: Swipe through political scandals, bet fake crypto on surviving, and
  share your death.
description: >-
  Operation: Orange Fury is a mobile-friendly action game built around swiping.
  You move through scenarios drawn from real presidential scandals while placing
  bets of fake crypto on whether you will survive. When a run goes wrong, your
  character dies in a darkly comic way, and the game hands you a cause of death
  to show off.


  The satire is the hook. It takes real political controversies as its raw
  material and pairs them with a mock-crypto betting layer, so every decision
  carries both a survival risk and a wager. The shareable cause-of-death result
  turns each failure into something to pass along to friends.


  The creator says it grew out of interest in the war and the worldwide dislike
  of the American political scene. It was entered in Vibe Jam 2026, and the
  creator built it with Claude Code.
