slug: banished
title: Banished
tagline: Fly and fight in a six-degrees-of-freedom arena shooter with multiplayer.
description: >-
  Banished is a six-degrees-of-freedom arena shooter, where the player can move
  and turn freely in every direction rather than staying on a flat floor.
  Matches take place in enclosed arenas, and the goal is to outmaneuver
  opponents and shoot them down. It supports multiplayer and also runs on
  mobile.


  The arenas were built with the Hammer level editor from Half-Life 2, which
  gives the maps a classic level-design feel. The art, sound effects, and music
  are all generated. Its subtitle points to Forsaken 64, a fast free-flight
  shooter, as a clear reference for the style.


  The game was entered in Vibe Jam 2026 and runs on PlayCanvas. The creator
  built it with Claude Code, and generated assets fill out the visuals and audio
  around the hand-built levels.
