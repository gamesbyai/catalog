slug: banished
title: Banished
tagline: Fly and fight in a six-degrees-of-freedom arena shooter with multiplayer.
description: >-
  You fly through enclosed arenas with no floor. You outmaneuver your opponents
  and shoot them down.


  You move with six degrees of freedom and can turn in every direction, up and
  down included. Online multiplayer matches. Arenas made in Hammer, the level
  editor from Half-Life 2.


  AnarchyArcade built it. All of the art, sound effects and music is generated,
  filling the space around hand-built levels. Forsaken 64, a fast free-flight
  shooter, is the reference for how it plays.
