slug: banished
title: Banished
tagline: Fly and fight in a six-degrees-of-freedom arena shooter with multiplayer.
description: >-
  Banished has no floor for you to stick to. It is a six-degrees-of-freedom
  arena shooter, so you fly and turn freely in every direction, up and down
  included, inside enclosed arenas, outmaneuvering opponents and shooting them
  down in online multiplayer matches.


  Its subtitle points to Forsaken 64, a fast free-flight shooter, as the clear
  reference for the style of play. Built by AnarchyArcade with Claude Code on
  PlayCanvas.


  The art, sound effects and music are all generated, and they fill in around
  levels built by hand. The arenas themselves were made in Hammer, the level
  editor from Half-Life 2.
