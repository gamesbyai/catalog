slug: crazy-cat-cafe
title: Crazy Cat Cafe
tagline: Run a cozy cat cafe while the cats keep knocking your mugs off the counter
description: >-
  Crazy Cat Cafe is a cozy cafe management game in which the cafe's cats are the
  main obstacle. You serve drinks and keep the place running, while the cats
  keep breaking your mugs. Each session is a balancing act between looking after
  customers and dealing with the mess the felines leave behind.


  The pairing of a relaxed cafe setting with cats that cause trouble gives the
  game its humor and its tone. It is built to run on mobile as well as in a
  browser, so a short session fits easily into a spare moment.


  The game was entered in Vibe Jam 2026. According to the creator, it began when
  the kids asked for a game about cats and the creator wanted a coffee. It was
  built with Bolt and uses the Phaser framework.
