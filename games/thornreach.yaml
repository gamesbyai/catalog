slug: thornreach
title: Thornreach
tagline: Start with six farmhands and a sword, then fight for a medieval crown.
description: "The old king of Thornreach is dead and three great houses are circling his empty throne. You start as a landless knight with six farmhands, a little silver and a sword, and you're aiming to be crowned at Highcrown. Your renown at the coronation is your final score, and getting there sooner earns a bonus.


  Real-time battles on their own field, where you fight as your knight while giving orders to your troops. Sieges with walls, a gate, ladders and a ram. Militia, spearmen, swordsmen, archers and riders to recruit and upgrade into pikemen, knights, crossbowmen and lancers. Wages and food to pay, and fiefs that bring in money every week. A nine-chapter story of about 45 to 90 minutes, saved after battles and every in-game week.


  Tap the gold arrow on the objective card to march to your next goal, or click any place on the map to travel there. In battle, move your knight with WASD and attack with a click. Space orders a charge, R calls your troops to follow you and H holds them in place."
