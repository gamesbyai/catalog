slug: beatback
title: BEATBACK
tagline: Fight off waves of enemies with attacks that fire in time to the music.
description: >-
  BEATBACK is a survivors-style action game built around rhythm. Your attacks
  pulse in time with the music, so each run is a mix of staying alive against
  approaching enemies and keeping your timing on the beat. The music does not
  just sit in the background; it pushes back against you.


  The main idea is adding real skill to a genre that often leans on automatic
  attacks. Timing matters here, and the rhythm mechanic is the center of the
  moment-to-moment play. It runs in the browser, is set up for mobile, and is a
  single-player arcade experience.


  The creator, a game designer with seven years of experience, says they built
  it with AI for a game jam and used Cursor. They describe AI as a collaborator
  that amplifies a designer's taste, and they hoped to add an upgrade system
  before the jam closed.
