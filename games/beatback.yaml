slug: beatback
title: BEATBACK
tagline: Fight off waves of enemies with attacks that fire in time to the music.
description: >-
  BEATBACK is a single-player, survivors-style action game where your attacks
  fire in time with the music. Enemies close in wave after wave, and each run
  asks two things of you at once: stay alive, and keep your timing on the beat.


  The creator, a game designer with seven years of experience, made it with
  Cursor for Vibe Jam 2026 and describes AI as a collaborator that amplifies a
  designer's taste. They hoped to add an upgrade system before the jam closed,
  and the game placed 210th of 945.


  The design goal is to put real skill into a genre that often leans on
  automatic attacks. Timing matters here, and the rhythm mechanic is the center
  of the moment-to-moment play rather than something in the background.
