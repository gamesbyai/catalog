slug: beatback
title: BEATBACK
tagline: Fight off waves of enemies with attacks that fire in time to the music.
description: >-
  Your attacks fire in time with the music in BEATBACK, a survivors-style action
  game.


  Enemies that close in wave after wave. Staying alive and keeping the beat,
  both needed in each run. Rhythm at the center of moment-to-moment play, not
  something in the background.


  zoidburghh, a game designer with seven years of experience, wanted real skill
  in a genre that often leans on automatic attacks. They describe AI as a
  collaborator that amplifies a designer's taste.
