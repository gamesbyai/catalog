slug: tetris-game
title: tetris game
tagline: Stack falling blocks and clear lines in a neon-styled browser Tetris.
description: >-
  This is a browser-based take on Tetris. Blocks of different shapes fall into a
  playing field, and the player moves and rotates them to complete horizontal
  lines. Cleared lines make room for more pieces, and a run continues until the
  stack reaches the top.


  The presentation leans on neon arcade visuals, with glowing colors against a
  dark backdrop. The layout is responsive, so it is meant to fit different
  screen sizes instead of only a desktop window. The game is drawn on an HTML
  canvas using plain HTML, CSS, and JavaScript.


  The repository tags point to Claude Code and vibe coding, and the creator's
  listing names Claude as the AI tool used. It is a compact project built around
  the familiar classic rules.
