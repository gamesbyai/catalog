slug: overtime-rush
title: Overtime Rush
tagline: Race your coworkers down an office track, dodging obstacles and
  dismissing phone calls.
description: >-
  The two characters you play as are Daniel and Derek. Everyone in the group is
  racing for the finish line, and you're trying to outrun your coworkers.


  Along the way you've got obstacles to avoid while dismissing phone calls.


  You can go through the track walls, because the creator ran into problems
  adding collisions to them. Their answer is simply to follow the track, which
  they think is all you need to be fine. They swear there's nothing past the
  office walls.


  If you win the race, the game's ending is there for you to reach.


  The whole game was made from scratch, according to the creator. The AI they
  used likes to troll now and then, which is why their advice is to reload if
  the game won't load properly or runs into trouble.
