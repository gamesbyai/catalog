slug: voxel-rush-frontline
title: Voxel Rush — Frontline
tagline: Fight for five flags in 40-soldier voxel battles with tanks and helicopters.
description: "Two armies fight over five flags in Frontline, the big-battle mode of
  Voxel Rush. A battle holds up to 40 soldiers, and bots take the slots no
  player has filled.


  Six classes, from a medic who revives fallen teammates to an engineer with
  guided rockets and a welder for fixing armor. Tanks to drive and helicopters
  to fly. Destructible terrain. Team Deathmatch and a survival world with base
  building elsewhere in the same game. Guest play in 13 languages, with nothing
  to download and no ads in the game.


  Pick a class with the 1 to 6 keys, click the map to choose where you come in
  and press Space to deploy.


  Max Dmitriev develops Voxel Rush solo in TypeScript with AI-assisted coding
  and hasn't measured how much of the code the AI wrote."
