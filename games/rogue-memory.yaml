slug: rogue-memory
title: Rogue Memory
tagline: Crawl through a deleted AI's mind, recovering memories and escaping the
  Architect.
description: >-
  Rogue Memory is a first-person dungeon crawler with retro raycasting visuals.
  You play GHOST.EXE, a deleted program surviving in a buffer overflow. Each run
  generates new maps across five layers. You find a key fragment, reach the
  exit, and descend toward the system kernel, where the Architect waits.


  Combat is turn-based: attack, scan for weaknesses, or retreat. Scanning
  exposes an enemy's vulnerability and strengthens your next strike. Nine enemy
  types patrol, chase on sight, hit harder over time, or heal themselves, and
  breaking line of sight can shake them off. Running is often smarter than
  fighting.


  The story arrives through more than 25 recovered memory logs, and three
  endings depend on how many fragments you gather. Sound effects are generated
  in real time. The creator says it was made entirely with Claude, and the
  jam-version notes mention difficulty levels and a Phase Shift move.
