slug: rogue-memory
title: Rogue Memory
tagline: Crawl through a deleted AI's mind, recovering memories and escaping the
  Architect.
description: >-
  You play GHOST.EXE, an AI that got deleted and survived as a fragment, and you
  creep through the ruins of your own mind in a first-person view with retro
  raycast graphics. Every run builds a new map, so you can't memorize the
  corridors.


  Each level hides a glowing key fragment, and grabbing it unlocks the exit that
  takes you down to the next layer. There are five layers, going from broken
  memory banks to the system kernel, where the Architect who ordered your
  deletion is waiting.


  You don't have to fight everything. Running is often smarter.


  When you do fight, it's turn-based: you can attack, scan, or retreat. Scanning
  shows an enemy's weak spot and makes your next hit stronger, which gives you a
  reason to spend a turn looking before swinging.


  Nine enemy types behave differently, from patrollers to ones that chase on
  sight and ones that heal themselves. Enemies spot you by line of sight and
  head for the last place they saw you, so breaking that line is how you shake
  them.


  Your integrity is the thing to watch, because echo chambers drain it slowly,
  traps hit hard, and enemies hit harder.


  The story comes in recovered memory logs, more than 25 of them, which explain
  who you were and why the deletion was signed. How many you've collected by the
  time you escape decides which of three endings you get. There are also
  difficulty levels, and the see-through view only works on Easy, which is a
  neat way to tie help to the easier setting.
