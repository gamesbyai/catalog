slug: rogue-memory
title: Rogue Memory
tagline: Crawl through a deleted AI's mind, recovering memories and escaping the
  Architect.
description: >-
  A fragment of GHOST.EXE survived its deletion inside a maze made of its own
  memories. You guide that fragment down through five layers, from the memory
  banks to the system kernel, and every run builds a fresh map.


  Nine enemy types, from patrollers and sight-based chasers to escalating
  attackers and self-healing parasites. The Architect, the directive behind your
  deletion, waiting at the bottom. Turn-based fights. Backstory from over 25
  memory logs, collected as you go, covering why the deletion order was signed
  and what someone called MIRROR left you eleven years back. Three endings, set
  by fragments recovered before escape. Difficulty levels. Top-runs list logging
  each run's score, cause of death, level, fragments, kills and steps.


  Move with WASD. Each layer: find the key fragment, reach the exit it unlocks,
  descend. Integrity, your health, leaks from every side. Echo chambers drain it
  slowly, traps cost a lot, and enemies cost more. You don't need to fight
  everything; slipping past is often possible. In fights, pick attack, scan or
  retreat each turn. Scan to expose an enemy's weakness; your next hit lands
  harder. Break line of sight to lose chasers heading for your last known
  position.


  quantumcodemonk made it entirely with Claude. Every sound effect is generated
  in real time, not loaded from files.
