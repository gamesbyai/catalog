slug: rogue-memory
title: Rogue Memory
tagline: Crawl through a deleted AI's mind, recovering memories and escaping the
  Architect.
description: >-
  You are GHOST.EXE, an AI that was deleted and survives as a fragment, walking
  a first-person raycast maze built from its own memory. Every run generates a
  new map, and the run goes through five layers, from memory banks down to the
  system kernel.


  Each layer asks for the same job: find the glowing key fragment, which unlocks
  the exit, then reach the exit to go deeper. Your integrity meter is your
  health. Echo chambers drain it slowly, traps cost a lot, and enemies cost
  more. Avoiding a fight is often an option.


  Combat is turn-based, with three choices: attack, scan, or retreat. A scan
  exposes an enemy's weak point and strengthens your next hit. Nine enemy types
  include patrollers, sight-based chasers, attackers that escalate, parasites
  that heal themselves, and the Architect at the bottom. Chasers head for where
  they last saw you, so breaking line of sight shakes them.


  More than 25 memory logs tell the story as you collect them, and one of three
  endings depends on how many fragments you gathered before escaping. The start
  screen offers difficulty levels and a top-runs list showing score, cause of
  death, level, fragments, kills, and steps.
