slug: lantern-mahjong
title: Lantern Mahjong
tagline: Clear mahjong boards by matching tiles, on 12 layouts with every deal solvable.
description: "On your own, you clear mahjong boards by matching tiles, moving
  down through the layers until no tiles remain.


  A full set of 144 tiles on every board. Twelve layouts, with fewer layers for
  easier boards. Guaranteed solvable deals. Undo, hints, and dimmed tiles that
  can't be played yet. Swappable backgrounds and tiles. Best times kept in the
  statistics, and a list of achievements. Replays of cleared boards, and jumps
  to another board.


  Kevin MacLeod started from an open-source mahjong app. Too many of its assets
  carried GPL or share-alike terms, so they rewrote it from scratch as a single
  offline HTML file, with everything under CC0. The AI found public domain tile
  art, then drew the nine missing faces for the flowers, seasons and dragons,
  and also wrote the deal algorithm. They recorded the tile clacks and the win
  harp themselves."
