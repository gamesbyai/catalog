slug: lantern-mahjong
title: Lantern Mahjong
tagline: Clear mahjong boards by matching tiles, on 12 layouts with every deal solvable.
description: "Each board is built from a full set of 144 mahjong tiles. You can
  undo a move or ask for a hint.


  You clear a board by matching tiles and working down through the layers until
  nothing's left. There are 12 layouts to pick from, and fewer layers means an
  easier board, though every one of them uses all 144 tiles.


  Claude wrote a deal algorithm that guarantees every deal can be solved, so
  you'll never start on a hopeless board.


  The tile art is public domain, and Claude drew the nine faces that were
  missing, which covered the flowers, the seasons and the dragons. You can swap
  the background and the tiles, and dim any tile that can't be played yet.


  Your best times are kept in the statistics, there's a list of achievements,
  and once you clear a board you can play it again or jump to another one.


  Kevin MacLeod started from an open-source mahjong app, but too many of its
  assets were GPL or share-alike. So they rewrote it from scratch as one offline
  file, all CC0, and recorded the tile clacks and the win harp themselves."
