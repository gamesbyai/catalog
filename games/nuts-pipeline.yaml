slug: nuts-pipeline
title: Nuts Pipeline
tagline: Place converters on pipe nodes to sort nuts from stones and feed a hamster.
description: >-
  Nuts Pipeline has you place converters on the nodes of a pipe network to
  decide where everything flows. Nuts and stones leave the source together, and
  you need the right mix of converters so only nuts reach the hamster waiting at
  the goal. The creator pitches it as easy for beginners to pick up, since
  swapping converters is the main thing you do.


  Levels from easy stages up to harder ones, ten turns each within a 3-minute
  limit. Two-miss game over for stones that reach the hamster. Unlock Route, a
  one-turn release for a locked node. Hamster reactions for every nut that
  arrives. Rules taught in a built-in tutorial. Casual mode, with no time or
  miss limits and no saved or submitted rankings. Stop-and-resume play, with
  autosave after every placement and turn.


  Select a node to open its converter dialog. Switch converters there while
  checking the reference chart.


  According to IS Product, AI helped with the game's code, graphics and text.
