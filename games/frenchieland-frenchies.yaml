slug: frenchieland-frenchies
title: Frenchieland Frenchies
tagline: Launch flying French Bulldogs through space, eating star-fruit and
  dodging hazards.
description: >-
  A flying French Bulldog gets launched into space in Frenchieland Frenchies, an
  arcade platformer and endless runner. You gobble zero-gravity star-fruit,
  avoid hazards and complete challenges, while gravity shifts and multiple
  layers change the shape of the course as you go.


  Clearing challenges unlocks a growing roster of rare and exotic pups. The look
  is a wild cosmic universe built around angelic-looking Frenchies, which were
  inspired by the creator's own dogs and their personalities. It was a Vibe Jam
  2026 entry, placing 212th of 945 in the final ranking.


  The creator thought about the idea for more than three years, then built it
  with Claude Code in about three and a half weeks. They call it unfinished but
  a start, and say their kid enjoys it.
