slug: frenchieland-frenchies
title: Frenchieland Frenchies
tagline: Launch flying French Bulldogs through space, eating star-fruit and
  dodging hazards.
description: >-
  You play a flying French Bulldog launched into space in Frenchieland
  Frenchies, an arcade platformer and endless runner.


  Zero-gravity star-fruit to gobble up. Hazards to dodge along the way. Gravity
  that shifts as you go. Multiple layers that change the shape of the course as
  you go. A growing roster of rare and exotic pups, unlocked by clearing
  challenges.


  The Frenchies were inspired by the creator's own dogs and their personalities.
  The creator thought about the idea for more than three years before building
  it in about three and a half weeks. The creator writes, "I failed many times
  and now I figured out how to vibe code a little bit." They call it unfinished
  but a start, and say their kid enjoys it.
