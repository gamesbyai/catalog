slug: astralrush037
title: AstralRush037
tagline: Run as a small astral pet, wall-running through a fractured world.
description: >-
  AstralRush037 is an endless runner starring a small astral pet that races
  through a fractured world. Each run asks the player to chain wall-runs, time
  movements carefully, and keep momentum going to survive as long as possible
  while pushing deeper into unfamiliar territory.


  The focus is on movement and flow. Momentum matters as much as reflexes, so
  clean wall-runs and well-timed actions carry you further. As you advance, you
  find new realities, which gives the run a sense of progression beyond simple
  distance. The creator describes the aim as something simple yet comfy.


  It was entered in Vibe Jam 2026 and is built with Three.js. The creator lists
  Cursor as a tool. The game supports multiplayer and is playable on mobile.
