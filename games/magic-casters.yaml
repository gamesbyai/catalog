slug: magic-casters
title: Magic Casters
tagline: Duel rival mages in fast 1v1 and 2v2 spell battles
description: >-
  Magic Casters is a 3D multiplayer duel that runs in the browser. Players take
  the side of a divine or an arcane mage and fight in 1v1 or 2v2 matches. Each
  fight comes down to moving around the arena, timing your casts, and landing
  skill-based spells on the opposing caster.


  The game aims for the feel of an anime-style magic duel, with divine light set
  against dark arcane power. Matches are meant to be quick and easy to jump
  into, and the emphasis is on movement and timing more than on long setup. It
  also supports mobile play, so it isn't limited to desktop.


  It was entered in Vibe Jam 2026, where it placed 291st out of 945 entries. The
  creator built it with Codex and Three.js.
