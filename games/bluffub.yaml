slug: bluffub
title: Bluffub
tagline: Match cards, claim hidden poker bonuses, and bluff opponents in a game
  of Pişti.
description: >-
  Bluffub is a card game built on Pişti, the Turkish table-capture game. Players
  put cards onto a shared pile and try to match the top card to take the table.
  Hidden poker bonuses can be claimed along the way, so each round mixes
  matching with deciding what to announce.


  The bluffing is what sets it apart. A player can claim a bonus they may or may
  not hold, and a wrong call hands the whole table to the opponent. That makes
  every challenge a risk, and a careful read of the other player matters as much
  as the cards in hand.


  It supports multiplayer and runs on mobile. It was made for Vibe Jam 2026 with
  Claude Code and rendered with PixiJS. The creator describes a liking for the
  power of numbers and the element of surprise, both of which show up in the
  card play.
