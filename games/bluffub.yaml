slug: bluffub
title: Bluffub
tagline: Match cards, claim hidden poker bonuses, and bluff opponents in a game
  of Pişti.
description: >-
  Claim hidden poker bonuses as you go, whether or not you hold them, in a game
  built on Pişti, the Turkish table-capture game. eddynurf built it.


  Every challenge a risk. Bluffing as a central part of play. Wrong calls that
  hand the whole table to the opponent. Matching cards mixed with deciding what
  to announce. Careful reads of the other player, as much as the cards in hand.
  Multiplayer support.


  Put cards on the shared pile. Aim to match its top card and take the table.
