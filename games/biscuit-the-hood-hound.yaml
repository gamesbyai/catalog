slug: biscuit-the-hood-hound
title: Biscuit the Hood Hound
tagline: Play a mischievous Jack Russell who completes five street missions to
  win over Cookie.
description: >-
  Biscuit the Hood Hound puts you in the paws of a mischievous Jack Russell
  terrier with a neighborhood block to run. Five missions stand between you and
  the girl, and they involve knocking over bins, marking turf, barking cats out
  of an alley and leaving a surprise on police cars.


  The real Biscuit is the creator's own Jack Russell terrier, and the game grew
  out of his daily antics. Made with Cursor and Three.js, it turns everyday dog
  mischief into a small action-adventure with a cheeky, affectionate tone.


  Biscuit is a bad boy with a soft spot, and all the trouble has a romantic
  point: finish every mission and Cookie, a Maltese, gives him her heart. The
  loop is running the block and winning the girl.
