slug: biscuit-the-hood-hound
title: Biscuit the Hood Hound
tagline: Play a mischievous Jack Russell who completes five street missions to
  win over Cookie.
description: >-
  You play Biscuit, a mischievous dog with a tender side. Run the neighborhood
  block and win the girl.


  Five missions to complete. Bins to knock over and turf to mark. Cats to bark
  out of an alley. Surprises left on police cars. Cookie, a Maltese, and her
  heart after the last mission.


  The real Biscuit is the creator's own Jack Russell terrier, and the game came
  from his daily antics. It's an action and adventure game with a cheeky,
  affectionate tone.
