slug: biscuit-the-hood-hound
title: Biscuit the Hood Hound
tagline: Play a mischievous Jack Russell who completes five street missions to
  win over Cookie.
description: >-
  Biscuit the Hood Hound puts you in the paws of a Jack Russell terrier roaming
  a neighborhood block. Your job is to finish five missions, which involve
  knocking over bins, marking turf, barking cats out of an alley, and leaving a
  surprise on police cars. Complete them all and Cookie, a Maltese, gives
  Biscuit her heart.


  The tone is cheeky and affectionate. Biscuit is a bad boy with a soft spot,
  and the missions turn everyday dog mischief into a small action-adventure with
  a clear romantic goal. The tagline, run the block and win the girl, sums up
  the loop.


  The game was inspired by the creator's own Jack Russell terrier named Biscuit
  and his daily antics. It was built with Three.js, and the creator says Cursor
  was used. It was submitted to Vibe Jam 2026 and runs on mobile.
