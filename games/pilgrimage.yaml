slug: pilgrimage
title: Pilgrimage
tagline: Trek across a lonely digital wilderness and find companions along the way.
description: >-
  Crossing an unknown landscape inside a digital void, you move from place to
  place on a long trek. The game calls itself a Cyber-Odyssey.


  Action, adventure and simulation elements mixed into the journey. Companions
  to find along the way. Multiplayer, with other players sharing the same space
  as possible companions.


  The game draws on the classic Chinese tale Journey to the West and on Death
  Stranding. It aims to capture the deep solitude of a long journey into the
  unknown.
