slug: pilgrimage
title: Pilgrimage
tagline: Trek across a lonely digital wilderness and find companions along the way.
description: >-
  Pilgrimage sends you on a long trek through a digital void, looking for
  companionship along the way. The game calls itself a Cyber-Odyssey, and you
  move from place to place across an unknown landscape with action, adventure
  and simulation elements mixed into the journey.


  It draws on the classic Chinese tale Journey to the West and on Death
  Stranding, and it aims to capture the deep solitude of a long journey into the
  unknown. The game was built with Claude Code and Three.js.


  Multiplayer is part of it too, and the companions you find can be other
  players sharing the same space.
