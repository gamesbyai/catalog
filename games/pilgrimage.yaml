slug: pilgrimage
title: Pilgrimage
tagline: Trek across a lonely digital wilderness and find companions along the way.
description: >-
  Pilgrimage is a 3D adventure set in a digital void, framed as a Cyber-Odyssey.
  The player sets out on a long trek through an unknown landscape, moving from
  place to place and looking for companionship along the way. It mixes action,
  adventure, and simulation elements.


  The mood is the main draw. The game draws on the classic Chinese tale Journey
  to the West and on Death Stranding, aiming to capture the deep solitude of a
  long journey into the unknown. Multiplayer support means the companionship it
  talks about can involve other real players sharing the same space.


  The creator built it with Claude Code on top of Three.js. It placed 62nd out
  of 945 entries in Vibe Jam 2026, a game jam focused on projects made with AI.
