slug: credit-quest
title: Credit Quest
tagline: Collect API credits and finish terminal-themed quests in a
  Zelda-inspired adventure.
description: >-
  You walk a hero around an overworld. Your first job is to go talk to PIP, just
  west of the plaza path. The game gives you its instructions through dialogue
  boxes.


  It calls itself a fantasy-tech action RPG, set in a land where terminals are
  king, and you collect API Credits to finish tasks and quests.


  Along the way you swing at Glitches with an attack button, wake up shrines
  that have fallen asleep and work to restore the route. The goal is to carry
  the last clean signal home.


  You can open a field guide and a help screen in the middle of play.


  It's built for desktop browsers. You click the game window to give it focus.


  packetloss cited Zelda as the inspiration behind Credit Quest.
