slug: credit-quest
title: Credit Quest
tagline: Collect API credits and finish terminal-themed quests in a
  Zelda-inspired adventure.
description: >-
  Credit Quest has you walk a hero around an overworld in a land where terminals
  are king. The game calls itself a fantasy-tech action RPG. You swing at
  Glitches with an attack button, and you collect API Credits to finish tasks
  and quests.


  Fallen-asleep shrines to wake and restore the route. The last clean signal to
  carry home. Instructions delivered through dialogue boxes.


  Go talk to PIP first, just west of the plaza path.


  packetloss cited Zelda as the inspiration, and grew up loving the series.
