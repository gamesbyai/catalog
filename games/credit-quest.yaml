slug: credit-quest
title: Credit Quest
tagline: Collect API credits and finish terminal-themed quests in a
  Zelda-inspired adventure.
description: >-
  Credit Quest is a Zelda-inspired 3D adventure, and in its world the terminals
  hold the power. You explore, collect API credits and spend that progress on
  the tasks and quests along the way, with puzzles mixed into the exploring.


  The creator grew up loving the Zelda series, and this is their take on that
  kind of classic adventure, built for the browser. It is a single-player game,
  built with Claude Code on Three.js, and at Vibe Jam 2026 it ranked 289 of the
  945 entries.


  The setting turns computing culture into the backdrop for a fantasy adventure.
  Credits are the currency of the world, terminals are its centers of authority,
  and the quests you finish are themed around them, so collecting credits is how
  you move forward.
