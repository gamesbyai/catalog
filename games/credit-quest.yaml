slug: credit-quest
title: Credit Quest
tagline: Collect API credits and finish terminal-themed quests in a
  Zelda-inspired adventure.
description: >-
  Credit Quest has you walking a small pixel-art hero around a top-down
  overworld of dirt paths, grassy patches, stone walls and wooden signposts.
  Your first job shows up in a dialogue box at the bottom of the screen, telling
  you to go talk to PIP just west of the plaza path. Those boxes do a lot of the
  talking, since they're where the game hands you its instructions.


  It calls itself a fantasy-tech action RPG, set in a land where terminals are
  king, and you collect API Credits to finish tasks and quests.


  Along the way you swing at Glitches with an attack button, wake up shrines
  that have fallen asleep and work to restore the route. The title screen sums
  up the goal as carrying the last clean signal home, a poetic line for a game
  whose currency is API Credits.


  A row of hearts across the top tracks your health. Beside it sit a Vibe
  counter and a Credits counter that starts at zero. You can open a field
  guide and a help screen in the middle of play, and the sound can be muted.


  It's built for desktop browsers. You click the game window to give it focus.


  packetloss cited Zelda as the inspiration behind Credit Quest.
