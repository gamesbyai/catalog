slug: credit-quest
title: Credit Quest
tagline: Collect API credits and finish terminal-themed quests in a
  Zelda-inspired adventure.
description: >-
  Credit Quest is a 3D adventure where the player explores a world in which
  terminals hold the power. The goal is to collect API credits and spend that
  progress on completing tasks and quests along the way. Puzzle elements are
  mixed into the exploration.


  The game draws on classic Zelda-style adventure, and the creator said they
  grew up loving that series. The setting turns computing culture into the
  fantasy backdrop, so credits work as the currency of the world and terminals
  act as its centers of authority.


  It was built with Three.js as an entry in Vibe Jam 2026, where it ranked 289
  out of 945 entries. The creator built it with Claude Code. It is a
  single-player game.
