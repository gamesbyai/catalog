slug: credit-quest
title: Credit Quest
tagline: Collect API credits and finish terminal-themed quests in a
  Zelda-inspired adventure.
description: >-
  Credit Quest has you walk a pixel-art hero around a top-down overworld of dirt
  paths, grass, stone walls and wooden signposts. The first prompt tells you to
  talk to PIP, a character west of the plaza path, and dialogue boxes at the
  bottom of the screen carry the instructions.


  The header calls it a fantasy-tech action RPG. You fight Glitches with an
  attack button, wake sleeping shrines, and work to restore the route. The title
  screen gives the aim as carrying the last clean signal home. The creator cited
  Zelda as the inspiration.


  The HUD shows a row of hearts for health, a Vibe counter, and a Credits
  counter that starts at zero. You collect API Credits to finish tasks and
  quests. A field guide and a help screen open in game, and sound can be muted.
  It is a desktop browser build, and you click the game window to give it focus.
