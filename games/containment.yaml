slug: containment
title: Containment
tagline: Fight a shared boss alongside strangers, each in your own solo instance.
description: >-
  You're fighting a boss on a dark neon grid, and you're doing it alone, but not
  really. Everyone who loads the game is in their own separate instance, yet
  they all chip away at the same shared health bar.


  There's no lobby, no party and no voice chat, so nobody ever coordinates. The
  creator wanted to find out whether strangers across the internet could beat
  something together without talking, which is a pretty odd experiment to build
  an action game around.


  You move, jump and fire at a wireframe boss while red shards drift across the
  floor. A boss integrity bar sits at the top with a count under it, and a row
  of HP boxes in the corner shows how much damage you can still take.


  When the boss dies, it comes back stronger. The screen labels each phase, so
  one lucky crowd doesn't end things for good.


  There's a story behind it too, and the creator says you'll notice why the AI
  needs containing as you play.
