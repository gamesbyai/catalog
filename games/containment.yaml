slug: containment
title: Containment
tagline: Fight a shared boss alongside strangers, each in your own solo instance.
description: >-
  Containment is one boss fight shared by everyone who plays it. Each player
  fights alone in a separate instance, but all of them damage the same shared
  health bar, so a solo run still adds to a larger effort.


  The creator wanted to see whether strangers online could defeat something
  together without talking to each other. A narrative runs underneath the fight
  and explains why the AI has to be contained, and the game was built with
  Claude Code on Three.js. It placed 127th of 945 at Vibe Jam 2026 and plays on
  phones as well as desktops.


  When the boss finally falls, it comes back stronger. That sets up an
  escalating loop for the whole player base, where each win makes the next fight
  harder for everyone.
