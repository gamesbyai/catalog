slug: containment
title: Containment
tagline: Fight a shared boss alongside strangers, each in your own solo instance.
description: >-
  Containment is a browser action game built around a single boss fight. Every
  player fights in a separate solo instance, yet all of them damage the same
  shared health bar. Each run is a lone fight that still adds to a larger
  effort.


  When the boss finally falls, it returns stronger, which sets up an escalating
  loop for the whole player base. The creator wanted to see whether strangers
  online could defeat something together without talking to each other. A
  narrative runs underneath the fight and explains why the AI has to be
  contained.


  It was entered in Vibe Jam 2026, where it placed 127th out of 945 entries, and
  runs in three.js, with support for mobile devices. The creator built it with
  Claude Code.
