slug: containment
title: Containment
tagline: Fight a shared boss alongside strangers, each in your own solo instance.
description: >-
  You aim a cyan crosshair at a boss across a dark grid floor and fire at it,
  with blue wireframe shapes and red and blue fragments scattered through the
  arena. Your instance is yours alone, and nobody else appears in it. The screen
  shows a three-box HP meter and four weapon pips.


  Every player's hits count against one shared bar labeled Boss Integrity, which
  shows a counter out of 24. There is no lobby, party or voice chat. Strangers
  work on the same boss without speaking, each in a separate run.


  When the boss dies, it comes back stronger, and a phase counter in the top
  left corner tells you which round you are in. Green and gray rings sit in the
  distance of the arena. A narrative runs through the game and explains why the
  AI needs to be contained.


  The creator wanted to find out whether people across the internet could beat
  something together without talking.
