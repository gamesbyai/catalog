slug: containment
title: Containment
tagline: Fight a shared boss alongside strangers, each in your own solo instance.
description: >-
  You aim and shoot at the boss in an arena. Strangers across the internet fight
  the same boss, and you never see any of them.


  Boss Integrity, one bar shared by every hit from every player. Solo instances,
  with no lobby, party or voice chat. The boss that returns stronger when it
  dies. A story that explains why the AI has to be contained.


  daicandev built Containment around a single question: whether people across
  the internet could defeat something together without talking.
