slug: hollywood-link
title: Hollywood Link
tagline: Answer movie trivia questions in a linked-question quiz format.
description: >-
  Hollywood Link is a movie quiz built around a specific question format, where
  players work through film trivia and try to connect the answers. It supports
  multiplayer, so friends can compete on the same questions, and it is set up to
  be playable on mobile as well as desktop.


  The questions are the centerpiece. The creator says the quiz content was
  sourced with AI, and that they were surprised at how reliably it produced good
  questions that fit the format they had designed. The idea had been on their
  mind for a while before the jam gave them the push to build it.


  It was entered in Vibe Jam 2026, where it placed 344th out of 945 entries. The
  project centers on using AI to generate the quiz questions.
