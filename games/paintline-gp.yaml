slug: paintline-gp
title: Paintline GP
tagline: Race five rivals over three laps of a seaside circuit, drifting through corners
description: >-
  The race is three laps around a sunny coastal circuit, with five rivals lined
  up against you, Taro and Vex among them. You're at the wheel of Pip on a
  course with palms, beach huts and, for some reason, candy-striped curbs.


  Hold Space while you steer and you'll drift around the corners, and there's a
  banner on screen that helpfully repeats that instruction.


  The readouts keep tabs on your place, the lap count, the race clock and your
  speed in km/h. The standings run down the left side, and you're listed
  alongside the five rivals. A small map in one corner traces the whole looping
  track, showing what's coming up.


  Press E to use whatever's sitting in the item slot up top, centered on the
  screen.


  According to @pitlanepixel, the entire game is made in code. Surprisingly,
  even the music and sound effects are part of that, along with the textures.


  The cel-shaded look rests on heavy outlines, solid color fills and a sunset
  sky. For a racer, that's a pretty restrained palette. The karts and drivers
  share that same style.
