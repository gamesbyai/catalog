slug: paintline-gp
title: Paintline GP
tagline: Race five rivals over three laps of a seaside circuit, drifting through corners
description: >-
  The race is three laps around a circuit, with five rivals lined up against
  you, Taro and Vex among them. You're at the wheel of Pip.


  Hold Space while you steer and you'll drift around the corners. A small map
  shows what's coming up on the track. Press E to use whatever item you're
  carrying.


  According to @pitlanepixel, the entire game is made in code. The music and
  sound effects are part of that, along with the textures.
