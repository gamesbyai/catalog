slug: paintline-gp
title: Paintline GP
tagline: Race five rivals over three laps of a seaside circuit, drifting through corners
description: >-
  You drive Pip in a race against five rivals, Taro and Vex among them.


  Three laps around a circuit. A small map of the track ahead. Items to carry
  and use.


  Hold Space while you steer to drift around corners. Press E to use the item
  you're carrying.


  According to @pitlanepixel, the entire game is made in code, including its
  music, sound effects and textures.
