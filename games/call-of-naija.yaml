slug: call-of-naija
title: Call of Naija
tagline: Fight through Lagos in a browser FPS with a campaign, co-op modes and
  multiplayer.
description: >-
  In this first-person shooter set in Lagos, you free hostages at Balogun Market
  and destroy jammer convoys. You restart generators and hold a bridge against
  an armored push.


  Operation Eko Liberation, a five-mission campaign of cutscenes, dialogue,
  allies and checkpoints. Boss fights closing out later missions against IRON
  AGBERO and Vance Strom. Free-for-All, Team Deathmatch and Domination on five
  maps, against bots or online players. Lagos Siege, co-op survival for one to
  four players across ten waves, with stores, upgrades, revives and a closing
  boss. Extraction, a co-op raid for one to four players. Three valuables to
  find, a hack to upload under fire and the exit.


  Move with WASD and aim with the mouse. Press Shift to sprint, C to crouch or
  slide, and Space to jump. Press R to reload, E to interact and T for Naija
  Time slow motion.


  All models are generated by Blender scripts in the project, including 17
  rigged characters. Procedural code builds the textures at runtime. One
  TypeScript simulation is shared by the offline client and an authoritative
  Node server. Rapier handles the physics, and a Recast navmesh drives enemy AI.
