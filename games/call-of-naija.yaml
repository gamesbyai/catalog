slug: call-of-naija
title: Call of Naija
tagline: Fight through Lagos in a browser FPS with a campaign, co-op modes and
  multiplayer.
description: >-
  Call of Naija is a first-person shooter set in Lagos, with a campaign, co-op
  modes and online multiplayer. The campaign, Operation Eko Liberation, has five
  scripted missions with cutscenes, dialogue, allies and checkpoints. You free
  hostages at Balogun Market, destroy jammer convoys, restart generators and
  hold a bridge against an armored push, with boss fights closing out the later
  missions.


  Free-for-All, Team Deathmatch and Domination run against bots or online
  players across five maps. Under the hood, a TypeScript simulation is shared by
  the offline client and an authoritative Node server, with Three.js rendering,
  Rapier physics and a Recast navmesh for enemy AI.


  The co-op modes go further. Lagos Siege is survival for one to four players,
  with ten waves, shops, upgrades, revives and a final boss. Extraction is a
  raid where a squad finds valuables, uploads a hack under fire and gets out.
