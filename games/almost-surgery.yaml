slug: almost-surgery
title: Almost Surgery
tagline: Perform shady operations on patients with saws and shocks to earn money.
description: >-
  Playing solo, you work as an unlicensed surgeon, and the goal is money.
  Patients arrive, and you operate on them in a simulation about horror-tinged
  surgery, played as a paperwork-style job game.


  Operations done with a saw, a blade or an electric shock. Payment for each
  result of an operation. Shady operations, by design. A grim and absurd tone,
  kept on purpose.


  RagimMusakaev names Papers, Please and developer Mike Klubnika as
  inspirations.
