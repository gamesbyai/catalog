slug: almost-surgery
title: Almost Surgery
tagline: Perform shady operations on patients with saws and shocks to earn money.
description: >-
  Almost Surgery is a dark simulation where you work as an unlicensed surgeon
  and get paid for the procedures you perform. Patients arrive, and you use
  tools such as a saw, a blade and an electric shock to carry out the job,
  collecting cash for each result.


  The premise pairs a bureaucratic, paperwork-style job game with horror-tinged
  surgery, and the tone leans deliberately grim and absurd. The creator names
  Papers, Please and developer Mike Klubnika as inspirations. It placed 28th of
  945 entries at Vibe Jam 2026 and received the Most Cursed award.


  The creator built it in the Godot engine and used Codex as the AI coding tool.
  It was entered in Vibe Jam 2026 as a single-player game that runs in the
  browser.
