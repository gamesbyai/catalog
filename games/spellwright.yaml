slug: spellwright
title: Spellwright
tagline: Type spell ideas and fight rival wizards in a multiplayer arena with
  physics-driven magic.
description: >-
  You fight in a wizard arena, and instead of choosing spells from a list, you
  write a prompt and an AI builds the spell for you. The magic is
  physics-driven, so things get chaotic when spells hit each other and the
  arena.


  The title screen calls it "Infinite Spells", and that's a fair name for a game
  where you write every spell.


  The creator wanted to see whether a game could run entirely on language model
  inference while it's being played. That's why every spell begins as a sentence
  you typed yourself.


  Before a match you pick a map from four. Desert has mesa-strewn dunes, and
  Grassland is a forested arena with hills and props, so both give you terrain
  to work with.


  The two flat maps are open, empty ground meant for sandbox and craft testing,
  which is a considerate place to see what a new prompt does before you take it
  into a fight.


  The menu also has a saved spells screen, a community section and a settings
  page. Saved spells makes sense when each one came from your own wording,
  because you'd want to keep the good ones, and there's a Discord link on the
  title screen too.
