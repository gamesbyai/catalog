slug: spellwright
title: Spellwright
tagline: Type spell ideas and fight rival wizards in a multiplayer arena with
  physics-driven magic.
description: >-
  Rather than picking from a fixed list of spells, you type out what you want to
  cast, and an AI model builds that spell on the spot. Then you carry that
  homemade magic into an arena and use it against rival wizards.


  Because the spells come from whatever players decide to write, the results
  are chaotic and hard to predict, and the title screen owns it openly with
  the tagline "Infinite Spells".


  Then the physics takes over. Every spell plays out in a physics-driven fight,
  and when two effects run into each other, the simulation piles its own
  disorder on top of whatever the model came up with.


  There are four maps to choose from. Desert scatters mesas across sand dunes,
  while Grassland is a forested arena with hills and props. The two flat
  versions strip all of that away into an empty meadow or empty sand, a pair
  of sandboxes set aside for testing what you've crafted.


  The main menu also has a community section and a shelf for saved spells, a
  sensible home for any prompt that turned out well.


  liampoli wanted to try making a game that runs entirely on language model
  inference while you play, which is why the model writes every spell you cast.
