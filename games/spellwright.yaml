slug: spellwright
title: Spellwright
tagline: Type spell ideas and fight rival wizards in a multiplayer arena with
  physics-driven magic.
description: >-
  In Spellwright you write your own spells. It is a multiplayer wizard arena
  where, instead of picking from a fixed list, you type a prompt describing what
  you want to cast, and an AI model generates the spell on the spot. Then you
  fight rival wizards with it.


  The creator's goal was a game powered fully by language model inference at run
  time, built with Claude Code on Three.js to run in mobile browsers too. In
  Vibe Jam 2026 it came 117th of 945. Because spells come from whatever players
  type, the results are chaotic and hard to predict.


  Then the physics takes over. Each spell plays out in a physics-driven arena
  fight, and when effects collide, the simulation adds its own disorder to
  whatever the model produced.
