slug: spellwright
title: Spellwright
tagline: Type spell ideas and fight rival wizards in a multiplayer arena with
  physics-driven magic.
description: >-
  Type the spell you want, and an AI model builds it on the spot. Use that
  homemade magic against rival wizards in an arena. Because players write the
  spells, results are chaotic and hard to predict.


  No fixed list of spells to pick from. Physics-driven fights where every spell
  plays out. Collisions between two effects, with the simulation's own disorder
  piled on top of whatever the model made. Four maps to choose from, with Desert
  and Grassland among the arenas. Flat versions of the Desert and Grassland
  maps, set up as sandboxes for testing the spells you've made. Community
  section. A place to keep spells for later.


  liampoli wanted to try a game that works entirely through language model
  inference during play, so the model writes each spell you cast.
