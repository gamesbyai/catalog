slug: spellwright
title: Spellwright
tagline: Type spell ideas and fight rival wizards in a multiplayer arena with
  physics-driven magic.
description: >-
  Rather than picking from a fixed list of spells, you type out what you want to
  cast, and an AI model builds that spell on the spot. You take that homemade
  magic into an arena and use it against rival wizards.


  Because the spells come from whatever players decide to write, the results are
  chaotic and hard to predict.


  Physics runs the fight. Every spell plays out in a physics-driven fight, and
  when two effects run into each other, the simulation piles its own disorder on
  top of whatever the model came up with.


  There are four maps to choose from. Desert and Grassland are two of the arenas
  you can pick from. The other two maps are flat versions of those two, set up
  as sandboxes for testing the spells you've made.


  The game also has a community section and a place to save spells for later.


  liampoli wanted to try making a game that runs entirely on language model
  inference while you play, which is why the model writes every spell you cast.
