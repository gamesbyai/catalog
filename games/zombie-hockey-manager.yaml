slug: zombie-hockey-manager
title: Zombie Hockey Manager
tagline: Run an undead hockey team from Division 3 up to the top league.
description: >-
  The Undead Puck League is a hockey league where the players are reanimated.
  Each match plays out as text, built from the choices you make. Between
  matches, you run the club yourself.


  Aggression levels from offensive and dirty to safe and clean. Transfer market
  for buying, selling and trading players with unique stats. Limb loss in fights
  and collisions, scaled to slowly decaying bodies. Limited training slots for
  single players, and whole-team camps for a squad-wide boost. Club finances
  covering stadium upgrades, ticket prices, marketing, loans and merchandise. A
  climb from Division 3 to the Necro Elite, with promotion for a league win and
  relegation for finishing last.


  Set your play style before each match. Scout your next opponent, then rework
  your tactics against their weak spots. Fix the limbs that can be fixed and
  replace the ones that can't. Begin a fresh save with 2000 coins and the
  sponsor Rotting Rick's Spare Parts, who pays 50 coins a match.


  quantumcodemonk took inspiration from Football Manager on the 1982 ZX
  Spectrum. Version 1.1 brought achievements. It also added options during a
  match, like calling a timeout or pulling your goalie. According to the
  creator, AI assisted with the coding and the writing.
