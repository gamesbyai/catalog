slug: campaign-trail
title: Campaign Trail
tagline: Run and jump through a comic 2D take on British politics.
description: >-
  Campaign Trail is a 2D platformer that sends the player through a humorous
  version of British politics. The player runs and jumps across the stage,
  moving along the campaign route while working toward the end of each run.


  The tone is comedic, with satire of British political life driving the
  setting. It was entered in Vibe Jam 2026 and runs on mobile as well as
  desktop, so it can be played without a keyboard. The creator describes it as a
  first game made to see what was possible.


  The creator built it with Claude Code on the Phaser engine, having never made
  a game before. That makes it a small example of a first project coming
  together through AI-assisted coding.
