slug: ombres
title: Ombres
tagline: Steer a giant bird whose shadow paints the desert; biggest territory at
  nightfall wins.
description: >-
  Up to 12 players steer giant birds from their phones while the game itself
  runs on a shared screen. Each bird's shadow paints sand in its player's color,
  and at nightfall whoever holds the most sand wins. Bots fill any empty seats,
  so one phone is enough to start a match.


  Four maps, from The Parasols to The Sundial. Towers, with sand frozen and
  birds hidden inside their shadows. Shadows stretched by the setting sun. The
  Great Shadow, the final 12 seconds of night rolling off the cliff, freezing
  the desert from west to east. Three rounds, each about two minutes long, with
  the last one counting double. Stand-in bots for disconnected players, keeping
  their color and territory until they return.


  Scan the QR code, then pick a name and a color. Steer with the phone joystick
  or WASD. Hold dive to skim low under a small, strong shadow. Let go to climb
  into a wide, pale shadow. Pale shadows can't repaint strong sand. Dive from
  above a bird lower than yours to strike it. A hit stalls that bird and gives
  its trail your color. A miss stalls you. When a clack warns you, press
  wingbeat to dodge.


  An AI model designed and built Ombres from one brief, with Brieuc Crosson
  supervising. The AI wrote every line of code, using multi-agent workflows,
  over about 35 hours of agent time.
