slug: ombres
title: Ombres
tagline: Steer a giant bird whose shadow paints the desert; biggest territory at
  nightfall wins.
description: >-
  The main game runs on one shared screen while everyone flies from their own
  phone. Bots take any empty seats, so a single phone is plenty to start a match
  for up to 12.


  Your bird's shadow paints the desert in your color, and whoever owns the most
  sand at nightfall wins. Altitude is where the real decisions live. Hold dive
  and you skim low with a small, strong shadow, while letting go lifts you into
  a wide, pale one that can't repaint strong sand.


  Towers freeze any sand their shadows cover and hide a bird whose shadow slips
  inside.


  The other birds are targets too. Dive while you're above a lower bird to
  strike it, and a hit stalls it and turns its trail your color. Miss and you're
  the one stalling, though at least the target gets a fair warning in the form
  of a clack before it can dodge with a wingbeat.


  A match runs three rounds of about two minutes, the last counting double, and
  as the sun sinks the shadows stretch until, for the final 12 seconds, night
  rolls off the cliff and freezes the desert west to east.


  According to the repository, Claude Opus 5.5 designed and built Ombres from a
  single brief with Brieuc Crosson supervising. The project also says the model
  wrote every line of the code through multi-agent workflows.
