slug: napless
title: Napless
tagline: Brawl as a toddler and race to grab the TV remote before nap time.
description: >-
  You're a toddler in a giant living room, running around in first person and
  bonking rival toddlers with whatever you can throw. Your weapons are a
  plushie, a block shotgun and a diaper bomb, and you switch between them with
  the number keys.


  Each round is a 90-second sprint. You grab cookies and snacks, hit other
  players to fill a Chaos meter, and keep an eye on your health, which starts at
  100.


  Once Chaos hits 100%, you climb the TV toys and hold the remote before nap
  time wins. That's the whole goal, and it's a funny one for a shooter, because
  the prize is a TV remote.


  The plushie is a soft toss with squeaky knockback, and the block shotgun is a
  close-range chunky blast with its own ammo count. The diaper bomb only works
  when your Diaper meter is completely full, and it leaves a stink cloud behind,
  which is a pretty gross way to settle an argument.


  Random events shake things up too. One screen announces a Roomba rampage that
  doubles the tiny tank's speed for 8 seconds.


  Before you jump in, you can type a player name, or enter a private room code
  and copy an invite to play with friends. There's also a leaderboard of fastest
  runs, all time or today, and finishing runs earns you badges and a toddler
  title.


  The creator has a toddler at home and built the game from real life.
