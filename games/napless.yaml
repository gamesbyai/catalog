slug: napless
title: Napless
tagline: Brawl as a toddler and race to grab the TV remote before nap time.
description: >-
  You play a toddler in a giant living room, running a 90-second sprint to hold
  the TV remote before nap time wins. Grab cookies, bonk rival toddlers, and
  fill the Chaos meter, which the HUD shows as a percentage.


  Once Chaos reaches 100%, climb the TV toys to get to the remote. The HUD also
  shows a Diaper meter and a snack count beside the Chaos bar. Toys can be
  thrown, and the room is a 3D space you look around with the mouse.


  Click once to lock your aim, then bonk everything in reach. Before a round you
  can type a player name, enter an optional private room code, and copy an
  invite to share with friends.


  Finishing runs earns badges and a toddler title. A public leaderboard ranks
  the fastest completion times, with tabs for all time and for today. The
  creator has a toddler and built the game from real life.
