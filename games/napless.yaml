slug: napless
title: Napless
tagline: Brawl as a toddler and race to grab the TV remote before nap time.
description: >-
  You are a toddler loose in a giant living room with 90 seconds to grab the TV
  remote and hold it before nap time arrives. Napless is a fast multiplayer
  chaos game.


  Plushie, a thrown toy with soft, squeaky knockback. Block Shotgun, a chunky
  blast for close range. Diaper Bomb, usable only on a full Diaper meter, reset
  after its stink cloud. Pop-up events like Roomba Rampage, with a robot vacuum
  billed as a tiny tank at double speed for 8 seconds. Badges and a toddler
  title for finished runs. A public leaderboard of fastest completion times, all
  time and today. Private rooms with an optional room code and friend invites.


  Grab cookies, bonk rival toddlers and fill the Chaos meter. Once it hits 100%,
  climb the TV toys up to the remote. The game's own tip says to spend the
  opening seconds on snacks and easy bonks. Your toys double as weapons. Swap
  between the three of them. Use WASD to move and the mouse to look around.
  Click once to lock your aim, then bonk anything in reach.


  valeriogioia has a toddler at home and built the game from real life.
