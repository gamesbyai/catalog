slug: napless
title: Napless
tagline: Brawl as a toddler and race to grab the TV remote before nap time.
description: >-
  In Napless every player is a toddler, and there is only one TV remote. The
  round is a race against nap time across an oversized living room, and on the
  way to the remote you fight the other toddlers, throw toys and wreck the
  furniture and clutter.


  The premise comes straight from parenting life: the creator has a toddler and
  drew on that real experience. Codex was their tool, the result came 21st of
  945 at Vibe Jam 2026, and it runs on phones as well as desktop.


  Toys are the projectiles and the giant room is the arena, which gives the
  chaos a playful, household flavor. Matches are fast and messy, and all of it
  is a scramble for one object before nap time wins.
