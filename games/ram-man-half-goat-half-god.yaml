slug: ram-man-half-goat-half-god
title: "Ram Man: Half Goat, Half God"
tagline: Punch, grab and ram through a labyrinth under the city as half goat, half god.
description: "You're Ram Man, half goat and half god, fighting your way through a labyrinth under the city in this 3D beat 'em up.


  Punches, grabs, dodges, a ram attack and a Wrath meter. Cars you can pick up and throw, with cannon-es physics. A running lariat, gamepad support and a training yard, all new in update 3.7.0. On-screen buttons for phones. Free to play in your browser and on Android, with no ads and no microtransactions.


  Claude helped write much of the code, Meshy made the base 3D models and Chatterbox voiced the cast. Everything else was done by hand: the design, combat tuning, level layout and testing, cleaning the models up for phones and retargeting 16 Mixamo motion-capture animations onto them."
