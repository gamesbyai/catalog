  notes: Ram Man is a free 3D beat 'em up built in three.js with cannon-es
    physics, for browser and Android. Claude (by Anthropic) helped write much of
    the code, Meshy made the base 3D models and Chatterbox voiced the cast. We
    did the design, combat tuning, level layout and testing, cleaned up the
    models for phones, and retargeted 16 Mixamo mocap animations onto them.
    Update 3.7.0 adds a running lariat, gamepad support, a training yard and
    throwable cars. No ads, no microtransactions.
