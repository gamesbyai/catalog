slug: mana-rush
title: Mana Rush
tagline: Fly a broom through collapsing crystal caves before your mana runs out.
description: >-
  Steer a broom with WASD or the arrow keys and move the camera with the mouse.
  Fly from seal to seal through a procedural crystal cavern, skim past hazards,
  and break through the final portal before your mana runs out.


  Mana drains as you fly and boost, so each run is a trade between speed and
  charge. Crystals restore mana, and sanctuaries refill it and anchor your
  progress. Branching routes, boost gates, and pickups fill the caves.


  Runs are timed, with medals, personal bests, splits, and stats for collisions,
  top speed, and boost time. Finishing a depth sends you into a harder cave and
  earns Crystal Charge, which pays for permanent upgrades and unlockable hats
  and brooms with different stat tradeoffs.


  Gamepad play is supported. The creator credits Codex for programming, GPT
  Image 2 for 2D images, Meshy for 3D models, and Suno for music.
