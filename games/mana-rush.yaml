slug: mana-rush
title: Mana Rush
tagline: Fly a broom through collapsing crystal caves before your mana runs out.
description: >-
  You play a witch on a borrowed broom, racing through a cave that keeps
  crumbling. You fly from seal to seal, skim past hazards and break through a
  final portal before your magic gives out. This cave is generated by the game,
  and it asks you to light four seals along the way.


  Mana runs out as you fly, boost and crash, so every run is a balance between
  speed and charge. Crystals top it back up, while sanctuaries refill it and
  anchor your progress.


  The caves split into branching routes, and alongside the hazards you'll find
  boost gates and pickups scattered through them.


  Every run is timed, with medals, personal bests and splits to chase. It also
  keeps track of your collisions, respawns, top speed and how long you spent
  boosting. Finishing a depth sends you into a harder cave and earns you Crystal
  Charge.


  That Crystal Charge pays for permanent upgrades, along with unlockable hats
  and brooms that each come with their own stat tradeoffs.


  You steer with WASD or the arrow keys. Space or E climbs, Q drops you lower
  and Left Shift boosts, and a gamepad works too.


  netravelr credits Codex for the programming, GPT Image 2 for the 2D images,
  Meshy for the 3D models and Suno for the music.
