slug: vibe-rush
title: Vibe Rush
tagline: Lead a growing squad through zombie hordes, traps, and boss fights in a runner.
description: >-
  Lead a squad through streets full of zombies in this nonstop runner. It mixes
  lane-style running with shooting and squad management. You keep moving
  forward.


  Deadly traps to steer around, threatening to thin your group. Zombie crowds to
  shoot into. Survivors to recruit, each one joining the group. Firepower
  against the crowds that grows with your squad. Giant bosses at the end,
  testing the squad you assembled.
