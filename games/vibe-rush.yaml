slug: vibe-rush
title: Vibe Rush
tagline: Lead a growing squad through zombie hordes, traps, and boss fights in a runner.
description: >-
  Vibe Rush is a nonstop runner battler in which you guide a squad through
  streets full of zombies. You keep moving forward, steering around deadly traps
  and picking up survivors along the way. Each recruit adds to your group, so
  the squad you bring to the end depends on the choices you make during the run.


  The game mixes lane-style running with shooting and squad management. Growing
  your team is the central tension: more survivors mean more firepower against
  the crowds, while traps threaten to thin the group. Runs build toward giant
  bosses that test the squad you have assembled. It was a Vibe Jam 2026 entry,
  rendered with Three.js, and it is playable on mobile devices as well as in a
  browser.
