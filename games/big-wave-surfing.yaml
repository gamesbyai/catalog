slug: big-wave-surfing
title: Big Wave Surfing
tagline: Paddle into big waves, carve the face, and grab stars before the foam hits.
description: >-
  Paddle your surfer toward the tall wave, then ride along its breaking face
  once you've caught it. Stars are scattered along the ride for you to grab, and
  the foam is the thing that ends your run if it swallows you.


  The camera sits low behind your surfer out on open water, with a wall of
  turquoise rising up ahead.


  The first level goes by Mellow Point, a gentle name for a wave that size. If
  you don't manage to catch the wave, the round ends on a Missed the Wave
  screen. It breaks down your time, top speed, average speed, turns, tricks
  and score, and the Retry and Menu buttons sit right underneath.


  It's all set on a bright daytime sea, with scattered clouds overhead and low
  hills along the horizon.


  rolznz built it for coworkers who have never surfed. The focus is the simple
  physics of being carried by a wave rather than tricks, even though the results
  screen still keeps a count of them.
