slug: big-wave-surfing
title: Big Wave Surfing
tagline: Paddle into big waves, carve the face, and grab stars before the foam hits.
description: >-
  Paddle out toward a big wave, catch it, then carve across its breaking face
  and grab stars before the foam swallows you. The camera sits right behind your
  surfer, so the wave looms ahead of you as a tall wall of water.


  If you don't get onto the wave, the round ends on a "Missed the wave" screen.
  It adds up your time, top speed, average speed, turns, tricks and a score, and
  you can hit Retry or go back to the menu.


  The first level is called Mellow Point, which is a gentle name for something
  that's trying to swallow you. Sunlight glitters across the open water in front
  of the swell.


  The creator built it for workmates who've never surfed, hoping to give them a
  small taste of the joy of riding a wave. Tricks weren't the point, because the
  idea is the simple physics of the ride itself, which makes sense for people
  who've never stood on a board.
