slug: big-wave-surfing
title: Big Wave Surfing
tagline: Paddle into big waves, carve the face, and grab stars before the foam hits.
description: >-
  Paddle your surfer toward the tall wave, then ride along its breaking face
  once you've caught it.


  Mellow Point, the first level. Stars scattered along the ride to grab. Foam
  that ends your run if it swallows you. A round that ends if you don't catch
  the wave.


  rolznz made it for coworkers who have never surfed. The focus is the simple
  physics of being carried by a wave rather than tricks.
