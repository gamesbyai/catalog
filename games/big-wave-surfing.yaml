slug: big-wave-surfing
title: Big Wave Surfing
tagline: Paddle into big waves, carve the face, and grab stars before the foam hits.
description: >-
  Big Wave Surfing puts you in front of a large swell. You paddle out, catch the
  wave and steer across its breaking face, carving past the stars scattered
  along the ride and grabbing as many as you can.


  The feel of riding is the focus. The creator, rolznz, wanted people who have
  never surfed, coworkers for example, to get a small taste of the joy of
  catching a wave. That is why this 3D surfing simulation leans on simple wave
  physics and smooth carving. Claude Code and Three.js were the creator's tools.


  The foam is the clock. It chases you down the wave, and if it catches up the
  run ends, so every star is a question of whether you can grab it and still
  stay ahead.
