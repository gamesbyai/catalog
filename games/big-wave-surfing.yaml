slug: big-wave-surfing
title: Big Wave Surfing
tagline: Paddle into big waves, carve the face, and grab stars before the foam hits.
description: >-
  Start by paddling the surfer toward a tall wave, then ride it along its
  breaking face. Stars are placed along the ride to collect, and the foam is the
  threat that ends the run if it catches you. The camera sits behind the surfer,
  low over open water.


  The first level is called Mellow Point. If you fail to catch the wave, the
  round ends on a Missed the Wave screen. It lists time, top speed, average
  speed, turns, tricks and score, with Retry and Menu buttons beneath.


  The setting is a bright daytime sea with scattered clouds and low hills along
  the horizon. The creator built it for coworkers who have never surfed. It
  focuses on the simple physics of being carried by a wave, not on tricks.
