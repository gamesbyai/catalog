slug: star-hop-endless-galaxy
title: "Star Hop: Endless Galaxy"
tagline: Tap to launch your ship from planet to planet and climb through named sectors.
description: "Your ship circles a planet, then flies toward the next one and has
  to be caught in its orbit. In this space arcade game, the planets form a
  column that keeps going.


  PERFECT bonuses on some catches, with a combo counter. Hyperdrive bursts that
  double the points you earn. Rocks drifting through the gaps, and warning notes
  to hold off until the way is open. Golden crates floating along the route.
  Named sectors along the climb, with Sector 3 called Emerald Fields. A
  collection past the score, with 100 pilot cards to gather. Collectible ships
  that take their cue from famous spacecraft.


  Tap to launch. Until you tap, your ship keeps circling its planet. The game
  uses one tap as its only input.


  Dušan Schnelly drafted the design brief, and an AI agent turned it into a
  playable prototype overnight. Since then they've built it with several coding
  sessions running side by side, each on its own branch, while doing the phone
  playtesting and tuning by hand. Every planet, ship and card, even the logo, is
  drawn in code, and the sounds are synthesized."
