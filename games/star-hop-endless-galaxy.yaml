  notes: "I wrote the design brief and an AI agent built the first playable
    prototype overnight. Since then I've worked with Claude Code: several
    sessions in parallel, each on its own branch, writing the TypeScript,
    three.js rendering and Supabase backend. There are no image or sound files:
    planets, ships, cards and the logo are drawn in code, sounds are
    synthesized. By hand I playtest on my phone, decide what goes in and tune
    the feel. Telemetry and Reddit feedback show where players struggle, and
    Claude turns that into fixes."
