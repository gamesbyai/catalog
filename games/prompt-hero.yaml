slug: prompt-hero
title: Prompt Hero
tagline: Type commands into a terminal to guide a hero through retro puzzle levels.
description: >-
  Prompt Hero puts you in the role of a vibe coder trapped inside a retro
  simulation. There are no buttons to press. Your only interface is a terminal,
  and you move through each level by typing commands, chaining them into a
  sequence, and then letting that sequence run to see what happens.


  Every action is a prompt, and a wrong one keeps looping until you fix it. That
  turns each level into a small planning puzzle: you work out the right order of
  commands rather than reacting in real time. The game mixes puzzle, platformer,
  strategy, and simulation ideas, and it supports multiplayer.


  The concept came from the current AI hype, blended with retro gameplay to join
  the past with the present. The creator built it with Codex and Phaser, and it
  was entered in Vibe Jam 2026.
