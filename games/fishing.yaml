slug: fishing
title: Fishing
tagline: Sail the open sea, cast lures for fish and spend coins on new lures.
description: >-
  Hold Space to charge a cast, then hold R to reel the lure back to the boat.


  You steer a small boat across open water with the arrow keys or WASD, and the
  fish are out there with you. A round radar in the corner shows yellow dots for
  nearby fish, so you can point the boat toward them instead of sailing blind.
  The readout above it tracks your speed, your heading and how many fish are
  around.


  The longer you hold Space, the farther the lure flies. Once it's back at the
  boat, you cast again.


  Fish are drawn to moving lures, so reeling is more than a way to get your lure
  home.


  A coin counter sits at the top of the screen, and you spend those coins on new
  lures at the shop button next to your lure slot in the bottom left. You start
  with a fish-shaped soft lure in slot one, and the number keys 1 to 4 switch
  between lures.


  Big signs reading Vibe Code Zone sit on platforms out on the water, which is a
  funny thing to run into at sea.
