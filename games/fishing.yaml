slug: fishing
title: Fishing
tagline: Sail the open sea, cast lures for fish and spend coins on new lures.
description: >-
  Steer a boat across open water with WASD or the arrow keys, then hold Space to
  charge a cast and release it to throw the lure. Longer holds send the lure
  farther. Hold R to reel it back toward the boat, and cast again once it
  arrives.


  A radar in the top left marks nearby fish as yellow dots, and the HUD beside
  it shows speed in knots, heading, and the number of fish left. The tips panel
  notes that fish are attracted to moving lures.


  Catches earn coins, shown in a counter at the top of the screen. Spend them at
  the lure shop on new lures, and press 1 to 4 to switch between the lures you
  own. You start with a soft lure.


  The camera follows behind the boat in third person. Floating platforms with
  large signs sit on the water, and a controls panel on screen lists the keys
  and fishing tips.
