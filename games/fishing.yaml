slug: fishing
title: Fishing
tagline: Sail the open sea, cast lures for fish and spend coins on new lures.
description: >-
  Fishing is a 3D game set on the open sea. The player sails a boat across the
  water, stops to cast a lure and tries to hook fish. Each catch earns coins,
  which carry over into the next stretch of fishing.


  Coins are spent on new lures, so the loop is simple: sail out, cast, catch,
  upgrade and head back out. The open water setting gives the game a relaxed
  feel, with the focus on exploring and casting, and each new lure gives a
  reason to keep going.


  The creator says it was built with Cursor, Claude and Grok. It runs on
  Three.js, so the sea, the boat and the fishing all render as real-time 3D
  graphics in the browser.
