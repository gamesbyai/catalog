slug: fishing
title: Fishing
tagline: Sail the open sea, cast lures for fish and spend coins on new lures.
description: >-
  Hold Space to charge a cast from your boat, then let go to fling the lure. The
  longer you hold, the farther it flies.


  Open water to sail across. Yellow-dot radar for nearby fish. Coins from each
  catch, spent on lures for your tackle box. A soft lure as your only starting
  tackle. Every lure you buy, kept in your collection. Lure shop selling the
  other lures for those coins.


  Once the lure is in the water, hold R to wind it back toward the boat. Once it
  arrives, you can cast again. Between casts, steer with WASD or the arrow keys.
  Press S to brake the boat. Use keys 1 to 4 to swap lures. The tips mention
  fish are drawn to a moving lure.
play:
  url: https://fishing.lureconcept.com
  embeddable: true
  platforms:
    - browser
  controls:
    - "W / Up arrow: move forward"
    - "S / Down arrow: brake"
    - "A / Left arrow: turn left"
    - "D / Right arrow: turn right"
    - "Space: cast rod (hold to charge)"
    - "R: hold to reel in lure"
    - "1-4: switch lures"
