slug: fishing
title: Fishing
tagline: Sail the open sea, cast lures for fish and spend coins on new lures.
description: >-
  Hold Space to charge up a cast and let go to fling the lure out from your
  boat, and the longer you hold it, the farther the lure flies.


  Once it's in the water, hold R to wind it back toward the boat. When it gets
  there, you're free to cast again. The tips also mention that fish are drawn to
  a lure that's moving.


  Between casts you steer across open water with WASD or the arrow keys, with S
  working as the brake. A radar marks nearby fish as yellow dots.


  Every catch pays out coins. You start with nothing but a soft lure, but the
  lure shop sells others for those coins. The 1 to 4 keys then swap between the
  lures you own, so each catch feeds straight back into your tackle box.
play:
  url: https://fishing.lureconcept.com
  embeddable: true
  platforms:
    - browser
  controls:
    - "W / Up arrow: move forward"
    - "S / Down arrow: brake"
    - "A / Left arrow: turn left"
    - "D / Right arrow: turn right"
    - "Space: cast rod (hold to charge)"
    - "R: hold to reel in lure"
    - "1-4: switch lures"
