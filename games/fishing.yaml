slug: fishing
title: Fishing
tagline: Sail the open sea, cast lures for fish and spend coins on new lures.
description: >-
  Fishing is a 3D game set on the open sea, and the title is the whole pitch.
  You sail a boat across the water, stop to cast a lure and try to hook a fish.
  Each catch earns coins, and those coins carry over into the next stretch of
  fishing instead of resetting.


  The coins go toward new lures, and that closes the loop: sail out, cast,
  catch, upgrade and head back out. Each new lure is a reason to go out again.
  You fish alone, at a relaxed pace, with the attention on exploring the water
  and casting.


  The creator's README lists Cursor, Claude and Grok as the tools behind it.
  Three.js renders the sea, the boat and the fishing as real-time 3D graphics in
  the browser.
