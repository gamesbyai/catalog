slug: crypt-raiders
title: Crypt Raiders
tagline: Shoot your way through a zombie graveyard, collecting loot and upgrades
description: >-
  Zombies overrun a graveyard, and you shoot your way through the undead in this
  3D action shooter. Your strength grows while the pressure from the zombies
  builds. Every level is procedurally generated, so a run keeps moving into new
  layouts.


  Loot to pick up along the way. Upgrades to buy or find as you go.


  maybe_im_sam wondered whether they could make a game too after watching others
  try their hand at one, and Crypt Raiders is the result.
