slug: crypt-raiders
title: Crypt Raiders
tagline: Shoot your way through a zombie graveyard, collecting loot and upgrades
description: >-
  Crypt Raiders is a single-player 3D action shooter set in a graveyard overrun
  by zombies. You shoot your way through the undead, pick up loot, and buy or
  find upgrades as you go, and every level is procedurally generated, so a run
  keeps moving into new layouts.


  The creator, maybe_im_sam, says watching others start Vibe Jam 2026 made them
  curious whether they could make a game too, and this is the answer, built with
  Cursor on Three.js. It placed 294th of 945 in that jam.


  The loop is about getting stronger while the pressure from the zombies builds.
  Loot and upgrades feed into the next fight against the undead, and because the
  levels are procedurally generated, the ground you cover changes from one run
  to the next.
