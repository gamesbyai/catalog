slug: crypt-raiders
title: Crypt Raiders
tagline: Shoot your way through a zombie graveyard, collecting loot and upgrades
description: >-
  Crypt Raiders is a 3D action shooter set in a graveyard overrun by zombies.
  The player fights through the undead, picks up loot, and buys or finds
  upgrades along the way. Each level is procedurally generated, so a run keeps
  going into new layouts.


  The loop centers on getting stronger while the pressure builds: loot and
  upgrades feed back into the next fight, and the generated levels change the
  ground you cover from one run to the next. It was entered in Vibe Jam 2026 and
  placed 294th among 945 entries.


  The creator built it with Cursor, and it runs on Three.js. They said that
  watching others start the jam made them curious whether they could make a game
  too.
