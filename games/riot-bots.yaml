slug: riot-bots
title: Riot Bots
tagline: Fight as a robot in a Martian colony, solo or allied, against an
  invading Dark AI.
description: >-
  The first screen is a bot selection screen with a neon city skyline behind a
  round platform. The selected bot, Ronin, a fox-headed robot on a low pale-blue
  chassis, sits on the platform. Four cards run along the bottom: Taichi
  (balanced controller, weight 21), Blunt (heavy tank, 28), Ronin (mid-weight
  striker, 20) and 2Claws (mid-weight controller, 16).


  Each bot has a name, a class and four stat bars for speed, defense, power and
  weight. Ronin shows 28.9 speed, 12 defense, 20 power and 20 weight, and is
  described as a front-pressure duelist. A green P1 tag and a purple Launch
  button sit on the left, with Mode and Setting buttons in the top corners.


  The story is a riot at a Martian base, where a hostile Dark AI is invading to
  take over the energy center. Players can fight on their own or form alliances
  to defend the colony, and the ending is left open. The creator likes
  battlebots and hardware, and this was a first try at 3D game development.
