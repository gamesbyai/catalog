slug: riot-bots
title: Riot Bots
tagline: Fight as a robot in a Martian colony, solo or allied, against an
  invading Dark AI.
description: >-
  Ronin is the bot selected from the start. You can choose from four bots.


  Blunt is the heavy tank at 28 weight, while Taichi is a balanced controller at
  21. Ronin is a mid-weight striker at 20, while 2Claws is a mid-weight
  controller at 16, the lightest of the four.


  Every bot has a name, a class and stats for speed, defense, power and weight,
  so you can compare them before you commit.


  Ronin has 28.9 speed, 12 defense, 20 power and 20 weight. Its card calls it a
  duelist that applies pressure from the front. The thin defense next to that
  high speed fits a bot meant to keep pushing forward.


  The story puts you in a riot at a Martian base, where a hostile Dark AI is
  invading to take over the energy center. You can fight on your own or form
  alliances to defend the colony, and the ending is left open.


  PanPiller likes battlebots and hardware. Riot Bots was a first try at 3D game
  development.
