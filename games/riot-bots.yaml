slug: riot-bots
title: Riot Bots
tagline: Fight as a robot in a Martian colony, solo or allied, against an
  invading Dark AI.
description: >-
  A riot has broken out on a Martian base, and the Dark AI is invading to seize
  the energy center. In Riot Bots you control a battle robot in that fight and
  decide whether to defend the colony alone or team up with other players
  online.


  According to the creator, it started when a friend showed them the Vibe Jam
  games, which made them want to try 3D game development. They enjoy building
  hardware and watching battlebots, so a robot fighting game was a natural pick,
  and they built it with Cursor and Codex on Three.js.


  Alliances are optional, and the story is described as having an open-ended
  ending, so the premise leaves room for player choice. Fights are 3D robot
  battles with RPG elements mixed into the action.
