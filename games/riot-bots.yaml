slug: riot-bots
title: Riot Bots
tagline: Fight as a robot in a Martian colony, solo or allied, against an
  invading Dark AI.
description: >-
  Fight alone or form alliances to defend the colony. A hostile Dark AI is
  invading a Martian base during a riot to take over the energy center. The
  ending is open-ended.


  Four bots to choose from, each with a class and stats for speed, defense,
  power and weight. Blunt, a heavy tank. Taichi, a balanced controller. Ronin, a
  mid-weight striker and duelist who applies pressure from the front. 2Claws, a
  controller and the lightest of the four.


  PanPiller, who enjoys battlebots and hardware, made Riot Bots as a first
  attempt at developing a game in 3D.
