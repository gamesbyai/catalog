slug: riot-bots
title: Riot Bots
tagline: Fight as a robot in a Martian colony, solo or allied, against an
  invading Dark AI.
description: >-
  You start on a neon pick screen where one robot turns on a round black pad,
  with a dark glowing city skyline behind it. Four bots wait in cards along the
  bottom: Taichi, Blunt, Ronin and 2Claws. Ronin is already up on the pad, a
  blocky blue and orange machine topped with a big orange animal head, which is
  a pretty cheerful face for something built to fight.


  Every card has a class and a weight number. Blunt is the heavy tank at 28,
  Taichi is a balanced controller at 21, and 2Claws is a mid-weight controller
  at 16.


  Ronin sits in the middle of that range as a mid-weight striker at 20.


  Bars on the right break each bot into speed, defense, power and weight.
  Ronin's speed reads 28.9 and its power 20, but its defense is only 12, so it's
  clearly meant to land hits rather than soak them up. When you've picked your
  bot, you hit Launch.


  A P1 tag sits on the left side of the pick screen, next to the Launch button.


  The story is set on a Mars colony, where a rogue Dark AI is invading and
  trying to take over the energy center. You can fight on your own or team up
  with other players to defend the base, and the ending is left open.


  The creator loves battlebots and building hardware, and wanted a first try at
  3D, so a robot brawler made sense.
