slug: beyond-critical
title: Beyond Critical
tagline: Shoot waves of alien creatures pouring out of a rift in deep space
description: >-
  A dimensional rift has opened in deep space, and Beyond Critical makes you the
  one standing in front of it. Alien creatures keep pouring through in waves,
  and as humanity's defender you aim, fire and try to survive as long as you
  can.


  The creator says the project started from a wish to have fun making something
  completely different from their usual projects. It became a single-player,
  first-person wave shooter set in deep space, built on Three.js and playable on
  phones as well as desktops. It placed 211th of 945 at Vibe Jam 2026.


  The loop is plain and focused on action: hold your ground, clear the creatures
  coming at you, and face the next wave. The first-person view keeps every
  attack close, and the looming rift gives each fight a clear sense of place.
