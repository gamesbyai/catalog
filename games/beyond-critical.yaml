slug: beyond-critical
title: Beyond Critical
tagline: Shoot waves of alien creatures pouring out of a rift in deep space
description: >-
  Beyond Critical is a first-person wave shooter set in deep space. A
  dimensional rift has opened, and alien creatures keep pouring through it. The
  player takes the role of humanity's defender, aiming and firing at each
  oncoming group and trying to survive as long as possible.


  The premise is straightforward and focused on action: hold your ground, clear
  the incoming creatures, and face the next wave. The deep-space setting and the
  looming rift give the encounters a clear sense of place, and the first-person
  view keeps every attack close.


  It runs in the browser on Three.js and works on mobile devices as well as
  desktop. The creator says it started from a wish to have fun making something
  completely different from their usual projects. It was entered in Vibe Jam
  2026.
