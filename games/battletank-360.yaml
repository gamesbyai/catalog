slug: battletank-360
title: BattleTank 360
tagline: Drive a tank around a globe and destroy enemies in orbital combat.
description: >-
  BattleTank 360 is a browser-based tank shooter where the battlefield is a
  whole planet. You take command of a tank, drive it around the globe in orbital
  combat, and seek out and destroy enemy targets, with the stated goal of
  dominating the entire planet.


  It is a single-player game that plays on phones as well as desktops. The
  creator, marcelocorp, built it with Cursor and rendered it in real-time 3D
  with Three.js, and it finished 191st of 945 at Vibe Jam 2026.


  The spherical battlefield is the hook. There is no flat arena here: the action
  wraps around the planet, as the 360 in the title suggests, and finding the
  next opponent means driving around the curve of the globe. Each run centers on
  that hunt.
