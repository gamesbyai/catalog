slug: battletank-360
title: BattleTank 360
tagline: Drive a tank around a globe and destroy enemies in orbital combat.
description: >-
  BattleTank 360 is a browser-based tank shooter set on a globe. The player
  takes command of a tank and hunts down enemy targets in orbital combat, with
  the stated goal of dominating the entire planet. Each run centers on seeking
  out opponents and destroying them.


  The spherical battlefield is the main hook. Instead of a flat arena, the
  action wraps around a planet, which suggests combat from every angle and a
  360-degree feel that matches the title. It is built with Three.js for
  real-time 3D rendering and runs on mobile as well as desktop.


  The game was an entry in Vibe Jam 2026, where it placed 191st out of 945
  entries. The creator built it with Cursor. It is a single-player experience
  with no multiplayer mode.
