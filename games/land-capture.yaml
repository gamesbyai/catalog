slug: land-capture
title: Land Capture
tagline: Fight alongside your team to claim more of a shared island than four
  rival teams.
description: >-
  Land Capture is a multiplayer action game in which five teams compete for
  control of a single island. Players join a team and try to take over
  territory, with each team's share of the land deciding who is ahead. The goal
  is to win the island and, with it, the leaderboard.


  The game turns territory control into a shared, competitive contest. Because
  five teams are always fighting over the same piece of land, the map shifts as
  ownership changes hands, and a team's standing depends on how much ground it
  holds. The leaderboard gives each match a clear measure of success.


  It was built in Three.js as an entry in Vibe Jam 2026, where it placed 524th
  out of 945 entries. The creator states that they wanted to make a fun
  multiplayer game, and that Claude Code was used in making it.
