slug: land-capture
title: Land Capture
tagline: Fight alongside your team to claim more of a shared island than four
  rival teams.
description: >-
  Land Capture puts five teams on one island and has them fight over it. You
  join a team and help it take over territory, fighting alongside your teammates
  against four rival teams. Whichever team holds the biggest share of the land
  is the one ahead at that point in the match.


  It is an io-style action game, and the creator's stated aim was a fun
  multiplayer game. It was a Vibe Jam 2026 entry, placing 524th of 945, and
  Claude Code and Three.js were used to build it.


  With five teams always fighting over the same piece of land, the map keeps
  shifting as ownership changes hands. A team's standing depends on how much
  ground it holds, and winning the island is also how you win the leaderboard.
