slug: land-capture
title: Land Capture
tagline: Fight alongside your team to claim more of a shared island than four
  rival teams.
description: >-
  You play a small blocky character on an island seen from above, on one of five
  color teams: red, blue, green, yellow, or purple. The teams compete for the
  island's land, and each starts with an equal 20% share. A timer sits in the
  top left corner.


  On the title screen you enter a name, then pick Solo, Online, or Private Room.
  Each team holds six players. As you move, a strip of your team's color trails
  behind you. Brown blocks sit scattered across the island and the surrounding
  water.


  A factions panel lists each team's player count and land percentage. A
  leaderboard shows every player's score, kills, and capture percentage. A
  circular minimap shows the island as a pie split by team color. A bar at the
  bottom shows your score, your kills, and your rank within your team. The
  creator wanted to make a fun multiplayer game.
