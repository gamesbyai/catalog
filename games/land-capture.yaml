slug: land-capture
title: Land Capture
tagline: Fight alongside your team to claim more of a shared island than four
  rival teams.
description: >-
  You fight for one of five color teams (red, blue, green, yellow or purple).
  Every team wants the same land, and each one starts out with an even 20% slice
  of it.


  Wherever you walk, a strip in your team's color follows along behind you.


  You enter your name, then pick Solo, Online or Private Room. Each team holds
  six players.


  A leaderboard lists every player's score, kills and capture percentage. A bar
  shows your own score, your kills and where you rank inside your team. Kills
  are counted alongside territory.


  civaxo, who made Land Capture, wanted to make a fun multiplayer game.
