slug: land-capture
title: Land Capture
tagline: Fight alongside your team to claim more of a shared island than four
  rival teams.
description: >-
  You fight for one of five color teams over an island: red, blue, green, yellow
  or purple. Every team wants the same land and starts with an even 20% slice of
  it.


  A strip in your team's color trailing behind you wherever you walk. Teams of
  six players each. Each player's score, kills and capture percentage on a
  leaderboard. Kills counted alongside territory.


  Enter your name, then pick Solo, Online or Private Room to play.


  civaxo, who made Land Capture, wanted to make a fun multiplayer game.
