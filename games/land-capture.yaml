slug: land-capture
title: Land Capture
tagline: Fight alongside your team to claim more of a shared island than four
  rival teams.
description: >-
  You play a blocky little character on a round island that's split between five
  color teams: green, red, purple, blue and yellow. Your team's color covers the
  ground it holds, and the idea is to take more of the island than anyone else.


  You pick a name and then choose Solo, Online, or a Private Room, which is
  handy when you'd rather play with a specific group.


  Every team starts with six players, and every team starts with an equal 20
  percent of the land. A faction panel in the corner tracks each team's share as
  it changes, while a pie-chart minimap in the lower left shows the whole island
  at once.


  The tagline says claim, hold, dominate, which sums up the job pretty well.


  A leaderboard lists every player with a score, a kill count and a capture
  percentage, so you can see who's taking ground and who's taking out other
  players. A strip at the bottom keeps your own score, kills and rank within
  your team in view.


  A countdown clock sits in the top corner, and winning the island is what feeds
  the leaderboard. Civax made it, and the stated aim was a fun multiplayer game.
