slug: bloc-tcg
title: Bloc TCG
tagline: Build a deck and battle rivals in an urban-themed trading card game.
description: >-
  Take on rivals online in an urban trading card game set on the street.


  Card collecting and deck building. Strategy matches with puzzle-style
  planning. Role-playing elements alongside the card matches.


  bloctcg taught themselves to code and built the game with AI tools. They and
  their partners grew up in poverty and struggle, and wanted to make something
  that represents the people around them. The street setting, the tone of the
  cards and the world the cards belong to all draw on that background. bloctcg
  calls it "The GTA of TCG."
