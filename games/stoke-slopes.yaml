slug: stoke-slopes
title: Stoke Slopes
tagline: Ski downhill from a mountain lodge, collect tokens, and climb the leaderboards.
description: >-
  Stoke Slopes is a multiplayer arcade skiing game. Players spawn in a mountain
  lodge, choose a slope, and race downhill while collecting tokens along the
  way. Each run is a dash to the bottom, with the goal of posting a strong
  result against other players.


  Results are saved to persistent leaderboards, so every descent counts toward a
  standing that carries over between sessions. The lodge acts as a shared hub
  where players gather before picking a run. The game runs on mobile as well as
  desktop, and it was written in vanilla JavaScript and hosted on Cloudflare.


  The creator built it with Claude Code as an entry in Vibe Jam 2026, where it
  placed 38th out of 945 entries. The creator cites a love of skiing as the
  inspiration.
