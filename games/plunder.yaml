slug: plunder
title: Plunder
tagline: Sail a pirate ship, collect resources, and sink rival captains on
  chaotic islands.
description: >-
  Plunder gives you a pirate ship, a chaotic island map and rival captains to
  sink, all in a single-player action game. Matches are short and fast: you sail
  around gathering resources and spend them to strengthen your ship, and every
  match turns into a scramble between collecting and fighting.


  The pirate theme comes from the creator's personal love of pirates. According
  to the creator, Codex, OpenAI's coding tool, handled the development work, and
  it runs on Three.js as a Vibe Jam 2026 entry, placing 277th of 945.


  The naval combat is quick and chaotic, and upgrades matter as much as aim.
  Growing your ship during a match is how you turn the tables on opponents who
  started out stronger, so collecting pays off in the fighting.
