slug: plunder
title: Plunder
tagline: Sail a pirate ship, collect resources, and sink rival captains on
  chaotic islands.
description: >-
  You captain a pirate ship on a top-down ocean arena, sailing against nineteen
  rival captains listed on a top-ten board. Each match opens with a 12-second
  grace period with no damage taken. You start in the Sloop, with 120 hull and
  16 cannons, and cargo space for 50.


  Head to Wood Islands and Gold islands to gather resources. Both have red
  gather rings, and you stay inside the ring rather than on the island core.
  Cargo only counts once you bring it to the green city ring and bank it, so
  unbanked loot is at risk if another captain sinks you.


  Spend banked wood and gold in the city ring on four upgrades: Cannon, Sail,
  Hull and Cargo. Level 1 costs range from 15 wood and 25 gold for cannons to 28
  wood and 12 gold for the hull. The HUD tracks match phase, a countdown timer,
  storm radius, a boss status, kills and prestige.


  Before a match you can pick a ship from the fleet screen. The Galleon and Brig
  are shown locked, and the Sloop is the starter.
