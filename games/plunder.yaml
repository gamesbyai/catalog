slug: plunder
title: Plunder
tagline: Sail a pirate ship, collect resources, and sink rival captains on
  chaotic islands.
description: >-
  You captain a pirate ship in an ocean arena, trading cannon fire with nineteen
  rival captains and hauling wood and gold home from the islands.


  Wood Islands and Gold Islands to gather from. Four upgrades for Cannon, Sail,
  Hull and Cargo, bought with banked wood and gold at the city ring. Level 1
  prices from 15 wood and 25 gold for cannons to 28 wood and 12 gold for the
  hull. Sloop, the starting ship, with 120 hull, 16 cannons and room for 50
  cargo. Galleon and Brig, both locked. A 12-second grace period at each match
  start, when you can't take damage.


  Choose your ship before you set sail. Stay inside the ring around an island to
  gather, not on the island itself. Gathered cargo doesn't count until you
  return to the city ring and bank it. Unbanked cargo is at risk if another
  captain sinks you before you get home. A full hold out at sea is never safe.
  Steer with WASD. Fire broadsides with Q and E.
