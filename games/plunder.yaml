slug: plunder
title: Plunder
tagline: Sail a pirate ship, collect resources, and sink rival captains on
  chaotic islands.
description: >-
  You're a pirate captain sailing a little sloop around an ocean arena, steering
  with WASD and firing broadsides off either side of the ship with Q and E.
  Nineteen rival captains are out there with you, and a top-ten board tracks
  who's ahead.


  The loop is gather, bank, upgrade. You sail to wood and gold islands, park
  inside the red ring around each one instead of on the island core, and fill
  your cargo hold. Then you carry it home to the green city ring, because cargo
  you haven't banked is at risk if another captain sinks you.


  Inside the city ring, the 1 to 4 keys buy upgrades for cannons, sail, hull and
  cargo. Level one of each costs wood and gold, and the hull asks for the most
  wood while cannons ask for the most gold.


  A hint bar at the top tells you what you're missing, like how much more wood
  the sail needs and where to go for it.


  Each match opens with a short grace period where you take no damage, and the
  city is a safe zone. A storm ring is tracked by its radius, there's a
  countdown timer, and a boss that sits dormant at the start, so the arena
  clearly changes as the match goes on.


  Before you launch, you pick a ship from a fleet screen. The sloop is the
  starter, with 120 hull, 16 cannons and 50 cargo, while the galleon and brig
  sit locked as silhouettes, which makes you curious what it takes to open them.
