slug: second-form-requiem
title: "Second Form: Requiem"
tagline: Pilot a spaceship that becomes a mecha and blast through waves of enemies.
description: >-
  Pick a difficulty, then fly a space shooter against waves of enemies. Beginner
  takes 50% damage and enemies have 25% less health. Normal is the standard
  setting. Hard raises damage taken to 150% and enemy health by 50%. Beginner is
  recommended for keyboard players, Normal for a USB controller.


  Move and aim separately: WASD or the left stick moves your ship, the arrow
  keys or right stick aim. Auto-fire is on, and holding Space or the right
  trigger charges a heavier shot. B or the B button sets off a bomb, and holding
  Shift or the left bumper triggers bullet time.


  Press T, or Y on a controller, to transform your fighter into a combat mecha.
  Pickups stack: shields build up to 6 layers of armor and bombs up to 8. P
  pauses. The creator made it to learn vibe coding and build a game they wanted
  to play.
