slug: second-form-requiem
title: "Second Form: Requiem"
tagline: Pilot a spaceship that becomes a mecha and blast through waves of enemies.
description: >-
  Pick a difficulty, then fly a fighter through waves of enemies in this space
  shoot 'em up.


  Beginner difficulty, with 50% of the damage taken and enemies at 25% less
  health. Normal, the standard difficulty. Hard difficulty, with 150% of the
  damage taken and enemies at 50% more health. Stacking pickups, with shields up
  to 6 layers of armor and bombs up to 8.


  Beginner is recommended for keyboard players, and Normal for a USB controller.
  Move with WASD or the left stick, and aim with the arrow keys or the right
  stick. Auto-fire is on. Hold Space or the right trigger to charge a heavier
  shot. Press B or the B button to set off a bomb. Hold Shift or the left bumper
  to trigger bullet time. Press T, or Y on a controller, to switch into combat
  mecha form.


  iamchuck504 made the game to learn vibe coding and to build a game they wanted
  to play.
