slug: deer-diplomacy
title: Deer Diplomacy
tagline: Bow to deer and feed them crackers without letting the herd charge you.
description: >-
  The setting is Nara Deer Park in Japan, where you're a tourist carrying senbei
  rice crackers through a herd that notices more than you'd like. Bow to a deer
  and it starts to trust you, and once it does, you get to feed it a cracker.


  The bowing comes straight from real life, since the actual deer in Nara bow
  back at visitors who bow to them.


  The rest of the herd is a bit of a problem. If they notice you've got food on
  you, they charge, and every bow leaves you exposed for about a second and a
  half.


  So each bow comes down to timing and to which deer happen to be close enough
  to notice. It's a funny thing to build a stealth game around, given that the
  whole visit is about feeding animals. The aim is to hand out your crackers and
  get away before the herd turns on you.


  Next to the regular Play button there's a daily challenge too.


  imshubham31 took that gentle back-and-forth between tourists and deer and
  turned it into a tense stealth puzzle. The polite little bow is how you win
  a deer over. It's also the moment you're most exposed to the rest of the
  herd.
