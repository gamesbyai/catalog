slug: deer-diplomacy
title: Deer Diplomacy
tagline: Bow to deer and feed them crackers without letting the herd charge you.
description: >-
  Nara Deer Park in Japan is the setting. You're a tourist carrying senbei
  crackers, and the aim is to hand them out and leave before the herd turns on
  you.


  Herd that charges once it notices food on you. Bow timing, and which deer can
  spot you. About a second and a half of exposure after each bow. Daily
  challenge beside the regular game.


  Bow to a deer to earn its trust. Once it trusts you, feed it a cracker.


  Real deer in Nara bow back to visitors who bow to them, and imshubham31 built
  a stealth puzzle around that exchange.
