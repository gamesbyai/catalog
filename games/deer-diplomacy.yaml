slug: deer-diplomacy
title: Deer Diplomacy
tagline: Bow to deer and feed them crackers without letting the herd charge you.
description: >-
  Deer Diplomacy makes you a tourist in Nara Deer Park, Japan, with rice
  crackers to hand out and a herd that notices things. Bow to a deer and it
  starts to trust you, and once it does, you can feed it a cracker.


  It builds on the real habit of Nara's deer bowing back at visitors who bow to
  them. The creator made it with Claude Code and Three.js for Vibe Jam 2026 and
  turned that gentle exchange into a tense stealth puzzle.


  The herd is watching. If the deer notice you are carrying food, they charge,
  and every bow leaves you exposed for about a second and a half. Deciding when
  to bow, and who is close enough to notice, is where the pressure comes from.
