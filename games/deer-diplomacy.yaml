slug: deer-diplomacy
title: Deer Diplomacy
tagline: Bow to deer and feed them crackers without letting the herd charge you.
description: >-
  You're a tourist wandering Nara Deer Park, and your whole approach is to bow
  at wild deer until they warm up to you. Once they trust you, you can feed them
  senbei, which are rice crackers.


  The catch is the herd, because if they spot that you're holding food, they
  charge.


  The bowing comes from real life, where Nara's deer return the gesture when a
  visitor bows first. The game turns that polite exchange into a stealth puzzle,
  which is a funny fate for such a friendly habit.


  Each bow leaves you exposed for 1.5 seconds, so you have to weigh every
  greeting against the herd around you. That short gap is what makes a courteous
  gesture risky. Your aim is to escape before the herd turns on you.


  There's also a daily challenge, and you can start it from the title screen,
  right beside the regular Play button.
