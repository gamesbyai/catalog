slug: boneyard-rally
title: Boneyard Rally
tagline: Race a skeleton kart through a moonlit graveyard and boost past five rivals.
description: >-
  Hit the up arrow right as the countdown's 1 fades for a perfect start. You're
  the skeleton driving a kart, and every rival on the track is a skeleton too.


  Three laps around the track. Five rivals to get past. Souls to grab for
  filling the Soul Boost.


  To get past the pack, hold Space to use the Soul Boost. Stay clear of the
  headstones lining the track.
