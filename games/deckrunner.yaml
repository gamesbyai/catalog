slug: deckrunner
title: DECKRUNNER
tagline: Shoot through a derelict space station deck by deck and reach the escape pod.
description: >-
  Pick New Mission and you're looking down the barrel in first person, working
  through a derelict space station one deck at a time. You scavenge weapons and
  perks as you go and shoot whatever's still moving. The goal is to reach the
  escape pod before the station gets you.


  The creator loves roguelikes and shooters and wanted to blend the two, with
  customization in the mix, which is why Customize gets its own spot in the main
  menu.


  There's a PvP arena too, and your opponents in it are all bots.


  Before a match you choose how many bots you face, a difficulty and the score
  you're playing to. The menu already has three bots, Normal and a score of 10
  filled in, so you can hit Start Match without touching anything, which is a
  nice courtesy.


  One tip on the menu says to shoot barrels near enemies to set off chain
  explosions.


  Alongside those, the menu lists Multiplayer, a Firing Range, a Bestiary,
  Leaderboards and Options, each with its own key.
