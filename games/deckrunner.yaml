slug: deckrunner
title: DECKRUNNER
tagline: Shoot through a derelict space station deck by deck and reach the escape pod.
description: >-
  Fight through a derelict space station one deck at a time and reach the escape
  pod before the station gets you.


  Weapons and perks scavenged on every run. A PvP arena of bots, with their
  number, difficulty and the winning score up to you. A firing range for
  practice. Customization, a bestiary and a leaderboard. Barrels that set off
  chain explosions near enemies.


  Scavenge, shoot anything still moving and head for the pod.


  paledustgames loves roguelikes and shooters and wanted to blend roguelike
  structure with first-person shooting.
