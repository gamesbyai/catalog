slug: deckrunner
title: DECKRUNNER
tagline: Shoot through a derelict space station deck by deck and reach the escape pod.
description: >-
  Pick New Mission and you're dropped into a derelict space station, seen in
  first person, which you fight through one deck at a time. Each run has you
  scavenging weapons and perks and killing anything that's still moving. The
  goal is the escape pod, and you're racing the station itself to get there
  before it gets you.


  The main menu holds plenty of extra modes beyond the mission, though.
  Multiplayer carries a little live tag, while a whole PvP arena fills the room
  with bots and lets you set how many there are, their difficulty and the score
  that wins the match.


  If you'd rather warm up first, there's a firing range for practice.


  Customize, bestiary and leaderboard screens fill out the rest of the menu. A
  bestiary fits nicely in a game built around whatever's still crawling through
  a dead station. Most menu entries also show a shortcut key beside them.


  A tip on the menu suggests shooting barrels near enemies to set off chain
  explosions, which is a pretty clear invitation to start blowing things up.


  paledustgames says they love roguelikes and shooters, and they wanted to blend
  roguelike structure with first-person shooting. Customization was part of the
  mix as well.
