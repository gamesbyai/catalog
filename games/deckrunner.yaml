slug: deckrunner
title: DECKRUNNER
tagline: Shoot through a derelict space station deck by deck and reach the escape pod.
description: >-
  DECKRUNNER is a first-person roguelike shooter set on a derelict space
  station. Each run sends you down through the station one deck at a time,
  fighting whatever is still moving, picking up weapons and perks along the way,
  and heading for the escape pod before the station finishes you off.


  The game mixes roguelike run structure with shooter combat, and customization
  is a stated focus: the weapons and perks you scavenge shape how each descent
  plays out. It runs in the browser, supports multiplayer, and works on mobile
  devices as well as desktop. It placed 70th out of 945 entries in Vibe Jam
  2026.


  The creator built it with Claude Code, using Three.js for the 3D rendering.
  The idea came from a love of both roguelikes and shooters and a wish to
  combine them into one game.
