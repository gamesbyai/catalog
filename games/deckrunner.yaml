slug: deckrunner
title: DECKRUNNER
tagline: Shoot through a derelict space station deck by deck and reach the escape pod.
description: >-
  Fight through a derelict space station one deck at a time from a first-person
  view. Each run has you scavenge weapons and perks, kill whatever is still
  moving, and try to reach the escape pod before the station finishes you.


  The main menu offers more than the mission mode. Multiplayer is marked live,
  and a PvP arena lets you pick the number of bots, the difficulty, and the
  score target before you start a match. A firing range is there for practice.
  Customize, bestiary and leaderboard screens sit alongside them.


  A menu tip points out that shooting barrels near enemies sets off chain
  explosions. The creator wanted to blend roguelike structure with first-person
  shooting, with customization as part of the mix.
