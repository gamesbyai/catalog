slug: deckrunner
title: DECKRUNNER
tagline: Shoot through a derelict space station deck by deck and reach the escape pod.
description: >-
  DECKRUNNER is a first-person roguelike shooter about getting off a derelict
  space station. Each run takes you down through the station one deck at a time,
  fighting whatever is still moving, on the way to the escape pod.


  The idea, according to paledustgames, came from a love of roguelikes and
  shooters and a wish to put both into one game. It was built with Claude Code
  on Three.js, supports multiplayer, runs on phones as well as desktops, and
  placed 70th of 945 at Vibe Jam 2026.


  Customization is a stated focus, on top of the roguelike run structure. The
  weapons and perks you scavenge along the way shape how each descent plays out,
  and the goal stays the same: reach the pod before the station finishes you
  off.
