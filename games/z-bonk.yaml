slug: z-bonk
title: Z-Bonk
tagline: Survive waves of zombies in a roguelite shooter with multiplayer support.
description: >-
  Z-Bonk is a roguelite zombie survival shooter drawing on Call of Duty Zombies
  and Megabonk. The player fights off oncoming zombies from a first-hand
  shooting perspective, trying to last as long as possible in each run before
  starting over.


  The game blends the round-based zombie survival format with the run-based
  structure of a roguelite. It runs in the browser on Three.js and supports
  multiplayer, so players can share the fight. It placed 248th out of 945
  entries in Vibe Jam 2026.


  The creator says they had wanted to make games for a long time but found
  engines like Unity and Unreal too hard to learn. They built Z-Bonk with Cursor
  and describe it as the result of several earlier projects, all started with no
  prior knowledge of the underlying technology.
