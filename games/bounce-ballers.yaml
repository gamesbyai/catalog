slug: bounce-ballers
title: Bounce Ballers
tagline: Score goals in a networked, platform-hopping soccer match against other
  players.
description: >-
  You start on a lobby with four arena cards, a set of match rules and three
  ways to get into a game. The status panel counts players out of two, so it's a
  head-to-head match.


  The official arenas are Classic Arena, Neon Foundry, Plinko and Glitch Garden.
  Plinko is tagged "RNG madness" and fills its field with pegs, which suits the
  label. Below them there's a spot for your own saved custom maps.


  Hit Matchmake to look for an opponent online, or pick vs Bot to play the
  computer. Private Match gives you a room code, so you can copy the code or an
  invite link, and a friend pastes it in to join. The arena you've selected is
  used for local matches.


  You get to set the rules before anything starts, which is handy.


  Score limit begins at first to 10, round time begins at no limit, and the
  bot's difficulty begins at normal. Map event cards can bend the arena with low
  gravity, reversed ball gravity or a wrapping map, and each has a checkbox so
  you pick which ones can turn up.


  Ability pickups get the same treatment, with checkboxes for speed boost, burst
  boost, throw boost, magnet and invisibility. You can switch off anything you
  don't want in the match.


  The creator spent college playing IDARB, which was built mostly around a
  shared screen. This is a modern take that works properly over the internet,
  adds progression for replay value and carries the creator's own style.
