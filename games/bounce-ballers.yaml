slug: bounce-ballers
title: Bounce Ballers
tagline: Score goals in a networked, platform-hopping soccer match against other
  players.
description: >-
  There are four arenas to pick from, called Classic Arena, Neon Foundry, Plinko
  and Glitch Garden.


  Each arena has two goal zones. Plinko has pegs and slanted ramps. It's tagged
  RNG Madness.


  Before a match, you get to set the rules yourself. You can set the score
  limit, round time and bot difficulty yourself, starting from First to 10, No
  Limit and Normal. You can toggle three map events, Reverse Ball Gravity, Low
  Gravity and Infinimap, which wraps the arena around on itself.


  You can switch five ability pickups on or off one at a time, including Speed
  Boost, Burst Boost, Throw Boost, Magnet and Invisibility.


  You can start a match with Matchmake, vs Bot or Private Match. You can also
  join a room by pasting its room ID, and Copy Code and Copy Invite are
  available as well. Your saved custom maps are kept under My Arenas, and until
  you type a name you play as a guest.


  matthayes13 is a longtime fan of IDARB and wanted to build a networked soccer
  platformer with progression.
