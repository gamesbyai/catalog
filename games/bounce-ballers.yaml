slug: bounce-ballers
title: Bounce Ballers
tagline: Score goals in a networked, platform-hopping soccer match against other
  players.
description: >-
  Bounce Ballers is a competitive soccer platformer for online multiplayer.
  Players run and jump across platforms while trying to get the ball into the
  opposing goal, so each match mixes side-scrolling movement with the
  goal-scoring pressure of a sports contest.


  The game is inspired by IDARB, which its creator played throughout college.
  That original was built mostly around sharing one screen, so this version aims
  to work properly over the internet. The creator also wants matches to be more
  replayable through a progression system, and plans to give the game a personal
  visual style.


  It was entered in Vibe Jam 2026, where it placed 308th out of 945 entries, and
  is built with the Phaser framework. The creator built it with Codex from
  OpenAI.
