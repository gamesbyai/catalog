slug: bounce-ballers
title: Bounce Ballers
tagline: Score goals in a networked, platform-hopping soccer match against other
  players.
description: >-
  When the game loads, the lobby lays out four arena cards called Classic Arena,
  Neon Foundry, Plinko and Glitch Garden.


  Each preview shows platforms stacked over a flat floor, with a goal zone at
  either end of the field. Plinko is the odd one out, with pegs and slanted
  ramps crammed into the middle under the label RNG Madness, which is a pretty
  fair warning.


  Before a match, you get to set the rules yourself. The score limit reads First
  to 10, round time starts at No Limit, and the bot difficulty sits at Normal.
  There are three map event cards to toggle, and Reverse Ball Gravity sounds a
  bit wild next to plain Low Gravity and Infinimap, which wraps the arena around
  on itself.


  A whole column of five ability pickups can be switched on or off one by one,
  covering Speed Boost, Burst Boost, Throw Boost, Magnet and Invisibility.


  Three buttons get you into a game: Matchmake, vs Bot and Private Match.
  There's also a field where you paste a room ID, with Join, Copy Code and Copy
  Invite buttons sitting beside it. A My Arenas section holds saved custom maps,
  and you get a guest name before you've typed anything.


  matthayes13 is a longtime fan of IDARB and wanted to build a networked soccer
  platformer with progression.
