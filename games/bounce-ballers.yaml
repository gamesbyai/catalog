slug: bounce-ballers
title: Bounce Ballers
tagline: Score goals in a networked, platform-hopping soccer match against other
  players.
description: >-
  Against a bot, in a private match, or against other players found through
  matchmaking, you play competitive soccer on platforms.


  Four arenas, Classic Arena, Neon Foundry, Plinko and Glitch Garden. Two goal
  zones in each arena. Plinko, with pegs and slanted ramps and an RNG Madness
  tag. Three map events, Reverse Ball Gravity, Low Gravity and Infinimap.
  Infinimap, where the arena circles back on itself. Five ability pickups,
  including Speed Boost, Burst Boost, Throw Boost, Magnet and Invisibility.
  Saved custom maps, kept under My Arenas.


  Before a match, set the score limit, round time and bot difficulty. Toggle map
  events, and switch ability pickups one by one. Paste a room ID to join a room.
  Type a name to stop playing as a guest.


  matthayes13 has been a fan of IDARB for years and set out to make a networked
  soccer platformer with progression.
