slug: bounce-ballers
title: Bounce Ballers
tagline: Score goals in a networked, platform-hopping soccer match against other
  players.
description: >-
  Bounce Ballers is a competitive soccer platformer, played over the network.
  You run and jump across platforms in a side-scrolling level, competing with
  other players online to get the ball into the opposing goal.


  The inspiration is IDARB, which the creator played throughout college. That
  game was built mostly around sharing one screen, so this version is meant to
  work properly over the internet, with every player on their own device. It was
  made with Codex in the Phaser framework and came 308th of 945 at Vibe Jam
  2026.


  The creator wants matches to be more replayable through a progression system
  and plans to give the game a personal visual style of its own. Each match
  mixes platforming movement with the goal-scoring pressure of a sports contest.
