slug: bounce-ballers
title: Bounce Ballers
tagline: Score goals in a networked, platform-hopping soccer match against other
  players.
description: >-
  The game opens on a lobby with four arena cards: Classic Arena, Neon Foundry,
  Plinko and Glitch Garden. Each preview shows platforms stacked over a flat
  floor, with a goal zone at each end. Plinko fills the middle with pegs and
  slanted ramps. A guest name is pre-filled, and the header shows a Players
  counter that reads 0/2.


  Before a match you set the rules. Score limit reads First to 10, round time
  starts at No Limit, and AI difficulty starts at Normal. Three map event cards
  can be toggled: Low Gravity, Reverse Ball Gravity and Infinimap, which wraps
  the arena. Five ability pickups can also be switched on or off: Speed Boost,
  Burst Boost, Throw Boost, Magnet and Invisibility.


  Three buttons start play: Matchmake, vs Bot and Private Match. A room code
  field takes a pasted room ID, with Join, Copy Code and Copy Invite buttons
  beside it. A My Arenas section holds saved custom maps. The creator is a
  longtime fan of IDARB and wanted a networked soccer platformer with
  progression.
