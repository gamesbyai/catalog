slug: arcade-gaming
title: Arcade Gaming
tagline: Pick from a browser arcade for quick, casual play breaks
description: >-
  Arcade Gaming lets you walk between arcade cabinets, and each one holds its
  own small browser game.


  Global leaderboard for every score you post. Token machine that pays out
  tickets. Jukebox tracks and race avatars to spend tickets on. Wardrobe for
  changing how your character looks.


  Walk up to a cabinet and press E or Enter to start its game. Click a cabinet
  to start it right away. Click an empty patch of floor and your character walks
  there on its own. Open the Games list if you'd rather skip walking to each
  machine. You can play without signing up. Sign in to claim your spot on the
  leaderboard.


  You get tokens before you touch a cabinet. New players get a welcome bonus of
  50 tokens. Anyone who comes back gets 20 more tokens each day.


  parth_kadakia pitches it as a go-to arcade for quick breaks.
