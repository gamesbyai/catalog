slug: arcade-gaming
title: Arcade Gaming
tagline: Pick from a browser arcade for quick, casual play breaks
description: >-
  Arcade Gaming puts you on a walkable 3D arcade floor filled with small browser
  games. Walk up to a cabinet to drop straight into its game, or press the Games
  button to browse the full list instead of walking to each one.


  Every score you post goes to a global leaderboard, and signing in lets you
  claim your spot on it. You can click a cabinet to play it instantly, or click
  the floor to auto-walk there.


  The floor holds more than cabinets. A wardrobe changes your look, and a token
  machine earns tickets for jukebox tracks and race avatars. New players get a
  welcome token bonus, and returning players get a daily one. The lobby shows a
  live count of players in the plaza and total games played.
