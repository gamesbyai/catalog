slug: arcade-gaming
title: Arcade Gaming
tagline: Pick from a browser arcade for quick, casual play breaks
description: >-
  Arcade Gaming is a browser arcade built for short, casual breaks. A visit is
  meant to be brief: open the page, pick something to play, and get back to
  whatever you were doing. It pitches itself as a go-to spot for quick, fun
  sessions.


  The mix is arcade and strategy, all of it solo play, with a 3D presentation
  that Three.js draws in the browser. It works on phones as well as desktops, so
  a break can start from either one.


  According to the creator, parth_kadakia, it was built with Claude Code for
  Vibe Jam 2026, where it finished 120th of 945. The creator counts two things
  as the high points of the project: the community's passion, and reaching 150
  users who tried it out.
