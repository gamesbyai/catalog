slug: arcade-gaming
title: Arcade Gaming
tagline: Pick from a browser arcade for quick, casual play breaks
description: >-
  Arcade Gaming has you walk around a 3D arcade floor and step up to cabinets,
  each one holding a tiny browser game. You wander until one catches your eye,
  then you walk up and drop straight into it.


  If you'd rather not hunt around, there's a Games button that lets you browse
  every game in one place, so you don't have to find the right machine on foot.


  You don't need to sign up to play, and that's pretty handy because you can
  start right away.


  Every score you post goes to a global leaderboard, though, and signing in is
  how you claim your spot there. So you can jump in first and still end up with
  a name on the board.


  The mouse works as well as the keyboard. Click the floor and your character
  auto-walks there, and clicking a cabinet starts its game right away. Dragging
  with the mouse lets you look around, which matters because the place is a full
  3D space.


  There's a little economy on the side. A wardrobe changes how your character
  looks, and a token machine earns you tickets for jukebox tracks and race
  avatars.


  You also get a welcome bonus of 50 tokens, plus 20 more each day you come
  back, which gives the token machine something to work with from the start.
