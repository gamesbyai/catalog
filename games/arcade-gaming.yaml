slug: arcade-gaming
title: Arcade Gaming
tagline: Pick from a browser arcade for quick, casual play breaks
description: >-
  In Arcade Gaming, you walk around a 3D arcade floor and step up to cabinets,
  and each one holds its own small browser game.


  When you reach a cabinet and press E or Enter, you drop straight into its
  game. If you'd rather not stroll over to every machine, there's a Games button
  that pulls up the full list. Clicking a cabinet starts it instantly, and
  clicking an empty patch of floor sends your character walking there on its
  own.


  Every score you post lands on a global leaderboard. You can start playing
  without signing up, but signing in is how you claim your spot on that board.


  The floor holds more than cabinets, with a wardrobe for changing your look and
  a token machine that, in true arcade fashion, pays out tickets you can spend
  on jukebox tracks and race avatars.


  Tokens show up before you've even touched a cabinet. New players get a welcome
  bonus of 50, and anyone who comes back gets 20 more each day. It's a generous
  touch for something parth_kadakia pitches as a go-to arcade for quick breaks.


  Up top, the lobby runs a live count of who's in the plaza. Next to it sits a
  running total of games played across the arcade.
