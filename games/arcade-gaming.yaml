slug: arcade-gaming
title: Arcade Gaming
tagline: Pick from a browser arcade for quick, casual play breaks
description: >-
  Arcade Gaming is a browser-based arcade built for short breaks. It presents
  itself as a go-to spot for quick, fun sessions, so a visit is meant to be
  brief: open the page, pick something to play, and get back to whatever you
  were doing. It runs on mobile as well as desktop.


  The project is tagged as both strategy and simulation, which suggests the play
  leans on planning and managing systems more than on twitch reflexes. It was
  entered in Vibe Jam 2026, where it placed 120th among 945 entries. The creator
  says the community's passion, and reaching 150 users who tried it, were the
  high points of the project.


  The creator built it with Claude Code, and the 3D presentation runs on
  Three.js. It is a single-player experience with no multiplayer mode.
