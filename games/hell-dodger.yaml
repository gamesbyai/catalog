slug: hell-dodger
title: Hell Dodger
tagline: Fly and drift through the sky, dodging a constant stream of incoming missiles.
description: >-
  Hell Dodger is a 3D shooter built around evasion. The player pilots a craft
  that flies and drifts through the air while missiles home in from all sides.
  Each run is a test of staying alive by moving fast and turning sharply, since
  the missiles keep coming.


  The focus is on speed and quick reactions rather than slow, careful aiming.
  Drifting is part of the movement, so the craft slides through turns while the
  player weaves between threats. It is tagged as both a shooter and a roguelite,
  which points to short, repeatable runs.


  It was submitted to Vibe Jam 2026 and runs in the browser on Three.js. The
  creator lists Windsurf as the tool used to build it.
