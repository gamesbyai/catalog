slug: fanto-s-mega-mart
title: Fanto's Mega-Mart
tagline: Race through a haunted grocery store at rocket speed, grabbing items as you go.
description: >-
  Fanto's Mega-Mart is a fast action racer set in a haunted grocery store, where
  the shopping happens at rocket speed. You zip down the aisles on a shopping
  run, grabbing items as you go, in a race that draws on the spirit of
  supermarket dash contests. It supports multiplayer, so other players can
  compete in the same store.


  The concept came from a dream the creator had, shaped by a TV
  supermarket-sweep contest. Built with Codex on Three.js and designed for
  desktop play, it placed second out of 945 entries at Vibe Jam 2026.


  Everyday retail meets supernatural spookiness, and that mix gives the game its
  identity. The tone stays playful throughout: the store is haunted, and the
  shopping is a race against other players.
