slug: voc
title: VOC
tagline: Sail a global Age of Sail map to plunder, trade, or explore.
description: >-
  VOC is an Age of Sail role-playing game set on a map of the entire globe,
  built from real geographic data. You command a ship and choose how to make
  your way: plunder other vessels as a pirate, trade goods between ports, or
  simply explore the seas and coastlines.


  The world is based on actual geography, so the routes you sail follow the
  shape of real oceans and coasts. The creator's interest in maps, boats,
  maritime law, and shipwrecks shapes the setting. The game supports multiplayer
  and runs on mobile as well as desktop browsers.


  It was made for Vibe Jam 2026 and renders in Three.js. The creator says it was
  inspired by a post from the three.js account, and lists Codex as the tool used
  to build it.
