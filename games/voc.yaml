slug: voc
title: VOC
tagline: Sail a global Age of Sail map to plunder, trade, or explore.
description: >-
  VOC is an Age of Sail role-playing game on a map of the whole globe, built
  from real geographic data. You command a ship and choose how to make your way:
  plunder other vessels as a pirate, trade goods between ports, or simply
  explore the seas and coastlines.


  The creator's interest in maps, boats, maritime law, and shipwrecks shapes the
  setting. They say a post from the three.js account inspired the game, and they
  built it with Codex. It was 274th of 945 entries in Vibe Jam 2026.


  Because the world follows actual geography, the routes you sail trace the
  shape of real oceans and coasts, and other players share those waters in
  multiplayer, on phones as well as desktop browsers.
