slug: portal-runner
title: Portal-Runner
tagline: Run through five parallel worlds, dodging vanishing obstacles and
  leaping through portals.
description: >-
  Playing alone as a runner, you start out in a city called City Night. Your
  score goes up as you run through the city.


  Portals that carry you out of the city. Five parallel worlds, each with its
  own rules. Obstacles that vanish as you get close. A golden exit into the
  multiverse.


  You run down the road and pick up coins as you go. You dodge barriers as they
  pile up ahead.


  tempest_4754 drew the endless-runner core from Temple Run and Subway Surfers.
