slug: portal-runner
title: Portal-Runner
tagline: Run through five parallel worlds, dodging vanishing obstacles and
  leaping through portals.
description: >-
  The game opens on a night city street, seen from behind a blocky blue runner.
  The score counts up in the top left, with a coin counter below it and a label
  naming the current world, City Night. A speed bar in the top right tracks the
  pace of the run.


  You sprint down the road, picking up yellow coins and avoiding striped
  barriers. Some obstacles vanish before your eyes, so the track ahead cannot be
  fully trusted, even on a route you have run before.


  Portals carry you through five parallel worlds, and each one changes the
  rules, colors and feel instead of only the scenery. A golden JAM EXIT
  eventually pulls you into the multiverse. The creator built the endless runner
  core on Subway Surfers and Temple Run.
