slug: portal-runner
title: Portal-Runner
tagline: Run through five parallel worlds, dodging vanishing obstacles and
  leaping through portals.
description: >-
  You begin on a dark city street at night, seen from behind a blocky blue
  runner. Yellow dashes mark the road ahead, glowing coins are scattered along
  it, and striped yellow-and-gray barriers sit farther up. A score counter and
  coin count sit in the top left under the area name, City Night, and a speed
  meter fills the top right.


  It's an endless runner, and the run is spread over five parallel worlds. Each
  portal doesn't just repaint the background, because it drops you into a
  different dimension with its own colors, rules and mood.


  The obstacles are the odd part, because some of them disappear right in front
  of you.


  The creator wanted a psychological twist so that your eyes become a
  questionable guide, which means a run stays unpredictable even once you've
  learned the patterns.


  Keep running and jumping through portals until a golden JAM EXIT shows up and
  takes you on into the multiverse.
