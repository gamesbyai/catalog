slug: portal-runner
title: Portal-Runner
tagline: Run through five parallel worlds, dodging vanishing obstacles and
  leaping through portals.
description: >-
  You play as a runner who starts out in a city. Your score climbs as you run
  and you collect coins along the way. The world you're in is called City Night.


  You sprint down the road, collecting coins and steering around barriers
  stacked in your path.


  Some of those obstacles disappear right in front of you, even on a stretch
  you've already run.


  Portals are your way out of the city. They carry you across five parallel
  worlds, and each one swaps out the rules and feel rather than just repainting
  the background.


  Eventually a golden exit shows up and pulls you out into the multiverse.


  tempest_4754 modeled the endless-runner core after Temple Run and Subway
  Surfers.
