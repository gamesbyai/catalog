slug: ww3-battle
title: WW3 Battle
tagline: Fly modern warplanes through mission scenarios set in an imagined World
  War III.
description: >-
  WW3 Battle is a browser air combat game set in an imagined third world war.
  The player takes the controls of modern military aircraft and flies missions
  built around that conflict, with a mix of strategy and flight simulation ideas
  shaping each sortie.


  The design aims for a middle ground between simple button-clicking war games
  and heavy simulators that demand a thick manual. The creator wanted players to
  sit down quickly and get a feel for flying these aircraft, and the build lets
  you try the basic aircraft on offer.


  The creator started vibecoding the project in mid-April with Claude Code, then
  finished most of it for Vibe Jam 2026 after finding the event on Twitter. The
  creator describes the result as almost complete, and it placed 617th among 945
  entries.
