slug: fly-to-mars
title: Fly To Mars
tagline: Pilot a rocket from Earth to Mars, dodging asteroids and sealing a hull breach.
description: >-
  You're the pilot of the Ares-IX, flying it from Earth to Mars out of a cockpit
  crammed with dials. It opens with a countdown and liftoff, then carries you
  through max-Q, stage separation and orbital insertion before the ship heads
  out into the asteroid belt.


  Once you're in the belt, you steer around the rock flying at you. Skimming
  close past an asteroid counts as a near-miss, and enough of those near-misses
  charge the warp drive, which neatly turns reckless flying into fuel. When it's
  charged you can punch into warp, but it's off-limits during the final
  approach.


  Somewhere past the halfway mark the hull springs a leak, and you're stuck
  sealing it while the rocks keep coming.


  The last leg is atmospheric entry, a descent through the dust, a flare and a
  touchdown. You get the Moon as you leave and Phobos and Deimos as you arrive,
  a nice bit of scenery for a game about dodging rocks.


  There are four difficulty settings, and Zen is the gentle outlier with no
  asteroids and no fail state at all, while Easy, Normal and Hard pile more rock
  into the belt. It's meant for a desktop with a keyboard, and the mouse lets
  you look around the cockpit.


  Max Z built the whole thing as a single HTML file with no build step, wiring
  the cockpit up one dial at a time over roughly 18 hours of work. AI tools
  handled the code, the art, the mission-control voices and the three soundtrack
  tracks that cycle through the flight. The mix even ducks the music whenever
  mission control calls out an event.
