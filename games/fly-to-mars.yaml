slug: fly-to-mars
title: Fly To Mars
tagline: Pilot a rocket from Earth to Mars, dodging asteroids and sealing a hull breach.
description: >-
  You're the pilot of the Ares-IX, flying it from Earth to Mars.


  Countdown, liftoff, max-Q, stage separation and orbital insertion. Asteroid
  belt, after orbital insertion. Warp drive, charged by enough near-misses. Hull
  leak past the halfway mark. Atmospheric entry, with a descent through dust, a
  flare and touchdown. Four difficulty modes, Zen with no asteroids and no fail
  state at all, plus Easy, Normal and Hard with more rock in the belt. Mission
  control callouts, with the music ducking under them.


  Play on a desktop with a keyboard, the setup it's meant for. Steer around the
  incoming rock with W, A, S and D or the arrow keys, and look around the
  cockpit with the mouse. Skim close past an asteroid to count a near-miss.
  Press Shift to warp once it's charged, but not during the final approach. Seal
  the leak while the rocks keep coming.


  Max Z built the whole thing as one HTML file with no build step, over roughly
  18 hours of work. AI tools handled the code, the art, the mission-control
  voices and the three soundtrack tracks that cycle through the flight.
