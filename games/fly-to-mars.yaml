slug: fly-to-mars
title: Fly To Mars
tagline: Pilot a rocket from Earth to Mars, dodging asteroids and sealing a hull breach.
description: >-
  You pilot the Ares-IX from Earth to Mars from a cockpit full of dials. The run
  starts with a countdown and liftoff, then passes through max-Q, stage
  separation and orbital insertion before the ship heads out into the asteroid
  belt.


  In the belt you steer to dodge incoming rock. Shaving close to an asteroid
  counts as a near-miss, and enough of them charge the warp drive. Once it is
  charged you engage warp, though it can't be used during the final approach.
  Partway past the halfway mark the hull springs a leak, and you have to seal it
  while the rocks keep coming.


  The trip ends with atmospheric entry, a descent through dust, a flare and a
  touchdown. The Moon appears at departure, and Phobos and Deimos show up on
  arrival. Mission control voice comms call out events, and three soundtrack
  tracks cycle during the flight.


  Four difficulty settings are offered. Zen has no asteroids and no fail state,
  while Easy, Normal and Hard raise the amount of rock in the belt. The mouse
  looks around the cockpit, and the game is meant for desktop with a keyboard.
