slug: fly-to-mars
title: Fly To Mars
tagline: Pilot a rocket from Earth to Mars, dodging asteroids and sealing a hull breach.
description: >-
  You're the pilot of the Ares-IX, flying from Earth to Mars with WASD or the
  arrow keys while the mouse lets you look around the cockpit. It starts with
  countdown and liftoff, then you climb through the clouds and break orbit.


  Out in the asteroid belt, you steer around incoming rocks. Skim one close and
  it counts as a near-miss, and enough of those strung together charge your warp
  drive. Shift fires it once it's ready.


  Warp won't work on the final approach though, so don't hold it too long.


  Past the halfway mark the hull springs a leak, and you have to seal it while
  the rocks keep coming. After that you ride out the heat of atmospheric entry,
  drop through the dust, flare, and set the ship down.


  The Moon shows up as you leave, and Phobos and Deimos as you arrive.


  You pick a difficulty before launch: easy, normal or hard. Zen removes the
  asteroids and any way to fail, so you just fly to Mars. Mission control talks
  to you through voiced callouts, three original tracks cycle along the way, and
  Max Zillion spent about 18 hours putting it together.
