slug: the-vibe-metaverse
title: the vibe metaverse
tagline: Meet friends in a 3D multiplayer lobby and hop between quick games.
description: >-
  The Vibe Metaverse is a multiplayer 3D lobby where players gather with friends
  and use it as a hub for entering a collection of vibe-coded games. Rather than
  a single run with a fixed goal, a session centers on meeting up in a shared
  space and picking something to play together.


  The project is a playful answer to the big-budget metaverse push, whose
  billions in spending left many people unimpressed. Here the idea is smaller
  and more direct: a shared world built around short, addictive games, presented
  in 3D. It works on mobile as well as desktop, so friends can join from
  whichever device they have.


  It was made for Vibe Jam 2026, where it placed 139th out of 945 entries. The
  creator built it with Claude Code, and it runs on Three.js.
