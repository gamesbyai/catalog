slug: charge-grid
title: Charge Grid
tagline: Build roads, extractors and power plants to turn a quiet town into a
  charged grid.
description: >-
  Charge Grid is an isometric 2D infrastructure game. You start with a free hand
  crank and grow a small town into a working power network. Place extractors on
  matching deposits, link fuel plants with roads, and send delivery trucks
  across the board to keep everything supplied.


  The goal is to store 15,000 charge while keeping four generator types running.
  Coal and oil plants have hands-on minigames that boost their output, and worn
  renewable generators need repairs. Global upgrades let you expand production
  as the grid grows.


  A catalogue of 12 buildings gives you room to plan fuel routes between
  deposits and plants. Trucks visibly travel along your roads. Progress saves
  locally, and the game accepts both mouse and touch input. It was made with
  Godot, and the AI disclosure lists assistance with code, graphics, sounds and
  text.
