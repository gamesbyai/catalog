slug: the-rite
title: The Rite
tagline: Fight other players in a fast multiplayer arena shooter in your browser.
description: >-
  You shoot your way around an arena map against other online players, and the
  first one to reach 20 kills wins.


  Each match also runs on a 10-minute clock. The current leader is named for
  everyone, so the race to 20 is always in view.


  You carry two weapons at a time, like a pair of pistols with a machinegun, or
  a machinegun with a shotgun. You select which of the two you're using at any
  moment. Your character has health and a separate shield meter. The game has
  more than one map. Players can chat with each other live.


  MyMoonEnt names Unreal Tournament as the inspiration, a series Epic no longer
  releases alongside each new Unreal Engine version.
