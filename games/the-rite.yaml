slug: the-rite
title: The Rite
tagline: Fight other players in a fast multiplayer arena shooter in your browser.
description: >-
  The Rite drops you into a first-person arena match against other online
  players. You shoot your way around the map, and the first player to reach 20
  kills wins. A 10-minute countdown sits at the bottom of the screen, and a
  banner at the top names the current leader.


  The loadout panel lists two weapons at a time, such as pistols and a
  machinegun or a machinegun and a shotgun. The selected weapon is highlighted.
  A vitals panel tracks health and a separate shield meter, and distance markers
  float over other players.


  The screens show different maps. One is a round icy chamber with a pool at its
  center and glowing pink and blue walls. Another is a dark corridor of brick
  and stone. A live chat feed lists players joining and trading messages, and
  the corner shows your ping to a US server.


  The creator's stated inspiration is Unreal Tournament, which Epic no longer
  releases alongside each new Unreal Engine version.
