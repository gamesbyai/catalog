slug: the-rite
title: The Rite
tagline: Fight other players in a fast multiplayer arena shooter in your browser.
description: >-
  The Rite puts you in a first-person arena match against other players online,
  and whoever reaches 20 kills first takes it.


  A countdown clock sits at the bottom center of the screen, and a banner at the
  top tells you who's leading, or that nobody is yet. Your health and shield are
  in the lower left. You begin with 100 health and an empty shield.


  You carry two weapons, and a loadout panel in the lower right lists them with
  the one in your hands highlighted. The pairs on screen are pistols with a
  machinegun, and a machinegun with a shotgun.


  Other players get a distance in meters floating over their heads.


  The arenas look pretty different from each other. One is a pale stone hall
  with a round pool in the middle, and another is a dim room of rough red brick,
  and both use chunky, pixelated textures.


  A chat feed runs down the right side, showing players joining and trading
  quick taunts, and you press P to type your own. The creator says the idea came
  from Epic no longer releasing a new Unreal Tournament alongside each Unreal
  Engine release.
