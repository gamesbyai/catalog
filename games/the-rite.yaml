slug: the-rite
title: The Rite
tagline: Fight other players in a fast multiplayer arena shooter in your browser.
description: >-
  The Rite lets you shoot around an arena against other players online. The
  first to reach 20 kills wins.


  A 10-minute clock on each match, with the current leader named to everyone.
  Two-weapon loadouts, like a pair of pistols with a machinegun, or a machinegun
  with a shotgun, switched at any moment. Health and a separate shield meter.
  More than one map to fight on. Live chat between players.


  MyMoonEnt names Unreal Tournament as the inspiration. Epic no longer releases
  a new Unreal Tournament with each Unreal Engine version.
