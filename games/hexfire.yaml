slug: hexfire
title: HexFire
tagline: Battle other wizards in a shrinking arena where every kill raises your bounty.
description: >-
  HexFire is a multiplayer wizard battle royale where every kill makes you a
  bigger target. Each player enters a shrinking arena as a spellcaster and casts
  spells at rival wizards, and your match ends when you fall or when you outlast
  everyone else.


  Success works against you. Every kill raises your bounty, so a player who
  racks up eliminations draws attention from the rest of the lobby, and a
  winning streak turns into a risk. You end up weighing aggression against
  staying hidden.


  According to the creator, the game was inspired by a childhood fondness for
  Runescape and Minecraft. Made with Claude Code as a Vibe Jam 2026 entry, it
  came 336th of 945 and has a Three.js 3D view that also works on phones.
