slug: hexfire
title: HexFire
tagline: Battle other wizards in a shrinking arena where every kill raises your bounty.
description: >-
  Every kill you land in HexFire makes you a bigger target, so winning a fight
  is exactly what draws more trouble your way.


  You're a wizard in a battle royale, and you kill for essence. If you die, you
  lose all of it, which means whatever you've gathered is always something you
  could be robbing yourself of in the next fight.


  Before you drop in, you spend points on five arcane skills: damage, speed,
  range, blast and agility. Each has its own bar with plus and minus buttons, so
  you can move points around until the build looks right.


  Your wizard is a little pixel-art figure in a pointed hat, which is a cute
  look for a fighter.


  The game gives you a random name like xx_Marksman40$, and you can reroll it
  until you get one you can live with. You steer with WASD and jump with Space,
  while the left mouse button fires your spells.


  There's also a key to switch your view and another to interact, though nothing
  on the start screen says what you'd interact with. The creator built it out of
  a childhood crush on Runescape and Minecraft, and then you hit Begin Descent.
