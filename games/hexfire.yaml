slug: hexfire
title: HexFire
tagline: Battle other wizards in a shrinking arena where every kill raises your bounty.
description: >-
  Every kill in this wizard battle royale makes you a bigger target. The title
  screen sets the stakes in one line: kill for essence, and dying loses all of
  it. A button labeled Begin Descent starts the match from a setup screen.


  The setup screen is where you build your wizard. A name field comes with a
  reroll button that generates random names. Five arcane skills (damage, speed,
  range, blast and agility) each have a bar and a value, with plus and minus
  buttons to shift points between them. A points counter sits above the list.


  In play, WASD moves, Space jumps, the left mouse button shoots, V switches the
  view and F interacts. The wizard is a blocky pixel-art figure in a purple hat
  and green robe, carrying a staff. The creator drew on a childhood fondness for
  Runescape and Minecraft.
