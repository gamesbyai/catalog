slug: hexfire
title: HexFire
tagline: Battle other wizards in a shrinking arena where every kill raises your bounty.
description: >-
  Every wizard you take down in this battle royale earns you essence, and if you
  die, you lose every bit of it. You build your wizard before the match starts.


  You can type a name or have the game roll a random one, which can come out as
  something like xx_Marksman40%. You split points across five arcane skills:
  damage, speed, range, blast and agility. Plus and minus buttons shift points
  between them.


  Once you're out there, WASD moves you, Space jumps and the left mouse button
  shoots. V switches the view, while F interacts. Begin Descent starts the
  match.


  TeemuSor made the game out of a childhood crush on Runescape and Minecraft.
