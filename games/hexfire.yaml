slug: hexfire
title: HexFire
tagline: Battle other wizards in a shrinking arena where every kill raises your bounty.
description: >-
  Every wizard you take down in this battle royale earns you essence, and if you
  die, you lose all of it.


  Five arcane skills (damage, speed, range, blast and agility) to split points
  across. Your wizard, built before the match.


  Shift points between skills with the plus and minus buttons. Choose Begin
  Descent to start the match. Move with WASD, jump with Space and shoot with the
  left mouse button. Press V to switch view and F to interact.


  HexFire came from TeemuSor's childhood infatuation with Runescape and
  Minecraft.
