slug: rockrise
title: ROCKRISE
tagline: Hit the notes with up to four players as a chaotic band climbing to a
  cursed festival.
description: >-
  ROCKRISE is a web rhythm game for one to four players. You join Dead
  Frequency, a band prone to disasters, and play through gigs that begin in
  backyards and build toward the main stage of a cursed festival. Each show asks
  you to keep time with the music as things go wrong around the band.


  The game draws on the feel of couch-party rhythm games from the 2000s, where
  anyone could act like part of a band for a few minutes. It brings that idea to
  the browser with multiplayer, original characters and a story full of busted
  gigs and supernatural weirdness. The band members also battle each other, not
  only the strange events around them.


  The creator built it with Claude Code and entered it in Vibe Jam 2026. The 3D
  presentation runs on the Babylon.js engine, and the whole thing plays in a
  browser.
