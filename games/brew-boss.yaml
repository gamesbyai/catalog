slug: brew-boss
title: Brew Boss
tagline: Build up a cafe from a small start into a thriving business.
description: >-
  Brew Boss puts you behind the counter of Player's Downtown Brew, a small cafe,
  on Day 1 with $50.00 to your name. Customers gather at the bar, and you click
  one of them to take their order.


  Every order goes into a list with the customer's name and the drink they're
  after. You'll see espresso, cappuccino and caffè latte, but some customers
  only say "Something creamy" and leave it there.


  lukeswissman describes the goal as building a cafe empire, with Sims 2 and
  Dave the Diver named as partial influences.
