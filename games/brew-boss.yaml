slug: brew-boss
title: Brew Boss
tagline: Build up a cafe from a small start into a thriving business.
description: >-
  Brew Boss puts you behind the counter of Player's Downtown Brew, a small
  isometric cafe, on Day 1 with $50.00 to your name. Customers gather around the
  wooden bar, and you click one of them to take their order. A hint at the
  bottom of the screen tells you exactly that, which is a kind welcome on
  opening day.


  Every order lands in a list on the left, showing the customer's name and the
  drink they're after. You'll see espresso, cappuccino and caffè latte, but some
  customers, a bit unhelpfully, only say "Something creamy" and leave it there.


  Each card also has a colored bar and a little face, and the faces are pretty
  easy to read, with green getting a smile, orange a flat neutral look and red
  an outright angry glare.


  A strip across the top shows the cafe's name and the day number. Your cash
  sits at the far right, next to a timer that counts in seconds. It's a tidy
  layout that puts the whole shift in a single line.


  lukeswissman describes the goal as building a cafe empire, with Sims 2 and
  Dave the Diver named as partial influences.


  Everything's drawn in chunky low-poly 3D, with a barista posted at the
  espresso machine and stools lined up along the bar. A red-and-white striped
  awning runs along the edge of the roof.
