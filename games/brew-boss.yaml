slug: brew-boss
title: Brew Boss
tagline: Build up a cafe from a small start into a thriving business.
description: >-
  Brew Boss puts you behind the counter of Player's Downtown Brew, a small cafe,
  on Day 1 with $50.00 to your name.


  Customers at the bar. Espresso, cappuccino and caffè latte as drink orders.
  Orders that only say something creamy.


  Click a customer to take their order. Each order goes into the list with the
  customer's name and drink.


  According to lukeswissman, the goal is building a cafe empire. Sims 2 and Dave
  the Diver are named as partial influences.
