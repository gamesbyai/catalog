slug: brew-boss
title: Brew Boss
tagline: Build up a cafe from a small start into a thriving business.
description: >-
  Brew Boss is a cafe management game where the player builds a business from
  the ground up. The goal is to grow a small cafe into a full empire, combining
  strategy decisions with the day-to-day simulation of running a shop.


  The creator cites The Sims 2 and Dave the Diver as partial inspirations, which
  points to a mix of life-sim charm and business-management loops. It renders in
  3D in the browser and was entered in Vibe Jam 2026, where it placed 73rd among
  945 entries.


  According to the creator, the game was built with Claude Code, and its 3D
  scenes are drawn with Three.js. It was made as a jam entry, so the scope is
  compact and focused on the core cafe-building idea.
