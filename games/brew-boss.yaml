slug: brew-boss
title: Brew Boss
tagline: Build up a cafe from a small start into a thriving business.
description: >-
  Brew Boss puts you behind the counter of an isometric cafe, Player's Downtown
  Brew, on Day 1 with $50.00 in cash. Customers gather at the wooden bar, and
  you click one to take their order. A hint at the bottom of the screen says
  this.


  Each order appears in a list on the left with the customer's name and the
  drink. Espresso, cappuccino and caffè latte show up, and some orders read only
  "Something creamy". Every card has a colored bar and a face. Green cards show
  a smile, orange ones a neutral face, and red ones an angry face.


  The top bar shows the cafe name, the day number, a timer in seconds and your
  cash. The creator describes the goal as building a cafe empire, with Sims 2
  and Dave the Diver named as partial influences.


  The cafe is drawn in a low-poly 3D style. A barista stands at an espresso
  machine, stools sit along the bar, and a striped awning runs along the roof
  edge.
