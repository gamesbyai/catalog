slug: sevenshard
title: Sevenshard
tagline: Fight through dungeons, raids and sea voyages as one of eight classes
  in a browser MMO.
description: >-
  Sevenshard is an isometric action MMO that runs in a single browser tab,
  modeled on the feel of Lost Ark. Players pick from eight classes and head into
  chaos dungeons, guardian raids and a legion raid, fighting through encounters
  in real time from a top-down angle.


  Beyond the combat content, the game includes sailing between islands and co-op
  play, which appears to use WebRTC for connecting players. Its scope is wide
  for a browser project: multiple activity types, class variety and an open sea
  to travel across.


  Everything in the game is procedural, which the project's description applies
  to its content overall. It is built on Three.js with Web Audio and WebGL, and
  the creator's tooling lists Claude Code.
