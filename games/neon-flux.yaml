slug: neon-flux
title: Neon Flux
tagline: Blow up your own ship to set off chain explosions and rack up points
description: >-
  Detonate your own ship to set off chain explosions through waves of enemies,
  all against a countdown.


  Your ship as your main weapon. Blasts that ripple from enemy to enemy. Repeat
  attempts at a higher score. Positioning that counts more than picking targets
  off one by one.


  Turn the countdown into as many points as you can before it hits zero.
