slug: neon-flux
title: Neon Flux
tagline: Blow up your own ship to set off chain explosions and rack up points
description: >-
  In Neon Flux your main weapon is your own ship. Waves of enemies fill the
  screen, and instead of only firing at them, you detonate the ship to set off
  chain explosions that sweep through the crowd, all against a countdown.


  It is a score-chasing arcade shooter built for repeat attempts at a higher
  score. Built with Claude Code and Three.js, it placed 162nd of 945 at Vibe Jam
  2026 and runs on phones as well as on a desktop.


  Lining up enemies so one blast ripples through many of them matters more than
  picking targets off one at a time. The timer keeps every decision tight, and
  each run is a race to turn the clock into as many points as possible before it
  hits zero.
