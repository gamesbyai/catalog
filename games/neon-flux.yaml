slug: neon-flux
title: Neon Flux
tagline: Blow up your own ship to set off chain explosions and rack up points
description: >-
  Your own ship is your main weapon. Enemies arrive in waves, and instead of
  only shooting them, you detonate your ship to set off chain explosions that
  sweep through the crowd, all against a countdown.


  It is a score-chasing arcade shooter built for repeat attempts at a higher
  score. Built with Claude Code and Three.js.


  Lining up enemies so one blast ripples through many of them matters more than
  picking targets off one at a time. Each run is a race to turn the countdown
  into as many points as you can before it hits zero.
