slug: monaco-gp
title: Monaco GP
tagline: Race F1-style cars against other players on 3D tracks with arcade handling.
description: >-
  In Monaco GP you take an F1-style car onto a 3D track and race against other
  players online, working through the corners and straights of each circuit. The
  handling is arcade-style, and the loop can be replayed as often as you like.


  For the creator, it was also a way to try current AI agents on game
  development, using Claude Code as the agent. Three.js renders the cars and
  tracks directly in the browser, on a desktop or a phone, and the game ranked
  333rd of 945 at Vibe Jam 2026.


  According to the creator, the main focus was on race mechanics and physics. So
  while the handling keeps the pick-up-and-play pace of an arcade racer, the
  physics underneath lean toward a racing simulation feel.
