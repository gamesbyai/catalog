slug: monaco-gp
title: Monaco GP
tagline: Race F1-style cars against other players on 3D tracks with arcade handling.
description: >-
  The goal is the fastest lap. You enter a name, press Drive, and run time trial
  laps around a Monaco-style circuit, with your best time going on a global
  leaderboard. Name entry comes first, with a tag like LEC16 as the example.


  Every other driver online is on the same track with you in real time, so laps
  are run alongside live players. The handling is arcade style with an F1
  flavor, and the creator says race mechanics and physics were the main focus.
  Space applies a handbrake for drifting, and R puts you back on the track.


  The circuit winds along a coastline of low-poly buildings, mountains and a
  harbor full of boats. You can customize your car and orbit the camera around
  it. The car model was generated with GPT Image 2 and Tripo3D, and the music
  was made with Suno.
