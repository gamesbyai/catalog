slug: monaco-gp
title: Monaco GP
tagline: Race F1-style cars against other players on 3D tracks with arcade handling.
description: >-
  Chase the fastest lap on a Monaco-style circuit. Each run is a time trial,
  with your best time on a global leaderboard.


  Other online drivers sharing your track live, usually solo time trials.
  F1-flavored arcade handling. Camera orbit around your car, on its own key
  combo.


  Enter a driver name, press Drive to get on track. Press Space to handbrake and
  drift. Press R to rejoin the track. Customize your car with its own key combo.


  GPT Image 2 and Tripo3D built the car model. Suno made the music. According to
  the creator, race mechanics and physics got most attention.
