slug: monaco-gp
title: Monaco GP
tagline: Race F1-style cars against other players on 3D tracks with arcade handling.
description: >-
  You're chasing the fastest lap around a Monaco-style circuit, and your time
  goes onto a global leaderboard. It's a time trial, so the point is to shave
  your best lap down rather than to win a race.


  Other drivers who are online at the same moment share the track with you in
  real time. That means your hot lap happens alongside everyone else's, which is
  a nice touch for a mode built around solo times.


  The creator says the focus was on race mechanics and physics, and the handling
  has an F1 flavor but stays arcade. There's a handbrake for drifting, so you
  can throw the car into corners instead of only braking for them.


  If you spin out or end up somewhere bad, you can respawn on the track with one
  key.


  The track curves along a hillside above the sea. Low-poly mountains, clusters
  of tall buildings and a harbor full of tiny boats sit around it, and clouds
  hang in the sky. You can open a customize screen to change your car before you
  drive. The car model was made with GPT Image 2 and Tripo3D, and the music
  comes from Suno.


  You type a name first, something like a driver's three-letter code, and then
  you press Drive.
