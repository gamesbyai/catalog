slug: monaco-gp
title: Monaco GP
tagline: Race F1-style cars against other players on 3D tracks with arcade handling.
description: >-
  Monaco GP is a multiplayer 3D racing game with an F1 flavor and arcade-style
  handling. Players take a car onto the track and race against others online,
  working through corners and straights in a loop that can be replayed as often
  as they like. It also runs on mobile devices.


  The creator says the main focus was on race mechanics and physics, and the
  game leans toward a simulation feel while keeping the pick-up-and-play pace of
  an arcade racer. Rendering is done with Three.js, so it runs directly in the
  browser.


  The game was entered in Vibe Jam 2026, where it placed 333 out of 945 entries.
  The creator built it with Claude Code, as a way to try current AI agents on
  game development.
