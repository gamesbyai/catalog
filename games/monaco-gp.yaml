slug: monaco-gp
title: Monaco GP
tagline: Race F1-style cars against other players on 3D tracks with arcade handling.
description: >-
  The fastest lap is what you're after on this Monaco-style circuit, where every
  run is a time trial and your best time gets posted to a global leaderboard.


  First you type in a driver name. Then you hit Drive and you're out on the
  track.


  Every other driver who's online shares the same track with you in real time,
  in what's usually a solo time trial, so you're running your laps alongside
  live players. The handling is arcade with an F1 flavor, and according to the
  creator, race mechanics and physics got most of their attention. Space pulls a
  handbrake so you can drift, while R drops you back on the track.


  Customizing your car has a key combo of its own, and another one is set aside
  just for orbiting the camera around it.


  The car model came out of GPT Image 2 and Tripo3D, while the music was made
  with Suno.
