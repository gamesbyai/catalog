slug: the-regulars
title: THE REGULARS
tagline: Talk to diner regulars, guess their orders, and spot what doesn't fit.
description: >-
  Work the counter at the Last Stop Diner, chat with the regulars and learn
  enough about each one to guess their order before they say it.


  Regulars like Walter with his two newspapers, Mrs. Finch and her secret
  peppermints, and Danny the paperboy. Familiarity that grows with every line
  you learn. A Memory Notebook for their stories. Details that start to drift,
  which you flag when they don't fit. More than one ending. Refill Rush, a
  60-second arcade mode for keeping three coffee cups full.


  Every face, picture and sound is generated in code, and each face grows from a
  seed so a regular looks the same every visit. According to HAFFNERVISION, the
  game is AI-generated.
