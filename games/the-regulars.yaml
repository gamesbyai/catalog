slug: the-regulars
title: THE REGULARS
tagline: Talk to diner regulars, guess their orders, and spot what doesn't fit.
description: >-
  Every line you pick up from a regular at the counter raises your familiarity
  with them. Once you know someone well enough, you get to guess their order
  before they say it.


  After that you serve them, fill the counter, and file their stories away in
  your Memory Notebook.


  Walter reads two newspapers at once, Mrs. Finch hides peppermints, and Danny
  the paperboy has the town's porches memorized. That's a funny crew for the
  Last Stop Diner, which stays open all night with rain on the window and a red
  neon sign.


  When things start to drift, you flag whatever doesn't fit. That makes sense
  for a memory game, because you can only spot what's off in people you've
  actually come to know. The game has multiple endings.


  There's also Refill Rush, which is a separate arcade mode on its own.


  In it you keep three coffees topped off for a minute while you build a combo
  and chase a high score. The whole game is made in code, with no image or sound
  files, so the faces, rain, neon and music are all generated, and a given seed
  always produces the same face, which suits a story about familiarity. The
  pixel art shows a skyline behind the diner and a checkered counter.
