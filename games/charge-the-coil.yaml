slug: charge-the-coil
title: Charge The Coil
tagline: Tap at the right moment to wind a glowing charge around a copper coil.
description: >-
  Charge The Coil is a one-button timing game. A live charge spins out from a
  core and accelerates through a copper coil. The player releases it as it
  reaches the contact port to add a winding. Release too early and the
  connection breaks; wait too long and the coil overloads.


  Perfect releases grow the charge faster and build a chain, and completing the
  whole coil cashes the stored energy into a discharge bonus. Each winding gets
  its own neon frequency, with matching plasma bursting off the coil when it
  locks. Every point makes the next charge faster and tighter, and the best
  score is saved.


  Every new winding, successful lock, plasma burst and failure has its own sound
  cue. The game was made for AI Browser Game Jam #4 with the theme Charge. The
  creator states that concept and direction came from Thomas Geelens, with the
  code and graphics built and iterated using AI-assisted coding and testing.
