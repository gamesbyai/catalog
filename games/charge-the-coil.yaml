slug: charge-the-coil
title: Charge The Coil
tagline: Tap at the right moment to wind a glowing charge around a copper coil.
description: >-
  You time one-button releases to fill a coil with charge. Each charge starts at
  the center and spirals outward, and a release at the contact port adds one
  more turn of winding.


  Charges that keep gaining speed. Perfect releases that make the charge grow
  faster and build a chain. A tail that overloads the whole coil when you hold
  on too long. Severed connections from letting go too soon. Banking a full coil
  for a scored discharge bonus. Quicker follow-up charges and a narrower timing
  window after scoring. Your best score, saved as you play.


  Tap, click, Space, or Enter to release the charge. The browser may hold audio
  until your first input, and each winding, lock, plasma burst and failure plays
  its own sound.


  Thomas Geelens originated the concept, and AI helped build the code.
