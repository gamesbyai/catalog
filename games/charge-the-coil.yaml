slug: charge-the-coil
title: Charge The Coil
tagline: Tap at the right moment to wind a glowing charge around a copper coil.
description: >-
  You play with a single input. A charge leaves the center of the coil, spirals
  outward, and picks up speed. Your job is to let go as it reaches the contact
  port, which adds one more turn of winding to the coil.


  Letting go too soon severs the connection. Holding on too long sends the
  charge into a tail that overloads the whole coil. Perfect releases make the
  charge grow faster and build a chain.


  Filling the entire coil banks it and pays out a scored discharge bonus.
  Scoring makes each following charge quicker and the timing window narrower.
  The best score is saved.


  Every new winding, lock, plasma burst and failure plays its own sound. The
  browser may hold audio until your first input. The concept came from Thomas
  Geelens, and the code was built with AI help.
