slug: starfall
title: Starfall
tagline: Pilot a spaceship in a duel to the death against one opposing ship
description: >-
  Starfall Melee puts two spaceships on a single screen, circling a central sun,
  and the fight ends when one crew is gone. Each ship thrusts, turns and brakes,
  and carries a primary weapon and a secondary weapon. Asteroids drift around
  the arena. The game is an homage to the Melee mode of Star Control 2.


  Before each round you pick a ship from a roster of about sixteen races,
  including Asterion Patrol, Terran Vanguard, Helix Nomad and Hive Carrier, or
  choose a question mark for a random one. Each ship has its own crew count,
  battery meter and weapon pair. Asterion Patrol, for example, fires Ion Bolts
  and a Seeker Missile.


  A checkbox turns the second pilot into an AI, which picks its own next ship.
  With it off, two players share one keyboard. The match is tracked in rounds
  with a running score, and you choose an unused ship for each new round. The
  ship portraits and artwork were generated with Codex's built-in image
  generation.
