  controls:
    - "W: thrust (player 1)"
    - "A / D: turn (player 1)"
    - "S: brake (player 1)"
    - "F: primary weapon (player 1)"
    - "G: secondary weapon (player 1)"
    - "Arrow keys: thrust, turn, brake (player 2)"
    - "K / L: primary and secondary weapon (player 2)"
    - "Enter: start or next melee"
