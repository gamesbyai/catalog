slug: starfall
title: Starfall
tagline: Pilot a spaceship in a duel to the death against one opposing ship
description: >-
  Starfall Melee has you flying one ship against another around a glowing sun,
  and the only goal is to destroy the other one. You turn, thrust and brake,
  with one key for your main weapon and another for the secondary. It's an
  homage to the Melee mode in Star Control 2, so the duel is the whole show,
  apart from a few asteroids drifting through.


  You get sixteen ships to pick from, which is pretty generous for a fight on
  one screen.


  Each one comes with its own pilot portrait, crew count and pair of weapons.
  The Asterion Patrol starts with 30 crew, ion bolts and a seeker missile, while
  the Terran Vanguard has 38 crew, a missile and a point defense weapon.


  Crew and battery meters sit beside each portrait, and every weapon gets its
  own bar underneath, so you can see what your opponent has left to throw at
  you. Tick the AI box and the computer flies the second ship. Clear it and a
  friend can share your keyboard, which works because both sets of keys are
  printed right under the arena.


  If you can't decide on a ship, there's a random pick on the select screen that
  chooses for you.


  The match is scored in rounds, with a running tally up in the header. When a
  ship goes down you choose one you haven't used yet for the next melee.
  @kashprime made it, and Codex's built-in image generation produced the ship
  art, which saved a ton of time.
