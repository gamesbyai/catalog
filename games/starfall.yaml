slug: starfall
title: Starfall
tagline: Pilot a spaceship in a duel to the death against one opposing ship
description: >-
  Starfall pits you against one opponent in a single arena, each flying a
  spaceship around a sun until one crew is wiped out.


  About sixteen races, among them Helix Nomad and Hive Carrier. Each race with
  its own crew, battery and weapon pair. Asterion Patrol, with 30 crew, Ion
  Bolts and a Seeker Missile. Terran Vanguard, with 38 crew and a Vanguard
  Missile. Drifting asteroids in the arena. An AI for the second ship, choosing
  its own next ship. Rounds with a running score, and a ship you haven't flown
  yet each time.


  Thrust, turn and brake to fly, and use your primary and secondary weapons on
  the other ship. Before each round, pick a race or choose a random one. Leave
  the AI off and share one keyboard: Player 1 uses WASD and Player 2 uses the
  arrow keys. Each player cycles through races with their own pair of keys.


  Starfall is an homage to the Melee mode of Star Control 2. kashprime made the
  ship portraits and artwork with built-in image generation. According to
  kashprime, doing it that way saved a lot of time.
