slug: blood-blade
title: Blood&Blade
tagline: Fight melee duels with directional attacks and blocks in the browser.
description: >-
  Type a warrior name and press Enter the Battlefield to join a single shared
  multiplayer world, listed for 64 warriors. Move with WASD and look around with
  the mouse. ESC releases the cursor when you need it back.


  Combat is melee only and built on directional attacks and directional blocks.
  Hold left click to attack, and the spot where you click on screen sets the
  direction of the swing. Right click to block, with the block direction chosen
  by the same on-screen position.


  The creator loves the combat of Mount & Blade and wanted to recreate it in the
  browser, keeping the directional attacks and blocks and limiting it to melee.
  The menu screen uses a dark red and gold palette with a glowing title and a
  short controls panel.
