slug: blood-blade
title: Blood&Blade
tagline: Fight melee duels with directional attacks and blocks in the browser.
description: >-
  Type a warrior name and press Enter to join a multiplayer battle.


  Melee-only fights in one shared world for up to 64 warriors.


  Hold left click to swing. The spot you click sets the blow's direction. Right
  click to block. Your click position sets the guard's direction the same way.
  Move with WASD. Turn with the mouse. Press ESC to free your cursor.


  zahrdaniel loves the combat in Mount & Blade and wanted to rebuild it in the
  browser, keeping directional attacks and blocks while limiting fights to
  melee.
