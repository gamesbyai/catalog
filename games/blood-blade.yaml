slug: blood-blade
title: Blood&Blade
tagline: Fight melee duels with directional attacks and blocks in the browser.
description: >-
  Blood&Blade is a browser melee dueling game built on one system: directional
  combat in the style of Mount & Blade. You swing your weapon in a chosen
  direction, and to stop an incoming strike you have to block in the matching
  direction. Block the wrong way and the strike gets through.


  The narrow focus is deliberate. The creator loves the directional combat of
  Mount & Blade and wanted to recreate its melee fighting, using Claude and
  Codex to build it on Three.js for the browser. It came 474th of 945 at Vibe
  Jam 2026.


  Multiplayer means duels can be fought against other people online, not only
  scripted enemies. Every fight comes down to reading your opponent and timing
  your own attacks, one directional swing at a time.
