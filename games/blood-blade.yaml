slug: blood-blade
title: Blood&Blade
tagline: Fight melee duels with directional attacks and blocks in the browser.
description: >-
  Left click to attack, and hold the button to aim the direction of the swing.
  Right click blocks. Where you click on the screen decides the direction of
  both, so you pick which side you're striking or guarding.


  The creator loves the combat in Mount & Blade, with its directional attacks
  and directional blocks, and wanted to rebuild just the melee side in a
  browser. That's why there are no horses here, only you and a blade.


  You type a warrior name, press the button to enter the battlefield, and land
  in one shared multiplayer world. The lobby says it holds 64 warriors, which is
  a lot of people to share a single field with.


  You walk with WASD and look around with the mouse. Escape gives your cursor
  back when you need it.


  The arena is a dark, grassy field ringed by walls, with a few blocky trees
  under a gray sky. If the connection drops, a prompt sends you back to the
  lobby.
