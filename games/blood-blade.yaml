slug: blood-blade
title: Blood&Blade
tagline: Fight melee duels with directional attacks and blocks in the browser.
description: >-
  Type a warrior name, then press Enter the Battlefield to join. There's one
  shared multiplayer world to drop into, and the menu lists room for a whole 64
  warriors in it.


  Every fight here is melee, so it always comes down to blade against blade.


  To swing, you hold left click, and the spot on screen where you click decides
  which direction the blow comes from. Right click blocks, and it reads your
  click position the same way, which gives your guard a direction just like your
  attacks.


  You move with WASD while the mouse turns your view. When you want your cursor
  back, ESC lets it go. Handily, all of this sits in a small controls panel
  right under the name box, along with a note explaining how the click sets your
  direction.


  The battlefield itself is a dim, grassy arena ringed by dark walls, with a few
  oddly blocky trees standing around.


  zahrdaniel loves the combat in Mount & Blade and wanted to rebuild it in the
  browser. The plan was to keep its directional attacks and blocks while
  limiting the fighting to melee. The menu screen goes pretty heavy on a dark
  red and gold palette, with a glowing title and that short controls panel.
