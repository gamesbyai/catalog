slug: shoot-or-die
title: Shoot or Die
tagline: Grab a gun, shoot rival players, and be the last one standing.
description: >-
  Shoot or Die is a multiplayer shooter played in the browser. Each round,
  players pick up a gun and try to eliminate everyone else. The last player
  still standing wins, so every match comes down to staying alive while picking
  off opponents.


  The concept comes from a map the creator originally built in UEFN for
  Fortnite. It was kept deliberately small in scope to suit a jam project,
  focusing on quick rounds and a simple win condition. It also runs on phones,
  and the creator reports it working well on an older Galaxy Note10 Lite.


  The creator, an experienced UEFN and Unity developer, had never made a
  Three.js game before. They built it with Claude Code, spending about a day and
  a half on the game, server, and bug fixes, then another day and a half on
  polish and deployment. It was entered in Vibe Jam 2026.
