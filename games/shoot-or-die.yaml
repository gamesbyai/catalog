slug: shoot-or-die
title: Shoot or Die
tagline: Grab a gun, shoot rival players, and be the last one standing.
description: >-
  Grab a gun from a weapon pedestal and shoot the other players. The last one
  standing wins the round.


  Online rounds against other players. Two choices, as the rules on screen put
  it: shoot, or run. PC and mobile controls.


  Type a callsign and press Enter the Arena. Move with WASD, sprint with Shift
  and roll with Space. Press E at a pedestal to take a gun. On mobile, one
  joystick area moves you and the other rotates you.


  SuperAppGames based it on a map built earlier in UEFN. AI produced the game,
  its multiplayer server and bug fixes in about a day and a half, and polish and
  deployment took another day and a half.
