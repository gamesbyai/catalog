slug: shoot-or-die
title: Shoot or Die
tagline: Grab a gun, shoot rival players, and be the last one standing.
description: >-
  In Shoot or Die, every player grabs a gun and has one job: be the last one
  standing. It is an online multiplayer shooter where each round is about
  staying alive while picking off everyone else, kept to quick rounds and a
  simple win condition.


  The concept started as a map the creator built in UEFN for Fortnite, and it
  was kept deliberately small to fit a jam. The creator reports it running well
  on phones, including an older Galaxy Note10 Lite.


  They are an experienced UEFN and Unity developer but had never made a Three.js
  game before. With Claude Code, they spent about a day and a half on the game,
  server, and bug fixes, then another day and a half on polish and deployment.
