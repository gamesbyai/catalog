slug: shoot-or-die
title: Shoot or Die
tagline: Grab a gun, shoot rival players, and be the last one standing.
description: >-
  Type a callsign, press Enter the Arena, and pick PC or mobile. Move with WASD,
  sprint with Shift, roll with Space, and press E to grab a gun from a weapon
  pedestal. Then shoot the other players. The last one standing wins the round.


  On mobile, the controls are two joystick areas: one moves your character and
  the other rotates it. The arena is an open grassy hill with trees and rocks
  under a cloudy sky, and the rules are on screen before you enter: shoot, or
  run.


  The game is based on a map the creator had built earlier in UEFN. Claude Code
  produced the game, the multiplayer server and bug fixes in about a day and a
  half, followed by another day and a half of polish and deployment.
