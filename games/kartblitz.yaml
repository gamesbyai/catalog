slug: kartblitz
title: Kartblitz
tagline: Drift around stylized 3D tracks in a fast arcade kart racer.
description: >-
  You race arcade karts through stylized, high-speed 3D worlds in Kartblitz. You
  can jump straight in.


  Precision drifting for holding speed through each track's corners. Races that
  can include other people, not only computer drivers. Portals to other
  creators' projects through a webring, one stop in a chain of browser games you
  can travel between.


  heyysomu08 describes wanting to build a high-performance 3D game directly in
  the browser. The design draws on 90s karting games, with the focus on speed
  and style. According to the creator, adventure and platformer elements sit
  alongside the racing.
