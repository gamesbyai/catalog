slug: kartblitz
title: Kartblitz
tagline: Drift around stylized 3D tracks in a fast arcade kart racer.
description: >-
  Kartblitz is an arcade kart racer you jump straight into. You race through
  stylized, high-speed 3D worlds and use precise drifting to hold your speed
  through the corners of each track, and races can include other people rather
  than only the computer.


  The design draws on 90s karting games, with the focus on speed and style, and
  the creator describes wanting to build a high-performance 3D game directly in
  the browser. According to the creator, adventure and platformer elements sit
  alongside the racing.


  It came 189th of 945 at Vibe Jam 2026, and Three.js renders the whole thing. A
  portal system links Kartblitz to other creators' projects through the Vibe Jam
  2026 Webring, which makes it one stop in a chain of browser games you can
  travel between.
