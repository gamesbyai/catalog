slug: seventh-moon
title: Seventh Moon
tagline: Search your late grandmother's townhouse and throw moon blocks to ask the ancestors.
description: "You come home alone the night after your grandmother's funeral, to her two-story townhouse in a small Taiwanese town. It's a rainy night in Ghost Month in the early 1990s, and the rest of the family is at the temple for an overnight sutra service.


  A first-person psychological horror story with no combat and no gore. An upstairs corridor that loops back on itself, with the house a little more wrong each time around. Moon blocks to ask the ancestors yes-or-no questions at the family altar. Three endings, decided by what you find and how you answer. Gentle mode to turn off the three sudden scares and the strobing light. Every line in Traditional Chinese and English.


  Walk with WASD or the arrow keys, look around with the mouse and press E to pick up, read or open whatever you point at. Find the incense and the matches, light the incense at the altar, then throw the moon blocks with Space. One flat and one round side up means yes, two flat sides mean ask again and two round sides mean no.


  The story, characters, house and puzzles are all original, drawn from the mood of Taiwan's Ghost Month and its family altar customs rather than from another game."
