slug: faithful-or-fickle
title: Faithful Or Fickle
tagline: Play a black cat familiar who secretly steers a manor's fate across
  several eras
description: >-
  Faithful Or Fickle puts you in the paws of a black-cat familiar serving a
  manor's lord or lady, in a platformer spanning eras from the 1400s to the
  early 1900s. Each era has its own map, and you cross it to reach the ruler's
  big battle. Whether they win or lose depends on the state of the estate, and
  that state is what you get to meddle with.


  Your master grabs you for short stretches of familiar duties quite often, but
  you're free to roam the rest of the time. Press B where spies show up to take
  their bribe and switch sides, let infiltrators into the house, or re-swear
  your loyalty and recruit allies instead.


  You can flip sides as often as you like, and the somewhat inept ruler never
  really works out who's behind the decline, so they could lose the battle
  convinced you're a lovely little companion.


  The battle won't start until you've tracked down two house-needs items. Most
  of the powerups are clumped together on the core route, which runs through the
  ground, the road and the manor. You can also climb to the heights or drop into
  the deeps to fight large beasts such as dragons.


  There are no extra-life pickups. You have nine lives, and when they're gone,
  the run is over.


  X is the claw swipe, and holding an arrow key aims it. Swipe upward in midair
  and you can sort of hold off gravity, hauling yourself slowly back toward the
  surface.


  There's a frame-skip option for faster machines, which can show more detail.
  The creator also says the deeps still feel quite empty.


  According to the creator, AI assisted with the code, graphics, sounds and
  text.
