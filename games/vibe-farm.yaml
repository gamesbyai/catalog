slug: vibe-farm
title: Vibe Farm
tagline: Level up and build a growing colony, playing solo or with others online.
description: >-
  You start beside your house on an isometric map and build a colony from
  scratch. Till soil, water and plant seeds, harvest with the scythe, chop
  trees, mine rocks, and fight enemies with a sword. Gold, wood, stone and food
  totals sit in a settlement panel.


  A calendar bar shows the year, season and day, and an XP bar tracks your
  level. Daily quests set small targets: defeat 7 mine enemies, mine 3 rocks,
  harvest 3 crops. Each pays gold and materials. Achievements pop up at
  milestones, such as mining your first rock.


  You can play alone or with other players online. A minimap in the corner shows
  the terrain, and other named characters walk around the map. A four-page
  tutorial opens the game and covers movement and the tool hotbar. You read each
  page to move on to the next.


  Tools sit on an eight-slot hotbar: hoe, watering can, seeds, scythe, hammer,
  axe, pickaxe and sword. A prompt at the bottom of the screen tells you what
  the current tool does on the tile you face, for example pressing E to till it.
