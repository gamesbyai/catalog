slug: vibe-farm
title: Vibe Farm
tagline: Level up and build a growing colony, playing solo or with others online.
description: >-
  Vibe Farm is a 3D adventure game that can be played solo or with other players
  online. The focus is on leveling up and building a colony, growing it step by
  step as your character progresses. The creator points to Stardew Valley as a
  reference for the farming-life feel.


  The game asks new players to read its tutorial first, which suggests some
  systems need explaining before you start. The mix of progression and colony
  building sits alongside the option to team up in multiplayer, so a session can
  be a quiet solo build or a shared one.


  It was entered in Vibe Jam 2026, where it placed 533rd out of 945 entries, and
  the creator built it with Cursor. It runs in the browser on Three.js.
