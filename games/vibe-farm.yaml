slug: vibe-farm
title: Vibe Farm
tagline: Level up and build a growing colony, playing solo or with others online.
description: >-
  You start next to your house with a plot of land and a plan to turn it into a
  colony. You farm, gather wood and stone, put up buildings and fight enemies,
  either on your own or alongside other people online.


  Eight tools sit on a hotbar, and you switch between them with the number keys.


  The hoe, watering can, seeds, scythe, hammer, axe, pickaxe and sword each get
  a slot, so one row covers farming, building, chopping, mining and fighting.
  Till a tile and the game suggests the watering can next, which is a kind nudge
  for anyone still learning the keys.


  A calendar runs along the top of the screen, starting on day 1 of spring in
  year 1.


  Under it an XP bar fills as you level up. A panel on the left tallies your
  settlement, including population, gold, wood, stone, food and how many colony
  buildings you've built.


  Daily quests hand you small jobs with rewards, like defeating mine enemies,
  mining a few rocks or harvesting three crops. Achievements pop up as you go,
  and a minimap in the corner shows the whole island, which is handy since the
  mine sits inside a walled area of its own.


  The map is a tilted top-down patchwork of forest, sand and rocky ground. Other
  players wander around with name tags over their heads, and a short tutorial at
  the start walks you through the basics one page at a time.
