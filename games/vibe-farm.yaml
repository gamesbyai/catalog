slug: vibe-farm
title: Vibe Farm
tagline: Level up and build a growing colony, playing solo or with others online.
description: >-
  Your goal is to grow a colony out of one house. You farm, chop trees, mine and
  fight to get there.


  The farming runs through every step, from tilling and watering a patch of soil
  to planting seeds and bringing the crop in with the scythe.


  You switch between all eight tools with the number keys. They are the hoe,
  watering can, seeds, scythe, hammer, axe, pickaxe and sword. Away from the
  fields, the axe takes down trees and the pickaxe breaks rocks, while the sword
  handles enemies. Your current tool tells you what it will do to the tile
  you're facing, like pressing E to till it.


  The game tracks the year, season and day, starting on Day 1 of 28 in spring,
  and you level up as you gain XP.


  Daily quests hand you small jobs like beating 7 enemies in the mine, mining 3
  rocks or harvesting 3 crops. Each one pays out gold and materials, and
  achievements pop up at milestones, including one just for mining your very
  first rock.


  You can play alone or online with other people, and named characters are
  already wandering the map. Before any of that, a four-page tutorial covers
  movement and tool switching, and you have to read each page before the next
  one opens. charliegkoch-design asks every player to read that tutorial.
