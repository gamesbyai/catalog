slug: vibe-farm
title: Vibe Farm
tagline: Level up and build a growing colony, playing solo or with others online.
description: >-
  Start with a single house and expand it into a colony. You get there by
  farming, chopping trees, mining and fighting. You can play alone or online
  with other people, and named characters already wander the map.


  Every farming step, from tilling and watering to planting and harvesting with
  a scythe. Eight tools, the hoe, watering can, seeds, scythe, hammer, axe,
  pickaxe and sword. Daily quests like beating 7 enemies in the mine, mining 3
  rocks or harvesting 3 crops, each paying gold and materials. Leveling up as
  you gain XP, plus achievements at milestones, including one for mining your
  first rock. A calendar of year, season and day, starting on Day 1 of 28 in
  spring.


  Press the number keys to switch tools. Press E to till the tile you're facing.
  Away from the fields, chop trees with the axe and break rocks with the
  pickaxe. Fight enemies with the sword. Check the tool in your hand to see what
  it will do to the tile you face.
