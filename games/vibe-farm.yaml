slug: vibe-farm
title: Vibe Farm
tagline: Level up and build a growing colony, playing solo or with others online.
description: >-
  Vibe Farm is a 3D adventure game about leveling up and building a colony. The
  colony grows step by step as your character progresses and levels up, and you
  can build it alone or team up with other players online in multiplayer.


  The creator points to Stardew Valley as the reference for its farming-life
  feel, and built the game with Cursor on Three.js. Its Vibe Jam 2026 result was
  533rd of 945.


  Start with the tutorial: the game asks new players to read it first, which
  suggests some of its systems need explaining before you begin. After that, a
  session can be a quiet solo build or a shared one, with progression and colony
  building at the center either way.
