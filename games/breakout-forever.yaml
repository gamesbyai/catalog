slug: breakout-forever
title: Breakout Forever
tagline: Bounce a ball off a paddle to break bricks in a classic arcade style
description: >-
  Bounce a ball into a wall of bricks with a paddle you move along the bottom.
  Clear the bricks without letting the ball fall past the paddle.


  The familiar Breakout formula, followed closely. Arcade action with simple,
  immediate play. Quick sessions, easy to pick up.


  The creator writes, "A new classic experience of a beloved arcade game," and
  says they reimagined the classic Breakout genre.
