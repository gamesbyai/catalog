slug: breakout-forever
title: Breakout Forever
tagline: Bounce a ball off a paddle to break bricks in a classic arcade style
description: >-
  Breakout Forever is the classic brick-breaking arcade game, played straight.
  You move a paddle along the bottom of the screen, bounce the ball into the
  bricks above and knock them out. The job is to keep clearing bricks without
  ever letting the ball fall past the paddle.


  It keeps to the familiar Breakout formula of arcade action and aims for a
  fresh version of a well-known arcade idea. The creator says it was built with
  the Gemini app on the Phaser framework, and it came 583rd of 945 entries at
  Vibe Jam 2026.


  The action is simple and immediate, which makes this single-player game easy
  to pick up for a quick session in the browser: a paddle, a ball and a wall of
  bricks to work through.
