slug: neon-velocity
title: NEON VELOCITY
tagline: Race eight AI cars over three laps of a synthwave highway.
description: >-
  You start at the back of the grid in ninth place. Eight AI rivals share the
  road with you. The race runs three laps, and passing rivals or getting passed
  moves you up or down the order from 1st to 9th. You only win by crossing the
  line first, so you'll have to work your way past the whole field.


  The circuit is a long chain of hand-built sections, opening with a start
  straight and gentle S-curves before a hill climb, a long sweeping right and a
  descent. After that come a tight chicane, a straight up on a plateau,
  hairpins, a valley dip, fast esses and the final straight home.


  Curves shove your car toward the outside of the bend, so you have to
  counter-steer, and the shove gets stronger the faster you're going.


  Boost builds up on its own over time, and using it for extra speed drains it.
  Golden pads spread evenly around the track top it back up for free. If you
  leave the tarmac the car slows hard, and rear-ending a rival costs you speed
  and gives them a small shove forward.


  A single key switches the speed readout between KMH and MPH. Finishing gives
  you your final place, total time and every lap split. On phones, you drive
  with touch buttons on the screen.


  INTJT2 packed it all into one HTML file, and even the synthwave soundtrack and
  the engine sound are generated right in the browser. According to the creator,
  AI helped with the code and the sounds.
