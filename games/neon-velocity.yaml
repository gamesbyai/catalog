slug: neon-velocity
title: NEON VELOCITY
tagline: Race eight AI cars over three laps of a synthwave highway.
description: >-
  You start on a dark highway under a pink sunset, in a cyan car at the back of
  a nine-car grid, with the other eight cars sitting in neon colors up the road
  ahead. The top of the screen shows your position, the lap, a timer, your best
  lap and your speed.


  The goal is to pass the pack and cross the line first after three laps. The
  track twists through S-bends, a chicane, hairpins, hills and a valley dip, and
  the curves shove your car toward the outside edge, so you have to steer
  against that pull. The faster you go, the harder it pushes.


  Drift too far to either side and you hit the dirt, which slows you down a lot.
  That's a harsh price for a small mistake.


  The rival cars weave between lanes and each has its own speed and favorite
  lane. If you clip one from behind you lose speed and it gets nudged forward,
  so slipping through the gaps pays better than ramming.


  There's a boost bar in the corner that drains while you burn it and slowly
  refills when you let off. Golden pads on the road top it up for free, and
  they're spread around the circuit. Boosting through a curve will fling you off
  the road, so it suits the straights better.


  Your lap times are recorded with the best one highlighted, and a results
  screen at the end shows your finishing place, total time and each lap split.
  The soundtrack is synthwave generated in the browser, and the engine pitch
  climbs with your speed.


  A tap on the speed readout switches between KMH and MPH, and touch buttons
  appear on phones, so you don't need a keyboard.
