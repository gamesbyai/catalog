slug: neon-velocity
title: NEON VELOCITY
tagline: Race eight AI cars over three laps of a synthwave highway.
description: >-
  You drive a neon car against eight AI opponents on a pseudo-3D highway under a
  synthwave sunset. The race runs three laps, and your position from 1st to 9th
  updates as you pass rivals or get passed. Finish first to win.


  The circuit is a fixed sequence of sections: a start straight, S-curves, a
  hill climb, a sweeping right turn, a descent, a chicane, hairpins, a valley
  dip, high-speed esses and a final straight. Curves push the car toward the
  outside, so you counter-steer, and the push grows with speed.


  A boost bar charges over time and drains while you burn it for extra speed.
  Golden boost pads on the road refill it. Running off the tarmac slows the car
  sharply, and hitting an AI car from behind costs you speed while bumping it
  forward.


  The HUD shows position, lap count, race timer, best lap and speed, which can
  switch between KMH and MPH. A results screen lists your finishing place, total
  time and each lap split. The music and engine sound are generated in the
  browser, and touch buttons appear on phones. The creator credits AI assistance
  for the code and sounds.
