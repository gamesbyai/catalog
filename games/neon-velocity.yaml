slug: neon-velocity
title: NEON VELOCITY
tagline: Race eight AI cars over three laps of a synthwave highway.
description: >-
  Eight AI rivals share the road with you over three laps of a twisting track.
  You start at the back of the grid, in ninth place, and you only win by
  crossing the finish line first. Passing a rival moves you up the order, and
  being passed moves you down, between 1st and 9th.


  A hand-built route of start straight, gentle S-curves, a hill climb, a long
  sweeping right and a descent. Tight chicane, plateau straight, hairpins,
  valley dip, fast esses and the final straight. Boost that builds up on its own
  over time, refilled for free by golden pads spread evenly around the track.
  Harsh slowdown off the tarmac. Rear-end hits, costing you speed and giving the
  rival a small forward shove. Final place, total time, every lap split.


  Use Up or W to accelerate, and Down or S to brake. Steer with Left and Right,
  or A and D. Press Space or Shift to burn boost, which drains while active.
  Counter-steer against the outward push in curves, which grows with speed.
  Press Enter to start the race, or to restart after a finish. On a phone, use
  the on-screen touch buttons.


  INTJT2 packed the whole game into one self-contained HTML file. The synthwave
  soundtrack and engine sound are generated in the browser. According to the
  creator, AI helped with the code and the sounds.
