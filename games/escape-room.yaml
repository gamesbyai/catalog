slug: escape-room
title: Escape Room
tagline: Solve puzzles to escape rooms that an AI generates on the fly.
description: >-
  Escape Room locks you in a room that an AI generated on the fly and asks you
  to work out how to get out. Because the rooms are generated dynamically, the
  layout and the puzzles can differ from one attempt to the next.


  The creator says they simply like escape rooms, and the project is an attempt
  to recreate the real thing virtually. According to the creator, it was built
  with Claude Code and rendered with Three.js, and it ranked 574th of the 945
  entries at Vibe Jam 2026.


  The design is puzzle-first, built around a 3D space you can look around and
  examine. Since the rooms can differ, each attempt starts with a fresh look at
  your surroundings and a new way out to find.
