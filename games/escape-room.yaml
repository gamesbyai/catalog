slug: escape-room
title: Escape Room
tagline: Solve puzzles to escape rooms that an AI generates on the fly.
description: >-
  Escape Room is a browser puzzle game in which the player is placed inside a
  room and has to work out how to get out. The rooms are generated dynamically
  by AI, so the layout and the puzzles to solve can differ from one attempt to
  the next.


  The game centers on recreating the escape room experience virtually. The
  creator says they simply like escape rooms, and the project reflects that with
  a puzzle-first design built around a 3D space you can look around and examine.
  It was entered in Vibe Jam 2026 and is playable on mobile as well as desktop.


  According to the creator, the game was built with Claude Code and rendered
  with Three.js. It is single-player, with no multiplayer mode.
