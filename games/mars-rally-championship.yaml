slug: mars-rally-championship
title: Mars Rally Championship
tagline: Race rally cars across the Martian surface in a championship.
description: >-
  Mars Rally Championship is a racing game set on the surface of Mars. The
  player drives a rally vehicle through a championship, aiming to finish ahead
  of the competition. It runs in the browser and is playable on mobile devices
  as well as desktop.


  The setting is the main hook: a rally circuit on the red planet, inspired by
  the idea of crewed missions to Mars becoming real in the near future. The game
  is a single-player experience with no multiplayer mode, so each run is a solo
  effort to chase a better result.


  The creator built it with Claude Code, and it uses Three.js for its 3D
  graphics. It was submitted to Vibe Jam 2026, where it placed 229th out of 945
  entries.
