slug: pocket-sparrows
title: Pocket Sparrows
tagline: Toss food to sparrows, pet them, and dress them in tiny hats.
description: >-
  A cozy game about feeding and watching sparrows. Days pass in the game.


  Generated sparrows, each with its own name, stats and personality quirks.
  Happy birds that puff up. Different foods sold in an evening shop. Small hats
  to put on your favorite birds. New foods and areas unlocked across in-game
  days. No fail states. Automatic saving in your browser.


  Click or tap anywhere to throw food. Click or tap a sparrow itself to pet it.
  Newly met sparrows may flee at first, but they may come to trust you over
  time. Right-click any sparrow to open its profile.


  Yen Rye made it for a friend who feeds and names the local sparrows. According
  to the creator, AI was used for the code, images, music and sound effects.
