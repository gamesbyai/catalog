slug: pocket-sparrows
title: Pocket Sparrows
tagline: Toss food to sparrows, pet them, and dress them in tiny hats.
description: >-
  Click or tap anywhere to throw food to the sparrows. Click or tap a bird
  itself to pet it. Newly met sparrows may flee at first, but they can come to
  trust you over time.


  Each sparrow is generated with its own name, stats and personality quirks.
  Right-click one to open its profile. Happy birds puff up.


  Days pass in the game, and an evening shop sells different foods. Progressing
  through the days unlocks new foods and new areas. You can also put small hats
  on your favorite birds.


  There are no fail states, so play is about feeding and watching. Progress
  saves automatically in the browser. The creator made it for a friend who feeds
  and names the local sparrows. The creator used AI for code, images, music and
  sound effects.
