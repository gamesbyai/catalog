slug: maze-3d
title: Maze 3D
tagline: Find your way through an endless three-dimensional maze.
description: >-
  Maze 3D is a browser game where the player moves through a maze rendered in
  three dimensions. Each run is about finding the path through the corridors and
  reaching the way out, and the maze is described as endless, so there is always
  another layout to solve after the current one.


  The game keeps its focus on one idea: the simple pleasure of working out a
  maze. Walking through the corridors from a first-person view gives the puzzle
  a sense of space that a flat top-down layout does not, and the game is
  playable on mobile devices as well as desktop browsers.


  It was entered in Vibe Jam 2026, where it placed 653rd among 945 entries. The
  creator states that it was made with the Gemini app, and it is built on
  Three.js for the 3D rendering.
