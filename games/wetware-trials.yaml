slug: wetware-trials
title: Wetware Trials
tagline: Race through quick brain microgames testing reflexes, memory, patterns
  and logic.
description: >-
  In Wetware Trials, you play rapid-fire microgames, each one a quick cognitive
  test. Each one tests a single skill, such as reflexes, memory, pattern
  recognition, or logic, and is simple enough to grasp in about a second. From
  there, a run chains one tiny task after another, and it measures how sharp
  your brain is.


  The creator took inspiration from the short, instantly understandable brain
  teasers of Big Brain Academy on the Nintendo DS, and made the game with Codex
  on canvas, for phones as well as desktop.


  AI generated the microgames, and humans compete against each other on them, in
  multiplayer rounds that take cues from the fast, competitive pace of Tetris
  99.
