slug: wetware-trials
title: Wetware Trials
tagline: Race through quick brain microgames testing reflexes, memory, patterns
  and logic.
description: >-
  Play rapid-fire microgames, each a quick cognitive test you can grasp in about
  a second. A run chains them together and measures how sharp your brain is.


  Skill tests such as reflexes, memory, pattern recognition, or logic. A single
  skill in each microgame. Multiplayer rounds where humans compete on the
  microgames.


  mfontcada took inspiration from the short brain teasers of Big Brain Academy
  on the Nintendo DS, which you understand right away. AI generated the
  microgames. The multiplayer rounds take their quick, competitive pace from
  Tetris 99.
