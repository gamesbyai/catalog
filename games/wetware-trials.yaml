slug: wetware-trials
title: Wetware Trials
tagline: Race through quick brain microgames testing reflexes, memory, patterns
  and logic.
description: >-
  Wetware Trials is a cognitive arcade made of rapid-fire microgames. Each
  challenge tests a single skill, such as reflexes, memory, pattern recognition
  or logic, and is simple enough to grasp in about a second. Players jump
  straight in and clear one tiny task after another, measuring how sharp their
  brain is.


  The microgames were generated by AI, and the concept is that humans then
  compete against each other on them. Multiplayer rounds take cues from the
  fast, competitive pace of Tetris 99. The creator was inspired by the short,
  instantly understandable brain challenges of Big Brain Academy on the Nintendo
  DS.


  The game runs in the browser on canvas and works on mobile as well as desktop.
  The creator built it with Codex and entered it in Vibe Jam 2026.
