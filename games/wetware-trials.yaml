slug: wetware-trials
title: Wetware Trials
tagline: Race through quick brain microgames testing reflexes, memory, patterns
  and logic.
description: >-
  Wetware Trials is a cognitive arcade built from rapid-fire microgames. Each
  one tests a single skill, such as reflexes, memory, pattern recognition, or
  logic, and is simple enough to grasp in about a second. You jump straight in
  and clear one tiny task after another, measuring how sharp your brain is.


  The creator took inspiration from the short, instantly understandable brain
  teasers of Big Brain Academy on the Nintendo DS, and made the game with Codex
  on canvas, for phones as well as desktop. In the Vibe Jam 2026 standings it
  sits at 292nd of 945.


  The twist is who made the tests. AI generated the microgames, and humans
  compete against each other on them, in multiplayer rounds that take cues from
  the fast, competitive pace of Tetris 99.
