slug: waterslide-game-sonnet-5-5
title: waterslide game sonnet 5.5
tagline: Play a waterslide-themed game built in one shot by an AI model
description: >-
  You're one of 13 riders sitting on a water slide, and you steer left and right
  while everyone races down a banked, twisting track. There are kicker ramps
  along the way, a big spiral, and a splash pool at the bottom where the race
  ends.


  Only the first rider across the line wins, so you're racing twelve rivals for
  one spot.


  The ramps are where the jumping comes in, because you can tap jump any time
  for a small hop, but a press just before an orange ramp's lip gets held and
  fires right at the edge. Land it cleanly and you get big air plus a speed
  boost. The ramps on the main route launch you on their own, so those are safe,
  but the shortcut has a gap that you can only clear with the boosted jump.


  That shortcut is a real gamble, and the rivals make the same choice. They
  decide whether to take it based on how risky it is, how good they are at
  jumping, and where they're currently placed, so a failed jump really does drop
  them into the gap.


  Falling off the slide, or missing a landing, knocks you out of a race.
  Practice mode is the gentler version: there's no elimination, and you respawn
  at the last checkpoint instead.


  On screen you get your place out of 13, your speed, a running timer with a
  progress bar, and a small standings list in the corner. The riders are cartoon
  figures in different colors, hats and goggles, and you can pick your own look
  from the Character screen. Settings let you adjust rival difficulty, steering
  sensitivity, and a left-handed layout.


  It was made as a one-shot test of how Claude Sonnet 5.5 at extra-high effort
  handles a game, and the whole thing took a little over an hour. It also runs
  on touch screens, with a floating joystick and a jump button, and it works
  offline after your first visit.
