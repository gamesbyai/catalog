slug: waterslide-game-sonnet-5-5
title: waterslide game sonnet 5.5
tagline: Play a waterslide-themed game built in one shot by an AI model
description: >-
  You sit on a banked, twisting water slide with 12 rivals, starting the race in
  eighth place of 13. A countdown runs under a START banner, then you steer left
  and right to hold a line down the slide. The goal is to reach the splash-pool
  finish first.


  Jumping matters. Orange ramps launch you automatically, but pressing jump in
  the window before a ramp lip arms the hop for big air and a speed boost on a
  clean landing. A shortcut gap needs that boosted jump, while the main route
  has two kicker ramps and a large spiral.


  Leaving the slide or missing a landing knocks you out in Race mode. Practice
  mode removes elimination and respawns you at the last checkpoint. The HUD
  shows your place, speed, a race timer, a progress bar and a short standings
  list.


  On touch screens you drag a floating joystick to steer and tap a JUMP button.
  The menu offers a Character screen for palettes and accessories, plus settings
  for quality, rival difficulty and handedness. Best race and practice times are
  saved locally.
