slug: waterslide-game-sonnet-5-5
title: waterslide game sonnet 5.5
tagline: Play a waterslide-themed game built in one shot by an AI model
description: >-
  You're one of 13 riders on a water slide, starting in eighth place. After the
  countdown, steer left and right to hold your line down to the splash pool,
  where the first rider into the pool wins.


  Two kicker ramps and a large spiral on the main route. A gap shortcut that
  needs the boosted jump, with failed jumps dropping into the gap. Rivals who
  gamble on the shortcut too. Race mode, where a slip-off or missed landing
  eliminates you. Practice mode, with no elimination and respawns at the last
  checkpoint. Palettes and accessories for your rider, plus adjustable rival
  difficulty. Best race and practice times kept on your device.


  Ramps launch you on their own. Press jump in the short window before a lip to
  arm a hop for big air and a speed boost on a clean landing. On a touch screen,
  drag the floating joystick to steer and tap the JUMP button. Set handedness to
  move the touch controls to the other side.


  Kurt Lietzau made it as a test of how AI models handle building a game in one
  shot. The art and sound are generated in code, not loaded from files, and this
  version took a little over an hour of processing.
