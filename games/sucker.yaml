slug: sucker
title: Sucker
tagline: Race a vacuum cleaner from a first-person view, cleaning faster and
  more efficiently.
description: >-
  Sucker lets you drive a vacuum cleaner in this first-person racing game. Your
  aim is to clean up faster and more efficiently. You move quickly through the
  space and don't wander around.


  Picking a good route through the space. A household chore played as a timed
  race. Time lost on every wasted pass across the floor.


  tekr0x got the idea while watching a robot cleaner in their own room,
  wondering how it could be quicker and more efficient. It is their first
  vibe-coded game, made after they saw games shared by Levelsio on X.
