slug: sucker
title: Sucker
tagline: Race a vacuum cleaner from a first-person view, cleaning faster and
  more efficiently.
description: >-
  Sucker is a first-person racing game where you drive a vacuum cleaner. The
  goal is to clean up faster and more efficiently, so each run comes down to
  choosing a good route and moving quickly through the space instead of
  wandering around.


  The idea started with the creator watching a robot cleaner in their own room
  and wondering how it could be quicker and more efficient. That everyday scene
  gives the game a simple hook, mixing the feel of a household chore with the
  pressure of a timed race.


  It was the creator's first vibe-coded game, made after seeing games shared by
  Levelsio on X. It runs in the browser on Three.js, and the creator built it
  with Claude Code for Vibe Jam 2026. It is single-player and works on mobile.
