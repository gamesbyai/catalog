slug: kicker
title: KICKER
tagline: Play a match of table football against another player using mouse and keyboard.
description: >-
  You control one side of a 3D foosball table, seen from above, with red and
  blue figures mounted on rods. Hold A, S, D or F to pick a rod, then move the
  mouse to work that rod. A mouse icon on the table shows arrows pointing up and
  down.


  A match is first to 5 goals, with the score shown at the top of the screen. A
  prompt on the table tells you to play the ball. Pressing Space shakes the
  table.


  A button at the bottom of the screen reads "I am ready for multiplayer", and
  the game is played online. A small lock icon sits near the sound and settings
  buttons in the top right corner.


  The creator says the idea came from a co-worker who plays in a German kicker
  league and is too good to beat in person, so this is a chance to try
  virtually.
