slug: kicker
title: KICKER
tagline: Play a match of table football against another player using mouse and keyboard.
description: >-
  KICKER is a virtual foosball table played in the browser. You control the rods
  with the mouse and keyboard, sliding and rotating your rows of players to
  block, pass, and shoot the ball past the opposing side. It is a multiplayer
  game, so the opponent can be another person.


  The game started from a personal challenge: the creator has a co-worker who
  plays in an official German kicker league and is very hard to beat on a real
  table. The game is a way to try for a win in a virtual match instead. It is a
  sports simulation with an action feel, built around quick reactions and
  precise rod control.


  The creator built it with Claude Code, using Three.js for the 3D table. It was
  entered in Vibe Jam 2026, where it ranked 54th out of 945 entries.
