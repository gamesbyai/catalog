slug: kicker
title: KICKER
tagline: Play a match of table football against another player using mouse and keyboard.
description: >-
  You're playing red at a foosball table, and you pick which rod to grab by
  holding a key, then move the mouse to slide and turn it. The camera looks down
  on the table in 3D, so every little player on every rod is in view.


  There's also a space bar shortcut that shakes the whole table, which is a
  funny thing to be allowed to do to a foosball table.


  The first side to score 5 goals wins, and the score sits at the top of the
  screen while a faded prompt tells you to play the ball. Four keys, A, S, D and
  F, each match one of the rods you control, and they're marked on the table's
  front edge so you don't have to guess which is which.


  There's a button at the bottom that says you're ready for multiplayer, so you
  can take the table against another person online.


  The idea came from the creator's co-worker, who is a seriously good kicker
  player with an entry in a German league. The creator can't beat him in real
  life, so the game is an attempt to get a shot at him virtually, which is a
  fair reason to build a whole foosball table.
