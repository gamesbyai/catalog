slug: floppy-brawler
title: Floppy Brawler
tagline: Fight ragdoll-style opponents in a wobbly, physics-driven brawler.
description: >-
  Land hits and stay upright: that is the whole scramble in Floppy Brawler, an
  online physics brawler with loose-limbed, ragdoll-style fighters. In every
  match, your own fighter flails and wobbles under the physics simulation, just
  like theirs. Fights happen in the browser, on a desktop or a phone.


  The floppy movement makes every exchange unpredictable, so fights come out
  messy and funny rather than precisely choreographed. The style draws on
  existing physics-based brawlers the creator enjoys playing, and Three.js
  renders the fights.


  The creator is a web developer who uses AI daily at work. Their Vibe Jam 2026
  entry, made with Claude Code, finished 13th of 945. The very first output from
  Claude on day one inspired the project, though they now think that early
  version looks terrible.
