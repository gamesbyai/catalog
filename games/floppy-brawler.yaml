slug: floppy-brawler
title: Floppy Brawler
tagline: Fight ragdoll-style opponents in a wobbly, physics-driven brawler.
description: >-
  You control a fighter in Floppy Brawler, a physics-based brawler where every
  match pits you against other players. Land hits and keep your fighter upright.


  Loose-limbed, ragdoll-style fighters. Wobbly physics for every fighter in a
  match, yours included. Unpredictable exchanges, thanks to the floppy movement.
  Messy, funny fights from those exchanges, rather than precisely choreographed
  ones.


  The style draws on existing physics-based brawlers the creator enjoys playing.


  MrCollison is a web developer who uses AI daily at work. The very first output
  from Claude on day one inspired the project, though they now think that early
  version looks terrible.
