slug: videovideogame
title: VideoVideoGame
tagline: Choose your path through 100+ video scenes and short minigames as Levelsio.
description: >-
  Story mode plays as a choose-your-own-adventure told through short video
  scenes. Each scene stops on a prompt with text buttons, such as "Pet the dog"
  or "Storm is coming", and the option you pick decides which clip plays next.
  Levelsio is the main character.


  The opening scenes are set on a boat on a lake, with a dog aboard and hills
  along the shore. The story runs through more than 100 videos and scenes, so
  different choices lead to different clips. A separate minigames mode holds a
  few games, including racing and puzzle types.


  The menu also has a How to Play screen and a leaderboard. The video plays in a
  frame beside the menu, with a fullscreen button on the frame and a sound
  toggle in the top corner. The clips were generated with Seedance.
