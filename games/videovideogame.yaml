slug: videovideogame
title: VideoVideoGame
tagline: Choose your path through 100+ video scenes and short minigames as Levelsio.
description: >-
  Each scene in story mode is a short video that ends on text choices, and the
  one you pick decides which clip plays next. Choices include petting a dog or a
  storm coming. The story is told through footage rather than text, and a large
  amount of it is generated video.


  The opening scene, a dog aboard a boat. Levelsio as the main character, with a
  dedication to @levelsio. Branching paths across more than 100 videos and
  scenes. Minigames mode with a few games, including racing and puzzle types. A
  leaderboard.


  javitoshi made the clips with Seedance. According to javitoshi, making them
  was the fun part.
