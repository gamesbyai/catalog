slug: videovideogame
title: VideoVideoGame
tagline: Choose your path through 100+ video scenes and short minigames as Levelsio.
description: >-
  VideoVideoGame is a choose-your-own-adventure told in video, with Levelsio as
  the main character. You follow Levelsio through more than 100 video scenes,
  pick a direction at each branch, and watch the story continue from your
  choice.


  The scenes were generated with Seedance, and the creator built the game around
  them with Claude Code. Images came from experiments with the new GPT image
  model and Nano Banana 2, and the creator says the fun was in making videos
  with Seedance and trying out these tools. Its Vibe Jam 2026 result was 60th of
  945.


  A few minigames sit between the story scenes and add puzzle and racing
  moments, so the whole single-player game plays like a branching film with
  detours, on phones as well as desktop.
