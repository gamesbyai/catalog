slug: videovideogame
title: VideoVideoGame
tagline: Choose your path through 100+ video scenes and short minigames as Levelsio.
description: >-
  VideoVideoGame is a choose-your-own-adventure told through video. The player
  follows Levelsio, the main character, through more than 100 video scenes,
  picking a direction at each branch and watching the story continue based on
  those choices.


  Between the story scenes sit a few minigames that mix puzzle and racing
  moments into the adventure. The scenes were generated with Seedance, so the
  whole game plays like a branching film. It runs on mobile as well as desktop
  and is single-player.


  The creator built it with Claude Code and used Seedance for the video clips.
  Images were made while experimenting with the new GPT image model and Nano
  Banana 2. The creator says the fun came from making videos with Seedance and
  trying out these tools. It placed 60th out of 945 entries in Vibe Jam 2026.
