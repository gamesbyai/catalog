slug: sato-denki-akihabara-tech-shop
title: Sato Denki — Akihabara Tech Shop
tagline: Chain fast combo shifts to keep your hospitalized dad's Akihabara tech
  shop afloat.
description: >-
  Sato Denki is a shop simulation set in Akihabara. Your father is in the
  hospital, and the family's 40-year-old electronics store is in danger of being
  taken by the bank. You run the counter through quick rounds, working through
  rapid, Street Fighter-style combo shifts to bring in enough money before the
  bank wins.


  The design borrows from casino machines: short rounds, loud combo feedback,
  and global stakes meant to pull you into one more run. The game supports
  multiplayer and runs on mobile. Every sprite in the game was produced with the
  creator's own AI pixel art tool, which gives the shop a consistent look.


  The creator says Claude Code wrote 99% of the code and describes the project
  as 100% vibe coded. It was built as a jam entry to test the creator's pixel
  art generator alongside the coding workflow from start to finish.
