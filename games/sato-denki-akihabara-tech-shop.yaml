slug: sato-denki-akihabara-tech-shop
title: Sato Denki — Akihabara Tech Shop
tagline: Chain fast combo shifts to keep your hospitalized dad's Akihabara tech
  shop afloat.
description: >-
  You click an item from your inventory to hand each customer whatever they're
  asking for, and the whole round runs on a 30-second loop. The pace comes from
  rapid-fire combo shifts borrowed from Street Fighter, which is a funny thing
  to build a shop counter around.


  You're running Sato Denki, an Akihabara electronics shop your dad has kept
  going for 40 years. He's in Keio Hospital now, so the shop's yours, and you
  have to stock smart and serve fast or the bank wins. Hiroshi-san sits at
  ¥8800, and that's the number you're trying to out-sell.


  That's a pretty heavy reason to be selling gadgets, when you think about it.


  Before you open, you can type a name for your shop, and it stays Sato-kun if
  you leave it alone. Then you hit the big orange button to open the doors.


  The creator wanted the whole thing to feel like a casino machine, which
  explains the speed.


  So you get fast rounds, loud combos and global stakes meant to pull you back
  for one more run. Claude Code wrote about 99% of the code, and every sprite
  came from DogSprite, the creator's own pixel art tool, which started working
  the same day the jam was announced.
