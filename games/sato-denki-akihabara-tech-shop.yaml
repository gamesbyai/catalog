slug: sato-denki-akihabara-tech-shop
title: Sato Denki — Akihabara Tech Shop
tagline: Chain fast combo shifts to keep your hospitalized dad's Akihabara tech
  shop afloat.
description: >-
  Your dad is in Keio Hospital, and his 40-year-old electronics shop in
  Akihabara is yours to run before the bank takes it.


  30-second shifts of handing each customer what they ask for. Street
  Fighter-style combo chains. Short rounds with loud combo feedback, built like
  a casino machine. A name for the shop, typed in before you open.


  Click your inventory to serve each customer.


  SYSTEMCRASH92 made every sprite with DogSprite, their own AI pixel art tool,
  and built the game to test it and their coding workflow together. According to
  them, Claude Code wrote 99% of the code.
