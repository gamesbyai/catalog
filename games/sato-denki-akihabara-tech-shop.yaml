slug: sato-denki-akihabara-tech-shop
title: Sato Denki — Akihabara Tech Shop
tagline: Chain fast combo shifts to keep your hospitalized dad's Akihabara tech
  shop afloat.
description: >-
  This shop simulation has you chaining rapid combo shifts in the style of
  Street Fighter while you run the counter in quick rounds. A shift is a
  30-second loop where you click your inventory to hand each customer whatever
  they're asking for.


  Your dad's in Keio Hospital, which leaves you in charge of a family
  electronics store in Akihabara that's been open for 40 years. The bank wants
  it, so each round is about bringing in enough money before the bank wins. You
  even get to type in a name for the shop before you open the doors.


  SYSTEMCRASH92 designed it to work like a casino machine, with short rounds,
  loud combo feedback and global stakes meant to pull you back for one more run.


  Every sprite was made with DogSprite, an AI pixel art tool they were building
  on their own. Having one generator make all of it helps keep the shop's look
  consistent.


  SYSTEMCRASH92 made the game to test that pixel art generator and their coding
  workflow together, from start to finish. According to them, Claude Code wrote
  99% of the code. They call the project 100% vibe coded.
