slug: battle-of-the-elements
title: Battle of the Elements
tagline: Bend earth, air, water or fire in live online battles for the Spirit Oasis.
description: "You play a bender who fights other players live online for control of the Spirit Oasis.


  Earth, Air, Water and Fire nations, each with four abilities. Elemental reactions, such as Earth and Fire combining into lava. Hijacking of enemy base zones into hazards that spare your teammates. Avatar form that releases pulses in all directions. Offline practice against bots.


  Move with WASD and aim with the mouse. Hold the attack button for auto-aim. Use Q or right-click for zones, Space for rides, E or R for ultimates, and F for Avatar. Press H to open the bending codex.


  Development ran in multiple stages, with the creator orchestrating AI tools. Textures and sounds came from separate generation tools. \"The toughest part was achieving parity between local and offline play,\" the creator writes."
