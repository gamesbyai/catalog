slug: rift-wars
title: Rift Wars
tagline: Build a deck and battle other players in tactical ranked card matches.
description: >-
  Rift Wars is a free-to-play tactical card game with real-time ranked
  multiplayer. You build a deck from a pool of 4,276 unique cards, then climb a
  ranked ladder in head-to-head matches. Bots are there too, so a match can be
  played solo.


  Beyond the card pool, the game has 16 clans and a bot opponent with six
  difficulty tiers. The server is authoritative, which means it decides match
  outcomes rather than your device. Playing requires a login.


  The creator says one developer built it in under 15 days with AI as a
  development partner. It was still in beta when it went into Vibe Jam 2026,
  where it ranked 77th of 945, and the creator was looking for feedback from
  people working in AI games.
