slug: rift-wars
title: Rift Wars
tagline: Build a deck and battle other players in tactical ranked card matches.
description: >-
  Rift Wars is a free-to-play tactical card game with real-time ranked
  multiplayer. Players build decks from a pool of 4,276 unique cards and face
  opponents in head-to-head matches, climbing a ranked ladder. Bot opponents are
  available too, so a match can be played without another person.


  The scale of the project is what stands out: a collection of thousands of
  distinct cards, 16 clans, and a bot opponent that comes in six difficulty
  tiers. The server is authoritative, meaning the server decides match outcomes
  rather than the player's device. The game requires a login, and it runs in a
  browser on mobile as well.


  The creator says a single developer built it in under 15 days, using AI as a
  development partner. It was in beta at the time of the jam listing, and the
  creator was looking for feedback from people working in AI games. No specific
  tools or models are named.
