slug: 0-tanks
title: 0 Tanks
tagline: Fight through procedural floors in a tank, buying upgrades and beating
  armored bosses.
description: >-
  Each run, you steer your armored tank through procedurally generated floors,
  one at a time, shooting whatever gets in the way. This roguelite gets deeper
  with each floor, and starting over gives you a new layout.


  Progression from upgrades bought on the way down, shaping the tank. A
  different build each run. Armored bosses guarding the way forward, testing
  your build. Two currencies, credits and alloy. Records for deepest floor, high
  score and enemy kills.


  Drive with WASD and aim with the mouse. Click to fire. Press Shift to boost,
  Enter to start a run.


  The tank shooting pays a nod to Battle City, an old arcade classic.
