slug: 0-tanks
title: 0 Tanks
tagline: Fight through procedural floors in a tank, buying upgrades and beating
  armored bosses.
description: >-
  Each run sends your armored tank down through procedurally generated floors,
  one at a time, shooting whatever gets in the way. It's a roguelite that pushes
  deeper with every floor, and when you start over, the layout's new. The main
  menu even keeps a little operator dossier on you, tracking your deepest floor,
  your high score and how many enemies you've taken out.


  It's a top-down tank shooter that tips its helmet to Battle City, the old
  arcade classic, except here the floors are drawn in 3D.


  You drive with WASD and aim with the mouse while clicking to fire. Shift gives
  you a boost, and pressing Enter on the menu sends you out.


  Upgrades carry the progression. You buy them on the way down, and the ones you
  pick shape the tank, so each run builds toward a different setup. Two
  currencies, credits and alloy, sit in the corner of the screen, and the Armory
  gets its own tab next to Intel and Settings.


  Armored bosses guard the way forward, and they're where whatever build you've
  scraped together by then gets tested.
