slug: 0-tanks
title: 0 Tanks
tagline: Fight through procedural floors in a tank, buying upgrades and beating
  armored bosses.
description: >-
  0 Tanks is a roguelite tank shooter played one floor at a time. You drive an
  armored tank through procedurally generated floors and fight your way down,
  shooting the enemies in your path as you go. Each run pushes deeper, and when
  you start over the layout is new.


  The top-down tank combat nods to Battle City, the classic arcade tank game,
  with the floors drawn in 3D. The creator used Claude Code, and the Vibe Jam
  2026 entry came 312th of 945.


  Upgrades carry the progression. You buy them on the way down, and the ones you
  choose shape the tank, so each run builds toward a different setup. Armored
  bosses guard the way forward and test whatever build you have put together by
  then.
