slug: 0-tanks
title: 0 Tanks
tagline: Fight through procedural floors in a tank, buying upgrades and beating
  armored bosses.
description: >-
  Every run is about getting deeper than the last one, as you drive a tank
  through procedurally generated floors. You pick up upgrades along the way, so
  the tank you're driving later isn't quite the one you rolled out in. There are
  armored bosses in the mix too, which gives each push a bigger obstacle than
  the regular enemies.


  Press Enter on the start screen and you deploy into the opening mission,
  Gauntlet-01.


  You steer with WASD and aim with the mouse, then click to fire. Shift is your
  boost.


  Up top you'll find Play, Armory, Intel and Settings tabs, so there's more to
  the game than the mission itself. A bar in the corner tracks your score,
  credits and alloy. It's a roguelite shooter, and the creator named Battle City
  as the inspiration.


  The look is a dark military command screen with amber lettering, which suits
  the whole tactical-briefing idea.


  An operator dossier on the main screen records your deepest floor, your high
  score and your eliminations. That gives you three records to beat each time
  you deploy.
