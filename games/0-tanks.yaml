slug: 0-tanks
title: 0 Tanks
tagline: Fight through procedural floors in a tank, buying upgrades and beating
  armored bosses.
description: >-
  0 Tanks is a roguelite tank shooter. You drive an armored tank through a
  series of procedurally generated floors, shooting enemies as you go. Each run
  pushes you deeper, and the layout changes every time you start over.


  Upgrades are the core of progression, so each run builds toward a different
  setup as you go down. Armored bosses guard the way forward and test whatever
  build you have put together. The top-down tank combat has a nod to Battle
  City, the classic arcade tank game, and it runs in the browser on 3D graphics
  with mobile support.


  The creator built it with Claude Code as an entry in the Vibe Jam 2026 game
  jam, where it placed 312th out of 945 entries.
