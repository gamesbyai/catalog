slug: pulsari-demo
title: PULSARI Demo
tagline: Strike beat rings in four directions to bring hidden music out of the dark.
description: >-
  You're trying to keep a combo alive while beat rings rush at a rotating center
  from four directions. You hit up, down, left or right as each one arrives, and
  the song only builds if you stay clean.


  The music is hidden at first, so there's just a pulse. A bass line comes in at
  combo four, an arpeggio joins at sixteen, and by thirty-two the whole track
  opens up. That's a neat way to make your accuracy the thing you hear, because
  a miss strips it back.


  Four difficulty modes set how tight the timing is, from a window of 70 ms on
  Easy to 20 ms on Ultra. Audio and visual offsets can be calibrated separately,
  so the windows can match your setup.


  This demo build keeps most of the game behind a lock, which is a bit of a
  tease.


  Three tracks are playable, and the tracklist shows the rest locked behind the
  full game. The playable ones sit in the first set, Void, where each track
  unlocks after you clear the one before it. The full game is described as
  having dozens of tracks across five sets, running from an 80 BPM tutorial to a
  250 BPM finale.


  Clearing sets, flawless runs, daily streaks and combo milestones unlock
  cosmetics. There are 30 variants across sigil, aura, trail, hit effects and
  horizon. Progress saves locally, and the game is available in English,
  Japanese and Simplified Chinese.


  It flashes, pulses with the beat and uses high-contrast converging shapes, so
  the start screen points you to photosensitivity options in the settings.
