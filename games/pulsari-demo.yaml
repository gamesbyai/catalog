slug: pulsari-demo
title: PULSARI Demo
tagline: Strike beat rings in four directions to bring hidden music out of the dark.
description: >-
  Nothing plays until you earn it, so on every track you're building a combo
  long enough to pull the whole song out of the dark. Beat rings rush in from
  four directions.


  Three demo tracks, 40-plus in the full game. Five sets, from an 80 BPM
  tutorial through glitchy and ambient-drift sets to a 250 BPM hardcore finale.
  Bass, arpeggio, full-track layers at combo four, sixteen, thirty-two. Four
  difficulty modes, timing windows from ±70 ms on Easy to ±20 ms on Ultra.
  Infinite mode and longer marathon tracks in the full release. Thirty cosmetics
  for sigil, aura, trail, hit effects, horizon, unlocked by clearing sets,
  flawless runs, daily streaks, combo milestones.


  Strike up, down, left or right as each beat ring lands. Play with the arrow
  keys or WASD, a gamepad, or a dance pad. A miss breaks the combo and strips
  the music back down. Set audio and visual offsets separately to calibrate the
  game to your hardware. Perfect hits give a little rumble on gamepad. Your
  progress saves locally. Photosensitivity options are available. The interface
  comes in English, Japanese and Simplified Chinese.


  According to Critics Arcade, AI assisted with the game's sounds.
