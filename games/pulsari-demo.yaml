slug: pulsari-demo
title: PULSARI Demo
tagline: Strike beat rings in four directions to bring hidden music out of the dark.
description: >-
  Beat rings rush toward a rotating center from four directions, and you strike
  up, down, left or right as each one arrives. The song stays silent until you
  earn it: a bass line enters at combo four, an arpeggio at sixteen, and the
  full track opens at combo thirty-two. A miss breaks the combo and strips the
  music back.


  This demo version makes three tracks playable. The full game has 40 or more
  tracks across five sets, running from an 80 BPM tutorial through glitch-styled
  and ambient-drift sets to a hardcore finale at 250 BPM. The demo's title
  screen also lists an infinite mode and longer marathon tracks in the full
  release.


  Four difficulty modes tighten the timing window from plus or minus 70 ms on
  Easy to 20 ms on Ultra. Separate audio and visual offset settings let you
  calibrate to your hardware. Keyboard, gamepad and dance pads work, and
  gamepads rumble on perfect hits.


  Clearing sets, flawless runs, daily streaks and combo milestones unlock
  cosmetic variants for sigil, aura, trail, hit effects and horizon. Progress
  saves locally. The interface is available in English, Japanese and Simplified
  Chinese. The game uses flashing lights and beat-synced color pulses, with
  photosensitivity options in settings.
