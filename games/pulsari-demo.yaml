slug: pulsari-demo
title: PULSARI Demo
tagline: Strike beat rings in four directions to bring hidden music out of the dark.
description: >-
  Nothing plays until you earn it, so on every track you're building a combo
  long enough to pull the whole song out of the dark.


  Beat rings rush in from four directions toward a rotating core in the middle,
  and you strike up, down, left or right as each one lands. Keep the streak
  going and a bass line joins at combo four, then an arpeggio at sixteen, then
  the full track at thirty-two. A miss snaps the combo and strips the music back
  down, which turns every slip into something you hear instead of a number on
  screen.


  This demo lets you play three tracks, while the rest of the tracklist sits
  behind locks marked for the full game. That version stretches to 40-plus
  tracks over five sets, from an 80 BPM tutorial through glitchy and
  ambient-drift sets to a 250 BPM hardcore finale. The demo's title screen also
  lists an infinite mode and longer marathon tracks for the full release.


  Four difficulty modes squeeze the timing window from plus or minus 70 ms on
  Easy all the way down to 20 ms on Ultra.


  There are also separate audio and visual offset settings for calibrating the
  game to your own hardware. You can play on the arrow keys or WASD, a gamepad,
  or even a dance pad. Gamepads give a little rumble on perfect hits.


  There's a surprisingly deep wardrobe here, with 30 cosmetic variants across
  your sigil, aura, trail, hit effects and horizon. You unlock them by clearing
  sets, landing flawless runs, keeping daily streaks and hitting combo
  milestones.


  Expect flashing lights and color pulses timed to the beat, though
  photosensitivity options are tucked into the settings menu. The interface
  comes in English, Japanese and Simplified Chinese. Your progress saves
  locally.


  According to Critics Arcade, AI assisted with the game's sounds.
