slug: pulsari-demo
title: PULSARI Demo
tagline: Strike beat rings in four directions to bring hidden music out of the dark.
description: >-
  PULSARI is a rhythm arcade game built around a rotating nexus. Beat rings
  converge on it from four directions, and you strike up, down, left or right as
  each one arrives. Clean hits build a combo, while misses break it. Tracks are
  short enough to restart instantly.


  The music is layered into your performance. A bass line appears at combo four,
  an arpeggio joins at sixteen, and the full song opens at thirty-two. There are
  41 tracks across five sets, running from an 80 BPM tutorial to a 250 BPM
  finale. Four difficulty modes tighten timing windows from 70 ms to 20 ms, and
  audio and visual offsets can be calibrated separately.


  Thirty cosmetic variants across sigil, aura, trail, hit effects and horizon
  unlock through cleared sets, flawless runs, daily streaks and combo
  milestones. It supports keyboard, gamepads and dance pads, offers three
  languages, and saves progress locally. The creator's AI disclosure lists AI
  assistance and sounds. The game uses flashing lights and beat-synced color
  pulses.
