slug: pulsari-demo
title: PULSARI Demo
tagline: Strike beat rings in four directions to bring hidden music out of the dark.
description: >-
  Nothing plays until you earn it, so on every track you're building a combo
  long enough to pull the whole song out of the dark.


  You strike up, down, left or right as each beat ring lands. Keep the streak
  going and a bass line joins at combo four, then an arpeggio at sixteen, then
  the full track at thirty-two. A miss breaks the combo and strips the music
  back down.


  This demo lets you play three tracks, and the rest of the tracklist is
  reserved for the full game. That version stretches to 40-plus tracks over five
  sets, from an 80 BPM tutorial through glitchy and ambient-drift sets to a 250
  BPM hardcore finale. The full release also adds an infinite mode and longer
  marathon tracks.


  Four difficulty modes squeeze the timing window from plus or minus 70 ms on
  Easy all the way down to 20 ms on Ultra.


  You can also set audio and visual offsets separately to calibrate the game to
  your own hardware. You can play on the arrow keys or WASD, a gamepad, or even
  a dance pad. Gamepads give a little rumble on perfect hits.


  There are 30 cosmetic variants across your sigil, aura, trail, hit effects and
  horizon. You unlock them by clearing sets, landing flawless runs, keeping
  daily streaks and hitting combo milestones.


  Photosensitivity options are available. The interface comes in English,
  Japanese and Simplified Chinese. Your progress saves locally.


  According to Critics Arcade, AI assisted with the game's sounds.
