slug: local-news-hero
title: Local News Hero
tagline: Drive a news van through your own city and race rivals to breaking stories.
description: >-
  Each round is a two-minute live broadcast, and whoever has the most points
  when the clock runs out wins. You drive a news van around a city, racing rival
  stations to each breaking story as it pops up.


  A city picked by sharing your location or by typing in a name. Photorealistic
  3D streets built from Google's 3D Tiles. Big cities as the best setting, with
  rural areas possibly sparse. Green pickups that refill your NOS boost. White
  pickups as health packs.


  Steer through the streets to reach a story. When you're close enough, press
  spacebar to go live. Press Shift for a NOS boost.


  supleezy says the idea came from wanting to play something like Simpsons Hit
  and Run in their own city. Kevin MacLeod made the music.
