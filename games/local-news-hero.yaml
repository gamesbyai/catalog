slug: local-news-hero
title: Local News Hero
tagline: Drive a news van through your own city and race rivals to breaking stories.
description: >-
  You've got two minutes to score more points than anyone else, and you do it by
  driving a news van through a 3D version of your own city. Glowing markers on
  the map mark the stories, so you head straight for them.


  When you're close enough to one, hit the spacebar to go live.


  Before you start, you pick where you're playing, either by letting the game
  use your location or by typing in a city name. That puts you on streets you
  might actually know. The map comes from Google's 3D tiles, so big cities work
  best while rural areas can look sparse.


  Hold Shift when you need a burst of nitro to reach a story before the clock
  runs out.


  Green pickups refill that nitro, and white ones restore your health, so
  they're worth steering toward between stories.


  The creator wanted to play Simpsons Hit and Run in their own city, and this is
  how that idea turned out, with rival stations to out-scoop. The title screen
  has a scrolling news ticker along the bottom, which suits a game about
  broadcasting. Kevin MacLeod made the music, and it's licensed under CC BY.
