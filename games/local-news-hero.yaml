slug: local-news-hero
title: Local News Hero
tagline: Drive a news van through your own city and race rivals to breaking stories.
description: >-
  Local News Hero lets you pick a real city, then puts you behind the wheel of a
  news van in a 3D version of it. Breaking stories pop up as you drive, and you
  steer through the streets to beat rival stations to each one.


  The creator traces it to wanting to play something like Simpsons Hit and Run
  in their own city, and built it with Claude Code on Three.js. The look is
  photorealistic rather than a made-up map, so the streets may be ones you
  actually know, and the game supports multiplayer on desktop and phones.


  Each round lasts two minutes and is framed as a live broadcast, so the short
  timer keeps rounds fast and every story you chase is against the clock.
