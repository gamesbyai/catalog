slug: local-news-hero
title: Local News Hero
tagline: Drive a news van through your own city and race rivals to breaking stories.
description: >-
  Each round is a two-minute live broadcast, and whoever has the most points
  when the clock runs out wins. You drive a news van around a city, racing rival
  stations to each breaking story as it pops up.


  You get to pick the city yourself, by sharing your location or typing in a
  name.


  It's built in photorealistic 3D from Google's 3D Tiles, so you might end up on
  streets you actually know. The title screen warns you up front that it works
  best in big cities, since rural areas may look sparse.


  Stories show up as glowing markers on the map, and you steer through the
  city's streets to get to them. When you're close enough, you hit the spacebar
  to go live.


  Shift fires off a NOS boost that green pickups refill, while the white pickups
  are health packs.


  There's also a scrolling news ticker along the bottom of the menu that suits a
  game about chasing headlines.


  supleezy says the idea came from wanting to play something like Simpsons Hit
  and Run in their own city. A news van loose in your own neighborhood is a
  pretty direct answer to that wish. Kevin MacLeod made the music.
