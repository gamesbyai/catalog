slug: kolo
title: KOLO
tagline: Decode words written in the Glagolitic script, solo or against other players.
description: >-
  KOLO is a word game built around the Glagolitic script, the alphabet
  historically used for Old Slavic. Players work out hidden words by reading and
  matching the ancient characters, treating each round as a code to crack. It
  can be played alone or in multiplayer rounds with other people.


  The game draws on Old Slavic mythology and Slavic heritage, subjects the
  creator felt were largely absent from modern games. Learning the script
  happens through play, so progress comes from recognizing symbols and solving
  puzzles rather than reading lessons. It is designed to work on mobile as well.


  KOLO was entered in Vibe Jam 2026. The creator says it was built with Lovable,
  and describes the goal as making the study of history feel like winning a
  round of a social game.
