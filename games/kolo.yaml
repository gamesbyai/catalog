slug: kolo
title: KOLO
tagline: Decode words written in the Glagolitic script, solo or against other players.
description: >-
  KOLO turns Glagolitic, Old Slavic's historical alphabet, into a code to crack.
  Each round hides a word you solve by reading and matching characters. It is a
  puzzle, word and educational game.


  Solo and multiplayer rounds with other people. Old Slavic mythology and Slavic
  heritage as source material. Progress through recognizing symbols and solving
  puzzles.


  Learn the script by playing. Move on one hidden word at a time.


  flereadri felt Old Slavic mythology and Slavic heritage were largely absent
  from modern games. flereadri describes the goal as making learning history
  feel like winning a round of a social game.
