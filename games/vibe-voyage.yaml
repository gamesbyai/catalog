slug: vibe-voyage
title: Vibe Voyage
tagline: Haul cargo across the planet by ship and spend your earnings on better vessels.
description: >-
  Vibe Voyage is a shipping simulation set on a round planet. You take cargo
  from one port to another, get paid on delivery, and put that money toward
  better ships. The loop is simple: pick a route, sail it, collect the payout,
  and upgrade the fleet.


  It is the creator's personal take on the Roblox game Shipping Lanes, keeping
  that game's basic idea of trading distance and time for income and adding
  their own changes. Built with Claude Code on Three.js and aimed at desktop
  browsers, it was 596th of 945 entries in Vibe Jam 2026.


  The seas are shared, too. It is multiplayer, so other captains are out on the
  same planet, trading distance and time for income alongside you.
