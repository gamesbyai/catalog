slug: vibe-voyage
title: Vibe Voyage
tagline: Haul cargo across the planet by ship and spend your earnings on better vessels.
description: >-
  Vibe Voyage is a shipping simulation set on a round planet. You take cargo
  from one port to another, get paid on delivery, and put that money toward
  better ships. Each run is a loop of picking a route, sailing it, collecting
  the payout, and upgrading your fleet.


  The game is multiplayer, so other captains share the seas with you. Its
  premise is a personal take on the Roblox game Shipping Lanes, keeping that
  game's basic idea of trading distance and time for income while adding the
  creator's own changes.


  It was built with Three.js for the Vibe Jam 2026 and placed 596th out of 945
  entries. The creator built it with Claude Code. It is aimed at desktop
  browsers rather than mobile devices.
