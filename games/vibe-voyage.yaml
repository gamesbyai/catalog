  controls:
    - "W / Up arrow: increase throttle"
    - "S / Down arrow: decrease throttle (reverse)"
    - "A / Left arrow: turn left"
    - "D / Right arrow: turn right"
    - "Q: left thrusters"
    - "E: right thrusters"
    - "X: zero throttle"
