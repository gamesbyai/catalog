slug: vibe-voyage
title: Vibe Voyage
tagline: Haul cargo across the planet by ship and spend your earnings on better vessels.
description: >-
  Vibe Voyage has you captain a cargo ship, sailing loads from port to port
  around a planet to earn money.


  You start by sailing to Whitepier and docking there to pick up your first
  cargo. Arrows on the water point toward the harbor, so you don't have to hunt
  for it.


  Steering works off a throttle instead of a plain gas pedal, so you raise it to
  build speed and lower it past zero to back up. There's a separate key that
  snaps the throttle straight to zero. Left and right thrusters sit on their own
  keys too.


  Everything you earn goes toward buying better ships, which gives the hauling
  its purpose.


  The creator took the basic idea from a Roblox game called Shipping Lanes and
  wanted to put their own spin on it. A welcome card lists every control before
  you set off, which saves you from guessing which key does what.
play:
  url: https://vibe.voyage
  embeddable: true
