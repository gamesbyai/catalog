slug: vibe-voyage
title: Vibe Voyage
tagline: Haul cargo across the planet by ship and spend your earnings on better vessels.
description: >-
  Sail a cargo ship around an entire planet, hauling freight from port to port
  and getting paid for every load.


  Better ships bought with your earnings. A map that wraps around one round
  world. A first job waiting at Whitepier, with arrows on the water pointing the
  way. A throttle instead of a set speed.


  Raise the throttle with W or Up and lower it with S or Down, past zero to back
  up. Press X to cut it to zero. Turn with A and D or the arrows, and fire the
  side thrusters with Q and E.


  jallen_dev based it on Shipping Lanes, a Roblox game, with their own spin.
play:
  url: https://vibe.voyage
  embeddable: true
