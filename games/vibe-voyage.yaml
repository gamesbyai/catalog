slug: vibe-voyage
title: Vibe Voyage
tagline: Haul cargo across the planet by ship and spend your earnings on better vessels.
description: >-
  You pilot a cargo ship around a planet, hauling freight between ports to earn
  money. The first job starts at Whitepier: sail there and dock to load your
  first cargo, following the arrows drawn on the water to find the way.


  Money from deliveries goes toward buying better ships. The ship is driven with
  a throttle rather than direct speed. Raise it to move ahead, lower it past
  zero to reverse, and press X to cut it back to zero in one step.


  Turning uses A and D or the left and right arrow keys, while Q and E fire the
  left and right thrusters. A welcome card at the start lists these controls
  before you set sail. The creator based the idea on the Roblox game Shipping
  Lanes and added their own changes.
play:
  url: https://vibe.voyage
  embeddable: true
