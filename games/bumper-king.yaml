slug: bumper-king
title: Bumper King
tagline: Ram rival bumper cars, grab powerups, and fight to hold the crown.
description: >-
  You drive a bumper car around a tiled arena, ramming rival cars to knock them
  out and collecting glowing pickups to grow bigger and stronger. The goal is to
  climb the scoreboard, become King, and hold the crown.


  Four powerups appear in the arena. Speed gives a boost, Mega Bump makes your
  hits stronger, Shield protects you, and Magnet blasts nearby cars away.
  Hazards also sit in the arena and have to be dodged. The creator describes the
  loop as bumper cars mixed with the growth-and-domination pattern of Snake.io.


  You start from a title screen where you enter a username and press Enter
  Arena. The screen also shows your best score. In the arena, a ten-row
  scoreboard on the left ranks you against named rival cars, and a side panel
  lists the powerups and the four basics: drive, bump, grow, survive.
