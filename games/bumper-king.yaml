slug: bumper-king
title: Bumper King
tagline: Ram rival bumper cars, grab powerups, and fight to hold the crown.
description: >-
  You steer a little car around a tiled arena and ram rival cars to knock them
  out. Every colored orb you pick up makes you bigger and stronger, which is the
  growth loop the creator borrowed from Snake.io and blended with bumper cars.


  The goal is to become King and hold the crown. A scoreboard in the corner
  ranks the top ten, and once you're in that group your own name and score sit
  in the list, so you can see how far you are from first. The rivals wear name
  tags like Bot Zap Wagon, and the scoreboard is packed with bot names too.


  Four powerups are laid out in a side panel, so you don't have to guess what
  they do.


  Speed gives you a boost, Mega Bump makes your hits stronger, Shield protects
  you, and Magnet blasts cars away from you. The creator also describes hazards
  to dodge while you fight for the crown.


  A how-to-play panel stays on the left edge while you drive, which is
  considerate because you never have to memorize the rules.


  Before you start, you type a username, and the start screen shows your best
  score. The floor is a tiled stage lit in purple and blue, with small glowing
  orbs scattered across it. The menu also has a sound toggle and an info button.
