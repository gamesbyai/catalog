slug: bumper-king
title: Bumper King
tagline: Ram rival bumper cars, grab powerups, and fight to hold the crown.
description: >-
  Every pickup you collect makes your bumper car bigger and stronger. Steer
  around the arena and ram rival cars to knock them out. Four verbs cover play:
  drive, bump, grow and survive.


  Rival cars with names like Bot Turbo Toast and Bot Bonkzilla. Ramming aimed at
  a scoreboard ranking you against them. Reaching the top spot, the King title
  and keeping the crown. Four powerups found around the arena. Speed boosts,
  Mega Bump for stronger hits, Shields that protect you, and Magnets that blast
  nearby cars away, never pulling them in. Hazards on the arena floor to dodge.


  Drive with WASD or the arrow keys, or use the touch joystick. Type a username
  to begin, then head out onto the arena with the rival cars.


  xwerux describes the idea as bumper cars mixed with the grow-and-take-over
  pattern of Snake.io.
