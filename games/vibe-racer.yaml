slug: vibe-racer
title: Vibe Racer
tagline: Race neon tracks against adaptive AI rivals in a fast arcade driver.
description: >-
  Built around speed and competition, this fast arcade racer puts every race on
  a track it has just generated, then lines you up against AI rivals for a
  sprint to the finish.


  The Quick Race on the menu spells it out as a 4.5 km run against five AI
  rivals, pitched as instant action. Your job is to get in front of that pack
  and stay there until you cross the line. The rivals don't follow a fixed
  pattern either, because they adapt as you drive.


  Since every course is generated, the layout changes between runs. One race
  won't play quite like the last, a pretty sensible match for a mode built to
  drop you straight into the action.


  Before the start you can paint your chunky, almost toy-like car in one of six
  colors, and the menu pegs its top speed at 200 km/h.


  Glowing neon and sleek vehicles give the tracks a nightlife feel. The menu
  leans the same way, with a dark backdrop and hot red accents around a really
  big play button. There's also a leaderboard you can open from the main screen
  to see where you stand.


  You drive with WASD and brake with Space. If your run goes sideways, R resets
  the car, which is a kind fallback on a track nobody has seen before.
