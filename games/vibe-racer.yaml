slug: vibe-racer
title: Vibe Racer
tagline: Race neon tracks against adaptive AI rivals in a fast arcade driver.
description: >-
  This arcade racer runs every race on a track the game generates, so the layout
  changes between runs. You start lined up against AI rivals for a sprint to the
  finish. Your goal is to get in front of the pack and stay there until you
  cross the line.


  The Quick Race, 4.5 km long, against five AI rivals. Rivals with no fixed
  pattern, adapting as you drive. Six paint colors for your car, chosen before
  the start. A leaderboard.


  Drive with WASD and brake with Space. If your run goes sideways, press R to
  reset the car.
