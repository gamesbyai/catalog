slug: vibe-racer
title: Vibe Racer
tagline: Race neon tracks against adaptive AI rivals in a fast arcade driver.
description: >-
  Built around speed and competition, this fast arcade racer puts every race on
  a track it has just generated, then lines you up against AI rivals for a
  sprint to the finish.


  The Quick Race is a 4.5 km run against five AI rivals. Your job is to get in
  front of that pack and stay there until you cross the line. The rivals don't
  follow a fixed pattern either, because they adapt as you drive.


  Since every course is generated, the layout changes between runs.


  Before the start you can paint your car in one of six colors. There's also a
  leaderboard.


  You drive with WASD and brake with Space. If your run goes sideways, R resets
  the car.
