slug: vibe-racer
title: Vibe Racer
tagline: Race neon tracks against adaptive AI rivals in a fast arcade driver.
description: >-
  You pick a color for a blocky little car, then race it through a neon-lit
  course against five AI rivals.


  The mode on the menu is a Quick Race, a 4.5 km sprint, and the track is
  procedurally generated, so you aren't driving one hand-built circuit. The
  rivals are adaptive, so they aren't just following a fixed script around the
  course.


  Before you start, the garage screen lets you choose the car's paint from six
  colors: red, blue, green, orange, white and purple. It also shows the car's
  top speed of 200 km/h, which is a handy number to see up front.


  There's a leaderboard you can open from that same start menu, right under the
  race button.


  You drive with WASD and hit Space to brake. If things go wrong, R resets you,
  which is a considerate thing to have on a course nobody mapped out in advance.
