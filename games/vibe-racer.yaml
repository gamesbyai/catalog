slug: vibe-racer
title: Vibe Racer
tagline: Race neon tracks against adaptive AI rivals in a fast arcade driver.
description: >-
  Vibe Racer is an arcade racing game built around speed and competition. Each
  race puts you on a procedurally generated track, where you drive against AI
  rivals and try to cross the line ahead of them. The action is fast and the
  focus stays on staying in front of the pack.


  The visual style leans on glowing neon color and sleek vehicles, giving the
  tracks a nightlife feel. Rivals adapt as you drive, so the challenge shifts
  from race to race instead of following a fixed pattern. Generated courses mean
  the layouts vary between runs. It also runs on mobile devices.


  The game was an entry in Vibe Jam 2026. The creator built it with Antigravity,
  and it runs on Three.js.
