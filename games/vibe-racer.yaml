slug: vibe-racer
title: Vibe Racer
tagline: Race neon tracks against adaptive AI rivals in a fast arcade driver.
description: >-
  Vibe Racer is a fast arcade racing game built around speed and competition.
  Every race runs on a procedurally generated track, where you drive against AI
  rivals and try to cross the finish line ahead of them. The job is to get in
  front of the pack and stay there.


  Glowing neon color and sleek vehicles give the tracks a nightlife feel. It was
  put together in Antigravity on Three.js, it plays on a phone or a desktop
  computer, and it placed 494th of 945 in Vibe Jam 2026.


  The rivals adapt as you drive instead of following a fixed pattern, and
  because the courses are generated, the layout changes between runs. One race
  does not play quite like the last.
