slug: bean-of-the-hill
title: Bean of the Hill
tagline: Fight other players in a bean-themed shooter to hold the hill.
description: >-
  Bean of the Hill is a multiplayer first-person shooter built around
  king-of-the-hill rules. Players control bean characters and fight over a
  central zone, trying to stay in control of it while opponents shoot to push
  them out. Matches are played against other people online.


  The bean theme gives the shooter a silly identity while the objective stays
  familiar: hold the point, hit your targets, and contest the hill when someone
  else takes it. It was made for Vibe Jam 2026, where it placed 142nd among 945
  entries.


  According to the creator, it was built with Claude Code on Three.js, and it
  runs in the browser. They describe making a multiplayer FPS during a game jam
  as a challenge that would have been impossible without AI.
