slug: bean-of-the-hill
title: Bean of the Hill
tagline: Fight other players in a bean-themed shooter to hold the hill.
description: >-
  Beans fight over a central hill in this first-person shooter. You play one
  bean, and other players shoot to push you out of the zone while you try to
  stay in control of it.


  Targets to hit while you hold the point. Takeovers of the hill by other
  players. Matches against other people online.


  colin_k says building a multiplayer FPS would be impossible without AI, and
  calls it a great challenge.
