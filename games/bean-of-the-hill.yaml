slug: bean-of-the-hill
title: Bean of the Hill
tagline: Fight other players in a bean-themed shooter to hold the hill.
description: >-
  Bean of the Hill is king of the hill with beans. You play a bean character in
  a first-person shooter, fight other players online over a central zone and try
  to stay in control of it while they shoot to push you out of it.


  The creator, colin_k, says building a multiplayer FPS during a game jam was a
  challenge that would have been impossible without AI. It was made with Claude
  Code on Three.js for the browser and came 142nd of the 945 entries at Vibe Jam
  2026.


  The bean theme gives the shooter a silly identity, while the objective stays
  familiar: hold the point, hit your targets, and contest the hill when someone
  else takes it. Matches are played against other people online.
