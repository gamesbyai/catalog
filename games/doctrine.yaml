slug: doctrine
title: Doctrine
tagline: Summon conquered armies from spellcards and battle rival wizards in real time.
description: >-
  In Doctrine you play an interdimensional wizard at war with other wizards, and
  your army lives in your deck. Armies you have defeated, hired or bound are
  stored as spellcards, and when a war begins you summon them onto the
  battlefield in real time.


  The creator says the idea had been in their head for years, and that AI and
  Cursor let them turn it into a playable game in about two weeks. It is built
  on Three.js, and the premise explains the cards: a living Doctrine holds the
  armies of broken worlds.


  Cards stand in for units, spells and towers, so a match is a series of quick
  decisions about what to deploy and where. Once summoned, your forces clash on
  their own in autobattler-style chaos while you keep choosing what comes next.
