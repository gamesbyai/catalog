slug: doctrine
title: Doctrine
tagline: Summon conquered armies from spellcards and battle rival wizards in real time.
description: >-
  An interdimensional wizard goes to war with other wizards, armed with a deck
  of spellcards. Each card holds an army that was defeated, hired or bound.


  Cards for units, spells and towers. Real-time summoning onto the battlefield.
  Autobattler-style clashes once your forces are out. Quick choices about what
  to deploy and where.


  The creator had this idea for years. With AI, it became playable in about two
  weeks.
