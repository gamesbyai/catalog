slug: effective-immediately
title: Effective Immediately
tagline: Shoot your way out of a collapsing office nightmare as a burned-out worker.
description: >-
  You're a burned-out office worker with a stapler for a gun. Fight your way out
  of a workplace falling apart before the company can swallow you entirely. You
  start with 30 staples loaded and 100 health.


  Desks, furniture and other props that can be smashed. 2D animated characters
  in your way. The single objective of finding a way out.


  Lucas Teixeira set out to make a quick, violent and surreal shooter about
  losing your mind inside a controlling workplace. Office supplies as ammo fit
  that brief, and they pointed to older browser FPS games as the energy they
  were after.
