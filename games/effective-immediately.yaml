slug: effective-immediately
title: Effective Immediately
tagline: Shoot your way out of a collapsing office nightmare as a burned-out worker.
description: >-
  You're a burned-out office worker walking a plain teal corridor in first
  person, and the only thing in your hand is a stapler that's been turned into a
  gun.


  The objective on screen tells you to find a way out, because the workplace is
  collapsing into a corporate nightmare that's trying to consume you before you
  escape. Your health starts at 100 and the stapler gun is loaded with 30
  rounds, both shown in the corners of the screen. The hand holding it is inked
  in black and white, so it looks like it was cut out of a comic page.


  The characters you fight are 2D animated figures, while the office props
  around them are 3D and can be broken. That's an odd pairing, but it suits the
  comic-book horror look the creator was going for.


  Shooting your way out of an office with stationery is a pretty funny kind of
  revenge.


  The creator wanted something fast, violent and surreal about losing your mind
  inside a controlling workplace. They also wanted the feel of an old-school
  browser shooter, which explains the straight-ahead first-person setup and the
  ammo counter in the corner.
