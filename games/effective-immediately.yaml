slug: effective-immediately
title: Effective Immediately
tagline: Shoot your way out of a collapsing office nightmare as a burned-out worker.
description: >-
  You start in a narrow teal office corridor, seen in first person, holding a
  stapler gun with 30 staples loaded and 100 health. A panel in the top corner
  gives the objective: find a way out. Scrawled writing on the far wall appears
  to read "No escape."


  Enemies are 2D animated characters placed in 3D office spaces. Desks,
  furniture and other props can be smashed. The weapon art is inked and
  hand-drawn in black and white, set against flat teal walls with orange edge
  highlights, which gives it a comic-book horror look.


  You play a burned-out worker fighting through a workplace that is falling
  apart, and the aim is to get out before the company swallows him. The creator
  describes the intent as a quick, violent, surreal shooter in the vein of older
  browser FPS games.
