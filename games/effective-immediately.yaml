slug: effective-immediately
title: Effective Immediately
tagline: Shoot your way out of a collapsing office nightmare as a burned-out worker.
description: >-
  You're a burned-out office worker with a stapler for a gun, and you have to
  fight your way out of a workplace that's falling apart before the company
  swallows you whole.


  It all starts in first person, in a narrow teal corridor, with 30 staples
  loaded and 100 health. A panel in the top corner gives you a single objective,
  find a way out. Scrawled on the far wall is something that appears to read "No
  escape," a pretty rude welcome from your own office.


  The things standing in your way are 2D animated characters dropped into 3D
  office spaces. The office itself takes a bit of a beating too, with desks,
  furniture and other props all open to smashing.


  Your stapler gun is inked by hand in black and white, a surprisingly detailed
  drawing that sits against flat teal walls traced with orange edges for a
  comic-book horror look.


  Lucas Teixeira set out to make a quick, violent and surreal shooter about
  losing your mind inside a controlling workplace. Turning office supplies into
  ammo fits that brief neatly, and they pointed to older browser FPS games as
  the energy they were after.
