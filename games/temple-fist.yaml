slug: temple-fist
title: Temple Fist
tagline: Box in a photoreal ring where every frame comes from AI-generated video.
description: >-
  Temple Fist is a boxing game in which every frame comes from AI-generated
  video, playable in the browser and on phones. You step into the ring and trade
  punches with an opponent, and the fight runs as a series of short exchanges.


  The creator says the idea came after a wave of AI-made game trailers that
  could not be played. They wanted photoreal visuals of that kind in something
  you can actually play, and built it with Claude Code to get there. Vibe Jam
  2026 ranked the game 88th of 945.


  Boxing suits the approach, because the action breaks into clear moments, which
  fits how video models produce footage. The result is fighters and a ring with
  a photographic quality instead of the usual stylized game art.
