slug: temple-fist
title: Temple Fist
tagline: Box in a photoreal ring where every frame comes from AI-generated video.
description: >-
  Box a fighter in a ring in a bamboo grove, where every frame comes from
  AI-generated video instead of a 3D scene.


  Jab, Hook and Uppercut buttons. A fighter who rises into his guard when the
  bout starts. Footage instead of models, down to his rising from his seat.


  Press START, then throw your punches.


  vamonke saw that boxing's frame-to-frame structure lines up with how video
  models behave, and wanted the photoreal look of AI trailers in a game you can
  actually play.
