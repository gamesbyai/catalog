slug: temple-fist
title: Temple Fist
tagline: Box in a photoreal ring where every frame comes from AI-generated video.
description: >-
  Temple Fist is a boxing game that plays in the browser and on mobile. The
  player steps into the ring and trades punches with an opponent, with the fight
  running as a series of short exchanges rather than a free-roaming simulation.


  What stands out is the look. Every visual is built from AI-generated video, so
  the fighters and ring have a photographic quality instead of the usual
  stylized game art. Boxing suits the approach because the action breaks into
  clear moments, which fits how video models produce footage.


  The creator says the idea came after a wave of AI-made game trailers that
  could not be played. They wanted photoreal visuals of that kind in something
  you can actually play. The creator built it with Claude Code, and it was
  entered in Vibe Jam 2026.
