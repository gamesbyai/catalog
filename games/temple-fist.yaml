slug: temple-fist
title: Temple Fist
tagline: Box in a photoreal ring where every frame comes from AI-generated video.
description: >-
  The game opens on a first-person view across a rope-bound ring with a stone
  floor, set in a bamboo grove. Brown leather gloves fill the bottom of the
  screen. A shirtless fighter sits cross-legged at the far side, and a START
  button sits between the gloves.


  After you press START, the opponent rises into a guard, wrapped fists raised,
  with a jade pendant at his chest. Three buttons sit across the lower screen:
  Jab, Hook and Uppercut. A thin white bar runs just above them, over the
  opponent's belt.


  Every frame of the bout comes from AI-generated video, not a 3D model. The
  creator chose boxing because its frame-to-frame structure matched how video
  models behave, and wanted something playable with the photoreal look that AI
  trailers had shown without being playable.
