slug: bubble-popverse
title: Bubble Popverse
tagline: Pop bubble wrap, grow an empire, and prestige for rarer rainbow bubbles.
description: >-
  You're the newest name on an incident report for the Galactic Foam Authority.
  Earth is gone in this bleak year, and all that's left is foam, paperwork and a
  single clipboard-carrying intern.


  Foam Motion, a first upgrade that only lets bubbles drift, with an official
  note that Form 7-A is approved. Later upgrade tiers, locked at first, with Pop
  Power and Comfortable Foam. The Auto-Popper, billed as an intern with exactly
  one skill. Idle climb through new realms and rainbow rarities, then prestige.
  Meadow, the first realm. Spatial audio, with a sound for every pop.


  Pick a bubble name, or roll one at random. Tap bubbles to pop them and earn
  Bubcoins. Spend your coins on upgrades in Bubble Labs. Hold a card to keep
  buying one more of it. Headphones are suggested because the game uses spatial
  audio.


  thekibermaks made the game with their two kids, Alice and Michael, who are
  obsessed with silly simulators such as Untitled Goose Game and Plastic Duck
  Simulator. Together they settled on bubble wrap. The kids played every version
  and said which pops felt best.
