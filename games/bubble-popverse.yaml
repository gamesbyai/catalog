slug: bubble-popverse
title: Bubble Popverse
tagline: Pop bubble wrap, grow an empire, and prestige for rarer rainbow bubbles.
description: >-
  You're the newest name on an incident report for the Galactic Foam
  Authority, set in a bleak year when Earth is gone and all that's left is
  foam, a pile of paperwork and a single clipboard-carrying intern. First you
  pick a bubble name, or you hit the dice button to roll a random one.


  After that you tap the bubbles floating across the screen, and every pop earns
  you Bubcoins. A corner panel tracks your coins next to the current realm,
  which starts as Meadow, plus a progress bar toward your next goal. Behind all
  that, flower petals drift across a green field.


  You spend your coins in Bubble Labs, a panel on the right that lays out
  upgrades as cards in tiers. The first one, Foam Motion, does nothing more
  than let the bubbles drift, and it comes with an official note that Form 7-A
  has been approved.


  Later tiers start out locked, and they hold upgrades like Pop Power,
  Auto-Popper and Comfortable Foam, where the Auto-Popper gets billed as an
  intern with exactly one skill. You can also hold a card to keep buying one
  more of it, which saves a lot of tapping.


  The bigger loop is a classic idle climb, where you pop, upgrade, discover new
  realms, collect rarities that include rainbow ones, and then prestige.


  Every pop has its own sound, which fits a game that started out as bubble
  wrap, and the title screen suggests headphones for the spatial audio. A full
  row of buttons for Dex, Ranks, Zen, Share, Portal and Menu runs along the
  top.


  thekibermaks made it with their two kids, Alice and Michael, who are obsessed
  with goofy simulators such as Untitled Goose Game and Plastic Duck Simulator.
  Together they settled on bubble wrap, and the kids played every version and
  said which pops felt best. The current build is still labeled as being
  balanced.
