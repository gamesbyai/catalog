slug: bubble-popverse
title: Bubble Popverse
tagline: Pop bubble wrap, grow an empire, and prestige for rarer rainbow bubbles.
description: >-
  You start by picking a bubble name or rolling a random one, then pop bubbles
  to earn Bubcoins. The main screen shows a coin counter, the current realm
  (Meadow), a progress bar toward the next goal, and flower petals drifting over
  a green field.


  A Bubble Labs panel on the right lists upgrade cards in tiers. The first card,
  Foam Motion, unlocks bubble drift. Later tiers start locked and include Pop
  Power, Auto-Popper and Comfortable Foam. A hint on the panel says holding a
  card buys one more each time.


  The loop is idle and incremental: pop bubbles, buy upgrades, discover new
  realms, collect rarities including rainbow ones, and prestige. Buttons for
  Dex, Ranks, Zen, Share, Portal and Menu sit along the top. Every pop has its
  own sound, and the title screen recommends headphones for the spatial audio.


  The intro frames everything as a joke about a Galactic Foam Authority and an
  intern with a clipboard. A father built it with his two kids, who played each
  version and said which pops felt best. The build is labeled as still being
  balanced.
