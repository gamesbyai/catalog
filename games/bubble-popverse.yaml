slug: bubble-popverse
title: Bubble Popverse
tagline: Pop bubble wrap, grow an empire, and prestige for rarer rainbow bubbles.
description: >-
  You tap the floaty bubbles drifting across the screen to earn Bubcoins, and
  every pop makes its own ASMR sound, so the title screen suggests headphones.
  The coins then go into Bubble Labs, a panel of upgrades down the right side.


  Foam Motion is the first one you can buy, and it's what lets the bubbles start
  to drift. Pop Power and an Auto-Popper sit locked below it, and the
  Auto-Popper is described as an intern who only knows one job, which is a
  pretty good joke for a button.


  If you hold an upgrade card, you keep buying it, so you don't have to tap it
  over and over.


  The setup is goofy. It's the year 14,000,003, Earth is gone, and foam and
  paperwork have taken its place.


  Before you start, the Galactic Foam Authority wants a name for its incident
  report, so a printer coughs up a random bubble name for you. If you don't like
  it, a dice button rerolls it.


  Past the popping, you build an empire, discover new realms, collect rainbow
  rarities and prestige. A progress bar in the corner shows how far you are from
  being ready to do that, which is handy because you can see the goal without
  opening anything.


  Buttons along the top open the Dex, Ranks, Zen, Share, Portal and Menu. That's
  a surprising amount of stuff for a game about bubble wrap.


  Maksym Grigorash made it with his kids Alice and Michael, who love silly
  simulators about ducks and geese. They settled on bubble wrap, and the kids
  played every version and said which pops felt best. The title screen admits
  the balance is still a work in progress.
