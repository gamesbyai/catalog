slug: magnet-mayhem
title: Magnet Mayhem
tagline: Pull and push floating junk to knock rival UFOs around while dodging
  laser beams.
description: >-
  In Magnet Mayhem you pilot a UFO armed with a magnetic pull. You attract or
  repel the scattered junk floating around the arena, turning the debris into
  weapons against rival saucers, and you compete against friends for points in
  the same arena.


  The hazard layer has a joke built in: the laser beams that sweep in during a
  fight are themed as coming from the Vibe Jam judges. Antigravity, Google's AI
  coding tool, was used to build it for that jam, where it came 329th of 945,
  and phones are supported too.


  That leaves you watching two things at once: your opponents and the incoming
  fire. The playful alien setup keeps the rivalry among friends lighthearted,
  even when a well-aimed piece of junk knocks someone around.
