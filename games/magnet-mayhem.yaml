slug: magnet-mayhem
title: Magnet Mayhem
tagline: Pull and push floating junk to knock rival UFOs around while dodging
  laser beams.
description: >-
  Your UFO pulls space junk in or pushes it away. Absorbing junk raises your
  score as you float in a space arena. Judges' lasers cross the arena, so you
  dodge them while collecting.


  Repel mode, costing 5 points per second while active. Bot-controlled rival
  UFOs during the round. EMP blast with a 20-point cost.


  Steer with WASD. Press Space to flip your magnetic polarity. Press Shift for
  the grapple hook. Press E for the EMP blast. Stop by the portal at the arena's
  edge to enter.


  yazanbruv drew on UFO news talk and the fun of fighting friends for points.
