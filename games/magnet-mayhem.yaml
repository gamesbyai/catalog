slug: magnet-mayhem
title: Magnet Mayhem
tagline: Pull and push floating junk to knock rival UFOs around while dodging
  laser beams.
description: >-
  Press Space to flip your UFO's magnetic polarity, pulling space junk toward
  you or pushing it away. Absorbing junk raises your score. You steer with WASD
  around an arena floating in space.


  Repel mode drains 5 points per second while it is active. You go up against
  bot-controlled UFOs during the round.


  Laser beams from the judges cross the arena, so you dodge them while you
  collect. Shift fires a grapple hook, and E fires an EMP blast that costs 20
  points. Stop near the portal at the arena's edge to enter it.


  The creator drew on news talk about UFOs and on the fun of fighting friends
  for points.
