slug: arcanum
title: Arcanum
tagline: Cast elemental spells as a wizard through biomes and face three Archmagi.
description: >-
  You play a wizard working through six biomes in Arcanum, a roguelike built
  around elemental spells.


  Four elements as your main source of offense in combat. Three boss-level
  Archmagi, the encounters each run builds toward. Dangers from the regions
  themselves, answered with your spells in every run.


  Characters and environments are assembled from simple 3D shapes instead of
  imported models. shazly_9000 made it out of a love of spells, magic and
  roguelikes.
