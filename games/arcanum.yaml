slug: arcanum
title: Arcanum
tagline: Cast elemental spells as a wizard through biomes and face three Archmagi.
description: >-
  Arcanum is a single-player wizard roguelike built around elemental spells. You
  cast your way through six biomes as a wizard, drawing on four elements as your
  main source of offense in combat, and each run builds toward encounters with
  three Archmagi.


  Characters and environments are built from composite geometry, assembled out
  of simple 3D shapes instead of imported models. The creator made it for Vibe
  Jam 2026 with Claude Code and Three.js, out of a love of spells, magic and
  roguelikes, and it ranked 384th of 945 there.


  Runs have a clear shape: four elements to draw on, six biomes to cross and
  three boss-level Archmagi to face. The danger comes from the regions
  themselves, and your spells are how you answer it, run after run.
