slug: arcanum
title: Arcanum
tagline: Cast elemental spells as a wizard through biomes and face three Archmagi.
description: >-
  Arcanum is a wizard roguelike in which the player wields spells across six
  biomes. Each run pits the wizard against the dangers of these regions, with
  four elements to draw on as the main source of offense, building toward
  encounters with three Archmagi.


  The visual style is built from composite geometry, so characters and
  environments are assembled from simple 3D shapes rather than imported models.
  The mix of four elements, six biomes, and three boss-level Archmagi gives runs
  a clear structure to work through.


  It was made for Vibe Jam 2026 and runs in the browser on Three.js. The creator
  says they built it with Claude Code, and that the project comes from a love of
  spells, magic, and roguelikes.
