slug: ikuta-73
title: Ikuta '73
tagline: Mow lawns in a 1973 Tokyo summer and rest in the shade to keep your stamina up
description: >-
  It's the summer of 1973 out in the hilly country west of Tokyo, and you're a
  college student cutting grass for a company your uncle runs. You push a mower
  through people's yards and steer it across the grass, and the game is about
  taking care with the work even when nobody would check. A session runs about
  half an hour.


  Your own body working like a solar panel in reverse. Fast stamina loss in
  direct sun, refilled in shade. Slow loss of maximum stamina through the day.
  Possible cold drinks as hospitality for neat enough work, each a stamina
  boost. A day cycle with a sun crossing the sky. Optional two-stick mower
  control for a dual-stick gamepad. Cicada calls shifting through the day,
  morning and late-afternoon ones built from one noon recording.


  Push forward with W and steer with A and D. Step out of the light when the
  afternoon gets heavy. Press Space to wheelie, spinning the mower around for a
  quick pivot. On a touchscreen, use one side to walk and steer, and the other
  to turn the view. Tap to grab or use an item.


  Claude Code wrote the code, made the sound effects and models, and handled
  level testing; Grok Build made the title screen. plinth did everything else.
  The game takes its cues from a short story by Haruki Murakami.
