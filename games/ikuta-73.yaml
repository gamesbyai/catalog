slug: ikuta-73
title: Ikuta '73
tagline: Mow lawns in a 1973 Tokyo summer and rest in the shade to keep your stamina up
description: >-
  Summer, 1973, in the hills west of Tokyo: you play a college student cutting
  lawns for your uncle's company. In first person you push a mower through
  yards, steering it over the grass. The game centers on taking care with the
  work when nobody would check. A session lasts about half an hour.


  Heat sets the rules. Direct sun wears down your stamina quickly, and standing
  in shade brings it back, so you step out of the light when the afternoon gets
  heavy. Your maximum stamina also shrinks slowly over the day. Neat work can
  earn a cold drink from someone, which gives a stamina boost.


  A moving sun and a day cycle carry time forward, and you can check the clock
  at any point. A wheelie spins the mower around quickly. An optional two-stick
  mode, which needs a dual-stick gamepad, can be switched on in settings. If the
  game runs slowly, lower the grass density under Performance.


  The look is low-poly, with Japanese houses, cicada sounds and a lens flare on
  the title screen. It takes cues from a Murakami short story. On touchscreens,
  the left half of the screen moves and steers, the right half turns the view,
  and a tap grabs or uses an item.
