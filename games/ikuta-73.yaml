slug: ikuta-73
title: Ikuta '73
tagline: Mow lawns in a 1973 Tokyo summer and rest in the shade to keep your stamina up
description: >-
  It's summer 1973 and you're a college student pushing a lawn mower through
  yards in the hills west of Tokyo, working for your uncle's company. You see it
  all in first person, in a low-poly neighborhood of small houses.


  The sun is what you're fighting. It drains your stamina while you're out in
  it, and shade fills it back up, so you end up planning your mowing around
  where the shadows fall.


  Your maximum stamina slowly shrinks as the day goes on, which means a rest in
  the shade only gets you so far. Do a good enough job on a lawn and someone may
  hand you something cold to drink, and that hospitality gives you stamina back.
  It's a nice reason to mow carefully when nobody's forcing you to.


  The day has a clock, and the sun moves across the sky as time passes. You can
  check the time whenever you want.


  You walk, push and pull the mower, and steer it left or right, plus a wheelie
  that lets you pivot fast. You also pick things up, use them and put them down
  again. If you have a dual-stick gamepad, there's an optional two-stick mower
  mode in the settings that works a bit like steering a Katamari.


  If the grass makes it run slowly, you can turn down the grass density in the
  performance settings.
