slug: riders-of-the-nine-planes
title: Riders Of The Nine Planes
tagline: Ride a steed through dungeons, charging at targets to build energy and
  cast spells.
description: >-
  Ride with WASD or the arrow keys to build energy from motion, then press 1 to
  6 to commit a charge. Your mount hurtles at a target, sometimes a wall, and
  releases the spell you picked. Hidden spells are added to those number picks
  later.


  A stationary rider is vulnerable, so each run is a loop of riding,
  discharging, and riding again while you plan your route. The game begins as a
  roguelike dungeon crawl and grows toward a full RPG. Trainers can be reached
  with T, and the title screen shows a roster of 96 mounts to look over.


  You can skip the deeper systems and smash around the dungeon, or keep one
  cavalier alive and aim for the title Emperor Of The Known Multiverse. Press J
  to save your journey and continue it from the title screen.


  The creator says the ordinary stairs are not working in the current build, so
  leaving the first plane depends on finding a portal. The M key mutes music and
  also intercepts that letter in equipment slots. The music is not AI made; only
  the sound effects are procedural.
