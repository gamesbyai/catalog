slug: riders-of-the-nine-planes
title: Riders Of The Nine Planes
tagline: Ride a steed through dungeons, charging at targets to build energy and
  cast spells.
description: >-
  Ride a steed through a dungeon, building energy from motion as you go. The
  game opens as a roguelike and grows toward a full RPG. Standing still leaves
  your rider vulnerable, so each run loops through riding, discharging, and
  riding again while you plan a route.


  Optional deeper systems. Arcade-style smashing through the dungeon. Hidden
  spells, added to the number picks later. The title Emperor Of The Known
  Multiverse, for a cavalier kept alive.


  Ride with WASD or the arrow keys. Press 1 to 6 to commit a charge, and your
  steed hurtles toward a target, sometimes a wall, releasing the spell you
  picked. Press T to reach trainers. Press J to save your journey, then continue
  it from the title screen.


  According to the creator, the ordinary stairs are out of action in the current
  build, so leaving the first plane depends on finding a portal.


  The music is not made with AI, and only the sound effects are procedural.
