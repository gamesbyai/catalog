slug: game-breakers
title: Game Breakers
tagline: Invent fighters and attacks, then watch them battle other players' creations.
description: >-
  Game Breakers is a multiplayer auto-battler where players create their own
  fighters instead of picking from a preset roster. An AI writes JavaScript for
  each creation's visuals, attacks, and behavior, and that code runs on the game
  server. Once a fighter is made, it enters a battle against creations from
  other players.


  The open-ended creation is the main draw. What a fighter looks like and how it
  fights depends on what the player asks for. Matches can turn out surprising
  because each opponent's behavior was generated from someone else's idea.


  The game runs on mobile as well as desktop. It was entered in Vibe Jam 2026,
  where it placed 176th out of 945 entries. The creator's tagline invites
  players to try to break the game, which fits its design of running generated
  code directly in the simulation.
