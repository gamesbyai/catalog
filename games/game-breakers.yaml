slug: game-breakers
title: Game Breakers
tagline: Invent fighters and attacks, then watch them battle other players' creations.
description: >-
  Invent a fighter, and an AI writes the JavaScript for its visuals, attacks and
  behavior. It is an auto-battler, and once your fighter exists you watch it
  rather than steer it.


  Fighters that battle creations other players made. Opponents that each grew
  out of someone else's idea. Open-ended creation, with looks and fights that
  depend on your request. Generated code running directly in the simulation on
  the game server.


  Nevsved made the game and invites players to try to break it.
