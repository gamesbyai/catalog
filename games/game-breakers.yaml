slug: game-breakers
title: Game Breakers
tagline: Invent fighters and attacks, then watch them battle other players' creations.
description: >-
  You invent the fighters in Game Breakers, and an AI writes the code that makes
  them work. For each creation it writes JavaScript covering the visuals,
  attacks and behavior, that code runs on the game server, and the finished
  fighter goes into battle against other players' creations.


  It is a multiplayer auto-battler for desktop and phone browsers, so once a
  fighter exists you watch rather than steer. Creation is open-ended: how a
  fighter looks and fights depends on what you asked for, and since every
  opponent grew out of someone else's idea, matches can turn out surprising.


  The creator invites players to try to break the game, which fits a design that
  runs generated code directly in the simulation. The title makes the same
  promise.
