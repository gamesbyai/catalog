slug: tower-defense
title: Tower Defense
tagline: Shoot waves of slimes with upgradable bows to protect your castle.
description: >-
  Tower Defense puts you in a first-person view on the grounds of your castle,
  where waves of slimes advance toward the walls. You aim and fire bows to stop
  them before they arrive. Each defeated enemy yields coins, which you collect
  during the fight.


  The coins feed an upgrade loop: you spend them on better bows, so the weapon
  in your hands gets stronger as the waves grow. It blends the wave structure of
  tower defense with the direct aiming of a shooter, so you defend by shooting
  instead of placing towers from above.


  The game was made for Vibe Jam 2026 and built in Three.js. The creator says
  they used Cursor, and describes the project as a mix of the jam and a gut
  feeling. It is set up to run on mobile devices as well.
