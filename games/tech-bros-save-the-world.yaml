slug: tech-bros-save-the-world
title: "Tech Bros: Save the World"
tagline: Fight off waves as a satirical tech mogul and take down rival
  billionaire bosses.
description: >-
  Play a caricature of a famous technocrat and fend off swarms of enemies. You
  stack upgrades over each run as wave after wave of enemies comes at you, in a
  satire-heavy survivors-like that plays in the vein of Vampire Survivors and
  Megabonk.


  Famous tech figures as playable characters and bosses. Rival billionaires
  among the bosses. A story runs through the fights. RPG elements alongside
  fast, survivor-style combat, beyond plain arena survival.


  TheJohnnyStaley says a post by levelsio got them to take part, and they had
  April free to work on it.
