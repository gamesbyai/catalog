slug: tech-bros-save-the-world
title: "Tech Bros: Save the World"
tagline: Fight off waves as a satirical tech mogul and take down rival
  billionaire bosses.
description: >-
  In Tech Bros: Save the World you play a caricature of a famous technocrat,
  fending off swarms of enemies and stacking upgrades over the course of a run,
  one wave after another. It is a survivors-like in the vein of Vampire
  Survivors and Megabonk, with rival billionaires waiting as bosses.


  The creator says a post from levelsio about the jam prompted them to join, and
  they built the game with Claude Code and Codex on PixiJS. In Vibe Jam 2026 it
  came 63rd of 945.


  The satire is the hook. Well-known tech figures show up both as playable
  characters and as bosses, and a story runs through the fights. The RPG
  elements sit alongside fast survivor-style combat instead of leaving it as
  pure arena survival.
