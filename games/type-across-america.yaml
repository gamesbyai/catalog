slug: type-across-america
title: Type Across America
tagline: Spell your way from Colorado to Maine by typing the name of each state
  next door.
description: |-
  The road trip across America starts in Colorado, and typing is the only way to move from state to state.

  First few letters of each neighbor's name, plus clues on what it's known for. Clues like Snoopy for Minnesota and tax-free shopping for Delaware. Arizona, a Colorado neighbor that meets it only at the Four Corners. Score percentage that starts at 500% and keeps sliding down the whole time. One visit per state, and an ending once every neighbor has been visited. The northeast route to Maine, a little puzzle of its own.

  Type the name of a state that borders yours. A green arrow carries you over to it. Wait longer, and more letters and clues fill in.

  According to Sleepyowl108, AI tools did the coding and the images, and they wrote the text themselves.
