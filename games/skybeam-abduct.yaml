slug: skybeam-abduct
title: Skybeam Abduct
tagline: Abduct people with a UFO beam while fighting off the military
description: >-
  Carry out abductions as the pilot of a UFO in this action game.


  The craft's beam, for pulling targets up from the ground. Military forces that
  move in to stop the operation, and that you fight off. Two jobs in each
  session, grabbing targets and keeping the craft alive. A story framed around
  UFO disclosure and secrets coming into the open.


  According to Infinite79Mr, the game comes from a long-held wish to break into
  game development, one held since age twelve.
