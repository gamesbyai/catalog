slug: apu
title: APU
tagline: Climb a voxel Andean mountain, surviving cold, wind, and cliffs to
  reach the summit.
description: >-
  APU starts you in a warm mountain town in the Andes and points you at the
  summit. The climb is a voxel survival game: cold, strong wind and sheer cliffs
  stand between you and the top, and the goal is to get there alive.


  The creator brought three interests together here: game development, mountain
  climbing and Peruvian roots. It was made with Codex as an experiment in vibe
  coding and plays on phones as well as desktops. The setting draws on Peruvian
  mountain mythology, with a blocky voxel look that gives the peaks a mythic
  feel.


  Each stretch of the ascent is about managing the conditions and picking a safe
  way up. The cozy town at the bottom sets up a contrast with the harsh terrain
  above.
