slug: apu
title: APU
tagline: Climb a voxel Andean mountain, surviving cold, wind, and cliffs to
  reach the summit.
description: >-
  APU has you leave a warm Andean town and climb a voxel mountain toward its
  summit. The climb itself is a voxel survival game.


  Cold, strong wind and sheer cliffs as the obstacles on the way up. Managing
  conditions and picking a safe way up on each stretch. A setting drawn from
  Peruvian mountain mythology. Reaching the summit alive as the goal.


  asalinasmark combined three interests in this game: game development, mountain
  climbing and Peruvian roots. The game was made as an experiment in vibe
  coding.
