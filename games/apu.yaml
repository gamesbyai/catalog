slug: apu
title: APU
tagline: Climb a voxel Andean mountain, surviving cold, wind, and cliffs to
  reach the summit.
description: >-
  APU is a voxel mountain-climbing survival game set in the Andes. You start in
  a warm mountain town and head up the slope, facing cold, strong wind, and
  sheer cliffs. The goal is to make it to the summit alive, so each stretch of
  the climb is about managing the conditions and picking a safe way up.


  The setting draws on Peruvian mountain mythology, and the blocky voxel look
  gives the peaks a mythic feel. The contrast between the cozy town at the
  bottom and the harsh terrain above shapes the mood of the climb. It also runs
  on mobile devices.


  The creator combined an interest in game development, mountain climbing, and
  Peruvian roots in this project. They built it with Codex as an experiment in
  vibe coding, and it was submitted to Vibe Jam 2026.
