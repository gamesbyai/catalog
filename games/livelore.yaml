slug: livelore
title: LiveLore
tagline: Pick the branches of creepy ghost stories and vote on where they go.
description: "Tap a choice to send a ghost story down another branch. Each tale has branches, and your pick changes the next passage, the mood and the ending.


  Five campfire tales, three to four minutes each. Noctur, a weekly horror collection with a new chapter each Wednesday. Reader ballots for the next chapter, with editors settling close votes. The Last Collection, an interactive mystery pilot. Complete stories and opening chapters, labeled on each page. Original scary stories, with retold urban legends on a separate page.


  Read any story free, without an account. Vote at the end of an interactive story, one choice per browser. After you vote, rate the chapter or leave a note with your own idea.


  LiveLore Team edits every story by hand and sets up the branches and pacing. According to the creator, AI drafts and polishes the scripts and produces the narrated audio."
