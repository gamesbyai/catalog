slug: jumpory
title: Jumpory
tagline: Climb a tower of 3D platforms and see how high you can get.
description: >-
  Jumpory is a 3D platformer about vertical climbing. The player moves through a
  series of platforms stacked upward, jumping from one ledge to the next to gain
  height. Each run is a push toward a new personal high, with the challenge
  coming from platforms that get harder to reach.


  The game draws on the Only Up style of climbing challenge, where progress is
  measured by altitude and every jump matters. It runs in the browser using
  Three.js and works on mobile devices as well as desktop, so a climb can start
  without an install.


  It was entered in Vibe Jam 2026, where it placed 420th among 945 entries. The
  creator built it with Cursor, and the game is a single-player experience with
  no multiplayer mode.
