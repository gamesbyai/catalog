slug: pocket-orbit
title: Pocket Orbit
tagline: Fly between tiny planets, fight, claim worlds, and build defenses with
  a crew online.
description: >-
  Pocket Orbit is a multiplayer space adventure set on tiny planets in a shared
  solar system. Players fly between worlds, fight enemies and rivals, and claim
  planets as their own. Once a world is claimed, they can build defenses to hold
  it while the action keeps moving around them.


  Crew portals let players team up and join each other across the solar system,
  which gives the chaos a cooperative side. The mix of shooting, exploration,
  and base building draws on colony-style management and space travel, all
  condensed into small, bite-sized planets. It supports mobile play as well as
  desktop.


  The game was entered in Vibe Jam 2026, where it placed 285th among 945
  entries. The creator built it with Cursor, and it runs on Three.js.
