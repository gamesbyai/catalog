slug: race-of-cars
title: Race of cars
tagline: Drive a car in a straightforward, no-frills racing game with multiplayer.
description: >-
  Race of cars is a browser-based driving game built around a simple idea: get
  behind the wheel and race. It is presented as a plain car game with no extras,
  and it supports multiplayer, so other players can share the track. It also
  runs on mobile devices.


  The game was made by a newcomer to programming who wanted to learn to code. A
  relative suggested starting with a car game, and the project grew out of that
  first exercise. The result is a small, focused racer that keeps its scope
  narrow.


  It was entered in Vibe Jam 2026, where it placed 136th out of 945 entries. The
  creator's statement says it was built with Cursor, and it runs on Three.js for
  its 3D graphics.
