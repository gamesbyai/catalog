slug: ekeko
title: Ekeko
tagline: Bargain with a corrupted Andean deity by playing cards in a horror roguelite.
description: >-
  You drag little ceramic miniature cards onto an altar, and the Ekeko, a
  corrupted Andean abundance deity, tallies up your offering. His math
  multiplies chips and card values by your combos and your relics.


  Every wish has a price, and he's keeping the receipts, which is a pretty grim
  way to run a card game.


  Each encounter sets a demand, and you've got 5 rounds to beat it. Come up
  short and you face whatever the Ekeko has in store, which is where the horror
  comes in.


  Combos are what drive your score. Ritual Pair, Full Table, Holy Trinity and
  Sacred Altar are the ones named up front, while Perfect Offering and the Grand
  Rituals are left for you to discover. There's also a Dried Lamb somewhere in
  the game, and you're told only that you'll understand once you find it.


  A full run lasts three acts, and the debt grows with each one, so the demands
  keep climbing as you go.


  The setting is the Alasitas fair, where the Ekeko already gave you a house, a
  car, a diploma and a heart, and now he wants payment. It's rooted in Bolivian
  folklore, and the creator, a 20-year-old solo developer from Bolivia, calls it
  a first game that mixes Balatro, Inscryption and Buckshot Roulette.
