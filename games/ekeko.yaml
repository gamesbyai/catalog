slug: ekeko
title: Ekeko
tagline: Bargain with a corrupted Andean deity by playing cards in a horror roguelite.
description: >-
  Drag miniature ceramic cards onto the altar to build an offering for the
  Ekeko, a corrupted Andean abundance deity. He scores the tray as chips plus
  card values, multiplied by combos and relics, and you must beat his demand in
  each encounter.


  A run is split into 3 acts, each with 5 rounds, and the debt grows with every
  act. Named combos include Ritual Pair, Full Table, Holy Trinity and Sacred
  Altar. Perfect Offering and the Grand Rituals are left for you to discover.
  Failing a demand has consequences the game keeps to itself.


  The setting is the Alasitas fair, where the Ekeko once handed over a house, a
  car, a diploma and a heart, and now collects. Art is painted in a dark,
  candlelit style. Play is mouse-only, with subtitles and color-blind friendly
  options. Sessions are short, and the creator is a solo developer from Bolivia.
