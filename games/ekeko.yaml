slug: ekeko
title: Ekeko
tagline: Bargain with a corrupted Andean deity by playing cards in a horror roguelite.
description: >-
  Ekeko is a horror roguelite card game about bargaining with a god. You
  negotiate ritual offerings with a corrupted deity of abundance drawn from
  Andean tradition. Each run is a series of card-driven exchanges where you
  weigh what to offer against what the deity grants you in return.


  A solo developer from Bolivia made it in the Godot engine, and Vibe Jam 2026
  ranked it 89th of 945. The creator points to Balatro, Inscryption and Buckshot
  Roulette as touchstones for this single-player game.


  The premise rests on Bolivian folklore and the Ekeko figure the game is named
  after, and the tone is built on one idea: every wish has a price. Each card
  you play is part of the bargain, and the deity always wants something back.
