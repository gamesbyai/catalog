slug: ekeko
title: Ekeko
tagline: Bargain with a corrupted Andean deity by playing cards in a horror roguelite.
description: >-
  Build an offering on an altar tray for the Ekeko, an Andean god of abundance
  who has gone rotten. The setting is the Alasitas fair, where the Ekeko once
  handed over a house, a car, a diploma and a heart. Now he has come to collect.


  Three acts of five rounds each, with the debt climbing every act. Scoring from
  chips plus card values, multiplied by combos and relics. Named combos like
  Ritual Pair, Full Table, Holy Trinity and Sacred Altar. Unnamed combos to
  discover, including Perfect Offering and Grand Rituals. The Dried Lamb, hidden
  somewhere, its meaning clear only once found. Falling short of a demand, with
  the outcome kept from you.


  Drag each miniature card to the altar. Beat the demand in each encounter. Play
  with the mouse alone. Sessions are meant to be short. The game includes
  subtitles and options for color-blind players.


  Ekeko is the first game from AdriverBuilds, a 20-year-old solo developer from
  Bolivia. According to the creator, AI assisted with both the code and the
  graphics.
