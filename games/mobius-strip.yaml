slug: mobius-strip
title: Mobius Strip
tagline: Race and fight on gravity-defying tracks until you're the last rider alive.
description: >-
  Start on the line of a dark, neon-edged track that curves through the clouds,
  with two rivals, Nyx Steel and Kai Blaze, beside your red craft. A countdown
  runs, then all three race, and the last rider left alive wins.


  Combat is part of the race. A tutorial pilot tells you to destroy an enforcer
  ahead on the track to collect XP. Enemies carry a name tag with a health
  percentage, and a level counter at the bottom fills as XP comes in.


  The screen tracks a lot at once: a ranked list of racers showing level, hull
  and distance, a minimap of the oval course, a speedometer in mph, and a panel
  for bonuses earned from level-ups. A row of ability slots with a draw and
  discard pile sits at the bottom.


  The creator used AI for art, animation, audio and visual polish, areas they
  say they are less strong in. The tracks bend gravity, and explosions and
  guitar solos accompany the race.
