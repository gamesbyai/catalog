slug: mobius-strip
title: Mobius Strip
tagline: Race and fight on gravity-defying tracks until you're the last rider alive.
description: >-
  The last rider alive wins each round of Mobius Strip, an online combat racer
  on twisting tracks that ignore normal gravity. You tear along surfaces that
  bend and flip while dodging explosions and trying to take out your rivals
  before they take you out.


  Working in Claude Code, the creator describes using AI like a brush rather
  than a shortcut: it helped with art, animation, audio and visual polish, areas
  they say they are less strong in. The game runs on Babylon.js and finished
  240th of 945 at Vibe Jam 2026.


  The presentation leans hard into spectacle. An electric guitar soundtrack,
  blasts and a strong sense of velocity make each race loud and chaotic, and
  with multiplayer, the rivals you are trying to outlast can be other people.
