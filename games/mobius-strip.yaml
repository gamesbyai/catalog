slug: mobius-strip
title: Mobius Strip
tagline: Race and fight on gravity-defying tracks until you're the last rider alive.
description: >-
  Wait out the countdown, then go. Your red craft starts on a dark, neon-edged
  track that curves through the clouds, with two rivals, Nyx Steel and Kai
  Blaze, lined up beside you. All three of you race, but only the last rider
  still alive gets the win.


  The tracks bend gravity, and the soundtrack to all of it is explosions and
  guitar solos.


  Fighting is part of the race itself. A tutorial pilot chimes in early with an
  order to take out an enforcer further up the track, because wrecking it earns
  you XP. Each enemy wears a name tag with its health as a percentage.


  Meanwhile, a level counter along the bottom fills up as your XP comes in.


  There's a lot on the screen at once. A ranked list keeps each racer's level,
  hull and distance, and there's a minimap of the oval course plus a speedometer
  reading in mph. A side panel holds the bonuses you earn when you level up.


  Oddly for a racer, there's also a row of ability slots with a draw pile and a
  discard pile, like a hand of cards on the dashboard.


  yaworsw used AI for the art, animation, audio and visual polish. Those are the
  areas they say they're less strong in.
