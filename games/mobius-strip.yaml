slug: mobius-strip
title: Mobius Strip
tagline: Race and fight on gravity-defying tracks until you're the last rider alive.
description: >-
  You pilot a small red craft around a looping track hanging in the clouds, and
  you're shooting as much as you're racing. The last rider alive wins, so
  staying ahead isn't enough if the others are still flying.


  A countdown starts you off against two rivals, and a board in the corner
  tracks each racer's level, hull percentage and distance covered. Your own hull
  shows up in a pilot comms panel, where a tutorial pilot talks you through the
  first steps.


  Enforcers float over the track too, and they're worth chasing down.


  Destroying one, like the small enforcer the tutorial points at first, earns
  XP. That fills a level bar along the bottom of the screen, and each level-up
  adds a bonus that gets listed on the left, which is a pretty tidy way to make
  combat feed the racing.


  Along the bottom there's a row of ability slots next to a draw and discard
  count, so your abilities seem to cycle like a hand of cards.


  The track bends through gravity-defying loops, and a small minimap shows the
  whole circuit with every racer on it. Your speed in miles per hour sits beside
  it. The creator says the guitar solos and explosions were part of the plan,
  and they leaned on AI for the art, animation and audio they don't usually do
  themselves.
