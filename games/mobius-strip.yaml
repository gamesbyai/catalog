slug: mobius-strip
title: Mobius Strip
tagline: Race and fight on gravity-defying tracks until you're the last rider alive.
description: >-
  Wait out the countdown, then race. You start lined up beside two rivals, Nyx
  Steel and Kai Blaze. Only the last rider still alive wins.


  Tracks that bend gravity. Fighting built into the race. Early orders from a
  tutorial pilot to wreck an enforcer up the track, rewarded with XP. Bonuses at
  each level-up. A soundtrack of explosions and guitar solos.


  yaworsw used AI for the art, animation, audio and visual polish, areas they
  say they are less strong in.
