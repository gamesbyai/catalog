slug: mass-chaos
title: Mass Chaos
tagline: Grab, carry and deliver mass across a tilting arena without falling off.
description: >-
  You pilot a character around an arena that works like a scale, collecting
  cargo and delivering it to your green home zone. Mass is score, so heavier
  cargo scores more. Heavy cargo also tilts the arena and can make you slide.


  Play comes down to four actions: grab, carry, shoot, deliver. Every step you
  take tips the balance of the arena, and the one rule to remember is not to
  fall off.


  The menu asks for a pilot name before you start and offers three modes: Solo,
  Free-for-All and Teams. It uses a black background with neon cyan and magenta
  lettering.


  The creator had never made a game before and built this one partly to show
  their kids that an idea can become something playable.
