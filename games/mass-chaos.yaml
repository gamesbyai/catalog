slug: mass-chaos
title: Mass Chaos
tagline: Grab, carry and deliver mass across a tilting arena without falling off.
description: >-
  You're piloting a character around an arena that works like a giant scale,
  picking up cargo and hauling it back to your green home zone. Mass is your
  score, so the heavier the load, the more it's worth.


  But heavy cargo also tilts the arena, and that can send you sliding. Every
  step you take tips the arena's balance too, not just the cargo you're holding.
  The menu's slogan, carry more and risk more, sums up that bargain in four
  words.


  Along with grabbing, carrying and delivering, you can shoot, while the one
  rule to keep in mind is a pretty blunt don't fall off.


  Before you start, you type in a pilot name and choose Solo, Free-for-All or
  Teams. The menu is all neon cyan and magenta lettering glowing on a black
  background.


  The default pilot name is ANONYMOUS, which is a fittingly mysterious way to
  show up at a cargo fight.


  vahagn_bbjnyan had wanted to make a game for a long time, and this is the
  first one they've built. Part of the reason was a sweet one, since they wanted
  to show their kids that an idea can become something playable even without any
  prior experience. They also hoped it would encourage the kids to build things
  of their own.
