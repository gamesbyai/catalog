slug: mass-chaos
title: Mass Chaos
tagline: Grab, carry and deliver mass across a tilting arena without falling off.
description: >-
  You pilot a character around an arena that works like a giant scale, picking
  up cargo and hauling it back to your green home zone. Your score is your mass,
  and a heavier load is worth more. Heavy cargo tilts the arena and can make you
  slide.


  Arena balance tipped by every step you take, as well as by the cargo you hold.
  Solo, Free-for-All and Teams modes.


  Shoot as you go, and keep the one rule in mind: don't fall off the arena.


  vahagn_bbjnyan has wanted to make a game for a long time, and Mass Chaos is
  the first one they've built. Part of the motivation was to show their kids
  that an idea can become something playable, even without any prior experience.
  They also hoped to encourage the kids to build their own things.
