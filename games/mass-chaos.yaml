slug: mass-chaos
title: Mass Chaos
tagline: Grab, carry and deliver mass across a tilting arena without falling off.
description: >-
  Mass Chaos is played on an arena that works like a scale. You grab objects,
  carry them, shoot and deliver them to score, because the mass you gather is
  your score, and every step you take shifts the balance of the platform under
  everyone.


  It was the creator's first attempt at making a game, partly to show their kids
  that ideas can be turned into something real even without prior experience.
  They made it with Claude Code for Vibe Jam 2026, and it runs on phones too.


  Since picking up weight and moving it tips the world, positioning becomes a
  strategic choice and movement matters as much as aim. Falling off is the
  constant risk, so every delivery has to be weighed against the ground under
  you.
