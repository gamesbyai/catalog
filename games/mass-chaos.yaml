slug: mass-chaos
title: Mass Chaos
tagline: Grab, carry and deliver mass across a tilting arena without falling off.
description: >-
  You're a pilot collecting cargo around an arena and carrying it back to your
  green home zone. The arena works like a scale, so what you haul changes the
  footing for everyone.


  Heavier cargo scores more, but it also tilts the arena and can make you slide.
  That ties the reward to the danger, because the pieces worth the most are the
  ones that push you toward the edge, and falling off is the thing you're trying
  to avoid.


  The creator boils the loop down to grab, carry, shoot, deliver.


  Mass is your score, so the more you carry, the better you do. The tagline says
  to carry more and risk more, which fits.


  Before a round you can type in a pilot name, or you can just stay anonymous.


  Then you pick how to play: solo, free-for-all, or teams. The glowing cyan and
  magenta menu sits on a black background, and there's a small counter at the
  bottom showing how many people have played today.


  The creator had always wanted to try making a game and used this as the chance
  to do it. They also wanted to show their kids that you can turn an idea into
  something real even if you've never built anything before.
