slug: cluck-heist
title: Cluck Heist
tagline: Rampage as a chicken through a cartoon version of your own neighborhood.
description: >-
  Cluck Heist is a top-down sandbox where you play a menacing chicken. You type
  in a real address, and the game builds a cartoon version of the surrounding
  neighborhood from OpenStreetMap data. From there you peck, poop, and steal
  your way around, then haul the loot back to your nest before the humans catch
  on.


  The standout idea is the map. Instead of a fixed level, the streets you run
  through are based on a place you choose, so the chaos can happen on your own
  block. The tone is openly silly, built around chicken mischief and petty theft
  rather than any serious challenge.


  The game was an entry in Vibe Jam 2026. The creator built it with Claude Code
  and Three.js, and describes it as an attempt to make the most ridiculous game
  possible for fun.
