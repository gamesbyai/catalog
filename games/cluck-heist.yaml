slug: cluck-heist
title: Cluck Heist
tagline: Rampage as a chicken through a cartoon version of your own neighborhood.
description: >-
  You're a menacing chicken loose in a real neighborhood, pecking, pooping,
  screaming and lobbing eggs, grabbing items to haul back to your nest.


  Cartoon streets rebuilt from OpenStreetMap for your entered address. Wanted
  stars tracking how much the humans notice you. Health and food, both in the
  game, plus a cat posse in the mix. Loading a new location beyond one street.
  Music player with track selector.


  Pick a handle and location first. Enter an address, or leave it blank for a
  random suburban block.


  catesb made it with nothing particular in mind, aiming to build the most
  ridiculous game possible for fun.
