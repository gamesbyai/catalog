slug: cluck-heist
title: Cluck Heist
tagline: Rampage as a chicken through a cartoon version of your own neighborhood.
description: >-
  Cluck Heist starts with a real address. Type one in and the game builds a
  cartoon version of the surrounding neighborhood from OpenStreetMap data, then
  turns you loose in those streets as a menacing chicken.


  It is a top-down sandbox, and the creator describes it as an attempt to make
  the most ridiculous game possible, for fun. Made with Claude Code and
  Three.js, it placed 278th of 945 at Vibe Jam 2026, and the tone is openly
  silly, built around chicken mischief and petty theft.


  From there you peck, poop and steal your way around, then haul the loot back
  to your nest before the humans catch on. Because the streets come from a place
  you choose, the chaos can happen on your own block.
