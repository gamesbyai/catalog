slug: cluck-heist
title: Cluck Heist
tagline: Rampage as a chicken through a cartoon version of your own neighborhood.
description: >-
  You play a chicken on a top-down map built from a real address. A start screen
  asks for a handle and a location. Leave the location blank and you land on a
  random suburban block. The streets come from OpenStreetMap data and are drawn
  in a cartoon style.


  You peck, poop, scream, and throw eggs while grabbing items and carrying them
  to your nest. A row of wanted stars at the upper left tracks the attention you
  draw from the humans, and a score counter sits at the upper right.


  Under the stars are an HP bar, a food bar, and counters for carried items,
  eggs out of three, and a cat posse out of three. An address bar at the top
  loads a new location. Zoom buttons and a small music player with a track
  selector are also on screen.
