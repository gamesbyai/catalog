slug: mazerift
title: MazeRift
tagline: Roll through mazes, collect perks, and race through increasingly
  strange worlds.
description: >-
  MazeRift is a maze roller in which the player guides a ball through a series
  of mazes. The rules are simple: find the way through each layout, and do it
  quickly. Skillful play is rewarded with perks and better speed as the levels
  progress.


  The environments become more surreal the further you get, so the look of the
  maze changes even when the core task stays the same. Perks give a reason to
  play cleanly instead of just finishing. It also runs on mobile devices, which
  suits a quick session.


  The creator says the idea came from a four-year-old's love of mazes and from a
  lack of good maze games on the App Store. It was made for Vibe Jam 2026 with
  Bolt and Three.js, and it placed 407th out of 945 entries.
