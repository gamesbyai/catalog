slug: mazerift
title: MazeRift
tagline: Roll through mazes, collect perks, and race through increasingly
  strange worlds.
description: >-
  MazeRift is a maze roller: you guide a ball through a series of mazes, and the
  rules fit in one line. Find the way through each layout, and do it quickly.


  The creator says the idea came from a four-year-old's love of mazes and from a
  lack of good maze games on the App Store. Bolt and Three.js were used for its
  Vibe Jam 2026 build, and it runs on phones, which suits a quick session.


  Skillful play earns perks and better speed as the levels go on, which gives
  you a reason to play cleanly instead of just finishing. The environments also
  turn more surreal the further you get, so the look of the maze keeps changing
  even when the task stays the same.
