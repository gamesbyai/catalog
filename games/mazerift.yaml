slug: mazerift
title: MazeRift
tagline: Roll through mazes, collect perks, and race through increasingly
  strange worlds.
description: >-
  Roll a ball through a series of mazes, finding the way through each one as
  fast as you can.


  Perks and better speed earned through skillful play. Levels that turn more
  surreal the further you get. A task that stays simple while the mazes change.
  Quick sessions.


  The idea came from a four-year-old's love of mazes and a lack of good maze
  games on the App Store.
