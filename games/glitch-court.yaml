slug: glitch-court
title: GLITCH COURT
tagline: Judge absurd disputes between digital objects and chain combo streaks
  in a 3D courtroom.
description: >-
  Judge absurd disputes between everyday digital objects, like a Toaster suing a
  Microwave, in an endless 3D tribunal.


  Fast rulings, one case after another. Combo streaks for correct calls. Humor
  drawn from the absurdity of modern tech relationships. Courtroom drama with
  cues from Phoenix Wright. Punchy, escalating feedback in the manner of
  Balatro. Screen-breaking revenge mechanics when a run peaks.
