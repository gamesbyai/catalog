slug: glitch-court
title: GLITCH COURT
tagline: Judge absurd disputes between digital objects and chain combo streaks
  in a 3D courtroom.
description: >-
  Glitch Court is an endless 3D tribunal where you play the judge. Digital
  entities bring unhinged disputes before you, such as a Toaster suing a
  Microwave, and you rule on each case at a fast pace. Correct calls build combo
  streaks, so a run is about keeping momentum through a steady stream of
  ridiculous cases.


  The game leans on the absurdity of modern tech relationships and pairs it with
  the punchy, escalating feedback of Balatro. Its courtroom drama takes cues
  from Phoenix Wright, but the parties are everyday digital objects rather than
  people. Screen-breaking revenge mechanics add a chaotic payoff when the
  feedback loop peaks.


  It was built with Three.js, and the creator used Cursor during development.
  The game entered Vibe Jam 2026 and runs on mobile as well as desktop.
