slug: astroxite
title: Astroxite
tagline: Take jobs between alien settlements and build a life in a shared frontier.
description: >-
  You start as a blocky figure seen from above, standing in an open desert-toned
  wilderness where dark four-legged animals wander nearby. The setting is a
  frontier shared with other players online, with alien settlements spread
  across it. You take jobs between those settlements and build reputation as you
  go.


  The HUD tracks a health bar that starts at 200, a CRD balance that starts at
  0, and an RVT counter that starts at 500. A clock and weather readout sits in
  the top corner, along with ping and map coordinates. A guide button marked
  Start here sits on the right edge.


  The bottom left holds a comms panel with a chat tab and a combat log tab. You
  can enter as a guest, but sending chat messages requires registering with an
  email. The creator cited Silkroad Online and similar MMOs as the inspiration.
