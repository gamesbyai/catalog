slug: astroxite
title: Astroxite
tagline: Take jobs between alien settlements and build a life in a shared frontier.
description: >-
  In Astroxite you take jobs from alien settlements, cross the wilderness to
  finish them and earn standing with the towns you work for. It is a multiplayer
  frontier sandbox that also runs on phones, and the wilderness between the hubs
  is shared with other players.


  The creator points to online MMOs such as Silkroad Online as the inspiration,
  and that shows in the weight on reputation and on travel between hubs. The
  game was built with Claude Code, renders in Three.js and ranked 173rd of 945
  at Vibe Jam 2026.


  Over time, a run becomes less about a single goal and more about what kind of
  life you build. Progress comes from the jobs you choose and the places you
  settle, with adventure and RPG elements under the open-ended play.
