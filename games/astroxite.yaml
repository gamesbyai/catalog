slug: astroxite
title: Astroxite
tagline: Take jobs between alien settlements and build a life in a shared frontier.
description: >-
  Alien settlements are scattered across a frontier wilderness shared with other
  players. You pick up jobs that run between those settlements while you make a
  life of your own out in the wild.


  Reputation built up along the way. Guest entry, without an account. Email
  registration for sending chat messages. A comms panel for switching between
  chat and the combat log.


  AndreBaltazar cites Silkroad Online and similar MMOs as the inspiration.
