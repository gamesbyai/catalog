slug: hard-road
title: Hard Road
tagline: Drive a scavenger's Lada down an endless road, towing wrecks for scrap.
description: >-
  Hard Road is a driving survival sim set on an endless wasteland highway. You
  pilot a scavenger's Lada, hook up wrecks along the route and tow them for
  scrap, then spend that scrap on a better engine and tougher tires. Each run is
  a push to keep rolling as far as the road allows.


  The pressure comes from the car's needs and the environment. Fuel can run dry,
  the battery can die, and wasteland weather makes the trip harder, so you weigh
  every detour for scrap against the risk of stalling out. Upgrades give you a
  way to stretch each trip a little longer.


  The game was entered in Vibe Jam 2026, and the creator names Cursor as a tool
  used to build it. The creator cites Hard Truck Apocalypse and Drive Beyond
  Horizons as favorite games, and the tone of the road and the salvage loop fit
  that influence. It is playable on mobile.
