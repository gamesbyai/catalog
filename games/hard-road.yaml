slug: hard-road
title: Hard Road
tagline: Drive a scavenger's Lada down an endless road, towing wrecks for scrap.
description: >-
  Hard Road puts you behind the wheel of a scavenger's Lada on an endless
  wasteland highway. You hook up wrecks along the route, tow them for scrap, and
  spend the scrap on a better engine and tougher tires, all to keep rolling as
  far as the road allows.


  The pressure comes from the car and the weather. Fuel can run dry, the battery
  can die, and wasteland weather makes every trip harder, so each detour for
  scrap has to be weighed against the risk of stalling out. Upgrades are how you
  stretch the next trip a little longer.


  The creator names Hard Truck Apocalypse and Drive Beyond Horizons among their
  favorite games, and the salvage loop and the tone of the road follow that
  lead.
