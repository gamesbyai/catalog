title: Hard Road
tagline: Drive a scavenger's Lada down an endless road, towing wrecks for scrap.
description: >-
  Drive a scavenger's Lada down an endless wasteland highway, towing wrecks for
  scrap.


  Scrap for a better engine and tougher tires. Fuel that can run dry and a
  battery that can die. Wasteland weather that makes every trip harder. Detours
  for scrap weighed against the risk of stalling out.


  The creator names Hard Truck Apocalypse and Drive Beyond Horizons among their
  favorite games.
