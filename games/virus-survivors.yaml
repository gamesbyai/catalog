slug: virus-survivors
title: Virus Survivors
tagline: Aim, shoot and build a fortress to survive a quarantine sector.
description: "Set in a quarantined zone, you defend a position against enemies. The free public demo is still in development.


  A 24-minute survival run or Endless Mode. Power cores collected for experience. Three upgrade choices each time you level up. Periodic boss fights. Character choice for each run. Purchasable weapons. Saved progress, including the Upgrade Tree.


  Move with WASD or the arrow keys. Aim with the mouse, and fire by holding the left button. Press 1 to 4 to select a structure, then hold the left button to build inside placement range. Press R to rotate smoothly, or E to snap rotation. Press U to upgrade a nearby structure. Press X twice to delete a nearby structure. Stand on a teleporter and hold to travel. Press Esc to pause.


  According to Portal Rabbit, generative AI played a partial role in the code, art, audio and text."
