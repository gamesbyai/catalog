slug: dyson-defender
title: Dyson Defender
tagline: Circle a Dyson sphere and shoot down alien ships before they reach it.
description: >-
  Dyson Defender is a 3D shooter set around a giant Dyson sphere. You pilot a
  ship that flies around the structure and fires at waves of incoming alien
  vessels. Each run is a defensive stand: the goal is to destroy the attackers
  before any of them get to the sphere.


  The setup gives the shooting a clear purpose. Instead of simply clearing a
  screen, you are guarding a single megastructure, so you have to think about
  where to position your ship and which enemies are closest to reaching it.
  Waves keep coming, which turns each session into a test of how long you can
  hold the line.


  The game runs in the browser on Three.js. According to its README, the creator
  built it with a mix of Cursor, Claude, Grok, and gptme, so several AI
  assistants took part in the work.
