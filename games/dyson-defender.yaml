slug: dyson-defender
title: Dyson Defender
tagline: Circle a Dyson sphere and shoot down alien ships before they reach it.
description: >-
  Dyson Defender puts a giant Dyson sphere at the center of a 3D shooter and
  makes you its guard. You pilot a ship around the structure and fire at waves
  of incoming alien vessels, and the goal is to destroy every attacker before it
  gets to the sphere.


  According to its README, it was built with a mix of Cursor, Claude, Grok and
  gptme, so several AI assistants took part in the work. It is built on
  Three.js.


  Guarding one megastructure, instead of simply clearing a screen, changes the
  shooting. You have to think about where to position your ship and which
  enemies are closest to reaching the sphere, and the waves keep coming, so
  every session tests how long you can hold the line.
