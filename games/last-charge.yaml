slug: last-charge
title: Last Charge
tagline: Play or charge cards to build a deck while a Trace meter draws Sentinels.
description: >-
  Play or charge each card in your hand every turn, in sessions of about an
  hour. Build your deck from 34 cards and four keywords in this deckbuilding
  roguelike, where the Machines own the world and one human Citadel is left.
  Each numbered Charge is a run into the dark, and when three fail, the
  Sentinels breach the wall and knock districts offline.


  Grounded, utility that never needs charging. Discharge, cashing out every
  level at once. Feedback, turning the charge itself into the attack. Conduit,
  charging for free. Machines that push back, including Armored Crawlers that
  shrug off weak hits, Scanners that scale with your last turn's charges and
  Agents that mimic your strongest cards. Six bosses, among them Redactor,
  Interlock, Flywheel, Uplink, Arbiter and Harvester. The final battle, unlocked
  by 50 Salvage, with uncapped Trace and endless waves.


  Each turn you receive a pool of Amps to pay with. Play a card for its printed
  price, or charge it at its current level. Charging upgrades it until the fight
  ends and locks it until your next turn, so you give up its tempo now. Each
  charge fills the Trace track. At 6, a Sentinel joins the fight and the track
  resets, though never all the way to zero.


  Check each route node's threat rating before you pick it. Read each Machine's
  next action and damage before it acts. The game uses no random rolls, so every
  gamble you take is on visible numbers. Spend Salvage between Charges to light
  Citadel districts such as the Reactor, Foundry and Beacon. Each district you
  light also raises the global difficulty. Once the final battle opens, your
  districts on the meta map act as cards.
