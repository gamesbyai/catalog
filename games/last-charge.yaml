slug: last-charge
title: Last Charge
tagline: Play or charge cards to build a deck while a Trace meter draws Sentinels.
description: >-
  Each turn you get a pool of Amps, and for every card in your hand you choose
  to play it or charge it. Playing costs the printed price, while charging costs
  the card's current level and upgrades it for the rest of the fight.


  Charging also locks that card until your next turn, so building up a card
  means giving up its tempo right now.


  Every charge feeds a Trace track, and when it reaches 6 a Sentinel drops
  into the fight. The track resets after that. It never goes all the way back
  to zero, though.


  At least nothing is hidden. Each machine shows its next action and damage
  above its head, and every node on the route reveals its threat rating before
  you pick it. The game skips random rolls entirely, so every gamble you take is
  on numbers you can see.


  There are 34 cards to build a deck from, plus a compact set of four keywords
  to build around.


  Grounded covers utility that never needs charging, Discharge cashes out every
  level at once, Feedback turns the charge itself into the attack, and Conduit
  lets you charge for free.


  The machines push back against how you play. Armored Crawlers ignore weak
  hits, Scanners scale with how many charges you made last turn, and Agents
  rather cheekily copy your best cards. Six different bosses can show up, from
  the Harvester and Arbiter to the Flywheel and Redactor.


  Each trip out into the dark is a numbered Charge, and between them you spend
  Salvage to light up Citadel districts like the Reactor, Foundry and Beacon.
  Lighting them also raises the global difficulty. Fail three Charges and the
  Sentinels breach the wall and knock districts offline.


  Once you've collected 50 Salvage, the final battle opens up with uncapped
  Trace and waves that never end, while your districts on the meta map act as
  cards. A session runs about an hour.
