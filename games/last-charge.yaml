slug: last-charge
title: Last Charge
tagline: Play or charge cards to build a deck while a Trace meter draws Sentinels.
description: >-
  Each turn you get Amps and a choice for every card in hand. Play it for its
  printed cost, or charge it by paying its current level, which upgrades it for
  the rest of the fight. Charging locks that card until the next turn.


  Every machine shows its next action and damage above its head. Route nodes
  show their threat rating before you commit. Each charge adds Trace, and at 6 a
  Sentinel joins the fight. The track then resets, but not to zero.


  The 34 cards use four keywords. Grounded is utility that needs no charging.
  Discharge cashes out all levels at once. Feedback makes the charge itself the
  attack. Conduit charges for free. Armored Crawlers ignore weak hits, Scanners
  scale with your last turn's charges, and Agents copy your best cards. Six
  bosses can appear.


  Each run out is a numbered Charge. Between runs you spend Salvage to light
  Citadel districts, which also raises the global difficulty. Failing three
  Charges lets Sentinels breach the wall and disable districts. At 50 Salvage
  the final battle unlocks, with uncapped Trace, endless waves and your
  districts acting as cards. A session runs about an hour.
