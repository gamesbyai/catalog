slug: last-charge
title: Last Charge
tagline: Play or charge cards to build a deck while a Trace meter draws Sentinels.
description: >-
  Look at your hand and decide, card by card, whether to play it or charge it.
  Playing costs the number printed on the card and does its thing right now,
  while charging costs the card's current level and bumps it up for the rest of
  the fight.


  Charging also locks that card until the turn ends, so you're giving up tempo
  for a stronger card later.


  Every charge adds Trace, and when the meter reaches 6 a Sentinel drops into
  your fight. The meter resets but never to zero, so a greedy deck keeps pulling
  the Machines toward you.


  Nothing is hidden, which is a nice fit for a game about counting power. Each
  Machine shows its next move and damage above its head, and every route node
  tells you its exact threat rating before you pick it. Armored Crawlers shrug
  off weak hits, Scanners grow stronger based on how much you charged last turn,
  and Agents copy your best cards.


  The 34 cards are organized around four keywords: Grounded, Discharge, Feedback
  and Conduit. Six bosses are waiting out there.


  Each trip out is a numbered Charge, and between them you spend Salvage to
  light up Citadel districts such as Reactor, Archive, Foundry, Shielding and
  Beacon. Making a district stronger also raises the difficulty across the whole
  game, so every upgrade costs you something. Fail three Charges and the
  Sentinels break through the wall, switching off districts on your permanent
  map.


  Once you've gathered 50 Salvage, the final Citadel battle opens up. Trace has
  no ceiling there, the waves keep coming, and whatever districts you still have
  turn into cards in your deck.


  You can play with a mouse, keyboard, touchscreen or gamepad. There's also a
  reduced-motion mode that still keeps all the visual cues.
