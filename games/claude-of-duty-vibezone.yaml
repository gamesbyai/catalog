tagline: Fight other players in a battle royale shooter that runs in the browser.
description: >-
  A battle royale where you share the match with other players. You drop in and
  fight the others.


  First-person fights in an arena. Winning by being the last player standing. A
  playful tone throughout.


  LouisLsvr describes it as a vibe-coded homage to Call of Duty Warzone. "Life
  is a battle royale, let's have fun playing it," the creator writes.
