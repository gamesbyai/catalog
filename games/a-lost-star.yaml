slug: a-lost-star
title: A Lost Star
tagline: Fly a ship through alien space landscapes and fight other pilots in dogfights.
description: >-
  A multiplayer space shooter where you pilot a ship through alien landscapes
  and fight other pilots in dogfights. Staying alive while you explore is the
  core of it.


  Open-space maneuvering. Shots lined up on opposing ships. Alien vistas the
  creator calls beautiful, as the backdrop for every fight.


  felacalana names Minecraft, EVE Online and Quake 3 as inspirations, for a mix
  of exploration and fast shooting.
