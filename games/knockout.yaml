slug: knockout
title: Knockout
tagline: Pick or create an MMA fighter and battle in the octagon online or solo.
description: >-
  Knockout is a browser MMA fighting game. You choose a ready-made fighter or
  build your own, step into the octagon, and trade strikes with an opponent
  until one fighter is beaten. Matches can be played solo against the computer
  or online against another person.


  Online bouts run over peer-to-peer multiplayer, so two players can connect
  directly and fight. The game is free to play in the browser and aims to be
  easy to pick up, with fighter creation adding a personal touch before each
  match.


  The creator says the goal was a fun, approachable MMA game and an experiment
  to see whether it could be made by vibe coding. It was built with Claude Code
  and entered in Vibe Jam 2026.
