slug: knockout
title: Knockout
tagline: Pick or create an MMA fighter and battle in the octagon online or solo.
description: >-
  Trade strikes in the octagon until one of you is beaten. Knockout is a free
  MMA fighting game.


  Ready-made fighters, plus a fighter you build yourself before each match. Solo
  bouts against the computer. Peer-to-peer online bouts against another person.
  One-on-one bouts.


  According to the creator, the aim is a fun MMA game that is easy to pick up,
  and an experiment to see whether vibe coding could produce one.
