slug: jellyblob
title: JellyBlob
tagline: Grow a wobbly jelly, trap rivals with your trail and go Supernova in a
  shared pond.
description: >-
  JellyBlob opens on a lobby where you type a name for your jelly, choose one of
  several colors, and press Play to join a pond shared with other players
  online. Behind the menu, glowing dots and other jellies move across a
  hex-patterned floor.


  Quest lists on the left are split into Daily, Weekly and Run tabs. The daily
  list asks you to hop 40 times, vault 15 trails, and stomp 8 smaller jellies,
  paying 201, 402 and 804 XP. Your first run of the day adds a 50% XP bonus.


  XP raises your level, which starts at 1 with 214 XP needed for the next one.
  The reward road lists a Party Cone hat at level 2, a Coral color at level 3,
  and a Ribbon Bow hat at level 4. A Profile & trophies panel holds your
  personal bests, and Color Shift is a paid unlock. The AI wrote all of the
  code, guided by the creator through hundreds of iterations.
