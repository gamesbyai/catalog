slug: jellyblob
title: JellyBlob
tagline: Grow a wobbly jelly, trap rivals with your trail and go Supernova in a
  shared pond.
description: >-
  Start as a small jelly in a pond you share with other players online, and grow
  by eating glowing dew. Every jelly leaves a trail behind it, and the game's
  own advice is to cut other jellies off.


  Splats from touching someone else's trail. Supernova, seven seconds of extra
  speed and pull, set off by a full Glow meter. Immunity to trails, and smaller
  jellies swallowed on contact, during Supernova. Blue currents, faster when
  ridden the right way and slower against them. Power bubbles for a magnet, a
  shield or a turbo. Daily, weekly and run quests between rounds, plus a level
  track and a cosmetics locker. The paid color unlock Color Shift.


  Steer with the mouse, WASD, the arrow keys or a thumbstick. Hop with a click,
  Space or the on-screen button. Hop over a trail when you're boxed in. Vaulting
  a trail fills the Glow meter, as do close calls, splats and combos. Land a hop
  on a much smaller jelly to burst it flat. Hold Shift or the right mouse button
  to surge. Surging costs size, and the goo you shed becomes food for everyone
  else.


  Its creator steered AI to write all of the code over hundreds of rounds,
  feeding it input and instructions. The game was first built with one AI model
  and then remade with another.
