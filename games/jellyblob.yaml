slug: jellyblob
title: JellyBlob
tagline: Grow a wobbly jelly, trap rivals with your trail and go Supernova in a
  shared pond.
description: >-
  JellyBlob is a free multiplayer .io arena where you play a wobbly gelatin
  jelly in a glowing night pond. You grow by eating dew, cut rivals off with
  your trail, hop over theirs and stomp jellies smaller than you. Shedding size
  lets you surge for a burst of speed, and a full Glow meter sets off Supernova:
  seven seconds of swallowing anything smaller.


  Pond events break up each match every few minutes, from a Dew Storm to a
  fleeing Golden Jelly. Between runs there is a long progression: endless levels
  with rank badges, a Reward Road, daily quests and a weekly challenge, plus
  hats, faces, trails and emotes to collect. It plays on phones as well as
  desktops, with touch controls for both orientations.


  According to its creator, the game was first built with GPT-6 Astra in Codex
  and then remade with Claude Opus 5.5 in Claude Code. The remake runs on Three.js with its own
  game server, and it renders each jelly as squashy, see-through gelatin.
