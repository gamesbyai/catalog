slug: jellyblob
title: JellyBlob
tagline: Grow a wobbly jelly, trap rivals with your trail and go Supernova in a
  shared pond.
description: >-
  JellyBlob has you type a name for your jelly, pick one of several colors and
  press Play, which drops you into a pond you share with other players online.
  Even the menu is busy, with glowing dots and other jellies drifting over a
  hex-patterned floor behind it.


  Once you're in, your score sits in the top corner, a round minimap fills the
  bottom-left and a bar labeled Glow runs along the bottom. Four numbered emote
  buttons wait in the other corner, and they're a bit sweet, running from a
  cheerful Hi and a GG to a smiley and a heart.


  Quests on the left are split into Daily, Weekly and Run tabs, and the daily
  set reads like a blob's chore list, asking you to hop 40 times, vault 15
  trails and stomp 8 smaller jellies.


  Those pay 201, 402 and 804 XP, a tidy little ladder where each reward doubles
  the one before it. Your first run of the day also earns a 50% XP bonus on top.


  XP raises your level, which starts at 1 and needs 214 XP before you reach the
  next one.


  The reward road shows what's ahead for your increasingly well-dressed blob,
  starting with a Party Cone hat at level 2. A Coral color follows at level 3.
  Then a Ribbon Bow hat waits at level 4.


  A Profile & trophies panel keeps your personal bests, and if you want Color
  Shift, that one's a paid unlock.


  All of the code came from the AI, steered by Kvickan through hundreds of
  iterations of input and instructions. The game was built with one model first
  and then remade with another.
