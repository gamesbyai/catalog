slug: blizzard-brawl
title: BLIZZARD BRAWL
tagline: Build snow defenses and throw gadgets at rivals in a shrinking frozen arena.
description: >-
  Move with WASD, aim with the cursor, and click to throw snowballs. You start
  in a local solo arena against a bot, and the solo round keeps running until
  you choose to queue for a duel. When matchmaking finds a rival, you can jump
  into a live 1v1.


  The controls panel lists three build keys: 1 for a wall, 2 for a turret, and 3
  for a heater. Left click throws a snowball or places the selected item, and
  Escape or right click cancels. The creator describes the duel as building
  defenses, deploying gadgets, and outplaying rivals as the frozen arena
  shrinks.


  The arena is a round sheet of ice seen from an angled overhead view, with
  snow-covered rocks and pine trees scattered across it. A round ends on a
  result screen, such as Defeat by elimination, with buttons to restart the
  round or queue for a duel.
