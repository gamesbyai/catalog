slug: blizzard-brawl
title: BLIZZARD BRAWL
tagline: Build snow defenses and throw gadgets at rivals in a shrinking frozen arena.
description: >-
  Move with WASD, aim with the cursor and click to throw snowballs. You're a
  blocky little fighter on a round frozen arena with snowy pines and rocks
  scattered around, and the rival is another fighter in the same ring.


  Pressing 1, 2 or 3 picks a wall, a turret or a heater, and a click places it.
  If you change your mind, Escape or a right click cancels the placement. So
  you're building your side of the arena as well as throwing.


  The arena shrinks while the round runs, which is a good reason to think about
  where you put things.


  When the page loads you're already in a solo sandbox against a bot, so there's
  nothing to wait for. A duel queue sits idle until you press the button to join
  it, and the practice keeps going until you do. Once matchmaking finds a rival,
  you're in a live one-on-one.


  Lose and a defeat screen tells you that you were eliminated. From there you
  can restart the round or go straight back into the queue.


  The creator got the idea from an article about levelsio making money from a
  game he built in three hours.
