slug: blizzard-brawl
title: BLIZZARD BRAWL
tagline: Build snow defenses and throw gadgets at rivals in a shrinking frozen arena.
description: >-
  BLIZZARD BRAWL is an online multiplayer snow duel in a frozen arena that keeps
  shrinking. Each round mixes three jobs: build snow defenses, deploy gadgets
  and attack your rivals, all while the space to maneuver gets tighter and
  tighter.


  The creator says the spark was an article about a game made in about three
  hours. The build uses Codex and Three.js for the frozen arena, and at Vibe Jam
  2026 it came 323rd of 945.


  Pacing and positioning are the focus, and rounds are quick. Because the arena
  closes in, nobody can sit behind cover forever, so every defense you build has
  to be weighed against pushing forward to outplay the other side. Gadgets,
  thrown at rivals, give you more options than a plain snowball exchange.
