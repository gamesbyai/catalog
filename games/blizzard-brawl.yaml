slug: blizzard-brawl
title: BLIZZARD BRAWL
tagline: Build snow defenses and throw gadgets at rivals in a shrinking frozen arena.
description: >-
  Move with WASD, aim with your cursor and click to throw snowballs. The game
  drops you straight into a local solo arena against a bot, and that round keeps
  going until you decide to queue for a duel.


  When matchmaking finds a rival, you can jump into a live 1v1. seanDDari
  describes those duels as building defenses, deploying gadgets and outplaying
  the other player while the frozen arena shrinks around you.


  Press 1 to build a wall, 2 for a turret or 3 for a heater. Left click throws a
  snowball, but it places your selected item instead when you've picked one. If
  you change your mind, Escape or right click cancels it.


  When a round ends, such as with a defeat by elimination, you can restart the
  round or queue for a duel.


  seanDDari made it after reading an article about levelsio earning money from a
  game he'd built in just three hours.
