slug: tiny-skies
title: Tiny Skies
tagline: Explore a small shared world and relax together while an apocalypse looms.
description: >-
  Tiny Skies is a cozy multiplayer adventure set in a little world with an
  apocalypse hanging over it. Players wander the small map and explore alongside
  others. The focus is on relaxed company rather than combat, so nobody is
  trying to eliminate anyone else.


  The creator wanted a multiplayer game built around hanging out and having fun
  instead of competition, and that intent shapes the whole experience. The
  looming end of the world adds a quiet sense of stakes to an otherwise gentle
  setting. It also runs on mobile, and it placed seventh out of 945 entries at
  Vibe Jam 2026, where it received the Most Polished award.


  The creator built it with Cursor, using Three.js for the 3D world. The creator
  describes it as one of the first ideas that really clicked.
