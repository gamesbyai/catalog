slug: tiny-skies
title: Tiny Skies
tagline: Explore a small shared world and relax together while an apocalypse looms.
description: >-
  You fly a biplane around a tiny round planet. You climb with the Up Arrow.


  Villagers talk with you, and one of them hands you a parcel for a village they
  name, like a fisherman's package for Mossglen that's apparently stuffed with
  jam. Once you're carrying it, you fly to the village and drop it off.


  There's also a race you can finish, and collectibles to hunt down.


  There's a level and XP system as well. Other players fly around the same world
  with you. dannylimanseta wanted a cozy multiplayer game where people hang out
  instead of trying to kill each other, with an apocalypse looming in the
  background.
