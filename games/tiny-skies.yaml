slug: tiny-skies
title: Tiny Skies
tagline: Explore a small shared world and relax together while an apocalypse looms.
description: >-
  Other players fly around the same world with you. You pilot a biplane around a
  tiny round planet, and an apocalypse looms in the background.


  A race to finish, and collectibles to hunt down. XP and a level system.


  Climb with the Up Arrow. Villagers talk with you, and one hands you a parcel,
  such as a fisherman's package for Mossglen, apparently stuffed with jam. Once
  you're carrying it, fly to the village it names and drop it off.


  dannylimanseta wanted a cozy multiplayer game where players hang out rather
  than try to kill each other.
