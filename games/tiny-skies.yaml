slug: tiny-skies
title: Tiny Skies
tagline: Explore a small shared world and relax together while an apocalypse looms.
description: >-
  You start in a little green biplane above a small round planet, with a volcano
  smoking on the horizon and a hot air balloon drifting past. Cobbler Pip pops
  up with a joke about saving some sky for everyone else, and the first prompt
  tells you to climb with the Up Arrow.


  Other pilots share the sky with you, and their planes carry name tags like
  Bold Sparrow. The creator wanted a multiplayer game where people just hang out
  instead of trying to kill each other.


  There's an apocalypse looming over all this, which is an odd shadow for such a
  cozy place.


  Villagers hand you jobs while you fly. Fisherman Cork gives you a parcel full
  of jam for Mossglen, and a counter at the top shows how many meters you have
  left to go.


  A level bar at the bottom shows your XP, and in the corner you'll see two
  counters, 0/7 and 0/3, plus a line telling you to finish a race.


  Pull the camera back and you can see the whole planet, with rivers, forested
  hills, little white houses with blue roofs, and a map arrow showing where you
  are. The sky also shifts from bright day to a dusky, starry evening, so it's
  worth looking up now and then.
