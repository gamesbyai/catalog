slug: tiny-skies
title: Tiny Skies
tagline: Explore a small shared world and relax together while an apocalypse looms.
description: >-
  You start in a green biplane above a small round planet, with a river,
  forested hills, white cottages and a smoking volcano in view. A prompt in the
  corner tells you to climb with the Up Arrow. A hot air balloon drifts nearby,
  and another player's plane crosses the sky.


  Villagers talk to you in speech bubbles. One hands you a parcel for a named
  village, and the top of the screen then shows the distance left to the
  drop-off. The sidebar lists two collectible counts, 0/7 and 0/3, and a goal to
  finish a race.


  A level and XP bar sits at the bottom of the screen. Other players share the
  same world, and the room name and player count appear in the top corner. The
  creator wanted a cozy place to hang out rather than fight, with an apocalypse
  looming in the background.


  The sky appears as daytime blue in one moment and dusky purple with auroras in
  another. A fullscreen button and a sound toggle sit in the top corner.
