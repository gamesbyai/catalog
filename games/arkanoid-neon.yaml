slug: arkanoid-neon
title: Arkanoid Neon
tagline: Bounce a ball off a paddle to clear glowing neon brick levels.
description: >-
  Slide the paddle, keep the ball in play and break every block across eight
  hand-built rounds.


  Letter capsules that widen the paddle, slow the ball, let you catch and aim
  it, split it into three, add a life or mount twin lasers. The B capsule, a
  portal to the next round with 10,000 bonus points. Silver blocks that take
  several hits, and gold ones that never break. Rounds with Swedish names, from
  Regnbågen to Trappan, Pyramiden, Hjärtat and Fästningen. A faster loop after
  round eight. An extra life every 30,000 points.


  Drag to move and tap to shoot on a touchscreen.


  Jack-c3l2w asked for an Arkanoid in one sentence, and the AI built the code,
  graphics, sound, music and levels. It's a fan project inspired by Taito's 1986
  Arkanoid.
