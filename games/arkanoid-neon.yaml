slug: arkanoid-neon
title: Arkanoid Neon
tagline: Bounce a ball off a paddle to clear glowing neon brick levels.
description: >-
  Slide a paddle along the bottom of the screen to keep a ball in play and break
  every block above it. Falling capsules marked with letters change the paddle
  or ball: widen the paddle, slow the ball, catch it, split it into three, add a
  life, or fire lasers.


  Eight hand-built rounds run in order, starting with Regnbågen, a rainbow of
  colored rows under a row of silver blocks. Silver blocks take several hits,
  and gold blocks cannot be destroyed. After the eighth round the set loops at a
  faster tempo.


  The B capsule opens a portal in the right wall. Drive the paddle into it to
  skip to the next round for 10,000 points. An extra life arrives at every
  30,000 points, and the high score is saved locally.


  The look is neon: particle bursts, shockwaves, screen shake and a ball trail.
  Sound effects and a synthwave soundtrack are generated live with Web Audio. An
  AI-controlled demo plays on the title screen. Touch screens work by dragging
  to move and tapping to shoot.
