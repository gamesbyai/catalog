slug: the-underground
title: The Underground
tagline: Explore generated tunnels, open locked doors, and find artifacts before
  time runs out.
description: >-
  The Underground is a browser adventure set in a procedurally generated network
  of subway-style tunnels. Each run sends you into dark passages with locked
  doors and hidden artifacts to track down, and a timer keeps the pressure on.
  You need to work out where to go before the clock runs out.


  The world is endless in principle, since the tunnel layout is generated rather
  than hand-built, so each descent leads somewhere different. Multiplayer adds a
  shared layer: players can leave clues that others encounter, which turns the
  search into a loose collaboration between strangers.


  The idea came from the creator's curiosity about what lies down the dark
  tunnels seen from subway trains, such as abandoned stations or old bunkers. It
  was entered in Vibe Jam 2026, and the creator lists Cursor as a tool and
  Three.js as the engine.
