slug: the-underground
title: The Underground
tagline: Explore generated tunnels, open locked doors, and find artifacts before
  time runs out.
description: >-
  Each run starts with the clock at 03:00 and ends when it reaches 05:00. Until
  then, you explore a network of underground tunnels and search for whatever is
  hidden there.


  Procedurally generated tunnels, described by the creator as endless. Locked
  doors you have to get through. Artifacts hidden out of sight. Other players'
  clues, shared into your world too. A battery-powered flashlight. A camera for
  photographing evidence. A crowbar with five pries at the start.


  Press R to change how bright the flashlight is. Press N to open the notebook.


  mythcitygames made the game after riding subway trains around the world. They
  had always wondered what lies down the dark tunnels the trains passed, and
  wanted to find out what's there, such as abandoned stations and old bunkers.
