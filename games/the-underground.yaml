slug: the-underground
title: The Underground
tagline: Explore generated tunnels, open locked doors, and find artifacts before
  time runs out.
description: >-
  You're hunting for hidden artifacts in a generated network of underground
  tunnels before the clock runs out, and the timer on screen is set up as a
  window running from three o'clock to five.


  Locked doors block the way, and the crowbar is what gets you through them. It
  holds five pries, so you'll want to think about which doors are worth it.


  Other players leave clues in the tunnels too, which means a trip through the
  dark isn't only your own.


  Your gear sits in three slots along the bottom of the screen. The flashlight
  has a battery that drains and a brightness you can switch, the camera is for
  photographing evidence, and the crowbar handles the doors.


  Stamina and battery each get their own meter on the left, so you can see what
  you've got left of both. Below them a points counter tracks completed
  objectives.


  In the top corner, a panel lists your objectives and your most recent
  discoveries, and a notebook opens with a key press.


  The creator got the idea from riding subway trains past dark tunnels and
  wondering about abandoned stations and old war bunkers. The generator is their
  way of finding out what's down there.
