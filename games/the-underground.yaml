slug: the-underground
title: The Underground
tagline: Explore generated tunnels, open locked doors, and find artifacts before
  time runs out.
description: >-
  Each run starts with the clock at a specific 03:00:00, and you've got until it
  ticks over to 05:00:00 to find what's hidden underground before time runs out.


  The tunnel network is procedurally generated, and the creator describes the
  system as endless. You explore it, get through locked doors and hunt for
  artifacts tucked out of sight. Clues that other players leave behind get
  shared into your world too.


  You carry three tools. The flashlight runs on battery and its brightness
  changes with R, while the camera is there for photographing evidence. The
  crowbar starts with five pries. Pressing N pulls up a notebook.


  mythcitygames made it after riding subway trains around the world and always
  wondering what's down those dark tunnels they passed. They wanted to find out
  what lies down there, such as abandoned stations and old bunkers.
