slug: the-underground
title: The Underground
tagline: Explore generated tunnels, open locked doors, and find artifacts before
  time runs out.
description: >-
  A run starts at 03:00:00 on a clock that counts toward 05:00:00. In that
  window you explore a procedurally generated network of underground tunnels,
  open locked doors, and look for hidden artifacts before time runs out. Clues
  left by other players are shared into your world.


  You carry three tools in numbered slots. The flashlight has a battery meter
  and adjustable brightness. The camera is for photographing evidence. The
  crowbar starts with five pries, shown as a count on its slot. Stamina and
  battery bars sit on the left of the screen.


  An objectives panel logs how many objectives are complete, a discoveries list
  records recent finds, and a points counter tracks your score. A notebook opens
  with N. The creator wanted to find out what lies down the dark tunnels seen
  from subway trains, such as abandoned stations and old bunkers.
