slug: rift-survivors
title: Rift Survivors
tagline: Fight through 100 neon floors with combos, parries, and stamina management.
description: >-
  Played solo, this hack-and-slash roguelike sends you down into a dungeon to
  fight your way through.


  Demon's Souls-style combat, with attack, guard, parry and dodge. Stamina to
  manage during combat. Skill chains linking your skills together. A cycle of
  100 floors to descend. Three kinds of boss along the way, each with five or
  six attack patterns. MMO-style gear rarity, from Common up to Legendary.
  Automatic switching between Japanese and English, with no setting to change.


  Press any key or tap to start. Step into the MISSION portal to head down into
  the dungeon. Press F, X or H to use a skill. Sort out what you're wearing.


  otani_ai_memo once made games for feature phones, where each one had to stay
  under 1MB. They kept this game to a similar size limit. According to
  otani_ai_memo, working under that limit again brought back nostalgic memories.
