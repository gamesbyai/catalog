slug: rift-survivors
title: Rift Survivors
tagline: Fight through 100 neon floors with combos, parries, and stamina management.
description: >-
  When it loads, you're looking at a neon lobby with a magenta grid floor and a
  cyan border, plus a blocky little hero standing in the middle and a prompt to
  press any key or tap to start. Up top, a hint tells you to step into the
  purple portal labeled MISSION if you want to head down.


  Skill slots marked F, X and H line the bottom of the screen, and the
  inventory panel in the corner already holds 10 arrows before you've swung at
  anything.


  Once you're down there, it's hack-and-slash combat with handling modeled on
  Demon's Souls. You attack, guard, parry and dodge while keeping an eye on a
  stamina meter, and you can link your skills together into chains.


  The dungeon is laid out as a whole cycle of 100 floors. Three kinds of boss
  wait for you along the way. Each of them has plenty of variety, working
  through five or six different attack patterns.


  The interface switches itself between Japanese and English without you
  touching a setting.


  Gear borrows its rarity ladder from MMOs, running from Common all the way up
  to Legendary. There's also an equipment screen where you sort out what you're
  wearing.


  otani_ai_memo once made games for feature phones, where each one had to stay
  under 1MB. They kept this game to a similar size limit. According to
  otani_ai_memo, working under that constraint again brought back nostalgic
  memories.
