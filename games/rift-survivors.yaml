slug: rift-survivors
title: Rift Survivors
tagline: Fight through 100 neon floors with combos, parries, and stamina management.
description: >-
  Rift Survivors is a cyber-neon hack-and-slash roguelike built around a
  100-floor cycle. Combat borrows from Demons' Souls: you chain combos, time
  parries, and spend stamina carefully, since every swing and dodge draws from
  the same pool. Each run pushes you up through the floors toward tougher
  fights.


  Bosses come in three types, each with five to six distinct attack patterns to
  learn and read. Gear follows an MMO-style rarity ladder from Common to
  Legendary, and skills can be linked into chains. The interface switches
  automatically between Japanese and English, and the game runs on mobile.


  The creator started out making games for feature phones and built this one
  under a 1MB size limit, a constraint that recalled that early work. It was
  submitted to Vibe Jam 2026, and the creator's tooling included Claude Code.
