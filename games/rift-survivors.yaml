slug: rift-survivors
title: Rift Survivors
tagline: Fight through 100 neon floors with combos, parries, and stamina management.
description: >-
  The game opens in a neon lobby: a magenta grid floor with a cyan border, a
  blocky character in the middle, and a prompt to press any key or tap to start.
  A hint at the top says to enter the purple portal marked MISSION to descend.
  Skill slots F, X and H sit along the bottom, and an inventory panel in the
  corner holds 10 arrows.


  Combat is a hack-and-slash with Demon's Souls-style handling. You attack,
  guard and parry, dodge, and manage a stamina meter, and you can chain skills
  together. The dungeon runs as a 100-floor cycle, with three boss types that
  each use five to six attack patterns.


  Gear comes in rarities from Common to Legendary, and an equipment screen lets
  you manage what you wear. The interface switches between Japanese and English
  automatically. The creator, who once made feature phone games under a 1MB
  limit, kept to a similar size constraint here.
