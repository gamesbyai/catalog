slug: pawnfall
title: Pawnfall
tagline: Lead a squad of chess pieces through a roguelike run of tactical battles.
description: >-
  Lead a squad of chess pieces through a roguelike run and try to carry it as
  far as it will go before the run comes to an end.


  Army building and management. Tactical encounters, one after another. Variety
  from one run to the next.


  It draws on four influences: Wartales for overland travel and party
  management, Slay the Spire for run structure, Balatro for escalating
  build-crafting, and chess for its movement rules.
