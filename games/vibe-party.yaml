slug: vibe-party
title: Vibe Party
tagline: Race around a board and win chaotic minigames with cute AI-themed characters
description: >-
  Three CPU players share one board with you in Vibe Party, an AI-themed party
  board game.


  Quick Match, Online Party and Local Party modes. Green, red and blue spaces,
  with a star on each blue one. Board turns with quick minigames. Chaotic
  moments that can change who is ahead. Three rounds per match.


  Roll with the Roll button. Each player begins with 3 tokens and 0 RAM.


  simerdinger_sol took Mario Party as the model and wanted to see how far
  AI-generated characters, backgrounds and assets could go.
