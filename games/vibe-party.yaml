slug: vibe-party
title: Vibe Party
tagline: Race around a board and win chaotic minigames with cute AI-themed characters
description: >-
  The game has Quick Match, Online Party and Local Party modes. A match is
  played on one board with four players. P1 is the human player and P2 through
  P4 are CPU players. Each player starts with 3 tokens and 0 RAM.


  Spaces are green, red or blue, and the blue ones carry a star. You roll with
  the Roll button. A match lasts 3 rounds.


  Turns are played on the board, with quick minigames and chaotic moments that
  can change who is ahead. The creator took Mario Party as the model and wanted
  to see how far AI-generated characters, backgrounds and assets could go.
