slug: three-js-quake
title: Three.js Quake
tagline: Fight through Quake's shareware episode in a browser-based first-person
  shooter.
description: >-
  Play the shareware episode of Quake in a browser tab, level after level,
  fighting your way to each exit.


  A browser port of the classic first-person shooter. The original game's
  content rendered with Three.js. A showcase of what the library can do.


  Mr.doob, the creator of Three.js, made it with Anthropic's Claude involved in
  the build.
