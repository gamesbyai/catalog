slug: three-js-quake
title: Three.js Quake
tagline: Fight through Quake's shareware episode in a browser-based first-person
  shooter.
description: >-
  Three.js Quake is a browser port of the shareware episode of Quake, the
  classic first-person shooter. The player moves through the episode's levels in
  3D, fighting enemies and working toward the exit of each stage, all inside a
  web page with nothing to install.


  The project renders the original game's content using Three.js, which shows
  how a full retro shooter can run on a general-purpose web 3D library. It was
  put together by the creator of Three.js, so the port also works as a showcase
  for the library itself.


  The listing credits Claude and Three.js in its build. That points to
  Anthropic's Claude as part of how the port was made, though the details of its
  role are not spelled out.
