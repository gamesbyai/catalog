slug: flute-charge-your-glasses
title: FLUTE - Charge your glasses
tagline: Pour one bottle of champagne evenly into every glass by eye before the toast.
description: >-
  FLUTE is a pouring puzzle set at a dinner table. You get one finite bottle of
  champagne and a row of glasses, and the goal is to give every guest the same
  amount before the toast arrives. A round runs against the clock, and you judge
  each pour by eye.


  The game gives you no fill lines, no numbers and no undo. Every drop you
  overpour is taken from a guest further down the table. Fast pours build a head
  of foam that sits above the true level and settles after a couple of seconds.
  Some glasses are coupes, which hold the same measure as a flute at a very
  different height, and a briefing before each round shows the target in both
  shapes.


  The creator describes the development as heavily AI-assisted: the code was
  written with Claude Code (Opus), the art is drawn by code at runtime, and the
  sound effects are synthesized with WebAudio. The music was made with Gemini
  and edited in Audacity. The title plays on the French cry for a charge and the
  word for a champagne glass. It was made for AI Browser Game Jam 4.
