slug: game-box-arena
title: Game Box Arena
tagline: Battle other players in fast multiplayer arena deathmatch and capture
  the flag matches.
description: >-
  You start an online match by creating a room, after entering a player name and
  choosing a map. You can also join a public room that's already open. You can
  pick from Deathmatch, CTF and Rocket Arena maps.


  Matches are fast arena shooter fights with futuristic weapons and shields.
  Movement includes dodges and wall dodges, and sound effects accompany the
  combat. Classic Deathmatch and Capture the Flag are the two named modes.


  The game also includes a tutorial. You can switch between fighters before you
  enter a room, and Axiom is the one you start with.


  The creator drew on Unreal Tournament 1999 for the fast movement and arena
  combat, and added their own maps, characters and effects.
