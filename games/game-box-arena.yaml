slug: game-box-arena
title: Game Box Arena
tagline: Battle other players in fast multiplayer arena deathmatch and capture
  the flag matches.
description: >-
  Enter a player name and pick a map to create a room for fast arena shooter
  matches against other players.


  Classic Deathmatch and Capture the Flag modes. Deathmatch, Capture the Flag
  and Rocket Arena maps. Futuristic weapons, shields and combat sound effects.
  Dodge and wall dodge movement. Fighters you can switch between before a room,
  starting with Axiom.


  Join any public room that's already open. The game also includes a tutorial.


  The creator drew on Unreal Tournament 1999 for the fast movement and arena
  combat. They added their own maps, characters and effects.
