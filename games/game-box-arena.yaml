slug: game-box-arena
title: Game Box Arena
tagline: Battle other players in fast multiplayer arena deathmatch and capture
  the flag matches.
description: >-
  Game Box Arena is a multiplayer browser shooter built around quick arena
  fights. Players jump into Deathmatch or Capture the Flag, grab futuristic
  weapons, and use shields to survive firefights while chasing kills or carrying
  the enemy flag back to base.


  Movement is a big part of the design. Dodge and wall dodge moves let players
  sidestep incoming fire and change direction fast, and sound effects give each
  shot and hit some weight. The creator drew on fond memories of Unreal
  Tournament from 1999 and its fast, competitive pace.


  The creator added their own maps, characters, effects, and ideas on top of
  that inspiration. The game was entered in Vibe Jam 2026, and the creator
  states it was built with Codex.
