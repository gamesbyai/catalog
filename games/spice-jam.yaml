slug: spice-jam
title: Spice Jam
tagline: Harvest spice in the desert, hunt rival harvesters, and outlast the worm.
description: >-
  Spice Jam is a multiplayer, Dune-inspired shooter built around a single loop.
  You roam open sand collecting spice, then take it back to your base. Other
  players are harvesting too, so you can kill a rival harvester to steal what
  they have gathered before heading home.


  The worm is the constant threat. Staying out on the dunes pays off in spice,
  but it also leaves you exposed to both other players and the creature beneath
  the sand. The tension comes from deciding when to push for more and when to
  return.


  The prototype was made for Vibe Jam 2026, where it placed 250th among 945
  entries. It runs in 3D on Three.js, and the creator states it was built with
  Codex. Its combat draws on lasgun and Holtzman shield ideas from the source
  material.
