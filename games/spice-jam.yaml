slug: spice-jam
title: Spice Jam
tagline: Harvest spice in the desert, hunt rival harvesters, and outlast the worm.
description: >-
  Spice Jam puts you in a desert as a hooded harvester armed with a knife.


  Other players, each one a rival harvester. A glowing pack that tells you
  someone is carrying spice. Spice that falls to the sand when you die. The worm
  out on the open sand. Gear at a few stands back at base. Room for up to 20
  players.


  Scoop spice off the open sand until you're holding 10, the most you can carry.
  Kill a rival harvester to take the spice they carry. Drop your haul at base to
  add it to your bank and restore health and shield.


  ltfawg built it as a multiplayer prototype inspired by Dune, with lasgun and
  holtzman themes. "Wanted more lasgun/holtzman interactions in my life," the
  creator writes.
