slug: spice-jam
title: Spice Jam
tagline: Harvest spice in the desert, hunt rival harvesters, and outlast the worm.
description: >-
  Spice Jam puts you in a third-person desert as a hooded harvester armed with a
  knife, with a crosshair at screen center. You gather spice from open sand, up
  to a carry limit of 10, then bring it back to a base marked by a tall beam of
  light.


  Other players are rival harvesters. Killing one steals their spice, and a
  glowing pack on a harvester shows who is carrying. The base signage notes that
  spice drops on death.


  Depositing at the base adds to a banked total and restores health and shield.
  The on-screen panel tracks your weapon, spice carried, bank, HP, shield and a
  worm meter that starts at 0%. A worm threatens harvesters out on the sand, and
  a status line marks the rock as safe.


  The base also has stands for gear, including one surrounded by a shield
  bubble. The panel shows a player count out of 20, and the setting draws on
  Dune, with lasgun and holtzman themes.
