slug: spice-jam
title: Spice Jam
tagline: Harvest spice in the desert, hunt rival harvesters, and outlast the worm.
description: >-
  Spice Jam sends you across a third-person desert as a hooded harvester armed
  with a knife, aiming with a crosshair in the middle of the screen. You scoop
  spice off the open sand until you're holding 10, the most you can carry, then
  haul it home to a base you can spot by its tall beam of light.


  The other people out there are harvesters too, and killing one hands you
  whatever spice they were carrying, so every rival on the dunes doubles as a
  walking stash.


  A glowing pack is a pretty clear tell that someone's loaded. Signs at the base
  give you fair warning about the flip side, since your own spice drops when you
  die.


  Dropping your haul at the base adds it to your bank and patches up your health
  and shield, which turns every trip home into a refill as well as a payout. A
  panel in the corner keeps track of your weapon, the spice you're holding, your
  bank, HP and shield. There's also a worm meter that sits at 0% when you start.


  Out on the open sand there's a worm to worry about, though a status line under
  your bars offers the oddly calm reminder that the rock is safe ground.


  Back at base, a few stands hold gear, and one of them sits inside a shield
  bubble. The panel counts players against a cap of 20. The setting borrows from
  Dune, with lasgun and holtzman themes.
