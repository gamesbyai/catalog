slug: spice-jam
title: Spice Jam
tagline: Harvest spice in the desert, hunt rival harvesters, and outlast the worm.
description: >-
  Spice Jam is a Dune-inspired multiplayer shooter built around one loop. You
  roam the open sand collecting spice and haul it back to your base. Other
  players are harvesting too, so killing a rival harvester and taking what they
  gathered is always an option on the way home.


  The combat borrows lasgun and Holtzman shield ideas from the source material.
  The creator states it was built with Codex as a prototype, rendered in 3D with
  Three.js, and Vibe Jam 2026 put it 250th of 945.


  Then there is the worm. Staying out on the dunes pays in spice but leaves you
  exposed to other players and to the creature beneath the sand. Every trip
  comes down to when to push for more and when to head back.
