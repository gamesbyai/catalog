slug: deep-dive
title: Deep Dive
tagline: Walk a diver through an undersea lab and play mini games that explain
  how chatbots work.
description: >-
  You steer a diver across the sandy sea floor, through an airlock and into a
  lobby where Pip the robot says hello and beach balls are lying around to kick,
  then on down a hallway of lab rooms.


  Each room is built around its lesson, from a reef tank of token blocks to a
  kitchen for Robot Chef. Walk up to a room's glowing console and press E, and
  Pip gives a short explanation before a mini game puts the idea to work. The
  five core labs cover tokens, guessing the next word, a context window that
  holds 60 tokens, writing Robot Chef an exact prompt and spotting wrong facts
  Pip calls 99% sure.


  Clear all five and you get a Diver's License with every rule written on it.
  Three optional labs go further, into tools, the bias a model picks up from
  what it reads, and the things you should keep private.


  Two of the rooms turn the lesson's actual logic into hands-on 3D physics.


  In the Next Word Machine, balls fall into five tubes, each tagged with one of
  a tiny language model's top guesses, and the likeliest word's tube fills
  first. The Backpack turns each chat message into a block as long as its token
  count. Once the trough is full, the oldest block tumbles off the end, and you
  can actually watch a chat get forgotten.


  Press T to put on token goggles, and the station's signs, doors and console
  screens all break into colored chunks, cut up just as the tokenizer would read
  them. Even the Toolbox sign turns out to be two pieces, "Tool" and "box".


  If you'd rather skip the 3D, Map mode offers the same lessons laid out in a
  simple list, and it works with just a keyboard. Getting through everything
  takes about 20 minutes.
