slug: deep-dive
title: Deep Dive
tagline: Walk a diver through an undersea lab and play mini games that explain
  how chatbots work.
description: >-
  You guide a diver across the sea floor, through an airlock and into a lobby,
  then along a corridor of lab rooms. Each room holds a glowing console. Stand
  next to it and press E, and Pip the robot gives a short explanation before a
  mini game applies the idea.


  Five core labs cover tokens, next-word guessing, a 60-token context window,
  writing a precise prompt for Robot Chef, and catching false facts that Pip
  states with confidence. Finishing all five earns a Diver's License listing
  each rule. Three optional labs cover tools, bias from reading material, and
  private information.


  Two rooms use 3D physics. In the Next Word Machine, balls fall into five tubes
  labeled with a small language model's top guesses, and the likeliest word
  fills first. In the Backpack, each chat message becomes a block sized by token
  count, and the oldest block drops off once the trough is full.


  Press T to put on token goggles. Signs, doors and console screens then appear
  as colored chunks, split the way the tokenizer reads them. A Map mode offers
  the same lessons as a plain list with no 3D. A full playthrough takes about 20
  minutes.
