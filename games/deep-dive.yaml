slug: deep-dive
title: Deep Dive
tagline: Walk a diver through an undersea lab and play mini games that explain
  how chatbots work.
description: >-
  Deep Dive teaches kids ages 10 to 14 how AI chatbots work, one lab room at a
  time. You guide a diver along a corridor in an underwater research station,
  and at each glowing console Pip the robot explains one idea before a mini game
  lets you try it. A full run takes about 20 minutes.


  The lessons run real mechanisms at kid size. A tokenizer splits your words
  into chunks, a small language model trained in the browser guesses the next
  word, and a 60-token backpack drops old messages when it fills. Token goggles
  repaint every sign in the station as colored tokens.


  The creator made it solo for a hackathon. It needs no account and makes no
  live AI calls, and a map mode lists every lab without 3D, works with a
  keyboard alone and runs offline after loading. Five core labs earn a Diver's
  License, and three bonus labs cover tools, bias and privacy.
