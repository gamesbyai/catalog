slug: deep-dive
title: Deep Dive
tagline: Walk a diver through an undersea lab and play mini games that explain
  how chatbots work.
description: >-
  Steer a diver past Pip the robot through an undersea lab where each room
  teaches how chatbots work.


  Five core labs on tokens, next-word guessing, a 60-token context window, exact
  prompts for Robot Chef and spotting wrong facts. Three optional labs on tools,
  bias and privacy. The Next Word Machine, with balls falling into tubes for a
  model's top guesses. The Backpack, where old chat blocks tumble off as the
  context fills. A Diver's License at the end.


  Press E at a console for Pip's explanation and a mini game. Press T for token
  goggles that split signs into tokens. Use map mode for a keyboard-only list.


  Getting through everything takes about 20 minutes.
