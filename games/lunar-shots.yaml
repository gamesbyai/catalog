slug: lunar-shots
title: Lunar Shots
tagline: Build defenses and manage resources to survive aliens and meteors
  before impact.
description: >-
  Lunar Shots is an action tower-defense game set on the Moon. You defend your
  position against alien attackers and meteor showers while a final impact draws
  closer. Each run asks you to balance fighting with building up your economy,
  so spending choices matter as much as aim.


  The game mixes real-time action with tower-defense planning and resource
  management. Threats come from two directions, hostile aliens and falling
  meteors, which keeps you watching both your defenses and your income. The
  space theme draws on Artemis-style lunar exploration, with a playful nod to
  Nintendo-flavored arcade design. It runs in the browser using Three.js and is
  set up to work on mobile as well as desktop.


  The creator built it with the Gemini app as an entry in Vibe Jam 2026, where
  it placed 451st out of 945 entries in the final ranking.
