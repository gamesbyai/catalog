slug: lunar-shots
title: Lunar Shots
tagline: Build defenses and manage resources to survive aliens and meteors
  before impact.
description: >-
  Lunar Shots is tower defense on the Moon with a deadline. Alien attackers and
  meteor showers come at your position while a final impact draws closer, and
  you have to hold out by fighting and building at the same time. It mixes tower
  defense, action and survival, and it is played alone.


  The theme draws on Artemis-style lunar exploration. Its maker built it with
  the Gemini app.


  Real-time action sits on top of tower-defense planning and resource
  management. With threats coming from two directions, you keep an eye on your
  defenses and your income at once, and spending choices matter as much as your
  aim.
