slug: asteroid-ace
title: Asteroid Ace
tagline: Blast drifting asteroids and dodge hunter drones in escalating waves.
description: >-
  You fly a ship in a classic asteroid shooter, and you aim with the mouse while
  thrusting, strafing and firing. Rocks drift in clusters, and when you shoot
  one it shatters into fragments that are dangerous too, so a single shot can
  leave you with more to deal with.


  Asteroids aren't the only thing out there. Agile hunter drones come after you,
  and each new kind of enemy has its own way of moving and attacking. The waves
  keep coming, so you have to change how you fly as the threats change.


  The title screen shows a good spread of controls. You can thrust with W or the
  left mouse button, reverse with S, strafe with A and D, rotate with Q and E,
  and fire with Space. Shift boosts, right-click turns on auto, and Escape
  pauses.


  Two sliders on the start screen set speed and scale, both starting at 1.0x.
  There's also a graphics quality menu, which is handy if your machine
  struggles.


  Touch controls are on offer too, so you can play it on a phone with on-screen
  buttons.


  The creator built it entirely with a local model running on a laptop, because
  they wanted to see what that hardware could produce. The screen calls this
  version Asteroid Ace 3 Beta, which tells you it's an early build.
