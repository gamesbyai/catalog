slug: asteroid-ace
title: Asteroid Ace
tagline: Blast drifting asteroids and dodge hunter drones in escalating waves.
description: >-
  Asteroid Ace is a classic asteroid shooter in which you pilot a ship through
  successive waves of hazards. Slow-drifting asteroid clusters break apart into
  dangerous fragments when hit, so clearing space means managing an ever-growing
  spread of debris while staying clear of it.


  Agile hunter drones join the rocks and force quick adjustments. Each enemy
  type has its own movement pattern and attack style, and the danger climbs as
  waves progress. The mix of passive obstacles and active pursuers keeps the
  pace tense. It runs on mobile as well.


  The creator says the whole game was made with a local LLM, as an experiment to
  see what could be achieved on a laptop with a 5090 GPU, 24 GB of video memory
  and 32 GB of RAM. It was submitted to Vibe Jam 2026.
