slug: asteroid-ace
title: Asteroid Ace
tagline: Blast drifting asteroids and dodge hunter drones in escalating waves.
description: >-
  Every slow-drifting asteroid cluster you hit breaks into fragments, so one
  good shot can leave more rocks in your way than there were before it.


  It's a classic asteroid shooter where you're flying a ship that you can steer
  two ways. You can aim with the mouse and thrust with the left button, or
  rotate with Q and E while W thrusts, S reverses, A and D strafe and Space
  fires.


  The rocks don't stay alone for long. As the waves escalate, agile hunter
  drones show up alongside them. Paul Shroom describes each enemy type as having
  its own way of moving and attacking, which pushes you to change tactics
  between waves.


  There's even an auto mode you can toggle with a right-click, while Shift gives
  you a boost and Esc pauses.


  This version is called Asteroid Ace 3 Beta, and you can tune a few things
  before you launch. You can set the graphics quality and turn on on-screen
  controls for touch play. You can change the game's speed and scale, and both
  start at 1.0x.


  Paul Shroom built it with a local model running on an RTX 5090 laptop GPU with
  24GB of VRAM and 32GB of system RAM, just to see what that hardware could
  produce.
