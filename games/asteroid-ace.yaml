slug: asteroid-ace
title: Asteroid Ace
tagline: Blast drifting asteroids and dodge hunter drones in escalating waves.
description: >-
  You fly a ship in a classic asteroid shooter, aiming with the mouse or
  rotating with the keys, thrusting forward, strafing, reversing and firing.
  Slow-drifting asteroid clusters shatter into fragments when hit, so each shot
  can leave more rocks to dodge.


  Agile hunter drones join the asteroids as waves escalate. The creator
  describes each enemy type as having its own movement pattern and attack style,
  which pushes you to change tactics between waves.


  The start screen has a Graphics button for quality settings and a Touch button
  for on-screen controls. Two sliders adjust game speed and scale, both set to
  1.0x by default. A right-click toggles auto mode, Shift boosts, and Esc
  pauses.


  The creator built it with a local model on a laptop GPU, to test what that
  hardware could produce. The title screen labels this version Asteroid Ace 3
  Beta.
