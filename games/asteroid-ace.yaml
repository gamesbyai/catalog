slug: asteroid-ace
title: Asteroid Ace
tagline: Blast drifting asteroids and dodge hunter drones in escalating waves.
description: >-
  Each slow-drifting asteroid cluster you hit breaks into fragments, and one
  good shot can leave you with more rocks than before. This is a classic
  asteroid shooter where you fly a ship and shoot through the rocks.


  Waves of asteroids and enemies that grow more dangerous. Agile hunter drones
  that show up alongside the rocks. Each enemy type with its own way of moving
  and attacking, which pushes you to change tactics between waves, according to
  Paul Shroom.


  Steer one of two ways. Aim with the mouse and thrust with the left button, or
  rotate with Q and E. Use W to thrust, S to reverse, A and D to strafe, and
  Space to fire. Right-click to toggle auto mode, and press Shift to boost.
  Press Esc to pause. For touch play, turn on the on-screen controls.


  This version is called Asteroid Ace 3 Beta. Paul Shroom built it with a local
  model running on an RTX 5090 laptop GPU with 24GB of VRAM and 32GB of system
  RAM, just to see what that hardware could produce.
