slug: asteroid-ace
title: Asteroid Ace
tagline: Blast drifting asteroids and dodge hunter drones in escalating waves.
description: >-
  Asteroid Ace is a classic asteroid shooter played in escalating waves. You
  pilot a ship through slow-drifting asteroid clusters that break into dangerous
  fragments when hit, so every hit adds to the debris you then have to stay
  clear of.


  The creator says the whole game was made with a local LLM. The experiment was
  to see what one laptop could do: a 5090 GPU, 24 GB of video memory and 32 GB
  of RAM. It finished 404th of the 945 entries at Vibe Jam 2026.


  Agile hunter drones join the rocks and force quick changes of course. Each
  enemy type has its own movement pattern and attack style, and the danger
  climbs from wave to wave, with passive obstacles and active pursuers on screen
  together.
