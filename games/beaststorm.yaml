slug: beaststorm
title: Beaststorm
tagline: Scout, expand, and command beast armies to destroy the enemy sanctuary.
description: >-
  A match of Beaststorm ends when one side's sanctuary falls. To get there, you
  scout the map, expand your territory, harvest resources and build up an army
  of beasts, then command it against the other commander.


  It is a lightweight fantasy real-time strategy game, built with Codex and
  played in 3D, with online multiplayer support, and it works on phones too. The
  factions are beasts, so your forces are creatures instead of the usual
  soldiers, and each match is a contest between commanders. It ranked 288th of
  945 at Vibe Jam 2026.


  The scouting, expansion and economy loop is the one associated with Age of
  Empires II, in a smaller package with a quick, stripped-down pace. All of it
  builds toward one target: the enemy sanctuary, destroyed before yours goes
  down.
