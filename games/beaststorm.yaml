slug: beaststorm
title: Beaststorm
tagline: Scout, expand, and command beast armies to destroy the enemy sanctuary.
description: >-
  Beaststorm is a lightweight fantasy real-time strategy game. You scout the
  map, expand your territory, and harvest resources to build up your forces.
  Each run is a contest between commanders, and it ends when one side's
  sanctuary is destroyed.


  The game centers on beast factions, so your army is made up of creatures
  instead of typical soldiers. It aims for the pace of a quick, stripped-down
  RTS, with the scouting, expansion, and economy loop associated with Age of
  Empires II but in a smaller package. It runs in the browser in 3D, supports
  multiplayer, and works on mobile.


  According to the listing, the creator built it with Codex. It was entered in
  Vibe Jam 2026, where it placed 288th out of 945 entries, and it is playable in
  a browser.
