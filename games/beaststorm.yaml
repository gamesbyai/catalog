slug: beaststorm
title: Beaststorm
tagline: Scout, expand, and command beast armies to destroy the enemy sanctuary.
description: >-
  Beaststorm pits you against another commander in a fast, lightweight fantasy
  real-time strategy match. A match ends when one side's sanctuary falls.


  Beast factions, with creatures rather than soldiers as your forces. An army of
  beasts you build up and command. Online multiplayer support. Scouting,
  expansion and resource harvesting, the economy loop associated with Age of
  Empires II in a smaller package with a quick, stripped-down pace.
