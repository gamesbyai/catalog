slug: news-ninja
title: News Ninja
tagline: Slice real headlines as they fly past and let the satirical ones go by.
description: >-
  News Ninja is an arcade slicing game in the spirit of Fruit Ninja, with
  headlines instead of fruit. They are tossed across the screen, and you cut
  through the true ones while letting the satirical ones go by.


  The creator says they loved Fruit Ninja as a child, and that inspiration shows
  in the core mechanic. It went into Vibe Jam 2026, and it mixes arcade reflexes
  with trivia.


  The difference is that every target is a piece of text instead of a piece of
  fruit, so each throw asks for a quick read before the cut. That turns a reflex
  game into a light test of judgment about what is real and what is a joke, and
  a run lasts as long as you can keep up.
