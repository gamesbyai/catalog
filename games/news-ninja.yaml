slug: news-ninja
title: News Ninja
tagline: Slice real headlines as they fly past and let the satirical ones go by.
description: >-
  News Ninja is an arcade slicing game in the spirit of Fruit Ninja. Headlines
  are tossed across the screen, and the player cuts through the true ones while
  avoiding the satirical ones. The goal is to keep the headlines from dropping,
  so a run lasts as long as the player can keep up.


  The twist on the slicing formula is that every target is a piece of text. Each
  throw asks for a quick read of the headline before the cut, which turns a
  reflex game into a light test of judgment about what is real and what is a
  joke.


  The game was entered in Vibe Jam 2026. The creator says they loved Fruit Ninja
  as a child, and that inspiration shows in the core mechanic.
