slug: rummy-ombesh
title: Rummy - Ombesh
tagline: Build melds and race for bonuses in a rummy variant driven by one flipped card
description: >-
  In Rummy - Ombesh, one card is flipped over at the start of each round. That
  card, called the Taba, decides which card counts as wild and changes what
  scores. Because the Taba changes, the same hand can play very differently from
  one round to the next.


  Sets and runs as the building blocks of each hand. A race for the round's
  bonuses. Finishing ahead of the other players as the goal.


  The creator learned this family variant from their father. According to the
  creator, they made the game to preserve the variant and share it with more
  people.
