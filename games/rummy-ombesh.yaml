slug: rummy-ombesh
title: Rummy - Ombesh
tagline: Build melds and race for bonuses in a rummy variant driven by one flipped card
description: >-
  One flipped card changes each round of Ombesh. Rummy - Ombesh is a rummy
  variant built around the Taba, a single card turned over at the start of each
  round that decides which card counts as wild and changes what scores.


  The rules are a family variant the creator learned from their father, and they
  say they made the game to preserve it and share it with more people. It was
  built in Unity with Claude Code, Codex, and Cursor, and it supports online
  multiplayer.


  You still build sets and runs and try to finish ahead of the other players,
  but each hand turns into a race for that round's bonuses. Because the Taba
  changes, the same hand can play very differently from one round to the next.
