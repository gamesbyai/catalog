slug: pro-skater-the-warehouse
title: "Pro Skater: The Warehouse"
tagline: Skate a two-minute run through a warehouse park, chaining tricks and
  hitting goals.
description: >-
  Pro Skater: The Warehouse is a Tony Hawk's Pro Skater-style skateboarding game
  set in an original park inspired by the first game's Warehouse. Each run lasts
  two minutes. You push around the park, ollie, flip, grab and grind rails,
  ledges, coping and rafters, and chain tricks into combos scored by the sum of
  trick points times the number of tricks.


  Five goals run alongside the score: reach 25,000 points, collect the letters
  S-K-A-T-E, find a secret tape behind a boarded-up wall, grind the rafters, and
  break five windows. Landed combos fill a special meter that unlocks a
  signature trick, while bails turn the skater into a ragdoll who then gets back
  up. A second level, Eastside Baths, and a skater builder with male and female
  options are included.


  The creator says every 3D asset, from the skater to the props, is generated by
  Python scripts in Blender and exported as GLB files, and all sound is
  synthesized in code at startup. The game runs in Godot with GDScript and has a
  web export as well as a Windows build.
