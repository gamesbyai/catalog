slug: pro-skater-the-warehouse
title: "Pro Skater: The Warehouse"
tagline: Skate a two-minute run through a warehouse park, chaining tricks and
  hitting goals.
description: >-
  Pro Skater: The Warehouse has you chaining flips, grabs, grinds and manuals
  around a 1990s-style skate hall before a two-minute timer runs out. A combo
  scores its trick points added together, then multiplied by how many tricks are
  in it, so long strings pay off. Manuals bridge your air tricks and grinds,
  which keeps a string alive between obstacles.


  Repeat the same trick inside one combo and it earns less each time.


  Landing banks the combo. Bail and you lose it, the special meter empties, and
  your skater flops like a ragdoll before standing up and rolling on.


  Landed combos fill that meter, and once it's full you can throw the Tiger Claw
  Tre for 3,000 points. It's a trick the creator invented, a double 360 flip
  with a spread-eagle pose, which is a nice touch in a game modeled so openly on
  Tony Hawk.


  Five goals sit in the top right corner of the screen while you skate.


  You're after 25,000 points, the letters S-K-A-T-E, the secret tape, a grind on
  the rafters, and five broken windows. The tape's in a room behind the
  boarded-up wall, and the windows break from vert airs off the east quarterpipe
  or from grinding the wall pipe under them.


  There's a second park too, Eastside Baths, an emptied 1930s swimming hall you
  reach from the level select. On the skater screen you can switch between a
  male and a female skater and change their clothes.
