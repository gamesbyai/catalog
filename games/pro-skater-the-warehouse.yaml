slug: pro-skater-the-warehouse
title: "Pro Skater: The Warehouse"
tagline: Skate a two-minute run through a warehouse park, chaining tricks and
  hitting goals.
description: >-
  Pro Skater: The Warehouse lets you skate an original park that nods to the
  Warehouse level in the first game of the Tony Hawk's Pro Skater series. You
  push, ollie, flip and grind through two-minute runs, chaining tricks into
  combos and chasing five goals. Landed combos fill the special meter, and a
  full meter unlocks a signature trick.


  Rails, ledges, coping to grind. Summed trick points times trick count.
  Repeated tricks in one combo, scored down to 10 percent. Tiger Claw Tre, an
  original 3,000-point spread-eagle double 360 flip caught into a tweaked indy.
  Eastside Baths, a second park in a drained 1930s pool hall. Male or female
  skater builder, with clothing. 25,000 points, S-K-A-T-E letters hidden around
  the park, a secret tape behind a boarded-up wall, rafter grind, five windows
  to break.


  Steer with WASD or the arrow keys. Hold Space to crouch, then release to
  ollie. Use J, K or L with a direction for flips, grabs and grinds. Land a
  combo to bank it. A bail loses the combo and empties the special meter. Then
  get back up and ride on. Once the meter is full, press Left, Right and J.
  Finish goals in each run; the game saves the ones you complete.


  According to 3D Stories, every 3D asset, from the skater to the props, is
  generated by Python scripts in Blender and exported as GLB files. All sound is
  synthesized in code when the game starts. Besides the web version, a Windows
  build is available too.
