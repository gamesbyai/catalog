slug: pro-skater-the-warehouse
title: "Pro Skater: The Warehouse"
tagline: Skate a two-minute run through a warehouse park, chaining tricks and
  hitting goals.
description: >-
  Pro Skater: The Warehouse has you pushing, ollieing and flipping around an
  original park built as a nod to the Warehouse from the first Tony Hawk's Pro
  Skater. You grab, and you grind rails, ledges, coping and even the rafters
  overhead. Tricks chain into combos, and each combo is scored by adding up the
  points of its tricks and then multiplying that by how many tricks it holds.


  Landing banks the combo, but a bail throws the whole thing away and empties
  your special meter while the skater goes limp as a ragdoll before getting back
  up and riding on.


  Every run lasts two minutes, with five goals ticking along beside the score in
  the corner of the screen, and the game kindly saves the ones you finish.
  You're chasing 25,000 points, the S-K-A-T-E letters hidden around the park, a
  secret tape behind a boarded-up wall, a grind along the rafters and five
  broken windows.


  Landed combos fill that special meter, and once it's full you unlock a
  signature trick. It's the Tiger Claw Tre, a surprisingly over-the-top original
  move worth 3,000 points where the skater does a double 360 flip in a
  spread-eagle pose and catches it into a tweaked indy. Repeat the same trick
  inside one combo and it's worth less each time, dropping from full points all
  the way to a measly 10 percent.


  Beyond the Warehouse there's a full second park, Eastside Baths, set in a
  drained 1930s pool hall, which is a pretty fitting place to skate, plus a
  skater builder for picking a male or female skater and their clothes.


  According to 3D Stories, every 3D asset, from the skater to the props, is
  generated by Python scripts in Blender and exported as GLB files, while all
  the sound is synthesized in code when the game starts. It comes as a web
  export and a Windows build.
