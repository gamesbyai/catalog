slug: pro-skater-the-warehouse
title: "Pro Skater: The Warehouse"
tagline: Skate a two-minute run through a warehouse park, chaining tricks and
  hitting goals.
description: >-
  Pro Skater: The Warehouse is a Tony Hawk's Pro Skater-style skateboarding game
  set in an original park inspired by the first game's Warehouse. Each run lasts
  two minutes. You push around, ollie, flip, grab and grind rails, ledges,
  coping and rafters, and chain tricks into combos scored by the sum of trick
  points times the number of tricks.


  The creator says every 3D asset, from the skater to the props, is generated by
  Python scripts in Blender and exported as GLB files, and all sound is
  synthesized in code at startup. It runs in Godot with GDScript, in a web
  export and a Windows build. A second level, Eastside Baths, and a skater
  builder with male and female options are included.


  Five goals run alongside the score: reach 25,000 points, collect S-K-A-T-E,
  find a secret tape behind a boarded-up wall, grind the rafters and break five
  windows. Landed combos fill a special meter that unlocks a signature trick,
  and a bail turns the skater into a ragdoll who then gets back up.
