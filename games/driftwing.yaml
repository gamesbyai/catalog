slug: driftwing
title: Driftwing
tagline: Glide a low-poly plane over endless procedural lands with a talking copilot.
description: >-
  Driftwing is an ambient flight game that runs in the browser. You pilot a
  low-poly glider over an endless procedural world at golden hour. There is no
  fail state, no fuel and no enemies, so a session is simply flying, exploring
  and taking in the scenery, with optional ring courses for a small goal.


  A copilot named WREN rides along and responds to typed or spoken commands. It
  can set waypoints, fly the plane, change the time of day or start a ring
  course. The terrain blends snow peaks, pine valleys, dunes, islands and
  meadows, with a day and night cycle, aurora, bird flocks and landmarks logged
  in a per-seed journal. Every world comes from a seed shared through the URL,
  and a photo mode is included.


  According to the repository, the game is a single-shot prompt test of Claude
  Opus 5.5, built in Claude Code from one prompt with no human code edits. It is
  one index.html file using three.js with WebGPU and a WebGL2 fallback.
