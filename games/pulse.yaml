slug: pulse
title: PULSE
tagline: Shoot through arcade-style waves and build a stronger ship with
  roguelike upgrades.
description: >-
  PULSE is a shoot-'em-up that pairs old-school arcade action with roguelike
  progression. The player pilots a ship through enemy waves, firing and dodging,
  while a run builds up over time through the kind of choices found in
  deck-building and dungeon-crawling roguelikes.


  The concept comes from two clear influences: classic shmups on one side, and
  roguelikes such as Hades and Slay the Spire on the other. The creator
  describes the project as a combination of the two, so each run is meant to
  feel like a fast arcade session shaped by the upgrades picked along the way.


  It was entered in Vibe Jam 2026, where it placed 641st out of 945 entries. The
  creator lists Cursor among the tools used and Unity as the engine.
