slug: cursor-bug-detective
title: Cursor Bug Detective
tagline: Scan props on a 3D desk, decode cipher clues, and name the bug in 90 seconds
description: >-
  Play the Cursor mascot as a tiny detective, searching a developer's desk for
  clues to one new bug every day.


  Rounds of about 90 seconds. Cipher clues in the monitor, the envelope, the
  agents tray and the lamp. Four mini-puzzles for cracking them, one styled like
  an editor's autocomplete. A daily case in the spirit of Wordle.


  Hover across the desk to spot what looks off, then open each prop for its
  clue. Name the bug once the evidence adds up.


  casper_chsieh built the desk by hand and wanted to give the mascot a story
  bigger than a logo.
