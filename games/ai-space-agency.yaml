slug: ai-space-agency
title: AI Space Agency
tagline: Build and launch an AI data center into orbit in a space-agency simulation.
description: >-
  You fly a rocket off a launch pad beside a tall red gantry tower, with the
  throttle bar on the left already reading 100%. Along the top, readouts show
  your altitude above sea level, vertical speed, surface speed and G load while
  you climb.


  The creator pitches it as Kerbal Space Program for building an AI data center
  in space.


  The big button at the bottom center says Stage while you're on the first
  stage. Once the second stage is up, the same button is labeled Fairing, so one
  spot on the screen does two jobs, which keeps the layout tidy.


  A Reset button sits right beside it, in easy reach of the staging button.


  Under the round attitude ball there are SAS and RCS toggles, and a row of
  autopilot options marked Off, Up and Orbit. Heading, pitch and roll numbers
  sit next to the ball.


  Everything is drawn like a mission console, with glowing orange wireframe on
  black, a gridded ground and the tower in red outlines. A time-warp control at
  the top left starts at x1, and a little music player in the corner is playing
  a track called Orbit Bloom, which is a nice touch for a launch screen.
