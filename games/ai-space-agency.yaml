slug: ai-space-agency
title: AI Space Agency
tagline: Build and launch an AI data center into orbit in a space-agency simulation.
description: >-
  AI Space Agency is a browser simulation about putting an AI data center into
  space. The creator compares it to Kerbal Space Program, so a run centers on
  assembling space hardware and sending it beyond the atmosphere, with the
  orbiting data center as the goal of the mission.


  The premise ties spaceflight to the computing infrastructure behind modern AI,
  which gives the familiar rocket-building idea a different purpose than
  exploring planets. It is rendered in 3D with Three.js and is set up to work on
  mobile devices as well as desktop browsers, so it opens without an install.


  It was entered in Vibe Jam 2026, where it placed 64th out of 945 entries. The
  creator built it with Cursor.
