slug: ai-space-agency
title: AI Space Agency
tagline: Build and launch an AI data center into orbit in a space-agency simulation.
description: >-
  Build your own AI data center in space, with a rocket you fly.


  Rocket stages, with a fairing button that takes over at the second stage.
  Engine thrust, set on a throttle slider. SAS and RCS toggles. Off, up and
  orbit auto modes.


  Use the main button to stage your rocket. Press Reset to go back to the start
  of the flight.


  dom_scholz describes it as Kerbal Space Program, except for what you build up
  there. The creator also slips in a joke about Cursor making a deal with
  SpaceX.
