slug: ai-space-agency
title: AI Space Agency
tagline: Build and launch an AI data center into orbit in a space-agency simulation.
description: >-
  A launch begins on a pad beside a red wireframe gantry, with a slim rocket
  standing on an orange grid under a black sky. A vertical throttle slider on
  the left reads 100%, and the top bar tracks sea-level altitude, vertical
  speed, surface speed and G load as the rocket climbs.


  A navball at bottom center shows attitude, with heading, pitch and roll
  readouts beside it. SAS and RCS toggles sit on the ball, and an auto row
  offers off, up and orbit settings. The main button stages the rocket and
  becomes a fairing button on the second stage. Reset restarts the flight, and a
  time warp bar sits at top left.


  The creator pitches it as Kerbal Space Program for building an AI data center
  in space. A small music player in the corner plays a track titled Orbit Bloom.
