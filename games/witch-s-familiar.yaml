slug: witch-s-familiar
title: Witch's Familiar
tagline: Feed, brush, and enchant a magical cat before midnight to shape its
  ritual form.
description: >-
  Witch's Familiar is a first-person cozy game set in a witch's tower room over
  a single night. You care for a magical cat by feeding it, brushing it, playing
  with it, comforting it, and enchanting it. Before the moon reaches midnight,
  you prepare the ritual space and carry your familiar to the circle.


  Everything happens through your wand, which levitates care items and ritual
  ingredients around the room. Three needs guide your choices: hunger,
  affection, and magic. Too much enchantment makes the cat unstable. Depending
  on how you treat it, the familiar ends up cozy, arcane, or mischievous, and
  the ritual reveals which bond you built.


  The creator developed it in Unity for AI Browser Game Jam 3 as a short,
  tutorialized vertical slice. According to the credits, ChatGPT handled
  planning and documentation, Codex handled programming, GPT Image 2 made 2D
  images, Meshy made 3D models, Eleven Labs and Kenney supplied sound effects,
  and Suno made the music.
