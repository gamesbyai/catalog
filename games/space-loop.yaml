slug: space-loop
title: Space Loop
tagline: Pilot a ship through procedural solar systems, blast rocks, trade, and
  fuse upgrades.
description: >-
  Space Loop is a browser-based 3D space roguelite. Each run sends you in a
  small ship through a procedurally generated solar system, where you shoot
  asteroids, fight alien convoys, and stop at merchant planets to trade. What
  you collect feeds back into your ship, so every trip through the loop leaves
  you a bit stronger.


  Upgrades come from fusing colored modules, which gives progression across runs
  a puzzle-like layer on top of the shooting. The creator drew on Asteroids on
  the Atari, one of the first games they played as a kid, and aimed to keep that
  tense arcade feeling of dodging incoming rocks while building a larger 3D
  universe around it.


  The game runs in the browser using Three.js and supports mobile devices. The
  creator states it was built with Claude Code. It placed 208th out of 945
  entries in Vibe Jam 2026.
