slug: ranger-danger
title: Ranger Danger
tagline: Defend your base by placing defenses and fighting enemies yourself in
  pixel-art combat.
description: >-
  Ranger Danger is tower defense where you do not just place things and sit back
  to watch. You set up defenses around your base and then step into the
  pixel-art fight yourself, holding off incoming enemies with real-time action
  combat and strategic planning at once.


  The creator picked this loop as the most fun among several one-shot ideas they
  tried. Claude Code and Phaser were the tools, the result ranked 389th of 945
  at Vibe Jam 2026, and it plays on phones too.


  Tower defense usually leaves you waiting between decisions, while action games
  lean on reflexes. Here the two are combined, so you are always choosing
  between building up the defense and stepping in to fight yourself. It is a
  single-player game, drawn in pixel art.
