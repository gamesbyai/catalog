slug: ranger-danger
title: Ranger Danger
tagline: Defend your base by placing defenses and fighting enemies yourself in
  pixel-art combat.
description: >-
  You play a ranger who builds towers and walls to block the paths the enemies
  take, and you also fight them yourself. So you're not just placing defenses
  and watching, because your ranger attacks directly. That makes where you stand
  matter about as much as where you build.


  The enemies come at you wave after wave, and the waves run through different
  biomes, from lush forests to volcanic wastes and beyond. Epic bosses are in
  the mix too.


  You earn gold along the way, and it's what pays for upgrades that make your
  ranger stronger.


  It's all pixel art, with a small green-clad ranger and a stone tower with a
  red flag on the title screen. The intro says position and timing both matter,
  which makes sense when you're building and brawling at the same time.


  Building and fighting share the same job here, which is a neat trick.


  The creator tried a few one-shot prompts before settling on this one, because
  its mix of tower defense and action had the most fun game loop of the bunch.
