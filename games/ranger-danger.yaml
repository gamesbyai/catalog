slug: ranger-danger
title: Ranger Danger
tagline: Defend your base by placing defenses and fighting enemies yourself in
  pixel-art combat.
description: >-
  Set up defenses around your base, then walk your ranger into the fight and
  attack the enemies yourself.


  Tower defense and real-time combat at once. Walls for blocking the horde's
  paths. Waves of enemies, some with bosses. Gold for unlocking upgrades. Biomes
  from lush forests to volcanic wastes and beyond.


  ZakAgain tried a handful of one-shot idea prompts and kept the loop they found
  most fun.
