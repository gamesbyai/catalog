slug: ranger-danger
title: Ranger Danger
tagline: Defend your base by placing defenses and fighting enemies yourself in
  pixel-art combat.
description: >-
  Your ranger in Ranger Danger doesn't just stand behind the towers and watch.
  You set up defenses around your base, then walk the ranger straight into the
  pixel-art fight and attack enemies yourself. It's tower defense and real-time
  action combat at the same time, with the planning and the fighting happening
  together.


  Building covers more than towers, and there's a clever extra in the walls you
  can put down to block the paths the horde takes. The game is pretty blunt
  about what counts: where you stand and when you act.


  Tower defense usually leaves you waiting between decisions while action games
  lean on reflexes, but here you're always choosing between building up the
  defense and wading in with your own weapon.


  The enemies keep coming in wave after wave, and some of those fights bring
  bosses. Along the way you earn gold that goes toward unlocking upgrades and
  making yourself stronger. The setting moves through several biomes too,
  starting in lush forests and stretching out to volcanic wastes and beyond.


  ZakAgain tried a handful of one-shot idea prompts before settling on this one.
  Out of all of them, this was the loop they found most fun, so they stuck with
  it.
