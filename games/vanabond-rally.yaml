slug: vanabond-rally
title: Vanabond Rally
tagline: Drive a vagabond's car down an open road, covering as many kilometers
  as you can.
description: >-
  Vanabond Rally casts you as a vagabond behind the wheel on an open road. The
  goal is simple: cover as many kilometers as possible before the run ends. It
  is presented as a platformer, so the road works like a course to be traversed
  rather than a plain straight track.


  The standout choice is the restrained input scheme. The whole experience of
  driving is boiled down to just three buttons, which keeps the game easy to
  pick up and suits quick attempts at beating a distance. It also runs on mobile
  devices.


  The game was an entry in Vibe Jam 2026. The creator says they enjoy driving on
  the open road and wanted to capture that feeling in a platformer. It is built
  in Three.js, and the creator's submission points to Gemini as the AI tool
  used.
