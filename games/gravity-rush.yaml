slug: gravity-rush
title: Gravity Rush
tagline: Flip gravity to run, jump, and collect crystals through endless
  generated levels.
description: >-
  One button flips gravity, and each press switches which way is down. You guide
  a cube across platforms, collecting yellow crystals and avoiding pink
  pyramids.


  Collecting every crystal in each level, five of them on Level 1. Procedurally
  generated levels that continue without a stated end, and hazards that escalate
  as you advance. Movement along a side-view line.


  TheMananJain cites VVVVVV and momentum-based platformers as inspiration.
