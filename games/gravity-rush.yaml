slug: gravity-rush
title: Gravity Rush
tagline: Flip gravity to run, jump, and collect crystals through endless
  generated levels.
description: >-
  Gravity Rush is an arcade platformer with one mechanic, and it is flipping
  gravity. You guide a character through levels by switching between floor and
  ceiling, which is how you cross gaps, dodge hazards and gather crystals. A run
  lasts for as long as you can survive the obstacles ahead.


  The levels are procedurally generated and endless. With only one action to
  master, the difficulty comes from how they are laid out and from hazards that
  grow more dangerous as the run goes on. Timing and momentum decide how far you
  get.


  The creator cites classic gravity-flipping games such as VVVVVV as the
  inspiration. It was a Vibe Jam 2026 entry, made in Antigravity and rendered
  with Three.js, and it plays on phones as well.
