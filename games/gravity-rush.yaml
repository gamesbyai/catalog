slug: gravity-rush
title: Gravity Rush
tagline: Flip gravity to run, jump, and collect crystals through endless
  generated levels.
description: >-
  One button flips gravity. You steer a small teal cube left and right along
  floating light-blue platforms, and pressing the flip key switches which way is
  down. Yellow crystals sit on and around the platforms, and the first screen
  shows a pink pyramid hazard floating nearby.


  Each level asks you to collect every crystal and dodge the hazards. A counter
  in the top left starts at 0/5 on level 1, next to a level label. The top right
  shows three hearts and a score counter.


  Levels are procedurally generated and continue without a stated end, with
  hazards that escalate as you advance. A glowing ring labeled as a portal sits
  near the start. The creator cites VVVVVV and momentum-based platformers as
  inspiration.


  The scene is rendered in 3D with soft, pale colors and a fogged background,
  while movement stays on a side-view line. A short on-screen prompt at the
  start lists the controls.
