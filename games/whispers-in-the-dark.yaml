slug: whispers-in-the-dark
title: Whispers in the Dark
tagline: Read the story, type your choices, and steer an AI-narrated text adventure.
description: >-
  Whispers in the Dark is a text adventure in which an AI acts as the narrator.
  The player reads each passage of the unfolding story and responds with
  actions, and the story continues based on those decisions. A session is a
  chain of text exchanges rather than a fixed set of levels.


  The story is generated as you play, so the path through the setting depends on
  what you choose to do. The presentation is built around words instead of
  graphics, which keeps attention on the narration and on the dark, mysterious
  mood suggested by the title.


  The creator's repository tags point to Codex and Gemini as the tools behind
  the project, and it is labeled as vibe-coded. The creator built it with those
  AI assistants, and the game itself uses AI to drive its storytelling.
