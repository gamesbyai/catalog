slug: relativityx
title: RelativityX
tagline: Fly a near-light-speed spacecraft through the solar system and watch
  time stretch.
description: >-
  Fly a spacecraft through a 3D solar system with the keyboard, switching
  between six speed modes that start at subsonic and climb toward light speed.


  You can compare time on Earth with time on your ship. At low speed they read
  the same. Accelerate and watch them drift apart. Planets can be clicked to
  read facts about them.


  You can follow the route to the portal, or press Jump to Black Hole to skip
  the trip. Snap Back returns you to the solar system. Reaching the portal sends
  you out into a webring of other games.


  There's also a Free Camera option. The creator built it after watching
  Interstellar, wanting players to experience time dilation themselves.
