slug: relativityx
title: RelativityX
tagline: Fly a near-light-speed spacecraft through the solar system and watch
  time stretch.
description: >-
  Fly a spacecraft through a 3D solar system with the keyboard, switching
  between six speed modes that start at subsonic and climb toward light speed.
  On-screen panels show velocity as a percentage of light speed, the Lorentz
  factor, and your XYZ coordinates.


  A time dilation panel runs two clocks, one for Earth and one for the ship. At
  low speed they read the same. Accelerate and watch them drift apart. Planets
  can be clicked to read facts about them.


  A solar map marks your position and the black-hole portal, with the flat
  distance to it and your range to the black hole. Follow the cyan route to the
  portal, or press Jump to Black Hole to skip the trip. Snap Back returns you to
  the solar system. Reaching the portal sends you out into a webring of other
  games.


  Stop, Pause, Reset and Free Camera buttons sit on screen. The creator built it
  after watching Interstellar, wanting players to experience time dilation
  themselves.
