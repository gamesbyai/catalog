slug: relativityx
title: RelativityX
tagline: Fly a near-light-speed spacecraft through the solar system and watch
  time stretch.
description: >-
  RelativityX puts you at the controls of a relativistic spacecraft and lets you
  watch time stretch. You fly through the solar system from planet to planet,
  and the trip ends at a black-hole portal that carries the ship out into the
  Vibe Jam webring.


  In the creator's telling, the project grew out of seeing Interstellar for the
  first time and wanting Einstein's relativity to feel understandable and
  emotional. It was built in Three.js with Codex.


  Time dilation is the point. As the ship nears the speed of light, time runs
  differently for the traveler, and you see the effect firsthand instead of
  reading about it in a textbook. Clicking a world brings up short facts about
  it, a light educational layer on the way.
