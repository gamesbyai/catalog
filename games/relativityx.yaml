slug: relativityx
title: RelativityX
tagline: Fly a near-light-speed spacecraft through the solar system and watch
  time stretch.
description: >-
  RelativityX is a space flight simulator set in the solar system. The player
  pilots a relativistic spacecraft, moving from planet to planet and clicking on
  worlds to read short facts about them. The goal is to reach a black-hole
  portal that carries the ship out into the Vibe Jam webring.


  The main idea is time dilation. As the ship approaches the speed of light,
  time behaves differently for the traveler, and the player sees that effect
  firsthand instead of reading about it in a textbook. The planet facts add a
  light educational layer to the trip.


  The creator says the project grew out of seeing Interstellar for the first
  time and wanting to make Einstein's relativity feel understandable and
  emotional. They built it in Three.js with Codex, as an entry in Vibe Jam 2026.
