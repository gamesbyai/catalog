slug: casadegema
title: Casadegema
tagline: Water a bare courtyard and find hidden gems through a full watercolor year.
description: >-
  You wake a sleepy garden and move through a full year, from spring to winter,
  in about 10 to 15 minutes. You start in a bare whitewashed courtyard with a
  watering can, a chalkboard easel and a girl standing by the front door.


  Five hidden gems per season, each one flying to the counter when found. Each
  season's tasks, like shaking petals loose, watering pots, popping a balloon
  with a twig, raking leaves, making it rain, building a snowman and writing a
  name in chalk. Oli the owl on the tower roof, commenting on what you do. Teddy
  bear peeking out now and then, revealing every gem not yet found. Closing
  message rising from the chimney after the last winter gem.


  Pick up the watering can. Water the tree bed with it, and a bougainvillea
  grows. Tap and drag to move around the house and find the gems. For more help,
  tap the alarm clock to ring it early, and a feather flies toward the next gem.
  Tap Oli when you want a hint. Tap the teddy bear before he ducks back. Tap the
  speaker on the table to switch the music on.


  Put a name in the link, and the easel and closing message show it from the
  start. Add summer, autumn or winter to the link as a season setting, and it
  starts you later in the year, with the earlier seasons already done. On a
  phone, touch works, and taps snap to whatever is closest that you can use.
  Press Esc to put down whatever you're holding.


  Deepak Jain built the whole project through conversation with an AI, as a gift
  for Daughter's Day. The code was never written by hand. The watercolor art is
  coded on a Canvas with no image files, and the music is created live.
