slug: casadegema
title: Casadegema
tagline: Water a bare courtyard and find hidden gems through a full watercolor year.
description: >-
  You're the one who wakes up a sleepy garden, starting in a bare whitewashed
  courtyard with a watering can, a chalkboard easel and a girl standing by the
  front door.


  Grab the can and water the tree bed, and a bougainvillea grows out of it.
  After that you tap and drag your way around the house to find five hidden gems
  each season, and every gem you find flies up to a counter in the top-left
  corner.


  The year moves from spring to summer, autumn and winter, and every season has
  its own tasks. In spring you tap a speaker, shake a tree branch until its
  petals fall and water the pots. Later you'll pop a balloon with a twig, rake
  leaves, make it rain, build a snowman and write a name in chalk, which is a
  lot of business for one small courtyard.


  Oli the owl sits on the tower roof and comments on what you're doing, and you
  can tap him for a hint.


  If you need more help, tap the alarm clock and a feather heads toward your
  next gem. Oddly enough, a teddy bear also peeks out from behind the house now
  and then, and if you catch him he reveals every gem you haven't found yet.
  When you find the last winter gem, a message floats up from the chimney, a
  fitting finish for a game made as a Daughter's Day gift.


  A full year takes about 10 to 15 minutes. All the watercolor art is drawn in
  code on a canvas without a single image file, and the music is generated live
  but stays silent until you tap the speaker.


  There's a clever personal touch in the link too, because adding a name there
  writes it on the easel and in the final message ahead of time, while a season
  setting starts you later in the year. On a phone it works with touch, and your
  taps snap to the nearest thing you can use.


  Deepak Jain built the whole thing by talking with an AI, and none of the code
  was written by hand.
