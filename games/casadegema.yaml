slug: casadegema
title: Casadegema
tagline: Water a bare courtyard and find hidden gems through a full watercolor year.
description: >-
  You start in a bare, whitewashed Spanish courtyard with a watering can at your
  feet, and you tap, shake and sweep things until hidden gems pop out. Water the
  tree bed first and a bougainvillea grows, which gets the garden going.


  Every season hides five gems, and each one flies to the counter in the
  top-left when you find it. In spring you shake a branch until the petals fall,
  water every pot, and tap the paint palette to recolor your butterfly cursor.
  Summer has you pop a girl's balloon with a twig and shake a kite loose from
  the tree.


  Autumn hands you a rake for the fallen leaves, and if you turn both lanterns
  off, night comes and Oli the owl flies a loop around the tree. Winter has you
  roll a snowman, tap the cold chimney so smoke rises, and chalk a name onto the
  board.


  One gem each season is a little visitor hiding in a blue flower pot on the
  tower wall, and it's a different pot every time. Tapping a pot only puffs out
  petals, so you have to find that season's particular action.


  Oli narrates from the tower roof, and tapping him gets you a hint.


  If you're really stuck, there are two more helpers. An alarm clock at the
  corner of the house rings every so often and sends a feather flying toward
  your next gem, and you can tap the clock to ring it early.


  A teddy bear also peeks out from behind the house now and then. If you catch
  him before he ducks away, he shows you every gem still hidden that season,
  which is a considerate way to keep a gem hunt from stalling.


  When a season's five gems are in, Oli says goodbye and the next one rolls in
  on its own element: a rising sun, a gust of leaves, a snowfall. Find the last
  winter gem and a message floats up out of the chimney letter by letter, hearts
  and all.


  It began as a Happy Daughter's Day gift, so a name added to the link shows up
  on the easel and in that final message. Claude Opus 5.5 built the whole thing
  through conversation, with no code written by hand, and the music is generated
  live, silent until you tap the little pink speaker on the table.
