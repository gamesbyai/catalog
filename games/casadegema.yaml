slug: casadegema
title: Casadegema
tagline: Water a bare courtyard and find hidden gems through a full watercolor year.
description: >-
  Casadegema is a watercolor garden game set around a whitewashed Spanish house.
  The courtyard starts bare: you water a tree bed, then explore to find five
  hidden gems in each of four seasons, and a full year takes about 10 to 15
  minutes.


  Each season changes how the garden looks and what you can do. Spring has
  shaking branches and a nest of chicks, summer adds a kite and a balloon,
  autumn brings rain and a rake, and winter offers a snowman and chalk. Oli the
  owl narrates and gives hints when tapped.


  The creator says it was built entirely through conversation with Claude Opus
  5.5 in Cursor, as a single HTML file with Canvas 2D art, spring physics and
  music generated live with Web Audio. Every gem flies to a counter, and the
  last one sends a message rising from the chimney, which a link parameter can
  personalize with a name.
