title: Ninja Tattoo Dojo
tagline: Throw shuriken at kanji to carve out wildly questionable tattoos.
description: >-
  Aim, throw your shuriken at a kanji character, and carve out a wildly
  questionable tattoo.


  A dojo as the setting. Accuracy as the whole challenge. Deadpan humor in the
  spirit of the Yakuza mini-games. Tattoos that probably shouldn't exist.


  The creator has a fondness for odd kanji tattoos, and named Codex as the tool
  used to make it.
