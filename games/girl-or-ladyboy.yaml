slug: girl-or-ladyboy
title: Girl or ladyboy
tagline: Walk Nana Plaza and judge whether each person is a woman or a ladyboy.
description: >-
  Girl or Ladyboy is a browser adventure set in Nana Plaza, Bangkok. The player
  takes the role of a foreign visitor who has trouble telling biological women
  from ladyboys, and the goal is to get better at making that call by looking at
  the people around them and deciding which is which.


  The premise is a comedic, adult-themed take on a well-known tourist mix-up in
  Thailand's nightlife district. It runs in 3D in the browser, supports
  multiplayer, and is playable on mobile. The subject matter is mature and aimed
  at players who are comfortable with crude humor about nightlife.


  The creator built it with Claude Code on top of Three.js, and it was submitted
  to Vibe Jam 2026, where it placed 254th out of 945 entries.
