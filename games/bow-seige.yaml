slug: bow-seige
title: bow seige
tagline: Pick a bow or an RPG and blow up the enemy king in multiplayer combat.
description: >-
  Bow Siege is a multiplayer action shooter where players pick up a weapon,
  either a bow or an RPG, and fight to take down the enemy's king. The goal is
  direct: get past the opposing side and destroy the king before he falls to
  yours.


  The weapon choice sets the tone, pairing the precision of a bow with the
  explosive power of a rocket launcher. It runs in the browser on Three.js and
  is playable on mobile as well as desktop. The creator describes it as made
  with a lot of love, and it entered Vibe Jam 2026.


  The creator says they wanted to learn Claude Code and describes themselves as
  a gamer, and they built the project with it. It is a learning project first,
  and that shows in its straightforward, approachable design.
