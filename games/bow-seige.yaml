slug: bow-seige
title: bow seige
tagline: Pick a bow or an RPG and blow up the enemy king in multiplayer combat.
description: >-
  In bow seige you pick one weapon, a bow or an RPG, and go after the enemy
  king. It is a multiplayer action shooter with a direct goal: get past the
  other side and blow up their king before they take down yours.


  The creator describes themselves as a gamer who wanted to learn Claude Code,
  and this is the result. It was made with a lot of love, in their words, and
  built on Three.js for Vibe Jam 2026. It is a learning project first, and the
  design stays straightforward and approachable.


  The weapon choice sets the tone of every match: the precision of a bow or the
  explosive power of a rocket launcher, both aimed at the same target, the enemy
  king on the other side.
