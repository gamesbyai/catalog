slug: vibecoder-simulator
title: Vibecoder Simulator
tagline: Craft items, fight rival players, and race to the portal to escape a
  digital hell.
description: >-
  Vibecoder Simulator traps you, a programmer, in a hostile matrix with one way
  out: the portal. You prompt your AI companion to craft the items you need,
  fend off rival players racing for the same portal, and fight your way toward
  that exit.


  It mixes action, puzzle, strategy, and simulation in a space shared with other
  players, on phones as well as desktop. The tools were Codex and Three.js. In
  the Vibe Jam 2026 standings it sits at 223rd of 945.


  The game plays with the everyday habits of vibecoding. You can whip your AI
  into working harder, mine tokens for resources, and survive a blue screen of
  death on the way to the portal, the only exit from this digital hell.
