slug: vibecoder-simulator
title: Vibecoder Simulator
tagline: Craft items, fight rival players, and race to the portal to escape a
  digital hell.
description: >-
  Vibecoder Simulator traps you, a programmer, in a hostile matrix. The portal
  is the only way out. The game mixes action, puzzle, strategy and simulation in
  a space shared with other players.


  Items crafted by prompting your AI companion. Fights with rival players racing
  for the same portal. Token mining for resources. A blue screen of death to
  survive on the way out. Whipping your AI into working harder.


  tulayha0 describes the game as "My mental state-of-mind when vibecoding."
