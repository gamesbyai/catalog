slug: clayhistoric
title: Clayhistoric
tagline: Fight rival clay cavemen and haul resources back to your cave first.
description: >-
  Clay cavemen race to haul scattered resources back to their own caves in a
  prehistoric arena. Each side's goal is to get its haul home before the
  opponents do.


  Fights between characters to disrupt each other along the way. A mild
  strategic edge in each round from those fights. Choices between grabbing
  resources and fighting. Exploration as part of gathering resources.


  eylamkeshet missed the handmade charm of The Neverhood, a clay game from the
  1990s, and built this as a nostalgic nod to that style.
