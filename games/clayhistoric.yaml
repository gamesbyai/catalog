slug: clayhistoric
title: Clayhistoric
tagline: Fight rival clay cavemen and haul resources back to your cave first.
description: >-
  Clayhistoric is a race to haul resources home, played by clay cavemen. Each
  side gathers what is scattered around a prehistoric arena and carries it back
  to its own cave, and the goal is to get it home before the opponents do.


  The look is the main draw. The creator missed the handmade charm of The
  Neverhood, a 1990s clay game, and built this as a nostalgic nod to that style,
  using Codex and Three.js. It placed 43rd of 945 at Vibe Jam 2026.


  Characters can fight to disrupt each other along the way, which gives each
  round a mild strategic edge. Combat, exploration and the race for resources
  all feed into it, so choosing what to grab, and when to fight instead of
  carrying, matters.
