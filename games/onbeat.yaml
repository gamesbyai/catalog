slug: onbeat
title: onbeat
tagline: Say the requested word in time with the beat in quick action challenges.
description: >-
  Onbeat is a silly browser action game built around rhythm and speech. Each
  challenge asks the player to say a word right on the beat, so a run is a
  string of short timing tests where hitting the rhythm matters more than
  anything else.


  The joke-driven premise keeps the tone light. Instead of pressing buttons in
  time, the player has to deliver a word at the right moment, which turns a
  familiar rhythm idea into something more physical and a little embarrassing.
  It was an entry in Vibe Jam 2026 and draws on a canvas-based presentation.


  Rounds are meant to be quick and repeatable, so it suits short sessions and
  trying again to land the timing a little better each time.
