tagline: Say the requested word in time with the beat in quick action challenges.
description: >-
  Say the requested word right on the beat. onbeat is a silly action game about
  speaking in time with the rhythm. You do not press buttons. Hitting the rhythm
  matters more than anything else.


  Runs built from a string of short timing tests. A joke-driven premise with a
  light tone. Quick, repeatable rounds for retrying the timing.
