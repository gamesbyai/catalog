slug: bumper-stream
title: Bumper Stream
tagline: Outlast seven AI rivals on a neon arena that cracks apart with every collision.
description: >-
  You face seven AI rivals on a shared stage. Each run is a survival fight, and
  your goal is to stay on the stage longer than any of them.


  Kart-style bumping between vehicles. Last-one-standing elimination in each
  run. Floor that cracks beneath every collision. Arena that shrinks and grows
  riskier as the match goes on. Collapse that you have to survive, sped up by
  each hit you land.


  The game is described as a mix of two games, Mario Kart and Fall Guys.
