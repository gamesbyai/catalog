slug: a-game-about-capybaras-delivering-food
title: A Game About Capybaras Delivering Food
tagline: Drive capybaras around a cozy open world delivering food without
  toppling the fruit stack.
description: >-
  This is a cozy open-world game where you play a capybara working as a food
  courier. You accept delivery orders, then travel across the map to get each
  one to its destination as quickly as you can. The fruit you carry stacks up
  like a tower, so every run is a balance between speed and steadiness.


  The setting is a capybara-themed take on the food delivery apps people already
  know. Buildings, apps, and outdoor areas all follow the theme, giving the
  world a playful, fictional-but-familiar feel. Its mix of adventure,
  simulation, and racing puts time pressure on top of the careful handling
  needed to keep the tower from falling. The game supports multiplayer and runs
  on mobile.


  The creator built it with Claude Code on Three.js as an entry in Vibe Jam
  2026, where it ranked first out of 945 entries. The idea came from the
  creator's own past work as a developer on a food delivery app.
