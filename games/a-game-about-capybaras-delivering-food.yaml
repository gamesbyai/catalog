slug: a-game-about-capybaras-delivering-food
title: A Game About Capybaras Delivering Food
tagline: Drive capybaras around a cozy open world delivering food without
  toppling the fruit stack.
description: >-
  You play a capybara on a scooter with a delivery box strapped to the back. You
  ride through an open world city as a food courier, accepting orders and
  getting them where they're going as fast as you can.


  Any food picked up, stacked into a tower above the box. Noodle cups, milk
  cartons, bubble tea and a few other kinds of food. A goal of keeping the tower
  from falling before the order arrives. Online or offline play.


  According to leocooout, a former developer on a food delivery app, the
  capybara theme runs through the buildings, the apps and the outdoor areas. It
  also shows up in more than just the main character.


  Suno made the music, ElevenLabs supplied the sound effects and Tripo3D handled
  the 3D rigging. Each came from a separate AI tool.
