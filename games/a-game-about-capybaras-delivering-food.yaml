slug: a-game-about-capybaras-delivering-food
title: A Game About Capybaras Delivering Food
tagline: Drive capybaras around a cozy open world delivering food without
  toppling the fruit stack.
description: >-
  You play a capybara working as a food courier. A Game About Capybaras
  Delivering Food hands you orders in a cozy open world, and you cross the map
  to get each one to its destination as fast as you can.


  The idea came from the creator's own past work as a developer on a food
  delivery app. The world is a capybara version of the delivery apps people
  already know, with buildings, apps and outdoor areas all on theme. It supports
  online multiplayer and took first place out of 945 entries at Vibe Jam 2026.


  The fruit you carry stacks up like a tower, so every delivery trades speed
  against steadiness. Time pressure pushes you to hurry while the tower needs
  careful handling, and carelessness topples it.
