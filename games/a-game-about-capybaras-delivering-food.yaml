slug: a-game-about-capybaras-delivering-food
title: A Game About Capybaras Delivering Food
tagline: Drive capybaras around a cozy open world delivering food without
  toppling the fruit stack.
description: >-
  You're a capybara on a scooter with a red delivery box strapped to the back,
  and every order you pick up adds fruit and other food to a stack that rises
  above you like a tower.


  You accept orders the way a delivery app hands them out, then race to drop
  them off as fast as you can. The stack is the catch, because if you let it
  fall, the food goes with it. It's an open world, so you pick your own route
  between pickups and customers.


  The title screen shows how silly the stack gets: a noodle cup, a milk carton,
  a slab of meat and a boba-style drink, all balanced on top of each other.
  That's a lot of lunch for one rodent.


  The setting is cozy and a bit odd, with a hill covered in greenery, street
  lamps, white apartment buildings, and a giant orange gate in the distance.


  The creator used to work as a developer on a real food delivery app, so the
  idea was to recreate that familiar experience with capybaras in every part of
  it. Buildings, apps and outdoors all follow the theme, which is a funny amount
  of commitment to one joke.


  From the start screen you can play online or offline, and there's also a stats
  page and a settings menu. Claude Code wrote the code, while other AI tools
  handled the music, sound effects and 3D rigging.
