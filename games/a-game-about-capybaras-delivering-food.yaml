slug: a-game-about-capybaras-delivering-food
title: A Game About Capybaras Delivering Food
tagline: Drive capybaras around a cozy open world delivering food without
  toppling the fruit stack.
description: >-
  You're a capybara on a scooter with a red delivery box strapped to the back,
  working as a food courier in a cozy open world. The job is to accept orders
  and get them where they're going as fast as you can. On the title screen your
  capybara does it in sunglasses, which suits the job.


  Whatever food you pick up stacks above the box. The title screen shows the
  kind of tower this builds, with noodle cups, milk cartons, bubble tea and a
  few other items piled into a tall column.


  Your goal is to keep that tower standing so nothing falls off before the order
  arrives.


  The city you ride through has hills, trees, street lamps and apartment
  buildings. leocooout, a former developer on a food delivery app, says the
  buildings, the apps and the outdoor areas all carry the capybara theme. The
  joke reaches well past the main character.


  From the menu you can play online or offline, change the settings or check a
  stats screen.


  The music, sound effects and 3D rigging each came from a separate AI tool, a
  bit of a crew for one scooter-riding rodent. Suno made the music, ElevenLabs
  supplied the sound effects and Tripo3D handled the rigging.
