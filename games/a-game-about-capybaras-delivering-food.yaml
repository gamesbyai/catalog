slug: a-game-about-capybaras-delivering-food
title: A Game About Capybaras Delivering Food
tagline: Drive capybaras around a cozy open world delivering food without
  toppling the fruit stack.
description: >-
  You're a capybara on a scooter with a delivery box strapped to the back,
  working as a food courier in an open world. The job is to accept orders and
  get them where they're going as fast as you can.


  Whatever food you pick up stacks above the box. Items like noodle cups, milk
  cartons, bubble tea and a few others pile up into a tall column above the box.


  Your goal is to keep that tower standing so nothing falls off before the order
  arrives.


  You make your deliveries by riding through a city. leocooout, a former
  developer on a food delivery app, says the capybara theme runs through the
  buildings, the apps and the outdoor areas. The theme also shows up in more
  than just the main character. You can play online or offline.


  The music, sound effects and 3D rigging each came from a separate AI tool.
  Suno made the music, ElevenLabs supplied the sound effects and Tripo3D handled
  the rigging.
