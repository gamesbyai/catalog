slug: a-game-about-capybaras-delivering-food
title: A Game About Capybaras Delivering Food
tagline: Drive capybaras around a cozy open world delivering food without
  toppling the fruit stack.
description: >-
  You play a capybara on a scooter with a red delivery box strapped to the back,
  working as a food courier in a cozy open world. The job is to accept orders
  and deliver them as fast as you can.


  Food stacks up above the box as you collect it. The title screen shows a tower
  of noodle cups, milk cartons, bubble tea and other items, and the goal is to
  keep that tower standing so nothing falls before the order arrives.


  The setting is a city with hills, trees, street lamps and apartment buildings.
  The creator, a former developer on a food delivery app, says the buildings,
  apps and outdoor areas all carry the capybara theme. The menu offers online
  and offline play, settings and a stats screen. Music, sound effects and 3D
  rigging came from separate AI tools.
