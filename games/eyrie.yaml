slug: eyrie
title: Eyrie
tagline: Catch spirits, feed the shrine, and fend off the obelisk in co-op waves.
description: >-
  Fight off waves of enemies in this drop-in co-op action roguelike. Players
  catch wandering spirits, carry them to a shrine and feed it, then turn to face
  the obelisk that threatens the area. Each run alternates between gathering and
  fighting, and other players can join a session in progress.


  It uses a party-style structure that recalls Guild Wars. It mixes action,
  adventure, and shooter elements.


  The creator built it with Claude Code, and it uses Three.js for rendering.
