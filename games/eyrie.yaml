slug: eyrie
title: Eyrie
tagline: Catch spirits, feed the shrine, and fend off the obelisk in co-op waves.
description: >-
  Fight off waves of enemies in this co-op action roguelike, where an obelisk
  threatens the area.


  Runs split between gathering and fighting. Other players joining a session
  already in progress. Party-style structure, reminiscent of Guild Wars. Action,
  adventure and shooter elements.


  Catch the wandering spirits and carry them to the shrine. Feed the shrine,
  then turn to face the obelisk.
