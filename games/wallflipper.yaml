slug: wallflipper
title: Wallflipper
tagline: Race through a neon corridor, flipping gravity to dodge obstacles and
  grab objects.
description: >-
  You start in a dark neon corridor with a glowing title, a launch button and a
  small blue craft waiting on a grid floor. Press launch and you're racing down
  it.


  The track isn't only the floor, because the walls and the ceiling are all part
  of the course.


  You steer left and right to climb around the walls and onto the ceiling, and
  you hit space to flip to the opposite surface. That flip is how you get out of
  the way of traps stuck to whatever surface you're on.


  The route breaks into fragments, so you follow the pieces that are still there
  while you dodge those traps and collect objects. Two readouts in the top left
  show your gravity, which starts on normal, and your direction, which starts on
  forward. Up top right, a distance counter in meters sits over two pickup
  counters, which is a handy way to see how far you've gotten.


  Your whole job is to stay alive while you keep moving at full speed.


  Beyond steering and flipping, you can reverse with R, pause with P, and switch
  the music or sound off with M and S. Both audio toggles also sit as buttons in
  the bottom left, so you can silence everything before you even launch.
