slug: wallflipper
title: Wallflipper
tagline: Race through a neon corridor, flipping gravity to dodge obstacles and
  grab objects.
description: >-
  When it starts, a Launch button sits over a dark neon corridor with a glowing
  cyan grid floor. In the top left there's a readout showing gravity set to
  Normal and direction set to Forward, while the top right counts distance in
  meters above two counters at zero and a thin bar.


  Once you're off, you race down that corridor on the floor, the walls and the
  ceiling, which turns pretty much the whole tube into road.


  Steering left or right carries you up the sides, and if you keep holding the
  steer you keep climbing. Space throws you over to the opposite surface, and
  that flip is how you get past the traps and obstacles sitting on the surfaces.


  The goal is to stay alive at full speed while picking up objects along the
  way. Text on the screen also points you toward following fragment routes
  through the corridor. Oddly enough, R turns you around entirely, and that's
  what the Direction readout in the corner keeps track of.


  P pauses, a small mercy in a game that wants you going full speed.


  Music and sound sensibly get their own toggles instead of sharing one mute.
  Both have buttons in the bottom-left corner, and M and S switch them from the
  keyboard too. The full list of keys runs along the bottom of the screen as
  well.
