slug: wallflipper
title: Wallflipper
tagline: Race through a neon corridor, flipping gravity to dodge obstacles and
  grab objects.
description: >-
  Alone, you race down a corridor on its floor, walls and ceiling, which turns
  pretty much the whole tube into road.


  Traps and obstacles sitting on the surfaces. Objects to collect along the way.
  Fragment routes through the corridor, hinted by on-screen text. Staying alive
  at full speed as the goal.


  Steer left or right to climb up the sides, and hold the steer to keep
  climbing. Press Space to flip to the opposite surface and slip past traps and
  obstacles. Press R to turn around completely.
