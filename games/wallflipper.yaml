slug: wallflipper
title: Wallflipper
tagline: Race through a neon corridor, flipping gravity to dodge obstacles and
  grab objects.
description: >-
  Wallflipper is a racing game set inside a neon corridor. The player runs along
  the floor, the walls, and the ceiling, flipping gravity to move between
  surfaces. Obstacles block the way, so each run is about timing the flips to
  dodge them while picking up objects along the route.


  The central mechanic is the gravity flip, which turns the whole corridor into
  a track. Instead of steering left and right on one surface, the player chooses
  which surface to use at each moment. The neon look keeps the corridor readable
  as it rushes past.


  Wallflipper was built with Three.js as an entry in Vibe Jam 2026, a game jam
  that drew 945 entries in total. It placed 611th in the final ranking, and it
  is a compact, single-player browser project.
