slug: wallflipper
title: Wallflipper
tagline: Race through a neon corridor, flipping gravity to dodge obstacles and
  grab objects.
description: >-
  The game opens on a Launch button over a dark neon corridor with a glowing
  grid floor. A readout in the top left shows gravity (Normal) and direction
  (Forward). The top right tracks distance in meters and two counters, both at
  zero, with a thin bar beneath them.


  You race down the corridor on its floor, walls, and ceiling. Steering left or
  right carries you up the sides, and holding the steer keeps you climbing.
  Space flips you to the opposite surface, which is how you dodge surface traps
  and obstacles. The goal is to stay alive at full speed and collect objects
  along the way.


  The on-screen text also tells you to follow fragment routes through the
  corridor. R reverses direction, which matches the Direction readout. P pauses,
  and music and sound each have their own toggle button and key.
