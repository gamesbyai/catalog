slug: demolition-drive
title: Demolition Drive
tagline: Swing, smash, and shatter structures to climb a global leaderboard.
description: >-
  The start screen asks for a callsign, with a Play button beside the text
  field. The preview art shows a wrecking ball hanging from a tilted arm next to
  a row of tall orange and blue towers. The job is to knock those towers down.


  Move with WASD, smash with the left mouse button, boost with E or the right
  mouse button, and slam with Q. Rounds are fast, and targets include towers and
  stars. Each round brings a new mix of objectives, so runs differ from one
  another.


  Scores go to a global leaderboard, so the aim is to rank above other players.
  The creator made it after growing tired of games built around construction
  loops and wanting one that is only about smashing things.
