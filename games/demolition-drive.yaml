slug: demolition-drive
title: Demolition Drive
tagline: Swing, smash, and shatter structures to climb a global leaderboard.
description: >-
  Demolition Drive is a 3D demolition simulator where the goal is to swing,
  smash, and shatter your way through destructible structures. Each run is about
  causing as much damage as you can, and your results feed into a global
  leaderboard that ranks players against each other.


  The game grew out of the creator's fatigue with building. Many games they
  played or made centered on construction loops, so they wanted something where
  the whole point is knocking things down. That contrast shapes the game: it
  focuses on the satisfaction of destruction.


  It runs in the browser on Three.js and works on mobile devices. The creator
  submitted it to Vibe Jam 2026, where it placed 74th out of 945 entries, and
  built it with Google's Antigravity.
