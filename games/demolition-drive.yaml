slug: demolition-drive
title: Demolition Drive
tagline: Swing, smash, and shatter structures to climb a global leaderboard.
description: >-
  Behind the wheel of a truck, you knock towers down with a wrecking ball on a
  chain swinging from its boom. Every round has different objectives.


  Fast rounds with towers and stars to go after. An opening round with 80% of
  the towers to wreck in 45 seconds. Clearing that round under 45 seconds
  without using abilities. Your scores go on a global leaderboard, and you try
  to climb above everyone else.


  You enter a callsign before you start. Drive with WASD. Smash with the left
  mouse button. Boost with E or the right mouse button, and slam with Q.


  Jinish1049533 had grown tired of games built around construction loops and
  wanted one only about smashing things. The creator says the game is their own
  idea, made into a playable game.
