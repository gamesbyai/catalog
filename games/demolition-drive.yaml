slug: demolition-drive
title: Demolition Drive
tagline: Swing, smash, and shatter structures to climb a global leaderboard.
description: >-
  Demolition Drive is a 3D demolition simulator with one goal: cause as much
  damage as you can. You swing, smash and shatter your way through destructible
  structures, and your results feed into a global leaderboard that ranks players
  against each other.


  It grew out of the creator's fatigue with building. Many of the games they
  played or made centered on construction loops, so they wanted one where
  knocking things down is the whole point. It was built with Google's
  Antigravity on Three.js, runs on phones as well as desktops, and placed 74th
  of 945 at Vibe Jam 2026.


  That contrast shapes every run. The focus is the satisfaction of destruction,
  and the global leaderboard gives each round of smashing a number to beat and a
  rank to climb.
