slug: scooter-boy
title: Scooter Boy
tagline: Ride an electric scooter through traffic, grab coins, and hop through portals.
description: >-
  In Scooter Boy you ride an electric scooter down a road, switching lanes to
  weave through traffic and scoop up coins. Portals show up along the way, and
  they hop you over to other games.


  You can jump too, and the rider pulls off tricks if you press the arrows while
  you're in the air.


  On a keyboard the left and right arrows change lanes and the up arrow jumps.
  On a phone you swipe to move and jump instead. Because the arrows double as
  the trick input, you don't need any extra keys.


  Your score is just the number of coins you've picked up, nothing more
  complicated than that.


  When a run ends, the game over screen shows your coin total next to your best.
  You can type a name there and submit the score to a leaderboard, which has
  separate Endless and Daily tabs.


  Along the roadside you'll pass tall buildings with rows of windows, trees,
  clouds and speed-limit signs, while a coin counter sits in the top corner as
  you ride. The creator made it to show their brother what's possible with AI
  today.
