slug: scooter-boy
title: Scooter Boy
tagline: Ride an electric scooter through traffic, grab coins, and hop through portals.
description: >-
  Scooter Boy has you riding an electric scooter down a road full of traffic,
  switching lanes to slip between the cars while you scoop up coins. The
  roadside is low-poly and blocky, with buildings, trees and speed signs lining
  the way.


  The left and right arrows move you over a lane, and the up arrow launches you
  into a jump.


  Once you're in the air, pressing arrows makes the rider pull off tricks, a
  neat bit of extra mileage from keys you're already using. On a touch screen
  you swipe to move and jump instead. Any key or a tap gets things rolling.


  The screen stays clean while you ride, with a coin counter and a sound
  toggle in the top left corner and a small label up top marking the mode as
  Endless.


  When a run ends, the game over screen shows the coins you collected next to
  your best total. You can type in a name and submit your score to a
  leaderboard, and it keeps separate Endless and Daily tabs.


  Portals also turn up along the road, and they don't lead to bonus areas at all
  but carry you off to other games entirely.


  Nik D made Scooter Boy to show their brother what's possible with AI today.
