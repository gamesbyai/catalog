slug: scooter-boy
title: Scooter Boy
tagline: Ride an electric scooter through traffic, grab coins, and hop through portals.
description: >-
  Scooter Boy puts you on an electric scooter on a road full of traffic, where
  you weave between the cars.


  Coins to scoop up while you ride. Portals to other games, not to bonus areas.
  Endless and Daily scores, kept apart on one leaderboard.


  Press left or right to change lanes. Press up to launch into a jump. Once
  you're in the air, press the arrow keys to pull off tricks. On a touch screen,
  swipe to move and jump. Press any key or tap to start. When a run ends, your
  coins are measured against your best total. You can type a name and submit
  your score to the leaderboard.


  The game was made by Nik D to show their brother what's possible with AI
  today.
