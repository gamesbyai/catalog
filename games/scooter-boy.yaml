slug: scooter-boy
title: Scooter Boy
tagline: Ride an electric scooter through traffic, grab coins, and hop through portals.
description: >-
  Scooter Boy puts you on an electric scooter on a road with traffic. Press any
  key or tap to start, then use the left and right arrows to change lanes, weave
  through the cars, and pick up coins. The up arrow jumps. Arrows pressed while
  airborne perform tricks.


  On touch screens, swipe to move and jump. A coin counter sits in the top left
  corner next to a sound toggle, and a label at the top of the screen marks the
  mode as Endless. The setting is a low-poly roadside with buildings, trees and
  speed signs.


  A run ends on a game over screen that shows the coins you collected and your
  best total. You can enter a name to submit the score to a leaderboard, which
  has separate Endless and Daily tabs. Portals along the way lead to other
  games. The creator built it to show their brother what is possible today with
  AI.
