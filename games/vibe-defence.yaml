slug: vibe-defence
title: Vibe Defence
tagline: Draw a path for enemies, place towers along it, and hold out against
  endless waves.
description: >-
  Vibe Defence is a tower defense game where the player designs the battlefield.
  Instead of following a fixed route, you draw the path enemies will walk, then
  place towers along it to stop each incoming wave. Waves keep coming without
  end, so a run lasts until your defenses finally give way.


  The main hook is the dual role of the player as both architect and defender.
  Path shape and tower placement work together, so the layout you sketch matters
  as much as what you build on it. The pace is relaxed, suited to thinking
  through a setup slowly rather than reacting under pressure. It runs in the
  browser on Three.js, supports mobile play, and was entered in Vibe Jam 2026.
