slug: ride-tales
title: Ride Tales
tagline: Choose any place on Earth and drive through quests and hidden treasures.
description: >-
  You start on a road running past the sea, with a small white hatchback parked
  in front of you. Before driving anywhere you choose a time of day, either
  morning, day, sunset, night or now, and then press Next.


  The trees are round and chunky, and apartment blocks climb a green hill, all
  in a low-poly look.


  You can drop yourself onto any place on the planet and drive around from
  there. Quests are scattered across the map, treasures are tucked away for you
  to find, and there are famous vehicles to track down, so the driving has
  reasons behind it.


  The creator loves travel and has a soft spot for open-world driving games.


  They name GTA as the kind of game they enjoy, so this one aims to bring that
  kind of roaming to real locations, right from your own home.


  Before the drive begins, a screen shows the four arrow keys and tells you
  they're for driving. That's all you need to get moving, which is handy when
  the map is this big.
