slug: ride-tales
title: Ride Tales
tagline: Choose any place on Earth and drive through quests and hidden treasures.
description: >-
  The first screen shows a low-poly white hatchback parked on a coastal road,
  with blue sea on one side and pale apartment blocks and rounded trees on the
  other. A row of buttons sets the time of day: morning, day, sunset, night or
  now. A Next button moves on.


  Before driving, you pick a spot anywhere on Earth and drop in. The tagline on
  the title screen describes the game as driving, playing and exploring the real
  world, and the arrow keys steer the car.


  The creator describes an open world with quests, hidden treasures and
  legendary rides. They say it combines their love of travel with open-world
  driving games like GTA, so you can roam and discover places from home.
