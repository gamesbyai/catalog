slug: ride-tales
title: Ride Tales
tagline: Choose any place on Earth and drive through quests and hidden treasures.
description: >-
  Pick a spot anywhere on Earth, drop in, and head out in a vehicle to explore
  the surroundings. Ride Tales is an open-world driving game set on the real
  globe, so the map is wherever you choose to start rather than one fixed world.
  That freedom to start anywhere is the main draw.


  The creator describes it as a way to bring the feeling of travel and discovery
  into your home. It was built with Claude Code on Three.js and ranked 31st of
  945 entries in Vibe Jam 2026.


  Once you are out there, you turn up quests to complete, hidden treasures to
  track down, and legendary rides to discover. The driving mixes action,
  adventure, and racing, and it takes cues from open-world driving games like
  GTA.
