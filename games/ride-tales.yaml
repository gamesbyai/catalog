slug: ride-tales
title: Ride Tales
tagline: Choose any place on Earth and drive through quests and hidden treasures.
description: >-
  A low-poly white hatchback waits on a coastal road when the game opens, with
  blue sea stretching off to one side. Pale apartment blocks and round, chunky
  trees line the other side, so the first screen looks like a quiet seaside
  postcard.


  Above the car there's a row of buttons for the time of day, with morning, day,
  sunset and night, plus a "now" option, and a Next button takes you onward.


  From there you choose a spot anywhere on Earth and drop in, which leaves a lot
  of planet for one small hatchback to cover. The title screen's tagline sells
  it as driving, playing and exploring the real world. You steer with the arrow
  keys.


  Aurelien_Gz describes it as an open world full of quests and hidden treasures,
  with legendary rides to find along the way.


  Aurelien_Gz says the game combines their love of travel with open-world
  driving games like GTA. According to them, it's meant to let you roam and
  discover places from home.
