slug: ride-tales
title: Ride Tales
tagline: Choose any place on Earth and drive through quests and hidden treasures.
description: >-
  Pick any place on Earth and drop in with a small hatchback to drive, play and
  explore the real world.


  A time of day to start, from morning to night, or now. An open world of quests
  and hidden treasures. Legendary rides to find along the way.


  Steer with the arrow keys.


  Aurelien_Gz combined a love of travel with open-world driving games like GTA,
  to let you roam and discover places from home.
