slug: ride-tales
title: Ride Tales
tagline: Choose any place on Earth and drive through quests and hidden treasures.
description: >-
  You choose the time of day first, with morning, day, sunset or night, or a
  "now" option.


  From there you choose a spot anywhere on Earth and drop in, which leaves a lot
  of planet for one small hatchback to cover. The game is pitched as a way to
  drive, play and explore the real world. You steer with the arrow keys.


  Aurelien_Gz describes it as an open world full of quests and hidden treasures,
  with legendary rides to find along the way.


  Aurelien_Gz says the game combines their love of travel with open-world
  driving games like GTA. According to them, it's meant to let you roam and
  discover places from home.
