slug: fat-pac
title: Fat Pac
tagline: Eat everything in a maze while growing fatter and slower with every bite.
description: >-
  Every bite fills a fat meter, and when it reaches 100% the board breaks. You
  steer through a maze eating all the food to clear each stage, while the meter
  climbs and the character gets slower. Food items add different amounts, from
  +1% for fries up to +12% for the largest item.


  Four enemies patrol the maze, each with its own behavior. Treadmill chases you
  directly, Dumbbell patrols at random, Rope intercepts your path, and Personal,
  the boss, is described as very aggressive. Touching any of them costs a life.


  A fruit sits in the center of the maze. Eating it lowers your fat level and
  reverses the enemies, so it works as both a way to slim down and a way to turn
  the chase around. Hunger is the other way a run ends. The interface is in
  Portuguese, with a language toggle, music and sound switches, and a settings
  menu.


  The title screen explains the rules before you start. Press Space to begin,
  and use R to restart a run.
