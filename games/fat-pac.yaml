slug: fat-pac
title: Fat Pac
tagline: Eat everything in a maze while growing fatter and slower with every bite.
description: >-
  Every bite raises your fat level, and when it hits 100% the board breaks. You
  steer through a maze trying to eat all the food to clear the stage, while your
  fat level keeps climbing and your character keeps getting slower. Hunger is
  the other way a run ends, which leaves you stuck between eating too much and
  not eating enough.


  Each food adding its own amount, from +1% for fries to +12% for the biggest
  item on the menu. Four maze-patrolling enemies, mostly workout gear, in a game
  about piling on weight. A lost life for each touch of an enemy. The Treadmill,
  a direct chaser, and the Dumbbell, a random wanderer. Rope, an enemy that
  moves to cut you off. Personal, the boss, billed as very aggressive. One fruit
  that lowers fat level and turns the enemies around.


  Before you start, the game explains the rules, the enemies and what each food
  is worth. The interface is in Portuguese, and there's a language toggle. Press
  Space to begin, then move with the arrow keys or WASD. Once you're playing,
  Space pauses the game. Press R to restart a run.
