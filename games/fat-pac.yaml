slug: fat-pac
title: Fat Pac
tagline: Eat everything in a maze while growing fatter and slower with every bite.
description: >-
  Fat Pac is a maze game in the Pac-Man tradition, with one change: eating has a
  cost. You guide a hungry character through the board and eat everything in
  sight. Every bite makes it fatter and slower, so a run is a race between
  hunger on one side and obesity on the other.


  Built with Claude Code, it draws its graphics on an HTML canvas and ranked
  500th of the 945 entries at Vibe Jam 2026. The result is a chaotic take on a
  familiar maze chase.


  Your body becomes part of the challenge. As you swell, you get closer to
  literally breaking the board, which turns the usual pellet-clearing into a
  balancing act between eating enough to survive and staying small enough to
  keep moving.
