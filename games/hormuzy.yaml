slug: hormuzy
title: Hormuzy
tagline: Steer a giant oil tanker through a strait full of mines, missiles and
  speedboats.
description: >-
  Hormuzy is an arcade-action survival game in which you captain a massive oil
  tanker through a dangerous strait. Each run is a delivery: you guide the ship
  along the route while avoiding mines, missiles, and swarms of speedboats, and
  try to bring your cargo to its destination intact.


  The setting comes from a real, ongoing news event, which gives the game its
  premise. Playing a slow, heavy tanker instead of a nimble fighter makes the
  hazards feel different, since every threat has to be handled with a large
  ship. It runs in the browser and supports mobile play.


  The creator says they wanted to test whether AI-assisted coding in 2026 could
  turn a current event into a full game within days, while the event was still
  unfolding. The creator built it with Bolt, and it was an entry in Vibe Jam
  2026.
