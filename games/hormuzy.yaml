slug: hormuzy
title: Hormuzy
tagline: Steer a giant oil tanker through a strait full of mines, missiles and
  speedboats.
description: >-
  In Hormuzy you captain a massive oil tanker through a strait full of mines,
  missiles and swarms of speedboats. Every trip is a delivery: guide the ship
  along the route and bring the cargo to its destination intact.


  The setting comes from a real news event that was still unfolding when the
  game was made. The creator says they wanted to test whether AI-assisted coding
  in 2026 could turn a current event like that into a full game within days, and
  they used Bolt to find out.


  It is arcade-action survival with a slow, heavy hero instead of a nimble
  fighter. Every threat has to be handled with a very large ship, which changes
  how the mines, missiles and speedboats play, and every one of them is a threat
  to the cargo.
