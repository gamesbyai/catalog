slug: orbital-slop-io
title: ORBITAL-SLOP.io
tagline: Pilot air and ground vehicles through a shared asteroid belt in a space
  shooter.
description: >-
  ORBITAL-SLOP.io drops air and ground vehicles into the same asteroid belt, and
  you move through the field joining the combat alongside whoever else is in the
  session. It's both a multiplayer space shooter and a flight simulation, but
  you aren't stuck flying the whole time.


  The creator calls it a High Slop adventure, and the tone is deliberately loose
  and messy.


  The opening screen looks like a console pulled from some retro mission
  control, with a glowing particle map of the solar system where Earth and
  Mercury sit inside a swirling ring of dust. There's a surprising amount
  crammed around it, since green terminal text, status readouts and a scrolling
  news ticker crowd every edge.


  From there you can jump into a quick run or open the Phobos Ledger to see the
  top runs. One mode card is labeled Ares and promises war games with live-fire
  PvP across six satellites. Another warns of priority ops with a blight on the
  way, while a contamination meter in the corner tracks that blight as a
  percentage, oddly precise down to three decimal places.


  Your pilot gets an operator card with a portrait and a call sign, a nice bit
  of dressing for a menu.


  sidriff framed it as a love letter to the flight sims they played in their
  youth. The menus lean hard on old cockpit displays and terminal readouts, so
  that affection shows up before you've launched.
