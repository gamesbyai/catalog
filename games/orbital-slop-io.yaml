slug: orbital-slop-io
title: ORBITAL-SLOP.io
tagline: Pilot air and ground vehicles through a shared asteroid belt in a space
  shooter.
description: >-
  ORBITAL-SLOP.io puts air and ground vehicles into the same asteroid belt and
  lets players fight it out in space. It is a multiplayer space shooter and
  flight simulation, and you move through the field and join the combat
  alongside whoever else is in the session.


  The creator calls it a High Slop adventure, and the tone is deliberately loose
  and messy. It is framed as a love letter to the flight sims the creator played
  in their youth. It came together in Cursor and Three.js during Vibe Jam 2026,
  where it ranked 445th of 945.


  It runs on phones too, and having both air and ground vehicles in one asteroid
  setting gives it a different feel from a pure flight game, where you only ever
  fly.
