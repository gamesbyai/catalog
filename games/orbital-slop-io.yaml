slug: orbital-slop-io
title: ORBITAL-SLOP.io
tagline: Pilot air and ground vehicles through a shared asteroid belt in a space
  shooter.
description: >-
  ORBITAL-SLOP.io has you operating both air and ground vehicles as you work
  through an asteroid belt, and it's built as a shooter mixed with a flight sim.
  The creator calls it a love letter to the flight sims of their youth.


  The opening screen is a map of the belt, drawn as a swirl of cyan dots around
  the sun.


  You pick a job from the map. Quick Run drops you onto a numbered asteroid, and
  a Phobos Ledger panel next to it lists top runs.


  Two other cards sit on the map. One is Ares, a live-fire PvP arena called War
  Games, with satellites and racked barrels listed for it. The other is a
  priority ops mission where blight is inbound, and it shows a run integrity
  percentage.


  Blight is a running theme, because a contamination meter in the corner tracks
  it as a percentage with a tier label.


  The screen is dressed up like a bureau terminal, with a scrolling news ticker
  along the bottom, a dispatch panel and an operator portrait. That's a lot of
  fake paperwork for a game that bills itself as High Slop, which seems to be
  the joke.
