slug: orbital-slop-io
title: ORBITAL-SLOP.io
tagline: Pilot air and ground vehicles through a shared asteroid belt in a space
  shooter.
description: >-
  ORBITAL-SLOP.io drops air and ground vehicles into the same asteroid belt, and
  you move through the field joining the combat alongside whoever else is in the
  session. It's both a multiplayer space shooter and a flight simulation, but
  you aren't stuck flying the whole time.


  The creator calls it a High Slop adventure, and the tone is deliberately loose
  and messy.


  From there you can jump into a quick run or open the Phobos Ledger to see the
  top runs. One mode, Ares, promises war games with live-fire PvP across six
  satellites. Another card warns of priority ops with a blight on the way.


  sidriff framed it as a love letter to the flight sims they played in their
  youth.
