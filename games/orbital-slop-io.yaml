slug: orbital-slop-io
title: ORBITAL-SLOP.io
tagline: Pilot air and ground vehicles through a shared asteroid belt in a space
  shooter.
description: >-
  ORBITAL-SLOP.io has you operate air and ground vehicles in one asteroid belt.
  You move through the field, joining combat with others in your session. It's a
  multiplayer space shooter and flight simulation, but you aren't stuck flying
  the whole time.


  Quick runs to jump into. Ares, a mode promising war games with live-fire PvP
  across six satellites. Priority ops, with a blight on the way. The Phobos
  Ledger, a board of top runs.


  sidriff calls it a High Slop adventure with a deliberately loose, messy tone.
  sidriff framed it as a love letter to flight sims of their youth.
