slug: scavender
title: Scavender
tagline: Explore a ruined world and make choices that lead to different endings
description: >-
  Civilization has collapsed, and in Scavender you explore what is left of it
  one click at a time. The genre is point-and-click adventure: you move through
  ruined environments, interact with objects, and make decisions that steer the
  story toward one of several endings.


  The ruins are rendered in 3D with Three.js, and the single-player game works
  in a mobile browser too. Antigravity, Google's AI coding tool, was the
  creator's choice, and it ranked 81st of 945 in Vibe Jam 2026.


  The inspiration is The Walking Dead series, and it shows in the priorities:
  story-driven survival and choices with consequences, not fast action. Since
  the outcome depends on what you choose, replaying to reach the other endings
  is part of the design, because a single run leads to only one of them.
