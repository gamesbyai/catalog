slug: scavender
title: Scavender
tagline: Explore a ruined world and make choices that lead to different endings
description: >-
  Click through the aftermath of a collapsed civilization in Scavender, a
  post-apocalyptic point-and-click adventure.


  Ruined environments to move through and objects to interact with. Decisions
  that steer the story toward one of several endings. Survival after the
  collapse, with choices that have consequences.


  Inspired by The Walking Dead series. Its priorities are story and choices, not
  fast action. Each run reaches one ending, and replays reach the others.
