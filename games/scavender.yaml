slug: scavender
title: Scavender
tagline: Explore a ruined world and make choices that lead to different endings
description: >-
  Scavender is a point-and-click adventure set after the collapse of
  civilization. The player moves through ruined environments, clicking to
  explore, interact with objects and make decisions as the story unfolds. Those
  decisions steer the run toward one of several possible endings.


  The game draws its inspiration from The Walking Dead series, favoring
  story-driven survival and consequential choices over fast action. Because the
  outcome depends on what the player chooses, replaying to see other endings is
  part of the design. It runs in the browser on 3D graphics and is playable on
  mobile devices as well as desktop.


  It was entered in Vibe Jam 2026, where it placed 81st out of 945 entries. The
  creator built it with Antigravity, Google's AI coding tool.
