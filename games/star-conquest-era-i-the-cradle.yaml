slug: star-conquest-era-i-the-cradle
title: "Star Conquest - Era I: The Cradle"
tagline: Run a colony economy across the solar system in pausable real time,
  then face the Swarm.
description: >-
  Run a human faction in a pausable real-time 4X across the solar system, from
  Mercury to Pluto. Planets follow real orbits, and freighters fly actual
  trajectories between them. Transfer windows and planetary alignment matter a
  lot, because goods only count once they land, especially when a delivery from
  Callisto has to cross half the system first.


  Colony output into stockpiles, hauled home by convoy, populations climbing
  toward habitat caps. Research timed in real time, event log, synthesized
  ambient score. Pirate clans, three named, preying on every faction's shipping
  from armed havens. Two rival factions, running the same economy as you, with
  non-aggression pacts, mid-war peace, joint pirate strikes, raids, conquest.
  Reputation as money, earned by protecting civilians, drained by mercenaries,
  settlers and conquest. Three difficulty levels, Cadet up to Admiral, Admiral
  with a 25-vessel Swarm.


  Drag to pan, scroll to zoom, and click any planet, moon, station, fleet or
  freighter to inspect it. Press Space to pause, and 1 to 5 to set speed, from
  0.1x to 120x. Press F5 to save and F9 to load your one save slot. Check each
  world's stock, daily output and next transfer window. Pay for escorts, order
  corvettes or put up orbital defense platforms. Burn a haven out to end that
  clan for good.


  In year five the Swarm arrives, a wave of vessels that attacks everyone and
  outguns anything humans can build. Every human war falls silent the moment it
  shows up. Win through Dominion before it lands, through Endurance by holding
  Earth, or through Swarm Broken by destroying the wave. Each world you take
  also lowers the standing you could have spent on settlers.
