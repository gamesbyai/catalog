slug: star-conquest-era-i-the-cradle
title: "Star Conquest - Era I: The Cradle"
tagline: Run a colony economy across the solar system in pausable real time,
  then face the Swarm.
description: >-
  Drag to pan the map, scroll to zoom, and click any planet, station or ship to
  inspect it. The planets move along real orbits, so freighters follow curved
  flight paths and the windows for transfers open and close as worlds line up.


  Space pauses the clock, and you can run time anywhere from a tenth of normal
  speed up to 120 times.


  Colonies build up stockpiles and convoys carry them home, and a shipment only
  adds to your treasury after it arrives. Populations grow toward a cap on each
  world, research takes real time, and no two worlds are worth the same.


  Three pirate clans raid every faction's shipping from armed havens. You can
  hire escorts, commission corvettes, put up orbital defense platforms, or
  destroy a haven and finish that clan permanently. Two rival factions run an
  economy like yours, so you can sign pacts, pay for a ceasefire mid-fight, or
  team up against the pirates.


  Conquest is allowed too, but reputation acts as money, so protecting civilians
  earns it, mercenaries and settlers spend it, and taking worlds burns it.


  In year five the probes beyond Pluto go quiet and the Swarm shows up, a wave
  of ships stronger than anything you can field. It attacks everyone, so every
  human war stops at once, which is a neat way to force a truce. You can win
  through Dominion, Endurance or Swarm Broken, and there's only one way to lose.


  Difficulty runs from a forgiving Cadet to Admiral, where the Swarm has 25
  vessels. Saving uses a single slot kept in your browser.
