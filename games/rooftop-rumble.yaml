slug: rooftop-rumble
title: Rooftop Rumble
tagline: Blast rival neighbors off flooded rooftops into shark-filled water.
description: >-
  Play solo, host a private match, or find a public one. You fight with a leaf
  blower, and the goal is to blast your rivals off the roofs and into the water
  below.


  Battle Royale, last one standing when everyone else has taken a swim. Timed
  Deathmatch with respawns, won by the most kills at time's end. King of the
  Ridge, scored by holding the center ridge, marked as frozen for multiplayer.
  Roof-to-roof hopping, a called-in bird attack, and emotes. Cosmetic hats
  unlocked by wins and kills, starting with the Green Cap. Top Hat at one win,
  Propeller and Pilon at 10 and 20 kills, Crown at 50 kills.


  Pick a mode and a cosmetic hat first, then drop into the fight.


  JordanHeightsX wanted the game to feel funny right away. Gutter Sharks patrol
  the flood, and they're mutated goldfish. In the backstory, those sharks
  started out as escaped pets before leaf mulch clogged the drains.
