slug: rooftop-rumble
title: Rooftop Rumble
tagline: Blast rival neighbors off flooded rooftops into shark-filled water.
description: >-
  You can play Singleplayer, Host Private Match or Find Public Match. You pick a
  mode and a cosmetic hat, then drop into the fight.


  You fight with a leaf blower, and the goal is to blast your rivals off the
  roofs and into the water below.


  Down there, Gutter Sharks patrol the flood, and they're mutated goldfish.
  JordanHeightsX wanted the game to feel funny right away, and in the backstory
  those sharks started out as escaped pets before leaf mulch clogged the drains.


  Besides the blower, you can hop from roof to roof, call in a bird attack and
  fire off emotes.


  Battle Royale keeps going until everyone else has taken a swim, so the last
  player standing wins. Deathmatch runs on a timer with respawning switched on,
  and whoever has the most kills when time runs out takes it.


  A third mode, King of the Ridge, has you holding the center ridge to score
  points, though it's marked as frozen for multiplayer.


  Hats unlock through your wins and kills. You start with a Green Cap, while the
  Top Hat takes a single win. The Propeller and Pilon open up at 10 and 20
  kills, while the Crown needs 50.
