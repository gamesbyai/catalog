slug: rooftop-rumble
title: Rooftop Rumble
tagline: Blast rival neighbors off flooded rooftops into shark-filled water.
description: >-
  The start screen asks for a name and offers Singleplayer, Host Private Match
  and Find Public Match. After that you pick a mode and a cosmetic hat, then
  drop onto a low-poly neighborhood of red and teal rooftops. You fight with a
  leaf blower, and the aim is to blast rivals off the roofs into the water.


  Battle Royale lasts until everyone else has taken a swim, so the last player
  standing wins. Deathmatch runs on a timer, with respawning enabled, and the
  most kills when time runs out takes it. King of the Ridge, where you hold the
  center ridge to score points, is marked as frozen for multiplayer.


  Besides the leaf blower, you can jump between roofs, trigger a bird attack and
  use emotes. The water is patrolled by mutated goldfish called Gutter Sharks. A
  stats bar tracks your wins and kills. Hats unlock through them: Top Hat after
  1 win, Propeller at 10 kills, Pilon at 20 and Crown at 50.
