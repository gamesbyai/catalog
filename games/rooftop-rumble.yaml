slug: rooftop-rumble
title: Rooftop Rumble
tagline: Blast rival neighbors off flooded rooftops into shark-filled water.
description: >-
  A suburban leaf-blower arms race went too far, and now the streets are
  underwater. Rooftop Rumble is a multiplayer battle royale on the roofs that
  are left. You fight for position and use leaf blowers to push rival neighbors
  off the edge until one player stands as King of the Street.


  It is designed to be understood quickly and easy to jump into, on a phone or a
  desktop. In the creator's words, they used Cursor to build it on Three.js.
  Vibe Jam 2026 put it 164th of 945.


  The water below is the punchline. Escaped pet goldfish mutated into Gutter
  Sharks after the drains clogged with leaf mulch, so property disputes end with
  a neighbor shoved into shark-filled water. The tone stays silly from start to
  finish.
