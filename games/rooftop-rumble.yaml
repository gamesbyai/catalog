slug: rooftop-rumble
title: Rooftop Rumble
tagline: Blast rival neighbors off flooded rooftops into shark-filled water.
description: >-
  The title screen sits over a blurred, flooded suburb, where you type in a name
  and choose Singleplayer, Host Private Match or Find Public Match. Next you
  pick a mode and a cosmetic hat, then drop onto a low-poly neighborhood of red
  and teal rooftops.


  You fight with a leaf blower, of all things, and the goal is to blast your
  rivals off the roofs and into the water below.


  Down there, Gutter Sharks patrol the flood, and they're actually mutated
  goldfish, an unlikely kind of predator. JordanHeightsX wanted the game to
  feel instantly funny, and in the backstory those sharks started out as
  escaped pets before leaf mulch clogged the drains.


  Besides the blower, you can hop from roof to roof, call in a bird attack and
  fire off emotes.


  Battle Royale keeps going until everyone else has taken a swim, so the last
  player standing wins. Deathmatch runs on a timer with respawning switched on,
  and whoever has the most kills when time runs out takes it.


  A third mode, King of the Ridge, has you holding the center ridge to score
  points, though it's marked as frozen for multiplayer.


  A stats bar tracks your wins and kills, and the hats unlock through those same
  numbers. You start with a Green Cap, while the Top Hat takes a single win. The
  Propeller and Pilon open up at 10 and 20 kills, while the Crown wants a whole
  50.
