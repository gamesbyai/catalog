slug: forest-escape
title: Forest Escape
tagline: Find seven blue flowers in a dark forest while spirits chase you.
description: >-
  Forest Escape is a first-person horror game set in a dark forest. You carry
  only a flashlight and must search the trees for seven blue flowers. Spirits
  roam the woods and hunt you as you look, so each run is a balance between
  exploring for the next flower and staying out of reach.


  The flashlight is the main tool for finding your way, which keeps the view
  narrow and the tension high. Collecting the flowers is the clear goal, and the
  pursuing spirits turn every stretch of open ground into a risk. The game runs
  in the browser and is built with Three.js.


  According to the creator, the game was built with Cursor and Claude, using
  Three.js for the 3D forest and its flashlight lighting.
