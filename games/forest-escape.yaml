slug: forest-escape
title: Forest Escape
tagline: Find seven blue flowers in a dark forest while spirits chase you.
description: >-
  A dark forest hides seven blue flowers, and spirits roam it while you search.
  The goal is to collect all seven without being caught by a spirit. A counter
  in the top left shows how many flowers you have collected out of seven.


  Move with WASD, ZQSD or the arrow keys, and look around with the mouse. Press
  F or Space to toggle the flashlight. Flowers are only visible while the
  flashlight is on, and spirits can't see you while it is off.


  A battery meter in the top left starts at 100% and tracks the flashlight's
  charge. If the battery runs out, you lose. A pause button sits in the top
  right corner. The title screen also has share and credits buttons, plus links
  to app store versions.
