slug: forest-escape
title: Forest Escape
tagline: Find seven blue flowers in a dark forest while spirits chase you.
description: >-
  Somewhere in a pitch-dark forest there are seven blue flowers, and spirits
  drift between the trees while you hunt for them. You win by picking up all
  seven without a spirit catching you.


  Your flashlight is the whole problem, because the flowers only show up while
  it's on. Switch it off and the spirits can't see you, but you also lose sight
  of what you came for. It's a neat bind, since the darkness that keeps you
  hidden is the same darkness that hides the flowers.


  Then there's the flashlight's charge, tracked by a battery meter in the top
  left that starts at 100% and ends your game outright if it drains to nothing.


  You move with WASD, ZQSD or the arrow keys and look around with the mouse,
  while F or Space flicks the flashlight on and off. Supporting ZQSD next to
  WASD is a thoughtful touch for anyone on an AZERTY keyboard.


  The top left of the screen shows the battery meter and a counter of your
  flowers out of seven, and a pause button sits in the top right corner.


  On the title screen the game goes by Floral Escape: Ghost Forest, a name that
  sounds a lot gentler than being hunted by spirits in the dark. You'll find
  share and credits buttons there too. Below them are links to app versions on
  the App Store and Google Play.
