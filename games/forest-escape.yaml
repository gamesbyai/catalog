slug: forest-escape
title: Forest Escape
tagline: Find seven blue flowers in a dark forest while spirits chase you.
description: >-
  A forest full of spirits is where you hunt for seven blue flowers. You win by
  picking up all seven without a spirit catching you. It also goes by Floral
  Escape: Ghost Forest, and app versions are on the App Store and on Google
  Play.


  Flowers visible only with the flashlight on. Spirits blind to you with the
  flashlight off. A flashlight charge, with an empty battery ending the game.


  Move with WASD, ZQSD or the arrow keys. Look around with the mouse. Press F or
  Space to switch the flashlight on and off. Use ZQSD with WASD on AZERTY
  keyboards.
