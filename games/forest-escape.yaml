slug: forest-escape
title: Forest Escape
tagline: Find seven blue flowers in a dark forest while spirits chase you.
description: >-
  You're alone in a dark forest with nothing but a flashlight, looking for seven
  blue flowers while spirits hunt you down.


  The flashlight is the whole game, because the flowers only show up when it's
  on. But the spirits can't see you when it's off, so you keep switching between
  searching and hiding.


  The flashlight runs on a battery, and that's a problem you can't ignore.


  If it runs out, you lose, which means you can't just sit in the dark forever
  waiting for the spirits to wander off. The battery meter sits in the top
  corner next to a counter that tracks how many flowers you've picked, out of
  seven.


  You win by collecting all seven without a spirit catching you.


  You walk with WASD, ZQSD or the arrow keys and look around with the mouse. F
  or Space toggles the flashlight, so one hand stays on the movement keys while
  you decide whether to light up or go dark.
