slug: forest-escape
title: Forest Escape
tagline: Find seven blue flowers in a dark forest while spirits chase you.
description: >-
  You hunt for seven blue flowers in a forest full of spirits. You win by
  picking up all seven without a spirit catching you.


  Your flashlight is the whole problem, because the flowers only show up while
  it's on. Switch it off and the spirits can't see you, but you also lose sight
  of what you came for.


  The flashlight runs on a charge, though, and the game ends if the battery
  drains to nothing.


  You move with WASD, ZQSD or the arrow keys and look around with the mouse,
  while F or Space flicks the flashlight on and off. ZQSD works alongside WASD,
  which suits AZERTY keyboards.


  The game also goes by Floral Escape: Ghost Forest. App versions are also
  available on the App Store and Google Play.
