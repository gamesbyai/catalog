slug: pegpoint
title: PEGPOINT!
tagline: Launch balls at pegs and bumpers to clear boards in a retro pixel-art puzzler
description: >-
  PEGPOINT! is a pixel-art puzzle game in the style of Peggle. Each level is a
  board filled with pegs, bumpers, and portals, and the player aims and launches
  a ball to knock pegs out and rack up points. A run moves through a series of
  hand-designed boards, each with its own layout.


  The game includes 99 distinct levels and 25 power-ups that change how a shot
  plays out. A daily seeded puzzle gives everyone the same board, and a
  leaderboard lets players compare scores. The look draws on Super Nintendo and
  Game Boy era graphics, and the rules stay simple enough to pick up quickly.


  The creator built it with Claude Code and cites PopCap titles like Peggle,
  Plants vs. Zombies, and Bejeweled as inspiration. It was entered in Vibe Jam
  2026 and is playable on mobile devices.
