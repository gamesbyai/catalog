slug: arithmancer
title: Arithmancer
tagline: Solve arithmetic problems to cast spells and drive back the darkness.
description: >-
  Arithmancer is a fantasy RPG where math is the way you fight. The land has
  fallen under a spreading darkness, and you push it back by casting spells,
  with each cast powered by working out basic arithmetic problems correctly.


  The game began as a spring break project between a parent and his 8-year-old
  daughter, who wanted a fun way to practice arithmetic. That origin shapes the
  design: the learning is part of the combat, not a quiz bolted on beside it. It
  targets young players building number skills, and it runs in the browser with
  support for mobile and multiplayer.


  It was built in Three.js for the Vibe Jam 2026 event, where it placed 287th
  out of 945 entries. The creator states that Codex was used in its development.
