slug: swervle
title: Swervle
tagline: Race a fresh procedurally generated 90-second route that changes every day.
description: >-
  You drive a car around a racecourse that is generated fresh each day, in a
  Wordle-style daily format. Everyone drives that same course on a given day,
  and you keep coming back to one road to do better on it. Each run gives you 90
  seconds to get through that day's course as well as you can before the clock
  runs out.


  Low-cost retries while the day's route lasts. Vehicle editing. A record of
  past races. Leaderboard with each driver's time beside their car.


  Wait out the countdown at the start of each run. Steer and use the throttle to
  drive. Use the handbrake and cycle the camera. Press G to switch ghosts on or
  off. Use the recover key to get the car back, or the restart key for another
  try.
