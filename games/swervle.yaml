slug: swervle
title: Swervle
tagline: Race a fresh procedurally generated 90-second route that changes every day.
description: >-
  Swervle is an arcade racing game built on the daily format that Wordle
  popularized. Each day brings one fresh, procedurally generated route, and a
  run lasts 90 seconds: steer through that day's course as well as you can
  before the clock runs out. Tomorrow's route will be different.


  The creator states it was built with GPT-5.6 and Claude Opus 5, and the
  single-player game renders in the browser with Three.js.


  The daily structure is the hook. Everyone gets the same route on a given day,
  so instead of facing an endless stream of random tracks, you can return to one
  course and try to improve on it. The 90-second length keeps each attempt
  quick, so trying again costs little before the day's route is gone.
