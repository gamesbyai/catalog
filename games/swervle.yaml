slug: swervle
title: Swervle
tagline: Race a fresh procedurally generated 90-second route that changes every day.
description: >-
  You drive a blocky yellow car down a 90-second route, and you're racing the
  clock from the moment the countdown ends.


  The route is procedurally generated and it's new every day, which is where the
  Wordle comparison comes from. Because it's one fresh course per date, there's
  a Past Races button in the menu for days you missed, so you can still go back
  to them.


  Before the start, a timer runs across the top of the screen. A speed readout
  sits in the bottom right corner, and a small panel in the bottom left tracks
  your checkpoint count and current gear.


  You steer with the keys, and there's a handbrake for when a corner gets tight.


  If a turn goes wrong, R recovers you and F restarts the run, which is handy
  when a run is only 90 seconds long. C switches the camera, and G toggles
  ghosts. Esc brings up the menu.


  The menu has a leaderboard of the day's fastest times, each with a little
  picture of that player's car. Some entries are marked as live on Twitch with a
  watcher count, so you can see who's streaming a run.


  There's also an Edit Vehicle option, both on the title screen and in the menu,
  if you'd like to change the car before you race.
