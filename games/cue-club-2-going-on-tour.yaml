slug: cue-club-2-going-on-tour
title: Cue Club 2 — Going on Tour
tagline: Play British pub 8-ball pool through a ten-stop tour of first-to-two sets.
description: >-
  Sink your seven, then the black, to win British pub-rules 8-ball pool, and you
  lose if the black goes in early. Your tour begins in Leeds and runs through
  ten first-to-two sets, each against a new opponent, ending at Crystal Palace.
  Each opponent weighs up safeties, chalks their cue, and sometimes loses their
  nerve on a shot.


  Opponents with their own styles, from fast and cautious to showy and
  methodical. Moving on after a won set, dropping back a stop after a lost one.
  Chalk management, with accuracy lost to low chalk. Adjustable 30-second shot
  clock on each visit. A table left open after the break, and two visits for the
  opponent after a foul. Up to three saved tours, with statistics, trophies and
  unlocked freeplay. Unfinished tables kept on your device between sessions.


  Move the mouse around the cue ball to aim. Hold the left button to draw your
  cue back, then release to shoot. Right-click to cancel the draw-back. Click
  chalk or press C to chalk. On keyboard, aim with A and D or the arrow keys,
  hold Space to draw back, and release to shoot. On touch, aim with the
  direction pad, draw back with the power button held down, then release to
  shoot. Tap chalk for better aim.


  According to the creator, AI helped with the code, artwork, sounds and text.
  The sound is generated by code, with no audio files loaded.
