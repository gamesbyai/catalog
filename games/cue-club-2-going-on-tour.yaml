slug: cue-club-2-going-on-tour
title: Cue Club 2 — Going on Tour
tagline: Play British pub 8-ball pool through a ten-stop tour of first-to-two sets.
description: >-
  Cue Club 2 is a game of British pub-rules 8-ball pool. You start in Leeds and
  play ten first-to-two sets against a different opponent at each stop,
  finishing at Crystal Palace. Clear your seven balls, then pot the black. Pot
  it early and you lose. Win a set and the tour moves on; lose and you drop back
  a stop.


  Each opponent plays in their own style, from fast and cautious to showy and
  methodical. They weigh up safeties, chalk their cues, and sometimes bottle a
  shot. Chalk matters for you too, since low chalk hurts accuracy. Each visit
  runs on a 30-second shot clock, and you can adjust it. Fouls hand the opponent
  two visits, and the table is open after the break.


  The game saves up to three separate tours, along with statistics, trophies,
  and unlocked freeplay. Unfinished tables are remembered locally between
  sessions. Sound is generated procedurally rather than loaded from audio files.
  The creator's AI disclosure says AI assisted with the code, graphics, sounds,
  and text.
