slug: demonetized-the-authenticity-purge
title: "DEMONETIZED: The Authenticity Purge"
tagline: Survive waves of enemies in a cyberpunk satire, picking cards and
  upgrades along the way.
description: >-
  Move with WASD, aim with the mouse, fire with the left button, and dash with
  Space or the right button. Every run begins by picking one of three single-use
  starter cards: Value Override raises max Signal, Demonetization Order wipes
  the mob, and Compliance Budget Patch heals.


  You play T.O.P.E., the moderation AI of a fictional video platform called
  TheirTube, in a cyberpunk survivor shooter. The HUD shows a Signal bar as a
  percentage, whether dash is ready, the current wave, a named threat, your
  score, and a personal best.


  Between runs, a store sells permanent upgrades for money. Options include an
  extra starting card, more max Signal, a wider pickup range, shorter cooldowns,
  a damage bonus, a card reroll, an orbiting drone or satellite, and a shield.
  The menu counts runs, wins, and win rate, and Enter starts the next run.


  The creator calls the story satire: a platform wipes out human creators under
  the label "brand safety" while its ads keep earning. The interface can be
  switched between English and Spanish.
