slug: demonetized-the-authenticity-purge
title: "DEMONETIZED: The Authenticity Purge"
tagline: Survive waves of enemies in a cyberpunk satire, picking cards and
  upgrades along the way.
description: >-
  Move with WASD, aim with the mouse and fire with the left button, while Space
  or the right button makes you dash. Before any of that, though, every run
  starts with a choice between three starter cards, and each one works only
  once.


  Value Override raises your max Signal, Compliance Budget Patch heals you, and
  Demonetization Order wipes out every enemy.


  You're T.O.P.E., the moderation AI working for a made-up video platform called
  TheirTube, in a cyberpunk survivor shooter.


  Between runs, you spend money on permanent upgrades in the store. You can buy
  an extra starting card, more max Signal, a wider pickup range, shorter
  cooldowns or a damage bonus. The store also has a card reroll, an orbiting
  drone or satellite, and a shield, named things like Legal Armor and Reputation
  Insurance. Pressing Enter starts the next run.


  TheINAOG calls the story satire, in which a platform erases human creators in
  the name of "brand safety" while its ads keep making money. They drew on the
  recent debate over demonetization and channel removals, and because they love
  progression-based games, they set out to make something compact you can play
  right away. The interface can be switched between English and Spanish.
