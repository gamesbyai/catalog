slug: plugs
title: PLUGS
tagline: Plug in lamps and mix colored light to brighten seven rooms in a dark house.
description: >-
  PLUGS is a point-and-click puzzle game set in a dark house with a box of lamps
  and too few outlets. In each of seven rooms, you drag plugs, carry lamps, open
  drawers and flip switches to light the space. Colored light has to be told
  apart, and the breaker needs watching.


  Lighting is the centerpiece. A per-pixel relight pass lets colored pools of
  light mix on the walls, objects cast shadows, and dust shows only where light
  falls. Cords behave like ropes: they sag and tangle, and heavy-gauge ones
  resist being dragged. Every room has its own puzzle logic, palette and era,
  and 65 secrets are tucked into walls, paint and plaster. A 59-page owner's
  manual includes wiring diagrams and an appliance register.


  An optional Bulb Marks setting stamps a letter on each lit lamp so no puzzle
  depends on color alone. The menu also offers a room hint, volume steps, a CRT
  filter and full screen. Progress saves in the browser. The credits name Claude
  for code and pixels, with design and direction by Grant Haffner. Every image
  is drawn and every sound synthesized at runtime, all in one HTML file. It was
  made for the CHARGE jam theme.
