slug: plugs
title: PLUGS
tagline: Plug in lamps and mix colored light to brighten seven rooms in a dark house.
description: >-
  The game opens on a dark title screen with a single lamp, a wall outlet and a
  cord, and a click starts it. From there you drag plugs into outlets, carry
  lamps around, open drawers and flip switches, all with the mouse, to light
  each room of a dark house.


  There are seven rooms, each with its own puzzle logic, color palette and era.
  The puzzles turn on telling colored light apart, since pools of colored light
  mix on the wall. Lighting is computed per pixel, with cast shadows and dust
  that shows only where light falls.


  Cords are simulated as ropes. They sag and tangle, and heavy-gauge ones resist
  being dragged. Outlets are scarce, and a breaker has to be kept in mind.
  Sixty-five secrets are hidden in the walls, paint and plaster, along with
  easter eggs.


  A 59-page in-game owner's manual holds wiring diagrams, an appliance register
  and a plug annex. Each room has a hint option that nudges without solving. An
  optional bulb marks setting stamps a letter on each lit lamp so no puzzle
  depends on hue alone. Progress saves in the browser. Design is by Grant
  Haffner, with the code and pixel art written by Claude and drawn at runtime,
  with synthesized sound.
