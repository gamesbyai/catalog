slug: n1
title: n1
tagline: Race a car around a track in a Formula 1-inspired browser racer.
description: >-
  n1 is a browser racing game inspired by Formula 1. The player drives a car
  around a track in a setting the creator calls a race in wonderland, taking on
  the course in a 3D view. It is built to run on the web and works on mobile
  devices as well as desktop.


  The game supports multiplayer, so races can be shared with other players
  rather than run alone against the clock. The idea came from the creator
  spending a lot of time playing F1 games and wanting to see how a similar
  experience could be built for the web.


  It was entered in Vibe Jam 2026. The creator built it with Claude Code, and
  the 3D rendering runs on Three.js, which handles the track and the cars in the
  browser.
