slug: six-midnight-shifts
title: Six Midnight Shifts
tagline: Run a convenience store and check every customer against county records.
description: >-
  Seventeen people vanished along a service corridor in Gray County, and the
  emergency radio is telling every business still open to check each customer
  against county records.


  You're running a convenience store, serving impatient customers while keeping
  it in shape. The game also mixes survival sim with identity checks and
  spotting what's off.


  According to the bulletin, the visitors resembling the dead aren't the
  residents who were formally identified. You compare faces and answers against
  county records to verify identity. Check answers along with faces when the
  visitors look and sound like the deceased.


  Your sidearm only comes out once you're certain a skinwalker isn't human.
  Anyone who can't verify personal information stays out.


  Shift at Midnight is the game's inspiration, a name that shares its midnight
  and shift words with the title.
