slug: six-midnight-shifts
title: Six Midnight Shifts
tagline: Run a convenience store and check every customer against county records.
description: >-
  Playing alone, you run a convenience store in Gray County, where seventeen
  people vanished along a service corridor. The emergency radio tells every
  business still open to check each customer against county records. Per the
  bulletin, visitors resembling the dead aren't the formally identified
  residents.


  Impatient customers to serve. Store upkeep. Survival sim mixed with identity
  checks and spotting what's off.


  Compare faces and answers against county records to verify identity. Check
  answers along with faces when a visitor looks and sounds like someone who
  died. Keep out anyone who can't verify their personal information. Draw your
  sidearm only when certain a skinwalker isn't human.


  Inspired by Shift at Midnight.
