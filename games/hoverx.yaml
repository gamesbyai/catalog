slug: hoverx
title: HoverX
tagline: Race a hoverboard down a slope, with visual effects and an AR mode.
description: >-
  HoverX is a downhill racing game in which the player rides a hoverboard along
  a slope. The goal is to keep the board moving quickly down the course, in a
  style that draws on skating and snowboarding. It runs in the browser and is
  set up for mobile play.


  The game adds visual effects to the ride and includes an AR mode that brings
  the hoverboard experience into the player's surroundings. The creator
  describes it as a personal hobby project inspired by skating and snowboarding,
  and that influence shapes the downhill focus.


  It was built with Three.js as an entry in Vibe Jam 2026, where it placed 339th
  out of 945 entries. The creator states that Gemini was used to make it.
