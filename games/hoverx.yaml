slug: hoverx
title: HoverX
tagline: Race a hoverboard down a slope, with visual effects and an AR mode.
description: >-
  You ride a hoverboard down a slope in this downhill racing game.


  A goal of keeping the board moving quickly from the top of the course to the
  bottom. Visual effects layered over the ride. An AR mode with the hoverboard
  moved out of the course and into your own surroundings.


  menrva33 describes HoverX as a personal hobby project. Skating and
  snowboarding inspired its riding style.
