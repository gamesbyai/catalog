slug: rucksy
title: Rucksy
tagline: Explore a self-building haunted mansion with friends until one of you
  turns traitor.
description: "When the house turns, you learn who at the table has secretly been
  working against you. Until then, you explore a haunted mansion together.


  A mansion that builds itself one room at a time, its map growing as you
  explore. Events, Items and Relics drawn as you go. Bone dice to roll. AI
  investigators for empty seats when you're a few players short.


  Play from your own phone. As the host, you open a room, and the other players
  join it with a code. A TV can show the house to the whole table. Skip the
  download and sign-up before the haunting starts.


  Alvin had board games in mind and asked AI to build them. Candlewake, the
  haunted-house one, is an original game from Rucksy."
