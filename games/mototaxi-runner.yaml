slug: mototaxi-runner
title: Mototaxi Runner
tagline: Drive a mototaxi against the clock to get each passenger to their
  destination on time.
description: >-
  Steer a mototaxi through a city, racing the clock on each passenger trip. The
  trips are modeled on the daily routine of mototaxi drivers, who hurry to get
  passengers there on time.


  Upgrades at the workshop. Free mode for racing lap times. Your nickname and
  best free-mode run, saved locally on your device.


  Start a race from the menu, then press W or the up arrow to accelerate and S
  or the down arrow to brake. Steer with A and D or the left and right arrows.
  Press R to restart a run. On a phone, hold the device with two hands. Steer
  with the left side of the screen, and use the right side for gas and brake.
  You can also steer by tilting the phone.
