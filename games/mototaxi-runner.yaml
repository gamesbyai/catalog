slug: mototaxi-runner
title: Mototaxi Runner
tagline: Drive a mototaxi against the clock to get each passenger to their
  destination on time.
description: >-
  Mototaxi Runner is a 3D driving game where you take the wheel of a mototaxi
  and race the clock on every trip. Each fare is a timed run: you pick up a
  customer and try to get them to their destination before time runs out.


  The game draws on the daily routine of mototaxi drivers, who deal with time
  pressure to deliver their customers punctually. That everyday setting gives
  the racing and simulation mix a grounded, human angle instead of a purely
  competitive one. It supports multiplayer and runs on mobile devices as well.


  It was entered in Vibe Jam 2026, where it placed 466th out of 945 entries. The
  creator says it was built with Cursor, and it runs on Three.js.
