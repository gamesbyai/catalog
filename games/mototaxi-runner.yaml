slug: mototaxi-runner
title: Mototaxi Runner
tagline: Drive a mototaxi against the clock to get each passenger to their
  destination on time.
description: >-
  Press W or the up arrow to accelerate, S or the down arrow to brake, and A/D
  or the left and right arrows to steer a mototaxi through a city. Each trip is
  a race against the clock, modeled on the daily routine of mototaxi drivers who
  hurry to get passengers there on time.


  You can start a race with Iniciar carrera, or head to the Taller / Mejoras
  workshop for upgrades. There is also a free mode, where you can race for lap
  times. Your nickname and best free-mode run are saved locally.


  Press R to restart a run. On a phone, hold the device with two hands: steer
  with the left side of the screen, and use the right side for gas and brake.
  Steering by tilting the phone is also available on mobile.
