slug: long-wind
title: long wind
tagline: Fight in real-time wuxia combat inside your browser.
description: >-
  Long Wind (长风) is a real-time wuxia action game that runs in the browser. It
  is set in the martial-arts fantasy tradition and centers on live combat rather
  than turn-based exchanges, so the player reacts to what happens on screen as
  it unfolds.


  The game is rendered in three.js with WebGL, which puts a 3D take on the wuxia
  setting directly in a web page with nothing to install. The repository
  describes the project as an action game, and its focus is on moment-to-moment
  swordplay and movement.


  According to the repository description, all of the code was written by Claude
  Opus 5.5, and the first playable version came together in about a day. The
  repository tags also mention Claude Code, though the description itself does
  not say which tool produced the code.
