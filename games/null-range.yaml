slug: null-range
title: Null Range
tagline: Fly a first-person spacecraft and dogfight other pilots online
description: >-
  Null Range puts you in a cockpit for first-person dogfights against other
  pilots online. You fly your ship through open space and try to get enemy craft
  in your sights while staying out of theirs. It plays in the browser on desktop
  and on phones.


  The creator points to Elite: Dangerous as a reference, which fits the emphasis
  on cockpit-view flight. Built with Cursor and Three.js, it placed fourth of
  945 at Vibe Jam 2026 and won the Best Art Direction award, presented by
  Cursor, so the jam singled out its visual style.


  The combat is action-oriented, pairing a shooter's aiming with a flight
  simulator's handling, and every exchange comes down to putting the other ship
  in your sights before it puts you in its own.
