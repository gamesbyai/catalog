slug: null-range
title: Null Range
tagline: Fly a first-person spacecraft and dogfight other pilots online
description: >-
  In Null Range you dogfight other pilots online. You fly your ship through open
  space and try to get enemy craft in your sights before they get you in theirs.


  First-person flight. Action-oriented combat. Shooter-style aiming paired with
  flight simulator handling.


  taylor_sntx points to Elite: Dangerous as a reference for this game.
