slug: null-range
title: Null Range
tagline: Fly a first-person spacecraft and dogfight other pilots online
description: >-
  Null Range is a first-person space dogfighting game played in multiplayer. You
  sit in a cockpit, pilot your ship through open space, and try to get enemy
  craft in your sights while staying out of theirs. Combat is action-oriented,
  with a shooter's aiming and a flight simulator's handling.


  The game placed fourth out of 945 entries in Vibe Jam 2026 and won the award
  for best art direction, presented by Cursor. The listing points to Elite:
  Dangerous as a reference, which fits the emphasis on cockpit-view flight. It
  is also marked as playable on mobile, alongside desktop.


  It runs in the browser on Three.js. The creator built it with Cursor, and the
  jam recognized the visual style in particular.
