slug: the-princess-and-the-mech
title: The Princess and the Mech
tagline: Click through an underground complex to wake an ancient mech and stop a
  cyber dragon.
description: >-
  You play a princess who has to rescue both herself and her kingdom from a
  cyber dragon. It is a point-and-click adventure: you track down an ancient
  mech, then work your way through an underground complex to charge it up.


  The game uses only the mouse. Left click walks to a spot or uses an item,
  right click examines what is under the cursor, and the mouse wheel opens and
  closes the inventory.


  The visuals are still images and animated clips, and characters have spoken
  voice lines. The music is by Loyzbeats. The creator took inspiration from Neon
  Genesis Evangelion, and Stellar Blade informed the character concept art.


  According to the creator, most of the work used locally run open-weight
  models, with Google AI handling story and code. Images came from Krea 2 with a
  self-trained style LoRA, animation from Wan 2.2, and voices from a TTS model.
  The only sound effect, a moving plate, came from a video model.
