slug: the-princess-and-the-mech
title: The Princess and the Mech
tagline: Click through an underground complex to wake an ancient mech and stop a
  cyber dragon.
description: >-
  As a princess, save yourself and your kingdom from a cyber dragon by tracking
  down an ancient mech and charging it back up in an underground complex.


  A classic point-and-click adventure. Scenes built from still images and
  animated clips. Characters who speak their lines out loud. Music by Loyzbeats.


  Left-click to walk or use an item, right-click to look at what's under the
  cursor, and scroll to open and close the inventory.


  morozig drew on Neon Genesis Evangelion, with Stellar Blade feeding into the
  character art. According to the creator, most of it came from open-weight
  models run locally, with Google AI handling the story and code. Krea 2 and a
  self-trained style LoRA made the images, Wan 2.2 the animation and a TTS model
  the voices.
