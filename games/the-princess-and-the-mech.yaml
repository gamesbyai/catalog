slug: the-princess-and-the-mech
title: The Princess and the Mech
tagline: Click through an underground complex to wake an ancient mech and stop a
  cyber dragon.
description: >-
  You play the whole thing with the mouse, like the old point-and-click
  adventures. Left click walks your princess somewhere or uses whatever you
  clicked on, and right click gives you a closer look at it, so you never need
  the keyboard.


  The mouse wheel opens and closes your inventory. There's an inventory bar
  sitting at the bottom of the screen too.


  You're a princess who has to save herself and her kingdom from a cyber dragon.


  To do it, you find an ancient Mech and make your way through an underground
  complex to charge him up, which is a pretty big job for someone starting out
  in a bedroom.


  That bedroom has cracked stone walls, a heavy sci-fi door with a glowing
  panel, and neon tubes along the ceiling. A tall wardrobe mirror holds a purple
  crystal, and a yellow sticky note is stuck to the wall, which is a funny thing
  to find in a fairy-tale room.


  The creator took inspiration from Neon Genesis Evangelion, with a little
  Stellar Blade in the character concept art. Almost everything was made with
  local open-weight models, while Google AI helped with the story and code, and
  Loyzbeats wrote the music.
