slug: the-princess-and-the-mech
title: The Princess and the Mech
tagline: Click through an underground complex to wake an ancient mech and stop a
  cyber dragon.
description: >-
  As a princess, you have to save yourself and your whole kingdom from a cyber
  dragon, and an ancient mech is part of the plan. First you track the thing
  down. Then you work your way through an underground complex to get it
  charged back up.


  It's a classic point-and-click adventure, and everything happens with the
  mouse. Left click walks you somewhere or uses an item, right click looks at
  whatever's under the cursor, and the scroll wheel opens and closes the
  inventory.


  One bedroom scene is a funny clash of fairy tale and bunker, with an ornate
  mirror, bookshelves and a tufted bed sitting under neon tubes beside a riveted
  metal door with a keypad.


  Scenes are built from still images and animated clips, and the characters
  speak their lines out loud. Loyzbeats made the music.


  morozig took inspiration from Neon Genesis Evangelion, while Stellar Blade fed
  into the character concept art.


  According to the creator, most of it came from open-weight models run locally,
  with Google AI handling the story and code. Krea 2 and a self-trained style
  LoRA made the images, Flux Klein handled edits, Wan 2.2 did the animation and
  a TTS model voiced the lines. They also say the game's only sound effect, a
  moving plate, came out of a video model of all things.
