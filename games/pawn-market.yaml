slug: pawn-market
title: Pawn Market
tagline: Trade live chess positions at shifting odds and cash out before the game ends.
description: >-
  Pawn Market mixes chess with a prediction-market exchange. Instead of only
  moving pieces, players trade on live game positions, buying and selling shares
  as the odds change during play. The aim is to make a profit before the result
  is settled, so reading the board well matters as much as timing a trade.


  The twist is that players can also earn from their own games, which turns a
  chess match into a market with a personal stake. It is built around the idea
  of trading on outcomes you can influence, and it is playable with other people
  and on mobile devices.


  The creator says the idea came from hating to lose at chess and liking the
  fantasy of inside trading on a prediction market. It was entered in Vibe Jam
  2026, and the creator built it with Claude Code.
