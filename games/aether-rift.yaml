slug: aether-rift
title: Aether Rift
tagline: Dodge dense patterns of projectiles and shoot back in a bullet hell shooter.
description: >-
  Aether Rift is a bullet hell shooter in which the player steers a ship through
  crowded screens of incoming projectiles while firing back at enemies. Each run
  is about reading the patterns, finding gaps to slip through, and staying alive
  as long as possible.


  The project comes from a creator who had never programmed before and wanted to
  find out whether a playable bullet hell was within reach. The result is a
  working action shooter that entered the Vibe Jam 2026, where it placed 576th
  among 945 entries.


  The creator built it with Claude Code and describes the experience as a
  pleasant surprise, saying the tools made it possible to get a playable game
  running without prior programming experience. It runs on the Phaser framework.
