slug: terrastrike-terra
title: terrastrike/terra
tagline: Purify a toxic world from the deep sea up to a surface garden as an
  evolving guardian.
description: >-
  The game opens underwater in a level called The Deep, seen from above. A diver
  in an armored suit stands among seaweed, rocks and sunken wreckage, lit by
  pale shafts of light. A panel on the left tracks a purification percentage, a
  timer, ammo (40 of 40), the equipped Standard Blaster and an inventory that
  starts empty.


  You move with WASD and fire with Space. A hull integrity bar sits at the
  bottom of the screen. An RP counter in the top right corner links to a shop on
  U, the armory opens on C, and keys 1 to 4 trigger emotes.


  The goal is to purify a toxic world, working from the deep sea up to a surface
  garden, while the character evolves into a guardian protecting the last
  sanctuary of life. The creator drew on the contrast of a dark industrial
  wasteland turning back into a colorful, living ecosystem.
