slug: terrastrike-terra
title: terrastrike/terra
tagline: Purify a toxic world from the deep sea up to a surface garden as an
  evolving guardian.
description: >-
  The first level, The Deep, starts you on the seafloor in an armored diving
  suit.


  Your job is to purify a toxic world, working your way from the deep sea up to
  a surface garden while your diver evolves into a guardian protecting the last
  sanctuary of life.


  Your cleanup progress is measured as a purification percentage. You're
  carrying a Standard Blaster.


  You move with WASD and fire with Space. RP ties into the shop, which opens on
  U, while the armory opens on C. Keys 1 to 4 trigger emotes.


  Srikanth built the game around nature's resilience. The contrast they drew on
  is a dark industrial wasteland turning back into a living ecosystem.
