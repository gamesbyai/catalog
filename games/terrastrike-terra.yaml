slug: terrastrike-terra
title: terrastrike/terra
tagline: Purify a toxic world from the deep sea up to a surface garden as an
  evolving guardian.
description: >-
  The first level, The Deep, starts you on the seafloor in an armored diving
  suit. You purify a toxic world, rising from the deep sea to a surface garden.
  Your diver evolves into a guardian of the last sanctuary of life.


  Cleanup measured as a purification percentage. A Standard Blaster for your
  diver. RP to spend in the shop.


  Move with WASD and fire with Space. Press U for the shop and C for the armory.
  Press 1 to 4 for emotes.


  Srikanth built the game around nature's resilience. Its contrast is a dark
  industrial wasteland becoming a living ecosystem again.
