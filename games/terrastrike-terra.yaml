slug: terrastrike-terra
title: terrastrike/terra
tagline: Purify a toxic world from the deep sea up to a surface garden as an
  evolving guardian.
description: >-
  In terrastrike/terra you start in the deep sea and work your way up to a
  surface garden, purifying a toxic world as you climb. It is an
  action-adventure with shooter and RPG elements, and your character evolves
  into a stronger guardian on the way, with the last sanctuary of life to
  protect.


  Nature's resilience is the theme. Google's Antigravity and Three.js were the
  tools, and it ended up 540th of 945 in Vibe Jam 2026. The game runs in the
  browser as a single-player adventure.


  Contrast carries the idea. Dark, industrial wasteland gives way to a colorful,
  thriving ecosystem as each area is cleansed, so your progress shows up
  directly in the scenery, from the deep sea up to the surface garden. The
  guardian's growing power mirrors the world's recovery.
