slug: peak-surge
title: Peak Surge
tagline: Carve down an endless mountain at dusk and reach each checkpoint before
  time runs out.
description: >-
  Carve left and right with the arrow keys to steer your snowboarder down an
  endless mountain. Your job is to get through each checkpoint before the timer
  runs out, and every run is a chance to beat your best score.


  Rails and rings for chaining combos. Wipeouts on any landing that isn't flat.
  Tricks that refill the boost meter and move you closer to Surge. Surge,
  triggered by a full boost meter. Checkpoints, combos, boost and Surge running
  at the same time. A leaderboard for your runs.


  Hold Space to crouch, then release it to jump. While you're in the air, press
  Space again to grab, and left and right spin you around. Use up and down to
  tuck, brake or flip, depending on whether you're off the ground. Press Shift
  to fire your boost.
