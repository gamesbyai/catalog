slug: cybertaxi
title: Cybertaxi
tagline: Hijack a robo-taxi and fly through a neon city to earn your freedom.
description: >-
  Cybertaxi is a cyberpunk arcade flight game. You hijack a robo-taxi and race
  through a neon-lit city, with the goal of earning your freedom. Each run is a
  dash across the skyline while you dodge hazards and keep the cab in one piece.


  Rival AI taxis, storms, and other obstacles stand between you and the finish,
  so the ride mixes racing with survival. The creator drew on childhood memories
  of playing Simpsons: Hit and Run with a friend, and wanted a taxi game in a
  similar spirit but set in a cyberpunk future.


  The creator built it with Codex on Three.js. They also wanted a more cinematic
  feel, so they tried Suno for music and ElevenLabs for spoken dialog. It was
  submitted to Vibe Jam 2026.
