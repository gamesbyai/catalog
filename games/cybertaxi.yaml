slug: cybertaxi
title: Cybertaxi
tagline: Hijack a robo-taxi and fly through a neon city to earn your freedom.
description: >-
  You're a hijacker in a stolen robo-taxi, flying through a rainy neon city at
  night and picking up passengers for their fares.


  The target is 10,000 credits by sunrise, which is how you earn your freedom.
  Each fare shows up as a glowing marker with its payout floating above it, and
  you pick a passenger to lock in the fare.


  Because the taxi flies, you rise and descend between the towers as well as
  steer and strafe. A boost, EMP charges and Super Boost charges are there when
  you need them, and an energy bar keeps track of what you've got left. Rival AI
  taxis, storms and other obstacles try to get in your way.


  A radar in the corner tells you how many fares are live and how far the
  nearest one is, which is handy in a city this crowded with towers.


  The top corner counts your credits, your heat and the rivals nearby. A
  character with a portrait drops short lines of text in the other corner, and
  the opening ones set up the debt and the sunrise deadline.


  Todd Goates built it after years of playing Simpsons: Hit and Run with a
  friend, and he wanted a taxi game in that spirit with a cyberpunk setting. He
  also used Suno for the music and ElevenLabs for the spoken dialog, to see how
  cinematic an AI-made game could get.


  You can pause, mute the music or flip between tracks while you drive.
