slug: cybertaxi
title: Cybertaxi
tagline: Hijack a robo-taxi and fly through a neon city to earn your freedom.
description: >-
  You've just hijacked a robo-taxi, and you're flying it through a city with a
  goal of 10,000 credits by sunrise.


  Passengers waiting for a ride show up around the city, each with a marker
  above them. Each passenger's fare is shown up front, like 139 cr, and you pick
  one to lock that fare in.


  Since this taxi flies, the streets aren't your only lanes. Along with steering
  and strafing, you can rise and descend, so the whole city opens up in three
  dimensions. Rival AI taxis, storms and other obstacles stand between you and
  the money. Your taxi carries EMP and Super Boost charges.


  The story is told through character dialog, and the lines carry a bit of noir
  gloom about the city. You can switch to another music track.


  toddgoates wanted a taxi game in the spirit of Simpsons: Hit and Run, but set
  in a cyberpunk city. They made the music and dialog with Suno and ElevenLabs.
