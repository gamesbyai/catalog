slug: cybertaxi
title: Cybertaxi
tagline: Hijack a robo-taxi and fly through a neon city to earn your freedom.
description: >-
  You hijack a robo-taxi and fly it through a rainy neon city at night, with a
  goal of 10,000 credits by sunrise. A third-person view follows the car between
  skyscrapers, and glowing markers hover over waiting passengers, each showing a
  fare such as 139 cr.


  A circular navigator in the corner tracks nearby fares and the distance to the
  closest one. The HUD shows current fare, credits, district, heat and rival
  count. Thrust, boost and energy bars sit in the lower left, next to counters
  for EMP and Super Boost charges.


  The car can rise and descend as well as steer and strafe, so you move through
  the city in three dimensions. The run is set against rival AI taxis, storms
  and other obstacles.


  A character portrait delivers story lines in a text box at the top, and a
  music track plays that you can mute or switch. The creator wanted a taxi game
  in the spirit of Simpsons: Hit and Run, set in a cyberpunk city, and made the
  music and dialog with Suno and ElevenLabs.
