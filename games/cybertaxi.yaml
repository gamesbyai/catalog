slug: cybertaxi
title: Cybertaxi
tagline: Hijack a robo-taxi and fly through a neon city to earn your freedom.
description: >-
  You've just hijacked a robo-taxi, and you're flying it through a rainy neon
  city at night with a goal of 10,000 credits by sunrise.


  A third-person camera trails the car between the skyscrapers while glowing
  markers hover over passengers waiting for a ride. Each one shows its fare up
  front, like a pretty modest 139 cr against that huge target, and you pick a
  passenger to lock that fare in.


  Since this taxi flies, the streets aren't your only lanes. Along with steering
  and strafing, you can rise and descend, so the whole city opens up in three
  dimensions. Rival AI taxis, storms and other obstacles stand between you and
  the money.


  A round navigator in the corner tracks nearby fares and the distance to the
  closest one, which helps in a city full of towers this tall.


  The top right of the screen shows your current fare and your credits, plus the
  district you're in, your heat and how many rivals there are. Down in the lower
  left sit bars for thrust, boost and energy. Next to them you'll find counters
  for EMP and Super Boost charges, a surprising amount of hardware for a cab.


  The story comes through a character portrait that pops up in a box at the top,
  and its lines carry a bit of noir gloom about the city. There's a music track
  playing, and you can mute it or switch to another one.


  toddgoates wanted a taxi game in the spirit of Simpsons: Hit and Run, but set
  in a cyberpunk city. They made the music and dialog with Suno and ElevenLabs.
