slug: cybertaxi
title: Cybertaxi
tagline: Hijack a robo-taxi and fly through a neon city to earn your freedom.
description: >-
  You hijack a robo-taxi and fly it through a city. Since the taxi flies, the
  streets aren't your only lanes. Your goal is 10,000 credits by sunrise.


  Passengers waiting around the city. Steering, strafing, and rising or
  descending in three dimensions. Rival AI taxis, storms, and other obstacles.
  EMP and Super Boost charges for your taxi. Story told through character
  dialog, its lines carrying a bit of noir gloom about the city. Music tracks
  you can switch between.


  Find a passenger by the marker above them. Each passenger's fare is shown up
  front, like 139 cr. Pick one to lock that fare in.


  toddgoates wanted a taxi game in the spirit of Simpsons: Hit and Run, but set
  in a cyberpunk city. They made the music and dialog with Suno and ElevenLabs.
