slug: ziwziw
title: ZiwZiw
tagline: Race your piece across the board to reach your opponent's starting point first.
description: >-
  You win by getting a piece to the opponent's starting point before they get to
  yours. That's the whole goal, and it's meant to be something you can grasp the
  second you see it.


  Landing on an opponent sends them back to their start, so a good move can undo
  a lot of someone else's progress. Overshoot the goal and you don't win,
  because you bounce back instead.


  That bounce rule is a nice little trap for anyone rushing the finish.


  The creator loves chess and wanted something simpler that anyone could
  understand right away, but that still asks for focus and strategic thinking.
  The title screen says there's no luck involved, just skill.


  You can play a ranked match online, practice against a bot, or set up a game
  with a friend.
