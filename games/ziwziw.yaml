slug: ziwziw
title: ZiwZiw
tagline: Race your piece across the board to reach your opponent's starting point first.
description: >-
  Race your piece to your opponent's starting point before theirs reaches yours.


  Pieces that land on an opponent's piece and send it all the way back.
  Overshooting the goal and bouncing back. No luck, just skill, as the title
  screen puts it. Ranked online games, practice against a bot or a friend.


  Push ahead or block, one turn at a time.


  lordahmed3d loves chess and wanted a game with simpler rules that anyone can
  pick up right away.
