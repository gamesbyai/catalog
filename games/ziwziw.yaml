slug: ziwziw
title: ZiwZiw
tagline: Race your piece across the board to reach your opponent's starting point first.
description: >-
  Whoever gets their piece onto the other player's starting point first wins,
  while your opponent races the opposite way toward yours. You take turns, and
  each move comes down to weighing whether to push ahead or get in their way.


  Land on the opponent's piece and it goes all the way back to its start, a
  harsh reset for such a short rulebook. Overshooting has its own sting,
  because moving past the goal bounces you back. The title screen sums the
  game up as no luck, just skill.


  There are plenty of ways to get a match going, since you can jump into ranked
  online games, practice against a bot or set up a game with a friend.


  The rules are built so you get them at a glance, so a match starts quickly. It
  still asks for focus and strategic thinking, though.


  There's room to improve as you start spotting better plans, move by move.


  lordahmed3d made it out of a fondness for chess. The aim was a game with
  simpler rules that anyone can pick up right away.
