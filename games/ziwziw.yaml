slug: ziwziw
title: ZiwZiw
tagline: Race your piece across the board to reach your opponent's starting point first.
description: >-
  ZiwZiw is a two-player race across a board: get your piece to your opponent's
  starting point before they get theirs to yours. You take turns moving, and
  each turn is a balance between advancing and blocking the other side.


  The game grew out of the creator's fondness for chess, with the aim of a
  simpler ruleset that anyone can pick up right away. Cursor is the tool the
  creator names. Out of 945 Vibe Jam 2026 entries, it came 150th. It supports
  online multiplayer on phones as well as desktop.


  The rules are meant to be understood at a glance, so a match starts quickly,
  but it still asks for focus and strategic thinking. There is room to improve
  as you start spotting better plans, move by move.
