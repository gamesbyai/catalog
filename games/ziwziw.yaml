slug: ziwziw
title: ZiwZiw
tagline: Race your piece across the board to reach your opponent's starting point first.
description: >-
  ZiwZiw is a two-player board game where the goal is to be first to reach the
  opponent's starting point. The rules are meant to be understood at a glance,
  so a match starts quickly. Players take turns moving across the board,
  balancing advancement against blocking the other side.


  The game grew out of the creator's fondness for chess. The aim was a simpler
  ruleset that anyone can pick up right away, while still asking for focus and
  strategic thinking during play. That gives it a short learning curve with room
  to improve as you spot better plans.


  It supports multiplayer and runs on mobile devices. ZiwZiw was submitted to
  Vibe Jam 2026, and the creator says it was built with Cursor.
