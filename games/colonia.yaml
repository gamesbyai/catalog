slug: colonia
title: Colonia
tagline: Lay roads, house Roman families, and defend a growing city from raiders.
description: "Lay out roads, drop in homes, and keep the people in them
  supplied. As a home gets what it needs, it grows from a tent into something
  much grander. Unhappy homes produce protesters, thieves and eventually
  rioters, and crowded, unhealthy ones can fall sick.


  Twenty housing levels, topped by an imperial palace. Latin-named buildings,
  from a Horreum for goods to a Castra for your legion. Raids by land, and by
  ship where a river or coast reaches the sea. Twelve partner cities, each with
  its own prices and yearly quota. A ten-step campaign, from a river village to
  a sprawling city split into districts. Sandbox with five landscapes and four
  map sizes, up to 256x256. Hall of Fame for scored wins.


  Trade by caravan and ship, using each partner's card switch to choose who gets
  each good. Answer raids with legions, archers, cavalry and a fleet of
  liburnians. From step 3, pick a peaceful or military post next. Follow the
  governor's career through its ranks, and choose your own salary. Keep the five
  gods of Caesar III, Ceres, Neptune, Mercury, Mars and Venus, content with
  temples and festivals, and they bless the city. Neglect them, and they strike.


  Er2oneousbit asked for a Caesar III style game, built without any of the
  original's code or art. The art is drawn in code, and the sound and music are
  synthesized live."
