slug: codex-usage-game
title: codex usage game
tagline: Play a one-minute arcade round tucked inside a usage chart.
description: >-
  Hop between the lines of a Codex usage chart with the up and down arrows or W
  and S. The graph itself is the playing field, so a dry dashboard of usage
  lines turns into a little arcade track.


  There are broken signals to dodge along the way, and echoes to collect.


  When there's nowhere left to go, Space or a tap fires a phase pulse that
  carries you straight through the danger. A pulse meter sits at the top
  starting at 60 percent, next to readouts for clarity, a phrase multiplier
  and three diamonds of signal. It's a committed bit of dressing, since every
  label sounds like it belongs on a dashboard for a failing transmission.


  Each round lasts about a minute, and you're trying to get through it and do as
  well as you can before the timer runs out. Make it through the full 60 seconds
  and the transmission is restored.


  You can also drag to pick a contour. P pauses, M toggles the sound, and
  there's a Restart button right under the chart for another try.


  According to petergpt's GitHub README, the AI designed, built and polished it
  in a surprisingly short 30 minutes, starting from a screenshot. petergpt
  credits the idea to an original post by @thsottiaux. The code is released
  under the MIT license.
