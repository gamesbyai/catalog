slug: codex-usage-game
title: codex usage game
tagline: Play a one-minute arcade round tucked inside a usage chart.
description: >-
  Ride the contour lines of a Codex usage chart in this arcade game. The chart
  itself is the playing field.


  Broken signals to dodge along the way. Echoes to collect. A phase pulse for
  getting through danger. Rounds of about one minute, set against a timer.
  Surviving the full 60 seconds to restore the transmission.


  Use the up and down arrows or W and S to hop between lines. When there's
  nowhere left to go, press Space or tap to fire the phase pulse that carries
  you straight through the danger. The pulse meter starts at 60 percent. You can
  also drag to pick a contour.


  According to petergpt, the AI designed, built and polished the game in 30
  minutes, starting from a screenshot. The idea is credited by petergpt to an
  original post by @thsottiaux. The code is released under the MIT license.
