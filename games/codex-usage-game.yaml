slug: codex-usage-game
title: codex usage game
tagline: Play a one-minute arcade round tucked inside a usage chart.
description: >-
  Hop between lines of Codex usage data with the up and down arrows or W and S.
  The chart itself is the playing field.


  There are broken signals to dodge along the way, and echoes to collect.


  When there's nowhere left to go, Space or a tap fires a phase pulse that
  carries you straight through the danger. A pulse meter starts at 60 percent.


  Each round lasts about a minute, and you try to get through it before the
  timer runs out. Make it through the full 60 seconds and the transmission is
  restored. You can also drag to pick a contour.


  According to petergpt's GitHub README, the AI designed, built and polished it
  in 30 minutes, starting from a screenshot. petergpt credits the idea to an
  original post by @thsottiaux. The code is released under the MIT license.
