slug: codex-usage-game
title: codex usage game
tagline: Play a one-minute arcade round tucked inside a usage chart.
description: >-
  Codex Usage Game is a short arcade game that lives inside a chart of Codex
  usage. Each run lasts about one minute, so a session is a quick attempt to get
  through the round and do as well as possible before the timer ends.


  The main hook is the setting. Instead of a typical game screen, the playing
  field is disguised as a familiar usage graph, which turns a dry dashboard into
  something you can play. The one-minute length keeps rounds tight and makes it
  easy to jump straight back in for another try.


  The project is hosted on GitHub, and the listing points to Codex as the tool
  involved, with OpenAI as the provider. Beyond that, the game keeps its scope
  small: one idea, one short round, and a joke that fits the chart it hides in.
