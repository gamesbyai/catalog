slug: codex-usage-game
title: codex usage game
tagline: Play a one-minute arcade round tucked inside a usage chart.
description: >-
  Press up and down, or W and S, to hop between the wavy contour lines running
  across the screen. You can also drag to pick a line, which comes in handy on a
  touch screen.


  The lines look like a usage chart, and you ride along one of them while broken
  signals come at you. You dodge those and collect the echoes scattered along
  the way.


  When a line has nowhere safe left to go, hit Space or tap to send out a phase
  pulse and slip straight through the danger. The pulse is limited, and the top
  bar shows a pulse percentage so you know how much you've got.


  That same bar also shows your clarity score, a row of signal diamonds, a
  phrase multiplier and the seconds remaining.


  A round lasts 60 seconds. Make it to the end and the transmission is restored,
  which is the whole goal.


  The creator was inspired by a post from @thsottiaux, and GPT-5.6-Sol-Ultra
  designed, built and polished the game in 30 minutes, starting from a
  screenshot of a Codex usage chart. That's a pretty literal way to turn a chart
  into a level.


  Buttons under the board let you restart or pause, and you can switch the sound
  off.
