slug: set-hunter
title: Set Hunter
tagline: Open card packs, trade singles, and finish animal card sets before time
  runs out.
description: >-
  The goal is to complete a set of animal-themed cards in as little time as you
  can. You open packs, buy single cards, and sell duplicates for money. Quirky
  NPCs show up with events you have to handle, and perks change how a run plays
  out.


  The game includes four sets: Home & Farm, Aquatic World, Desert, and African
  Savanna. Each set has 5 cards. A run starts from the menu, and the game also
  has a Skill Tree, a Codex, and a Leaderboard.


  Worldwide Ace Discoveries has a row of hidden slots for each set. It tracks
  the rare finds that players share across the community. The creator built the
  game to capture the tension of opening trading card packs and to turn it into
  a short roguelike loop.
