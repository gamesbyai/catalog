slug: set-hunter
title: Set Hunter
tagline: Open card packs, trade singles, and finish animal card sets before time
  runs out.
description: >-
  Set Hunter is a short roguelike about completing an animal-themed card set as
  quickly as you can, before time runs out. You open packs, buy single cards,
  and sell your duplicates to keep money moving, all while keeping an eye on how
  much cash is left.


  Rare finds are also a community chase. Global discoveries are shared across
  everyone who plays, so players hunt the rare cards together. Cursor and
  Three.js went into this Vibe Jam 2026 entry, which placed 562nd of 945.


  The game is after the feeling of ripping open a pack and hoping the missing
  card is inside, the one that completes the set. Perks change your strategy
  from run to run, and quirky NPCs bring events that can help your plans or get
  in their way.
