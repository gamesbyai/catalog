slug: set-hunter
title: Set Hunter
tagline: Open card packs, trade singles, and finish animal card sets before time
  runs out.
description: >-
  Complete a set of animal-themed cards in as little time as you can. You open
  packs, buy single cards, and sell duplicates for money.


  Four sets, from Home & Farm to African Savanna, with five animal cards each.
  Quirky NPCs with events to handle. Perks that change how a run plays out.
  Worldwide Ace Discoveries, hidden slots per set for rare finds shared across
  the community. A Skill Tree, a Codex, and a Leaderboard.


  GuyGir1 built it to capture the tension of opening trading card packs and turn
  that into a short roguelike loop.
