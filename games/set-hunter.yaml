slug: set-hunter
title: Set Hunter
tagline: Open card packs, trade singles, and finish animal card sets before time
  runs out.
description: >-
  Set Hunter is a trading card collector built as a short roguelike. Each run,
  you try to complete an animal-themed card set as quickly as you can. You open
  packs, buy individual cards, and sell your duplicates to keep your money
  moving, all while watching how much cash you have left.


  The game aims to capture the tension of ripping open a pack and hoping for the
  missing card. Perks shape your strategy from run to run, and quirky NPCs bring
  events that can help or complicate your plans. Players also chase rare finds
  as a community, with global discoveries shared across everyone.


  It was a Vibe Jam 2026 entry, built with Three.js, and the creator used
  Cursor. It is playable on mobile as well as desktop.
