slug: life-on-the-block
title: Life on the Block
tagline: Decorate and arrange your own home on a neighborhood block in 3D.
description: >-
  Life on the Block is a home decoration simulator that mixes light role-playing
  with cozy simulation. The player settles into a place on the block and shapes
  it into a personal home, choosing and arranging decor to suit their own taste.
  It runs in the browser and is built on a 3D scene.


  The creator names Animal Crossing and Harvest Town as inspirations, and that
  shows in the relaxed, low-pressure focus on making a space feel lived in. The
  emphasis falls on decorating and settling in rather than racing a clock or
  beating opponents, which makes it a calm pick for short sessions.


  It was entered in Vibe Jam 2026 as a single-player project. The creator states
  that Cursor was used during development, and the 3D presentation is built with
  Three.js.
