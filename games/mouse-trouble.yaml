slug: mouse-trouble
title: Mouse Trouble
tagline: Sneak, grab loot, and escape as a mouse in a cartoon extraction shooter.
description: >-
  Steal cheese as a tiny mouse, then escape once the exit opens.


  The cat and the roomba, whose contact can ruin the raid. Combos built from
  smacks and grabs. A score from cheese, chaos, chases, tasks and the escape
  itself. Grades and awards after the escape.


  Press E near cheese and tasks to collect them. Smack things with E and grab
  them with Q. Stand inside a mouse hole to extract.


  rfitzpatrick_io says the game draws on loot extraction shooters and was built
  to be multiplayer, fast to load and small in download size.
