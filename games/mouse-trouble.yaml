slug: mouse-trouble
title: Mouse Trouble
tagline: Sneak, grab loot, and escape as a mouse in a cartoon extraction shooter.
description: >-
  Steal cheese as a tiny mouse, then reach a mouse hole once the exit opens.
  Press E near cheese and tasks to collect them. Contact with the cat or the
  roomba can ruin the raid, so keep clear of both.


  Mischief counts too. Smack things with E, grab them with Q, and chain the
  moves into combos. Once the exit opens, stand inside a mouse hole to extract.


  After the escape, the game hands out grades and awards. The score counts
  cheese, chaos, chases, tasks and the escape itself. The creator says it draws
  on loot extraction shooters and was built to be multiplayer, fast to load and
  small in download size.
