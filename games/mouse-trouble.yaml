slug: mouse-trouble
title: Mouse Trouble
tagline: Sneak, grab loot, and escape as a mouse in a cartoon extraction shooter.
description: >-
  In Mouse Trouble you play a mouse in a cartoon extraction shooter: sneak in,
  grab the loot and get out with it. Other players are after the same spoils,
  and the chase-and-scramble spirit comes from golden age cartoons in the vein
  of Tom and Jerry.


  The technical goal was speed and a small footprint. It was built in Three.js
  with Codex, with the aim of keeping the bundle as small as possible, and it
  loads quickly and runs fast in desktop and mobile browsers. It placed 30th of
  945 at Vibe Jam 2026.


  The cartoon theme gives the extraction formula a lighter, slapstick tone, so
  each match turns into a scramble for the same valuables with the other
  players, and getting out with the loot is the goal.
