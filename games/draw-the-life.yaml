slug: draw-the-life
title: Draw the Life
tagline: Draw cards and steer a cartoon character through the ups and downs of a
  lifetime.
description: >-
  Draw the Life, a life-sim card game, has you guide one cartoon character
  through their entire life. You draw cards that shape the character's journey,
  one card at a time. You make choices as events unfold.


  Good and bad turns, steered by the cards. A lighthearted take on life's
  decisions, led by humor and charm. Cute, funny tone with a strategy bent
  underneath.


  Inspired by D&D's character building, Magic the Gathering's card play and the
  milestone-driven path of the Game of LIFE.
