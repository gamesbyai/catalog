slug: draw-the-life
title: Draw the Life
tagline: Draw cards and steer a cartoon character through the ups and downs of a
  lifetime.
description: >-
  Draw the Life is a cute, funny life-sim card game with a strategy bent. The
  player draws cards that shape a character's journey, making choices along the
  way as events unfold and the story of a whole life takes form.


  Its tone mixes tabletop and board game inspirations: the character-building
  feel of D&D, the card play of Magic the Gathering, and the milestone-driven
  path of the Game of LIFE. The result is a lighthearted take on life's
  decisions, where humor and charm lead the presentation.


  It was built in Three.js and entered in Vibe Jam 2026, where it placed 188th
  out of 945 entries. The creator credits Codex, Claude Code, and Antigravity as
  the tools used to make it.
