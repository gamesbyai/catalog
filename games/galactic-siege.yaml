slug: galactic-siege
title: GALACTIC SIEGE
tagline: Send fleets between star systems and capture the galaxy before the
  timer runs out.
description: >-
  Alien empires are carving up a galaxy, and you command the blue Terran star
  systems standing in their way. The galaxy map and alien opponent names are
  randomized every match. The game is playable in English and Portuguese.


  Hyperspace lanes, with map connections setting reach as much as fleet numbers.
  Fortress nodes with reduced incoming damage. Shipyard nodes with faster fleet
  builds. Portal nodes with long jumps between distant systems. Once-per-match
  random events, such as solar storms that cut production, warp surges speeding
  fleets and nanite blooms raising production for every faction, aliens
  included. Four modes, Classic (3 minutes), Blitz (2 minutes, doubled
  production, faster fleets), Conquest (production bonuses for sector
  majorities) and Survival (enemy waves).


  Select a blue system, then click a connected node to send half its garrison.
  Each launch leaves the origin system weaker. Fleets fight on arrival. Send
  more ships than defenders hold to capture. Owned systems build fleets over
  time, so early expansion feeds later attacks. Before a match, pick difficulty
  and map size. In Classic, Blitz and Conquest, eliminate all alien factions or
  hold the top score at time-up. In Survival, outlast enemy waves until the
  timer ends.


  According to ArkantosKira, AI assisted with the game's code and text.
