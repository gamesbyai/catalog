slug: galactic-siege
title: GALACTIC SIEGE
tagline: Send fleets between star systems and capture the galaxy before the
  timer runs out.
description: >-
  You're a Terran commander on a map of star systems joined by hyperspace lanes,
  and you win by sending fleets out from your blue node to take over neutral and
  alien ones. Every match gets a freshly generated map, so the lanes you work
  with change each time.


  Click one of your systems, then click a connected node to launch.


  Every launch sends half of the garrison you picked, which makes each attack a
  trade-off. A bigger strike takes a system more easily, but it also drains the
  node it came from. When fleets arrive they fight, and if you brought more than
  the defenders had, you capture the system.


  Once you own a system, it keeps producing fleets on its own, so grabbing nodes
  early feeds everything after.


  Three structures change how a node behaves. A fortress cuts the damage it
  takes, a shipyard builds fleets faster than a normal system, and a portal
  gives you a long jump lane between distant systems. A legend in the corner
  reminds you which is which, which is handy when the map fills up with icons.


  There are four modes. Classic is a 3-minute war, Blitz is 2 minutes with
  double production and faster fleets, Conquest pays production bonuses for
  holding sector majorities, and Survival sends waves of enemies until the timer
  runs out. In the other three you win by wiping out every alien faction or by
  holding the highest score when time expires.


  Once per match a random event can hit: a solar storm slows production, a warp
  surge speeds up fleets, or a nanite bloom boosts production for everyone. The
  screen also shows a running count of systems and fleets for each side, plus
  toggles for sound effects and music. The text comes in English and Portuguese.
