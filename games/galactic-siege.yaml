slug: galactic-siege
title: GALACTIC SIEGE
tagline: Send fleets between star systems and capture the galaxy before the
  timer runs out.
description: >-
  Galactic Siege starts with you selecting one of your blue Terran star systems
  on a procedurally generated map, then clicking a connected node to launch a
  fleet. Each launch sends half of the selected system's garrison, so every
  attack leaves the origin weaker.


  Fleets travel along hyperspace lanes and fight on arrival. Send more than the
  defenders hold and the system is captured. Owned systems produce new fleets
  over time, so early expansion feeds later attacks. The map's connections
  decide which targets you can reach.


  Four modes change the pace. Classic is a 3-minute war. Blitz lasts 2 minutes
  with doubled production and faster fleets. Conquest awards production bonuses
  for holding sector majorities. Survival sends enemy waves until the timer
  ends, and outlasting them is the win.


  Some nodes carry structures: fortresses reduce incoming damage, shipyards
  produce fleets faster, and portals link distant systems. Once per match a
  random event can hit: a solar storm cuts production, a warp surge speeds
  fleets, or a nanite bloom raises production for every faction. In the other
  modes you win by eliminating all alien factions or holding the highest score
  at time's end.
