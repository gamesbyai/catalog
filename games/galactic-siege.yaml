slug: galactic-siege
title: GALACTIC SIEGE
tagline: Send fleets between star systems and capture the galaxy before the
  timer runs out.
description: >-
  Alien empires are carving up a procedurally generated galaxy, and you're in
  charge of the blue Terran star systems standing in their way. You click one of
  your systems to select it, then click a connected node to send a fleet down
  the hyperspace lane toward it.


  Every launch takes half the garrison of the system you picked, a pretty blunt
  rule that leaves the place it came from weaker after each attack.


  Fleets travel along the lanes and fight the moment they arrive. If you send
  more ships than the defenders hold, the system is yours. Every system you own
  builds new fleets over time, so early expansion feeds the attacks that come
  later, and since the map's connections decide what you can reach, the shape of
  the lanes counts as much as the numbers.


  Some nodes carry a structure, and a considerate little legend in the corner
  spells them out: fortresses take less damage from incoming fleets, shipyards
  build fleets faster, and portals open a long jump lane between distant
  systems.


  Once per match, a random event can hit. It might be a solar storm that cuts
  production, a warp surge that speeds up fleets, or a nanite bloom, a mixed
  blessing since it raises production for every faction, the aliens included.


  Four modes change how long the war runs and what winning means. Classic lasts
  3 minutes, Blitz gives you 2 with doubled production and quicker fleets, and
  Conquest hands out production bonuses for holding sector majorities. In those
  you win by wiping out every alien faction or by holding the top score when
  time's up. Survival cleverly flips it around by sending enemy waves at you,
  and outlasting them until the timer ends is the win.


  The maps get randomized every match, and for some reason the alien opponents'
  names do too. There's plenty of room to tweak things before a match, with
  difficulty settings and map sizes to choose from. It's playable in English and
  Portuguese.


  According to ArkantosKira, AI assisted with the game's code and text.
