slug: slay-the-spore
title: Slay the Spore
tagline: Fight through strategic battles using randomly generated creatures.
description: >-
  Slay the Spore is a strategy game that borrows its structure from Slay the
  Spire. Players work through encounters using mechanics in that style, and the
  creatures they face and use are randomly generated instead of hand-built. It
  runs in the browser and supports mobile.


  The main hook is the mix of two inspirations: the tactical decisions of a
  deck-driven climb and the creature-making spirit of Spore. Because each
  creature is procedurally generated, the opponents and allies vary from run to
  run. The game was entered in Vibe Jam 2026, where it placed 100th among 945
  entries.


  The visuals are built with Three.js, which draws the randomly generated
  creatures in 3D inside the browser, so nothing needs to be installed to play.
