slug: slay-the-spore
title: Slay the Spore
tagline: Fight through strategic battles using randomly generated creatures.
description: >-
  Fight through deck-driven strategic encounters where every creature, yours and
  the enemy's, is randomly generated.


  Creatures nobody designed by hand, drawn in 3D. Opponents and allies that
  change from run to run. The structure of a Slay the Spire climb.


  Inspired by Slay the Spire and by the creature-making spirit of Spore, as the
  name suggests.
