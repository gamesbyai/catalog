slug: slay-the-spore
title: Slay the Spore
tagline: Fight through strategic battles using randomly generated creatures.
description: >-
  Slay the Spore is a strategy game that takes the structure of Slay the Spire
  and fills it with creatures nobody designed by hand. You fight through
  strategic encounters in that deck-driven style, and the creatures you face and
  the ones you use are all randomly generated.


  The name gives away the two inspirations: the tactical decisions of a Slay the
  Spire climb and the creature-making spirit of Spore. Three.js draws each
  generated creature in 3D, right in the browser, and the game placed 100th
  among 945 entries in Vibe Jam 2026.


  Because every creature is procedurally generated, the opponents you fight and
  the allies you fight with change from run to run. It is built for solo play,
  on a phone or a computer.
