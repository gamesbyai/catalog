slug: exploding-hamsters
title: Exploding Hamsters
tagline: Solve puzzles built around explosive hamsters in a cartoon-styled
  mobile-friendly game
description: >-
  Exploding Hamsters is a puzzle game where the hamsters go boom. The player
  works through puzzles built around a single mechanic, setting up the blasts so
  the explosive critters do what the level demands. It runs in the browser and
  works on mobile screens.


  The creator had liked this puzzle mechanic for a long time and wanted to give
  it a proper look. The hamster characters are the visual focus, and they keep a
  consistent, distinctive appearance across the game, which gives the simple
  premise a lot of personality.


  The creator says the art comes from AI image generation, which they felt had
  become good enough to produce consistent, interesting characters. They built
  the frontend with Cursor, and the game was entered in Vibe Jam 2026.
