slug: exploding-hamsters
title: Exploding Hamsters
tagline: Solve puzzles built around explosive hamsters in a cartoon-styled
  mobile-friendly game
description: >-
  Exploding Hamsters is a puzzle game where the hamsters go boom, in a browser
  or on a phone. Every level is built around a single mechanic: you set up the
  blasts so the explosive critters do what the level demands.


  The creator had liked this puzzle mechanic for a long time and wanted to give
  it a proper look. They say the art comes from AI image generation, which they
  felt had become good enough to produce consistent, interesting characters, and
  they built the frontend with Cursor. It ranked 116th of 945 at Vibe Jam 2026.


  The hamsters are the visual focus of this single-player, mobile-friendly
  puzzler. They keep a consistent, distinctive cartoon look across the game,
  which gives a simple premise a lot of personality.
