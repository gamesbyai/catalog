slug: exploding-hamsters
title: Exploding Hamsters
tagline: Solve puzzles built around explosive hamsters in a cartoon-styled
  mobile-friendly game
description: >-
  Hamsters blow up in this puzzle game. Each level uses just one mechanic. Set
  the blasts so the hamsters do what the level needs.


  This puzzle mechanic is one theboredzebra has liked for a long time.
  theboredzebra wanted the game to look polished.


  According to the creator, the art is made with AI. They felt AI images were
  good enough for consistent, interesting characters.
