slug: neon-abyss-salvage
title: Neon Abyss Salvage
tagline: Dive through dark seas, ping for treasure, and surface before your
  oxygen runs out.
description: >-
  You pilot a salvage sub through lightless deep water, grabbing treasure across
  seven biomes such as whale falls, lava rifts, shipwreck graveyards and
  jellyfish forests. Every second and every boost costs air, and you either
  reach an O₂ station to refill or surface with nothing to show for the trip.
  Each zone hides at least three treasures, and getting through one takes 3 to 6
  minutes.


  Sonar pings that mark treasure, mines and larger creatures. Chain-exploding
  mines, set off by torpedoes from afar. Salvaged parts, mostly your currency
  during a run, spent on engines, hull armor, bigger O₂ tanks, sonar, and
  torpedo and decoy bays. Bosses from Zone 3 on, the Kraken, the Leviathan, the
  Sentinel and Erebus, Lord of the Abyss. Mines, the only thing that does real
  damage to bosses. Holo decoys to lure a boss straight into a minefield.
  Currents and seafloor storms.


  On touchscreens, use the virtual joystick and buttons. It works in portrait or
  landscape. Beat Erebus, then extract to earn a final rank. Endless mode then
  keeps you descending as deep as you can go. A full clear takes 30 to 60
  minutes. The game is available in English and Chinese, and it has a Reduce
  Motion option alongside sound and music settings.
