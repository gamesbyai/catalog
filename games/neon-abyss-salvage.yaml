slug: neon-abyss-salvage
title: Neon Abyss Salvage
tagline: Dive through dark seas, ping for treasure, and surface before your
  oxygen runs out.
description: >-
  You're piloting a salvage sub through lightless water, grabbing treasure while
  your oxygen tank runs down. Every second costs air and so does every boost, so
  you either reach an O₂ station to refill or surface with nothing to show for
  the trip. There are at least three treasures tucked into every zone, and
  getting through one takes 3 to 6 minutes.


  Each sonar ping reveals treasure, mines and larger creatures. Mines
  chain-explode, and you can fire torpedoes to set off a minefield from a
  distance.


  Salvaged parts are pretty much your currency during a run, buying engines,
  hull armor, bigger O₂ tanks, better sonar, and bays for torpedoes and decoys.


  From Zone 3 on, you'll run into bosses, namely the Kraken, the Leviathan, the
  Sentinel and finally Erebus, who gets the grand title Lord of the Abyss.
  Nothing but mines does them any real damage. Given that rule, you drop the
  holo decoy to lure a boss straight into a minefield.


  There's a lot of seafloor to cover, with seven biomes like whale falls, lava
  rifts, shipwreck graveyards and jellyfish forests, plus currents and seafloor
  storms.


  Beat Erebus and extract to earn a final rank, after which endless mode lets
  you keep descending as deep as you can go. A full clear takes 30 to 60
  minutes.


  On touchscreens, you control it with a virtual joystick and buttons, and it
  works in portrait or landscape. The game is available in English and Chinese,
  and there's a Reduce Motion option alongside the sound and music settings.
