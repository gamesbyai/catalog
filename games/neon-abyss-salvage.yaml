slug: neon-abyss-salvage
title: Neon Abyss Salvage
tagline: Dive through dark seas, ping for treasure, and surface before your
  oxygen runs out.
description: >-
  You pilot a salvage sub through dark water, collecting treasure while your
  oxygen drains. Every second and every boost uses air, so you refill at O₂
  stations or surface empty-handed. Each zone hides at least three treasures,
  and a zone takes 3 to 6 minutes.


  Sonar pings mark treasure, mines and larger creatures on your radar. Mines
  chain-explode, so you can fire torpedoes to detonate a minefield from a
  distance, or drop a holo decoy to lure a boss into one. Only mines can truly
  hurt the bosses.


  Salvaged parts buy upgrades during a run: O₂ tanks, hull armor, engines,
  sonar, and torpedo and decoy bays. Seven biomes include jellyfish forests,
  shipwreck graveyards, lava rifts and whale falls, with currents and seafloor
  storms. Bosses appear from Zone 3: the Leviathan, the Kraken, the Sentinel and
  Erebus.


  Defeat Erebus and extract to get a final rank, then keep descending in endless
  mode. A full clear takes 30 to 60 minutes. A virtual joystick and buttons
  support touch play in portrait or landscape, and the interface switches
  between English and Chinese.
