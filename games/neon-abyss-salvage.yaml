slug: neon-abyss-salvage
title: Neon Abyss Salvage
tagline: Dive through dark seas, ping for treasure, and surface before your
  oxygen runs out.
description: >-
  You pilot a salvage sub down into the dark, hunting for treasure before your
  oxygen runs out. Every zone hides at least three treasures, and the tank
  drains with every second you spend down there and every time you use your
  boost.


  Sonar is how you find things. You ping the darkness and it marks treasure,
  mines and the bigger shapes that you probably don't want to meet.


  If the tank runs low, you head for an O₂ station or surface empty-handed.


  Mines chain-explode, so you can fire torpedoes to set off a minefield from a
  distance. You can also drop a holo decoy, which is how you lure a boss into
  one, and that matters because only mines can really hurt the bosses.


  The bosses start showing up in Zone 3: the Leviathan, the Kraken, the Sentinel
  and finally Erebus, Lord of the Abyss.


  Salvaged parts pay for upgrades during a run, covering bigger O₂ tanks, hull
  armor, engines, sonar, and bays for torpedoes and decoys. The zones themselves
  vary across seven biomes, including jellyfish forests, shipwreck graveyards,
  lava rifts and whale falls, with currents and seafloor storms pushing you
  around.


  Beat Erebus and extract, and you get a final rank. After that you can keep
  diving deeper in endless mode, which is a generous amount of ocean for a
  browser game.


  It works on touch screens too, with a virtual joystick and buttons in portrait
  or landscape. The game picks English or Chinese on its own, and you can switch
  in settings.
