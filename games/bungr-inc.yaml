slug: bungr-inc
title: BUNGR INC.
tagline: Cook burgers in a cursed kitchen to earn your way to freedom.
description: >-
  BUNGR INC. is a kitchen simulator set in a cursed workplace. The goal is to
  make burgers and, through that work, earn your freedom. Each shift puts you
  behind the counter, assembling orders and keeping production moving so you can
  work your way toward getting out for good.


  The game pairs the familiar rhythm of a cooking sim with an eerie, atmospheric
  setting. The cursed world and its dark aesthetic give ordinary burger assembly
  an unsettling tone, so the kitchen feels like a place you are trapped in
  rather than a cheerful restaurant where you happen to work.


  It was an entry in Vibe Jam 2026, where it placed 11th among 945 entries. The
  game is built with Three.js and runs in the browser, and the creator's
  submission names OpenCode as the tool used to make it.
