slug: bungr-inc
title: BUNGR INC.
tagline: Cook burgers in a cursed kitchen to earn your way to freedom.
description: >-
  You're the cook on a burger line, making burgers to earn your freedom. The
  setting is cursed.


  Orders that arrive as tickets. Countdown clock for every day. Cash quota of
  $70 on Day 1. Starting ingredients on the counter tray, including buns,
  patties, cheese, tomato slices and other toppings. Radio interruptions in the
  middle of your shift, when you're told to listen.
