slug: bungr-inc
title: BUNGR INC.
tagline: Cook burgers in a cursed kitchen to earn your way to freedom.
description: >-
  You're a worker in a dim kitchen full of pipes, looking around in first person
  with a small crosshair in the middle of the screen. The deal is simple: make
  burgers until you've earned your freedom, which is a grim arrangement for a
  fast food job.


  Day one asks for $70, so you know the target before you've touched a bun.


  A brown board on the wall shows that quota next to the cash you've made so
  far. Orders show up on it as tickets, and when nothing's waiting it tells you
  it's holding for the next one. A clock in the top corner counts the day down
  from just over three minutes.


  The ingredients start at a counter with a separate tray for each one. You can
  see a bun, a tomato, a slice of cheese and a few other toppings laid out in a
  row, and a picture chart hangs on the wall nearby.


  There's also a radio on the wall that interrupts you while you work. A message
  tells you to listen when it does, which is an odd instruction to get in a
  burger kitchen where you're working off your freedom.


  The creator liked pairing kitchen simulation with a cursed world and its look,
  and the gloomy lighting and pipes overhead carry that.
