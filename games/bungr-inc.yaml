slug: bungr-inc
title: BUNGR INC.
tagline: Cook burgers in a cursed kitchen to earn your way to freedom.
description: >-
  You work a burger line from a first-person view inside a dim kitchen of
  exposed pipes and fluorescent tubes, making burgers to earn your freedom.
  Orders arrive as tickets on a brown board on the wall, which reads as waiting
  for the next ticket between orders. A small crosshair marks what you point at.


  Each day runs on a countdown clock, and the board tracks your cash against a
  quota. Day 1 sets the quota at $70. Ingredients start at a counter tray
  holding buns, patties, cheese, tomato slices and other toppings, and a card on
  the wall shows ingredient icons.


  A radio on the wall interrupts your shift, and a prompt tells you to listen
  when it does. Text banners on screen greet you at the start and label the
  ingredient counter and the radio. The cursed setting shows in the grainy,
  dithered look and the grimy kitchen, where warm signage stands out against the
  gray.
