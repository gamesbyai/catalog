slug: undead-siege
title: Undead Siege
tagline: Shoot endless zombie waves, buy weapons and perks, and survive as long
  as you can.
description: >-
  Undead Siege is a browser-based first-person zombie survival shooter. Each run
  drops you into a fight against waves of the undead that keep coming. You earn
  the means to buy new weapons and unlock perks between and during rounds, and
  the goal is to last as many rounds as you can.


  The design is openly modeled on the Call of Duty Zombies mode, with dark
  corridors, round-by-round pressure, and a purchase-and-upgrade loop. The game
  is marked as multiplayer, so you can take on the horde alongside friends, and
  it is also flagged as playable on mobile. It was entered in Vibe Jam 2026.


  The creator says they built it entirely through conversation with an AI, using
  AutoPilot by AutoGPT, describing sounds, mechanics, and fixes one message at a
  time instead of writing code by hand. The rendering runs on Three.js.
