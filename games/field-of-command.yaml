slug: field-of-command
title: Field of Command
tagline: Command British or German forces in a real-time battle across 1940 Kent.
description: >-
  You command infantry across a flat, isometric field in Kent, either as the
  desperate British defenders or as the Germans spearheading the assault. It's
  an invasion that never happened, so the 1940s England here is rewritten
  history.


  You start with a single squad, No. 1 Section, and a strength bar under its
  name shows how it's holding up.


  A top bar shows your force against an AI commander, with a bar and a figure of
  2000 for each side. Two more counters sit in the corners: Deploy, which
  trickles up at 0.2 a second, and Tactical, which tops out at 500.


  The minimap in the corner is where you see the whole field. Your blue troops
  sit on one side and the red enemy is lined up on the other, while a dashed box
  marks the part of the field your camera is looking at.


  There's a pause button, and you can run the battle at 1x, 2x or 4x.


  A delegate button lets you hand some of the control over, which is handy in a
  real-time game where one commander can't watch everything. The build is marked
  as an early prototype, and a link in the corner lets you send in bug reports.
