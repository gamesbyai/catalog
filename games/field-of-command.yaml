slug: field-of-command
title: Field of Command
tagline: Command British or German forces in a real-time battle across 1940 Kent.
description: >-
  You command a British infantry section from the BEF Infantry Command in a
  real-time strategy game set in the fields of Kent in 1940s England. A squad of
  soldiers stands on an isometric field beside a Union Jack, each with a small
  health bar, and a card labeled No. 1 Section shows the squad's status.


  An AI opponent, Blitzkrieg Infantry, holds the far side of the map. The top
  bar shows a bar for each side, both starting at 2000. You can also take the
  German side and lead the assault instead of the defense, in an alternate
  history of an invasion that never happened.


  Two counters sit at the screen edges. Deploy reads 0 / 0 with an income of
  +0.2 per second, and Tactical reads 0 / 500. Pause and speed buttons let you
  run the game at 1x, 2x or 4x, and a delegate button sits below them.


  A minimap in the corner marks your units in blue and the enemy line in red.
  The build is labeled v0.2.7 prototype and links to a bug report form.
