slug: field-of-command
title: Field of Command
tagline: Command British or German forces in a real-time battle across 1940 Kent.
description: >-
  Field of Command is a real-time strategy game set in an alternate 1940s
  England, where a German invasion of Kent actually happens. Players pick a
  side: organize the desperate British defense or lead the German assault across
  the fields. Each match is a contest for ground between the two armies.


  The setting is the hook. Instead of retelling a known campaign, the game
  imagines the invasion that never took place and lets either side try to change
  how it ends. Playing as defender or attacker gives the same battlefield two
  different goals.


  It runs in the browser on a 3D engine, supports multiplayer, and works on
  mobile devices. It placed tenth out of 945 entries in Vibe Jam 2026. The
  creator built it with Cursor.
