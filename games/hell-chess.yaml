slug: hell-chess
title: Hell Chess
tagline: Summon armies and curse your opponent in a hellish twist on chess.
description: >-
  Hell Chess takes the familiar chess board and fills it with infernal powers.
  It is a strategy board game with a hellish twist. You summon armies, reshape
  the battlefield and place curses on your enemy, all while trying to
  outmaneuver the person on the other side of the board, one turn at a time.


  Summoning, terrain changes and curses give every turn more options than
  standard piece movement. According to the creator, the game borrows ideas from
  Polytopia and Slay the Spire, a pairing that points to turn-based territory
  tactics and ability-driven decisions layered over the chess format.


  Matches are played online against another person, on desktop or on a phone.
  Claude Code was used to build it, and it came 439th of 945 entries at Vibe Jam
  2026.
