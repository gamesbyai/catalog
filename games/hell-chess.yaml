slug: hell-chess
title: Hell Chess
tagline: Summon armies and curse your opponent in a hellish twist on chess.
description: >-
  Chess with infernal powers. Summon armies, reshape the battlefield and curse
  your opponent, turn by turn.


  Summoning, terrain changes and curses, for more options each turn than
  standard chess. Online matches against another person. Ideas borrowed from
  Polytopia and Slay the Spire, according to the creator. A strategy board game
  built on the rules of chess.
