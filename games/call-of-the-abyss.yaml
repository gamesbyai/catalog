slug: call-of-the-abyss
title: Call Of The Abyss
tagline: Defend a beach as the last crab against waves of mutant sea creatures.
description: >-
  You play the last crab on a sun-bleached beach, holding your ground against
  endless waves of mutant sea creatures. Your weapons are powered by water, and
  each wave pushes you to keep shooting and stay alive. The run has a clear end
  point: Cthulhu rises from the abyss to finish you off.


  The mix of a small, bleached shoreline and a tentacled cosmic horror gives the
  game a darkly comic tone. It blends action shooting with wave-defense
  structure, so the goal is to survive as long as possible. The game supports
  mobile play as well.


  It was made for Vibe Jam 2026 by a solo developer working over a few weeks.
  The creator built it with Claude Code on Three.js, and describes the project
  as an experiment in how far AI-assisted vibe coding can go for a solo indie
  game.
