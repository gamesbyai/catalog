slug: call-of-the-abyss
title: Call Of The Abyss
tagline: Defend a beach as the last crab against waves of mutant sea creatures.
description: >-
  Call Of The Abyss makes you the last crab on a sun-bleached beach. Endless
  waves of mutant sea creatures keep coming, and you hold your ground with
  water-powered weapons, shooting through each wave to stay alive for as long as
  you can.


  A solo developer made it over a few weeks for Vibe Jam 2026, as an experiment
  in how far AI-assisted vibe coding can go for a solo indie game. It was built
  with Claude Code on Three.js and plays on phones as well as desktops.


  The tone is darkly comic, with a small, bleached shoreline set against a
  tentacled cosmic horror. Underneath, it is wave defense built on action
  shooting, and every run heads for the same end point: Cthulhu rising from the
  abyss to finish you off.
