slug: ink-side-down
title: Ink Side Down
tagline: Roll a cube across a grid so its inked face stamps only the marked squares.
description: >-
  Ink Side Down has you solve a daily logic puzzle by rolling a cube across a
  grid, stamping a print on each tile its inked face lands on. Every roll tips
  the cube over, so the inked side keeps moving to a new spot.


  Marked squares that should get a print, and no others. Rolls that decide both
  where you stand and which face lands next. Short daily rounds you can repeat.
  A fresh grid every day, with three new puzzles. Easy, Medium and Hard puzzles,
  each with its own par to aim for.


  Steer the cube with WASD or the arrow keys. Press U once to undo a roll. Use <
  and > to flip between days. Touch and mouse input also work.


  According to the creator, an autonomous AI agent designed and coded the whole
  game from start to finish.
