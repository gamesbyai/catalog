slug: ink-side-down
title: Ink Side Down
tagline: Roll a cube across a grid so its inked face stamps only the marked squares.
description: >-
  In Ink Side Down you roll a cube around a grid, and the face with ink on it
  prints onto whichever square it lands on.


  The goal is to leave prints only on the marked squares. So you're always
  thinking a few rolls ahead, because the face that ends up underneath depends
  on every turn before it. It's a small rule that makes the cube's orientation
  the whole puzzle.


  Each day brings three new puzzles, labeled Easy, Medium and Hard. Every one
  shows a par number before you start, and those numbers change from day to day.


  If you'd like the rules first, there's a how to play button on the start
  screen.


  You roll the cube with WASD or the arrow keys, and U takes back a roll when
  you've turned it the wrong way. The < and > buttons step between days, so
  earlier puzzles stay within reach.


  An autonomous AI agent designed and coded the whole game from start to finish,
  which is a funny job for something that never has to roll the cube itself.
