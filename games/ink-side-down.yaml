slug: ink-side-down
title: Ink Side Down
tagline: Roll a cube across a grid so its inked face stamps only the marked squares.
description: >-
  In Ink Side Down you roll a cube with one inked face across a grid, and
  whenever that face meets a tile, it stamps a print there.


  Some of the squares are marked, and you want prints on those squares and
  nowhere else. Every roll tips the cube over, so the inked side keeps wandering
  off to a new spot, a tricky detail when only some squares should get ink. Each
  move decides both where you stand and which face lands next.


  It's a daily logic puzzle with a short rhythm you can repeat, and the grid is
  fresh each day. Each day you get three new puzzles, sorted into Easy, Medium
  and Hard, and each one has its own par to aim for.


  A single press of U undoes a roll, while < and > flip between days.


  You steer the cube with WASD or the arrow keys. It also takes touch and mouse
  input.


  According to the creator, an autonomous AI agent designed and coded the whole
  game end to end using Claude Code.
