slug: ship-it
title: Ship It!
tagline: Juggle too many ideas against the clock and submit something before
  time runs out.
description: >-
  Too many ideas, not enough time. Pick one and submit it before the clock runs
  out.


  Ideas to juggle against the clock. A scramble shown through action and
  simulation. A self-aware tone about the courage it takes to hit submit.


  The creator hopped between ideas with AI so often that the chaos itself became
  the game.
