slug: ship-it
title: Ship It!
tagline: Juggle too many ideas against the clock and submit something before
  time runs out.
description: >-
  Ship It! is a game about finishing a game jam. You have more ideas than time,
  and the job is to juggle them against the clock and submit something before
  time runs out, instead of switching projects forever.


  The premise is the creator's own. During a single jam they kept hopping
  between ideas with AI, and the chaos of that process turned out to be more
  interesting to them than any of the games they nearly built. So the chaos
  became the subject, with action and simulation elements standing in for the
  scramble.


  The tone is self-aware and built around the courage it takes to hit submit.
  Made with Cursor for Vibe Jam 2026, it is a jam game about the process that
  produced it.
