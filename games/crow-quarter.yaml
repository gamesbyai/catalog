slug: crow-quarter
title: Crow Quarter
tagline: Sneak across rooftops in a hooded robe and reach the bell tower unseen.
description: >-
  Even the menu is part of the scene, and it's a cute bit of staging: cloth
  sheets hang off a line and carry the words BEGIN, CONTROLS and SOUND.


  You're a hooded climber in pale robes, balanced on ledges well above the
  streets. Planks of wood stretch across the gaps between the houses, while
  green shutters dot the walls. The narrow lanes of this whitewashed old town
  run beneath all of it.


  You're trying to get to the balcony of the bell tower with nobody spotting
  you. Off in the distance stands the bell tower, and a marker counts down the
  meters left until you reach it.


  There's a little eye icon up top that tracks how visible you are, which is a
  natural gauge for a stealth game built around not being seen.


  The countdown's up in the top left corner, under a line of text that spells
  out the goal. Whitewashed walls and red tile roofs fill the view, all of it
  sunlit, which gives the town a clean, crisp look. Overhead, birds circle in
  the bright blue sky.


  Put together, the ledges, the planks, the countdown and the eye icon all serve
  that one goal. Clicking one of the sheets or hitting Enter gets you started.
