slug: reach-the-relay
title: Reach the Relay
tagline: Pick a route through AI-ravaged ruins and keep your VIP alive in
  turn-based fights.
description: >-
  Reach the Relay is a turn-based RPG set in the ruins of an AI apocalypse. Each
  run begins with a choice among three routes. You then guide a party through
  encounters, protecting a VIP who must survive the whole trip to reach the
  Relay at the end.


  Combat follows the active time battle style of SNES-era role-playing games, so
  fights unfold in real-time-flavored turns rather than strict alternation. The
  route choice adds a strategic layer, since the path you pick shapes what you
  face on the way. The design draws on Final Fantasy, Dragon Quest, and the
  Temple Trekking activity from OSRS.


  The game was an entry in Vibe Jam 2026, where it placed 65th out of 945
  entries. It runs in the browser on Phaser and is playable on mobile. The
  creator built it with Claude Code.
