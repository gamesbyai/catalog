slug: reach-the-relay
title: Reach the Relay
tagline: Pick a route through AI-ravaged ruins and keep your VIP alive in
  turn-based fights.
description: >-
  Lead a party across the ruins of an AI apocalypse and keep your VIP alive all
  the way to the Relay.


  A choice of three routes at the start of every run. Encounters shaped by the
  route you pick. Active time battles in the style of SNES-era role-playing
  games.


  The design draws on Final Fantasy, Dragon Quest and the Temple Trekking
  activity from OSRS.
