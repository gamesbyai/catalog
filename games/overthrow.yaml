slug: overthrow
title: Overthrow
tagline: Battle other players in a physics-driven king of the hill arena to hold
  the top score.
description: >-
  You play on a crowded hill, and staying near the peak is how you earn points.
  Everyone else in the arena wants that same spot, so it turns into a
  physics-driven king of the hill where you bump rivals off while guarding the
  ground you've taken.


  Your main tool is a boost on Space, meant for shoving other players off the
  slope. Powerups are scattered around to give you an edge.


  The action is fast, and each round asks you to decide when to hold the top and
  when to push the challengers out of your way. Each round runs on a clock, and
  whoever is in the lead when it runs out comes out ahead. Anyone knocked off
  the top gets overthrown. The hill ranges from Bliss to Olympus.


  forkexecwait had carried the idea around for a while before turning it into a
  finished game. They drew on Super Mario Party for a similar feel, casual and
  whimsical rather than grim.
