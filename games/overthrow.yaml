slug: overthrow
title: Overthrow
tagline: Battle other players in a physics-driven king of the hill arena to hold
  the top score.
description: >-
  Overthrow is king of the hill with physics. You fight other players in an
  arena to take the top spot and hold it, knocking rivals around while defending
  your position, and the player with the highest score comes out ahead.


  The creator drew on Super Mario Party and aimed for a similar charming feel,
  so the tone is casual and whimsical rather than grim. Using Cursor and
  Three.js, they turned an idea they had carried for a while into a finished
  Vibe Jam 2026 game, and it plays on phones as well as desktop.


  The action is fast, with a bit of strategy on top: the question in every round
  is when to hold your ground and when to push the challengers out of the way.
