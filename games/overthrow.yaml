slug: overthrow
title: Overthrow
tagline: Battle other players in a physics-driven king of the hill arena to hold
  the top score.
description: >-
  You steer a small round character up a hill alongside other players, and the
  closer you stay to the peak, the more points you pick up. A scoreboard in the
  corner lists everyone's points, with a crown beside whoever is ahead.


  Space gives you a boost, and that's how you shove rivals off the slope.


  A boost bar near the bottom of the screen tells you when it's ready again, so
  you're not guessing. Powerups are scattered around for you to grab, and
  they're there to give you an edge.


  A countdown under the scoreboard title shows how much of the round is left.
  When somebody loses the top spot, a banner announces that they've been
  overthrown, which is a grand word for getting bumped down a hill. The top left
  names the current map and the one coming next.


  Those maps are Bliss, a green hill, and Olympus, a red desert slope.


  Wins are tallied on a separate leaderboard, so there's a reason to come back
  after a single round. You can type a name before you join or leave it blank.
  The creator had wanted to build something casual and charming ever since
  playing Super Mario Party, and describes the battles as physically accurate.
