slug: overthrow
title: Overthrow
tagline: Battle other players in a physics-driven king of the hill arena to hold
  the top score.
description: >-
  Hold the peak of a crowded hill to earn points while everyone else tries to
  bump you off it.


  Physics-driven king of the hill against other players. A boost for shoving
  rivals off the slope. Powerups scattered around the hill. Rounds on a clock,
  won by whoever leads at the end. Hills from Bliss to Olympus.


  Press Space to boost.


  forkexecwait carried the idea for a while and aimed for a casual, whimsical
  feel like Super Mario Party.
