slug: overthrow
title: Overthrow
tagline: Battle other players in a physics-driven king of the hill arena to hold
  the top score.
description: >-
  Overthrow is a multiplayer king of the hill game set in an arena. Players
  fight to take and hold the top spot, and the player with the highest score
  comes out ahead. Battles are physics-based, so knocking rivals around and
  defending your position is the core of each round.


  The tone is casual and whimsical rather than grim. The creator drew
  inspiration from Super Mario Party and aimed for a similar charming feel,
  blending fast action with a bit of strategy about when to hold ground and when
  to push out challengers.


  It was built with Three.js and runs in the browser, with support for both
  multiplayer and mobile play. The creator built it with Cursor as an entry in
  Vibe Jam 2026, turning an idea they had carried for a while into a finished
  game.
