slug: shadow-arena
title: Shadow Arena
tagline: Fight off waves of monsters and bosses in a top-down arena with a friend.
description: >-
  Shadow Arena is a top-down arena survival game for you and a friend, played
  together online. You fight off waves of monsters and bosses, level up in the
  middle of combat, pick upgrades on the spot, and try to outlast whatever the
  arena throws at you.


  Vampire Survivors was the inspiration, and the creator set out to make
  something in that style, building it with Cursor and using Three.js to render
  the arena in 3D. It came 260th of 945 entries in Vibe Jam 2026, and phones are
  supported alongside desktop.


  The pace is frantic, and the leveling system encourages experimenting with
  unusual builds rather than settling on one setup. With two players in the
  arena, every wave becomes a shared effort.
