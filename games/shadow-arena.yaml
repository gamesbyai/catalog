slug: shadow-arena
title: Shadow Arena
tagline: Fight off waves of monsters and bosses in a top-down arena with a friend.
description: >-
  Shadow Arena is a top-down arena survival game in which you and a friend fight
  off waves of monsters and bosses. Each run has you leveling up in the middle
  of combat, picking upgrades as you go, and trying to outlast whatever the
  arena throws at you.


  The pace is frantic, and the leveling system encourages experimenting with
  unusual builds rather than settling on one setup. Two-player play makes the
  fights a shared effort, and the game also runs on mobile. It was inspired by
  Vampire Survivors, and its creator wanted to make something in that style.


  It was an entry in Vibe Jam 2026, where it placed 260th out of 945 entries.
  The creator built it with Cursor, using Three.js for the 3D rendering.
