slug: shadow-arena
title: Shadow Arena
tagline: Fight off waves of monsters and bosses in a top-down arena with a friend.
description: >-
  Pick a champion, press Space to ready up, and fight off waves of monsters in
  an arena. You level up in the middle of a fight, and you can go after unusual
  builds. Bosses show up among the waves, and your goal is to outlast them.


  Starting weapon, passive and class weapon for every class. Magic Staff, area
  scaling and Arcane Runes for the Mage. Soul Projectile, Soul Rip healing on
  kills and Soul Push for the Revenant. Heavy Cleave, Blood Rage and Ground Slam
  for the Berserker. Solo and local play, one mode for one to four players on
  one keyboard. Online co-op as a separate option, with a warning it may feel
  less smooth than solo or local play.


  BWBlit, the game's creator, modeled it on Vampire Survivors.
