slug: timecrime
title: TimeCrime
tagline: Spot the impossible object in a 360° historical scene, then guess where
  and when.
description: >-
  TimeCrime is a fast anomaly-hunt set in 360° historical scenes. A time
  traveler has planted one impossible object in each scene. You look around the
  panorama, find the item that does not belong, and then guess the place and the
  era to repair the timeline.


  The game mixes a hidden-object search with history trivia. Instead of only
  recalling facts, you scan the environment and notice what feels wrong, and the
  rounds stay short and simple. Fixing the timeline is presented as a visual
  payoff for a correct answer. It also runs on mobile devices.


  The game was built with Three.js, and it was entered in Vibe Jam 2026, where
  it placed 44th among 945 entries. Codex is named as one of the tools used to
  make it.
