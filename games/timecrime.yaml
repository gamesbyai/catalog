slug: timecrime
title: TimeCrime
tagline: Spot the impossible object in a 360° historical scene, then guess where
  and when.
description: >-
  You look around a 360° historical scene for the one object that shouldn't be
  there, because a time traveler has planted a single impossible thing in each
  one. Once you spot it, you guess where and when the scene is set, which is how
  you repair the timeline. So it's part hidden-object search and part history
  quiz.


  A run is five rounds, and each round gives you 45 seconds. You can start the
  Daily Rift or choose a Random Run, and there's no login in the way, so you
  just press start.


  The title screen sits over a moon scene with a lunar lander and Earth hanging
  in the black sky. A phone on a tripod stands in the dust off to the right,
  which looks pretty odd beside a lander and shows the kind of mismatch you're
  hunting for.


  The creator wanted you to scan a scene and notice what feels wrong, instead of
  only guessing facts from a question.
