slug: timecrime
title: TimeCrime
tagline: Spot the impossible object in a 360° historical scene, then guess where
  and when.
description: >-
  Each round places you inside a 360° historical scene with one object that
  could not exist in that time. Look around the panorama, spot the out-of-place
  item, then guess where and when you are to repair the timeline. The opening
  scene is the Moon, with a lunar lander, Earth in the sky and a phone on a
  tripod.


  A run is five rounds with 45 seconds on each. The start screen offers a Daily
  Rift, labeled with the date, and a Random Run. No login is needed.


  The game combines hidden-object scanning with history trivia. You have to
  notice what feels wrong in the scene before you guess the place and era. The
  creator says the aim was for players to scan a scene and notice anomalies, not
  just recall facts.
