slug: timecrime
title: TimeCrime
tagline: Spot the impossible object in a 360° historical scene, then guess where
  and when.
description: >-
  Each round drops you inside a 360° scene from history with one object that
  couldn't have existed in that time. The story goes that a time traveler left
  it there. You look around the panorama, find the culprit, then guess where and
  when you are to set the timeline right.


  The first scene puts you on the Moon, with a lunar lander parked in the dust
  and Earth hanging in the black sky. Someone has also left a phone on a tripod
  out there, about as blatant as a time crime gets.


  A full run is five rounds, and you only get 45 seconds for each one.


  There are two ways in from the start screen. The Daily Rift is labeled with
  the date, while the other button starts a Random Run. You don't even have to
  log in for either.


  It's a pairing of a hidden-object hunt with history trivia, and the order
  matters, since you have to notice what feels wrong in the scene before you
  get to guess the place and era.


  Peter TP says the spark was blending curiosity about history with a quick,
  simple hunt for hidden objects. They also say the aim was for players to scan
  each scene and spot anomalies rather than only recall facts.
