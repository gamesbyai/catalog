slug: timecrime
title: TimeCrime
tagline: Spot the impossible object in a 360° historical scene, then guess where
  and when.
description: >-
  Each round drops you into a 360-degree scene from history with one object that
  couldn't have existed then, supposedly left by a time traveler.


  Five rounds per run, 45 seconds each. The Moon as the first scene, with a
  phone on a tripod as the anomaly. Daily Rift or Random Run, no login needed. A
  hidden-object hunt paired with history trivia.


  Find the object that doesn't belong, then guess where and when you are.


  Peter TP wanted players to scan each scene and spot anomalies, not only recall
  facts.
