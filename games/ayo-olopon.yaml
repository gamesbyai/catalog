slug: ayo-olopon
title: Ayo Olopon.
tagline: Play Ayo, the West African seed-sowing board game, in a 3D setting.
description: >-
  Ayo Olopon brings the board game Ayo into 3D as a digital version. Players
  take turns on the board, one move at a time.


  Multiplayer support for matches against another person. Classic strategy
  carried over from the original game. A West African strategy board game with
  deep roots in Nigerian culture.


  that_LaravelGuy grew this out of childhood memories of watching people play
  Ayo. The aim is to bring the game to a new generation, as a way to learn about
  the culture as well as to have fun.
