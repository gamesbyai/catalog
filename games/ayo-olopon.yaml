slug: ayo-olopon
title: Ayo Olopon.
tagline: Play Ayo, the West African seed-sowing board game, in a 3D setting.
description: >-
  Ayo Olopon is a 3D digital version of Ayo, a traditional West African strategy
  board game with deep roots in Nigerian culture. Players take turns on the
  board, working through the classic strategy of the original, and the game
  supports multiplayer so a match can be played against another person.


  The project grew out of the creator's childhood memories of watching people
  play Ayo. It aims to introduce the game to a new generation, treating it as a
  way to learn about the culture as well as to have fun.


  The creator built it with Windsurf, and it runs on Three.js.
