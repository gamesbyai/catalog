slug: legends-of-future-past
title: Legends of Future Past
tagline: Explore a fantasy world in a rebuilt 1992 online multiplayer adventure.
description: >-
  Legends of Future Past is a recreation of a multiplayer adventure that ran on
  CompuServe in 1992. It is an online adventure in which players explore a
  shared fantasy world. The original service is no longer available, so this
  version aims to bring the experience back for people to play again.


  The project is a reconstruction rather than a fresh design. It draws on
  surviving scripts, manuals and recordings of the original, which are used to
  piece together how the adventure worked and what it looked like. That gives it
  a preservation angle, treating a lost piece of early online gaming as
  something worth restoring.


  The creator built it with Claude Code, using the AI tool to help rebuild the
  game from the archival material that still exists.
