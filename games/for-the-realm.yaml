slug: for-the-realm
title: For The Realm
tagline: Build a deck and join other players to cross a broken realm and end an
  ancient evil.
description: >-
  An ancient evil waits at the end of a broken land, and in For The Realm you
  cross it with other players, gathering cards and fighting toward that final
  confrontation. It is a dark fantasy roguelike deckbuilder, and a run ends in
  victory or in defeat along the way.


  Multiplayer sits at the center of the design rather than being bolted on, and
  it plays online in the browser. The premise is uniting the realm, so players
  work together to survive the journey, growing through RPG-style progression
  and strategic card play in a grim, moody setting.


  According to the creator, the goal was the roguelike deckbuilder they had
  always wished for, with real multiplayer as its foundation. It is a Claude
  Code project running on Babylon.js, entered in Vibe Jam 2026.
