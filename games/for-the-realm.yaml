slug: for-the-realm
title: For The Realm
tagline: Build a deck and join other players to cross a broken realm and end an
  ancient evil.
description: >-
  Work with other players to cross a broken realm, gathering cards and fighting
  toward an ancient evil at its end. It is a dark fantasy roguelike deckbuilder
  with a grim, moody setting, and a run ends in victory or defeat along the way.


  RPG-style progression. Strategic card play. Uniting the realm as the premise,
  and working together to survive the journey.


  According to the creator, the goal was the roguelike deckbuilder they had
  always wished for, with real multiplayer as its foundation.
