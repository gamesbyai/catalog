slug: cityride
title: CityRide
tagline: Pedal a bike around a chibi anime city, taking missions and buying new rides.
description: >-
  You ride a bike through a chibi anime city and take on missions as you go. You
  explore the city at your own pace. The goals are loose. You can run a few
  errands in a row, or just ride around town.


  Earnings from missions, spent on new bikes. Different bikes to work toward
  between missions. A food errand in Bangkok, a real-world touch in the city.
  Racing-style riding, next to the errands.
