slug: cityride
title: CityRide
tagline: Pedal a bike around a chibi anime city, taking missions and buying new rides.
description: >-
  CityRide is a cozy open-world bike adventure set in a chibi anime city. You
  pedal through the streets, pick up missions, and earn enough to buy new bikes.
  Errands and racing-style riding give each session a loose goal, while the city
  is free to explore at your own pace.


  The tone is relaxed and cute rather than competitive. One of the listed
  errands is grabbing food in Bangkok, which hints at a real-world flavor mixed
  into the anime look. Buying different bikes gives you something to work toward
  between missions. It also runs on mobile, so you can ride from a phone.


  It was entered in Vibe Jam 2026, where it placed 79th out of 945 entries. The
  creator built it with Claude Code, and it is rendered in Three.js.
