slug: croaks
title: CROAKS
tagline: Aim and fire at rival frogs in a turn-based artillery battle.
description: >-
  The title screen shows a pixel-art swamp with armed frogs and a menu: Find
  Opponent, Vs AI, Survival, a Daily challenge with a countdown, and Customize.
  A banner advertises 21 weapons. First-time players get an offer of a short
  tutorial with a passive AI opponent and unlimited ammo.


  Matches are turn-based artillery between two frog teams on a side-view
  landscape of dirt hills. You take turns blowing up the other side, and the
  last frogs standing win. A round timer runs at the top, with a health bar for
  each team.


  Number keys 1 to 9 pick a weapon, and Tab swaps to another frog on your team.
  A Skip button ends your turn. After you fire, a short retreat phase lets you
  move your frog clear. The weapon bar groups the arsenal into Direct, Fuse /
  Cluster, Special and Utility.


  The creator played Worms as a kid and wanted to bring those memories back with
  frogs in place of worms.
