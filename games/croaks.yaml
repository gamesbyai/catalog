slug: croaks
title: CROAKS
tagline: Aim and fire at rival frogs in a turn-based artillery battle.
description: >-
  The first screen is a swampy pixel-art pond with a big green CROAKS logo, and
  you pick how to play from there. You can find an opponent, play against an AI,
  try survival, take the daily challenge, or customize your frogs.


  The creator grew up on Worms and wanted those memories back, so this is the
  same idea with frogs.


  Your team of frogs faces theirs, and you take turns blowing up the other side
  until only one team has frogs left standing. After you fire, a short retreat
  lets you move clear, which is handy when whatever you just launched is about
  to go off. You can swap which frog you control, and you can end your turn
  early with the skip button.


  There are 21 weapons, sorted into direct, fuse and cluster, special, and
  utility groups in a tray along the bottom of the screen. You pick one with the
  number keys.


  A health bar for each team sits at the top next to a countdown clock.


  If it's your first visit, a short tutorial promises you'll learn the basics in
  about 90 seconds. Your opponent is passive and your ammo is unlimited there,
  so you can try things out without anyone fighting back.
