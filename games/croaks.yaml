slug: croaks
title: CROAKS
tagline: Aim and fire at rival frogs in a turn-based artillery battle.
description: >-
  Play against an online opponent or the AI in turn-based artillery battles
  between two teams of frogs. You and the other side take turns firing, and
  whoever still has frogs standing at the end wins.


  21 weapons, grouped as Direct, Fuse / Cluster, Special and Utility. Survival
  mode. Daily challenge with its own countdown. The Customize option. Tutorial
  offered on your first visit, roughly 90 seconds long, with a passive AI and no
  ammo limit. A short retreat phase after firing, for hopping a frog clear.


  Press 1 to 9 to pick a weapon. Press Tab to switch to another frog on your
  team. When you're done, use the Skip button to end your turn.


  thomaskanze grew up playing Worms and made CROAKS to bring those memories
  back, this time with frogs instead of worms.
