slug: croaks
title: CROAKS
tagline: Aim and fire at rival frogs in a turn-based artillery battle.
description: >-
  CROAKS is a turn-based artillery game: Worms, with frogs. Players take turns
  aiming and firing at the opposing frogs, working out the angle and power it
  takes to land a shot across the terrain. The match goes on until one side is
  left standing.


  The creator built the game around memories of playing Worms when they were
  young, and it keeps that formula of tactical positioning mixed with shooting.
  It was made with Claude Code, renders with PixiJS and ranked 338th of the 945
  entries at Vibe Jam 2026.


  Multiplayer works online and on phones, so a match with friends does not need
  everyone in one room. Each turn is a small physics problem: the angle, the
  power and the terrain between you and the target.
