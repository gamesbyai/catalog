slug: croaks
title: CROAKS
tagline: Aim and fire at rival frogs in a turn-based artillery battle.
description: >-
  Your frogs are armed, and the game has 21 weapons. You can find an online
  opponent, play against the AI, try Survival, take on a daily challenge with
  its own countdown, or use Customize.


  On your first visit there's a kind offer of a roughly 90-second tutorial,
  where the AI opponent stays passive and your ammo never runs out.


  The matches are turn-based artillery between two teams of frogs. You and the
  other side take turns blowing each other up, and whoever still has frogs
  standing at the end wins.


  Number keys 1 to 9 pick your weapon, and Tab hands control to a different frog
  on your team.


  When you're done, the Skip button ends your turn. Firing doesn't end things
  right away, though, because a short retreat phase follows that lets you hop
  your frog clear.


  The arsenal is sorted into four groups, Direct, Fuse / Cluster, Special and
  Utility.


  thomaskanze grew up playing Worms and made CROAKS to bring those memories
  back, this time with frogs instead of worms.
