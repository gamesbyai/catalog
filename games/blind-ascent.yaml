slug: blind-ascent
title: Blind Ascent
tagline: Climb a dark tower with friends by shouting to reveal the platforms around you.
description: >-
  Blind Ascent is a cooperative vertical platformer in which the player cannot
  see the world at all. The only way to make the surroundings visible is to
  scream into the darkness, which reveals nearby surfaces for a moment. A run is
  a climb upward, working out where the next ledge sits from what each shout
  shows.


  The central idea ties sight to sound, so every jump forces a choice between
  calling out for information and moving on with what you remember. Multiplayer
  support means several people can share the climb and help one another read the
  space. It was entered in Vibe Jam 2026, where it placed 469th out of 945
  entries.


  The game runs on Babylon.js in the browser. According to the creator, it was
  built with Claude Code, and the project came together as a jam entry rather
  than a long-running production.
