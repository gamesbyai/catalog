slug: don-t-xtarve
title: Don't Xtarve
tagline: Gather, craft, cook, and fight to survive long nights in an isometric world.
description: >-
  Don't Xtarve is an isometric survival game set in a procedurally generated
  world. You gather resources, craft gear, cook food, and fight off hostile
  creatures while trying to stay alive. Weather turns harsh and the nights run
  long, so each run is a struggle to keep supplied until morning.


  The game is openly inspired by Don't Starve, and it carries that survival loop
  into a three-dimensional isometric view. Its creator, a husband and father
  with little free time for playing, cites a long history with isometric games
  such as Diablo 2. The project supports multiplayer and runs on mobile devices
  as well.


  It was made for Vibe Jam 2026, where it placed 222nd among 945 entries. The
  creator built it with Claude Code, and it renders with Three.js.
