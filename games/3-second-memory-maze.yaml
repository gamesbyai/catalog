slug: 3-second-memory-maze
title: 3-Second Memory Maze
tagline: Memorize a maze route in three seconds, then find the exit in the dark.
description: >-
  The maze shows for a few seconds, then goes dark. Study the route and its key
  turns during that preview, then walk to the exit from memory alone.


  Thirty short campaign levels, the first called First forks. The 3.2-second
  preview on that opening level. One route peek per level, a single forgiving
  look at the path once the maze goes dark. Stars from one to three per level,
  based on speed and moves. Daily Challenge, one shared maze for everyone each
  day. Best records saved locally, plus daily streaks. Unlocked levels picked
  from a map.


  Move with the arrow keys or WASD, swipe on a touch screen, or tap the
  on-screen buttons. Replay the preview if you want to see the route again. Use
  Stop to end a run.
