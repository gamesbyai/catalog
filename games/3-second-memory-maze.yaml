slug: 3-second-memory-maze
title: 3-Second Memory Maze
tagline: Memorize a maze route in three seconds, then find the exit in the dark.
description: >-
  A neon maze sits on screen for a few seconds, then fades to darkness, leaving
  only a small glow around your position. Study the yellow route and its turn
  anchors during the preview, then walk to the exit from memory.


  The campaign has 30 short maze levels, each opened from a level map. Every
  level lets you use one route peek to reveal the path again, and a replay
  preview button is also on the screen. Pause and stop buttons let you freeze or
  end a run. A header tracks the level, the preview countdown and your move
  count.


  Each level is scored from 1 to 3 stars based on speed and number of moves, and
  the campaign tracks stars out of 90. A Daily Challenge serves one shared maze
  to everyone each day, with a streak counter. Best records are stored locally.


  You can move with the arrow keys, WASD, swipes on touch screens, or the
  on-screen buttons, so the game works on both keyboard and phone.
