slug: 3-second-memory-maze
title: 3-Second Memory Maze
tagline: Memorize a maze route in three seconds, then find the exit in the dark.
description: >-
  3-Second Memory Maze is a short browser puzzle game about memory under
  pressure. Each level shows the maze for a few seconds, then it fades to
  darkness and leaves only a small glow around your character. You steer from
  memory to the exit, aiming to finish quickly and with few moves.


  The game has 30 bite-sized levels, each scored from one to three stars based
  on speed and move count. A single route peek per level reveals the path once
  if you get lost. A Daily Challenge gives everyone the same maze each day, and
  local best records and daily streaks track your progress. The neon look suits
  the dark play, and touch swipes, keyboard, and on-screen buttons all work.


  According to the jam submission, AI assisted with the code, graphics, and
  text. The game runs directly in the browser as HTML5 and is built to be
  friendly to mobile devices.
