slug: aerobolt
title: Aerobolt
tagline: Glide through the sky and strike down rivals in Greek-myth aerial combat.
description: >-
  Aerobolt is an airborne fighting game set among the gods of Greek mythology.
  The player takes to the sky, gliding between mythic surroundings and striking
  down foes in mid-air. Combat happens while flying, so positioning and movement
  matter as much as the attacks themselves.


  The game blends the feel of Minecraft-style gliding with a mythological
  setting, giving flight a central role in how fights unfold. It supports
  multiplayer and runs on mobile as well as desktop, so matches can be picked up
  on different devices. It placed 35th out of 945 entries in Vibe Jam 2026.


  The game runs on Three.js, and it was made with the help of Cursor as an entry
  in the 2026 Vibe Jam, where AI-assisted coding was part of the process.
