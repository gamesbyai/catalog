slug: aerobolt
title: Aerobolt
tagline: Glide through the sky and strike down rivals in Greek-myth aerial combat.
description: >-
  Aerobolt is an aerial fighting game set among the gods of Greek mythology. You
  take to the sky, glide between mythic surroundings and strike down rivals in
  mid-air, so every exchange happens while you are flying.


  Matches are online multiplayer and run on phones too, so a fight can be picked
  up on whatever device is nearby. Aerobolt was coded with AI assistance in
  Cursor, renders in Three.js and came 35th of the 945 entries at Vibe Jam 2026.


  Because every fight happens in flight, positioning and movement count as much
  as the attacks themselves. The gliding has a Minecraft-style feel, and flight
  gets the central role in how each fight unfolds: where you are in the air
  matters as much as the strike you land.
