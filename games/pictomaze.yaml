slug: pictomaze
title: Pictomaze
tagline: Find your way through hand-drawn style 2D mazes
description: >-
  Find your way through 2D mazes, from the start to the exit, one maze after
  another.


  Quick to pick up. Flat, two-dimensional mazes, like the ones drawn on paper. A
  new maze waiting after every exit.


  Based on the paper mazes the creator and a friend sketched at school and
  played with a finger and some imagination.
