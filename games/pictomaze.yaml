slug: pictomaze
title: Pictomaze
tagline: Find your way through hand-drawn style 2D mazes
description: >-
  Pictomaze is a 2D maze puzzle game. The player works through mazes in the
  spirit of the ones drawn on paper, tracing a route from the start to the exit.
  It is built to be simple and quick to pick up, and it runs on mobile as well
  as desktop.


  The idea comes from the creator's school days, when a friend and they sketched
  mazes on paper and played them with a finger and some imagination. Pictomaze
  turns that pastime into an actual game, keeping the plain, approachable feel
  of a doodled puzzle rather than adding complicated systems.


  The creator built it with Codex for the Vibe Jam 2026, where it was one of 945
  entries. It uses Three.js for rendering, even though the play itself is flat
  and two-dimensional.
