slug: ghostnn
title: GhostNN
tagline: Click through a glowing neural network maze, collect keys, and reach
  the exit node.
description: >-
  A ghost is trapped inside a neural network, and you guide it out through a
  maze of glowing nodes. Each stage is a 3D web of points joined by lines. You
  click a node connected to your current position to move there.


  The goal in every stage is to collect all the keys, which unlocks the exit,
  then travel to the exit node to finish. Brighter lines show connections you
  can use right now. Dimmer lines show secondary links that are visible but not
  reachable from where you stand.


  You can rotate, pan and zoom the camera to read the layout, and a double click
  resets the view. Each level has a seed ID. Copy it, then paste it through the
  Enter Seed button on the main menu to replay that level or hand it to someone
  else to compare runs.


  The creator says the code was written mostly by Claude Opus 4.5 under their
  direction, and the ghost model was generated, then cleaned up and animated by
  hand in Blender. Music and sound effects are AI-generated too. Mobile touch
  controls are included but untested.
