slug: agent-shah
title: Agent Shah
tagline: Sneak through a warehouse, shoot hostiles, and decrypt a developer's
  career dossier.
description: >-
  Agent Shah is a developer's portfolio disguised as a spy mission. You sneak
  into a warehouse in a 3D top-down shooter, fight off hostiles and decrypt the
  dossier waiting inside, which turns out to be the developer's career
  portfolio.


  Instead of a static page listing work history, the portfolio is something you
  play through, and the mission is how visitors learn about the person behind
  it. The creator cites Bruno Simon's interactive portfolio as an inspiration
  and says the game was built with Claude Code and Three.js for Vibe Jam 2026.


  You fight with a pistol, a machine gun, a pencil or your bare fists, and clear
  the threats on the way to the dossier. The combat follows the top-down style
  of Hotline Miami, while the look borrows the spy aesthetic of Mission
  Impossible.
