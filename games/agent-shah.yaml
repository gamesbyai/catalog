slug: agent-shah
title: Agent Shah
tagline: Sneak through a warehouse, shoot hostiles, and decrypt a developer's
  career dossier.
description: >-
  The game opens in a dark 3D corridor labeled Sector 01, Briefing Room. A
  suited agent is seen from above and behind, standing on a road lined with
  glowing dashes. A neon AS logo hangs on a panel at the far end. The HUD shows
  a health bar, the current weapon with its ammo count (pistol, 6/6), and a
  target counter that starts at 3.


  You move through a warehouse and take down hostile agents from a top-down
  view. Four weapons are available: a pistol, a machine gun, a pencil and bare
  fists. Number keys switch between them, a separate pair of keys throws
  punches, and F triggers stealth. Shooting works from the mouse or the space
  bar.


  The level doubles as the creator's developer portfolio. Besides the combat,
  the mission includes decrypting a career dossier, so the résumé content is
  part of the play instead of a static page. A music button in the corner, also
  bound to M, controls the soundtrack.


  The creator cited Bruno Simon's interactive portfolio and Hotline Miami's
  top-down combat as influences, with a Mission Impossible look.
