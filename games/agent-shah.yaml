slug: agent-shah
title: Agent Shah
tagline: Sneak through a warehouse, shoot hostiles, and decrypt a developer's
  career dossier.
description: >-
  You start on a dark runway marked with glowing cyan dashes, looking down at a
  suited agent from behind. A screen at the far end shows a neon AS logo, and
  the display across the top names the agent Shah Fahad in sector 01, the
  Briefing Room.


  It's a 3D top-down shooter where you infiltrate a warehouse and take down
  hostiles. You've got four ways to do it: a pistol, a machine gun, a pencil and
  your fists. The pencil is a funny thing to bring to a firefight.


  The pistol starts with six rounds loaded, and a health bar sits in the bottom
  corner. A strip along the bottom lists the controls and keeps a count of
  targets, which reads three in the first sector.


  The mission is to decrypt a career dossier, because the whole game doubles as
  the developer's portfolio. That's an odd way to hand over a résumé, but it
  means the shooting is how you get to it.


  There's also a stealth key on F, and a music button in the top corner.


  The creator mixed three influences: Bruno Simon's interactive portfolio,
  Hotline Miami's top-down combat and a Mission Impossible look. They wanted a
  portfolio that actually plays instead of sitting there as a static page.
