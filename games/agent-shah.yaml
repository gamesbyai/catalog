slug: agent-shah
title: Agent Shah
tagline: Sneak through a warehouse, shoot hostiles, and decrypt a developer's
  career dossier.
description: >-
  On your own, you infiltrate a warehouse and take down hostile agents in a
  spy-themed 3D top-down shooter. The whole level is secretly the creator's
  developer portfolio, and the résumé is something you play through.


  Four weapons, a pistol, a machine gun, a pencil and bare fists, with the
  pencil at home next to the guns. Career dossier decryption alongside the
  fighting. Stealth mode.


  Shoot with the mouse or the space bar. Switch weapons with the number keys.
  Throw punches with V or B. Press F for stealth.


  fahaddoc600 named Bruno Simon's interactive portfolio and Hotline Miami's
  top-down combat as influences.
