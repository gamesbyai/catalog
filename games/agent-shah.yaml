slug: agent-shah
title: Agent Shah
tagline: Sneak through a warehouse, shoot hostiles, and decrypt a developer's
  career dossier.
description: >-
  You make your way through a warehouse, taking down hostile agents as you go.
  Your arsenal has four options, a pistol, a machine gun, a pencil and your bare
  fists, with the pencil sitting at home next to the guns. You can shoot with
  the mouse or the space bar.


  Number keys switch between the four weapons, V and B throw punches, and F
  slips you into stealth.


  The whole level is secretly the creator's developer portfolio. Besides the
  fighting, the mission has you decrypt a career dossier. So the résumé turns
  into something you play through instead of a static page you scroll past.


  fahaddoc600 named Bruno Simon's interactive portfolio and Hotline Miami's
  top-down combat as influences.
