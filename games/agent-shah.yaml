slug: agent-shah
title: Agent Shah
tagline: Sneak through a warehouse, shoot hostiles, and decrypt a developer's
  career dossier.
description: >-
  A suited agent stands on a dark road lined with glowing dashes, seen from
  above and behind, while a neon AS logo glows on a panel at the far end of a
  corridor labeled Sector 01, Briefing Room.


  The HUD shows a health bar, your current weapon with its ammo (a pistol at 6
  of 6) and a target counter that starts at 3. There's a music button up in the
  corner too, and the M key does the same job.


  You make your way through a warehouse from that top-down view, taking down
  hostile agents as you go. Your arsenal has four options, a pistol, a machine
  gun, a pencil and your bare fists, with the pencil sitting at home next to
  the guns. You can shoot with the mouse or the space bar.


  Number keys switch between the four weapons, V and B throw punches, and F
  slips you into stealth.


  The whole level is secretly the creator's developer portfolio. Besides the
  fighting, the mission has you decrypt a career dossier. So the résumé turns
  into something you play through instead of a static page you scroll past.


  fahaddoc600 named Bruno Simon's interactive portfolio and Hotline Miami's
  top-down combat as influences, all wrapped in a Mission Impossible look.
