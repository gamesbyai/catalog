slug: talos-a-modern-ancient-game
title: "Talos: A Modern Ancient Game"
tagline: Wall in the white stone on a hex board before it slides off the edge.
description: "Wall in the white stone before it slides off the edge of a hex
  board. It's a trap-the-cat style puzzle, and the white stone plays the cat.


  Six generated boards per run, none drawn by hand. Three escapes by the white
  stone ending a run. Easy, Medium and Hard, with score multipliers of two or
  three on harder settings. Scoring by empty hexes left once it's boxed in,
  higher with fewer stones spent. Optional suggestions highlighting every
  equally strong placement, with a warning they aren't always reliable. A mock
  proverb about doorways being more tempting than open space, signed probably
  ancient. Saved sessions to resume later.


  Drop a dark stone onto any open hex each turn. After that, the white stone
  slides one space. Pick a light or dark board, or let it follow your system.


  Kevin MacLeod worked out the design in conversation with an AI model. They
  played each version and described what felt off so the AI could revise it. An
  AI coding tool wrote the game as one HTML file, including the board generator
  and the solver. The AI also wrote a script that produced the store art from
  the game's own renderer. Kevin MacLeod recorded the sound effects, hand-tuned
  the colors and playtested, and released it as CC0."
