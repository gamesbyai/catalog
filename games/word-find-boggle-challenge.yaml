slug: word-find-boggle-challenge
title: "Word Find: Boggle Challenge"
tagline: Trace neighboring letters on a grid to spell words before the timer runs out.
description: >-
  Spell words by tracing paths through a grid of letters. Each round is short
  and timed.


  Eight-way links, diagonals included, giving each letter more ways to build a
  word than up, down and sideways links alone. Finished words in the game's
  dictionary, accepted and scored by length. Combos for words found in quick
  succession. Big bonuses from DW and TW tiles. Level-ups for reaching the goal.
  No points for words you've already found.


  Drag or tap from one letter to the next. When the clock hits zero, your score
  shows. Then start another round.
