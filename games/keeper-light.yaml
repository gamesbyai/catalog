slug: keeper-light
title: Keeper Light
tagline: Upgrade your boat and lighthouse by day, then defend the light through
  each night's waves.
description: >-
  Day 1 starts on a small green island, with a red-and-white lighthouse, a
  wooden boat tied up at the shore and your keeper waiting beside a ring marker,
  with an F prompt for the Boat Yard.


  The clock at the top says Planning with 8h on it, and those daylight hours
  are for upgrading your boat and the lighthouse beam. The panel on the right
  keeps track of which beam you've got, and it starts out as Sweep. Two more
  glowing rings sit by the trees on the left, one yellow and one blue, tucked
  in close to the pines.


  That same panel tracks your scrap, fuel, glass, copper and relics, a
  surprising number of materials for one little island. Below those you'll find
  your kills, a BPs counter, a fuel gauge and the boat's condition, which starts
  at 100, while the gauge oddly reads 0 even though your stores already hold 2
  fuel.


  When night comes, the enemies arrive in waves that keep escalating, and your
  job is to keep the lighthouse from falling.


  A Keeper Light bar at the top left starts full, at 1000 out of 1000. A round
  minimap in the bottom right shows the lighthouse and the markers close to
  it. The bar shares its name with the game itself.


  The art is chunky low-poly, with cone-shaped pines and a striped tower.
  PetrSeifer87103 made it with a refreshingly modest goal in mind, and that goal
  was to get a first game finished.
