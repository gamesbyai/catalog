slug: keeper-light
title: Keeper Light
tagline: Upgrade your boat and lighthouse by day, then defend the light through
  each night's waves.
description: >-
  Your keeper starts on a small island. When night comes, your job is to keep
  the lighthouse from falling.


  Daylight upgrades for your boat and the lighthouse beam. The Sweep beam, your
  starting beam. Scrap, fuel, glass, copper and relics to collect. Night waves
  of enemies that keep escalating.


  On the first day, stand by the ring marker and press F to open the Boat Yard.


  PetrSeifer87103 made it with a modest goal, to finish a first game.
