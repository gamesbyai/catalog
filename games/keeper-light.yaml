slug: keeper-light
title: Keeper Light
tagline: Upgrade your boat and lighthouse by day, then defend the light through
  each night's waves.
description: >-
  The game opens on a small green island on Day 1, in a Planning phase with an
  8h timer at the top. A red-and-white lighthouse stands on the island, a wooden
  boat is moored at the shore, and a keeper character waits beside a ring marker
  with an F prompt for the Boat Yard.


  Daylight hours go to upgrading your boat and the lighthouse beam. A panel on
  the right tracks stores of scrap, fuel, glass, copper and relics, along with
  kills, a BPs counter, fuel, boat condition and the current beam type, which
  starts as Sweep.


  Once night falls, enemy waves escalate and the goal is to keep the lighthouse
  from falling. A Keeper Light bar at top left starts at 1000 of 1000, and a
  circular minimap in the bottom right corner shows the lighthouse and nearby
  markers.
