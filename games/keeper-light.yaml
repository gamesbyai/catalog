slug: keeper-light
title: Keeper Light
tagline: Upgrade your boat and lighthouse by day, then defend the light through
  each night's waves.
description: >-
  Keeper Light is a survival action game built around a lighthouse. Each run
  alternates between daytime and night. During the day you spend your resources
  on upgrades for your boat and for the lighthouse beam. When night falls, waves
  of enemies arrive, and you have to hold them off so the lighthouse stays
  standing.


  The nights grow harder as the run goes on, so the choices made in daylight
  decide how long the light survives. The split between preparing and defending
  gives the roguelite structure a clear rhythm, and the beam upgrades make the
  lighthouse an active part of the defense rather than just something to
  protect.


  The game was entered in Vibe Jam 2026 and runs on Three.js. The creator
  describes it as a first game made for a game jam and says it was built with
  Cursor.
