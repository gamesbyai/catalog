slug: keeper-light
title: Keeper Light
tagline: Upgrade your boat and lighthouse by day, then defend the light through
  each night's waves.
description: >-
  You start on a small green island in daylight, with a red-and-white lighthouse
  behind you and a wooden boat tied up just off the shore.


  The top of the screen shows Day 1 marked as Planning, with a clock reading 8h,
  so the daylight is a limited budget. Your job in those hours is to upgrade
  both the boat and the lighthouse beam. Right now the beam is set to Sweep.


  A panel on the right tracks your stores of scrap, fuel, glass, copper and
  relics, and you begin with 2 fuel. Under those there's a kill counter, a
  blueprint counter, and bars for fuel and boat health, with the boat at 100.


  When you stand near the dock, a prompt offers the Boat Yard.


  Once night comes, the enemy waves get tougher as they go. You're trying to
  keep the lighthouse from falling, and its health bar in the top left starts at
  1000.


  A small circular radar sits in the bottom right corner. The creator has said
  this was a first game made to finish for a jam.
