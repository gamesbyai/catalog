slug: keeper-light
title: Keeper Light
tagline: Upgrade your boat and lighthouse by day, then defend the light through
  each night's waves.
description: >-
  Day 1 starts on a small island with your keeper beside a ring marker, where an
  F prompt opens the Boat Yard.


  Daylight hours are for upgrading your boat and the lighthouse beam. You start
  out with the Sweep beam. You gather scrap, fuel, glass, copper and relics.


  When night comes, the enemies arrive in waves that keep escalating, and your
  job is to keep the lighthouse from falling.


  PetrSeifer87103 made it with a modest goal, which was to finish a first game.
