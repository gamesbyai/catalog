slug: helmet-sloshers
title: Helmet Sloshers
tagline: Race go-karts through a Finnish holiday, with beer, hot dogs and sauna stops.
description: >-
  Helmet Sloshers is a go-kart racing game set in a Finnish paradise and framed
  as a stag do with the squad. Between races you drink beer, smash hot dogs and
  sweat it out in the sauna, then head back to the track and do it all again.


  The appeal is the tone. Instead of a straight racing circuit, the game wraps
  its karting in a loop of silly Nordic leisure, where the pre-race and
  post-race rituals matter as much as the lap itself. It plays as a lighthearted
  party in the woods.


  The game was entered in Vibe Jam 2026 and runs on Three.js. According to the
  creator, it was built with Claude Code, and it is a single-player experience.
