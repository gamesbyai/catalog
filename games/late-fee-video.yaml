slug: late-fee-video
title: Late Fee Video
tagline: Rewind returns, reshelve tapes and keep the line moving in Uncle Ray's
  video store.
description: >-
  In this first-person simulator, you take over Uncle Ray's video store after
  his retirement. Tapes have been left behind since his last day.


  Returned tapes to rewind. Day-end saves. Shelves to sort alphabetically by
  genre. Candy wall to keep stocked. Shop carryover between shifts.


  Grab, place, rotate, toss items and flip your pose. Hold Tab to inspect a tape
  before it returns to the shelf, since each is unique. Run with Shift. Move up
  and down the aisles with WASD. Look around with the mouse. Drop low with C to
  reach bottom shelves. Keep the line moving before regulars leave.
