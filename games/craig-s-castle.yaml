slug: craig-s-castle
title: Craig's Castle
tagline: Guide a candle knight through deadly castle rooms, chasing three-star times.
description: >-
  Run, jump, slide down walls, and leap off them to get Craig through twenty
  castle rooms. You're steering him past saw blades and molten stone in rooms
  that are deadly. Craig is a candle knight. The music and sound effects are
  original.


  Winning a room isn't the end of it, but there are times that earn three stars
  to chase. You can also retry a room if you want.


  You get to choose which room to play. Once you've won, you can watch every
  attempt play back at once, built around your winning run. Retry and replay
  pair up well, with one giving you attempts and the other letting you look back
  over every one of them.


  You can play with either a keyboard or a standard controller, whichever you'd
  like.
