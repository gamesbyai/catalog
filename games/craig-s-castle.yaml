slug: craig-s-castle
title: Craig's Castle
tagline: Guide a candle knight through deadly castle rooms, chasing three-star times.
description: >-
  Run, jump, slide down walls, and leap off them to get Craig through twenty
  castle rooms. Craig is a candle knight, and you steer him past saw blades and
  molten stone in rooms that are deadly.


  Free choice of which room to play. Retries for any room, whenever you want
  one. Three-star times to chase in every room. Playback of every attempt at
  once after a win, built around your winning run.


  Pick a keyboard or a standard controller, whichever you'd like.


  The music and sound effects are original, and the game is by grumby.
