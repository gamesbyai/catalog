slug: strait-outta-hormuz
title: Strait Outta Hormuz
tagline: Steer a tanker 167 km through the Strait of Hormuz.
description: >-
  Strait Outta Hormuz puts you at the helm of a tanker with a 167 km route
  through the Strait of Hormuz ahead of it. It is an arcade naval action game:
  you steer the ship through the passage as the trip unfolds, and the job is to
  get it from one end of the waterway to the other.


  The game is single-player, built with Claude Code, Anthropic's coding tool, on
  Three.js, and there is also a mobile-friendly version for phones. In Vibe Jam
  2026 it placed 134th of 945 entries.


  The theme is current events and geopolitics. The game takes a real, well-known
  shipping lane and turns the crossing into a short, arcade-style voyage, framed
  as a distance to cover.
