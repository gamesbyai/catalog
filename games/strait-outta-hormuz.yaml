slug: strait-outta-hormuz
title: Strait Outta Hormuz
tagline: Steer a tanker 167 km through the Strait of Hormuz.
description: >-
  Strait Outta Hormuz is an arcade naval action game in which you pilot a tanker
  along a 167 km route through the Strait of Hormuz. The goal is to get the ship
  from one end of the waterway to the other, steering through the passage as the
  trip unfolds.


  The game takes a current-events and geopolitics theme and turns it into a
  short, arcade-style voyage. The setting is a real, well-known shipping lane,
  and the game frames the journey as a distance to cover rather than a scenario
  to simulate. It runs in the browser and has a mobile-friendly version.


  The game was entered in Vibe Jam 2026, where it placed 134th out of 945
  entries. It is a single-player game built with Three.js, and the creator used
  Claude Code to make it.
