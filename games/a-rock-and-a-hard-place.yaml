slug: a-rock-and-a-hard-place
title: A Rock and a Hard Place
tagline: Tilt the whole board to roll a rock into a leak before the village floods.
description: >-
  Tilt the whole board to roll a rock into a leak before the village floods. The
  villagers stand on the same board, so every tilt moves them too.


  Ten villages in meadow, snowfield, desert and night, all open from the start.
  Ice that keeps the rock sliding, and sand that slows its start. Two rocks and
  two leaks in the last four villages. Stars for fewer toppled villagers, not
  for speed. A Fast water mode with its own stars.


  Hold and move the mouse or a finger to tilt, or use the arrow keys or WASD.
  Press Space to hop the rock over low walls, though the landing knocks over
  everyone nearby. Approach a fallen villager slowly to nudge them back up.


  The text is in English and Korean. The creator used Claude Code to write and
  debug the code, and to run an automated playtest that found two impossible
  stages.
