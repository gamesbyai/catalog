slug: isometric-city
title: IsoCity
tagline: Build and manage an isometric city, growing it from the ground up.
description: >-
  You start with an empty isometric grid and $100,000 in funds. Lay down roads,
  rail or subway, then paint residential, commercial and industrial zones on the
  tiles. A side panel also offers services, parks and utilities to place, and a
  bulldoze tool clears tiles.


  A top bar tracks population, jobs, funds and monthly income, plus demand
  meters for the three zone types. Below it, percentage readouts show happiness,
  health, education, safety and environment. A tax slider sets the rate, and
  time controls let you pause or speed up the simulation.


  The simulation includes cars, buses, trains, planes, seaplanes and barges, and
  the vehicles respect traffic lights. Pedestrians walk the streets. View
  overlays highlight individual city conditions on the map, and a minimap shows
  zone coverage.


  The menu offers a new game, a co-op mode and a prebuilt example city to load.
  You can save and load multiple cities. The interface adapts to touch with
  drawers and toolbars.
