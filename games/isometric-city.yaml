slug: isometric-city
title: IsoCity
tagline: Build and manage an isometric city, growing it from the ground up.
description: >-
  You start with an empty green isometric grid, $100,000 in funds, and a sidebar
  full of tools for laying down roads, rail, subway lines and zones for a city
  that doesn't exist yet.


  You paint residential, commercial and industrial zones onto the grid, then
  connect them with roads and rail. The city grows from there, and a small meter
  in the top bar tracks demand for each zone type, so you can see what it wants
  next. Parks, services and other buildings sit in their own menus.


  Money is the thing you keep an eye on, because the top bar shows your funds,
  your monthly balance and a tax slider. Population and jobs sit beside them,
  which is handy when you're trying to balance homes against workplaces.


  Happiness, health, education, safety and environment each get a percentage
  too.


  Once things are running, the city fills with traffic. Cars, buses, trains,
  planes and seaplanes get around on their own and stop at traffic lights, and
  pedestrians find their own paths through the streets. That's a lot of moving
  parts for a game drawn on plain canvas, with no engine behind it.


  A row of view overlays lets you look at the map through a single lens, and a
  minimap in the corner color-codes the zones. You can save several cities and
  load them later, and there's a co-op mode on the start screen as well as a
  ready-made example city you can open.
