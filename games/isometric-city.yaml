slug: isometric-city
title: IsoCity
tagline: Build and manage an isometric city, growing it from the ground up.
description: >-
  IsoCity is a city-building simulation shown from an isometric viewpoint. The
  player lays out a city on a tiled map and manages it as it grows, in the
  tradition of classic urban planning games. The project lives in a public
  GitHub repository.


  The isometric presentation gives the city a clear, readable look, so the
  layout of the map is easy to follow as it fills in. The focus stays on
  planning and managing a city rather than on combat or fast reflexes, which
  suits players who like to take their time.


  The creator's listing names Cursor as a tool used in building the project. The
  repository hosts the source code, so the game can be read, run, and studied by
  anyone curious about how a browser-style city builder is put together.
