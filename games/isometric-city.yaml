slug: isometric-city
title: IsoCity
tagline: Build and manage an isometric city, growing it from the ground up.
description: >-
  IsoCity starts you on empty land with $100,000 to spend. The town begins with
  zero people, and you decide how it grows.


  Buses, cars, trains, barges, planes and seaplanes that stop at traffic lights.
  Pedestrians wandering among the vehicles. Health, happiness, safety, education
  and the environment, each tracked as a percentage. Overlay views that
  highlight one condition at a time across the map. Touch screen support.


  Start a new game, play co-op, or open a ready-made example city. Lay roads,
  rail or subway lines, then zone tiles as residential, commercial or
  industrial. Place parks, utilities and services. Set the tax rate, and speed
  the simulation up or pause it. Keep several cities saved, and load any of them
  back later.


  amilich built the game without an outside game engine, drawing the isometric
  renderer on HTML5 Canvas with its own depth sorting and layer handling. The
  project is open source, and it also holds IsoCoaster, a theme park builder
  with coasters, rides and guests.
