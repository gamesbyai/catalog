slug: quadron-x
title: Quadron X
tagline: Fly an X-wing through a 15-mission dogfight campaign with a voice-acted story.
description: >-
  Quadron X puts you in an X-wing, flying dogfights over asteroid fields, convoy
  lanes and Imperial trenches while the Empire hunts your squadron. You steer
  with the keyboard and aim with the mouse, and the cockpit is procedural and
  wraps 360 degrees around you.


  The campaign is carried by a voice-acted story, so there's someone talking to
  you while you fly.


  More than 200 video comms were generated with Grok, which is a pretty big cast
  of faces for something the creator made from scratch in one Sunday. A little
  droid portrait sits at the bottom of the start screen.


  You can boost, brake, or match speed with whatever you're chasing. For
  targeting, you can cycle through targets one at a time or jump to the nearest
  one, and a barrier shield is there when a fight turns ugly.


  Night-vision zoom and a camera switch each get their own key, so you can use
  them mid-flight.


  The start screen lets you edit your pilot name, switch on an easy mode, check
  the ranks and pick a level. There's a multiplayer mode as well, with a
  scoreboard you can pull up in flight, and the creator describes the whole
  thing as a spiritual successor to xpilot.
