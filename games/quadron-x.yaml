slug: quadron-x
title: Quadron X
tagline: Fly an X-wing through a 15-mission dogfight campaign with a voice-acted story.
description: >-
  Quadron X is a space combat game built around a 15-mission campaign in an
  X-wing fighter. Each mission puts you in a 360° cockpit, where you dogfight
  enemy craft while a story unfolds through voiced dialogue and short video
  transmissions from your allies and command.


  The cockpit is generated procedurally, giving a full view in every direction.
  More than 200 video comms were produced with Grok, so briefings and in-flight
  chatter carry much of the narrative. The creator describes it as a spiritual
  successor to xpilot, and the game supports multiplayer and mobile play.


  The creator built it from scratch in a single Sunday for Vibe Jam 2026, where
  it placed 41st out of 945 entries. It runs on Three.js, and the creator used
  Claude Code during development.
