slug: quadron-x
title: Quadron X
tagline: Fly an X-wing through a 15-mission dogfight campaign with a voice-acted story.
description: >-
  Quadron X puts you in an X-wing cockpit for a dogfight campaign. You fly with
  WASD and Q/E, aim with the mouse, fire with Space, and launch a torpedo with
  F. T cycles through targets, and R picks the nearest one. The start screen
  describes six missions across asteroid fields, convoy lanes, and Imperial
  trenches.


  Shift boosts and Ctrl brakes. Other keys raise a barrier shield (B), switch on
  a night-vision zoom (N), match speed with a target (X), and change the camera
  (C). P or Esc pauses, and the bracket keys change volume while M mutes.


  The creator's description lists a 15-mission campaign with a voice-acted
  story, a 360-degree procedural cockpit, and more than 200 video comms
  generated with Grok. The menu offers Start Game, Multiplayer, Levels, Ranks,
  and an Easy toggle. Each pilot gets a callsign, editable with Tab.


  The creator calls it a spiritual successor to xpilot and says it was made from
  scratch in one Sunday.
