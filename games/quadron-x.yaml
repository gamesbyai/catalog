slug: quadron-x
title: Quadron X
tagline: Fly an X-wing through a 15-mission dogfight campaign with a voice-acted story.
description: >-
  Quadron X puts you in an X-wing cockpit and sends you through a dogfight
  campaign. The start screen promises six missions across asteroid fields,
  convoy lanes and Imperial trenches, while the creator's own pitch describes a
  full 15-mission campaign with a voice-acted story.


  You fly with WASD plus Q and E, aim with the mouse and fire with Space, and F
  sends off a torpedo.


  Targeting gets two keys of its own, with T cycling through targets and R
  snapping to whichever one's nearest. X matches your speed to the target you've
  picked.


  The rest of the keyboard is pretty busy as well. Shift boosts and Ctrl brakes,
  B raises a barrier shield, and N switches on a night-vision zoom. C changes
  the camera, P or Esc pauses, the bracket keys adjust volume and M mutes.


  According to the creator, the cockpit wraps a full 360 degrees and is built
  procedurally, and it's backed by more than 200 video comms generated with
  Grok, which is a lot of radio chatter for one dogfighter.


  From the menu you can start the campaign, jump into multiplayer, or browse
  levels and ranks. An Easy toggle sits right there too. Every pilot gets a
  callsign like Comet-982, and you can rename yours with Tab.


  daniel-farinax calls it a spiritual successor to xpilot. They say it was made
  from scratch in one Sunday.
