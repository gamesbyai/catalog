slug: quadron-x
title: Quadron X
tagline: Fly an X-wing through a 15-mission dogfight campaign with a voice-acted story.
description: >-
  Quadron X puts you in an X-wing cockpit for a dogfight campaign. According to
  the creator, the campaign runs 15 missions with a voice-acted story, while the
  start screen advertises six.


  Missions over asteroid fields, convoy lanes and Imperial trenches. A
  multiplayer mode alongside the campaign. Levels and ranks to browse. Callsigns
  for every pilot, such as Comet-982. An Easy toggle.


  Fly with WASD, Q and E. Aim with the mouse. Press Space to fire, and F to
  launch a torpedo. Press T to cycle targets, or R to snap to the nearest one.
  Press X to match your speed to your selected target. Use Shift to boost and
  Ctrl to brake. Press B to raise the barrier shield, and N to switch on the
  night-vision zoom. Press C to change the camera. Press Tab to rename your
  callsign.


  daniel-farinax says it was made from scratch over a single Sunday and calls it
  a spiritual successor to xpilot. According to the creator, the cockpit wraps a
  full 360 degrees and is built procedurally. The creator also says more than
  200 video comms generated with Grok back the game.
