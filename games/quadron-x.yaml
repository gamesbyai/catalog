slug: quadron-x
title: Quadron X
tagline: Fly an X-wing through a 15-mission dogfight campaign with a voice-acted story.
description: >-
  Quadron X puts you in an X-wing fighter for a 15-mission campaign. Each
  mission seats you in a 360° cockpit, where you dogfight enemy craft while the
  story unfolds through voiced dialogue and short video transmissions from your
  allies and command.


  By the creator's account, it was built from scratch in a single Sunday with
  Claude Code and Three.js, and it placed 41st of 945 at Vibe Jam 2026. More
  than 200 video comms were produced with Grok, and the creator describes the
  game as a spiritual successor to xpilot.


  Multiplayer and phone play are both supported, and the campaign mixes action
  with simulation. The cockpit is generated procedurally, with a full view in
  every direction, and the briefings and in-flight chatter carry much of the
  narrative.
