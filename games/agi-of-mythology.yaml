slug: agi-of-mythology
title: AGI of Mythology
tagline: Command a research lab in a real-time fight over a central server.
description: >-
  AGI of Mythology is a real-time strategy game for the browser in which you run
  a research lab. Rival labs compete for control of a single central server, and
  the lab that holds it long enough reaches AGI. A match is a race that combines
  building up your side with contesting that shared objective.


  The game is built for quick sessions with friends, and it supports multiplayer
  and mobile play. Its premise turns the AI race into a contest over one map
  location, which keeps matches focused on a single point of conflict instead of
  sprawling economies.


  It was made for Vibe Jam 2026 and renders with Three.js. The creator says it
  was built with Codex, and the stated goal was a real-time strategy game that
  friends can start playing quickly in a browser.
