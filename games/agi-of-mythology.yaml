slug: agi-of-mythology
title: AGI of Mythology
tagline: Command a research lab in a real-time fight over a central server.
description: >-
  In AGI of Mythology, the AI race is a real-time strategy match. You run a
  research lab, rival labs compete for control of a single central server, and
  whichever lab holds it long enough reaches AGI.


  The creator's stated goal was a strategy game friends can start playing
  quickly in a browser, and it is built around quick multiplayer sessions that
  also work on a phone. The creator says it was built with Codex for Vibe Jam
  2026, where it ranked 309th of 945, and it renders in Three.js.


  A match pulls you two ways: build up your own side, and contest the one
  objective every lab wants. Holding the server is how a lab wins, so the
  fighting keeps returning to that one location on the shared map.
