slug: agi-of-mythology
title: AGI of Mythology
tagline: Command a research lab in a real-time fight over a central server.
description: >-
  You start as a research lab with a Town Center, a stock of 500 Bio, 300 Mat
  and 200 GPU, and two idle workers. The Town Center produces agents. A
  first-mission card gives the order of play: build, gather, train, then take
  the central server. It offers a "Show me" button and a "Skip" button.


  The central server sits on the map as the shared objective, and the lab that
  holds it reaches AGI. A panel in the top right shows whether the server is
  contested and lists each player with a timer, which starts at 5:00 for the
  first player.


  The map is a 3D landscape of forests and pale mountains, seen from an angled
  overhead camera. You select a unit or building and pick orders from a command
  bar along the bottom, which also has a clear-selection button. A chat panel
  lets you message other players in the match. The creator wanted a real-time
  strategy game you can start quickly with friends in the browser.
