slug: agi-of-mythology
title: AGI of Mythology
tagline: Command a research lab in a real-time fight over a central server.
description: >-
  In this real-time strategy game, each army is a rival AI lab after the same
  central server, and whoever holds it reaches AGI. You play one, starting with
  a Town Center, two idle workers, 500 Bio, 300 Mat and 200 GPU.


  Bio, Mat and GPU (graphics cards), three resources. Agents from the Town
  Center. Four-step first mission covering build, gather, train and taking the
  central server, with a 5:00 timer for player one.


  Select a unit or building to give orders. Message other players in your match.


  TTrussner wanted an RTS you can start quickly with friends in the browser.
