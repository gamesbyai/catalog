slug: agi-of-mythology
title: AGI of Mythology
tagline: Command a research lab in a real-time fight over a central server.
description: >-
  You start with one Town Center on a wide, tree-covered map, and the whole
  match is a fight over a single spot, the central server. You play a research
  lab racing to reach AGI, so holding that server is what you're after.


  Your stock has three resources: bio, materials and GPU. You begin with 500,
  300 and 200, and the Town Center turns them into agents. The price sits right
  on the agent button in the bottom panel, which saves you a trip to any menu.


  A short first mission walks you through the order: build, gather, train, then
  take the central server. There's a Show me button if you want the walkthrough
  and a Skip button if you'd rather work it out yourself.


  The central server gets its own panel in the top corner. It lists players in
  ranked order with a clock beside each name and tells you whether the server is
  contested, so you can read the standoff at a glance. It's a neat way to turn
  one map spot into a scoreboard.


  Matches are multiplayer, and while you're alone the panel just says it's
  waiting for other players. A chat window lets you talk to whoever joins.


  The creator wanted a real-time strategy game you could play quickly with
  friends in a browser.


  Down in the bottom bar there's a counter of idle units, so you can spot anyone
  standing around, plus a Clear button that drops your current selection.
