slug: joe-must-drive
title: Joe Must Drive
tagline: Ride a sidecar motorcycle as driver or gunner and fight through zombie
  waves and bosses.
description: >-
  The goal is to survive a zombie-filled ride past obstacles, through waves of
  the undead, and into boss fights. You travel on a motorcycle with a sidecar,
  and before the run you choose whether to be the driver or the gunner.


  You ride down a city highway, and a barricade waits ahead. You fight back with
  a handgun. You reload the handgun by pressing R.


  Your health starts at 100 HP. The game also has a chain multiplier.


  The creator drew on survival horror like Resident Evil and mobile apocalypse
  games, and built the game in 3D as a first project.
