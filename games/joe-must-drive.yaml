slug: joe-must-drive
title: Joe Must Drive
tagline: Ride a sidecar motorcycle as driver or gunner and fight through zombie
  waves and bosses.
description: >-
  Survive a zombie-filled ride down a city highway on a motorcycle with a
  sidecar. Before the run, you pick whether to be the driver or the gunner.


  Road obstacles, including a barricade. Waves of the undead. Boss fights along
  the ride. A chain multiplier.


  Fight back with the handgun during the ride. Press R to reload it.


  michelin_dude drew on survival horror such as Resident Evil and on mobile
  apocalypse games played when they were younger. It was their first project,
  built in 3D.
