slug: joe-must-drive
title: Joe Must Drive
tagline: Ride a sidecar motorcycle as driver or gunner and fight through zombie
  waves and bosses.
description: >-
  Joe Must Drive is a fast-paced zombie shooter set on a motorcycle with a
  sidecar. Before a run, you pick a role: the driver, who steers the bike, or
  the gunner, who handles the shooting. From there you push forward through
  obstacles, fend off waves of zombies, and face boss fights along the way.


  The two-seat setup is the core idea. Driving and shooting are split into
  separate jobs, and the game supports multiplayer, so two people can share the
  bike. It also runs on mobile, which fits its quick, action-heavy pace.


  The creator drew on a fondness for horror shooters like Resident Evil and the
  mobile apocalypse games they played growing up. It is their first real game
  project, built in 3D with Three.js, and the creator states they used Codex
  during development. It was entered in Vibe Jam 2026.
