slug: joe-must-drive
title: Joe Must Drive
tagline: Ride a sidecar motorcycle as driver or gunner and fight through zombie
  waves and bosses.
description: >-
  The goal is to survive a zombie-filled ride past obstacles, through waves of
  the undead, and into boss fights. You travel on a motorcycle with a sidecar,
  and before the run you choose whether to be the driver or the gunner.


  The view is first person on a dark city highway under a moon, with a barricade
  waiting down the road. You hold a handgun with a green crosshair at the center
  of the screen. The ammo panel shows 12 rounds loaded and an infinite reserve,
  and a prompt tells you to press R to reload.


  The screen tracks health, which starts at 100 HP, along with score, distance
  in meters, and elapsed time. A chain multiplier begins at x1.00 beside a chain
  ready indicator, and a bar across the top holds a small marker.


  The creator drew on survival horror like Resident Evil and mobile apocalypse
  games, and built the game in 3D as a first project.
