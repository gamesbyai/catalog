slug: joe-must-drive
title: Joe Must Drive
tagline: Ride a sidecar motorcycle as driver or gunner and fight through zombie
  waves and bosses.
description: >-
  Joe Must Drive puts two jobs on one motorcycle. Before a run you pick a role:
  the driver steers the bike and the gunner handles the shooting. From there you
  push forward through obstacles, fend off waves of zombies and face boss fights
  along the way.


  The creator drew on a fondness for horror shooters like Resident Evil and the
  mobile apocalypse games they played growing up. It is their first real game
  project, built in Three.js with Codex, and it runs on phones too. It finished
  346th of 945 at Vibe Jam 2026.


  Splitting driving and shooting into separate jobs is the core idea, and
  multiplayer lets two people share the bike: one on the handlebars, one on the
  trigger, both trying to get through the next wave.
