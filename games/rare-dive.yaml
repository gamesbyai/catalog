slug: rare-dive
title: Rare Dive
tagline: Name less familiar members of seven timed categories to score deeper.
description: "You name a member of each category in a seven-question round, with 25 seconds on each prompt. Obvious answers still count, but less familiar ones from the game's list earn more points.


  98 categories, from nature and geography to everyday life. Daily mode, with the same categories for everyone on a given UTC date. Unlimited mode for repeat rounds, with no daily limit. Six score bands set in advance by editors, from 10 to 100 points. Best score, unfinished rounds and daily streak saved in your browser. Spoiler-free results to share with friends.


  Read the category, then type your answer. If an answer isn't accepted, keep typing while the clock runs. Pass to skip a prompt and move on. Finish the round to see your total.


  Hao wrote the specification and reviewed how it plays, while Codex wrote the React and Next.js code, the answer bank, the tests and the SEO pages. It takes its open-category format from Krillion, but it isn't affiliated with krillion.io."
