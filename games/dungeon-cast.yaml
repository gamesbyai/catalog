slug: dungeon-cast
title: Dungeon Cast
tagline: Explore a raycast dungeon in first person, right in your browser.
description: >-
  Explore a dungeon in first person, drawn the old-school way with raycasting
  like 90s corridor games such as Wolfenstein 3D.


  Walls drawn as pseudo-3D slices. A 2.5D look made in a 2D engine. A dungeon
  adventure that loads instantly.


  GraslT built it in Phaser on purpose, skipping a 3D library.
