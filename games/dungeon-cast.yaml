slug: dungeon-cast
title: Dungeon Cast
tagline: Explore a raycast dungeon in first person, right in your browser.
description: >-
  Dungeon Cast is a 2.5D dungeon crawler that uses old-school raycasting, the
  same technique behind 90s corridor games like Wolfenstein 3D. The player moves
  through a dungeon seen from a first-person view, with walls drawn as pseudo-3D
  slices, and works through the adventure inside the browser.


  The project is a deliberate technical choice: it was made for Vibe Jam 2026,
  where the creator chose to build a 2.5D game in Phaser rather than take the
  more common route of using a dedicated 3D library. The result is a retro look
  produced by a 2D engine. It runs instantly in the browser with no download.


  The creator built it with Claude Code. In the Vibe Jam 2026 ranking, it placed
  245th out of 945 entries, which puts it in the upper half of the field.
