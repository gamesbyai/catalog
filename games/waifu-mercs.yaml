slug: waifu-mercs
title: Waifu Mercs
tagline: Shoot waves of zombies from behind the shoulder in split-screen co-op.
description: >-
  Waifu Mercs is a third-person zombie shooter that blends the tense
  over-the-shoulder combat of survival horror with the horde-clearing loop of
  survivor-style games. Players fight off crowds of undead, aiming and firing as
  the pressure builds around them. It is built for two people playing together
  on one shared split screen.


  The split-screen focus is the core idea. The creator wanted a couch-style
  co-op game to play with their wife, and that goal shapes the whole design. Two
  mercenaries share the action side by side, each with their own view of the
  fight. The mix of shooter aiming and survivor-style waves keeps the pace fast
  and casual.


  The game runs in the browser on Three.js and was entered in Vibe Jam 2026,
  where it placed 36th out of 945 entries. The creator built it with Claude
  Code.
