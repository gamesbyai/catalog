slug: waifu-mercs
title: Waifu Mercs
tagline: Shoot waves of zombies from behind the shoulder in split-screen co-op.
description: >-
  Two players share one screen and fight off zombie hordes from behind the
  shoulder. Each of you plays a mercenary, and together you push back the undead
  as the pressure builds.


  The creator wanted a couch-style co-op game to play with their wife, and that
  goal shaped the design, down to each player having their own view of the
  fight. It was built in Three.js with Claude Code.


  The combat blends the over-the-shoulder aiming of survival horror with the
  horde-clearing loop of survivor-style games, and the waves keep the pace fast
  and casual for both players.
