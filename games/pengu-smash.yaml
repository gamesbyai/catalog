slug: pengu-smash
title: Pengu Smash
tagline: Charge and clash with penguins to knock rivals off a crumbling hex ice arena.
description: >-
  Pengu Smash puts you on a crumbling hex ice arena as a penguin, charging and
  clashing to knock rivals into the ocean before the platform gives way beneath
  you. You pick a name and a role, then press Play, or use the Online, Create
  Room and Join buttons to play with friends.


  Five roles are on the menu. Archer fires ranged Ice Arrows and can pierce a
  line with Power Shot. Mage casts Frost Bolt, drops a Blizzard circle and can
  Blink. Warrior leaps in with Fish Slap and Whirlwind. Tank shoves enemies and
  places Ice Walls. Healer mends allies and lays down a Warm Aura.


  Clicking an enemy attacks it automatically from your role's range. Skills sit
  on Q, W and E, with an ultimate on R that you aim by holding the key and
  release to cast. Abilities cost mana, which refills slowly. A penguin is out
  at 0 HP or when it falls in the water.


  Parties are built around a tank, a healer and a damage dealer. In 3v3 matches
  the ice melts after 60 seconds. The menu also lets you cycle through arena
  themes, such as Frostbound Sanctuary. The creator says the music, water
  sparkles and themes were all generated, with no assets and no build step.
