slug: pengu-smash
title: Pengu Smash
tagline: Charge and clash with penguins to knock rivals off a crumbling hex ice arena.
description: >-
  Pengu Smash has you play a penguin on a crumbling hex ice arena. You charge
  and clash to knock rivals into the ocean before the platform gives way beneath
  you.


  Archer's ranged Ice Arrows and line-piercing Power Shot. Mage's Frost Bolt,
  Blizzard circle and Blink. Warrior's leap-in Fish Slap and Whirlwind. Tank's
  enemy shoves and Ice Walls. Healer's ally mending and Warm Aura. Parties built
  around a tank, a healer and a damage dealer. 3v3 matches with the ice melting
  after 60 seconds.


  Pick a name and a role, then press Play. To play with friends, press Online,
  then Create Room or Join. Click an enemy to attack it automatically from your
  role's range. Use Q, W and E for skills, and hold R to aim your ultimate, then
  release to cast it. Abilities cost mana, which refills slowly. A penguin is
  out at 0 HP or when it falls into the water.


  Chiptune music, water sparkles and arena themes were all generated, according
  to the creator, with no assets and no build step.
