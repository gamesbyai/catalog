slug: pengu-smash
title: Pengu Smash
tagline: Charge and clash with penguins to knock rivals off a crumbling hex ice arena.
description: >-
  Pengu Smash is a real-time 3D multiplayer brawler set on a platform of
  hexagonal ice tiles floating in the ocean. Each player controls a penguin that
  charges and collides with others, trying to bowl them into the water. The
  arena crumbles as the round goes on, so the safe footing shrinks and the last
  penguin standing wins.


  The game runs in the browser and supports online play with friends, including
  on mobile. It uses no external assets: the visuals, sparkling water effects,
  selectable themes, and chiptune music are all produced in code. The shrinking
  hex floor keeps rounds tense, since every clash risks sending you off an edge.


  The creator built it with Claude Code as an experiment in how far an AI
  pair-programmer could take a multiplayer 3D browser game, inspired by Pieter
  Levels' build-in-public approach. It uses Three.js and needs no build step. It
  was entered in Vibe Jam 2026.
