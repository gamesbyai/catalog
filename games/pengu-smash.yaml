slug: pengu-smash
title: Pengu Smash
tagline: Charge and clash with penguins to knock rivals off a crumbling hex ice arena.
description: >-
  Pengu Smash is a penguin brawl on a floor of hexagonal ice tiles floating in
  the ocean. Each player's penguin charges and collides with the others, trying
  to bowl them into the water, and the last penguin standing wins.


  The creator treated it as an experiment in how far an AI pair-programmer could
  take a multiplayer 3D browser game, using Claude Code and taking cues from
  Pieter Levels' build-in-public approach. The visuals, the sparkling water, the
  selectable themes and the chiptune music are all produced in code.


  It runs in real time online with friends, on desktop or on a phone, and it is
  a party game at heart. The arena crumbles as the round goes on, so the safe
  footing shrinks and every clash risks sending you off an edge.
