slug: shade-chasers
title: Shade Chasers
tagline: Sprint through shadows to reach a shelter before the rising sun burns you.
description: >-
  Shade Chasers is a 3D action game about outrunning the light. The sun is
  slowly rising and its rays are deadly, so the player must reach a shelter
  while moving only through shadows. Each run is a race against the clock, with
  the safe path shifting as the light climbs.


  The core mechanic is built around dynamic light sources and shadows. Instead
  of treating lighting as decoration, the game makes it the danger and the map
  at once, so players read cast shadows to plan a route. It mixes running, quick
  decisions and a bit of strategy.


  The creator started learning Three.js only days before the jam was announced
  and used this game to keep learning while building it with AI assistance. The
  creator built it with Cursor. An interest in lighting, post-processing and
  shaders shaped the concept.
