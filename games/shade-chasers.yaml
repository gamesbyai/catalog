slug: shade-chasers
title: Shade Chasers
tagline: Sprint through shadows to reach a shelter before the rising sun burns you.
description: >-
  The sun is slowly rising in Shade Chasers, and its rays are deadly. You have
  to reach a shelter by moving only through shadows, and as the light climbs,
  the safe path shifts.


  Light and shadow are the core mechanic. Dynamic light sources cast the shadows
  you run through, so the light is both the danger and the map, and you read the
  shadows to plan a route. A run is a race against the clock that mixes running,
  quick decisions, and a bit of strategy.


  The creator started learning Three.js only days before Vibe Jam 2026 was
  announced and kept learning by building this game with Cursor. It ranked 575th
  of 945 entries. An interest in lighting, post-processing, and shaders shaped
  the concept.
