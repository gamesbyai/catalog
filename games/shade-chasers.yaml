slug: shade-chasers
title: Shade Chasers
tagline: Sprint through shadows to reach a shelter before the rising sun burns you.
description: >-
  On your own, you have to reach a shelter by moving only through shadows,
  reading them to plan your route. Stay out of the deadly sunlight as the sun
  slowly climbs. The safe path shifts as the light rises.


  Light and shadow as the core mechanic. Dynamic light sources casting shadows
  you run through. A clock you race against. Running, with quick decisions and a
  bit of strategy.


  niklaskking kept learning Three.js by building this game. The concept came
  from the creator's interest in lighting, post-processing, and shaders.
  "Learning by doing," the creator writes.
