slug: shade-chasers
title: Shade Chasers
tagline: Sprint through shadows to reach a shelter before the rising sun burns you.
description: >-
  Stay out of the deadly sunlight as the sun slowly climbs. You have to reach a
  shelter by moving only through shadows, and as the light climbs, the safe path
  shifts.


  Light and shadow are the core mechanic. Dynamic light sources cast the shadows
  you run through, and you read those shadows to plan your route. A run is a
  race against the clock that mixes running, quick decisions, and a bit of
  strategy.


  The creator kept learning Three.js by building this game with Cursor. The
  concept grew out of the creator's interest in lighting, post-processing, and
  shaders.
