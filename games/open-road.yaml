slug: open-road
title: Open Road
tagline: Roam a mountain valley in the Vantara GT-R and earn festival wristbands.
description: >-
  In the Vantara GT-R, you're free to drive the mountain roads of Horizon Valley
  however you like. Pine trees, grass and guardrails sit along the road in warm
  sunset light, and that light does a lot of the work.


  A festival's rolled into the valley, and you earn its three wristbands by
  taking on the events.


  An objective tracker keeps you posted on what's next, and at the moment that's
  the Festival Sprint. The minimap picks out points of interest close by, while
  a beam of light out on the horizon shows where your next event is. Splitting
  the job that way, with the map covering what's near and the beam covering
  what's distant, is a clever bit of design.


  You've got 10,000 credits to start, then make a stop at the Garage between
  runs.


  A whole dozen boards are tucked away around the valley. You spot them as you
  explore.


  Built for relaxed exploring and quick races, it's a driving game seen from a
  third-person view. A speedometer and a gear indicator sit on screen, which is
  an oddly serious touch for a game like that. There's controller support too.
