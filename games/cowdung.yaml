slug: cowdung
title: cowdung
tagline: Fly around as a fly, taste the dung, and dodge the incoming splat.
description: >-
  In cowdung you play a fly in a 3D pasture. The goal is to reach the cow dung
  and taste it. The threat is the incoming splat that can land on you, so every
  approach is a gamble between getting a taste and getting flattened.


  It is an action game with a simulation flavor. The premise is simple and a
  little gross, as the title promises, and the tone leans on that humor.
  Multiplayer means other players can share the pasture with you at the same
  time.


  Built by el_rei_gabriel with Cursor and Three.js, it placed 45th of 945 at
  Vibe Jam 2026. The tension stays in one place: a fly has to get close to the
  food to score, and a fly that gets careless pays for it.
