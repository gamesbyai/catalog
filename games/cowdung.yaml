slug: cowdung
title: cowdung
tagline: Fly around as a fly, taste the dung, and dodge the incoming splat.
description: >-
  Play a fly in a 3D pasture. Reach the cow dung and taste it before the
  incoming splat flattens you.


  Every approach a gamble between a taste and a splat. Other players sharing the
  pasture. Humor as simple and gross as the title promises.


  Fly close to score, and get out before the splat lands.


  Made by el_rei_gabriel.
