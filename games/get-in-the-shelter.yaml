slug: get-in-the-shelter
title: GET IN THE SHELTER!
tagline: Race against a five-minute clock to reach a storm shelter before the
  tornado hits.
description: >-
  An Oklahoma tornado season story played out in a single countdown. A big
  twister is bearing down, and you have five minutes to get yourself into the
  shelter. The run is a race through a 3D setting, mixing adventure exploration
  with survival pressure as the storm closes in.


  The setting comes from the creator's own home state, where tornado season runs
  in April and May. The idea was to share something that feels familiar to
  people there with players elsewhere, even though the creator has never seen a
  tornado in person. Storytelling and immersion were the main goals.


  The creator built it with Claude Code on Three.js for Vibe Jam 2026, where it
  placed 12th out of 945 entries. The creator says many planned additions are
  still unfinished and hopes the game feels more immersive as they land.
