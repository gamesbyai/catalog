slug: debt-witch-blood-interest
title: "Debt Witch: Blood Interest"
tagline: Survive 60 seconds as a witch, casting spells against a swarm of vampiric debt.
description: >-
  A dark purple grid fills the screen, with your witch as a small black blob and
  colored blobs carrying surprisingly literal labels like Rent Ghoul, Interest
  Bat and Subscription Leech drifting in around her. You're trapped inside a
  cursed ledger, and that swarm is vampiric debt crawling out of its margins.


  Your job is to last 60 seconds against it, while a timer counts down in the
  corner beside your score, your debt and your hearts.


  You steer with WASD or the arrow keys and aim with the mouse. Casting works on
  a click, Space or Q. The bar along the bottom calls that basic spell the
  Receipt Bolt, which is a fitting thing to throw at a bill.


  Two more abilities sit on the keyboard, both named after accounting terms.


  E slows the debt down through a spell called Grace Period, a clever name for
  buying time. R sets off the Write-Off blast. A run means casting, dodging and
  slowing the swarm inside one short window, and when the 60 seconds are up, a
  cursed accountant hands you a grade for how you did.


  The whole thing is played as gothic comedy in an arcade survival format, where
  unpaid bills and interest are monsters with teeth. Even the enemy names stay
  on theme, turning your rent into a ghoul and a subscription into a leech.


  Bad Omen Games built it with AI assistance on the code, graphics and text,
  according to their own disclosure.
