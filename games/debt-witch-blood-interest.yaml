slug: debt-witch-blood-interest
title: "Debt Witch: Blood Interest"
tagline: Survive 60 seconds as a witch, casting spells against a swarm of vampiric debt.
description: >-
  A lone witch is trapped inside a cursed ledger, where vampiric debt crawls out
  of the margins. Unpaid bills and interest are monsters with teeth. Your job is
  to survive 60 seconds against the swarm, casting, dodging and slowing it
  within one short window.


  Bill-themed enemies, such as the Rent Ghoul, Interest Bat and Subscription
  Leech. The Receipt Bolt, your basic spell. Grace Period and Write-Off, two
  abilities named after accounting terms. A grade for how you did, from the
  cursed accountant when the 60 seconds are up. Gothic comedy in an arcade
  survival format.


  Steer with WASD or the arrow keys, and aim with the mouse. Cast with a click,
  Space or Q. Press E to slow the debt with Grace Period. Press R to set off the
  Write-Off blast.


  According to Bad Omen Games, the game was built with AI assistance on the
  code, graphics and text.
