slug: debt-witch-blood-interest
title: "Debt Witch: Blood Interest"
tagline: Survive 60 seconds as a witch, casting spells against a swarm of vampiric debt.
description: >-
  You start on a dark, grid-lined page with a black blob of a witch and small
  colored monsters drifting toward her. Each one wears a name tag like Rent
  Ghoul, Interest Bat or Subscription Leech, and a Time box at the top counts
  down from 60.


  You're a witch trapped in a cursed ledger, and the debt has turned vampiric.


  You move with WASD or the arrow keys, aim with the mouse, and cast spells at
  the swarm. The top of the screen shows your time, score, debt and hearts,
  which is a tidy way to make money trouble stand in for health.


  Your goal is to make it through the full 60 seconds without the debt swarm
  getting you.


  Besides the basic cast, which the bar at the bottom calls Receipt Bolt, you
  get two more tricks. Grace Period slows the debt down, and Write-Off is a
  blast you set off on its own key. Naming a panic button after clearing a bill
  is a pretty good joke.


  When the minute runs out, a cursed accountant hands you a grade for how you
  did. The creator credits AI help with the code, graphics and text.
