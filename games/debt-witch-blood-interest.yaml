slug: debt-witch-blood-interest
title: "Debt Witch: Blood Interest"
tagline: Survive 60 seconds as a witch, casting spells against a swarm of vampiric debt.
description: >-
  You are a witch trapped inside a cursed ledger, and vampiric debt is crawling
  out of its margins. Your job is to last 60 seconds against the swarm. Steer
  with WASD or the arrow keys, aim with the mouse, and cast spells with a click,
  Space, or Q.


  Two more abilities sit on the keyboard. E slows the debt, and R sets off the
  Write-Off blast. You cast, dodge, and slow the swarm within one short run.
  Once the 60 seconds are up, a cursed accountant hands you a grade for how you
  did.


  The setting treats unpaid bills and interest as monsters that bite, played as
  gothic comedy in an arcade survival format. The creator's disclosure lists AI
  assistance for the code, graphics, and text.
