slug: apollo-g-now
title: "Apollo-G: Now"
tagline: Fly a drifting probe past planets and time one camera shot per world.
description: >-
  The game opens on black space with stars streaking out from the center, a
  green bar across the top and a row of thirteen empty slots along the bottom. A
  gray crosshair marks your aim, and a red square frames the target once it
  drifts into view.


  You're a small probe on a fast trip outward through a star system that might
  look familiar. Each world is one quick flyby, and because inertia and gravity
  keep pulling at you, letting go of the controls won't stop you. Your momentum
  carries on.


  Holding your aim costs power, and there's only so much to spend. So you can't
  keep fixing the drift, and you end up choosing when a correction is worth it.


  You get a single photo per world, which makes every flyby count. Fire when
  range and alignment line up and you get a sharp, high-quality image, but a
  sloppy shot leaves a weak frame in your gallery. The slots at the bottom fill
  with orange marks as you shoot, so you can see the mission piling up.


  How well you photographed the trip decides which of two endings you get. Every
  frame stays in the gallery, so a hasty picture early on is still there at the
  end.


  It's deliberately small and takes its look from 80s arcade machines. The sound
  and graphics are procedural, which is a nice trick for something this compact.
  Touch devices get a virtual game pad.
