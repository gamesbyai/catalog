slug: apollo-g-now
title: "Apollo-G: Now"
tagline: Fly a drifting probe past planets and time one camera shot per world.
description: >-
  You pilot a small space probe on a flyby through a star system, one world at a
  time. Thrust is inertial, so the probe keeps drifting after you release the
  keys, and gravity pulls it off course while you try to line up the camera.


  Holding your aim costs limited power, so every correction has a price. Each
  world gives you a single photo. Fire when range and alignment match and the
  frame comes out sharp. Fire too early or off target and the gallery gets a
  weak picture.


  A run is short, a few minutes in all. It ends in one of two endings, chosen by
  how good your photos were across the mission. The look is 8-bit arcade, with
  pixel graphics and sound generated by code.


  The creator wrote it in HTML5 and JavaScript, using Claude models inside the
  Cursor editor. Touch devices get an on-screen game pad.
