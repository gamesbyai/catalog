slug: apollo-g-now
title: "Apollo-G: Now"
tagline: Fly a drifting probe past planets and time one camera shot per world.
description: >-
  The screen is mostly black starfield, with a gray crosshair, a green bar
  across the top and a row of thirteen small boxes along the bottom.


  You're steering a small space probe on a fast flyby outward through a star
  system, taking its worlds one by one, and the creator slyly hints you might
  recognize the place. Thrust is inertial, which keeps the probe drifting once
  you let go of the keys, while gravity drags it off its line as you work to get
  the camera lined up.


  Keeping your aim steady drains a limited supply of power, so every correction
  costs you something. Each world gets exactly one photo, a strict budget for a
  camera that's flown all that way. Shoot when range and alignment match and
  you'll get a sharp frame, but if you fire early or miss the target, a weak
  picture ends up in your gallery.


  A whole run lasts just a few minutes, and which of the two endings you see
  comes down to the quality of your photos across the mission.


  Everything's drawn in a blocky 8-bit arcade style, and both the pixel visuals
  and the sound are generated by code. If you're on a touch device, you get an
  on-screen game pad instead of the keyboard.


  According to the creator, it was built in HTML5 and JavaScript inside the
  Cursor editor, with Claude models helping out.
