slug: apollo-g-now
title: "Apollo-G: Now"
tagline: Fly a drifting probe past planets and time one camera shot per world.
description: >-
  Steer a small space probe on a fast flyby out through a star system, and take
  one photo of each world as you pass.


  Inertial thrust that keeps the probe drifting, and gravity that pulls it off
  its line. A limited power supply drained by every correction. One photo per
  world, sharp when range and alignment match and weak when you fire early. Runs
  of a few minutes, with one of two endings set by your photos.


  Play with the keyboard, or the on-screen game pad on a touch device.


  The creator hints you might recognize the star system. The visuals and sound
  are generated by code, and Claude models helped build it.
