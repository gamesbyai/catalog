slug: orbital-breach
title: Orbital Breach
tagline: Fight other players in a zero-gravity arena, floating and shooting in
  every direction.
description: >-
  Drift through a zero-gravity arena and fire at other players from every angle.


  No floor to stand on. Weightless movement instead of running. Position in
  three dimensions as important as aim. Fast online matches, with shots coming
  from above, below and every side.


  Inspired by Orson Scott Card's Ender's Game.
