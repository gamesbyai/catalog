slug: orbital-breach
title: Orbital Breach
tagline: Fight other players in a zero-gravity arena, floating and shooting in
  every direction.
description: >-
  Orbital Breach is a multiplayer shooter set in a zero-gravity arena. Players
  drift through open space instead of running along floors, aiming and firing at
  opponents from any angle. Each match is a fast exchange of movement and shots,
  where position in three dimensions matters as much as aim.


  The zero-G setting changes how a firefight works, since there is no up or down
  to anchor to. The creator points to Orson Scott Card's Ender's Game as
  inspiration, which suggests the weightless battle-room style of combat. It
  runs in the browser on Three.js and is set up for both desktop and mobile
  play.


  The creator built it with Claude Code. It was entered in Vibe Jam 2026, the AI
  game jam, where it placed 160th among 945 entries.
