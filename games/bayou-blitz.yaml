slug: bayou-blitz
title: Bayou Blitz
tagline: Collect crawfish through the bayou while dodging hungry gators.
description: >-
  Move with WASD or the arrow keys through a mall level while a pursuer who
  likes you far too much chases you. Keep the Loneliness meter between 20 and
  80. Running makes you lonely, and getting caught makes her cling, so you have
  to stay between the two.


  Shift dashes with invincibility frames, and Space uses a power-up picked up by
  walking over a glowing pad. If she grabs you, alternate A and D to struggle
  free. The HUD shows the Loneliness value, a Clingy count, a countdown timer
  and a running score.


  The first level is a mall with an alt-fashion store, with store islands and
  one-way escalators. Mall-walkers slow you down, and you survive for 2:00 to
  clear it. Four more levels are locked at the start: a cemetery at midnight, a
  goth club, a coffee shop and her apartment. Left and right arrows choose a
  level, and Enter starts it.
