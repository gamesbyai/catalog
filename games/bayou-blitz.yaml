slug: bayou-blitz
title: Bayou Blitz
tagline: Collect crawfish through the bayou while dodging hungry gators.
description: >-
  Bayou Blitz sends you through a swampy Louisiana bayou to gather crawfish,
  with hungry gators along the route. A run comes down to three things: picking
  a safe path through the wetland, grabbing as much food as you can and keeping
  clear of the predators.


  The creator describes themselves as a returning Vibe Jam participant who
  enjoys the competition. Their 2026 entry was built with Cursor, renders its 3D
  scenes with Three.js, plays on phones as well as in a browser and finished
  147th of 945 entries.


  The goal is easy to read at a glance: more crawfish, no gator contact. The
  Louisiana flavor gives the 3D action-adventure a clear identity, and online
  multiplayer means the bayou does not have to be a solo trip.
