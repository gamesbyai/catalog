slug: bayou-blitz
title: Bayou Blitz
tagline: Collect crawfish through the bayou while dodging hungry gators.
description: >-
  Alternate A and D when the struggle prompt appears. It shows up once a clingy
  someone latches onto you, and a bar fills as you mash the two keys to shake
  them off.


  A swirl of hearts circles your character while it's happening, which is a
  pretty sweet way to be held up.


  Along the top there's a meter that runs from a broken heart on the left to a
  full heart on the right. A loneliness reading sits under it, so you can see
  where you stand. Right below that, a clingy marker tells you when someone has
  hold of you.


  There's also a dash button sitting in the bottom corner of the screen.


  Next to it is a power-up slot that starts empty, and its hint says you fill it
  by walking over a glowing pad.


  You move around a purple 3D room seen from above, with crates, a bench, and
  two conveyor belts, one with yellow arrows pointing up and one pointing down.
  Purple rings are drawn on the floor.


  The game is split into five levels, and each one has its own countdown. You
  also get a running score and a total time, so you can track your whole run as
  well as the current level.
