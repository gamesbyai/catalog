slug: bayou-blitz
title: Bayou Blitz
tagline: Collect crawfish through the bayou while dodging hungry gators.
description: >-
  Move with WASD or the arrow keys through a mall while a pursuer who likes you
  far too much chases you around it. Your real job isn't escaping her, though,
  because you have to keep a Loneliness meter somewhere between 20 and 80.


  Running away makes you lonely, while getting caught makes her cling, so the
  whole chase becomes a strange balancing act of staying just close enough.


  Shift sends you into a dash with invincibility frames. Space fires off a
  power-up, which you pick up by walking over one of the glowing pads scattered
  around the floor. The HUD up top packs in plenty, tracking your Loneliness
  value, a Clingy count, a countdown timer and a running score.


  If she does grab you, a STRUGGLE prompt pops up in a burst of pink hearts, and
  you alternate A and D to wriggle free.


  The first level is a mall with an alt-fashion store, laid out with store
  islands and one-way escalators marked by big yellow arrows. Oddly enough, the
  ordinary mall-walkers count as a hazard too, since they get in your way and
  slow you down, and you clear the level by surviving for 2:00.


  Four more levels start out locked. They're a cemetery at midnight, a goth
  club, a coffee shop and, a little ominously, her apartment. You pick a level
  with the left and right arrows and press Enter to start it.
