slug: bayou-blitz
title: Bayou Blitz
tagline: Collect crawfish through the bayou while dodging hungry gators.
description: >-
  Keep a Loneliness meter between 20 and 80 while a pursuer who is very attached
  to you chases you around a mall. Escaping her isn't really the goal. Running
  away makes you lonely, while getting caught makes her cling, so the chase is a
  balance of staying close enough to her.


  Invincibility during a dash. Two minutes of survival to clear the mall. A
  first level with an alt-fashion store, store islands and one-way escalators.
  Ordinary mall-walkers as a hazard, since they get in your way and slow you
  down. Four more levels, locked at the start, including a cemetery at midnight,
  a goth club, a coffee shop and her apartment.


  Move with WASD or the arrow keys. Press Shift to dash. Walk over a pad on the
  floor to pick up a power-up, then press Space to fire it. If she catches you,
  a struggle prompt appears. Alternate A and D to wriggle free. Choose a level
  with the left and right arrows, then press Enter to start it.
