slug: simdrive
title: SimDrive
tagline: Race friends in a shared car game, steering with your phone as the controller.
description: >-
  SimDrive is a multiplayer racing game where each player's phone becomes the
  controller. Players tilt and move their phones to steer a car, and the device
  gives back haptic and sound feedback as they drive. The cars use reasonably
  realistic physics, so races reward smooth handling more than button mashing.


  The idea comes from couch and party games such as Jackbox and Gaming Couch,
  where a group gathers around one screen and plays together. SimDrive applies
  that format to racing, inspired by the creator's love of Mario Kart and the
  unused motion controls of the PS3 controller. It suits a group in one room,
  with the shared screen showing the race.


  The creator describes it as a first game and says it was made with Codex,
  using plenty of tokens along the way. It runs in the browser with Three.js. It
  can technically run on mobile, but in practice it needs two phones, one to
  display and one to control.
