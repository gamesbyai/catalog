slug: simdrive
title: SimDrive
tagline: Race friends in a shared car game, steering with your phone as the controller.
description: >-
  In SimDrive your phone is the steering wheel. Each player tilts and moves
  their phone to drive a car on a shared screen, and the phone answers with
  haptic and sound feedback as you race.


  The format comes from couch party games like Jackbox and Gaming Couch, where a
  group gathers around one screen. The creator applied it to racing out of a
  love of Mario Kart and the PS3 controller's unused motion controls. The
  physics are reasonably realistic, so smooth handling beats button mashing.


  It suits a group in one room. It can technically run on mobile, but in
  practice that takes two phones: one to display the race and one to steer. The
  creator calls it a first game, made with Codex and plenty of tokens.
