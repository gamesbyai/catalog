slug: simdrive
title: SimDrive
tagline: Race friends in a shared car game, steering with your phone as the controller.
description: >-
  Your phone is the steering wheel. Open the game on a TV or computer, create a
  room, then scan the QR code with a phone. Tilt the phone to steer and touch
  the on-screen Brake and Throttle buttons. The phone gives feedback through
  sound and haptics: engine roar, tire slip, curb rumble and rain grip.


  The game can run solo, in 4-way split-screen, in two 4-way split screens, or
  with everyone on their own screen by joining with a room code. Race options
  include the number of laps, the track, rain and ghost cars.


  The car physics include dynamic traction, downforce and rain effects. The
  creator drew on party games like Jackbox and Gaming Couch, plus Mario Kart,
  and wanted to use a phone's motion sensors the way the PS3 controller was
  meant to.


  Each player needs their own phone as a controller, so playing on a single
  phone means using two devices.
