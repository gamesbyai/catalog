slug: simdrive
title: SimDrive
tagline: Race friends in a shared car game, steering with your phone as the controller.
description: >-
  Your phone is the steering wheel in this multiplayer racing game.


  Solo play, a 4-way split screen, or two 4-way split screens. Everyone on their
  own screen, joined with a room code. Race options for lap count, track, rain
  and ghost cars. Car physics with dynamic traction, downforce and rain effects.
  Phone sound and haptics for engine roar, tire slip, curb rumble and rain grip.


  Open the game on a TV or computer, then create a room. Scan the QR code with
  each phone to join. Tilt the phone to steer. Touch the Brake and Throttle
  buttons on the phone's screen to slow down and speed up. Each player needs
  their own phone as a controller.


  1000xcat drew on party games like Jackbox and Gaming Couch, plus Mario Kart,
  and wanted a phone's motion sensors used in the manner the PS3 controller was
  intended. The creator writes, "it's my first game."
