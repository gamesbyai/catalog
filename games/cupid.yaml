slug: cupid
title: Cupid
tagline: Shoot magic arrows to pair people with matching traits and restore love
  in a garden.
description: >-
  You play Cupid and shoot magic arrows at people walking around a garden,
  pairing up the ones who share a trait. Who you pair matters as much as where
  your arrow lands, turning the shooter into a light puzzle.


  Hair, T-shirt and pants as three traits per person. Venus as your guide,
  walking you through it at the start and noting that two people in the same
  shirt color match. In the first stage, you have to save ten people. Stages
  that get more chaotic than the one before. Runs last as long as you keep
  restoring love. Arrow upgrades between stages, with each run building its own
  mix of magical abilities. Experience points for leveling up.


  DWowmuch wanted to make a simple roguelike first-person shooter with
  multiplayer, built around matchmaking. According to DWowmuch, the project was
  also a way to explore vibe coding in a playful way.
