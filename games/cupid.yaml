slug: cupid
title: Cupid
tagline: Shoot magic arrows to pair people with matching traits and restore love
  in a garden.
description: >-
  Cupid Garden is a roguelike first-person shooter built around matchmaking. You
  play Cupid, aiming magical arrows at people in the garden to pair those who
  share matching traits. Each stage grows more chaotic, and a run continues as
  long as Cupid can keep restoring love.


  The matchmaking twist turns the shooting into a light puzzle: choosing who to
  pair matters as much as hitting the target. Between stages you upgrade your
  arrows, so each run builds toward a different set of magical abilities.
  Multiplayer is part of the design.


  The creator built it with Codex for the Vibe Jam 2026 and describes wanting a
  simple roguelike FPS with multiplayer. They also say the project was a chance
  to explore vibe coding in a playful way. It runs on Three.js.
