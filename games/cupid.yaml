slug: cupid
title: Cupid
tagline: Shoot magic arrows to pair people with matching traits and restore love
  in a garden.
description: >-
  In Cupid Garden you play Cupid, firing magic arrows at people wandering a
  blocky garden to pair up the ones who share a matching trait.


  Everyone you meet has three traits (hair, T-shirt and pants), and the goddess
  Venus walks you through it at the start, pointing out that two people in the
  same shirt color count as a match.


  Picking who to pair matters as much as landing the shot, turning a
  first-person shooter into a light puzzle.


  A run keeps going for as long as Cupid can keep restoring love, while each
  stage gets more chaotic than the last. The first one gives you ten people to
  save, with a counter at the top of the screen tracking them. There's also an
  XP bar along the bottom that levels you up.


  Between stages you upgrade your arrows, so each run builds toward its own mix
  of magical abilities, and the hotbar's five arrow slots start out with only
  the first one filled, leaving a whole row to grow into.


  The look is cheerful and chunky, with voxel trees scattered across rolling
  green fields and pixel-faced people standing around in red shirts. A round
  zoomed-in window in the corner shows whoever's under your crosshair, helping
  you compare pants colors from across a meadow. Your guide is a
  flower-crowned anime Venus, polished next to all those blocky passersby.


  DWowmuch wanted to make a simple roguelike FPS with multiplayer, with
  matchmaking as its core mechanic, and says the project was also a chance to
  explore vibe coding in a playful way.
