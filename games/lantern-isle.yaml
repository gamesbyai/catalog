slug: lantern-isle
title: Lantern Isle
tagline: Help island residents earn back crystal shards and restore shrines in a
  cozy adventure.
description: >-
  Lantern Isle is a cozy 3D adventure across six islands, each home to charming
  characters who need a hand. You explore, help the residents and earn back the
  crystal shards that belong to them, and every shard brings a shrine closer to
  being restored. Kindness is how you move forward, one resident at a time.


  The gentle, friendly tone comes from the creator's fondness for Animal
  Crossing and Poptropica, which they played growing up. It is a single-player
  Three.js game from Vibe Jam 2026, where it ranked 585th of 945, and it runs on
  phones too.


  A story runs underneath the errands. As the shrines come back to life, you
  piece together a bittersweet mystery about why the Guardian Star went dark, so
  every favor you do feeds the story.
