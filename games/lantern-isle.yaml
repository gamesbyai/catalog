slug: lantern-isle
title: Lantern Isle
tagline: Help island residents earn back crystal shards and restore shrines in a
  cozy adventure.
description: >-
  Walk up to the characters with speech bubbles over their heads, because
  they're the ones who tell you what's wrong. On the forest island Sprite is
  looking for glowing crystal shards, and Elder Moss says that reuniting a lost
  firefly with its friends makes a shard appear. Then you pick it up.


  Every shard you find goes back to the shrine in the middle of the island. A
  counter in the top corner starts at zero out of five, so you can see how far
  along you are.


  That's only the first island, though, and there are more waiting after it.


  There are six in total, each with its own residents who need a hand, and
  helping them is how you earn the crystal shards back and restore the ancient
  shrines. Kindness is what moves things forward here, which is a nice change
  from fighting your way through.


  Behind all that sits a bittersweet mystery about why the Guardian Star went
  dark.


  The islands are small isometric patches of tiles and trees floating under a
  soft purple sky, and a Map button at the top helps you keep your bearings. The
  start screen also offers an Explore mode next to the main adventure, and the
  creator built the whole thing out of nostalgia for Animal Crossing and
  Poptropica.
