slug: lantern-isle
title: Lantern Isle
tagline: Help island residents earn back crystal shards and restore shrines in a
  cozy adventure.
description: >-
  Walk a small character around an isometric island and talk to the residents.
  Speech bubbles float over characters who have something to say, and their
  lines appear in a text box along the bottom of the screen, headed by the
  speaker's name.


  On the first island, Elder Moss explains the task: reunite a lost firefly with
  its friend, and a crystal shard appears. Pick it up and bring all shards to
  the shrine in the center. Sprite, another resident, adds that glowing shards
  are scattered through the forest.


  A shard counter at the top left starts at 0 / 5, and a Map button sits at the
  top center. The full game spans six islands. Each character you help earns
  back a crystal shard, and restoring the ancient shrines gradually reveals why
  the Guardian Star went dark.


  The title screen offers Begin Adventure and a separate Explore Mode. Islands
  float against a soft purple sky, with small trees, glowing orbs and a sound
  toggle in the top right corner. The creator drew on childhood memories of
  Animal Crossing and Poptropica.
