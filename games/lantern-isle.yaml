slug: lantern-isle
title: Lantern Isle
tagline: Help island residents earn back crystal shards and restore shrines in a
  cozy adventure.
description: >-
  Walk your character around an island and meet whoever lives there.


  Six islands, each home to its own characters. Crystal shards, one for each
  character you help. Ancient shrines to restore as the shards come back.
  Dialogue labeled with each speaker's name. The slowly pieced-together mystery
  of why the Guardian Star went dark. A choice between Begin Adventure and a
  separate Explore Mode.


  Talk to anyone marked with a speech bubble. On the first island, Elder Moss
  asks you to return a lost firefly to its friend. Pick up the crystal shard
  that appears. Carry every shard you collect to the shrine. Look through the
  forest for more glowing shards. Sprite mentions that they are scattered there.


  kristytaing drew on childhood memories of playing Animal Crossing and
  Poptropica when making it.
