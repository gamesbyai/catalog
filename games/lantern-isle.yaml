slug: lantern-isle
title: Lantern Isle
tagline: Help island residents earn back crystal shards and restore shrines in a
  cozy adventure.
description: >-
  Walk your character around an island and talk to whoever lives there. Anyone
  with something to say is marked with a speech bubble. Their lines come up as
  dialogue, labeled with the speaker's name.


  On the first island, Elder Moss asks you to reunite a lost firefly with its
  friend, and a crystal shard appears. You pick it up and carry every shard to
  the shrine, while a resident called Sprite mentions that more glowing shards
  are scattered through the forest.


  The game spans six islands. Each character you help earns back a crystal
  shard. As you restore the ancient shrines, the story slowly pieces together
  why the Guardian Star went dark.


  You can pick Begin Adventure or head off into a separate Explore Mode instead.


  kristytaing drew on childhood memories of playing Animal Crossing and
  Poptropica when making it.
