slug: lantern-isle
title: Lantern Isle
tagline: Help island residents earn back crystal shards and restore shrines in a
  cozy adventure.
description: >-
  Lantern Isle is a cozy 3D adventure spread across six islands, each home to
  charming characters who need a hand. Players explore, help the residents, and
  earn back the crystal shards that belong to them. Kindness is the way forward,
  and each shard brings a shrine closer to being restored.


  The story runs underneath the errands. As the shrines come back to life, the
  player pieces together a bittersweet mystery about why the Guardian Star went
  dark. The gentle, friendly tone draws on the creator's fondness for Animal
  Crossing and Poptropica, which they played while growing up.


  The game was submitted to Vibe Jam 2026 and runs in the browser with Three.js.
  It is playable on mobile as well as desktop, and it is a single-player
  experience.
