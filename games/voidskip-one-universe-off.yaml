title: "Voidskip: One Universe Off"
tagline: Pilot a spaceship through shifting universes to find the one you came from
description: >-
  Jumping from one universe to the next, the spaceship you fly searches for the
  universe it originally came from.


  New settings with every jump. Each run, a chain of encounters. Arcade-style
  ship combat. A mix of action, adventure and shooting.


  andresmujica drew on retro games in general, with Star Fox as a particular
  influence.
