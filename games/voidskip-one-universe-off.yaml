slug: voidskip-one-universe-off
title: "Voidskip: One Universe Off"
tagline: Pilot a spaceship through shifting universes to find the one you came from
description: >-
  Voidskip: One Universe Off is a retro-styled space shooter. You fly a ship
  that jumps from one universe to the next, searching for the universe it
  originally came from. Each jump drops you into a new setting, so a run is a
  chain of encounters with the goal of finding home.


  The game mixes action, adventure, and shooting, and its creator drew on retro
  games in general, with Star Fox as a particular influence. The premise of
  hopping between universes gives the journey a clear structure, and the
  ship-based combat follows the arcade tradition that inspired it.


  It was made as an entry in Vibe Jam 2026 and runs in the browser on Three.js.
  The creator used ChatGPT while building it. The game is single-player.
