slug: tradewind
title: Tradewind
tagline: Lift a small plane off an island runway and fly through rings against
  the clock.
description: >-
  Tradewind has you taking a white and orange TW-1 off runway 27 against a
  countdown that's already running, which puts even the takeoff roll on the
  clock. Push the throttle up with W and watch your speed build down the
  centerline. When you reach 55 knots, pull back and the plane lifts off.


  In Ring Run, each ring you thread bumps up both your score and your ring total
  until time's up.


  With the clock running, it makes sense that the pink marker on the horizon
  shows the next ring and how far away it is. A round map in a corner traces the
  coastline and points out your next objective.


  For a game built around hoops in the sky, the cockpit-style display goes
  surprisingly deep. You get how fast you're going, how high you are, how
  quickly you're climbing or sinking, the throttle, the flap setting, a g-force
  readout and an artificial horizon. A compass strip also marks your target.


  It's a stylized island with rolling hills and scattered trees, yet its little
  airfield comes with a hangar and a control tower.


  From a third-person chase camera, you can grab screenshots with the on-screen
  camera button while you fly. You can pause whenever you like.
