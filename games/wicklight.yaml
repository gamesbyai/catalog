slug: wicklight
title: Wicklight
tagline: Steer a flame through a dark room where pillar shadows shelter the
  shades hunting you.
description: >-
  You're a flame. The shades hunting you die in your light but are safe in the
  shadows your pillars cast.


  Wedges of darkness behind every pillar that shift as you move. Light that
  burns down, refueled by wax scattered in the dark. A charged flare that
  ignites every shade it can see. Scored runs of a few minutes.


  Keep moving with the mouse, because standing still stops your shadows from
  sweeping. Hold the left button to charge and release to flare.


  The creator describes it as one rule with everything else following from it.
  The audio is synthesized live.
