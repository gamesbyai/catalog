slug: quickdraw
title: Quickdraw
tagline: Face an opponent in a western duel and fire before they do.
description: >-
  Quickdraw is a western duel built around a single split-second reaction test.
  Two gunslingers stand facing each other, and the player has to fire before the
  opponent does. Each round comes down to timing, so a run is a string of short,
  tense showdowns.


  The appeal is the speed and simplicity of the setup. Each duel is just the
  wait and the moment to react, which makes it quick to replay. It also supports
  multiplayer, so the reaction contest can be played against another person.


  It was entered in Vibe Jam 2026 and drawn on the canvas. The creator built it
  with Cursor and said they wanted to see how far AI tools could help them make
  something fun and engaging.
