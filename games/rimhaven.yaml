slug: rimhaven
title: Rimhaven
tagline: Team up with other players to mine, craft and fight through dungeon bosses.
description: >-
  Rimhaven is a multiplayer dungeon crawler in the style of an online
  role-playing game. Players form a party, gather ore, craft gear and head down
  through dungeons, facing bosses that grow tougher with each level. A run
  combines resource gathering with group combat and a steady push deeper.


  The design draws on the creator's affection for classic World of Warcraft, and
  it shows in the party structure, crafting loop and boss-focused progression.
  Boss kills carry a chance of dropping cryptocurrency, which ties a real-world
  reward mechanic into the loot system and may matter to some players.


  The creator built it with Claude Code, using Babylon.js for the 3D rendering.
  It was entered in the Vibe Jam 2026 event, where it placed 369th out of 945
  entries.
