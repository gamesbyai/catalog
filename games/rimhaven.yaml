slug: rimhaven
title: Rimhaven
tagline: Team up with other players to mine, craft and fight through dungeon bosses.
description: >-
  Rimhaven is a multiplayer dungeon crawler in the style of an online
  role-playing game. You form a party with other players online, mine ore, craft
  gear, and head down through dungeons where the bosses get tougher with every
  level. A run is part resource gathering, part group combat, and a steady push
  deeper.


  The creator's affection for classic World of Warcraft shows in the party
  structure, the crafting loop, and the progression built around boss fights.
  They made it with Claude Code, with Babylon.js doing the 3D rendering, and it
  came 369th of 945 in Vibe Jam 2026.


  Boss kills also carry a chance of dropping cryptocurrency, which ties a
  real-world reward mechanic into the loot system, a detail that may matter to
  some players.
