slug: sounds-smashing
title: Sounds Smashing!
tagline: Smash blocks in time with the beat to build melodies and earn coins.
description: >-
  You smash blocks in time with the music in Sounds Smashing!, and each hit adds
  a note to the melody you're building. It's physics based, so wrecking things
  is how you play the tune.


  The better your timing on each smash, the more coins you earn for it.


  There's also an online mode for up to 4 players, where you create a room and
  send friends the link. You pick whether the winner is whoever racks up the
  most smashes or the most coins. Then you choose an arena, like Gauntlet, Ten
  Tall Towers, Giraffe Jamboree or Iron Giants, which are pretty funny names for
  places to wreck.


  Before a multiplayer match starts, you also pick which gloves you're wearing.


  The choices are Dual Spring, Dual Rocket, Spring + Rocket and Bare Fists.
  Rhythm Assist and Aim Assist can each be turned on or off.


  The rhythm one is the same for everyone in the room, so nobody gets a timing
  edge over the others, while aim assist only affects you. The music is
  microtonal, and the creator says the game came together over two days of
  constant vibing.
