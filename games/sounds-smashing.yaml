slug: sounds-smashing
title: Sounds Smashing!
tagline: Smash blocks in time with the beat to build melodies and earn coins.
description: >-
  Sounds Smashing! has you break blocks in time with the music. Each smash adds
  a note to the melody, and the closer your hit lands to the beat, the more
  coins you earn. The blocks are voxel-style structures in an isometric
  pixel-art setting, and the music uses microtonal tuning.


  A multiplayer mode supports up to 4 players. One player creates a room and
  shares the link, and the others join. The host picks a goal, either most
  smashes or most coins, and one of seven arenas: Gauntlet, Grand Finale, Ten
  Tall Towers, Towering Ascent, Sandstone Kingdom, Giraffe Jamboree or Iron
  Giants.


  Before a match you choose a glove setup: Dual Spring, Dual Rocket, Spring +
  Rocket or Bare Fists. Rhythm Assist and Aim Assist can each be switched on or
  off. Rhythm Assist applies to everyone in the room, while Aim Assist applies
  only to you. Solo play is organized into numbered worlds.


  The creator built it over two days of nonstop work, drawing inspiration from
  Donkey Kong Bonanza, Minecraft and a love of rhythm games.
