slug: sounds-smashing
title: Sounds Smashing!
tagline: Smash blocks in time with the beat to build melodies and earn coins.
description: >-
  Sounds Smashing! lets you break blocks in time with the music, and every smash
  adds another note to the melody you're building.


  Physics-driven structures as your targets. Coin rewards tied to how close each
  hit lands to the beat. Numbered solo worlds. Online rooms for up to four
  players. Host-set win condition, either most smashes or most coins. Seven
  host-picked arenas, namely Gauntlet, Grand Finale, Ten Tall Towers, Towering
  Ascent, Sandstone Kingdom, Giraffe Jamboree and Iron Giants.


  Create a room and share the link. Everyone else joins through the link. Before
  a match, pick one of four gloves: Dual Spring, Dual Rocket, Spring + Rocket or
  Bare Fists. Turn Rhythm Assist and Aim Assist on or off separately. Rhythm
  help is set for the whole room. Aim help only affects your own game.


  ocorich built the whole game over two days of nonstop work. Donkey Kong
  Bonanza and Minecraft inspired it. Rhythm Heaven and microtonal music fed into
  it too.
