slug: sounds-smashing
title: Sounds Smashing!
tagline: Smash blocks in time with the beat to build melodies and earn coins.
description: >-
  Sounds Smashing! is a single-player, physics-based rhythm game in which you
  break blocks in time with the music. Every smash adds a note, so a successful
  run gradually builds a melody out of the destruction, one broken block at a
  time.


  The mix of physical block-breaking and rhythm play draws on Donkey Kong-style
  bonanza energy and Minecraft-like blocks. It took the creator about two days
  to make with Claude Code and Three.js, and it landed 379th of 945 in Vibe Jam
  2026.


  Timing decides the payout: the closer a hit lands to the beat, the more coins
  you collect. The soundtrack leans on microtonal tuning, which gives the
  smashed melodies a sound that differs from standard scales, and the whole
  thing is meant to feel like a constant groove.
