slug: sounds-smashing
title: Sounds Smashing!
tagline: Smash blocks in time with the beat to build melodies and earn coins.
description: >-
  Sounds Smashing! has you breaking blocks in time with the music, and every
  smash adds another note to the melody. The things you're wrecking are
  physics-driven, voxel-style structures set in an isometric pixel-art world.


  The closer your hit lands to the beat, the more coins you earn.


  Solo play is split into numbered worlds, but there's also a whole online mode
  for up to four players. One person creates a room and shares the link, and
  everyone else joins through it. The host then decides whether the win goes to
  the most smashes or the most coins.


  The host also picks the arena from seven options (Gauntlet, Grand Finale, Ten
  Tall Towers, Towering Ascent, Sandstone Kingdom, Giraffe Jamboree and Iron
  Giants), and it's hard not to wonder what a jamboree of giraffes looks like
  mid-smash.


  Before a match you pick your gloves from Dual Spring, Dual Rocket, Spring +
  Rocket or Bare Fists. Rhythm Assist and Aim Assist each switch on or off, but
  rhythm help is set for the whole room while aim help only touches your own
  game, a clever split when friends play together.


  ocorich built it over two days of nonstop work, drawing inspiration from
  Donkey Kong Bonanza and Minecraft. Rhythm Heaven and microtonal music fed into
  it as well.
