slug: the-ship-remembers
title: The Ship Remembers
tagline: Run a ship's crew, fight fires and breaches, and pick risky routes on a
  galaxy map.
description: >-
  You steer a crew member around the inside of a small pixel-art ship from a
  top-down view. Walk up to a system and press E to use it. The ship has a
  reactor, shields, weapons, engines, a med device, a processor and a research
  station, and you route power between them as things go wrong.


  Trouble arrives in real time. Hull breaches open, fires spread, oxygen drains
  and systems take damage, so you run to the problem and make emergency repairs.
  In combat, Space fires the weapon. Tab opens the inventory, and Esc pauses.


  Between fights you pick routes on a galaxy map. Stops include events, shops,
  wrecks, ambushes and a boss path. Along the way you collect Scrap, Metal,
  Patch Kits and Accord Research Data, process salvage, and spend resources on
  ship upgrades.


  The story is set after the High Sovereign's death, with your crew holding an
  old Lane Warrant to keep dying routes open. Old signals come back through
  static as rescue, debt, betrayal or home. The creator states that code,
  graphics, sounds and text were AI assisted.
