slug: the-ship-remembers
title: The Ship Remembers
tagline: Run a ship's crew, fight fires and breaches, and pick risky routes on a
  galaxy map.
description: >-
  Playing alone, you take direct control of a crew member inside a small ship.
  Trouble arrives in real time, and you route power between systems as things go
  wrong. After the High Sovereign's death, your crew carries an old Lane Warrant
  they use to keep dying routes open.


  Reactor, shields, weapons, engines, a med device, a processor and a research
  station. Hull breaches, spreading fires, draining oxygen and damaged systems.
  Galaxy map routes chosen between fights, with stops for events, wrecks, shops,
  ambush fights and a boss path. Salvage to process, plus Scrap, Metal, Patch
  Kits and Accord Research Data collected along the way. Ship upgrades to spend
  resources on. Old signals through static, offering home, debt, betrayal or
  rescue.


  Move with WASD or the arrow keys. Stand next to a system and tap E to operate
  it. In combat, press Space to fire. Press Tab for the inventory. Head to
  trouble spots and carry out emergency repairs.


  According to Divine950, AI assisted with the code, art, sounds and writing.
