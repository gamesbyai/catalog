slug: the-lighter-path
title: The Lighter Path
tagline: Descend through Hell as Dante, hopping portals between minigames as
  karma sways your fate.
description: >-
  The Lighter Path has you play Dante, who wakes with only a lantern and walks
  down through Hell. Portals pull you out of the descent into entirely different
  games, and between those detours you keep walking. The game calls itself an
  unhinged inferno arcade with four worlds, a single soul, and no rules.


  Archero-style roguelite. Survival shooter full of dinosaurs. Heaven Taxi stage
  modeled on Flappy Bird. Smaller minigames layered on top of those portal
  games. Lines of narration along the way. Endings of damnation or salvation,
  decided by karma.


  Play with WASD, the mouse, E, Shift and F. Press Tab to open a list of
  commands and tips. Touch screens work, but the game recommends sitting down at
  a desktop computer for it.


  Mrkavica says the game pulls together many of their ideas. They say they're no
  engineer, and that the game couldn't have been built without vibe coding.
