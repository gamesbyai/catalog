slug: the-lighter-path
title: The Lighter Path
tagline: Descend through Hell as Dante, hopping portals between minigames as
  karma sways your fate.
description: >-
  The Lighter Path casts you as Dante on a descent through Hell, and the way
  down runs through other games. Portals drop you into an Archero-style
  roguelite, a dinosaur survival shooter, a Flappy Bird-style Heaven Taxi, and a
  swarm of smaller minigames.


  The creator describes it as a collection of their many ideas, which they say
  they could not have made without vibe coding, since they are not an engineer.
  It was their Vibe Jam 2026 entry, built with Claude Code on Three.js, and it
  placed 271st of 945.


  Every stop changes the rules, so one trip mixes action, platforming, puzzles,
  and racing. Your karma is tracked the whole way down, and it decides whether
  the run ends in damnation or salvation, so what you do in each game counts.
