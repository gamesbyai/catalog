slug: the-lighter-path
title: The Lighter Path
tagline: Descend through Hell as Dante, hopping portals between minigames as
  karma sways your fate.
description: >-
  The Lighter Path has you playing Dante, walking down through Hell with a
  lantern and hopping between portals that drop you into completely different
  games. One portal leads to an Archero-style roguelite, another to a dino
  survival shooter, and another to a Flappy Bird-style Heaven Taxi.


  Between those, you get a swarm of smaller minigames, so the genre keeps
  changing on you. That's a pretty wild range for one browser game, and the
  red-lit title screen even calls itself an unhinged inferno arcade.


  Your karma is what ties all of those detours together into one trip.


  A karma counter sits at the top of the screen, and it decides whether you end
  in damnation or salvation. The story opens with you waking in a dark place
  with only your lantern and your questions, while a light flickers somewhere
  ahead.


  If a level isn't working for you, a button at the bottom of the screen skips
  it, with a cheeky line teasing you for using it.


  You can press Tab at any time to see commands and tips. The title screen lists
  WASD and the mouse among its keys, and it says mobile works too.
