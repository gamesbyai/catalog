slug: the-lighter-path
title: The Lighter Path
tagline: Descend through Hell as Dante, hopping portals between minigames as
  karma sways your fate.
description: >-
  You play Dante, who wakes in a dark place with only a lantern and walks down
  through Hell. Portals along the way send you into separate games: a roguelite
  in the style of Archero, a survival shooter with dinosaurs, a Heaven Taxi
  stage modeled on Flappy Bird, and a swarm of smaller minigames.


  A karma counter sits at the top of the screen. Karma decides whether Dante
  ends in damnation or salvation. The title screen bills the game as an inferno
  arcade with four worlds and a single soul.


  The title screen lists WASD, the mouse, E, Shift and F as the inputs. Pressing
  Tab opens a list of commands and tips, and a Begin button starts the descent.
  Touch devices are supported, though the title screen recommends a desktop
  computer.


  The creator, who is not an engineer, says the game gathers many of their ideas
  and could not have been built without vibe coding.
