slug: the-lighter-path
title: The Lighter Path
tagline: Descend through Hell as Dante, hopping portals between minigames as
  karma sways your fate.
description: >-
  The Lighter Path casts you as Dante, who wakes with only a lantern and then
  walks down through Hell. Along the way, portals pull you out of the descent
  and drop you into entirely different games. One is an Archero-style roguelite,
  another is a survival shooter full of dinosaurs, there's a Heaven Taxi stage
  modeled on Flappy Bird, and a crowd of smaller minigames sits on top of those.


  Between those detours you keep walking the descent, and you get lines of
  narration along the way. The opening stretch also has a skip button. Karma
  decides whether Dante ends up damned or saved.


  It bills itself as an unhinged inferno arcade with four worlds, one soul and
  zero rules. Controls use WASD, the mouse, E, Shift and F. Tab opens a list of
  commands and tips.


  Touch screens work, but it recommends sitting down at a desktop computer for
  it.


  Mrkavica says the game pulls together many of their ideas. They say they're no
  engineer, and that the game couldn't have been built without vibe coding.
