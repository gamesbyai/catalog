slug: the-lighter-path
title: The Lighter Path
tagline: Descend through Hell as Dante, hopping portals between minigames as
  karma sways your fate.
description: >-
  The Lighter Path casts you as Dante on a descent through Hell. Along the way
  you step through portals that drop you into different games: an Archero-style
  roguelite, a dinosaur survival shooter, a Flappy Bird-style Heaven Taxi, and a
  swarm of smaller minigames.


  Every stop changes the rules, so the journey blends action, platforming,
  puzzles, and racing into one strange trip. Your karma is tracked throughout,
  and it determines whether the run ends in damnation or salvation. The
  genre-hopping structure is the main draw.


  The creator built it with Claude Code for Vibe Jam 2026 using Three.js. They
  describe it as a collection of their many ideas, which they could not have
  made without vibe coding since they are not an engineer. It also runs on
  mobile.
