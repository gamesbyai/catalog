slug: soul-captcha
title: Soul Captcha
tagline: Solve tricky puzzles while an AI heckles you and tries to make you laugh.
description: >-
  Soul Captcha is a puzzle game built around a captcha-style challenge. You work
  through a series of puzzles while an AI voice comments on your attempts,
  teasing you as you go. The setup is a contest of wits with a talkative
  opponent that sits alongside every challenge.


  The hook is the tone. The AI mocks the player throughout, and the game frames
  the whole thing as a question: can a machine actually make a person laugh? The
  puzzles borrow their spirit from The Impossible Game, which the creator names
  as the inspiration for the idea.


  The creator built it with Claude Code and entered it in Vibe Jam 2026. They
  say they have been developing AI games for about half a year. It is a
  single-player experience.
