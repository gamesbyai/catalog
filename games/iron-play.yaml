slug: iron-play
title: Iron-play
tagline: Intercept incoming missiles and keep the skies safe above your country.
description: >-
  Iron-play is a missile-defense shooter inspired by Israel's Iron Dome.
  Missiles head toward the country from above, and the player's job is to
  intercept them before they land. It runs on mobile as well as in a browser, so
  a session can be picked up quickly on a phone.


  The game grew out of a personal purpose. The creator wanted to help children
  and families in Israel cope with the stress of sirens and war, and the idea is
  to give people a sense of control and resilience while they wait in a safe
  room. That goal shapes the game as a calming, interactive alternative to
  helplessness.


  It was entered in Vibe Jam 2026, where it placed 110th out of 945 entries. The
  creator's description places it across action, shooter, and simulation, with
  the defense scenario at the center of play.
