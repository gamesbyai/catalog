slug: captain-curveball-s-cruise
title: Captain Curveball's Cruise
tagline: Drive a speedboat around Maldivian islands, picking up tourists and
  dodging disasters.
description: >-
  One or two players take a speedboat between tropical islands in a timed
  excursion shift. The tagline frames it as a race against a rival.


  Tourist passengers to pick up and deliver safely for money. Ridiculous
  disasters that get in the way. Resorts and reefs among the islands. Highest
  earnings within the time limit as the goal.


  AdamMufassir426 is Maldivian and based the game on what excursion crews deal
  with. They also wanted cruising the islands and banking past resorts to be
  enjoyable apart from the earnings goal.
