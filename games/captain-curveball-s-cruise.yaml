slug: captain-curveball-s-cruise
title: Captain Curveball's Cruise
tagline: Drive a speedboat around Maldivian islands, picking up tourists and
  dodging disasters.
description: >-
  Captain Curveball's Cruise is a boat-driving game set in a playful version of
  the Maldives. One or two players race the clock to earn as much money as
  possible. A run means picking up tourists, steering past absurd disasters, and
  delivering passengers safely to their destinations.


  The game grew out of its creator's Maldivian background. It turns the
  beautiful, chaotic, unpredictable work of excursion crews into a lighthearted
  exaggeration built around speedboats, islands, resorts, and reefs. The score
  chase gives each run a goal, but the game is also meant to be enjoyable
  without it.


  Simply sailing around the islands and banking around resorts is part of the
  appeal. It runs on Three.js, supports both two-player sessions and mobile
  play, and was entered in Vibe Jam 2026.
