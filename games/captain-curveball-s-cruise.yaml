slug: captain-curveball-s-cruise
title: Captain Curveball's Cruise
tagline: Drive a speedboat around Maldivian islands, picking up tourists and
  dodging disasters.
description: >-
  Captain Curveball's Cruise hands you a speedboat in a playful version of the
  Maldives and a clock to race. You pick up tourists, steer past absurd
  disasters and deliver your passengers safely, earning as much money as you
  can, alone or with a second player.


  The game grew out of the creator's Maldivian background. It takes the
  beautiful, chaotic, unpredictable work of excursion crews and exaggerates it
  into something lighthearted, built around speedboats, islands, resorts and
  reefs. It was made with Claude Code on Three.js, plays on phones too, and came
  345th of 945 at Vibe Jam 2026.


  The score chase gives each run a goal, but the game is meant to be enjoyable
  without it too. Simply sailing around the islands and banking around the
  resorts is part of the appeal.
