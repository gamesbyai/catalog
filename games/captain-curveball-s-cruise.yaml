slug: captain-curveball-s-cruise
title: Captain Curveball's Cruise
tagline: Drive a speedboat around Maldivian islands, picking up tourists and
  dodging disasters.
description: >-
  The title screen shows a Maldives lagoon with a speedboat beside a wooden
  jetty and overwater huts. The menu offers Set Sail, How to Play, Leaderboards,
  Garage, Captain's Log and Settings.


  A run is a timed excursion shift. You drive a speedboat between islands, pick
  up tourists, and deliver them safely to earn money while disasters get in the
  way. The aim is the highest earnings before the clock runs out. One or two
  players can take part, and the tagline frames it as a race against a rival.


  The setting is a playful version of the Maldives, with islands, resorts, reefs
  and docks, plus a repair sign at one pier. The creator is Maldivian and based
  the game on what excursion crews deal with. They also wanted sailing around
  the islands and banking past resorts to be fun apart from the score chase.
