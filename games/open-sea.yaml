slug: open-sea
title: Open Sea
tagline: Sail a wooden ship between islands, dig up loot and sell chests for gold.
description: >-
  Open Sea lets you steer a wooden sailing ship through a sunny cluster of
  islands, with your tricorn-hatted captain in view from a third-person camera.
  You're weaving between jungle-draped cliffs, far-off peaks and tall sea stacks
  while the waves roll and sunlight sparkles off the turquoise sea. A compass
  strip across the top covers both your heading and how far off your next
  destination lies, which makes sense given that both are about where you're
  headed.


  Your voyage opens with one simple job, sailing to Crescent Isle, where you'll
  spot the X on your map. Treasure chests are where your fortune comes from, and
  selling them works toward a 3,000 gold target, which gives you a clear number
  to chase while you keep your health bar topped up along the way.


  You're meant to map the islands, dig up the gold and grow into a Pirate
  Legend.


  There's a surprising amount on the ship panel, which exists to show the state
  of your vessel, from sail setting and speed in knots to wind conditions, hull
  water and even the anchor's status. You work the sails yourself, with W and S
  raising and lowering them, while A and D steer, R drops the anchor, and F lets
  you step away from the helm. There's controller support too.


  Your hotbar carries things like a sword, a pistol and its ammo, a shovel you
  use to dig out loot and a bucket, which makes for a funny mix of weapons and
  chores.


  According to the creator, it's best played with headphones on.
