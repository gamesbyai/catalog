slug: pocketbots
title: PocketBots
tagline: Assemble a toy battle robot from scavenged parts and fight arena duels.
description: >-
  Pick or build a robot with Build-a-Bot from salvaged parts for short arena
  duels.


  Each bolted-on limb adding to your loadout. The built-in Base Unit, a readable
  sample with a scan pulse head, core torso and boost dash legs. Open Circuit
  Battles, for jumping into open matches. An upgrade for each fight won, carried
  into the next.


  Host a 1v1 and share the room code, or enter a friend's code. Use left mouse
  for the revolver, right for the repeater.


  circa90x set out to make a Western take on Medabots Dual and Girls Mission,
  one playable without a Japanese translator.
