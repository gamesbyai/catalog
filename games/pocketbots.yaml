slug: pocketbots
title: PocketBots
tagline: Assemble a toy battle robot from scavenged parts and fight arena duels.
description: >-
  PocketBots is a multiplayer arena fighter where you put together a small toy
  battle robot from scavenged parts. Each limb works as part of your loadout, so
  the build you choose shapes how you fight. Matches are quick duels in which
  you shoot and maneuver against an opponent.


  Every fight pays out something toward your next upgrade, which gives the loop
  a steady build, battle, improve rhythm. The scrappy toy-robot theme keeps the
  tone light, and swapping parts is the main way to change your playstyle
  between rounds.


  The creator says the idea came from wanting a western take on Medabots-style
  robot battle games, one that doesn't require reading Japanese to play. It was
  built with Three.js, and the creator used Codex. It was entered in Vibe Jam
  2026.
