slug: pocketbots
title: PocketBots
tagline: Assemble a toy battle robot from scavenged parts and fight arena duels.
description: >-
  Pick a unit in the hangar, or hit Build-A-Bot to put one together yourself.


  You build a toy battle robot out of scavenged parts, and every limb counts as
  part of your loadout. The default Base Unit shows how it works: a scan pulse
  in the head, a core in the torso, and a boost dash in the legs.


  The arms carry the weapons. Left click fires a revolver and right click fires
  a repeater, so each hand does its own job.


  Then you take the robot into scrappy arena duels, which are fast ones.


  Each fight earns you your next upgrade, which feeds back into what you build.
  The hangar also lists the unit's mass, height, detailing and optics, so you
  can see what you've put together before you deploy.


  For a human opponent there's a 1v1 link room. You host a match and share the
  room code, or type in someone else's code to join, and there's a separate
  button for open circuit battles.


  The creator wanted a western take on Medabots Dual and Girls Mission, one that
  doesn't need a Japanese translator to play.
