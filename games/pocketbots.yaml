slug: pocketbots
title: PocketBots
tagline: Assemble a toy battle robot from scavenged parts and fight arena duels.
description: >-
  Choose a unit in the hangar, or press Build-a-Bot to put together a new one
  from salvaged pieces. Then deploy it into short arena duels. Each limb adds to
  the loadout, and winning a fight earns an upgrade for the next.


  The built-in Base Unit shows how a loadout reads. Its head has a scan pulse,
  its torso is a core, and its legs give a boost dash. Left mouse fires a
  revolver and right mouse fires a repeater. The panel also lists core mass,
  height, detailing and optics.


  To play against others, host a 1v1 and share the room code, or enter a
  friend's code and join. An Open Circuit Battles button leads to open matches.
  A portal in the hangar exits to the jam hub. The creator wanted a Western
  counterpart to Medabots Dual and Girls Mission.
