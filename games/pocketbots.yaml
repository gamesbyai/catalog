slug: pocketbots
title: PocketBots
tagline: Assemble a toy battle robot from scavenged parts and fight arena duels.
description: >-
  Pick a robot in the hangar, or hit Build-a-Bot to put a new one together out
  of salvaged parts.


  Then you send it into short duels in an arena. Every limb you bolt on adds
  something to your loadout. Win a fight and you earn an upgrade to carry into
  the next one.


  The built-in Base Unit gives you a pretty clear picture of how a loadout
  reads. Its head carries a scan pulse, its torso holds a core and its legs give
  you a boost dash.


  Left mouse fires a revolver, while right mouse handles a repeater.


  Its stat panel lists core mass, height, detailing and optics, which is a
  surprisingly thorough spec sheet for a pocket-sized robot.


  If you'd rather fight people, you can host a 1v1 and pass the room code along,
  or type in a friend's code and join theirs. There's also an Open Circuit
  Battles button that takes you to open matches, plus a glowing exit portal in
  the hangar.


  circa90x set out to make a Western take on Medabots Dual and Girls Mission.
  They wanted one you could play without a Japanese translator.
