slug: chess3dastra
title: Chess3dastra
tagline: Play chess against a computer opponent on a 3D or 2D board.
description: >-
  Alone against a computer opponent set to Balanced, you play white. The
  computer looks two moves ahead.


  Full chess rules, including castling, en passant, promotion and draws. Check
  and checkmate spotted automatically. Three computer strengths, and a choice of
  moving first or second in the next game. Undo, with a move history and
  captures list. Saved games that survive a page reload. 3D board with a flat 2D
  view as an alternative, plus light and dark themes. Negamax search with
  alpha-beta pruning, run in a Web Worker so the page stays responsive while it
  thinks.


  Click a piece to move it. Type a move such as e4 or e2e4 and press Play. The
  computer answers after each of your moves.


  Jorge Balderas had it built in about 41 minutes from a handful of prompts. The
  first one asked for a 3D chess game to play against the computer.
