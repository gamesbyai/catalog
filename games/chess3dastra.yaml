slug: chess3dastra
title: Chess3dastra
tagline: Play chess against a computer opponent on a 3D or 2D board.
description: >-
  The game opens on a 3D chessboard with you playing white against a computer
  opponent set to Balanced, which looks two moves ahead. A side panel reads
  "Your move" and holds a strength menu, a color menu, New game and Undo
  buttons, a move entry box, and a move record that starts empty.


  Move by clicking pieces or by typing algebraic notation such as e4 or e2e4
  into the box and pressing Play. The rules are full chess: castling, en
  passant, promotion, and draws. Check and checkmate are detected, and the
  computer replies after each of your moves.


  You can pick one of three computer strengths, choose to play first or second
  in the next game, and undo moves. A 2D view built from a grid of squares with
  SVG pieces can replace the 3D board. Light and dark themes are available. A
  move history and captures list track the game, and the game is saved so it
  survives a reload.


  The opponent is a negamax search with alpha-beta pruning running in a Web
  Worker, so the page stays responsive while it thinks. The game was built in
  about 41 minutes from a handful of prompts.
