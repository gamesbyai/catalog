slug: chess3dastra
title: Chess3dastra
tagline: Play chess against a computer opponent on a 3D or 2D board.
description: >-
  Chess3dastra is full-rules chess against a computer opponent that runs locally
  in your browser. Castling, en passant, promotion and draws are all in, and you
  choose one of three difficulty levels before you start.


  According to the repository, it was built in the GitHub Copilot app with GPT-6
  Astra from four prompts, including a review pass by a second agent. It ships
  as a single static HTML file with unit and browser tests, and the computer's
  search runs in a Web Worker so the interface stays responsive.


  You move by clicking, with the keyboard or by typing algebraic notation, with
  undo, a move history and a captures list at hand. The board switches between
  3D, with hand-made pieces and an orbiting camera, and a flat 2D view. That
  choice survives a reload, and so does a game in progress.
