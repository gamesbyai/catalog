slug: laplace
title: Laplace
tagline: Fire projectiles and use time and space abilities to beat opponents in
  fast matches
description: >-
  Laplace is a fast projectile shooter built around abilities. Players fight
  opponents in short, quick encounters, firing shots while using powers that
  bend time and space to gain an edge. Multiplayer is supported, so matches can
  be played against friends.


  The design draws on class-based shooters, with perks and classes shaping how
  each player approaches a fight. The ability set is the focus: instead of
  relying only on aim, players look for moments where manipulating time or space
  turns a duel in their favor. It runs in the browser and works on mobile as
  well as desktop.


  The creator says they have wanted to make a game since they were young and
  enjoy Call of Duty: Mobile, especially its perks and classes. They built
  Laplace with Antigravity on Three.js for Vibe Jam 2026, aiming for something
  they would enjoy playing with friends.
