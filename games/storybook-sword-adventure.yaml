slug: storybook-sword-adventure
title: Storybook Sword adventure
tagline: Swing your arms in front of a webcam to slash through fairy-tale worlds.
description: >-
  Storybook Sword Adventure is a body-tracking action game. The webcam follows
  your arms and turns them into a sword, so you play by physically moving around
  and slashing. Each level is a storybook world, and the goal is to take back
  the fairy tales that the Story-Eater has stolen.


  The controller is your own body rather than a keyboard or gamepad. Swinging a
  real arm becomes a sword strike on screen, which makes each run more physical
  than a typical action game. The storybook setting gives the adventure a light
  fairy-tale framing.


  It was built in the browser with Three.js as an entry in Vibe Jam 2026. The
  creator's stated aim was to make games that use your body as the controller.
  The creator built it with Claude Code.
