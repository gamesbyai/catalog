slug: storybook-sword-adventure
title: Storybook Sword adventure
tagline: Swing your arms in front of a webcam to slash through fairy-tale worlds.
description: >-
  Win back the fairy tales the Story-Eater stole by slashing your way through
  them. In this body-tracking action game, your own arm is the sword.


  A separate storybook world for each level. Mixed-up monsters to fight along
  the way. Arm tracking through your webcam. Suitable from age 6.


  Wave your hands to move the sword. Each real swing becomes a sword strike.


  RebuffReality wanted games where your body is the controller, to play while
  moving around. The body tracking runs on BodyLink, a tool for playing games
  with your whole body in place of a gamepad.
