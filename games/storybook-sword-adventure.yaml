slug: storybook-sword-adventure
title: Storybook Sword adventure
tagline: Swing your arms in front of a webcam to slash through fairy-tale worlds.
description: >-
  Storybook Sword Adventure is a body-tracking action game in which your own arm
  is the sword. The webcam follows your arms and turns every real swing into a
  sword strike on screen, so you play by physically moving around and slashing.
  The controller is your own body.


  The creator's stated aim is to make games that use your body as the
  controller, and this was their Vibe Jam 2026 entry, built with Claude Code on
  Three.js. The result is more physical than a typical action game: you move,
  you swing, and the sword follows.


  Each level is a storybook world, and you are there to take back the fairy
  tales that the Story-Eater has stolen. The setting gives all that swinging a
  light fairy-tale frame.
