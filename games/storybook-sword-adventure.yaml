slug: storybook-sword-adventure
title: Storybook Sword adventure
tagline: Swing your arms in front of a webcam to slash through fairy-tale worlds.
description: >-
  You swing the sword by waving your arms in front of your webcam, so your body
  is the controller. The goal is to slash through storybook worlds and take back
  the fairy tales the Story-Eater stole. The monsters standing in your way are
  mixed-up ones.


  The title screen says it's for one player and rates it age 6+. It also tells
  you the game uses your arms, so you'll want a little space around you.


  A thief who eats whole stories is a pretty funny villain to be chasing down.


  The creator wanted to make games where you move around to play instead of
  sitting still with a keyboard. That's why the sword follows your hands, and
  why the whole adventure starts with a camera and a wave.


  The body tracking comes from BodyLink, which the title screen credits.
