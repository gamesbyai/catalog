slug: body-cam
title: BODY-CAM
tagline: Clear a house room by room with a SWAT team, seen through a body cam.
description: >-
  BODY-CAM drops you into a SWAT team serving a warrant at 1147 Elm St., and the
  job's to clear the house one room at a time, which is a surprisingly small
  mission.


  The game plays out through a fisheye lens on an Axon Body 3, with a running
  timestamp, a unit ID and a REC light that blinks. Of course the REC light
  belongs in a game built around a camera. Your rifle and its holographic sight
  go first around every doorway and corner.


  Oddly, racking the charging handle at the staging area is what starts the
  mission. There's a tracker in one corner that counts the suspects out of
  seven, along with the objective you're on, which begins with getting inside.


  Inside, you move through a house that's pretty dim and decaying, with peeling
  paint, discolored walls, bullet holes and debris littering the floor.


  The Field Manual is there for the controls and procedures. Settings is where
  you tune the lens along with your sensitivity and audio. Being able to adjust
  the view itself makes sense for a game that plays out through that lens.


  It's a first-person shooter that runs in real time. You can use a mouse and
  keyboard or a gamepad.
