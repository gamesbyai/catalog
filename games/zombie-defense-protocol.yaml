slug: zombie-defense-protocol
title: ZOMBIE DEFENSE PROTOCOL
tagline: Place towers to build a killbox that stops waves of zombies and
  exploding bosses.
description: >-
  You land on an isometric map with a winding dirt road, and a welcome panel
  asks you to pick Easy, Medium or Hard.


  Easy gives you 30 lives and 50% bigger rewards, while Hard drops you to 15
  lives and cuts payouts by 30%. Medium sits in the middle at 20 lives.


  Zombies walk the road and you stop them by picking a tower card and clicking
  open ground. There are ten towers, from a $50 gunner up to a $550 cannon, and
  a few cards like the tesla and cannon are dimmed until you've got the cash.


  The catch is that shields, umbrellas, invisibility and crawling each change
  which towers can hurt a zombie. So a tower that handles one kind can be
  useless against the next, and the gunner's card even says it hits umbrellas,
  which is a hint about the others.


  That's where recon towers come in, since they buff nearby towers, let them get
  past shields and umbrellas, and spot invisible zombies.


  You're holding the line for 30 waves, and every fifth one rolls in by car.
  Bosses burst into a swarm when they die, so celebrating a kill too early can
  leave you facing a fresh crowd. Click any tower you've placed to inspect,
  upgrade or sell it, or call the next wave early whenever you like.


  Cash, wave, lives and score sit across the top, next to speed buttons that run
  from 1x up to 10x.
