slug: zombie-defense-protocol
title: ZOMBIE DEFENSE PROTOCOL
tagline: Place towers to build a killbox that stops waves of zombies and
  exploding bosses.
description: >-
  Zombie Defense Protocol is a tower defense game where you position towers
  along the zombies' route and try to hold out through escalating waves. Each
  run is a test of whether your setup can handle whatever the next wave brings,
  since different enemy types call for different answers.


  Enemy variety drives the strategy. Shielded zombies, ones carrying umbrellas,
  and invisible ones each get past the wrong kind of tower, so a single favorite
  build won't carry you far. Every fifth wave arrives by car, which changes the
  rhythm of the defense. Bosses burst into swarms when they die, so a boss kill
  is not the end of the threat.


  The game was entered in Vibe Jam 2026, and the creator built it with Claude
  Code. It renders in 3D with Three.js and takes cues from World of
  Warcraft-style tower defense maps.
