slug: zombie-defense-protocol
title: ZOMBIE DEFENSE PROTOCOL
tagline: Place towers to build a killbox that stops waves of zombies and
  exploding bosses.
description: >-
  Zombie Defense Protocol is tower defense that asks you to build a killbox. You
  position towers along the zombies' route and try to hold out through
  escalating waves, and each wave tests whether your setup can handle what it
  brings.


  It takes cues from World of Warcraft-style tower defense maps and renders in
  3D with Three.js. Claude Code is the tool the creator used, and Vibe Jam 2026
  put it 467th of 945.


  Enemy variety drives the strategy. Shielded zombies, zombies carrying
  umbrellas, and invisible ones each get past the wrong kind of tower, so a
  single favorite build will not carry you far. Every fifth wave arrives by car,
  and bosses burst into swarms when they die, so a boss kill is not the end of
  the threat.
