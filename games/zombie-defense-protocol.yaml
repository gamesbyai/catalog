slug: zombie-defense-protocol
title: ZOMBIE DEFENSE PROTOCOL
tagline: Place towers to build a killbox that stops waves of zombies and
  exploding bosses.
description: >-
  A welcome panel opens over an isometric map and asks for a difficulty before
  you press Deploy. Easy gives 30 lives and 50% more rewards, Medium gives 20
  lives, and Hard gives 15 lives and 30% less reward. The goal is to hold the
  line through 30 waves of zombies.


  Pick a tower from the bar at the bottom and click open ground to place it.
  Each card shows its price, and a panel lists damage, range and fire rate. The
  Gunner costs $50 and can hit umbrellas. Other towers are Sniper, Mortar,
  Minigun, Laser, Frost, Flamer, Tesla, Recon and Cannon.


  Not every tower hits every threat. Some zombies carry shields or umbrellas,
  some are invisible, and some crawl. The Recon tower buffs nearby towers,
  bypasses shields and umbrellas, and spots invisible enemies, so mixing tower
  types matters.


  Every fifth wave arrives by car, and each boss bursts into a swarm when it
  dies. You can call the next wave early and set the game speed from 1x to 10x.
  Clicking a placed tower lets you inspect, upgrade or sell it.
