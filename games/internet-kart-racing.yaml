slug: internet-kart-racing
title: Internet Kart Racing
tagline: Race kart opponents on tracks inspired by internet culture and memes.
description: >-
  Internet Kart Racing is an online multiplayer kart racer with a sense of humor
  about the internet. Its tracks and setting are inspired by internet culture
  and memes, and it calls itself the South Park of kart racing, which points to
  an irreverent, satirical tone.


  Races start straight from the browser page, on desktop or on a phone. Claude
  Code went into making it, Three.js renders the karts and the tracks, and it
  ranked 441st of 945 entries at Vibe Jam 2026.


  The racing itself is the familiar part: you line up against other racers and
  try to cross the line first. The meme-heavy theme is what separates it from a
  standard kart racer, and it gives every race a comic, cartoonish identity of
  its own.
