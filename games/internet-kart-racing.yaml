slug: internet-kart-racing
title: Internet Kart Racing
tagline: Race kart opponents on tracks inspired by internet culture and memes.
description: >-
  Internet Kart Racing is a browser kart racer with multiplayer support. Players
  drive against other racers, aiming to cross the line first. The setting is
  built around internet culture and memes, and the game describes itself as the
  South Park of kart racing, pointing to an irreverent, satirical tone.


  The meme-heavy theme is what sets it apart from a standard kart racer, giving
  the races a comic, cartoonish identity. It runs in the browser on Three.js and
  is playable on mobile as well as desktop, so a race can start without an
  install.


  It was entered in Vibe Jam 2026, where it placed 441st out of 945 entries. The
  creator states that it was built with Claude Code, Anthropic's coding
  assistant.
