slug: turbo-kart-rally
title: turbo kart rally
tagline: Race colorful karts around tracks in a Mario Kart-style arcade racer.
description: >-
  Turbo Kart Rally is an arcade kart racer that runs in the browser. The player
  drives a kart around a course in the spirit of Mario Kart, competing for
  position in short, fast-paced races that favor quick handling over realistic
  driving physics.


  Everything on screen is generated procedurally, so the game has no external
  art or model files. It is written in plain JavaScript on top of Three.js and
  needs no build step, which means the project can be opened and run directly
  from the repository without setup.


  According to the repository, the game was built by five Claude Opus 5.5
  sub-agents working from a single prompt. The repository is tagged as
  AI-generated and lists kart racing, procedural generation, and WebGL among its
  topics.
