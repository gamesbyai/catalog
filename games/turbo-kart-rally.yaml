slug: turbo-kart-rally
title: turbo kart rally
tagline: Race colorful karts around tracks in a Mario Kart-style arcade racer.
description: >-
  Turbo Kart Rally is an arcade kart racer in the spirit of Mario Kart, with
  colorful karts and short, fast races around the track. You drive around a
  course and compete for position, and the handling favors quick reactions over
  realistic driving physics.


  According to its repository, it was built by five Claude Opus 5.5 sub-agents
  working from a single prompt. The repository is tagged as AI-generated and
  lists kart racing, procedural generation, and WebGL among its topics. It is a
  single-player game that runs in the browser.


  Nothing on screen comes from an art or model file. Everything is generated
  procedurally, the code is plain JavaScript on Three.js, and there is no build
  step, so the game opens and runs straight from the repository without setup.
