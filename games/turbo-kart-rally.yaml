slug: turbo-kart-rally
title: turbo kart rally
tagline: Race colorful karts around tracks in a Mario Kart-style arcade racer.
description: >-
  Press Enter or click to begin, then choose one of eight racers, an engine
  class of 50cc, 100cc or 150cc, and how many laps to run.


  The race is against seven computer drivers on Palm Cove Circuit, about 2.1 km
  long. The course has sweeping turns, an S-bend, a bridge across a lagoon and a
  hairpin, plus 8 boost pads and 2 jump ramps. Hop into a drift and hold it
  through a corner. Releasing the drift gives a bigger boost the longer you held
  it.


  Item boxes hand out mushrooms, bananas, green and red shells, a star,
  lightning or a blue shell, with the odds set by your place in the pack. Rivals
  use items too, and they close the gap if you pull ahead. Revving as the
  countdown ends gives a rocket start.


  Racers differ in speed, acceleration, handling and weight. Music speeds up on
  the last lap. Keyboard and gamepad both work.
