slug: racernaut
title: Racernaut
tagline: Drive through an endless generated city, choosing turns at every
  junction to stay alive.
description: >-
  One wrong turn ends your run in Racernaut, a race through an endless city.


  Junctions, each a split-second bet on which turn to take. Streets built as you
  drive, streaming in just ahead of the car. Opening rows of city, built before
  the first drive.


  Press Space to start driving. Steer with A and D, hold W to boost, and hold S
  to brake. Press C to switch the camera.


  rameshvel had dabbled in procedural generation for years without building
  anything serious with it. According to them, AI changed that, and imagination
  is now most of what you need. Experience as a developer on top of that helps
  even more. Credit for the music goes to StudioKolomna on Pixabay, and the
  ambient sound to ZapSplat.
