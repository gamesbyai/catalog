slug: racernaut
title: Racernaut
tagline: Drive through an endless generated city, choosing turns at every
  junction to stay alive.
description: >-
  Racernaut is a driving game in a city that builds itself as you go. The
  streets are procedurally generated, so the route ahead is different every
  time, and every junction forces a quick decision about which way to turn.


  The creator describes a long interest in procedural generation that they had
  never turned into a serious project, and says AI made it possible to try.
  Their Vibe Jam 2026 build used Claude Code and Three.js, and it runs on phones
  as well.


  A wrong turn ends the run. Because the layout appears around the car as you
  drive, you have to read each intersection the moment it shows up, and the
  pressure of those choices is the appeal. It is a single-player arcade racer,
  and the city never ends.
