slug: racernaut
title: Racernaut
tagline: Drive through an endless generated city, choosing turns at every
  junction to stay alive.
description: >-
  Press Space to start driving through a city that generates itself as you go.
  Each junction is a bet on which way to turn, and the wrong turn costs you the
  run. The streets stream in ahead of the car as you drive.


  Steer with A and D, hold W to boost and S to brake. C switches the camera. The
  default view looks straight down on the car, with crosswalks, traffic lights,
  rooftops, trees and parked vehicles laid out around each intersection.


  Two columns of icon buttons sit on the left edge. The top column has four
  buttons with sun and moon symbols, and the bottom column has five with cloud
  and rain symbols. A loading bar tracks the first rows of city being built
  before you can drive.


  The creator had only experimented with procedural generation before and wanted
  to build something serious with it. An audio toggle sits in the top corner,
  with credits for the music and ambient sound shown beside it.
