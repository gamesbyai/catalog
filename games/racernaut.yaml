slug: racernaut
title: Racernaut
tagline: Drive through an endless generated city, choosing turns at every
  junction to stay alive.
description: >-
  A single wrong turn ends your run in Racernaut, so every junction counts. The
  city isn't waiting for you either, since it generates itself as you drive and
  the streets stream in just ahead of the car.


  Press Space and you're off, steering with A and D while you hold W to boost
  and S to brake.


  The default camera looks straight down on the car, and it's a surprisingly
  busy view for something built on the fly. Crosswalks, traffic lights,
  rooftops, trees and parked vehicles crowd in around each intersection. If you
  want a different angle, C switches the camera.


  Down the left edge there are two columns of icon buttons, four marked with
  suns and moons on top and five with clouds and rain underneath, which is a
  generous amount of sky for a car game.


  Before you can drive, a loading bar counts off the first rows of city while
  they're built. An audio toggle sits in the top corner, with the music credited
  to StudioKolomna from Pixabay and the ambient sound to ZapSplat.


  rameshvel had toyed with procedural generation over the years but never built
  anything serious with it. According to them, AI is what changed that. Their
  view is that imagination is now most of what you need, and development
  experience on top of it helps even more.
