slug: racernaut
title: Racernaut
tagline: Drive through an endless generated city, choosing turns at every
  junction to stay alive.
description: >-
  You're racing a car through a city that keeps building itself ahead of you,
  and every junction forces a guess about which turn keeps you alive. The goal
  is to survive as the streets stream past, because a wrong choice ends the run.


  The view starts from high above, looking straight down at crosswalks, rooftops
  and parked clutter.


  Press Space to start driving. You steer left and right, hit the boost when you
  want speed, and brake when a junction comes up too fast, which is handy
  because the city isn't laid out ahead of time. There's a camera switch too, if
  the top-down view isn't what you want.


  A small panel on the left lets you change the time of day, from sunrise
  through full daylight to night. A second set of buttons below it changes the
  weather, with several kinds to pick from.


  The creator has long been curious about procedural generation and had only
  ever toyed with it. Building this with AI was how they finally made something
  serious out of it, and the endless city shows that.
