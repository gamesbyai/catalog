slug: vibecorps
title: VibeCorps
tagline: Type prompts, grow a startup, and guide it from solo founder to
  acquisition target.
description: >-
  VibeCorps is an incremental simulation about building a software startup. You
  begin as a solo founder who types prompts, and your output grows as you bring
  on AI agents that write the code for you. A run follows the company from a
  one-person effort toward the point where a larger buyer wants to acquire it.


  The premise draws on how programming has changed, with the player's role
  shifting from writing code by hand to directing automated helpers. The creator
  says the game comes from their own experience in startups, which shapes the
  founder-to-exit arc and gives the progression a personal point of view.


  It was entered in Vibe Jam 2026, and the creator states that it was built with
  Claude Code. The jam entry places the game among hundreds of submissions, and
  it plays as a single-player experience without multiplayer features.
