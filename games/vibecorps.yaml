slug: vibecorps
title: VibeCorps
tagline: Type prompts, grow a startup, and guide it from solo founder to
  acquisition target.
description: >-
  Type on the keyboard to fill a code buffer, and the typing earns money. The
  first screen shows a code file and a progress bar labeled "vim main.js" that
  counts to 60. Your cash and MRR are at $0, and a valuation bar starts at $0 of
  $100.0K.


  The first purchase on the code tab is a Mechanical Keyboard for $80. It raises
  output from 1 to 2 characters per keypress and makes prompts type 2.0 times
  faster. Agents are hired from the F5 tab, and a panel on the right lists them.
  It starts empty, with the account on a Free plan of 50 requests.


  Five tabs run along the top: Code, Tickets, Market, GPU and Org. Sell and Test
  percentages sit in a slider on the left. A news ticker runs along the top, and
  a log at the bottom records events. A Next Vibe button sits in the top corner.


  The creator frames the run as going from solo founder to AI-powered
  acquisition target. They say it draws on the evolution of coding and their own
  experience in startups.
