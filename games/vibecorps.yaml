slug: vibecorps
title: VibeCorps
tagline: Type prompts, grow a startup, and guide it from solo founder to
  acquisition target.
description: >-
  You're working your way from solo founder to acquisition target, and the
  valuation bar at the top shows how far you've got, from $0 toward $100.0K. You
  start with a stock laptop and a code editor that wants you to type.


  Mash the keys and fake source code fills the buffer, so it doesn't matter what
  you type.


  The money goes into upgrades. The first one is a mechanical keyboard for $80,
  which doubles the characters per key, so your prompts land twice as fast.
  That's a pretty satisfying first purchase for a game about typing.


  Next you hire agents, because the panel on the right tells you to head to the
  F5 tab to buy your first one. The tagline sums up the idea: you type the
  prompts and the agents type the code.


  Your plan starts out as Free with 50 requests, which is a funny limit for
  someone chasing a buyout.


  Around the editor there's a lot going on. A monthly revenue readout sits
  beside the valuation, sell and test sliders on the left start at 100% and 0%,
  and tabs cover code, tickets, market, GPU and org. A few are greyed out at the
  start.


  A news ticker runs startup-world headlines along the top, and a log at the
  bottom reports what the system is up to. The creator drew on the evolution of
  coding and their own time in startups.
