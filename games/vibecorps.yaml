title: VibeCorps
tagline: Type prompts, grow a startup, and guide it from solo founder to
  acquisition target.
description: >-
  The run goes from solo founder to AI-powered acquisition target, as compnski
  pitches it. Cash and monthly recurring revenue start at $0.


  A mechanical keyboard as your first purchase. More characters per keypress.
  Faster prompt typing. A Free plan to start, capped at 50 requests.


  Type to fill the code buffer. Typing earns you money. Hire agents from the F5
  tab. Set Sell and Test percentages with the slider.


  According to compnski, it draws on how coding has evolved and on their own
  startup experience.
