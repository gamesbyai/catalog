slug: fly-sf
title: FLY SF
tagline: Fly, drive, run and parachute around a 3D scan of San Francisco with friends
description: >-
  FLY SF is a multiplayer sandbox set in a photorealistic 3D scan of San
  Francisco. Players move through the city in several ways: flying, parachuting,
  driving, running, and using a jetpack. Sessions are open-ended, with friends
  sharing the same space and choosing how to explore it.


  The main draw is the scenery. The city is rendered from high-detail scans, so
  flights over familiar streets and landmarks feel grounded in a real place.
  Switching between vehicles and on-foot movement lets a session shift from
  sightseeing to stunts without leaving the map.


  It runs in the browser on Three.js and works on mobile as well as desktop. It
  entered Vibe Jam 2026 and places itself as a follow-up to the creator's 2025
  flight sim. The creator lists Codex as the tool used to build it.
