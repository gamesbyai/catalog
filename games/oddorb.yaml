slug: oddorb
title: OddOrb
tagline: Command a team of orbs, build towers and hold off a self-evolving
  creature swarm.
description: >-
  You command a small team of orb units on a hex map generated by procedure. You
  dig out new ground and gather energy charges while a self-reproducing swarm
  closes in. The aim is to reach the charge target with your orbs still alive.


  Cannon and hydro towers for defense, upgradable or sellable as the situation
  changes. Gene-driven swarm of creatures that breed and evolve on their own,
  growing the longer a round runs. Random Map skirmishes after the tutorial,
  about half an hour per session. Fog of war, procedural music, and saves and
  replays. Multiplayer over LAN, plus co-op play.


  Select units with a click or a box drag. With a unit selected, press Q or W to
  build a cannon or hydro tower. Right-click to move or attack-move. Right-click
  a tree, or press E, to dig it out and clear space. Pan with the arrow keys,
  the scroll wheel, or a middle-drag. Press F1 during a match to bring up all
  the controls.


  According to koomik, AI assisted with the code, graphics and text.
