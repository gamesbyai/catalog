slug: oddorb
title: OddOrb
tagline: Command a team of orbs, build towers and hold off a self-evolving
  creature swarm.
description: >-
  You command a small team of orb units on a procedurally generated hex map. Dig
  out new ground, place cannon and hydro towers, and gather energy charges while
  a swarm of self-reproducing creatures closes in. The aim is to reach the
  charge target with your orbs still alive.


  The creatures breed and evolve by themselves, driven by genes, so the swarm
  keeps growing the longer a round runs. Towers are your defense, and they can
  be upgraded or sold as the situation changes. Trees can be dug out to clear
  space.


  Play Now opens a short guided tutorial on the Arena map. After that you can
  start a Random Map skirmish. A session runs about half an hour. The game
  includes fog of war, procedural music, saves and replays, and it supports
  co-op and multiplayer over LAN.


  Select units with a click or a box drag, then press Q or W to build a cannon
  or hydro tower. Right-click to move or attack-move. Press F1 in game to see
  every control.
