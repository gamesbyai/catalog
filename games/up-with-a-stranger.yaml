slug: up-with-a-stranger
title: UP! with a stranger
tagline: Climb from a backyard to space as two blobs tied together by a string.
description: >-
  Two plasticine blobs, one string, and a stranger on the other end. UP! with a
  stranger is a cooperative climbing game for two players: each of you controls
  a blob, and together you work your way up from a backyard toward space and
  beyond. The one rule is that the string must not break.


  The creator comes from an art direction background and describes the mix as a
  cross between Purple & Brown, It Takes Two, and Flappy Bird. The look draws on
  childhood games, with a clay-like art style and small odd details. It is their
  first shipped game, built with Claude Code and, they say, 99% vibe coded.


  One goal was to see whether AI-built work could still feel handmade and full
  of personality. The pairing is meant for strangers, so the climb leans on
  quick, shared trouble and a height to beat.
