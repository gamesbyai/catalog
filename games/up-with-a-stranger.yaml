slug: up-with-a-stranger
title: UP! with a stranger
tagline: Climb from a backyard to space as two blobs tied together by a string.
description: >-
  Climb with a friend, or get paired with a stranger who is given a name as
  silly as Cheeky Blob. Each of you controls one blob. A sign warns you to go up
  together or die.


  The string tying you together, and the one rule that it must not break. A
  climb from your backyard up toward space and beyond. Your goal of seeing how
  high the pair of you can get.


  ilyxxxa comes from an art director background. They describe it as the
  offspring of Purple & Brown, It Takes Two and Flappy Bird, and call it dumb by
  design. They also pitch it as the first co-op game for strangers. It's the
  first game they've shipped, and by their account it is 99% vibe coded. They
  had wanted to make a game their whole life. Part of the point was to test
  whether AI-made work could read as handmade.
