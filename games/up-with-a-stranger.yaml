slug: up-with-a-stranger
title: UP! with a stranger
tagline: Climb from a backyard to space as two blobs tied together by a string.
description: >-
  A sign warns you to go up together or die. You can play with a stranger or
  with a friend, and the stranger route pairs you with a partner given a name as
  silly as Cheeky Blob.


  Each of you controls one blob, and since the two of you are tied together by a
  string, the game's only rule is that the string mustn't break.


  The climb starts in a backyard and keeps heading up toward space and beyond, a
  long trip for two blobs on one string. Your goal is to see how high the pair
  of you can get.


  ilyxxxa comes from an art director background, and they pitch it as the
  offspring of Purple & Brown, It Takes Two and Flappy Bird. They also call it
  dumb by design. It's pitched as the first co-op game made for strangers.


  This is the first game ilyxxxa has ever shipped, and by their account it's 99%
  vibe coded. They'd wanted to make a game their whole life. Part of the point
  was seeing if a game made with AI could still come across as handmade.
