slug: echo-ohce
title: ECHO|OHCE
tagline: Find your way through a dark dungeon using echolocation pings
description: >-
  In ECHO|OHCE, you find your way through a dark dungeon by echolocation, since
  you can't see anything. In each level, you need to reach the exit.


  Automatic pings that light up whatever they reach, in blue for safe, amber for
  near and red for danger. A full run of ten levels strung together. Staying
  silent as a second goal beside the exit. Your results on the Top Echoes board.


  Move with WASD and look around with the mouse. Hold Shift to sprint.


  According to JayShugito, the echolocation is modeled on the Odradek scanner
  from Death Stranding, which maps what you can't see.
