slug: echo-ohce
title: ECHO|OHCE
tagline: Find your way through a dark dungeon using echolocation pings
description: >-
  ECHO|OHCE puts you in a dark dungeon where you cannot see. A ping fires
  automatically and lights up whatever it reaches in one of three colors: blue
  for safe, amber for near, and red for danger. Those color labels sit on the
  title screen as a legend.


  Each level has you reach the exit, and a run covers 10 levels. Staying silent
  is a second goal that runs alongside it. The title screen describes the game
  as a horror roguelite, and a Top Echoes board there tracks results.


  You move with WASD, look with the mouse, and hold Shift to sprint. The
  echolocation is modeled on the Odradek scanner from Death Stranding, according
  to the creator.


  The art is minimal: glowing blue, amber and red lettering and markers against
  a black screen, with a single button to enter the dark.
