slug: echo-ohce
title: ECHO|OHCE
tagline: Find your way through a dark dungeon using echolocation pings
description: >-
  ECHO|OHCE drops you into a dungeon you can't see, so you find your way by the
  pings that light up what's around you. They fire on their own, which means you
  spend your effort on where you walk instead of aiming a scanner.


  Everything a ping reveals gets a color: blue for safe, amber for near, and red
  for danger.


  Your goal is to reach the exit on each level, and there are 10 of them to get
  through. The game also lists staying silent as one of its aims, which sits
  oddly beside a scanner that keeps calling out by itself.


  It's built as a horror roguelite, and the creator took the scanning idea from
  the Odradek scanner in Death Stranding. A Top Echoes board on the title screen
  keeps track of how other players have done.


  You can sprint when you need to get moving, but the pings still do the looking
  for you.
