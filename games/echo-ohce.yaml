slug: echo-ohce
title: ECHO|OHCE
tagline: Find your way through a dark dungeon using echolocation pings
description: >-
  ECHO|OHCE is a dungeon crawler played without seeing the surroundings
  directly. A scanner sends out sound pulses that reveal nearby walls and
  objects for a moment, and you move through the dark rooms by reading the
  returning signals and finding a way forward.


  The scanner draws on the Odradek device from Death Stranding, and the whole
  game leans on that idea of sensing a space rather than looking at it. The
  creator made it with Codex on Three.js, and it ranked 414th of 945 at Vibe Jam
  2026. It also plays on phones.


  Action, puzzle and strategy all come into it. Timing your pings and choosing
  your route both matter, since each pulse only shows the room for a moment
  before it goes dark again.
