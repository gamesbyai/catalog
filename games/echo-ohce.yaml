slug: echo-ohce
title: ECHO|OHCE
tagline: Find your way through a dark dungeon using echolocation pings
description: >-
  ECHO|OHCE drops you into a dark dungeon where you can't see a thing, and you
  find your way by echolocation instead. A ping goes out on its own and lights
  up whatever it reaches in one of three colors, with blue meaning safe, amber
  meaning near and red meaning danger.


  The title screen lays out that color key as a legend, sitting just under a
  slightly unsettling tagline that tells you you're blind and it isn't.


  Every level asks you to reach the exit, and a full run strings 10 levels
  together. Staying silent is a second goal that runs alongside it, which fits a
  game whose title screen calls it a horror roguelite.


  You move with WASD and look around with the mouse. Holding Shift lets you
  sprint. There's also a Top Echoes board on the title screen for your results,
  a bit of bragging room in a game that's all about keeping quiet.


  According to the creator, the echolocation is modeled on the Odradek scanner
  from Death Stranding, a clever source for a tool that maps what you can't see.


  The look is stripped way back. Glowing blue, amber and red lettering and
  markers sit against a black screen, and even the title is split across those
  same three colors. There's just one button on the title screen, and it's
  labeled Enter the Dark.
