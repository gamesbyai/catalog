slug: dogfight-run
title: DogFight Run
tagline: Fly a spaceship in fast multiplayer dogfights inspired by arena shooters.
description: >-
  DogFight Run puts you in a spaceship for online space combat. Enter a
  callsign, pick a mode and a graphics quality (low, medium or high), and press
  Launch.


  FFA, TDM, CTF and ONS modes. Laser with unlimited ammo. Rocket with splash
  damage. Railgun that hits where you aim.


  Steer and aim with the mouse, and click to fire the selected weapon. Press the
  number keys to switch weapons. Use Shift to accelerate and Space to brake. Use
  A and D to roll, Q and E to yaw, and W and S for pitch override. Press Tab for
  the scoreboard, Enter to open chat, and C to toggle the camera view. Press F
  to switch to fullscreen.


  ElydanStudio had wanted to build this for some time before making it. They
  describe it as Quake 3 in space with spaceships.
