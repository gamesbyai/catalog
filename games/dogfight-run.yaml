slug: dogfight-run
title: DogFight Run
tagline: Fly a spaceship in fast multiplayer dogfights inspired by arena shooters.
description: >-
  DogFight Run puts you in a spaceship in online space combat. You enter a
  callsign, pick a mode and a graphics quality, and press Launch. The mouse
  steers the ship and aims at the same time, so flying and targeting share one
  input.


  Three weapons sit on number keys: an infinite-ammo laser, a splash-damage
  rocket and a hitscan railgun. Click fires the selected weapon. Shift
  accelerates and Space brakes, while A/D roll, Q/E yaw and W/S act as a pitch
  override.


  The launch screen offers four modes: FFA, TDM, CTF and ONS. Tab brings up the
  scoreboard and Enter opens chat. C toggles the camera view, and F switches to
  fullscreen. Quality can be set to low, medium or high before launch.


  The creator describes it as Quake 3 in space with spaceships, a project wanted
  for some time before it got built.
