slug: dogfight-run
title: DogFight Run
tagline: Fly a spaceship in fast multiplayer dogfights inspired by arena shooters.
description: >-
  DogFight Run is a multiplayer space shooter that takes the pace of a classic
  arena shooter and moves it into open space. Players pilot spaceships and fight
  other pilots in fast dogfights, chasing and shooting down opponents. It is
  built to run in the browser and works on mobile devices as well.


  The creator describes it as Quake 3 in space with spaceships, and that shows
  in the emphasis on quick, competitive combat between players rather than slow
  pacing. It was made for Vibe Jam 2026, where it placed 145th out of 945
  entries. The creator says they had wanted to build it for a while and the jam
  gave them the reason.


  The creator built it with Claude Code, and the game renders in the browser
  with Three.js, which handles the 3D space combat and the ships on screen.
