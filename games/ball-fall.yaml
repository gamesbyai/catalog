slug: ball-fall
title: Ball Fall
tagline: Roll a ball across collapsing tiles and outlast rivals until they fall.
description: >-
  You roll a ball across a grid of floor tiles inside a dark arena ringed with
  stands, and the tiles start vanishing under you. Staying on solid ground is
  the whole job.


  Each round opens with a 3, 2, 1 countdown, and the hint on screen tells you to
  start moving before the floor begins to go, which makes sense because standing
  still is what gets you dropped. A small panel in the corner tracks your score,
  a multiplier and a running timer.


  On your own, you're chasing a score, and there's a top ten list to climb. The
  online multiplayer mode puts you on the same collapsing floor as rivals, so
  the last one still rolling wins.


  The main menu also holds a how-to-play guide and an About page.


  It's an homage to the original Ball Fall by Brian Elting. A track called
  Falling In Perfect Chaos by figwad plays during the round, which is a pretty
  good name for a floor that keeps falling apart.
