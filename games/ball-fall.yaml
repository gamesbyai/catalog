slug: ball-fall
title: Ball Fall
tagline: Roll a ball across collapsing tiles and outlast rivals until they fall.
description: >-
  The floor in Ball Fall is falling apart, and the last ball still on it wins.
  Every player rolls a ball across a platform of collapsing tiles, trying to
  outlast the rivals until they fall, so a multiplayer round is a scramble to
  keep moving and stay on solid ground.


  Rounds are short and easy to restart, which suits quick sessions. Made by
  figwad with Cursor, with Three.js for the 3D visuals, it finished 72nd of 945
  at Vibe Jam 2026.


  The pace is fast and chaotic. The arena shrinks under everyone at once, which
  forces a constant choice of where to roll next. Rivals share the same space
  and have to be dodged too, so positioning and timing count as much as avoiding
  the gaps.
