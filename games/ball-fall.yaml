slug: ball-fall
title: Ball Fall
tagline: Roll a ball across collapsing tiles and outlast rivals until they fall.
description: >-
  Roll a ball across a floor of tiles while they collapse beneath you. Steer
  around the gaps and outlast your rivals until someone takes the plunge.


  Solo rounds, or online matches against other players. 3, 2, 1 countdown before
  each round. Warning ahead of the collapse.


  Use either a keyboard or a gamepad to move through the game's menus.


  figwad made the soundtrack, including a track called Falling In Perfect Chaos
  that plays over a crumbling floor. The game is an homage to Brian Elting's
  Ball Fall. figwad names early-2000s indie games built with Game Maker as
  inspiration.
