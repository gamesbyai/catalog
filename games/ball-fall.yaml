slug: ball-fall
title: Ball Fall
tagline: Roll a ball across collapsing tiles and outlast rivals until they fall.
description: >-
  Ball Fall is a multiplayer survival game in which each player controls a
  rolling ball on a platform made of tiles that collapse. A round is a scramble
  to stay on solid ground, dodge opponents, and keep moving as the floor
  disappears. The last ball still on the platform wins.


  The pace is fast and chaotic, with the shrinking arena forcing constant
  decisions about where to roll next. Rivals share the same space, so
  positioning and timing matter as much as avoiding the gaps. Rounds are short
  and easy to restart, which suits quick sessions. It runs in the browser and is
  playable on mobile.


  The game was an entry in Vibe Jam 2026, where it placed 72nd among 945
  entries. The creator built it with Cursor, and the 3D visuals use Three.js.
