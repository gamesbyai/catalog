slug: ball-fall
title: Ball Fall
tagline: Roll a ball across collapsing tiles and outlast rivals until they fall.
description: >-
  A square floor of blue tiles sits inside a dark, round arena, and you roll a
  ball across it while the tiles collapse. Each round opens with a 3, 2, 1
  countdown, and an on-screen prompt tells you to start moving before the floor
  begins to disappear.


  The goal is to dodge the gaps and outlast your rivals until someone takes the
  plunge. You can play a solo round or join an online match. A HUD along the top
  tracks your score, a multiplier that starts at x1, and a running timer.


  The main menu also lists a top 10 high score table, a How to Play guide and an
  About page. Menus work with keyboard or gamepad. The soundtrack is Falling In
  Perfect Chaos by figwad, and the game is an homage to Ball Fall by Brian
  Elting.
