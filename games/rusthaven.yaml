slug: rusthaven
title: Rusthaven
tagline: Explore a ruined city, gather parts, and wire and program your own robot.
description: >-
  Rusthaven is a robotics adventure set in a broken industrial city. The player
  explores the ruins, collects electronic parts, and uses them to build a robot.
  Assembling it means wiring the components together and programming its
  behavior, with the goal of uncovering the mystery behind the first spark.


  The game is meant to teach how electronics, wiring, and coding actually work.
  The creator wanted learning to feel exciting rather than intimidating, so
  players are encouraged to experiment, make mistakes, and solve problems on
  their own. It is aimed at kids, teenagers, and adults alike.


  The creator built it with Codex for the Vibe Jam 2026, using Three.js. The
  motivation was a concern that many students skip the basics when using AI, so
  the game focuses on hands-on understanding of programming, electronics, and
  robotics.
