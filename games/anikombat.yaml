slug: anikombat
title: AniKombat
tagline: Fight in 3D duels against the CPU or other players, casually or on a
  ranked ladder.
description: >-
  Fight one-on-one in 3D in the Mortal Kombat mold. There are three ways to
  play, and you can jump in right away as a guest against CPU opponents.


  Casual online matches against other people, with the stakes kept low. A ranked
  ladder for players who want competitive tension. Combos, special moves and
  character matchups, against the CPU or another person.


  adrscott says the project comes from a long-standing love of fighting games
  and their combos, matchups and competitive feel.
