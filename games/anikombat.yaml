slug: anikombat
title: AniKombat
tagline: Fight in 3D duels against the CPU or other players, casually or on a
  ranked ladder.
description: >-
  AniKombat is a 3D fighting game in the vein of Mortal Kombat-style brawlers.
  Players can jump in right away as a guest and fight CPU opponents, or take on
  other people in online casual matches. Each bout is a one-on-one duel built
  around combos, special moves, and character matchups.


  The game offers a ranked ladder for players who want competitive tension,
  alongside casual online matches for lower-stakes play. It also runs on mobile
  devices, and multiplayer is part of the design.


  It was entered in Vibe Jam 2026, where it placed 226th out of 945 entries. It
  is built with Three.js, and the creator says they used Cursor. The creator
  says the project comes from a long-standing love of fighting games and their
  combos, matchups, and competitive feel.
