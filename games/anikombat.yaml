slug: anikombat
title: AniKombat
tagline: Fight in 3D duels against the CPU or other players, casually or on a
  ranked ladder.
description: >-
  AniKombat is a one-on-one 3D fighting game in the Mortal Kombat mold. There
  are three ways to play: jump in right away as a guest against CPU opponents,
  take on other people in casual online matches, or climb the ranked ladder.


  The creator says the project comes from a long-standing love of fighting games
  and their combos, matchups and competitive feel. Cursor and Three.js are the
  tools behind it, it runs on phones as well as desktops, and it finished 226th
  of 945 at Vibe Jam 2026.


  Each bout is a duel built around combos, special moves and character matchups,
  whether the opponent is the CPU or another person. Casual matches keep the
  stakes low, and the ladder is there for players who want competitive tension.
