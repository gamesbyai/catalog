slug: copycat
title: Copycat
tagline: Race a shadow cat across short black-and-white platform maps
description: >-
  Press space or click to jump, and press again in midair for a double jump that
  turns your cat into a barrel roll. You're racing a shadow cat across a short
  side-scrolling course, and a timer in the corner runs the whole way.


  The ground is a white strip broken up by gaps, spike clusters and small
  floating platforms, all drawn in stark black and white. Diamond-shaped echoes
  are scattered along the route, and a counter in the corner shows how many of
  the 20 you've collected. They feed into your final time, so you have to decide
  which ones are worth the detour.


  You can grab onto ledges, and the jump has some buffering, so a press that
  lands slightly early still counts. That's a considerate touch for a game where
  every jump is timed against a rival.


  The maps are short and dense, and the platforms, hazards and echoes are
  seeded, so each race feels familiar but a little different. Restarting is
  instant with no menus in the way, or you can hit R to reset on the spot.


  Your wins, losses, streak and best time are saved in your browser, and the
  ghost data is stored between sessions too.


  Everything is monochrome, with scanlines and a bit of drifting motion over the
  top, and the sound effects are generated in the browser. The creator lists it
  as still under development, with more modes and shadow ideas planned.
