slug: copycat
title: Copycat
tagline: Race a shadow cat across short black-and-white platform maps
description: >-
  Press Space to jump, then press again midair for a double jump with a barrel
  roll. The race is against a shadow copy of your cat that runs alongside you.


  Short, dense maps of platforms, spikes and floating ledges. Collectible echoes
  that count toward your final time. Ledge grabs, plus jump buffering that
  catches early presses. Seeded layouts that stay familiar but shift slightly
  between races. Local records of wins, losses, current streak and best time,
  plus ghost data kept between sessions. A single HTML file on a 1200x600
  canvas, with Web Audio sound effects and multi-touch input.


  Click to jump as well. When a race goes wrong, press R. The restart is instant
  and skips the menus entirely.


  webXOS lists it as under development, with more modes and shadow mechanics
  planned. According to the creator, AI assisted with the code, graphics, sounds
  and text.
