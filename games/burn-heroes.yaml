slug: burn-heroes
title: Burn Heroes
tagline: Fight off swarms of enemies with fellow players in a multiplayer bullet heaven.
description: >-
  Burn Heroes is a multiplayer bullet heaven game in the vein of Vampire
  Survivors. Players control a hero in a shared arena, fending off enemies that
  keep coming while the character's attacks fire on their own. Runs blend
  action, shooting, and light RPG progression.


  The creator describes it as an attempt at the feel of Vampire Survivors, and
  it is best seen as an early take on the genre. Playing together with others
  and support for mobile devices are the main draws, and it runs in the browser
  on a 3D engine.


  It was entered in Vibe Jam 2026, where it placed 125th among 945 entries. The
  creator built it with Cursor, and the project uses Three.js for its rendering.
