slug: burn-heroes
title: Burn Heroes
tagline: Fight off swarms of enemies with fellow players in a multiplayer bullet heaven.
description: >-
  Burn Heroes is a bullet heaven built for playing with other people. Each
  player controls a hero in a shared 3D arena, fending off swarms of enemies
  that keep coming. Attacks fire on their own, so you steer the hero while the
  weapons do the shooting.


  The creator, MartinTale, describes it as an attempt at the feel of Vampire
  Survivors, with light RPG progression on top of the action and shooting. It is
  a Cursor-built Three.js game that also runs on phones, and it came 125th of
  the 945 entries at Vibe Jam 2026.


  Playing together is the main draw. The arena is shared, so fellow players
  fight the same swarms beside you, and every run is a group effort against
  enemies that do not stop coming.
