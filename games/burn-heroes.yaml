slug: burn-heroes
title: Burn Heroes
tagline: Fight off swarms of enemies with fellow players in a multiplayer bullet heaven.
description: >-
  Burn Heroes lets you fight alongside other players in a shared 3D arena. Each
  player steers one hero in this multiplayer bullet heaven.


  Swarms of enemies that keep coming. Automatic weapon fire. Light RPG
  progression on top of the action and shooting, as the creator describes it.


  MartinTale describes it as an attempt at the feel of Vampire Survivors.
