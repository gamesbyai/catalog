slug: charge-barge
title: CHARGE BARGE
tagline: Sail an ironclad up a hostile coast, shoot wrecks for loot, and buy
  upgrades in coves.
description: >-
  Steer a storm-powered ironclad along a coastline that gets narrower and more
  dangerous going north, one procedurally charted channel at a time. Volts are
  stored charge from wrecks and from a dynamo that pays per second while you
  sail, so slow water pays better and the throttle becomes a money decision.
  Each leg ends in a safe cove, and a sinking sends you back to the last one
  with every volt, upgrade and point of renown intact.


  Surge, battle charge from kills, spent instantly. Permanent upgrades for
  weapons, defense, speed, income, salvage magnet and surge capacity, bought
  with volts in coves. Ramming speed, boarding archers, a hired sloop, the
  Tempest, extra gun crews and patch crew, bought with surge, more unlocking as
  renown grows. Skiffs that ram, branders that explode, towers leading their
  shots, mortar barges marking water to avoid. Rocks damaging the hull, reefs
  dragging the keel. Automatic saves at coves, purchases, unlocks and sinkings.


  Steer with A/D or arrows, and throttle with W/S. Aim with the mouse and click
  to fire. Press 1 to 6 to use abilities during a run. Choose Continue to resume
  the chart.


  According to CSAF, AI assisted with the code, graphics and text. "Everything
  in this game is charge," CSAF writes.
