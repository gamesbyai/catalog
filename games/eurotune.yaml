slug: eurotune
title: eurotune
tagline: Answer Eurovision questions in a quick quiz built for phones and browsers.
description: >-
  A big headline promises five Eurovision songs, and below it there's a Start
  Playing button next to a picker with three difficulty settings, Easy, Regular
  and Expert. Easy narrows the pool to the top five grand-final finishers from
  each year. That cuts out a whole lot of half-forgotten entries before you've
  heard a note.


  Every one of the five rounds kicks off with a clip of a song. Then you've got
  four questions about it, covering the country that sent it, the exact year it
  was in the contest, the artist singing it and the song's title.


  The order never changes, with the country always first and the title saved for
  the end.


  The year question wants the exact one, not a rough era. You pick the artist
  after that, and you close the round by choosing the title. Only then does the
  game reveal the answers.


  Five clips with four questions apiece adds up to twenty answers in a full
  game.


  The screen stays tidy, with dark panels and orange buttons. A How It Works
  panel on the right lays out all four steps before you press start.
