slug: eurotune
title: eurotune
tagline: Answer Eurovision questions in a quick quiz built for phones and browsers.
description: >-
  The start screen offers three difficulty settings, Easy, Regular and Expert,
  and a Start Playing button. Easy mode draws only from the top five grand-final
  finishers of each year. The game plays five Eurovision song clips, one per
  round.


  Each round opens with a clip. You then work through four questions about it:
  the country that entered the song, the exact year it appeared in the contest,
  the performing artist, and the song title. The game reveals the answers at the
  end of the round.


  The questions come in a fixed order. You pick the country first, then the
  year, then the artist, and you finish by choosing the title. A full game is
  five clips, so you answer twenty questions in total.
