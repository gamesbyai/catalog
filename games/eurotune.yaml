slug: eurotune
title: eurotune
tagline: Answer Eurovision questions in a quick quiz built for phones and browsers.
description: >-
  In eurotune you answer questions about the Eurovision Song Contest to find out
  how much you really know about it. It is a quick single-player quiz built for
  phones as well as browsers, so a round works wherever you play: work through
  the questions, pick your answers and see how you did.


  The creator, k_vaiders, says it was made with a partner in mind, which gives
  the project a personal touch. It is a small, focused project made for a game
  jam, built with Cursor, and at Vibe Jam 2026 it came 156th of the 945 entries.


  The theme is clear enough that fans of the song contest can pick it up right
  away. The core is trivia about the contest, with some puzzle elements mixed
  in.
