slug: eurotune
title: eurotune
tagline: Answer Eurovision questions in a quick quiz built for phones and browsers.
description: >-
  You land on a dark screen with a big headline about hearing five Eurovision
  songs and proving you know the stage. A numbered list on the right shows how a
  round goes. Under the headline there's a difficulty switch with an orange
  Start Playing button beside it.


  Each round starts with a song clip. Your job is to pin down the country, the
  year it entered the contest, the artist and the song title before the reveal.


  So that's four separate guesses per song, with no coasting on a catchy chorus.


  The steps run in a set order. You match the country first, then pick the exact
  year, then name the performer, and you finish by choosing the right song
  title, which makes a game five songs long.


  Easy is already selected when you arrive, so you can hit Start Playing right
  away.


  The switch also offers Regular and Expert. On Easy you only hear entries that
  finished in the grand-final top five of their year, so the songs come from the
  contest's biggest results rather than the obscure corners.
