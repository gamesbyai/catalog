slug: eurotune
title: eurotune
tagline: Answer Eurovision questions in a quick quiz built for phones and browsers.
description: >-
  Each game is a quiz on five Eurovision songs, and you answer questions about
  each one.


  Three difficulty levels, Easy, Regular and Expert. Easy pool limited to each
  year's top five grand-final finishers. Twenty answers in a full game.


  Start each round with the clip. Answer the country, the exact year, the artist
  and the title, in that order. Name the year itself, not a rough era. The game
  reveals the answers only after you pick the title.
