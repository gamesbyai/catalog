slug: vibe-city
title: vibe city
tagline: Hang out in a pixel-art isometric town, chat, and play arcade games
description: >-
  One click is all it takes to join vibe city, a cozy isometric hangout built
  around a pixel-art street with rooms to explore. You customize an avatar, look
  around the rooms, and chat with whoever else is online.


  The creator took inspiration from Habbo and a love of many kinds of games,
  aiming for a warm, welcoming neighborhood feel. They built it with Cursor on
  PixiJS as a multiplayer space, it runs on phones and on desktops alike, and it
  placed 493rd of 945 in Vibe Jam 2026.


  The town doubles as an arcade. Inside sit several games from different genres,
  including action, shooter, puzzle, and racing, so a visit can move from
  chatting to a quick round of something else.
