slug: vibe-city
title: vibe city
tagline: Hang out in a pixel-art isometric town, chat, and play arcade games
description: >-
  You wander an isometric pixel-art street as your own avatar, stepping into
  rooms and talking with whoever else is around.


  Chat goes through a box at the bottom of the screen that caps each message at
  72 characters, so everything stays short. Along the top you get buttons for
  your avatar, a list of rooms, a home shortcut and daily goals, plus a coin
  counter.


  The big neon building on the street is the arcade, with a space invader and a
  pink ghost painted on its walls, which tells you pretty clearly what's inside.
  Behind those doors there are games from several genres, including action,
  puzzle, shooter, racing and RPG. It's a funny thing to tuck inside a hangout,
  but it means the place has more to do than talk.


  You don't need an account to join in, and there's nothing to install.


  Habbo was the starting point, along with the creator's love of playing lots of
  different kinds of games. The idea was a warm spot you can step into with one
  click, like a cozy neighborhood. You can customize your avatar, which starts
  out as a plain figure in a white outfit.


  Next to the arcade you'll find hotel-style storefronts with doormats out
  front, cherry trees and flower beds along the sidewalk.
