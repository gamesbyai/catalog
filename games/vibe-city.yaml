slug: vibe-city
title: vibe city
tagline: Hang out in a pixel-art isometric town, chat, and play arcade games
description: >-
  Vibe City puts you on an isometric pixel-art street as a small avatar. The
  street has a hotel, shops under striped awnings, flower beds, trees and street
  lamps.


  Doormats sit outside the building entrances, showing where you can step off
  the street and into a room.


  You're not out there alone, because other players share the street with you.
  The chat box along the bottom takes messages of up to 72 characters, and you
  post them with the Send button. It's a tight limit, closer to a speech bubble
  than a letter.


  Then there's the big neon Arcade, a whole building that's the game's hub for
  play in the middle of what's otherwise a chat hangout. Inside it there's a
  wide spread of genres, including action, puzzle, shooter, racing and RPG, so
  when you want a break from hanging out, you can head in for a round of
  something else.


  A row of buttons across the top handles everything else. ME is where you
  customize your avatar, ROOMS brings up a list of rooms, and a little house
  button takes you home. Daily goals sit beside those, with a coin counter next
  to them.


  vibemaxxer drew on Habbo and a love of many kinds of games, wanting a warm
  place to hang out online that's free and that you can step into without an
  install or an account.
