slug: vibe-city
title: vibe city
tagline: Hang out in a pixel-art isometric town, chat, and play arcade games
description: >-
  Vibe City is a cozy isometric hangout that runs in the browser. Players step
  into a pixel-art street with rooms to explore, customize an avatar, and chat
  with other people who are online. There is no account to create and nothing to
  install, so joining takes a single click.


  The world doubles as a social space and an arcade. Inside it sits an arcade
  with several games from different genres, including action, shooter, puzzle,
  and racing styles, so a visit can move from chatting to a quick round of
  something else. The creator was inspired by Habbo and a love of many kinds of
  games, aiming for a warm, welcoming neighborhood feel.


  The creator built it with Cursor, using PixiJS for the rendering. It was
  submitted to Vibe Jam 2026 and supports multiplayer, and it is set up to work
  on mobile devices as well.
