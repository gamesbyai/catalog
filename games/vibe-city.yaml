slug: vibe-city
title: vibe city
tagline: Hang out in a pixel-art isometric town, chat, and play arcade games
description: >-
  Vibe City puts you on a city street as an avatar, sharing it with other
  players. The Arcade is the building where you go to play games, the hub for
  play in a place that's otherwise mostly for chatting.


  Chat with the other players. Games across action, puzzle, shooter, racing and
  RPG inside the Arcade. Avatar customization. A room list and your own home.
  Daily goals.


  Step through a building entrance to go inside a room. Type a message and press
  Send to post it.


  vibemaxxer drew on Habbo and a love of many kinds of games. The aim was a
  free, warm place to hang out online that you can step into without an install
  or an account.
