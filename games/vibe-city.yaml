slug: vibe-city
title: vibe city
tagline: Hang out in a pixel-art isometric town, chat, and play arcade games
description: >-
  Vibe City starts you as a small avatar on an isometric pixel-art street. Walk
  the block past a hotel, shops with striped awnings, flower beds, trees and
  street lamps. Doormats mark the building entrances, and you step into rooms
  from the street.


  Other players share the street with you. A chat box at the bottom of the
  screen takes messages up to 72 characters, and a Send button posts them.
  Buttons along the top open avatar customization (ME), a room list, a home
  button and daily goals, with a coin counter beside them.


  A neon Arcade building stands on the street and works as the game's hub for
  play. It holds games from several genres, including action, puzzle, shooter,
  racing and RPG, so you can leave the hangout for a round of something else.
  The creator drew on Habbo and a liking for many kinds of games, aiming for a
  warm place to hang out.
