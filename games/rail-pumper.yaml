slug: rail-pumper
title: Rail Pumper
tagline: Pump a rail trolley through a neon city and outrace a CPU rival to a
  million points.
description: >-
  Rail Pumper is a racing game set in a neon-lit cyberpunk city. You play a
  package delivery person riding a hand-pumped rail trolley, competing against a
  computer-controlled rival. Each run is a head-to-head sprint to deliver
  packages and be the first to reach 1,000,000 points.


  The track throws in hazards that break up the pumping rhythm. Steep hills
  change how hard you have to work to keep speed, and rogue grannies wander into
  your path and have to be dodged. The mix of a glowing futuristic backdrop and
  a humble manual trolley gives the race a comic tone.


  The game was an entry in Vibe Jam 2026 and is built with Three.js. The
  creator's information lists Claude Code as the tool used to make it. It is
  marked as multiplayer and playable on mobile devices.
