slug: cozy-paws-clinic
title: Cozy Paws Clinic
tagline: Wash and brush muddy little animal patients in your own vet clinic.
description: >-
  Wash, brush and look after each patient. Many of them arrive caked in mud and
  dotted with burrs.


  Thought bubbles showing what each patient needs, such as a bath, some brushing
  or a look at the teeth. Biscuit the puppy and Honey the bear, among the
  patients on the bench. A collection of nine entries to fill.


  goldiedev drew it all in code. The Web Audio API generates the sounds and
  music, so there are no picture or sound files to fetch.
