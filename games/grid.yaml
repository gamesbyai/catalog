slug: grid
title: GRID
tagline: Play cards to place counters and line up three in a row on a 3×3 board
description: >-
  Get three of your counters in a row on a 3×3 grid to win, the same goal as
  Tic-Tac-Toe. Counters land on the board only when you play a card. Sessions
  last a few minutes.


  A 30-card deck, built before your first move. Over 50 cards across Role and
  Action types. An effect on each card that changes the grid the moment it's
  placed. Certain cells that each card can reach, and no others. The Combo
  system, giving up one card's placement to let another card reach a cell it
  couldn't. Bot matches at three difficulty levels, offline two-player on one
  device, and Draft Mode. Saved decks and an interactive tutorial.


  Draw from your deck each turn, then play cards from your hand. Spend Energy to
  pay each card's cost. Energy starts at 1 on the first turn and climbs each
  turn until it reaches 5.


  According to radiantforce, AI helped with the code, art, sound and text.
