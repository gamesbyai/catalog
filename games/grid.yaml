slug: grid
title: GRID
tagline: Play cards to place counters and line up three in a row on a 3×3 board
description: >-
  A match ends when one side lines up three counters on a 3×3 grid. Counters
  only arrive by playing cards, so before the first move you assemble a 30-card
  deck, then draw from it and play from your hand each turn.


  Every card reaches only certain cells and costs Energy. Your supply is 1 on
  the first turn and rises each turn until it caps at 5. Cards are either Role
  or Action cards, over 50 in all, and each has an effect that alters the grid
  as soon as it is placed.


  The Combo system lets you give up one card's placement sequence so that a
  different card can land on a cell it could not hit by itself.


  The menu offers a bot match at three difficulty levels, an offline two-player
  mode on one device, and Draft Mode. It also has saved decks, a rules page,
  match history, settings and an interactive tutorial. Sessions last a few
  minutes.
