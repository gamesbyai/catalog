slug: grid
title: GRID
tagline: Play cards to place counters and line up three in a row on a 3×3 board
description: >-
  You win by getting three of your counters in a row on a 3×3 board, just like
  Tic-Tac-Toe, except every counter has to come from a card. Before a match you
  build a 30-card deck, so part of the game is settled before anyone places
  anything. Each card can only reach certain cells, which means you can't drop a
  counter wherever you like.


  Playing a card costs Energy, and that cost is part of every decision you make.


  You get 1 Energy on the first turn and a little more each turn after that, up
  to 5, so what you can afford shapes your early choices.


  There are more than 50 cards, split into Role and Action types. Many have a
  deploy ability that changes the board the moment the card lands, so a single
  placement can break up a line your opponent was building. That's a lot of
  rule-bending for a grid with nine cells.


  The Combo system is the odd one out among all of those rules.


  You sacrifice one card's sequence so that another card can go somewhere it
  couldn't reach alone, which is a sensible way around the cell limits.


  You can play a bot at one of three difficulty levels, or share the screen with
  a friend in the offline two-player mode. Draft Mode is there too, along with a
  full tutorial, and everything runs with the mouse.
