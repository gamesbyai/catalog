slug: grid
title: GRID
tagline: Play cards to place counters and line up three in a row on a 3×3 board
description: >-
  Get three of your counters in a row on a 3×3 grid and the match is yours, so
  yes, it's Tic-Tac-Toe underneath. Here, though, counters only show up when you
  play cards. Before your first move you put together a 30-card deck, and then
  each turn you draw from it and play from your hand.


  Every card can only reach certain cells, which turns those nine squares into a
  puzzle about where each card is even allowed to go.


  Cards also cost Energy, and you start with just 1 of it on the first turn.
  Your supply climbs every turn after that until it stops at 5.


  There are over 50 cards, split between Role and Action types. Each one carries
  an effect that changes the grid the moment it's placed. Then there's the Combo
  system, where you give up one card's placement sequence so a different card
  can land on a cell it couldn't hit by itself.


  For a game built on nine squares, the menu is surprisingly full, with bot
  matches at three difficulty levels, offline two-player on one device, and
  Draft Mode.


  Saved decks, a rules page, match history and settings sit next to an
  interactive tutorial, all framed by painted anime-style knights clashing on
  the title screen. Sessions last a few minutes.


  According to radiantforce, AI assisted with the code, graphics, sounds and
  text.
