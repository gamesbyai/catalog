slug: grid
title: GRID
tagline: Play cards to place counters and line up three in a row on a 3×3 board
description: >-
  GRID is a two-player tactical card game played on a 3×3 board. Before a match,
  you build a 30-card deck. Each turn you gain Energy, starting at 1 on the
  first turn and rising to 5, and spend it to play cards from your hand. Every
  card can only reach certain cells, and the first player to form three in a row
  wins.


  Each card carries an ability that triggers when it lands and changes the
  board. The Combo system lets you sacrifice one card's sequence so another card
  can be placed in a cell it couldn't reach alone. The pool has more than 50
  cards split between Role and Action types, which gives deck building real
  weight.


  You can play against a bot at three difficulty levels, try Draft Mode, or
  share a screen for local two-player matches. An interactive tutorial walks new
  players through the rules, and the game runs in the browser with mouse input.
  The jam listing discloses AI assistance for code, graphics, sounds, and text.
