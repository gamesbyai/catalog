slug: one-last-surf
title: One Last Surf
tagline: Ride waves through a surf session that runs from daylight into a starry night.
description: >-
  You're a surfer lying on a board, looking out over the water from first
  person, with the tip of the board and your own arm stretched out in front of
  you. Your job is to paddle into a swell and catch a wave, then stay inside the
  barrel while it curls over your head.


  Start by scanning the swell for its tallest point, because that's where the
  wave will begin to break. Then hold Shift to paddle, which drains a stamina
  bar as you go, and tap Space when you reckon you've got enough speed.


  You'll know right away whether you caught the wave or missed it, no guessing
  involved.


  Once you're on the wave, the trick is staying steady while the barrel forms,
  so you stay tucked inside it. W and S slide you deeper into the wave or
  further ahead on it, and after that you can carve and turn with the WASD keys.
  Press Space again if you want to bail out.


  A guide screen walks through all of this in three steps with little pictures,
  and you can open it with G whenever you like. It's a pretty kind touch that it
  admits a catch usually takes a couple of tries.


  The creator took surfing lessons for a year after school and hadn't surfed for
  two years, so the itch to get back on a board is what started it. Barreling
  waves are famously hard to get, which made them the thing to build around.
  Past the riding, the game wants you to watch the sunset and then look up at
  the stars.
