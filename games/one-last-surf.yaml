slug: one-last-surf
title: One Last Surf
tagline: Ride waves through a surf session that runs from daylight into a starry night.
description: >-
  You paddle out, catch waves and ride them while the day moves on in One Last
  Surf, a relaxed surfing game on the open ocean. Sessions are unhurried,
  centered on getting into the next wave and then staying up on your board.


  The creator drew on a year of surf lessons after school. After two years away
  from surfing, they wanted to capture how hard barreling waves are to ride.
  Claude Code and Three.js were used for the build, and it came 181st of 945 at
  Vibe Jam 2026.


  The sky does a lot of the work. The light shifts through the day into a
  sunset, and once night falls you can look up at the stars, so one session runs
  from daylight into a starry night.
