slug: one-last-surf
title: One Last Surf
tagline: Ride waves through a surf session that runs from daylight into a starry night.
description: >-
  One Last Surf is a relaxed surfing game set on the open ocean. You paddle out,
  catch waves, and ride them while the day moves on. Sessions are meant to be
  unhurried, with no pressure beyond getting into the next wave and staying on
  your board.


  The sky is a big part of the experience. The light shifts through the day into
  a sunset, and once night falls you can look up at the stars. The creator drew
  on a year of surf lessons after school and wanted to capture how hard
  barreling waves are to ride, after going two years without surfing.


  It was made for Vibe Jam 2026 as a browser game built with Three.js, and the
  jam listed it at rank 181 out of 945 entries. The creator built it with Claude
  Code.
