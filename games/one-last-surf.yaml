slug: one-last-surf
title: One Last Surf
tagline: Ride waves through a surf session that runs from daylight into a starry night.
description: >-
  Sit on a surfboard in first person, read the swell for its tallest point, and
  paddle hard enough to catch the wave as it breaks.


  Stamina that drains while you sprint-paddle. A few attempts, usually, before
  you catch one. The barrel as the goal, with the wave curling over you. A day
  of surfing that drifts into sunset and ends under a starry sky. A three-step
  guide card on G.


  Hold Shift to paddle faster and press Space to catch the wave. Use W and S to
  move deeper into the wave or ahead on it, and WASD to carve. Press Space again
  to bail.


  sweriko made it after a year of learning to surf and two years out of the
  water, drawn to getting barreled because it's so hard to pull off.
