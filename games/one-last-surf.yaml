slug: one-last-surf
title: One Last Surf
tagline: Ride waves through a surf session that runs from daylight into a starry night.
description: >-
  You start on a surfboard in first person, looking out at the swell. Find the
  tallest point along it, since that is where the wave will begin to break. Then
  paddle toward it, holding Shift to build speed while a stamina bar drains.


  Press Space when you think you have enough speed to catch the wave. Once you
  are up, stay steady as the barrel curls over you and keep yourself inside it.
  W and S move you deeper into the wave or further ahead on it, and WASD also
  lets you carve and turn. Press Space again to bail out.


  Catching a wave usually takes a few attempts, and the in-game guide says you
  will know right away when you have caught one. A guide screen opens with G.
  The setting is a sunny ocean, and the creator describes a day of surfing that
  moves on to sunset and then a night sky full of stars.


  The creator built it after a year of surfing lessons and two years away from
  the water, with barreling waves as the main draw.
