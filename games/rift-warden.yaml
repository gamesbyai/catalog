slug: rift-warden
title: Rift Warden
tagline: Defend a rift or attack it in asymmetric tower defense against players or bots.
description: >-
  Rift Warden is an asymmetric tower defense game in which each match lets you
  take one of two sides. You can play as the defender, placing towers to stop
  incoming waves, or as the attacker, sending units to break through. Opponents
  can be other players or bots.


  The concept blends balloon-style tower defense with chess, giving the strategy
  a more tactical, board-like feel than a standard wave defender. Because the
  two roles play differently, the same map can be approached from either
  direction. A leaderboard tracks high scores, so runs can be repeated to climb
  the rankings.


  The game supports multiplayer and runs on mobile as well as desktop. It was
  built with Three.js, and the creator says Claude Code was used to make it. It
  was submitted to Vibe Jam 2026.
