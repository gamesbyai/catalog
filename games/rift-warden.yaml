slug: rift-warden
title: Rift Warden
tagline: Defend a rift or attack it in asymmetric tower defense against players or bots.
description: >-
  The start screen asks for a display name, with a color swatch beside it, and a
  choice of side. The Architect builds towers and defends the path. The Attacker
  sends waves to break the line. Each side has a 1v1 button for a match against
  another player and a solo button for a match against an AI.


  A Survival mode is also listed, where the goal is to defend until the core
  falls. Below the menu, tabs show open seats to join, live matches to spectate,
  and a leaderboard for high scores.


  The two sides play differently: one places defenses, the other sends units
  against them. The creator describes it as asymmetric tower defense, drawing on
  balloon tower defense and chess, with matches against other players or bots.
