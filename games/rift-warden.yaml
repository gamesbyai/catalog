slug: rift-warden
title: Rift Warden
tagline: Defend a rift or attack it in asymmetric tower defense against players or bots.
description: >-
  The first screen asks you to pick a side. As the Architect you build towers
  and defend the path, while the Attacker sends waves out to break the line.


  Both roles are playable, which makes this an asymmetric take on tower defense.


  You can take either side in a 1v1 against another person, or go solo against
  an AI opponent. There's also a survival mode where you defend until the core
  falls. Before you start you can type a name and pick a color for yourself.


  The creator describes it as Balloon Tower Defense crossed with chess, which is
  an odd pairing.


  The lobby has tabs for open seats where someone is waiting for an opponent,
  live matches you can spectate, and a leaderboard for anyone chasing high
  scores. Spectating is handy because you can watch a match before you sit down
  in one.
