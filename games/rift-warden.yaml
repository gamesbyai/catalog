slug: rift-warden
title: Rift Warden
tagline: Defend a rift or attack it in asymmetric tower defense against players or bots.
description: >-
  Rift Warden is asymmetric tower defense in which every match lets you pick a
  side of the rift. As the defender you place towers to stop the incoming waves.
  As the attacker you send units to break through. Either way, the opponent is
  another player or a bot.


  Claude Code was used to make it, the creator says, with Three.js as the
  engine, and it placed 270th of 945 in Vibe Jam 2026. The concept is
  balloon-style tower defense crossed with chess, which gives the strategy a
  more tactical, board-like feel than a standard wave defender.


  The two roles play differently, so the same map can be approached from either
  direction. A leaderboard tracks high scores, so a run can be replayed to climb
  the rankings.
