slug: rift-warden
title: Rift Warden
tagline: Defend a rift or attack it in asymmetric tower defense against players or bots.
description: >-
  Play Rift Warden 1v1 against another person, or solo against an AI bot.
  taylordoubleu calls it asymmetric tower defense. You pick your side before you
  play.


  Towers to build and a path to hold, as the Architect. Waves at those defenses
  to break the line, as the Attacker. Survival mode, defending the core until it
  falls. Open seats to join, and other people's live matches to spectate. Bots
  on either side, for trying both roles alone. A leaderboard of high scores.


  Type a display name and pick a color before you start a match.


  taylordoubleu drew on balloon tower defense and chess for this game.
