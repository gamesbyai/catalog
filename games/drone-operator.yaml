slug: drone-operator
title: Drone Operator
tagline: Fly a delivery drone through hazards to drop packages on time and earn cash.
description: >-
  Drone Operator puts you at the controls of a delivery drone over a city. Your
  goal is to deliver packages on time and earn cash.


  Reckless drones in the shared sky. Angry driver who lost his job, out to
  outsmart you. Eagles on patrol in the air. Pet food as a fate to avoid.
  Headquarters inside the city.


  Move with WASD and look around with the mouse. Use Space to rise and Shift to
  drop. Press Q to lower the wire and E to raise it. Press keys 1 to 4 to switch
  the music.


  MoneOunchPan made an earlier game, Dragon World, and built this one to test
  the limits again.
