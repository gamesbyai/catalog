slug: drone-operator
title: Drone Operator
tagline: Fly a delivery drone through hazards to drop packages on time and earn cash.
description: >-
  Drone Operator is a delivery simulation where you pilot a drone carrying
  packages across a city. Each run is about getting parcels to their
  destinations before time runs out, while collecting cash for successful
  drop-offs. Along the way, the route is crowded with obstacles and threats that
  make a simple delivery harder.


  The hazards give the job its personality. Other drones fly recklessly, an
  angry driver who lost his job tries to interfere, and eagles hunt in the
  skies. A wrong move can leave your drone as pet food. It is a multiplayer
  game, so other pilots can share the airspace.


  The creator built it for Vibe Jam 2026 with OpenCode, using Three.js for the
  3D world. They describe it as a follow-up to a project from the previous year,
  made to push their own limits.
