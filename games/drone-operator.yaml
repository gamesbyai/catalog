slug: drone-operator
title: Drone Operator
tagline: Fly a delivery drone through hazards to drop packages on time and earn cash.
description: >-
  Drone Operator puts you at the controls of a delivery drone over a city. You
  fly packages to their destinations before time runs out, collecting cash for
  every successful drop-off, while the route fills up with obstacles and threats
  that make a simple delivery harder.


  The creator made it with opencode and Three.js for Vibe Jam 2026, as a
  follow-up to a project from the previous year, built to push their own limits.
  It is multiplayer, so other pilots can share the airspace, and it ranked 392nd
  of 945 in the jam.


  The hazards give the job its personality. Other drones fly recklessly, an
  angry driver who lost his job tries to interfere, and eagles hunt in the
  skies, so one wrong move can leave your drone as pet food.
