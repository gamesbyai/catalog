slug: everest-troll-summit
title: everest-troll-summit
tagline: Help or sabotage a shared Everest climber alongside thousands of other players.
description: >-
  Everest Troll Summit is a multiplayer browser game built around one shared
  climber making their way up Everest. Every connected player picks a side in
  real time: boost the climber toward the summit as a helper, or get in the way
  as a troll. The climb is a single ongoing contest between the two camps.


  The hook is the crowd. Instead of controlling your own character, you join
  thousands of others pushing the same figure in opposing directions, so the
  outcome depends on which group is more active. It runs in the browser and is
  playable on mobile, which keeps the barrier to joining a session low.


  The creator built it with Claude Code and describes it as a spur-of-the-moment
  idea. It was entered in Vibe Jam 2026 and uses Three.js for its 3D scene.
