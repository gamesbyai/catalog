slug: everest-troll-summit
title: everest-troll-summit
tagline: Help or sabotage a shared Everest climber alongside thousands of other players.
description: >-
  Everyone who joins is watching one climber try to get up Everest, and you
  decide whether to push them toward the summit or drag them back down. The
  climber's name floats over their head with a stamina bar, and a tall meter on
  the left tracks altitude against the 8,849 meter summit.


  When a climber gets picked, a little card asks you to choose a side and hands
  you a made-up reason, like a one-star review left because the waiter looked
  unfriendly. That's a pretty petty excuse for ruining someone's day on a
  mountain.


  The card gives you two choices, Boost or Troll, and that's where you pick your
  side.


  The chosen climber gets a panel of their own with big buttons. One is a step
  button worth 0.1 meters, which sounds tiny next to a summit that high, so it
  takes a lot of steps. There's also an SOS button for calling for help and a
  share button for recruiting more helpers.


  A text box says to shout into the void, so you can chat while the climb plays
  out.


  Around the edges you get a live feed of what people are doing, a hall of fame
  for climbers who make it, and a leaderboard with separate tabs for helpers and
  trolls. Each side gets its own ranking, so the rivalry between them has
  somewhere to show up.
