slug: everest-troll-summit
title: everest-troll-summit
tagline: Help or sabotage a shared Everest climber alongside thousands of other players.
description: >-
  In everest-troll-summit, every player shares one climber on Everest, and every
  player picks a side. Helpers boost the climber toward the summit and trolls
  get in the way, all in real time, so the climb is one ongoing contest between
  the two camps of players.


  The creator describes it as a spur-of-the-moment idea, built with Claude Code
  on Three.js as a multiplayer party game. It ranked 536th of 945 at Vibe Jam
  2026, and it plays on phones as well as in a browser, which keeps the barrier
  to joining low.


  The crowd is the hook. You never control a character of your own. You join
  thousands of others pushing the same figure in opposite directions, and the
  outcome depends on which group is more active.
