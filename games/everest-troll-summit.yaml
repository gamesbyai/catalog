slug: everest-troll-summit
title: everest-troll-summit
tagline: Help or sabotage a shared Everest climber alongside thousands of other players.
description: >-
  A single climber ascends a snowy peak in 3D, and everyone connected decides
  how it goes. Each player picks a side on a prompt: boost the climber toward
  the summit at 8,849 meters, or play troll and drag them back to the bottom.


  When you are the chosen climber, the panel gives you a One Step button worth
  +0.1 meters per press. A stamina bar sits over the climber's head, and a
  vertical altitude gauge on the left tracks height, starting at 5,000 meters in
  the opening view.


  Around the mountain, a live feed lists what players do, and a leaderboard
  splits into Helpers and Trolls. A hall of fame records climbers. A chat box
  lets you shout messages to the crowd, an SOS Help button sends a call for aid,
  and a Share button recruits more helpers.
