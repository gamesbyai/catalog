slug: everest-troll-summit
title: everest-troll-summit
tagline: Help or sabotage a shared Everest climber alongside thousands of other players.
description: >-
  One climber is inching up Mount Everest, and everyone connected gets a say in
  how the climb goes. Each player receives a prompt to choose a side, either
  boosting the climber toward the 8,849-meter summit or playing troll and
  dragging them back to the bottom. The game is built around one open question:
  whether the helpers or the trolls come out on top.


  A made-up crime pinned on the climber, a one-star review over an unfriendly
  waiter. Stamina bar for the climber. Live feed of what players are doing.
  Leaderboard split into Helpers and Trolls. Hall of fame with a record of
  climbers.


  If you're the chosen climber, press the One Step button. Each press adds 0.1
  meters. Shout into the chat box to get the crowd's attention. Press SOS Help
  to call for aid. Press Share to recruit more helpers.


  According to the creator, nickpeanutai made it from a spur-of-the-moment idea.
