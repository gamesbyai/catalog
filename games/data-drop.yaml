slug: data-drop
title: Data Drop
tagline: Steer falling blocks and fill in missing letters to crack passwords
description: >-
  The first screen is a glowing green terminal, and beside the instructions
  there's a pretty clever demo board where a word scanner shows H, a plus-marked
  slot, M and E, meaning HOME is one letter short.


  It's the real game in miniature. Letter-carrying blocks fall down the board
  while each level hides a password with some characters missing, and you steer
  the pieces so the right letters drop into the gaps. Four-letter user passwords
  score points, but five-letter admin passwords are worth more.


  Rows still count, because clearing lines stops the stack from overflowing and
  keeps your connection alive. Cracking the word is the actual objective,
  though, so if you treat it like any other falling-blocks game you'll stall on
  level 1.


  You get fourteen block shapes, plus virus-infected blocks and corrupted
  sectors that you have to clear before they spread across the board.


  A defrag meter charges up and wipes out gaps in the code when it's ready.
  There are 200 security levels, and the intro screen says every 10 unique
  passwords you crack raises the level, with faster falls and bigger payouts
  higher up. Behind it sit a surprisingly large dictionary of over 7000 words
  and 11 board designs that cycle as you go.


  On desktop, you move the mouse to line up a block and double-click to drop it.
  On mobile, a D-Pad, a cycle wheel, a rotate button and a drop button take care
  of the same actions.


  The story casts you as part of a human resistance hacking into the servers of
  its AI overlords, and it's funny to see that in a game the creator says was
  built with AI help. Difficulty rises and eases as you play.
