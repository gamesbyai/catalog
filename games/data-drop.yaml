slug: data-drop
title: Data Drop
tagline: Steer falling blocks and fill in missing letters to crack passwords
description: >-
  Playing alone, you are part of a human resistance hacking into the servers of
  its AI overlords. Each level hides a password with some characters missing,
  and you steer the falling letter blocks so the right letters drop into the
  gaps. Cracking the word is the actual objective, though, so if you treat it
  like any other falling-blocks game you'll stall on level 1.


  Four-letter user passwords scoring points, five-letter admin passwords worth
  more. Line clears that stop overflow and keep the connection alive. Fourteen
  block shapes, virus-infected blocks and corrupted sectors to clear before
  spreading. Defrag meter that wipes out code gaps once charged. 200 security
  levels, one up per 10 unique passwords cracked, with faster falls and bigger
  payouts higher up. A dictionary of over 7000 words and 11 cycling board
  designs. Difficulty that rises and eases as you play.


  On desktop, move the mouse left and right to steer a block, then double-click
  to drop it. Left-click to speed the fall, right-click to rotate, and scroll to
  cycle letter positions. On mobile, steer with the D-Pad, press down to speed
  the fall, and use the cycle wheel, rotate and drop buttons.


  According to AwesomistGames, the game was built with AI help.
