slug: data-drop
title: Data Drop
tagline: Steer falling blocks and fill in missing letters to crack passwords
description: >-
  Blocks carrying letters fall down the board, and each level hides a password
  with some characters missing. Steer the pieces so the right letters land in
  the gaps, spelling four-letter user passwords or five-letter admin passwords,
  which score higher.


  Rows still matter. Clearing horizontal lines keeps the stack from overflowing
  and the connection alive, but cracking the word is the actual objective, so
  playing it like a standard falling-blocks game stalls on level 1. Fourteen
  block shapes appear, along with virus-infected blocks and corrupted sectors
  that you clear before they spread across the board.


  A defrag meter charges up and removes gaps in the code. The game runs through
  200 security levels, uses a dictionary of over 7000 words, and cycles through
  11 board designs. Difficulty rises and eases as you play.


  On desktop, move the mouse to position a block, and double-click to drop it.
  On mobile, a D-Pad, cycle wheel, rotate button and drop button handle the same
  actions.
