slug: trianguloid
title: Trianguloid
tagline: Fly and fight through a 3D arena, shooting enemies on mobile or desktop.
description: >-
  Trianguloid is a 3D arena shooter that runs in the browser on both mobile and
  desktop. The player moves around an arena and fires at enemies in fast
  action-focused rounds. It is a single-player game with no multiplayer mode.


  The project is built around small size and responsive handling. It ships no
  external assets, and the whole thing comes to roughly 350KB gzipped, so
  everything on screen is generated in code. Input feel was a stated priority,
  and the creator lists a snowboard simulator, a hoverboard glider scene from a
  Spider-Man film, Tron, Halo, and Fuzion Frenzy as influences.


  It was entered in Vibe Jam 2026, where it placed 90th out of 945 entries. The
  creator built it with Claude Code on top of Three.js.
