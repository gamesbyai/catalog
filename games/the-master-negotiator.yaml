slug: the-master-negotiator
title: The Master Negotiator
tagline: Haggle with AI characters who remember past deals, buying low and selling high.
description: >-
  The Master Negotiator is a negotiation simulator with a retro CRT look. The
  player buys low, sells high, and talks their way through haggling sessions
  with AI-driven characters. A voice mode lets you speak your offers instead of
  typing them, and each deal turns on how persuasive you are.


  Characters remember how earlier deals went, so burning someone once can affect
  later dealings with them. There is also a multiplayer mode built around PvP
  betrayal contracts, where other players can double-cross you. It also runs on
  mobile.


  The creator wanted to turn a real-life skill into a game so that shy,
  introverted people can practice negotiating and avoid getting scammed. The
  creator built it with Claude Code and entered it in Vibe Jam 2026.
