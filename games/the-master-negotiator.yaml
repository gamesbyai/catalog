slug: the-master-negotiator
title: The Master Negotiator
tagline: Haggle with AI characters who remember past deals, buying low and selling high.
description: >-
  You pick a name or alias that shows up on your profile. Victor Hale, an
  arrogant CEO, hosts a demo-mode tutorial split into four chapters. The
  tutorial is hands-on and runs on the actual game interface, and Victor invites
  you to click the action buttons, starting with "Show me the buy flow", while
  he explains each one. You can retry a step, and if his smugness wears thin
  there's a separate option to skip the tutorial.


  The game itself is haggling, where you buy low, sell high and talk your way
  into better prices against AI-driven characters. Those characters remember how
  you treated them in earlier deals, so the trader you fleeced last time hasn't
  forgotten about it.


  A voice mode lets you speak your side out loud during negotiations, while
  multiplayer brings in PvP betrayal contracts.


  prathampunmiya built it to turn negotiation into a game, so people who find
  social situations hard can practice the skill before facing a real deal.
