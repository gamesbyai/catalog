slug: the-master-negotiator
title: The Master Negotiator
tagline: Haggle with AI characters who remember past deals, buying low and selling high.
description: >-
  You start on a pixel-art CRT monitor, where an arrogant CEO named Victor Hale
  offers to walk you through buying and selling.


  The tutorial runs four chapters in a demo mode that uses the real game screen.
  You click the action buttons to try them, he explains what each one does, and
  a back button lets you redo a step. You can also skip it if you'd rather
  figure things out yourself.


  After that it's a haggling sim where you buy cheap and sell high by talking
  your way into good deals. An AI plays the people across the table, so you're
  negotiating in conversation instead of picking from fixed offers.


  There's a voice mode too, so you can do your haggling by talking out loud
  instead of typing.


  The characters hold grudges, which is a funny thing to build into a trading
  game. If you burn one of them, they remember it next time you meet. There's
  also a multiplayer mode with betrayal contracts, where you're up against other
  players.


  The creator made it so shy people could practice negotiating without getting
  scammed in real life. Before you begin, it asks what name you want on your
  profile.
