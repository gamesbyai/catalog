slug: the-master-negotiator
title: The Master Negotiator
tagline: Haggle with AI characters who remember past deals, buying low and selling high.
description: >-
  A chunky retro CRT monitor frames everything, and one of its screens asks what
  they should call you, taking a name or alias that shows up on your profile.


  Another screen belongs to Victor Hale, an arrogant CEO in a monogrammed
  hoodie, who hosts a demo-mode tutorial split into four chapters. It's
  surprisingly hands-on because it runs on the actual game interface, and Victor
  invites you to click the action buttons, starting with "Show me the buy flow",
  while he explains each one. A back button lets you retry a step, and if his
  smugness wears thin there's a separate option to skip the tutorial.


  The game itself is haggling, where you buy low, sell high and talk your way
  into better prices against AI-driven characters. Those characters remember how
  you treated them in earlier deals, so the trader you fleeced last time hasn't
  forgotten about it.


  A voice mode lets you speak your side out loud during negotiations, while
  multiplayer brings in PvP betrayal contracts, which fits a cast that holds
  grudges.


  prathampunmiya built it to turn negotiation into a game, so people who find
  social situations hard can practice the skill before facing a real deal.
