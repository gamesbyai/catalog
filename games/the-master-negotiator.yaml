slug: the-master-negotiator
title: The Master Negotiator
tagline: Haggle with AI characters who remember past deals, buying low and selling high.
description: >-
  The Master Negotiator is a haggling game with a retro CRT look. You buy low,
  sell high, and talk your way through haggling sessions with AI-driven
  characters, typing your offers or speaking them in voice mode, and every deal
  turns on how persuasive you are.


  The creator wanted to turn a real-life skill into a game, so that shy,
  introverted people can practice negotiating and avoid getting scammed. The
  creator used Claude Code, and the game came 382nd of 945 entries in Vibe Jam
  2026.


  The characters remember how earlier deals went, so burning someone once can
  come back at you later. A multiplayer mode adds PvP betrayal contracts, where
  other players can double-cross you, and all of it works on a phone too.
