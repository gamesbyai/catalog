slug: the-master-negotiator
title: The Master Negotiator
tagline: Haggle with AI characters who remember past deals, buying low and selling high.
description: >-
  AI-driven characters haggle with you, and you buy low, sell high and talk your
  way into better prices.


  A demo-mode tutorial hosted by Victor Hale, an arrogant CEO. Traders who
  remember how you treated them in earlier deals. Voice mode for speaking your
  side of a negotiation out loud. Multiplayer PvP betrayal contracts.


  The four-chapter tutorial is hands-on and runs on the real game interface.
  Click the action buttons Victor explains, starting with the buy flow.


  prathampunmiya built it to turn negotiation into a game, so people who find
  social situations hard can practice the skill before facing a real deal. The
  creator writes, "Just wanted to gamify a skill required in real life."
