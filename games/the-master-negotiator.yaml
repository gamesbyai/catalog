slug: the-master-negotiator
title: The Master Negotiator
tagline: Haggle with AI characters who remember past deals, buying low and selling high.
description: >-
  A retro CRT monitor frames the screen. One screen asks "What do they call
  you?" and takes a name or alias that is shown on your profile. Another is a
  demo-mode tutorial hosted by Victor Hale, an arrogant CEO character in a
  monogrammed hoodie.


  The tutorial is split into four chapters and runs on the actual game
  interface. Victor invites you to click the action buttons, starting with "Show
  me the buy flow", and explains what each one does. A back button lets you
  retry a step, and a separate option skips the tutorial.


  The game itself is haggling: buy low, sell high, and talk your way to a better
  price against AI-driven characters. Those characters remember how you treated
  them in earlier deals. A voice mode lets you speak during negotiations, and
  multiplayer adds PvP betrayal contracts.


  The creator built it to gamify negotiation, so that people who find social
  situations hard can practice the skill before facing a real deal.
