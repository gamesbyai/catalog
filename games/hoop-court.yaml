slug: hoop-court
title: Hoop Court
tagline: Play 2-on-2 basketball against the Rivals, first to 15, shooting over
  defenders.
description: >-
  You play 2-on-2 against the Rivals in this third-person hoops game, first to
  15.


  When it starts, you're looking at a navy-and-gold arena with a HOME and RIVALS
  scoreboard at the top. The game clock keeps running while there's a shot clock
  sitting above the rim.


  A live stat line keeps tabs on your scoring, including field goals and threes,
  plus your steals and blocks. For a 2-on-2 game, that's a surprising amount of
  bookkeeping, with the defense counted right alongside the points.


  You can rise up for a jumper over a defender. You can also mix it up in the
  paint. You can even watch the ball roll around the rim.


  To keep your matchup in view with four players on the floor, each one gets a
  glowing ring on the hardwood.


  If you're not ready for the real thing, the title screen offers Training and
  Shootaround. Training has you dribble through a cone slalom, finish at the
  rim, and then go around the world against the clock. Shootaround is the
  practice option where it's only you and the rim, which makes sense for getting
  some reps in.


  Controller support is aimed at couch-style play. The creator built it for
  short sessions.
