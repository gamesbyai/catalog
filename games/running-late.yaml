slug: running-late
title: RUNNING LATE
tagline: Sprint and wall-jump through 30 commuter rooms while deaths add time to
  your clock
description: >-
  You run, jump and wall-jump through a string of short rooms that make up one
  commute, and you hold the jump button longer to go higher. Moving trains,
  timed gates and pressure plates get in your way, so you're reading the room as
  much as steering through it.


  Every room has an orange validator you have to land on before the exit opens.
  That's what forces you onto the intended jumps, walls and moving-platform
  landings instead of letting you skip past them.


  Dying is instant, and the room restarts in under a quarter of a second.


  Each death adds twenty seconds to the clock, and the clock doesn't reset when
  you do. A run is 30 rooms against a 24-minute limit, which makes every mistake
  cost you something even though retrying is so quick.


  Between legs you pick Local, Express or Shortcut, and you can't take the
  choice back.


  The 30 rooms come from 35 hand-built modules, picked from a journey seed
  that's fresh each time you start a commute. You can copy the seed to replay
  the same route, which suits retrying a run you nearly nailed. Afterward you
  get all 30 splits, your route history, your deaths and a classification of how
  you arrived.


  The difficulty climbs through five tiers, from plain jumping to wall-jumps,
  moving platforms, timed gates and pressure plates, then rooms that combine
  them. Touch controls show up in landscape, and the settings let you set music
  and effects separately, turn on reduced motion or go fullscreen.
