slug: running-late
title: RUNNING LATE
tagline: Sprint and wall-jump through 30 commuter rooms while deaths add time to
  your clock
description: >-
  A commute becomes a run of 30 rooms against a 24-minute clock. You run,
  control jump height by holding the button, and rebound between walls. Each
  room has an orange validator you must land on before the exit unlocks. Rooms
  include moving trains, timed gates, and pressure plates.


  Every death adds twenty seconds to the clock, and the clock does not reset
  when you do. Deaths are instant, and a failed room restarts in under a quarter
  second. The game has coyote time, input buffering, wall-slide, and wall-jump.


  Between legs you pick Local, Express, or Shortcut, and the choice cannot be
  undone. The 30 rooms are selected from 35 hand-built modules by a journey seed
  shown on the start screen. You can edit or copy the seed, retry the same one,
  or start a new commute with a fresh seed.


  The game records all 30 splits, route history, deaths, and how you arrived.
  Mechanics come in five tiers, from basic jumping up to combinations of
  everything. Settings cover separate music and effects volume, reduced motion,
  and fullscreen. Landscape touch controls are included.
