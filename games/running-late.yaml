slug: running-late
title: RUNNING LATE
tagline: Sprint and wall-jump through 30 commuter rooms while deaths add time to
  your clock
description: >-
  An ordinary commute is stretched into a chain of rooms, with a 24-minute clock
  running the whole way. You run and bounce between walls, and each room has a
  validator you land on before its exit unlocks.


  Thirty rooms picked by a journey seed from 35 hand-built modules. Five tiers
  of mechanics, from plain jumping to everything combined. Moving trains, timed
  gates and pressure plates. Coyote time, input buffering, wall-slide and
  wall-jump. Local, Express and Shortcut choices between legs, with no going
  back. Twenty seconds added per death, on a clock that doesn't reset on
  restart. Same-seed retries to shave down a commute, with all 30 splits,
  deaths, route history and arrival records kept.


  Move with A and D, or the arrow keys. Hold W, Space or Up for a higher jump.
  Die and the room restarts at once, in under a quarter of a second. Choose your
  route with a click, a tap, or keys 1, 2 or 3. Edit or copy the journey seed,
  or start a new commute with a fresh one. Use the touch controls in landscape
  orientation.


  0x00000000 used generative AI to help with the code, the copy, three transit
  backgrounds, the commuter's animation sheet and the base cover art. The
  layout, typography, gameplay surfaces, effects and final asset prep were done
  and reviewed for this release. The music and sound effects are synthesized
  live as you play. It's episode 002 of a series called Better Than Scrolling.
