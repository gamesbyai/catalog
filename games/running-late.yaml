slug: running-late
title: RUNNING LATE
tagline: Sprint and wall-jump through 30 commuter rooms while deaths add time to
  your clock
description: >-
  RUNNING LATE is a precision platformer about a commute that turns into one
  long near miss. A run is 30 rooms, drawn from a pool of hand-built modules.
  You run, control jump height, rebound off walls, and time your moves around
  trains and gates. Each death adds twenty seconds to the clock, and the room
  restarts almost instantly.


  Between legs you pick Local, Express, or Shortcut, a choice that can't be
  undone and sets how readable or direct the next stretch is. Difficulty climbs
  through five tiers, from basic jumps to wall-jumps, moving platforms, timed
  gates, pressure plates, and combinations. Jump control includes coyote time
  and input buffering.


  Each new commute uses a fresh seed, and you can retry the same seed or copy it
  to practice. Results show all 30 splits, route history, deaths, and an arrival
  rating. The look is a two-ink palette with shape and pattern cues. The creator
  states generative AI helped with code, copy, backgrounds, and the commuter
  animation sheet, while music and effects are synthesized at runtime.
