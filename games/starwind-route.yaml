slug: starwind-route
title: Starwind Route
tagline: Sail a Mediterranean trade route, recruit tavern companions, and dodge pirates.
description: >-
  Starwind Route is a 3D sailing adventure set along a Mediterranean trade
  route. The player moves a ship between ports, buys and sells goods, and
  chooses which stretches of sea to cross. Some routes are riskier than others,
  and pirate waters threaten the ship and its cargo.


  The game draws on older sailing RPGs. Taverns are where the player meets
  companions and builds bonds with them, adding a character-driven layer on top
  of the trading and route planning. Trade, danger, and relationships all feed
  into the journey.


  A portal is the Vibe Jam addition. Once unlocked, it turns the voyage into a
  stepping stone that leads on to the next game in the jam. The creator built it
  with ChatGPT and Three.js, and it runs on mobile as well.
