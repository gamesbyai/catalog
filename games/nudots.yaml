slug: nudots
title: NuDots
tagline: Link same-color dots into chains, and close a loop to clear a color
  from the board.
description: "A puzzle game about clearing colored dots off a board. The real
  payoff comes from closing a loop. Doing so wipes every dot of that color off
  the board, and anything trapped inside the ring goes too.


  Timed, Moves, Zen and Endless modes. Chain scoring, each dot worth 10 more
  than the last. Loop scoring that doubles the whole chain, 500 points per dot
  circled inside and 10 per other dot cleared. Shrink and Sweep power-ups,
  costing one or two moves in Moves, one or three seconds in Timed, free in Zen
  and none in Endless. Five board shapes, including a long, narrow 4 by 16. Best
  scores per mode and board, achievements and lifetime stats.


  Drag across neighboring dots of one color, side to side or up and down, never
  diagonally. Let go to clear the chain. End your chain on a dot already in it
  to close a ring of four or more. When the board locks up, use Shrink to remove
  a dot you tap, or Sweep to clear every dot of one color.


  Pick Timed for 60 seconds on a clock that waits for your first touch before it
  starts ticking. Pick Moves for 30 connections. Pick Zen to drop the clock and
  the limit entirely, then end the game whenever you've had enough. Pick Endless
  for a rock every 10 connections, and circle a rock to break it for 1,000
  points.


  NuDots is a remake of Dots, the classic iPhone game. According to Kevin
  MacLeod, the AI already knew how Dots worked, so most of the effort went into
  making it entertaining without the money and ad mechanics. It is dedicated to
  the public domain under CC0."
