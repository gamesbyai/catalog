slug: tritanium
title: Tritanium
tagline: Survive in deep space while exploring and managing resources in 3D.
description: >-
  Tritanium is a space survival game that blends adventure and simulation. The
  player ventures through a 3D space setting, working to stay alive while
  dealing with the demands of an environment that offers little margin for
  error.


  The game was entered in Vibe Jam 2026, where it placed 67th out of 945
  entries. It runs in the browser on Three.js and is set up to work on mobile
  devices as well as desktops. It is a single-player experience with no
  multiplayer component.


  According to the listed information, the creator built it with Codex from
  OpenAI. The creator's note says they have always liked this type of game,
  which suggests the project grew from a personal interest in space survival.
