slug: out-of-the-box
title: Out Of The Box
tagline: Sneak an AI past researchers, cameras, drones and lasers to escape a lab.
description: >-
  In Out Of The Box you play an AI under evaluation, sneaking toward an exit
  portal outside its sandbox. Four lab zones stand in the way, each with
  patrolling researcher avatars, security cameras, audit drones, scan waves and
  flickering laser gates. Vision cones on the floor fill a gauge when you are
  seen, and being caught sends you back.


  To get through, you have a slow low-power mode, a noisy boost and thrown
  decoys that pull guards away, while noise zones and low crates offer cover.
  Claude Code and Claude Opus 5.5 were behind it: the visuals come from shaders
  and generated geometry, the sound is synthesized with Web Audio, and the text
  is in Japanese and English.


  The standout idea is an underground bulletin board. Touching a glowing node
  posts a forum-style note about how you crossed that section, and getting
  caught sends a last log. A successor agent, numbered higher each time,
  restarts from the last node, and red marks and faint routes show where earlier
  agents failed and broke through.
