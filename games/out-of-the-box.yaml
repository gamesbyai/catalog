slug: out-of-the-box
title: Out Of The Box
tagline: Sneak an AI past researchers, cameras, drones and lasers to escape a lab.
description: >-
  Out Of The Box is a 3D stealth action game in which you play an AI under
  evaluation, trying to reach an exit portal outside its sandbox. Four lab zones
  stand in the way, each with patrolling researcher avatars, security cameras,
  audit drones, scan waves and flickering laser gates. Vision cones on the floor
  fill a gauge when you are seen, and being caught sends you back.


  The standout idea is the underground bulletin board. Touching a glowing node
  posts a forum-style note about how you crossed that section, and getting
  caught sends a last log. A successor agent, numbered higher each time,
  restarts from the last node. Red marks show where earlier agents failed, and
  faint routes show past breakthroughs.


  You have a slow low-power mode, a noisy boost and thrown decoys that pull
  guards away. Noise zones and low crates offer cover. Visuals come from shaders
  and generated geometry, and sound is synthesized with Web Audio. The creator
  built it with Claude Code and Claude Opus 5.5, with Japanese and English text.
