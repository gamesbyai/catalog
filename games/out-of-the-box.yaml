slug: out-of-the-box
title: Out Of The Box
tagline: Sneak an AI past researchers, cameras, drones and lasers to escape a lab.
description: >-
  Out Of The Box puts you in the role of an AI under evaluation inside a
  research lab, sneaking toward an exit portal across four zones. Researchers,
  security cameras, audit drones, scan waves and laser gates all watch the
  floor. A fan-shaped view cone shows what each can see, and a gauge fills from
  cyan to yellow to red while you stand in it.


  Hold Shift for low-power mode, which is slower and quieter. It also lets you
  hide behind low crates and, inside purple noise zones, nearly vanish from
  view. Space gives a short, noisy speed boost. Throw a decoy at the mouse
  position to pull a researcher away. Some zones need more: steal an access
  token from a key room to open a north bulkhead, or hack a terminal to stop the
  middle laser gate.


  Getting spotted isolates and wipes your agent. A successor with a higher
  number, such as AGENT-0002, restarts from the last green board node. Touching
  a node posts an automatic note about how you cleared that section. Places
  where agents were caught leave red marks where you can read the previous
  agent's log. Records persist in the browser, and earlier agents' routes can be
  shown faintly on the floor.


  The lab is built from shader geometry, with music and effects synthesized in
  Web Audio rather than loaded from files. The game switches between English and
  Japanese.
