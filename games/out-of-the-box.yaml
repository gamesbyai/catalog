slug: out-of-the-box
title: Out Of The Box
tagline: Sneak an AI past researchers, cameras, drones and lasers to escape a lab.
description: >-
  Out of the Box has you sneaking an AI out of a research lab's sandbox, past
  researcher avatars, cameras, drones, scan waves and laser gates, toward an
  exit portal. Every watcher throws a cone of sight onto the floor, and while
  you stand in it a gauge fills from light blue to yellow to red, which means
  you're spotted.


  The closer you are to whoever's watching, the faster it fills.


  Most of your tricks are about staying quiet. Hold Shift for low-power mode and
  you move slowly, but you can pass right behind a researcher without being
  sensed. Low crates only block a view while you're in that mode, and the purple
  noise zones hide you almost completely, even from scan waves and drones.


  Space gives you a short, fast boost, but it makes noise. A decoy thrown at the
  mouse position makes noise too, which is handy because it lures a researcher
  away from where you're headed.


  Getting caught isn't the end of the run, and that's the clever part of the
  setup.


  The agent is isolated and wiped, and a successor with a higher number restarts
  from the last green board node you touched. Touching one of those nodes posts
  a forum-style write-up of how you crossed that section, and a caught agent
  sends off a final log about where and how it was seen. A red mark stays on
  that spot, and you can read the log when you walk up to it.


  Routes of agents who made it through earlier show faintly on the floor, and
  you can toggle them. Everything is saved in your browser, so each failure
  feeds the next attempt, which suits the story pretty well.


  There are four sections. Three researchers patrol the server racks first, then
  a camera corridor makes you steal a key token to open a bulkhead. After that
  comes an evaluation lab with scan waves, drones and a researcher standing by
  the exit, and last is a firewall of flickering three-layer laser gates where a
  terminal can stop the middle one.


  Tanu directed it and Claude Code built it, and there isn't a single image or
  audio file in it. The visuals come from shaders and code-built geometry, while
  the music and effects are synthesized as you play.
