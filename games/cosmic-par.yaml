slug: cosmic-par
title: Cosmic Par
tagline: Sink mini-golf shots on a daily space course where gravity curves the
  ball's path.
description: >-
  Line up a stroke and send the ball across a mini-golf course in space, where
  gravity bends every shot away from a straight line. Sink it in as few strokes
  as you can.


  A new course each day, the same for every player that day. Never-repeated
  courses, according to the creator. Easy-to-compare scores across players.


  According to the creator, they asked AI to brainstorm ideas about the game
  itself.
