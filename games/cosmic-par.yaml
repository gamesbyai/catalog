slug: cosmic-par
title: Cosmic Par
tagline: Sink mini-golf shots on a daily space course where gravity curves the
  ball's path.
description: >-
  Cosmic Par is mini-golf in space, where gravity bends every shot. You line up
  a stroke, send the ball across the course and watch its path curve instead of
  running straight, trying to sink it in as few strokes as you can.


  The concept is golf plus space, and the creator says they asked AI to
  brainstorm the idea for the game. It was built with Claude Code on Three.js,
  supports multiplayer, and Vibe Jam 2026 ranked it 317th of the 945 entries.


  The hook is the daily course. Everyone who plays on a given day gets the same
  new layout, and the creator says courses are never repeated. That makes scores
  easy to compare, and each day brings a fresh puzzle to come back for.
