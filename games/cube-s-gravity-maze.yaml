slug: cube-s-gravity-maze
title: Cube's Gravity Maze
tagline: Flip gravity to run mazes, dodge traps, collect keys, and beat the Core
  Guardian boss
description: >-
  Pressing Space flips gravity, so the green cube falls toward the ceiling or
  the floor of a randomly generated maze. You move left and right with the arrow
  keys. An on-screen hint says to find the key or exit and break obstacles along
  the way.


  The maze holds turrets that fire on sight, ghostly pursuers, wandering
  walkers, spiked wheels, crumbling blocks and spike traps. Red and blue phase
  walls can be made passable with the Phase skill. Skills are found inside the
  maze: Q dashes with invulnerability, W toggles phase walls, and E performs a
  spin slash that uses energy.


  Pickups include shields, coins that give energy and extra protection, time
  orbs and a compass that points to keys and exits. Special chambers packed with
  hazards pay out gold coins. Deep in the maze the Core Guardian boss waits, and
  it has an enraged mode. A results screen records score, deaths and clear time,
  and the top bar shows level, score, timer and death count. Controls can be
  remapped from the pause menu.
