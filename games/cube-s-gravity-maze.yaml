slug: cube-s-gravity-maze
title: Cube's Gravity Maze
tagline: Flip gravity to run mazes, dodge traps, collect keys, and beat the Core
  Guardian boss
description: >-
  You play a little green cube in a randomly generated maze, and your one trick
  is flipping gravity. Tap a button and you drop from the floor to the ceiling,
  so every corridor becomes a question of when to flip.


  The maze is full of things that want you gone, and they don't all act the
  same. Ghosts chase you, turrets fire the moment they spot you, walkers pace
  back and forth, and spiked wheels roll around in a chaotic way. Crumbling
  blocks collapse when you touch them, and there are spike traps too.


  You're looking for keys and an exit, and somewhere deep down sits the boss
  that controls the whole maze, the Core Guardian. Once the fight heats up it
  switches to an Enraged Mode, and you have to live through that to win.


  Skills are scattered through the maze, so you pick them up as you go. Dash
  makes you invulnerable while you're dashing, Phase toggles the red and blue
  blocks so you can pass through them, and Spin Slash is a strong attack that
  spends energy. Coins refill that energy and give you some extra protection,
  which is a neat reason to go grab them.


  Consumables are hidden around as well. Shields help you survive, Time Orbs let
  you control the tempo, and a Compass points you to keys and exits.


  Special chambers deep in the maze are packed with hazards, but they pay out a
  pile of gold coins if you're brave enough to walk in.


  When a run ends, a results screen shows your score, your death count and your
  clear time. You can rebind the keys from the settings menu behind the pause
  button in the top-left corner.
