slug: cube-s-gravity-maze
title: Cube's Gravity Maze
tagline: Flip gravity to run mazes, dodge traps, collect keys, and beat the Core
  Guardian boss
description: >-
  Cube's Gravity Maze is a short action-platformer set in randomly generated
  mazes. You guide a cube with the left and right arrow keys and flip gravity
  with the spacebar to cross traps, mechanisms, and monsters. Each run is a hunt
  for the keys that open the way deeper, ending at the boss that controls the
  maze.


  Skills found in the maze add options: a dash that makes you invulnerable, a
  phase ability that toggles red and blue blocks, and an energy-powered spin
  slash. Enemies behave differently, including ghostly pursuers, turrets that
  fire on sight, wandering walkers, and spiked wheels. Crumbling blocks and
  spikes keep the route tense.


  Special chambers deep in the maze hold heavy hazards and a payout of gold
  coins. Items include shields, time orbs, and a compass that points to keys and
  exits. The Core Guardian boss has an Enraged Mode, and a results screen
  records score, deaths, and clear time. Controls can be remapped from the pause
  menu. The jam entry lists AI assistance with code.
