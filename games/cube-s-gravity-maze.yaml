slug: cube-s-gravity-maze
title: Cube's Gravity Maze
tagline: Flip gravity to run mazes, dodge traps, collect keys, and beat the Core
  Guardian boss
description: >-
  Hitting Space flips gravity, so the little green cube falls toward either the
  ceiling or the floor of a randomly generated maze. The left and right arrow
  keys handle the rest of your movement. A hint at the bottom of the screen lays
  out the plan, which is to find the key or the exit and break obstacles on your
  way.


  The maze is crowded with things that want you dead. Turrets shoot as soon as
  they spot you, ghostly pursuers come after you and walkers wander around,
  while spiked wheels, crumbling blocks and spike traps fill in the gaps.


  Red and blue phase walls add a wrinkle to the layout, and you can make them
  passable with the Phase skill.


  Your skills turn up inside the maze itself. Q is a dash that keeps you
  invulnerable while it lasts, W switches the phase walls, and E is a spin slash
  that burns energy. Coins refill that energy and give you extra protection on
  top, a tidy way to tie spending to collecting.


  Other pickups include shields, time orbs and a compass that points you to keys
  and exits.


  Special chambers stuffed with hazards pay out gold coins. Deep in the maze,
  the Core Guardian boss waits, and it has an enraged mode you'll have to
  survive as well.


  The top bar tracks your level, score and timer, with a little skull counting
  your deaths. Once you finish, a results screen records your score, deaths and
  clear time.


  If the default keys don't suit you, you can remap the controls from the pause
  menu in the top-left corner.


  Inkling123 built the game with AI assisting on the code, according to the
  creator.
