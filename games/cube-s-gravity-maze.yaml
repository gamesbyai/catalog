slug: cube-s-gravity-maze
title: Cube's Gravity Maze
tagline: Flip gravity to run mazes, dodge traps, collect keys, and beat the Core
  Guardian boss
description: >-
  Flip gravity to make your cube fall toward the ceiling or the floor of a
  randomly generated maze. Your job is to find the key or the exit, and you can
  break obstacles along the way.


  Automated turrets that fire once they spot you. Ghostly pursuers that come
  after you, and walkers that wander. Spiked wheels, crumbling blocks and spike
  traps. Red and blue phase walls that the Phase skill can make passable.
  Shields, time orbs and a compass for finding keys and exits. Special chambers
  full of hazards that pay out gold coins. A Core Guardian boss deep in the
  maze, with an enraged mode to survive.


  Press Space to flip gravity. Use the left and right arrow keys to move. Find
  skills inside the maze. Press Q to dash, which keeps you invulnerable while it
  lasts. Press W to toggle the red and blue phase walls. Press E for a spin
  slash that burns energy. Collect coins to refill energy and gain extra
  protection. Finish the maze to have your score, deaths and clear time
  recorded. Remap the controls if the default keys don't suit you.


  According to the creator, Inkling123 built the game with AI assisting on the
  code.
