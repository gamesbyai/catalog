slug: game-7-30
title: 7/30
tagline: Play a poker-inspired card game built to depend less on luck
description: >-
  7/30 is a multiplayer card game that takes its cue from poker. It is pitched
  as a strategy game where skill counts for more than the draw of the deck, so a
  session comes down to weighing your hand against your opponents' and deciding
  how much to commit.


  The design answers a common poker complaint: strong players losing hands to
  bad beats. By cutting back the role of chance, the game aims to reward good
  decisions over lucky river cards. The creator frames it as a more
  lucrative-feeling take on card play.


  It is set up to work on both desktop and mobile browsers. It was entered in
  Vibe Jam 2026, where it placed 167th out of 945 entries in the final ranking.
