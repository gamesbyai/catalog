slug: drone-wars
title: Drone Wars
tagline: Pilot a combat drone and fight through shooter missions with a full arsenal.
description: >-
  Drone Wars puts you in control of a combat drone and sends it into battle,
  mission after mission. It is a 3D action shooter built around aerial combat:
  you fly through shooter missions and take on enemies with a full arsenal of
  weapons at your disposal.


  The idea comes from the creator's own enthusiasm for drones. The creator,
  shrimalmadhur, has flown several of them, and that firsthand interest shapes
  the game's focus on drone piloting and drone warfare.


  Action and adventure elements sit alongside the shooting in this single-player
  game. It was built with Codex on Three.js, plays on phones as well as
  desktops, and placed 91st of 945 at Vibe Jam 2026. The drone is both your
  vehicle and your weapon platform in every fight.
