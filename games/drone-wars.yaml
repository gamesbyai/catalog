slug: drone-wars
title: Drone Wars
tagline: Pilot a combat drone and fight through shooter missions with a full arsenal.
description: >-
  Drone Wars puts you in control of a combat drone, flying it through waves of
  enemies that keep escalating. Before each run you pick a callsign and one of
  two maps, then launch and try to survive every wave while you rack up salvage.


  That salvage is what carries over, because you spend it on permanent upgrades
  between runs and the hangar keeps them, so every relaunch starts from a drone
  that's a bit stronger than the last one.


  There are plenty of keys to learn, since thrust, yaw, pitch, strafe and
  altitude each get their own. W and S handle thrust while A and D yaw, Q and E
  change altitude, and the arrow keys cover strafing and pitch. Space fires, F
  triggers the active ability you've unlocked, and P and R pause or restart.


  For a game built around quick runs, there's a surprising amount layered on top
  of the basic loop, with run mutators, boss waves, wave directives and missions
  all part of this build.


  The menu tracks your best score, your best wave, your achievements and how
  much salvage you've banked. Your callsign, preferred battlefield and current
  build are remembered in the browser, which is a small kindness when you come
  back for another go.


  shrimalmadhur has flown several drones and built the game around that
  interest, aiming for fast combat in quick runs.
