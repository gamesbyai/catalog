slug: drone-wars
title: Drone Wars
tagline: Pilot a combat drone and fight through shooter missions with a full arsenal.
description: >-
  Drone Wars sends you flying a combat drone through waves of escalating
  enemies. Try to survive every wave while you collect salvage.


  Permanent upgrades bought with salvage between runs and kept in the hangar,
  each relaunch starting a bit stronger than the last. Boss waves, run mutators
  and wave directives. Missions and achievements. Callsign, preferred
  battlefield and current build remembered in the browser.


  Pick a callsign and one of two maps before each run, then launch. Thrust, yaw,
  pitch, strafe and altitude each get their own keys, and there are plenty to
  learn. Use W and S for thrust, A and D for yaw, Q and E for altitude, and the
  arrow keys for strafe and pitch. Press Space to fire, and F to trigger the
  active ability you have unlocked.


  shrimalmadhur has flown several drones and built the game around that
  interest, aiming for fast combat in quick runs.
