slug: drone-wars
title: Drone Wars
tagline: Pilot a combat drone and fight through shooter missions with a full arsenal.
description: >-
  Drone Wars has you pick a callsign, choose one of two maps, and launch a run
  in which you fly a drone through escalating waves of enemies. The goal is to
  survive each wave and earn salvage, which you spend on permanent upgrades
  between runs.


  The hangar keeps those upgrades, so each relaunch starts from a stronger
  drone. Your callsign, preferred battlefield, and current build are remembered
  in the browser. The menu also tracks best score, best wave, achievements, and
  your salvage total.


  The build includes unlockable abilities you trigger with a key, run mutators,
  boss waves, wave directives, and missions. Flight uses separate keys for
  thrust, yaw, pitch, strafe, and altitude, with other keys for firing, pausing,
  and restarting.


  The creator has flown several drones and built the game around that interest,
  aiming for fast combat in quick runs.
