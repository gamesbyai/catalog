slug: spear-gate
title: Spear Gate
tagline: Whirl a spear through demon ranks and break the gate before sunset.
description: >-
  You whirl your spear in broad red arcs that glow as they cut through a bunch
  of horned, armored demons. You're a warrior in red and white, seen in third
  person. Every hit you land bumps up your running total as the demons press in.


  You've got to bring down all three demon officers who are holding the plain.
  You also have to force the gate open. The Gate Warden has to go down before
  sunset.


  Surprisingly, the targets are few for a battlefield this packed.


  When the game starts, the countdown in the top left reads 10:00 against a
  plain that's already crowded with demons. Wooden palisades and watchtowers
  ring the dusty plain beneath all that on-screen info, which makes the opening
  screen look pretty busy.


  A named officer such as Gorrak the Ironhide gets a health bar up top, which is
  oddly formal treatment for a demon you're trying to cut down. The bar tells
  you which officer you're hunting, while the radar picks out the foes around
  you. A tally on screen tracks which of the three officers are still in the
  fight.


  Your health and power gauge sits on screen while you're fighting, which makes
  sense when there's this much going on around you.


  The whole thing's real-time action. You choose which fights to take in the
  crowd. You keep pushing toward the gate.
