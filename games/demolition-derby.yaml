slug: demolition-derby
title: Demolition Derby
tagline: Ram other players' cars in a dusty arena until one is left running
description: >-
  You drive a car into other people's cars inside a dusty round arena, with a
  chain-link fence overhead and strings of pennants hanging along it. The other
  drivers are strangers sharing the arena with you online. Each round runs
  against a countdown clock at the top of the screen.


  Space works as a handbrake, and a prompt at the bottom of the screen reminds
  you of it.


  Your score sits in the top corner, while a standings board next to it lists
  the drivers with their points. Hold Tab and you get the full standings.


  The dashboard in the bottom corner shows your speed in km/h and a hull
  percentage, so you can watch how much damage you've taken. When the hull is
  nearly gone, the gauge labels it critical. Shift fires your boost, and a meter
  beside the gauge shows it charging.


  The cars are a funny mix, and one of them looks like a dog's head with its
  tongue hanging out.


  A feed under the standings calls out who just got wrecked. The creators took
  the idea from the demolition derby in FlatOut 2, which they played at LAN
  parties back in the day.
