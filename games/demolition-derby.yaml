slug: demolition-derby
title: Demolition Derby
tagline: Ram other players' cars in a dusty arena until one is left running
description: >-
  Ram other cars in an arena until they're wrecked, alongside strangers online.
  Rounds run on a countdown starting close to four minutes.


  Muscle cars, vans and a dog-faced wreck. Shield-shaped pickups scattered
  around the arena. Hull wear from dents piling up. Points on a standings board
  ranking the leaders. A feed calling out who just wrecked whom.


  Press Shift to burn boost. Boost refills on its own over time. Press Space to
  pull the handbrake. Hold Tab for the full board.


  Inspired by FlatOut 2's demolition derby, a favorite at the creators' old LAN
  parties. They call this game just dumb fun.
