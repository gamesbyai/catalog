slug: demolition-derby
title: Demolition Derby
tagline: Ram other players' cars in a dusty arena until one is left running
description: >-
  You drive a car around a dusty, fenced arena and ram other drivers until their
  cars are wrecked. Each round runs on a countdown timer that starts near four
  minutes, and you share the arena with other players online.


  Your score sits in the top corner, and a standings board lists the leaders by
  points. Holding Tab brings up the full board. A feed under it announces who
  wrecked whom. Your hull percentage shows inside a speedometer, and a critical
  warning appears when the hull is nearly gone.


  A boost meter recharges over time and is spent with Shift. Space works the
  handbrake. Shield-shaped pickups lie on the arena floor. The cars include
  muscle cars, vans and a dog-faced wreck, and tire tracks mark the dirt. The
  creators cite FlatOut 2 demolition derby sessions at LAN parties as the
  inspiration.
