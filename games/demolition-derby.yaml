slug: demolition-derby
title: demolition derby
tagline: Smash rival cars in a browser demolition derby on a figure 8 or in a bowl.
description: >-
  Demolition Derby is a browser game in the style of Destruction Derby, where
  you drive a car into arenas full of rivals and try to wreck them. It uses the
  Collect cars as its vehicles, and each run is a crash-focused contest on one
  of two tracks.


  The two arenas set the tone. One is a figure 8 with a deadly crossing, where
  cars meeting in the middle can end a run quickly. The other is a floodlit
  bowl, an open space where the action stays close and every car is a potential
  collision.


  The repository says the creator built the game with Claude Code. It is a small
  project, and its README describes the tracks and the car theme without listing
  further modes or systems.
