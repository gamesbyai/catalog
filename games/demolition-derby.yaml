slug: demolition-derby
title: Demolition Derby
tagline: Ram other players' cars in a dusty arena until one is left running
description: >-
  Demolition Derby is a multiplayer browser game where you drive a car into a
  dusty arena alongside other players and try to wreck their vehicles with your
  own. Each round is a chaotic free-for-all of collisions, with everyone bumping
  and smashing around the same enclosed space.


  The game is built around simple, loud fun rather than complicated rules. It
  draws on the creator's memories of playing FlatOut 2's demolition derby mode
  at LAN parties, and that spirit of casual, friendly mayhem with strangers
  carries through. It runs in a web browser and is built on Three.js.


  It was entered in Vibe Jam 2026, where it placed 26th out of 945 entries. The
  creator says they built it with Cursor, an AI-assisted code editor.
