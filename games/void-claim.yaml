slug: void-claim
title: Void Claim
tagline: Mine asteroids, upgrade your ship, and fight rivals in dangerous space zones.
description: >-
  Void Claim is a multiplayer space mining game that starts you in a safe area.
  You gather resources and upgrade the ship, and as it improves you can head
  into the dangerous PvP zones where the richest asteroids sit and other players
  compete for the same claims.


  The creator says they had no technical knowledge and very little time, and
  built it with the AutoGPT Platform. It placed 224th of 945 in Vibe Jam 2026
  and runs on phones too.


  The farther out you go, the bigger the risk and the better the rewards, so
  every trip is a choice between staying safe and pushing toward more valuable
  rocks. Deep in the void, something ancient is stirring, and rival pilots may
  not be the only threat hunting you.
