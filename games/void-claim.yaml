slug: void-claim
title: Void Claim
tagline: Mine asteroids, upgrade your ship, and fight rivals in dangerous space zones.
description: >-
  Void Claim is a multiplayer space mining game. You begin in a safe area,
  gather resources, and upgrade your ship. As your ship improves, you can head
  into more dangerous PvP zones, where the richest asteroids are found and other
  players are competing for the same claims.


  The risk grows the farther out you go. Better rewards sit in contested space,
  so each trip is a choice between staying safe and pushing toward more valuable
  rocks. Deep in the void, something ancient is stirring, which means rival
  pilots may not be the only threat hunting you.


  The creator built it with the AutoGPT Platform, saying they had no technical
  knowledge and very little time. It was submitted to Vibe Jam 2026 and is
  playable on mobile as well as in a browser.
