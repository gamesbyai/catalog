slug: void-claim
title: Void Claim
tagline: Mine asteroids, upgrade your ship, and fight rivals in dangerous space zones.
description: >-
  Mine asteroids for crystals and gold in a space you share with other players,
  then spend what you earn on ship upgrades.


  Drills and guns on every ship. A safe starting area, and PvP zones farther out
  where the richest asteroids wait. Jettisoned cargo that scatters into loot
  anyone can grab. Shields that soak fire first, with the rest going to the
  hull. NPC ships, and something ancient stirring in the deepest void that hunts
  players too.


  Pick a callsign and one of eight ship colors to start.


  SigGravitas built it on the AutoGPT Platform with no technical background and
  little time, to see what was possible that way.
