slug: void-claim
title: Void Claim
tagline: Mine asteroids, upgrade your ship, and fight rivals in dangerous space zones.
description: >-
  The start screen asks for a callsign and a ship color from eight swatches,
  then a Launch button connects you to a shared multiplayer space. The tagline
  reads Mine. Steal. Survive. You fly a ship armed with drills and guns among
  asteroids that hold colored crystals and gold.


  You begin in a safe area, mine, and spend what you earn on ship upgrades.
  Further out, the zones turn into PvP territory, and the richest asteroids sit
  there. Other players can attack you, and cargo you jettison scatters as
  individual loot objects that can be picked up.


  Combat has shields, and damage beyond what the shield absorbs carries over to
  the hull. NPC ships also share the space. A story thread runs under the
  mining: something ancient stirs in the deepest void, and it hunts players too.
  The creator built it with no technical background and little time.
