slug: kill-9
title: KILL-9
tagline: Play turn-based cards against a rogue AI in a retro terminal.
description: >-
  In this strategy card duel, a rogue AI deals your hand and plays against you.
  You and the AI take turns playing cards until one side is beaten.


  Choosing which dealt card to play on each turn. The AI's narration of your
  defeat, as the match goes on. An IT theme built around a machine turning on
  its user.


  thhoj has worked in IT for their entire working career, and a tech and AI take
  on a turn-based card game seemed like fun to them.
