slug: kill-9
title: KILL-9
tagline: Play turn-based cards against a rogue AI in a retro terminal.
description: >-
  In KILL-9 you play cards against a rogue AI, and the AI is also the dealer.
  You and the AI trade plays turn by turn until one side is beaten. It is a
  strategy card game.


  The creator has worked in IT throughout their career and wanted a tech- and
  AI-flavored take on the turn-based card game. The IT theme is built around the
  idea of a machine turning on its user.


  Your opponent controls what you are given, so the strategy is in choosing
  which of those cards to play. As the match goes on, the AI narrates your
  defeat.
