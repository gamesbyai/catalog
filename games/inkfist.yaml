slug: inkfist
title: Inkfist
tagline: Throw punches, kicks and ink orbs in best-of-three brawls on a rainy pier.
description: >-
  Throw punches and kicks in fights on a waterfront pier. Launch ink orbs, and
  cash in a super once your ink fills.


  Riva, a fast debt runner with 95 health and nothing to lose. Brask, a slow
  dock enforcer with 112 health and heavier strikes balancing the slowness.
  Best-of-three rounds, won by putting your opponent down or standing when time
  runs out. Solo against the CPU, or versus a friend on the same keyboard.


  Pick one of two fighters before the first punch. Walk with A and D, jump with
  W, crouch with S. Hold away from your opponent to block.
