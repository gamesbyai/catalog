slug: sea-control-cold-war-arena
title: Sea Control - Cold War Arena
tagline: Command missile-armed warships in online Cold War naval battles.
description: >-
  Sea Control - Cold War Arena is naval combat from the Cold War era, played in
  online matches against other people. You take command of a missile-armed
  warship and fight at sea, ship against ship.


  Online play is central to the game, though the developer notes that
  multiplayer was added as a later step in development. The game was built with
  Three.js and Cursor, it runs in phone and desktop browsers alike, and it
  ranked 406th of 945 entries in Vibe Jam 2026.


  The creator describes it as a take on the ship-battle formula of World of
  Warships, with guided firepower replacing deck guns. Missile warfare between
  ships is the center of every fight, and the feel sits somewhere between
  action, shooting, and simulation.
