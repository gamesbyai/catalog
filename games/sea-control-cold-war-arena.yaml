slug: sea-control-cold-war-arena
title: Sea Control - Cold War Arena
tagline: Command missile-armed warships in online Cold War naval battles.
description: >-
  It's the Cold War at sea, and you're in command of a missile-armed warship in
  an online naval arena. Think of it as World of Warships, only with missiles.
  You type in a name and land in a room where online players share the water
  with bot captains like Nelson, Nimitz, Yamamoto, Togo and Yi Sun-sin.


  Even the bots get personalities, since the join messages tag Nimitz and
  Yamamoto as aggressive, Togo as cautious and Nelson as going for the
  objective.


  The camera looks straight down on the water at your ship, which starts out as
  a small fast attack craft. The steering is laid out a bit like a real ship's
  bridge, with one slider for the throttle running from full ahead through stop
  to full astern and another swinging the rudder from hard to port to hard to
  starboard.


  To attack, you click an enemy hull to lock onto it. A panel in the top right
  counts the anti-ship missiles loaded on your port and starboard sides, with a
  bar for your hull's HP just above. There's a round radar scope up there too,
  and R switches the search radar on and off.


  Over in the top left you'll find the match timer, your score, an XP bar and
  your rank, which begins at a humble Ensign.


  A comms log calls out everyone who joins the room. When you want the full
  briefing, the Help button opens it.
