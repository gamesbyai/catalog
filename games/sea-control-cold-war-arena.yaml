slug: sea-control-cold-war-arena
title: Sea Control - Cold War Arena
tagline: Command missile-armed warships in online Cold War naval battles.
description: >-
  It's the Cold War at sea, and you command a missile-armed warship in an online
  naval arena. Think of it as World of Warships, only with missiles. Pick a name
  and enter a room shared with other online players.


  Bot captains such as Nelson, Nimitz, Yamamoto, Togo and Yi Sun-sin. Nimitz and
  Yamamoto tagged aggressive in join messages, Togo cautious, Nelson going for
  the objective. A small, fast attack craft to begin with. Anti-ship missiles on
  both port and starboard sides, and a hull with HP. Timed, scored matches.
  Ensign as the starting rank. Join announcements for everyone who enters the
  room.


  Set speed with the throttle slider, from full ahead through stop to full
  astern. Steer with the rudder slider, from hard to port to hard to starboard.
  To attack, click an enemy hull to lock onto it. Press R to switch the search
  radar on and off. A full briefing is included if you want more detail.
