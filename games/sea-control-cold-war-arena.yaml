slug: sea-control-cold-war-arena
title: Sea Control - Cold War Arena
tagline: Command missile-armed warships in online Cold War naval battles.
description: >-
  Sea Control puts you in command of a missile-armed warship in a Cold War naval
  arena, described as World of Warships with missiles. You type a name, then
  join a room where online players share the sea with bot captains such as
  Nelson, Nimitz, Yamamoto, Togo and Yi Sun-sin.


  The view looks straight down on the water at your ship, which starts as a fast
  attack craft (FAC). A throttle slider runs from full ahead through stop to
  full astern, and a second slider sets the rudder from hard to port to hard to
  starboard. A round radar scope sits top right with a toggle for the search
  radar.


  To attack, click an enemy hull to lock it. The anti-ship missile load readout
  shows loaded missiles for the port and starboard sides, and a bar tracks your
  hull HP.


  A match timer, score, XP bar and rank (you begin as Ensign) sit in the top
  left. A comms log announces who joins the room, and a Help button opens the
  full briefing.
