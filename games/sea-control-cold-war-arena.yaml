slug: sea-control-cold-war-arena
title: Sea Control - Cold War Arena
tagline: Command missile-armed warships in online Cold War naval battles.
description: >-
  You steer a small missile-armed warship across open water, seen from straight
  above, and you start by typing in a name. The creator describes it as a Cold
  War arena battle where missiles do the damage instead of shells. Other
  captains share the sea with you, so it's multiplayer.


  There are no keys for driving, just two brass-framed sliders on the screen.


  One is a throttle with notches from full ahead through stop to full astern.
  The other is a rudder you slide from hard port to hard starboard, which suits
  a ship that shouldn't turn on a dime.


  To attack, you click an enemy hull to lock onto it. A panel in the corner
  tracks your anti-ship missiles in two launcher groups, labeled BB and STB,
  with a pair of lights under each, so you can see what's loaded before you
  fire. Press R to switch the search radar on and off, and the round green scope
  above that panel shows what's around you, with a health bar beneath it.


  The comms log announces each captain who joins, and the roll call is a funny
  one: Nelson, Nimitz, Yamamoto and Togo, each tagged with a temperament like
  aggressive, cautious or objective.


  A side panel lists your class as FAC, your rank as Ensign and your experience
  out of 100, while a score and a match clock sit next to it. If you get stuck,
  the Help button opens the full briefing.
