slug: sea-control-cold-war-arena
title: Sea Control - Cold War Arena
tagline: Command missile-armed warships in online Cold War naval battles.
description: >-
  Sea Control - Cold War Arena is a multiplayer naval combat game set in the
  Cold War era. Players take command of warships and fight other players at sea,
  using missiles as the main weapons. It is pitched as a take on the ship-battle
  formula of World of Warships, with guided firepower replacing deck guns.


  The focus is on missile warfare between ships, blending action, shooting, and
  a simulation feel. Online multiplayer is a central feature, so matches are
  played against other people rather than bots. The game also lists mobile
  support, so it can be played on phones as well as desktop browsers.


  It was built with Three.js for the Vibe Jam 2026, and the creator used Cursor.
  The developer noted that multiplayer was added as a later step in development.
