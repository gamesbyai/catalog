slug: red-panda-vibes
title: red panda vibes
tagline: Explore a 3D landscape as a red panda in your browser.
description: >-
  Red Panda Vibes is a 3D exploration game that runs in the browser, where you
  control a red panda and roam its world. It is built as a platformer-style
  experience, so moving around and traversing the terrain is the main activity.


  The game is open source and written in vanilla JavaScript on top of three.js,
  which keeps it light and easy to read through. It was made as an entry for the
  Vibe Jam web game contest, and the repository is tagged for vibe coding.


  The repository lists Gemini and Grok as tools used, with Anthropic among the
  model providers credited. Because the code is public, anyone can look at how
  the scene and movement are put together or fork it for their own project.
