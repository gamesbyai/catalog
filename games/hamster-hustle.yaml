slug: hamster-hustle
title: Hamster Hustle
tagline: Escape the office wheel as a hamster in a pixel-art adventure with puzzles.
description: >-
  Hamster Hustle is a pixel-art adventure built around a simple wish: getting
  off the wheel. The player guides a hamster through a stylized,
  corporate-flavored world, solving puzzles and making strategic choices on the
  way to freedom from the daily grind.


  The look and feel draw on the Game Boy Color games the creator loved growing
  up, with a chunky pixel style and the sense of slipping into a small handheld
  world after a long day. Workplace satire runs through the setting, poking fun
  at office life in ways that feel a little too familiar.


  The creator built it with Claude Code as a way to decompress from work. It
  entered Vibe Jam 2026 and is playable on mobile as well as desktop.
