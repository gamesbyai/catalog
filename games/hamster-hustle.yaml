slug: hamster-hustle
title: Hamster Hustle
tagline: Escape the office wheel as a hamster in a pixel-art adventure with puzzles.
description: >-
  Guide a hamster with one wish, to get off the wheel, through a
  corporate-flavored world of puzzles and choices.


  Puzzles and strategic decisions on the way to freedom. Workplace satire, with
  a hamster standing in for the worker. Inspiration from the Game Boy Color
  games the creator grew up with.


  The creator made it as a way to decompress from work.
