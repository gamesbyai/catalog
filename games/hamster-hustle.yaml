slug: hamster-hustle
title: Hamster Hustle
tagline: Escape the office wheel as a hamster in a pixel-art adventure with puzzles.
description: >-
  Hamster Hustle is a pixel-art adventure about a hamster with one wish: to get
  off the wheel. You guide it through a stylized, corporate-flavored world,
  solving puzzles and making strategic choices on the way to freedom from the
  daily grind.


  The chunky pixel style draws on the Game Boy Color games the creator loved
  growing up, along with the feeling of slipping into a small handheld world
  after a long day. Workplace satire runs through the setting and pokes fun at
  office life, with a hamster standing in for the worker.


  Making it in Claude Code was the creator's way to decompress from work, which
  suits a game about escaping the wheel. It went into Vibe Jam 2026, and like
  the handhelds that inspired it, it also plays on a phone.
