slug: eco-guardian
title: ECO Guardian
tagline: Fight garbage monsters and answer sustainability quizzes to earn power-ups.
description: >-
  Garbage monsters swarm you in this 2.5D survivor game, and the way to get
  stronger is to answer sustainability quiz questions. Correct answers become
  power-ups during the fight. The first stage, The Plastic Woods, is a forest
  with plastic waste choking its roots and bottles, cans and food trays
  scattered across the grass.


  The title screen has a Start Mission button, a Co-op or Solo play mode toggle,
  a Guide, and a Ranks board. After you start, a stage intro describes the
  setting. In the opening clearing, large YES and NO pads stand in the lower
  corners, which fits the quiz format.


  An Eco-Mart in the clearing lets you spend carbon to upgrade and unlock
  eco-abilities. A portal there leads to other worlds. The art pairs pixel-art
  ground and props with blocky 3D models.


  The creator is a father of four daughters. He built the game to teach children
  about sustainability while keeping it fun to play.
