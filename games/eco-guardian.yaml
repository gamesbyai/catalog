slug: eco-guardian
title: ECO Guardian
tagline: Fight garbage monsters and answer sustainability quizzes to earn power-ups.
description: >-
  Garbage monsters swarm you, and you power up by answering quiz questions
  about sustainability. Every right answer turns into a power-up you use in
  the fight. It's a 2.5D survivor game with a pop quiz built into its upgrade
  system.


  The first stage, The Plastic Woods, is an old forest where plastic waste has
  choked the roots, and bottles, cans and food trays lie scattered across the
  grass.


  From the title screen you can start a mission, switch between co-op and solo,
  open a guide or look at the ranks board. Once you start, an intro sets up the
  stage's setting.


  Big YES and NO pads sit in the lower corners of the opening clearing, which
  fits a game where answering questions is how you get stronger. Nearby there's
  an Eco-Mart where you spend carbon to upgrade and unlock eco-abilities. For
  some reason the currency is carbon, a bit of a wink in a game about cleaning
  up the planet.


  There's also a portal in the clearing that takes you off to other worlds.


  The art puts blocky 3D models on top of pixel-art ground and props. VibeCreAI,
  a father of four daughters, made the game to teach kids about sustainability
  while keeping it fun to play.
