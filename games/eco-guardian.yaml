slug: eco-guardian
title: ECO Guardian
tagline: Fight garbage monsters and answer sustainability quizzes to earn power-ups.
description: >-
  ECO Guardian is a 2.5D survivor game where the horde is made of garbage
  monsters. You fight off wave after wave, and sustainability quiz questions
  appear during play. Answer them, and the knowledge turns into power-ups that
  help you hold out against the growing horde.


  The creator, a father of four daughters, wanted to make something fun that
  also has a positive influence on children. It was built with Codex on
  Three.js, supports online multiplayer, runs on phones as well as desktops, and
  placed 121st of 945 at Vibe Jam 2026.


  Learning is tied directly to progression, since the quizzes are part of how
  your character gets stronger. The environmental theme runs through everything:
  trash is the enemy, and sustainability is how you fight back.
