slug: eco-guardian
title: ECO Guardian
tagline: Fight garbage monsters and answer sustainability quizzes to earn power-ups.
description: >-
  Garbage monsters swarm you, and you power up by answering quiz questions about
  sustainability. Every right answer turns into a power-up you use in the fight.
  It's a survivor game with a pop quiz built into its upgrade system.


  The first stage, The Plastic Woods, is set in an old forest where plastic
  waste has taken over.


  From the title screen you can play solo or in co-op, and there's a guide and a
  ranks board. Once you start, an intro sets up the stage's setting.


  The opening clearing has big YES and NO pads, and answering questions is how
  you get stronger. Nearby there's an Eco-Mart where you spend carbon to upgrade
  and unlock eco-abilities. The currency is carbon. There's also a portal that
  takes you off to other worlds.


  VibeCreAI, a father of four daughters, made the game to teach kids about
  sustainability while keeping it fun to play.
