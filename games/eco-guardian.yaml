slug: eco-guardian
title: ECO Guardian
tagline: Fight garbage monsters and answer sustainability quizzes to earn power-ups.
description: >-
  Fight swarms of garbage monsters in a survivor game with a pop quiz built into
  its upgrade system. Each sustainability question you answer right turns into a
  power-up you use in the fight.


  Solo or co-op play, plus a guide and a ranks board. The Plastic Woods, an old
  forest overrun by plastic waste, as the first stage. A portal to other worlds.


  Answer questions on the big YES and NO pads in the opening clearing to get
  stronger. Nearby, you'll find the Eco-Mart, where you spend carbon to upgrade
  and unlock eco-abilities.


  VibeCreAI, a father of four daughters, made the game to teach kids about
  sustainability while keeping it fun to play.
