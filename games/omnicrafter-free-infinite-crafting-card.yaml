slug: omnicrafter-free-infinite-crafting-card
title: Omnicrafter
tagline: Drag element cards together to craft new items and collect them.
description: "Drag two element cards together to craft something new. A pair someone's already made gives you its known result, while a pair nobody's tried yet becomes a brand-new item. Playing as a guest sets up a real account with no forms and no download.


  Four base elements at the root of a growing crafting tree. Permanent credit for first discoveries. Serial-numbered copies, each with rarity locked in when minted. A 1v1 duel race against a friend. The Infinite Canvas, a lasting shared world of player-owned plots. Free recrafting of anything already discovered. Daily allowance of new inventions, topped up with coins.


  For a duel, share a four-letter room code with a friend, then race to craft a secret target that neither of you has made, starting from the base elements. In the Commons, drag your card onto someone else's to co-craft the outcome for both of you.


  According to the creator, AI generates each new item's name, emoji, pixel-art card and lore when someone makes it for the first time."
