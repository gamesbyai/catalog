title: Right Behind You
tagline: Run from an evil clown that eats you if you slow down.
description: >-
  Run from an evil clown that eats you the moment you slow down.


  An endless chase. One pursuer that stays close the whole time. A run that
  lasts as long as you keep your lead.


  A strong dislike of clowns inspired it, and the creator adds that hours of
  being chased by one might count as exposure therapy.
