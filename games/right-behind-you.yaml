slug: right-behind-you
title: Right Behind You
tagline: Run from an evil clown that eats you if you slow down.
description: >-
  Right Behind You is a fast-paced horror runner. An evil clown chases the
  player through each run, and slowing down lets it catch up and eat you. The
  goal is to keep moving quickly and stay ahead of the threat for as long as
  possible.


  The game pairs the pressure of an endless chase with a horror mood built
  around a single pursuer that stays close behind. It runs in the browser on a
  3D scene and is set up to work on mobile devices as well as desktop.


  The creator says a strong dislike of clowns inspired the project, and that
  spending hours being chased by one during development might work as exposure
  therapy. The creator built it with Codex and Three.js, and it was entered in
  Vibe Jam 2026.
