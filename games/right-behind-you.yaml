slug: right-behind-you
title: Right Behind You
tagline: Run from an evil clown that eats you if you slow down.
description: >-
  An evil clown is right behind you, and if you slow down, it eats you. Right
  Behind You is a fast-paced horror runner built on that one rule: keep moving
  quickly and stay ahead of it for as long as you can.


  The chase is endless, so a run lasts as long as you keep your lead. The
  pressure comes from that endless chase, and the horror mood is built around a
  single pursuer that stays close behind the whole time. The 3D scene was made
  with Three.js and Codex, and the game ranked 295th of 945 in Vibe Jam 2026.


  A strong dislike of clowns inspired the project, according to the creator, who
  adds that spending hours being chased by one during development might work as
  exposure therapy.
