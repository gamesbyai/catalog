slug: fairy-arena
title: Fairy Arena
tagline: Fly around an arena and shoot the enemy team off onto a cloud.
description: >-
  You're a flier in a 3D arena, shooting at the other team until you've pushed
  them onto a cloud.


  You steer and aim with the mouse or touchpad, and your shots are there to
  shove rather than simply hit, because the goal is getting enemies onto that
  cloud. A click fires, and oddly it's also what starts the round. Both sides
  begin with four teammates, which is why the screen opens on 4 vs 4.


  A counter up top keeps track of how many teammates each team has left, with
  cyan dots for one side and orange dots for the other. Down at the bottom, a
  row of five round-attempt markers sits above a running total.


  The arena itself looks like a candy shop exploded in it.


  Big glossy blobs in magenta, green, yellow and purple rise all around you.
  Underneath there's a curved purple floor ringed by glowing lines, while a dark
  platform floats overhead.


  Right click or Space brings up the menu. Esc lets the cursor out of the game,
  a pretty considerate escape hatch when your mouse is busy doing all the
  flying. Both reminders stay printed in the corner of the screen.


  RomanShalabanov has been a web developer for more than 20 years and once
  planned a browser game as a first indie project, even starting on it before
  programming took them down another road. They describe this one as another
  attempt at making something other people could appreciate.
