slug: fairy-arena
title: Fairy Arena
tagline: Fly around an arena and shoot the enemy team off onto a cloud.
description: >-
  You fly and aim with the mouse or touchpad in a 3D arena, and you shoot the
  opposing team to push them onto a cloud. A click fires and also starts the
  round. Each side begins with four teammates, shown as 4 vs 4.


  A counter at the top of the screen tracks how many teammates each team has
  left, with cyan dots for one side and orange dots for the other. At the
  bottom, a row of five round-attempt markers sits above a running total.


  The arena is a curved purple floor ringed by glowing lines, with large glossy
  magenta, green, yellow and purple blobs rising around you and a dark floating
  platform overhead. Right click or Space opens the menu, and Esc releases the
  cursor from the game.


  The creator is a web developer of more than 20 years who once planned a
  browser game as a first indie project, and describes this as another attempt
  at making something other people could appreciate.
