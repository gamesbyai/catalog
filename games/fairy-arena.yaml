slug: fairy-arena
title: Fairy Arena
tagline: Fly around an arena and shoot the enemy team off onto a cloud.
description: >-
  You fly in a 3D arena, shooting at the other team alongside your teammates.


  Shots meant to shove enemies rather than simply hit them. Pushing enemies onto
  a cloud as the goal. Four teammates on each side.


  Aim and steer with your mouse or touchpad. Click to fire and start the round.
  Press Esc to release the cursor.


  RomanShalabanov has worked in web development for over 20 years. They planned
  a browser game as a first indie project, started it, then programming took
  them elsewhere. They describe this one as another attempt at making something
  other people could appreciate.
