slug: fairy-arena
title: Fairy Arena
tagline: Fly around an arena and shoot the enemy team off onto a cloud.
description: >-
  You fly around a round, glossy arena with the mouse or touchpad and shoot at
  the opposing team, trying to push them onto the cloud.


  Each side starts with four teammates, and a counter at the top of the screen
  tracks how many are left on both teams. It's a nice way to see a match shift
  without reading anything else, since cyan dots sit on one side and orange dots
  on the other.


  The arena is crowded with huge, glowing, balloon-like blobs in pink, green,
  yellow and purple. Thin rings of light hang over the floor, and a small
  platform floats high above the middle.


  Nothing needs setting up, because your first click to shoot also starts the
  round.


  At the bottom there's a row of five round-attempt markers with a running total
  under it, so the game keeps a count across your tries. A right click or the
  space bar opens the menu, and Esc frees your cursor from the game when you
  want it back.


  The creator got into web development more than 20 years ago, planning a
  browser game as a first indie project. They started it, then went a different
  way in programming, and this is one more try at making something other people
  could appreciate.
