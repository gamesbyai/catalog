slug: fairy-arena
title: Fairy Arena
tagline: Fly around an arena and shoot the enemy team off onto a cloud.
description: >-
  Fairy Arena is a team shooter where the goal is to shoot the enemy team off
  the arena and onto a cloud. You fly a fairy around a 3D arena, firing at the
  opposing side and trying to push its members out.


  The creator says it grew from an old ambition. Over 20 years ago they started
  web development intending to make a web-based indie game and began one, then
  moved on to other programming work. This project is another attempt at
  something other people could appreciate, and it placed 470th of 945 at Vibe
  Jam 2026.


  Each round is about staying airborne, lining up shots and forcing rivals out
  of position. Pushing is the objective, so positioning matters as much as
  damage, which gives the shooting a spatial, puzzle-like angle.
