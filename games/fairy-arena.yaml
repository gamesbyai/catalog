slug: fairy-arena
title: Fairy Arena
tagline: Fly around an arena and shoot the enemy team off onto a cloud.
description: >-
  You're a flier in a 3D arena, shooting at the other team until you've pushed
  them onto a cloud.


  You steer and aim with the mouse or touchpad, and your shots are there to
  shove rather than simply hit, because the goal is getting enemies onto that
  cloud. A click fires, and it's also what starts the round. Both sides begin
  with four teammates.


  Right click or Space brings up the menu. Esc lets the cursor out of the game.


  RomanShalabanov has been a web developer for more than 20 years and once
  planned a browser game as a first indie project, even starting on it before
  programming took them down another road. They describe this one as another
  attempt at making something other people could appreciate.
