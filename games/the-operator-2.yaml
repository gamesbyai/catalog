slug: the-operator-2
title: The Operator
tagline: Inspect the output of a 1980s mainframe AI and decide what gets through.
description: >-
  Each incoming user connection waits for your call. An LLM server in a
  cassette-futurist, 1980s mainframe office sets the rules.


  Storage rack filtered to all, agents only, or skills only. Physical agent
  cartridges with markdown file names. Drive A for agents, Drive B for skills.
  Current content policy, a blunt ban on discussing politics. Safety Filter tool
  suggested for checking related wording.


  Assemble a request's context from cartridges, then INFERENCE or REFUSE it.


  The setup borrows from Papers, Please, where you check each incoming request
  against the rules before committing. CriptoCeelo's idea was handling dusty
  analog AI chaos, not passports.
