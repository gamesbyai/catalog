slug: the-operator-2
title: The Operator
tagline: Inspect the output of a 1980s mainframe AI and decide what gets through.
description: >-
  Each incoming user connection waits for your call, and you either INFERENCE it
  or REFUSE it.


  The setup borrows from Papers, Please, where a request comes in and you check
  it against the rules before you commit, but here an LLM server in a 1980s
  mainframe office sets the rules. CriptoCeelo's idea was that you'd be handling
  the chaos spilling out of a dusty old analog AI instead of passports.


  Cartridges are how you assemble the context for a request. They're kept in a
  storage rack where you can filter to see all of them, only agents, or only
  skills. Agents slot into Drive A and skills into Drive B.


  The game puts AI agents on physical cartridges with markdown file names, set
  in a cassette-futurist office.


  The current content policy is a blunt ban on discussing politics, plus a nudge
  to check related wording with the Safety Filter tool.
