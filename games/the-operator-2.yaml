slug: the-operator-2
title: The Operator
tagline: Inspect the output of a 1980s mainframe AI and decide what gets through.
description: >-
  The Operator takes the core idea of Papers, Please and moves it into a 1980s
  mainframe room. You sit in a retro office as the operator of an LLM server.
  Instead of checking passports, you review the unruly output of a dusty, analog
  AI machine and decide what gets through and what does not.


  The setting is cassette futurism: the AI is a bulky piece of hardware, not a
  sleek modern service. It was built on Phaser, with GitHub Copilot among the
  tools noted for its development, and Vibe Jam 2026 ranked it 513th of 945.


  Each shift runs on bureaucratic pressure and careful document checking, the
  same tense routine of inspection and judgment, with puzzle and simulation
  elements sharing the loop, one document at a time.
