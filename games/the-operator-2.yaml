slug: the-operator-2
title: The Operator
tagline: Inspect the output of a 1980s mainframe AI and decide what gets through.
description: >-
  A green terminal screen announces an incoming connection, and your job is to
  decide whether the server answers it or turns it away.


  Two big buttons sit under the screen, INFERENCE and REFUSE. A content policy
  on the side terminal lists what the server shouldn't talk about, with politics
  picked out in red, so you're checking each request against a rulebook.


  Before you answer, you can shape what the server knows by loading files from
  the storage rack into two drives. Drive A takes agent files and drive B takes
  skill files, and each has an eject button. You can filter the rack by agents
  or skills, and it starts out holding one of each.


  The policy also tells you to run related language through the Safety Filter
  tool before committing, which is a handy way to point you at a tool you'd
  otherwise overlook.


  Tool control has three buttons labeled SRCH, COMP and SAFE. Below them you can
  flip through utilities, with Coolant Purge as the first. Along the bottom,
  gauges marked HALL and THRM sit next to a token counter, and a shift event
  panel reports any special conditions.


  It's all dressed as a 1980s mainframe office, and the creator took the
  bureaucratic pressure of checking documents in Papers, Please and pointed it
  at the unruly output of an old analog AI server.
