slug: the-operator-2
title: The Operator
tagline: Inspect the output of a 1980s mainframe AI and decide what gets through.
description: >-
  A green-on-black terminal shows an incoming user connection, and the player
  decides whether to press INFERENCE or REFUSE. The setup borrows from Papers,
  Please: a request arrives, and the player checks it against the rules before
  committing. Here the rules come from an LLM server in a 1980s mainframe
  office.


  Cartridges sit in a storage rack, filterable by All, Agents and Skills, such
  as Technical_Agent.md and Engineering_Skill.md. They load into Drive A for
  agents and Drive B for skills, and each drive shows a slot count and an eject
  button. This assembles the context for a request.


  A side terminal lists the current content policy, for example a ban on
  discussing politics, with a prompt to check related language using the Safety
  Filter tool. It also shows shift conditions. Tool buttons labeled SRCH, COMP
  and SAFE sit beside an active utility selector set to Coolant Purge. Gauges
  for HALL and THRM, a token counter and a row of connection indicators fill the
  rest of the screen.
