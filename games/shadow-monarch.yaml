slug: shadow-monarch
title: shadow monarch
tagline: Explore a first-person memory from a 90s childhood and uncover what was buried.
description: >-
  A childhood memory resurfaces in Shadow Monarch, and you walk back into it
  from a first-person view. The space is drawn from the creator's own childhood
  in the 1990s. As you explore it, you piece together why something there was
  left forgotten, and what was buried with it.


  The creator used Lovable, with Three.js rendering the 3D scene, and it came
  265th of 945 entries in Vibe Jam 2026. Phones can run it too.


  The game leans on nostalgia with an uneasy edge, somewhere between adventure
  and horror. The memory comes back, but the setup hints that some things were
  buried for a reason, and uncovering them is the job. That tension between
  familiar, personal surroundings and a growing sense of dread is the main draw.
