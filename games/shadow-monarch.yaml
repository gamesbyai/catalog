slug: shadow-monarch
title: shadow monarch
tagline: Explore a first-person memory from a 90s childhood and uncover what was buried.
description: >-
  A forgotten childhood memory resurfaces, and the tagline warns that some
  things were buried for a reason.


  The action takes place inside the Dungeon of the Ninth Gate, which shadows
  have made their home. Your job is to awaken your dominion and cut those
  shadows down, a grand goal for something that started as a kid's memory.


  You've got two ways to fight. The 1, 2 and Q keys switch between Magic and a
  Shadow Blade, and a click casts. The Shadow Blade takes its name from the
  shadows you fight.


  On a computer, you walk with WASD or the arrow keys and look around with the
  mouse. On touch screens, a joystick moves you and dragging on the right side
  turns your view. On touch screens, tapping the orb casts.


  thetrueisout218 based the story on their own childhood in the 1990s.
