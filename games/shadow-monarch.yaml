slug: shadow-monarch
title: shadow monarch
tagline: Explore a first-person memory from a 90s childhood and uncover what was buried.
description: >-
  A forgotten childhood memory resurfaces, and the tagline warns that some
  things were buried for a reason.


  You see it all in first person, inside the Dungeon of the Ninth Gate, a
  cathedral that shadows have made their home. Your job is to awaken your
  dominion and cut those shadows down, a pretty grand goal for something that
  started as a kid's memory.


  You've got two ways to fight. The 1, 2 and Q keys switch between Magic and a
  Shadow Blade, and a click casts. There's a certain neatness to fighting
  shadows with a blade named after them.


  It all opens on a glowing title card with an Enter the Gate button, and
  there's a sound toggle tucked into the top corner.


  On a computer, you walk with WASD or the arrow keys and look around with the
  mouse. Touch screens get a layout of their own, where a joystick moves you and
  dragging on the right side turns your view. When you want to cast, you tap the
  orb.


  thetrueisout218 based the story on their own childhood in the 1990s.
