slug: shadow-monarch
title: shadow monarch
tagline: Explore a first-person memory from a 90s childhood and uncover what was buried.
description: >-
  A forgotten childhood memory resurfaces, and some things stayed buried for a
  reason. Shadows have settled into the Dungeon of the Ninth Gate, played in
  first person.


  Magic and a Shadow Blade, named for the shadows you fight. Your goal,
  awakening your dominion and cutting shadows down.


  Walk with WASD or arrows, and turn with the mouse. Switch to Magic or Shadow
  Blade with 1, 2 or Q. Click to cast. On touch, move with the joystick, drag
  the right side to turn, and tap the orb to cast.


  thetrueisout218 based the story on their own childhood in the 1990s.
