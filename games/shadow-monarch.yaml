slug: shadow-monarch
title: shadow monarch
tagline: Explore a first-person memory from a 90s childhood and uncover what was buried.
description: >-
  You wander a dark cathedral in first person, slaying the shadows that haunt
  it, and the whole thing is framed as a memory you'd rather have left alone.


  On a computer you move with WASD or the arrow keys and look around with the
  mouse. Clicking casts a spell.


  The keys 1, 2 and Q are tied to your magic and to a Shadow Blade, so there's
  more to your arsenal than a single click. On a phone, a joystick moves you,
  dragging on the right side turns your view, and you tap an orb to cast, which
  is a sensible way to get spellcasting onto a touchscreen.


  The place is called the Dungeon of the Ninth Gate, which is where all of this
  takes place.


  The story hook is a forgotten childhood memory from the 90s that surfaces
  again, and the tagline warns that whatever got buried was buried on purpose.
  Your job, according to the title screen, is to awaken your dominion by slaying
  those shadows.


  You begin from a glowing blue panel over a dim, blurred cathedral, with a
  sound button in the corner and an Enter the Gate button to start.
