slug: shadow-monarch
title: shadow monarch
tagline: Explore a first-person memory from a 90s childhood and uncover what was buried.
description: >-
  A forgotten childhood memory resurfaces in this first-person game, and the
  tagline warns that some things were buried for a reason. You play in the
  Dungeon of the Ninth Gate, a cathedral haunted by shadows. The goal is to
  awaken your dominion and slay the shadows.


  You pick between Magic and a Shadow Blade with the 1, 2 and Q keys, and click
  to cast. The game opens on a title card with an Enter the Gate button, and a
  sound toggle sits in the top corner.


  On desktop, move with WASD or the arrow keys and look around with the mouse.
  On a touch screen, a joystick moves you, dragging on the right side turns your
  view, and tapping the orb casts. The creator based the story on their
  childhood in the 1990s.
