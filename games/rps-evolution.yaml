slug: rps-evolution
title: RPS Evolution
tagline: Battle other players as a rock, paper, or scissors and evolve to top
  the leaderboard.
description: >-
  RPS Evolution takes the classic hand game and turns it into a multiplayer
  arena. You face other players online, and the rock-paper-scissors matchup
  decides who comes out ahead. Winning fights lets your character evolve, and
  the goal is to climb the leaderboard.


  The mix of genres is what sets it apart: it draws on platformer movement,
  strategy in choosing your matchups, and a simulation-style evolution loop. It
  is built in 3D for the browser and works on mobile as well as desktop, so a
  match is easy to join from either.


  The developer says the project was an experiment in how much a game developer
  could build using only AI tools. The creator built it with Claude Code, and it
  was submitted to Vibe Jam 2026.
