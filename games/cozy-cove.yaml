slug: cozy-cove
title: Cozy Cove
tagline: Learn to fish from Old Finn while you wander a seaside village and chat
  with its locals.
description: >-
  You wander a sleepy coastal village with a bamboo rod and some coins in your
  pocket, and that's all you've got.


  The town is pixel art seen from above, with cobblestone paths running past a
  stone well. A striped market stall and a green-roofed cottage sit along the
  paths, with a red-tiled house down on the shoreline. There's even a drying
  rack with fish hanging on it, a cheeky detail in a town where you learn to
  fish.


  Old Finn waits on the docks, just south of the square, ready to walk you
  through fishing. It makes sense to open a fishing game with a teacher on hand,
  especially when you're starting out with so little.


  Villagers flagged with an exclamation point are the ones who've got something
  to say, which is a tidy way of saying this village likes to talk.


  A simple bar on screen tracks your coins, while a row of buttons gives you
  fast access to your bag, your book, a scroll, sound, and the menu. Each of
  those buttons has a keyboard shortcut, which suits a game where you're
  wandering the town.


  Its creator calls it a relaxing fishing adventure, while asking you to take it
  slow and soak up the sea air.


  The fishing itself happens down at the water.
