slug: cozy-cove
title: Cozy Cove
tagline: Learn to fish from Old Finn while you wander a seaside village and chat
  with its locals.
description: >-
  Walk a sleepy coastal village with a bamboo rod and some coins in your pocket.


  Old Finn waits on the docks, ready to walk you through fishing. A teacher is
  on hand when fishing opens, especially if you start out with very little.
  Villagers with something to say, marked with an exclamation point. Fishing
  down at the water.


  jonesiller calls it a relaxing fishing adventure and asks you to slow down and
  enjoy the sea air.
