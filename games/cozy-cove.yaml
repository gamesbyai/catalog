slug: cozy-cove
title: Cozy Cove
tagline: Learn to fish from Old Finn while you wander a seaside village and chat
  with its locals.
description: >-
  You wander a sleepy coastal village with a bamboo rod and some coins in your
  pocket.


  Old Finn waits on the docks, ready to walk you through fishing. Fishing opens
  with a teacher on hand, especially when you're starting out with so little.


  Villagers marked with an exclamation point are the ones with something to say.


  Its creator calls it a relaxing fishing adventure, while asking you to take it
  slow and soak up the sea air. The fishing itself happens down at the water.
