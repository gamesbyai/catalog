slug: santa-fe-bricks
title: Santa Fe Bricks
tagline: Stack bricks into a Santa Fe skyline while a cowboy rides past.
description: >-
  Santa Fe Bricks is a puzzle game about building a city skyline inspired by
  Santa Fe, New Mexico. The player places bricks to raise structures, working
  toward a finished skyline while a cowboy rides through the scene and adds
  disorder to each attempt.


  The setting gives the game its identity. Instead of a generic block stacker,
  it ties the building theme to a specific place, and the roaming cowboy serves
  as a moving obstacle that keeps the construction from feeling static. It also
  runs on mobile devices and is played solo.


  The game was an entry in Vibe Jam 2026, where it placed 595 out of 945
  entries. The creator's submission lists the Gemini app as the tool used to
  make it.
