slug: bomber-guys
title: Bomber Guys
tagline: Blast the floor away and knock seven rivals off the arena.
description: >-
  You're a round little bean in an eight-player arena, and your bombs blow holes
  in the floor under everyone's feet. The goal is to knock every other bean off
  the edge.


  Whichever bean is still bouncing after everyone else has fallen wins the
  match.


  You move with WASD, jump with Space and drop a bomb with E. Because the bombs
  go after the floor, the ground you're standing on is part of the fight, which
  is a funny twist on a bomb arena.


  Before a match you type in a name and pick one of eight bean colors. Quick
  Play matches you with other beans, so you can get straight into an arena.
  There's also a private room if you want a match of your own.


  The creator built it after working on simple games at Voodoo.io.
