slug: bomber-guys
title: Bomber Guys
tagline: Blast the floor away and knock seven rivals off the arena.
description: >-
  You play a bean in an eight-player arena where the floor itself is the thing
  you fight over. A well-placed bomb can trap a rival, while a careless one can
  leave you nowhere to run.


  Bombs that blow holes in the ground and shove rivals toward the edge.
  Explosions that eat away at the footing. A round won by the last bean
  standing. Quick Play matches that throw you in with other beans. Private rooms
  for matches you set up yourself. Matches that stay short.


  Move with WASD and jump with Space. Press E to drop a bomb. Before a match,
  name your bean and pick one of eight colors.


  sergebocancea says the game draws on the kind of simple games they used to
  work on at Voodoo.io.
