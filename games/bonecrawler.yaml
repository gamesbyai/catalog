slug: bonecrawler
title: BoneCrawler
tagline: Explore a dark gothic world and fight through fast combat in an
  NES-style action game.
description: >-
  Blade combat against enemies takes place in a dark fantasy dungeon. Between
  fights, you explore, interact with objects and search for secrets.


  Upgrades that stack by raising stats, including Heart (heals one heart, to a
  max of five), Sword (bigger blade), Speed and Step (improves the dodge). Magic
  Shield that soaks up a hit and releases a shockwave, stacking by widening it.
  Ground pickups of half hearts, full hearts and health potions. Master Sword
  with five more blade strength, plus a Whirlwind Slash. Mirror skill that
  reflects attacks, marked as coming soon. Scoreboard saved in your browser
  through a cookie.


  Press Shift for Shadow Step, the longer dodge that grants brief invincibility.
  Interact with chests to pick one of three random choices: an upgrade, a full
  heart or points. Charge the Whirlwind Slash, a 360 degree attack, then release
  it. Type certain words as your player name to change your start. One of those
  words gives a buffed start, and the others place you in a secret zone or
  further along.


  The exploration is Zelda-style, and the combat is faster, in the vein of Ninja
  Gaiden and Devil May Cry. The creator built the engine with AI-written code.
