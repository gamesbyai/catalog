slug: bonecrawler
title: BoneCrawler
tagline: Explore a dark gothic world and fight through fast combat in an
  NES-style action game.
description: >-
  BoneCrawler is a dark fantasy action game with an NES-style look. The player
  explores a gothic world in the manner of classic top-down adventures, then
  fights enemies in quick, combo-minded combat that leans toward
  character-action games rather than slow, deliberate swordplay.


  The design is openly a tribute to the games that shaped its author. Zelda-like
  exploration sits alongside the faster combat of Devil May Cry and Ninja
  Gaiden, all set in a gloomy fantasy atmosphere shaped by The Lord of the
  Rings. It is a small project from a solo developer and runs on mobile as well.


  The creator says the code was generated with AI while they directed the scope
  and tested the results. Claude, ChatGPT, and Codex handled code generation,
  and Gemini was used for planning. The game was built as a reusable engine with
  an editor, and the creator plans to open-source it later.
