slug: bonecrawler
title: BoneCrawler
tagline: Explore a dark gothic world and fight through fast combat in an
  NES-style action game.
description: >-
  Combat comes first: swing a blade at enemies in a pixel-art dark fantasy
  dungeon, and press Shift to Shadow Step, a longer dodge with brief
  invincibility. Between fights you explore, interact with objects, and search
  for secrets. A hint on screen suggests trying breakable objects.


  Chests offer three random choices each: an upgrade, a full heart, or points.
  Upgrades are Heart (heals one heart, max five), Sword (bigger blade), Speed,
  Step (improves the dodge), and Magic Shield, which absorbs a hit and bursts
  into a shockwave. Upgrades stack by raising stats, and shields stack by
  widening the shockwave.


  Pickups on the ground include half hearts, full hearts, and health potions. A
  Master Sword adds five blade strength and a Whirlwind Slash, a 360 degree
  attack you charge and release. A Mirror skill that reflects attacks is marked
  as coming soon.


  Typing certain words as the player name changes the start. One gives a buffed
  start, others begin in a secret zone or a later zone. The scoreboard is stored
  locally as a cookie. The design mixes Zelda-style exploration with faster
  Devil May Cry and Ninja Gaiden combat, on an engine the creator built with
  AI-written code.
