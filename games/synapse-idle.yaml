slug: synapse-idle
title: Synapse Idle
tagline: Grow a glowing 3D neural network by buying upgrades and watching energy flow.
description: >-
  Synapse Idle is an incremental game set around a luminous core. You invest in
  upgrades, and each purchase changes the shape of a 3D neural mesh. Workers
  travel along the newly formed paths, and the energy they carry pulses back
  into a growing singularity at the center.


  Instead of a screen of climbing numbers, the thing you tend is a piece of
  living geometry. The network visibly branches, pulses, and rearranges itself
  as you spend, so progress shows up as a tree of light forming in real time.
  The pace is quiet and meditative, closer to watching something grow than
  racing a counter.


  The creator built it with Claude Code and Three.js for Vibe Jam 2026. The
  visual starting point was a CodePen experiment, which the creator then
  developed into a full idle game.
