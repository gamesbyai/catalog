slug: stone-duel
title: Stone Duel
tagline: Sword-fight three knights one at a time in a castle courtyard
description: >-
  Beat all three knights and the courtyard is yours. The fights run in real
  time, and you watch them from a third-person camera. You'll have to read your
  rival and keep an eye on your stamina to outlast each knight.


  Every fight happens in one sandstone courtyard, and its arched colonnades,
  stone well, and banners with crosses in red and lions in gold make for a
  surprisingly detailed backdrop.


  You can take on the Gauntlet, which sends you against all three challengers
  one after another, or go for a Single Duel with just one knight. Sir Garrick
  of the Blue Tower is also called The Blue Knight, a pretty direct nickname,
  while Sir Roderic of the Greenwood goes by The Green Knight.


  You've got light attacks on left click or J, while heavy ones go on right
  click or K. F does your blocking and parrying. Space is for dodging.


  Tab locks you onto your opponent, and there's a LOCKED label tucked neatly
  under the duel counter.


  Your stamina bar sits just beneath your health bar, a sensible spot for a game
  that asks you to manage stamina, while your opponent's health bar sits across
  from yours. The duel count up top shows how far you've got through the three
  fights.
