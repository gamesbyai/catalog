slug: the-last-observation
title: The Last Observation
tagline: Walk a 64 × 64 planet and collapse its terrain into solid ground by
  looking at it.
description: >-
  You have ten minutes to fix as much of a 64 × 64 world as you can. Terrain
  stays an unresolved translucent proxy until you hold a cell under the reticle
  within 20 meters. Ground close to your body resolves at once. The clock starts
  at your first collapse.


  Four Possibility Seeds must be collected in order: water, forest, ruin, storm.
  Each one adds new terrain and objects, but only to chunks not yet generated.
  Seeds survive death. Coverage on the HUD counts fixed cells, and the aim is to
  leave the largest connected observed surface.


  Red-and-black spiked bombs are the only enemy, and they stay visible even
  while unresolved. There is no attack, so you route around them. Touching one
  costs a life and turns every unprotected fixed cell within 30 meters into a
  permanent fracture. Fractures stay walkable but no longer count. The third
  death ends the run early.


  A voice system reports on your travel, gaze time, revisits and deaths in
  English or Spanish, with subtitles. When time runs out, the camera rises over
  the surviving world and shows a profile, a haiku and a copyable world seed.
  Finish with all four Seeds, a life left and 1,536 fixed cells to trigger a
  special ending cinematic. The creator says Codex wrote the code and tests.
