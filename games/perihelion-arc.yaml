slug: perihelion-arc
title: Perihelion Arc
tagline: Fly custom drones through time trial courses and upgrade them after every run.
description: >-
  Perihelion Arc is a time trial racing game in which you pilot a custom drone
  through a course set in the void. Each run is a race against the clock, and
  the goal is to finish faster than before while keeping control of a machine
  built for speed.


  Progression is the focus. Every run improves both your drone and your skills,
  so the gear you collect and the way you fly feed into each other. The design
  leans on the appeal of time trial racing combined with gear upgrades, which
  the creator says they enjoy in other games.


  It was made for Vibe Jam 2026 using Three.js, and it runs in the browser with
  support for mobile devices and multiplayer, so you can race on a phone or a
  desktop.
