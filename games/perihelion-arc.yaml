slug: perihelion-arc
title: Perihelion Arc
tagline: Fly custom drones through time trial courses and upgrade them after every run.
description: >-
  Race a custom drone around a time trial course set in the void. Each flight is
  a race against the clock. Your goal is to beat your last time while keeping
  control of a machine built for speed.


  Upgrades after every run, for both the machine and your own flying. Collected
  gear and your flying, feeding into each other. Progression as the focus, with
  an RPG streak. Multiplayer support.


  CosminSerban10 says they enjoy the pairing of time trial racing and gear
  upgrades in other games, and built this one around it.
