slug: puzzle-punch
title: Puzzle-Punch
tagline: Stack falling blocks in a 1v1 duel and use abilities to sabotage your rival.
description: >-
  Puzzle-Punch takes the falling-block stacking you know from Tetris and turns
  it into a one-on-one duel. You've got abilities that either hinder your
  opponent or help you rack up a higher score. The creators wanted something
  both competitive and puzzly, so they started from Tetris and added their own
  twists.


  You can play alone in a practice mode or against a bot, which means you don't
  need another person around to try it. For real opponents, you can find a game
  or invite a friend.


  The abilities are called spells, and they're explained on a how-to-play screen
  from the menu.


  Pieces move with the arrow keys, and Up or X rotates clockwise while Z turns
  them the other way. Space hard drops, and C or Shift holds a piece for later.
  Esc sends you back to the lobby.


  You type in a name on the title screen before you pick any of the modes.


  A bot mode is a considerate thing to include in a duel game, because it lets
  you learn the spells before you put them on a real person.
