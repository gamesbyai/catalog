slug: puzzle-punch
title: Puzzle-Punch
tagline: Stack falling blocks in a 1v1 duel and use abilities to sabotage your rival.
description: >-
  Puzzle-Punch turns falling-block puzzles into a one-on-one duel. Two players
  clear lines in their own wells and race to outscore each other over the course
  of a match, which pushes you to stack cleanly and act quickly while your rival
  does the same.


  According to the creator, the team set out to combine a competitive game with
  a puzzle game, using Tetris as the starting point, and they worked in Claude
  Code for Vibe Jam 2026. It is an online game, played in the browser, and it
  placed 397th of 945.


  Abilities sit on top of the classic formula. Some hinder your opponent and
  others help you build a higher score, so each match mixes stacking skill with
  decisions about when to strike at the other player and when to boost yourself
  instead.
