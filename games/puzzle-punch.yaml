slug: puzzle-punch
title: Puzzle-Punch
tagline: Stack falling blocks in a 1v1 duel and use abilities to sabotage your rival.
description: >-
  Puzzle-Punch has you stack falling blocks and clear lines in your own well
  while another player works theirs. Tetris turned into a one-on-one fight, with
  both of you racing to post the bigger score by the end of the match. Each
  match mixes clean stacking with choosing when to strike at the other player
  and when to boost your own score.


  Abilities called spells, some aimed at your opponent. Boost spells for your
  own score. Practice mode for playing without a live rival. Matches against a
  bot. Game search or friend invites.


  Use the arrows to move, Up or X to rotate one way, and Z to rotate the other
  way. Press Space to hard drop, C or Shift to hold, and Esc to return to the
  lobby.


  According to the creator, El_Perforator's team wanted a game that was both
  competitive and a puzzle. They picked Tetris as the classic to start from and
  added their own twists to make it a duel.
