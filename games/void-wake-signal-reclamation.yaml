slug: void-wake-signal-reclamation
title: "Void Wake: Signal Reclamation"
tagline: Pilot a spaceship through 50 top-down levels of enemies and bosses.
description: >-
  Something in deep space has been sending a signal longer than anyone can
  account for, and people have started calling it The Static. You fly the ship
  dispatched to trace the signal back to where it begins, and VESPER, your
  ship's AI, narrates the trip as the only voice out there. It's a top-down
  shooter where enemies swarm you across fifty levels, and outside the campaign
  you can pick from several other modes.


  Five sectors, each with its own hazards and enemy lineup. Mini-bosses and main
  bosses along the way, and a finale tying together everything you've fought.
  Engine trails, colors and ship styles unlocked with campaign salvage. Endless
  Survival, a swarm that keeps coming as difficulty climbs. Boss Rush, every
  boss chained back to back with no gap. A Codex logging every ship, enemy and
  boss you meet, with lore and attack patterns. Point of Origin, a free 20-level
  story addon.


  Play with keyboard and mouse or an Xbox or PlayStation controller. On a pad,
  remap controls fully and drive menus from it too. Choose Normal, Hard or
  Nightmare for the campaign. Chase a timed score in 5-Minute Blitz. Gather
  richer loot in Salvage Run Extraction, with mini-boss signal spikes that
  escalate, and decide when to leave with your haul. Race a replay of your best
  attempt in Ghost Duel. Take the seeded run everyone gets in Daily and Weekly
  Challenges.
