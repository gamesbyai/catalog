slug: void-wake-signal-reclamation
title: "Void Wake: Signal Reclamation"
tagline: Pilot a spaceship through 50 top-down levels of enemies and bosses.
description: >-
  Void Wake: Signal Reclamation is a top-down survivor-style space shooter that
  runs in the browser. You play a pilot sent to find the source of a mysterious
  broadcast called The Static, accompanied by VESPER, the ship's AI. The
  campaign spans 50 levels across five sectors, with mini-bosses, main bosses,
  and a finale, on Normal, Hard, or Nightmare difficulty.


  Beyond the campaign, the game offers many ways to play: Endless Survival, a
  5-Minute Blitz score attack, Boss Rush, and a Salvage Run where you decide
  when to extract with your loot. Ghost Duel races a recording of your best run,
  and Daily and Weekly Challenges use the same seeded run for every player with
  leaderboards.


  Salvage earned in the campaign unlocks ship styles, colors, and engine trails,
  and you can switch between a neon vector look and painted ship art. A Codex
  logs every ship, enemy, and boss, and a Hall of Fame tracks best runs.
  Controller support covers Xbox and PlayStation pads, with remapping and
  accessibility options. The creator's disclosure says AI assisted with code,
  graphics, and sound.
