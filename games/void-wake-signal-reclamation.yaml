slug: void-wake-signal-reclamation
title: "Void Wake: Signal Reclamation"
tagline: Pilot a spaceship through 50 top-down levels of enemies and bosses.
description: >-
  A signal called The Static has been broadcasting from deep space, and you
  pilot a ship sent to trace it, with the ship's AI, VESPER, narrating the trip.
  It is a top-down shooter where you fight swarms of enemies across fifty levels
  split into five sectors, each with its own hazards and enemy types.


  The campaign runs on Normal, Hard, or Nightmare difficulty and includes
  mini-bosses, main bosses, and a finale. Salvage earned in the campaign unlocks
  ship styles, colors, and engine trails, and you can switch between a neon
  vector look and painted ship art at any time.


  Besides the campaign, the launch menu offers other modes. Endless Survival
  keeps the swarm coming with rising difficulty. 5-Minute Blitz is a timed score
  attack. Boss Rush chains every boss together. Salvage Run Extraction asks you
  to decide when to leave with your loot while mini-boss signal spikes escalate.


  Ghost Duel races a recording of your own best run, and Daily and Weekly
  Challenges use the same seeded run for everyone. A Codex logs each ship,
  enemy, and boss you meet, and a free 20-level story addon, Point of Origin, is
  on the main menu. Play with keyboard and mouse or an Xbox or PlayStation
  controller, with full remapping.
