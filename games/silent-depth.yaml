slug: silent-depth
title: Silent Depth
tagline: Hunt a convoy by sonar, fire one torpedo attack, then slip away from
  the escorts.
description: >-
  Every time you raise the periscope or surface, you learn more about what's out
  there, but you also become easier to spot. Your submarine carries plenty of
  firepower but sees little.


  Passive sonar for searching out the convoy. Procedurally generated convoy
  routes, with a different path each run. Escort ships that pursue you as soon
  as a torpedo is in the water. Short extraction roguelite runs in three steps.


  Find the convoy and keep your wake small, which means not giving yourself
  away. Line up a torpedo attack through the periscope, then vanish before the
  escorts pin down where you are. Switch between surfacing, periscope depth and
  running deep with a numbered button for each.


  yibie built the game around surviving the pressure after the shot rather than
  only sinking the ship, with one-hit tension throughout.
