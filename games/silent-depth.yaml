slug: silent-depth
title: Silent Depth
tagline: Hunt a convoy by sonar, fire one torpedo attack, then slip away from
  the escorts.
description: >-
  Every time you raise the periscope or come up to the surface, you learn more
  about what's out there, but you also get easier to spot. Your submarine
  carries plenty of firepower but sees little, while passive sonar is how you
  search for the convoy.


  Each run is a short extraction roguelite with a tidy three-step order to it.
  You find a convoy, set up a torpedo attack and then slip away.


  The convoy routes are procedurally generated, so you're chasing a different
  path every time. You line up the shot through the periscope, where a bearing
  readout counts around the full 360 degrees as the view turns. Down in the
  corner, small panels show your depth, a danger level that shifts from Quiet to
  Search, and how many tubes you have.


  Switching between surfacing, periscope depth and running deep takes one
  numbered button each, and the Ping and Fire buttons sit right beside them.


  The opening order on screen tells you to find the convoy and keep the wake
  small, shorthand for not giving yourself away.


  The escorts come after you as soon as a torpedo's in the water, and from then
  on your job is to vanish before they pin down where you are.


  The creator, yibie, built the game around surviving that pressure after the
  shot rather than only sinking the ship, with one-hit tension throughout.
