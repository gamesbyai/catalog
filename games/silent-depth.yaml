slug: silent-depth
title: Silent Depth
tagline: Hunt a convoy by sonar, fire one torpedo attack, then slip away from
  the escorts.
description: >-
  You command a submarine that is powerful but nearly blind. Passive sonar is
  how you search for a convoy, and each run is a short extraction roguelite. A
  run follows one order: find the convoy, line up a torpedo attack, then get
  away.


  Raising the periscope or surfacing gives you information, but it also makes
  you easier to detect. Periscope targeting is how you line up the shot, and the
  convoy routes are procedurally generated, so each run sends you after a
  different path.


  Once you fire, escorts pursue you, and you have to disappear before they lock
  onto your position. The creator built the game around surviving the pressure
  after the shot rather than only sinking the ship, with one-hit tension
  throughout.
