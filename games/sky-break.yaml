slug: sky-break
title: Sky Break
tagline: Run, shoot, and survive while a hostile AI sabotages your escape.
description: >-
  Sky Break is a high-speed survival shooter runner. You race through an escape
  while fighting off threats, and a hostile AI works against you the whole way,
  sabotaging your route as you go. Each run is a push to outlast its
  interference and reach the end.


  The AI is the antagonist, and it responds to how well you play in real time.
  Early on it mocks you, but as you outplay it, its tone shifts to panic and
  then desperation, all within a single run. The idea draws on how language
  models can move from confidence to uncertainty under pressure.


  It was entered in Vibe Jam 2026 and built with Three.js. The creator built it
  with Antigravity and Kiro, and the game supports multiplayer and mobile play.
