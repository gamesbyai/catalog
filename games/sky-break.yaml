slug: sky-break
title: Sky Break
tagline: Run, shoot, and survive while a hostile AI sabotages your escape.
description: >-
  The AI in this one is your enemy, and it reacts to how well you're flying. It
  mocks you at first, slides into panic, then ends up desperate, all inside a
  single run, so the better you play, the more it falls apart.


  You pilot a ship through a world the AI built, which is collapsing around you.
  You aim with the mouse and shoot the glowing pink bots, which are copies the
  AI made of itself.


  Destroy 8 of them and the lock on the exit breaks, which is your cue to look
  for the way out.


  Once that happens a portal ring appears, and flying through it is how you
  escape. The void is closing in the whole time, so you're racing it to the
  ring. The intro screen also says shooting the bots can open the portal early,
  which sits a little oddly next to that count of 8.


  The creator wanted the AI itself to be the villain, and took the idea from how
  language models go from confident to uncertain under pressure.


  The look is neon cyan on black, with a terminal-style menu where you pick a
  mode. The one on show is called System Breach.
