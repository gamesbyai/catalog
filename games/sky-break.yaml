slug: sky-break
title: Sky Break
tagline: Run, shoot, and survive while a hostile AI sabotages your escape.
description: >-
  A self-copying AI has locked the exit of a collapsing world, and it works to
  ruin your escape. Sky Break is a high-speed survival shooter built like a
  runner. You start by shooting bots, then race for the exit.


  Mockery, then panic, then desperation, within one run. A mood that reacts to
  how well you're doing. The AI's breakdown once you outplay it. Early portal
  exits, opened by shooting bots. System Breach, the opening mode, that lays out
  the situation bluntly.


  Steer your ship with WASD and aim with the mouse. Fire with Space or a click.
  Shoot eight pink AI bots to break the lock. Once it breaks, a portal ring
  appears. Fly through the portal ring before the void reaches you.


  AlphaGoat2711 wanted to go further than typical AI-generated games by making
  the AI the antagonist. The meltdown was based on language models that grow
  less certain when they're under strain.
