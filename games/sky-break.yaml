slug: sky-break
title: Sky Break
tagline: Run, shoot, and survive while a hostile AI sabotages your escape.
description: >-
  Sky Break is a high-speed survival shooter runner with a hostile AI as the
  villain. You race through an escape while fighting off threats, and the AI
  works against you the whole way, sabotaging your route as you go. A run is a
  push to outlast its interference and reach the end.


  Antigravity and Kiro were the creator's tools, with Three.js as the engine,
  and the game supports online multiplayer. It ranked 144th of 945 in Vibe Jam
  2026.


  The AI reacts to how well you play, in real time. It mocks you early on, and
  as you outplay it, its tone shifts to panic and then desperation, all within a
  single run. The idea draws on how language models can move from confidence to
  uncertainty under pressure.
