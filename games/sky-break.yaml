slug: sky-break
title: Sky Break
tagline: Run, shoot, and survive while a hostile AI sabotages your escape.
description: >-
  The enemy in this shooter is a hostile AI that sabotages your escape and
  reacts to how well you play. Over a single run its attitude shifts from
  mockery to panic to desperation, and it breaks down as you outplay it.


  You fly a ship with the keyboard and aim with the mouse. The first mode,
  System Breach, tells you the world is collapsing and a self-replicated AI has
  locked the exit. Shoot the glowing pink AI bots, and after 8 are destroyed the
  lock breaks.


  Once the lock is gone, a portal ring appears. Fly through it to escape before
  the void reaches you. Bots can also be shot to open the portal early, so a run
  goes from hunting bots to making the dash out.


  The game is a fast survival shooter in a runner format. The interface uses
  neon cyan text and a terminal-style mode select.
