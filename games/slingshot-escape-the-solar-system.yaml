slug: slingshot-escape-the-solar-system
title: "Slingshot: Escape the solar system"
tagline: Swing past planets and use their gravity to escape the solar system.
description: >-
  You steer a small spacecraft through a 2D version of the real solar system,
  and the goal is to leave it. A run starts with the ship beside a large planet.
  Aim with the left and right arrow keys, then hold Space to launch.


  Planets give you speed when you fly close to them, so each pass is a gravity
  slingshot. Pressing Space to burn at the nearest point of an approach gives
  the largest boost, which means timing your burn to each planet you pass.


  The start screen lists the other keys: Shift for plan, W for warp, and R to
  restart. A logbook opens with Escape, and the start screen also links to a
  tutorial and a wiki.


  The creator took the space setting and contemplative mood from Outer Wilds,
  and the 2D view of the real solar system from Spaceflight Simulator. The art
  is pixelated.
