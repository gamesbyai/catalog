slug: slingshot-escape-the-solar-system
title: "Slingshot: Escape the solar system"
tagline: Swing past planets and use their gravity to escape the solar system.
description: >-
  You pilot a spacecraft through the 2D real solar system. Your ship starts each
  run beside a big planet.


  Gravity slingshots. Extra speed from swinging in close to planets. The goal of
  escaping the solar system.


  Aim with the left and right arrow keys, then hold Space to launch. Press Space
  to burn your engine at closest approach. Press Shift to plan, W to warp and R
  to restart. Escape opens a logbook. A tutorial and a wiki are available.


  romainsimon took the space setting and contemplative mood from Outer Wilds,
  and the 2D layout from Spaceflight Simulator.
