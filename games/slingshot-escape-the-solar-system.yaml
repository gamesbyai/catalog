slug: slingshot-escape-the-solar-system
title: "Slingshot: Escape the solar system"
tagline: Swing past planets and use their gravity to escape the solar system.
description: >-
  Slingshot: Escape the solar system gives you a craft, the real solar system,
  and one goal: get out. You fly past planets and use their gravity to gain
  speed and bend your trajectory, building enough momentum to leave the solar
  system behind.


  The creator cites Outer Wilds for its contemplative mood and music, and
  Spaceflight Simulator for its flat, physics-driven view of real planetary
  layouts. They built this single-player game with Claude Code, it runs on touch
  screens too, and it placed 59th of 945 entries in Vibe Jam 2026.


  Together those influences give a quiet, exploratory tone to what is, at heart,
  a 2D gravity puzzle. Every planet you pass can add speed or bend your path on
  the way out of the system.
