slug: slingshot-escape-the-solar-system
title: "Slingshot: Escape the solar system"
tagline: Swing past planets and use their gravity to escape the solar system.
description: >-
  You're piloting a small spacecraft through a 2D version of the real solar
  system, and the goal is to escape it. You do that by flying close to planets
  and letting their gravity throw you faster.


  The trick is when you fire your engine, because the boost is biggest at your
  closest point to a planet. So you wait for that moment and burn, which gives
  you a proper slingshot instead of a lazy drift past.


  You start a run by holding Space to launch the ship from the start screen.


  Before you go, the left and right arrows turn the direction you're pointing.
  Once you're moving, Space fires the burn, Shift brings up a plan view, W
  warps, and R restarts.


  A logbook tab sits in the top corner of the screen, and Esc opens it up.


  The start screen also links to a tutorial and a wiki, which makes sense for a
  game built on orbital mechanics. The art is chunky pixel work, with a big blue
  planet filling the screen behind the ship.


  The creator took inspiration from Outer Wilds, with its contemplative music
  and a real story wrapped around space. This one flattens that into 2D and uses
  the actual solar system, so it sits closer to Spaceflight Simulator.
