slug: slingshot-escape-the-solar-system
title: "Slingshot: Escape the solar system"
tagline: Swing past planets and use their gravity to escape the solar system.
description: >-
  You pilot a small spacecraft through a flat, 2D take on the real solar system,
  and all you're trying to do is get out of it. Each run starts with your ship
  sitting right next to a big planet.


  Planets give you extra speed when you swing in close, so every flyby works
  as a gravity slingshot. The biggest kick comes when you press Space to burn
  at the nearest point of the approach. It turns each planet you pass into a
  timing problem, folding real orbital physics into a single button.


  To get off the ground, you aim with the left and right arrow keys and then
  hold Space to launch.


  The start screen lays out the rest of the keys too, with Shift to plan, W to
  warp and R to restart. Escape opens a logbook, and it's considerate that a
  game this physics-heavy puts a tutorial and a wiki one click away on that same
  screen.


  Everything's drawn in chunky pixels, right down to the planet that fills a
  whole half of your view when you begin.


  romainsimon took the space setting and its contemplative mood from Outer
  Wilds. Keeping things in 2D with the real solar system came from Spaceflight
  Simulator instead.
