slug: o-vos-omnes
title: O Vos Omnes
tagline: Sing a Renaissance motet together with other players in a shared choir.
description: >-
  O Vos Omnes is a multiplayer simulation and party game that puts you in a
  Renaissance choir with other players, and together you perform a motet. Each
  participant takes a place among the singers, and the piece comes together
  through the group's combined voices.


  The title points to a well-known Latin motet text. It renders on a canvas in
  the browser, and players join online. According to the creator, Claude Code
  was used to build this Vibe Jam 2026 entry, which placed 297th of 945.


  Instead of a competitive lobby, players cooperate on a piece of sacred choral
  music in the style of the period. The game centers on blending with other
  people, so the goal is a shared piece of music rather than a winner.
