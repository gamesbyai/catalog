slug: o-vos-omnes
title: O Vos Omnes
tagline: Sing a Renaissance motet together with other players in a shared choir.
description: >-
  Take a place in a Renaissance choir with other players and perform a motet
  together, in this multiplayer simulation and party game. Each player takes a
  spot among the singers, and together their voices form the piece.


  The title points to a well-known Latin motet text. Players join online.
  According to the creator, Claude Code was used to build this game.


  Instead of a competitive lobby, players cooperate on a piece of sacred choral
  music in the style of the period. The game centers on blending with other
  people, so the goal is a shared piece of music rather than a winner.
