slug: hexport
title: Hexport
tagline: Teleport across the arena, slash enemies, and buy upgrades between runs.
description: >-
  A hexagon with a sword is dropped into an arena, and you have to outlast waves
  of enemies for as long as you can.


  Triangle chasers, one hit each, with 1 HP back per kill. Pentagon bullet
  shooters, destroyed by a slash. Powerups dropped into the arena, collected by
  slashing them. Warp+, Slash+ and Range+ as permanent upgrades. Dual Blade,
  Immunity and HP +20, also in the game.


  Before a run, enter your own callsign or roll a random one. You don't steer.
  Point the cursor at the spot you want to teleport to next. Once every second
  the hexagon teleports there on its own, and each teleport ends in a full
  360-degree sword spin, so moving and attacking are one move.


  Damarhabibie calls it a teleport-and-slash game with incremental upgrades. The
  creator writes, "I like to create something new, no one ever see before."
