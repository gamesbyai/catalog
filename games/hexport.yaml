slug: hexport
title: Hexport
tagline: Teleport across the arena, slash enemies, and buy upgrades between runs.
description: >-
  A hexagon with a sword gets dropped into a neon arena, and the job is to
  outlast waves of enemies for as long as you can.


  Instead of steering, you point, and the cursor marks the spot you'll teleport
  to next. Once every second the hexagon warps there on its own, and each jump
  ends in a full 360-degree sword spin, which makes for a clever setup where
  moving and attacking end up being the same move.


  Two kinds of enemies come at you. Triangles chase you down and fall to a
  single hit, and every kill hands you back 1 HP — a pretty tidy way to turn the
  weakest enemy into a snack. Pentagons shoot bullets instead, but a slash
  destroys them.


  Powerups drop into the arena as well, and it's a bit fitting that you collect
  them by slashing them too.


  The start screen lists Warp+, Slash+ and Range+, each marked as permanent,
  which lines up with Damarhabibie calling this a teleport-and-slash game with
  incremental upgrades. Dual Blade, Immunity and HP +20 sit right alongside
  them.


  Before a run you can type in your own callsign or roll a random one with the
  dice button. A separate button on the same screen leads off to a portal.


  Once you're playing, a crosshair takes over from the normal cursor, while the
  regular pointer stays visible in the menus.
