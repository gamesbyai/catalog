slug: hexport
title: Hexport
tagline: Teleport across the arena, slash enemies, and buy upgrades between runs.
description: >-
  You play a hexagon with a sword in a neon arena, surviving waves of enemies
  for as long as you can. The cursor marks your teleport target, and the
  character warps to it automatically once every second. Each warp triggers a
  360-degree sword spin.


  Two enemy types appear. Triangles chase you and die in one hit, and each kill
  restores 1 HP. Pentagons shoot bullets, and a slash destroys them. Powerups
  also drop in the arena, and you collect them by slashing them.


  The start screen lists Warp+, Slash+ and Range+, each marked permanent, along
  with Dual Blade, Immunity and HP +20. Before starting you can type a callsign
  or roll a random one. A separate button leads to a portal.


  During play a crosshair replaces the normal cursor, while the regular cursor
  stays visible in menus. The creator describes it as a teleport and slash game
  with incremental upgrades.
