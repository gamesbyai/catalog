slug: hexport
title: Hexport
tagline: Teleport across the arena, slash enemies, and buy upgrades between runs.
description: >-
  You steer a blade through a neon arena by moving the cursor, because wherever
  the cursor sits is where you'll teleport next.


  The warp fires by itself once every second, so all you decide is where to
  leave the crosshair. Each warp also spins your sword a full 360 degrees, and
  that spin is what slashes things around you.


  Enemies come at you in waves, and there are two kinds. Triangles chase you and
  die in one hit, and each one you kill gives you 1 HP back. Pentagons shoot
  bullets, but a slash destroys those too.


  Powerups work the same way, so you just slash them to pick them up.


  Warp+, Slash+ and Range+ are tagged as permanent on the start screen, while
  Dual Blade, Immunity and a +20 HP heal carry no such tag. It's a neat fit that
  the same spin that clears enemies also collects the upgrades. The creator
  describes it as a teleport and slash game with incremental upgrades.


  Before you begin, you can type a callsign or roll a random one with the dice
  button, and then you survive as long as you can.
