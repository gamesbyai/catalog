slug: pixel-assassin
title: Pixel Assassin
tagline: Kill enemies to take their weapons and survive endless pixelated levels.
description: >-
  In Pixel Assassin, every enemy you take down hands you a weapon. You play a
  pixel-styled killer facing a steady stream of enemies in a single-player 3D
  action shooter, and the goal is to last through endless pixelated levels as
  they keep coming.


  That makes your loadout depend on who you have taken down. Claude Code and
  Three.js were the building blocks, it ended up 571st of 945 at Vibe Jam 2026,
  and phones work as well as desktop.


  The pickup loop ties offense to progress: you cannot just wait out a fight,
  because kills are how you get better gear to fight with. There is a strategic
  side too, since choosing which enemies to go after, and when, affects how long
  you survive the levels.
