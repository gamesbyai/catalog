slug: pixel-assassin
title: Pixel Assassin
tagline: Kill enemies to take their weapons and survive endless pixelated levels.
description: >-
  Take down enemies and each one hands you a weapon. You are a pixel assassin in
  this 3D action shooter, and the goal is to survive endless levels.


  Enemies that keep coming in a steady stream. Better gear from kills, not from
  waiting out a fight. Loadouts shaped by which enemies you have taken down.
  Target choice and timing, a factor in how long you survive.
