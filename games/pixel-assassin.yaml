slug: pixel-assassin
title: Pixel Assassin
tagline: Kill enemies to take their weapons and survive endless pixelated levels.
description: >-
  Pixel Assassin is a 3D action shooter where you play a pixel-styled killer
  facing a steady stream of enemies. Defeating an enemy earns you a weapon, so
  your loadout depends on who you take down. The goal is to last through levels
  that keep coming.


  The weapon-pickup loop ties offense to progress: you can't just wait out a
  fight, because kills are how you get better gear. The game also has a
  strategic side, since choosing which enemies to go after and when affects how
  long you survive. The game runs in the browser and is playable on mobile.


  It was made for Vibe Jam 2026, where it placed 571st out of 945 entries. The
  creator built it with Claude Code on Three.js.
