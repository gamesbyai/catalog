slug: jianghu
title: jianghu
tagline: Fight wuxia duels by building a deck and playing cards each turn.
description: >-
  In jianghu you fight wuxia duels with a deck of cards. The creator sums it up
  as Slay the Spire meets wuxia, and that pairing is the draw. The structure is
  a deck-building card battler, and the setting is the martial arts world of
  wuxia and its wandering swordfighters.


  It is a single-player strategy game that plays in a desktop browser or on a
  phone, with Three.js rendering the duels. Codex, OpenAI's coding tool, was
  used to make it, and it came 246th of 945 at Vibe Jam 2026.


  You build the deck, then play cards from it each turn against your opponent.
  That makes each duel a question of what went into the deck beforehand, and
  which cards you choose to play and when.
