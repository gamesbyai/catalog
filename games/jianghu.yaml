slug: jianghu
title: jianghu
tagline: Fight wuxia duels by building a deck and playing cards each turn.
description: >-
  You fight wuxia duels with a deck of cards. The creator says, "slay the spire
  meets wuxia." This is a strategy game for one player.


  Duels set in the martial arts world of wuxia. Wandering swordfighters as part
  of the setting. A deck-building card battler.


  Build your deck. Play cards from it on each turn against your opponent. The
  deck you build beforehand and the timing of the cards you play both shape each
  duel.
