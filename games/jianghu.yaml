slug: jianghu
title: jianghu
tagline: Fight wuxia duels by building a deck and playing cards each turn.
description: >-
  Jianghu is a strategy game that blends deck-building combat with a martial
  arts setting. The creator describes it as Slay the Spire meets wuxia, so a run
  likely means facing opponents in turn-based card battles and choosing which
  techniques to play each round.


  The pairing of a card-battler structure with the wandering swordfighter world
  of wuxia is the main draw. It runs in the browser with 3D rendering through
  Three.js, and it is set up to work on mobile devices as well as desktop. It is
  a single-player experience where you build a deck and play cards each turn.


  The game was entered in Vibe Jam 2026, where it placed 246th among 945
  entries. The creator built it with Codex, OpenAI's coding tool.
