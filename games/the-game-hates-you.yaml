slug: the-game-hates-you
title: The Game Hates You
tagline: Play a browser game where the website itself works against you.
description: >-
  The Game Hates You is a browser-based interactive game built around a simple
  premise: you play the game, and the website fights back. Instead of a passive
  page wrapped around a playfield, the site itself acts as the opponent, so the
  interface is part of the challenge.


  The hostile-website hook is the main draw, turning ordinary web behavior into
  an antagonist. The project also mentions AI integration alongside modern web
  technologies. Few further details about levels or scoring are stated, so the
  appeal rests on that adversarial concept.


  The repository tags point to vibe coding and Claude Code, and the project
  comes from a developer publishing under the Devputta studio name. The tags are
  the only indication of the tooling, and no specific model is named.
