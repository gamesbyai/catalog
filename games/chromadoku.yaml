slug: chromadoku
title: Chromadoku
tagline: Fill a 9x9 Sudoku grid with colors instead of numbers.
description: "A puzzle's done when the 9×9 grid is full and no row, column or 3×3 box holds the same color twice. It's straight Sudoku, just with hues standing in for the digits. You pick a color from the strip under the board, then tap the square where it belongs.


  There are Easy, Medium and Hard puzzles, along with undo, redo, a clear button and a hint when you're stuck. Finishing one throws a bit of a party, with a shower of confetti and a congratulations card showing your time.


  The settings are surprisingly thoughtful for one small puzzle. Number badges put a 1 to 9 on every color, meant for when two shades blur together or for color-blind players. You can also switch between Default, Neon and Candy palettes and choose a light, dark or system theme.


  A mistake warning can flash any square the solution disagrees with, though your move stays put.


  Statistics count your solves on each difficulty. Best times only include puzzles finished without a hint, which keeps those records honest. Everything you've done and every setting you've picked stays in your own browser.


  According to the creator, the first version was written with GPT-3 and then revised with Claude Sonnet 5 for the interface. It all lives in a single HTML file, released into the public domain under CC0."
