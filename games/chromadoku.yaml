slug: chromadoku
title: Chromadoku
tagline: Fill a 9x9 Sudoku grid with colors instead of numbers.
description: "Fill the 9×9 grid so that no row, column or 3×3 box holds the same
  color twice. It's Sudoku with hues standing in for the digits.


  Easy, Medium and Hard puzzles. Undo, redo, clear, and a hint when you're
  stuck. Number badges, 1 to 9 on each color, for shades that blur together or
  for color-blind players. Mistake warning for squares that disagree with the
  solution. Solve counts per difficulty, plus best times for puzzles solved
  without a hint. A confetti burst and congratulations card showing your time.
  Your progress and settings, kept only in your own browser.


  Pick a color from the strip under the board, then tap a square to place it. If
  the mistake warning flashes a square, your move stays put. Set the theme to
  light, dark or system in settings.


  According to the creator, an early version was written by one AI model and
  then revised with a second one for the interface. Kevin MacLeod released the
  whole game as one self-contained HTML file into the public domain under CC0."
