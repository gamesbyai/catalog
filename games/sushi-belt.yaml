slug: sushi-belt
title: Sushi Belt !
tagline: Grab sushi off a conveyor belt and serve it to impatient customers.
description: >-
  Sushi Belt ! is a pixel art time management game set at a conveyor belt sushi
  counter. Plates roll past, and you grab the right pieces and hand them to
  customers who are waiting and losing patience. Each run is a race to keep
  orders filled before anyone gives up and leaves.


  Serving quickly in succession builds combos, which push your score higher.
  Those scores go to a global leaderboard, so every run doubles as an attempt to
  beat other players. The pace is fast, and the puzzle side comes from matching
  dishes to orders while the belt keeps moving.


  The creator says it was inspired by mobile cooking and time management games,
  along with a fondness for conveyor belt sushi. It was built with Claude Code
  and entered in Vibe Jam 2026. It is playable on mobile and is single player.
