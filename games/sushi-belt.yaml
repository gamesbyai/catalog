slug: sushi-belt
title: Sushi Belt !
tagline: Grab sushi off a conveyor belt and serve it to impatient customers.
description: >-
  Grab the right pieces of sushi off a conveyor belt and serve them to customers
  whose patience is running out.


  Orders to fill before customers give up and leave. Combos from serving in
  quick succession. A global leaderboard for scores. Dish-to-order matching
  while the belt keeps moving.


  Inspired by mobile cooking and time management games, and a fondness for
  conveyor belt sushi.
