slug: sushi-belt
title: Sushi Belt !
tagline: Grab sushi off a conveyor belt and serve it to impatient customers.
description: >-
  Sushi Belt is a pixel art time management game set at a conveyor belt sushi
  counter. Plates roll past, and you grab the right pieces and hand them to
  customers whose patience is running out, trying to keep every order filled
  before someone gives up and leaves.


  Mobile cooking and time management games were the inspiration, the creator
  says, plus a fondness for conveyor belt sushi. It was made with Claude Code as
  a single-player game, runs in mobile browsers, and placed 416th of 945 in Vibe
  Jam 2026.


  Serving in quick succession builds combos that push your score higher, and the
  scores go to a global leaderboard. The puzzle side is matching dishes to
  orders while the belt keeps moving and the customers keep waiting.
