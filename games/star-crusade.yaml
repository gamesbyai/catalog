slug: star-crusade
title: Star Crusade
tagline: Shoot waves of alien ships in a retro space arcade battle.
description: >-
  A small white ship sits at the bottom of a black starfield, with pixel-art
  aliens in pink, green, purple, magenta and tan spread across the screen above
  it. The top-left corner shows a Score, a Record and a heart counter that reads
  2 at the start.


  You slide the ship along the bottom with the arrow keys, fire with Space and
  set off a bomb with B. It is a retro arcade shooter in the Galaga mold, played
  on a single canvas, with the Score and Record readouts shown above the action.


  Three buttons under the canvas toggle sound, restart the run and pause it,
  each tied to its own key. The README frames you as a starship captain
  defending the galaxy against an ancient threat. The creator wrote it in plain
  JavaScript, pair-programming with ChatGPT and Copilot.
