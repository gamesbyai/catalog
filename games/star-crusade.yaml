slug: star-crusade
title: Star Crusade
tagline: Shoot waves of alien ships in a retro space arcade battle.
description: >-
  You slide the ship along the bottom with the arrow keys and shoot with Space,
  while a bomb waits on the B key as well.


  It's a retro arcade shooter that takes its cues from Galaga.


  Buttons handle turning sound on or off, restarting the run and pausing it.
  Each one has its own key too, S, R and P.


  The README pitches all this as a grand space epic, casting you as a starship
  captain saving the galaxy from an ancient evil.


  markets wrote it in plain JavaScript, pair-programming with ChatGPT and
  Copilot. You can also clone the repo and run it locally with npm.
