slug: star-crusade
title: Star Crusade
tagline: Shoot waves of alien ships in a retro space arcade battle.
description: >-
  When it loads, you're a tiny white ship at the bottom of a starfield, and
  pixel-art aliens in pink, green, purple, magenta and tan are already drifting
  around the screen. Your score and a record sit in the top corner. Right under
  them is a heart counter that starts at 2.


  The aliens all look different from each other, which is a nice touch for
  something this small.


  Arrows slide your ship left and right, and Space fires your gun. There's also
  a bomb on B, so you've got something extra besides the regular shots.


  The story has you as a starship captain leading a crew against an ancient evil
  that threatens the galaxy. That's a big setup for a single-screen arcade
  shooter, and the repo tags it as a nod to Galaga.


  The housekeeping lives on the keyboard too, which is considerate for a game
  this small.


  S toggles the sound, R restarts, and P pauses, so you can step away or start
  over without touching the page. The creator built it in plain JavaScript and
  pair-programmed it with ChatGPT and Copilot.
