slug: star-crusade
title: Star Crusade
tagline: Shoot waves of alien ships in a retro space arcade battle.
description: >-
  Playing alone, you take the controls of a starship in a retro arcade shooter.


  Galaga-style arcade shooting. A space epic about a starship captain defending
  the galaxy against an ancient evil.


  Use the arrow keys to slide the ship across the bottom. Press Space to shoot
  and B to use the bomb. Press S for sound on or off, R to restart the run, or P
  to pause. Buttons do the same.


  Written in plain JavaScript by markets, pair-programmed with AI. The repo can
  be cloned and started locally with npm.
