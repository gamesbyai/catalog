slug: star-crusade
title: Star Crusade
tagline: Shoot waves of alien ships in a retro space arcade battle.
description: >-
  Star Crusade is a retro arcade shooter written in plain JavaScript and drawn
  on an HTML canvas. It follows the classic Galaga-style formula: you pilot a
  ship through a space battle, fending off enemy formations and trying to
  survive as long as you can while racking up points.


  The project leans on old-school arcade design, with simple, readable action
  and no framework or engine underneath. Because it is plain JavaScript, the
  source is compact and easy to read, which makes it approachable for anyone who
  wants to see how a small arcade shooter is put together.


  The repository is tagged as vibe coding, and the project's listing names
  ChatGPT and GitHub Copilot among the tools involved. The creator's own
  statement about how each was used is not spelled out, so the tool credit comes
  from the repository's metadata.
