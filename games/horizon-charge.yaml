slug: horizon-charge
title: Horizon Charge
tagline: Fly an ion craft fast enough to keep its capacitor charged
description: >-
  Your ship runs on its own speed. Hold the charge button and it accelerates,
  and as long as you stay above the gold charge line the capacitor refills, but
  if you drop below it your remaining energy drains away.


  Steering isn't free, and hard turns cost you momentum, so every sharp swerve
  around an obstacle is a trade between keeping speed up and getting out of the
  way. That's a neat tension for a game where slowing down is what kills you.


  You're flying over a curved planet surface between tall tower formations.
  They're authored rather than random, which means the layouts stay the same and
  you can learn them. You also collect open capacitor arcs, and skimming close
  to hazards earns near-miss bonuses.


  The course keeps accelerating and there's no finish line, so you're chasing a
  longer distance. Your best distance is saved between runs.


  There are three stages, called Ignition, Vector and Redline. The screen shows
  a charge meter, your distance, a near-miss counter and a speed dial, and the
  planet's look reacts to how fast you're going.


  If flashing or camera shake bothers you, there are settings to reduce both,
  which is a considerate touch for a game built around speed. Steering and
  charging work with keyboard, gamepad, mouse or touch.
