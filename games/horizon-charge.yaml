slug: horizon-charge
title: Horizon Charge
tagline: Fly an ion craft fast enough to keep its capacitor charged
description: >-
  The aim is to cover as much distance as possible before the ion craft runs out
  of energy. Hold the charge input to accelerate. While your speed stays above
  the gold charge line, the capacitor refills. Drop below it and the remaining
  energy drains away.


  Steering costs momentum, so every sharp turn trades speed for position. You
  thread through authored tower formations, collect open capacitor arcs, and
  skim hazards close enough to earn near-miss bonuses. The obstacle layouts are
  deterministic, so repeated runs let you learn them.


  The course accelerates without end and moves through three stages: Ignition,
  Vector, and Redline. Your best distance is saved between sessions. Settings
  reduce flashing and camera shake, and the game accepts keyboard, gamepad,
  mouse, and touch input.


  Planet shaders and visual effects react to your speed. The creator lists code,
  graphics, sounds, and text as AI assisted.
