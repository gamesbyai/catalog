slug: horizon-charge
title: Horizon Charge
tagline: Fly an ion craft fast enough to keep its capacitor charged
description: >-
  Flying fast is what refills your ion craft's capacitor, and the aim is to
  cover as much distance as you can before its energy runs out. You hold the
  charge input to build speed, and as long as you stay above a gold charge line
  the capacitor refills, but once you sink below it, whatever energy is left
  starts draining away.


  Steering eats into your momentum, so every sharp turn costs you a bit of speed
  in exchange for a better spot.


  The course is made of designed tower formations that you thread between, with
  open capacitor arcs to grab along the way. Skimming close past a hazard earns
  you a near-miss bonus. The obstacle layouts are deterministic, which means the
  same patterns come back every run and you get to learn them.


  The course keeps speeding up without end and runs through three stages, from
  Ignition through Vector to Redline. Your best distance is saved between
  sessions.


  It takes keyboard, gamepad, mouse and touch. On a keyboard, A/D or the arrow
  keys steer while you hold Space, W or Up to charge, and a mouse or a finger
  can handle both jobs.


  The code, graphics, sounds and text were all made with AI assistance,
  according to Small Loop Works.
