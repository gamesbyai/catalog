slug: horizon-charge
title: Horizon Charge
tagline: Fly an ion craft fast enough to keep its capacitor charged
description: >-
  Flying fast is what refills the capacitor on an experimental ion craft. You
  fly through a 3D planetary course and try to cover as much distance as you can
  before the craft's energy runs out.


  Designed tower formations to thread between. Open capacitor arcs to grab along
  the way. Near-miss bonuses for skimming close past hazards. Deterministic
  obstacle layouts, the same on every run and learnable with practice. Three
  stages, Ignition, Vector and Redline, on a course that speeds up without end.
  Best-distance record saved between sessions. A bit of speed lost on every
  sharp turn, in exchange for a better spot.


  Hold Space, W or Up to charge and build speed. Steer with A/D or the arrow
  keys. Stay above the gold charge line, and the capacitor refills. Fall below
  it, and whatever energy is left drains away. A mouse or a finger can steer and
  charge. Play with a keyboard, gamepad, mouse or touch.


  According to Small Loop Works, the code, graphics, sounds and text were all
  made with AI assistance.
