slug: starjam
title: StarJam
tagline: Place defenses and click for income in a tower defense idler hybrid.
description: >-
  StarJam is a strategy game that combines tower defense with clicker and idler
  mechanics. Players build up defenses against incoming threats while also
  generating resources through clicking and passive income, so attention is
  split between placing towers and growing the economy that pays for them.


  The mix of the two genres is the main hook. Instead of waiting out each wave,
  the player has active work to do between placements, and idle progress keeps
  building over time. It suits short sessions as well as longer stretches of
  upgrading and optimizing.


  StarJam was entered in Vibe Jam 2026, where it placed 205th among 945 entries.
  It was built with the Godot engine, and the creator's details list Claude Code
  as the tool used in development.
