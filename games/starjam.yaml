slug: starjam
title: StarJam
tagline: Place defenses and click for income in a tower defense idler hybrid.
description: >-
  StarJam starts with an astronaut standing in a field of blue and red crystal
  clusters, beside a refinery. Counters under the character read 0/5 for each
  color. The refinery combines one blue and one red crystal into currency, which
  pays for upgrades.


  The goal is to collect 7,000 crystals as quickly as possible. A timer runs at
  the top of the screen, and a purple crystal counter in the top left tracks
  progress toward that target.


  Each time the refinery processes crystals, it attracts aliens that try to
  destroy it, so the game mixes tower defense with clicker and idle play.


  A text tutorial explains these rules at the start. You step through it with a
  Next button or skip it with a button in the top left. Space pauses the game,
  and F toggles fullscreen.
