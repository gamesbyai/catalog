slug: starjam
title: StarJam
tagline: Place defenses and click for income in a tower defense idler hybrid.
description: >-
  StarJam has you play an astronaut whose refinery is hungry for blue and red
  crystals. The refinery pays out currency for each pairing of a blue crystal
  with a red one.


  Upgrades paid for with that currency. A goal of 7,000 crystals, gathered as
  quickly as you can. Aliens bent on wrecking the refinery, drawn in each time
  it processes crystals. Tower defense mixed with clicker and idle play.
