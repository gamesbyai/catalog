slug: starjam
title: StarJam
tagline: Place defenses and click for income in a tower defense idler hybrid.
description: >-
  StarJam is a strategy game that puts a clicker inside tower defense. You build
  defenses against incoming threats while generating the resources that pay for
  them, partly by clicking and partly through passive income. Your attention is
  split between placing towers and growing the economy behind them.


  According to the creator, it was built in Godot with Claude Code, and it
  finished 205th of 945 in Vibe Jam 2026. The idler half changes the rhythm:
  instead of waiting out each wave, you have active work to do between
  placements, like clicking for income, and idle progress keeps building over
  time.


  It suits short sessions as well as longer stretches of upgrading and
  optimizing, and it is a single-player game that runs in the browser.
