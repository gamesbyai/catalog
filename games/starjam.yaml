slug: starjam
title: StarJam
tagline: Place defenses and click for income in a tower defense idler hybrid.
description: >-
  StarJam has you walking an astronaut through a field of blue and red crystals,
  picking them up and hauling them back to a refinery. You carry up to five of
  each color at a time, so you'll be making trips constantly.


  The refinery needs one blue and one red crystal to make its currency, which
  means grabbing only one color gets you nowhere. That currency pays for
  upgrades, and you're racing to reach 7,000 while a timer runs at the top of
  the screen.


  Every time the refinery processes crystals, it attracts aliens who want to
  tear it down, and that's where the tower defense half comes in.


  So the very thing that makes you richer also puts your base in danger, which
  is a neat way to tie a clicker-style grind to a defense game.


  The game opens with a short tutorial that walks you through the mission one
  message at a time. You can skip it if you'd rather work things out yourself.


  You can pause whenever you need to, and there's a fullscreen toggle too.
