slug: starjam
title: StarJam
tagline: Place defenses and click for income in a tower defense idler hybrid.
description: >-
  StarJam drops you in as an astronaut standing in a field of blue and red
  crystal clusters, right next to a refinery that's hungry for both colors.


  Counters under your character start at 0/5 for each color. The refinery takes
  one blue and one red crystal and turns the pair into currency. That money is
  what pays for your upgrades.


  Your goal is a whole 7,000 crystals, gathered as quickly as you can. A timer
  ticks at the top of the screen while a purple crystal counter in the top left
  tracks how close you are.


  Every time the refinery processes crystals, it draws in aliens bent on
  wrecking it, which is a pretty cruel way to get paid.


  Since the machine paying you is also what brings the attack, the game ends up
  mixing tower defense with clicker and idle play. A text tutorial explains all
  of this at the start, and you click Next to step through it. If you'd rather
  jump straight in, there's a skip button tucked in the top left.


  It's all drawn in chunky pixel art, with a dark rocky ground that makes the
  crystal colors pop. Space pauses the game, and F toggles fullscreen.
