slug: lunar-mass
title: Lunar Mass
tagline: Deploy bots to build a lunar mass driver while carving new craters in the Moon.
description: >-
  Lunar Mass has you in a spacesuit on a moon landing pad, trying to get power
  to a hab dome that has none. Mission Control talks you through it by text, and
  the first message says the dome is alive but hungry for power.


  Four materials, regolith, ice, ore and metal, each with a carry limit.
  Buildings paid for with everything you collect. Storage depots such as the hab
  depot and railend depot, which hold what's stored. Bots for putting the
  megastructure together. The full lunar mass driver as the bigger aim. New
  lunar craters created along the way, according to the creator. A leaderboard.


  Start by walking to the waypoint. Dig up regolith with F, then set down the
  solar kit that hooks the dome into the grid.


  lgvw3 made it as a way to learn about the lunar mass driver, which they hope
  to build with the Terafab team one day. They plan a more realistic simulation
  later. According to a note in the game, it is still over 90 percent
  AI-written.
