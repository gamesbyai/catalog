slug: lunar-mass
title: Lunar Mass
tagline: Deploy bots to build a lunar mass driver while carving new craters in the Moon.
description: >-
  Lunar Mass is a 3D building sim set on the Moon. The player constructs a mass
  driver, a huge launch structure, by putting an arsenal of bots to work on the
  surface. Progress comes from managing those bots and pushing the megastructure
  toward completion.


  Construction leaves a mark on the terrain, since new lunar craters appear
  while the work goes on. The mix of adventure, strategy, and simulation gives
  the build a planning side as well as a hands-on one.


  It was submitted to Vibe Jam 2026 and runs on Three.js. The creator built it
  with Cursor. They describe it as a way to learn about the Lunar Mass Driver
  project with the Terafab team, and they plan to grow it into a more realistic
  simulation later.
