slug: lunar-mass
title: Lunar Mass
tagline: Deploy bots to build a lunar mass driver while carving new craters in the Moon.
description: >-
  Lunar Mass starts with you in a spacesuit on a lunar pad beside a hab dome
  that has no power. Mission Control sends text prompts, and the first job is to
  head to a waypoint, mine regolith with F, and place a solar kit that connects
  the dome to the grid.


  A cargo panel lists what you carry: regolith, ice, ore and metal, each with a
  carry limit, and these resources are spent on buildings. Depots, including a
  hab depot and a railend depot, hold stored materials. Tabs for Ops, Launch,
  Power and Tips sit beside the cargo view, and the mission panel shows a
  Launches count.


  The larger goal is to build a lunar mass driver, with a set of bots helping
  construct the megastructure, and the creator describes creating new lunar
  craters along the way. You view the astronaut from behind in third person. A
  leaderboard is reachable from the title screen. The creator made it to learn
  about the mass driver and plans a more realistic simulation later.
