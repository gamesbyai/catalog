slug: lunar-mass
title: Lunar Mass
tagline: Deploy bots to build a lunar mass driver while carving new craters in the Moon.
description: >-
  Lunar Mass has you walk a spacesuited astronaut across the moon's surface and
  press F to mine regolith, which you then spend on the buildings of a mass
  driver.


  You carry regolith, ice, ore and metal, and each one has its own cap, so you
  can't just hoard everything. Deliveries go to depots, and the hab depot is
  ready for them while the railend depot starts out offline. Your first job is a
  solar kit, because the hab dome is alive but hungry for power.


  A mission control log in the corner walks you through the early steps and
  sends you to waypoints. A named engineer, J. Jensen from power systems, writes
  it, which makes it read like a person on the radio instead of a tutorial box.


  You also get a whole arsenal of bots to help you with the construction work.


  The building also leaves new craters behind, which is a funny side effect for
  a megastructure, since you're reshaping the moon while you work on it. A panel
  in the top corner has tabs for cargo, ops, launch, power and tips, so each
  part of the operation gets its own view. A launch counter in the log starts at
  zero.


  Logan Van Wagoner made it to learn about the Lunar Mass Driver with the
  Terafab team, and he wants to turn it into a much more realistic sim later. He
  says the mechanics are still over 90% AI written.
