slug: buzz-bingo
title: Buzz Bingo
tagline: Fill a bingo card with your own predictions and play along as events unfold.
description: >-
  Buzz Bingo is a multiplayer social prediction game built around the bingo
  card. Instead of fixed numbers, players write their own predictions onto a
  card, then watch a moment, crowd, or community to see which of them come true.
  Squares get marked as things happen, and the round is a race to complete a
  line.


  The idea comes from the familiar phrase about not having a certain outcome on
  your bingo card. Buzz Bingo turns that joke into a playable format, so any
  live event can become a game. Guessing what others will say or do adds a light
  puzzle and strategy layer to the card you build. It also works on mobile, so
  players can join from a phone.


  According to the creator, the game was built with Codex and entered in Vibe
  Jam 2026, where it placed 413th out of 945 entries.
