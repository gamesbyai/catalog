slug: buzz-bingo
title: Buzz Bingo
tagline: Fill a bingo card with your own predictions and play along as events unfold.
description: >-
  Buzz Bingo is a multiplayer social prediction game that swaps the numbers on a
  bingo card for your own predictions. You write them in, then watch a moment, a
  crowd or a community to see which ones come true, marking squares as things
  happen and racing to complete a line.


  The idea comes from the familiar line about something not being on your bingo
  card, turned into a format where any live event can become a game. Players can
  join from a phone, and the creator says it was built with Codex.


  The strategy is in the card you build. Guessing what other people will say or
  do is a light puzzle of its own, and the better your predictions, the faster
  your line fills.
