slug: buzz-bingo
title: Buzz Bingo
tagline: Fill a bingo card with your own predictions and play along as events unfold.
description: >-
  Your card has predictions where the numbers would be. You watch a live moment,
  crowd or community to see if they come true.


  A light puzzle in guessing what others will say or do. Strategy in the card
  you build. Faster line fills from better predictions.


  You mark a square when the thing you predicted happens. Race other players to
  complete a line.


  The idea came from a common saying that something is not on your bingo card.
  It was turned into a format where any live event can become a game.
