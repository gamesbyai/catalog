slug: heartjack
title: Heartjack
tagline: Fight other players in stylized melee duels that reward positioning and timing
description: >-
  Heartjack lets you fight as a boxer with oversized mechanical arms. In
  matches, you face other fighters in melee.


  Punch combos, kicks, stabs, dodges and jump-in attacks. Swapping between Rush
  and Idle bot behaviors. Pants or shorts outfits, swappable. A Beach map. The
  leaderboard, opened with Tab during a match.


  DaraChaww aimed to push what AI could do with models, animations and art
  direction.
