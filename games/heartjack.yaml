slug: heartjack
title: Heartjack
tagline: Fight other players in stylized melee duels that reward positioning and timing
description: >-
  You play as a boxer with oversized mechanical arms. You fight other fighters
  in melee: chain a punch combo, kick, stab, dodge, or jump into an attack. The
  creator aimed to push what AI could do with models, animations and art
  direction. You can switch the bot between Rush and Idle.


  You can switch your outfit between pants and shorts, and the game has a Beach
  map. Tab opens the leaderboard during a match.
