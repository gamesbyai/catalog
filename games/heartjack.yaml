slug: heartjack
title: Heartjack
tagline: Fight other players in stylized melee duels that reward positioning and timing
description: >-
  Heartjack puts you behind a boxer with red gloves on oversized mechanical
  arms, standing on a pink-sand beach. You fight other fighters in melee: chain
  a punch combo, kick, stab, dodge, or jump into an attack. The creator aimed to
  push what AI could do with models, animations and art direction.


  A health bar and a second bar sit above a portrait card in the lower left. A
  bot's health bar spans the top of the screen, with Rush and Idle buttons
  beneath it that switch what the bot does. The beach has an umbrella, a wooden
  table with chairs, tall grass and open water.


  A panel in the upper left switches your outfit between pants and shorts, and
  shows the Beach map and a surface toggle labeled RM Map On. A move list in the
  lower right corner shows the keys, and Tab opens the leaderboard during a
  match.
