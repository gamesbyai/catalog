slug: flock
title: FLOCK
tagline: Grow, dash and shoot your way to the top of a neon arena.
description: >-
  FLOCK is a neon arcade arena battler built around growing, dashing and
  shooting. You enter the arena, fight off opponents, and work toward victory by
  staying alive and eliminating everything in your way. Runs are fast and
  aggressive, with movement and firepower both mattering in every encounter.


  The look is bright neon on a dark field, and the pace leans on quick dashes
  combined with ranged attacks. The creator cites Minishoot' Adventures and
  Overwatch as inspirations, along with some earlier test games of their own,
  which shows in the mix of shooter-style aiming and arena combat. It also runs
  on mobile devices.


  FLOCK was entered in Vibe Jam 2026, where it placed 634th out of 945 entries.
  The creator built it with Claude Code, so AI assistance shaped the code of
  this jam project.
