slug: flock
title: FLOCK
tagline: Grow, dash and shoot your way to the top of a neon arena.
description: >-
  The arena is a neon synthwave scene with a glowing sun on the horizon and a
  magenta grid floor. Each fighter is a swarm of glowing dots, and yours is
  cyan. You move the swarm around, aim a reticle, hold fire, and dash away from
  rivals. Small brown clusters of dots drift around the arena.


  A match is a free-for-all against seven computer-controlled swarms, named by
  type: three Hunters, a Berserker, two Snipers and a Farmer. The first fighter
  to reach 10 kills wins. A scoreboard line under the arena tracks every
  fighter's kills and deaths, and Tab opens a full score view.


  Two meters sit at the bottom of the screen: dash charges and shotgun charges,
  each in five segments. Right-click fires the shotgun as a secondary attack
  alongside the held-down regular fire. Escape or P pauses, and gamepad input
  works as well as keyboard and mouse.


  The creator names Minishoot' Adventures and Overwatch as inspirations, along
  with some earlier test games made on Scratch.
