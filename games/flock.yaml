slug: flock
title: FLOCK
tagline: Grow, dash and shoot your way to the top of a neon arena.
description: >-
  Against seven computer-controlled swarms, you control one swarm in a
  free-for-all. You move, aim a reticle and dash away when a rival gets too
  close.


  Three Hunters, a Berserker, two Snipers and a Farmer as rivals, with names
  that show how they fight. First-to-10-kills finish for each match. Dash and
  shotgun, each on a five-segment charge. Complete gamepad layout alongside
  keyboard and mouse, each action on its own stick, trigger or button.


  Hold left click to fire. Right-click for the shotgun, a secondary attack.
  Press Tab to open the full score table.


  jongstra names Minishoot' Adventures and Overwatch as inspirations, plus some
  earlier Scratch test games.
