slug: the-guest-is-always-wrong
title: THE GUEST IS ALWAYS WRONG
tagline: Handle guest complaints at Edinburgh holiday flats while guarding your
  rating and sanity.
description: >-
  Solve each complaint at a set of supposedly luxury Edinburgh apartments, or
  pass it to someone else. Keep the five-star rating while guests pile on
  complaints.


  Sanity, profit and rating, tracked together. Consequences for every complaint.
  Six endings reached through your decisions, one for surviving peak season,
  four for losing control, one for losing your conscience. Text-based satire of
  holiday rentals.


  Bad Faith Games says the game “was born from a genuinely terrible experience”
  in a tourist apartment during summer 2026. Its complaints come from that
  experience. According to the creator, AI helped with code, graphics, sounds
  and text.
