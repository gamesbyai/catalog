slug: the-guest-is-always-wrong
title: THE GUEST IS ALWAYS WRONG
tagline: Handle guest complaints at Edinburgh holiday flats while guarding your
  rating and sanity.
description: >-
  The job is to keep a five-star rating across a set of Edinburgh holiday
  apartments while guests pile on complaints. Each complaint can be solved or
  passed off to someone else. You track three things at once: your sanity, your
  profit and the rating.


  It's a text game that satirizes the holiday rental business. Every complaint
  carries consequences, and your choices push you toward one of six endings. One
  ending is a way of surviving peak season. Four are different ways of losing
  control. The last is the one where you lose your conscience.


  The setup comes from the creator's own bad stay in a tourist apartment in
  Edinburgh, and the complaints in the game are drawn from that experience. The
  creator states that AI helped with the code, graphics, sounds and text.
