slug: bellum-liminis
title: Bellum Liminis
tagline: Survive escalating waves and build a fortress on a procedurally
  generated alien frontier.
description: >-
  Bellum Liminis is a top-down action shooter about survival after a failed
  operation leaves you stranded on a strange alien frontier. You fight
  escalating waves of enemies, gather alien technology, and use it to build up a
  living fortress that keeps you alive as the pressure grows.


  The world is procedurally generated, and it was the starting point of the
  project rather than an afterthought. The creator built the terrain and
  rendering first, then filled it with life, odd structures, and systems that
  react to the player. That order shaped the game into a blend of shooter, base
  building, and survivors-style survival.


  It was entered in Vibe Jam 2026, where it ranked 264th among 945 entries. It
  runs on Three.js and is marked as playable on mobile.
