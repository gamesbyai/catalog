slug: feast-for-the-eyes
title: Feast for the Eyes
tagline: Fetch the food that hungry eyes ask for, add extras, and earn tips for speed.
description: >-
  You're a waiter walking around a dim, carved-wood teahouse in first person,
  carrying food to customers who turn out to be a crowd of hungry eyes. Every
  delivery earns you coins, and the counter in the top corner keeps your total.


  Bring the dish they asked for and you can charge big money. Add a napkin or
  some cutlery and you can charge even more, which is a cheeky way to upsell a
  pair of eyeballs.


  Be quick about it and you'll get a tip on top, so speed pays too.


  The catch is that you can mess up your order, so you'll want to get it right
  before you set anything down.


  The main dining room has a round table with four carved chairs in front of
  lattice windows that glow an odd acid green. Off to the side, a narrow earthen
  hallway passes a small chest of drawers and ends at a door marked End Shift.


  Three small red eyes sit at the bottom of the screen while you walk around,
  and they look like they're watching you back.


  You can raise or lower the mouse sensitivity with the arrow keys, which is a
  considerate thing to have in a first-person game.


  N8012 came up with the idea, laid out the level and edited the textures, while
  Claude wrote nearly all the code. More maps, better textures and a story are
  on the creator's list for later updates.
