slug: feast-for-the-eyes
title: Feast for the Eyes
tagline: Fetch the food that hungry eyes ask for, add extras, and earn tips for speed.
description: >-
  Hungry eyes want to be fed, and you are the one bringing the food. Each order
  has to be filled correctly, because a wrong item counts as a mistake. Walk to
  the objects in the 3D space and pick up what the eyes asked for.


  Payment depends on how you serve. Delivering the requested food earns money.
  Adding a napkin, cutlery or similar extras raises the price you can charge,
  and a quick delivery earns a tip on top.


  Movement uses WASD, and the left mouse button interacts with objects. The up
  and down arrow keys raise or lower mouse sensitivity.


  The creator came up with the idea, laid out the level and edited the textures.
  Claude wrote nearly all of the code, ChatGPT produced the textures, and
  ElevenLabs and Suno made the sounds. Gemini gave additional help. The creator
  plans later updates with more maps, better textures and a story.
