slug: feast-for-the-eyes
title: Feast for the Eyes
tagline: Fetch the food that hungry eyes ask for, add extras, and earn tips for speed.
description: >-
  You serve a dining room where the customers are hungry eyes. Find the food
  they ask for and carry it over to fill each order.


  Mistakes for each wrong item brought over. Gold coins as pay for each correct
  order. Napkins, cutlery and similar extras thrown in for a higher price. Quick
  deliveries that earn a tip on top. The "End Shift" door for closing your
  shift.


  Walk with WASD. Interact with objects using the left mouse button. Press the
  up and down arrow keys to adjust mouse sensitivity.


  N8012 came up with the idea, laid out the level and edited the textures.
  According to the creator, Claude wrote nearly all of the code, ChatGPT made
  the textures, ElevenLabs and Suno produced the sounds, and Gemini gave
  additional help. They plan later updates with more maps, better textures and a
  story.
