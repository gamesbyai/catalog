slug: skyhop
title: SkyHop
tagline: Pilot a hovering craft through a futuristic space racing course.
description: >-
  You pilot a hovering craft through a futuristic course set among the stars,
  racing against the course itself. Your aim is to get around the course cleanly
  and quickly.


  The creator made it as a fresh take on HexGL, the browser racer they felt was
  long overdue for an update. The creator's main goal is to show what current
  WebGL rendering can look like in a browser. Cursor was the AI tool and
  Three.js handles the rendering.
