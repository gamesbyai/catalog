slug: skyhop
title: SkyHop
tagline: Pilot a hovering craft through a futuristic space racing course.
description: >-
  SkyHop is a space racing game in which the player pilots a craft along a track
  set among the stars. Each run is a race against the course itself, with the
  goal of getting around it cleanly and quickly. It runs in the browser and is
  playable on mobile devices as well as desktop.


  The game is a fresh take on HexGL, the browser racer the creator felt had gone
  without updates for a long time. The main aim is to show what current WebGL
  rendering can look like, so the visuals are the focus, with a space setting
  and a sense of speed.


  The creator built it with Cursor for the Vibe Jam 2026 and rendered it with
  Three.js. It is a single-player experience with no multiplayer mode.
