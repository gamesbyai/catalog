slug: skyhop
title: SkyHop
tagline: Pilot a hovering craft through a futuristic space racing course.
description: >-
  You pilot a hovering craft in a space racing game set among the stars.


  The course itself as the opponent. Getting around the course cleanly and
  quickly as the goal.


  sidcode_ made it as a fresh take on HexGL, a browser racer they felt was long
  overdue for an update. Their main goal is to show what current WebGL rendering
  can look like on the web.
