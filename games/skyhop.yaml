slug: skyhop
title: SkyHop
tagline: Pilot a hovering craft through a futuristic space racing course.
description: >-
  SkyHop is a space racing game in which you pilot a hovering craft through a
  futuristic course set among the stars. The race is against the course itself:
  get around it cleanly, and get around it quickly.


  The creator made it as a fresh take on HexGL, the browser racer they felt was
  long overdue for an update. Its main goal is to show what current WebGL
  rendering can look like in a browser, so the visuals come first: the space
  setting, and a sense of speed along the track.


  Cursor was the AI tool and Three.js handles the rendering. Out of 945 Vibe Jam
  2026 entries, it came 564th. It is single-player and runs on phones as well as
  desktop browsers.
