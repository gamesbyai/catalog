slug: space-defenders
title: Space Defenders
tagline: Shoot descending alien ships in a classic fixed-screen space shooter.
description: >-
  Space Defenders is a Space Invaders-style shooter that runs in the browser on
  an HTML5 canvas. The player defends the bottom of the screen against enemy
  ships in the classic fixed-shooter format, firing upward at the invaders to
  clear each wave.


  The game is a compact take on an arcade formula, made to show what a single
  prompt can produce. It keeps to the familiar structure of a small shooter with
  one screen and one clear goal, so there is little to learn before playing.


  The creator states it was generated from a single prompt with Claude 3.7
  Sonnet, and that it uses HTML5 Canvas for rendering. The whole game came out
  of that one request rather than a long series of edits.
