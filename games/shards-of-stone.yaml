slug: shards-of-stone
title: Shards of Stone
tagline: Build a base, train an army, and destroy the enemy in a fantasy RTS.
description: >-
  Shards of Stone is a fantasy real-time strategy game in the classic shape,
  played in the browser. You build a base, raise an army, and send it against an
  opposing faction, and the match goes to whichever side crushes the other's
  forces and holdings first.


  Matches can be played online against other people, from a phone or a desktop
  browser. Cursor supplied the AI help, and Three.js renders the 3D, so the
  whole game loads and plays right in a web page. It ranked 115th of 945 in Vibe
  Jam 2026.


  The factions are asymmetric, so each side plays differently and needs its own
  approach to building and combat. The creator played Warcraft 2 and 3 as a
  child, and those classic fantasy RTS games are the model here.
