title: Shards of Stone
tagline: Build a base, train an army, and destroy the enemy in a fantasy RTS.
description: >-
  In this fantasy real-time strategy game, you lead an army against an opposing
  faction.


  Base building and army raising. Asymmetric fantasy factions, each with its own
  approach to building and combat. Online matches against other people. The
  match won by whichever side destroys the rival's troops and holdings first.


  Inspired by Warcraft 2 and 3, the real-time strategy games AJSturrock played
  as a child.
