slug: sky-critters
title: Sky Critters
tagline: Pilot a drone, shoot critters, and spend coins on upgrades to guard your base.
description: >-
  Sky Critters is a tower defense game played from the cockpit of a drone. You
  fly over the map, shoot the critters that approach, and collect coins for each
  one you take down. The goal is to keep your base standing while the attackers
  keep coming.


  Instead of placing static turrets, the player is the defense, moving the drone
  into position and firing directly at targets. Coins earned in combat go toward
  upgrading your gear, so each round feeds into a stronger setup for the next.
  The game supports multiplayer and runs on mobile devices as well as desktop.


  It was built with Three.js and entered in Vibe Jam 2026, where it ranked 140th
  among 945 entries. The creator used Cursor during development.
