slug: japanimals-bear-brawl
title: "Japanimals: Bear Brawl"
tagline: Fight a muscular bear in one arena, block its attacks, and collect
  batteries to contain it
description: >-
  Collect enough batteries to power the Bear-B-Gone 9000, weaken the bear, and
  use the device to contain it. You play an underqualified animal-control worker
  in a single arena, facing one extremely muscular bear in a short fighting
  game.


  Attacks come at different heights, so you pick a high, middle, or low stance
  to match. Hold W or S while pressing Punch, Kick, or Block to act high or low;
  with neither held, the move is the middle version. Dodge the bear's charges
  and pick up battery packs between exchanges.


  Once the device has enough charge, press E to activate it and trap the bear.
  The whole fight is built around that one encounter, with a pause key available
  at any time.


  The creator describes it as human-directed, with ChatGPT used for planning,
  code help, and images, Gemini for sprite animation, and ElevenLabs for sound
  effects. Music is partly by Kevin MacLeod and partly from OpenGameArt.
