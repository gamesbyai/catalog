slug: the-lost-colors
title: The Lost Colors
tagline: Guide a young painter through a colorless kingdom, fighting creatures
  and restoring color.
description: >-
  Restore the colors stolen from Canvaria, a ruined kingdom drained of all
  color. You play Hue, a young painter traveling through Canvaria, fighting the
  color-hungry creatures that took its hues. You move through the world to bring
  life back before Hue fades and the kingdom's last spark goes out.


  Action, adventure, and platforming in 3D. Color as the goal and the stake.
  Progress meant to show as the gray landscape fills back in. Hue fading with
  the land on failure.


  PatrykKarw6413 points to Stardew Valley and Graveyard Keeper as influences on
  the tone and describes the graphics as AI-generated.
