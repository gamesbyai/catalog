slug: world-of-claudecraft
title: World of ClaudeCraft
tagline: Pick a class, take quests, clear dungeons and raids, and fight other
  players online.
description: >-
  World of ClaudeCraft is an open-source browser MMORPG in the classic style.
  Players choose from nine classes, accept quests, and explore the world before
  grouping up for dungeons and raids. Player-versus-player combat is also part
  of the game, so a session can mean questing on your own or fighting alongside
  and against other players.


  The design follows the structure of older online role-playing games and brings
  it into a browser tab, with class variety and group content as the main draw.
  The code is open source, so anyone can read how it works. It also includes an
  optional crypto token, which players can ignore while playing.


  According to the project's description, it was built with Claude, and the 3D
  world is rendered with Three.js. That pairing lets a large multiplayer-style
  game run directly in the browser without any installation step.
