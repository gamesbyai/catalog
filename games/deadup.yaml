slug: deadup
title: DEADUP
tagline: Shoot endless zombie waves while the arena closes in around you.
description: >-
  DEADUP is a zombie survival shooter in an arena that keeps closing in. The
  waves never stop coming, and as time passes the space you have to move in
  shrinks, so each run tests how long you can stay alive while both problems get
  worse.


  The creator, AbelSanzDev, draws on two sources. The nonstop wave survival
  comes from Call of Duty Zombies, and the sense of climbing through rising
  pressure comes from Tower of God. It was built with Cursor on Three.js, plays
  on phones as well as desktops, and placed 239th of 945 at Vibe Jam 2026.


  Together they give each run an upward push. The chaos escalates the longer you
  last, the horde keeps pressing, and the room to get away from it keeps
  shrinking.
