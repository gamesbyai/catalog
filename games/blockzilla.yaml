slug: blockzilla
title: Blockzilla
tagline: Play a giant kaiju smashing New York while evolving new powers each run.
description: >-
  Blockzilla is a roguelite action game in which you control a giant monster
  rampaging through a blocky version of New York City. You stomp through
  streets, wreck buildings, and fight off whatever tries to stop you, growing
  stronger over the course of each run as you pick up new abilities.


  The concept blends the auto-attacking, upgrade-stacking loop of Vampire
  Survivors with the city-wrecking fantasy of the classic arcade game Rampage.
  Rather than defending humanity, you play the destructive force, and the
  monster's evolving powers are the main reward for surviving longer. It also
  runs on mobile.


  The creator built it with Claude Code using Three.js, and it was entered in
  Vibe Jam 2026. The creator says the idea came from childhood memories of
  playing Rampage and wanting to turn that into a roguelike power fantasy.
