slug: blockzilla
title: Blockzilla
tagline: Play a giant kaiju smashing New York while evolving new powers each run.
description: >-
  Blockzilla makes you the destructive force instead of humanity's defender. You
  play a giant kaiju rampaging through a blocky New York City, stomping through
  streets, wrecking buildings and fighting off whatever tries to stop you.


  The loop takes the auto-attacking, upgrade-stacking structure of Vampire
  Survivors and points it at the city-wrecking fantasy of the arcade classic
  Rampage. The creator says the idea came from childhood memories of playing
  Rampage and a wish to turn that into a roguelike power fantasy. Built with
  Claude Code on Three.js, it placed 23rd of 945 at Vibe Jam 2026.


  It is a roguelite, so each run starts over. Along the way you pick up new
  abilities and grow stronger, and those evolving powers are the main reward for
  surviving longer.
