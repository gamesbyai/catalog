slug: rainy-day-sort
title: Rainy Day Sort
tagline: Pour and sort colored water between glasses in a calm, tactile puzzle.
description: >-
  Rows of glass tubes hold stacked bands of pink, blue, green, orange, purple
  and teal liquid. Select a tube, then select another to pour into it. The first
  screen shows a move counter at zero and two rows of tubes, most with empty
  space at the top.


  Some tubes start frozen and show a padlock. A line under the board reads "4
  neighboring moves unlocks", so a frozen tube opens after moves are made in the
  tubes beside it. Undo and SOS buttons sit under the title.


  Along the top are a Choose Level menu, a New Game button and a settings icon.
  The screen has a pale gray-blue background, a serif title and a small blue
  rabbit in the corner. The creator aimed for a cozy, tactile puzzle as an
  alternative to ad-heavy phone games.
