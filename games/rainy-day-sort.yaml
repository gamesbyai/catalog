slug: rainy-day-sort
title: Rainy Day Sort
tagline: Pour and sort colored water between glasses in a calm, tactile puzzle.
description: >-
  A set of tubes holds stacked bands of liquid that need sorting.


  A few frozen tubes at the start, each opened by four moves in the tubes beside
  it. Undo for a pour that goes wrong. An SOS button. Level choice.


  Start by picking a tube, then pick a second tube to pour into.


  JoysomeStudios built it with AI coding tools and a computer science degree
  about 25 years old. They had not coded since around 2001 and taught themselves
  to vibe code by doing it. They wanted a cozy, tactile puzzle as an alternative
  to ad-heavy app store games.
