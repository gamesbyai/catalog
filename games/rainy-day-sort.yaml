slug: rainy-day-sort
title: Rainy Day Sort
tagline: Pour and sort colored water between glasses in a calm, tactile puzzle.
description: >-
  You pour colored liquid from one tube into another, across two rows of tubes
  layered in soft pastels on a pale background. It's a cozy water sort puzzle
  that the creator built to feel meditative and tactile.


  Some tubes are frozen and wear a little padlock, so you can't use them right
  away. The note at the bottom says four moves on the tubes next to a frozen one
  will unlock it, which means what you do next door decides when it opens.
  That's a neat wrinkle for a sorting puzzle.


  If a pour goes wrong, there's an Undo button right at the top of the screen.


  An SOS button sits right beside Undo, and a moves counter under the buttons
  tracks your pours. You can also pick a level from a menu, start a new game, or
  open the settings.


  A small blue bunny with a flower sits in the bottom corner, keeping you
  company.


  The creator hadn't written code since around 2001, so this was a way to learn
  vibe coding by making something real. They also wanted an alternative to the
  ad-heavy, clunky puzzle games on the app stores, and they leaned on an old
  computer science degree along the way.
