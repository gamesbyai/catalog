slug: inkwharf
title: Inkwharf
tagline: Splash lime ink over a harbor pier and paint more of it than four bots
  in three minutes
description: >-
  You're one of four lime fighters on a harbor pier, with three teammates going
  up against four magenta bots. Each blast of lime ink lands on both the floor
  and the walls, which gradually shows who holds which spots.


  Each match runs on a three-minute clock, and when it hits zero, whichever team
  has painted more of the pier wins.


  The minimap in the corner helps you see the unpainted ground and the magenta
  team's advance. Hit TAB to bring up the full map.
