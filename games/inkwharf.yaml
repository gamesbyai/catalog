slug: inkwharf
title: Inkwharf
tagline: Splash lime ink over a harbor pier and paint more of it than four bots
  in three minutes
description: >-
  You're one of four lime fighters on a harbor pier, with three teammates
  against four magenta bots. Each blast of lime ink lands on the floor and the
  walls, and over time the paint shows which team holds each spot.


  Three-minute matches. Victory for the team with more of the pier painted at
  time-up. A minimap for spotting unpainted ground and the magenta team's
  advance.


  Press TAB to bring up the full map of the pier during a match.
