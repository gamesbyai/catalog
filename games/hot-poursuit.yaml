slug: hot-poursuit
title: Hot Poursuit
tagline: Chase down a thief in a Scotland Yard-style pursuit game with online players.
description: >-
  Hot Poursuit is a multiplayer pursuit simulation inspired by Scotland Yard.
  One side plays a thief trying to slip away, while the others act as
  investigators who track the target down. A round centers on the chase: the
  thief moves, the pursuers try to close in and make the catch.


  The premise is a hidden-target hunt, where pursuers have to work out where the
  thief has gone and cut off the routes. It supports online play with other
  people and is set up to work on mobile devices as well as desktop browsers.


  The game was entered in Vibe Jam 2026, where it placed 545th out of 945
  entries. According to the creator, it was built with the Cursor code editor.
