slug: vampire-strider
title: Vampire Strider
tagline: Run through a haunted castle as a vampire prince, slashing monsters
  along the way.
description: >-
  A vampire prince sprints through a castle without stopping, with no finish
  line. You cut down monsters in his way, trying to last as long as possible.


  Weapon, passive, summon and magic spell cards. Passives for stats and
  survivability. Summoned allies joining the fight. Cards like Holy Water, Thorn
  Whip, Battle Axe, Holy Cross and Blaze. Separate hunters, each a different
  character to build a run around.


  Choose a card when you level up. Each card adds something new or upgrades an
  existing one.


  mkronyak drew on classic gothic action games and paired that mood with an
  auto-runner's quick rhythm.
