slug: vampire-strider
title: Vampire Strider
tagline: Run through a haunted castle as a vampire prince, slashing monsters
  along the way.
description: >-
  In Vampire Strider the prince runs on his own, and your job is the sword. This
  gothic pixel-art auto-runner sends a vampire prince sprinting through an
  endless haunted castle while you slash at the monsters in his way and try to
  survive as long as you can.


  The creator paired the mood of classic gothic action games with the quick
  readability and rhythm of an auto-runner, aiming for a pace that is fast and
  easy to pick up. They made it in Phaser with Claude Code, and it was 227th of
  945 entries in Vibe Jam 2026.


  A run is a single dash through dark, hostile surroundings: haunted forests,
  ruined castles, stained glass halls, and monster-filled corridors, all in
  pixel art.
