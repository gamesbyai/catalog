slug: chain-camp-classic
title: Chain Camp Classic
tagline: Charge and release disc throws across nine top-down holes of pixel-art
  disc golf.
description: >-
  Play nine holes on one disc golf course, getting the disc into the basket on
  each hole with the fewest throws. A scorecard and your best scores are kept in
  your browser. Sessions average a few minutes.


  Driver, midrange or putter discs, thrown backhand or forehand. Wind that
  shifts from one hole to the next. Ricochet shots and risky routes, plus
  penalties for rough, water or out-of-bounds. Trailhead Toss, a 521-foot par 3
  opening hole. Practice Field mode. Procedurally generated music that adapts as
  you play.


  Each throw takes two separate presses. Aim by clicking or dragging on the
  course. Press and hold Space, or hold the throw panel, to build power. Release
  to lock the power in, then tap once more to choose the release angle. Use Q
  and E for fine aim. Near the basket, tap to putt when the meter reaches its
  midpoint. Touch works alongside the keyboard and mouse.


  joeydoorbell leaned heavily on games from their own childhood. AI image
  generation produced the art, and the Chain Camp team then readied it.
  TypeScript and Bun were used to build it, and the pixel font is Fibberish,
  credited to Nathan Scott / Caffinate.
