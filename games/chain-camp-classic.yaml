slug: chain-camp-classic
title: Chain Camp Classic
tagline: Charge and release disc throws across nine top-down holes of pixel-art
  disc golf.
description: >-
  Chain Camp Classic is a top-down disc golf game with a retro pixel look. A
  round covers nine holes on one course. On each throw you aim at the course,
  hold to charge power, release to lock it in, then tap again to set the angle
  of release. Near the basket, a timing meter handles the putt.


  Shots involve choices. You pick a driver, midrange, or putter and throw
  backhand or forehand, while each hole has its own wind. Risky routes,
  ricochets, rough, water, and out-of-bounds penalties reward careful planning.
  A Practice Field mode lets you work on throws, and scorecards and best scores
  are saved in the browser.


  It plays in the browser with keyboard, mouse, or touch, and uses adaptive
  procedural music. The creator built it with Phaser 4, TypeScript, and Bun, and
  the disclosure lists AI assistance for code and graphics, with art generated
  through OpenAI image generation.
