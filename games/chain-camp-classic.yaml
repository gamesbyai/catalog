slug: chain-camp-classic
title: Chain Camp Classic
tagline: Charge and release disc throws across nine top-down holes of pixel-art
  disc golf.
description: >-
  You're trying to get a disc into the basket in as few throws as you can across
  nine holes, and each hole has a par to beat. It's top-down disc golf, so you
  watch the disc sail across the course from above.


  A throw takes two steps, which catches people off guard. You hold to charge
  the power and let go to lock it in. Then you tap or press again to set the
  angle the disc comes off your hand at.


  There's a practice field if you'd rather work on that away from the scorecard.


  Your bag holds a driver, a midrange and a putter, and you can throw any of
  them backhand or forehand. Every hole has its own wind, which the top bar
  shows as an arrow and a speed beside the distance left and your shot count.


  Ricochets, rough, water and out-of-bounds penalties all push back, though
  there are risky routes if you'd rather gamble on a shorter line.


  Near the basket, putting switches to a timing meter instead of a charged
  throw, and on a touch screen you tap PUTT when the meter is centered. The
  first hole is Trailhead Toss, a par 3 of 521 feet. A raccoon named Rally
  watches from the corner of the screen, which is a friendly touch.


  Your scorecards and best scores are saved in the browser, and the pixel art
  has a CRT-era look with music that adapts as you play.
