slug: chain-camp-classic
title: Chain Camp Classic
tagline: Charge and release disc throws across nine top-down holes of pixel-art
  disc golf.
description: >-
  Nine holes of top-down disc golf on one course, with a scorecard and best
  scores saved in the browser. The HUD shows hole number, par, distance to the
  basket in feet, shot count, and wind speed. Hole 1 is a par 3 of 521 feet, and
  a raccoon named Rally sits in the corner.


  Each throw takes two inputs. Aim by clicking or dragging on the course, hold
  to charge power, release to lock it in, then tap again to set the angle of
  release. A bar along the bottom tracks the throw. Near the basket, putting
  switches to a timing meter.


  Pick a driver, midrange, or putter disc and throw backhand or forehand. Wind
  differs per hole. Holes include risky routes, ricochets, rough, water, and
  out-of-bounds penalties. A Practice Field mode is available from the main
  menu.


  The look is CRT-era pixel art, with procedural music that adapts as you play.
  A minimap toggle helps with the layout. Sessions run a few minutes, and touch
  controls are supported alongside keyboard and mouse.
