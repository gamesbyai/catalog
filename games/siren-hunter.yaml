slug: siren-hunter
title: Siren Hunter
tagline: Search the Seven Wonders in Street View to find hidden sirens.
description: >-
  Play alone in Google Street View, hunting for hidden sirens in a game of
  hide-and-seek.


  The Seven Wonders of the World, one site after another. A real, famous
  landmark at every stop. Anything out of place at each site.


  Pan the view and scan the surroundings, then move on once you have looked
  around.


  According to the creator, Mayank_Bishwas had been learning to code and vibe
  coding for about six months, with a couple of web tools already released. They
  handled the idea, design, images, and audio themselves and built the game with
  an AI coding assistant.
