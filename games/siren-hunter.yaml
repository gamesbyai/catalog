slug: siren-hunter
title: Siren Hunter
tagline: Search the Seven Wonders in Street View to find hidden sirens.
description: >-
  Siren Hunter is a hide-and-seek hunt across the Seven Wonders of the World,
  played in Google Street View. At each site you pan the view and scan the
  surroundings for hidden sirens and anything out of place, then move on to the
  next wonder.


  The creator says they had been learning to code and vibe coding for about six
  months, with a couple of web tools already released, and joined Vibe Jam 2026
  late. They handled the idea, design, images, and audio themselves and built
  the game with Claude Code.


  The places are real. Instead of a made-up map, every stop is real-world
  imagery of a famous landmark, which turns each one into a small search through
  a place that actually exists.
