slug: siren-hunter
title: Siren Hunter
tagline: Search the Seven Wonders in Street View to find hidden sirens.
description: >-
  Search the Seven Wonders of the World in Google Street View for hidden sirens
  in a game of hide-and-seek. At each site you pan the view and scan the
  surroundings for hidden sirens and anything out of place, then move on to the
  next wonder.


  The creator says they had been learning to code and vibe coding for about six
  months, with a couple of web tools already released. They handled the idea,
  design, images, and audio themselves and built the game with Claude Code.


  Every stop uses real-world imagery of a famous landmark, so each one is a
  search through a place that actually exists.
