slug: goal-locked-the-crucible
title: "Goal-Locked: The Crucible"
tagline: Score goals and outlast rivals in a shrinking cyber-sport arena.
description: >-
  Goal-Locked: The Crucible is a physics-driven action game that mixes sports
  with battle royale rules. Players compete inside a tactical arena that keeps
  shrinking, and the goal is to be the last one standing. Scoring is tied to
  survival, so each goal counts as a way to knock out an opponent.


  The main idea is to put elimination stakes into a sports format. Chaotic
  physics drive the brawling, so collisions and momentum shape each match
  instead of fixed animations. The presentation leans into a high-tech,
  cyber-sport look, with a shrinking play space that pushes everyone toward the
  same spot.


  The creator built it with Antigravity, and it runs on Three.js in the browser.
  It was entered in Vibe Jam 2026 and is playable on mobile devices as well as
  desktop. It is a single-player experience rather than a multiplayer one.
