slug: goal-locked-the-crucible
title: "Goal-Locked: The Crucible"
tagline: Score goals and outlast rivals in a shrinking cyber-sport arena.
description: >-
  Goal-Locked: The Crucible puts battle royale rules on a sport. You compete
  against rivals inside a tactical arena that keeps shrinking, and the aim is to
  be the last one standing. Each goal you score counts as a way to knock out an
  opponent.


  That ties survival to scoring and puts elimination stakes into a sports
  format, the main idea behind the design. Chaotic physics drive the brawling,
  so collisions and momentum shape each match instead of fixed animations, and
  the shrinking play space pushes everyone toward the same spot as the match
  goes on.


  The presentation leans into a high-tech, cyber-sport look, and the arena is
  rendered in Three.js. It is a Vibe Jam 2026 entry built in Antigravity that
  also runs on phones.
