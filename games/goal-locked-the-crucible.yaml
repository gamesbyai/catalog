slug: goal-locked-the-crucible
title: "Goal-Locked: The Crucible"
tagline: Score goals and outlast rivals in a shrinking cyber-sport arena.
description: >-
  Every goal you score knocks a rival out of the arena. Last sphere standing
  wins.


  Battle royale rules on a sport. A shrinking arena. Physics-driven brawling,
  with collisions and momentum doing the work. Best result, kills and a tier,
  starting at T1.


  Roll with WASD or the arrows, dash with Shift and fire a pulse with Space.


  whinhosa_exe wanted to shake up how predictable sports games tend to be.
