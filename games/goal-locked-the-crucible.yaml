slug: goal-locked-the-crucible
title: "Goal-Locked: The Crucible"
tagline: Score goals and outlast rivals in a shrinking cyber-sport arena.
description: >-
  The start screen shows a dark, neon-lit arena with glowing rings circling a
  football pitch, and a short instruction card sits over it. You're a sphere,
  and the goal is to be the last one standing.


  Scoring is how you knock rivals out, so the football part isn't decoration.
  The arena is also a shrinking tactical space, which means the room to play in
  gets smaller as the round goes on.


  Everything runs on chaotic physics, so it's a brawler as much as a sports
  game.


  You move with WASD or the arrow keys, and Shift gives you a dash. Space sends
  out a pulse, which the instructions list under tactics.


  Under the instructions there are three counters for your best score, your
  kills and a tier that starts at T1.


  The creator wanted to shake up sports games by giving them battle royale
  stakes and chaotic physics, which is a pretty odd pairing for a football
  match. It's a one-player game.
