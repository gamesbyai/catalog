slug: life-is-binary
title: Life is Binary
tagline: Farm, hack, and hustle with other players in a pixelated multiplayer life sim.
description: >-
  This multiplayer life sim is about farming, hacking and hustling. Its tagline
  reduces every choice to binary. It all starts in a 14 by 10 foot apartment
  that smells of burnt RAM, according to the intro.


  Missions from characters such as Nova, each with a title, a short brief and a
  Bits reward. Your first job, seating a starter fuse for 25 Bits, where the
  brief admits you could pocket the fuse instead. GL1TCH, your only roommate, a
  sarcastic toaster whose voice the intro says sounds like a chain-smoking
  dial-up modem. Online play with other players in one shared world.


  Accept, decline or ignore each mission. Open a chat with whoever sent it. A
  six-step slideshow sets all this up before you take control of a character.
  Skip it, or tick the box so it never shows again.
