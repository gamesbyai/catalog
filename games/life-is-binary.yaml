slug: life-is-binary
title: Life is Binary
tagline: Farm, hack, and hustle with other players in a pixelated multiplayer life sim.
description: >-
  You start in a cramped isometric apartment lined with bookshelves, monitors
  and neon posters, where a sarcastic floating toaster named GL1TCH is your only
  roommate. An intro slideshow of six steps sets the scene before you take
  control of a pixel-art character.


  Missions arrive as pop-ups from characters such as Nova, with a title, a short
  brief, a reward in Bits, and buttons to accept, decline or ignore. The first
  one asks you to install a starter fuse: open the Fuse Panel, pick an empty
  slot, and seat it to earn 25 Bits.


  The screen shows a day and clock readout, a level counter, a coin balance, a
  log-in button, and an item hotbar that holds things like a wooden stick. It is
  a multiplayer life sim with farming, hacking and hustling, and the world is
  shared with other players online. Each mission prompt also offers a chat with
  the character who sent it.
