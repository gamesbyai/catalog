slug: life-is-binary
title: Life is Binary
tagline: Farm, hack, and hustle with other players in a pixelated multiplayer life sim.
description: >-
  In Life is Binary you make a living by farming, hacking and hustling in a
  pixelated world you share with other players online. Every decision is framed
  as a 1 or a 0, and each choice about how to spend your time pushes your
  character down a different path.


  The creator used Cursor to build it in Three.js, and it finished 46th of 945
  at Vibe Jam 2026. Phones are supported alongside desktop browsers. It is an
  RPG and a life sim at once, with other players sharing the space.


  The pairing of rural chores and hacking gives it a mixed identity: a quiet
  farming routine sits alongside more scheming, computer-themed side work. The
  binary motif runs through the whole premise and gives the RPG-style
  progression a consistent theme.
