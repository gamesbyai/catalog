slug: lo-fi-super-neon-drive
title: Lo-Fi Super Neon Drive
tagline: Race neon-lit tracks against other players in a vaporwave arcade driver
description: >-
  Lo-Fi Super Neon Drive is a competitive arcade racer set in a vaporwave world
  of glowing lights and synth-flavored atmosphere. Players put the pedal down on
  neon tracks and race against other people, aiming to cross the line ahead of
  the pack in a quick, friendly contest.


  The appeal is in the mood. The visual style leans into pink and cyan glow, and
  the lo-fi soundtrack gives each race a relaxed, laid-back feel rather than a
  frantic one. Multiplayer is part of the design, so the competition comes from
  real opponents instead of only a lap timer. It also runs on mobile, which
  makes a short race easy to start anywhere.


  The creator made it for Vibe Jam 2026, where it placed 636th out of 945
  entries. It is built with the PixiJS rendering library, and the creator used
  Antigravity, Google's AI coding tool, during development.
