slug: clear-the-strait
title: Clear the Strait
tagline: Clear mines from the Strait of Hormuz in a shared multiplayer Minesweeper
description: >-
  Clear the Strait is a multiplayer take on Minesweeper set in the Strait of
  Hormuz. Players reveal tiles across a shared waterway, reading number clues to
  work out where mines are hidden and marking them so ships can pass. A run is
  about clearing the channel without hitting a mine.


  The game swaps the usual empty grid for a geopolitical setting, and the shared
  board makes it a cooperative or competitive effort rather than a solo puzzle.
  It draws on classic logic deduction and adds a strategic layer from playing
  alongside others. It also runs on mobile devices.


  It was entered in Vibe Jam 2026 and drawn on an HTML canvas. The creator
  states it was built with Windsurf, the AI coding editor, as part of the jam
  entry.
