slug: twin-suns-turbo
title: Twin Suns Turbo
tagline: Race a pod racer against rivals in a sci-fi take on F1 competition.
description: >-
  Twin Suns Turbo is a racing game set in a galaxy far, far away, where the
  player pilots a pod racer around a track in the style of Formula 1. Each run
  is a race against other competitors, with the goal of getting around the
  circuit ahead of the pack.


  The game grew out of the creator's wish to try a pod racer of their own after
  seeing an autonomous racer built for Fullsend.game. That origin gives it a
  clear point of reference, blending the look of space-opera pod racing with the
  structure of a motorsport event.


  It runs in the browser on Three.js and supports multiplayer and mobile play.
  The creator says it was vibecoded with Codex, and it was submitted to Vibe Jam
  2026.
