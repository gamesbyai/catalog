slug: twin-suns-turbo
title: Twin Suns Turbo
tagline: Race a pod racer against rivals in a sci-fi take on F1 competition.
description: >-
  Pilot a pod racer around a track in the style of Formula 1, in a faraway
  galaxy. Your goal is to finish the circuit ahead of the rest of the pack.


  Other racers sharing the track with you. Online multiplayer, with other
  players in the pack. Race structure modeled on a motorsport event.


  The game grew out of the creator's wish to test a pod racer that was theirs,
  after seeing a self-driving racer built for Fullsend.game. According to the
  creator, they vibecoded it.
