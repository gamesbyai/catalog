slug: mystic-realms
title: Mystic Realms
tagline: Explore a voxel world with other players and fight in shooter-style combat.
description: >-
  Mystic Realms is a browser-based multiplayer game set in a voxel world.
  Players join a shared space, explore the blocky landscape, and fight using
  shooter-style mechanics while taking on RPG-style roles alongside other people
  connected at the same time.


  The design mixes Minecraft-style exploration with fast-paced shooting, aiming
  for an MMO feel that runs directly in the browser. Joining is meant to be
  instant, so there is no install step between opening the page and sharing the
  world with others. It was entered in Vibe Jam 2026.


  The creator says the whole thing was built in a single morning with AI, as a
  way to show that complex multiplayer genres are within reach of more people.
  The project is built on Three.js.
