slug: mystic-realms
title: Mystic Realms
tagline: Explore a voxel world with other players and fight in shooter-style combat.
description: >-
  You play in a voxel world shared with other people online at the same time.
  You fight with shooter-style mechanics. The design pairs Minecraft-style
  exploration with fast-paced shooting and aims for an MMO feel in the browser.


  An RPG-style role to take on. A mystical setting. Instant joining, intended to
  happen as soon as the page opens.


  According to haruka_apps, the whole game was built in a single morning with
  AI. They wanted to show that complex multiplayer genres are within reach of
  more people.
