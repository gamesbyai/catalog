slug: beetlejump
title: BeetleJump
tagline: Jump your beetle up a towering course and try to reach the top.
description: >-
  In BeetleJump you hop from leaf to leaf up a giant beanstalk. You type a name
  and press Start, and the climb begins at the foot of the stalk.


  The goal is to reach the top of the stalk. Your time starts at 0.0 and counts
  up as you climb. A leaderboard with All-Time and Today tabs lists players'
  times.


  Some leaves carry extras, like a coiled spring pad and a crate-like object.


  Pressing E throws a fireball. Other beetles can join your climb, and a message
  announces each arrival. A chat box lets you type text.


  If you'd rather skip the public climb, you can pick Private Race. According to
  assentorp, the stalk is modeled on kz_giantbean, a Counter-Strike map. They
  say seeing other people's entries made this look like a good challenge.
