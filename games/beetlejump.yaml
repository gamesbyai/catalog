slug: beetlejump
title: BeetleJump
tagline: Jump your beetle up a towering course and try to reach the top.
description: >-
  Type a name, press Start, and a black beetle with red eyes appears on a
  lily-pad-like platform at the foot of a giant beanstalk rising out of a pond.
  You jump from leaf to leaf up the stalk, and a timer near the top of the
  screen counts up from 0.0 while you climb. The goal is to reach the top.


  Some leaves carry extras. A coiled spring pad sits on one leaf, and a
  crate-like object rests on another. Pressing E throws a fireball. Other
  beetles can join the climb, a message announces each arrival, and a chat box
  in the lower left corner takes text.


  The start screen also offers a Private Race button as an alternative to the
  public climb. A leaderboard with All-Time and Today tabs lists players' times
  and stays visible during play.


  The creator says the stalk is modeled on kz_giantbean, a Counter-Strike map,
  and that other people's entries made this look like a good challenge.
