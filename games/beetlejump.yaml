slug: beetlejump
title: BeetleJump
tagline: Jump your beetle up a towering course and try to reach the top.
description: >-
  BeetleJump has you playing a beetle that hops up a giant beanstalk, platform
  by platform, from leaf to leaf above a body of water. A timer runs while you
  climb, and the goal is to reach the top and be crowned.


  You steer with WASD and jump with Space. There's also a fireball on E, so the
  beetle isn't limited to just hopping.


  The leaves sit at different heights and angles around the stalk, and some have
  extras on them. One has a coiled spring sitting on it, and another has a
  little crate.


  You can type a name and jump straight in, or start a private race instead. A
  chat box at the bottom lets you send messages, and a note appears when another
  player joins the climb, so you're not up there alone.


  A leaderboard stays on screen the whole time, with tabs for all-time and
  today, so you can see the times you're chasing while you climb.


  The creator, assentorp, took the idea from a Counter-Strike map called
  kz_giantbean. They also said that seeing other people's jam games made this
  feel like a good challenge to try.
