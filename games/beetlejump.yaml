slug: beetlejump
title: BeetleJump
tagline: Jump your beetle up a towering course and try to reach the top.
description: >-
  BeetleJump is a 3D climbing platformer where you guide a beetle upward through
  a course of precarious jumps. The goal is simple: reach the summit and claim
  the title of king. Each attempt comes down to timing and precision, and a
  missed landing can cost you progress.


  The design draws on the Counter-Strike map kz_giantbean, a jump-focused
  climbing course, and it carries that map's demanding, unforgiving style. The
  game earned the Rage-Quit Award at Vibe Jam 2026, where it placed 20th among
  945 entries. It supports multiplayer and runs on mobile devices as well.


  The creator built it with Claude Code on Three.js. They said they came up with
  it after looking at other jam entries and wanting to try a challenge of their
  own.
