slug: beetlejump
title: BeetleJump
tagline: Jump your beetle up a towering course and try to reach the top.
description: >-
  BeetleJump lets you hop from leaf to leaf up a giant beanstalk. Your aim is to
  reach the top of the stalk.


  Timed climbs, with all-time and daily leaderboards. Spring pads and other
  extras on some leaves. Other beetles climbing alongside you, and a chat.
  Private Race, for skipping the public climb.


  Type a name and press Start to begin the climb at the foot of the stalk. Press
  E to throw a fireball.


  According to assentorp, the stalk is modeled on kz_giantbean, a Counter-Strike
  map. They say seeing other people's entries made this look like a good
  challenge.
