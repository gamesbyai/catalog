slug: astropilot-vr
title: Astropilot VR
tagline: Race through space in a phone-based VR view that responds to how you move
description: >-
  Astropilot VR has you steering a spaceship through space by moving your phone,
  and the view is meant to be seen in 3D VR. You hold the phone in landscape and
  aim for rings floating past big striped planets.


  The goal is to fly through as many rings as you can. Miss a single one and the
  run is over, so every ring decides whether you keep going.


  Before it starts, the game asks for motion sensor permission, because that's
  how it picks up your steering.


  There's a tutorial if you want to learn the controls first. For a regular run
  you pick Easy, Medium or Hard.


  The look is dark space with neon teal and purple rings and a glowing orange
  planet.


  Open the page on a desktop and you'll get a QR code that sends you to your
  phone, which makes sense for a game built only for phones. Mike Kasberg made
  it because he wondered whether phone browsers had the APIs for a VR-like
  experience, and he calls it a proof of concept he wants to add more features
  to.
