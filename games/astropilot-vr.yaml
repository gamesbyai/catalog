slug: astropilot-vr
title: Astropilot VR
tagline: Race through space in a phone-based VR view that responds to how you move
description: >-
  Astropilot VR has you fly a spaceship through as many rings as you can.


  Ring runs with no second chance after a miss. Easy, medium and hard difficulty
  levels. A tutorial before launch, or a straight start on any of them.


  Hold your phone sideways in landscape mode. Move it around to steer the
  spaceship. Allow motion sensor access when the game asks.


  mike_kasberg built it to see whether phone browser APIs could support an
  immersive, VR-like experience. It started as a proof of concept and came out
  better than mike_kasberg had imagined. More features are planned.
