slug: astropilot-vr
title: Astropilot VR
tagline: Race through space in a phone-based VR view that responds to how you move
description: >-
  Astropilot VR has you steer a spaceship by moving your phone, held in
  landscape mode, with the view set up as a 3D VR scene. The goal is to fly
  through as many rings as you can. Miss a ring and the game is over.


  The start screen offers a tutorial and three difficulty buttons: easy, medium
  and hard. The game needs motion sensor permission and works on iOS and on
  Chrome for Android. On a desktop, the page shows a QR code that opens the game
  on your phone.


  The backdrop is a neon space scene with a striped orange planet and large
  purple and teal rings drifting past. The creator built it to test whether
  phone browser APIs could produce an immersive, VR-like experience.
