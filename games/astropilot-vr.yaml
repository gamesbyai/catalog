slug: astropilot-vr
title: Astropilot VR
tagline: Race through space in a phone-based VR view that responds to how you move
description: >-
  You steer a spaceship by moving your phone around, holding it sideways in
  landscape mode.


  You fly through as many rings as you can. Miss even one, though, and the game
  is over.


  Before you launch, you can run through a tutorial or go straight to easy,
  medium or hard.


  The game needs permission to use your phone's motion sensors. It works on iOS
  and on Chrome for Android.


  mike_kasberg built it to find out whether phone browser APIs could pull off an
  immersive, VR-like experience. It started as a proof of concept and came out
  better than mike_kasberg had imagined. More features are planned.
