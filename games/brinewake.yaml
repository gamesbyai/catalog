slug: brinewake
title: Brinewake
tagline: Sail your own pirate sloop, dig up buried gold, and haul it home.
description: >-
  Dig up buried gold and carry it home in this first-person pirate sandbox.
  You're the captain of your own sloop, following X-marked maps across 22 isles
  of the Shimmering Sea. Reaching thirty thousand gold makes you a Legend.


  Skeleton crews, bad weather, and the Deepjaw, each able to send you to the
  Locker before the gold is in. Hull holes that let the hold fill with water,
  alongside the sailing. Speed from a following wind. A cutlass, a pistol, a
  shovel, bananas, and a concertina to cycle through. Walking, sprinting,
  jumping, and swimming once you're off the ship.


  Steer with A and D. Raise or lower the sails with W and S, and trim with Q and
  E. Seal holes with planks, and bail water out with a bucket. Click to use the
  item in hand, and right-click to aim or block. Press E to interact, pick
  things up, and take a post aboard the ship. Press M to open the world map and
  plan your next voyage.
