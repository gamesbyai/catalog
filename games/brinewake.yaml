slug: brinewake
title: Brinewake
tagline: Sail your own pirate sloop, dig up buried gold, and haul it home.
description: >-
  Thirty thousand gold is what it takes to become a Legend in this first-person
  pirate sandbox, and you get there by digging up buried gold and carrying it
  home. You're the captain of your own sloop, following maps with an X on them
  across 22 isles of the Shimmering Sea, and that's a lot of ocean for one ship.


  Skeleton crews, bad weather, and the Deepjaw can each send you down to the
  Locker before you bring the gold home.


  You steer with A and D, lower or raise the sails with W and S, and handle the
  trim with Q and E. A wind from behind gives you speed.


  Holes can open up in the hull, and once they do, the hold fills with water.
  You seal the leaks with planks, and you empty the flooding out with a bucket.
  Put the sailing and the leaks together, and the sloop becomes something you've
  got to look after as well as steer.


  The kit you cycle through holds a cutlass, a pistol, a shovel, plus bananas
  and a concertina.


  Once you're off the ship, walking, sprinting, jumping, and swimming are all
  open to you. A click uses whichever item you've got out, and right-click is
  for aiming or blocking. E is for interacting, picking things up, and taking a
  post aboard the ship. M opens the world map, where you plan your next voyage.
