slug: haldane-4
title: HALDANE-4
tagline: Descend alone beneath the Antarctic ice and uncover what waits below in ASCII.
description: >-
  The screen opens on a gray terminal panel labeled Operator Terminal v2.1.4. A
  boxed briefing names HALDANE-4, a submersible exploration platform of the
  United States Antarctic Survey, unit H4-ANT-72, dated 1972. Everything behind
  the briefing is drawn in text characters.


  You pilot the submersible alone on a descent beneath the Antarctic ice shelf.
  Thrust with WASD, rotate the view with the mouse, cut the engine with Shift,
  and switch on the light with Space. The key labels sit along the edges of the
  terminal frame.


  It is a short horror story told through that descent, with AI voice-over
  narration. The sound is generated procedurally, and the voice is the only
  audio made another way. The whole game fits in under 5 MB, with no assets
  beyond the code.
