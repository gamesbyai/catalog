slug: haldane-4
title: HALDANE-4
tagline: Descend alone beneath the Antarctic ice and uncover what waits below in ASCII.
description: >-
  You start at a dim operator terminal, a dark screen of percent signs, dots and
  hash marks with a boxed header that names a submersible exploration platform
  from a 1972 United States Antarctic survey.


  Everything is drawn in text characters, so the whole game is a grid of ASCII.
  It's a short horror story, and you go down alone beneath the Antarctic ice
  shelf.


  You steer with WASD for thrust and turn with the mouse. Space works your
  light, and Shift cuts the engine, while the control hints are printed along
  the sides of the screen so you don't have to hunt for them.


  The unit is labeled H4-ANT-72, which is a nicely specific bit of fake
  paperwork.


  The sound is generated procedurally, and the one exception is an AI
  voice-over. The creator set strict limits for this one: vibe coding only,
  ASCII graphics, under 5MB and no other assets. Because the characters and
  audio are all there is, they have to build the atmosphere and tell the story.


  The frame around the screen, with its version label on top and the unit label
  below, makes it look like old equipment you're operating.
