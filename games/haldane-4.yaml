slug: haldane-4
title: HALDANE-4
tagline: Descend alone beneath the Antarctic ice and uncover what waits below in ASCII.
description: >-
  When it loads, a gray panel titled Operator Terminal v2.1.4 fills the screen,
  and everything behind its boxed briefing is drawn in text characters.


  That briefing introduces HALDANE-4, a submersible exploration platform run by
  the United States Antarctic Survey. It's unit H4-ANT-72, and the 1972 date
  gives the whole thing the feel of an old government file.


  You're piloting that submersible alone, heading down beneath the Antarctic ice
  shelf. WASD gives you thrust while the mouse rotates your view, Shift cuts the
  engine and Space switches on the light. The key labels are printed along the
  edges of the terminal frame itself, so even the controls look like part of the
  machine.


  It's a short horror story, and it unfolds through that descent with an AI
  voice narrating over it.


  Every sound in it is generated procedurally, apart from that voice. The whole
  game comes in under 5 MB, with nothing beyond the code. Fitting a narrated
  horror story into that budget is no small trick.


  For denisbondare, the challenge was keeping to those strict limits, with ASCII
  graphics and vibe coding only, while still making something atmospheric that
  tells a story.
