slug: haldane-4
title: HALDANE-4
tagline: Descend alone beneath the Antarctic ice and uncover what waits below in ASCII.
description: >-
  HALDANE-4 is a short horror story told entirely in ASCII characters. You play
  a lone figure descending beneath the Antarctic ice shelf, moving deeper
  through cold, dark spaces as the story unfolds around you. It is a
  single-player game that plays on phones and desktops alike.


  A single run is brief and built around atmosphere and discovery. The game was
  made under tight rules, with ASCII graphics and a download under 5MB. All of
  its sound is generated procedurally, except for an AI-generated voice-over
  that carries part of the story, so text characters and synthesized audio do
  the work of building dread.


  It placed fifth of 945 entries at Vibe Jam 2026 and received the Most Original
  award from Cursor, the tool it was made with.
