slug: haldane-4
title: HALDANE-4
tagline: Descend alone beneath the Antarctic ice and uncover what waits below in ASCII.
description: >-
  Alone in HALDANE-4, a submersible exploration platform run by the United
  States Antarctic Survey, you descend beneath the Antarctic ice shelf. A short
  horror story unfolds through the descent, with an AI voice narrating.


  A 1972 briefing on unit H4-ANT-72. Procedural sound, apart from the voice.
  Under 5 MB in total, with nothing beyond the code.


  Use WASD to thrust and the mouse to rotate your view. Press Shift to cut the
  engine and Space to switch on the light.


  denisbondare kept to strict limits: ASCII graphics and vibe coding only, while
  still making something atmospheric that tells a story.
