slug: bible-challenge
title: Bible Challenge
tagline: Answer Bible questions and see how your knowledge compares with friends.
description: >-
  Answer trivia questions from the Bible and play against friends online. You
  answer to test how much scripture you actually know, then see how your
  knowledge compares with theirs, so a round turns into a friendly contest over
  who knows the text best.


  According to the creator, it was built with Lovable, an AI app-building tool,
  rather than a traditional game engine.


  The tone is reflective rather than purely competitive. The creator describes
  the idea as a way to see how real Christian beliefs remain to us.
