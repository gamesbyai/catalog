slug: aeralis
title: Aeralis
tagline: Fly and fight other players in a fast multiplayer third-person space shooter.
description: >-
  You control a hooded character seen from behind, running across a glowing blue
  plain dotted with crystals under a dark purple sky. Aiming is third person
  with a hexagonal reticle. Left mouse fires the Nullifier, which shows 28
  rounds with an unlimited reserve, and right mouse aims down sights.


  Movement goes beyond running: you can jump, crouch and slide. A timer sits at
  the top center between two kill counters and a rank marker, and a leaderboard
  panel in the corner lists you as Player. Health starts at 100. A banner
  announces an upcoming wave, such as Damage, which deals 60 damage.


  A compass strip shows your heading in degrees, and a circular minimap marks an
  exit point. A separate lightning ability sits on the F key, and reload and map
  each have their own key. The creator describes it as a fast multiplayer
  third-person shooter, drawing on movement shooters like Tribes, Destiny and
  Titanfall and on space games like Star Citizen, Starfield and No Man's Sky.
