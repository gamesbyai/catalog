slug: aeralis
title: Aeralis
tagline: Fly and fight other players in a fast multiplayer third-person space shooter.
description: >-
  Play a shooter where getting around isn't limited to running.


  The Nullifier, a gun with unlimited ammo reserve. Jump, crouch and slide
  movement on the keyboard. Minimap marking an exit point.


  Fire with left mouse button. Aim down sights with right mouse button. Press F
  for a lightning ability separate from the gun. Reload and open the map on
  separate keys.


  duckocancode calls it a fast multiplayer third-person shooter drawing on
  movement shooters like Tribes, Destiny and Titanfall, plus space games like
  Star Citizen, Starfield and No Man's Sky.
