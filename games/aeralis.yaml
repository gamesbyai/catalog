slug: aeralis
title: Aeralis
tagline: Fly and fight other players in a fast multiplayer third-person space shooter.
description: >-
  You're a hooded character running across a glowing blue alien landscape dotted
  with crystals, and the camera floats behind your shoulder while you shoot.


  On top of running and jumping, you can crouch and slide, which fits the
  creator's aim of a fast movement shooter in the spirit of Tribes, Destiny and
  Titanfall. Space games like Star Citizen, Starfield and No Man's Sky are the
  other influence.


  Your weapon is the Nullifier, and its counter shows 28 rounds with an infinity
  sign where the reserve would be. Hold the right mouse button to aim down
  sights and tap R to reload. F fires a lightning ability that the HUD calls
  your tactical.


  A banner at the top announces the upcoming wave, and the one on screen says it
  deals 60 damage.


  Your kill count sits beside a rival's, with a countdown clock between them
  that starts a little under five minutes. A leaderboard on the right and an
  alive counter show who else is in the match, because it's built as an online
  shooter.


  The round minimap has a compass and marks an exit, and pressing M opens a full
  map.
