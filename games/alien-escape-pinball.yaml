slug: alien-escape-pinball
title: Alien Escape Pinball
tagline: Work the flippers, hit ramps, and crack alien eggs to survive an
  invasion in pinball.
description: >-
  Hold Space to pull back the plunger and fire the ball, then keep it alive with
  the flippers while you try to survive an alien invasion. Drain every ball
  you've got and the aliens win.


  Skill shot on every fresh ball, a rollover bonus for landing in it. Box2D
  physics table with slingshots, bumpers, drop targets, spinner and two ramps.
  Egg you smash and capture for repeatable jackpots, hatching an alien in four
  forms. A-L-I-E-N spelling, an end-of-ball multiplier up to 5x and a briefly
  lit extra ball. Combo points for alternating target and lock hits within five
  seconds. Wizard mode, with a 5x multiplier, multiball and a boss alien from
  the egg.


  Hit each ramp three times to start multiball. Use Z or Left Arrow for the left
  flipper, and Forward Slash or Right Arrow for the right. Nudge the table by
  swiping, or with the period and X keys. On a phone, swipe across the top half
  of the screen. Killing the aliens the egg hatches refreshes your ball saver.
  Play with a mouse, keyboard, gamepad or touch.


  Focaccai says the code, art and sound were all made with heavy AI use. Suno
  made the music, and three songs come with it. GPT Image 2 painted all the
  artwork, and voice lines are spoken aloud in real time through text-to-speech.
