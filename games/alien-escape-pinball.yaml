slug: alien-escape-pinball
title: Alien Escape Pinball
tagline: Work the flippers, hit ramps, and crack alien eggs to survive an
  invasion in pinball.
description: >-
  Hold Space to pull back the plunger and fire the ball, then keep it alive with
  the flippers while you try to survive an alien invasion.


  Every fresh ball opens with a skill shot, a strobing rollover lane that pays a
  bonus if you land the ball in it. The table has a whole spread of slingshots,
  bumpers, drop targets, a spinner and two ramps, all running on real Box2D
  physics. Drain every ball you've got and the aliens win.


  Hit each ramp three times and multiball kicks off. There's also an egg you can
  smash and capture for jackpots that pay out again and again, and it hatches an
  alien that shows up in one of four forms.


  Killing those aliens refreshes your ball saver, a neat way of turning the
  invaders into your safety net.


  Spelling A-L-I-E-N cranks the end-of-ball bonus multiplier up as far as 5x,
  and it briefly lights an extra ball too. When you alternate target and lock
  hits within five seconds, you earn combo points on top. Wizard mode stacks
  that 5x multiplier with multiball, and breaking the egg while it's running
  brings out a boss alien.


  You can nudge the table by swiping or with keys, and the game works with
  mouse, keyboard, gamepad or touch. On a phone, swiping across the top half of
  the screen does the nudging.


  Voice lines get spoken aloud in real time through text-to-speech. Three songs
  come with it.


  The title screen goes all in on a giant purple eye and tentacles, plus a
  neon sign with the smug claim that they came for our high scores.


  Focaccai says the code, art and sound were all made with heavy AI use. Suno
  made the music, and GPT Image 2 painted all the artwork, title screen
  included.
