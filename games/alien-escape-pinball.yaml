slug: alien-escape-pinball
title: Alien Escape Pinball
tagline: Work the flippers, hit ramps, and crack alien eggs to survive an
  invasion in pinball.
description: >-
  Hold Space to pull the plunger and launch the ball, then work the flippers to
  keep it in play. Each fresh ball starts with a skill shot: a strobing rollover
  lane that pays a bonus if you hit it. Drain every ball and the aliens win.


  The table has slingshots, bumpers, drop targets, a spinner and two ramps. Hit
  each ramp three times to start multiball. Smash the egg and capture it for
  repeatable jackpots; it also hatches an alien that appears in one of four
  forms. Killing aliens refreshes the ball saver.


  Spelling A-L-I-E-N raises the end-of-ball bonus multiplier up to 5x and
  briefly lights an extra ball. Alternating target and lock hits within five
  seconds scores combo points. Wizard mode combines the 5x multiplier with
  multiball, and breaking the egg then spawns a boss alien.


  You can nudge the table by swiping or with keys, and the game plays with
  mouse, keyboard, gamepad or touch. Text-to-speech voice lines are spoken in
  real time, and the game includes three songs. The creator says the code, art
  and sound were made with heavy AI use.
