slug: alien-escape-pinball
title: Alien Escape Pinball
tagline: Work the flippers, hit ramps, and crack alien eggs to survive an
  invasion in pinball.
description: >-
  Pull the plunger to launch the ball, then work the flippers to keep it alive.
  It's a pinball table under alien attack, so you're hitting ramps, poking eyes,
  breaking eggs and knocking down targets while the invasion goes on around you.


  Each ramp needs three hits, and once both are done you get multiball. The egg
  is the other big target, because smashing and capturing it sets up jackpots
  you can repeat. Whatever hatches from it comes in four different forms, and
  killing those aliens refreshes your ball saver, which is a nice reason to go
  after them.


  There's a strobing rollover lane on every fresh ball for a skill shot bonus.
  Spelling ALIEN raises your end-of-ball multiplier up to 5x, and an extra ball
  lights up briefly right after you finish the word. Alternate between target
  and lock hits within five seconds and you get combo points.


  Wizard mode stacks the 5x multiplier with multiball, and breaking the egg then
  spawns a boss alien. That's a pretty big payoff for finishing the word.


  The table runs on Box2D physics, with slingshots, bumpers, drop targets and a
  spinner. You lose when every ball drains and the aliens win.


  Claude Opus wrote the code in VS Code, GPT Image 2 made the artwork and title
  screen, and Suno made the three songs. The voice you hear is real-time text to
  speech through the browser.
