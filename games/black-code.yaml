slug: black-code
title: BLACK CODE
tagline: Command a tactical squad in an isometric cyberpunk action-strategy prototype.
description: >-
  You command a squad of armed operatives through a cyberpunk city in real time.
  It mixes tactical action and strategy.


  Position holding, dash, or blink for each operative. Two squad stances, normal
  or aggressive on one key and stealth on another. Roguelike elements, according
  to its tags. Sessions of a few minutes.


  Left-click to shoot or select. Right-click to move your operatives or interact
  with things. Press Q and E to step through squad members one at a time. Press
  T to grab the whole team in one press. Press the number keys 1 to 4 to use
  items. Use the separate gear key to open your equipment.


  According to war3d, AI assisted with the graphics and sounds. war3d calls this
  build a prototype.
