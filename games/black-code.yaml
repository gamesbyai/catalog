slug: black-code
title: BLACK CODE
tagline: Command a tactical squad in an isometric cyberpunk action-strategy prototype.
description: >-
  You command a squad of operatives in a rain-soaked cyberpunk city, seen from
  an isometric angle. Left click shoots or selects, and right click sends the
  selected unit where you point or has it interact with whatever's there.


  Because it mixes real-time strategy with tactical action, you're running a
  whole team instead of one soldier. Q and E cycle through your operatives, T
  grabs all of them at once, and the number keys 1 to 4 pick items.


  Each operative can hold position with Shift, dash with Ctrl, blink with B or
  go stealthy with F. Pressing I flips the squad between a normal stance and an
  aggressive one, which is a neat way to change how they fight without issuing
  new orders. G opens gear.


  The title screen keeps a tactical guide on the left, so you don't have to hunt
  for the keys.


  Beyond the basics you get M for the map, C for status, O for objectives, H for
  a grid, plus and minus to zoom, P to pause and Esc for the menu.


  If clicking everything isn't your style, the options let you swap the classic
  mouse scheme for a WASD one. That's a considerate extra for a game with this
  many hotkeys.


  The full title is Black Code: Ghost in the Ledger, and MartincicBros / WAR3D
  made it. It's still labeled a prototype with a provisional name.
