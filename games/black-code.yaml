slug: black-code
title: BLACK CODE
tagline: Command a tactical squad in an isometric cyberpunk action-strategy prototype.
description: >-
  You command a squad of armed operatives in a rain-soaked cyberpunk city, seen
  from an isometric pixel-art view. Left click shoots or selects, and right
  click moves or interacts. Q and E cycle through squad members, and T selects
  everyone at once.


  Each operative can hold position, dash, or blink. Two stances change how the
  squad acts: a normal/aggressive mode and a stealth mode. Number keys 1 to 4
  use items, and a gear key opens equipment.


  Tactical overlays include a map, a status panel, an objectives list, and a
  grid view, plus zoom and pause. The options menu switches between classic
  mouse control and WASD movement. Sessions run a few minutes, and the tags list
  roguelike elements.


  The subtitle on the title screen is Ghost in the Ledger, and the creators
  label this build a prototype.
