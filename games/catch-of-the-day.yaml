slug: catch-of-the-day
title: Catch of The Day
tagline: Catch fish in swarming schools while dodging a hunting shark.
description: >-
  You swim around underwater in first person with a harpoon gun, picking out the
  right fish from a school and spearing it before the shark gets to you. A card
  in the corner names the fish you're after, like mackerel or grouper, with a
  multiplier next to it.


  You can't kill the shark, and that's the catch, so don't waste time trying.


  Two harpoon hits will stun it though, which buys you a moment to keep hunting.
  The harpoon has a small counter in the bottom corner, so you can see how many
  shots you've got before you line up the next one.


  The fish move as flocking schools, because the creator wanted to see how boids
  would behave in Three.js and then build a game around them.


  Your score sits at the top with a multiplier beside it, and a high score is
  kept in the corner. A short two-step tutorial pops up when you start and asks
  you to swim first.


  You can sprint, and a bar at the bottom drains as you use it, so you can't
  just rush everything. The art is low-poly, with dark murky water, drifting
  specks, and a chunky harpoon gun filling the lower right of the screen.
