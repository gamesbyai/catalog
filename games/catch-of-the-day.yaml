slug: catch-of-the-day
title: Catch of The Day
tagline: Catch fish in swarming schools while dodging a hunting shark.
description: >-
  Catch of The Day is a browser action game set among schools of fish. You go
  after fish moving in flocks while a shark hunts you, so each run is a race to
  catch as many as you can before the predator catches you.


  The game grew out of an experiment with boids, the flocking behavior in which
  each fish steers by its neighbors. That gives the schools a fluid, natural
  motion, and the chase depends on reading how the groups bend and scatter
  around you and the shark.


  It was an entry in Vibe Jam 2026, and the creator says it started as a test of
  how boids perform in Three.js. The creator built it with Claude Code. It also
  runs on mobile, so it can be played on a phone as well as in a desktop
  browser.
