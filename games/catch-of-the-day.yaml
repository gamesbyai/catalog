slug: catch-of-the-day
title: Catch of The Day
tagline: Catch fish in swarming schools while dodging a hunting shark.
description: >-
  The goal is to catch the right fish before the shark catches you. You're
  underwater with a harpoon gun, and your catch list names the species you're
  after, such as a mackerel or a grouper.


  You can't kill the shark, but landing two harpoons on it will stun it.


  WASD swims you around, Space takes you up and Shift takes you down. A double
  tap of W sends you into a sprint, and a bar tracks it. The mouse aims, left
  click fires and right click zooms in.


  A two-step tutorial walks you through your first moves, starting with
  swimming, and Esc pauses the game.


  0xPufferFish built the game to see how boids behave in Three.js, using a fish
  hunt as the test. The fish move around you in flocking groups.
