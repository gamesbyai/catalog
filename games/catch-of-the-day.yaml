slug: catch-of-the-day
title: Catch of The Day
tagline: Catch fish in swarming schools while dodging a hunting shark.
description: >-
  Catch the fish before the shark catches you. You swim underwater in first
  person with a harpoon gun and hunt the fish named in the catch panel at the
  top right, such as a mackerel or a grouper. The shark cannot be killed, but
  two harpoons stun it.


  Swim with WASD, rise with Space, sink with Shift, and double-tap W to sprint.
  A sprint bar runs along the bottom of the screen. Aim with the mouse, fire
  with left click, and zoom with right click. A harpoon gauge in the lower right
  corner shows a number, which starts at 1.


  Low-poly fish move around you in flocking groups. The creator built the game
  to see how boids behave in Three.js. The screen shows a score with a
  multiplier at the top center and a high score at the top left. A two-step
  tutorial prompts your first moves, and Esc pauses.
