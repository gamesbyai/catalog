slug: catch-of-the-day
title: Catch of The Day
tagline: Catch fish in swarming schools while dodging a hunting shark.
description: >-
  Catch of The Day drops you among swarming schools of fish with a shark on your
  trail. You go after the fish as they move in flocks, and each run is a race to
  catch as many as you can before the predator catches you.


  It started as a test of how boids perform in Three.js. Boids are the flocking
  behavior in which each fish steers by its neighbors, and the creator turned
  that experiment into a game with Claude Code. Vibe Jam 2026 ranked it 305th of
  945.


  Boids give the schools a fluid, natural motion, and the chase depends on
  reading it. You watch how the groups bend and scatter around you and around
  the shark, dodging the hunter while you line up the next catch.
