slug: catch-of-the-day
title: Catch of The Day
tagline: Catch fish in swarming schools while dodging a hunting shark.
description: >-
  Catch the right fish before the shark catches you. You're underwater with a
  harpoon gun, hunting species such as mackerel or grouper.


  A catch list of the species you're after. Two harpoon hits to stun the shark,
  which can't be killed. Flocking schools of fish around you. Double-tap W
  sprint with a tracking bar.


  Follow the two-step tutorial, which begins with swimming. Swim with WASD, and
  use Space and Shift to go up and down. Aim with the mouse, fire with left
  click, and zoom in with right click.


  0xPufferFish built the game to see how boids behave, with a fish hunt as the
  test.
