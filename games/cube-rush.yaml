slug: cube-rush
title: Cube Rush
tagline: Collect cubes matching your color in a multiplayer race to top each round.
description: >-
  Cube Rush is a multiplayer action game built in Three.js. Each player controls
  a character with an assigned color, and the arena is scattered with cubes in
  several colors. The goal is to gather the cubes that match your own color
  within one quarter of the match.


  The scoring is direct: the player who collects the most matching cubes in a
  quarter wins it. Because everyone competes over the same field, choosing which
  cubes to chase and which to leave for others matters as much as raw speed. The
  quarter structure splits a match into short rounds.


  The game was entered in Vibe Jam 2026, where it placed 171st out of 945
  entries. It is tagged as a kids-friendly action game and is aimed at desktop
  play rather than mobile.
