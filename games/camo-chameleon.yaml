slug: camo-chameleon
title: Camo Chameleon
tagline: Blend into your surroundings with paint and stay hidden from the hunter.
description: >-
  If you're a survivor, the hunter goes after you, and your job is to choose a
  spot and blend in. Surviving the hunt is the goal in this horror game, and the
  hunter is the reason painting matters.


  Your paint, matched to nearby colors you sample, based on the spot you pick.
  Online play with others through Join Online Game, held until someone else
  joins. Solo Practice, for going it alone, starting with the hunter right away.


  As a survivor, drag to look around.
