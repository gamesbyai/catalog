slug: volt-nomad
title: VOLT NOMAD
tagline: Click to damage mechanical beasts, spend charge on gear trees, and
  steal their cores.
description: >-
  Click, or tap Space, to strike the mechanical beast squaring off against your
  lone automaton deep underground, and every hit also banks you some charge to
  spend.


  That charge goes into five linked gear trees with 86 nodes between them, a
  surprising amount of branching to fit into something this compact. Over time,
  drones and automatic weapons start doing the clicking for you, with gatling
  and rail mutations among the weapon options. Eventually you can have five
  OVERLIMIT systems running at the same time.


  Six beasts sit on the hunt map, and you can take them in whatever order you
  like, while each one fights by its own rule. The cards spell those rules out
  plainly (Gearmaw cracks its armor on every 12th click for a 4× hit) and even
  name the kind of build each beast rewards.


  Beat a beast and you inherit its core, which combines with the rest of your
  build for bonuses, and your weapons, charge and cores all carry over from one
  hunt to the next.


  Taking down any three of the six gets you a quick ending. If you want more,
  you can go back for the rest, plus a second abyssal boss called ARCH
  SINGULARITY and a final fight against three forms waiting below the world
  engine. Clear everything and you get a true-ending cinematic and an archive of
  14 artworks.


  There's no game over, and losing isn't punished at all. What you're actually
  chasing is a build whose damage outruns what each fight asks for.


  All the text comes in English and Japanese, and one key press flips between
  them.


  Takahiro Saeki directed and playtested it and made the final calls. According
  to the creator, Codex wrote the code, PixelLab made the pixel art, and Suno
  produced the music.
