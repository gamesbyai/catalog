slug: volt-nomad
title: VOLT NOMAD
tagline: Click to damage mechanical beasts, spend charge on gear trees, and
  steal their cores.
description: >-
  Click, or tap Space, to give a manual command. Every one hits the machine in
  front of you and also earns CHARGE, which you spend on upgrades.


  You play a lone recovery robot heading down into a world engine, and you hunt
  mechanical beasts one at a time. There are six, and each has its own rule, so
  the build that beats one won't automatically beat the next. Gearmaw breaks its
  armor on every twelfth click, for example, while Vaultback opens its shell as
  your CHARGE hits milestones.


  Your upgrades live in five connected gear trees. They cover manual damage,
  drones, gatling and rail weapons, and the cores you take from fallen beasts,
  which is a lot of nodes to chew through since there are 86 of them.


  You pick the order of the hunts yourself, and nothing forces a sequence on
  you.


  Beat any three beasts and you can challenge a normal boss for the quick
  ending. If you want more, the other beasts are still there, along with a
  second abyssal boss called Arch Singularity and a final signal below the
  engine. The world engine fights in three phases, and the last confrontation is
  optional and has three forms.


  There's no game over, which is a kind choice for a game about damage races. If
  you lose ground, you just rework your build until it can outpace what the boss
  demands.


  Your weapons, CHARGE and cores carry across every hunt, and the game
  autosaves. Takahiro Saeki directed it with OpenAI Codex handling the code and
  balancing, and it supports mouse, touch, keyboard and gamepad, in English or
  Japanese.
