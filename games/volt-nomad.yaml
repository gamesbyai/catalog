slug: volt-nomad
title: VOLT NOMAD
tagline: Click to damage mechanical beasts, spend charge on gear trees, and
  steal their cores.
description: >-
  You control a lone automaton far below ground, facing a mechanical beast. Each
  manual command hits the enemy and produces charge, which you spend on upgrades
  across five gear trees. Over time, drones and automatic weapons take over the
  clicking.



  Six beasts can be fought in any order, and each follows its own combat rule.
  Defeating one lets you inherit its core, which feeds into synergies with your
  build. Beating any three of the six leads to a quick ending.



  Players who want more can go back for the remaining beasts, a second abyssal
  boss called ARCH SINGULARITY, and a final confrontation with three forms below
  the world engine. The gear trees hold 86 nodes. Gatling and rail mutations are
  among the weapon options, and five OVERLIMIT systems can run at once.



  There is no game over. Losing is not punished; the task is to find a build
  whose damage outpaces what each fight demands. Clearing everything unlocks a
  true ending cinematic and an artwork archive. Text is in English and Japanese.
  The creator states that Codex wrote the code, PixelLab made the pixel art, and
  Suno produced the music.
