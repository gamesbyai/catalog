slug: volt-nomad
title: VOLT NOMAD
tagline: Click to damage mechanical beasts, spend charge on gear trees, and
  steal their cores.
description: >-
  Strike a mechanical beast with clicks or Space, deep underground, and bank
  charge with every hit.


  Five linked gear trees with 86 nodes. Drones and automatic weapons that take
  over the clicking, with gatling and rail mutations. Up to five OVERLIMIT
  systems at once. Six beasts to hunt in any order, each fighting by its own
  rule, like Gearmaw cracking its armor every 12th click. Cores inherited from
  beaten beasts. No game over.


  Beat any three beasts for a quick ending, or go on to ARCH SINGULARITY and the
  three forms below the world engine for the true ending and an archive of 14
  artworks. Press one key to switch the text between English and Japanese.


  Takahiro Saeki directed and playtested it and made the final calls. According
  to the creator, Codex wrote the code, PixelLab made the pixel art and Suno
  produced the music.
