slug: the-long-night
title: The long Night
tagline: Play office worker Paul Rivers and find your trapped team inside a
  horror corporation.
description: >-
  The Long Night puts you in the role of Paul Rivers, who wakes up inside the
  Sterling Corporation, an industrial complex of rusty shredders and white
  office floors. Your goal is to find your coworkers before the system archives
  them.


  The tower has four levels, running from the basements up to the executive
  floor on Level 99. Each floor follows its own rules, has its own monsters, and
  is guarded by someone determined to hit their quota.


  Your choices matter. You can use your authority to bend the system or hold on
  to your humanity, and those decisions decide which of your friends survive.
  Between battles you build a refuge to serve as a safe place for the team.


  The story is told in a dark American comic style, as interactive fiction in
  the visual novel mold. A session runs about an hour. The creator says AI
  served as a digital brush for the visuals and atmosphere.
