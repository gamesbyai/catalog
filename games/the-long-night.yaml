slug: the-long-night
title: The long Night
tagline: Play office worker Paul Rivers and find your trapped team inside a
  horror corporation.
description: >-
  Play Paul Rivers, an office worker who wakes inside the Sterling Corporation
  and has to find his coworkers before the system archives them.


  Four levels, from the basements to the executive floor on Level 99. Floors
  with their own rules, monsters and quota-driven guards. Choices between
  bending the system and holding on to your humanity, deciding which friends
  survive. A refuge to build between battles. Interactive fiction in the visual
  novel mold, about an hour long.


  The creator used AI as a tool for the visuals and atmosphere.
