slug: starchart
title: STARCHART
tagline: Fly routes between generated stars and keep each route as a permanent
  constellation
description: >-
  You fly a ship from star to star, and each jump wears down your flux and hull.
  Each star's shape shows what it does: forges repair hull, shrines take a cut
  of flux, nebulae are gambles, and twin wrecks offer risky or safe salvage.
  Nothing resets, and even a failed run leaves a named, permanent constellation
  in your atlas, which doubles as your save file.


  Forty-eight star forms, six families, eight palettes each. Re-flown routes
  that deepen their line, never duplicated. Permanent grants by dominant family,
  stacking. Bulwark's +1 max hull, Reserve's +14 starting flux, Farsight's +9%
  jump range. Fortune's better salvage, Ward's hazard absorption, Covenant's +10
  flux at every shrine. Four sectors, The Verge from the start, The Drift, The
  Hollow Crown and The Long Dark, unlocked at 5, 12 and 21 inscriptions. Voyages
  of about half an hour.


  Read each star's form at a glance. Pick one of three far-apart gates, each
  opening its own region. Your gate sets where the next figure lands on your
  chart. Choose a cheap, safe hop or a long haul that strains your hull. Use
  jump range to reach stars that were unaffordable. Set anchor when you choose
  to stop, banking the route. Turn your route into a loop to seal it for twice
  the bonus, but you could drift first.


  Code draws every star, chart and name, and an identical voyage always gives
  the same chart and name. Sound is synthesized. Progress is saved in your
  browser at every arrival, and a tab closed mid-voyage resumes right where you
  left off. According to the creator, csaf, AI helped with the code, graphics
  and text.
