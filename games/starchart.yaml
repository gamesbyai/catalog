slug: starchart
title: STARCHART
tagline: Fly routes between generated stars and keep each route as a permanent
  constellation
description: >-
  You fly a ship from star to star, and every jump eats into your flux and your
  hull.


  Each star's shape tells you what it does, so the real skill here is reading
  the whole sky with one quick look. There are a surprising 48 star forms spread
  across six families, and every form comes in eight color palettes. A forge
  repairs your hull, a shrine takes a cut of your flux, a nebula is a gamble and
  a twin wreck hands you a choice between risky and safe salvage.


  You set off from one of three gates, and since they sit far apart and each
  opens a different region, picking one is really picking where your next figure
  lands on the chart. After that you pick how far to jump, either a cheap safe
  hop or a long haul that puts heavy strain on your hull to get to the star
  you're after. Then you decide when to stop.


  Dropping anchor lets you finish when you choose and banks the route. Bending
  your path back into a loop locks the constellation in and pays out twice the
  bonus, but chasing that loop means you could end up adrift before you close
  it.


  Whatever happens, even a voyage that goes badly gets a name and a permanent
  spot in your atlas as a constellation. Its dominant family gives you a
  permanent bonus like extra hull, more starting flux, longer jump range, better
  salvage, a ward that soaks up a hazard, or more flux from every shrine.
  Nothing resets, and because the bonuses stack, a bit more range can put stars
  in reach that you couldn't afford before.


  Retrace a route that's already on your chart and the atlas won't copy it,
  which is a lovely way to handle repeats, because the line just gets deeper.


  The atlas doubles as your save file, and in a clever touch it also opens up
  new sectors as it fills. The Verge is there from the start, and The Drift
  needs 5 inscriptions, The Hollow Crown 12 and The Long Dark 21.


  Oddly enough, there isn't one image file in the whole game, since every star,
  chart and name is drawn by code, and flying an identical voyage gives you an
  identical picture and name every time. The sound is synthesized, and you can
  switch it off. Progress saves on every arrival, so closing the tab mid-voyage
  drops you right back where you were.


  A run takes about half an hour. According to the creator, csaf, AI helped with
  the code, graphics and text.
