slug: gun-ladder
title: Gun Ladder
tagline: Fight in a first-person arena and score the most kills in five minutes.
description: >-
  Rounds of Gun Ladder last five minutes, and when the timer runs out, the
  player with the most kills wins. It is a first-person arena shooter played
  online in desktop and phone browsers, and every player spawns into the arena
  with a randomly assigned weapon and tries to rack up eliminations.


  Because the weapon is random on every spawn, each life plays differently and
  there is no favorite loadout to fall back on. You adapt to whatever weapon you
  are handed. Short rounds and a simple goal make it a game of quick matches
  against other players.


  It grew out of the creator's fond childhood memories of classic arena
  shooters. Made with Cursor on Three.js, it finished 137th of 945 entries at
  Vibe Jam 2026.
