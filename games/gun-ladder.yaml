slug: gun-ladder
title: Gun Ladder
tagline: Fight in a first-person arena and score the most kills in five minutes.
description: >-
  A round lasts five minutes, and whoever has the most kills when the clock runs
  out wins.


  You run around a first-person arena shooting other players, and each time you
  spawn the game hands you a random weapon. So you can't settle into a favorite
  gun, which keeps every respawn a bit of a gamble.


  The pool is wide: pistol, shotgun, SMG, assault rifle and sniper, plus a
  rocket launcher, rail gun, minigun, flamethrower, grenade launcher and even a
  katana. Whatever you draw is what you fight with until you respawn.


  Besides running and shooting, you can jump and slide around the arena.


  You type a name and press play, then click the screen to lock the mouse for
  aiming. Press Escape whenever you want the cursor back. There's also a
  copy-link button on the title screen, which makes it easy to send the game to
  a friend.


  The creator built it because of good childhood memories of this kind of
  shooter.
