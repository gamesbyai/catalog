slug: gun-ladder
title: Gun Ladder
tagline: Fight in a first-person arena and score the most kills in five minutes.
description: >-
  Rack up kills over a five-minute round, and whoever has the most when time
  runs out wins. You drop into a first-person arena where every other player is
  a target.


  Random weapon handed out on every spawn. Pistol, shotgun, SMG and assault
  rifle, plus a sniper. Rocket launcher, rail gun, minigun and flamethrower.
  Grenade launcher and katana. A roster of eleven weapons in total.


  Move with WASD. Jump with Space and slide with Shift. Aim with the mouse, fire
  with the left mouse button and reload with R. Click inside the game to lock
  the mouse for aiming, and press Esc to release it.


  merlinshabaj built the format from fond childhood memories of shooters of this
  kind.
