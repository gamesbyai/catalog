slug: gun-ladder
title: Gun Ladder
tagline: Fight in a first-person arena and score the most kills in five minutes.
description: >-
  Gun Ladder is a first-person arena shooter played in five-minute rounds. Each
  player spawns into the arena with a randomly assigned weapon and tries to rack
  up eliminations. When the timer runs out, the player with the most kills wins
  the round.


  The random weapon on every spawn keeps each life different, so players have to
  adapt to whatever they are handed instead of relying on a favorite loadout.
  Rounds are short and the goal is simple, which suits quick matches against
  other players online. It also runs on mobile devices.


  The creator says the game grew from fond childhood memories of classic arena
  shooters. It was built with Cursor on top of Three.js and entered in Vibe Jam
  2026.
