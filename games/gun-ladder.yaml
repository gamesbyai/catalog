slug: gun-ladder
title: Gun Ladder
tagline: Fight in a first-person arena and score the most kills in five minutes.
description: >-
  Rack up more kills than anyone else before the 5-minute clock runs out, and
  the round is yours.


  Type a name, hit Play and you drop into a first-person arena where every other
  player is a target. A Copy Link button on that same screen copies the game's
  link.


  What you're holding comes down to luck, because each spawn hands you a random
  weapon from a roster of 11. It runs from a pistol, shotgun, SMG and assault
  rifle through a sniper, rocket launcher, rail gun, minigun, flamethrower and
  grenade launcher. Then, for some reason, there's also a katana.


  The start screen lays out the whole lineup as little tags, each in its own
  color, a tidy preview of the spawn lottery.


  WASD moves you, Space jumps and Shift drops you into a slide. You aim with the
  mouse, fire with the left button and reload with R. Clicking inside the game
  locks the mouse for aiming, while Esc lets it go again.


  merlinshabaj built the format out of fond childhood memories of shooters like
  this one.
