slug: gun-ladder
title: Gun Ladder
tagline: Fight in a first-person arena and score the most kills in five minutes.
description: >-
  Whoever scores the most kills before the 5-minute clock runs out wins the
  round. You enter a name, press Play, and spawn in a first-person arena where
  every other player is a target.


  Each spawn hands you a random weapon. The roster has 11: pistol, shotgun, SMG,
  assault rifle, sniper, rocket launcher, rail gun, minigun, flamethrower,
  grenade launcher and katana. The start screen lists them, each tagged in its
  own color.


  Move with WASD, jump, slide, aim with the mouse and fire with the left button.
  R reloads. Click inside the game to lock the mouse for aiming, and press Esc
  to release it. A Copy Link button on the start screen copies the game's link.
  The creator built the format from fond childhood memories of shooters like
  this.
