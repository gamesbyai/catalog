slug: chess-defence
title: Chess Defence
tagline: Place chess pieces to hold off zombie waves and keep your king alive.
description: >-
  Chess Defence is a tower-defense game that turns chess pieces into towers and
  points them at zombies. Waves of the undead advance on your king, and you
  place pieces on the board to stop them. Each run is a series of waves, and
  positioning and piece choice decide whether the king survives.


  The creator says Vibe Jam 2026 finally pushed them to start a project they had
  been considering for a while. Cursor was the AI tool, Three.js handles the 3D
  presentation, and it plays on phones as well as desktops.


  The idea is to take a familiar board game and turn it into something
  different. Since the pieces act as defensive towers, knowing how each chess
  unit works carries over into planning your defense against the undead.
