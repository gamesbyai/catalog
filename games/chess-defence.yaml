slug: chess-defence
title: Chess Defence
tagline: Place chess pieces to hold off zombie waves and keep your king alive.
description: >-
  Chess Defence is a tower-defense strategy game built around classic chess
  units. Zombie waves advance on your king, and you deploy chess pieces to stop
  them. Each run is a series of waves where positioning and piece choice decide
  whether the king survives.


  The idea is to take a familiar board game and turn it into something
  different. Pieces take the role of defensive towers, so knowing how chess
  units work carries over into planning your defense against the undead. It also
  runs on mobile devices.


  The creator built it with Cursor using Three.js for the 3D presentation. It
  was made for Vibe Jam 2026, and the creator says the jam pushed them to
  finally start a project they had been considering for a while.
