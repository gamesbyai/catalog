slug: chess-defence
title: Chess Defence
tagline: Place chess pieces to hold off zombie waves and keep your king alive.
description: >-
  Place chess pieces on the board to hold back the undead before they reach your
  king. This is a tower-defense game.


  Chess pieces turned into towers against zombies. Runs built from a series of
  waves. Piece choice and board placement, the deciding factors for the king's
  survival. Knowledge of how each chess unit works, carried into defense
  planning.


  According to indierdcr, the idea is to take a familiar board game and turn it
  into something different. They had been considering this project for a while
  before starting it.
