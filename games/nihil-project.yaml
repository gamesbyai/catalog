slug: nihil-project
title: Nihil Project
tagline: Shoot through ten voxel rooms as an ex-hitman, picking upgrades between fights.
description: >-
  Between fights, you draft Fragments, upgrades that can change how a run plays,
  so each attempt takes a different shape depending on which ones you pick. You
  play an ex-hitman in a fast, top-down voxel roguelite shooter.


  Ten rooms, each a little harder than the last. The Nihil Project's hunters as
  your enemies. A goal of surviving every room and escaping alive.


  Ahmed_Arief12 wanted to make a game according to what they and other people
  want. "I want to know how other people react when they play the game I made,"
  the creator writes.
