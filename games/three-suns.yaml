slug: three-suns
title: Three Suns
tagline: Place gravity anchors to keep a world alive under three unpredictable suns.
description: >-
  Three Suns has you click or tap to drop gravity anchors around a system with
  three suns, because you're trying to keep the last living world alive.
  Touching a sun is fatal. The aura around each one drains your health while
  you're inside it.


  A signal meter limits how many anchors you can place, so you can't just cover
  the sky with them. Holding Space slows time whenever your focus is ready.


  You also switch between three survival modes with the 1, 2 and 3 keys.


  They're called Shield, Sleep and Observe, and you start in Shield. It raises
  your resistance to the red heat aura and keeps the cold and chaos risks
  modest, which tells you the dangers here come in more than one kind.


  The goal is to get through one impossible dawn after another.


  A panel in the corner shows your health, the day count, your mode and your
  best result, and a short opening lesson can be skipped. Liu Cixin's The
  Three-Body Problem and the real orbital mechanics puzzle inspired it, though
  the story, mechanics and world are original.
