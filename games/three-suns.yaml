slug: three-suns
title: Three Suns
tagline: Place gravity anchors to keep a world alive under three unpredictable suns.
description: >-
  Three Suns is a physics survival game set on the last living world in a
  chaotic three-sun system. The player places gravity anchors to steer the
  planet's path and switches between survival modes as conditions change, trying
  to last through one punishing dawn after another.


  The setup draws on the three-body problem from orbital mechanics and on Liu
  Cixin's novel The Three-Body Problem, but the story, mechanics, and world are
  original. Survival depends on reading how the suns pull on the planet and
  responding with well-timed anchor placement rather than steady, predictable
  orbits.


  It was entered in Vibe Jam 2026, where it placed 217th out of 945 entries. The
  game is built with Three.js and runs on mobile as well as desktop. The creator
  built it with ChatGPT.
