slug: three-suns
title: Three Suns
tagline: Place gravity anchors to keep a world alive under three unpredictable suns.
description: >-
  Three Suns has you protect the last living world in a physics survival game
  set in a system where three suns tug at its path in every direction. With no
  stable orbit to rely on, you watch how the suns pull at the planet.


  Gravity anchors, each one bending the planet's path. Signal limit capping how
  many anchors you can place. Survival modes you swap between to adapt as
  conditions shift, named Shield, Sleep and Observe. Shield mode, toughening the
  planet against a red sun's heat aura but raising cold and chaos risk. Focus
  ability that slows time. Sudden loss on contact with a sun. Health drained by
  sun auras.


  Click or tap to drop an anchor at the right moment. Press Space to focus.


  Inspired by Liu Cixin's novel The Three-Body Problem and by the three-body
  problem in orbital mechanics. The story, mechanics and world are all
  Danil38138190's own.
