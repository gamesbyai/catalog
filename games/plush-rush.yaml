slug: plush-rush
title: Plush Rush
tagline: Steer a plushie through three lanes of a real stock chart and chase P&L.
description: >-
  You steer a plush bear between three lanes as it keeps running. It's an
  endless runner, except the course is built from real market prices, so the
  price moves decide how the lanes play out. You pick any ticker you like, then
  guide the 3D plushie along a course whose numbers come from Alpaca and Yahoo
  Finance.


  Your account starts with $1 million. Buys, sells, shorts and covers get logged
  as you run, each with its price and what it gained or lost.


  There are two ways to play, with Morning Bell sending you through the first
  hour of trading while the live replay grabs the latest hour and runs it back
  at 60 times speed.


  Either way, an hour of price action gets squeezed into about a minute of
  running. Your profit and loss lands on a leaderboard. Your score is also
  measured against an "optimal" figure.


  lazy__lazers notes that the game isn't perfectly accurate and that slippage is
  likely.


  Watching kids play a Subway Surfers-style runner with TikTok or a couple of
  picture-in-picture videos going at once gave lazy__lazers the idea. It brought
  to mind traders keeping an eye on lots of charts at once, and they figured
  stock data would fit three lanes really well.
