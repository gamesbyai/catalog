slug: plush-rush
title: Plush Rush
tagline: Steer a plushie through three lanes of a real stock chart and chase P&L.
description: >-
  A fuzzy plush bear jogs down a peach-colored three-lane track lined with
  coins, while a trade log scrolls on the left and a MACD chart fills the right
  side. It's an endless runner, except the course is built from real market
  prices, so the price moves decide how the lanes play out. You pick any ticker
  you like, then guide the 3D plushie along a course whose numbers come from
  Alpaca and Yahoo Finance.


  A big counter at the top tracks your account, which starts from $1 million,
  and a tag under it shows if you're short or flat at the moment. The left panel
  fills up with buys, sells, shorts and covers as you run, each one showing its
  price and what it gained or lost — a trading floor dressed up in stuffed
  animals.


  There are two ways to play, with Morning Bell sending you through the first
  hour of trading while the live replay grabs the latest hour and runs it back
  at 60 times speed.


  Either way, an hour of price action gets squeezed into about a minute of
  running. Your profit and loss lands on a leaderboard. The score also shows how
  far off you are from an "optimal" figure in the corner, which is a pretty
  humbling number to keep on screen.


  lazy__lazers notes that the game isn't perfectly accurate and that slippage is
  likely.


  Watching kids play a Subway Surfers-style runner with TikTok or a couple of
  picture-in-picture videos going at once gave lazy__lazers the idea. It brought
  to mind traders keeping an eye on lots of charts at once, and they figured
  stock data would fit three lanes really well.
