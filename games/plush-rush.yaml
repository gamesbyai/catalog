slug: plush-rush
title: Plush Rush
tagline: Steer a plushie through three lanes of a real stock chart and chase P&L.
description: >-
  You're a fluffy plush bear running down a three-lane track, and the screen
  around you looks like a trading desk. A trade log sits on the left and a MACD
  histogram on the right, while your balance and a big ticker price hang at the
  top.


  Coins and green orbs come toward you along the lanes, and a small orange label
  tells you when to jump. The price readout shows a bar count, like 61/61 for
  SPY, so you can see how much of the session is left.


  Your current position shows as a tag, such as Short or Flat, right under the
  balance.


  Every buy, sell, short and cover lands in the log with its price, and the
  closed trades show a profit or loss in red or green. Next to your balance
  there's a percentage telling you how far you are from the best possible
  result, which is a pretty blunt way to be graded.


  You pick any ticker you like, so you're not stuck with one stock.


  Then you choose between Morning Bell, which covers the first hour of the
  market day, and a live replay mode running at 60 times speed. Either way an
  hour gets squeezed into about a minute, and your profit and loss goes onto a
  leaderboard.


  The price data comes from Alpaca and Yahoo Finance, so the moves are real. The
  creator admits it isn't perfectly accurate and slippage is likely, but the
  idea came from watching kids play Subway Surfer with other videos running
  beside it, which reminded them of traders with eight monitors.
