slug: plush-rush
title: Plush Rush
tagline: Steer a plushie through three lanes of a real stock chart and chase P&L.
description: >-
  Playing alone, you steer a 3D plush bear between three lanes in an endless
  runner. The course is built from real market prices, and the price moves
  decide how the lanes play out.


  Any ticker you pick, with numbers from Alpaca and Yahoo Finance. Morning Bell,
  the first hour of trading. Live replay, the latest hour played back at 60
  times speed. An hour of price action compressed into about a minute of
  running, in either mode. Profit and loss ranked on a leaderboard. Your score,
  measured against an "optimal" figure.


  Your account starts with $1 million. Buy, sell, short or cover as you run.
  Each trade is logged with its price and what it gained or lost.


  lazy__lazers got the idea from watching kids play a runner like Subway Surfers
  with TikTok or a couple of picture-in-picture videos going at once. It brought
  to mind traders watching lots of charts at once, and they figured stock data
  would fit three lanes well. lazy__lazers notes that the game isn't perfectly
  accurate and that slippage is likely.
