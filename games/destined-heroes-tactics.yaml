slug: destined-heroes-tactics
title: Destined Heroes Tactics
tagline: Command a squad of unique heroes in turn-based battles won by tactics alone.
description: >-
  Destined Heroes Tactics is a lite tactical RPG played in turns. You lead a
  group of heroes across the battlefield, positioning each unit and choosing its
  actions to defeat the opposing side. Outcomes come from planning rather than
  chance, so every move you make is a decision you can reason about.


  Each hero is unique, which shapes how you build a team and approach a fight.
  The design draws on a love of chess and on tactical RPGs like Fire Emblem,
  favoring careful positioning and reading your opponent over random rolls. The
  game also runs on mobile devices, so battles fit on a phone screen.


  The creator built it with Cursor, and it was entered in Vibe Jam 2026, where
  it placed 484th out of 945 entries in the final ranking.
