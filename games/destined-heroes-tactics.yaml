slug: destined-heroes-tactics
title: Destined Heroes Tactics
tagline: Command a squad of unique heroes in turn-based battles won by tactics alone.
description: >-
  Destined Heroes Tactics is a single-player lite tactical RPG where battles are
  won by planning, not luck. You lead a squad of unique heroes across the
  battlefield turn by turn, positioning each unit and choosing its actions to
  defeat the other side.


  The design draws on a love of chess and on tactical RPGs like Fire Emblem. It
  was built with Cursor in Unity and ranked 484th of the 945 entries at Vibe Jam
  2026, and the battles fit on a phone screen as well as a desktop one.


  Because each hero is unique, the team you build shapes how you approach a
  fight. Careful positioning and reading your opponent count for more than
  random rolls, so every move is a decision you can reason about.
