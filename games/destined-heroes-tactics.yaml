slug: destined-heroes-tactics
title: Destined Heroes Tactics
tagline: Command a squad of unique heroes in turn-based battles won by tactics alone.
description: >-
  Pick a format first, because the choice sets how big the battle is. 8v8
  Classic is a symmetrical fight between two full teams, 6v6 Rapid shrinks the
  teams, and 4v4 Blitz trims your options down even further.


  8v8 Chess is the odd one out. You start with a row of pawns lined up in front
  of your heroes, so the battle plays like a chess variant with a tactical RPG's
  cast.


  The fights happen on an isometric grid of grass, stone and water, drawn in
  pixel art. Each side fields heroes who look and play differently, and the
  title screen lines up a group of eight of them.


  Nothing in it is left to luck. It's a lite tactical RPG built on pure
  strategy, and the creator says it comes from a love of chess and Fire
  Emblem-style tactics, which explains the pawns.
