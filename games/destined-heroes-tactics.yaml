slug: destined-heroes-tactics
title: Destined Heroes Tactics
tagline: Command a squad of unique heroes in turn-based battles won by tactics alone.
description: >-
  Pick a battle format, then lead your squad of heroes across the battlefield
  one turn at a time. Place each unit and choose its action to beat the other
  side, where every move is something you can reason through. Battles are won by
  planning, not luck, since this lighter take on the tactical RPG is pitched as
  pure strategy and tactics.


  Eight unique heroes, from spear carriers to an armored knight. Team building,
  with each hero shaping your approach to a battle. Formats from two 8v8
  matchups down to a 6v6 Rapid mode with smaller teams. A 4v4 Blitz with your
  options cut right down. Classic, with both sides kept symmetrical. Chess, the
  odd one out, a chess variant with a row of pawns in the battle. Careful
  positioning and reading your opponent.


  WillifordBlake drew on a love of chess alongside tactical RPGs like Fire
  Emblem. Through a Discord community, WillifordBlake welcomes feedback, bug
  reports and suggestions.
