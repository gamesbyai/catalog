slug: maze-duel
title: maze duel
tagline: Build a labyrinth to trap your opponent, then use items to escape theirs.
description: >-
  Two players face off in a turn-based 3D labyrinth. Each side designs a maze
  meant to confuse the other, then both take turns walking through the
  opponent's maze from a first-person view, one you have never seen. Your design
  choices matter, because your opponent works through them in real time.


  Traps placed along the way. Items for getting past those traps. A tactical
  layer on each turn, from using items. Puzzle and simulation elements in a
  single duel.
