slug: dr-frogsworth-and-the-stolen-formulas
title: Dr. Frogsworth and the Stolen Formulas
tagline: Hop and blast through five decaying internet realms as a frog doctor
  reclaiming memes.
description: >-
  You hop and blast your way across pixel-art platforms as Dr. Frogsworth, a
  frog in a lab coat, through five realms of a decaying internet.


  The Wojak King and Dr. Croak have grabbed the meme formulas Frogsworth made
  and locked them away. Your job is to take them back so they can be copied and
  remixed freely again.


  Along the way you'll see bats drifting overhead, spike pits cut into the
  floor, and a miner-looking enemy walking the ground. Floating platforms carry
  pickups, so some jumps are worth the detour. The HUD shows a health bar, the
  level number, a coin count and your hearts.


  There's a super hop too, and it gets its own input instead of being a longer
  jump.


  You hold down and then press up to charge a leap and release it. Holding the
  charge key fans your blaster shots out wider, and the frog dash gets a key of
  its own.


  Before you start, you click Frogsworth and pick a difficulty. Easy shows an
  infinity symbol for lives, normal gives you three hearts, and hard leaves you
  just one, so the menu tells you what you're signing up for.


  The creator grew up on Super Mario Bros. and Mega Man 2, and built this as a
  love letter to NES-era platformers. Making the villains the ones gatekeeping
  memes is a funny flip on the usual bad guys.
