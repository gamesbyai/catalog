slug: dr-frogsworth-and-the-stolen-formulas
title: Dr. Frogsworth and the Stolen Formulas
tagline: Hop and blast through five decaying internet realms as a frog doctor
  reclaiming memes.
description: >-
  A pixel-art side-scroller in the Mario and Mega Man mold, where a frog
  scientist in a lab coat fights through five realms of internet decay to
  recover meme formulas from the Wojak King and Dr. Croak. The title screen asks
  you to click Frogsworth to start.


  Before starting you pick a difficulty: Easy gives infinite lives, Normal gives
  three hearts, and Hard gives one. In a level you run and jump across purple
  cave ground and hop over fire spikes. Bats drift overhead and a
  hardhat-wearing enemy patrols the ground. Green pickups sit above floating
  platforms and blocks.


  The Frog Blaster is your shot, and holding down then pressing up charges a
  Super Hop for extra height. Holding Shift charges a blaster fan shot that
  unlocks at level 2, and Frog Dash unlocks at level 4. The HUD shows a health
  bar, hearts, a coin count, and the current level, and a controls panel can be
  toggled with H.
