slug: dr-frogsworth-and-the-stolen-formulas
title: Dr. Frogsworth and the Stolen Formulas
tagline: Hop and blast through five decaying internet realms as a frog doctor
  reclaiming memes.
description: >-
  Dr. Frogsworth, a frog scientist, hops and blasts across five realms of
  internet decay in this side-scroller. You take back the meme formulas from
  Wojak King and Dr. Croak. Both villains are patent hoarders sitting on the
  formulas.


  Your main weapon, the Frog Blaster. Frog Dash, opened at level 4. New moves
  picked up along the way, as in Mega Man.


  Click Frogsworth to start. Choose Easy, Normal or Hard before you begin. Easy
  gives you infinite lives, Normal three hearts and Hard one heart. Run and jump
  in a level, hopping over fire spikes while an enemy patrols the floor. Hold
  jump for more height. Hold down, then press up, to charge a Super Hop for an
  even bigger leap. Hold Shift to charge a fanned-out blaster shot from level 2.
  Press H to show or hide the controls panel.


  AIMemeCreator grew up on Super Mario Bros. and Mega Man 2. The game is built
  as a nod to Mario and Mega Man. AIMemeCreator wanted a game where the bad guys
  are the ones trying to stop memes from being freely stolen and remixed.
