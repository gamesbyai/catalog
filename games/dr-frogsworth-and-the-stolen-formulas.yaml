slug: dr-frogsworth-and-the-stolen-formulas
title: Dr. Frogsworth and the Stolen Formulas
tagline: Hop and blast through five decaying internet realms as a frog doctor
  reclaiming memes.
description: >-
  A frog scientist in a lab coat named Dr. Frogsworth has to blast and hop
  through five realms of internet decay to take back meme formulas from the
  Wojak King and Dr. Croak.


  It's a pixel-art side-scroller built as a nod to Mario and Mega Man, and the
  villains are patent hoarders sitting on the formulas. AIMemeCreator grew up on
  Super Mario Bros. and Mega Man 2 and wanted a game where the bad guys are the
  ones trying to stop memes from being freely stolen and remixed.


  The title screen asks you to click on Frogsworth himself to start, a cute
  stand-in for a plain start button. Before you do, you pick how forgiving it'll
  be. Easy hands you infinite lives, Normal gives you three hearts, and Hard
  leaves you with just one.


  In a level you run and jump across purple cave ground, hopping over fire
  spikes while bats drift overhead, a hardhat-wearing enemy patrols the floor
  and green pickups float above platforms and blocks.


  Your main weapon is the Frog Blaster, and holding the jump button gets you
  more height. If you hold down and then press up, you charge a Super Hop for an
  even bigger leap. Holding Shift charges a fanned-out blaster shot from level 2
  and Frog Dash opens up at level 4, so you pick up new moves as you go, the way
  Mega Man does it.


  Up top, the HUD tracks your health bar, hearts, coins and current level, and
  pressing H shows or hides a controls panel.
