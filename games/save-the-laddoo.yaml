slug: save-the-laddoo
title: Save The Laddoo
tagline: Defend a single laddoo on the table from waves of ants at Nani's house.
description: >-
  You guard a single laddoo on a table in Nani's house during summer vacation
  while ants head for it. The goal is to hold them off for 3 minutes. An intro
  scene shows the laddoo on a metal plate with ants walking along the table
  edge, and it has a Skip Intro button.


  You have five ways to stop them. Protective Rekha lets you draw a line ants
  cannot cross, blocking whole pathways, with 2 uses. Water drops a pool that
  blocks and drowns nearby ants, also 2 uses. Sugar places a decoy to lure ants
  away from the laddoo, recurring, with a maximum of 3 at a time.


  Chappal smashes a whole cluster in one hit and is marked as spawning. Tap
  squashes ants one by one, which is precise but slow.


  The creator built it from memories of 90s Indian summers: Nani's house, the
  ceiling fan and load-shedding. The start card shows a photo of a child and a
  handwritten note reading Save the Laddoo.
