slug: save-the-laddoo
title: Save The Laddoo
tagline: Defend a single laddoo on the table from waves of ants at Nani's house.
description: >-
  One laddoo sits on the table at Nani's house, and the ants want it. Save The
  Laddoo is a casual strategy and tower-defense game set during a 90s Indian
  summer vacation, where you stop the ants before they reach the sweet and hold
  out as long as you can.


  The creator says the idea came from childhood memories and from spotting ants
  on a window sill, and that the game is meant to bring back the feeling of
  being cared for by a grandmother. It was made with Antigravity and ranked
  542nd of 945 entries in Vibe Jam 2026.


  Nostalgia matters more here than score. The setting is built from ceiling
  fans, load-shedding, and the quiet war between a child and the ants.
