slug: save-the-laddoo
title: Save The Laddoo
tagline: Defend a single laddoo on the table from waves of ants at Nani's house.
description: >-
  You guard one laddoo on a table at Nani's house over summer vacation. The ants
  already know exactly where it is, and you have to keep them off it for 3
  minutes.


  Five tools against the ants. Protective Rekha, a two-use line ants can't cross
  to shut off whole pathways. A two-use water pool that blocks and drowns nearby
  ants. Sugar, a recurring decoy that pulls ants off the laddoo, three at a time
  at most. The chappal, a sandal that flattens a whole cluster of ants in one
  hit. Tap, the plain fallback for squashing ants one at a time.


  akarshmanas made the game from memories of Indian summers in the 90s, Nani's
  house and load-shedding included, plus a recent sight of ants on a window
  sill. According to akarshmanas, the game is meant to take people back to their
  childhood rather than chase a score, and back to the grandmother who cared,
  whether Abuela, Grandma or Nani.
