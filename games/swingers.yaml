slug: swingers
title: Swingers
tagline: Swing with friends to rack up the most damage to city infrastructure.
description: >-
  You grab onto a skyscraper wall and swing from it, and everything you smash
  along the way adds dollars to your property damage total. Aim at a wall and
  hold left click or Space to attach.


  Right click sends you into an air dash. A speed readout floats just above the
  crosshair, so you can see how fast you're moving at any moment.


  Green speed rings hang in the air around the city, and you can fly through
  them. Billboards sit on the rooftops, and you can smash into those too.


  The goal is to cause more damage than your friends do, and the winner is
  whoever racks up the biggest bill.


  Your running total sits at the top center of the screen, a clock ticks in the
  top left, and a counter in the top right shows how many players are in the
  city with you. The title screen also lists a global leaderboard for the most
  damage, which gives you something to chase.


  A getting-started checklist walks you through grappling a building, air
  dashing, flying through a ring, smashing a billboard and destroying part of a
  building. If you'd rather skip it, there's a hints switch on the title screen,
  plus an audio switch right below it.


  The creator says it came from loving swinging and insurance fraud, which is a
  funny reason to build a game about wrecking critical infrastructure.
