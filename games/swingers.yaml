slug: swingers
title: Swingers
tagline: Swing with friends to rack up the most damage to city infrastructure.
description: >-
  Swing through a city on a grapple and run up the biggest total of dollars in
  property damage. _offmylawn's idea is for friends to compare who causes more
  damage to critical infrastructure.


  A Getting Started checklist of five tasks. Tasks for grappling onto a
  building, air dashing, flying through a green speed ring, smashing a billboard
  and destroying part of a building. Global leaderboard ranked by total damage.


  While aiming at a building wall, hold left click or Space to latch on.
  Right-click for an air dash.


  _offmylawn made the game and says they simply love swinging and insurance
  fraud.
