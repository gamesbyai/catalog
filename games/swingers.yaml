slug: swingers
title: Swingers
tagline: Swing with friends to rack up the most damage to city infrastructure.
description: >-
  Hold left click or Space while you're aiming at a building wall, and you'll
  grapple onto it and swing off through the city.


  Your goal is to rack up the most dollars in property damage. The bill climbs
  in a running total at the top center of the screen, where it's pretty hard to
  miss. _offmylawn's idea is that you swing with your friends to see who causes
  more damage to critical infrastructure.


  Right click does an air dash. The city itself is a whole field of tall blue
  towers, with billboards perched on the rooftops and green rings floating in
  the gaps.


  A Getting Started checklist eases you in with five jobs to tick off: grapple
  onto a building, air dash, fly through a green speed ring, smash into a
  billboard and destroy part of a building.


  There's a speed readout in meters per second sitting just above the crosshair,
  a nice touch for a game built on momentum. A timer sits in the top left
  corner. Back on the start menu, a global leaderboard ranks everyone by their
  damage total.


  _offmylawn made it, and they say they simply love swinging and insurance
  fraud. Hints and audio can each be switched on or off from the start menu.
