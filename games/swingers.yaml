slug: swingers
title: Swingers
tagline: Swing with friends to rack up the most damage to city infrastructure.
description: >-
  Hold left click or Space while you're aiming at a building wall, and you'll
  grapple onto it and swing off through the city.


  Your goal is to rack up the most dollars in property damage. _offmylawn's idea
  is that you swing with your friends to see who causes more damage to critical
  infrastructure.


  Right click does an air dash. You can smash into the billboards and fly
  through the green speed rings.


  A Getting Started checklist eases you in with five jobs to tick off, asking
  you to grapple onto a building, air dash, fly through a green speed ring,
  smash into a billboard and destroy part of a building. A global leaderboard
  ranks everyone by their damage total.


  _offmylawn made it, and they say they simply love swinging and insurance
  fraud.
