slug: swingers
title: Swingers
tagline: Swing with friends to rack up the most damage to city infrastructure.
description: >-
  Hold left click, or Space, while aiming at a building wall to grapple onto it
  and swing through the city. Right click performs an air dash. The goal is to
  rack up the most dollars in property damage, shown as a running total at the
  top center of the screen.


  The city is a field of tall blue towers with billboards on the rooftops and
  green rings floating between them. A Getting Started checklist lists five
  tasks: grapple onto a building, air dash, fly through a green speed ring,
  smash into a billboard, and destroy part of a building.


  A speed readout in meters per second sits above the crosshair, and a timer
  sits in the top left corner. The start menu shows a global leaderboard ranked
  by damage total. Hints and audio can each be toggled from the start menu.
