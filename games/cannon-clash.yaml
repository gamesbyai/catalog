slug: cannon-clash
title: Cannon Clash
tagline: Aim a cannon and outshoot a rival in a physics-driven puzzle duel.
description: >-
  Cannon Clash is a two-player physics puzzle shooter. Each side controls a
  cannon and fires shots that bounce and tumble through the playfield, with the
  outcome decided by how well each player reads the physics and lines up a shot.
  Rounds are meant to be quick and easy to pick up.


  The design is inspired by Peggle and, before that, the Plinko board from The
  Price Is Right. That lineage shows in the emphasis on ricochets and chain
  reactions over reflexes. The creator wanted something simple and fast that
  plays well on mobile, so it is built with touch screens in mind.


  The game runs on Three.js, and the creator built it with Codex, OpenAI's
  coding tool, as an entry in the 2026 Vibe Jam event.
