slug: cannon-clash
title: Cannon Clash
tagline: Aim a cannon and outshoot a rival in a physics-driven puzzle duel.
description: >-
  Cannon Clash is a physics puzzle duel between two cannons, and the goal is to
  outshoot your rival. You aim yours, they aim theirs, and the shots bounce and
  tumble through the playfield, so whoever reads the physics better and lines up
  a shot comes out ahead.


  The design comes from Peggle and, before that, the Plinko board from The Price
  Is Right. The creator wanted something simple and fast that plays well on
  mobile, so it was built with touch screens in mind, using Codex and Three.js.
  It came 544th of 945 at Vibe Jam 2026.


  Rounds are quick and easy to pick up. Ricochets and chain reactions matter
  more than reflexes, so the skill is in reading where a shot will bounce before
  you fire it.
