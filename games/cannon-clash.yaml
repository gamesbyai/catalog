slug: cannon-clash
title: Cannon Clash
tagline: Aim a cannon and outshoot a rival in a physics-driven puzzle duel.
description: >-
  Choose 1 Player or 2 Player, then fire pucks at the pegs and try to clear
  every one. It's turn-based, so you take a shot and let the ricochets play out.


  Your turn only ends once everything has stopped moving, so a shot isn't
  finished until the last bounce.


  Pucks you've already fired stay on the board after they land, which means your
  earlier shots don't just vanish. The level menu lists Prism, a layout of
  diamond-shaped lanes locked to a grid, with clean spacing and mirrored
  openings.


  The menu also has a sound effects switch and a volume slider.


  The creator wanted something simple and quick that worked well on a phone.
  Peggle was the childhood memory behind it, and before that the Plinko game
  from The Price Is Right.


  This browser version is a rebuild of the current iPhone build, made to keep
  the same turn-based ricochet board feel.
