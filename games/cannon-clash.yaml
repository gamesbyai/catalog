slug: cannon-clash
title: Cannon Clash
tagline: Aim a cannon and outshoot a rival in a physics-driven puzzle duel.
description: >-
  Take turns with a rival, firing a cannon into a board full of pegs and reading
  the bounces better than they do.


  Spent pucks that stay on the board as new obstacles. Peg clearing on every
  board. Turns that end only when everything has stopped moving. One-player and
  two-player modes. Levels to pick before a match, like Prism with its diamond
  lanes of evenly spaced pegs.


  Aim, fire, and picture where the shot will ricochet before you let it go.


  swiftfoxsw rebuilt their iPhone game for the web with touch screens in mind.
  The design comes from Peggle and, before that, the Plinko board on The Price
  Is Right.
