slug: tanker-defense
title: Tanker Defense
tagline: Shoot pirates off your oil tanker while steering the ship to safety.
description: >-
  Pirates are attacking your oil tanker in Tanker Defense, and you have to steer
  the ship to safety while fighting them off with guns and grenade launchers. A
  run is a balance between staying on course and keeping the raiders away from
  the hull.


  The creator says it was their first game, taken on as a fun small challenge,
  and describes RPG and simulation elements mixed in with the action. It is
  single-player, runs on Three.js, plays on a phone or a PC, and placed 508th of
  945 in Vibe Jam 2026.


  Shooting and ship handling compete for your attention the whole way. You aim
  at the raiders while keeping the tanker on course for safety, and neither job
  can wait for the other.
