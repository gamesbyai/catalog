slug: tanker-defense
title: Tanker Defense
tagline: Shoot pirates off your oil tanker while steering the ship to safety.
description: >-
  Tanker Defense puts you in charge of an oil tanker under attack by pirates.
  You steer the ship toward safety while fighting off the raiders with guns and
  grenade launchers, so each run is a balance between staying on course and
  keeping attackers away from the hull.


  The game mixes shooting with ship handling, asking the player to split
  attention between aiming and navigation. According to the creator, it also
  blends RPG and simulation elements with the action. It runs in the browser on
  Three.js and is playable on mobile.


  It was entered in Vibe Jam 2026, where it placed 508 out of 945 entries. The
  creator says it was their first game, taken on as a fun small challenge. It is
  a single-player game.
