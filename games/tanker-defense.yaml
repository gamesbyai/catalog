slug: tanker-defense
title: Tanker Defense
tagline: Shoot pirates off your oil tanker while steering the ship to safety.
description: >-
  In Tanker Defense, you steer an oil tanker to safety while pirates attack it.
  A run is a balance between staying on course and keeping the raiders away from
  the hull.


  Guns and grenade launchers for fighting off the raiders. Aiming at raiders
  while keeping the tanker on course. Action with RPG and simulation elements
  mixed in, according to the creator.


  According to bleyldev, this was their first game, taken on as a small, fun
  challenge.
