slug: clickwasher-td
title: Clickwasher TD
tagline: Place towers to defend a citadel and grow stronger through a research tree.
description: >-
  You defend a citadel against incoming enemies. Clickwasher TD mixes tower
  defense with an incremental game.


  A research tree of long-term upgrades, unlocked over time. Small boost to the
  citadel's defense from each unlock. Earnings to spend on stronger defenses.


  Place towers where you want them, then hold the line against attackers.


  hamsteroforion had recently found the incremental game genre and wanted to
  combine that interest with tower defense. They also mention experimenting with
  Codex and Cursor along the way.
