slug: clickwasher-td
title: Clickwasher TD
tagline: Place towers to defend a citadel and grow stronger through a research tree.
description: >-
  Clickwasher TD crosses tower defense with an incremental game, and the thing
  you are defending is a citadel. You place towers to hold off incoming enemies,
  decide where to build, hold the line against the attackers and spend what you
  earn to strengthen your defenses.


  The creator, hamsteroforion, had recently discovered incremental games and
  wanted to combine that interest with tower defense. They built it with Claude
  Code, and mention also experimenting with Codex and Cursor along the way. The
  single-player 3D result plays on phones as well as desktops and ranked 225th
  of 945 at Vibe Jam 2026.


  The incremental side is a research tree. It holds long-term upgrades to
  unlock, so progress builds over time, and each unlock makes the defense of the
  citadel a little stronger.
