slug: clickwasher-td
title: Clickwasher TD
tagline: Place towers to defend a citadel and grow stronger through a research tree.
description: >-
  Clickwasher TD is a tower defense game where you place towers to protect a
  citadel from incoming enemies. Each run centers on choosing where to build,
  holding the line against attackers, and spending what you earn to strengthen
  your defenses.


  The game blends tower defense with the incremental genre. A research tree
  gives you long-term upgrades to unlock, so progress builds over time rather
  than resetting to zero with each attempt. It runs in 3D in the browser and is
  playable on mobile.


  The creator says they recently discovered incremental games and wanted to
  combine that interest with tower defense. They built it with Claude Code, and
  mention also experimenting with Codex and Cursor. It was entered in Vibe Jam
  2026.
