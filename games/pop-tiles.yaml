slug: pop-tiles
title: Pop Tiles
tagline: Find and pop sets of three matching tiles to chase a high score.
description: >-
  Stay ahead of the line in this match-3 puzzler built around speed. Each run is
  about how long you can keep up.


  Endless play with no fixed end. A quick pace, with reflexes as much a focus as
  pattern spotting. Fast spotting of matches over planning moves ahead.
  Score-attack feel on the familiar match-3 idea.


  Scan the board for sets of three identical tiles. Pop them one match after
  another.


  mazino213 saw an ad for a similar game, liked the concept, and built this
  version from scratch so it would be free for everyone to play.
