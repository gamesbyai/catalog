slug: pop-tiles
title: Pop Tiles
tagline: Find and pop sets of three matching tiles to chase a high score.
description: >-
  Pop Tiles is a match-3 puzzle game built around speed. Players scan the board
  for sets of three identical tiles and pop them, one match after another,
  trying to stay ahead of the line while the score climbs. Play continues
  without a fixed end, so each run is about how long you can keep up.


  The pace is quick and the focus is on reflexes as much as pattern spotting.
  Spotting a match fast matters more than planning many moves ahead, which gives
  the familiar match-3 idea a score-attack feel. The game runs on mobile as well
  as desktop.


  The creator saw an ad for a similar game, liked the concept, and built this
  version from scratch so it would be free for everyone to play. It was made
  with Cursor and Phaser, and was entered in Vibe Jam 2026.
