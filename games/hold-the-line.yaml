slug: hold-the-line
title: Hold the Line
tagline: Draw electric wires to trap and eliminate zombies in a 3D isometric arena.
description: >-
  Zombies swarm an isometric 3D arena, and your weapon is electric wire. Hold
  the fire input while you move to trail a wire behind you. When your path
  closes into a loop around zombies, the wire seals itself and electrocutes
  everything inside.


  A wave ends when every zombie is dead, and then the next one starts. Don't
  loop the cage around yourself, or the survivor burns. Shift dashes to dodge.
  Diamonds give a random effect: speed, shield or freeze, or slow and extra
  zombies as the downside.


  Death Lakes grow by 10% every wave, so the safe zone shrinks as you advance.
  Combo kills raise your score multiplier, and chained zaps score more. You can
  play alone, with local multiplayer, or online. In multiplayer, each player
  gets 5 bombs to place after a wave is cleared.


  The creator describes it as a mix of Snake and Bomberman. Mobile play uses an
  on-screen joystick with fire and dash buttons.
