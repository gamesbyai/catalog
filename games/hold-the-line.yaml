slug: hold-the-line
title: Hold the Line
tagline: Draw electric wires to trap and eliminate zombies in a 3D isometric arena.
description: >-
  Hold the Line is an isometric 3D survival game in which the player fights off
  zombies by drawing electric wires around them. Trapping enemies inside the
  wires eliminates them, so each run is about reading the arena, planning where
  to lay a line, and staying clear of the horde while doing it.


  The design mixes Snake and Bomberman. Snake's spatial awareness comes through
  in how the trailing wire has to be routed, and Bomberman's arena combat shows
  up in the tense, close-quarters fights. The creator describes the wire-drawing
  mechanic as their own twist on those classics.


  It offers single-player, local multiplayer, and online multiplayer modes, and
  it is set up for mobile play as well. It was entered in Vibe Jam 2026, and the
  creator built it with Claude Code on top of Three.js.
