slug: hold-the-line
title: Hold the Line
tagline: Draw electric wires to trap and eliminate zombies in a 3D isometric arena.
description: >-
  In Hold the Line you fight off zombies by drawing electric wire around them.
  Trap an enemy inside the wire and it is eliminated. A run in this isometric 3D
  arena comes down to reading the space, planning where to lay a line and
  staying clear of the horde while you do it.


  The design borrows from Snake and Bomberman. The trailing wire has to be
  routed with a Snake player's spatial awareness, and the close-quarters arena
  fights come from Bomberman. The creator calls the wire drawing their own twist
  on those classics.


  The game has three modes, single-player, local multiplayer and online
  multiplayer, and it works on phones too. Claude Code and Three.js were its
  tools during Vibe Jam 2026, where it ranked 377th of 945.
