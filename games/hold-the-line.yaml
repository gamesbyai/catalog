slug: hold-the-line
title: Hold the Line
tagline: Draw electric wires to trap and eliminate zombies in a 3D isometric arena.
description: >-
  Zombies swarm the arena, and electric wire is your weapon against them.


  Back-to-back waves, each ending once the last zombie is dead. Death Lakes that
  grow 10% every wave, shrinking the safe zone. Random diamond effects of speed,
  shield or freeze, or a downside of slow and extra zombies. Score multiplier
  raised by combo kills, and extra points for chained zaps. Solo play, local
  multiplayer, and online matches. Five bombs per player to place after each
  cleared wave in multiplayer.


  Hold fire while you move to trail a wire behind you. Close the path into a
  loop around zombies, and the wire seals and electrocutes everything inside.
  Don't loop it around yourself, or your survivor burns. Press Shift to dash and
  dodge. On mobile, move with the joystick and use the separate fire and dash
  buttons.


  According to enesramisg, the game is a mix of Snake and Bomberman.
