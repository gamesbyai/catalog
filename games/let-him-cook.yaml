slug: let-him-cook
title: Let Him Cook
tagline: Prep, cook, and serve through dinner rushes in a blocky diner, then pay
  the rent.
description: >-
  Each night you run a restaurant kitchen, cover the rent, and keep the critic
  from cooking you.


  Nightly prep before the doors open. Hauling a meat box into the walk-in
  freezer, thawing in the fridge, not on the counter, chopping vegetables into
  the pass bins. Dinner service once the doors open, with tickets to read, food
  to cook, plate, and carry to tables. The critic, dropping in mid-service.
  Ringing the bell, day one's first task.


  Pick a chef name and color, then start your shift. Move with WASD. Hold right
  click, release to throw.
