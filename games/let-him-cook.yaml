slug: let-him-cook
title: Let Him Cook
tagline: Prep, cook, and serve through dinner rushes in a blocky diner, then pay
  the rent.
description: >-
  Each night comes down to readying the kitchen, getting through the dinner
  crowd, and covering the rent without the critic cooking you. You settle on a
  chef name and a color, then punch in for the shift. On day one, the first task
  is ringing the bell.


  Before the doors open, prep, a word that really undersells the work, comes
  first every night. You're hauling the box of meat into the walk-in freezer,
  thawing it in the fridge rather than on the counter, and chopping the
  vegetables into the bins at the pass.


  Service kicks off once the doors open. Then you're reading tickets, cooking,
  plating, and carrying the food out to the tables. The critic shows up during
  service. You move with WASD. Hold right click and let go to throw.
