slug: service-squad
title: Service Squad
tagline: Manage a repair business and fix broken things yourself in first person
description: >-
  Answer the incoming calls from customers who need something fixed. Read the
  job on each request, then accept it or call the customer back later. You run
  the service company as both the manager and the dispatcher, so every decision
  is yours.


  Accepted jobs go to your technicians, and you choose who handles which one.
  Hiring more technicians lets the crew work several jobs at once and raises how
  much work the company can take on.


  Management is only half of it. The game pairs the dispatching and
  company-running side with first-person repair action. A short How To Play
  panel opens the game and covers the call, accept and dispatch steps.


  The art is cartoon style, with a headset-wearing dispatcher and a cap-wearing
  technician as the main characters. The creator built it solo with Flutter and
  Dart on the front end and a Node.js backend, to learn how the AI tools work.
