slug: service-squad
title: Service Squad
tagline: Manage a repair business and fix broken things yourself in first person
description: >-
  Answer the phone when a customer calls, and look over the job they need done.
  You run the whole company as manager and dispatcher at once, and every
  decision falls to you.


  Growth through hiring. Hired technicians, each one adding to how many jobs run
  at once and how much work the business can take on. First-person repair work
  alongside the dispatching. Calls and payroll, both weighing on how much work
  your crew can carry.


  Accept a job or tell the customer you'll call back later. Accepted jobs go to
  your technicians, and you decide who gets sent where.


  ralphcanapa built it alone with Flutter and Dart on the front end and a
  Node.js backend. According to the creator, they made it to learn how the new
  AI tools work.
