slug: service-squad
title: Service Squad
tagline: Manage a repair business and fix broken things yourself in first person
description: >-
  In Service Squad you run a repair business from above, then switch to a
  first-person view to fix the broken things yourself. Half of it is management
  and half is hands-on repair, and a session is about balancing the business
  side against the fieldwork.


  Tycoon-style decisions sit on one side and first-person repair work on the
  other. Instead of only watching numbers, you step into the job itself, which
  separates it from a typical management sim. It is built for casual sessions,
  on a phone as well as a desktop.


  A solo developer made it for Vibe Jam 2026 with Flutter and Dart on the
  frontend and a Node.js backend, using Antigravity. They say the project was a
  way to learn how new AI tools work.
