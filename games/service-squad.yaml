slug: service-squad
title: Service Squad
tagline: Manage a repair business and fix broken things yourself in first person
description: >-
  You run a service company and you're both the manager and the dispatcher, so
  every decision lands on you. Customers ring in with service requests, and you
  answer the call, look over the job, and decide whether to accept it.


  If you'd rather not take a job right away, you can call the customer back
  later.


  Once you've accepted work, you assign your technicians to handle it. You can
  hire more of them to tackle several jobs at once, which is how you grow what
  the company can take on.


  The creator describes it as a hybrid, with management strategy on one side and
  first-person repair action on the other.


  The cast is drawn in a cartoon style, with a headset-wearing dispatcher and a
  technician in a blue cap holding a wrench. A short How To Play card walks
  through the three steps when you start, and you can tick a box so it doesn't
  show again.


  It was built by one developer using Flutter and Dart on the front end with a
  Node.js backend, as a way to learn how the AI tools work.
