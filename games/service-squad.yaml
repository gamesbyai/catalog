slug: service-squad
title: Service Squad
tagline: Manage a repair business and fix broken things yourself in first person
description: >-
  Pick up the phone when a customer rings in, look over the job they need done,
  and either take it or tell them you'll call back later. You're running the
  whole service company, so you're the manager and the dispatcher at once and
  every decision falls to you.


  Once you've said yes, the job goes to your technicians, and you're the one who
  decides who gets sent where.


  Hiring is how the company grows. Each technician you add lets the crew work on
  more jobs at the same time, which raises how much work the business can take
  on. The phone and the payroll end up feeding the same question of how much
  your crew can carry.


  The desk work is surprisingly only half the game, with first-person repair
  action paired alongside the dispatching and company management.


  A short How To Play panel greets you at the start and walks through answering
  calls, accepting jobs and dispatching your crew. The cartoon art stars a
  grinning dispatcher in a headset and a technician in a cap holding a wrench, a
  pretty cheerful pair for a game about fixing broken things.


  ralphcanapa built it alone with Flutter and Dart on the front end. There's a
  Node.js backend behind it too, and that's a lot of ground for one person to
  cover. They made the game to learn how the new AI tools work.
