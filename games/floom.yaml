slug: floom
title: floom
tagline: Drift through a shared canvas, plant seeds, and grow flowers alongside
  strangers.
description: >-
  Press play to join other players in a shared meadow. It presents itself as a
  place where strangers meet by chance and leave flowers, sound and brief
  connections.


  A generated name, something like Swift Camellia. 49 flowers in all. Timed
  meadow resets. Mementos, snapshots stamped with date and time. Sharing the
  meadow, or a snapshot.


  Press spacebar to open a memento, then download it. Since the meadow resets
  anyway, you can save a picture of it.


  jeremiespoken started with the impact people have on their surroundings. The
  effect also runs the other way, with space around people affecting them.
