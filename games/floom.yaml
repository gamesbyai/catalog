slug: floom
title: floom
tagline: Drift through a shared canvas, plant seeds, and grow flowers alongside
  strangers.
description: >-
  Press play to enter a shared green field where white seeds float past. You
  appear as a small dot with a generated name label, such as Swift Camellia, and
  other players appear in the same space. The game describes itself as a place
  where strangers meet by chance and produce flowers, sound and brief
  connections.


  Two lines of text in the top right corner show how many of the 49 flowers you
  have seen so far and how long remains until the meadow resets. A help button
  sits in the top left corner.


  Press spacebar to open a memento, a snapshot of the field stamped with the
  date and time. The dialog has a download button. The bar along the bottom
  holds three buttons: share, snapshot and sound.


  The creator cites the effect people have on their surroundings, and the effect
  those surroundings have back on them, as the starting idea.
