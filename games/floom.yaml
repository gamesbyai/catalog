slug: floom
title: floom
tagline: Drift through a shared canvas, plant seeds, and grow flowers alongside
  strangers.
description: >-
  Press play and you're dropped into a shared green field with white seeds
  floating past. You show up as a small dot with a generated name tag, something
  like Swift Camellia, and other players turn up in that same space.


  It pitches itself as a place where strangers run into each other by chance and
  leave flowers, sound and brief connections behind, which is a gentle goal for
  an online game.


  Two lines of text in the top right corner count how many of the 49 flowers
  you've seen and show how long it'll be until the meadow resets. Forty-nine is
  a surprisingly specific number of flowers to keep track of. A help button sits
  quietly in the top left.


  Pressing spacebar opens a memento, a snapshot of the field with the date and
  time stamped in the corner like an old film photo. There's a download button
  right in that window. Since the meadow resets anyway, it makes sense that you
  can save a picture of it.


  The bar along the bottom is pretty minimal, with one button each for sharing,
  taking a snapshot and toggling the sound.


  jeremiespoken started from the effect people have on the world around them.
  The other half of that idea is the effect their surroundings have on them in
  return.
