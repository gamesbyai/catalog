slug: floom
title: floom
tagline: Drift through a shared canvas, plant seeds, and grow flowers alongside
  strangers.
description: >-
  In floom, a quiet online game, you drift around a shared canvas and plant
  seeds. The other people drifting past are strangers doing the same, and play
  is open-ended: a session is about wandering, placing seeds and watching what
  grows from the actions of everyone present.


  Seeds from different players can meet, and when they do, the result is sound
  and flowers appearing on the canvas. Those small, unplanned connections
  between strangers are what the game is about, and the mood stays cozy and
  unhurried.


  The idea came from how people shape the world around them, and how that world
  changes in response. PixiJS draws the canvas, and the creator put it together
  with Claude Code as a Vibe Jam 2026 entry, which finished 587th of 945.
