slug: floom
title: floom
tagline: Drift through a shared canvas, plant seeds, and grow flowers alongside
  strangers.
description: >-
  Press play and you're dropped into a shared field. You show up with a
  generated name, something like Swift Camellia, and other players turn up in
  that same space.


  It pitches itself as a place where strangers run into each other by chance and
  leave flowers, sound and brief connections behind.


  The meadow holds 49 flowers in all, and it resets on a timer.


  Pressing spacebar opens a memento, a snapshot of the field with the date and
  time stamped on it. You can download the memento. Since the meadow resets
  anyway, you can save a picture of it. You can share the meadow or take a
  snapshot of it.


  jeremiespoken started from the effect people have on the world around them. It
  also works the other way, with the space around people affecting them in
  return.
