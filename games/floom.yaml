slug: floom
title: floom
tagline: Drift through a shared canvas, plant seeds, and grow flowers alongside
  strangers.
description: >-
  Press spacebar and a "Keep a memento" window opens with a picture of the
  meadow and a Download button, so you can save it. A date and time are printed
  in the corner of the picture.


  It's a quiet multiplayer canvas, so you're sharing it with strangers.


  You drift through seeds, and the flowers, sounds and moments of connection
  come about by accident. That fits the creator's inspiration, which was how
  people shape the world around them and the effect that has on it.


  In the top corner a counter tracks how many of the 49 flowers you've seen, so
  you've got something to look for besides wandering. Right under it a countdown
  shows when the meadow resets, which means what you find now won't stay put. A
  small name tag like Swift Camellia floats beside your dot.


  Pretty gentle names for a crowd of strangers, which suits a place this quiet.


  Along the bottom there's a share button, the snapshot button with its spacebar
  label, and a sound toggle. The title screen is a painted hillside of pink and
  orange blooms under soft clouds, with a single play button in the middle.
