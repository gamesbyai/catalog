slug: blocky-pursuit
title: Blocky Pursuit
tagline: Drive through a blocky city and outrun the police without getting busted.
description: >-
  In Blocky Pursuit the car drives itself, so your only job is steering it left
  or right while cops chase you through a blocky city. You see it from an angled
  overhead view, with roads cutting between houses, trees and patches of water.


  You win by evading the cops and not getting busted, so every turn you take is
  about staying out of their reach.


  You can lure the cops into water, which makes sense on a map where blue pools
  sit right up against the roads. You're also told to stick to the roads, so
  staying on the pavement matters.


  Scoring has a twist, because skimming builds a combo that gives you ×3 score.
  That gives you a reason to cut things close instead of just running away.


  The start menu also has a garage, a leaderboard and a feedback button, plus a
  small link to star the project on GitHub.


  The creator had played Smashy Road for a long time and made this version of it
  during one sleepless night.
