slug: blocky-pursuit
title: Blocky Pursuit
tagline: Drive through a blocky city and outrun the police without getting busted.
description: >-
  Blocky Pursuit puts you behind the wheel of a car that drives itself through a
  blocky city while cops chase you and you try not to get busted.


  Water as a way to lure cops and shake them off. Triple-score combo for
  skimming close past obstacles. Advice to stick to the roads. A garage, a
  leaderboard and a feedback form.


  Turn left or right to steer. Leave the gas pedal to the car.


  culeeiz built it in one sleepless night, inspired by a long stretch of playing
  Smashy Road.
