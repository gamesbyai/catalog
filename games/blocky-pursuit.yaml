slug: blocky-pursuit
title: Blocky Pursuit
tagline: Drive through a blocky city and outrun the police without getting busted.
description: >-
  Blocky Pursuit has you steering a car that drives itself through a blocky
  city, seen from above at an angle. Your only input is turning left or right.
  The goal is to evade the cops on your tail and avoid getting busted.


  The map mixes roads with grass, trees, houses and patches of water. Cops can
  be lured into the water, which gives you a way to shake them. The on-screen
  instructions also tell you to stick to the roads.


  Skimming close past obstacles builds a combo that multiplies your score by
  three. The start menu also links to a garage, a leaderboard and a feedback
  form. The creator built it in one sleepless night, inspired by long-time play
  of Smashy Road.
