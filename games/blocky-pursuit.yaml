slug: blocky-pursuit
title: Blocky Pursuit
tagline: Drive through a blocky city and outrun the police without getting busted.
description: >-
  Blocky Pursuit is a top-level driving game set in a city built from blocks.
  You steer a car through the streets while police cars chase you, and the goal
  is to keep moving and avoid getting busted for as long as you can.


  The game is a personal take on Smashy Road, a title its creator has played for
  a long time. It keeps the chase-and-evade idea and applies it to a chunky,
  low-poly city. The creator says it came together during one sleepless night,
  which fits its small, focused scope.


  It was entered in Vibe Jam 2026, where it placed 141st out of 945 entries. It
  is built with Three.js and is playable on mobile devices as well as desktop.
