slug: boom-brigade
title: Boom Brigade
tagline: Blast through nine run-and-gun missions across terrain you can destroy
description: >-
  The ground is not solid here. Dirt, stone, and wooden crates can all be shot
  away, explosive barrels go off when hit, and armored bunkers take enough fire
  to collapse. You can tunnel through a wall, detonate a barrel beside a group
  of enemies, or break open a bunker that blocks the way. Each mission is a
  side-scrolling run-and-gun stage: rescue hostages, wreck the bunkers, and
  reach the flag.


  The campaign has 9 missions set in a jungle, a desert, and a night city with
  dynamic lighting. Levels are generated deterministically, and the last stage
  ends with a gunship boss. Numbered buttons 1 to 9 on the start screen let you
  choose a mission directly.


  Every hostage you free unlocks heroes, 10 in total, and each hero has a
  different weapon plus a special ability. The weapons range from a shotgun and
  a minigun to a flamethrower, a sniper rifle, a holy water sprinkler, and a
  grenade launcher. Movement includes a double jump and a wall jump, and you can
  aim up or down while firing.


  Progress is stored in a JSON file that you download and reload with a button
  or by dragging it onto the page. The browser also keeps a copy automatically.
  Key bindings can be changed in the Controls menu, with two keys per action,
  and touch buttons appear on mobile. Sound effects are synthesized.
