slug: boom-brigade
title: Boom Brigade
tagline: Blast through nine run-and-gun missions across terrain you can destroy
description: >-
  Almost everything in Boom Brigade can be blown apart. Dirt, stone, crates,
  explosive barrels and armored bunkers all break, so you can shoot straight
  through a wall instead of hunting for the door.


  It's a 2D run-and-gun, and you can double jump and kick off walls, which is a
  generous set of moves for the genre. You aim up and down, and each hero's
  special ability sits on its own button.


  Each mission asks you to free the hostages, blow up the bunkers and reach the
  flag.


  The hostages matter beyond the level, because rescuing them is how you unlock
  new heroes. There are ten, and each carries its own weapon: an assault rifle,
  shotgun, plasma cannon, minigun, flamethrower, sniper rifle, twin pistols, arc
  rifle or grenade launcher. One of them sprinkles holy water, which is a funny
  thing to find in a shooter.


  The nine missions are generated the same way every time, so they're identical
  for everyone. They're spread over a jungle, a desert and a night city with
  dynamic lighting, and a gunship waits at the end as the final boss.


  You can remap the controls, with two keys per action, so you can rebuild the
  layout if the defaults don't suit you. Touch buttons show up on mobile.


  Your progress lives in a save file you can download and load back with a
  button or by dragging it in. That makes it easy to carry to another device,
  and a copy also stays in the browser on its own.


  The whole game is one HTML file with no dependencies, and the sound effects
  are synthesized in the game instead of loaded from audio files. That's pretty
  tidy for something with ten heroes and a boss.
