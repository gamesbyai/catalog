slug: boom-brigade
title: Boom Brigade
tagline: Blast through nine run-and-gun missions across terrain you can destroy
description: >-
  Almost nothing in the ground stays put once you start shooting in this 2D
  run-and-gun. Tunnel straight through a wall, set off an explosive barrel
  beside a cluster of enemies, or crack open the armored bunker blocking your
  path.


  Destructible dirt, stone and crates. Explosive barrels that go off when hit.
  Armored bunkers that collapse under enough fire. Nine run-and-gun missions
  with hostages to free, bunkers to wreck and a flag to reach. A gunship boss at
  the end of the ninth mission. Ten heroes, each with a different weapon and
  special ability. Weapons from a shotgun and minigun to a flamethrower, sniper
  rifle, grenade launcher and holy water sprinkler.


  Free hostages to unlock heroes. Jump straight to any of the nine missions from
  the start screen. Use the double jump and wall jump, and aim up or down while
  firing. On mobile, use the on-screen touch buttons. Progress saves in the
  browser, and you can download it as a file.


  The whole game fits in one HTML file, and its sound effects are synthesized
  rather than recorded. Levels are generated deterministically.
