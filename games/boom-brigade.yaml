slug: boom-brigade
title: Boom Brigade
tagline: Blast through nine run-and-gun missions across terrain you can destroy
description: >-
  Almost nothing in the ground here stays put once you start shooting. Dirt,
  stone and wooden crates can all be blasted away, explosive barrels go off when
  they're hit, and even armored bunkers collapse if you pour enough fire into
  them.


  You can tunnel straight through a wall, set off a barrel beside a cluster of
  enemies, or crack open the bunker that's blocking your path, which makes the
  terrain a clever extra weapon.


  Each mission is a side-scrolling run-and-gun stage where you free hostages,
  wreck the bunkers and make it to the flag. There are 9 of them spread across a
  jungle, a desert and a night city with dynamic lighting, and the last one ends
  with a gunship boss.


  Freeing hostages is how you unlock heroes, and there are 10 of them in total.
  Each of them carries a different weapon plus a special ability, with an
  arsenal that runs from a shotgun and a minigun to a flamethrower, a sniper
  rifle and a grenade launcher. Somebody also decided a holy water sprinkler
  belonged on that list, and it's there.


  Getting around takes a double jump and a wall jump, and you can aim up or down
  while you're firing.


  The levels are generated deterministically. A row of numbered buttons from 1
  to 9 on the start screen lets you jump straight to any mission, which is a
  kind thing to put right up front. Your progress lives in a JSON file that you
  download, then load back with a button or by dragging it onto the page, while
  the browser keeps its own copy automatically too.


  If the default keys don't suit you, the Controls menu lets you rebind every
  action with two keys each, and on mobile there are touch buttons on screen.
  Oddly enough, the whole game fits into a single HTML file. Its sound effects
  are synthesized rather than recorded.
