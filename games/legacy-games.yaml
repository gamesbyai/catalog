slug: legacy-games
title: legacy games
tagline: Play a collection of twelve retro pixel art games in your browser.
description: >-
  You pick one of 12 pixel art games, from defending the galaxy against alien
  waves to clearing sci-fi dungeon floors. Most of the others are side-scrolling
  platformers and fighters.


  Underwater Diving and Top-Down Shooter, a deep-ocean survival game and a
  twin-stick shooter. Flappy Chicken, with obstacles to flap past and bosses to
  defeat. Two Gothicvania games, a haunted swamp and an undead graveyard.
  Exploring caverns in Grotto Escape, cliff climbing in Magic Cliffs, and a
  run-and-gun with wall-clinging in Warped Caves. Warped City, a cyberpunk
  shooter across rooftops. Streets of Fight, a beat 'em up through city streets.
  Tiny RPG Forest, a top-down RPG through enchanted woods.


  Fly with WASD and Space in the vertical space shooter. Press Space to flap in
  Flappy Chicken. Space is its only key. Use WASD and Shift in Underwater
  Diving. Move with WASD and aim with the arrow keys in Top-Down Shooter. In
  most of the other games, move with WASD and use Z, X or C for actions.


  All the art comes from Ansimuz's Legacy Collection, and the sound effects are
  generated in the browser with the Web Audio API.
