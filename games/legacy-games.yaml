slug: legacy-games
title: legacy games
tagline: Play a collection of twelve retro pixel art games in your browser.
description: >-
  You land on a neon launcher with twelve cards, one for each game, and every
  card has a Play button. Pick one and you're in a different genre, anywhere
  from a vertical shooter to a cave platformer to a top-down RPG.


  That's a pretty wide spread for one collection. Space Shooter has you defend
  against alien waves, Flappy Chicken sends you flapping through obstacles
  toward bosses, and Underwater Diving asks you to survive the deep ocean.


  Grotto Escape is a cave platformer through dangerous caverns.


  The platformers lean on spooky and scenic places. In Gothicvania Swamp you
  battle through a haunted swamp, in Gothicvania Cemetery you fight the undead
  in a graveyard, and Magic Cliffs has you climb mystical cliff faces. Warped
  Caves is a run-and-gun where you cling to walls and blast your way through,
  which is a nice change from plain jumping.


  Streets of Fight is a beat 'em up where you brawl through city streets.


  Tiny RPG Forest is a top-down adventure through enchanted woods, while Warped
  City is a cyberpunk shooter across neon-lit rooftops. Top-Down Shooter is a
  twin-stick game through sci-fi dungeon floors, so it makes sense that WASD
  moves you and the arrow keys aim.


  All of it is pixel art from Ansimuz's Legacy Collection, and it's wild that
  the whole thing is about 16,500 lines of plain JavaScript on a canvas. The
  sound effects are generated in the browser instead of loaded from files, so
  each game runs straight in a tab.
