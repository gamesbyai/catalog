slug: legacy-games
title: legacy games
tagline: Play a collection of twelve retro pixel art games in your browser.
description: >-
  You pick from a launcher menu of 12 pixel art games, each on its own card with
  a Play button, and start whichever you like. The lineup covers a vertical
  space shooter, a Flappy-style chicken game, an underwater diving game, a
  twin-stick shooter and a top-down RPG, plus several side-scrolling platformers
  and fighters.


  Most games use WASD to move with Z, X or C for actions. Space Shooter uses
  WASD and Space. Flappy Chicken takes only Space to flap through obstacles and
  defeat bosses. Underwater Diving uses WASD and Shift. Top-Down Shooter splits
  movement and aiming, with WASD and the arrow keys.


  The platformers and brawlers include Grotto Escape (caverns), Gothicvania
  Swamp and Gothicvania Cemetery (fighting undead), Magic Cliffs (climbing cliff
  faces), Warped Caves (wall-cling run-and-gun), Warped City (cyberpunk shooter)
  and Streets of Fight (beat 'em up).


  The art comes from Ansimuz's Legacy Collection and is drawn on an HTML5 Canvas
  with smoothing off to keep the pixels sharp. Sound effects are generated in
  the browser with the Web Audio API.
