title: Bangkok City of Legends
tagline: Choose your path through a story-driven adventure set in Bangkok.
description: >-
  A choose-your-own-adventure story set in Bangkok. Move from scene to scene and
  decide where the story goes.


  A story with a different path for each choice. A real city, Bangkok, as the
  setting. A relaxed, exploratory pace. Structure borrowed from branching
  narratives and from point-and-click games like Monkey Island.


  Made by BigLoudChris.
