slug: bangkok-city-of-legends
title: Bangkok City of Legends
tagline: Choose your path through a story-driven adventure set in Bangkok.
description: >-
  Bangkok City of Legends is a choose-your-own-adventure story set in Bangkok.
  The player steps into the city and makes decisions that shape how the story
  unfolds, moving through scenes in the manner of classic point-and-click
  adventures and role-playing games.


  The game draws on the tradition of branching narratives and point-and-click
  titles like Monkey Island, pairing that structure with a specific real-world
  setting. Its focus is on story and choices rather than reflexes, which suits a
  relaxed, exploratory pace. It is playable on mobile devices as well as
  desktop, and it runs as a single-player experience.


  The creator built it with Claude Code and rendered it with PixiJS. It was
  submitted to Vibe Jam 2026, where it placed 161st out of 945 entries.
