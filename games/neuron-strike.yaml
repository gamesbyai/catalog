slug: neuron-strike
title: Neuron Strike
tagline: Shoot down enemies in space while answering quick mental quiz challenges.
description: >-
  Neuron Strike is a space shooter that mixes arcade shooting with mental quiz
  challenges. The player pilots a ship, fights off enemies, and has to keep
  their mind sharp while doing it, so reflexes and quick thinking both count
  toward the final score.


  The concept draws on airline pilot recruitment tests and psychomotor
  assessments. It works as a relaxed way to practice that kind of coordination
  and attention, while also trying something different within the shoot 'em up
  genre. Scores go to a global leaderboard, so players can compare results with
  others.


  The game was entered in Vibe Jam 2026, where it placed 359th among 945
  entries. Its listed tooling points to Claude from Anthropic as part of how it
  was made.
