slug: neuron-strike
title: Neuron Strike
tagline: Shoot down enemies in space while answering quick mental quiz challenges.
description: >-
  Neuron Strike is a space shooter that also quizzes you. You pilot a ship and
  fight off enemies while answering quick mental quizzes. You have to keep your
  mind sharp in the middle of a fight, because reflexes and quick thinking both
  count toward the final score.


  The concept draws on airline pilot recruitment tests and psychomotor
  assessments. The creator used Claude from Anthropic to build it, and the
  single-player game ranked 359th of 945 at Vibe Jam 2026. It plays in the
  browser as a classic arcade-style shooter.


  That makes it a relaxed way to practice coordination and attention, and a
  different take on the shoot 'em up. Scores go to a global leaderboard, so you
  can compare results with other players around the world.
