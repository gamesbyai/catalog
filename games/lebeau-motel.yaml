slug: lebeau-motel
title: LeBeau Motel
tagline: Race rivals to $10,000 in a shared motel by stealing, hustling, or gambling.
description: >-
  Reach $10,000 first to win the round in LeBeau Motel, a multiplayer action
  shooter set in a run-down motel. Each round is a race against the other people
  sharing the building. How you get there is up to you.


  Theft from other players as one route to money. Hustles for cash as another
  route. Gambling as a way to earn. Risky fights and quieter schemes.


  According to the creator, it blends the social hangout feel of Habbo Hotel,
  the top-down-style violence of Hotline Miami and the crime-driven freedom of
  an open city sandbox like GTA.
