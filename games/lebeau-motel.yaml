slug: lebeau-motel
title: LeBeau Motel
tagline: Race rivals to $10,000 in a shared motel by stealing, hustling, or gambling.
description: >-
  LeBeau Motel is a multiplayer action shooter about a race to $10,000 inside a
  run-down motel. How you get there is up to you: steal from the other players,
  hustle for cash or take a chance at gambling, as long as you get there first.


  The creator, who built it with Claude Code in Three.js, describes it as a
  blend of Habbo Hotel, Hotline Miami and GTA. That means the social hangout
  feel of a virtual hotel, top-down-style violence and the crime-driven freedom
  of an open city sandbox, all under one roof.


  Phones work too, and each round is a race against the other people sharing the
  building. The money race has several routes, from risky fights to quieter
  schemes, and whoever reaches the target first wins the round.
