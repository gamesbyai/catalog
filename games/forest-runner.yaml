slug: forest-runner
title: Forest Runner
tagline: Skate through a blocky forest, dodge obstacles, grab power-ups, and
  outrun rivals.
description: >-
  Forest Runner is an endless arcade runner set in a forest with
  Minecraft-inspired blocky visuals. The player rides a skateboard at high
  speed, steering around obstacles and taking sharp turns while trying to stay
  ahead of rival chasers. Power-ups appear along the path, and a run continues
  until the player crashes or is caught.


  The game takes the familiar endless-runner formula and moves it into a
  chaotic, dangerous woodland. Skateboarding gives the movement a different feel
  from a typical on-foot runner, and the rival chases add pressure beyond simply
  avoiding hazards. The blocky art style gives the forest a distinct look.


  The creator says they have long enjoyed endless running games and wanted to
  reimagine that fast pace in a Minecraft-style setting. It was built with
  Three.js, and the creator states they used Claude Code. It was entered in Vibe
  Jam 2026 and supports mobile play.
