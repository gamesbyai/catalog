slug: forest-runner
title: Forest Runner
tagline: Skate through a blocky forest, dodge obstacles, grab power-ups, and
  outrun rivals.
description: >-
  You skate fast through a dangerous forest inspired by Minecraft and try to
  stay ahead of the rivals behind you. Most endless runners have you running on
  foot, but this one puts you on a skateboard. A run lasts until you crash or
  get caught.


  Steer your board through sharp turns and around obstacles. Power-ups to
  collect along the path. Rival chasers on top of the hazards.


  mercurianranger explains they have long enjoyed endless runners and hoped to
  bring that fast pace to a new setting.
