slug: forest-runner
title: Forest Runner
tagline: Skate through a blocky forest, dodge obstacles, grab power-ups, and
  outrun rivals.
description: >-
  Forest Runner puts an endless arcade runner on a skateboard. You ride at high
  speed, steering around obstacles and taking sharp turns while trying to stay
  ahead of the rivals chasing you.


  A run lasts until you crash or get caught. Power-ups appear along the path,
  and the chasers add pressure on top of the hazards, so dodging is only half
  the job. Riding a skateboard also gives the movement a different feel from the
  usual on-foot endless runner.


  The creator explains that they have long enjoyed endless running games and
  wanted to reimagine that fast pace in a new setting. Claude Code was their
  tool.
