slug: the-list-s-champion
title: The List's Champion
tagline: Ride down the lists in first person and land your lance on rival knights
description: >-
  Start as an unknown contender on the tournament list and work your way up to
  champion, one jousting pass at a time. You play a knight in a medieval
  tournament.


  A Training Mode to practice timing, balance and aim before the real field.
  Seven interchangeable lance heads to swap between. Four distinct ways for a
  lance to fail, each with its own sound. Rivals that grow tougher as the
  tournament goes on, none a copy of the last. Each rival with its own riding
  style, armor setup and tactics.


  Wait for the marshal to lift his flag. Charge down the course and aim your
  lance at your opponent's armor. Brace for the moment the two of you meet.


  Felmeric tuned the lance's weight, the length of the timing window and the
  scoring weights through playtesting. All of the sprite art was generated from
  text prompts. Every sound is synthesized by an AI-generated Python program,
  with fourteen effects and five music loops built from oscillators, filters and
  noise. The game has no voice acting.
