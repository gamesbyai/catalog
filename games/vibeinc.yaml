slug: vibeinc
title: VibeInc
tagline: Run a chaotic vibe coding studio, ship AI projects, and survive bugs and hype.
description: >-
  VibeInc is a browser tycoon in which the player runs a vibe coding studio.
  Each run is about shipping AI-made projects, managing the studio's resources,
  and keeping the company alive through bugs and swings in hype, with the goal
  of growing a small shop into a sprawling tech empire.


  The setting is what sets it apart. It pokes fun at the messier side of the AI
  startup scene. Founders treat a working demo as a finished product, dashboards
  are held together by good vibes, and "agents" amount to a single enthusiastic
  API call. The creator, a longtime tycoon fan, built economy systems around
  that chaos.


  The game was made for Vibe Jam 2026, where it placed 130th out of 945 entries.
  It runs in the browser on Three.js, and the creator built it with Cursor.
