slug: vibeinc
title: VibeInc
tagline: Run a chaotic vibe coding studio, ship AI projects, and survive bugs and hype.
description: >-
  VibeInc puts you in charge of a vibe coding studio and asks you to grow it
  from a small shop into a sprawling tech empire. It is a browser tycoon: you
  ship AI-made projects, manage the studio's resources, and keep the company
  alive through bugs and swings in hype.


  The creator is a longtime tycoon fan who made it with Cursor on Three.js, and
  the economy systems are built around the chaos of the AI startup scene. It
  finished 130th of 945 in Vibe Jam 2026.


  The messier side of that scene is the joke. Founders treat a working demo as a
  finished product, dashboards are held together by good vibes, and "agents"
  amount to a single enthusiastic API call.
