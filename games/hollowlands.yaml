slug: hollowlands
title: Hollowlands
tagline: Explore an endless shared world, survive, and build alongside other players.
description: >-
  Hollowlands is a multiplayer survival adventure set in an infinite world.
  Players roam the landscape, gather what they need to stay alive, and put up
  structures as they go. Sessions are open-ended, driven by curiosity about what
  lies past the next horizon.


  The game cites Zelda: Breath of the Wild as its inspiration, which points
  toward free-form exploration across a large open landscape. Because the world
  is infinite and other people share it, building and traveling can play out
  differently on each visit. It runs in the browser and is set up for mobile as
  well.


  Hollowlands was an entry in Vibe Jam 2026, where it placed 94th out of 945
  entries. It is built on Three.js, and the creator built it with Claude Code.
