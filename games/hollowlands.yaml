slug: hollowlands
title: Hollowlands
tagline: Explore an endless shared world, survive, and build alongside other players.
description: >-
  Hollowlands gives you an infinite world to roam, survive in and build on,
  shared with other players. You cross the landscape, gather what you need to
  stay alive and put up structures as you go, next to whoever else is out there.


  Sessions are open-ended, driven by curiosity about what lies past the next
  horizon. The game cites Zelda: Breath of the Wild as its inspiration. It is
  survival, open-world and adventure in one.


  Because the world is infinite and other people share it, building and
  traveling can play out differently on each visit. Built with Claude Code and
  Three.js.
