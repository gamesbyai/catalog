slug: pocket-salvage
title: Pocket Salvage
tagline: Swing a crane, switch tools, and sort scrap into bins before time runs out.
description: >-
  Move the crane left and right with A and D, lower and raise the hook with W
  and S, and press Space to grip. The magnet lifts steel. For copper and rubber,
  press E to swap to the claw, which you pick up at the tool stands.


  Scrap pieces sit along the ground of a night-time junkyard, and three bins
  stand on the right: copper, rubber and steel. Carry each piece to its matching
  bin before the timer runs out. The HUD tracks score, time left, how many
  pieces are sorted, and which tool is active.


  Play is split into levels chosen from a menu of twelve, with the later ones
  locked at the start. Level 1 is a calm night with four pieces and a
  four-minute clock. The listing describes five weather levels. P pauses and R
  restarts a round, and music and sound effects can be switched off from the top
  bar.


  The cable hanging from the crane bends as it moves, and the hook hangs below
  it as a flat magnet plate.
