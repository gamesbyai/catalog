slug: pocket-salvage
title: Pocket Salvage
tagline: Swing a crane, switch tools, and sort scrap into bins before time runs out.
description: >-
  Sort every piece into its matching bin before time runs out.


  A magnet for steel, a claw for copper and rubber. Three bins for copper,
  rubber and steel. Twelve levels, the later ones starting out locked. Level 1
  with four pieces and four minutes on the clock. Five weather levels.


  Use A and D to move the crane sideways, and W and S to drop and lift the hook.
  Press Space to grip. Take the claw from the tool stands and switch with E.
  Press P to pause and R to restart a round.
