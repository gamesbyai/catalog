slug: pocket-salvage
title: Pocket Salvage
tagline: Swing a crane, switch tools, and sort scrap into bins before time runs out.
description: >-
  Slide the crane along its rail with A and D, drop the line with W and S, and
  press Space to grab whatever's underneath. The crane swings while you move it,
  so the load doesn't hang still.


  Your first job is steel, and the magnet on the crane handles it.


  The magnet only lifts steel, which means copper and rubber need the claw. You
  swap to it with E at the tool stands that sit along the left side of the yard,
  which is a neat reason to make you walk the crane back and forth.


  Then you carry each piece over to the bin that matches its metal.


  There are three bins, labeled copper, rubber and steel, and a counter up top
  shows how many pieces you've sorted. A clock runs the whole time, so the round
  ends when you've sorted everything or time runs out.


  The first level is a calm night with four pieces of scrap, including a washing
  machine and a gear. Later levels bring weather, and the picker shows twelve
  slots with the rest locked until you get there. You can pause with P, restart
  with R, and turn the music and sound effects off from the top bar.
