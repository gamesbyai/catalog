slug: pocket-salvage
title: Pocket Salvage
tagline: Swing a crane, switch tools, and sort scrap into bins before time runs out.
description: >-
  Move the crane left and right with A and D, and use W and S to drop and lift
  the hook. Press Space to grip, and the magnet will lift steel.


  For copper and rubber you'll want the claw, which you pick up at the tool
  stands and switch to with E.


  Scrap lies along the ground of a junkyard at night, with three bins on the
  right for copper, rubber and steel. Your job is to get every piece into its
  matching bin before the timer runs out. Up top, the HUD shows your score, time
  left, how many pieces you've sorted and which tool you're holding.


  There's some nice craft in the crane itself, since its cable bends as it moves
  and the hook hangs below as a flat magnet plate.


  You choose rounds from a menu of twelve levels, and the later ones start out
  locked. Level 1 is a calm night with just four pieces to sort and four
  minutes on the clock.


  The game's own blurb describes five weather levels. P pauses and R restarts a
  round. If you'd rather sort scrap in silence, music and sound effects each
  have their own switch in the top bar.
