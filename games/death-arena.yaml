slug: death-arena
title: Death Arena
tagline: Fight rival players and three bosses in a 3D arena to reach 10,000
  points first.
description: >-
  Death Arena is a multiplayer race to 10,000 points, run through a 3D arena
  full of rival players and three bosses. You fight all of them at the same
  time, every kill and every boss hit moves you closer, and the first to reach
  the target wins.


  The creator cites the Death Race film, classic arcade combat games and browser
  multiplayer IO games as inspirations. Claude Code and Cursor were both used to
  build it on Three.js, and it placed 75th of the 945 entries at Vibe Jam 2026.


  The score gives the fighting a direction: you are not only surviving, you are
  competing for points against everyone else in the arena. With players and
  bosses in the same space, the action stays crowded and unpredictable.
