slug: death-arena
title: Death Arena
tagline: Fight rival players and three bosses in a 3D arena to reach 10,000
  points first.
description: >-
  You pick one of eight rigs and drive it into a 3D combat arena, where you
  fight other players and three bosses at the same time. The goal is to reach
  10,000 points before anyone else.


  The Reaper rig, a balanced all-rounder with 30% more gem pickup radius. Plasma
  orbs fired by the Reaper rig, traveling in a steady arc. Gems to pick up.
  Public and private matches. Match state kept in sync by an authoritative
  server.


  Browse the other rigs before you pick one. Type a pilot call sign, or leave
  the field empty for a random one. Drive with WASD.


  WebRaizo built it in 4 hours, then spent 4 weeks debugging it.
