slug: death-arena
title: Death Arena
tagline: Fight rival players and three bosses in a 3D arena to reach 10,000
  points first.
description: >-
  You pick a rig from a loadout of eight, then drive it into a combat arena
  where you fight other players and three bosses at the same time. The goal is
  to reach 10,000 points before anyone else.


  The Reaper rig is a balanced all-rounder that adds 30% to gem pickup radius.
  It fires plasma orbs that travel in a stable arc. You can browse the other
  rigs before you pick one.


  You choose a public or private match and can type a pilot call sign, or leave
  it empty for a random one. You drive with WASD.


  A field manual covers combat and vehicles, terrain, sessions and players,
  power-ups and gems, boss threats and the win condition. Match state is kept in
  sync by an authoritative server. The creator built it in 4 hours, then spent 4
  weeks debugging.
