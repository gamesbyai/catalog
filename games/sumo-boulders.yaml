  notes: "Sumo Boulders is a physics brawl: shove rival boulders out of the ring.
    Built with Claude Code in Three.js. Each of the eight arenas changes the
    physics - a raft tipping on ocean swells, a basalt raft on a boiling lake,
    black ice under an aurora, half gravity in low orbit, lightning, wind and
    sand. Six AI personalities, a Ladder gauntlet, Battle for up to 8 boulders,
    a boulder builder, peer-to-peer online play and gamepad support."
