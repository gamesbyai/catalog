slug: sumo-boulders
title: Sumo Boulders
tagline: Shove rival boulders out of the ring across eight arenas with odd physics.
description: "Knock rival boulders out of the ring to win a round in this
  physics brawl, where you can be shoved out too. Each of the eight arenas bends
  the physics in its own way. Six AI personalities play the rivals you face.


  Arenas from black ice under an aurora to half gravity in low orbit. A tipping
  raft on ocean swells, and a basalt raft floating on a boiling lake. Lightning,
  wind and sand in the other arenas. Ladder gauntlet for taking the rivals on.
  Battle mode, with up to eight boulders crowding into one ring. Boulder builder
  for making your own fighter before you go in. Peer-to-peer online play with
  other players, and gamepad support too."
