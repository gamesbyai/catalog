slug: sumo-boulders
title: Sumo Boulders
tagline: Shove rival boulders out of the ring across eight arenas with odd physics.
description: "You win a round by knocking rival boulders out of the ring. It's a
  physics brawl, so everything comes down to shoving and not getting shoved.


  What keeps it interesting is that each of the eight arenas bends the physics
  in its own way. One is a raft that tips on ocean swells, another a basalt raft
  floating on a boiling lake, and one is black ice. Low orbit even cuts gravity
  in half.


  Other arenas throw in lightning, wind and sand, so a ring you've figured out
  in one place won't behave the same in the next.


  Six AI personalities play the rivals. You can take them on in a Ladder
  gauntlet, or pick Battle mode and have up to eight boulders crowd into one
  ring.


  There's also a boulder builder, which lets you make your own fighter before
  you go in. Online play runs peer-to-peer, and a gamepad works too.


  The creator says they built it with Claude Code in Three.js."
