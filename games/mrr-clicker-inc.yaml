slug: mrr-clicker-inc
title: MRR Clicker Inc.
tagline: Tap to grow monthly revenue and watch a live analytics chart climb.
description: >-
  MRR Clicker Inc. is an idle clicker styled as a SaaS analytics dashboard. You
  tap to grow monthly recurring revenue, and the chart on screen responds to
  each action, with the MRR line climbing as your numbers rise.


  The whole game is built around a single chart that feels alive. Instead of a
  typical cartoon interface, it borrows the look of the dashboards used to track
  subscription products, so the satisfaction comes from watching a familiar
  graph react to what you do.


  The creator drew on past work with tools like Stripe and Google Analytics, and
  on the habit of checking project dashboards even when nothing has changed. It
  began as a joke about turning a chart into a game. It was submitted to Vibe
  Jam 2026, and the creator built it with Claude Code. It runs on mobile as
  well.
