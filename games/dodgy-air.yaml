slug: dodgy-air
title: Dodgy Air
tagline: Manage a struggling budget airline with a moody captain and a shady CFO.
description: >-
  Run a third-rate airline, staff included, and make its business decisions.
  Each session is about keeping the operation flying despite the crew's odd
  habits and some questionable paperwork.


  Altitude changes requested by your captain, based on feelings. A CFO with
  unusual views on what a receipt is. Strategy and simulation built on absurd
  workplace problems.


  gilbo852, a games industry veteran, says AI handled the full production
  pipeline, which let them ship a comedy built around its characters.
