slug: caprush
title: CapRush
tagline: Race toy-sized cars over homemade dirt tracks built from holes, rock
  ramps and bottle caps
description: >-
  Race toy-sized cars against other players online on a dirt track.


  Hand-dug holes along the course. Rock ramps built into the track. Soil as the
  course material.


  The idea comes from the creator's childhood, when kids shaped a dirt track
  with a small shovel, earth and stones, then played on it for hours. Inspired
  by Hot Wheels miniatures. According to the creator, the game was built with an
  AI coding assistant.
