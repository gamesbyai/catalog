slug: caprush
title: CapRush
tagline: Race toy-sized cars over homemade dirt tracks built from holes, rock
  ramps and bottle caps
description: >-
  CapRush is a multiplayer racing game for toy-sized cars on the kind of dirt
  track kids build outdoors. The course is made of hand-dug holes, rock ramps
  and soil, with soda bottle caps as part of the scene, and you race other
  players online in the spirit of Hot Wheels.


  The idea is a personal memory from the creator's childhood: kids shaping a
  track with a small shovel, earth and stones, then playing on it for hours. The
  creator says it was built with Claude Code, and it came 390th of 945 at Vibe
  Jam 2026.


  That improvised, backyard feel is what separates it from polished circuit
  racers. The look is tactile and toy-scale rather than realistic, down to the
  bottle caps on the course.
