slug: caprush
title: CapRush
tagline: Race toy-sized cars over homemade dirt tracks built from holes, rock
  ramps and bottle caps
description: >-
  Race toy-sized cars against other players online on the kind of dirt track
  kids build outdoors. The course is made of hand-dug holes, rock ramps and
  soil, and you race other players online in the spirit of Hot Wheels.


  The idea is a personal memory from the creator's childhood: kids shaping a
  track with a small shovel, earth and stones, then playing on it for hours. The
  creator says it was built with Claude Code.
