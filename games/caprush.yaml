slug: caprush
title: CapRush
tagline: Race toy-sized cars over homemade dirt tracks built from holes, rock
  ramps and bottle caps
description: >-
  CapRush is a multiplayer racing game inspired by childhood afternoons spent
  building dirt tracks outdoors. Players race miniature vehicles in the spirit
  of Hot Wheels toys, driving over a course that recalls hand-dug holes, rock
  ramps and soil, with soda bottle caps as part of the scene.


  The concept comes from a personal memory: kids shaping a track with a small
  shovel, earth and stones, then playing for hours. That backyard, improvised
  feel is what sets the game apart from polished circuit racers, and it leans on
  a tactile, toy-scale look rather than realism.


  It was entered in Vibe Jam 2026, where it placed 390th among 945 entries. The
  creator's submission names Claude Code as the tool used to build it.
