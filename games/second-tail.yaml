slug: second-tail
title: Second Tail
tagline: Lead two abandoned pet rats home through a big, wet city at rat height.
description: "Their owner said he'd be back for them, and he never came, so two pet rats who've never seen the world outside set off across a big, wet city to walk home. You play both of them, Sal and Ben, and the way home needs each one's skills.


  Sal, in a felt hat and round glasses, with a double jump and a climb. Ben, in a yellow hard hat, with a dash and a ram. Rooftops, a mine, an aqueduct, a market and a boat station, all at rat height. Bosses like a giant snail and the Stink Rat mechanic in his bucket tank. An eight-lane race in the rain, piranhas, and prisoners to free one key at a time.


  Move with A and D or the arrow keys, and jump with Space, pressing it again in the air for Sal's double jump. Climb with W and S, dash with Shift and switch rats with Q or E. F interacts and Esc pauses. Phones get on-screen controls, and a controller works too.


  It started when the developer asked an AI to draw their own two rats, just for fun, and then wanted them to move. Claude Code and Codex agents wrote nearly all of the C# in Unity 6, while the developer writes the tickets and decides what goes in. The art is AI-generated and animated in code, Claude drafted the story, and the sound mixes CC0 recordings with Suno.


  It's an early demo in English and Ukrainian. The first load is big, but your browser keeps it afterwards."
