slug: templo
title: Templo
tagline: Hunt relics through temple ruins, solve traps, and survive with
  asynchronous multiplayer.
description: >-
  Templo is a relic-hunting survival adventure set inside a temple. The player
  explores the ruins, works through puzzles and platforming sections, and tries
  to come out alive with the treasure. It mixes action with exploration, and
  each run centers on getting deeper into the temple while avoiding its dangers.


  The setting draws on Aztec culture and the feel of Indiana Jones films, which
  shapes the look of the temple and the treasure-seeking premise. Multiplayer is
  asynchronous, so players share the experience without needing to be in the
  same session at the same time. The game combines several genres: action,
  adventure, puzzle, and platformer.


  The game was built in Three.js as an entry in Vibe Jam 2026. The creator
  states that Cursor was used during development.
