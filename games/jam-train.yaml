slug: jam-train
title: Jam Train
tagline: Play music with a friend while riding a relaxing train at sunset
description: >-
  Jam Train is a multiplayer music game in which two players make music together
  during a calm train ride. Instead of racing against a clock or chasing a
  score, you play along with a friend while the scenery rolls past, and the
  session is about improvising together.


  The mood is the main draw. The idea came from relaxing on a beach at sunset
  and playing guitar with a friend, and the train ride carries that same
  unhurried feeling. It runs in the browser and works on mobile, so a friend can
  join from a phone.


  It was entered in Vibe Jam 2026 and is built with Three.js. The creator built
  it with Claude Code, Anthropic's coding tool, as part of the jam submission.
