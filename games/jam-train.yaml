slug: jam-train
title: Jam Train
tagline: Play music with a friend while riding a relaxing train at sunset
description: >-
  Two players make music together on a calm train ride in Jam Train. The mood is
  the main draw, and it has a specific source. The idea came from relaxing on a
  beach at sunset and playing guitar with a friend, and the train ride carries
  that same unhurried feeling.


  Your friend can join from a phone or a desktop browser, so the second player
  does not have to be in the same room. Claude Code and Three.js were the tools,
  and Vibe Jam 2026 placed it 213th of 945.


  It is a casual rhythm game with no clock to race and no score to chase. You
  play along with a friend while the scenery rolls past at sunset, and the whole
  session is about improvising together.
