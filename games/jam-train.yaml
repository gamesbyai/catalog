slug: jam-train
title: Jam Train
tagline: Play music with a friend while riding a relaxing train at sunset
description: >-
  You jam with a friend on a relaxed train ride in Jam Train, a casual rhythm
  game about making music together. Your friend can join from a phone or a
  desktop browser and does not have to be in the same room.


  No clock to race and no score to chase. Improvising together for the whole
  session. Music Jam, a mode for two players.


  Eric's idea came from a beach at sunset: "Chilling on the beach at sunsets
  playing guitar with my friend," the creator writes.
