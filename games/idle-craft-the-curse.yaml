slug: idle-craft-the-curse
title: "IDLE-CRAFT: The Curse"
tagline: Gather, forge card decks, and fight through permadeath runs solo or
  with friends.
description: >-
  Every run is an idle survival expedition that loops through three jobs: you
  gather resources, forge them into a deck of cards, then fight with the deck
  you've built. Permadeath ends it. When it does, the next attempt starts the
  climb over from the very beginning.


  Before any of that, you pick a survivor name and run it through an
  availability check, a surprisingly formal bit of ceremony given the game says
  that name carries through every expedition you take.


  Then you choose how you're going in. Solo sends you on a full expedition
  against the wilds, while Co-op caravan, Hunter duel (1v1) and Forge clash
  (3v3) open a quick online lobby where the host launches and everyone plays the
  same survival loop.


  An illustrated intro shows a bearded wizard in blue robes with a glowing hand
  and a moon hanging over the mountains behind him. "Once, the rivers obeyed
  me," he tells you, and it's a pretty gloomy, grand way to open a game about
  crafting cards. You can skip it with the button or with Esc, Space or Enter.


  The run plays out on a procedural dock built from layered code geometry, and
  the game makes a whole point of using no imported meshes at all.


  The interface is dressed up as forged iron. Setup happens on a dark panel, and
  a progress bar fills while the scene builds its lights and shadows.
