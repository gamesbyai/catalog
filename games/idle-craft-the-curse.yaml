slug: idle-craft-the-curse
title: "IDLE-CRAFT: The Curse"
tagline: Gather, forge card decks, and fight through permadeath runs solo or
  with friends.
description: >-
  IDLE-CRAFT: The Curse is an idle survival RPG where you gather resources,
  craft gear and forge decks of cards, then take those decks into fights. The
  creator made it with Cursor for one simple reason: it was something they
  wanted to play themselves, and it went on to place 230th of 945 at Vibe Jam
  2026.


  It stacks several genres on top of each other: idle progression,
  deck-building, crafting and survival, all in the browser. The interface is
  styled around forged iron, which gives the menus and the cards a heavy,
  metallic look.


  You can play alone or with friends, in co-op modes or in PvP duels that
  include 1v1 and 3v3 formats. A run lasts until permadeath ends it, and then
  you start the climb again from the bottom.
