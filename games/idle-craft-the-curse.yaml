slug: idle-craft-the-curse
title: "IDLE-CRAFT: The Curse"
tagline: Gather, forge card decks, and fight through permadeath runs solo or
  with friends.
description: >-
  Gather resources, forge them into a card deck, and fight with it. The game is
  an idle survival RPG, with every expedition built around that loop.


  Permadeath, with the next attempt starting from the very beginning. A survivor
  name carried through every expedition. Solo, a full expedition against the
  wilds. Online lobbies for Co-op caravan, Hunter duel (1v1) and Forge clash
  (3v3). Opening intro in which a wizard tells you the rivers once obeyed him.


  In the online modes, wait for the host to launch. Everyone plays the same
  loop.


  Made by shields_wi49029, who writes, "I made something i wanted to play." Each
  run takes place on a dock generated procedurally from layered code geometry,
  and the game uses no imported meshes at all.
