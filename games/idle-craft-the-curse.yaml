slug: idle-craft-the-curse
title: "IDLE-CRAFT: The Curse"
tagline: Gather, forge card decks, and fight through permadeath runs solo or
  with friends.
description: >-
  You gather materials, forge them into a deck of cards, and send your character
  out to survive, with the fighting running idle-style. Death is permanent, so
  when your character falls the run is over. Then you start the climb again,
  which means every deck you build only serves one life.


  Before anything else, you type in a survivor name, and a button checks whether
  somebody already has it.


  Going solo gives you a whole expedition by yourself in the browser. If you'd
  rather have company, you pick a co-op caravan, a 1v1 Hunter duel or a 3v3
  Forge clash, and each one sets up a short online lobby.


  Once the host launches, everybody is playing the same survival loop, so the
  duels and the team clash run on the same gathering and deck forging as a solo
  run. The dock you start in is built entirely from code, with layered shapes
  and physically based lighting instead of imported models, which is a neat
  trick for a browser game. The interface has a dark, metallic forged-iron look.


  The game opens on a short story scene with a bearded sorcerer in blue robes,
  magic glowing in his hands, remembering that the rivers once obeyed him.


  You can skip it with a key press or the button in the corner. The creator says
  they just wanted to make something they'd want to play themselves.
