slug: idle-craft-the-curse
title: "IDLE-CRAFT: The Curse"
tagline: Gather, forge card decks, and fight through permadeath runs solo or
  with friends.
description: >-
  A run is an idle survival expedition built on three steps: gather resources,
  forge them into a deck of cards, and fight with that deck. Permadeath ends the
  run, and the next attempt starts the climb over from the beginning.


  Before the first run, you type a survivor name and use the availability check,
  then choose an expedition mode. Solo is a full expedition against the wilds.
  Co-op caravan, Hunter duel (1v1) and Forge clash (3v3) open a quick online
  lobby, and the host launches so everyone plays the same survival loop.


  An illustrated intro shows a bearded wizard in blue robes, with a glowing hand
  and a moon over mountains, saying the rivers once obeyed him. You can skip it.
  The run takes place in a procedural dock built from layered code geometry,
  with no imported meshes.


  The interface is styled as forged iron, with a dark panel for setup and a
  progress bar while the scene builds.
