slug: argatha-lost-world
title: "Argatha: Lost World"
tagline: Gather resources, build a base, and tame creatures in a shared lost world.
description: >-
  Argatha: Lost World is a multiplayer survival and crafting game set in a place
  called Argatha. Players gather resources, put up structures, and tame
  creatures while trying to stay alive. Each session is about building up from
  little and settling into the land alongside other players.


  The creator is a fan of the survival genre and wanted to see how a persistent
  survival game would work in the browser. That focus on a lasting world shapes
  the design, so what you build and tame carries weight beyond a single short
  run. It was submitted to Vibe Jam 2026.


  It runs on Three.js in a web page, and the creator built it with Antigravity,
  Google's AI coding tool. The game is playable online with other people, and it
  does not target mobile devices.
