slug: chain-puzzle
title: Chain Puzzle
tagline: Link words into chains and use bonuses to push your score higher.
description: >-
  Pick a mode first, because it decides how strict the guessing is. Easy is
  hangman style, so you can guess any letters you like, and each one shows green
  when it's in the right place, yellow when it's in the word but misplaced, and
  grey when it's not there.


  Easy also starts you off on 5-letter words, so the first word is a short one.


  Medium is crossword style, which means every guess has to be a real word from
  the dictionary. You can't just throw letters at the board to see what sticks.
  It starts at 5-letter words too.


  Hard keeps the dictionary rule but skips the warm-up. You choose Level 6 or
  Level 7 as your starting point, so the words are longer from your very first
  move.


  The goal is to chain as many words together as you can, use bonuses along the
  way, and finish with the highest score.


  Since a dictionary decides what counts in Medium and Hard, it makes sense that
  there's a suggest-a-word button on the main menu. A high scores screen and a
  how-to-play page sit right beside it.


  The creator wanted to learn about gameplay logic and make something people
  would enjoy playing.
