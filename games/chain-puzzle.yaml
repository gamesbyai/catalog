slug: chain-puzzle
title: Chain Puzzle
tagline: Link words into chains and use bonuses to push your score higher.
description: >-
  Chain Puzzle is a word game about linking words together into as long a chain
  as possible. Each run is a race to build connections, and the final score
  depends on how many words you string together and how well you use the bonuses
  available along the way.


  The focus is on the score chase. Bonuses add a layer of decision-making to
  what would otherwise be a simple chaining exercise, so you have to think about
  when to spend them for the biggest payoff. It runs on mobile as well as
  desktop, and it is a single-player experience.


  It was entered in Vibe Jam 2026, where it placed 391st out of 945 entries. The
  creator built it with Claude Code, and said they wanted to learn about game
  play logic and make something people would enjoy playing.
