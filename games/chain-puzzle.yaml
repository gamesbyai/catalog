slug: chain-puzzle
title: Chain Puzzle
tagline: Link words into chains and use bonuses to push your score higher.
description: >-
  Hit Play, then pick one of three modes, each marked with one, two or three
  stars.


  Easy plays a lot like hangman, where you can guess any letters you like and
  each one lights up green for the right spot, yellow for the wrong spot, or
  grey when it isn't in the word at all. The words start at five letters.


  Medium switches to a crossword style. Every guess there has to be a real word
  from the dictionary, though you're still starting on five-letter words. Hard
  keeps that dictionary rule but lets you jump straight in at Level 6 or Level
  7, so the words are longer from your very first move.


  Across all three, your aim is to chain together as many words as you can,
  picking up bonuses along the way while you chase the highest score.


  Your scores go onto a High Scores list, and there's a How to Play screen if
  you'd like the rules laid out. The main menu also has a Suggest a Word
  button for sending in words of your own, a friendly touch in a game built
  around a dictionary. It all sits on a neon purple and green backdrop with a
  glowing grid floor straight off a synthwave album cover.


  seanchk made it to learn how gameplay logic works and to build something
  people would enjoy playing.
