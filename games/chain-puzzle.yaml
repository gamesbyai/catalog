slug: chain-puzzle
title: Chain Puzzle
tagline: Link words into chains and use bonuses to push your score higher.
description: >-
  Chain Puzzle is a word game about length. You link words together into as long
  a chain as you can, and each run is a race to build connections. The final
  score depends on how many words you string together and how well you use the
  bonuses along the way.


  The creator wanted to learn about gameplay logic and make something people
  would enjoy playing, and built it with Claude Code. It is a single-player
  game, and out of 945 Vibe Jam 2026 entries it ranked 391st.


  The score chase is the focus, and bonuses are how you push it higher. They
  turn a simple chaining exercise into a string of small decisions, since the
  question is when to spend each one for the biggest payoff.
