slug: chain-puzzle
title: Chain Puzzle
tagline: Link words into chains and use bonuses to push your score higher.
description: >-
  Press Play, then pick one of three modes. Easy works like hangman: you guess
  any letters, and each one is marked green for the right place, yellow for the
  wrong place, or grey for not in the word. Easy starts at 5-letter words.


  Medium plays crossword style, and every guess must be a real word from the
  dictionary. It also starts with 5-letter words. Hard keeps the dictionary-only
  rule and lets you begin at Level 6 or Level 7, so the words are longer from
  the first move.


  The goal is to chain as many words together as you can, use bonuses along the
  way, and reach the highest score. Scores go to a High Scores list, and a How
  to Play screen explains the rules.


  The main menu also has a Suggest a Word button for sending in words. The game
  uses a neon purple and green look with a glowing grid floor.
