slug: chain-puzzle
title: Chain Puzzle
tagline: Link words into chains and use bonuses to push your score higher.
description: >-
  Press Play, then pick one of three modes, each marked with one, two or three
  stars. Chain together as many words as you can. Along the way you pick up
  bonuses while you chase the highest score.


  Easy, a hangman-style mode with any letter open to guess. Five-letter starting
  words in Easy and Medium. Medium, a crossword-style mode limited to real
  dictionary words. Hard, dictionary words only, with a jump-in start at Level 6
  or Level 7 and longer words from the first move. A High Scores list for your
  scores. A Suggest a Word button for sending in your own words.


  After each guess in Easy, check the marks. Green marks a letter in the right
  spot, yellow a letter in the wrong spot, and grey a letter that isn't in the
  word at all.


  seanchk made it to learn how gameplay logic works and to build something
  people would enjoy playing.
