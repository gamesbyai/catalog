slug: graviton
title: GRAVITON
tagline: Orbit a star and bend photon beams through gravity to destroy enemy waves
description: >-
  In GRAVITON you circle a star in a 3D orbital combat arena and fight off waves
  of enemies. Gravity wells pull on your ship, so you get around by orbiting and
  slingshotting instead of flying in straight lines.


  Your shots bend too: they are curved photon beams, so aiming means predicting
  how a beam will curve around massive bodies, and every dodge and slingshot
  runs on the same physics. Gravity is the central mechanic rather than
  background flavor, and the action leans on planning as much as reflexes.


  The creator cites orbital mechanics and gravitational lensing as the
  inspiration. They built the game with Bolt, Cursor and Claude for Vibe Jam
  2026, where it came 159th of 945, and Three.js renders the star, the ship and
  the beams in 3D.
