slug: graviton
title: GRAVITON
tagline: Orbit a star and bend photon beams through gravity to destroy enemy waves
description: >-
  Your photon beams curve as they pass through gravity wells, so a straight line
  to an enemy isn't always the shot you want. You orbit a star in a 3D arena,
  which means every aim is a small orbital puzzle.


  You thrust around with the keyboard and aim with the mouse, then click to fire
  at the enemies coming at you in waves. Because the beam bends, you have to
  think about where the wells sit before you pull the trigger, and the dodging
  works the same way.


  You can also slingshot through the gravity wells, which the title screen puts
  right in its name for the arena.


  Space gives you a gravity boost, and holding Shift raises your mass so you
  settle into a tighter orbit around the star. That's a neat trade, since you
  pick how close you hang to the thing that's pulling on everything.


  The creator built it around orbital mechanics and gravitational lensing. They
  wanted gravity to shape every shot, dodge and slingshot instead of sitting in
  the background.


  Your goal is to destroy the waves of enemies that keep arriving. There's a
  how-to-play screen next to the launch button if you'd like the rules before
  you start, which is handy for a game with this many gravity tricks.
