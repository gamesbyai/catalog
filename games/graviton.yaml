slug: graviton
title: GRAVITON
tagline: Orbit a star and bend photon beams through gravity to destroy enemy waves
description: >-
  Circle a star in a 3D orbital arena and fire photon beams that bend through
  its gravity at waves of enemies.


  Shots that curve like light. Slingshots past gravity wells. Dodges that bend
  with the pull. Aiming at where the curve carries the beam, not where the enemy
  is now.


  Thrust with WASD or the arrow keys and aim with the mouse. Left-click to fire
  a photon. Press Space for a gravity boost. Shift raises your mass and tightens
  your orbit.


  sivaguru_shiva built it around orbital mechanics and gravitational lensing,
  with gravity as the core mechanic.
