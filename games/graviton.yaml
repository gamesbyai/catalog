slug: graviton
title: GRAVITON
tagline: Orbit a star and bend photon beams through gravity to destroy enemy waves
description: >-
  Gravity does the work in this 3D orbital combat arena. You circle a star,
  slingshot past gravity wells, and fire photon beams that travel on curved
  paths toward waves of enemies. Each shot, dodge, and slingshot is shaped by
  the pull around you.


  WASD or the arrow keys thrust the ship, and the mouse aims. Left click fires a
  photon, and Space triggers a gravity boost. Shift increases your mass, which
  tightens your orbit around the star.


  The creator built the game around orbital mechanics and gravitational lensing,
  wanting gravity to be the core mechanic rather than background. The title
  screen, subtitled Orbital Slingshot Arena, is a black screen with a glowing
  gold title, a Launch button, a How to Play page, and a short list of the
  controls.
