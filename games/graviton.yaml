slug: graviton
title: GRAVITON
tagline: Orbit a star and bend photon beams through gravity to destroy enemy waves
description: >-
  GRAVITON is a 3D orbital combat arena where the player circles a star and
  fights off waves of enemies. Gravity wells pull on the ship, so movement is
  about orbiting and slingshotting rather than flying in straight lines. Shots
  are curved photon beams that bend as they travel.


  Gravity is the central mechanic instead of background flavor. It shapes every
  shot, dodge, and slingshot maneuver, so aiming means predicting how a beam
  will curve around massive bodies. The creator cites orbital mechanics and
  gravitational lensing as the inspiration, and the action leans on planning as
  much as reflexes.


  The creator built it with Bolt, Cursor, and Claude, using Three.js for the 3D
  rendering. It was a Vibe Jam 2026 entry, and it runs on mobile as well as
  desktop.
