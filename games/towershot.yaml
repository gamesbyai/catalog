slug: towershot
title: towershot
tagline: Fire shots with a single button and place each one with careful spatial
  judgment.
description: >-
  Click or press Enter to shoot a block at the tower, and use the left and right
  arrows to slide your aim. Each shot pushes the tower, so you're shoving the
  stack around. Match three colors and they clear.


  The creator names Puyo Puyo as the inspiration, which fits the color matching.


  There's a red zone you're meant to avoid. The screen counts your outs out of
  three, and three outs mean game over.


  The camera doesn't wait for you. The player view rotates around the tower on
  its own, and you can only fire from that view, so you have to wait for the
  right angle instead of shooting whenever you like. A Switch View button flips
  to an orbit camera for looking the tower over.


  Up top you'll see a score shown against a color count of four.


  On a phone, on-screen arrow buttons and a big Shoot button stand in for the
  keys, so the one-button idea carries over to touch.
