slug: towershot
title: towershot
tagline: Fire shots with a single button and place each one with careful spatial
  judgment.
description: >-
  Hit Start, nudge your aim with the left and right arrow keys, then click or
  press Enter to fire. Each shot shoves blocks around the tower. Get three
  blocks of one color lined up and they clear away, which means this shooter is
  quietly a color-matching game as well.


  Blocks you push into the red zone cost you an out, and your third out ends the
  run.


  The player view swings around without any input from you. You can only shoot
  from that player view, and an info line tells you when a shot isn't possible.
  A Switch View button changes the view.


  On a phone, large arrow buttons and a Shoot button take the place of the keys.


  gtmkprn calls it a one-button shooter where your sense of space and your focus
  decide each move. They name Puyo Puyo as the inspiration.
