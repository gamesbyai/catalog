slug: towershot
title: towershot
tagline: Fire shots with a single button and place each one with careful spatial
  judgment.
description: >-
  Towershot is a one-button shooter that mixes aiming with puzzle thinking. The
  player has a single input, so every decision comes down to when to fire and
  where a shot will land. Each move has to be planned against the space around
  it.


  The game is built around spatial awareness and focus. With no complicated
  controls, the challenge lies in reading the layout and timing shots, which
  gives it a feel closer to a falling-block puzzler than a typical shooter. The
  creator cites Puyo Puyo as a reference point for that puzzle feel.


  It runs in the browser on Three.js and works on mobile as well as desktop. The
  game was an entry in Vibe Jam 2026, and the creator used ChatGPT while
  building it.
