slug: towershot
title: towershot
tagline: Fire shots with a single button and place each one with careful spatial
  judgment.
description: >-
  In towershot you have one button, and everything depends on when you press it.
  It is a shooter, but one that mixes aiming with puzzle thinking. Every
  decision comes down to when to fire and where the shot will land, and each
  move has to be planned against the space around it.


  The creator cites Puyo Puyo as the reference for that puzzle feel. They made
  the game with ChatGPT on Three.js, it works on a phone or a computer, and it
  placed 473rd of 945 in Vibe Jam 2026.


  Reading the layout and timing your shots is the whole task, which puts it
  closer to a falling-block puzzler than a typical shooter. The game is built
  around spatial awareness and focus.
