slug: towershot
title: towershot
tagline: Fire shots with a single button and place each one with careful spatial
  judgment.
description: >-
  Press Start, then move the aim with the left and right arrow keys and click or
  press Enter to shoot. Each shot pushes blocks in a tall tower of colored
  cubes. Line up three blocks of the same color and they clear.


  The HUD shows a score counter next to a color count of 4, plus an out counter
  that starts at 0 of 3. Pushing blocks into the red zone costs an out, and the
  third out ends the run.


  The camera orbits the tower, and the player view rotates on its own. Shooting
  works only in the player view, and an info line says when a shot is not
  possible. A Switch View button changes the view, and a readout lists the
  current direction and state. On-screen arrow and Shoot buttons cover touch
  play. The creator describes it as a one-button shooter inspired by Puyo Puyo.
