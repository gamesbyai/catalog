slug: towershot
title: towershot
tagline: Fire shots with a single button and place each one with careful spatial
  judgment.
description: >-
  Hit Start, then take aim at a tower of blocks. Each shot shoves blocks around
  the tower.


  Color matching, with three blocks of one color lined up to clear them. Blocks
  pushed into the red zone, each costing you an out. A run that ends on the
  third out.


  Nudge your aim with the left and right arrow keys, then click or press Enter
  to fire. On a phone, use the large arrow buttons to nudge your aim and the
  Shoot button to fire, in place of the keys. Use the Switch View button to
  change the view.


  gtmkprn calls it a one-button shooter where your sense of space and your focus
  decide each move. They name Puyo Puyo as the inspiration.
