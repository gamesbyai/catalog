slug: cozy-drone
title: Cozy Drone
tagline: Fly a drone over a pixel world and drop freedom on the cozy scenery below.
description: >-
  Cozy Drone puts you at the controls of a small aircraft flying over a cute
  pixel-art landscape. The goal is to hand out freedom as you pass over the
  world, mixing the flight handling of a simulation with the aiming and dropping
  of a shooter.


  The game pairs a soft, cozy look with an action premise that plays against it.
  The creator says it came from a love of aircraft and an annoyance with cozy
  games, and that contrast shapes the tone. It was entered in Vibe Jam 2026,
  where it placed 24th out of 945 entries, and it is playable on mobile.


  According to the creator, the game was built with Claude Code, and it runs on
  the Phaser framework for its 2D pixel-art rendering and action.
