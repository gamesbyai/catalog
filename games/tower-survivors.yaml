slug: tower-survivors
title: Tower Survivors
tagline: Defend your tower against endless waves of enemies in a 3D arena.
description: >-
  Tower Survivors is a tower defense game with an action bent. You protect a
  central tower while enemies arrive in endless waves, and a run lasts until the
  defense finally gives way. The goal is to hold out as long as possible against
  increasing pressure.


  The game takes its premise from the Warcraft 3 custom map of the same name,
  mixing survival-style pressure with strategic choices about how to protect the
  tower. It runs in the browser using Three.js and was an entry in Vibe Jam
  2026.


  The game was built with Claude Code, which is the tool noted for this project,
  and it was submitted to the Vibe Jam 2026 event, where it placed 146th out of
  945 entries.
