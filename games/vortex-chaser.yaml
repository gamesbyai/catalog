slug: vortex-chaser
title: Vortex Chaser
tagline: Drive a storm-chasing rig, boost and drift after tornadoes, and tune
  your vehicle.
description: >-
  This arcade driving game puts you behind the wheel of a storm-chasing rig
  aimed at violent supercells rated EF3 and above.


  Boosting and drifting to close the gap on a storm. Staying on the tornado's
  trail as the point of a run. Multiplayer support.


  Press G at any time to open the garage and customize your rig during a run,
  not only between runs.


  The idea came from the creator's son, who loves tornado chasing games. The
  creator likes the movies but wanted to build something to the son's taste.
