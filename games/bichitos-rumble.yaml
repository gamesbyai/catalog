slug: bichitos-rumble
title: Bichitos Rumble
tagline: Shove cute animal fighters off the arena in fast, chaotic 3D brawls.
description: >-
  Pick a fighter, then use WASD and Space to headbutt your rivals off the arena
  and into the void. That's the whole fight, so you're shoving the other
  critters over the edge before they get you.


  There are nine animals to choose from: an elephant, a fox, a gorilla, a
  turtle, a frog, a mole in sunglasses, a penguin, a tiger and a crab. Each one
  gets a role label, a one-line tagline and dot ratings for speed, weight and
  power, so you can tell the quick ones from the heavy hitters before you
  commit. You can drag to spin the model around, too.


  Abilities sit on J and K, with L as your ultimate. Take Trunk the elephant,
  who's labeled a bruiser. His J is a forward tusk dash nothing interrupts, and
  his K is a wide thump that knocks rivals back and stuns them.


  His ultimate grabs a target and stuns it for 2.5 seconds, and while it's held
  it takes four times damage from any hit. That's a pretty nasty setup if a
  friend is standing nearby.


  You can start against bots, jump into online multiplayer for up to four
  players, or play with friends. A gamepad works as well, and R restarts the
  round.


  The creator, who goes by RGomezR14, likes party games for the friendly
  competition and wanted a way to escape and have fun with friends. The cute
  animals and the chaos fit that.
