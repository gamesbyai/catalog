slug: bichitos-rumble
title: Bichitos Rumble
tagline: Shove cute animal fighters off the arena in fast, chaotic 3D brawls.
description: >-
  Bichitos Rumble crowds small, cute animal fighters onto one platform and lets
  them try to knock each other off the edge. It is a 3D arena brawler, and every
  round is a fast, chaotic scramble: you push, smash and fight for position
  until only one fighter is left on the arena.


  Built with Claude Code and Three.js, it came 209th of 945 at Vibe Jam 2026 and
  runs on phones as well as desktops. It is meant as party-style competition
  with multiplayer support, the kind of casual rivalry that works best among
  friends, and the playful animal cast keeps the tone light.


  Rounds are quick and messy, and staying on the platform matters as much as
  shoving others off it, since the last fighter still standing wins.
