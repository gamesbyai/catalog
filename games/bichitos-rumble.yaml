slug: bichitos-rumble
title: Bichitos Rumble
tagline: Shove cute animal fighters off the arena in fast, chaotic 3D brawls.
description: >-
  Pick one of nine animal fighters, then headbutt your rivals off the arena and
  into the void. The fighters are an elephant, a fox, a gorilla, a turtle, a
  frog, a mole, a penguin, a tiger and a crab.


  Fighter roles, stats for speed, weight and power, and three abilities each. A
  frog named Kermit and a tiger called Cheeto. Trunk, the elephant, a bruiser
  with maxed-out power. Tusk dash that carries Trunk forward, plus a wide thump
  that knocks back and stuns anything nearby. Grip, a 2.5 second stun that
  leaves the target taking four times the damage from any hit. Bot matches,
  online matches for up to four players, or games with friends.


  In a match, move around and headbutt. Use your two abilities and your
  ultimate. Press the key that restarts the round, or plug in a gamepad if you'd
  rather not use the keyboard.


  RGomezR14 made it as a party-style brawler for friendly rivalry among friends.
