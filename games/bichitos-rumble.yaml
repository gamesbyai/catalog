slug: bichitos-rumble
title: Bichitos Rumble
tagline: Shove cute animal fighters off the arena in fast, chaotic 3D brawls.
description: >-
  Bichitos Rumble is a 3D arena brawler in which small, cute animal fighters
  crowd onto a platform and try to knock each other off the edge. Rounds are
  quick and messy: you push, smash, and scramble for position, and the last
  fighter standing on the arena wins.


  The game is built as a party-style competition, aimed at the kind of casual
  rivalry that works best among friends. It supports multiplayer and runs on
  mobile devices as well as desktop browsers, so a match can start without any
  install. The chaotic pace and playful animal cast keep the tone light.


  It was an entry in Vibe Jam 2026, where it placed 209th out of 945 entries.
  The creator built it with Claude Code, using Three.js for the 3D graphics.
