slug: bichitos-rumble
title: Bichitos Rumble
tagline: Shove cute animal fighters off the arena in fast, chaotic 3D brawls.
description: >-
  Pick one of nine animal fighters, then headbutt rivals off the arena into the
  void. The roster has an elephant, fox, gorilla, turtle, frog, mole, penguin,
  tiger and crab. Each card shows a role label, ratings for speed, weight and
  power, and three abilities.


  From the title screen you can play against bots, join online multiplayer for
  up to four players, or play with friends. In a match you move, headbutt, and
  use two abilities plus an ultimate. A restart key resets the round, and a
  gamepad also works.


  Trunk, the elephant, is a bruiser with top power. Its abilities are a forward
  tusk dash, a wide area thump that knocks back and stuns, and a grip that stuns
  a target for 2.5 seconds. That target takes four times damage from any hit.


  The select screen lets you drag to rotate a 3D preview of each fighter, and a
  belts screen opens from it. The creator built it as a party-style brawler for
  friendly competition with friends.
