slug: bichitos-rumble
title: Bichitos Rumble
tagline: Shove cute animal fighters off the arena in fast, chaotic 3D brawls.
description: >-
  Pick one of nine cute animal fighters, then headbutt your rivals off the arena
  and into the void.


  The lineup runs from an elephant, a fox, a gorilla, a turtle and a frog to a
  mole, a penguin, a tiger and a crab. Each fighter has a role, stats for speed,
  weight and power, and three abilities of its own. The frog is named Kermit and
  the tiger goes by Cheeto.


  You can fight bots, join online matches for up to four players, or set up a
  game with friends. Once you're in a match, you move around, headbutt, use two
  abilities and have an ultimate on top.


  There's a key that restarts the round, and you can plug in a gamepad if you'd
  rather not use the keyboard.


  Trunk, the elephant, shows how much each kit packs in. It's a bruiser with
  maxed-out power, and its tusks carry it forward in a dash while a wide thump
  knocks back and stuns whatever's around it. The grip is mean, because it stuns
  a target for 2.5 seconds and that target takes four times the damage from any
  hit.


  The game also has belts. RGomezR14 made it as a party-style brawler for
  friendly competition between friends.
