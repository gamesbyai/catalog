slug: clawpocalypse
title: Clawpocalypse
tagline: Blast waves of rogue robots and upgrade your weapons in a neon arena shooter.
description: >-
  Shoot through endless hordes of rogue Clawbots in a fast-paced roguelite
  shooter. Each run is a fight for survival: keep shooting, stay ahead of the
  swarm and collect upgrades that make your weapons stronger as the chaos
  builds.


  The main inspiration is Boxhead, the old browser game, and the creator says a
  love of roguelikes shaped the rest of the design. It was built in 3D with
  Three.js, using Google's Antigravity as the AI tool.


  That mix shows in the loop, which pairs arcade-style crowd shooting with
  weapon upgrades that change how each run plays out.
