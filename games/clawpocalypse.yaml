slug: clawpocalypse
title: Clawpocalypse
tagline: Blast waves of rogue robots and upgrade your weapons in a neon arena shooter.
description: >-
  Shoot your way through a fast-paced roguelite shooter. Each run is a fight for
  survival: keep shooting and stay ahead of the swarm.


  Endless hordes of rogue Clawbots. Arcade-style crowd shooting. Weapon upgrades
  collected during a run, making your guns stronger as the chaos builds and
  changing how each run plays out.


  According to Marc_Cyc, Boxhead, an old browser game, was the biggest
  inspiration. Marc_Cyc says a love of roguelikes shaped the rest of the design.
  The game is built in 3D.
