slug: vibe-sentinel
title: Vibe Sentinel
tagline: Fight shadow beasts through ten turn-based dungeon levels, one careful
  move at a time.
description: >-
  Playing alone, you are the last guardian of the Ancient Grove, walking a dark
  dungeon one grid tile at a time and fighting the shadow beasts inside. Get
  through all 10 levels to win the run.


  Ten biomes, one for each level, from a forest grove through a volcanic maze to
  a void sanctum. Escalating shadow beasts across the levels. Glowing exit stars
  on every level, each leading to the next floor. The Sentinel Pulse, a
  2-crystal blast that reaches every enemy within 3 tiles. Endless mode past the
  main run, and badges to earn. A portal into another game. Your Sentinel,
  picked before you start.


  Bump into a shadow beast to fight it. Nothing moves until you take a turn, and
  enemies only step every other turn, which gives you a little room to
  reposition. Wait in place to pass your turn, but enemies keep acting while you
  stand still. You begin with 10 HP, and potions restore 6 HP.


  The design follows early Rogue and Nethack, where managing your resources
  matters more than fast reflexes.
