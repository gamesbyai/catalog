slug: vibe-sentinel
title: Vibe Sentinel
tagline: Fight shadow beasts through ten turn-based dungeon levels, one careful
  move at a time.
description: >-
  The first thing you see is a glowing green title card that casts you as a
  Sentinel of the Ancient Grove, the last guardian between your home and an army
  of shadow beasts. A button under the intro lets you choose your Sentinel
  before you head into the dungeon.


  You move one tile at a time, and you attack by bumping into an enemy. Crystals
  and potions are scattered around each level, and you're looking for the
  glowing exit star that leads to the next one. Clear all 10 levels and the
  bloodline is saved.


  Enemies only move every other turn, and that gap is what you play around.


  You start with 10 HP and every hit hurts, so the off turn is your chance to
  reposition. The border is a solid wall, which means there's no safe lane along
  the edge to hide in.


  Crystals feed your Sentinel Pulse, which hits every enemy within 3 tiles for 2
  crystals. Potions bring back 6 HP, and if you'd rather hold still while the
  enemies keep moving, you can wait a turn.


  The creator took inspiration from classic grid roguelikes like Rogue and early
  NetHack, where every move matters and the pressure comes from managing
  resources instead of reflexes. Each of the 10 levels gets its own look, from a
  forest grove through a volcanic maze to a void sanctum, which is a lot of
  scenery change for a compact dungeon crawl.


  Past the main run there's an endless mode and badges to earn. There's also a
  portal that drops you straight into another game.
