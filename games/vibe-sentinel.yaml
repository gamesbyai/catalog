slug: vibe-sentinel
title: Vibe Sentinel
tagline: Fight shadow beasts through ten turn-based dungeon levels, one careful
  move at a time.
description: >-
  A green-glowing panel greets you first, with a short briefing, the controls
  and a button to choose your Sentinel. You're the last guardian of the Ancient
  Grove, walking a dark dungeon one grid tile at a time and fighting shadow
  beasts by simply bumping into them.


  Somewhere on every level there's a glowing exit star that takes you down to
  the next floor. Get through all 10 levels and the run is won. You begin with
  only 10 HP, though potions put 6 back, and crystals pay for the Sentinel
  Pulse, which spends 2 of them to hit every enemy within 3 tiles.


  Turns are discrete, so nothing moves until you do, and the enemies only take a
  step every other turn, which hands you a little gap to reposition.


  Waiting passes your turn, but the enemies keep acting while you stand there.
  The outer border is solid wall too.


  Each of the 10 levels gets its own biome, and the spread is pretty wide, from
  a forest grove through a volcanic maze all the way to a void sanctum.


  Past the main run there's an endless mode, plus badges to earn. There's also a
  portal that leads into another game. The design follows early Rogue and
  Nethack, where managing your resources matters more than fast reflexes.
