slug: vibe-sentinel
title: Vibe Sentinel
tagline: Fight shadow beasts through ten turn-based dungeon levels, one careful
  move at a time.
description: >-
  Vibe Sentinel is a turn-based dungeon roguelike on a grid: ten levels down,
  one careful move at a time. The shadow beasts get tougher as you descend, so a
  run comes down to managing your resources and choosing every step with care.


  The design draws on classic grid roguelikes such as Rogue and early Nethack,
  where the tension comes from limited resources. It runs on PixiJS, with Claude
  Code as the AI tool.


  Each level is its own biome, from a forest grove to a volcanic maze and
  finally a void sanctum, so the scenery changes as the danger rises. Beyond the
  main run there is an endless mode and a set of badges to earn, and a portal
  leads straight into the next Vibe Jam game.
