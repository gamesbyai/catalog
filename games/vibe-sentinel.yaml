slug: vibe-sentinel
title: Vibe Sentinel
tagline: Fight shadow beasts through ten turn-based dungeon levels, one careful
  move at a time.
description: >-
  The opening screen is a green-glowing panel with a short briefing, the
  controls, and a button to pick your Sentinel. You play the last guardian of
  the Ancient Grove, walking a dark dungeon one grid tile at a time and
  attacking by bumping into enemies.


  Each level hides a glowing exit star that leads to the next floor, and a run
  is won by getting through all 10 levels. You start with 10 HP. Potions restore
  6 HP, and crystals fuel the Sentinel Pulse, which costs 2 crystals and hits
  every enemy within 3 tiles.


  Turns are discrete, so nothing moves until you do. Enemies step only every
  other turn, which leaves a gap to reposition. Waiting passes your turn while
  they keep acting. The outer border is solid wall, so there is no safe edge to
  hide along.


  Each of the 10 levels has its own biome, running from a forest grove through a
  volcanic maze to a void sanctum. Beyond the main run there are an endless
  mode, badges, and a portal into another game from the same event. The design
  follows early Rogue and Nethack, where resource management matters more than
  reflexes.
