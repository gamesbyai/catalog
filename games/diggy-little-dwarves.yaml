slug: diggy-little-dwarves
title: Diggy Little Dwarves
tagline: Dig for gold and gems with a crew of dwarves, then prestige and dig again.
description: "Lead a little crew of dwarves into the mountain to dig out gold and gems, grow them into a mining company, and face whatever lurks beneath.


  Stone walls studded with ore to tunnel through. Gold to sell once you haul it up. A prestige reset that trades your gold, crew and upgrades for a prestige point. Rewards from prestige that survive every reset, starting with gold that sells for double.


  Enter the mine to start digging and sell the gold you bring back. When you're ready, prestige and start the dig over.


  According to Portal Rabbit, generative AI had some part in the code, art, sound and writing, though the tools aren't named.


  There's no account or download, the demo is free while it's still being built, and your progress stays saved in the browser. Desktop is the recommended way to play."
