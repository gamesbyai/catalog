slug: prime-time-panic
title: prime time panic
tagline: Run a TV production studio in a simulation that parodies prime-time media.
description: >-
  You're running a small TV station that starts with $50,000 and no viewers, so
  you hire a host or technician, order a show from the catalog, and drop a
  finished one into a slot in the weekly schedule. A news ticker across the top
  runs made-up broadcasts that poke fun at television. The menus are in German,
  which is worth knowing before you start clicking.


  A short checklist on the overview screen walks you through your first week,
  and the last step is pressing the week-forward button to see what happens. The
  creator pitched it as Game Dev Story meets MADtv.


  The schedule is a grid of days against time slots, and mornings multiply by
  0.6, afternoons by 0.8 and primetime by 2, so it's pretty clear where your
  best shows belong.


  The talent agency is where you hire people, and a mood meter there shows how
  your staff is holding up. It sat at 70% when the game opened. You can pay to
  lift it, and each option has its own price: a pizza party costs 800 for 12%
  more mood, a company outing costs 3,500 for 25%, and a bonus for everyone
  costs 8,000 for 35%.


  Some of those options are plainly jokes, like the premium weekly fruit basket
  that only three people ever eat from.


  Your goals are about audience size, starting with your first 100 viewers, then
  1,000, then 10,000. A rating figure and an intern rank bar with an XP count
  track how you're doing along the way.
