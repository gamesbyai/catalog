slug: prime-time-panic
title: prime time panic
tagline: Run a TV production studio in a simulation that parodies prime-time media.
description: >-
  You run a small TV station that starts with $50,000 and zero viewers. A
  checklist on the overview screen lays out the first week: hire at least one
  host or technician, commission a show from the catalog, place a finished show
  in the schedule, then advance the week.


  The schedule is a grid of seven days with morning, afternoon and primetime
  slots. Each slot has a viewer multiplier: x0.6 in the morning, x0.8 in the
  afternoon and x2 in primetime. Cash, viewer count and a star rating stay in
  the top bar.


  The talent agency screen is where you search for staff. It also has a morale
  meter with team-building options, such as a pizza party, a company outing or a
  bonus payment, each with a price and a mood boost. Goals start at 100 viewers
  and go up to 1,000 and 10,000.


  A news ticker runs parody headlines along the top of the screen. The menu also
  has tabs for shows and events, and the interface text is in German. The
  creator describes it as Game Dev Story meets MADtv.
