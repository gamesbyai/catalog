slug: prime-time-panic
title: prime time panic
tagline: Run a TV production studio in a simulation that parodies prime-time media.
description: >-
  You run a small TV station that starts with $50,000 in the bank and nobody
  watching. Weekly expenses of $500 apply even before anything is on air, with
  zero income to offset them. The interface is in German.


  Seven days of morning, afternoon and primetime slots. Viewer multipliers of
  x0.6 for mornings, x0.8 for afternoons and x2 for primetime. A talent agency
  where you can search for new hires. Morale boosts like a pizza party (€800,
  +12%), a company outing, a bonus for everyone (€8,000, +35%) and a mandatory
  motivational talk (€200, +3%). News with silly parody headlines, such as one
  about a magician whose assistant keeps vanishing at 8:15 pm.


  In your first week, hire at least one host or technician. Commission a show
  from the catalog, put a finished show into the schedule, then advance the
  week. Work toward goals that begin at your first 100 viewers and climb to
  1,000 and then 10,000.


  bimon describes the game as Game Dev Story meets MADtv, naming both as its
  points of comparison.
