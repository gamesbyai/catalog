slug: prime-time-panic
title: prime time panic
tagline: Run a TV production studio in a simulation that parodies prime-time media.
description: >-
  You're running a small TV station that starts with $50,000 in the bank and
  nobody watching. A checklist on the overview screen walks you through your
  first week: hire at least one host or technician, commission a show from the
  catalog, put a finished show into the schedule, then advance the week. Even
  before anything's on air, the overview shows $500 in weekly expenses against
  zero income, which is a bit of a cold welcome.


  There's a grid of seven days in the schedule, each split into morning,
  afternoon and primetime slots with their own viewer multiplier. Mornings get
  x0.6 and afternoons x0.8, while primetime jumps all the way to x2.


  Your cash, viewer count and star rating don't leave the top bar, and the side
  menu also has tabs for shows and events.


  Staff come from the talent agency screen, where you're able to search for new
  hires. It's also got a morale meter, and you can push the team's mood back up
  with things like a pizza party, a company outing or a bonus for everyone, each
  with its own price and boost. The pizza party costs €800 for +12% and the
  bonus runs €8,000 for +35%, while a mandatory motivational talk buys a measly
  3% for €200.


  Goals start at your first 100 viewers, and they'll climb to 1,000 and then
  10,000.


  There's a news ticker scrolling pretty silly parody headlines across the top,
  like one about a magician whose assistant keeps vanishing at 8:15 pm. The
  interface text is in German. bimon describes it as Game Dev Story meets MADtv.
