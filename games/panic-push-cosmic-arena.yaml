slug: panic-push-cosmic-arena
title: "Panic Push: Cosmic Arena"
tagline: Shove rivals off a cosmic arena platform in chaotic multiplayer brawls.
description: >-
  Panic Push: Cosmic Arena is a multiplayer party brawler, and every fight is a
  shoving match in space. You and the other players share a floating arena, and
  the goal is to push everyone else out of the ring while staying in it
  yourself, until the last player standing takes the round.


  The Phaser framework runs it, and the creator states that Codex was part of
  the build process for Vibe Jam 2026. It placed 580th of 945 in the jam, and
  matches are online.


  The creator describes it as a mix of sumo and Beyblade-style games, and that
  shows in the pushing and collision-driven fights. Each round is a short,
  chaotic scramble, the bright cosmic setting keeps the mood light, and the fast
  pace suits quick sessions with other people.
