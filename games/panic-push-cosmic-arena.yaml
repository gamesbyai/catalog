slug: panic-push-cosmic-arena
title: "Panic Push: Cosmic Arena"
tagline: Shove rivals off a cosmic arena platform in chaotic multiplayer brawls.
description: >-
  Type a nickname to start playing online with other people. Each short round is
  much like sumo, except the ring is a platform in space that crumbles under
  everyone's feet. Stay on it while you shove rivals toward the shrinking edge
  until they go over.


  Your own room, or any room joined with a five-letter code. A public lobby list
  that updates on its own as new rooms appear. Host-added bots that fill empty
  slots in rooms that are short on people. Matches that can start without a full
  room of humans.


  Move with WASD or the arrow keys. Press Space to dash. Push with a mouse
  click, J, or K.


  summerlilac___ describes it as a multiplayer party brawler in the vein of
  sumo-circle and Beyblade games, set in a cosmic arena.
