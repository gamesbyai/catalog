slug: panic-push-cosmic-arena
title: "Panic Push: Cosmic Arena"
tagline: Shove rivals off a cosmic arena platform in chaotic multiplayer brawls.
description: >-
  Type a nickname, then create a room or enter a five-letter code to join one.
  An open-rooms panel on the same screen shows public lobbies you can join. A
  host can fill empty slots with bots, so a match can start without a full room
  of people.


  Rounds are played on a collapsing space platform. Move with WASD or the arrow
  keys, dash with Space, and push with a mouse click, J or K. The goal is to
  stay on the platform while shoving rivals toward the shrinking edge and off
  it.


  The creator describes it as a multiplayer party brawler in the vein of sumo
  circle and Beyblade games, played against other people online in short rounds
  inside a cosmic arena.
