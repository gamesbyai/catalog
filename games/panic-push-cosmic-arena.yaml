slug: panic-push-cosmic-arena
title: "Panic Push: Cosmic Arena"
tagline: Shove rivals off a cosmic arena platform in chaotic multiplayer brawls.
description: >-
  Panic Push: Cosmic Arena is a multiplayer party brawler where players compete
  on a floating arena set in space. The goal is to shove opponents out of the
  ring while staying on it yourself. Each round is a short, chaotic scramble,
  and the last player standing comes out on top.


  The creator describes it as a mix of sumo and Beyblade-style games, and that
  shows in the pushing and collision-driven fights. The bright cosmic setting
  keeps the mood light, and the fast pace suits quick sessions with other
  people.


  It was made for Vibe Jam 2026 using the Phaser framework. The creator states
  that Codex was part of the build process, and the game placed 580th among 945
  entries in the jam.
