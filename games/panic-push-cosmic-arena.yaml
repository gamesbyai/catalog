slug: panic-push-cosmic-arena
title: "Panic Push: Cosmic Arena"
tagline: Shove rivals off a cosmic arena platform in chaotic multiplayer brawls.
description: >-
  Move with WASD or the arrow keys, dash with Space, and shove rivals with a
  click, J or K. You're on a platform floating in space, and the idea is to stay
  on it while you knock the other players off. The platform is collapsing, so
  the ground you're standing on is part of the problem.


  The rounds are quick, and everyone you're up against is in the same
  multiplayer match.


  You start by typing a nickname. From there you can create a room, which fills
  any empty slots with bots, so a lobby doesn't need a full crowd before it gets
  going.


  If a friend gave you a room code, type it into the code box and you jump
  straight into their lobby. That's handy when you'd rather play with people you
  know than with whoever's online.


  There's also a list of public lobbies with a refresh button, and new rooms
  show up there on their own.


  The creator describes the game as a cross between a sumo ring and a Beyblade
  match, which fits a game about bumping people out of a circle.
