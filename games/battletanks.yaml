slug: battletanks
title: battletanks
tagline: Fight other players' tanks in a 3D arena using cannons, missiles, and a laser.
description: >-
  You drive a tank around a 3D arena against other players online and pick
  between a spray cannon, salvo missiles, or a laser. The laser works
  differently from the rest: hold fire to build a charge, then release to shoot,
  and the damage grows with the charge.


  The hull and turret turn separately. Steering moves the chassis, while
  dedicated keys swing the turret left or right, with a tap for a small
  adjustment and another key to snap it back to face forward. On touch screens a
  left joystick drives and turns the tank, a right knob sets the turret angle,
  and a large button fires.


  A loadout panel opens mid-match, so you can change chassis, turret, mobility
  and colors without leaving the game. The chassis list includes Colossus and
  Vampire. A stat readout covers HP, speed, damage, fire rate and rotation. A
  help panel with all the controls opens on H at any time.


  The creator took the idea from Tanki Online, a browser tank game that features
  futuristic turret weapons such as lasers and plasma cannons.
