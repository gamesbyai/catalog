slug: battletanks
title: battletanks
tagline: Fight other players' tanks in a 3D arena using cannons, missiles, and a laser.
description: >-
  The laser doesn't fire the moment you press the button. Hold fire to build up
  a charge, then let go to shoot, and the damage grows with the charge. You
  drive a tank against other players online in arena matches.


  Salvo missiles and a spray cannon as the other weapons. Independent hull and
  turret rotation. Colossus and Vampire, among the chassis on offer.


  Steer to turn the chassis. Press Z or X to swing the turret left or right, and
  tap either briefly to nudge it. Press C to snap the turret back forward. Press
  Tab to swap chassis, turret, mobility and colors mid-match, without leaving
  the game. Touch screens have their own full layout: a joystick drives and
  turns, a knob aims the turret, and the fire button shoots, the laser included.
  Press H at any time for a full controls reference.


  MarcosBren31124 drew the idea from Tanki Online, a browser-based multiplayer
  game with tank battles and futuristic turret weapons such as lasers and plasma
  cannons.
