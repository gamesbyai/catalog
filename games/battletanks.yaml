slug: battletanks
title: battletanks
tagline: Fight other players' tanks in a 3D arena using cannons, missiles, and a laser.
description: >-
  Every player in battletanks drives a tank around one shared 3D map and fights
  the other players' tanks online. Each player picks from three weapons: a spray
  cannon, salvo missiles and a laser you can hold down to sweep across the
  battlefield.


  The setup draws on Tanki Online, the browser tank battler known for futuristic
  turret weapons. This one was built with Claude Code on Babylon.js, plays in
  desktop and mobile browsers, and ranked 577th of 945 at Vibe Jam 2026.


  Matches come down to positioning and to picking the right weapon for the
  moment, since each one has its own use. The laser pays off if you can keep it
  aimed across the battlefield for a long stretch, while the cannon and missiles
  suit quicker exchanges.
