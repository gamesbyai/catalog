slug: battletanks
title: battletanks
tagline: Fight other players' tanks in a 3D arena using cannons, missiles, and a laser.
description: >-
  You hold the fire key to charge the laser and let go to shoot, so the damage
  grows the longer you wait. That's what sets it apart from the other two turret
  weapons, a spray cannon and salvo missiles.


  Your tank has two things to steer. A and D turn the chassis, while Z and X
  swing the turret on its own, and a quick tap nudges it a tiny amount.


  C snaps the turret back to face the front, which helps when you've lost track
  of where it's pointing.


  Tab opens a loadout panel where you swap chassis, turret, mobility and colors
  without leaving the match. That makes sense in a multiplayer arena, because
  you don't have to sit out to change your build. Chassis such as Colossus and
  Vampire come with their own stats for HP, speed, damage, fire rate and
  rotation.


  On a phone, the left joystick drives and turns the tank. The right knob sets
  the turret's angle directly, and a big fire button handles shooting, including
  the hold-and-release laser.


  The creator was inspired by Tanki Online, the browser tank game with
  futuristic turret weapons. Press H any time to open the controls reference, or
  Esc for settings, where you can remap keys.
