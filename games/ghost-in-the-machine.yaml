slug: ghost-in-the-machine
title: Ghost In The Machine
tagline: Search a storm-struck computer lab for hidden ghosts with a detector
  before time runs out.
description: >-
  The game starts in an abandoned computer lab while a storm rages outside.
  Everything is told in text. You move by cardinal direction and by which way
  you are facing, and you carry a detector that tracks the hidden entities in
  the building.


  Each room offers items to pick up, and terminals hold lore you can read.
  Mapping every room is part of the goal, and a timer limits how long you have
  to find the ghosts. When a ghost gives chase, you have to get away along
  routes blocked by obstacles.


  Your final score adds up the ghosts you found and how much of the game you
  completed. Collect every tool, read all the lore, map every room and clear
  every obstacle, and you unlock a Secret Victory ending with its own music. The
  creator lists AI assistance for the code, graphics, sounds and text.
