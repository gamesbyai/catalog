slug: ghost-in-the-machine
title: Ghost In The Machine
tagline: Search a storm-struck computer lab for hidden ghosts with a detector
  before time runs out.
description: >-
  You've got until the timer runs out to find the ghosts haunting an abandoned
  computer lab, and a storm is hammering the windows the whole time.


  Your detector does the warning, and it reports in words, like a screaming
  alert when a ghost is very close. You type commands to move, either by compass
  direction or by turning and walking forward, so you always have to keep track
  of which way you're facing.


  Look, scan, search, inspect, inventory, map and status are all commands, and
  there are buttons under the command line if you'd rather click than type.
  Along the way you collect tools, read terminal entries that tell the lab's
  story, and try to map every room.


  There are nine rooms, nine lore entries, four tools and four obstacles, which
  is a surprisingly tidy checklist for a text game.


  A side panel tracks which rooms you've explored, which tools you hold, which
  terminals you've read and which obstacles you've cleared. Obstacles stay
  blocked unless you carry the matching tool, so the panel tells you what you're
  still missing.


  When a ghost catches up, a chase starts and you have to get back to the Lab
  Entrance before it gets you. That makes the map useful, since you'll want a
  route you already know.


  Your final score combines the ghosts you found with how much of the lab you
  completed, and there's a high score to beat. Clear every tool, lore entry,
  room and obstacle and you unlock a secret victory ending with its own music,
  plus a mute button if you'd rather play quietly.
