slug: ghost-in-the-machine
title: Ghost In The Machine
tagline: Search a storm-struck computer lab for hidden ghosts with a detector
  before time runs out.
description: >-
  Your run ends with a score for the ghosts you track down and how much of an
  abandoned computer lab you've finished off, and everything plays out in text.


  You get around by typing commands, either compass directions or turns and
  steps based on the way you're facing. Typing just "north" works too, and you
  can click buttons for common commands like look, scan and inspect.


  Your detector is how you find the hidden entities in the building. When one of
  them gives chase, you've got to make it back to the Lab Entrance before it
  catches you, so at least you always know where safety is. Obstacles block some
  routes, and each one stays shut until you're carrying the tool that matches
  it.


  A timer runs non-stop and caps how long you've got to find the ghosts.


  Completion gets tracked closely, with four tools to collect, nine pieces of
  terminal lore to read, nine rooms to map and four obstacles to clear.
  Everything you've explored, collected, read and overcome gets tracked as you
  go. Clear every last one of those and you unlock a Secret Victory ending that
  even gets its own music.


  jetblackrlsh lists AI help with the code, graphics, sounds and text.
