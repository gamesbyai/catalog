slug: ghost-in-the-machine
title: Ghost In The Machine
tagline: Search a storm-struck computer lab for hidden ghosts with a detector
  before time runs out.
description: >-
  Track down hidden ghosts in an abandoned computer lab before a non-stop timer
  runs out. You're trapped there during a storm, and everything plays out in
  text. Your run ends with a score for the ghosts you find and how much of the
  lab you've completed.


  Four tools to collect, nine pieces of terminal lore to read and nine rooms to
  map. Obstacles that block some routes, four in all, each shut until the
  matching tool is in hand. The detector that finds hidden entities in the
  building. Ghost chases, with a place of safety you always know. Everything
  explored, collected, read and overcome, tracked as you go. A Secret Victory
  ending for a full clear, with its own music.


  Type a compass direction, such as north, to move that way. Type turn and step
  commands based on the way you're facing. You can also click buttons for common
  commands, such as look, scan and inspect. When a ghost gives chase, make it
  back to the Lab Entrance before it catches you.


  According to jetblackrlsh, AI helped with the code, graphics, sounds and text.
