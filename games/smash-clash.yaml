slug: smash-clash
title: Smash&Clash
tagline: Battle a second player with cards on a compact 3×5 grid in short, tense
  matches.
description: >-
  When the game opens, you get the Smash&Clash logo up top, a rating counter
  starting at 1000 and a big pink Play button right under it.


  Every match is a card battle between two players, played on a grid only three
  tiles by five. Small wins pile onto each other until they turn into momentum,
  and any single move can swing the balance back. HarshitKhemani wanted short,
  intense bursts of competitive strategy instead of long, drawn-out games, and a
  board that tiny suits the idea.


  Before you start, a panel called Pick Your Rules has you choose between two
  rulesets. Mutators adds chess hops, power tiles and overruns, while Classic is
  labeled as the original game, and each one gets its own little grid icon
  dotted with colored tiles.


  Chess hops are an oddly specific thing to find in a card battle, and they're
  the very first twist the Mutators option names.


  Below Play, the menu lists 2 Players · Local, Play a Friend and Friends.
  Profile and settings buttons sit up in the top right corner.


  A cookie notice with Accept and Decline buttons pops up over the menu. It's a
  surprisingly polite one, too, because it says plainly that you can play the
  game without accepting.
