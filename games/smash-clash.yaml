slug: smash-clash
title: Smash&Clash
tagline: Battle a second player with cards on a compact 3×5 grid in short, tense
  matches.
description: >-
  The start screen shows the Smash&Clash logo over a rating counter that begins
  at 1000, with a large pink Play button beneath it. A rules panel labeled Pick
  Your Rules offers two choices: Mutators, listed with chess hops, power tiles
  and overruns, and Classic, labeled as the original game. Each has a small grid
  icon with colored tiles.


  Matches are two-player card battles on a 3×5 grid. Small wins build on each
  other into momentum, and any single move can shift the balance. The creator
  aimed for short, intense rounds of competitive strategy rather than long,
  drawn-out games.


  Below Play, the menu lists 2 Players · Local, Play a Friend and Friends.
  Profile and settings buttons sit in the top right corner. A cookie notice with
  Accept and Decline buttons appears over the menu, and it states that the game
  can be played without accepting.
