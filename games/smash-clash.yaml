slug: smash-clash
title: Smash&Clash
tagline: Battle a second player with cards on a compact 3×5 grid in short, tense
  matches.
description: >-
  Each match is a card battle between two players on a 3×5 grid. Small wins
  stack into momentum, and any single move can swing the balance back.


  Starting rating of 1000. A choice of ruleset before you start. Classic,
  labeled as the original game. Mutators, with chess hops, power tiles and
  overruns. Local two-player mode. Play a Friend and Friends modes.


  HarshitKhemani wanted short, intense bursts of competitive strategy, not long,
  drawn-out games.
