slug: smash-clash
title: Smash&Clash
tagline: Battle a second player with cards on a compact 3×5 grid in short, tense
  matches.
description: >-
  The first thing you do is pick your rules, because the menu asks before a
  match starts.


  Classic is the original version, and Mutators adds chess hops, power tiles and
  overruns. Both are a two-player card battle on a 3×5 grid. That's a small
  board, so each card you place changes what your opponent can do next.


  The idea is that small wins stack up into momentum, which keeps the lead
  swinging back and forth. The creator wanted competitive strategy in short
  bursts instead of long, drawn-out games.


  There's more than one way to find an opponent, whether that's someone sitting
  next to you or a friend online.


  Play is the big pink button at the top. Below it you can start a local
  two-player game on one device, challenge a friend, or open a friends list, and
  the menu also shows a rating of 1000.


  Mutators is the highlighted choice when the rules picker opens, which suits a
  game so keen on shake-ups.
