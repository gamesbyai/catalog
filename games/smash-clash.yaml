slug: smash-clash
title: Smash&Clash
tagline: Battle a second player with cards on a compact 3×5 grid in short, tense
  matches.
description: >-
  Smash&Clash is a two-player card battle played on a 3×5 grid. Players take
  turns placing and using cards on the board, competing for control of the grid.
  Matches are built to be short, so a single game runs as a quick burst of
  tactical decisions rather than a long session.


  The design centers on momentum. Small wins on the board add up, and each move
  can tip the balance toward one side or the other. The compact grid keeps the
  options readable, so every placement carries weight and comebacks stay
  possible.


  It was an entry in Vibe Jam 2026, and the creator built it with Cursor. It
  runs in the browser on a canvas and is set up for both multiplayer and mobile
  play.
