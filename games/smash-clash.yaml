slug: smash-clash
title: Smash&Clash
tagline: Battle a second player with cards on a compact 3×5 grid in short, tense
  matches.
description: >-
  Smash&Clash is a two-player card battle fought on a compact 3×5 grid. Players
  take turns placing and using cards on the board, competing for control of the
  grid. Matches are built to be short and tense, so a game plays out as a quick
  burst of tactical decisions rather than a long session.


  It was made with Cursor, runs on canvas, and plays online against a second
  player, on phones and desktops alike. In Vibe Jam 2026 it placed 109th of 945
  entries.


  Momentum drives the design. Small wins on the board add up, and each move can
  tip the balance toward one side or the other. The grid is compact enough to
  keep the options readable, so every placement carries weight, and comebacks
  stay possible.
