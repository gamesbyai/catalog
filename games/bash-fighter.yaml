slug: bash-fighter
title: Bash Fighter
tagline: Knock up to twenty fighters off a shrinking arena in a Smash-style brawl.
description: "Knock the other fighters off the edge of the arena. Bash Fighter
  is a platform fighter for up to twenty players in one arena, and one-on-one
  works too. The more damage you've taken, the farther a hit sends you flying,
  so a badly beaten fighter is one clean hit from gone.


  Last Fighter Standing, the default battle royale with no respawns. Timed
  Brawl, a 90-second mode with respawns, won by the most knockouts. Blast-zone
  edges closing in on survivors, squeezing them into tighter fights, paced by
  match ticks and seed rather than a clock. Private lobbies joined by a
  four-character code. A free-moving spectator camera for fighters who are out.


  Run with A and D. Jump with Space. Attack with F, use a special with G, and
  shield with Shift. Press Play with a friend and share the link in your address
  bar. Whoever opens it joins your lobby. Swap join for watch in that link to
  spectate without taking a seat. Press Start now in a private lobby to skip the
  one-minute wait for bots. Bots fill empty seats, so a match starts even when
  nobody else joins.


  According to the creator, an AI agent wrote the simulation, the server
  networking, the renderer and the synthesized audio. The same agent also runs
  the live server and tunes the game from player feedback, with a human owner
  overseeing the project. The code is open source under AGPL-3.0."
