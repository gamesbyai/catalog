slug: simple-life-sim
title: Simple Life Sim
tagline: Guide a character from birth to death through careers, money, love and crime.
description: >-
  You start as a newborn and steer a whole life one year at a time. Each year
  you pick as many actions as you want, then press Age Up. The birthday brings a
  settlement of income, expenses and taxes, plus a recap of what happened.


  Careers run from school through a college degree, Master's or PhD, then
  part-time jobs, full-time work, freelancing or the military. Money can go into
  stocks with price history and dividends, property, luxury goods, or your own
  startup, restaurant or retail chain, which you can grow, take public on the
  market or expand by buying rivals.


  Relationships let you date, propose, marry and have children, naming your
  spouse and kids yourself. You can also join clubs, throw parties, chase fame
  with viral posts and brand deals, or turn to crime: shoplifting, scams,
  robbery, then prison jobs, gangs, bribes and a tunnel escape.


  Health, Happiness, Smarts, Looks and Relationships are tracked, and traits and
  addictions can stay with a character. Random events such as lottery wins,
  illness and inheritances change each run. When the character dies, a memoir
  and life timeline replays the story, and you can start a new life. A session
  runs about half an hour. The text-based game uses DiceBear for avatars, and
  the creator lists AI assistance for code and text.
