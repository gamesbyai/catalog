slug: sunset-city-the-dark-tower
title: Sunset City - The Dark Tower
tagline: Climb toward the Black Tower while sneaking past guards who watch the city.
description: >-
  Sunset City - The Dark Tower is a climb through a watched city. You scale
  structures on the way to the Black Tower and stay out of the guards' line of
  sight, choosing when to move. Platforming and stealth share this single-player
  3D action-adventure, which also runs on phones.


  The creator describes it as a collection of Three.js concepts gathered over
  time and finally combined into one game, the kind they would have wanted to
  play as a child. Claude Code was the tool, and Vibe Jam 2026 ranked it 8th of
  945.


  The design rests on the idea that a quiet path always exists. The guards' gaze
  is the main threat, so each attempt becomes a route-finding problem solved
  with timing and observation.
