slug: sunset-city-the-dark-tower
title: Sunset City - The Dark Tower
tagline: Climb toward the Black Tower while sneaking past guards who watch the city.
description: >-
  Climb through a watched city toward the Black Tower. On the way you climb
  structures, keep out of the guards' sight, and pick your own moment to move.
  This 3D action-adventure mixes platforming with stealth.


  Guards' gaze as the main threat. Route-finding by timing and observation for
  each attempt. The game is built on the idea that a quiet path always exists.


  did0f describes it as a set of Three.js concepts gathered over time and
  finally combined into one game, the kind they would have wanted to play as a
  child.
