slug: sunset-city-the-dark-tower
title: Sunset City - The Dark Tower
tagline: Climb toward the Black Tower while sneaking past guards who watch the city.
description: >-
  Sunset City - The Dark Tower is a 3D action-adventure with platforming and
  stealth elements. The goal is to reach the Black Tower by climbing through the
  city while staying out of the guards' line of sight. Each attempt is a
  route-finding problem: you scale structures and choose when to move.


  The game leans on the idea that a quiet path always exists. Guards' gaze acts
  as the main threat, so climbing becomes a matter of timing and observation
  rather than speed. It placed 8th out of 945 entries in Vibe Jam 2026, and it
  runs on mobile as well.


  The creator describes it as a collection of Three.js concepts gathered over
  time and finally combined into one game, the kind they would have wanted to
  play as a child. The creator built it with Claude Code.
