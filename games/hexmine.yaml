slug: hexmine
title: HexMine
tagline: Minesweeper on a hex grid, with a safe first click and three board sizes.
description: "In this Minesweeper variant, every tile is a hexagon, and each
  number counts the mines among the six tiles touching it.


  Small, medium and large boards to pick from. An always-safe first click. Blank
  areas unfolding in rolling waves across the board. Every mine revealed on a
  lost board. Game tallies and personal bests. 20 achievements to earn, and a
  firework celebration on a win.


  Open tiles with the pick tool, and mark mines with the flag tool. Hold down a
  tile to place a flag on it.


  According to Kevin MacLeod, an AI model wrote the first version of the game. A
  later technical revision also added a board solver and auto-sweep. The game
  runs off one HTML file and a short solver script. The game is released under
  CC0."
