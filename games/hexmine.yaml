slug: hexmine
title: HexMine
tagline: Minesweeper on a hex grid, with a safe first click and three board sizes.
description: "Every tile in this Minesweeper variant is a hexagon, so each
  number tells you how many of the six touching tiles hold a mine.


  Use the pick tool to open tiles and the flag tool to mark mines. Hold a tile
  to flag it. You can pick a small, medium or large board, and there are
  settings for sound, animations, the timer and the language.


  Your first click is always safe. Blank areas open up in rolling waves.


  Lose a board and the mines are revealed. The game also tallies your games
  played and personal bests, and it has 20 achievements to earn.


  According to the creator, GPT-3 wrote the first version and Claude Opus 5 then
  did a technical revision that added the board solver and auto-sweep. It's
  released as CC0."
