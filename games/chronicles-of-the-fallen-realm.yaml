slug: chronicles-of-the-fallen-realm
title: Chronicles of the Fallen Realm
tagline: Lead a party of heroes through turn-based battles to defeat the Shadow Lord.
description: >-
  Each run sends your Heroes deeper into the Fallen Realm through turn-based
  battles. The path runs through five acts and ends at the Shadow Lord. Losing a
  run is part of the loop: defeat fuels the upgrades you carry into the next
  attempt.


  Nine Hero classes are available, each with unique skills to master. Upgrading
  your Heroes is how you push further on each run. The setting is dark fantasy,
  and the game is tagged as story rich, tactical, and dungeon crawling.


  A session lasts about half an hour. You can play with a mouse, a touchscreen,
  or a gamepad, including Xbox and PlayStation controllers. The title screen
  offers Begin and About buttons, with the name of the current music track shown
  in the top corner.
