slug: chronicles-of-the-fallen-realm
title: Chronicles of the Fallen Realm
tagline: Lead a party of heroes through turn-based battles to defeat the Shadow Lord.
description: >-
  Each run takes your Heroes through five acts of turn-based battles, ending at
  the Shadow Lord. A run that ends in defeat is part of the game's loop. The
  Fallen Realm is a dark fantasy setting, and the game is tagged as story rich,
  tactical, and dungeon crawling.


  Nine Hero classes, each with unique skills to master. Hero upgrades that push
  you further on each run. Upgrades fueled by defeat, kept for the next attempt.


  Play with a mouse, a touchscreen, or a gamepad, including Xbox and PlayStation
  controllers. A session lasts about half an hour.
