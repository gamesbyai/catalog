slug: defense-the-tower
title: Defense The Tower
tagline: Spit balls at incoming enemies to protect your base, growing stronger each run.
description: >-
  Defense The Tower is an action tower defense game where the player guards a
  base by spitting balls at approaching enemies. The pace and setup draw on
  Galaga-style shooting, so the focus is on aiming and holding off waves rather
  than placing many separate turrets.


  Roguelike progression drives the loop. Each run lets the player build up their
  abilities, so the defense changes from one attempt to the next. The mix of
  arcade shooting and tower defense goals gives it a familiar feel with a twist
  on how the base is protected.


  It was entered in Vibe Jam 2026, where it placed 247th out of 945 entries. The
  creator built it with Claude Code, and it runs on the PixiJS rendering
  library.
