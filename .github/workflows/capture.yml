name: capture
# Screenshots for entries added on seed/* and submission/* branches, or whose play URL changed there.
#
# Game pages are untrusted code. They only ever run in the `capture` job, which has no secrets and a read-only token.
# The `upload` job holds the R2 token and must NEVER execute files from the `shots` artifact (or anything else from
# the PR): it checks out the base commit, installs dependencies without install scripts, reads the PNGs as bytes and
# re-encodes them with sharp, and reads the PR's entries with `git show` as data. The PR comment is our own
# contact sheet, with every entry string escaped.
#
# A game whose creator sent screenshots with the submission (provenance.uploads) is never opened in the browser: the
# upload job fetches those images from the site's internal route (NOTIFY_URL's origin, INTERNAL_NOTIFY_TOKEN), holds
# them in memory as untrusted bytes and re-encodes them exactly like captures.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose added or changed entries to capture (compared with main)
        required: true
        type: string
      slugs:
        description: Optional. Re-capture these listed games instead (space-separated slugs, for broken covers)
        required: false
        type: string
      wait:
        description: Optional. Extra seconds before the first frame (0-90), for games that load slowly
        required: false
        type: string
  pull_request:
permissions:
  contents: read
concurrency:
  group: capture-${{ github.event.pull_request.number || inputs.branch }}
  cancel-in-progress: true
jobs:
  capture:
    # A pull_request `branches` filter matches the base branch, so the head branch is checked here instead.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'seed/') || startsWith(github.head_ref, 'submission/')
    runs-on: ubuntu-24.04
    timeout-minutes: 150 # first passes plus throttled retries within the 75-minute budget in captureSlugs
    permissions:
      contents: read
    outputs:
      # Games to capture in the browser, and the space-separated slugs of games whose creator sent screenshots.
      count: ${{ steps.split.outputs.count || '0' }}
      uploads: ${{ steps.split.outputs.uploads }}
      sha: ${{ steps.list.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: List added or changed entries
        id: list
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ONLY: ${{ inputs.slugs }}
        run: |
          if [ -n "$ONLY" ]; then
            # Manual re-capture: plain slugs of entries that exist on this branch, nothing else.
            for s in $ONLY; do
              [[ "$s" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] && [ -f "games/$s.yaml" ] && echo "$s"
            done > "$RUNNER_TEMP/slugs.txt"
          else
            base="${BASE_SHA:-origin/main}"
            fork=$(git merge-base "$base" HEAD)
            # New entries always; a changed entry only when its play URL changed. Text edits keep their screenshots.
            node scripts/changed-play-urls.mjs "$fork" > "$RUNNER_TEMP/changed.txt"
            {
              git diff --name-only --diff-filter=A "$fork" HEAD -- 'games/*.yaml'
              cat "$RUNNER_TEMP/changed.txt"
            } | sed -nE 's#^games/([a-z0-9]+(-[a-z0-9]+)*)\.yaml$#\1#p' > "$RUNNER_TEMP/slugs.txt"
          fi
          echo "count=$(wc -l < "$RUNNER_TEMP/slugs.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/slugs.txt"
      - name: Games whose creator sent screenshots skip the browser
        id: split
        if: steps.list.outputs.count != '0'
        run: |
          node scripts/capture.mjs --split "$RUNNER_TEMP/slugs.txt" > "$RUNNER_TEMP/split.json"
          jq -r '.capture[]' "$RUNNER_TEMP/split.json" > "$RUNNER_TEMP/capture.txt"
          echo "count=$(wc -l < "$RUNNER_TEMP/capture.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "uploads=$(jq -r '.uploads | join(" ")' "$RUNNER_TEMP/split.json")" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/split.json"
      - if: (steps.split.outputs.count || '0') != '0'
        run: npx playwright install --with-deps chromium
      - name: Let Chromium use its sandbox (Ubuntu 24.04 restricts unprivileged user namespaces)
        if: (steps.split.outputs.count || '0') != '0'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Capture
        if: (steps.split.outputs.count || '0') != '0'
        env:
          CAPTURE_WAIT: ${{ inputs.wait }}
        run: xargs -a "$RUNNER_TEMP/capture.txt" node scripts/capture.mjs
      - uses: actions/upload-artifact@v5
        if: (steps.split.outputs.count || '0') != '0'
        with:
          name: shots
          path: out/
          retention-days: 7
          if-no-files-found: error

  upload:
    needs: capture
    # Same-repo branches only: fork PRs never reach the R2 token.
    if: (needs.capture.outputs.count != '0' || needs.capture.outputs.uploads != '') && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The BASE commit, not the PR head: every script in this job comes from main.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          persist-credentials: false
          fetch-depth: 0 # history for the merge base below
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v6
        if: needs.capture.outputs.count != '0' # no artifact when every game came with its creator's screenshots
        with: { name: shots, path: out }
      - name: Fetch the PR's entries as data
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || needs.capture.outputs.sha }}
        run: |
          mkdir -p out
          rm -f out/contact-sheet.md
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "unexpected head sha"; exit 1; }
          git fetch --no-tags origin "$HEAD_SHA"
      - name: Re-encode and upload to R2
        id: upload
        env:
          R2_UPLOAD_TOKEN: ${{ secrets.R2_UPLOAD_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The creator's screenshots come from the site's internal uploads route (the base of the notify URL).
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          INTERNAL_NOTIFY_TOKEN: ${{ secrets.INTERNAL_NOTIFY_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || needs.capture.outputs.sha }}
          ONLY: ${{ inputs.slugs }}
          UPLOADS: ${{ needs.capture.outputs.uploads }}
        # --base-ref (the merge base, as in the capture job): only games this PR adds or changes are uploaded, whatever
        # the artifact holds; changes made only on main never count.
        # A manual re-capture uploads exactly the slugs it was given (validated by upload.mjs).
        # --uploads only narrows the choice: upload.mjs fetches a game's screenshots only when that game passes the same
        # checks and its entry (read from the PR as data) names them.
        run: |
          if [ -n "$ONLY" ]; then node scripts/upload.mjs out/ --entries-ref "$HEAD_SHA" --only "$ONLY" --uploads "$UPLOADS"
          else node scripts/upload.mjs out/ --entries-ref "$HEAD_SHA" --base-ref "$(git merge-base HEAD "$HEAD_SHA")" --uploads "$UPLOADS"; fi
      - name: Post the contact sheet
        if: always() && steps.upload.outcome != 'skipped' && github.event_name == 'pull_request' && hashFiles('out/contact-sheet.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file out/contact-sheet.md
      - name: Contact sheet in the run summary
        if: always() && steps.upload.outcome != 'skipped' && hashFiles('out/contact-sheet.md') != ''
        run: cat out/contact-sheet.md >> "$GITHUB_STEP_SUMMARY"
