name: videos
# Find YouTube videos that link listed game pages, open one review PR, then record the run privately.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      searches:
        description: Maximum title searches for this run (0-90)
        required: false
        default: '5'
        type: number
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: videos
  cancel-in-progress: false
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund > /dev/null 2>&1 || { echo "videos: setup failed"; exit 1; }
      - name: Restore pending report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/artifacts?name=videos-outbox&per_page=100" --jq '[.[] | .artifacts[] | select(.workflow_run.head_repository_id == .workflow_run.repository_id and .workflow_run.head_branch == "main")] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty' 2>/dev/null) || { echo "videos: restore failed"; exit 0; }
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name videos-outbox --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/recovery" > /dev/null 2>&1 || { echo "videos: restore failed"; exit 0; }
          fi
      - name: Recover pending report
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          INTERNAL_VIDEOS_TOKEN: ${{ secrets.INTERNAL_VIDEOS_TOKEN }}
        run: |
          node scripts/videos-post.mjs --recover "$RUNNER_TEMP/recovery/report.enc"
      - name: List the pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 --json number,state,headRefName,isCrossRepository,body,createdAt,closedAt,mergedAt > "$RUNNER_TEMP/prs.json" 2>/dev/null || { echo "videos: PR list failed"; exit 1; }
      - name: Find videos that link game pages
        id: find
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          INTERNAL_VIDEOS_TOKEN: ${{ secrets.INTERNAL_VIDEOS_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          SEARCHES: ${{ inputs.searches }}
        run: node scripts/find-videos.mjs --prs "$RUNNER_TEMP/prs.json" --body "$RUNNER_TEMP/body.md" --report "$RUNNER_TEMP/report.json"
      - uses: actions/create-github-app-token@v2
        if: steps.find.outputs.count != '0'
        id: app
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open the pull request
        if: steps.find.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          day=$(date -u +%F)
          branch="videos/$day-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [ "$(wc -c < "$RUNNER_TEMP/body.md")" -le 60000 ] || { echo "videos: PR body exceeds limit"; exit 1; }
          quiet() { "$@" > /dev/null 2>&1 || { echo "videos: PR step failed"; exit 1; }; }
          quiet git config user.name "gamesbyai-bot[bot]"
          quiet git config user.email "gamesbyai-bot[bot]@users.noreply.github.com"
          quiet git checkout -b "$branch"
          quiet git add games/
          quiet git commit --allow-empty -m "Videos that link game pages ($day)"
          quiet git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          quiet gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "Videos: $day" --body-file "$RUNNER_TEMP/body.md"
          echo "videos: PRs opened 1"
      - name: Seal video discovery report
        if: success()
        env:
          INTERNAL_VIDEOS_TOKEN: ${{ secrets.INTERNAL_VIDEOS_TOKEN }}
        run: node scripts/videos-post.mjs --seal "$RUNNER_TEMP/report.json" "$RUNNER_TEMP/outbox/report.enc"
      - uses: actions/upload-artifact@v4
        with:
          name: videos-outbox
          path: ${{ runner.temp }}/outbox/report.enc
          retention-days: 30
          if-no-files-found: ignore
      - name: Record video discovery report
        if: success()
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          INTERNAL_VIDEOS_TOKEN: ${{ secrets.INTERNAL_VIDEOS_TOKEN }}
        run: node scripts/videos-post.mjs "$RUNNER_TEMP/report.json"
