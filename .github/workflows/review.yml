name: review
# Posts the review card on a submission PR after its capture run. The review tools live in a private repository and
# run from main; nothing from the PR is checked out or executed here.
on:
  workflow_run:
    workflows: [capture]
    types: [completed]
permissions:
  contents: read
jobs:
  card:
    # Same-repository submission branches only: a fork can name a branch submission/* too.
    if: >-
      startsWith(github.event.workflow_run.head_branch, 'submission/') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: review-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with: { ref: main, persist-credentials: false }
      - uses: actions/create-github-app-token@v2
        id: tools
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: gamesbyai
          repositories: gamesbyai-site
          permission-contents: read
      - uses: actions/checkout@v5
        with:
          repository: gamesbyai/gamesbyai-site
          ref: main
          token: ${{ steps.tools.outputs.token }}
          path: tools
          sparse-checkout: review
          persist-credentials: false
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/review
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Post the review card
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          URLSCAN_TOKEN: ${{ secrets.URLSCAN_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CATALOG_DIR: ${{ github.workspace }}
        run: node tools/review/review-card.mjs
