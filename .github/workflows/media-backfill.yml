name: media-backfill
# Adds image sizes introduced after games were captured (scripts/backfill-widths.mjs). Manual; runs only code from main
# and reads screenshots back from our own media host.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: media-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Add the 960 px size to uploaded screenshots
        env:
          R2_UPLOAD_TOKEN: ${{ secrets.R2_UPLOAD_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/backfill-widths.mjs
