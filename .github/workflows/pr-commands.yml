name: pr-commands
# `/drop slug …` on a seed or submission PR removes those games from the branch. Only the catalog owner's comments run
# this, and no code from the PR branch is ever executed: the script comes from main, the branch is only edited with git.
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  drop:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/drop') && github.event.comment.user.login == 'MansGullberg'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v5
        with: { path: tools, persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Check the PR branch
        id: pr
        run: |
          info=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName,isCrossRepository,state)
          ref=$(jq -r .headRefName <<<"$info")
          [ "$(jq -r .isCrossRepository <<<"$info")" = "false" ] || { echo "fork PR, ignored"; exit 1; }
          [ "$(jq -r .state <<<"$info")" = "OPEN" ] || { echo "PR not open"; exit 1; }
          [[ "$ref" =~ ^(seed|submission)/[a-z0-9-]+$ ]] || { echo "not a seed or submission branch"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with: { path: pr, ref: '${{ steps.pr.outputs.ref }}', fetch-depth: 0 }
      - name: Drop games
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          OWNERS: MansGullberg
          REF: ${{ steps.pr.outputs.ref }}
        run: |
          node tools/scripts/pr-commands.mjs pr > remove.txt
          if [ ! -s remove.txt ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Nothing dropped: none of those slugs are in this PR."
            exit 0
          fi
          cd pr
          git config user.name "gamesbyai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs git rm -q < ../remove.txt
          git commit -q -m "Drop $(wc -l < ../remove.txt | tr -d ' ') games on review"
          git push -q origin "HEAD:$REF"
          left=$(git diff --name-only --diff-filter=A "origin/main...HEAD" -- games/ | wc -l | tr -d ' ')
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Dropped $(wc -l < ../remove.txt | tr -d ' '). Games left in this PR: $left."
