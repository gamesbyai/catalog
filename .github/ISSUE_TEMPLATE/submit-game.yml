# Generated by scripts/issue-form.mjs from the taxonomies. Do not edit by hand.
name: Submit a game
description: Add an AI-made game to GamesByAI. An editor plays every submission before it goes live.
title: "Submit: "
labels:
  - submission
body:
  - type: markdown
    attributes:
      value: Everything you enter here is public. Please do not include an email address.
  - type: input
    id: play_url
    attributes:
      label: Play URL
      description: The https link where the game runs in a browser
    validations:
      required: true
  - type: input
    id: repo_url
    attributes:
      label: Repository (optional)
      description: https://github.com/owner/repo
    validations:
      required: false
  - type: input
    id: title
    attributes:
      label: Game title
    validations:
      required: true
  - type: input
    id: creator
    attributes:
      label: Creator name
    validations:
      required: true
  - type: input
    id: handle
    attributes:
      label: Creator handle (optional)
      description: Your usual username, for your creator page
    validations:
      required: false
  - type: dropdown
    id: genres
    attributes:
      label: Genres
      multiple: true
      options:
        - Action
        - Adventure
        - Arcade
        - Card
        - Casual
        - Educational
        - Fighting
        - Horror
        - Idle
        - Platformer
