  - slug: gemini-2-5-pro
    name: Gemini 2.5 Pro
    provider: google
    intro: |-
      Gemini 2.5 Pro's launch post showed it writing a video game's executable code from a single-line prompt.

      Google first released it as an experimental thinking model on March 25, 2025, and it was generally available from June 17, 2025. Google said it excels at visually compelling web apps and agentic code.

      It reads text, images, audio, video and PDFs, writes text, and takes up to 1,048,576 input tokens with a 65,536-token output limit. It launched in Google AI Studio and in the Gemini app for Gemini Advanced users.

      It's been superseded. Since September 18, 2026 Google limits access to the Gemini 2.5 models to users who've used them before, and the docs point new projects to Gemini 3.5 Flash-Lite or Gemini 3.8 Flash. No shutdown date has been announced.
