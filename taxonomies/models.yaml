  - slug: grok-code-fast-1
    name: Grok Code Fast 1
    provider: xai
    intro: |-
      Grok Code Fast 1 was a model from xAI, released on August 28, 2025. xAI described it as a speedy and economical reasoning model that excels at agentic coding, and it targeted languages such as TypeScript, Python, Java, Rust, C++ and Go.

      At launch it was free for a limited time through partners including Cursor, GitHub Copilot, Cline, Roo Code, Kilo Code, opencode and Windsurf, and it was also available through the xAI API.

      It has been retired from the API. xAI's migration notice says grok-code-fast-1 was retired on May 15, 2026, with grok-build-0.1 as the recommended replacement.
    sources:
      - "https://x.ai/news/grok-code-fast-1"
      - "https://docs.x.ai/developers/migration/may-15-retirement"
  - slug: grok-3
    name: Grok 3
    provider: xai
    intro: |-
      Grok 3 was a model from xAI, announced in February 2025. xAI described it as its most advanced model at the time, combining strong reasoning with extensive pretraining knowledge, and it launched to X Premium and Premium+ subscribers on X and grok.com.

      xAI's release notes say the Grok 3 models became generally available through the API in April 2025.

      It has been retired from the API. xAI's migration notice says grok-3 was retired on May 15, 2026, and that requests to it are now served by grok-4.3 with reasoning turned off.
