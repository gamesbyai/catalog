  # OpenAI
  - slug: gpt-6-astra
    name: GPT-6 Astra
    provider: openai
    intro: |-
      In little flock you share a farm and a flock of sheep with other players, and luckily the sheep never die. It was made with Codex on GPT-6 Astra.

      OpenAI released GPT-6 Astra on September 3, 2026, and as of September 2026 it's OpenAI's most capable model. The API docs describe it as built for the hardest end-to-end work, from complex reasoning and coding to computer use, research and document creation. It reads text and images, writes text, and has a 1,050,000-token context window.

      OpenAI rolled it out to ChatGPT Plus, Pro, Business and Enterprise users in ChatGPT Work and Codex, and through the API, Microsoft Azure and Amazon Bedrock. Codex is OpenAI's coding agent for the terminal, IDEs, the ChatGPT desktop app and the cloud, and it has built-in image generation for sprites and other assets.

      The API price is $10 per million input tokens and $50 per million output tokens. GPT-6 Sol and GPT-6 Luna (September 22) and GPT-6.1 Sol (September 29) are the lower-cost models of the same generation.
    sources:
      - "https://developers.openai.com/api/docs/models/gpt-6-astra"
      - "https://developers.openai.com/api/docs/changelog"
      - "https://openai.com/index/gpt-6-astra/"
      - "https://learn.chatgpt.com/docs/models"
      - "https://learn.chatgpt.com/docs/image-generation"
  - slug: gpt-6-sol
    name: GPT-6 Sol
    provider: openai
    intro: |-
      OpenAI trained GPT-6 Sol and GPT-6 Luna with methods similar to GPT-6 Astra's, to bring its strengths to faster, cheaper models, and the API docs describe Sol as built for complex coding and agentic workflows. Both came out on September 22, 2026.

      Sol reads text and images, writes text, and has a 1,050,000-token context window, at $2 per million input tokens and $10 per million output tokens. It launched in the API, in ChatGPT Work and in Codex, OpenAI's coding agent.

      Only a week later, on September 29, 2026, OpenAI released GPT-6.1 Sol at the same input and output prices. As of September 2026 the API docs point to GPT-6.1 Sol as the newer Sol model, and Codex lists GPT-6 Sol under other models.
    sources:
      - "https://developers.openai.com/api/docs/models/gpt-6-sol"
      - "https://developers.openai.com/api/docs/models/gpt-6.1-sol"
      - "https://developers.openai.com/api/docs/changelog"
      - "https://openai.com/index/introducing-gpt-6-sol-and-luna/"
      - "https://learn.chatgpt.com/docs/models"
  - slug: gpt-6-luna
    name: GPT-6 Luna
    provider: openai
    intro: |-
      At $0.10 per million input tokens and $0.50 per million output tokens, GPT-6 Luna is the low-cost member of OpenAI's current lineup as of September 2026, next to GPT-6 Astra and GPT-6.1 Sol.

      The API docs call it OpenAI's most efficient model, for focused, high-volume tasks, and Codex suggests it for summarization, extraction and focused coding. It came out on September 22, 2026 together with GPT-6 Sol.

      It reads text and images, writes text, and has a 1,050,000-token context window. It launched in the API and in ChatGPT Work and Codex on paid plans, and Free and Go users can try it in the ChatGPT desktop app.
