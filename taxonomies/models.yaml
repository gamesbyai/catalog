  # Alibaba
  - slug: qwen-3-8
    name: Qwen3.8
    provider: alibaba
    intro: |-
      Qwen3.8 is a generation of models from Alibaba's Qwen team. Its flagship, Qwen3.8-Max, was announced on August 3, 2026. Alibaba describes it as its most powerful Qwen model, a sparse mixture-of-experts design with 2.4 trillion total parameters, 95 billion active and a context window of up to 1 million tokens.

      Alibaba offers Qwen3.8-Max through the API on Alibaba Cloud Model Studio and in QwenWork, its workplace agent platform. It released open weights for Qwen3.8-2.4T-A95B on August 12, 2026 and for the dense, multimodal Qwen3.8-27B on August 14, 2026.

      Alibaba says the open models are strong at coding, professional work, research and multistep agentic tasks. The Qwen3.8-27B model card lists the Apache 2.0 license.
    sources:
