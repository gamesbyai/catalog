    provider: meta
    intro: |-
      Llama 4 is a family of models from Meta, introduced on April 5, 2025. Meta describes it as natively multimodal, with a mixture-of-experts design. Llama 4 Scout has 17 billion active parameters, 109 billion in total and a 10-million-token context window. Llama 4 Maverick has 17 billion active and 400 billion in total.

