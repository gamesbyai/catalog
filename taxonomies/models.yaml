    name: Gemini 3 Deep Think
    provider: google
    intro: |-
      In Google's own example, Gemini 3 Deep Think turns a sketch into a 3D-printable object, modeling the shape and generating the file for the printer.

      It's a reasoning mode of Google's Gemini models rather than a separate model line. Google introduced it on December 4, 2025 for Google AI Ultra subscribers in the Gemini app, where it uses parallel reasoning to explore several hypotheses at once on hard math, science and logic problems.

      A major upgrade on February 12, 2026 aimed it at science, research and engineering. Ultra subscribers get it in the Gemini app, and select researchers, engineers and enterprises can apply for early access in the Gemini API. As of September 2026 DeepMind's Gemini page lists the mode as Gemini 3.1 Deep Think.
