    name: Gemini 3 Flash
    provider: google
    intro: |-
      Google pitched Gemini 3 Flash for building interactive games and for in-game assistants that need quick answers, and one launch demo gives near real-time help in a hand-tracked ball-launching puzzle game.

      It came out in preview on December 17, 2025, and Google called it frontier intelligence built for speed at a fraction of the cost, saying it outperforms Gemini 2.5 Pro while running three times faster. It became the default model in the Gemini app and AI Mode in Search.

      Developers got it in Google AI Studio, Google Antigravity, Gemini CLI, Android Studio and Vertex AI at $0.50 per million input tokens and $3 per million output tokens.

      As of September 2026 it's been superseded by newer Flash models. The deprecations page names Gemini 3.6 Flash as its replacement, and the API still labels it a preview with no shutdown date.
