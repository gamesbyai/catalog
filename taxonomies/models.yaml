  - slug: gpt-5
    name: GPT-5
    provider: openai
    intro: |-
      DOOMscroll lets you play a Doom-style shooter with nothing but the scroll input, so the title is a pretty good pun. According to its README, it was built with GPT-5.

      OpenAI released GPT-5 on August 7, 2025 together with GPT-5 mini and GPT-5 nano. It's a reasoning model for coding and agentic tasks, with adjustable reasoning effort, text and image input and a 400,000-token context window.

      OpenAI's launch post says it can create websites, apps and games from one prompt, with particular improvements in complex front-end generation. It was the default model in Codex CLI at launch, and OpenAI tuned it for coding tools such as Cursor, Windsurf and GitHub Copilot.

      It's since been superseded, and the API docs now call it OpenAI's previous model and recommend GPT-6 Astra. OpenAI retired GPT-5 from ChatGPT on February 13, 2026, and the gpt-5-2025-08-07 snapshot shuts down in the API on December 11, 2026.
