  # Moonshot AI
  - slug: kimi-k3
    name: Kimi K3
    provider: moonshot
    intro: |-
      Neon Abyss Salvage sends you through seven biomes in a salvage sub, from jellyfish forests to whale falls, and it was made with Kimi K3.

      Moonshot AI announced K3 in July 2026 and calls it the first open 3T-class model. It's a mixture-of-experts model with 2.8 trillion total parameters and 104 billion active, native vision and a 1-million-token context window, built for long-horizon coding, agentic knowledge work and reasoning.

      Moonshot pitches K3 pretty directly at games, too. It says the model turns concepts, images and videos into playable interactive experiences, and that it uses screenshots and visuals to improve game development, front-end work and CAD. It's available on Kimi.ai, in the Kimi apps, in Kimi Work on the desktop, in Kimi Code and through the Kimi API.

      Moonshot published the full weights on Hugging Face under the Kimi K3 License, and as of September 2026 its API docs list K3 as the most capable Kimi model.
    sources:
      - "https://www.kimi.ai/blog/kimi-k3"
      - "https://huggingface.co/moonshotai/Kimi-K3"
      - "https://platform.kimi.ai/docs/models"
