  # xAI
  - slug: grok-4-7
    name: Grok 4.7
    provider: xai
    intro: |-
      Grok 4.7 is a model from xAI, released on September 21, 2026. xAI's documentation calls it a frontier model for coding, agentic tasks and knowledge work, and describes it as the most capable model the company has built.

      It has a 500,000-token context window, accepts text and image input and produces text. Reasoning effort can be set from low to xhigh. It is available through the xAI API as grok-4.7, in Cursor and in Grok Build, and it is the default model in Grok Build. Its knowledge cutoff is May 2026.

      As of September 2026 it is xAI's newest Grok model.
    sources:
