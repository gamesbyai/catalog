  # Alibaba
  - slug: qwen-3-8
    name: Qwen3.8
    provider: alibaba
    intro: |-
      Alibaba lists building interactive games from natural-language requests among Qwen3.8-Max's abilities, and you can try Qwen3.8 for free in Qwen Studio at chat.qwen.ai.

      It's a model generation from Alibaba's Qwen team, and its flagship, Qwen3.8-Max, was announced on August 3, 2026 as Alibaba's largest and most capable model. It's a sparse mixture-of-experts design with 2.4 trillion total parameters, 95 billion active and a context window of up to 1 million tokens.

      Qwen3.8-Max runs in the API on Alibaba Cloud Model Studio and in QwenWork, Alibaba's AI work platform. Open weights followed for Qwen3.8-2.4T-A95B on August 12 and for Qwen3.8-27B on August 14, 2026.

      Qwen3.8-27B is a lot smaller, a dense model that reads text, images and video, with 262,144 tokens of context that can stretch to 1 million, under the Apache 2.0 license. Qwen Code runs the models as a terminal coding agent.
