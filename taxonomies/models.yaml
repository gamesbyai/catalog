    name: Gemini 3 Pro
    provider: google
    intro: |-
      Gemini 3 Pro's launch examples included a retro 3D spaceship game and a playable sci-fi world built with shaders, and Google pitched it for vibe coding richer, more interactive web UIs and apps. It came out on November 18, 2025 as Google's most intelligent model at the time.

      It launched in the Gemini app, AI Mode in Search, Google AI Studio, Vertex AI and Gemini CLI, and in Google Antigravity, the agentic development platform Google introduced the same day.

      It's since been replaced. Google shut down Gemini 3 Pro Preview in the Gemini API on March 9, 2026 and named Gemini 3.1 Pro Preview as the replacement.
