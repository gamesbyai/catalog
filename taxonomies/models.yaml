      The agent launched in early beta on May 25, 2026 for SuperGrok and X Premium+ subscribers, and xAI open-sourced it under Apache 2.0 on July 15, 2026. It runs in a terminal, headless in scripts or inside editors through the Agent Client Protocol, and it supports MCP servers.

