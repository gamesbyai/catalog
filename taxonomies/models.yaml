  - slug: o3
    name: o3
    provider: openai
    intro: |-
      In ChatGPT, o3 and o4-mini were the first reasoning models that could combine every tool, from web search and Python to image generation.

      OpenAI released o3 on April 16, 2025 together with o4-mini, and the API docs call it a well-rounded model that set a new standard for math, science, coding and visual reasoning. Codex CLI, OpenAI's terminal coding agent, launched the same day.

      It has a 200,000-token context window and up to 100,000 output tokens, and o3-pro, released June 10, 2025, spends more compute on hard problems.

      The API docs say GPT-5 succeeded it. OpenAI announced on June 11, 2026 that the o3-2025-04-16 snapshot shuts down on December 11, 2026, with gpt-5.6-sol as the replacement.
