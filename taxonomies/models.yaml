    intro: |-
      At launch, Grok Code Fast 1 was free for a limited time in partner tools including GitHub Copilot, Cursor, Cline, Roo Code, Kilo Code, opencode and Windsurf.

      xAI released it on August 28, 2025 as a speedy and economical reasoning model that excels at agentic coding, aimed at languages such as TypeScript, Python, Java, Rust, C++ and Go. In the xAI API it cost $0.20 per million input tokens and $1.50 per million output tokens.

      It's been retired from the API. Since May 15, 2026, requests to grok-code-fast-1 go to grok-build-0.1, which xAI names as the replacement.
    sources:
      - "https://x.ai/news/grok-code-fast-1"
      - "https://docs.x.ai/developers/migration/may-15-retirement"
  - slug: grok-4
    name: Grok 4
    provider: xai
    intro: |-
      When xAI released Grok 4 on July 9, 2025, it called it the most intelligent model in the world. It came with native tool use and real-time search, and Grok 4 Heavy, a version that uses parallel test-time compute, launched with a new SuperGrok Heavy subscription.

      Grok 4 was available to SuperGrok and Premium+ subscribers in Grok and through the xAI API, with a 256,000-token context window.

      It's been retired from the API. Since May 15, 2026, requests to grok-4-0709 are served by grok-4.3 at low reasoning effort, at grok-4.3 prices.
    sources:
      - "https://x.ai/news/grok-4"
      - "https://docs.x.ai/developers/migration/may-15-retirement"
  - slug: grok-3
    name: Grok 3
    provider: xai
    intro: |-
      Pieter Levels made Flight Simulator 2025, a shared sky where you can dogfight other pilots, with Grok 3, working in the Grok app and Cursor. xAI's own launch post showed Grok 3 writing a Pygame game that mixes Pong and Breakout.

      Grok 3 launched in beta on February 19, 2025, and xAI called it its most advanced model at the time, blending strong reasoning with extensive pretraining knowledge. Its Think mode could reason for seconds to minutes before answering.

      It launched in Grok on X and grok.com for X Premium and Premium+ subscribers, and the Grok 3 models reached the xAI API in April 2025.

      It's been retired from the API. Since May 15, 2026, requests to grok-3 are served by grok-4.3 with reasoning turned off, at grok-4.3 prices.
    sources:
      - "https://x.ai/news/grok-3"
      - "https://docs.x.ai/developers/release-notes"
      - "https://docs.x.ai/developers/migration/may-15-retirement"
