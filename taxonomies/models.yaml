    provider: moonshot
    intro: |-
      Kimi K3 is a model from Moonshot AI, announced on July 16, 2026. It is a mixture-of-experts model with 2.8 trillion total parameters and 104 billion active, native vision and a 1-million-token context window. Moonshot describes it as an open-weight, native multimodal agentic model for long-horizon coding, knowledge work and reasoning.

      It is available in the Kimi mobile apps, in the Kimi Work desktop software, in Kimi Code and through the Kimi API. Moonshot published the weights on Hugging Face under the Kimi K3 License.

