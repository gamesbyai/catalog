  - slug: grok-4
    name: Grok 4
    provider: xai
    intro: |-
      Grok 4 was a model from xAI, released on July 9, 2025. xAI described it as the most intelligent model in the world at that time, with native tool use and real-time search, and it was available to SuperGrok and Premium+ subscribers and through the xAI API.

      It has been retired from the API. xAI's migration notice says the grok-4-0709 model was retired on May 15, 2026, and that requests to it are now served by grok-4.3 at low reasoning effort.
