      - "https://www.alibabacloud.com/blog/alibaba-unveils-qwen3-8-max-its-largest-and-most-capable-flagship-model-to-date_603420"
      - "https://huggingface.co/Qwen/Qwen3.8-27B"
  - slug: qwen3-coder
    name: Qwen3-Coder
    provider: alibaba
    intro: |-
      Qwen3-Coder is a family of coding models from Alibaba's Qwen team, released on July 22, 2025. The flagship, Qwen3-Coder-480B-A35B-Instruct, is a mixture-of-experts model with 480 billion total parameters and 35 billion active. Qwen calls it its most agentic code model to date.

      It supports 262,144 tokens natively, extendable to 1 million, and its model card lists the Apache 2.0 license. Alibaba released an open-source command-line tool, Qwen Code, alongside it, and Qwen's announcement names Claude Code and Cline as compatible tools. It is also offered through Alibaba Cloud Model Studio.

      As of September 2026 Alibaba's newer Qwen3.8 models, released in August 2026, also list coding among their focus areas.
