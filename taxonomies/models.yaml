    name: GPT-5-Codex
    provider: openai
    intro: |-
      OpenAI said that in testing, GPT-5-Codex worked on its own for more than seven hours on large, complex tasks.

      It was a version of GPT-5 that OpenAI optimized for agentic coding in Codex, released September 15, 2025. It became the default for Codex cloud tasks and code review, could be picked for local work in Codex CLI and the IDE extension, and reached developers using an API key on September 23.

      In the API it ran on the Responses API only, with a 400,000-token context window, at $1.25 per million input tokens and $10 per million output tokens.

      Newer Codex-tuned models followed from November 2025 to February 2026, from GPT-5.1-Codex to GPT-5.3-Codex. OpenAI announced its deprecation on April 22, 2026 and shut it down in the API on July 23, 2026, with gpt-5.6-sol as the replacement.
