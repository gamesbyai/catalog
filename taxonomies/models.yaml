      Google published a major upgrade on February 12, 2026, aimed at science, research and engineering. Ultra subscribers get it in the Gemini app, and scientists, engineers and enterprises can apply for early access through the Gemini API.

      As of September 2026 DeepMind's Gemini page lists the upgraded mode as Gemini 3.1 Deep Think.
