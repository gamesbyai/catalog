  # DeepSeek
  - slug: deepseek-v4
    name: DeepSeek V4
    provider: deepseek
    intro: |-
      DeepSeek V4 is DeepSeek's model generation announced on April 24, 2026 as a preview with two models. DeepSeek-V4-Pro has 1.6 trillion total parameters with 49 billion active, and DeepSeek-V4-Flash has 284 billion total with 13 billion active. Both support a 1M-token context, and DeepSeek published their weights on Hugging Face.

      DeepSeek positions V4 for agent capabilities, reasoning and world knowledge. V4-Flash was released in public beta on July 31, 2026, and V4-Pro became generally available on August 13, 2026.

      As of September 2026 DeepSeek-V4-Pro is still offered in the API, while V4-Flash has been retired and replaced by DeepSeek-V4.1-Flash, released on September 10, 2026. DeepSeek-V4.1-Flash followed on September 10, 2026, and older V4 Flash model names now route to it.
    sources:
      - "https://api-docs.deepseek.com/news/news260424"
      - "https://api-docs.deepseek.com/updates"
      - "https://api-docs.deepseek.com/news/news260910"
  - slug: deepseek-v3
    name: DeepSeek-V3
    provider: deepseek
    intro: |-
      DeepSeek-V3 was a DeepSeek model, released on December 26, 2024. It is a mixture-of-experts model with 671 billion total parameters and 37 billion active per token, trained on 14.8 trillion tokens. DeepSeek released it as open source, with the code under the MIT license and the model under its own model license that permits commercial use.

      DeepSeek later updated the same API name several times: V3-0324 on March 24, 2025, V3.1 on August 21, 2025 and V3.2 on December 1, 2025.

      It has been superseded by DeepSeek V4. DeepSeek said in April 2026 that the old deepseek-chat and deepseek-reasoner names would stop working after July 24, 2026.
    sources:
