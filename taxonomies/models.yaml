  - slug: o4-mini
    name: o4-mini
    provider: openai
    intro: |-
      For high-volume work, OpenAI said o4-mini supports much higher usage limits than o3, and the API docs call it a fast, cost-efficient reasoning model that's strong at coding and visual tasks.

      It's a small reasoning model, released April 16, 2025 together with o3, and like o3 it could use every ChatGPT tool, including web search, Python and image generation. It has a 200,000-token context window and up to 100,000 output tokens, at $1.10 per million input tokens and $4.40 per million output tokens.

      The API docs say GPT-5 mini succeeded it. OpenAI retired o4-mini from ChatGPT on February 13, 2026, and the o4-mini-2025-04-16 snapshot shuts down in the API on October 23, 2026, with gpt-5.6-terra as the replacement.
