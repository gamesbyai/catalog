      It came out on August 12, 2026, building on Grok 4.5. It launched in Cursor, in Grok Build and on the xAI API, and through OpenRouter, Vercel and Cloudflare, at $2 per million input tokens and $6 per million output tokens. It reads text and images and has a 500,000-token context window.

      Grok 4.7 followed on September 21, 2026, and as of September 2026 xAI's model docs still list Grok 4.6 in the API.
