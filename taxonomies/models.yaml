  # DeepSeek
  - slug: deepseek-v4
    name: DeepSeek V4
    provider: deepseek
    intro: |-
      DeepSeek said V4 works with coding agents such as Claude Code, OpenClaw and OpenCode, and later updates added the Responses API format so Codex can use it too.

      The generation came out as an open-weight preview on April 24, 2026. DeepSeek-V4-Pro has 1.6 trillion total parameters with 49 billion active, DeepSeek-V4-Flash has 284 billion with 13 billion active, and both handle a 1M-token context. DeepSeek aimed them at agentic work, world knowledge and reasoning.

      V4-Flash entered public beta on July 31, 2026, and V4-Pro became generally available on August 13.

      It's since been replaced. DeepSeek-V4.1-Flash arrived on September 10, 2026 and V4-Flash was retired, and since September 14, requests for deepseek-v4-pro also go to V4.1-Flash until a V4.1-Pro launches.
    sources:
      - "https://api-docs.deepseek.com/news/news260424"
      - "https://api-docs.deepseek.com/updates"
