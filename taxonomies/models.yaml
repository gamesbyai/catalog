  - slug: deepseek-v3
    name: DeepSeek-V3
    provider: deepseek
    intro: |-
      DeepSeek kept upgrading the model behind its deepseek-chat API name for about a year after DeepSeek-V3 came out on December 26, 2024. V3-0324 on March 24, 2025 improved reasoning, web development and function calling, V3.1 on August 21, 2025 added hybrid thinking, and V3.2 followed on December 1, 2025.

      V3 is a mixture-of-experts model with 671 billion total parameters, 37 billion active per token and a 128K-token context, trained on 14.8 trillion tokens. DeepSeek published the code under the MIT license and the weights under its own model license, which allows commercial use.

      It's been superseded by DeepSeek V4, and DeepSeek retired the deepseek-chat and deepseek-reasoner names after July 24, 2026.
    sources:
      - "https://api-docs.deepseek.com/news/news1226"
      - "https://github.com/deepseek-ai/DeepSeek-V3"
      - "https://api-docs.deepseek.com/updates"
      - "https://api-docs.deepseek.com/news/news260424"
  - slug: deepseek-r1
    name: DeepSeek-R1
    provider: deepseek
    intro: |-
      You could call DeepSeek-R1 through the API as deepseek-reasoner or download its open weights, distilled versions included. DeepSeek released the reasoning model on January 20, 2025 under the MIT license, with six smaller distilled models.

      DeepSeek trained it with large-scale reinforcement learning and said it performed on par with OpenAI's o1. It has 671 billion total parameters with 37 billion active, and the API price was $0.55 per million input tokens and $2.19 per million output tokens. DeepSeek upgraded it to R1-0528 on May 28, 2025.

      It's been superseded. DeepSeek moved deepseek-reasoner to V3.1 and V3.2, retired the name after July 24, 2026, and now serves DeepSeek-V4.1-Flash as its current model.
    sources:
      - "https://api-docs.deepseek.com/news/news250120"
