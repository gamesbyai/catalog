  - slug: gemini-3-pro
    name: Gemini 3 Pro
    provider: google
    intro: |-
      Gemini 3 Pro was a model from Google, introduced on November 18, 2025 as its most intelligent model at the time. Google pointed to coding, including generating interactive web interfaces, agentic tasks with multistep planning, and understanding of text, images, video, audio and code.

      It launched in the Gemini app, Google AI Studio, Google Antigravity, Vertex AI and Gemini CLI.

      It has since been replaced. Google shut down Gemini 3 Pro Preview in the Gemini API on March 9, 2026 and named Gemini 3.1 Pro Preview as the replacement.
