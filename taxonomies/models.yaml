    provider: openai
    intro: |-
      GPT-4.1 beat GPT-4o at coding, OpenAI said, including front-end and agentic coding, and the API docs call it the smartest non-reasoning model, strong at instruction following and tool calling.

      It came out in the API on April 14, 2025 with GPT-4.1 mini and GPT-4.1 nano. It reads text and images, writes text, and has a context window of about one million tokens with up to 32,768 output tokens, and the API price is $2 per million input tokens and $8 per million output tokens.

      OpenAI retired GPT-4.1 from ChatGPT on February 13, 2026. As of September 2026 the API still lists it and points to newer models for complex tasks, and GPT-4.1 nano shuts down in the API on October 23, 2026.
