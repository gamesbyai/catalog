      - "https://github.com/deepseek-ai/DeepSeek-V3"
      - "https://api-docs.deepseek.com/updates"
      - "https://api-docs.deepseek.com/news/news260424"
  - slug: deepseek-r1
    name: DeepSeek-R1
    provider: deepseek
    intro: |-
      DeepSeek-R1 was a DeepSeek reasoning model, released on January 20, 2025 and available in the API as deepseek-reasoner. DeepSeek released the model and code under the MIT license, together with smaller distilled versions, and said it performed on par with OpenAI-o1 on math, code and reasoning tasks.

      It has 671 billion total parameters with 37 billion active, and DeepSeek trained it with large-scale reinforcement learning. DeepSeek updated it to R1-0528 on May 28, 2025.

      It has been superseded. DeepSeek moved deepseek-reasoner to V3.1 and then V3.2, and said in April 2026 that the name would stop working after July 24, 2026. DeepSeek V4 is the current generation.
