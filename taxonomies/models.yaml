  - slug: gemini-3-flash
    name: Gemini 3 Flash
    provider: google
    intro: |-
      Gemini 3 Flash is a model from Google, released in preview on December 17, 2025. Google describes it as frontier intelligence built for speed at a fraction of the cost, for everyday tasks and for developer workflows.

      It launched in Google AI Studio, Google Antigravity, Gemini CLI, Android Studio, Vertex AI and Gemini Enterprise, and in the Gemini app and AI Mode in Search.

