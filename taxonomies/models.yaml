      - "https://docs.x.ai/developers/release-notes"
      - "https://docs.x.ai/developers/models"
  - slug: grok-4-5
    name: Grok 4.5
    provider: xai
    intro: |-
      Grok 4.5 is a model from xAI, released on July 16, 2026. xAI introduced it as its smartest model built for coding, agentic tasks and knowledge work at the time.

      It has adjustable reasoning effort, a 500,000-token context window, and access through the xAI API, Grok Build and Cursor. Its documentation says it became available in the API console for EU users in July 2026.

      It has since been followed by Grok 4.6 on August 12, 2026 and Grok 4.7 on September 21, 2026. xAI's model documentation still lists Grok 4.5.
    sources:
      - "https://x.ai/news/grok-4-5"
      - "https://docs.x.ai/developers/release-notes"
      - "https://docs.x.ai/developers/models"
  - slug: grok-build
    name: Grok Build
    provider: xai
    intro: |-
      Grok Build is xAI's coding product. It is a terminal coding agent that launched in early beta in May 2026 for SuperGrok and X Premium+ subscribers. It has an interactive terminal interface, a headless mode for scripts, and support for the Agent Client Protocol. In its documentation it defaults to Grok 4.7.

      xAI also offers a coding model called Grok Build 0.1, released in early access in May 2026 and trained for agentic coding workflows. It has a 256,000-token context window and the API slug grok-build-0.1.

      xAI names Grok Build 0.1 as the replacement for Grok Code Fast 1.
    sources:
      - "https://x.ai/news/grok-build-cli"
      - "https://docs.x.ai/build/overview"
      - "https://docs.x.ai/developers/release-notes"
