# Model versions, each with its provider. Current lineups checked 2026-09-29 (Anthropic, OpenAI, Google, xAI
# release notes and news); older versions are listed because many listed games were built with them.
# Add a version when a catalog entry names one, with the provider's announcement as the source.
terms:
  # Anthropic
  - slug: claude-fable-5-1
    name: Claude Fable 5.1
    provider: anthropic
    intro: |-
      Boom Brigade lets you shoot away the ground itself, bunkers included, and its creator built it with Claude Code on Claude Fable 5.1.

      Fable 5.1 is Anthropic's model for demanding reasoning and long-horizon agentic work, released September 1, 2026. It extends Claude Fable 5 at the same prices, with stronger long-running agentic coding, multistep research, and document, spreadsheet and slide work. Claude Mythos 5.1 has the same capabilities but is open only to Project Glasswing participants.

      Anthropic suggests starting most work on Opus and moving to Fable when results at higher Opus effort still fall short. That makes sense, since it's the slowest and most expensive current Claude model, at $10 per million input tokens and $50 per million output. It reads text and images, writes text, has a 1M-token context window, and is on claude.ai, in Claude Code and through the API and major clouds.

      Canva's head of AI, quoted in the announcement, says it built a rhythm game in Canva Code with real music and on-beat gameplay matched to the level it generated. As of September 2026 it's the newest Fable model, with retirement not sooner than September 1, 2027.
    sources:
      - "https://platform.claude.com/docs/en/models/fable-5-1/overview"
      - "https://www.anthropic.com/claude-fable-and-mythos-5-1"
      - "https://platform.claude.com/docs/en/about-claude/models/overview"
  - slug: claude-fable-5
    name: Claude Fable 5
    provider: anthropic
    intro: |-
      At launch, Anthropic showed Claude Fable 5 playing games. It finished Pokémon FireRed from raw screenshots alone, and it even plays Factorio on its own, building an automated factory.

      It came out on June 9, 2026, and Anthropic introduced it as a Mythos-class model made safe for general use, for software engineering, knowledge work, vision and scientific research. Unlike Claude Mythos 5, which is invitation-only for cyberdefenders, it includes safety classifiers that can decline some requests.

      Anthropic included it on Pro, Max, Team and seat-based Enterprise plans through June 22, 2026 and said later use would need usage credits. It also works in Claude Code and on the API at $10 per million input tokens and $50 per million output tokens.

      As of September 2026 it's a legacy model that's still available, with Claude Fable 5.1 as the current Fable model. Retirement is listed as not sooner than June 9, 2027.
    sources:
      - "https://platform.claude.com/docs/en/models/fable-5/overview"
      - "https://www.anthropic.com/news/claude-fable-5-mythos-5"
  - slug: claude-opus-5-5
    name: Claude Opus 5.5
    provider: anthropic
    intro: |-
      Claude Opus 5.5 designed and built Ombres from a single brief, according to the game's repository, with Brieuc Crosson supervising.

      Opus 5.5 is Anthropic's model for long-running agentic coding and knowledge work, released September 22, 2026 as the first of the Claude 5.5 family. Anthropic says it performs at the level of Claude Fable 5.1 on most work, at $4 per million input tokens and $20 per million output tokens, a bit below Opus 5's $5 and $25.

      For games, it runs in Claude Code, Anthropic's coding agent, and in the Claude apps on paid plans. It's also in GitHub Copilot and Cursor and on the Claude API, Amazon Bedrock, Google Cloud and Microsoft Foundry. It reads text and images and writes text, with a 1M-token context window and adaptive thinking that's always on.

      Anthropic's announcement quotes a tester who had several Claude models build a game from one prompt, and in that test Opus 5.5 scored highest on graphics and polish. As of September 2026 it's the newest Opus model, with retirement not sooner than September 22, 2027.
    sources:
      - "https://platform.claude.com/docs/en/models/opus-5-5/overview"
      - "https://www.anthropic.com/claude-opus-5-5"
      - "https://code.claude.com/docs/en/overview"
      - "https://claude.com/pricing"
  - slug: claude-opus-5
    name: Claude Opus 5
    provider: anthropic
    intro: |-
      The List's Champion puts you behind a knight's visor for a first-person jousting tournament, built with Claude Code on Claude Opus 5.

      Anthropic released Opus 5 on July 24, 2026 and introduced it as a thoughtful and proactive model that comes close to the frontier intelligence of Claude Fable 5 at half the price. A customer quoted in the announcement even called its animations, games and 3D work the best they'd seen from an Opus model.

      It launched on claude.ai, in Claude Code and on the Claude API. It reads text and images, writes text, and has a 1M-token context window, up to 128K tokens of output and adaptive thinking, and the list price is $5 per million input tokens and $25 per million output tokens.

      It led the Opus line until Claude Opus 5.5 arrived on September 22, 2026. As of September 2026 it's a legacy model that's still available, with retirement not sooner than July 24, 2027.
    sources:
      - "https://platform.claude.com/docs/en/models/opus-5/overview"
      - "https://www.anthropic.com/news/claude-opus-5"
  - slug: claude-sonnet-5-5
    name: Claude Sonnet 5.5
    provider: anthropic
    intro: |-
      Rimehold's creator says they left every design decision to Claude and built the mazing tower defense game in Claude Code with Claude Opus 5.5 and Claude Sonnet 5.5.

      Sonnet 5.5 came out on September 28, 2026 as the second model in the Claude 5.5 family, and Anthropic's docs call it the best combination of speed and intelligence. The announcement says it generates output faster than Claude Sonnet 5 and can cost less per task, at the same list price of $2 per million input tokens and $10 per million output tokens.

      Its launch demos are single HTML files, like a murmuration of 400 starlings, wind shaping sand dunes and, for some reason, a clock made of 24 small clocks. It's in the Claude apps, in Claude Code, on the Claude API and on Amazon Bedrock, Google Cloud and Microsoft Foundry, and it reads text and images, writes text, and has a 1M-token context window.

      As of September 2026 it's the newest Sonnet model, with retirement not sooner than September 28, 2027, and in the current lineup only Claude Haiku 4.5 is faster.
    sources:
      - "https://platform.claude.com/docs/en/models/sonnet-5-5/overview"
      - "https://www.anthropic.com/claude-sonnet-5-5"
  - slug: claude-sonnet-5
    name: Claude Sonnet 5
    provider: anthropic
    intro: |-
      Chess3dastra, a full chess game with a computer opponent, was built in a surprisingly quick 41 minutes or so, from a handful of prompts. Claude Sonnet 5 and GPT-6 Astra are the models behind it.

      Sonnet 5 came out on June 30, 2026, and Anthropic built it to be its most agentic Sonnet model at the time, one that can make plans, use tools such as browsers and terminals, and work autonomously. At launch it became the default model for Free and Pro users of the Claude apps.

      It reads text and images, writes text, and has a 1M-token context window and adaptive thinking, and Anthropic says its training data and its reliable knowledge both run to January 2026. It works in Claude Code and through the Claude API, Amazon Bedrock, Google Cloud and Microsoft Foundry, at $2 per million input tokens and $10 per million output tokens.

      As of September 2026 it's a legacy model that's still available, and Anthropic suggests moving to Claude Sonnet 5.5, released September 28, 2026 at the same price. Retirement is listed as not sooner than June 30, 2027.
    sources:
      - "https://platform.claude.com/docs/en/models/sonnet-5/overview"
      - "https://www.anthropic.com/news/claude-sonnet-5"
      - "https://platform.claude.com/docs/en/models/sonnet-5-5/overview"
  - slug: claude-opus-4-8
    name: Claude Opus 4.8
    provider: anthropic
    intro: |-
      Halfway to Mars in Fly To Mars, the hull springs a leak and you have to seal it while the asteroids keep coming. The game was made with a whole stack of AI tools and models, and Claude Opus 4.8 is one of them.

      Anthropic released Opus 4.8 on May 28, 2026 and said it builds on Claude Opus 4.7 with improvements across benchmarks and is a more effective collaborator. The price stayed at $5 per million input tokens and $25 per million output tokens.

      It launched on claude.ai, in Claude Code and on the Claude API, with Amazon Bedrock and Google Cloud among the cloud platforms. It reads text and images, writes text, and has a 1M-token context window, up to 128K tokens of output and adaptive thinking. Anthropic says its training data and its reliable knowledge both run to January 2026.

      As of September 2026 it's a legacy model, followed by Claude Opus 5 on July 24 and Claude Opus 5.5 on September 22. It's still available, with retirement not sooner than May 28, 2027, and Anthropic names it as the replacement for the retired Claude Opus 4 and Opus 4.1.
    sources:
      - "https://platform.claude.com/docs/en/models/opus-4-8/overview"
      - "https://www.anthropic.com/news/claude-opus-4-8"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-opus-4-7
    name: Claude Opus 4.7
    provider: anthropic
    intro: |-
      Claude Opus 4.7 added an xhigh effort level. Its new tokenizer can also turn the same input into roughly 1.0 to 1.35 times as many tokens, so the same prompt can cost up to about a third more at the same price.

      Anthropic released it on April 16, 2026 and pointed to gains on the hardest software engineering tasks, sharper vision for images up to 2,576 pixels on the long edge, and better instruction following and creative output for design work.

      It launched on claude.ai, in Claude Code and on the API, Amazon Bedrock, Google Cloud's Vertex AI and Microsoft Foundry, at $5 per million input tokens and $25 per million output tokens.

      As of September 2026 it's a legacy model, followed by Opus 4.8, 5 and 5.5. It's still available, with retirement not sooner than April 16, 2027.
    sources:
      - "https://platform.claude.com/docs/en/models/opus-4-7/overview"
      - "https://www.anthropic.com/news/claude-opus-4-7"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-opus-4-6
    name: Claude Opus 4.6
    provider: anthropic
    intro: |-
      Hero Nearby sends a developer running down a pixel-art Italian street to fix the neighbors' tech problems, printers included, of course, and its creator made it in GitHub Copilot with Claude Opus 4.6.

      Anthropic released Opus 4.6 on February 5, 2026 as an upgrade to its smartest model, with better coding than Opus 4.5. It brought a 1M-token context window to Opus, in beta at launch, and Anthropic named research, financial analysis and document, spreadsheet and presentation work as other target uses.

      Claude Code gained agent teams alongside it, a research preview in which several agents work in parallel and coordinate on their own. The model launched on claude.ai, the Claude API and major cloud platforms at $5 per million input tokens and $25 per million output tokens, with higher rates for prompts over 200,000 tokens.

      As of September 2026 it's a legacy model, followed by Opus 4.7, 4.8, 5 and 5.5. It's still available, with retirement not sooner than February 5, 2027.
    sources:
      - "https://platform.claude.com/docs/en/models/opus-4-6/overview"
      - "https://www.anthropic.com/news/claude-opus-4-6"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-sonnet-4-6
    name: Claude Sonnet 4.6
    provider: anthropic
    intro: |-
      Aeralis, a multiplayer third-person shooter where you jump, crouch and slide across a glowing blue plain, was made with Claude Sonnet 4.6 and Claude Opus 4.6 in GitHub Copilot.

      Anthropic released Sonnet 4.6 on February 17, 2026 as its most capable Sonnet model at the time and called it a full upgrade across coding, computer use, long-context reasoning, agent planning, knowledge work and design. It said customers found its visual output more polished, with better layouts and animations.

      It actually became the default model for Free and Pro users on claude.ai, too. It was also in Claude Code, on the API and on major cloud platforms at $3 per million input tokens and $15 per million output tokens, and it brought a 1M-token context window, in beta at launch.

      As of September 2026 it's a legacy model, followed by Claude Sonnet 5 and Sonnet 5.5. It's still available, with retirement not sooner than February 17, 2027, and Anthropic names it as the replacement for the retired Claude Sonnet 4, 3.7 Sonnet and 3.5 Sonnet.
    sources:
      - "https://platform.claude.com/docs/en/models/sonnet-4-6/overview"
      - "https://www.anthropic.com/news/claude-sonnet-4-6"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-opus-4-5
    name: Claude Opus 4.5
    provider: anthropic
    intro: |-
      Fly To Mars ends with atmospheric entry, a descent through dust and a touchdown, with Phobos and Deimos showing up on arrival, and Claude Opus 4.5 is one of the models behind the trip.

      Anthropic set Opus 4.5's price at $5 per million input tokens and $25 per million output tokens to bring Opus-level capability to more users. It also called the model, pretty boldly, the best in the world for coding, agents and computer use at the time.

      It came out on November 24, 2025 on claude.ai, in Claude Code, which gained desktop app support at the same time, and on the API and major cloud platforms. Its API model ID is claude-opus-4-5-20251101, and it led the Opus line until Claude Opus 4.6 arrived on February 5, 2026.

      As of September 2026 it's a legacy model that's still available, followed by Opus releases up to Claude Opus 5.5, and retirement is listed as not sooner than November 24, 2026.
    sources:
      - "https://www.anthropic.com/news/claude-opus-4-5"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
      - "https://platform.claude.com/docs/en/about-claude/models/overview"
  - slug: claude-sonnet-4-5
    name: Claude Sonnet 4.5
    provider: anthropic
    intro: |-
      Alongside Claude Sonnet 4.5, Anthropic previewed Imagine with Claude, where Claude generates software in real time as you use it. Claude Code also gained checkpoints for rolling back work and a native VS Code extension at the same time.

      The model came out on September 29, 2025, and Anthropic called it the best coding model in the world and the strongest model for building complex agents at the time, with gains in computer use, reasoning and math. It cost $3 per million input tokens and $15 per million output tokens, unchanged from Sonnet 4.

      It led the Sonnet line until Claude Sonnet 4.6 arrived on February 17, 2026. As of September 2026 it's a legacy model that's still available, and its listed earliest retirement date, September 29, 2026, has passed without a deprecation notice.
    sources:
      - "https://www.anthropic.com/news/claude-sonnet-4-5"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
      - "https://platform.claude.com/docs/en/about-claude/models/overview"
  - slug: claude-haiku-4-5
    name: Claude Haiku 4.5
    provider: anthropic
    intro: |-
      Anthropic made Claude Haiku 4.5 for real-time uses like chat assistants, pair programming and sub-agents that a larger model coordinates. It's the small, fast model, released October 15, 2025, and Anthropic said it gives coding performance similar to Claude Sonnet 4 at a third of the cost and more than twice the speed.

      It launched on the Free Claude plan, in Claude Code and on the API, Amazon Bedrock and Google Cloud's Vertex AI, at $1 per million input tokens and $5 per million output tokens. It has a 200K-token context window and up to 64K tokens of output, smaller limits than the 1M-token models.

      As of September 2026 it's still in Anthropic's current lineup as the fastest Claude model, with retirement not sooner than October 15, 2026.
    sources:
      - "https://www.anthropic.com/news/claude-haiku-4-5"
      - "https://platform.claude.com/docs/en/about-claude/models/overview"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-opus-4-1
    name: Claude Opus 4.1
    provider: anthropic
    intro: |-
      Anthropic retired Claude Opus 4.1 from the Claude API on August 5, 2026, exactly a year after it came out, and it recommends Claude Opus 4.8 as the replacement. The deprecation was announced on June 5, 2026.

      It was released on August 5, 2025 as an upgrade to Claude Opus 4 on agentic tasks, real-world coding and reasoning. It was available to paid Claude users, in Claude Code, and on the API, Amazon Bedrock and Google Cloud's Vertex AI, at the same price as Opus 4.

      Its API model ID was claude-opus-4-1-20250805, and it led the Opus line until Claude Opus 4.5 arrived on November 24, 2025.
    sources:
      - "https://www.anthropic.com/news/claude-opus-4-1"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-opus-4
    name: Claude Opus 4
    provider: anthropic
    intro: |-
      When Anthropic launched Claude Opus 4, its post showed the model writing its own navigation guide as a memory file while playing Pokémon. It came out on May 22, 2025, together with Claude Sonnet 4, and Anthropic called it the world's best coding model at the time, with sustained performance on complex, long-running tasks and agent workflows.

      It was on paid Claude plans and on the API at $15 per million input tokens and $75 per million output tokens. Claude Code became generally available the same day, with VS Code and JetBrains integrations and background tasks through GitHub Actions.

      It's since been retired. Anthropic announced its deprecation on April 14, 2026 and retired it from the Claude API on June 15, 2026, with Claude Opus 4.8 as the recommended replacement.
    sources:
      - "https://www.anthropic.com/news/claude-4"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-sonnet-4
    name: Claude Sonnet 4
    provider: anthropic
    intro: |-
      Claude Code became generally available on the same day Claude Sonnet 4 launched, May 22, 2025, with VS Code and JetBrains integrations that show edits inline. Sonnet 4 arrived together with Claude Opus 4, and Anthropic called it a significant upgrade to Claude Sonnet 3.7, with better coding and reasoning and more precise instruction following.

      It was available to free users of the Claude apps as well as paid plans, and the API price was $3 per million input tokens and $15 per million output tokens. Its API model ID was claude-sonnet-4-20250514.

      It's since been retired. Anthropic announced its deprecation on April 14, 2026 and retired it from the Claude API on June 15, 2026, with Claude Sonnet 4.6 as the recommended replacement.
    sources:
      - "https://www.anthropic.com/news/claude-4"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-3-7-sonnet
    name: Claude 3.7 Sonnet
    provider: anthropic
    intro: |-
      Tomáš Bencko built The Great Taxi Assignment in 60 hours with Cursor and Claude 3.7 Sonnet, and it won the first Vibe Coding Game Jam. About 99 percent of its code was AI generated.

      Claude 3.7 Sonnet came out on February 24, 2025, and Anthropic called it its most intelligent model to date and the first hybrid reasoning model on the market. It could answer almost at once or think step by step, with the thinking shown to the user.

      Anthropic pointed to strong gains in coding and front-end web development. The model was on the Free, Pro, Team and Enterprise plans and on the API, Amazon Bedrock and Google Cloud's Vertex AI, at $3 per million input tokens and $15 per million output tokens. There's a nice bit of history here, too, since Claude Code launched alongside it as a limited research preview for the terminal.

      It's since been retired. Anthropic announced its deprecation on October 28, 2025 and retired it from the Claude API on February 19, 2026, with Claude Sonnet 4.6 as the recommended replacement.
    sources:
      - "https://www.anthropic.com/news/claude-3-7-sonnet"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-3-5-sonnet
    name: Claude 3.5 Sonnet
    provider: anthropic
    intro: |-
      Artifacts, the window beside the chat where Claude shows generated code and documents, launched with Claude 3.5 Sonnet in June 2024, and the model was free on Claude.ai.

      It was the first of the Claude 3.5 family, and Anthropic said it outperformed Claude 3 Opus on a wide range of evaluations at the speed and cost of Claude 3 Sonnet, running at twice the speed of Opus. An upgraded version on October 22, 2024 brought strong gains in agentic coding and tool use, plus a public beta of computer use.

      Both versions have been retired. Anthropic deprecated them on August 13, 2025 and retired them on October 28, 2025, with Claude Sonnet 4.6 as the recommended replacement.
    sources:
      - "https://www.anthropic.com/news/claude-3-5-sonnet"
      - "https://www.anthropic.com/news/3-5-models-and-computer-use"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
