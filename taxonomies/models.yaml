  - slug: grok-4-6
    name: Grok 4.6
    provider: xai
    intro: |-
      Grok 4.6 is a model from xAI, released on August 12, 2026. xAI's announcement says it is built for long-running agents and more ambitious interactive and visual work. Its documentation calls it a frontier model for coding, agentic tasks and knowledge work.

      It has a 500,000-token context window and accepts text and image input. It launched in Cursor, in Grok Build and on the xAI API, and through partners such as OpenRouter, Vercel and Cloudflare.

      It has been followed by Grok 4.7, released on September 21, 2026. xAI's model documentation still lists Grok 4.6.
    sources:
