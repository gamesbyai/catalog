# Model versions, each with its provider. Current lineups checked 2026-09-29 (Anthropic, OpenAI, Google, xAI
# release notes and news); older versions are listed because many listed games were built with them.
# Add a version when a catalog entry names one, with the provider's announcement as the source.
terms:
  # Anthropic
  - slug: claude-fable-5-1
    name: Claude Fable 5.1
    provider: anthropic
    intro: |-
      Claude Fable 5.1 is a model from Anthropic, released on September 1, 2026. Anthropic's documentation describes it as the model for demanding reasoning and long-horizon agentic work, and Anthropic calls it and Claude Mythos 5.1 its most advanced models for coding and knowledge work.

      It extends Claude Fable 5 with stronger long-running agentic coding, multistep research, and document, spreadsheet and slide work. It has a 1M-token context window and is available in Claude Code, on claude.ai and through the Claude API.

      As of September 2026 it is the newest Fable model and is listed as active, with retirement not sooner than September 1, 2027.
    sources:
      - "https://platform.claude.com/docs/en/models/fable-5-1/overview"
      - "https://www.anthropic.com/claude-fable-and-mythos-5-1"
      - "https://platform.claude.com/docs/en/about-claude/models/overview"
  - slug: claude-fable-5
    name: Claude Fable 5
    provider: anthropic
    intro: |-
      Claude Fable 5 is a model from Anthropic, released on June 9, 2026 alongside Claude Mythos 5. Anthropic presented Fable 5 as a model of the Mythos class made safe for general use, aimed at software engineering, knowledge work, vision and scientific research.

      Its documentation notes that Fable 5 includes safety classifiers that can decline some requests. It has a 1M-token context window and adaptive thinking that is always on.

      As of September 2026 it is a legacy model. It is still available, and Anthropic recommends Claude Fable 5.1, released on September 1, 2026, as the current Fable model. Retirement is listed as not sooner than June 9, 2027.
    sources:
      - "https://platform.claude.com/docs/en/models/fable-5/overview"
      - "https://www.anthropic.com/news/claude-fable-5-mythos-5"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-opus-5-5
    name: Claude Opus 5.5
    provider: anthropic
    intro: |-
      Claude Opus 5.5 is a model from Anthropic, released on September 22, 2026. Anthropic's documentation says it is built for long-running agentic coding and knowledge work, and recommends it as the starting point for most workloads.

      Anthropic says it performs at the level of Claude Fable 5.1 on most work. Its list price is $4 per million input tokens and $20 per million output tokens, below Claude Opus 5's $5 and $25. It has a 1M-token context window and is available in Claude Code, on claude.ai and through the Claude API.

      As of September 2026 it is the newest Opus model and is listed as active, with retirement not sooner than September 22, 2027.
    sources:
      - "https://platform.claude.com/docs/en/models/opus-5-5/overview"
      - "https://www.anthropic.com/claude-opus-5-5"
      - "https://www.anthropic.com/news"
  - slug: claude-opus-5
    name: Claude Opus 5
    provider: anthropic
    intro: |-
      Claude Opus 5 is a model from Anthropic, released on July 24, 2026. It was the top Opus model for two months, until Claude Opus 5.5 replaced it on September 22, 2026. Anthropic now lists it as a legacy model: still available, with retirement not sooner than July 24, 2027.

      It has a 1M-token context window, up to 128K tokens of output, and adaptive thinking that decides how much to reason on each request. It reads text and images and writes text. The list price is $5 per million input tokens and $25 per million output tokens.
    sources:
      - "https://platform.claude.com/docs/en/models/opus-5/overview"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-sonnet-5-5
    name: Claude Sonnet 5.5
    provider: anthropic
    intro: |-
      Claude Sonnet 5.5 is a model from Anthropic, released on September 28, 2026. Anthropic's documentation describes it as the best combination of speed and intelligence in the Claude lineup, and its fastest model apart from Haiku 4.5.

      Anthropic says it runs 30% faster than Claude Sonnet 5 and costs up to 30% less for most work. It has a 1M-token context window and is available in Claude Code, on claude.ai and through the Claude API.

      As of September 2026 it is the newest Sonnet model and is listed as active, with retirement not sooner than September 28, 2027.
    sources:
      - "https://platform.claude.com/docs/en/models/sonnet-5-5/overview"
      - "https://www.anthropic.com/claude-sonnet-5-5"
      - "https://www.anthropic.com/news"
  - slug: claude-sonnet-5
    name: Claude Sonnet 5
    provider: anthropic
    intro: |-
      Claude Sonnet 5 is a model from Anthropic, released on June 30, 2026. Anthropic introduced it as its most agentic Sonnet model, meant for tasks that involve planning and tool use.

      It has a 1M-token context window, adaptive thinking and a reliable knowledge cutoff of January 2026, according to Anthropic's documentation.

      As of September 2026 it is a legacy model. It is still available, and Anthropic recommends moving to Claude Sonnet 5.5, released on September 28, 2026. Retirement is listed as not sooner than June 30, 2027.
    sources:
      - "https://platform.claude.com/docs/en/models/sonnet-5/overview"
      - "https://www.anthropic.com/news/claude-sonnet-5"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-opus-4-8
    name: Claude Opus 4.8
    provider: anthropic
    intro: |-
      Claude Opus 4.8 is a model from Anthropic, released on May 28, 2026. Anthropic introduced it as an upgrade to Opus with better coding, agentic reasoning and knowledge work.

      It has a 1M-token context window and adaptive thinking, according to Anthropic's documentation.

      As of September 2026 it is a legacy model, replaced by Claude Opus 5 on July 24, 2026 and Claude Opus 5.5 on September 22, 2026. It is still available, with retirement listed as not sooner than May 28, 2027.
    sources:
      - "https://platform.claude.com/docs/en/models/opus-4-8/overview"
      - "https://www.anthropic.com/news/claude-opus-4-8"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-opus-4-7
    name: Claude Opus 4.7
    provider: anthropic
    intro: |-
      Claude Opus 4.7 is a model from Anthropic, released on April 16, 2026. Anthropic introduced it as a general availability update focused on software engineering, strong on complex coding tasks that previously needed close supervision, with better vision and instruction following.

      Anthropic's announcement says Opus 4.7 uses an updated tokenizer, so the same input can map to roughly 1.0 to 1.35 times as many tokens. It has a 1M-token context window.

      As of September 2026 it is a legacy model, replaced by later Opus releases. It is still available, with retirement listed as not sooner than April 16, 2027.
    sources:
      - "https://platform.claude.com/docs/en/models/opus-4-7/overview"
      - "https://www.anthropic.com/news/claude-opus-4-7"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-opus-4-6
    name: Claude Opus 4.6
    provider: anthropic
    intro: |-
      Claude Opus 4.6 is a model from Anthropic, released on February 5, 2026. Anthropic introduced it as an upgrade to its smartest model, with better coding and agentic performance and a 1M-token context window, in beta at launch. It named coding, research, financial analysis and document creation as target uses.

      As of September 2026 it is a legacy model, replaced by Claude Opus 4.7, 4.8, 5 and 5.5. It is still available, with retirement listed as not sooner than February 5, 2027.
    sources:
      - "https://platform.claude.com/docs/en/models/opus-4-6/overview"
      - "https://www.anthropic.com/news/claude-opus-4-6"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-sonnet-4-6
    name: Claude Sonnet 4.6
    provider: anthropic
    intro: |-
      Claude Sonnet 4.6 is a model from Anthropic, released on February 17, 2026. Anthropic introduced it as its most capable Sonnet model at the time, for coding, computer use, long-context reasoning, agent planning, knowledge work and design, at the same price as its predecessor.

      It has a 1M-token context window, according to Anthropic.

      As of September 2026 it is a legacy model, replaced by Claude Sonnet 5 and Sonnet 5.5. It is still available, with retirement listed as not sooner than February 17, 2027.
    sources:
      - "https://platform.claude.com/docs/en/models/sonnet-4-6/overview"
      - "https://www.anthropic.com/news/claude-sonnet-4-6"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-opus-4-5
    name: Claude Opus 4.5
    provider: anthropic
    intro: |-
      Claude Opus 4.5 is a model from Anthropic, released on November 24, 2025. Anthropic introduced it as a model for coding, agents and computer use that also handles everyday tasks such as research and spreadsheet work.

      Its API model ID is claude-opus-4-5-20251101. It was the current Opus model until Claude Opus 4.6 arrived on February 5, 2026.

      As of September 2026 it is a legacy model, replaced by later Opus releases up to Claude Opus 5.5. It is still available, with retirement listed as not sooner than November 24, 2026.
    sources:
      - "https://www.anthropic.com/news/claude-opus-4-5"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
      - "https://platform.claude.com/docs/en/about-claude/models/overview"
  - slug: claude-sonnet-4-5
    name: Claude Sonnet 4.5
    provider: anthropic
    intro: |-
      Claude Sonnet 4.5 is a model from Anthropic, released on September 29, 2025. Anthropic introduced it as a model for building complex agents and for computer use, and for hard coding, reasoning and math work.

      Its API model ID is claude-sonnet-4-5-20250929. It was the current Sonnet model until Claude Sonnet 4.6 arrived on February 17, 2026.

      As of September 2026 it is a legacy model, replaced by Claude Sonnet 4.6, Sonnet 5 and Sonnet 5.5. Anthropic lists its retirement as not sooner than September 29, 2026.
    sources:
      - "https://www.anthropic.com/news/claude-sonnet-4-5"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
      - "https://platform.claude.com/docs/en/about-claude/models/overview"
  - slug: claude-haiku-4-5
    name: Claude Haiku 4.5
    provider: anthropic
    intro: |-
      Claude Haiku 4.5 is a small model from Anthropic, released on October 15, 2025. Anthropic introduced it for real-time, low-latency uses such as chat assistants, customer service agents and pair programming, and describes its coding quality as near-frontier.

      It has a 200K-token context window, smaller than the 1M tokens of the larger current models.

      As of September 2026 it is still in Anthropic's current lineup as the fastest Claude model, with retirement listed as not sooner than October 15, 2026.
    sources:
      - "https://www.anthropic.com/news/claude-haiku-4-5"
      - "https://platform.claude.com/docs/en/about-claude/models/overview"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-opus-4-1
    name: Claude Opus 4.1
    provider: anthropic
    intro: |-
      Claude Opus 4.1 was a model from Anthropic, released on August 5, 2025. Anthropic introduced it as an upgrade to Opus for agentic tasks, real-world coding and reasoning.

      Its API model ID was claude-opus-4-1-20250805. It was the current Opus model until Claude Opus 4.5 arrived on November 24, 2025.

      It has since been retired: Anthropic announced its deprecation on June 5, 2026, and it was retired from the Claude API on August 5, 2026, with Claude Opus 4.8 as the recommended replacement.
    sources:
      - "https://www.anthropic.com/news/claude-opus-4-1"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-opus-4
    name: Claude Opus 4
    provider: anthropic
    intro: |-
      Claude Opus 4 was a model from Anthropic, released on May 22, 2025 together with Claude Sonnet 4. Anthropic introduced it as a coding model built to sustain performance on complex, long-running tasks. Claude Code became generally available the same day.

      Its API model ID was claude-opus-4-20250514. It has since been retired: Anthropic announced its deprecation on April 14, 2026, and it was retired from the Claude API on June 15, 2026, with Claude Opus 4.8 as the recommended replacement.
    sources:
      - "https://www.anthropic.com/news/claude-4"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-sonnet-4
    name: Claude Sonnet 4
    provider: anthropic
    intro: |-
      Claude Sonnet 4 was a model from Anthropic, released on May 22, 2025 together with Claude Opus 4. Anthropic introduced it as a significant improvement on Claude Sonnet 3.7, with better coding and instruction following. Claude Code became generally available the same day.

      Its API model ID was claude-sonnet-4-20250514. It has since been retired: Anthropic announced its deprecation on April 14, 2026, and it was retired from the Claude API on June 15, 2026, with Claude Sonnet 4.6 as the recommended replacement.
    sources:
      - "https://www.anthropic.com/news/claude-4"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-3-7-sonnet
    name: Claude 3.7 Sonnet
    provider: anthropic
    intro: |-
      Claude 3.7 Sonnet was a model from Anthropic, released on February 24, 2025. Anthropic described it as its first hybrid reasoning model: it can answer at once or think step by step in a visible way. It launched together with Claude Code, then a limited research preview.

      It has since been retired. Anthropic announced its deprecation on October 28, 2025, and it was retired from the Claude API on February 19, 2026, with Claude Sonnet 4.6 as the recommended replacement.
    sources:
      - "https://www.anthropic.com/news/claude-3-7-sonnet"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  - slug: claude-3-5-sonnet
    name: Claude 3.5 Sonnet
    provider: anthropic
    intro: |-
      Claude 3.5 Sonnet was a model from Anthropic, released in June 2024. Anthropic introduced it as the first release in the Claude 3.5 family, at the speed and cost of Claude 3 Sonnet and strong at coding. It launched Artifacts with it, a workspace that shows generated code and documents next to the chat.

      Anthropic released an upgraded version on October 22, 2024, with gains in coding and a public beta of computer use.

      Both versions have been retired. They were deprecated on August 13, 2025 and retired on October 28, 2025, with Claude Sonnet 4.6 as the recommended replacement.
    sources:
      - "https://www.anthropic.com/news/claude-3-5-sonnet"
      - "https://www.anthropic.com/news/3-5-models-and-computer-use"
      - "https://platform.claude.com/docs/en/about-claude/model-deprecations"
  # OpenAI
  - slug: gpt-6-astra
    name: GPT-6 Astra
    provider: openai
    intro: |-
      GPT-6 Astra is OpenAI's most capable model as of September 2026. OpenAI released it on September 3, 2026, and its API documentation describes it as built for the hardest end-to-end work, including complex reasoning, coding, computer use, research and document creation.

      OpenAI's announcement names computer use, browsing, software engineering, cybersecurity, science and professional work as its strengths. It has a 1,050,000-token context window, and OpenAI offers it in ChatGPT, in Codex and through the API.

      GPT-6 Sol and GPT-6 Luna, released on September 22, 2026, are the lower-cost models in the same generation.
    sources:
      - "https://developers.openai.com/api/docs/models/gpt-6-astra"
      - "https://developers.openai.com/api/docs/changelog"
      - "https://community.openai.com/t/introducing-gpt-6-astra-the-most-intelligent-and-aligned-model-in-the-world/1394703"
  - slug: gpt-6-sol
    name: GPT-6 Sol
    provider: openai
    intro: |-
      GPT-6 Sol is a model from OpenAI, released on September 22, 2026 together with GPT-6 Luna. OpenAI's API documentation describes it as built for complex coding and agentic workflows. OpenAI describes Sol and Luna as faster, more affordable models that bring much of GPT-6 Astra's strengths to work at scale.

      It accepts text and image input, produces text, and has a 1,050,000-token context window. OpenAI offers it in ChatGPT, in Codex and through the API.

      As of September 2026 it is part of OpenAI's current GPT-6 lineup, alongside GPT-6 Astra and GPT-6 Luna.
    sources:
      - "https://developers.openai.com/api/docs/models/gpt-6-sol"
      - "https://developers.openai.com/api/docs/changelog"
      - "https://community.openai.com/t/announcing-gpt-6-sol-and-gpt-6-luna-in-the-api-codex-and-chatgpt/1399925"
  - slug: gpt-6-luna
    name: GPT-6 Luna
    provider: openai
    intro: |-
      GPT-6 Luna is a model from OpenAI, released on September 22, 2026 together with GPT-6 Sol. OpenAI's API documentation describes it as its most efficient model, meant for focused, high-volume tasks.

      It accepts text and image input, produces text, and has a 1,050,000-token context window. OpenAI offers it in ChatGPT, in Codex and through the API, and says Free and Go users of ChatGPT can use it in the desktop app.

      As of September 2026 it is part of OpenAI's current GPT-6 lineup, alongside GPT-6 Astra and GPT-6 Sol.
    sources:
      - "https://developers.openai.com/api/docs/models/gpt-6-luna"
      - "https://developers.openai.com/api/docs/changelog"
      - "https://community.openai.com/t/announcing-gpt-6-sol-and-gpt-6-luna-in-the-api-codex-and-chatgpt/1399925"
  - slug: gpt-5-codex
    name: GPT-5-Codex
    provider: openai
    intro: |-
      GPT-5-Codex was a version of GPT-5 that OpenAI optimized for agentic coding in Codex and similar environments. OpenAI released it on September 15, 2025, and its API documentation says it is available through the Responses API only.

      It has a 400,000-token context window. OpenAI's Codex tools run it in the terminal, in an IDE, on the web and in the ChatGPT mobile app.

      It has since been followed by newer Codex-tuned models: GPT-5.1-Codex on November 13, 2025, GPT-5.2-Codex on January 14, 2026 and GPT-5.3-Codex on February 24, 2026. OpenAI announced its deprecation on April 22, 2026 and shut it down in the API on July 23, 2026, with GPT-5.6 Sol as the substitute.
    sources:
      - "https://developers.openai.com/api/docs/models/gpt-5-codex"
      - "https://openai.com/index/introducing-upgrades-to-codex/"
      - "https://developers.openai.com/api/docs/changelog"
      - "https://developers.openai.com/api/docs/deprecations"
  - slug: gpt-5
    name: GPT-5
    provider: openai
    intro: |-
      GPT-5 is a model from OpenAI, released on August 7, 2025 together with GPT-5 mini and GPT-5 nano. OpenAI's API documentation describes it as a reasoning model for coding and agentic tasks, with configurable reasoning effort and a 400,000-token context window.

      It has been superseded. As of September 2026 OpenAI's model page recommends GPT-6 Astra instead. OpenAI announced on June 11, 2026 that the gpt-5-2025-08-07 snapshot will shut down on December 11, 2026, and it retired GPT-5 from ChatGPT on February 13, 2026.
    sources:
      - "https://developers.openai.com/api/docs/models/gpt-5"
      - "https://developers.openai.com/api/docs/deprecations"
      - "https://developers.openai.com/api/docs/changelog"
      - "https://help.openai.com/en/articles/20001051-retiring-gpt-4o-and-other-chatgpt-models"
  - slug: gpt-4-1
    name: GPT-4.1
    provider: openai
    intro: |-
      GPT-4.1 is a model from OpenAI, released on April 14, 2025 in the API together with GPT-4.1 mini and GPT-4.1 nano. OpenAI's documentation describes it as a non-reasoning model that is strong at instruction following and tool calling, with a context window of about one million tokens.

      OpenAI retired GPT-4.1 from ChatGPT on February 13, 2026. As of September 2026 the API documentation still lists it, and recommends starting with GPT-5 for complex tasks. OpenAI's deprecations page lists GPT-4.1 nano for shutdown on October 23, 2026.
    sources:
      - "https://developers.openai.com/api/docs/models/gpt-4.1"
      - "https://developers.openai.com/api/docs/changelog"
      - "https://developers.openai.com/api/docs/deprecations"
      - "https://help.openai.com/en/articles/20001051-retiring-gpt-4o-and-other-chatgpt-models"
  - slug: gpt-4o
    name: GPT-4o
    provider: openai
    intro: |-
      GPT-4o was a flagship model from OpenAI, released on May 13, 2024. OpenAI's changelog introduced it as its fastest and most affordable flagship model at the time. It accepts text and image input, produces text, and has a 128,000-token context window.

      It has been superseded by later GPT models. OpenAI retired GPT-4o from ChatGPT on February 13, 2026, and after April 3, 2026 it was no longer available in any ChatGPT plan. In the API, OpenAI's deprecations page lists the gpt-4o-2024-05-13 snapshot for shutdown on October 23, 2026.
    sources:
      - "https://developers.openai.com/api/docs/models/gpt-4o"
      - "https://developers.openai.com/api/docs/changelog"
      - "https://developers.openai.com/api/docs/deprecations"
      - "https://help.openai.com/en/articles/20001051-retiring-gpt-4o-and-other-chatgpt-models"
  - slug: o3
    name: o3
    provider: openai
    intro: |-
      o3 is a reasoning model from OpenAI, released on April 16, 2025 together with o4-mini. OpenAI's changelog introduced the pair as setting a new standard for math, science and coding, and its documentation describes o3 as a well-rounded model that is strong at math, science, coding and visual reasoning.

      It has a 200,000-token context window, and OpenAI released a version called o3-pro on June 10, 2025 that uses more compute on hard problems. OpenAI's documentation says GPT-5 succeeded it. OpenAI announced on June 11, 2026 that the o3-2025-04-16 snapshot will shut down on December 11, 2026.
    sources:
      - "https://developers.openai.com/api/docs/models/o3"
      - "https://developers.openai.com/api/docs/changelog"
      - "https://developers.openai.com/api/docs/deprecations"
  - slug: o4-mini
    name: o4-mini
    provider: openai
    intro: |-
      o4-mini is a small reasoning model from OpenAI, released on April 16, 2025 together with o3. OpenAI's documentation describes it as a fast, cost-efficient reasoning model that is strong at coding and visual tasks, with a 200,000-token context window and a maximum output of 100,000 tokens.

      It has been superseded by GPT-5 mini and later models. OpenAI retired o4-mini from ChatGPT on February 13, 2026. In the API, its deprecations page lists the o4-mini-2025-04-16 snapshot for shutdown on October 23, 2026.
    sources:
      - "https://developers.openai.com/api/docs/models/o4-mini"
      - "https://developers.openai.com/api/docs/changelog"
      - "https://developers.openai.com/api/docs/deprecations"
      - "https://help.openai.com/en/articles/20001051-retiring-gpt-4o-and-other-chatgpt-models"
  # Google
  - slug: gemini-3-8-flash
    name: Gemini 3.8 Flash
    provider: google
    intro: |-
      Gemini 3.8 Flash is a model from Google, introduced on September 2, 2026. Google calls it its most intelligent Flash model, aimed at software engineering, agentic tasks and multistep reasoning, and its API documentation describes it as built for long-horizon software engineering.

      Google offers it in the Gemini app for Google AI Pro and Ultra subscribers, through the Gemini API in Google AI Studio, in Google Antigravity and Android Studio, and in Gemini Enterprise.

      As of September 2026 it is Google's newest Flash model, and the API documentation recommends it for new projects.
    sources:
      - "https://blog.google/innovation-and-ai/models-and-research/gemini-models/3-8-flash-and-3-8-flash-cyber/"
      - "https://ai.google.dev/gemini-api/docs/models"
      - "https://ai.google.dev/gemini-api/docs/changelog"
  - slug: gemini-3-5-flash-lite
    name: Gemini 3.5 Flash-Lite
    provider: google
    intro: |-
      Gemini 3.5 Flash-Lite is a small model from Google, generally available from July 21, 2026 alongside Gemini 3.6 Flash. Google describes it as the fastest and most cost-effective model in the 3.5 generation, built for low-latency work and for high-throughput tasks such as agentic search and document processing.

      It is offered through the Gemini API in Google AI Studio and Android Studio, and Google said it was rolling out in Google Search.

      As of September 2026 Google's API documentation still lists it as a current model and recommends it, together with Gemini 3.8 Flash, for new projects.
    sources:
      - "https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-6-flash-3-5-flash-lite-3-5-flash-cyber/"
      - "https://ai.google.dev/gemini-api/docs/models"
      - "https://ai.google.dev/gemini-api/docs/deprecations"
  - slug: gemini-3-1-pro
    name: Gemini 3.1 Pro
    provider: google
    intro: |-
      Gemini 3.1 Pro is a model from Google, released in preview on February 19, 2026. Google describes it as designed for tasks where a simple answer is not enough, with stronger reasoning for complex problem-solving.

      It launched in the Gemini app and NotebookLM. Developers got a preview in the Gemini API, Google AI Studio, Google Antigravity, Gemini CLI and Android Studio, and organizations got it in Vertex AI and Gemini Enterprise. It replaced Gemini 3 Pro Preview, which Google shut down on March 9, 2026.

      As of September 2026 the API documentation still labels it a preview model and lists no shutdown date, and DeepMind's Gemini page includes it in the current lineup.
