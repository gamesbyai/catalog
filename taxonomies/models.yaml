  # xAI
  - slug: grok-4-7
    name: Grok 4.7
    provider: xai
    intro: |-
      In Night Drop you fly a drone the size of a cookie through a dark apartment at 3 a.m., trying not to wake the cat, and it was made with the Claude app and Grok 4.7.

      xAI released Grok 4.7 on September 21, 2026 and calls it its most capable model for coding and knowledge work, one that works longer on difficult tasks and checks its own work more carefully. It's actually the default model of Grok Build, xAI's coding agent.

      It's also in Cursor on all plans, in the xAI API as grok-4.7 and on gateways such as OpenRouter, Vercel and Cloudflare. It reads text and images, writes text and has a 500,000-token context window, at $2 per million input tokens and $6 per million output tokens for shorter prompts.

      Reasoning effort runs from low to xhigh, and Grok 4.7 Fast, the same model on faster infrastructure, costs twice as much in Cursor and Grok Build. What it knows runs to May 2026, according to xAI, and as of September 2026 it's xAI's newest Grok model.
