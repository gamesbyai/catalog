    name: GPT-4o
    provider: openai
    intro: |-
      GPT-4o brought image generation into ChatGPT. On March 25, 2025, 4o image generation became the default image generator for Free, Plus, Pro and Team users, and OpenAI pointed to stronger text rendering and closer instruction following.

      OpenAI released it in the API on May 13, 2024 as its fastest and most affordable flagship model at the time. It reads text and images, writes text, and has a 128,000-token context window with up to 16,384 output tokens.

      It's since been superseded. OpenAI retired GPT-4o from ChatGPT on February 13, 2026, and business plans lost it in custom GPTs after April 3. The API still lists it, but the gpt-4o-2024-05-13 snapshot shuts down on October 23, 2026, with gpt-5.6-sol named as the replacement.
