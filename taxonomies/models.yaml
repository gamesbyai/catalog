    provider: google
    intro: |-
      Gemini 2.5 Pro was a model from Google, first released as an experimental version on March 25, 2025 and made generally available on June 17, 2025. Google described it as a thinking model for complex problems, strong at math, science and coding, including web apps and agentic code.

      It has a 1,048,576-token input window and a 65,536-token output limit, according to Google's documentation.

      It has been superseded. On September 18, 2026 Google limited access to the Gemini 2.5 models to users who had already used them. Its documentation recommends Gemini 3.5 Flash-Lite or Gemini 3.8 Flash for new projects. No shutdown date has been announced.
