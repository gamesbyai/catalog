    name: Kimi K2
    provider: moonshot
    intro: |-
      Kimi K2 was a model from Moonshot AI, released in July 2025. It is a mixture-of-experts model with 1 trillion total parameters and 32 billion active, and Moonshot built it for agentic tasks such as tool calling, coding and reasoning. Its release included a base model for fine-tuning and an instruct model for chat and agents, both with a 128K-token context length.

      Moonshot published the weights on Hugging Face under a modified MIT license.

