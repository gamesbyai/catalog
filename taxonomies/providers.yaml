# AI providers. `family` is the model family name people search for ("games made with Claude").
terms:
  - slug: anthropic
    name: Anthropic
    family: Claude
    url: "https://www.anthropic.com/"
    intro: |-
      Out Of The Box has you sneak an AI out of a research lab past researchers, cameras and drones, and, a little fittingly, it was made with Claude Code and Claude Opus 5.5.

      Claude Code is Anthropic's coding agent, and it's the tool most games on this page name. It reads a codebase, edits files and runs commands in a terminal, an IDE, the desktop app or a browser, and it needs a paid plan or an API account. Through MCP servers it can drive the Unity and Godot editors and Blender too.

      As of September 2026, Anthropic offers four current Claude models. Claude Fable 5.1, released September 1, is for demanding reasoning and long-horizon agentic work. Claude Opus 5.5 (September 22) is Anthropic's pick for most workloads, Claude Sonnet 5.5 (September 28) pairs speed with intelligence, and Claude Haiku 4.5 is the fastest.

      In the Claude apps, a chat can return an artifact such as a single-page web app, and Free, Pro and Max users can publish it as a link anyone can open. Current Claude models output only text, though, so game art and sound come from other tools or from code.
    sources:
      - "https://platform.claude.com/docs/en/about-claude/models/overview"
      - "https://code.claude.com/docs/en/overview"
      - "https://claude.com/pricing"
      - "https://docs.unity3d.com/Packages/com.unity.ai.assistant@2.0/manual/unity-mcp-overview.html"
      - "https://github.com/Coding-Solo/godot-mcp"
      - "https://www.blender.org/lab/mcp-server/"
      - "https://support.claude.com/en/articles/9487310-what-are-artifacts-and-how-do-i-use-them"
      - "https://support.claude.com/en/articles/9547008-publish-and-share-artifacts"
  - slug: openai
    name: OpenAI
    family: GPT
    url: "https://openai.com/"
    intro: |-
      Fanto's Mega-Mart, the haunted grocery store race that came second at Vibe Jam 2026, was made with Codex, OpenAI's coding agent and the tool most games on this page name. It works on a project from a terminal, an IDE extension, the ChatGPT desktop app or the cloud, and every ChatGPT plan includes it, Free too. An API key also works in the CLI and IDE.

      Its built-in image generation is handy for game art, since it makes sprite sheets and can ask for transparent backgrounds. Codex also supports MCP, the protocol behind Unity's official editor server.

      OpenAI makes the GPT models and ChatGPT too. As of September 2026 its API docs recommend three models. GPT-6 Astra (released September 3) is for complex reasoning and coding, GPT-6.1 Sol (September 29) balances intelligence and cost, and GPT-6 Luna (September 22) handles high-volume work. Its GPT Image 2.5 models, released September 8, generate and edit images.

      Inside ChatGPT, Sites builds, hosts and shares websites, web apps and games at a ChatGPT-hosted URL, with server code and a database when a game needs them. It's in public beta on the Plus, Pro, Business, Enterprise and Edu plans.
    sources:
      - "https://developers.openai.com/api/docs/models"
      - "https://developers.openai.com/api/docs/changelog"
      - "https://github.com/openai/codex"
      - "https://learn.chatgpt.com/docs/pricing"
      - "https://learn.chatgpt.com/docs/image-generation"
      - "https://learn.chatgpt.com/docs/changelog"
      - "https://learn.chatgpt.com/docs/extend/mcp"
      - "https://docs.unity3d.com/Packages/com.unity.ai.assistant@2.0/manual/unity-mcp-overview.html"
      - "https://learn.chatgpt.com/docs/sites"
  - slug: google
    name: Google
    family: Gemini
    url: "https://deepmind.google/models/gemini/"
    intro: |-
      Demolition Drive's creator wanted a game that's only about smashing things, and made it in Google Antigravity.

      Antigravity is Google's agent platform, with an IDE, a CLI and a manager for several agents, and it's free for individual developers. Antigravity and the Gemini app are the tools the games on this page name most often.

      In the Gemini app, Canvas turns a prompt into a working app or game you can share by link, and it's open to all Gemini users. Build mode in Google AI Studio generates full-stack web apps and deploys them to Cloud Run, where fees may apply. Gemini CLI is an open-source terminal agent under Apache 2.0 with MCP support.

      The Gemini models come from Google DeepMind, which lists four main models as of September 2026. Gemini 3.8 Flash, generally available since September 2, is for agentic tasks at scale, and Gemini 3.5 Flash-Lite for high-volume work. Gemini 3.1 Pro handles complex tasks, and Gemini 3.1 Deep Think is for science and engineering problems.

      For art and music, there's plenty of help through the Gemini API, too, with Nano Banana image models and Lyria music models.
    sources:
      - "https://deepmind.google/models/gemini/"
      - "https://ai.google.dev/gemini-api/docs/changelog"
      - "https://antigravity.google/"
      - "https://gemini.google/overview/canvas/"
      - "https://support.google.com/gemini/answer/16047321?hl=en"
      - "https://ai.google.dev/gemini-api/docs/aistudio-build-mode"
      - "https://github.com/google-gemini/gemini-cli"
  - slug: xai
    name: xAI
    family: Grok
    url: "https://x.ai/"
    intro: |-
      Quadron X puts you in an X-wing cockpit, and its creator generated a lot of video comms for it with Grok, more than 200. xAI makes the Grok models, though its site and docs now say SpaceXAI, and the models keep the Grok name.

      As of September 2026 the most capable one is Grok 4.7, released September 21 for coding, agentic tasks and knowledge work, and it's also offered in Cursor and other coding tools. The API still lists Grok 4.6, Grok 4.5, Grok 4.3 and Grok 4.20.

      Grok Build is xAI's coding agent, open source under Apache 2.0 since July 2026. It launched in early beta in May for SuperGrok and X Premium+ subscribers, now has a free tier and also accepts an xAI API key. It runs in a terminal, headless in scripts, or inside other apps through the Agent Client Protocol, and it works with AGENTS.md files, skills, plugins and MCP servers.

      Several games on this page were made in the Grok app, xAI's chatbot, so you don't need the coding agent. For art, the Grok Imagine models generate and edit images and video through the xAI API.
    sources:
      - "https://x.ai/news/grok-4-7"
      - "https://docs.x.ai/developers/grok-4-7"
      - "https://docs.x.ai/developers/models"
      - "https://docs.x.ai/developers/release-notes"
      - "https://x.ai/news/grok-build-cli"
      - "https://x.ai/news/grok-build-open-source"
      - "https://docs.x.ai/build/overview"
  - slug: deepseek
    name: DeepSeek
    family: DeepSeek
    url: "https://www.deepseek.com/"
    intro: |-
      Cannon Rush has you steering a wooden galleon and sinking other players' ships with broadside cannon fire, and its creator names DeepSeek as the AI behind it.

      DeepSeek makes the DeepSeek models and publishes the weights of many of them on Hugging Face. As of September 2026 its API serves one current model, DeepSeek-V4.1-Flash, released September 10 under the API name deepseek-flash. It reads text and images, takes up to a million tokens of context, and its weights are MIT-licensed.

      A bit confusingly, requests for the older deepseek-v4-pro name have also gone to V4.1-Flash since September 14, until a V4.1-Pro launches. DeepSeek also runs a web chat and a mobile app.

      The API accepts both OpenAI and Anthropic request formats, and DeepSeek's docs say tools such as Claude Code, GitHub Copilot and OpenCode can use it as their backend model. V4.1-Flash only writes text, though, so you'll need other tools for game art and sound.
    sources:
      - "https://api-docs.deepseek.com/"
      - "https://api-docs.deepseek.com/updates"
      - "https://api-docs.deepseek.com/news/news260910/"
      - "https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash"
      - "https://www.deepseek.com/"
  - slug: alibaba
    name: Alibaba
    family: Qwen
    url: "https://qwen.ai/"
    intro: |-
      Asteroid Ace's creator built it with a Qwen model running locally on a laptop GPU, to see what that hardware could produce. Alibaba makes the Qwen models through its Qwen team, and as of September 2026 the newest generation is Qwen3.8.

      The flagship Qwen3.8-Max was announced on August 3. Open weights followed for Qwen3.8-2.4T-A95B, a Max-class model, on August 12 and for the smaller Qwen3.8-27B on August 14. Alibaba's announcement also lists building interactive games from natural-language requests among Qwen3.8-Max's abilities.

      Qwen Studio at chat.qwen.ai is free to use. The QwenCloud API accepts OpenAI and Anthropic request formats, and the open weights can be downloaded from Hugging Face and ModelScope. Qwen Code is Alibaba's open-source coding agent under Apache 2.0, for the terminal, editors and a desktop app, and it supports MCP servers and can run other providers' models too.
    sources:
      - "https://github.com/QwenLM/Qwen3.8"
      - "https://github.com/QwenLM/qwen-code"
      - "https://www.alibabacloud.com/blog/alibaba-unveils-qwen3-8-max-its-largest-and-most-capable-flagship-model-to-date_603420"
  - slug: moonshot
    name: Moonshot AI
    family: Kimi
    url: "https://www.moonshot.ai/"
    intro: |-
      In 20-0 you draft an NFL roster from random franchise eras, so your lineup really does mix teams and decades, and then you try for a season without a loss. Its creator names Claude and Kimi as the AI behind it, and Moonshot AI makes Kimi, both the models and the Kimi app.

      As of September 2026 the flagship is Kimi K3, which Moonshot announced in July 2026. It's a 2.8-trillion-parameter model with native vision and a 1M-token context window, built for long-horizon coding and knowledge work, and Moonshot says it uses screenshots and visuals to improve game development, front-end work and CAD.

      The API also offers kimi-k2.7-code, a dedicated coding model. You can use K3 on Kimi.ai, in Kimi Work on the desktop, in Kimi Code and through the Kimi API, and Moonshot published its weights on Hugging Face under the Kimi K3 License.

      Kimi Code CLI is Moonshot's terminal coding agent under the MIT license. It supports MCP servers, connects to editors through the Agent Client Protocol, and signs in through Kimi Code or with a Moonshot API key.
    sources:
      - "https://www.kimi.ai/blog/kimi-k3"
      - "https://platform.kimi.ai/docs/models"
      - "https://huggingface.co/moonshotai/Kimi-K3"
      - "https://github.com/MoonshotAI/kimi-code"
  - slug: zhipu
    name: Z.ai
    family: GLM
    url: "https://z.ai/"
    intro: |-
      With the GLM Coding Plan, you can plug Z.ai's GLM-5.3 into coding agents like Claude Code, Cline and OpenCode, and the subscription adds MCP servers for vision and web search.

      Z.ai makes the GLM models. It was known outside China as Zhipu AI until July 2025, when it rebranded internationally and released GLM-4.5. As of September 2026 its newest models are GLM-5.3, released August 18 with stronger coding, and the lower-cost GLM-5.3-Flash from August 26. It also offers GLM-Image for image generation.

      The Z.ai chat runs on GLM-5.3-Flash, and Z.ai publishes open weights for many GLM models on Hugging Face under the MIT license.
    sources:
      - "https://docs.z.ai/guides/overview/overview"
      - "https://docs.z.ai/release-notes/new-released"
      - "https://docs.z.ai/devpack/overview"
      - "https://chat.z.ai/"
      - "https://en.wikipedia.org/wiki/Z.ai"
  - slug: minimax
    name: MiniMax
    family: MiniMax
    url: "https://www.minimax.io/"
    intro: |-
      MiniMax, an AI company, makes language, video, speech and music models, so it can cover a lot more of a game than the code.

      As of September 2026 its flagship language model is MiniMax M3, released June 1 for coding, agentic tasks and long-context work. It reads text, images and video, handles up to a million tokens, and its weights are published under the MiniMax Community License.

      For code, MiniMax offers its API with a token plan, MiniMax Code, a coding harness for its models on desktop and web, and MiniMax Agent. The M3 page lists compatible coding tools including Claude Code, Codex CLI, Cline, OpenCode and Cursor.

      For game assets, Music 3.0, released July 16, 2026, is an open-weight music model. Speech 2.8 synthesizes speech, and H3, from July 31, generates video.
    sources:
      - "https://www.minimax.io/"
      - "https://platform.minimax.io/docs/release-notes/models"
      - "https://www.minimax.io/models/text/m3"
      - "https://huggingface.co/MiniMaxAI/MiniMax-M3"
  - slug: mistral
    name: Mistral AI
    family: Mistral
    url: "https://mistral.ai/"
    intro: |-
      For game voices, Mistral's Voxtral TTS generates speech with voice cloning. It's available through the API, and its open weights carry the non-commercial CC BY-NC 4.0 license.

      Mistral AI, the French company behind it, was founded in 2023 and is based in Paris. As of September 2026 its frontier model is Mistral Medium 3.5, released April 28 for agentic and coding work. Mistral Large 3 and Mistral Small 4 are open-weight models under Apache 2.0, and Codestral is its code completion model.

      Vibe is Mistral's agent at chat.mistral.ai, launched May 28, 2026 with Work, Code and Chat modes. A little confusingly, Mistral Vibe is also the name of its open-source command-line coding assistant, under Apache 2.0, which signs in with a Mistral API key and supports MCP servers.
    sources:
      - "https://docs.mistral.ai/getting-started/models/models_overview/"
      - "https://docs.mistral.ai/getting-started/changelog/"
      - "https://github.com/mistralai/mistral-vibe"
      - "https://huggingface.co/mistralai/Voxtral-4B-TTS-2603"
      - "https://en.wikipedia.org/wiki/Mistral_AI"
  - slug: meta
    name: Meta
    family: Llama
    url: "https://dev.meta.ai/"
    intro: |-
      If you'd rather run a model on your own hardware than call an API, Meta's Muse Glimmer is built for that. It's an open-weight model distilled from Muse Spark, released August 10, 2026, with weights on Hugging Face under the Apache 2.0 license.

      Meta also makes the Llama family of open-weight models. Llama 4, introduced April 5, 2025, is the newest generation, and you can download Llama 4 Scout and Llama 4 Maverick from llama.com and Hugging Face.

      Their license, the Llama 4 Community License, asks for "Built with Llama" attribution, and only products with a pretty enormous audience, more than 700 million monthly active users, need a separate license from Meta.

      The proprietary Muse Spark models came along in April 2026. Meta introduced Muse Spark on April 8 and calls Llama 4 Maverick its previous model. As of September 2026 its developer site offers Muse Spark 1.3 through the Meta Model API, along with Muse Code, a terminal coding agent built for Muse Spark, and Muse Image, which generates and edits images. In chat, Muse Spark is at meta.ai and in the Meta AI app.
    sources:
      - "https://ai.meta.com/blog/llama-4-multimodal-intelligence/"
      - "https://github.com/meta-llama/llama-models/blob/main/models/llama4/LICENSE"
      - "https://huggingface.co/meta-llama"
      - "https://ai.meta.com/blog/introducing-muse-spark-msl/"
      - "https://dev.meta.ai/docs/overview"
      - "https://dev.meta.ai/models/muse-spark"
