# AI coding tools, agents, IDEs and app builders. Checked 2026-09-29.
terms:
  # Agents and CLIs
  - slug: claude-code
    name: Claude Code
    maker: Anthropic
    url: "https://claude.com/product/claude-code"
    intro: |-
      Claude Code is Anthropic's coding agent. It reads your codebase, edits files and runs commands, and it works in a terminal, in VS Code and JetBrains, in a desktop app and in the browser, according to Anthropic's documentation.

      For a game, you describe what you want in plain language. Claude Code plans the change, writes code across several files and verifies that it works. It asks permission before it edits files or runs commands. It uses Claude models, with aliases for Opus, Sonnet and Haiku, and it can connect through Amazon Bedrock, Google Cloud or Microsoft Foundry. A CLAUDE.md file in the project root holds standing instructions that Claude Code reads at the start of every session.
    sources:
      - "https://code.claude.com/docs/en/overview"
      - "https://code.claude.com/docs/en/model-config"
      - "https://claude.com/product/claude-code"
  - slug: codex
    name: Codex
    maker: OpenAI
    url: "https://openai.com/codex/"
    intro: |-
      Codex is OpenAI's coding agent. It comes as a command-line tool, an IDE extension, a desktop app and a cloud version at chatgpt.com/codex. The command-line tool is open source under the Apache-2.0 license, and its code is on GitHub.

      The command-line agent runs in your terminal on your own computer, so it works on the files in your project folder. You sign in with a ChatGPT account or use an OpenAI API key. The README lists installs through npm, Homebrew, a shell script, or a PowerShell installer on Windows. The IDE extension works with VS Code, Cursor and Windsurf.
    sources:
      - "https://github.com/openai/codex"
      - "https://github.com/openai/codex/releases"
  - slug: gemini-cli
    name: Gemini CLI
    maker: Google
    url: "https://github.com/google-gemini/gemini-cli"
    intro: |-
      Gemini CLI is Google's open source AI agent for the terminal. Its code is on GitHub under the Apache 2.0 license. It brings Gemini models into the command line, with built-in tools for Google Search grounding, file operations, shell commands and web fetching.

      For a game, you run it in a project folder and let it use those file and shell tools on your project. It supports the Model Context Protocol for custom integrations.

      On May 19, 2026, Google announced Antigravity CLI as the successor. Google said Gemini CLI would stop serving requests for Google AI Pro, Google AI Ultra and free Gemini Code Assist users on June 18, 2026. Google said enterprise customers with Standard or Enterprise licenses or paid API keys are not affected.
    sources:
      - "https://github.com/google-gemini/gemini-cli"
      - "https://developers.googleblog.com/an-important-update-transitioning-gemini-cli-to-antigravity-cli/"
  - slug: jules
    name: Jules
    maker: Google
    url: "https://jules.google/"
    intro: |-
      Jules is an autonomous coding agent from Google. Google Labs built it, and it works on projects hosted on GitHub.

      You connect a GitHub repository and write a prompt. Jules clones the repository into a cloud virtual machine, installs dependencies and drafts a plan for you to approve. It then shows code diffs and opens a pull request. It reads an AGENTS.md file if your repository has one, and it runs on Gemini models. A game therefore needs to live in a GitHub repository first, and the changes come back as pull requests for you to review.
    sources:
      - "https://jules.google/"
      - "https://jules.google/docs"
  - slug: devin
    name: Devin
    maker: Cognition
    url: "https://devin.ai/"
    intro: |-
      Devin is an autonomous AI software engineer made by Cognition. Its documentation says it can write, run and test code.

      Each Devin session runs in its own cloud virtual machine, and Devin tests its work in its own browser. You give it a task through the web app at app.devin.ai, from Slack or Teams, or with the Devin CLI, and it works toward a pull request. Devin connects to GitHub, Jira and Linear. The documentation names bug fixes, feature work, migrations and pull request review as typical jobs.

      As of September 2026, Devin is also the name of a wider product family. Cognition renamed its Windsurf editor to Devin Desktop on June 2, 2026.
    sources:
      - "https://devin.ai/"
      - "https://docs.devin.ai/get-started/devin-intro"
      - "https://docs.devin.ai/desktop/devin-desktop-faq"
  - slug: opencode
    name: OpenCode
    url: "https://opencode.ai/"
    intro: |-
      OpenCode is an open source AI coding agent for the terminal, with a desktop app in beta and IDE extensions. It is released under the MIT license, and the Anomaly organization maintains it on GitHub.

      OpenCode is not tied to one model maker. Its site says it connects to more than 75 providers through Models.dev, including Claude, GPT and Gemini, and it works with local models. It has two built-in agents: build, which has full access for development work, and plan, a read-only agent for analyzing code. For a game, you run it in your project folder and pick the model you want to use.
    sources:
      - "https://opencode.ai/"
      - "https://github.com/anomalyco/opencode"
  - slug: aider
    name: Aider
    url: "https://aider.chat/"
    intro: |-
      Aider is an open source AI pair programming tool that runs in your terminal. It is released under the Apache-2.0 license, and its code is on GitHub.

      Aider builds a map of your whole codebase, edits the files in a local git repository, and commits each change to git with a descriptive message. Its site says it supports more than 100 programming languages and can run linting and tests after a change. It connects to many language models, including Claude, OpenAI models and DeepSeek, and to local models. You can also give it images and web pages as context.
    sources:
      - "https://aider.chat/"
      - "https://github.com/Aider-AI/aider"
  - slug: amp
    name: Amp
    maker: Amp
    url: "https://ampcode.com/"
    intro: |-
      Amp is a coding agent and development environment. It began inside Sourcegraph, and on December 2, 2025, Sourcegraph announced that Amp was becoming an independent company.

      Amp runs on the web at ampcode.com, where work happens in a cloud environment the manual calls an orb. It also has macOS and iOS apps and a command-line tool that runs on your own machine, in your editor's terminal or from scripts. The manual says Amp uses models from several makers and picks them by task instead of relying on a single model.
    sources:
      - "https://ampcode.com/manual"
      - "https://sourcegraph.com/blog/why-sourcegraph-and-amp-are-becoming-independent-companies"
      - "https://ampcode.com/news"
  - slug: qwen-code
    name: Qwen Code
    maker: Alibaba
    url: "https://github.com/QwenLM/qwen-code"
    intro: |-
      Qwen Code is an open source AI coding agent from the Qwen team at Alibaba, licensed under Apache 2.0. It runs in the terminal, and its repository also lists a desktop app, a web UI, editor plugins and chat platforms.

      The project started from Google's Gemini CLI, at version 0.8.2, and has developed independently since its v0.1. It works with Qwen models, with OpenAI, Anthropic and Gemini compatible APIs, and with local models through Ollama or vLLM. For a game, you run it in your project folder. It supports MCP for extra tools. Install options are npm (Node.js 22 or newer), Homebrew and standalone installers.
    sources:
      - "https://github.com/QwenLM/qwen-code"
  - slug: warp
    name: Warp
    url: "https://www.warp.dev/"
    intro: |-
      Warp is an agentic development environment that began as a terminal. The company Warp makes it, and the client code is open source on GitHub under the AGPL v3 license, with an MIT-licensed UI framework.

      It runs on macOS, Linux and Windows. Warp can run its built-in agents or command-line agents you bring yourself. Its GitHub page says agents can triage issues, write specs, implement code changes and review pull requests. Its site says you can bring your own model or harness, and it lists Claude, GPT, Gemini and open-weight models.
    sources:
      - "https://github.com/warpdotdev/warp"
      - "https://www.warp.dev/"
  # Editors and IDEs
  - slug: cursor
    name: Cursor
    maker: Anysphere
    url: "https://cursor.com/"
    intro: |-
      Cursor is an AI coding tool from Anysphere, with a desktop code editor, a command-line tool and cloud agents. Its site also lists Slack and GitHub integrations.

      For a game, you open your project in the Cursor editor and hand tasks to an agent, choosing how much autonomy it gets, from targeted edits to fully autonomous work. Cursor lets you pick between its own models and models from OpenAI, Anthropic and Google.

      SpaceX completed its acquisition of Anysphere on August 14, 2026, according to Cursor's announcement. Cursor said this completed an acquisition process that began in April with its SpaceXAI partnership.
    sources:
      - "https://cursor.com/"
      - "https://cursor.com/blog/joining-spacex"
      - "https://en.wikipedia.org/wiki/Cursor_(code_editor)"
  - slug: github-copilot
    name: GitHub Copilot
    maker: GitHub
    url: "https://github.com/features/copilot"
    intro: |-
      GitHub Copilot is GitHub's AI coding assistant. It runs in Visual Studio Code, Visual Studio, JetBrains IDEs and Neovim, on github.com and GitHub Mobile, and in the command line through GitHub CLI.

      It offers code suggestions as you type, chat, pull request review and an agentic mode that plans steps and edits files to reach a goal. A cloud agent can take an assigned task and work on it by itself. GitHub's documentation lists models from OpenAI, Anthropic, Google, xAI and other makers, and you choose one per task. Copilot has a free plan, and GitHub offers free access to students, teachers and open source maintainers.
    sources:
      - "https://docs.github.com/en/copilot/get-started/what-is-github-copilot"
      - "https://docs.github.com/en/copilot/reference/ai-models/supported-models"
      - "https://github.com/features/copilot"
  - slug: windsurf
    name: Devin Desktop (Windsurf)
    maker: Cognition
    url: "https://devin.ai/desktop"
    intro: |-
      Devin Desktop is Cognition's AI code editor, and it is the new name of Windsurf. Cognition renamed Windsurf to Devin Desktop on June 2, 2026, through an over-the-air update, and windsurf.com now redirects to devin.ai/desktop.

      Devin Desktop keeps the Windsurf editor and adds an Agent Command Center, a Kanban-style view for managing local and cloud agents, plus Spaces for sharing context between agents. Devin Local replaces Cascade as the default local agent. Cognition says plans, pricing, extensions and settings carried over. The editor can also run other agents, including Codex, Claude Agent and OpenCode, through the open Agent Client Protocol.
    sources:
      - "https://devin.ai/blog/windsurf-is-now-devin-desktop"
      - "https://docs.devin.ai/desktop/devin-desktop-faq"
      - "https://devin.ai/desktop"
  - slug: antigravity
    name: Google Antigravity
    maker: Google
    url: "https://antigravity.google/"
    intro: |-
      Google Antigravity is Google's agentic development platform. Google announced it in November 2025, and its site describes an IDE, an Agent Manager for running several agents in parallel, browser agents, a terminal tool and an SDK.

      The Manager surface runs agents that plan, execute and verify tasks across the editor, the terminal and a browser. At launch it supported Gemini 3 Pro, Anthropic's Claude Sonnet 4.5 and OpenAI's GPT-OSS. As of September 2026, Google's site says it is available at no charge for individual developers.

      At Google I/O on May 19, 2026, Google introduced Antigravity 2.0, a desktop app for orchestrating agents in parallel, and Antigravity CLI, which replaces Gemini CLI.
    sources:
      - "https://developers.googleblog.com/build-with-google-antigravity-our-new-agentic-development-platform/"
      - "https://blog.google/innovation-and-ai/technology/developers-tools/google-io-2026-developer-highlights/"
      - "https://antigravity.google/"
  - slug: kiro
    name: Kiro
    maker: Amazon
    url: "https://kiro.dev/"
    intro: |-
      Kiro is an agentic IDE built and operated by Amazon Web Services. It is built on Code OSS, so you can import VS Code settings, themes and Open VSX plugins. AWS introduced it on July 14, 2025.

      Kiro centers on spec-driven development. You give it a prompt, and it turns that into requirements, a design and a sequenced task list before it writes code. Hooks run automations when the agent changes files, and steering keeps project standards in place. Kiro also has a CLI. Its site lists models from Anthropic, OpenAI and open-weight makers such as DeepSeek and Qwen, plus an Auto mode that picks a model by task.
    sources:
      - "https://kiro.dev/"
      - "https://kiro.dev/blog/introducing-kiro/"
      - "https://kiro.dev/docs/"
  - slug: trae
    name: Trae
    maker: ByteDance
    url: "https://www.trae.ai/"
    intro: |-
      Trae is an AI coding tool from ByteDance. Its site lists two products: TraeCode, an AI development tool you download for the desktop, and TraeWork, a work assistant that also has a web version.

      Trae's documentation describes TraeCode as covering coding, project understanding, debugging and running, and change management. It includes several built-in models and lets you add your own models with an API key. Some built-in model series, such as Seed, MiniMax and GLM, are not available to users in the United States. Visual Studio Magazine covered the first release of Trae in January 2025.
    sources:
      - "https://www.trae.ai/"
      - "https://docs.trae.ai/ide/models"
      - "https://visualstudiomagazine.com/articles/2025/01/27/ai-powered-trae-ide-ships.aspx"
  - slug: zed
    name: Zed
    url: "https://zed.dev/"
    intro: |-
      Zed is an open source code editor from Zed Industries, written in Rust. Its GitHub page describes it as coming from the creators of Atom and Tree-sitter, and it runs on macOS, Linux and Windows.

      Zed's AI features include agentic editing, where you delegate a task to an agent and review the changes live, parallel agent threads, an inline assistant and edit prediction from an open source model. Through the Agent Client Protocol it can also host outside agents such as Claude Agent, Codex and OpenCode, and it connects to MCP servers. For a game, you open the project folder in Zed and let an agent work on it.
    sources:
      - "https://zed.dev/"
      - "https://github.com/zed-industries/zed"
  # Editor extensions
  - slug: kilo-code
    name: Kilo Code
    url: "https://kilo.ai/"
    intro: |-
      Kilo Code is an open source AI coding agent for VS Code, JetBrains IDEs and the command line. The code is on GitHub under the MIT license, and Kilo also offers a cloud agent and automated pull request reviews.

      Kilo works with more than 500 models. You can use free models, open-weight models, your own API keys or local models, and you can switch models in the middle of a task. It has specialized agents for code, planning, asking questions and debugging. The Kilo CLI is a fork of OpenCode.

      Anaconda acquired Kilo Code on July 15, 2026, and said Kilo remains available for individual builders, teams and organizations.
    sources:
      - "https://kilo.ai/"
      - "https://github.com/Kilo-Org/kilocode"
      - "https://www.anaconda.com/blog/anaconda-acquires-kilo-code"
  - slug: cline
    name: Cline
    url: "https://cline.bot/"
    intro: |-
      Cline is an open source AI coding agent from Cline Bot Inc., released under the Apache 2.0 license. It runs as a VS Code extension, as JetBrains plugins, as a command-line tool and as a desktop app for macOS and Windows.

      Cline edits multiple files, runs bash commands and plans tasks, and it asks for your approval along the way. It has a Plan-and-Act workflow and supports MCP servers for extra tools. It is not tied to one model maker. Its site lists Anthropic, OpenAI, Google Gemini, AWS Bedrock, Azure, Ollama, DeepSeek, xAI, Mistral and OpenRouter, plus any OpenAI-compatible API.
    sources:
      - "https://cline.bot/"
      - "https://github.com/cline/cline"
  - slug: roo-code
    name: Roo Code
    url: "https://github.com/RooCodeInc/Roo-Code"
    intro: |-
      Roo Code was an open source AI coding agent that ran as a VS Code extension, released under the Apache 2.0 license. Its maintainers shut the extension down on May 15, 2026, and archived the GitHub repository, which is now read-only.

      The repository's notice recommends Cline, or ZooCode, a community fork. The team now makes Roomote, a source-available, self-hosted cloud agent that investigates code, answers repository questions and opens pull requests. As of September 2026, roocode.com redirects to roomote.dev.
    sources:
      - "https://github.com/RooCodeInc/Roo-Code"
      - "https://roomote.dev/"
  - slug: continue
    name: Continue
    url: "https://continue.dev/"
    intro: |-
      Continue is an open source AI coding assistant that has been used in VS Code, in JetBrains IDEs and from the command line. Its site now opens with a notice that Continue was acquired by Cursor.

      The notice says the team's mission was always to amplify developers instead of automating them, and that the open source codebase remains freely available as a foundation for others. Its FAQ now says all user data has been deleted in line with its privacy notice. As of September 2026, that notice is the first thing on continue.dev.
    sources:
      - "https://www.continue.dev/"
      - "https://blog.continue.dev/"
  # Chat apps
  - slug: claude-ai
    name: Claude app
    maker: Anthropic
    url: "https://claude.ai/"
    intro: |-
      The Claude app is Anthropic's chat assistant. It is available on the web at claude.ai, as desktop apps for macOS and Windows, and as mobile apps for iOS and Android.

      For games, the feature to know is artifacts, which Anthropic introduced on June 21, 2024. Claude shows generated code, documents or website designs in a side panel, and it renders HTML and React live there, so a small browser game can be played in the panel and changed by chatting. Artifacts start private, and published artifacts get a shareable link. The desktop app also has a Code tab that includes Claude Code.
    sources:
      - "https://support.claude.com/en/articles/9487310-what-are-artifacts-and-how-do-i-use-them"
      - "https://www.anthropic.com/news/claude-3-5-sonnet"
      - "https://code.claude.com/docs/en/overview"
  - slug: chatgpt
    name: ChatGPT
    maker: OpenAI
    url: "https://chatgpt.com/"
    intro: |-
      ChatGPT is OpenAI's chat assistant. OpenAI released it on November 30, 2022, as a free research preview.

      For code, OpenAI's help center says ChatGPT can show a preview of HTML pages and React components in a sandbox inside the chat, and it can run supported Python and show the console output. OpenAI notes that previews may fail when a page needs network access or external packages. Codex, OpenAI's coding agent, is also available from ChatGPT, with a cloud version at chatgpt.com/codex.
    sources:
      - "https://openai.com/index/chatgpt/"
      - "https://help.openai.com/en/articles/9930697"
      - "https://help.openai.com/en/articles/20001246-working-with-writing-blocks-and-code-blocks-in-chatgpt"
      - "https://github.com/openai/codex"
  - slug: gemini-app
    name: Gemini app
    maker: Google
    url: "https://gemini.google.com/"
    intro: |-
      The Gemini app is Google's AI assistant, built on its Gemini models. You can use it to write, summarize, brainstorm, generate images and get coding help.

      For games, the relevant feature is Canvas. Google says Canvas lets you write, code and create in one place, turning ideas into working apps, games, quizzes and web pages from text prompts. You can preview what it builds, share it through a link, and refine the project with real-time feedback. Canvas is available to all Gemini users, and Google AI Pro and Ultra subscribers get more advanced models and a larger context window.
    sources:
      - "https://gemini.google/overview/canvas/"
      - "https://gemini.google/overview/"
  - slug: grok-app
    name: Grok app
    maker: SpaceXAI
    url: "https://grok.com/"
    intro: |-
      The Grok app is the AI assistant made by xAI, the company behind the Grok family of models. SpaceX acquired xAI on February 2, 2026, and the company has since rebranded as SpaceXAI. Its site now reads SpaceXAI, creators of Grok.

      The app is a chat interface at grok.com. For building on your own computer, SpaceXAI has a separate tool, Grok Build, a coding agent that runs in a full-screen terminal interface, headlessly for scripts, or inside other editors through the Agent Client Protocol. SpaceXAI's documentation lists grok-4.7 as the coding model that powers Grok Build.
    sources:
      - "https://docs.x.ai/build/overview"
      - "https://docs.x.ai/overview"
      - "https://x.ai/"
      - "https://en.wikipedia.org/wiki/SpaceXAI"
  # App and game builders
  - slug: google-ai-studio
    name: Google AI Studio
    maker: Google
    url: "https://aistudio.google.com/"
    intro: |-
      Google AI Studio is Google's browser-based workspace for building with Gemini models, and it includes a Build mode that turns a prompt into an app.

      In Build mode you describe an app, and Gemini generates the code and files with a live preview beside them. You refine it by chatting or by editing code directly. Google's documentation lists two-way GitHub sync, deployment to Cloud Run and a ZIP download. Build mode can create web or Android apps, and it supports a full-stack Node.js runtime and Firebase.

      At Google I/O on May 19, 2026, Google added project export to Antigravity with full context, and publishing of Android apps to the test track in Google Play Console.
    sources:
      - "https://ai.google.dev/gemini-api/docs/aistudio-build-mode"
      - "https://blog.google/innovation-and-ai/technology/developers-tools/google-io-2026-developer-highlights/"
  - slug: firebase-studio
    name: Firebase Studio
    maker: Google
    url: "https://firebase.studio/"
    intro: |-
      Firebase Studio was Google's browser-based workspace for building full-stack apps with AI and Firebase services. Google describes it as a preview to explore AI-driven, full-stack development.

      Google announced the sunset on March 19, 2026. New workspaces and sign-ups were disabled on June 22, 2026, and Firebase Studio shuts down on March 22, 2027, when remaining data is permanently deleted. Google points users to Google AI Studio for prompt-to-app work on the web, or to Google Antigravity for code-first work. Core Firebase services such as Firestore, Authentication and App Hosting are not affected.
    sources:
      - "https://firebase.google.com/docs/studio/migrating-project"
  - slug: replit
    name: Replit
    url: "https://replit.com/"
    intro: |-
      Replit is an online platform from Replit, Inc. for building apps and websites with AI. Its site describes an Agent that builds from a plain-language description, and its documentation lists Chat, Build and Design as the main parts.

      You describe what you want, and the Agent writes the code. Replit provides authentication, databases, hosting and monitoring, and you publish the result from the same place. The documentation says the Build area has a code editor with live preview. Replit runs in a web browser, on desktop for macOS and Windows, and on mobile for iOS and Android. It has a free mode.
    sources:
      - "https://replit.com/"
      - "https://docs.replit.com/"
  - slug: lovable
    name: Lovable
    url: "https://lovable.dev/"
    intro: |-
      Lovable is a full-stack AI development platform where you build web apps by chatting with an AI. According to its documentation, it generates the frontend, backend, database and authentication from your description.

      The documented workflow is to chat, preview the app inside Lovable, publish it to a live URL, and sync the code to GitHub, GitLab or Bitbucket. Lovable connects to Supabase and other services for data. Plans are credit-based, and there is a free tier. Its output is web apps, so a game made there runs in the browser.
    sources:
      - "https://docs.lovable.dev/introduction/welcome"
  - slug: bolt
    name: Bolt
    maker: StackBlitz
    url: "https://bolt.new/"
    intro: |-
      Bolt, at bolt.new, is an AI tool from StackBlitz that builds websites and apps from a chat. Its help center says it makes marketing sites, portfolios, online stores, dashboards, internal tools and presentations.

      You describe an idea in a prompt and watch a live preview as the project is built. Plan Mode lets you discuss an idea before Bolt generates code. Bolt Cloud provides a database, hosting with custom domains and publishing to a live site, and projects connect to GitHub. Bolt's site says it routes work to suitable AI models by task.
    sources:
      - "https://bolt.new/"
      - "https://support.bolt.new/"
  - slug: v0
    name: v0
    maker: Vercel
    url: "https://v0.app/"
    intro: |-
      v0 is Vercel's AI agent platform for building web apps from plain-language prompts. Vercel makes and runs it.

      You describe an idea, and v0 generates a user interface and backend code, with a live preview as it builds. It supports modern web stacks such as Next.js, Tailwind CSS and shadcn/ui. It can fix errors it finds, deploy with one click to Vercel's infrastructure, and open pull requests for review. Vercel's homepage for v0 does not name the AI models behind it.
    sources:
      - "https://v0.app/"
  - slug: rosebud
    name: Rosebud AI
    url: "https://rosebud.ai/"
    intro: |-
      Rosebud AI is a browser-based game maker from Rosebud AI, Inc. You describe a game in plain English, and Rosebud generates the code along with art and sound.

      Games are built on Three.js, so they run as WebGL in the browser, and the JavaScript is editable. Rosebud covers 2D games, 3D worlds and voxel styles, and its site lists asset tools such as a sprite sheet generator and PixelVibe. You can playtest in the browser, iterate through chat and publish with one click. Windows desktop export is available. There is a free tier, and the site does not name the AI models behind it.
    sources:
      - "https://rosebud.ai/ai-game-creator"
      - "https://rosebud.ai/"
  - slug: websim
    name: WebSim
    url: "https://websim.com/"
    intro: |-
      WebSim is a website where people create games and apps in the browser and share them. Its homepage says you can create games and apps for free.

      Projects run in the browser, so other visitors can play them from the site. Visitors can comment on and rate projects, and the homepage highlights hot and trending projects, from games to simulators and interactive tools. WebSim has community channels on Discord, Reddit and X. The homepage carries a 2026 copyright for websim and does not name a company behind it.
    sources:
      - "https://websim.com/"
