terms:
  - slug: vibe-jam-2025
    name: 2025 Vibe Coding Game Jam
    maker: Pieter Levels
    url: "https://vibejam.com/2025/"
    intro: |-
      The 2025 Vibe Coding Game Jam, called Bolt Vibe Coding Game Jam 2025 on its official page, was the first edition of Pieter Levels' online jam for AI-made web games. Bolt.new, CodeRabbit and Lambda sponsored it, and Andrej Karpathy, Tim Soret, Mr. Doob, S13K and Levels judged it.

      The rules required at least 80 percent of each game to be written by AI, code and assets included. Games had to be instantly playable on the web with no logins, signups or loading screens, free to play and hosted on their own domain or subdomain. Each had to carry a snippet of code from the submit form that marked it as an entry, and any engine was allowed, with Three.js recommended.

      Levels announced the results on April 23, 2025. Over a thousand games were submitted, and The Great Taxi Assignment, Vibeware and Vector Tango won $10,000, $5,000 and $2,500. The jam's page is archived at vibejam.com/2025.
    sources:
      - "https://vibejam.com/2025/"
      - "https://levels.io/winners-of-the-2025-vibe-code-game-jam"
      - "https://vibejam.com/2026/press"
  - slug: vibe-jam-2026
    name: 2026 Vibe Coding Game Jam
    maker: Pieter Levels
    url: "https://vibejam.com/2026/"
    intro: |-
      The 2026 Vibe Coding Game Jam, officially Cursor Vibe Jam 2026, was the second edition of Pieter Levels' jam for AI-made web games. It opened on April 1, 2026 and closed for submissions on May 1, 2026 at 13:37 UTC. Cursor was the diamond sponsor, with Bolt.new, Glif and Tripo3D also sponsoring.

      At least 90 percent of the code had to be written by AI, and only new games made during the jam counted, one entry per person. Games had to be free on the web with no login or signup and load almost instantly, and each had to include the jam's widget script or be disqualified. Any engine was allowed and Three.js recommended, and multiplayer was preferred but optional.

      Prizes were $25,000, $10,000 and $5,000, plus 12 special prizes of $1,000 each. Levels' results post on June 17, 2026 names A Game About Capybaras Delivering Food, Fanto's Mega-Mart and WenWare as the top three, and all entries are playable at vibej.am.
    sources:
      - "https://vibejam.com/2026/"
      - "https://vibejam.com/2026/press"
      - "https://levels.io/vibe-jam-2026-winners-quality"
  - slug: ai-browser-game-jam-1
    name: AI Browser Game Jam 1
    maker: Focaccai
    url: "https://itch.io/jam/ai-browser-game-jam"
    intro: |-
      AI Browser Game Jam 1 was Focaccai's first itch.io jam for AI-assisted browser games. Its submission window ran from February 20 to March 10, 2026, after a deadline extension. The theme was Ghost in the Machine.

      Entries had to be free and playable in a web browser using HTML5, with 50 percent or more AI-generated. AI could be used for code, art, design, music, sound or voice, with human editing and refinement welcome. Entrants needed the right to distribute their work, had to credit third-party assets and tools, and could not submit hateful, harassing or malicious content.

      Its results page reports 29 submissions, and the public rankings list 25 games. Rogue Memory and 6-bit Vanguard (Star Overlord 4.0) tied for first overall, and Link State ranked third.
    sources:
      - "https://itch.io/jam/ai-browser-game-jam"
      - "https://itch.io/jam/ai-browser-game-jam/results"
      - "https://itch.io/jam/ai-browser-game-jam/results?page=2"
  - slug: ai-browser-game-jam-2
    name: AI Browser Game Jam 2
    maker: Focaccai
    url: "https://itch.io/jam/ai-game-jam-2"
    intro: |-
      AI Browser Game Jam 2 was the second edition of Focaccai's itch.io jam for AI-assisted browser games. Submissions opened on April 11, 2026 and closed on April 30, 2026. Its Alien theme was a suggestion that entrants could interpret freely or ignore.

      Games had to be free and playable in a web browser using HTML5, with 50 percent or more AI-generated. AI could contribute code, art, design, music or sound, and human editing and refinement were welcome. Solo developers and teams could enter. Entrants needed distribution rights, had to credit third-party assets and tools, and could not submit hateful, harassing or malicious content.

      Its results page reports 42 submissions, and the public rankings list 38 games. Alien Escape Pinball ranked first overall, Alien Orbital Assault second and Realmward Tower Defense third.
    sources:
      - "https://itch.io/jam/ai-game-jam-2"
      - "https://itch.io/jam/ai-game-jam-2/results"
      - "https://itch.io/jam/ai-game-jam-2/results?page=2"
  - slug: ai-browser-game-jam-3
    name: AI Browser Game Jam 3
    maker: Focaccai
    url: "https://itch.io/jam/ai-game-jam-3"
    intro: |-
      AI Browser Game Jam 3 was the third edition of Focaccai's itch.io jam for AI-assisted browser games. Its submission window ran from June 6 to June 24, 2026. The Familiar theme was optional, and entrants could interpret it freely or ignore it.

      Entries had to be free and playable in a web browser using HTML5, with 50 percent or more AI-generated. AI could be used for code, art, design, music or sound, alongside human editing and refinement. Solo developers and teams were welcome. Entrants needed distribution rights, had to credit third-party assets and tools, and could not submit hateful, harassing or malicious content.

      Its results page reports 77 submissions, and the public rankings list 71 games. Pyramid Wars Demo ranked first overall, A Low Poly Dungeon Game second and Snow Bunny third.
    sources:
