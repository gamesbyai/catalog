terms:
  - slug: vibe-jam-2025
    name: 2025 Vibe Coding Game Jam
    maker: Pieter Levels
    url: "https://vibejam.com/2025/"
    intro: |-
      For a first edition, the Vibe Coding Game Jam pulled in a lot of games, more than a thousand, and each one had to be at least 80 percent written by AI, code and assets included. Its official page calls it Bolt Vibe Coding Game Jam 2025, and it was the start of Pieter Levels' online jam for AI-made web games.

      Games had to be instantly playable on the web with no logins, signups or loading screens, free to play and hosted on their own domain or subdomain. Each one also had to carry a snippet of code from the submit form that marked it as an entry. It didn't matter which engine you used, though Three.js was recommended.

      Bolt.new, CodeRabbit and Lambda sponsored it, and Levels judged it himself, along with Andrej Karpathy, Tim Soret, Mr. Doob and S13K. He announced the results on April 23, 2025, and the jam's page is archived at vibejam.com/2025.

      The Great Taxi Assignment, Vibeware and Vector Tango won $10,000, $5,000 and $2,500.
    sources:
      - "https://vibejam.com/2025/"
      - "https://levels.io/winners-of-the-2025-vibe-code-game-jam"
      - "https://vibejam.com/2026/press"
  - slug: vibe-jam-2026
    name: 2026 Vibe Coding Game Jam
    maker: Pieter Levels
    url: "https://vibejam.com/2026/"
    intro: |-
      At least 90 percent of the code had to be written by AI, and only new games made during the jam counted, one entry per person. Those were the rules of the 2026 Vibe Coding Game Jam, officially Cursor Vibe Jam 2026, which was the second edition of Pieter Levels' jam for AI-made web games.

      The jam opened on April 1. Games had to be free on the web with no login or signup and load almost instantly, and each one had to include the jam's widget script or be disqualified. Any engine was allowed and Three.js recommended, and multiplayer was preferred but wasn't required.

      Submissions closed on May 1 at 13:37 UTC. Cursor was the diamond sponsor, with Bolt.new, Glif and Tripo3D also sponsoring.

      The prize money added up to a lot. First, second and third place paid $25,000, $10,000 and $5,000, and on top of that, 12 special prizes paid $1,000 each.

      Levels' results post on June 17 names A Game About Capybaras Delivering Food, Fanto's Mega-Mart and WenWare as the top three, so a capybara on a scooter took first place. All the entries are playable at vibej.am.
    sources:
      - "https://vibejam.com/2026/"
      - "https://vibejam.com/2026/press"
      - "https://levels.io/vibe-jam-2026-winners-quality"
  - slug: ai-browser-game-jam-1
    name: AI Browser Game Jam 1
    maker: Focaccai
    url: "https://itch.io/jam/ai-browser-game-jam"
    intro: |-
      Rogue Memory tied for first overall at AI Browser Game Jam 1 with 6-bit Vanguard (Star Overlord 4.0). Its hero is GHOST.EXE, a deleted AI, so the jam's theme, Ghost in the Machine, is right there in the main character.

      It was Focaccai's first itch.io jam for AI-assisted browser games, and its submission window ran from February 20 to March 10, 2026, after a deadline extension.

      Entries had to be free and playable in a web browser using HTML5, with 50 percent or more AI-generated. AI could be used for code, art, design, music, sound or voice, with human editing and refinement welcome. Entrants needed the right to distribute their work, had to credit third-party assets and tools, and couldn't submit hateful, harassing or malicious content.

      Its results page reports 29 submissions, and the public rankings list 25 games, with Link State in third.
    sources:
      - "https://itch.io/jam/ai-browser-game-jam"
      - "https://itch.io/jam/ai-browser-game-jam/results"
      - "https://itch.io/jam/ai-browser-game-jam/results?page=2"
  - slug: ai-browser-game-jam-2
    name: AI Browser Game Jam 2
    maker: Focaccai
    url: "https://itch.io/jam/ai-game-jam-2"
    intro: |-
      The top two games at AI Browser Game Jam 2 both have Alien in the title. Alien Escape Pinball ranked first overall and Alien Orbital Assault second, even though the Alien theme was only a suggestion that entrants could interpret freely or ignore. Realmward Tower Defense came third.

      It was the second edition of Focaccai's itch.io jam for AI-assisted browser games. Submissions opened on April 11, 2026 and closed on April 30.

      Games had to be free and playable in a web browser using HTML5, with 50 percent or more AI-generated. AI could contribute code, art, design, music or sound, and human editing and refinement were welcome. Solo developers and teams could enter. Entrants needed distribution rights, had to credit third-party assets and tools, and couldn't submit hateful, harassing or malicious content.

      Its results page reports 42 submissions, and the public rankings list 38 games.
    sources:
      - "https://itch.io/jam/ai-game-jam-2"
      - "https://itch.io/jam/ai-game-jam-2/results"
      - "https://itch.io/jam/ai-game-jam-2/results?page=2"
  - slug: ai-browser-game-jam-3
    name: AI Browser Game Jam 3
    maker: Focaccai
    url: "https://itch.io/jam/ai-game-jam-3"
    intro: |-
      In Faithful Or Fickle you play a black cat familiar who secretly steers a manor's fate, which takes the theme of AI Browser Game Jam 3, Familiar, pretty literally. The theme was optional, though, and entrants could interpret it freely or ignore it.

      This was the third edition of Focaccai's itch.io jam for AI-assisted browser games, and its submission window ran from June 6 to June 24, 2026.

      Entries had to be free and playable in a web browser using HTML5, with 50 percent or more AI-generated. AI could be used for code, art, design, music or sound, alongside human editing and refinement. Solo developers and teams were welcome. Entrants needed distribution rights, had to credit third-party assets and tools, and couldn't submit hateful, harassing or malicious content.

      Its results page reports 77 submissions, and the public rankings list 71 games. Pyramid Wars Demo ranked first overall, A Low Poly Dungeon Game second and Snow Bunny third.
    sources:
      - "https://itch.io/jam/ai-game-jam-3"
      - "https://itch.io/jam/ai-game-jam-3/results"
      - "https://itch.io/jam/ai-game-jam-3/results?page=2"
      - "https://itch.io/jam/ai-game-jam-3/results?page=3"
      - "https://itch.io/jam/ai-game-jam-3/results?page=4"
  - slug: ai-browser-game-jam-4
    name: AI Browser Game Jam 4
    maker: Focaccai
    url: "https://itch.io/jam/ai-jam-4"
    intro: |-
      In Charge The Coil you let go at just the right moment to wind a glowing charge around a copper coil, so it took the theme of AI Browser Game Jam 4, Charge, very much at its word. The theme was only a suggestion, though, and entrants could interpret it freely or ignore it.

      PLUGS, which came sixth, is actually about electricity too, since you light a dark house by plugging lamps into outlets.

      It was the fourth edition of Focaccai's itch.io jam for AI-assisted browser games, and submissions ran from August 1 to August 18, 2026.

      Games had to be free and playable in a web browser without a download, with the majority of the game AI-generated. Solo developers and teams could enter. Existing projects were allowed only when most of the submission was new content, and multiple entries had to be significantly different. Entrants needed distribution rights, had to credit third-party assets and tools, and couldn't submit hateful, harassing or malicious content.

      As of October 2026, its results page reports 125 entries, and the public rankings list 124 games. Plug & Prosper ranked first overall, AI2U - Guns & Girlfriends second and TECHNICAL DEBT third.
