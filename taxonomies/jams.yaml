terms:
  - slug: vibe-jam-2025
    name: 2025 Vibe Coding Game Jam
    maker: Pieter Levels
    url: "https://vibejam.com/2025/"
    intro: |-
      The 2025 Vibe Coding Game Jam was an online game jam for AI-written games, organized by Pieter Levels (@levelsio). He announced it in March 2025 with a March 25 deadline, and the deadline was extended to April 1, 2025 at 23:59 UTC. Bolt and CodeRabbit sponsored it.

      The official rules required at least 80% of the game to be written by AI (code, assets and so on). Games had to be instantly playable on the web with no logins, signups or loading screens, free to play, and hosted on their own domain or subdomain. Any engine was allowed, and the rules recommended Three.js.

      Prizes were $10,000, $5,000 and $2,500 for the top three. The jam page says more than 1,000 games were entered. The top three were The Great Taxi Assignment, Vibeware and Vector Tango.
    sources:
      - "https://vibejam.com/2025/"
      - "https://x.com/levelsio/status/1901660771505021314"
      - "https://x.com/levelsio/status/1906650541347717573"
      - "https://levels.io/winners-of-the-2025-vibe-code-game-jam"
  - slug: vibe-jam-2026
    name: 2026 Vibe Coding Game Jam
    maker: Pieter Levels
    url: "https://vibejam.com/2026/"
    intro: |-
      The 2026 Vibe Coding Game Jam, called Cursor Vibe Jam 2026 on its official page, was the second edition, organized by Pieter Levels. It started on April 1, 2026, and submissions closed on May 1, 2026 at 13:37 UTC. Cursor, Bolt.new, Glif and Tripo3D sponsored it.

      The official rules required at least 90% of the code to be written by AI. Only new games made during the jam were accepted, and each person could submit one entry. Games had to be free to play on the web with no login or signup, and had to load almost instantly. Any engine was allowed, and Three.js was recommended.

      Prizes were $25,000 for gold, $10,000 for silver and $5,000 for bronze, plus 12 special prizes of $1,000 each. Levels' results post names A Game About Capybaras Delivering Food, Fanto's Mega-Mart and WenWare as the top three.
    sources:
      - "https://vibejam.com/2026/"
      - "https://vibejam.com/2026/press"
      - "https://levels.io/vibe-jam-2026-winners-quality"
