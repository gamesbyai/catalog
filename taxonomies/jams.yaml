  - slug: ai-browser-game-jam-4
    name: AI Browser Game Jam 4
    maker: Focaccai
    url: "https://itch.io/jam/ai-jam-4"
    intro: |-
      AI Browser Game Jam 4 was the fourth edition of Focaccai's itch.io jam for AI-assisted browser games. Submissions ran from August 1 to August 18, 2026. The theme was Charge, offered as a suggestion that entrants could interpret freely or ignore.

      Games had to be free and playable in a web browser without a download, with the majority of the game AI-generated. Solo developers and teams could enter. Existing projects were allowed only when most of the submission was new content, and multiple entries had to be significantly different. Entrants needed distribution rights, had to credit third-party assets and tools, and could not submit hateful, harassing or malicious content.

      As of October 2026, its results page reports 125 entries, and the public rankings list 124 games. Plug & Prosper ranked first overall, AI2U - Guns & Girlfriends second and TECHNICAL DEBT third.
