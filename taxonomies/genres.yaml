terms:
  - slug: action
    name: Action
    intro: |-
      In Eyrie, a co-op action roguelike, you catch wandering spirits, carry them to a shrine to feed it and then turn to face the obelisk, wave after wave, while other players drop into the session. It took sixth place and the Most Atmospheric award at Vibe Jam 2026.

      Action games test hand-eye coordination and reaction time, and the label covers a lot, from Space Invaders and Pac-Man to platformers, shooters and fighting games.

      Fanto's Mega-Mart came second at Vibe Jam 2026 with shopping races against other players through a haunted grocery store, an idea that came to its creator in a dream. In Cube's Gravity Maze you flip gravity to find the key or the exit of a random maze.
    sources:
      - "https://en.wikipedia.org/wiki/Action_game"
  - slug: adventure
    name: Adventure
    intro: |-
      HALDANE-4 sends you alone beneath the Antarctic ice shelf in a submersible run by the United States Antarctic Survey, and a short horror story unfolds on the way down, drawn in ASCII with an AI voice narrating. denisbondare made it under strict limits, ASCII graphics and vibe coding only, and it won Most Original at Vibe Jam 2026.

      A Game About Capybaras Delivering Food, the Vibe Jam 2026 winner, makes you a capybara courier on a scooter in an open-world city, stacking noodle cups and bubble tea into a tower above the delivery box. In Ghost In The Machine you type compass directions to move through a computer lab during a storm, hunting ghosts with a detector.

      In an adventure game you're the protagonist of a story you move through yourself, exploring, collecting and using items, talking to characters and solving puzzles, much as in Colossal Cave Adventure (1976), Zork and Myst.
    sources:
      - "https://en.wikipedia.org/wiki/Adventure_game"
  - slug: arcade
    name: Arcade
    intro: |-
      In Fat Pac every bite raises your fat level, and the maze's enemies are workout gear, with the Treadmill chasing you down, the Dumbbell wandering at random and Rope moving to cut you off. Reach 100% and the board breaks, though going hungry ends the run too.

      Arcade games are named for the coin-operated cabinets they were played on, and arcade-style games keep the short, score-driven design of Pong, Space Invaders and Pac-Man, with multiple lives, short levels, simple controls and difficulty that climbs quickly.

      Alien Escape Pinball, first at AI Browser Game Jam 2, is a pinball table with slingshots, bumpers, two ramps and an alien egg you smash for jackpots. Fly To Mars has you pilot the Ares-IX from liftoff through an asteroid belt to touchdown.
    sources:
      - "https://en.wikipedia.org/wiki/Arcade_video_game"
  - slug: card
    name: Card
    intro: |-
      MRR Battle turns running an indie software business into an online card battle against threats such as paid ads, DDoS attacks and Hacker News roasts. Enterprise Deal is worth an instant 300 MRR, and Legal Team reflects the next attack back at your opponent. Its maker, an indie hacker for about ten years, made it so friends and family could get that experience without the money.

      Card games use cards as their main device, from a standard deck to one made for a single game. On screens they range from solitaire and trick-taking games like Bridge to digital collectible card games like Hearthstone, with deck building and resources such as mana.

      Ekeko, the first game from a 20-year-old solo developer in Bolivia, has you build card offerings on an altar tray for an Andean god of abundance who has gone rotten. Last Charge is a deckbuilding roguelike with no random rolls, and it's set in a world the Machines own, down to one human Citadel.
    sources:
      - "https://en.wikipedia.org/wiki/Card_game"
      - "https://en.wikipedia.org/wiki/Digital_collectible_card_game"
  - slug: casual
    name: Casual
    intro: |-
      Pocket Sparrows is about feeding and watching sparrows, each one generated with its own name, stats and quirks, and you can pet them and put small hats on your favorites without ever failing at anything. Yen Rye made it for a friend who feeds and names the local sparrows.

      In Ikuta '73 you spend the summer of 1973 cutting grass in the hills west of Tokyo for your uncle's company, in a game that takes its cues from a Haruki Murakami short story. Kanso, which won Most Zen at Vibe Jam 2026, is about growing digital bonsai trees at an unhurried pace.

      Solitaire and Bejeweled are casual games too, made for a mass-market audience rather than hobbyist gamers, with simpler rules, shorter sessions and less learned skill, and they're commonly played in web browsers and on phones.
    sources:
      - "https://en.wikipedia.org/wiki/Casual_game"
  - slug: educational
    name: Educational
    intro: |-
      In Next Token Please you're the one being prompted, picking tokens one by one until a sentence forms, as a short lesson about prediction from the chatbot's side.

      KOLO turns Glagolitic, the historical alphabet of Old Slavic, into a code you crack one hidden word at a time, and in ECO Guardian right answers to sustainability questions become power-ups against swarms of garbage monsters.

      The Oregon Trail is one of the early educational games, written in 1971 by three student teachers in Minnesota to teach 19th-century pioneer life through supply and travel decisions, and board and card games can teach too.
    sources:
      - "https://en.wikipedia.org/wiki/Educational_game"
      - "https://en.wikipedia.org/wiki/The_Oregon_Trail_(series)"
  - slug: fighting
    name: Fighting
    intro: |-
      Raveswords puts you in medieval sword fights against other players, set to dance music, with a DJ panel in the arena where you paste a YouTube link to queue the next track. neetsdotfun describes it as a multiplayer sword fighting game in the style of Chivalry: Medieval Warfare.

      Street Fighter II (1991), Mortal Kombat (1992) and Tekken (1994) are the classics, with one-on-one bouts in a fixed arena over three rounds, combos, special moves and a health bar to drain.

      AniKombat brings the Mortal Kombat mold to 3D in the browser, with a ranked ladder, and Floppy Brawler's fighters are loose-limbed ragdolls whose wobbly physics make every exchange messy. Knockout is a free MMA game where you build your own fighter before each bout in the octagon.
    sources:
      - "https://en.wikipedia.org/wiki/Fighting_game"
  - slug: horror
    name: Horror
    intro: |-
      In The Operator you're stuck in an abandoned forest tower at night with Siren Head outside the walls, and the only way out is a broken emergency phone that puts every call for help on hold. Its creator, itscoleblake, cites Coldline as an inspiration and wanted the powerlessness to scare you more than the monster.

      Six Midnight Shifts has you run a convenience store in Gray County after seventeen people vanished along a service corridor, checking customers against county records on the emergency radio's orders. In Forest Escape the flowers you need only show under your flashlight, and the spirits only see you when it's on.

      In our catalog horror turns up in puzzle games, shooters, a surgery simulator and a visual novel. Survival horror, the branch best known from Resident Evil (1996) and Silent Hill (1999), adds scarce ammunition, a small inventory, save points and sometimes fixed camera angles.
    sources:
      - "https://en.wikipedia.org/wiki/Horror_game"
      - "https://en.wikipedia.org/wiki/Survival_horror"
  - slug: idle
    name: Idle
    intro: |-
      Delete Things From Earth starts you on a cup of coffee and works up through continents to the sun itself, one click at a time, and the creator names Plague Inc. and Cookie Clicker as influences.

      Idle games, also called incremental games, are built on gradual and often exponential growth, where you earn currency, spend it on upgrades that earn more and often reset for a permanent bonus called prestige. Clicker games like Cookie Clicker keep you clicking, while idle games like AdVenture Capitalist automate most of the work.

      In Sludge Corp: Origins you click to gather Biomass for Subject Alpha, an alien blob sealed in an underground lab, while the game talks in office jargon about growing its market share. IdleWorlds, an old-school text-based MMORPG, keeps your character progressing while you're offline, with rat fights worth 4 XP and quests for 100 Rat Tails from Greenwake Den.
    sources:
      - "https://en.wikipedia.org/wiki/Incremental_game"
  - slug: platformer
    name: Platformer
    intro: |-
      RUNNING LATE turns a commute into 30 rooms against a 24-minute clock, and every death adds a whole twenty seconds to it. You run, rebound between walls and hold the button to control how high you jump.

      Platformers are action games about getting your character from point to point over uneven terrain and suspended platforms, jumping and climbing as you go. You run, time your jumps across gaps, avoid hazards like pits and reach the end of the level. Donkey Kong (1981) and Super Mario Bros. (1985) are the classic examples.

      If you're making one, the movement code is the core of it, with gravity, a jump model (a fixed arc, or one you can steer mid-air) and collision tests against terrain and hazards. Levels are commonly built from a grid of tiles, and a scrolling level needs a camera that converts world coordinates to screen coordinates.

      On the web, the Gamepad API reads controllers, and phones need on-screen buttons built with pointer events. Physics should use the elapsed time from requestAnimationFrame, or the game runs faster on high refresh-rate screens.
    sources:
      - "https://en.wikipedia.org/wiki/Platform_game"
      - "https://developer.mozilla.org/en-US/docs/Games/Techniques/Tilemaps"
      - "https://developer.mozilla.org/en-US/docs/Games/Techniques/2D_collision_detection"
      - "https://developer.mozilla.org/en-US/docs/Web/API/Gamepad_API/Using_the_Gamepad_API"
      - "https://developer.mozilla.org/en-US/docs/Web/API/Pointer_events"
      - "https://developer.mozilla.org/en-US/docs/Web/API/Window/requestAnimationFrame"
  - slug: puzzle
    name: Puzzle
    intro: |-
      In Ink Side Down you roll a cube with one inked face across a grid, printing ink on the marked squares and keeping it off every other square. There's a new grid every day, with an easy, a medium and a hard puzzle, each with its own par.

      Puzzle video games test logic, pattern recognition, sequence solving and spatial recognition, and the genre runs from falling-block games like Tetris (1985) to tile-matching games like Bejeweled and physics puzzles like Portal (2007).

      WenWare took third place and the Most Played award at Vibe Jam 2026 with 360-degree scenes from history, where you work out the place and the year from the buildings, the clothes and the technology around you. In Data Drop the falling blocks are letters, and you're filling the gaps in half-hidden passwords.
    sources:
      - "https://en.wikipedia.org/wiki/Puzzle_video_game"
  - slug: racing
    name: Racing
    intro: |-
      SimDrive turns your phone into the steering wheel. You open the game on a TV or computer, scan a QR code and tilt the phone to steer, and the phone answers back with sound and haptics like engine roar and tire slip.

      Racing games run all the way from realistic simulations to fantastical arcade-style racers. You drive a circuit or a point-to-point course, manage laps and your position against opponents or the clock, and try to improve your time.

      Every racer needs a vehicle model. Simulation racers care a lot about realistic handling and cornering, while arcade racers use looser physics that let you drift through turns. On top of that, the code needs track data, lap and position tracking, computer-controlled opponents and a camera view, such as first-person, chase or overhead.

      With a regular controller, browsers read steering and triggers through the Gamepad API, polled every frame. 3D tracks render with WebGL or its successor, WebGPU, which some major browsers don't support yet.

      Pole Position (1982), Gran Turismo (1997) and Mario Kart are the usual examples.
    sources:
      - "https://en.wikipedia.org/wiki/Racing_video_game"
      - "https://developer.mozilla.org/en-US/docs/Web/API/Gamepad_API/Using_the_Gamepad_API"
      - "https://developer.mozilla.org/en-US/docs/Web/API/WebGPU_API"
  - slug: rhythm
    name: Rhythm
    intro: |-
      PULSARI Demo starts every track in silence, and each combo milestone pulls more of the song back in, from the bass at four to the full track at thirty-two, with sets from 80 to 250 BPM.

      In onbeat there are no buttons at all, and you say the requested word right on the beat. Vibe-oke comes from roieambulo's love of karaoke, with every lyric word a note you hit on one of five keys as it reaches the lane.

      Rhythm games are action games built around music, where you hit inputs in time with a song and score for accuracy, as in PaRappa the Rapper (1996), Dance Dance Revolution and Guitar Hero.
    sources:
      - "https://en.wikipedia.org/wiki/Rhythm_game"
  - slug: roguelike
    name: Roguelike
    intro: |-
      Dragonwake draws its whole world in text characters on a black grid, from towns and ruins to dungeons and blackglass sites, and every action is a turn, after which the nearby enemies act. kalin_t, a fan of ASCII roguelikes, set out to get long, complex replayability from AI-assisted coding.

      The name comes from Rogue (1980), and the traditional roguelike is a dungeon crawl through procedurally generated levels with turn-based play, grid movement and permanent death, as in NetHack, while roguelites keep some of that without the turns.

      Rogue Memory won AI Browser Game Jam 1 with a fragment of a deleted program, GHOST.EXE, escaping a maze built from its own memories. Tankz: Arena is a quick arcade roguelite where enemy tanks come in waves, a boss turns up every five, and each level-up offers three random upgrades.
    sources:
      - "https://en.wikipedia.org/wiki/Roguelike"
  - slug: rpg
    name: RPG
    intro: |-
      In Reach the Relay you lead a party across the ruins of an AI apocalypse and keep your VIP alive all the way to the Relay, through active time battles in the style of SNES-era role-playing games. nomadhothouse drew on Final Fantasy, Dragon Quest and the Temple Trekking activity in Old School RuneScape.

      Role-playing games grew out of tabletop Dungeons & Dragons, with a detailed story and characters who advance through levels or skills, and on computers the Ultima series was among the early ones. Characters have numeric attributes such as strength that decide whether an action works, and the game keeps track of experience, equipment, an inventory and quest progress.

      Riders Of The Nine Planes starts out as a roguelike and grows toward a full RPG, with a rider who builds energy from motion and spends it on spells. Chronicles of the Fallen Realm takes a party of heroes through five acts of turn-based battles to the Shadow Lord, with nine hero classes and upgrades that'll carry over after a defeat.
    sources:
      - "https://en.wikipedia.org/wiki/Role-playing_video_game"
  - slug: sandbox
    name: Sandbox
    intro: |-
      In Rubble Kings the taller your tower of physics blocks stands, the more land your kingdom controls, and the easier it is for a rival to knock it down in a heap of rubble.

      Sandbox games give you a lot of creative freedom, usually with no set goal or with goals you pick yourself, like building a house, and Minecraft and Garry's Mod are the famous ones.

      Colonia has a sandbox mode with five landscapes and four map sizes, where homes grow over twenty housing levels from a tent to an imperial palace, among Latin-named buildings like the Horreum and the Castra. In VybeCiv you rule one tribe on a hex map of Earth, then the Solar System, then the Galaxy.
    sources:
      - "https://en.wikipedia.org/wiki/Sandbox_game"
  - slug: shooter
    name: Shooter
    intro: |-
      In Strilecka you sketch a plane and dogfight other players' drawings online, in a style taken from a 6-year-old's airplane sketches, and the creator built it with their son, who loves drawing planes.

      Shooters are action games about beating enemies with ranged weapons, whether the screen stays fixed as in Space Invaders, the view is first-person as in Doom, or the camera sits behind your character.

      Undersphere won the Unique Concept award at Vibe Jam 2026 with deathmatches on the inside of a hollow sphere, where the horizon rises into the sky above you. The Rite is an arena shooter in the Unreal Tournament mold, where the first player to 20 kills wins.
    sources:
      - "https://en.wikipedia.org/wiki/Shooter_game"
  - slug: simulation
    name: Simulation
    intro: |-
      RelativityX flies you through a 3D solar system in a spacecraft with six speed modes, from subsonic toward light speed, and as you accelerate, the Earth clock and the ship clock drift apart. cng13m built it after watching Interstellar, wanting players to experience time dilation for themselves.

      Simulation games copy real-world activities, for training, analysis, prediction or entertainment, and they cover vehicles, farming, construction, management, jobs and whole social systems, usually without strictly defined goals, as in The Sims and SimCity.

      The Vibe Jam 2026 winner, A Game About Capybaras Delivering Food, was made by a former developer on a food delivery app. Almost Surgery makes you an unlicensed surgeon paid per operation, with Papers, Please named as an inspiration.
    sources:
      - "https://en.wikipedia.org/wiki/Simulation_video_game"
  - slug: sports
    name: Sports
    intro: |-
      Temple Fist puts you in a boxing ring in a bamboo grove where every frame comes from AI-generated video instead of a 3D scene, and you fight back with Jab, Hook and Uppercut buttons.

      Chain Camp Classic is nine holes of disc golf, opening with Trailhead Toss, a 521-foot par 3, and in KICKER you work the rods of a 3D foosball table, each on its own key. Its creator hopes to beat a co-worker who plays in a German kicker league, at least virtually.

      Sports games simulate a sport within its rules, from team sports and track and field to extreme and combat sports, often with a season or career mode, and Pong, Madden NFL and Wii Sports all count.
    sources:
      - "https://en.wikipedia.org/wiki/Sports_video_game"
  - slug: strategy
    name: Strategy
    intro: |-
      Field of Command gives you a British infantry section holding the fields of Kent in 1940s England against an AI side, or you can lead the German assault instead, in an alternate history of an invasion that never happened. It took tenth place at Vibe Jam 2026.

      Strategy games are about planning and decision-making, often through indirect control of several units and limited resources, and the subgenres run from real-time strategy like StarCraft to turn-based strategy and 4X games like Civilization.

      Tharsis: Martian Combat sends harvesters after crystals on Mars to pay for an army that runs from riflemen to the Behemoth super-tank, with a design that draws on classic Command & Conquer. BLACK CODE, sixth at AI Browser Game Jam 1, has you command a squad of armed operatives through a cyberpunk city in real time.
    sources:
      - "https://en.wikipedia.org/wiki/Strategy_video_game"
  - slug: survival
    name: Survival
    intro: |-
      KÖTTBULLAR METAL won Funniest Game at Vibe Jam 2026 by putting you in a death metal mosh pit for 15 minutes, where the lyrics are odd Swedish-style furniture names from a home-goods catalog. If you don't last, you become the meatball the game is named after.

      Survival games drop you somewhere hostile with very little equipment and needs like hunger and thirst, and you gather resources, craft tools, build shelter and fend off threats, as in Minecraft, Don't Starve and Rust.

      In Wicklight you're a flame, and the shades hunting you die in your light but hide safely in the shadows your pillars cast. Spell Cascade asks you to last 10 minutes against closing waves, and yurukusa built it as a non-engineer working with Claude Code over 235 commits.
    sources:
      - "https://en.wikipedia.org/wiki/Survival_game"
  - slug: tower-defense
    name: Tower defense
    intro: |-
      In The Bad Bunch you place monkeys along a dirt path to stop waves of furious bananas before they reach your city, choosing between Basic, Ice, Flame and Lightning monkeys with $200 to start. A father and his 10-year-old son made it together, inspired by Bloons.

      Tower defense is a strategy subgenre where you hold territory by placing defenses along the path attackers take, earning currency for each enemy you stop and upgrading between waves, as in Plants vs. Zombies (2009) and Bloons Tower Defense.

      Chess Defence turns chess pieces into towers against the undead marching on your king, and in Ship Snatch up to 32 players defend the Captain's Keep from pirate ships and sea tentacles on a map of hex tiles.
    sources:
      - "https://en.wikipedia.org/wiki/Tower_defense"
  - slug: trivia
    name: Trivia
    intro: |-
      Each round of TimeCrime drops you into a 360-degree scene from history with one object that couldn't have existed there, like a phone on a tripod on the Moon. You get 45 seconds to spot it and guess where and when you are, and Peter TP wanted players scanning for anomalies, not only recalling facts.

      Trivia games ask questions on one topic or many, from the board game Trivial Pursuit, first released in Canada in 1981, to You Don't Know Jack (1995), which mixed trivia with comedy in a game-show format.

      eurotune quizzes you on five Eurovision songs a game, down to the country, the exact year, the artist and the title. In EmojiBeats a string of emojis stands for a pop song title, and you can type the answer or say it out loud.
    sources:
      - "https://en.wikipedia.org/wiki/Quiz"
      - "https://en.wikipedia.org/wiki/Trivia"
      - "https://en.wikipedia.org/wiki/Trivial_Pursuit"
      - "https://en.wikipedia.org/wiki/You_Don%27t_Know_Jack_(1995_video_game)"
  - slug: word
    name: Word
    intro: |-
      Symblify's daily puzzle is a short line of words and symbols that spells out a phrase, with four guesses to crack it and symbols that keep the same meaning from day to day. Its maker calls it a cross between word puzzles, cryptic crosswords and maths notation.

      Word games test what you can do with language, whether they're spoken, played on a board or on a screen, from arranging letters in Scrabble to guessing a hidden word in Hangman. Josh Wardle's Wordle, released in October 2021, gives you six tries at a five-letter word, with green, yellow or gray feedback on every letter.

      In Typefall the letters drop into columns one tile at a time, and the bottom row is the word you're working on, whether that's any real word, a Wordle-style guess or a hidden place name. Chain Puzzle has three modes, from hangman-style guessing to crosswords limited to real dictionary words.
    sources:
      - "https://en.wikipedia.org/wiki/Word_game"
      - "https://en.wikipedia.org/wiki/Wordle"
  - slug: board
    name: Board
    intro: |-
      Ayo Olopon puts Ayo, a West African strategy board game with deep roots in Nigerian culture, into 3D for matches against another person. that_LaravelGuy built it from childhood memories of watching people play, hoping to bring the game to a new generation.

      Board games are tabletop games played by placing and moving pieces on a patterned board, usually with a rules system, a turn order and often dice or cards, and chess, Go, Monopoly and Catan all count.

      Taipan Board Game spent two years as a tabletop prototype before bragoatski made the digital version, and building it exposed balance problems that changed the mechanics. Hell Chess builds on the rules of chess and adds summoning, terrain changes and curses, with ideas borrowed from Polytopia and Slay the Spire.
    sources:
      - "https://en.wikipedia.org/wiki/Board_game"
  - slug: io
    name: .io
    intro: |-
      Starpit.io starts you as a brown dwarf in an arena of other players' stars, and you grow by absorbing them on the way to collapsing into a primordial black hole. The physics includes inverse-square gravity, tidal stripping, Hawking radiation and spaghettification, and rscassiel says the idea was to combine a love of .io games with astrophysics.

      Kurve Royale puts up to 64 pilots in a shrinking dome where everyone leaves a trail, and SumoBall.io takes its idea from the sumo minigame in Fusion Frenzy and the bumper balls in Mario Party.

      In the browser arenas of Agar.io (April 2015) and Slither.io (March 2016), you start small and grow by eating food or other players until someone knocks you out, and many later games are named for the .io domain.
    sources:
      - "https://en.wikipedia.org/wiki/.io_game"
      - "https://en.wikipedia.org/wiki/Agar.io"
      - "https://en.wikipedia.org/wiki/Slither.io"
  - slug: management
    name: Management and tycoon
    intro: |-
      Crazy Cat Cafe has you serving drinks in a cozy cafe while the cats keep knocking your mugs off the counter, and it started when the creator's kids asked for a game about cats and the creator wanted a coffee.

      Management games come from construction and management simulation, where you build and run a community or a business on limited resources, and tycoon games like Railroad Tycoon (1990) and RollerCoaster Tycoon (1999) simulate the economy behind it. The citizens or guests react to what you build, but you seldom give them direct orders, as in SimCity (1989).

      TECHNICAL DEBT, third at AI Browser Game Jam 4, makes you a parent whose job was automated away, putting household needs on credit for a chance at a beach vacation. In Dungeon League you're the dungeon, and you only get paid while the raiding party is still inside, alive and badly hurt.
    sources:
      - "https://en.wikipedia.org/wiki/Construction_and_management_simulation"
  - slug: metroidvania
    name: Metroidvania
    intro: |-
      A double jump can make a ledge you passed earlier worth going back for. Metroidvanias are built around that, with a large connected map where rooms stay locked until you find the item, weapon, key or ability that opens them, often from a boss.

      Metroid (1986) was Nintendo's go at a non-linear adventure with permanent power-ups. Castlevania: Symphony of the Night (1997) took it further when its assistant director, Koji Igarashi, added a large open world, Zelda-style key items and an experience system from console RPGs.

      By early 2025 Steam had over 2,200 games tagged as Metroidvanias, a name Jeremy Parish says he helped popularize, and Cave Story, Ori and the Blind Forest and Team Cherry's Hollow Knight are among the acclaimed indie ones.
    sources:
      - "https://en.wikipedia.org/wiki/Metroidvania"
  - slug: open-world
    name: Open world
    intro: |-
      In Ride Tales you pick any place on Earth, choose a time of day and drop in with a small hatchback to drive around the real world, hunting quests, hidden treasures and legendary rides. Aurelien_Gz built it from a love of travel and of open-world driving games like GTA.

      The Legend of Zelda (1986) and Grand Theft Auto III (2001) are early open-world games, where you take on objectives freely rather than along a linear path, and The Elder Scrolls V: Skyrim and Breath of the Wild came later.

      Hollowlands, inspired by Breath of the Wild, is an infinite world you share with other players while you gather, survive and build. In Brinewake you captain a sloop across the 22 isles of the Shimmering Sea, digging up buried gold from X-marked maps.
    sources:
      - "https://en.wikipedia.org/wiki/Open-world_video_game"
  - slug: party
    name: Party
    intro: |-
      In superskyler a whole room plays short mini-games on the phones everyone already owns, and jpmarindiaz made it for a school coding contest, with family game nights as the inspiration.

      Mario Party (1998) and the Jackbox Party Pack, first released in 2014, are collections of short minigames played in quick succession by several people in the same room, with controls simple enough for anyone, and Jackbox runs on phones too.

      Swingers took Most Unhinged at Vibe Jam 2026 with a grappling hook, a city and a global leaderboard ranked by dollars of property damage. In Pengu Smash two teams of three penguins knock each other into the ocean while the hex ice arena melts away after 60 seconds.
    sources:
      - "https://en.wikipedia.org/wiki/Party_video_game"
  - slug: stealth
    name: Stealth
    intro: |-
      In Step Lightly each footstep lights up a little of a dark ranch house and makes a noise the monster that's hunting you can follow, and when you stop, everything goes quiet and dark again.

      Stealth games reward you for avoiding or overcoming opponents without being noticed, often more than for fighting them, with patrols to watch and light and shadow that change what the guards can see. Metal Gear (1987), Thief: The Dark Project (1998), Splinter Cell and Hitman are the well-known ones.

      Sunset City - The Dark Tower placed eighth at Vibe Jam 2026 with a climb through a watched city toward the Black Tower, built on the idea that a quiet path always exists. Deer Diplomacy is set in Nara Deer Park, where you bow to each deer to earn its trust before handing over a senbei cracker, and real deer in Nara do bow back to visitors who bow to them.
    sources:
      - "https://en.wikipedia.org/wiki/Stealth_game"
  - slug: visual-novel
    name: Visual novel
    intro: |-
      In The long Night you play Paul Rivers, who wakes inside the Sterling Corporation and has to find his coworkers before the system archives them, floor by floor from the basements up to Level 99. EDORG GAMES used AI for the visuals and atmosphere of this hour-long piece of interactive fiction in the visual novel mold.

      Visual novels come from Japan, and the term appeared in the mid-1990s for story-first games told through text boxes, static images, background art and audio, with a branch at each decision point and several endings. Steins;Gate, Phoenix Wright: Ace Attorney and Fate/stay night are well-known examples, and Ren'Py was among the most popular kits for making them.
    sources:
      - "https://en.wikipedia.org/wiki/Visual_novel"
