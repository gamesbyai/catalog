terms:
  - slug: threejs
    name: Three.js
    url: "https://threejs.org/"
    intro: |-
      Three.js is an open-source JavaScript library for 3D graphics in the browser, released under the MIT license and developed on GitHub under the mrdoob account. Current builds include WebGL and WebGPU renderers.

      A Three.js game is JavaScript from top to bottom, and no editor is required, so an agent can write the scene, camera and game loop as code. The manual offers two setups: npm with Vite, or an import map that loads Three.js from a CDN and lets a game fit in one HTML file. Both need a local web server, because features break when a page opens straight from disk.

      WebGPURenderer falls back to WebGL 2 on devices without WebGPU. Its shaders are written in TSL, and older ShaderMaterial code has to be ported. Both Vibe Jam rulebooks allow any engine and recommend Three.js.
    sources:
      - "https://threejs.org/"
      - "https://github.com/mrdoob/three.js"
      - "https://threejs.org/manual/#en/installation"
      - "https://threejs.org/manual/#en/webgpurenderer"
      - "https://vibejam.com/2025/"
      - "https://vibejam.com/2026/"
  - slug: babylonjs
    name: Babylon.js
    url: "https://www.babylonjs.com/"
    intro: |-
      Babylon.js is an open-source 3D engine for the web, written in TypeScript and released under the Apache 2.0 license. Microsoft maintains it with an open-source community. It renders with WebGL, WebGL 2 and WebGPU, and version 9.0 came out on March 26, 2026.

      A Babylon.js game is JavaScript or TypeScript, installed from npm or loaded from Babylon's CDN, so an agent can write the whole scene as code. The Playground runs that code in the browser, and since 9.0 it handles multiple files and npm imports, which makes it a quick place to test a snippet an AI wrote.

      For visual work, the Babylon.js Editor is a desktop app for Windows, macOS and Linux with scene editing, scripting, physics and project builds. The site also lists browser node editors for materials, geometry and particles.
    sources:
      - "https://www.babylonjs.com/"
      - "https://github.com/BabylonJS/Babylon.js"
      - "https://blogs.windows.com/windowsdeveloper/2026/03/26/announcing-babylon-js-9-0/"
      - "https://blogs.windows.com/windowsdeveloper/2026/03/30/part-2-babylon-js-9-0-tooling-updates-and-new-geospatial-features/"
  - slug: playcanvas
    name: PlayCanvas
    url: "https://playcanvas.com/"
    intro: |-
      PlayCanvas is an open-source web game engine built on WebGL2 and WebGPU, with a browser-based, collaborative Editor. The PlayCanvas site says the entire platform is open source on GitHub under the MIT license. As of September 2026, the Editor's free plan covers unlimited public projects, 1GB of storage and hosting, and private projects need a paid plan.

      Code-first projects install the engine from npm or use its React and web-component libraries, so an agent writes JavaScript or TypeScript against the API. Editor projects can use the official PlayCanvas Editor MCP server. It lets Claude Code, Codex, Cursor and other agents create entities and scripts, edit assets and scenes, launch the game, read console logs and take screenshots.

      The engine also handles glTF models, WebXR and 3D Gaussian splats.
    sources:
      - "https://playcanvas.com/"
      - "https://github.com/playcanvas/engine"
      - "https://playcanvas.com/plans"
      - "https://github.com/playcanvas/editor-mcp-server"
  - slug: react-three-fiber
    name: React Three Fiber
    url: "https://r3f.docs.pmnd.rs/"
    intro: |-
      React Three Fiber is a React renderer for Three.js, maintained by the Poimandres (pmndrs) open-source collective and released under the MIT license. JSX elements become Three.js objects: <mesh /> in a component creates a new THREE.Mesh.

      Scenes are built from reusable components that react to state, and the docs say everything that works in Three.js works here. Companion packages from the same ecosystem include Drei for helpers, Rapier bindings for physics and a postprocessing package for effects. Versions pair with React, so @react-three/fiber 9 goes with React 19.

      A game made this way is a React project installed from npm with a build step, not a single HTML file.
    sources:
      - "https://r3f.docs.pmnd.rs/getting-started/introduction"
      - "https://github.com/pmndrs/react-three-fiber"
  - slug: aframe
    name: A-Frame
    url: "https://aframe.io/"
    intro: |-
      A-Frame is an open-source web framework for VR and 3D scenes, built on Three.js and released under the MIT license. Scenes are HTML tags such as <a-scene> and <a-box>, on top of an entity-component architecture, and the current release is 1.8.0.

      The basic setup is one HTML file with a script tag and an <a-scene> element, with nothing to install and no build step. An agent can write a whole scene as markup plus JavaScript components. The docs still recommend a local server during development, because URLs can break when a page opens from file://.

      Scenes run in desktop and mobile browsers and on headsets including Meta Quest, Apple Vision Pro, HTC Vive and Valve Index.
    sources:
      - "https://aframe.io/"
      - "https://aframe.io/docs/1.8.0/introduction/"
      - "https://aframe.io/docs/1.8.0/introduction/installation.html"
      - "https://github.com/aframevr/aframe"
  - slug: phaser
    name: Phaser
    url: "https://phaser.io/"
    intro: |-
      Phaser is a free, open-source 2D framework for HTML5 games in desktop and mobile browsers, released under the MIT license by Phaser Studio. It renders with Canvas and WebGL. Phaser 4.0.0 came out on April 10, 2026, and rebuilt the WebGL renderer while keeping the API.

      Games are JavaScript or TypeScript, loaded from a CDN script tag or installed from npm. The repository ships a skills folder that teaches AI coding agents Phaser 4's APIs and patterns. Phaser Editor v5 has a built-in MCP server for scenes, assets and tilemaps. The Phaser Game Agent, billed by build time, lets Claude Code, Codex, Cursor and other agents build a game with code, art and sound.

      Even during development, a Phaser game runs from a web server, because browsers restrict pages loaded from disk.
    sources:
      - "https://github.com/phaserjs/phaser"
      - "https://github.com/phaserjs/phaser/releases"
      - "https://docs.phaser.io/phaser/getting-started/set-up-dev-environment"
      - "https://docs.phaser.io/phaser-editor/ai/mcp-server"
      - "https://phaser.io/news/2026/04/phaser-editor-v5-release"
      - "https://phaser.io/news/2026/07/phaser-game-agent-mcp-setup"
  - slug: pixijs
    name: PixiJS
    url: "https://pixijs.com/"
    intro: |-
      PixiJS is an open-source 2D rendering engine for the web, released under the MIT license and free to use. Version 8 renders with WebGL and WebGPU, and the PixiJS team also makes companion libraries such as PixiJS React, Sound, UI and Layout.

      The docs present it as a rendering engine rather than a complete game framework, so game rules, collisions and physics come from your own code or other libraries. PixiJS has no scene editor: the whole game is JavaScript or TypeScript, and npm create pixi.js@latest starts a project.

      The team publishes official skills for AI coding agents, installed with npx skills add, plus llms.txt versions of the docs, with setup notes for Claude Code, Cursor and Codex.
    sources:
      - "https://pixijs.com/"
      - "https://github.com/pixijs/pixijs"
      - "https://pixijs.com/8.x/guides/getting-started/intro"
      - "https://pixijs.com/llms"
  - slug: kaplay
    name: KAPLAY
    url: "https://kaplayjs.com/"
    intro: |-
      KAPLAY is a free, open-source JavaScript and TypeScript library for 2D web games, released under the MIT license. It is a fork of Kaboom.js: in July 2024 the team wrote that Kaboom had been deprecated and that KAPLAY carries it on with community support. Version 3001 is the stable release, and a v4000 preview is available.

      The API is component based: a game adds objects with calls such as add([sprite("bean"), pos(100, 100)]). You can start with npx create-kaplay, install from npm or load KAPLAY from a CDN script tag, so a game can be a single HTML file. KAPLAYGROUND at play.kaplayjs.com runs code in the browser for quick tests.
    sources:
      - "https://kaplayjs.com/"
      - "https://github.com/kaplayjs/kaplay"
      - "https://kaplayjs.com/blog/sok1/"
  - slug: excalibur
    name: Excalibur.js
    url: "https://excaliburjs.com/"
    intro: |-
      Excalibur.js is a free, open-source 2D game engine for the web, written in TypeScript and released under the BSD 2-Clause license. The community-run Excalibur.js project maintains it and has pledged that its public projects stay BSD 2-Clause.

      Games are TypeScript or JavaScript. You install from npm, use a script tag or an import map from unpkg, or start from templates for Vite, Parcel, Rollup, Webpack, Electron and Capacitor. The engine includes physics and collisions, plus plugins for Tiled, LDtk and Aseprite files. Because it is typed, the compiler can flag wrong method calls in AI-written code before the game runs.

      Excalibur is still at version 0.x, and its README warns that breaking changes will occur in new releases, so AI-written code should target the version the project uses.
    sources:
      - "https://excaliburjs.com/"
      - "https://excaliburjs.com/docs/installation/"
      - "https://github.com/excaliburjs/Excalibur"
  - slug: littlejs
    name: LittleJS
    url: "https://github.com/KilledByAPixel/LittleJS"
    intro: |-
      LittleJS is a small, open-source HTML5 game engine by Frank Force (KilledByAPixel), released under the MIT license with no dependencies. It renders with WebGL2 plus Canvas2D, has arcade physics and Box2D compiled to WebAssembly, and plays sounds through the ZzFX generator without asset files.

      Small size is a stated focus. The full minified build is about 100 KB gzipped, a small 2D game about 26 KB, and a js13k branch builds to a 7 KB zip. Games are JavaScript or TypeScript, from npm or a Vite template.

      The README also calls the API small and well documented so LLMs can produce high-quality results. It links LittleJS AI Tools, with templates and prompts for AI workflows, and a LittleJS GPT that builds games inside ChatGPT.
    sources:
      - "https://github.com/KilledByAPixel/LittleJS"
  - slug: p5js
    name: p5.js
    url: "https://p5js.org/"
    intro: |-
      p5.js is a free, open-source JavaScript library for creative coding, released under the LGPL 2.1 license. Lauren Lee McCarthy created it in 2013 as a web take on the Processing language, and the Processing Foundation sustains it. It draws 2D graphics and can also render with WebGL.

      A sketch is built around two functions: setup() runs once, and draw() runs 60 times per second until the program stops, which works as a game loop. A new project has index.html, style.css and sketch.js, so a small game can live in one sketch.js file that an agent writes from top to bottom. The p5.js Web Editor runs and saves sketches in the browser with no setup.
    sources:
      - "https://p5js.org/"
      - "https://github.com/processing/p5.js"
      - "https://p5js.org/tutorials/get-started/"
  - slug: canvas
    name: HTML5 Canvas
    url: "https://developer.mozilla.org/en-US/docs/Web/API/Canvas_API"
    intro: |-
      The Canvas API is a browser feature for drawing graphics with JavaScript on an HTML canvas element. MDN lists animation, game graphics, data visualization, photo manipulation and real-time video processing among its uses, and says it largely focuses on 2D graphics.

      Nothing has to be installed. A game can be one HTML file with a canvas element and a script that redraws the screen every frame, so an agent can write and ship it without a build step. The API only draws, so the game loop, input, collisions and sound are code you or an AI write, or come from a library.

      WebGL draws hardware-accelerated 2D and 3D graphics on the same canvas element, and OffscreenCanvas also works in web workers.
    sources:
      - "https://developer.mozilla.org/en-US/docs/Web/API/Canvas_API"
  - slug: webgl
    name: WebGL
    url: "https://developer.mozilla.org/en-US/docs/Web/API/WebGL_API"
    intro: |-
      WebGL is a JavaScript API for drawing hardware-accelerated 2D and 3D graphics in the browser without plug-ins. It is an open web standard from the Khronos Group, renders into an HTML canvas element and is available in all modern browsers. WebGL 1 conforms to OpenGL ES 2.0, and WebGL 2 to OpenGL ES 3.0.

      Raw WebGL is low level and shader driven: shaders are written in GLSL, a separate language from JavaScript. Engines such as Three.js, Babylon.js, PixiJS, Phaser and PlayCanvas handle that for you. MDN describes WebGPU as the successor to WebGL.
    sources:
      - "https://developer.mozilla.org/en-US/docs/Web/API/WebGL_API"
      - "https://www.khronos.org/webgl/"
      - "https://developer.mozilla.org/en-US/docs/Web/API/WebGPU_API"
  - slug: godot
    name: Godot
    url: "https://godotengine.org/"
    intro: |-
      Godot is a free, open-source engine for 2D and 3D games, released under the MIT license and supported by the nonprofit Godot Foundation. The current stable series is 4.7. Scripts are written in GDScript, a language built for Godot with Python-style indentation, or in C#.

      Most of a Godot project is text an agent can edit: scripts are .gd files, and scenes are .tscn files that the docs call mostly human-readable. Community MCP servers such as Godot AI go further and connect Claude Code, Codex, Cursor and other agents to a live editor, where they build scenes, edit nodes and wire signals.

      Web export uses WebAssembly and WebGL 2 through the Compatibility renderer, and Godot 4 can't export C# projects to the web. Single-threaded builds are the default. Threaded builds need cross-origin isolation headers and HTTPS.
    sources:
      - "https://godotengine.org/"
      - "https://godotengine.org/license/"
      - "https://docs.godotengine.org/en/stable/about/introduction.html"
      - "https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_basics.html"
      - "https://docs.godotengine.org/en/stable/engine_details/file_formats/tscn.html"
      - "https://docs.godotengine.org/en/stable/tutorials/export/exporting_for_web.html"
      - "https://github.com/hi-godot/godot-ai"
  - slug: unity
    name: Unity
    url: "https://unity.com/"
    intro: |-
      Unity is a 2D and 3D game engine and editor from Unity Technologies, with builds for more than 25 platforms, the web among them. Game logic is written in C#. As of September 2026, Unity Personal is free for individuals and small organizations with under $200K in revenue and funds raised in the last 12 months.

      An agent can write the C# scripts as text, and Unity can also save scenes in a YAML format that tools can generate and parse. Unity's own MCP server, part of its AI tools beta, lets Claude Code, Codex, Cursor and other agents inspect scenes, read the console and trigger editor actions. It needs Unity 6, a project linked to Unity Cloud, and a Unity AI trial or plan.

      Web builds use WebAssembly with WebGL or WebGPU. The server has to send Content-Encoding headers for gzip or Brotli files, or the build embeds a decompression fallback with a bigger, less efficient loader.
    sources:
      - "https://unity.com/products/unity-engine"
      - "https://unity.com/products/unity-personal"
      - "https://docs.unity3d.com/Manual/scripting.html"
      - "https://docs.unity3d.com/Manual/TextSceneFormat.html"
      - "https://unity.com/products/ai"
      - "https://unity.com/blog/unity-ai-mcp-how-to-get-started"
      - "https://docs.unity3d.com/Manual/webgl-intro.html"
      - "https://docs.unity3d.com/Manual/WebGPU.html"
      - "https://docs.unity3d.com/Manual/webgl-deploying.html"
  - slug: unreal
    name: Unreal Engine
    maker: Epic Games
    url: "https://www.unrealengine.com/"
    intro: |-
      Unreal Engine is a 3D game engine made by Epic Games. Gameplay is written in C++ or in Blueprints, a node-based visual scripting system used inside the Unreal Editor. As of September 2026, Unreal is free for games until a product earns $1 million in lifetime gross revenue. After that Epic takes a 5 percent royalty, and Epic Games Store sales are royalty-free.

      C++ is the plain-text route for an agent, while Blueprints are node graphs edited in the editor. Unreal Engine 5.8 adds an experimental MCP plugin that lets agentic AI systems connect to the Unreal Editor, understand the engine and the project, and help build assets or systems.

      The web isn't among Unreal's packaging targets. Pixel Streaming instead runs the game on a cloud server and streams frames and audio to browsers over WebRTC.
    sources:
      - "https://www.unrealengine.com/"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprints-visual-scripting-in-unreal-engine"
      - "https://www.unrealengine.com/license"
      - "https://dev.epicgames.com/documentation/unreal-engine/unreal-engine-5-8-release-notes"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sharing-and-releasing-projects-for-unreal-engine"
  - slug: gamemaker
    name: GameMaker
    url: "https://gamemaker.io/"
    intro: |-
      GameMaker is a 2D game engine and editor that is part of Opera. Games are written in GML, as code or as GML Visual blocks, and one project can export to Windows, Mac, Linux, Android, iOS, HTML5, Xbox Series X|S, PlayStation 5 and Nintendo Switch.

      GML code is text, so an agent can write game scripts directly, while rooms and objects are laid out in the editor. Community MCP servers such as GameMaker MCP Server go further: from Cursor, an agent can create projects, add GML scripts, define objects with events and import sprites.

      As of September 2026, the free license covers non-commercial use with web, desktop and mobile exports. Commercial releases need the one-time $99.99 Professional license, and consoles need an Enterprise subscription.
    sources:
      - "https://gamemaker.io/en"
      - "https://gamemaker.io/en/get"
      - "https://gamemaker.io/en/about"
      - "https://github.com/darkw3bb/GameMaker-MCP-Server"
  - slug: defold
    name: Defold
    url: "https://defold.com/"
    intro: |-
      Defold is a free game engine and editor for 2D and 3D games, run by the Defold Foundation. Its source is on GitHub under the Defold License 1.0, which allows free use and changes but bars selling the engine itself as a game engine product, and there are no fees or royalties. Game logic is written in Lua.

      Defold's manual says its projects work well with Claude Code, Codex, Cursor or any other agent. Resource files are text, the editor exposes an HTTP API with an OpenAPI spec for builds, console output and previews, and the docs come as llms.txt files. Those open interfaces stand in for an official MCP server, and MCP wrappers are left to the community.

      HTML5 builds compile to WebAssembly with WebGL 2 by default. They need an HTTP server that sends .wasm files as application/wasm, and threaded builds also need cross-origin isolation headers over HTTPS.
    sources:
      - "https://defold.com/"
      - "https://defold.com/about/"
      - "https://defold.com/manuals/ai-agents"
      - "https://defold.com/manuals/html5/"
      - "https://github.com/defold/defold/blob/dev/LICENSE.txt"
  - slug: bevy
    name: Bevy
    url: "https://bevy.org/"
    intro: |-
      Bevy is a free, open-source game engine written in Rust, dual-licensed under MIT or Apache 2.0 with no license fees or sales cuts. All engine and game logic runs on Bevy ECS, its entity component system. It has 2D and 3D renderers and runs on Windows, macOS, Linux, the web, iOS and Android.

      Bevy games are Rust programs, so an agent writing Bevy code is writing Rust. The README says the engine is still early in development and ships breaking changes about every three months, each with a migration guide, so code has to match the project's Bevy version.

      The community bevy_brp_mcp server uses the Bevy Remote Protocol to let agents such as Claude Code launch an app, inspect and change entities live, take screenshots and send input. On the web, Bevy renders through WebGL2 or WebGPU.
    sources:
      - "https://bevy.org/"
      - "https://github.com/bevyengine/bevy"
      - "https://github.com/natepiano/bevy_brp"
  - slug: love2d
    name: LÖVE
    url: "https://love2d.org/"
    intro: |-
      LÖVE is a free, open-source framework for making 2D games in Lua, released under the zlib/libpng license. It supports Windows, macOS, Linux, Android and iOS, and the current version is 11.5.

      LÖVE is a framework rather than an editor, so a LÖVE game is Lua code that the framework runs, with no scene files or visual tools in between. The whole game is plain text an agent can write and edit.

      The web is not among the platforms on the official site, so a LÖVE game normally reaches players as a desktop or mobile download rather than a browser link.
    sources:
      - "https://love2d.org/"
      - "https://github.com/love2d/love"
  - slug: monogame
    name: MonoGame
    url: "https://monogame.net/"
    intro: |-
      MonoGame is a free, open-source C# framework for cross-platform games and a re-implementation of Microsoft's discontinued XNA Framework. The MonoGame Foundation, a 501(c)(3) nonprofit, owns and develops it, with no subscriptions, royalties, licensing costs or runtime fees. The license is the Microsoft Public License, with a few exceptions.

      Games are C# projects written in Visual Studio, VS Code or Rider, with no scene editor, so an agent works directly in the code and the .NET toolchain. MonoGame targets Windows, macOS, Linux, Android, iOS and iPadOS, plus PlayStation, Xbox and Nintendo Switch for registered developers. The web is not among the platforms MonoGame lists.
    sources:
      - "https://monogame.net/"
      - "https://github.com/MonoGame/MonoGame"
  - slug: cocos
    name: Cocos Creator
    url: "https://www.cocos.com/en/creator"
    intro: |-
      Cocos Creator is a free 2D and 3D game engine and editor from Cocos. The engine's source is on GitHub under the MIT license, with copyright held by Xiamen Yaji Software. Its README says the engine is a runtime meant to be used inside Cocos Creator, not on its own.

      Game scripts are TypeScript, so an agent can write them as plain text, while scenes and prefabs are assembled in the editor. Community MCP plugins such as Cocos MCP Server let Claude, Cursor and other clients control the Cocos Creator 3.8 editor, from scenes and nodes to prefabs and assets.

      Cocos Creator publishes to Web Mobile and Web Desktop, rendering with WebGL, WebGL2 or WebGPU. It also targets Windows, Mac, iOS, Android and HarmonyOS, plus WeChat and Douyin mini games and Facebook Instant Games.
    sources:
      - "https://www.cocos.com/en/creator"
      - "https://github.com/cocos/cocos-engine"
      - "https://docs.cocos.com/creator/3.8/manual/en/editor/publish/"
      - "https://github.com/caravanglory/cocos-mcp-server"
  - slug: construct
    name: Construct 3
    url: "https://www.construct.net/"
    intro: |-
      Construct 3 is a 2D game engine from Scirra whose editor runs in the browser. Games are built with a drag-and-drop interface and an event system, and Construct also accepts JavaScript or TypeScript, either in place of events or in separate script files.

      For an AI-assisted project, script files are the text-code path an agent can write, while layouts and event sheets live in the editor. As of September 2026, the free edition includes web publishing and Construct Arcade hosting but limits a project to 50 events, 2 layers and 2 effects. Paid plans, starting at $9.99 a month for a personal license, add desktop, Android and iOS export, Facebook Instant Games and playable ads.
    sources:
      - "https://editor.construct.net/"
      - "https://www.construct.net/en/make-games/buy-construct"
      - "https://www.construct.net/en/make-games/manuals/construct-3/scripting/overview"
  - slug: gdevelop
    name: GDevelop
    url: "https://gdevelop.io/"
    intro: |-
      GDevelop is a free, open-source, no-code game engine for 2D, 3D and multiplayer games. Its README says the core library, game engines, editor and extensions are MIT licensed, and that the GDevelop name and logo belong to Florian Rival.

      Game logic is built with events, and extensions can be made with no code or with code. GDevelop also has its own AI agent: in the Ask AI panel, Build for me plans the changes, adds or edits objects, writes the events and adjusts behaviors in your project. It runs on monthly AI credits, and paid plans get more than free ones.

      Games export as HTML5 for the web, where the engine renders with PixiJS and Three.js. They also export to Android, iOS, Steam and desktop, and GDevelop has built-in multiplayer lobbies, leaderboards and player accounts.
    sources:
      - "https://gdevelop.io/"
      - "https://github.com/4ian/GDevelop"
      - "https://gdevelop.io/blog/make-games-with-ai-agent-gdevelop-automated-prompt"
  - slug: roblox
    name: Roblox Studio
    maker: Roblox
    url: "https://create.roblox.com/"
    intro: |-
      Roblox Studio is Roblox's free tool for building and publishing experiences on the Roblox platform, where players reach them on consoles, desktops and mobile devices. Scripts are written in Luau, a gradually typed language derived from Lua 5.1.

      Studio has two AI routes. The built-in Roblox Assistant answers questions, creates and edits objects and scripts, inserts Creator Store assets, and generates materials and 3D meshes, with a Planning Mode that previews its steps. Studio also includes an MCP server, so Claude Code, Cursor, Codex CLI, Antigravity and other clients can explore the game, write scripts, run Luau, simulate player input, playtest and capture screenshots.

      Experiences are published to Roblox and played there, not exported as standalone web games.
    sources:
      - "https://create.roblox.com/docs/studio"
      - "https://create.roblox.com/docs/luau"
      - "https://create.roblox.com/docs/assistant/guide"
      - "https://create.roblox.com/docs/studio/mcp"
  - slug: pygame
    name: Pygame
    url: "https://www.pygame.org/docs/"
    intro: |-
      Pygame is a free, open-source Python library for games and other multimedia programs, built on SDL and released under the LGPL 2.1 license. You can use it in any project, but changes to pygame itself must be released under a compatible license.

      A pygame game is a Python program that runs its own game loop, with modules for graphics, sound, input and sprites. There is no editor, so the whole game is Python an agent can write and run.

      Pygame itself runs as desktop Python. A separate community tool, pygbag, packages pygame games for the browser through WebAssembly, for hosts such as itch.io. The main script must be named main.py, its loop must call asyncio.sleep(0) every frame, audio must be OGG, and file names are case-sensitive.
    sources:
      - "https://www.pygame.org/docs/"
      - "https://github.com/pygame/pygame"
      - "https://pygame-web.github.io/"
  - slug: raylib
    name: raylib
    url: "https://www.raylib.com/"
    intro: |-
      raylib is a simple, open-source library for game programming, created by Ramon Santamaria (raysan5) and released under the zlib/libpng license. It is written in plain C (C99) with no external dependencies and draws with hardware-accelerated OpenGL, from 1.1 up to 4.3 and ES 3.0, with a software renderer as an option.

      The site says raylib has no visual helpers, GUI tools or editors, just code, and it teaches through a cheatsheet and a large set of examples. A raylib project is source code an agent can write from start to finish, in C or through one of more than 60 language bindings.

      It runs on Windows, Linux, macOS, FreeBSD, Raspberry Pi, Android and the web through WebAssembly.
    sources:
      - "https://www.raylib.com/"
      - "https://github.com/raysan5/raylib"
  - slug: pico-8
    name: PICO-8
    maker: Lexaloffle
    url: "https://www.lexaloffle.com/pico-8.php"
    intro: |-
      PICO-8 is a fantasy console from Lexaloffle for making, sharing and playing tiny games. Its limits are deliberate: a 128x128 display with 16 colors, 32k cartridges saved as PNG images, 256 sprites of 8x8 pixels, four sound channels and 8,192 tokens of code.

      Games are written in PICO-8's Lua, based on Lua 5.2 without the standard library, and made in its built-in code, sprite, map and sound editors. The token cap means an AI-written PICO-8 game has to fit all its logic in 8,192 tokens, and code written for standard Lua may call library functions PICO-8 doesn't have.

      The EXPORT command writes an HTML file and a JavaScript file for the web, and standalone Windows, Mac and Linux apps are also possible. PICO-8 costs $14.99 as of September 2026.
    sources:
      - "https://www.lexaloffle.com/pico-8.php"
      - "https://www.lexaloffle.com/dl/docs/pico-8_manual.html"
  - slug: tic-80
    name: TIC-80
    url: "https://tic80.com/"
    intro: |-
      TIC-80 is a free, open-source fantasy computer for making, playing and sharing tiny games, created by Nesbox and released under the MIT license. Its limits are a 240x136 display, a 16-color palette, 256 sprites of 8x8 pixels and 4-channel sound.

      It includes code, sprite, map, sound and music editors. Games can be written in Lua, Moonscript, JavaScript, Ruby, Wren, Fennel, Squirrel, Janet or Python, so an AI can write a cartridge's code in any of them. The PRO version saves cartridges in a text format, which puts the whole cart in plain text, adds memory banks and exports games without the editors.

      Cartridges can be played on the tic80.com website or packed into a player for the popular platforms.
    sources:
      - "https://tic80.com/"
      - "https://github.com/nesbox/TIC-80"
  - slug: rpg-maker
    name: RPG Maker
    url: "https://www.rpgmakerweb.com/"
    intro: |-
      RPG Maker is a series of tools for making role-playing games, from Gotcha Gotcha Games and Kadokawa. RPG Maker MZ is the latest version, alongside RPG Maker MV, and games made with it, bundled assets included, can be released as freeware or commercial titles with no extra license.

      Maps, the database and events are built in the editor's visual tools. Plugins are JavaScript files dropped into the project's plugin folder, and they can control all parts of the game, from battles to menus. That makes plugins the text-code path an agent can write.

      MV exports to Windows, Mac, Android, iOS and HTML5. For MZ, the help says a game runs in a browser once the exported project folder is uploaded to a web server, in browsers that support WebGL, HTML5 Canvas and the Web Audio API.
    sources:
      - "https://www.rpgmakerweb.com/"
      - "https://www.rpgmakerweb.com/products/rpg-maker-mv"
      - "https://rpgmakerofficial.com/product/MZ_help-en/01_11_03.html"
  - slug: webgpu
    name: WebGPU
    url: "https://developer.mozilla.org/en-US/docs/Web/API/WebGPU_API"
    intro: |-
      WebGPU is a browser API that lets web pages use the device's GPU for rendering and for general-purpose computation. It is the successor to WebGL, and its shaders are written in WGSL, a separate shading language. The W3C GPU for the Web Working Group develops it.

      A web.dev post from November 25, 2025 reported WebGPU support in Chrome, Edge, Firefox and Safari, with Linux, Firefox on Android and Intel Macs still in progress, so some players still lack it. The API works only in secure contexts, so a published WebGPU game has to be served over HTTPS.

      Games usually get WebGPU through an engine: Three.js, Babylon.js, PlayCanvas, PixiJS and Unity all support it, and Three.js falls back to WebGL 2 where WebGPU is missing.
    sources:
      - "https://developer.mozilla.org/en-US/docs/Web/API/WebGPU_API"
      - "https://web.dev/blog/webgpu-supported-major-browsers"
      - "https://www.w3.org/TR/webgpu/"
      - "https://threejs.org/manual/#en/webgpurenderer"
      - "https://pixijs.com/"
