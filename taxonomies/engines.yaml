  - slug: raylib
    name: raylib
    url: "https://www.raylib.com/"
    intro: |-
      There's nothing in raylib but code. The site says it has no visual helpers, GUI tools or editors, and it teaches through a cheatsheet and a large set of examples. So a raylib project is source code an agent can write from start to finish, in C or through one of more than 60 language bindings.

      It's a simple, open-source library for game programming, created by Ramon Santamaria (raysan5) and released under the zlib/libpng license. It's written in plain C (C99) with no external dependencies and draws with hardware-accelerated OpenGL, from 1.1 up to 4.3 and ES 3.0, with a software renderer as an option.

      It runs on Windows, Linux, macOS, FreeBSD, Raspberry Pi, Android and the web through WebAssembly.
    sources:
      - "https://www.raylib.com/"
      - "https://github.com/raysan5/raylib"
  - slug: pico-8
    name: PICO-8
    maker: Lexaloffle
    url: "https://www.lexaloffle.com/pico-8.php"
    intro: |-
      PICO-8 keeps games small on purpose. Lexaloffle built it as a fantasy console for making, sharing and playing tiny games, and every cartridge fits in 32k, saved as a PNG image, with sprites of 8x8 pixels.

      The limits are pretty strict. You get a 128x128 display with 16 colors, 256 sprites and four sound channels.

      Games are written in the console's own Lua, based on Lua 5.2 without the standard library, and made in its built-in code, sprite, map and sound editors. Code is capped at 8,192 tokens, so an AI-written game has to fit all its logic into that, and code written for standard Lua may call library functions the console doesn't have.

      The EXPORT command writes an HTML file and a JavaScript file for the web, and standalone Windows, Mac and Linux apps are possible too. As of September 2026, it costs $14.99.
    sources:
      - "https://www.lexaloffle.com/pico-8.php"
      - "https://www.lexaloffle.com/dl/docs/pico-8_manual.html"
  - slug: tic-80
    name: TIC-80
    url: "https://tic80.com/"
    intro: |-
      A TIC-80 cartridge's code can be Lua, Moonscript, JavaScript, Ruby, Wren, Fennel, Squirrel, Janet or Python, so an AI can write it in any of them. It's a free, open-source fantasy computer for making, playing and sharing tiny games, created by Nesbox and released under the MIT license.

      Its limits are a 240x136 display, a 16-color palette and four-channel sound. It includes code, sprite, map, sound and music editors, with room for 256 sprites of 8x8 pixels.

      The PRO version saves cartridges in a text format, which puts the whole cart in plain text, and it adds memory banks and exports games without the editors. Cartridges can be played on the tic80.com website or packed into a player for the popular platforms.
    sources:
      - "https://tic80.com/"
      - "https://github.com/nesbox/TIC-80"
  - slug: rpg-maker
    name: RPG Maker
    url: "https://www.rpgmakerweb.com/"
    intro: |-
      In RPG Maker the maps, the database and the events are built with the editor's visual tools. The code an agent can write goes into plugins, JavaScript files in the project's plugin folder that can control every part of the game, from battles to menus.

      Gotcha Gotcha Games and Kadokawa make the series, with RPG Maker MZ as the latest version alongside RPG Maker MV, and games made with it can be released as freeware or commercial titles with no extra license, bundled assets included.

      MV exports to Windows, Mac, Android, iOS and HTML5. MZ's help says a game runs in a browser once the exported project folder is uploaded to a web server, in browsers that support WebGL, HTML5 Canvas and the Web Audio API.
    sources:
      - "https://www.rpgmakerweb.com/"
      - "https://www.rpgmakerweb.com/products/rpg-maker-mv"
      - "https://rpgmakerofficial.com/product/MZ_help-en/01_11_03.html"
  - slug: webgpu
    name: WebGPU
    url: "https://developer.mozilla.org/en-US/docs/Web/API/WebGPU_API"
    intro: |-
      You'll usually meet WebGPU through an engine, since Three.js, Babylon.js, PlayCanvas, PixiJS and Unity all support it, and Three.js falls back to WebGL 2 where it's missing.

      WebGPU is the browser API that lets a web page use the device's GPU for rendering and for general-purpose computation, the successor to WebGL, with shaders in a separate shading language called WGSL. The W3C GPU for the Web Working Group develops it.

      A web.dev post from November 25, 2025 reported support in Chrome, Edge, Firefox and Safari, with Linux, Firefox on Android and Intel Macs still in progress. The API only works in secure contexts, and a published WebGPU game has to be served over HTTPS.
    sources:
      - "https://developer.mozilla.org/en-US/docs/Web/API/WebGPU_API"
      - "https://web.dev/blog/webgpu-supported-major-browsers"
      - "https://www.w3.org/TR/webgpu/"
      - "https://threejs.org/manual/#en/webgpurenderer"
      - "https://pixijs.com/"
