terms:
  - slug: threejs
    name: Three.js
    url: "https://threejs.org/"
    intro: |-
      Null Range's cockpit dogfights and the capybara courier that won Vibe Jam 2026 both run on Three.js, the MIT-licensed JavaScript library for 3D in the browser, developed on GitHub under the mrdoob account. Both Vibe Jam rulebooks let you use any engine and both recommend this one.

      Three.js has no editor, and a coding agent writes the scene, the camera and the game loop as plain code. The manual's setup is npm with Vite, or a CDN and an import map that keeps a whole game in one HTML file, served from a local web server because some features break when the page opens straight from disk.

      The current builds ship a WebGL renderer and a WebGPU one that falls back to WebGL 2 on devices without WebGPU, and old ShaderMaterial code has to be ported to TSL, the shading language of the new renderer.
    sources:
      - "https://threejs.org/"
      - "https://github.com/mrdoob/three.js"
      - "https://threejs.org/manual/#en/installation"
      - "https://threejs.org/manual/#en/webgpurenderer"
      - "https://vibejam.com/2025/"
      - "https://vibejam.com/2026/"
  - slug: babylonjs
    name: Babylon.js
    url: "https://www.babylonjs.com/"
    intro: |-
      Blind Ascent's dark tower, where you and your friends shout to light up nearby platforms for a moment, is drawn with Babylon.js.

      Microsoft maintains this open-source 3D engine for the web together with an open-source community. It's written in TypeScript under the Apache 2.0 license and renders with WebGL, WebGL 2 and WebGPU. A game made with it is JavaScript or TypeScript, installed from npm or loaded from Babylon's CDN, so an agent can write the whole scene as code.

      The Playground runs that code in the browser. Since version 9.0 came out on March 26, 2026, it handles multiple files and npm imports too, so it's a pretty quick place to try out a snippet an AI wrote.

      For visual work there's the Babylon.js Editor, a desktop app for Windows, macOS and Linux with scene editing, scripting, physics and project builds. The site also lists browser node editors for materials, geometry and particles.
    sources:
      - "https://www.babylonjs.com/"
      - "https://github.com/BabylonJS/Babylon.js"
      - "https://blogs.windows.com/windowsdeveloper/2026/03/26/announcing-babylon-js-9-0/"
      - "https://blogs.windows.com/windowsdeveloper/2026/03/30/part-2-babylon-js-9-0-tooling-updates-and-new-geospatial-features/"
  - slug: playcanvas
    name: PlayCanvas
    url: "https://playcanvas.com/"
    intro: |-
      Gaussian Splatting FPS turns a real-world 3D scan into a first-person level you can shoot your way through, and its creator wrote up how it was done on the PlayCanvas blog. The engine underneath is open source and built on WebGL2 and WebGPU, and it handles 3D Gaussian splats as well as glTF models and WebXR.

      There's also a browser-based, collaborative Editor, and the PlayCanvas site says the entire platform is open source on GitHub under the MIT license. As of September 2026, the Editor's free plan is fairly generous, with unlimited public projects, 1GB of storage and hosting, while private projects need a paid plan.

      Code-first projects install the engine from npm or use its React and web-component libraries, so an agent writes JavaScript or TypeScript against the API. Editor projects can use the official PlayCanvas Editor MCP server, which lets Claude Code, Codex, Cursor and other agents create entities and scripts, edit assets and scenes, launch the game, read console logs and take screenshots.
    sources:
      - "https://playcanvas.com/"
      - "https://github.com/playcanvas/engine"
      - "https://playcanvas.com/plans"
      - "https://github.com/playcanvas/editor-mcp-server"
  - slug: react-three-fiber
    name: React Three Fiber
    url: "https://r3f.docs.pmnd.rs/"
    intro: |-
      Ombres runs on a shared screen while up to 12 players steer giant birds from their phones, painting the desert sand in their color with the birds' shadows, and bots fill any empty seats. Brieuc Crosson drew its 3D with React Three Fiber, a React renderer for Three.js that the Poimandres (pmndrs) open-source collective maintains under the MIT license.

      JSX elements become Three.js objects, so a <mesh /> in a component creates a new THREE.Mesh, and the docs say everything that works in Three.js works here too. Companion packages cover the rest, with Drei for helpers, Rapier bindings for physics and a postprocessing package for effects.

      Versions pair with React, @react-three/fiber 9 going with React 19, and a game made this way is a React project installed from npm with a build step rather than a single HTML file.
    sources:
      - "https://r3f.docs.pmnd.rs/getting-started/introduction"
      - "https://github.com/pmndrs/react-three-fiber"
  - slug: aframe
    name: A-Frame
    url: "https://aframe.io/"
    intro: |-
      With A-Frame you build a VR or 3D scene out of HTML tags like <a-scene> and <a-box>, and it runs in desktop and mobile browsers and on headsets including Meta Quest, Apple Vision Pro, HTC Vive and Valve Index. It's an open-source web framework built on Three.js, released under the MIT license, with an entity-component architecture under the tags, and the current release is 1.8.0.

      A basic scene is one HTML file with a script tag and an <a-scene> element, with nothing to install and no build step, and an agent can write all of it as markup plus JavaScript components. The docs still recommend a local server during development, since URLs can break when a page opens from file://.
    sources:
      - "https://aframe.io/"
      - "https://aframe.io/docs/1.8.0/introduction/"
      - "https://aframe.io/docs/1.8.0/introduction/installation.html"
      - "https://github.com/aframevr/aframe"
  - slug: phaser
    name: Phaser
    url: "https://phaser.io/"
    intro: |-
      Wagon Bones swaps Balatro's playing cards for d12 dice and sends them down the Oregon Trail, and under the hood it's Phaser, a free, open-source framework for 2D games that run in desktop and mobile browsers.

      Phaser Studio releases it under the MIT license, and it renders with Canvas and WebGL. Phaser 4.0.0 came out on April 10, 2026 and rebuilt the WebGL renderer while keeping the API. Games are JavaScript or TypeScript, loaded from a CDN script tag or installed from npm, and the docs have you run a web server during development because browsers restrict pages loaded from disk.

      The repository ships a skills folder that teaches AI agents Phaser 4's APIs and patterns, and Phaser Editor v5 has a built-in MCP server for scenes, assets and tilemaps. The Phaser Game Agent, billed by build time, lets Claude Code, Codex, Cursor and other agents build a game with code, art and sound.
    sources:
      - "https://github.com/phaserjs/phaser"
      - "https://github.com/phaserjs/phaser/releases"
      - "https://docs.phaser.io/phaser/getting-started/set-up-dev-environment"
      - "https://docs.phaser.io/phaser-editor/ai/mcp-server"
      - "https://phaser.io/news/2026/04/phaser-editor-v5-release"
      - "https://phaser.io/news/2026/07/phaser-game-agent-mcp-setup"
  - slug: pixijs
    name: PixiJS
    url: "https://pixijs.com/"
    intro: |-
      In Doodle Battle you sketch something, an AI guesses what it is, and then your doodle fights the one your opponent drew, all of it drawn with PixiJS. The PixiJS docs call it a rendering engine rather than a complete game framework, and the rules, collisions and physics come from your own code or other libraries, with no scene editor.

      It's open source and free under the MIT license, version 8 renders with WebGL and WebGPU, and the team also makes companion libraries like PixiJS React, Sound, UI and Layout. npm create pixi.js@latest starts a project in JavaScript or TypeScript.

      For coding agents the team publishes official skills you install with npx skills add, plus llms.txt versions of the docs, with setup notes for Claude Code, Cursor and Codex.
    sources:
      - "https://pixijs.com/"
      - "https://github.com/pixijs/pixijs"
      - "https://pixijs.com/8.x/guides/getting-started/intro"
      - "https://pixijs.com/llms"
  - slug: kaplay
    name: KAPLAY
    url: "https://kaplayjs.com/"
    intro: |-
      KAPLAY picks up where Kaboom.js left off. In July 2024 the team wrote that Kaboom had been deprecated and that KAPLAY, its fork, carries it on with community support, as a free, open-source JavaScript and TypeScript library for 2D web games under the MIT license.

      Games are built from components, so adding an object looks like add([sprite("bean"), pos(100, 100)]), and version 3001 is the stable release while a v4000 preview is out. You can start with npx create-kaplay, install it from npm or load it from a CDN script tag and keep the whole game in one HTML file. KAPLAYGROUND, at play.kaplayjs.com, runs code in the browser for quick tests.
    sources:
      - "https://kaplayjs.com/"
      - "https://github.com/kaplayjs/kaplay"
      - "https://kaplayjs.com/blog/sok1/"
  - slug: excalibur
    name: Excalibur.js
    url: "https://excaliburjs.com/"
    intro: |-
      Excalibur.js is written in TypeScript, and the compiler can flag a wrong method call in AI-written code before you ever run the game. The 2D web engine is free, open source and still at version 0.x, and its README warns that new releases will bring breaking changes.

      The community-run project behind it has pledged that its public projects stay under the BSD 2-Clause license. You install it from npm, use a script tag or an import map from unpkg, or start from templates for Vite, Parcel, Rollup, Webpack, Electron and Capacitor. Physics, collisions and plugins for Tiled, LDtk and Aseprite files come with the engine.
    sources:
      - "https://excaliburjs.com/"
      - "https://excaliburjs.com/docs/installation/"
      - "https://github.com/excaliburjs/Excalibur"
  - slug: littlejs
    name: LittleJS
    url: "https://github.com/KilledByAPixel/LittleJS"
    intro: |-
      In Alien Escape Pinball you work the flippers, hit ramps and crack alien eggs to hold off an invasion, and the whole table runs on LittleJS, a small, open-source HTML5 engine by Frank Force (KilledByAPixel). It's released under the MIT license with no dependencies and renders with WebGL2 plus Canvas2D.

      There's arcade physics and Box2D compiled to WebAssembly, and sounds play through the ZzFX generator without any asset files. Games are JavaScript or TypeScript, from npm or a Vite template.

      Small size is a stated focus, and it really shows. The full minified build is about 100 KB gzipped, a small 2D game is about 26 KB, and a js13k branch builds to a 7 KB zip.

      The README also calls the API small and well documented so LLMs can produce high-quality results. It links LittleJS AI Tools, with templates and prompts for AI workflows, and a LittleJS GPT that builds games inside ChatGPT.
    sources:
      - "https://github.com/KilledByAPixel/LittleJS"
  - slug: p5js
    name: p5.js
    url: "https://p5js.org/"
    intro: |-
      A p5.js sketch is built around two functions, setup(), which runs once, and draw(), which runs 60 times per second until the program stops and works as a game loop. A new project has three files, index.html, style.css and sketch.js, and a small game fits in sketch.js.

      The p5.js Web Editor runs and saves sketches in the browser with nothing to set up, and the library draws 2D graphics and can render with WebGL too. Lauren Lee McCarthy started p5.js in 2013 to bring the Processing language to the web, and the free, open-source library is now sustained by the Processing Foundation under the LGPL 2.1 license.
    sources:
      - "https://p5js.org/"
      - "https://github.com/processing/p5.js"
      - "https://p5js.org/tutorials/get-started/"
  - slug: canvas
    name: HTML5 Canvas
    url: "https://developer.mozilla.org/en-US/docs/Web/API/Canvas_API"
    intro: |-
      Casadegema wakes a sleepy garden through a full year, from spring to winter, in about 10 to 15 minutes, with five hidden gems to find each season, and the whole thing is drawn on an HTML canvas. So is Rogue Memory, the AI Browser Game Jam 1 winner.

      A game can be one HTML file with a canvas element and a script that redraws the screen every frame, with nothing to install and no build step. MDN lists animation, game graphics, data visualization, photo manipulation and real-time video processing among the uses of the Canvas API, which largely focuses on 2D.

      The API only draws, and the game loop, input, collisions and sound are code you or an AI write, or they come from a library. WebGL draws hardware-accelerated 2D and 3D graphics on the same canvas element, and OffscreenCanvas works in web workers too.
    sources:
      - "https://developer.mozilla.org/en-US/docs/Web/API/Canvas_API"
  - slug: webgl
    name: WebGL
    url: "https://developer.mozilla.org/en-US/docs/Web/API/WebGL_API"
    intro: |-
      NEON VELOCITY, where you start ninth on the grid and have three laps of a twisting track to pass eight AI rivals, and Talos: A Modern Ancient Game, a trap-the-cat puzzle on a hex board, both draw with WebGL.

      WebGL is the Khronos Group's open web standard for hardware-accelerated graphics without plug-ins, rendering into an HTML canvas element in all modern browsers. The first version conforms to OpenGL ES 2.0, and WebGL 2 to OpenGL ES 3.0.

      Raw WebGL is low level and shader driven, with shaders written in GLSL, a separate language from JavaScript, and engines like Three.js, Babylon.js, PixiJS, Phaser and PlayCanvas handle that part for you. MDN describes WebGPU as its successor.
    sources:
      - "https://developer.mozilla.org/en-US/docs/Web/API/WebGL_API"
      - "https://www.khronos.org/webgl/"
      - "https://developer.mozilla.org/en-US/docs/Web/API/WebGPU_API"
  - slug: godot
    name: Godot
    url: "https://godotengine.org/"
    intro: |-
      A Low Poly Dungeon Game builds every first-person dungeon from a seed, so the same seed always gives the same layout, boss included. Its creator made it with Claude Code in Godot.

      Godot is a free, open-source engine for 2D and 3D games, released under the MIT license and supported by the nonprofit Godot Foundation, and the current stable series is 4.7. Scripts are written in GDScript, a language built for Godot with Python-style indentation, or in C#.

      Most of a project turns out to be text an agent can edit, since scripts are .gd files and scenes are .tscn files that the docs call mostly human-readable. With a community MCP server like Godot AI, Claude Code, Codex, Cursor and other agents can also work in a live editor, building scenes, editing nodes and wiring signals.

      Web export uses WebAssembly and WebGL 2 through the Compatibility renderer, but Godot 4 can't export C# projects to the web. Single-threaded builds are the default, and threaded builds need cross-origin isolation headers and HTTPS.
    sources:
      - "https://godotengine.org/"
      - "https://godotengine.org/license/"
      - "https://docs.godotengine.org/en/stable/about/introduction.html"
      - "https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_basics.html"
      - "https://docs.godotengine.org/en/stable/engine_details/file_formats/tscn.html"
      - "https://docs.godotengine.org/en/stable/tutorials/export/exporting_for_web.html"
      - "https://github.com/hi-godot/godot-ai"
  - slug: unity
    name: Unity
    url: "https://unity.com/"
    intro: |-
      Dungeon League's creator says AI wrote the code and architecture, while they handled the game design and balancing. It's made in Unity, the 2D and 3D game engine and editor from Unity Technologies, which builds for more than 25 platforms, the web among them.

      Game logic is written in C#. As of September 2026, Unity Personal is free for individuals and small organizations with under $200K in revenue and funds raised in the last 12 months.

      An agent can write the C# scripts as text, and Unity can also save scenes in a YAML format that tools can generate and parse. There's an official Unity MCP server as well, part of Unity's AI tools beta, so Claude Code, Codex, Cursor and other agents can inspect scenes, read the console and trigger editor actions.

      It takes a bit of setup, though. The server needs Unity 6, a project linked to Unity Cloud, and a Unity AI trial or plan.

      Web builds use WebAssembly with WebGL or WebGPU. The server has to send Content-Encoding headers for gzip or Brotli files, or the build embeds a decompression fallback with a bigger, less efficient loader.
    sources:
      - "https://unity.com/products/unity-engine"
      - "https://unity.com/products/unity-personal"
      - "https://docs.unity3d.com/Manual/scripting.html"
      - "https://docs.unity3d.com/Manual/TextSceneFormat.html"
      - "https://unity.com/products/ai"
      - "https://unity.com/blog/unity-ai-mcp-how-to-get-started"
      - "https://docs.unity3d.com/Manual/webgl-intro.html"
      - "https://docs.unity3d.com/Manual/WebGPU.html"
      - "https://docs.unity3d.com/Manual/webgl-deploying.html"
  - slug: unreal
    name: Unreal Engine
    maker: Epic Games
    url: "https://www.unrealengine.com/"
    intro: |-
      Unreal Engine, Epic Games' 3D engine, gives you two ways to write gameplay, and they suit an agent very differently, since C++ is plain text while Blueprints, the node-based visual scripting system, are graphs you edit inside the Unreal Editor.

      Unreal Engine 5.8 adds an experimental MCP plugin that lets agentic AI systems connect to the editor, understand the engine and the project, and help build assets or systems.

      As of September 2026, Unreal is free for games until a product earns $1 million in lifetime gross revenue, after which Epic takes a 5 percent royalty, with Epic Games Store sales royalty-free. The web isn't among Unreal's packaging targets, and Pixel Streaming instead runs the game on a cloud server and streams frames and audio to browsers over WebRTC.
    sources:
      - "https://www.unrealengine.com/"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprints-visual-scripting-in-unreal-engine"
      - "https://www.unrealengine.com/license"
      - "https://dev.epicgames.com/documentation/unreal-engine/unreal-engine-5-8-release-notes"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sharing-and-releasing-projects-for-unreal-engine"
  - slug: gamemaker
    name: GameMaker
    url: "https://gamemaker.io/"
    intro: |-
      In Paperwork in Purgatory you're a damned soul promoted to the afterlife's intake window, checking each soul's claimed sins, virtues, last rites and excuses against a database for seven days. It's built in GameMaker, the 2D engine and editor that's part of Opera, and so is Wicklight, where you play a flame hunted by shades.

      Games are written in GML, as code or as GML Visual blocks, and one project can export to Windows, Mac, Linux, Android, iOS, HTML5, Xbox Series X|S, PlayStation 5 and Nintendo Switch. An agent can write the GML scripts directly while rooms and objects get laid out in the editor, and in Cursor a community server called GameMaker MCP Server can create projects, add scripts, define objects with events and import sprites.

      As of September 2026 the free license covers non-commercial use with web, desktop and mobile exports, commercial releases need the one-time $99.99 Professional license, and consoles need an Enterprise subscription.
    sources:
      - "https://gamemaker.io/en"
      - "https://gamemaker.io/en/get"
      - "https://gamemaker.io/en/about"
      - "https://github.com/darkw3bb/GameMaker-MCP-Server"
  - slug: defold
    name: Defold
    url: "https://defold.com/"
    intro: |-
      Defold's manual says its projects work well with Claude Code, Codex, Cursor or any other agent. Resource files are text, the editor exposes an HTTP API with an OpenAPI spec for builds, console output and previews, and the docs come as llms.txt files, though there's no official MCP server.

      The Defold Foundation runs it as a free engine and editor for 2D and 3D games, with game logic in Lua, and the source is on GitHub under the Defold License 1.0. That license allows free use and changes but bars selling the engine itself as a game engine product, and there are no fees or royalties.

      HTML5 builds compile to WebAssembly with WebGL 2 by default, and they need an HTTP server that sends .wasm files as application/wasm, plus cross-origin isolation headers over HTTPS for threaded builds.
    sources:
      - "https://defold.com/"
      - "https://defold.com/about/"
      - "https://defold.com/manuals/ai-agents"
      - "https://defold.com/manuals/html5/"
      - "https://github.com/defold/defold/blob/dev/LICENSE.txt"
  - slug: bevy
    name: Bevy
    url: "https://bevy.org/"
    intro: |-
      Bevy games are Rust programs, and an agent writing one is writing Rust from top to bottom, on an engine where all engine and game logic runs through Bevy ECS, its entity component system. Bevy is free and open source, dual-licensed under MIT or Apache 2.0 with no license fees or sales cuts, and it has 2D and 3D renderers for Windows, macOS, Linux, the web, iOS and Android.

      The README says it's still early in development and ships breaking changes about every three months, each with a migration guide, and code has to match the project's Bevy version. The community bevy_brp_mcp server uses the Bevy Remote Protocol to let agents such as Claude Code launch an app, inspect and change entities live, take screenshots and send input. On the web Bevy renders through WebGL2 or WebGPU.
    sources:
      - "https://bevy.org/"
      - "https://github.com/bevyengine/bevy"
      - "https://github.com/natepiano/bevy_brp"
  - slug: love2d
    name: LÖVE
    url: "https://love2d.org/"
    intro: |-
      LÖVE games are Lua code that the framework runs, with no scene files or visual tools in between, and an agent can write and edit the whole game as plain text. The framework is free and open source, built for 2D games and released under the zlib/libpng license, and its code lives on GitHub in the love2d/love repository.

      Version 11.5 is the current release, and it runs on Windows, macOS, Linux, Android and iOS, with no web platform among those listed on the official site.
    sources:
      - "https://love2d.org/"
      - "https://github.com/love2d/love"
  - slug: monogame
    name: MonoGame
    url: "https://monogame.net/"
    intro: |-
      MonoGame keeps Microsoft's discontinued XNA Framework going by re-implementing it as a free, open-source C# framework for cross-platform games, owned and developed by the MonoGame Foundation, a 501(c)(3) nonprofit. There are no subscriptions, royalties, licensing costs or runtime fees, and the license is the Microsoft Public License, with a few exceptions.

      Games are C# projects written in Visual Studio, VS Code or Rider, with no scene editor, and an agent works directly in the code and the .NET toolchain. MonoGame targets Windows, macOS, Linux, Android, iOS and iPadOS, plus PlayStation, Xbox and Nintendo Switch for registered developers, but not the web.
    sources:
      - "https://monogame.net/"
      - "https://github.com/MonoGame/MonoGame"
  - slug: cocos
    name: Cocos Creator
    url: "https://www.cocos.com/en/creator"
    intro: |-
      In Cocos Creator an agent can write the game scripts as plain TypeScript while scenes and prefabs get assembled in the editor. A community plugin, Cocos MCP Server, lets Claude, Cursor and other clients drive the Cocos Creator 3.8 editor itself, from scenes and nodes to prefabs and assets.

      Cocos makes it as a free 2D and 3D game engine and editor, and the engine's source is on GitHub under the MIT license, with copyright held by Xiamen Yaji Software. Its README says the engine is a runtime meant for use inside Cocos Creator, not on its own.

      Games publish to Web Mobile and Web Desktop, rendering with WebGL, WebGL2 or WebGPU, and to Windows, Mac, iOS, Android and HarmonyOS, plus WeChat and Douyin mini games and Facebook Instant Games.
    sources:
      - "https://www.cocos.com/en/creator"
      - "https://github.com/cocos/cocos-engine"
      - "https://docs.cocos.com/creator/3.8/manual/en/editor/publish/"
      - "https://github.com/caravanglory/cocos-mcp-server"
  - slug: construct
    name: Construct 3
    url: "https://www.construct.net/"
    intro: |-
      Scirra built Construct 3 as a 2D game engine whose editor runs in the browser, and you make a game there with drag and drop and an event system.

      It also accepts JavaScript or TypeScript, either in place of events or in separate script files. Those script files are the part an agent can write as text, while layouts and event sheets live in the editor.

      As of September 2026, the free edition includes web publishing and Construct Arcade hosting, but it limits a project to 50 events, two layers and two effects. Paid plans start at $9.99 a month for a personal license and add desktop, Android and iOS export, Facebook Instant Games and playable ads.
    sources:
      - "https://editor.construct.net/"
      - "https://www.construct.net/en/make-games/buy-construct"
      - "https://www.construct.net/en/make-games/manuals/construct-3/scripting/overview"
  - slug: gdevelop
    name: GDevelop
    url: "https://gdevelop.io/"
    intro: |-
      GDevelop has its own AI agent built in, and if you open the Ask AI panel and pick Build for me, it plans the changes, adds or edits objects, writes the events and adjusts behaviors in your project. It runs on monthly AI credits, with more on paid plans than on free ones.

      The engine is free, open source and no-code, for 2D, 3D and multiplayer games, and its README says the core library, game engines, editor and extensions are MIT licensed. The GDevelop name and logo belong to Florian Rival, game logic is built with events, and extensions can be made with or without code.

      Games export as HTML5, where the engine renders with PixiJS and Three.js, and to Android, iOS, Steam and desktop, with multiplayer lobbies, leaderboards and player accounts built in.
    sources:
      - "https://gdevelop.io/"
      - "https://github.com/4ian/GDevelop"
      - "https://gdevelop.io/blog/make-games-with-ai-agent-gdevelop-automated-prompt"
  - slug: roblox
    name: Roblox Studio
    maker: Roblox
    url: "https://create.roblox.com/"
    intro: |-
      Building for Roblox means using Roblox Studio, Roblox's free tool for making and publishing experiences, and players reach those experiences on consoles, desktops and mobile devices. Scripts are written in Luau, a gradually typed language derived from Lua 5.1.

      Studio has two AI routes. The built-in Roblox Assistant answers questions, creates and edits objects and scripts, inserts Creator Store assets, and generates materials and 3D meshes, with a Planning Mode that previews its steps. Studio also includes an MCP server, so Claude Code, Cursor, Codex CLI, Antigravity and other clients can explore the game, write scripts, run Luau, simulate player input, playtest and capture screenshots.

      Experiences are published to Roblox and played there, not exported as standalone web games.
    sources:
      - "https://create.roblox.com/docs/studio"
      - "https://create.roblox.com/docs/luau"
      - "https://create.roblox.com/docs/assistant/guide"
      - "https://create.roblox.com/docs/studio/mcp"
  - slug: pygame
    name: Pygame
    url: "https://www.pygame.org/docs/"
    intro: |-
      With pygame your game is a Python program that runs its own game loop, using modules for graphics, sound, input and sprites, and with no editor in the way an agent can write and run the whole thing. The free, open-source library is built on SDL and released under the LGPL 2.1 license, which lets you use it in any project as long as changes to pygame itself go out under a compatible license.

      pygame runs as desktop Python, and a separate community tool, pygbag, packages games for the browser through WebAssembly for hosts like itch.io. The main script has to be named main.py, the loop must call asyncio.sleep(0) every frame, audio has to be OGG and file names are case-sensitive.
    sources:
      - "https://www.pygame.org/docs/"
      - "https://github.com/pygame/pygame"
